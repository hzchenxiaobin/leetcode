<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：辅音钉死，元音槽位重排</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 原串格子 ===== -->
  <text x="90" y="84" font-size="14" fill="#444">原串 s =</text>
  <g filter="url(#sk)" font-size="20" text-anchor="middle">
    <!-- l t c d 辅音蓝 -->
    <rect x="230" y="58" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="330" y="58" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="430" y="58" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="630" y="58" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <!-- e e o e 元音橙 -->
    <rect x="280" y="58" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="380" y="58" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="530" y="58" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="680" y="58" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <text x="255" y="89" fill="#3a5a7a">l</text>
    <text x="305" y="89" fill="#8a5a10">e</text>
    <text x="405" y="89" fill="#8a5a10">e</text>
    <text x="455" y="89" fill="#3a5a7a">t</text>
    <text x="505" y="89" fill="#3a5a7a">c</text>
    <text x="555" y="89" fill="#8a5a10">o</text>
    <text x="655" y="89" fill="#3a5a7a">d</text>
    <text x="705" y="89" fill="#8a5a10">e</text>
  </g>
  <!-- 图钉：辅音钉死 -->
  <g filter="url(#sk)">
    <circle cx="255" cy="48" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 255 53 L 255 60" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="455" cy="48" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 455 53 L 455 60" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="505" cy="48" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 505 53 L 505 60" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="655" cy="48" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 655 53 L 655 60" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="255" y="126" text-anchor="middle" font-size="11" fill="#7a7a7a">钉死 ↷ 不动</text>
  <g filter="url(#sk)" font-size="12" fill="#c98a2b" text-anchor="middle">
    <text x="305" y="126">①</text>
    <text x="405" y="126">②</text>
    <text x="555" y="126">③</text>
    <text x="705" y="126">④</text>
  </g>
  <text x="790" y="126" font-size="11" fill="#8a5a10">元音槽位（可换字符）</text>

  <!-- 分叉箭头 -->
  <path d="M 300 140 Q 250 158 240 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 640 140 Q 690 158 700 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 左框：不变量 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="176" width="370" height="140" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="200" font-size="14" font-weight="bold" fill="#2b6e9e">重排的三个不变量</text>
  <text x="80" y="226" font-size="12" fill="#444">· 辅音：字符与位置全部不动</text>
  <text x="80" y="250" font-size="12" fill="#444">· 元音槽位集合 {1, 2, 5, 7} 不变</text>
  <text x="80" y="274" font-size="12" fill="#444">· 元音多重集 {e, e, e, o} 守恒</text>
  <text x="80" y="300" font-size="11" fill="#7a7a7a">变的只有：每个槽位里填哪个元音字符</text>

  <!-- ===== 右框：一趟扫描统计 ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="176" width="370" height="140" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="520" y="200" font-size="14" font-weight="bold" fill="#2e6e2e">一趟扫描：统计两个量</text>
  <g filter="url(#sk)" font-size="12" fill="#333">
    <text x="560" y="230">字符</text>
    <text x="660" y="230">频率 freq</text>
    <text x="780" y="230">首现 first</text>
    <text x="560" y="256">e</text>
    <text x="660" y="256">3</text>
    <text x="780" y="256">1</text>
    <text x="560" y="280">o</text>
    <text x="660" y="280">1</text>
    <text x="780" y="280">5</text>
  </g>
  <path d="M 545 238 L 845 238" stroke="#4a8e4a" stroke-width="1" filter="url(#sk)"/>
  <path d="M 545 262 L 845 262" stroke="#cde5cd" stroke-width="1" filter="url(#sk)"/>

  <!-- 汇合箭头 -->
  <path d="M 245 320 Q 245 336 245 344" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 685 320 Q 685 336 685 344" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 排序条 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="348" width="810" height="118" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="372" font-size="14" font-weight="bold" fill="#7a5415">排序键只有 5 种 → 对元音字符排序，不是对下标排序</text>
  <g filter="url(#sk)" font-size="13" fill="#444">
    <text x="90" y="404">多重集 {e×3, o×1}</text>
    <text x="205" y="405" fill="#c98a2b" font-weight="bold">→ 键 (freq↓, first↑)</text>
    <text x="352" y="404">e 在 o 前</text>
    <text x="450" y="405" fill="#c98a2b" font-weight="bold">→ 分组连排</text>
  </g>
  <g filter="url(#sk)" font-size="16" text-anchor="middle">
    <rect x="560" y="388" width="40" height="34" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="602" y="388" width="40" height="34" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="644" y="388" width="40" height="34" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="686" y="388" width="40" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <text x="580" y="411" fill="#8a5a10">e</text>
    <text x="622" y="411" fill="#8a5a10">e</text>
    <text x="664" y="411" fill="#8a5a10">e</text>
    <text x="706" y="411" fill="#2e6e2e">o</text>
  </g>
  <text x="80" y="448" font-size="11" fill="#7a7a7a">同一元音的多份拷贝无差别 → 输出由「元音字符的分组顺序」唯一决定，O(5 log 5) = O(1)</text>

  <!-- 填回箭头 -->
  <path d="M 470 470 L 470 486" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="490" y="484" font-size="11" fill="#c98a2b">依序填回槽位 ①②③④</text>

  <!-- ===== 结果格子 ===== -->
  <text x="90" y="522" font-size="14" fill="#444">输出 =</text>
  <g filter="url(#sk)" font-size="20" text-anchor="middle">
    <rect x="230" y="496" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="280" y="496" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="330" y="496" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="380" y="496" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="430" y="496" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="480" y="496" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="530" y="496" width="50" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="580" y="496" width="50" height="46" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <text x="255" y="527" fill="#3a5a7a">l</text>
    <text x="305" y="527" fill="#8a5a10">e</text>
    <text x="355" y="527" fill="#8a5a10">e</text>
    <text x="405" y="527" fill="#3a5a7a">t</text>
    <text x="455" y="527" fill="#3a5a7a">c</text>
    <text x="505" y="527" fill="#8a5a10">e</text>
    <text x="555" y="527" fill="#3a5a7a">d</text>
    <text x="605" y="527" fill="#2e6e2e">o</text>
  </g>
  <text x="660" y="526" font-size="16" fill="#2e6e2e" font-weight="bold">"leetcedo" ✓</text>

  <!-- ===== 底部小结 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="566" width="810" height="54" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="590" font-size="12" fill="#444">首现位置两两不同 → 键 (freq, first) 无并列 → 分组顺序唯一 → <tspan fill="#b85450" font-weight="bold">答案唯一</tspan></text>
  <text x="80" y="608" font-size="11" fill="#7a7a7a">复杂度：一趟统计 O(n) + 5 个字符排序 O(1) + 一趟填回 O(n) = O(n)</text>
</svg>
