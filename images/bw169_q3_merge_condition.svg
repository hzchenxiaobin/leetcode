<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">缝合模型：前缀块 + 可任意取值的洞 + 后缀块</text>

  <!-- 左块 -->
  <rect x="60" y="56" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[a .. i−1]</text>
  <text x="110" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">pre[i−1] 个</text>

  <!-- 洞 -->
  <rect x="196" y="56" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i：任意 v</text>
  <text x="238" y="118" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1 个（被替换）</text>

  <!-- 右块 -->
  <rect x="316" y="56" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="366" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[i+1 .. b]</text>
  <text x="366" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">suf[i+1] 个</text>

  <path d="M462,78 L494,78" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr4)" filter="url(#rough2)"/>
  <text x="452" y="60" font-size="10" fill="#b85450" filter="url(#rough2)">只需存在</text>
  <text x="452" y="100" font-size="10" fill="#b85450" filter="url(#rough2)">这样的 v</text>

  <!-- 条件 -->
  <rect x="70" y="140" width="380" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">缝合可行 ⟺ nums[i−1] ≤ nums[i+1]（i 在两端时天然可行）</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">与 nums[i] 原来的值无关 —— 它是自由变量</text>

  <!-- 三种候选 -->
  <rect x="60" y="206" width="410" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="228" font-size="12" fill="#333" filter="url(#rough2)">① 三段全接：pre[i−1] + 1 + suf[i+1]</text>
  <text x="372" y="228" font-size="11" fill="#4a7a3a" filter="url(#rough2)">需 i 不在两端</text>

  <rect x="60" y="250" width="410" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="272" font-size="12" fill="#333" filter="url(#rough2)">② 只接左边：pre[i−1] + 1</text>
  <text x="372" y="272" font-size="11" fill="#446688" filter="url(#rough2)">v 取 nums[i−1]</text>

  <rect x="60" y="294" width="410" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="316" font-size="12" fill="#333" filter="url(#rough2)">③ 只接右边：1 + suf[i+1]</text>
  <text x="372" y="316" font-size="11" fill="#d6a040" filter="url(#rough2)">v 取 nums[i+1]</text>
</svg>
