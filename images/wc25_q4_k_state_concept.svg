<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">核心观察：区间右端还要记牢 k 个同色盒子</text>
  <text x="330" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">以 boxes = [1, 2, 1, 2, 1] 为例，最大积分是 11</text>

  <rect x="187" y="80" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="214" y="115" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <rect x="245" y="80" width="54" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="272" y="115" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>
  <rect x="303" y="80" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="115" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <rect x="361" y="80" width="54" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="115" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">2</text>
  <rect x="419" y="80" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="446" y="115" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>

  <text x="214" y="152" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="272" y="152" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="330" y="152" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="388" y="152" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="446" y="152" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>

  <text x="330" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">两个 2 把三个 1 隔开 → 想把 1 攒成 3 连消，必须先消掉中间的 2</text>

  <path d="M330,192 V210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="208" font-size="11" fill="#666" filter="url(#rough2)">先消两个 2（各 1 分）</text>

  <rect x="245" y="216" width="54" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="272" y="245" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="303" y="216" width="54" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="245" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="361" y="216" width="54" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="388" y="245" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="244" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ 3 × 3 = 9 分</text>

  <rect x="40" y="286" width="282" height="122" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="312" font-size="13" fill="#b85450" filter="url(#rough2)">缺少 k 维：各区间只看自己</text>
  <text x="58" y="340" font-size="12" fill="#444" filter="url(#rough2)">dp(0, 4) 看不到区间外的盒子</text>
  <text x="58" y="362" font-size="12" fill="#444" filter="url(#rough2)">三个 1 被 2 隔开，合并无望</text>
  <text x="58" y="384" font-size="12" fill="#444" filter="url(#rough2)">结果退化为 1+1+1+1+1 = 5</text>

  <rect x="340" y="286" width="282" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="358" y="312" font-size="13" fill="#4a7a3a" filter="url(#rough2)">带上 k：右端挂着 k 个同色</text>
  <text x="358" y="340" font-size="12" fill="#444" filter="url(#rough2)">dp(0, 4, 0) 拆出 dp(0, 2, 1)</text>
  <text x="358" y="362" font-size="12" fill="#444" filter="url(#rough2)">1 的个数累计为 k + 1 = 3</text>
  <text x="358" y="384" font-size="12" fill="#444" filter="url(#rough2)">得分 9 + 1 + 1 = 11（最优）</text>
</svg>
