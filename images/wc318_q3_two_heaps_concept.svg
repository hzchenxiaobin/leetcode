<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：两端候选窗口各配一个小顶堆，弹谁补谁</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- window labels -->
  <text x="178" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">前窗 candidates=4</text>
  <text x="340" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#888">中间区</text>
  <text x="502" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">后窗 candidates=4</text>

  <!-- array strip: 17,12,10,2,7,2,11,20,8 -->
  <g filter="url(#sk)">
    <rect x="102" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="156" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="210" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="264" y="60" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="318" y="60" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="372" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="426" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="480" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="534" y="60" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="124" y="81" fill="#333" filter="url(#sk)">17</text>
    <text x="178" y="81" fill="#333" filter="url(#sk)">12</text>
    <text x="232" y="81" fill="#333" filter="url(#sk)">10</text>
    <text x="286" y="81" fill="#333" filter="url(#sk)">2</text>
    <text x="340" y="81" fill="#888" filter="url(#sk)">7</text>
    <text x="394" y="81" fill="#8a5f14" filter="url(#sk)">2</text>
    <text x="448" y="81" fill="#333" filter="url(#sk)">11</text>
    <text x="502" y="81" fill="#333" filter="url(#sk)">20</text>
    <text x="556" y="81" fill="#333" filter="url(#sk)">8</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#999">
    <text x="124" y="102" filter="url(#sk)">0</text>
    <text x="178" y="102" filter="url(#sk)">1</text>
    <text x="232" y="102" filter="url(#sk)">2</text>
    <text x="286" y="102" filter="url(#sk)">3</text>
    <text x="340" y="102" filter="url(#sk)">4</text>
    <text x="394" y="102" filter="url(#sk)">5</text>
    <text x="448" y="102" filter="url(#sk)">6</text>
    <text x="502" y="102" filter="url(#sk)">7</text>
    <text x="556" y="102" filter="url(#sk)">8</text>
  </g>

  <!-- arrows windows -> heaps -->
  <path d="M 200 108 Q 150 128 150 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 480 108 Q 530 128 530 150" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- front heap box -->
  <g filter="url(#sk)"><rect x="55" y="153" width="245" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="177" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">front 小顶堆（存 (cost, idx)）</text>
  <g filter="url(#sk)"><rect x="82" y="180" width="76" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="120" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">(2, 3)</text>
  <text x="168" y="196" font-size="9.5" fill="#b03a3a">← 堆顶</text>
  <g filter="url(#sk)"><rect x="82" y="208" width="76" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="120" y="222" text-anchor="middle" font-size="10.5" fill="#555">(10, 2)</text>
  <g filter="url(#sk)"><rect x="166" y="208" width="76" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="204" y="222" text-anchor="middle" font-size="10.5" fill="#555">(12, 1)…</text>
  <text x="177" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a">只装「剩余的前 c 名」</text>

  <!-- back heap box -->
  <g filter="url(#sk)"><rect x="380" y="153" width="245" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="502" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5f14">back 小顶堆（存 (cost, idx)）</text>
  <g filter="url(#sk)"><rect x="407" y="180" width="76" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="445" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">(2, 5)</text>
  <text x="493" y="196" font-size="9.5" fill="#b03a3a">← 堆顶</text>
  <g filter="url(#sk)"><rect x="407" y="208" width="76" height="20" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="445" y="222" text-anchor="middle" font-size="10.5" fill="#555">(8, 8)</text>
  <g filter="url(#sk)"><rect x="491" y="208" width="76" height="20" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="529" y="222" text-anchor="middle" font-size="10.5" fill="#555">(11, 6)…</text>
  <text x="502" y="244" text-anchor="middle" font-size="9.5" fill="#d6a040">只装「剩余的后 c 名」</text>

  <!-- comparison ellipse -->
  <g filter="url(#sk)"><ellipse cx="340" cy="196" rx="30" ry="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="340" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94">≤ ?</text>

  <!-- round action box -->
  <g filter="url(#sk)"><rect x="55" y="266" width="570" height="58" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="70" y="287" font-size="11" font-weight="bold" fill="#8a5f14">每轮：比较两堆堆顶（元组 (代价, 下标) 字典序），弹出较小者累加代价</text>
  <text x="70" y="307" font-size="10.5" fill="#555">并列时代价相等 → 比下标 → 前窗下标必然更小 → 直接弹 front，无需任何特判</text>

  <!-- invariant box -->
  <g filter="url(#sk)"><rect x="55" y="338" width="570" height="74" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="70" y="359" font-size="11" font-weight="bold" fill="#2b5a94">不变式：front 中下标恒 &lt; back 中下标（相向初始化 + 相向补员保证）</text>
  <text x="70" y="379" font-size="10.5" font-weight="bold" fill="#2e6e2e">同侧补员：弹 front → 吞中间区左端（left++）；弹 back → 吞中间区右端（right−−）</text>
  <text x="70" y="399" font-size="10.5" fill="#555">中间区的人被吞入前永远不参与比较 —— 所以每轮只需 O(log c)，不必重扫两端窗口</text>
</svg>
