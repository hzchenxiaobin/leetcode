<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：后缀翻转 ⇔ 差分数组的单点拨动</text>
  <path d="M 170 38 Q 310 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">target ＝ "10111"，前面虚拟补 '0' 得 u ＝ "010111"</text>

  <text x="180" y="84" text-anchor="middle" font-size="10" fill="#8a6415">虚拟 u₀</text>
  <text x="232" y="84" text-anchor="middle" font-size="10" fill="#999">u₁</text>
  <text x="284" y="84" text-anchor="middle" font-size="10" fill="#999">u₂</text>
  <text x="336" y="84" text-anchor="middle" font-size="10" fill="#999">u₃</text>
  <text x="388" y="84" text-anchor="middle" font-size="10" fill="#999">u₄</text>
  <text x="440" y="84" text-anchor="middle" font-size="10" fill="#999">u₅</text>

  <g filter="url(#sk)">
    <rect x="154" y="90" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" stroke-dasharray="5 3"/>
    <rect x="206" y="90" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="258" y="90" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="310" y="90" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="362" y="90" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="414" y="90" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="180" y="112" text-anchor="middle" font-size="14" fill="#8a6415">0</text>
  <text x="232" y="112" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="284" y="112" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="336" y="112" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="388" y="112" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="440" y="112" text-anchor="middle" font-size="14" fill="#333">1</text>

  <text x="140" y="160" text-anchor="end" font-size="12" fill="#666" font-weight="bold">异或差分 d</text>

  <g filter="url(#sk)">
    <rect x="191" y="142" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="243" y="142" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="295" y="142" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="347" y="142" width="30" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" rx="4"/>
    <rect x="399" y="142" width="30" height="26" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" rx="4"/>
  </g>
  <text x="206" y="160" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">1</text>
  <text x="258" y="160" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">1</text>
  <text x="310" y="160" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">1</text>
  <text x="362" y="160" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="414" y="160" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="206" y="184" text-anchor="middle" font-size="10" fill="#999">d₁</text>
  <text x="258" y="184" text-anchor="middle" font-size="10" fill="#999">d₂</text>
  <text x="310" y="184" text-anchor="middle" font-size="10" fill="#999">d₃</text>
  <text x="362" y="184" text-anchor="middle" font-size="10" fill="#999">d₄</text>
  <text x="414" y="184" text-anchor="middle" font-size="10" fill="#999">d₅</text>

  <g filter="url(#sk)">
    <rect x="24" y="196" width="200" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="124" y="216" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">一次操作：翻转 [2, 4]</text>
  <text x="124" y="238" text-anchor="middle" font-size="12.5" fill="#8a6415">⇒ 只拨动 d₃ 这一个开关</text>
  <path d="M 226 222 Q 278 222 298 174" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="24" y="268" width="286" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="326" y="268" width="270" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="167" y="292" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">为什么只拨动一个？</text>
  <text x="167" y="314" text-anchor="middle" font-size="11.5" fill="#2e5a24">j ＞ i：c[j] 与 c[j−1] 同时取反 → ⊕ 相互抵消</text>
  <text x="167" y="334" text-anchor="middle" font-size="11.5" fill="#2e5a24">j ＝ i：只有 c[i] 取反 → d[i+1] 取反</text>
  <text x="167" y="352" text-anchor="middle" font-size="11.5" fill="#2e5a24">j ＜ i：完全不受影响</text>
  <text x="461" y="292" text-anchor="middle" font-size="13" fill="#34506e" font-weight="bold">计数下界与构造</text>
  <text x="461" y="314" text-anchor="middle" font-size="11.5" fill="#34506e">初始 s 全 0 ⇒ d 全 0</text>
  <text x="461" y="334" text-anchor="middle" font-size="11.5" fill="#34506e">每次操作恰拨一个 d ⇒ 次数 ≥ 1 的个数</text>
  <text x="461" y="352" text-anchor="middle" font-size="11.5" fill="#34506e">对每个 d ＝ 1 拨一次 ⇒ 恰好达到下界</text>

  <g filter="url(#sk)">
    <rect x="24" y="380" width="572" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="310" y="404" text-anchor="middle" font-size="13.5" fill="#8f3830" font-weight="bold">ans ＝ d 中 1 的个数 ＝ u 相邻不等对数 ＝ 3（d ＝ 1,1,1,0,0）</text>
</svg>
