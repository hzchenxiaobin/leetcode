<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：一刀的代价 a×b ＝ 这刀恰好「拆开」的数对个数</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 4：把 4 个最终的 1 编号，任意拆法下每对编号恰好被拆开一次</text>

  <!-- split tree, left -->
  <rect x="150" y="64" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="85" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <line x1="160" y1="96" x2="112" y2="146" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="184" y1="96" x2="232" y2="146" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="131" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">代价 2×2 = 4</text>

  <rect x="90" y="146" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="167" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="210" y="146" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="232" y="167" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <line x1="100" y1="178" x2="66" y2="228" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="124" y1="178" x2="146" y2="228" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220" y1="178" x2="186" y2="228" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="244" y1="178" x2="266" y2="228" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="210" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">1×1 = 1</text>
  <text x="226" y="210" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">1×1 = 1</text>

  <circle cx="66" cy="242" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">①</text>
  <circle cx="146" cy="242" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">②</text>
  <circle cx="186" cy="242" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③</text>
  <circle cx="266" cy="242" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="266" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④</text>
  <text x="166" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">叶子：4 个最终的 1（编号 ①～④）</text>

  <rect x="40" y="282" width="280" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="297" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">根部这一刀恰好拆开 4 对：</text>
  <text x="180" y="311" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(①,③) (①,④) (②,③) (②,④)</text>
  <text x="180" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">本拆法总代价 4 + 1 + 1 = 6 = C(4,2) ✓</text>

  <!-- right callouts -->
  <rect x="356" y="64" width="264" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="86" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一刀的代价 ＝ 跨组对数</text>
  <text x="488" y="106" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a·b ＝ 左组 a 个 1 × 右组 b 个 1</text>
  <text x="488" y="120" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">＝ 同时跨到两组的数对个数</text>

  <rect x="356" y="140" width="264" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每对恰好被拆开一次</text>
  <text x="488" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">组只细分、不合并：</text>
  <text x="488" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(u,v) 从同组到分居，恰跨越一刀</text>

  <rect x="356" y="216" width="264" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="488" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">总代价 ≡ C(n,2) = n(n−1)/2</text>
  <text x="488" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">「最小」是烟雾弹：</text>
  <text x="488" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">任何拆分策略的总代价都相同</text>

  <!-- potential box -->
  <rect x="60" y="344" width="520" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">势能视角（同一件事的代数包装）</text>
  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">Φ = Σ C(组大小, 2)：初始 Φ = C(4,2) = 6，终局全 1 时 Φ = 0</text>
  <text x="320" y="398" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">每拆一刀 Φ 下降 C(x,2) − C(a,2) − C(b,2) = a·b（恰为代价）⇒ 总代价 ≡ 6</text>
</svg>
