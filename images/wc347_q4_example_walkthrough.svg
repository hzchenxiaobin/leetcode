<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例 3 演算：按值升序逐批推进</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#999"
        filter="url(#rough2)">mat = [[3,1,6],[−9,5,7]]，rowBest 简记 rB，colBest 简记 cB</text>

  <!-- table header -->
  <rect x="18" y="62" width="484" height="26" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">值 v</text>
  <text x="116" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">格子 (i,j)</text>
  <text x="216" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">转移（用旧 best）</text>
  <text x="394" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">回写后的 rB / cB</text>

  <!-- rows -->
  <rect x="18" y="88" width="484" height="28" rx="0" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="107" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−9</text>
  <text x="116" y="107" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(1,0)</text>
  <text x="216" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(0, 0) = 1</text>
  <text x="394" y="107" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rB=[0,1]　cB=[1,0,0]</text>

  <rect x="18" y="116" width="484" height="28" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="135" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="116" y="135" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(0,1)</text>
  <text x="216" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(0, 0) = 1</text>
  <text x="394" y="135" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rB=[1,1]　cB=[1,1,0]</text>

  <rect x="18" y="144" width="484" height="28" rx="0" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="163" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="116" y="163" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(0,0)</text>
  <text x="216" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(rB0=1, cB0=1) = 2</text>
  <text x="394" y="163" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rB=[2,1]　cB=[2,1,0]</text>

  <rect x="18" y="172" width="484" height="28" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="116" y="191" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(1,1)</text>
  <text x="216" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(rB1=1, cB1=1) = 2</text>
  <text x="394" y="191" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rB=[2,2]　cB=[2,2,0]</text>

  <rect x="18" y="200" width="484" height="28" rx="0" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="219" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="116" y="219" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(0,2)</text>
  <text x="216" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + max(rB0=2, cB2=0) = 3</text>
  <text x="394" y="219" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rB=[3,2]　cB=[2,2,3]</text>

  <rect x="18" y="228" width="484" height="28" rx="0" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="247" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">7</text>
  <text x="116" y="247" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(1,2)</text>
  <text x="216" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1 + max(rB1=2, cB2=3) = 4 ⭐</text>
  <text x="394" y="247" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans = 4</text>

  <!-- matrix with dp values -->
  <text x="120" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最终 dp 矩阵：</text>
  <rect x="150" y="272" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="272" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="272" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="304" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="304" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="304" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="173" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="221" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="269" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="173" y="324" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="221" y="324" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="269" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- path box -->
  <rect x="312" y="272" width="196" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">路径：−9 → 3 → 6 → 7</text>
  <text x="410" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">(1,0)→(0,0)→(0,2)→(1,2)</text>
  <text x="410" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a"
        filter="url(#rough2)">同列跳 → 同行跳 → 同列跳，共 4 格</text>

  <!-- bottom note -->
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">6 这一步：cB[2] 还是 0（列 2 此前无更小格），只能接行最优 rB0=2</text>
  <text x="260" y="386" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">正是它把 cB[2] 抬到 3，7 才能接上得 4——行列汇总层层抬升</text>
</svg>
