<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">组内最优种子 = 组内最小值（c ≥ 0 只向右打）</text>

  <path d="M 60 150 L 500 150" stroke="#888" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <g><ellipse cx="110" cy="138" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
    <text x="110" y="143" fill="#1d3a17" font-weight="bold">1</text>
    <g><ellipse cx="200" cy="162" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="200" y="167">3</text>
    <g><ellipse cx="290" cy="138" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="290" y="143">5</text>
    <g><ellipse cx="380" cy="162" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="380" y="167">7</text>
    <g><ellipse cx="450" cy="138" rx="17" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="450" y="143" fill="#7a2f2b">10</text>
  </g>
  <text x="110" y="105" font-size="12" fill="#1d3a17" text-anchor="middle" filter="url(#rough2)">组内最小值 1</text>
  <path d="M 110 112 L 110 118" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 128 146 L 180 158" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrb)"/>
    <path d="M 128 146 L 270 140" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrb)"/>
    <path d="M 128 146 L 360 158" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrb)"/>
  </g>
  <text x="290" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">种子 1（mod 2 = 1）：1+2c 打到 3、5、7 —— 全组 4 个</text>

  <g filter="url(#rough2)">
    <path d="M 316 142 L 428 140" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  </g>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">若种子选 5：5+2c 打不到 1 和 3 —— 只剩 2 个</text>

  <g filter="url(#rough2)">
    <rect x="60" y="248" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="272">哈希表每键只存两样：(组大小, 组内最小值)</text>
    <text x="280" y="296">一趟遍历完成统计</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="326" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1a2b45" text-anchor="middle">
    <text x="280" y="350">最终选取：组大小最大者优先，</text>
    <text x="280" y="374">并列时比较各组的最小值，取更小</text>
  </g>
</svg>
