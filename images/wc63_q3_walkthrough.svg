  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">四角 grid[1][2]、grid[1][4]、grid[3][2]、grid[3][4] 全为 1</text>
  <rect x="40" y="296" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#2a4660" font-weight="bold" filter="url(#rough2)">对照示例 2（3×3 全 1）</text>
  <text x="260" y="329" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">三行分别贡献 +0、+1、+2，每个列对累加 3 次 ⇒ 3 对 × 3 = 9</text>
