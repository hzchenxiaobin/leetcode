<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：s = "DID" 的三层 DP</text>
  <text x="350" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">每层 dp[j] 表示该长度下末位排名 j 的方案数</text>
  <rect x="40" y="84" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="106.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">初始</text>
  <rect x="150" y="84" width="90" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="105.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">—</text>
  <rect x="240" y="84" width="210" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="106.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">dp = [1]</text>
  <rect x="450" y="84" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555.0" y="105.5" text-anchor="middle" font-size="10" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"></text>
  <rect x="40" y="134" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="156.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">i=0  'D'</text>
  <rect x="150" y="134" width="90" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="155.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">total=1</text>
  <rect x="240" y="134" width="210" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="156.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">dp = [1, 0]</text>
  <rect x="450" y="134" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555.0" y="155.5" text-anchor="middle" font-size="10" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">旧末位 ≥ 0 的只有 j=0</text>
  <rect x="40" y="184" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="206.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">i=1  'I'</text>
  <rect x="150" y="184" width="90" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="205.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">total=1</text>
  <rect x="240" y="184" width="210" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="206.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">dp = [0, 1, 1]</text>
  <rect x="450" y="184" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555.0" y="205.5" text-anchor="middle" font-size="10" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">pre = [0,1,1] ⇒ 取前缀</text>
  <rect x="40" y="234" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="256.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">i=2  'D'</text>
  <rect x="150" y="234" width="90" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="255.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">total=2</text>
  <rect x="240" y="234" width="210" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="256.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">dp = [2, 2, 1, 0]</text>
  <rect x="450" y="234" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555.0" y="255.5" text-anchor="middle" font-size="10" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">total − pre = [2,2,1,0]</text>
  <text x="350" y="300" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-style="" filter="url(#rough2)">末层求和：2 + 2 + 1 + 0 = 5  ✓（题面 5 个有效排列）</text>
</svg>
