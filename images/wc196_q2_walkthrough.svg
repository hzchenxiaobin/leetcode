<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 4, left = [4,3], right = [0,1]</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">A@0→ B@1→ C@3← D@4←，位置-时间图（时间向上）</text>

  <!-- ===== left panel: real ===== -->
  <rect x="28" y="58" width="284" height="306" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="170" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">真实：相撞掉头（折线）</text>
  <line x1="60" y1="330" x2="260" y2="330" stroke="#8a7a66" stroke-width="3" filter="url(#sk)"/>
  <line x1="60" y1="324" x2="60" y2="336" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <line x1="260" y1="324" x2="260" y2="336" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <g font-size="10" fill="#999" filter="url(#sk)">
    <text x="60" y="347" text-anchor="middle">0</text>
    <text x="110" y="347" text-anchor="middle">1</text>
    <text x="160" y="347" text-anchor="middle">2</text>
    <text x="210" y="347" text-anchor="middle">3</text>
    <text x="260" y="347" text-anchor="middle">4</text>
    <text x="48" y="334" text-anchor="end">t=0</text>
    <text x="48" y="296" text-anchor="end">t=1</text>
    <text x="48" y="258" text-anchor="end">t=2</text>
    <text x="48" y="220" text-anchor="end">t=3</text>
    <text x="48" y="182" text-anchor="end">t=4</text>
  </g>
  <!-- trajectories (real) -->
  <path d="M 60 330 L 135 273 L 60 216" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 110 330 L 160 292 L 135 273 L 160 254 L 60 178" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 210 330 L 160 292 L 185 273 L 160 254 L 260 178" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 260 330 L 185 273 L 260 216" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <!-- collision points -->
  <g fill="#2b2b2b" filter="url(#sk)">
    <circle cx="160" cy="292" r="4"/>
    <circle cx="135" cy="273" r="4"/>
    <circle cx="185" cy="273" r="4"/>
    <circle cx="160" cy="254" r="4"/>
  </g>
  <g font-size="9.5" fill="#555" filter="url(#sk)">
    <text x="170" y="297">(1, 2)</text>
    <text x="135" y="264" text-anchor="middle">(1.5, 1.5)</text>
    <text x="185" y="264" text-anchor="middle">(1.5, 2.5)</text>
    <text x="160" y="267" text-anchor="middle">(2, 2)</text>
  </g>
  <!-- start ants -->
  <g filter="url(#sk)">
    <circle cx="60" cy="330" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="110" cy="330" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="210" cy="330" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="260" cy="330" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="9" font-weight="bold" filter="url(#sk)">
    <text x="60" y="333" text-anchor="middle" fill="#3a6a2a">A</text>
    <text x="110" y="333" text-anchor="middle" fill="#8a6520">B</text>
    <text x="210" y="333" text-anchor="middle" fill="#33517a">C</text>
    <text x="260" y="333" text-anchor="middle" fill="#b85450">D</text>
  </g>
  <g font-size="10.5" font-weight="bold" filter="url(#sk)">
    <text x="68" y="212" fill="#4a7a3a">A t=3</text>
    <text x="68" y="174" fill="#d6a040">B t=4</text>
    <text x="252" y="174" text-anchor="end" fill="#446688">C t=4</text>
    <text x="252" y="212" text-anchor="end" fill="#b85450">D t=3</text>
  </g>

  <!-- ===== right panel: pass-through ===== -->
  <rect x="308" y="58" width="284" height="306" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">等价：穿过直行（直线）</text>
  <line x1="340" y1="330" x2="540" y2="330" stroke="#8a7a66" stroke-width="3" filter="url(#sk)"/>
  <line x1="340" y1="324" x2="340" y2="336" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <line x1="540" y1="324" x2="540" y2="336" stroke="#8a7a66" stroke-width="2" filter="url(#sk)"/>
  <g font-size="10" fill="#999" filter="url(#sk)">
    <text x="340" y="347" text-anchor="middle">0</text>
    <text x="390" y="347" text-anchor="middle">1</text>
    <text x="440" y="347" text-anchor="middle">2</text>
    <text x="490" y="347" text-anchor="middle">3</text>
    <text x="540" y="347" text-anchor="middle">4</text>
    <text x="328" y="334" text-anchor="end">t=0</text>
    <text x="328" y="296" text-anchor="end">t=1</text>
    <text x="328" y="258" text-anchor="end">t=2</text>
    <text x="328" y="220" text-anchor="end">t=3</text>
    <text x="328" y="182" text-anchor="end">t=4</text>
  </g>
  <!-- trajectories (pass-through) -->
  <path d="M 340 330 L 540 178" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 390 330 L 540 216" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 490 330 L 340 216" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 540 330 L 340 178" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <!-- crossing points -->
  <g fill="#2b2b2b" filter="url(#sk)">
    <circle cx="440" cy="292" r="4"/>
    <circle cx="415" cy="273" r="4"/>
    <circle cx="465" cy="273" r="4"/>
    <circle cx="440" cy="254" r="4"/>
  </g>
  <!-- start ants -->
  <g filter="url(#sk)">
    <circle cx="340" cy="330" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="390" cy="330" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="490" cy="330" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="540" cy="330" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="9" font-weight="bold" filter="url(#sk)">
    <text x="340" y="333" text-anchor="middle" fill="#3a6a2a">A</text>
    <text x="390" y="333" text-anchor="middle" fill="#8a6520">B</text>
    <text x="490" y="333" text-anchor="middle" fill="#33517a">C</text>
    <text x="540" y="333" text-anchor="middle" fill="#b85450">D</text>
  </g>
  <g font-size="10.5" font-weight="bold" filter="url(#sk)">
    <text x="532" y="174" text-anchor="end" fill="#4a7a3a">A t=4</text>
    <text x="532" y="212" text-anchor="end" fill="#d6a040">B t=3</text>
    <text x="348" y="212" fill="#446688">C t=3</text>
    <text x="348" y="174" fill="#b85450">D t=4</text>
  </g>

  <!-- banner -->
  <rect x="28" y="372" width="564" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="310" y="394" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">左图碰撞点 ≡ 右图交点：(1,2) (1.5,1.5) (1.5,2.5) (2,2) —— 时刻地点一一对应</text>
  <text x="310" y="418" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">掉落时刻多重集合都是 {3, 3, 4, 4}，变的只是哪只蚂蚁从哪端落</text>
  <text x="310" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">⇒ ans = max( max(4,3), 4 − min(0,1) ) = max(4, 4) = 4 ✓</text>
</svg>
