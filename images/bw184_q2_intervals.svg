<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">有效时间 = 区间的并集长度，与灯泡数量无关</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">示例 3：intervals = [[1,3],[2,4]] 合并为 [1,4]，长度 4</text>
  <rect x="90" y="96" width="56" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="124" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">0</text>
  <text x="118" y="156" text-anchor="middle" font-size="9" fill="#888">—</text>
  <rect x="154" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="182" y="156" text-anchor="middle" font-size="9" fill="#888">计入</text>
  <rect x="218" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="246" y="156" text-anchor="middle" font-size="9" fill="#888">计入</text>
  <rect x="282" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="310" y="156" text-anchor="middle" font-size="9" fill="#888">计入</text>
  <rect x="346" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="374" y="156" text-anchor="middle" font-size="9" fill="#888">计入</text>
  <rect x="410" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="438" y="156" text-anchor="middle" font-size="9" fill="#888">计入</text>
  <path d="M 154 84 L 474 84" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 154 84 L 154 94" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 474 84 L 474 94" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="314" y="76" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">合并后 [1, 4]，共 4 个单位时间</text>
  <rect x="40" y="190" width="230" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="218" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">按起点排序</text>
  <text x="155" y="232" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">若下一段与当前段相交则合并</text>
  <rect x="290" y="190" width="230" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="218" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">并集长度 = Σ(段长)</text>
  <text x="405" y="232" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">[0,0] 与 [2,2] 不相交 → 2 段</text>
  <rect x="40" y="268" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">总能量 = ceil(brightness / 3) × 并集长度</text>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">示例 1：ceil(5/3)=2，长度 12−6+1=7 → 14</text>
  <text x="280" y="315" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">示例 2：ceil(1/3)=1，长度 1+1=2 → 2</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">区间端点可达 1e9，只累加长度，不要按时间逐格模拟</text>
</svg>
