<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="410" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "ab#c" 与 t = "ad#c" 都退化成 "ac"</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="150" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">s = "ab#c"（从右往左）</text>
  <g filter="url(#sk2)"><rect x="30" y="94" width="44" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="52.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">i</text>
  <g filter="url(#sk2)"><rect x="74" y="94" width="54" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="101.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">s[i]</text>
  <g filter="url(#sk2)"><rect x="128" y="94" width="70" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="163.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">skipS</text>
  <g filter="url(#sk2)"><rect x="198" y="94" width="96" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="246.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">动作</text>
  <g filter="url(#sk2)"><rect x="30" y="119" width="44" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="52.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="74" y="119" width="54" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="101.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <g filter="url(#sk2)"><rect x="128" y="119" width="70" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="163.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="198" y="119" width="96" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="246.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">保留 c</text>
  <g filter="url(#sk2)"><rect x="30" y="144" width="44" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="52.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="74" y="144" width="54" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="101.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">#</text>
  <g filter="url(#sk2)"><rect x="128" y="144" width="70" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="163.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="198" y="144" width="96" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="246.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">skipS ← 1</text>
  <g filter="url(#sk2)"><rect x="30" y="169" width="44" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="52.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="74" y="169" width="54" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="101.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <g filter="url(#sk2)"><rect x="128" y="169" width="70" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="163.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">1 → 0</text>
  <g filter="url(#sk2)"><rect x="198" y="169" width="96" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="246.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">被删除</text>
  <g filter="url(#sk2)"><rect x="30" y="194" width="44" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="52.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="74" y="194" width="54" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="101.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <g filter="url(#sk2)"><rect x="128" y="194" width="70" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="163.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="198" y="194" width="96" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="246.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">保留 a</text>
  <text x="452" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">t = "ad#c"（从右往左）</text>
  <g filter="url(#sk2)"><rect x="340" y="94" width="44" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="362.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">j</text>
  <g filter="url(#sk2)"><rect x="384" y="94" width="54" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="411.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">t[j]</text>
  <g filter="url(#sk2)"><rect x="438" y="94" width="70" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="473.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">skipT</text>
  <g filter="url(#sk2)"><rect x="508" y="94" width="96" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="556.0" y="110.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">动作</text>
  <g filter="url(#sk2)"><rect x="340" y="119" width="44" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="384" y="119" width="54" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="411.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <g filter="url(#sk2)"><rect x="438" y="119" width="70" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="473.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="508" y="119" width="96" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="556.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#333">保留 c</text>
  <g filter="url(#sk2)"><rect x="340" y="144" width="44" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="384" y="144" width="54" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="411.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">#</text>
  <g filter="url(#sk2)"><rect x="438" y="144" width="70" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="473.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="508" y="144" width="96" height="25" fill="#fff8e1" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="556.0" y="160.5" text-anchor="middle" font-size="11.5" fill="#333">skipT ← 1</text>
  <g filter="url(#sk2)"><rect x="340" y="169" width="44" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="384" y="169" width="54" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="411.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">d</text>
  <g filter="url(#sk2)"><rect x="438" y="169" width="70" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="473.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">1 → 0</text>
  <g filter="url(#sk2)"><rect x="508" y="169" width="96" height="25" fill="#fce4ec" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="556.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#333">被删除</text>
  <g filter="url(#sk2)"><rect x="340" y="194" width="44" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="384" y="194" width="54" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="411.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <g filter="url(#sk2)"><rect x="438" y="194" width="70" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="473.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="508" y="194" width="96" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="556.0" y="210.5" text-anchor="middle" font-size="11.5" fill="#333">保留 a</text>
  <path d="M 150 222 L 150 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 452 222 L 452 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="70.0" y="255.0" width="520" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="280.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">逐字符比较（两侧都按逆序产出）：c == c，a == a</text>
  <text x="330" y="296.3" text-anchor="middle" font-size="12" fill="#2e5e22">两个最终文本都是 "ac" → 返回 true</text>
  <g filter="url(#sk2)"><rect x="80.0" y="350.0" width="500" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="374.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">注意：'#' 自己占一个字符，但不进入最终文本</text>
</svg>
