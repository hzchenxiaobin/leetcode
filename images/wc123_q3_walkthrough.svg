<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 3：startValue = 3，target = 10</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">同一条路径，正着走是「加倍 → 递减 → 加倍」，反着走是「减半 → 加一 → 减半」</text>

  <text x="24" y="76" font-size="11.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">正向（答案路径）</text>
  <circle cx="70" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="190" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="310" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="430" cy="112" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>

  <path d="M 96 112 L 164 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="102" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">×2</text>
  <path d="M 216 112 L 284 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="102" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">−1</text>
  <path d="M 336 112 L 404 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="102" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">×2</text>

  <text x="24" y="176" font-size="11.5" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">逆向（贪心实际执行的方向）</text>
  <circle cx="430" cy="212" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="218" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <circle cx="310" cy="212" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="218" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="190" cy="212" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="218" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="70" cy="212" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="218" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 404 212 L 336 212" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="202" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">10 偶 → /2</text>
  <path d="M 284 212 L 216 212" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="202" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">5 奇 → +1</text>
  <path d="M 164 212 L 96 212" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="202" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">6 偶 → /2</text>

  <rect x="24" y="252" width="512" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="272" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">三次逆向操作后停在 3，恰好等于 startValue，无需再补递减，答案 3。</text>
  <text x="36" y="289" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">注意逆向里「5 是奇数只能 +1」，而正向对应的正是最后那步 −1 —— 方向反了，操作也要反。</text>
</svg>
