<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">dp[i][j] 的反对角递推与虚拟行列</text>

  <!-- 列头 t 字符 -->
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" text-anchor="middle">
    <text x="117" y="46">e</text>
    <text x="153" y="46">c</text>
    <text x="189" y="46">d</text>
    <text x="225" y="46">b</text>
    <text x="261" y="46">a</text>
    <text x="137" y="30" font-size="11">t（j →）</text>
  </g>
  <!-- 行头 s 字符 -->
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="20" y="80">a</text>
    <text x="20" y="113">b</text>
    <text x="20" y="146">c</text>
    <text x="20" y="179">d</text>
    <text x="20" y="212">e</text>
    <text x="20" y="52" font-size="11" fill="#446688">s（i ↓）</text>
  </g>

  <!-- 主区 5x5 格子: col j x=96+j*36, row i y=60+i*33 -->
  <g filter="url(#rough2)">
    <rect x="96" y="60" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="132" y="60" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="168" y="60" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="204" y="60" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="60" width="34" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="257" y="80" text-anchor="middle" font-size="10" fill="#446688">a=a</text>

    <rect x="96" y="93" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="132" y="93" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="168" y="93" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="204" y="93" width="34" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="240" y="93" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="221" y="113" text-anchor="middle" font-size="10" fill="#446688">b=b</text>

    <rect x="96" y="126" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="132" y="126" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="168" y="126" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="204" y="126" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="126" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="185" y="146" text-anchor="middle" font-size="10" fill="#999">c≠d</text>

    <rect x="96" y="159" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="132" y="159" width="34" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="168" y="159" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="204" y="159" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="159" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="149" y="179" text-anchor="middle" font-size="10" fill="#446688">c=c</text>

    <rect x="96" y="192" width="34" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="132" y="192" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="168" y="192" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="204" y="192" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="240" y="192" width="34" height="31" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="113" y="212" text-anchor="middle" font-size="10" fill="#446688">e=e</text>
  </g>

  <!-- 虚拟列 j = -1 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#777">
    <rect x="56" y="60" width="34" height="31" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="56" y="93" width="34" height="31" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="56" y="126" width="34" height="31" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="56" y="159" width="34" height="31" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="56" y="192" width="34" height="31" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <text x="73" y="80">p[0]</text>
    <text x="73" y="113">p[1]</text>
    <text x="73" y="146">p[2]</text>
    <text x="73" y="179">p[3]</text>
    <text x="73" y="212">p[4]</text>
    <text x="73" y="52" font-size="10" fill="#777">j=−1</text>
  </g>

  <!-- 虚拟行 i = m -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#777">
    <rect x="56" y="225" width="34" height="28" fill="#ddd" stroke="#888" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="96" y="225" width="34" height="28" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="132" y="225" width="34" height="28" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="168" y="225" width="34" height="28" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="204" y="225" width="34" height="28" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="240" y="225" width="34" height="28" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <text x="73" y="243">0</text>
    <text x="113" y="243">q[0]</text>
    <text x="149" y="243">q[1]</text>
    <text x="185" y="243">q[2]</text>
    <text x="221" y="243">q[3]</text>
    <text x="257" y="243">q[4]</text>
    <text x="257" y="262" font-size="10" fill="#777">i = m（虚拟行）</text>
  </g>

  <!-- 递推链箭头 (0,4)->(1,3)->(2,2) -->
  <g filter="url(#rough2)">
    <path d="M248,94 L224,118" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <path d="M212,127 L193,140" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <path d="M108,224 L76,240" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)"/>
  </g>

  <text x="30" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">(2,2) 停：结算 max(p[2], q[2])</text>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="320" y="56" width="222" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="431" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">dp[i][j] = max( p[i], q[j],</text>
    <text x="431" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2 + dp[i+1][j−1] )</text>
    <text x="431" y="128" text-anchor="middle" font-size="11" fill="#b85450">第三项（剥皮）要求 s[i] = t[j]</text>
    <text x="431" y="148" text-anchor="middle" font-size="11" fill="#666">p[i]、q[j]：就地停手，单串做核</text>
    <text x="431" y="166" text-anchor="middle" font-size="11" fill="#666">转移方向：i 增、j 减（反对角 ↘）</text>
  </g>

  <!-- 哨兵框 -->
  <g filter="url(#rough2)">
    <rect x="320" y="192" width="222" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="431" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">虚拟行列（哨兵值有语义）</text>
    <text x="431" y="238" text-anchor="middle" font-size="12" fill="#333">dp[m][j] = q[j]（A' 被迫空）</text>
    <text x="431" y="258" text-anchor="middle" font-size="12" fill="#333">dp[i][−1] = p[i]（B' 被迫空）</text>
    <text x="431" y="278" text-anchor="middle" font-size="12" fill="#333">dp[m][−1] = 0（两侧全空）</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="20" y="308" width="522" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="281" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">循环顺序：外层 i 从 m−1 倒序，内层 j 从 0 正序</text>
    <text x="281" y="358" text-anchor="middle" font-size="12" fill="#333">保证依赖的 (i+1, j−1) 已算好；非匹配格也结算 max(p[i], q[j])</text>
    <text x="281" y="376" text-anchor="middle" font-size="12" fill="#666">纯单串回文（如示例 3 的 “aaaa”）正是从这里胜出</text>
  </g>
</svg>
