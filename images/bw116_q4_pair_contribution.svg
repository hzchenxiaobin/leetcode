<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="69"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贡献法视角：d² = 有序对计数，每个有序对 (p, q) 是一段子数组集合的「一票」</text>

  <!-- 上：一个值的出现位置 -->
  <g filter="url(#rough2)">
    <text x="70" y="56" font-size="12.5" fill="#446688">值 x 的出现位置 p₁ &lt; p₂ &lt; …（以 prev[q] 记 q 的前一次出现）</text>

    <rect x="70" y="70" width="36" height="30" rx="4" fill="#ffffff" stroke="#bbb"/>
    <rect x="106" y="70" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="124" y="90" text-anchor="middle" font-size="12" fill="#333">p₁</text>
    <rect x="142" y="70" width="36" height="30" rx="4" fill="#ffffff" stroke="#bbb"/>
    <rect x="178" y="70" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="196" y="90" text-anchor="middle" font-size="12" fill="#333">p₂</text>
    <rect x="214" y="70" width="36" height="30" rx="4" fill="#ffffff" stroke="#bbb"/>
    <rect x="250" y="70" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="268" y="90" text-anchor="middle" font-size="12" fill="#333">q</text>
    <rect x="286" y="70" width="36" height="30" rx="4" fill="#ffffff" stroke="#bbb"/>

    <text x="70" y="126" font-size="12" fill="#555">有序对 (p, q) 被子数组 [l, r] 计数 ⇔ l ≤ p &lt; q ≤ r 且 l &gt; prev[q]</text>
    <text x="70" y="148" font-size="12" fill="#555">l 取 (max(prev[p], prev[q]), p]，r 取 [q, n−1]</text>
    <text x="70" y="170" font-size="12" fill="#b85450">→ 贡献 (p − max(prev[p], prev[q])) × (n − q)，p = q 时同理</text>
  </g>

  <!-- 下：两个求和次序 -->
  <g filter="url(#rough2)">
    <rect x="40" y="192" width="220" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="150" y="216" text-anchor="middle" font-size="13" fill="#446688">按位置对求和（离线静态）</text>
    <text x="150" y="240" text-anchor="middle" font-size="12" fill="#555">Σ 位置对贡献，双重循环 O(n²)</text>
    <text x="150" y="256" text-anchor="middle" font-size="12" fill="#888">适合验证 / 理解公式</text>

    <rect x="280" y="192" width="220" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="390" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a">按右端递推（在线增量）</text>
    <text x="390" y="240" text-anchor="middle" font-size="12" fill="#555">S += 2T + (i − j)，BIT 区间和</text>
    <text x="390" y="256" text-anchor="middle" font-size="12" fill="#888">O(n log n)，本题正解</text>

    <path d="M 150 262 C 150 282, 390 282, 390 262" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="270" y="296" text-anchor="middle" font-size="11.5" fill="#888">两种求和次序数同一批有序对</text>

    <rect x="40" y="308" width="460" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" fill-opacity="0.55"/>
    <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#555">平方和的关键一步：d² = |{(p, q) 有序对}|，把「平方」拆成「数对」</text>
  </g>
</svg>
