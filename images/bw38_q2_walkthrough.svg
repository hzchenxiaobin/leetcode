<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：排序 x 后取相邻差</text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <line x1="50" y1="120" x2="530" y2="120" stroke="#446688" stroke-width="2.4"/>
  </g>
  <!-- 刻度点：x = 1,1,3,5,8,9 -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="2">
    <circle cx="70" cy="120" r="6"/>
    <circle cx="70" cy="96" r="6"/>
    <circle cx="220" cy="120" r="6"/>
    <circle cx="330" cy="120" r="6"/>
    <circle cx="450" cy="120" r="6"/>
    <circle cx="510" cy="120" r="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" text-anchor="middle">
    <text x="70" y="145">1</text>
    <text x="70" y="82">1（重复）</text>
    <text x="220" y="145">3</text>
    <text x="330" y="145">5</text>
    <text x="450" y="145">8</text>
    <text x="510" y="145">9</text>
  </g>

  <!-- 间隙标注 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#888" text-anchor="middle">
    <text x="145" y="108">0</text>
    <text x="275" y="108">2</text>
    <text x="390" y="108">2</text>
    <text x="486" y="94" fill="#b85450" font-weight="bold">3</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 78 128 L 208 128" stroke="#c8c8c8" stroke-width="1.4" fill="none"/>
    <path d="M 230 128 L 316 128" stroke="#c8c8c8" stroke-width="1.4" fill="none"/>
    <path d="M 340 128 L 436 128" stroke="#c8c8c8" stroke-width="1.4" fill="none"/>
    <path d="M 458 128 L 500 128" stroke="#b85450" stroke-width="2.4" fill="none"/>
  </g>
  <text x="145" y="174" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">重复 x：差 0</text>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="110" y="200" width="340" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="226" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">排序后 xs = [1,1,3,5,8,9]</text>
  <text x="280" y="250" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">相邻差 [0,2,2,3,1] → max = 3 ✓</text>

  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">边界上的点不算在区域内 → 条带必须「贴着」两个相邻的不同 x</text>
</svg>
