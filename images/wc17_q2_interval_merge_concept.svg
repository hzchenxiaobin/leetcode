<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold"
        filter="url(#rough2)">每次攻击只新增「上一次毒性覆盖不到」的那一段</text>
  <text x="310" y="52" text-anchor="middle" font-size="11.5" fill="#888"
        filter="url(#rough2)">攻击时间非递减 ⇒ 前 i−1 次攻击的最右端点就是 t[i−1] + duration − 1，只需看相邻两次</text>

  <!-- 情形 A：重叠 -->
  <text x="70" y="82" font-size="12.5" fill="#446688" font-weight="bold"
        filter="url(#rough2)">情形 A：gap &lt; duration（中毒被重置 → 两段重叠）</text>

  <rect x="170" y="94" width="70" height="76" fill="#fce4ec" opacity="0.75"
        stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="100" y="98" width="140" height="24" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="114" text-anchor="middle" font-size="10.5" fill="#3a4a66"
        filter="url(#rough2)">第 i−1 次攻击：d 秒</text>

  <rect x="170" y="138" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="154" text-anchor="middle" font-size="10.5" fill="#3a5a30"
        filter="url(#rough2)">第 i 次：d 秒</text>

  <rect x="240" y="138" width="70" height="24" fill="#b7dfc4" stroke="#4a7a3a"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="154" text-anchor="middle" font-size="10" fill="#2f5526"
        filter="url(#rough2)">新增 gap</text>

  <line x1="80" y1="178" x2="560" y2="178" stroke="#999" stroke-width="1.2"
        filter="url(#rough2)"/>
  <line x1="100" y1="173" x2="100" y2="183" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="170" y1="173" x2="170" y2="183" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="173" x2="240" y2="183" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="173" x2="310" y2="183" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="100" y="198" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i−1]</text>
  <text x="170" y="198" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i]</text>
  <text x="250" y="214" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">t[i−1]+d−1</text>
  <text x="360" y="198" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i]+d−1</text>

  <path d="M 240 228 L 310 228" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="244" text-anchor="middle" font-size="10" fill="#3a5a30"
        filter="url(#rough2)">新增秒数 = t[i] − t[i−1] = gap</text>

  <!-- 情形 B：完全分开 -->
  <text x="70" y="284" font-size="12.5" fill="#446688" font-weight="bold"
        filter="url(#rough2)">情形 B：gap ≥ duration（毒性已结束 → 两段不重叠）</text>

  <rect x="100" y="302" width="140" height="24" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="318" text-anchor="middle" font-size="10.5" fill="#3a4a66"
        filter="url(#rough2)">第 i−1 次：d 秒</text>

  <rect x="320" y="302" width="140" height="24" fill="#b7dfc4" stroke="#4a7a3a"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="318" text-anchor="middle" font-size="10.5" fill="#2f5526"
        filter="url(#rough2)">第 i 次：新增 d 秒</text>

  <text x="280" y="319" text-anchor="middle" font-size="9.5" fill="#999"
        filter="url(#rough2)">空档（未中毒）</text>

  <line x1="80" y1="340" x2="560" y2="340" stroke="#999" stroke-width="1.2"
        filter="url(#rough2)"/>
  <line x1="100" y1="335" x2="100" y2="345" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="335" x2="240" y2="345" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="335" x2="320" y2="345" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="460" y1="335" x2="460" y2="345" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="100" y="360" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i−1]</text>
  <text x="240" y="360" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i−1]+d−1</text>
  <text x="330" y="360" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i]</text>
  <text x="470" y="360" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t[i]+d−1</text>

  <!-- 公式 -->
  <rect x="60" y="374" width="500" height="46" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="11.5" fill="#8a6a20"
        filter="url(#rough2)">ans = duration + Σ min(duration, t[i] − t[i−1])，i = 1 … n−1</text>
  <text x="310" y="411" text-anchor="middle" font-size="9.5" fill="#8a6a20"
        filter="url(#rough2)">「重置」= 重叠部分只计一次；答案就是各次新增秒数之和</text>
</svg>
