<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">解锁「好墙」不省交换：交叉逆序对 = 0</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="304" y="58" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold">好墙 p=3：值 4 = p+1，pre = max(3,1,2) = 3 ✓</text>
  <g filter="url(#sk)">
    <rect x="130" y="66" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="174" y="66" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="218" y="66" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="262" y="66" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="306" y="66" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="350" y="66" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <path d="M 263 76 Q 284 74 305 76" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 263 86 Q 284 88 305 86" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="152" y="86" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="196" y="86" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="240" y="86" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="284" y="86" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">4</text>
  <text x="328" y="86" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">6</text>
  <text x="372" y="86" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <path d="M 130 104 Q 196 114 262 104" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 306 104 Q 350 114 394 104" stroke="#4a8e4a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="196" y="126" text-anchor="middle" font-size="11" fill="#2b6e9e">左段 inv = 2（3&gt;1, 3&gt;2）</text>
  <text x="350" y="126" text-anchor="middle" font-size="11" fill="#2e6e2e">右段 inv = 1（6&gt;5）</text>

  <text x="46" y="168" font-size="12" fill="#555">若花 1 次操作解锁这面墙 → 左右合并成一段：</text>
  <g filter="url(#sk)">
    <rect x="130" y="178" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="174" y="178" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="218" y="178" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="262" y="178" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="306" y="178" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="350" y="178" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="152" y="197" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="196" y="197" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="240" y="197" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="284" y="197" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="328" y="197" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">6</text>
  <text x="372" y="197" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="420" y="197" font-size="11" fill="#555">合并后 inv 仍是 2+1</text>

  <g filter="url(#sk)">
    <rect x="60" y="228" width="520" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">inv(合并) = inv(左段) + inv(右段) + 交叉逆序对 = 2 + 1 + 0</text>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#8a6415">好墙 ⇒ 墙左全体 ≤ 3 &lt; 4 ≤ 墙右全体 ⇒ 每对「左 vs 右」都不是逆序对 ⇒ 交叉 = 0</text>

  <g filter="url(#sk)">
    <rect x="60" y="300" width="252" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="186" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">解锁好墙：操作 +1，交换数不变</text>
  <text x="186" y="342" text-anchor="middle" font-size="12" fill="#b85450">净亏 1 次 → 永远不 unlock</text>
  <g filter="url(#sk)">
    <rect x="328" y="300" width="252" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="454" y="322" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">保留好墙：0 操作，交换数同样</text>
  <text x="454" y="342" text-anchor="middle" font-size="12" fill="#2e6e2e">白拿一面墙，把数组切成两段</text>

  <g filter="url(#sk)">
    <rect x="60" y="364" width="520" height="36" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.4"/>
  </g>
  <text x="320" y="387" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">于是保留全部好墙：交换总数 = Σ inv(段) = 全局 inv(nums)，一次数完即可</text>
</svg>
