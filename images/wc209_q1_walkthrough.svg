<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">演算：g(x) = f(x) − x 严格递减，看它是否取到 0</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">f(x) 不增、x 每步 +1 → g(x) 每步至少减 1；一正一反两个示例对照</text>

  <!-- 有解示例 -->
  <text x="56" y="76" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#r)">nums = [0,4,3,0,4]（n = 5）—— 有解</text>

  <g filter="url(#r)">
    <rect x="56" y="86" width="92" height="26" rx="4" fill="#f0ede6" stroke="#b3aa99" stroke-width="1.2"/>
    <rect x="156" y="86" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="228" y="86" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="300" y="86" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="372" y="86" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="444" y="86" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="102" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#r)">x</text>
  <text x="188" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">1</text>
  <text x="260" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">2</text>
  <text x="332" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">3</text>
  <text x="404" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">4</text>
  <text x="476" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">5</text>

  <g filter="url(#r)">
    <rect x="56" y="116" width="92" height="26" rx="4" fill="#f0ede6" stroke="#b3aa99" stroke-width="1.2"/>
    <rect x="156" y="116" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="228" y="116" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="300" y="116" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="372" y="116" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="444" y="116" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="102" y="133" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#r)">f(x)</text>
  <text x="188" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">3</text>
  <text x="260" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">3</text>
  <text x="332" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">3</text>
  <text x="404" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">2</text>
  <text x="476" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">0</text>

  <g filter="url(#r)">
    <rect x="56" y="146" width="92" height="26" rx="4" fill="#f0ede6" stroke="#b3aa99" stroke-width="1.2"/>
    <rect x="156" y="146" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="228" y="146" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="300" y="146" width="64" height="26" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5"/>
    <rect x="372" y="146" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="444" y="146" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="102" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#666" filter="url(#r)">g(x)=f−x</text>
  <text x="188" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">2</text>
  <text x="260" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">1</text>
  <text x="332" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#r)">0</text>
  <text x="404" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">−2</text>
  <text x="476" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">−5</text>

  <text x="56" y="192" font-size="11.5" fill="#2e6e2e" filter="url(#r)">g(3) = 0 → f(3) = 3：恰好 3 个元素 ≥ 3 → <tspan font-weight="bold">返回 3 ✓</tspan></text>

  <!-- 无解示例 -->
  <text x="56" y="222" font-size="12.5" font-weight="bold" fill="#b03a3a" filter="url(#r)">nums = [3,6,7,7,0]（n = 5）—— 无解</text>

  <g filter="url(#r)">
    <rect x="56" y="232" width="92" height="26" rx="4" fill="#f0ede6" stroke="#b3aa99" stroke-width="1.2"/>
    <rect x="156" y="232" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="228" y="232" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="300" y="232" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="372" y="232" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="444" y="232" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="102" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#r)">x</text>
  <text x="188" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">1</text>
  <text x="260" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">2</text>
  <text x="332" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">3</text>
  <text x="404" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">4</text>
  <text x="476" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">5</text>

  <g filter="url(#r)">
    <rect x="56" y="262" width="92" height="26" rx="4" fill="#f0ede6" stroke="#b3aa99" stroke-width="1.2"/>
    <rect x="156" y="262" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="228" y="262" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="300" y="262" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="372" y="262" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="444" y="262" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="102" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#r)">f(x)</text>
  <text x="188" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">4</text>
  <text x="260" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">4</text>
  <text x="332" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">4</text>
  <text x="404" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">3</text>
  <text x="476" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">3</text>

  <g filter="url(#r)">
    <rect x="56" y="292" width="92" height="26" rx="4" fill="#f0ede6" stroke="#b3aa99" stroke-width="1.2"/>
    <rect x="156" y="292" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="228" y="292" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="300" y="292" width="64" height="26" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5"/>
    <rect x="372" y="292" width="64" height="26" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5"/>
    <rect x="444" y="292" width="64" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="102" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#666" filter="url(#r)">g(x)=f−x</text>
  <text x="188" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">3</text>
  <text x="260" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">2</text>
  <text x="332" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#r)">1</text>
  <text x="404" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#r)">−1</text>
  <text x="476" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">−2</text>

  <g filter="url(#r)">
    <line x1="332" y1="336" x2="332" y2="322" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="404" y1="336" x2="404" y2="322" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="368" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#r)">从 +1 直接跳到 −1，跳过了 0</text>
  <text x="56" y="374" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#r)">g(x) 从未等于 0 → 方程 f(x) = x 无解 → 返回 −1</text>

  <!-- 结论 -->
  <g filter="url(#r)">
    <rect x="30" y="390" width="560" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="310" y="409" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">f(x) 单调不增、x 严格递增 ⟹ g(x) 严格递减 ⟹ 至多一个 x 使 g(x) = 0（特征值唯一）</text>
</svg>
