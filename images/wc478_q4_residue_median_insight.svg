<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：±k 不改变模 k 残差，代价在「中位数」处最小</text>

  <!-- Section A: feasible -->
  <text x="40" y="52" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 可行：区间内元素模 k 全同余 —— 目标取中位数 m</text>
  <text x="40" y="71" font-size="11.5" fill="#666" filter="url(#rough2)">nums = [1, 4, 7]，k = 3：残差 1, 1, 1（全等于 1）✓</text>

  <!-- number line -->
  <path d="M 90 125 L 570 125" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 566 120 L 574 125 L 566 130" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="90" y1="120" x2="90" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="120" x2="150" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="120" x2="210" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="120" x2="270" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="120" x2="330" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="120" x2="390" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="120" x2="450" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="510" y1="120" x2="510" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="570" y1="120" x2="570" y2="130" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="150" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="270" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="330" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="390" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="450" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="510" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="570" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <!-- elements -->
  <circle cx="150" cy="125" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="330" cy="125" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <circle cx="510" cy="125" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="330" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">中位数 m = 4</text>

  <!-- hops -->
  <path d="M 152 110 Q 240 86 322 108" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="237" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">+3（一步）</text>
  <path d="M 508 110 Q 420 86 338 108" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="423" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">−3（一步）</text>

  <text x="320" y="170" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">代价 = |1−4|/3 + |4−4|/3 + |7−4|/3 = 1 + 0 + 1 = 2 次 → ans = 2</text>

  <!-- Section B: infeasible -->
  <text x="40" y="205" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 不可行：存在异余元素 —— 各自的「格点轨道」永不相交</text>
  <text x="40" y="224" font-size="11.5" fill="#666" filter="url(#rough2)">nums = [1, 2, 4]，k = 2：残差 1, 0, 0 ✗</text>

  <!-- even rail -->
  <text x="88" y="272" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">偶格(余0)</text>
  <path d="M 110 268 L 335 268" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="110" cy="268" r="3" fill="#bbb" filter="url(#rough2)"/>
  <circle cx="182" cy="268" r="3" fill="#bbb" filter="url(#rough2)"/>
  <circle cx="254" cy="268" r="3" fill="#bbb" filter="url(#rough2)"/>
  <circle cx="326" cy="268" r="3" fill="#bbb" filter="url(#rough2)"/>
  <text x="110" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="182" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="254" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="326" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <circle cx="182" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="182" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="254" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- odd rail -->
  <text x="88" y="316" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">奇格(余1)</text>
  <path d="M 146 312 L 371 312" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="146" cy="312" r="3" fill="#bbb" filter="url(#rough2)"/>
  <circle cx="218" cy="312" r="3" fill="#bbb" filter="url(#rough2)"/>
  <circle cx="290" cy="312" r="3" fill="#bbb" filter="url(#rough2)"/>
  <circle cx="362" cy="312" r="3" fill="#bbb" filter="url(#rough2)"/>
  <text x="146" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="218" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="290" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="362" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <circle cx="146" cy="312" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- separator between rails -->
  <path d="M 240 282 L 240 300" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="240" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- right explanation -->
  <text x="395" y="255" font-size="11" fill="#333" filter="url(#rough2)">每次操作 ±k：元素沿自己轨道的格点跳</text>
  <text x="395" y="277" font-size="11" fill="#333" filter="url(#rough2)">残差不同 ⇒ 轨道平行，永不相交</text>
  <text x="395" y="299" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 该查询返回 −1</text>

  <!-- Section C: formula boxes -->
  <rect x="40" y="348" width="560" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = Σ|xᵢ − m| / k，其中 m = 区间第 ⌊(p+1)/2⌋ 小（下中位数）</text>
  <text x="320" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">m 是区间内某个元素的值，与所有元素同余，天然是合法目标</text>

  <rect x="40" y="410" width="560" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="431" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">可行性：前缀一减 O(1) 判定 —— d[r] == d[l]（d 统计相邻残差变化）</text>
  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">中位数与偏差和：主席树「版本差」，单次查询 O(log n)</text>
</svg>
