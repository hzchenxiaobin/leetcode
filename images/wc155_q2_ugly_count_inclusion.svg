<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">容斥原理：并集计数 = 单集合 − 两两交集 + 三集合交集</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 a = 2, b = 3, c = 5 为例：蓝 = 只属 1 个集合，橙 = 属 2 个，红 = 属 3 个</text>

  <text x="26" y="110" font-size="10.5" fill="#446688" filter="url(#rough2)">A：2 的倍数</text>
  <text x="26" y="160" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">B：3 的倍数</text>
  <text x="26" y="210" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">C：5 的倍数</text>

  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <rect x="140" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="160" y="110" fill="#3a4a66">2</text>
    <rect x="186" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="206" y="110" fill="#3a4a66">4</text>
    <rect x="232" y="90" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="252" y="110" fill="#8a6a20">6</text>
    <rect x="278" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="298" y="110" fill="#3a4a66">8</text>
    <rect x="324" y="90" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="344" y="110" fill="#8a6a20">10</text>
    <rect x="370" y="90" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="390" y="110" fill="#8a6a20">12</text>
    <rect x="416" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="436" y="110" fill="#3a4a66">14</text>
    <rect x="462" y="90" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="482" y="110" fill="#3a4a66">16</text>
  </g>

  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <rect x="140" y="140" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="160" y="160" fill="#3a4a66">3</text>
    <rect x="186" y="140" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="206" y="160" fill="#8a6a20">6</text>
    <rect x="232" y="140" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="252" y="160" fill="#3a4a66">9</text>
    <rect x="278" y="140" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="298" y="160" fill="#8a6a20">12</text>
    <rect x="324" y="140" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="344" y="160" fill="#8a6a20">15</text>
    <rect x="370" y="140" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="390" y="160" fill="#8a6a20">18</text>
    <rect x="416" y="140" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="436" y="160" fill="#3a4a66">21</text>
    <rect x="462" y="140" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="482" y="160" fill="#8a6a20">24</text>
  </g>

  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <rect x="140" y="190" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="160" y="210" fill="#3a4a66">5</text>
    <rect x="186" y="190" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="206" y="210" fill="#8a6a20">10</text>
    <rect x="232" y="190" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="252" y="210" fill="#8a6a20">15</text>
    <rect x="278" y="190" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="298" y="210" fill="#8a6a20">20</text>
    <rect x="324" y="190" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="344" y="210" fill="#3a4a66">25</text>
    <rect x="370" y="190" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="390" y="210" fill="#8a3a36">30</text>
    <rect x="416" y="190" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="436" y="210" fill="#3a4a66">35</text>
    <rect x="462" y="190" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="482" y="210" fill="#8a6a20">40</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="140" y="240" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="252" y="240" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="386" y="240" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="10" fill="#666" filter="url(#rough2)">
    <text x="160" y="252">只属 1 个 → 加 1 次</text>
    <text x="272" y="252">属 2 个 → 要减 1 次</text>
    <text x="406" y="252">属 3 个 → 加回 1 次</text>
  </g>

  <text x="290" y="276" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6 = lcm(2,3) 被加了两遍；30 = lcm(2,3,5) 先被加 3 次、减 3 次，净 0 次 → 必须补回</text>

  <rect x="36" y="286" width="508" height="122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="308" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">于是 count(x)（≤ x 的丑数个数）可以 O(1) 算出：</text>
  <g font-size="11" fill="#3a3a3a" filter="url(#rough2)">
    <text x="54" y="332">count(x) = ⌊x/a⌋ + ⌊x/b⌋ + ⌊x/c⌋</text>
    <text x="94" y="354">− ⌊x/lcm(a,b)⌋ − ⌊x/lcm(a,c)⌋ − ⌊x/lcm(b,c)⌋</text>
    <text x="94" y="376">+ ⌊x/lcm(a,b,c)⌋</text>
  </g>
  <text x="330" y="376" font-size="10" fill="#b85450" filter="url(#rough2)">交集 = lcm 的倍数，个数 = ⌊x / lcm⌋</text>
  <text x="54" y="398" font-size="10" fill="#666" filter="url(#rough2)">7 项都是整数除法，合计 O(1)：这正是能二分的根本原因。</text>
</svg>
