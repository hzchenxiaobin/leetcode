<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：赢下区域 k = 恰好花 ak+1 支箭，稳赚 k 分</text>
  <path d="M 150 44 Q 340 54 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：箭靶示意 -->
  <g filter="url(#sk)">
    <circle cx="150" cy="225" r="115" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="150" cy="225" r="92" fill="#fdfcf7" stroke="#446688" stroke-width="1.4"/>
    <circle cx="150" cy="225" r="69" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="150" cy="225" r="46" fill="#fdfcf7" stroke="#446688" stroke-width="1.4"/>
    <circle cx="150" cy="225" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">外环 k=0（0 分）</text>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">k=2</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">k=5</text>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">k=8</text>
  <text x="150" cy="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">红心 11</text>
  <text x="150" y="362" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">箭靶 12 个计分区：0 ～ 11</text>
  <text x="150" y="380" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">（示意，非等比例）</text>

  <!-- 中：胜负规则卡片 -->
  <path d="M 275 200 L 315 200" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="322" y="105" width="150" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="397" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">区域 k 的账本</text>
  <text x="397" y="155" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">bk &gt; ak → Bob 得 k 分</text>
  <text x="397" y="177" text-anchor="middle" font-size="11.5" fill="#a04038" filter="url(#sk)">最低花费：ak+1 支</text>
  <text x="397" y="199" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">多放的箭 ≠ 更多分</text>
  <text x="397" y="221" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">（ak=bk 或 ak&gt;bk：Alice 得）</text>

  <!-- 右：转化为子集选取 -->
  <path d="M 480 170 L 520 170" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="528" y="88" width="136" height="164" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="596" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">11 个「物品」</text>
  <text x="596" y="134" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">区域 k=1..11</text>
  <text x="596" y="156" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">费用 = ak+1</text>
  <text x="596" y="178" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">价值 = k</text>
  <text x="596" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">预算 = numArrows</text>
  <text x="596" y="224" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">选子集，最大化价值</text>

  <!-- 底部：两条结论 -->
  <g filter="url(#sk)">
    <rect x="60" y="292" width="270" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="195" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">赢/输只有 0-1 之分</text>
  <text x="195" y="336" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">→ 2^12 = 4096 个子集全枚举</text>
  <g filter="url(#sk)">
    <rect x="356" y="292" width="270" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="491" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475e" filter="url(#sk)">区域 0 永远 0 分</text>
  <text x="491" y="336" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">→ 剩余的箭全塞到区域 0 即可</text>

  <text x="340" y="392" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">只看「赢哪些区域」而不管「赢多少」——问题从连续分配坍缩为子集选取</text>
</svg>
