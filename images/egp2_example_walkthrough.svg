<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="410" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：值存在 ≠ 可移除（示例 3）与 端点命中（示例 2）</text>
  <path d="M 220 40 Q 470 48 720 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left panel: example 3 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="56" width="440" height="288" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="250" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">示例 3：[[1,2,4],[2,3,5]] —— false</text>
  <!-- 2x3 grid, cell 46, origin (70,98) -->
  <g filter="url(#sk2)">
    <rect x="70" y="98" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="116" y="98" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="162" y="98" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="70" y="144" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="116" y="144" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="162" y="144" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="93" y="127" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="139" y="127" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="185" y="127" text-anchor="middle" font-size="15" fill="#333">4</text>
  <text x="93" y="173" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="139" y="173" text-anchor="middle" font-size="15" fill="#333">3</text>
  <text x="185" y="173" text-anchor="middle" font-size="15" fill="#333">5</text>
  <path d="M 52 144 L 226 144" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#sk2)"/>
  <text x="248" y="118" font-size="11.5" fill="#2b4a66" font-weight="bold">上半 = 7</text>
  <text x="248" y="162" font-size="11.5" fill="#2b4a66" font-weight="bold">下半 = 10</text>
  <text x="248" y="186" font-size="11.5" fill="#b85450" font-weight="bold">v = 3，从下半移</text>
  <!-- bottom strip zoom -->
  <text x="70" y="212" font-size="11" fill="#888">下半是单行 [2, 3, 5]：</text>
  <g filter="url(#sk2)">
    <rect x="70" y="222" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="116" y="222" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="162" y="222" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="93" y="247" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="139" y="247" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">3✗</text>
  <text x="185" y="247" text-anchor="middle" font-size="15" fill="#333">5</text>
  <path d="M 122 268 l 7 9 M 146 268 l 7 9" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk2)"/>
  <text x="228" y="240" font-size="11.5" fill="#b85450">3 在单行中间</text>
  <text x="228" y="258" font-size="11.5" fill="#b85450">挖掉 → [2] 与 [5] 断开</text>
  <text x="70" y="298" font-size="11.5" fill="#444">端点 2、5 ≠ 3；垂直割同样无解（v=11 不存在，v=1 不在端点）</text>
  <text x="250" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">⇒ false：有解值 ≠ 可移除格</text>

  <!-- ===== right panel: example 2 ===== -->
  <g filter="url(#sk)">
    <rect x="490" y="56" width="420" height="288" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="700" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">示例 2：[[1,2],[3,4]] —— true</text>
  <!-- 2x2 grid, cell 50, origin (530,100) -->
  <g filter="url(#sk2)">
    <rect x="530" y="100" width="50" height="50" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="580" y="100" width="50" height="50" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="530" y="150" width="50" height="50" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="580" y="150" width="50" height="50" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <text x="555" y="131" text-anchor="middle" font-size="16" fill="#333">1</text>
  <text x="605" y="131" text-anchor="middle" font-size="16" fill="#333">2</text>
  <text x="555" y="181" text-anchor="middle" font-size="16" fill="#333">3</text>
  <text x="605" y="181" text-anchor="middle" font-size="16" fill="#333">4</text>
  <path d="M 580 84 L 580 216" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#sk2)"/>
  <text x="545" y="232" text-anchor="middle" font-size="11.5" fill="#2b4a66" font-weight="bold">左半 = 4</text>
  <text x="612" y="232" text-anchor="middle" font-size="11.5" fill="#2b4a66" font-weight="bold">右半 = 6</text>
  <text x="700" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">v = 2，从右半移；右半是单列 [2, 4]</text>
  <!-- right column zoom -->
  <g filter="url(#sk2)">
    <rect x="680" y="100" width="50" height="50" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="680" y="150" width="50" height="50" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <text x="705" y="131" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">2✓</text>
  <text x="705" y="181" text-anchor="middle" font-size="16" fill="#333">4</text>
  <text x="752" y="126" font-size="11.5" fill="#2e6e2e">2 恰在顶端端点</text>
  <text x="752" y="144" font-size="11.5" fill="#2e6e2e">→ 可移除</text>
  <path d="M 705 205 L 705 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk2)"/>
  <text x="752" y="180" font-size="11.5" fill="#444">剩 [4]，连通 ✓</text>
  <text x="700" y="298" text-anchor="middle" font-size="12" fill="#444">6 − 2 = 4 = 左半，两侧相等</text>
  <text x="700" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">⇒ true</text>

  <!-- ===== bottom banner: example 4 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="356" width="880" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="470" y="381" text-anchor="middle" font-size="12" fill="#444">示例 4 [[4,1,8],[3,2,6]]：水平割 v=2 不在单行 [4,1,8] 首尾；垂直割 v=10 不存在、v=4 不在单列 [8,6] 端点 ⇒ false</text>
</svg>
