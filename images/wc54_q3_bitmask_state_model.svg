<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：桶无序 ⇒ 状态塌缩成 mask</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 的 7 个元素按值降序排成 5, 4, 3, 3, 2, 2, 1（位序 b0…b6），k = 4，target = 5</text>
  <rect x="32" y="62" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="56" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b0</text>
  <rect x="92" y="62" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="116" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="116" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b1</text>
  <rect x="152" y="62" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="176" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="176" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b2</text>
  <rect x="212" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="236" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="236" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b3</text>
  <rect x="272" y="62" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="296" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="296" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b4</text>
  <rect x="332" y="62" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="356" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="356" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b5</text>
  <rect x="392" y="62" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="416" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="416" y="93" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">b6</text>
  <text x="32" y="118" font-size="10" fill="#888" filter="url(#rough2)">每个元素一个二进制位：mask 的 bit i = 1 表示 nums[i] 已被装入某个桶</text>
  <rect x="32" y="132" width="128" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="96" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">桶 1</text>
  <text x="96" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="96" y="196" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">装满 5 ✓</text>
  <rect x="168" y="132" width="128" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="232" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">桶 2</text>
  <text x="232" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4 + 1</text>
  <text x="232" y="196" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">装满 5 ✓</text>
  <rect x="304" y="132" width="128" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="368" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">桶 3</text>
  <text x="368" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3 + 2</text>
  <text x="368" y="196" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">装满 5 ✓</text>
  <rect x="440" y="132" width="128" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="504" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">桶 4</text>
  <text x="504" y="176" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3 + 2</text>
  <text x="504" y="196" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">装满 5 ✓</text>
  <rect x="32" y="224" width="556" height="78" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="248" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">朴素状态：(已用集合 mask, 当前桶已装 s) —— s 其实多余</text>
  <text x="48" y="271" font-size="11" fill="#33445f" filter="url(#rough2)">已装满的桶每个都恰为 target，对后续没有任何影响；当前桶未满时 s = S(mask) mod target</text>
  <text x="48" y="292" font-size="11" fill="#8a3a36" filter="url(#rough2)">⇒ 状态只剩一维：dp[mask] = 当前桶里已装的和（装满了就记 0）</text>
  <rect x="32" y="316" width="556" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="340" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">· 桶之间没有编号、没有顺序 ⇒ 规定「永远只往当前桶里放」，装满才开新桶</text>
  <text x="48" y="362" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">· 任一合法划分都能按桶逐个复现，所以这条限制不丢解（只删掉重复计数）</text>
  <text x="48" y="384" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">· 搜索空间从 kⁿ 种「元素→桶」分配缩到 2ⁿ 个 mask，n = 16 时只有 65536</text>
</svg>
