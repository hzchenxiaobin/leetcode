<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">示例演算：arr = [4,1,5,2,6,2]，k = 3 —— 模 3 分三条链，逐链求 LNIS</text>
  <path d="M 110 40 Q 340 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== arr row ===== -->
  <text x="28" y="88" font-size="12.5" fill="#444" font-weight="bold">arr</text>

  <rect x="56" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="81" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="114" y="64" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="139" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="172" y="64" width="50" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="197" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
  <rect x="230" y="64" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="255" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="288" y="64" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="313" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="346" y="64" width="50" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="371" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <text x="81" y="112" text-anchor="middle" font-size="9.5" fill="#999">i=0</text>
  <text x="139" y="112" text-anchor="middle" font-size="9.5" fill="#999">i=1</text>
  <text x="197" y="112" text-anchor="middle" font-size="9.5" fill="#999">i=2</text>
  <text x="255" y="112" text-anchor="middle" font-size="9.5" fill="#999">i=3</text>
  <text x="313" y="112" text-anchor="middle" font-size="9.5" fill="#999">i=4</text>
  <text x="371" y="112" text-anchor="middle" font-size="9.5" fill="#999">i=5</text>

  <!-- legend -->
  <rect x="446" y="64" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="466" y="76" font-size="10" fill="#555">r=0</text>
  <rect x="502" y="64" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="522" y="76" font-size="10" fill="#555">r=1</text>
  <rect x="558" y="64" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="578" y="76" font-size="10" fill="#555">r=2</text>
  <text x="614" y="76" font-size="10" fill="#888">（i mod 3）</text>

  <!-- connectors -->
  <path d="M 81 102 Q 100 126 116 134" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 255 102 Q 180 128 124 134" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 139 102 Q 235 126 328 134" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 313 102 Q 326 122 332 134" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 197 102 Q 380 126 546 134" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>
  <path d="M 371 102 Q 462 124 548 134" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ao)"/>

  <!-- ===== panel 0: chain r=0 ===== -->
  <rect x="16" y="140" width="206" height="252" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="119" y="162" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">链 r=0：下标 0, 3</text>

  <rect x="46" y="172" width="36" height="28" rx="4" fill="#fdfcf7" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="64" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <rect x="92" y="172" width="36" height="28" rx="4" fill="#fdfcf7" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="110" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="64" y="212" text-anchor="middle" font-size="8.5" fill="#8aa">i=0</text>
  <text x="110" y="212" text-anchor="middle" font-size="8.5" fill="#8aa">i=3</text>

  <text x="30" y="240" font-size="10.5" fill="#333"><tspan font-weight="bold">x=4</tspan>：空 tail → 追加，tail = [4]</text>
  <text x="30" y="268" font-size="10.5" fill="#333"><tspan font-weight="bold">x=2</tspan>：4 &gt; 2 → 替换，tail = [2]</text>

  <text x="119" y="300" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">LNIS = 1，改动 = 2 − 1 = 1</text>

  <rect x="36" y="316" width="166" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="119" y="336" text-anchor="middle" font-size="10.5" fill="#2e5e2e">改 arr[3]=4 → 链变 [4,4] ✓</text>

  <!-- ===== panel 1: chain r=1 ===== -->
  <rect x="232" y="140" width="206" height="252" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="335" y="162" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">链 r=1：下标 1, 4</text>

  <rect x="262" y="172" width="36" height="28" rx="4" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="280" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="308" y="172" width="36" height="28" rx="4" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="326" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="280" y="212" text-anchor="middle" font-size="8.5" fill="#7a9a6a">i=1</text>
  <text x="326" y="212" text-anchor="middle" font-size="8.5" fill="#7a9a6a">i=4</text>

  <text x="246" y="240" font-size="10.5" fill="#333"><tspan font-weight="bold">x=1</tspan>：空 tail → 追加，tail = [1]</text>
  <text x="246" y="268" font-size="10.5" fill="#333"><tspan font-weight="bold">x=6</tspan>：全 ≤ 6 → 追加，tail = [1,6]</text>

  <text x="335" y="300" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-weight="bold">LNIS = 2，改动 = 2 − 2 = 0</text>

  <rect x="252" y="316" width="166" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="335" y="336" text-anchor="middle" font-size="10.5" fill="#2e5e2e">已非递减，一个都不改 ✓</text>

  <!-- ===== panel 2: chain r=2 ===== -->
  <rect x="450" y="140" width="206" height="252" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="553" y="162" text-anchor="middle" font-size="12" fill="#a97b26" font-weight="bold">链 r=2：下标 2, 5</text>

  <rect x="480" y="172" width="36" height="28" rx="4" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="498" y="191" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <rect x="526" y="172" width="36" height="28" rx="4" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="544" y="191" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="498" y="212" text-anchor="middle" font-size="8.5" fill="#bb9644">i=2</text>
  <text x="544" y="212" text-anchor="middle" font-size="8.5" fill="#bb9644">i=5</text>

  <text x="464" y="240" font-size="10.5" fill="#333"><tspan font-weight="bold">x=5</tspan>：空 tail → 追加，tail = [5]</text>
  <text x="464" y="268" font-size="10.5" fill="#333"><tspan font-weight="bold">x=2</tspan>：5 &gt; 2 → 替换，tail = [2]</text>

  <text x="553" y="300" text-anchor="middle" font-size="11.5" fill="#a97b26" font-weight="bold">LNIS = 1，改动 = 2 − 1 = 1</text>

  <rect x="470" y="316" width="166" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="553" y="336" text-anchor="middle" font-size="10.5" fill="#2e5e2e">改 arr[5]=5 → 链变 [5,5] ✓</text>

  <!-- ===== bottom result ===== -->
  <rect x="60" y="404" width="560" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="340" y="424" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">ans = 1 + 0 + 1 = 2 ✓（示例 3 的输出）</text>
  <text x="340" y="442" text-anchor="middle" font-size="10.5" fill="#557">对应改法：arr[3] = 4、arr[5] = 5 → [4,1,5,4,6,5]，三链全部非递减</text>
</svg>
