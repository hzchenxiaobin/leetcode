<svg xmlns="http://www.w3.org/2000/svg" width="880" height="985" viewBox="0 0 880 985" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="985" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：预处理 lcp + 前后缀最大值，逐 i 三项取最大</text>
  <path d="M 240 42 Q 440 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="320" y="58" width="240" height="40" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="440" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">读入 words，n = |words|</text>
  <path d="M 440 98 L 440 116" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond n == 1 -->
  <g filter="url(#sk)"><polygon points="440,116 566,166 440,216 314,166" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="440" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">n = 1 ？</text>
  <path d="M 566 166 L 636 166" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="580" y="158" font-size="11" fill="#7a5415">是</text>
  <g filter="url(#sk)"><rect x="640" y="146" width="170" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="725" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 [0]</text>
  <path d="M 440 216 L 440 240" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="234" font-size="11" fill="#888">否</text>

  <!-- step 1 -->
  <g filter="url(#sk)"><rect x="140" y="240" width="600" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="160" y="264" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 预处理：lcp[j] ← LCP(words[j], words[j+1])，j = 0 … n−2</text>
  <text x="160" y="286" font-size="10.5" fill="#555">逐字符比较、止于首个失配；总代价 = Σ min(|w[j]|, |w[j+1]|) ≤ S</text>
  <path d="M 440 298 L 440 318" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)"><rect x="140" y="318" width="600" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="160" y="342" font-size="12.5" font-weight="bold" fill="#2b6e9e">② pre[k] ← max(lcp[0..k])，suf[k] ← max(lcp[k..n−2])</text>
  <text x="160" y="364" font-size="10.5" fill="#555">正序、倒序各扫一趟，O(n)</text>
  <path d="M 440 376 L 440 396" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop container -->
  <g filter="url(#sk)"><rect x="100" y="396" width="640" height="362" rx="10" fill="#faf8ef" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="6 4"/></g>
  <text x="120" y="422" font-size="13" font-weight="bold" fill="#2b2b2b">③ 对每个 i = 0 … n−1</text>

  <g filter="url(#sk)"><rect x="140" y="434" width="600" height="34" rx="6" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="440" y="456" text-anchor="middle" font-size="12" fill="#444">best ← 0</text>
  <path d="M 440 468 L 440 482" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="140" y="482" width="600" height="52" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="160" y="504" font-size="12" font-weight="bold" fill="#2b6e9e">i ≥ 2 ？ → best ← max(best, pre[i−2])</text>
  <text x="160" y="524" font-size="10" fill="#555">左半段：完全位于 i 左侧的对 [0, i−2]，值原样保留</text>
  <path d="M 440 534 L 440 546" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="140" y="546" width="600" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="160" y="568" font-size="12" font-weight="bold" fill="#9a6d1a">i+1 ≤ n−2 ？ → best ← max(best, suf[i+1])</text>
  <text x="160" y="588" font-size="10" fill="#555">右半段：完全位于 i 右侧的对 [i+1, n−2]，值原样保留</text>
  <path d="M 440 598 L 440 610" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="140" y="610" width="600" height="52" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="160" y="632" font-size="12" font-weight="bold" fill="#2e6e2e">1 ≤ i ≤ n−2 ？ → best ← max(best, LCP(w[i−1], w[i+1]))</text>
  <text x="160" y="652" font-size="10" fill="#555">跨坑新对：删除 i 后 (i−1) 与 (i+1) 变相邻，需现场计算</text>
  <path d="M 440 662 L 440 674" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="140" y="674" width="600" height="34" rx="6" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
  <text x="440" y="696" text-anchor="middle" font-size="12" fill="#444">ans[i] ← best（三项彼此独立，缺项记 0）</text>

  <path d="M 440 758 L 440 778" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop diamond -->
  <g filter="url(#sk)"><polygon points="440,778 580,828 440,878 300,828" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="440" y="833" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">还有下一个 i ？</text>
  <path d="M 580 828 L 668 828 L 668 416 L 748 416" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="596" y="820" font-size="11" fill="#2e6e2e">是</text>
  <path d="M 440 878 L 440 902" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="896" font-size="11" fill="#888">否</text>

  <!-- return -->
  <g filter="url(#sk)"><rect x="240" y="902" width="400" height="50" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="440" y="924" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ 返回 ans</text>
  <text x="440" y="943" text-anchor="middle" font-size="10.5" fill="#555">时间 O(n + S)，空间 O(n)</text>
</svg>
