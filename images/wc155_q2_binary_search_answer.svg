<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">count(x) 单调非降 ⇒ 对「答案」二分（lower_bound）</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 n 个丑数 = 最小的 x，使 count(x) ≥ n</text>

  <path d="M 80 300 H 520" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 300 V 70" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <path d="M 80 300 H 130 V 272 H 190 V 244 H 250 V 216 H 310 V 188 H 370 V 160 H 430 V 132 H 520"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <path d="M 80 216 H 250" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 250 300 V 218" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="250" cy="216" r="3.5" fill="#b85450" filter="url(#rough2)"/>

  <g font-size="10" fill="#555" filter="url(#rough2)">
    <text x="84" y="62">count(x)</text>
    <text x="524" y="316" text-anchor="end">x</text>
    <text x="72" y="220" text-anchor="end">n</text>
    <text x="250" y="318" text-anchor="middle" fill="#b85450">x*（答案）</text>
  </g>
  <text x="296" y="262" font-size="9.5" fill="#b85450" filter="url(#rough2)">第一个 count(x) ≥ n 的位置</text>
  <path d="M 292 254 L 258 224" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="128" y="290" font-size="9.5" fill="#446688" filter="url(#rough2)">count &lt; n：答案在右侧 →</text>

  <rect x="70" y="328" width="446" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a5a30" filter="url(#rough2)">
    <text x="86" y="348" font-weight="bold">二分区间 [1, 2×10⁹]（题面保证答案落在此范围）</text>
    <text x="86" y="366">count(mid) ≥ n ⇒ hi = mid（含 mid）；count(mid) &lt; n ⇒ lo = mid + 1</text>
    <text x="86" y="383">收敛到 lo = hi 即答案，每轮 O(1) 计数，共约 31 轮</text>
  </g>
</svg>
