<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">前序 DFS：先写值，再按规则决定括号</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">字符串按前序「边遍历边拼接」，每个节点只追加常数个字符</text>

  <rect x="160" y="60" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">① out += str(node-&gt;val)</text>

  <path d="M 280 96 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,114 392,144 280,174 168,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">左右孩子都空？</text>
  <text x="280" y="157" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">（是叶子）</text>

  <path d="M 392 144 L 500 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="134" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是：直接返回</text>

  <path d="M 280 174 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="190" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="130" y="198" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">② out += "("，递归左子树，out += ")"</text>
  <text x="280" y="234" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">左孩子为空时，这两步正好留下空括号对 "()"</text>

  <path d="M 280 244 L 280 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="268" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">③ 若右孩子存在：out += "("，递归右子树，out += ")"</text>
  <text x="280" y="304" text-anchor="middle" font-size="9.5" fill="#a05a56" filter="url(#rough2)">右孩子为空则整组省略 —— 这就是「省略空括号」的来源</text>

  <path d="M 280 314 L 280 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="336" width="240" height="34" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">④ 返回父层，继续父层的下一个孩子</text>

  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)：每个节点写 1 次值 + 至多 4 个括号字符</text>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">递归深度 = 树高，最坏是一条 10⁴ 节点的链</text>
</svg>
