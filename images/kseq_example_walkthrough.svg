<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1, 2, 3]，k = 2（m = 1）</text>
  <path d="M 170 40 Q 320 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- T derivation chips -->
  <g filter="url(#sk)">
    <rect x="42" y="64" width="132" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="108" y="84" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">T(0) = 1</text>
  <text x="108" y="102" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">空池只有空集</text>

  <path d="M 176 87 L 208 87" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="212" y="64" width="180" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="302" y="84" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-family="monospace" filter="url(#sk)">T(1) = 2·T(0) = 2</text>
  <text x="302" y="102" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">1 ≤ m，修正项为 0</text>

  <path d="M 394 87 L 426 87" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="430" y="64" width="168" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="514" y="84" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">T(2) = 2·2 − C(1,1) = 3</text>
  <text x="514" y="102" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#sk)">2 &gt; m，首次启用修正</text>

  <!-- walkthrough table: cols at x = 70,110,190,320,470,570 -->
  <g filter="url(#sk)">
    <rect x="70" y="140" width="40" height="34" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="110" y="140" width="80" height="34" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="190" y="140" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="320" y="140" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="470" y="140" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#555">
    <text x="90" y="161" filter="url(#sk)">i</text>
    <text x="150" y="161" filter="url(#sk)">nums[i]</text>
    <text x="255" y="161" fill="#2e5e22" filter="url(#sk)">最大值次数 T(i)</text>
    <text x="395" y="161" fill="#2b4a6e" filter="url(#sk)">最小值次数 T(n−1−i)</text>
    <text x="520" y="161" fill="#7a5415" filter="url(#sk)">贡献</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="70" y="174" width="40" height="36" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="110" y="174" width="80" height="36" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="190" y="174" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="320" y="174" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="470" y="174" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">
    <text x="90" y="196" filter="url(#sk)">0</text>
    <text x="150" y="196" filter="url(#sk)">1</text>
    <text x="255" y="196" fill="#2e5e22" filter="url(#sk)">T(0) = 1</text>
    <text x="395" y="196" fill="#2b4a6e" filter="url(#sk)">T(2) = 3</text>
    <text x="520" y="196" fill="#7a5415" filter="url(#sk)">1×(1+3)=4</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="70" y="210" width="40" height="36" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="110" y="210" width="80" height="36" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="190" y="210" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="320" y="210" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="470" y="210" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">
    <text x="90" y="232" filter="url(#sk)">1</text>
    <text x="150" y="232" filter="url(#sk)">2</text>
    <text x="255" y="232" fill="#2e5e22" filter="url(#sk)">T(1) = 2</text>
    <text x="395" y="232" fill="#2b4a6e" filter="url(#sk)">T(1) = 2</text>
    <text x="520" y="232" fill="#7a5415" filter="url(#sk)">2×(2+2)=8</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="70" y="246" width="40" height="36" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="110" y="246" width="80" height="36" fill="#fdfdfd" stroke="#999" stroke-width="1.1"/>
    <rect x="190" y="246" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
    <rect x="320" y="246" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="470" y="246" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">
    <text x="90" y="268" filter="url(#sk)">2</text>
    <text x="150" y="268" filter="url(#sk)">3</text>
    <text x="255" y="268" fill="#2e5e22" filter="url(#sk)">T(2) = 3</text>
    <text x="395" y="268" fill="#2b4a6e" filter="url(#sk)">T(0) = 1</text>
    <text x="520" y="268" fill="#7a5415" filter="url(#sk)">3×(3+1)=12</text>
  </g>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="110" y="308" width="420" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">总和 = 4 + 8 + 12 = 24 ✓</text>
  <text x="320" y="351" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">与示例 1 的逐一枚举结果一致</text>

  <!-- verification notes -->
  <text x="70" y="392" font-size="12" fill="#555" filter="url(#sk)">回验示例 2：k = 1 ⇒ m = 0 ⇒ T ≡ 1 ⇒ ans = 2·(5+0+6) = 22 ✓</text>
  <text x="70" y="416" font-size="12" fill="#555" filter="url(#sk)">回验示例 3：[1,1,1] 三个 1 各贡献 1×(1+3) = 4，合计 12 ✓（代言人分摊重复元素）</text>
  <text x="70" y="444" font-size="11.5" fill="#888" filter="url(#sk)">右侧 T(n−1−i) 列正是左侧列的镜像——同一张 T 表查反向下标即可</text>
</svg>
