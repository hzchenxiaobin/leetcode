<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">平移双射：把「可共端点」拆成严格间隙</text>

  <!-- 上：原始线段 n=4, k=2: (0,2),(2,3) -->
  <text x="40" y="62" font-size="13" fill="#888" filter="url(#rough2)">原方案（n=4, k=2）：两条线段共享点 2</text>
  <g filter="url(#rough2)" stroke="#c8c8c8" stroke-width="1">
    <line x1="80" y1="100" x2="480" y2="100"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="80" cy="100" r="5" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
    <circle cx="213" cy="100" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="347" cy="100" r="5" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
    <circle cx="480" cy="100" r="5" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
    <line x1="80" y1="100" x2="347" y2="100" stroke="#b85450" stroke-width="5" stroke-linecap="round"/>
    <line x1="347" y1="100" x2="480" y2="100" stroke="#4a7a3a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="80" y="122">0</text><text x="213" y="126" fill="#446688">2 (共享端点)</text>
    <text x="347" y="122">3</text><text x="480" y="122">x</text>
  </g>
  <text x="150" y="88" font-size="12" fill="#b85450" filter="url(#rough2)">段1 (0,2)</text>
  <text x="400" y="88" font-size="12" fill="#4a7a3a" filter="url(#rough2)">段2 (2,3)</text>

  <path d="M 280 140 C 280 158, 280 168, 280 186" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="166" font-size="13" fill="#446688" filter="url(#rough2)">第 i 段整体右移 i−1</text>

  <!-- 下：平移后 -->
  <text x="40" y="216" font-size="13" fill="#888" filter="url(#rough2)">平移后：段2 右移 1，端点 2 变 3 —— 严格递增！</text>
  <g filter="url(#rough2)" stroke="#c8c8c8" stroke-width="1">
    <line x1="60" y1="256" x2="500" y2="256"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="80" cy="256" r="6" fill="#b85450" stroke="#8b3a34" stroke-width="1.5"/>
    <circle cx="213" cy="256" r="6" fill="#b85450" stroke="#8b3a34" stroke-width="1.5"/>
    <circle cx="380" cy="256" r="6" fill="#4a7a3a" stroke="#2d5a22" stroke-width="1.5"/>
    <circle cx="480" cy="256" r="6" fill="#4a7a3a" stroke="#2d5a22" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="80" y="278">0</text><text x="213" y="278">2</text>
    <text x="380" y="278">3</text><text x="480" y="278">4</text>
  </g>
  <text x="132" y="246" font-size="12" fill="#b85450" filter="url(#rough2)">l₁' &lt; r₁'</text>
  <text x="404" y="246" font-size="12" fill="#4a7a3a" filter="url(#rough2)">l₂' &lt; r₂'</text>
  <!-- 间隙 -->
  <path d="M 226 268 L 366 268" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="296" font-size="11.5" fill="#b8860b" text-anchor="middle" filter="url(#rough2)">拆出的严格间隙</text>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="70" y="310" width="420" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="332" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">方案 ↔ [0, n+k−2] 中选 2k 个互异的数</text>
  <text x="280" y="354" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">答案 = C(n+k−1, 2k)；本例 C(5,4) = 5 ✓</text>
</svg>
