<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：二分收敛过程逐步走查</text>

  <text x="60" y="56" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：start = [6,0,3]，d = 2 → 排序后 [0,3,6]</text>

  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">区间 [0,2]</text>
  <text x="290" y="80" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">区间 [3,5]</text>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">区间 [6,8]</text>

  <text x="82" y="113" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">x = 4</text>
  <rect x="90" y="90" width="120" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="90" width="120" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="90" width="120" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="60" y="146" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 → max(0+4, 3) = 4 → max(4+4, 6) = 8，均未越界 → 可行 ✓</text>

  <text x="82" y="181" text-anchor="end" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 5</text>
  <rect x="90" y="158" width="120" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="158" width="120" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="158" width="120" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="181" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="181" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="430" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">10</text>
  <text x="60" y="214" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">max(5+5, 6) = 10 &gt; 8 = start+d，越界 → 不可行 ✗</text>

  <rect x="60" y="228" width="240" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d2b" filter="url(#rough2)">二分收敛 → 答案 = 4</text>

  <text x="60" y="286" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：start = [2,6,13,13]，d = 5（含重复区间）</text>

  <text x="130" y="310" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2,7]</text>
  <text x="250" y="310" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[6,11]</text>
  <text x="370" y="310" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[13,18]</text>
  <text x="490" y="310" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[13,18]</text>

  <text x="66" y="343" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">x = 5</text>
  <rect x="78" y="320" width="104" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="320" width="104" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="318" y="320" width="104" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="438" y="320" width="104" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="343" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="343" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="370" y="343" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="490" y="343" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18</text>

  <text x="60" y="376" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 → max(2+5, 6) = 7 → max(7+5, 13) = 13 → max(13+5, 13) = 18 ≤ 18 ✓</text>
  <text x="60" y="404" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6d2b" filter="url(#rough2)">再试 x = 6：… → max(14+6, 13) = 20 &gt; 18 ✗ → 答案 = 5</text>
  <text x="60" y="428" text-anchor="start" font-size="11" fill="#777" filter="url(#rough2)">两个相同区间 [13,18]：贪心自动错开，分别取 13 与 18</text>
</svg>
