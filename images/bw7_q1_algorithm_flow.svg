<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建位置表 → 一遍扫描累加</text>

  <!-- 步骤 1 -->
  <rect x="110" y="52" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">① 遍历 keyboard：pos[keyboard[i]−'a'] = i</text>
  <text x="280" y="90" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每字母恰好出现一次 → 表是良定义的双射</text>

  <path d="M 280 98 L 280 118" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2：初始化 -->
  <rect x="170" y="120" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="143" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">② cur = 0（初始键位），total = 0</text>

  <path d="M 280 156 L 280 176" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3：循环 -->
  <rect x="90" y="178" width="380" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">③ 对 word 中每个字符 c：</text>
  <rect x="112" y="212" width="336" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">nxt = pos[c]；total += |nxt − cur|；cur = nxt</text>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">每步 O(1)，共 |word| 步</text>

  <path d="M 280 258 L 280 278" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="170" y="280" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="14" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">④ 返回 total</text>
</svg>
