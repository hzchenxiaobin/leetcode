<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：位置 = 前缀和，停点为 0 才计数</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="356" y="58" width="264" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="488" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">第 i 步后的位置（右正左负）</text>
  <text x="488" y="99" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" filter="url(#rough2)">Sᵢ = nums[0] + … + nums[i]</text>

  <!-- number line -->
  <path d="M 80 225 L 580 225" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="216" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">左</text>
  <text x="596" y="230" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">右</text>

  <!-- boundary -->
  <path d="M 120 182 L 120 236" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">边界（原点）</text>
  <text x="96" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">出发</text>

  <!-- ticks 1..5 : x = 120 + 56p -->
  <path d="M 176 219 L 176 231" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 232 219 L 232 231" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 288 219 L 288 231" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 344 219 L 344 231" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 400 219 L 400 231" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="176" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="232" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="288" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="344" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="400" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>

  <!-- step arrows above the line -->
  <path d="M 130 208 L 222 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">+2</text>
  <path d="M 242 208 L 390 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">+3</text>

  <!-- return arc -->
  <path d="M 394 217 Q 250 140 134 215" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="257" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">−5</text>

  <!-- stop dots and ants -->
  <circle cx="232" cy="225" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="400" cy="225" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="120" cy="225" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="120" cy="225" r="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="120" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" filter="url(#rough2)">✓</text>

  <!-- prefix sum labels -->
  <text x="120" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">S₃ = 0 ✓</text>
  <text x="232" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">S₁ = 2</text>
  <text x="400" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">S₂ = 5</text>

  <!-- ans badge -->
  <rect x="445" y="252" width="110" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans = 1</text>

  <!-- inset: crossing does not count -->
  <rect x="40" y="300" width="560" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">穿过不算：从 +2 一步移到 −2（途中路过 0）</text>
  <path d="M 190 356 L 460 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 350 L 200 362" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 260 350 L 260 362" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 380 350 L 380 362" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 440 350 L 440 362" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 320 344 L 320 368" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="200" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">−2</text>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">−1</text>
  <text x="320" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="380" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="440" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <circle cx="440" cy="356" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="200" cy="356" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 433 347 Q 320 322 207 347" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="320" y="389" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">途中路过 0 但不停留，停点 S = −2 ≠ 0 → 不计数</text>
</svg>
