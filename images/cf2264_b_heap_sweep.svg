<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 448" width="860" height="448"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.35"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="448" fill="#fafafa"/>

  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：枚举末项位置 + 大根堆维护「最小的 k 个」</text>
  <text x="430" y="56" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">k = m − 1；扫到第 i 格时，堆里只能有下标小于 i 的元素</text>

  <!-- 前缀区括号与标注 -->
  <text x="201" y="78" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">前缀：取最小的 k = 2 个</text>
  <path d="M 100 88 L 100 82 L 302 82 L 302 88" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="341" y="78" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">当前末项</text>

  <!-- 数组格子 -->
  <rect x="100" y="92" width="62" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="131" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="170" y="92" width="62" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>
  <rect x="240" y="92" width="62" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="271" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>

  <rect x="310" y="92" width="62" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="341" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>

  <text x="131" y="150" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">a[0]</text>
  <text x="201" y="150" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">a[1]</text>
  <text x="271" y="150" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">a[2]</text>
  <text x="341" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a[3]</text>
  <text x="386" y="112" font-size="11.5" fill="#999" filter="url(#rough2)">a[4] = 3</text>
  <text x="386" y="130" font-size="10.8" fill="#aaa" filter="url(#rough2)">（随后才扫到）</text>

  <!-- 右上：为什么是大根堆 -->
  <rect x="470" y="76" width="360" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="486" y="100" font-size="12.8" font-weight="bold" fill="#33582a" filter="url(#rough2)">为什么用「大根堆」</text>
  <text x="486" y="122" font-size="11.8" fill="#33582a" filter="url(#rough2)">要淘汰的是 k 个最小里的最大者，</text>
  <text x="486" y="143" font-size="11.8" fill="#33582a" filter="url(#rough2)">而大根堆堆顶恰好就是它 —— 每次</text>
  <text x="486" y="164" font-size="11.8" fill="#33582a" filter="url(#rough2)">只需与堆顶比一次，O(1) 判淘汰。</text>

  <!-- 中间公式条 -->
  <rect x="36" y="190" width="794" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="54" y="219" font-size="12.8" fill="#8a6015" filter="url(#rough2)">i = 3 时：堆 = {0, 1}，sum = 1，候选 = m·a[3] − sum = 3 × 7 − 1 = 20（样例 1 的最优解）</text>

  <!-- 两步流程 -->
  <rect x="36" y="248" width="380" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="54" y="274" font-size="12.8" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 先更新答案（仅当 i ≥ k）</text>
  <text x="54" y="298" font-size="12" fill="#2f4a66" filter="url(#rough2)">ans = max(ans, m·a[i] − sum)</text>

  <path d="M 418 281 L 444 281" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="446" y="248" width="384" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="464" y="274" font-size="12.8" font-weight="bold" fill="#33582a" filter="url(#rough2)">② 再把 a[i] 并入堆</text>
  <text x="464" y="298" font-size="12" fill="#33582a" filter="url(#rough2)">a[i] 比堆顶小：弹堆顶、压 a[i]，sum 同步改</text>

  <!-- 顺序警告 -->
  <rect x="36" y="328" width="794" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="357" font-size="12.2" fill="#8c3a37" filter="url(#rough2)">顺序不能反：若先 ② 后 ①，末项 a[i] 自己会混进「前缀」，等于把它当成前面的元素，答案偏大。</text>

  <text x="430" y="400" text-anchor="middle" font-size="11.8" fill="#66788c" filter="url(#rough2)">k = m − 1 可能为 0（m = 1）：此时堆恒空、sum = 0，答案退化为 max a[i]，无需特判</text>
  <text x="430" y="424" text-anchor="middle" font-size="11.8" fill="#66788c" filter="url(#rough2)">堆规模始终 ≤ k ≤ m，每次 push/pop 为 O(log m)，于是总复杂度 O(n log m)</text>
</svg>
