<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa" filter="url(#rough2)"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">走查：s = ( ( ) ( ) ) ( ) ) ( ，k = 3，切分点 j = 9，L = 6，m = 7</text>

  <!-- s 的 10 个格子：pitch 62, w 52, start 76 -->
  <rect x="76" y="58" width="52" height="52" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="102" y="94" text-anchor="middle" font-size="26" fill="#33552a" filter="url(#rough2)">(</text>
  <rect x="138" y="58" width="52" height="52" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="164" y="94" text-anchor="middle" font-size="26" fill="#b85450" filter="url(#rough2)">(</text>
  <rect x="200" y="58" width="52" height="52" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="226" y="94" text-anchor="middle" font-size="26" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="262" y="58" width="52" height="52" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="288" y="94" text-anchor="middle" font-size="26" fill="#b85450" filter="url(#rough2)">(</text>
  <rect x="324" y="58" width="52" height="52" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="350" y="94" text-anchor="middle" font-size="26" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="386" y="58" width="52" height="52" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="412" y="94" text-anchor="middle" font-size="26" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="448" y="58" width="52" height="52" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="474" y="94" text-anchor="middle" font-size="26" fill="#b85450" filter="url(#rough2)">(</text>
  <rect x="510" y="58" width="52" height="52" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="536" y="94" text-anchor="middle" font-size="26" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="572" y="58" width="52" height="52" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="598" y="94" text-anchor="middle" font-size="26" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="634" y="58" width="52" height="52" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="660" y="94" text-anchor="middle" font-size="26" fill="#2f4a5f" filter="url(#rough2)">(</text>

  <path d="M148,68 L180,100" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M272,68 L304,100" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M458,68 L490,100" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <text x="102" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="164" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="226" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="288" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="350" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="412" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">6</text>
  <text x="474" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">7</text>
  <text x="536" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">8</text>
  <text x="598" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">9</text>
  <text x="660" y="130" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">10</text>

  <rect x="76" y="146" width="18" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="160" font-size="14" fill="#2f4a5f" filter="url(#rough2)">保留 · 零配对池</text>
  <rect x="290" y="146" width="18" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="314" y="160" font-size="14" fill="#33552a" filter="url(#rough2)">保留 · 补充（最多 +1 对）</text>
  <rect x="572" y="146" width="18" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="596" y="160" font-size="14" fill="#b85450" filter="url(#rough2)">删除</text>

  <text x="76" y="196" font-size="15" fill="#333" filter="url(#rough2)">① 池 = 位置 3,5,6,8,9 的 ) 与位置 10 的 (，共 L = 6 个，拼起来是 ) ) ) ) ) (</text>
  <text x="76" y="224" font-size="15" fill="#333" filter="url(#rough2)">② m = 7，还差 1 个 → 从开括号里补位置 1（补 1/2/4/7 中任意一个都等价）</text>
  <text x="76" y="252" font-size="15" fill="#333" filter="url(#rough2)">③ 其余字符全部删除；剩下的串恰好只多出 1 对匹配，达到下界 m − L</text>

  <text x="40" y="330" font-size="19" fill="#446688" filter="url(#rough2)">T =</text>
  <rect x="90" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="114" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">(</text>
  <rect x="148" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="172" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="206" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="230" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="264" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="288" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="322" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="346" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="380" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="404" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">)</text>
  <rect x="438" y="300" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="462" y="334" text-anchor="middle" font-size="24" fill="#2f4a5f" filter="url(#rough2)">(</text>

  <text x="512" y="318" font-size="15" fill="#33552a" filter="url(#rough2)">匹配 1 对</text>
  <text x="512" y="344" font-size="15" fill="#b85450" filter="url(#rough2)">cost = 2</text>

  <text x="76" y="392" font-size="15.5" fill="#333" filter="url(#rough2)">输出掩码（1 = 删除）：0 1 0 1 0 0 1 0 0 0，共 3 个 1，等于 k</text>
  <text x="76" y="456" font-size="15" fill="#2f4a5f" filter="url(#rough2)">校验：删除的是位置 2,4,7；剩余 7 个字符与上方 T 一致</text>
</svg>
