<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次线性扫描，四类失败立即返回</text>

  <rect x="235" y="44" width="190" height="32" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="10.5" fill="#33475e" filter="url(#rough2)">开始：i = 0，j = 0</text>

  <path d="M 330 76 L 330 83" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,84 430,118 330,152 230,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="122" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">j &lt; m ？</text>

  <path d="M 430 118 L 464 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="110" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="468" y="96" width="164" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="114" text-anchor="middle" font-size="9.4" fill="#3a5a30" filter="url(#rough2)">token 已全部处理完</text>
  <text x="550" y="130" text-anchor="middle" font-size="9.4" fill="#3a5a30" filter="url(#rough2)">返回 i == n 且 j == m</text>

  <path d="M 330 152 L 330 163" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="161" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="330,164 442,200 330,236 218,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="204" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">abbr[j] 是数字？</text>

  <path d="M 218 200 L 155 200 L 155 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">否（字母）</text>

  <path d="M 442 200 L 505 200 L 505 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="192" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是（数字）</text>

  <rect x="40" y="258" width="230" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="280" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#33475e" filter="url(#rough2)">字母 token：消耗 1 格</text>
  <text x="155" y="298" text-anchor="middle" font-size="9.2" fill="#555" filter="url(#rough2)">i &lt; n 且 word[i] == abbr[j]</text>
  <text x="155" y="316" text-anchor="middle" font-size="9.2" fill="#555" filter="url(#rough2)">不等 → false；然后 i++、j++</text>

  <rect x="390" y="258" width="230" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="505" y="280" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">数字 token k：消耗 k 格</text>
  <text x="505" y="298" text-anchor="middle" font-size="9.2" fill="#555" filter="url(#rough2)">首字符 '0' 或 i + k &gt; n → false</text>
  <text x="505" y="316" text-anchor="middle" font-size="9.2" fill="#555" filter="url(#rough2)">否则 i += k，j 跳过整串数字</text>

  <path d="M 155 338 L 155 378 L 204 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 505 338 L 505 378 L 456 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="362" width="240" height="32" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="383" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">回到循环条件：j &lt; m</text>

  <path d="M 210 378 L 26 378 L 26 118 L 224 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="330" y="414" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">每个状态只有唯一后继：跳过长度由 abbr 单方面决定，因此不需要回溯</text>
</svg>
