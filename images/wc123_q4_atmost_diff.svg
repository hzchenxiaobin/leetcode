<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">恰好 K 个 = 「至多 K 个」−「至多 K−1 个」</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">「恰好」不好直接滑窗维护，但「至多」可以 —— 于是把难问题拆成两个易问题</text>

  <rect x="60" y="66" width="440" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="88" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">atMost(K)：不同整数 ≤ K 的全部子数组</text>

  <rect x="110" y="100" width="340" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="122" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">atMost(K−1)：不同整数 ≤ K−1</text>
  <text x="280" y="146" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">这部分两个集合都有，相减时抵消</text>

  <text x="280" y="184" font-size="11.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">二者之差 = 不同整数恰好为 K 的子数组</text>

  <rect x="60" y="232" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="252" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">answer = atMost(K) − atMost(K−1)</text>
  <text x="72" y="269" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">两个集合满足 atMost(K−1) ⊆ atMost(K)，所以差集恰好是「不同整数数等于 K」的那批子数组。</text>

  <text x="60" y="300" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">atMost 用双指针：right 右移扩窗，种类超限就左移 left，累计 right − left + 1。</text>
</svg>
