<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描 + 一次筛选</text>
  <rect x="60" y="52" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="78.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">拼接 s = s1 + " " + s2</text>
  <path d="M280 96 L280 114" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="120" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="146.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">按空格切分，共 n 个单词</text>
  <path d="M280 164 L280 182" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="188" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="222.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">哈希表计数：cnt[w] += 1</text>
  <path d="M280 248 L280 270" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="276" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="310.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">筛出 cnt[w] == 1 的单词</text>
  <path d="M280 336 L280 358" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="364" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="392.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">返回结果列表（顺序任意）</text>
  <text x="280" y="440" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">时间 O(n)，空间 O(n)，n 为两个句子的总词数</text>
</svg>
