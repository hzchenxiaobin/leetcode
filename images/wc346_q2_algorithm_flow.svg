<svg xmlns="http://www.w3.org/2000/svg" width="640" height="466" viewBox="0 0 640 466" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="466" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双指针对撞，一趟扫描，失配双写 min</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <rect x="250" y="54" width="140" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">i = 0，j = n − 1</text>
  <path d="M 320 84 V 102" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>

  <!-- diamond 1: i < j ? -->
  <polygon points="320,106 462,162 320,218 178,162" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">i &lt; j ？</text>
  <text x="320" y="174" text-anchor="middle" font-size="10" fill="#8a3a3a" filter="url(#sk)">还有对称对没处理吗</text>

  <!-- no branch: return -->
  <text x="470" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 462 162 H 474" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <rect x="478" y="140" width="128" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="542" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">返回 s</text>
  <text x="542" y="179" text-anchor="middle" font-size="10" fill="#4a6a3a" filter="url(#sk)">每个对称对都已决策完</text>

  <!-- yes branch -->
  <text x="330" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">是</text>
  <path d="M 320 218 V 246" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>

  <!-- diamond 2: equal ? -->
  <polygon points="320,250 478,308 320,366 162,308" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">s[i] == s[j] ？</text>
  <text x="320" y="320" text-anchor="middle" font-size="10" fill="#33517a" filter="url(#sk)">这对已经相等了吗</text>

  <!-- equal: skip -->
  <text x="486" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">是</text>
  <path d="M 478 308 H 494" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="498" y="286" width="108" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="552" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#sk)">不动，跳过这对</text>
  <text x="552" y="322" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">0 次操作</text>

  <!-- not equal: write min -->
  <text x="330" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 320 366 V 392" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <rect x="230" y="396" width="180" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="320" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">c = min(s[i], s[j])</text>
  <text x="320" y="433" text-anchor="middle" font-size="10" fill="#8a6520" filter="url(#sk)">两侧同写 c（较大者被改小）</text>

  <!-- loop back -->
  <path d="M 410 418 H 546" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <path d="M 552 330 V 418 H 614 V 96 H 330" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="472" y="90" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">↻ i++，j−−，处理下一对</text>

  <!-- caption -->
  <text x="320" y="456" text-anchor="middle" font-size="11" fill="#4a6a3a" filter="url(#sk)">每对只看一眼：相等跳过、失配双写 min —— ⌊n/2⌋ 对处理完即为答案</text>
</svg>
