<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [4,3,1,1,3,3,2]，k = 3</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">频次：值1→2，值2→1，值3→3，值4→1；升序代价队列 = [1,1,2,3]</text>

  <rect x="30" y="70" width="580" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="60" y="101">步骤</text>
    <text x="165" y="101">代价 c（值）</text>
    <text x="285" y="101">进入时 k</text>
    <text x="385" y="101">c ≤ k ?</text>
    <text x="485" y="101">操作后 k</text>
    <text x="570" y="101">ans</text>
  </g>

  <rect x="30" y="122" width="580" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="149">1</text>
    <text x="165" y="149">1（值 2）</text>
    <text x="285" y="149">3</text>
    <text x="385" y="149">1 ≤ 3 ✔</text>
    <text x="485" y="149">2</text>
    <text x="570" y="149">3</text>
  </g>

  <rect x="30" y="166" width="580" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="193">2</text>
    <text x="165" y="193">1（值 4）</text>
    <text x="285" y="193">2</text>
    <text x="385" y="193">1 ≤ 2 ✔</text>
    <text x="485" y="193">1</text>
    <text x="570" y="193">2</text>
  </g>

  <rect x="30" y="210" width="580" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="237">3</text>
    <text x="165" y="237">2（值 1）</text>
    <text x="285" y="237">1</text>
    <text x="385" y="237">2 ≤ 1 ✘</text>
    <text x="485" y="237">1（不变）</text>
    <text x="570" y="237">2</text>
  </g>

  <rect x="30" y="254" width="580" height="44" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <g font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="281">停</text>
    <text x="165" y="281">3（值 3）</text>
    <text x="285" y="281">—</text>
    <text x="385" y="281">未处理</text>
    <text x="485" y="281">1</text>
    <text x="570" y="281">2</text>
  </g>

  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 2：剩下的是值 1（1 个）与值 3（3 个）</text>
  <text x="320" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意第 3 步：k = 1 已经买不起代价 2 的族，直接 break；剩下的名额只能浪费在族内部元素上，不减少种类</text>
  <text x="320" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">验证「恰好移除 k 个」：前两步共删 2 个元素，最后 1 个名额任意删一个 1 或 3，种类数保持 2</text>
</svg>
