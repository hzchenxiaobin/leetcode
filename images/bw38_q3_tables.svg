<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">两张表：公共后缀 pre 与公共前缀 suf</text>

  <!-- pre 表 -->
  <g filter="url(#rough2)">
    <rect x="70" y="70" width="190" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" stroke="#b8d4b0" stroke-width="1">
    <line x1="70" y1="110" x2="260" y2="110"/>
    <line x1="70" y1="150" x2="260" y2="150"/>
    <line x1="70" y1="190" x2="260" y2="190"/>
    <line x1="70" y1="230" x2="260" y2="230"/>
    <line x1="130" y1="70" x2="130" y2="260"/>
    <line x1="190" y1="70" x2="190" y2="260"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#2d5a22" text-anchor="middle">
    <text x="100" y="92" font-weight="bold">pre</text>
    <text x="160" y="92">j−1</text><text x="225" y="92">…</text>
    <text x="100" y="132">i−1</text><text x="100" y="172">i</text>
    <text x="160" y="172" fill="#b85450" font-weight="bold">?</text>
  </g>
  <path d="M 138 156 L 172 122" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="215" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">pre[i][j] ← pre[i−1][j−1] + 1</text>
  <text x="165" y="234" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">（当 s[i−1] = t[j−1]）</text>
  <text x="165" y="288" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">正向填：对齐左上角递推</text>

  <!-- suf 表 -->
  <g filter="url(#rough2)">
    <rect x="310" y="70" width="190" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" stroke="#c3d0e4" stroke-width="1">
    <line x1="310" y1="110" x2="500" y2="110"/>
    <line x1="310" y1="150" x2="500" y2="150"/>
    <line x1="310" y1="190" x2="500" y2="190"/>
    <line x1="310" y1="230" x2="500" y2="230"/>
    <line x1="370" y1="70" x2="370" y2="260"/>
    <line x1="430" y1="70" x2="430" y2="260"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#446688" text-anchor="middle">
    <text x="340" y="92" font-weight="bold">suf</text>
    <text x="400" y="92">j</text><text x="465" y="92">…</text>
    <text x="340" y="132">i</text><text x="340" y="172">i+1</text>
    <text x="400" y="132" fill="#b85450" font-weight="bold">?</text>
  </g>
  <path d="M 408 138 L 442 172" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="405" y="215" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">suf[i][j] ← suf[i+1][j+1] + 1</text>
  <text x="405" y="234" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（当 s[i] = t[j]）</text>
  <text x="405" y="288" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">反向填：从右下角倒推</text>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="70" y="308" width="430" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="285" y="332" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">查失配位 (i,j)：左侧长度看 pre[i][j]，右侧长度看 suf[i+1][j+1]</text>
</svg>
