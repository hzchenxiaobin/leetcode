<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 4, 7, 9]，答案 2</text>

  <!-- step arrows above cells: cells at x=76+k*100, y=150, w=72, h=48 -->
  <g filter="url(#rough2)">
    <path d="M148,148 C154,120 190,120 196,148" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
    <text x="172" y="114" text-anchor="middle" font-size="11" fill="#446688">相邻</text>

    <path d="M148,148 C166,100 238,100 256,148" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
    <text x="202" y="92" text-anchor="middle" font-size="11" fill="#b85450">传送 p=2（4%2=0）</text>

    <path d="M248,148 C286,66 428,66 466,148" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
    <text x="357" y="58" text-anchor="middle" font-size="11" fill="#b85450">传送 p=3（9%3=0）</text>

    <path d="M348,148 C354,124 390,124 396,148" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
    <text x="372" y="118" text-anchor="middle" font-size="11" fill="#446688">相邻</text>
  </g>

  <!-- cells: idx 0..4, values 2,3,4,7,9; fill by dist -->
  <rect x="76" y="150" width="72" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="112" y="181" text-anchor="middle" font-size="19" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="176" y="150" width="72" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="212" y="181" text-anchor="middle" font-size="19" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="276" y="150" width="72" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="181" text-anchor="middle" font-size="19" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="376" y="150" width="72" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="181" text-anchor="middle" font-size="19" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="476" y="150" width="72" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="512" y="181" text-anchor="middle" font-size="19" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="112" y="218" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="212" y="218" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="312" y="218" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="412" y="218" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="512" y="218" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i=4（终点）</text>

  <text x="112" y="240" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">d=0</text>
  <text x="212" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=1</text>
  <text x="312" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d=1</text>
  <text x="412" y="240" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d=2</text>
  <text x="512" y="240" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d=2</text>

  <!-- buckets -->
  <text x="320" y="278" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">建桶结果与展开记录</text>

  <rect x="46" y="292" width="180" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="312" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">bucket[2] = {0, 2}</text>
  <text x="136" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 出队 0 时展开（d=1）</text>

  <rect x="236" y="292" width="180" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="312" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">bucket[3] = {1, 4}</text>
  <text x="326" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 出队 1 时展开（d=2）</text>

  <rect x="426" y="292" width="180" height="52" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="312" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">bucket[7] = {3}</text>
  <text x="516" y="332" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">× 无人以 7 传送，不展开</text>

  <!-- bottom summary -->
  <rect x="46" y="362" width="560" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="326" y="384" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">BFS 层：L0 = {0} → L1 = {1, 2} → L2 = {3, 4}</text>
  <text x="326" y="404" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">出队 4 即终点：dist[4] = 2，路径 0 →(相邻) 1 →(传送 p=3) 4</text>
</svg>
