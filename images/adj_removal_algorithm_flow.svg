<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="#fafafa"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">栈模拟算法流程：一趟从左到右扫描</text>
  <path d="M 250 42 Q 440 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <polygon points="400,70 560,110 400,150 240,110" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="400" y="114.55" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold" filter="url(#sk)">还有未读字符？</text>
  <path d="M 560 110 L 624 110" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="586" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">否（扫完）</text>
  <rect x="630" y="88" width="228" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#sk)"/>
  <text x="744" y="107" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">输出栈内容（底→顶）</text>
  <text x="744" y="126" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">即最终答案</text>
  <path d="M 400 150 L 400 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="410" y="166" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">是</text>
  <rect x="290" y="178" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="400" y="203" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold" filter="url(#sk)">① 读入字符 c</text>
  <path d="M 400 218 L 400 242" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <polygon points="400,246 520,286 400,326 280,286" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="400" y="290.55" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold" filter="url(#sk)">栈非空？</text>
  <text x="288" y="274" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">否（栈空）</text>
  <path d="M 280 286 L 190 286 L 190 510 L 350 510 L 350 534" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 400 326 L 400 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="410" y="342" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">是</text>
  <rect x="290" y="354" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="400" y="379" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">② 计算 d = |栈顶 − c|</text>
  <path d="M 400 394 L 400 418" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <polygon points="400,422 550,466 400,510 250,466" fill="#fef6ee" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="400" y="461.55" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#sk)">d == 1 或 d == 25 ？</text>
  <text x="400" y="478.675" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（字母表相邻，含 z↔a 环回）</text>
  <text x="562" y="452" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">是（可消）</text>
  <path d="M 550 466 L 634 466" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <rect x="640" y="438" width="216" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#sk)"/>
  <text x="748" y="460" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">弹出栈顶</text>
  <text x="748" y="481" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">c 不入栈（这一对被删除）</text>
  <path d="M 748 438 L 748 198 L 518 198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="758" y="330" text-anchor="start" font-size="11" fill="#999" filter="url(#sk)">继续读下一字符</text>
  <path d="M 400 510 L 400 534" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="412" y="528" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">否（不可消）</text>
  <rect x="290" y="538" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="400" y="565" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">c 入栈（c 幸存）</text>
  <path d="M 290 560 L 110 560 L 110 110 L 230 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="98" y="340" text-anchor="middle" font-size="11" fill="#999" transform="rotate(-90 98 340)" filter="url(#sk)">回到 ①，读下一个字符</text>
  <rect x="560" y="588" width="292" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="706" y="611" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">每字符至多入栈 1 次、出栈 1 次</text>
  <text x="706" y="632" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#sk)">时间 O(n)｜空间 O(n)</text>
</svg>
