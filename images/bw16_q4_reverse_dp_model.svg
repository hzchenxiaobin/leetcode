<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="370" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">倒着走：从 S(右下) 倒推回 E(左上)</text>

  <!-- 棋盘 -->
  <g filter="url(#rough2)">
    <!-- 行 0 -->
    <rect x="150" y="62" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="218" y="62" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="62" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 行 1 -->
    <rect x="150" y="118" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="118" width="64" height="52" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <rect x="286" y="118" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 行 2 -->
    <rect x="150" y="174" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="174" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="174" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="182" y="94" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">E</text>
  <text x="250" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="318" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="182" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="150" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">X</text>
  <text x="318" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="182" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="318" y="206" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">S</text>

  <!-- 反向转移箭头：从 (1,2) 看下/右/右下 -->
  <path d="M 310 176 L 288 138" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="164" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">下邻 (2,2)=S</text>

  <!-- 正向移动说明（左上角） -->
  <text x="52" y="70" font-size="12.5" fill="#446688" filter="url(#rough2)">正向移动：</text>
  <text x="52" y="90" font-size="12" fill="#446688" filter="url(#rough2)">↑ ← ↖</text>
  <text x="52" y="112" font-size="12" fill="#4a7a3a" filter="url(#rough2)">反向转移：</text>
  <text x="52" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">f[r][c] 依赖</text>
  <text x="52" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">↓ → ↘ 三邻</text>

  <!-- 公式框 -->
  <rect x="400" y="62" width="212" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="506" y="90" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">f[r][c] = ch 得分</text>
  <text x="506" y="112" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">+ max f[r+1][c],</text>
  <text x="506" y="132" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">f[r][c+1], f[r+1][c+1]</text>
  <text x="506" y="150" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">（S 格计 0 分，E 格计 0 分）</text>

  <!-- 方案数框 -->
  <rect x="400" y="178" width="212" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="506" y="204" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">g[r][c] = Σ g[邻]</text>
  <text x="506" y="226" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">只对「f 恰好等于 max」的邻累加</text>
  <text x="506" y="248" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">全程对 10⁹+7 取模</text>
  <text x="506" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">比较用 f 原值，别拿取模后的 g 比！</text>

  <text x="320" y="316" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">答案 = f[0][0]（最大得分）与 g[0][0]（方案数）；</text>
  <text x="320" y="338" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">f[0][0] &lt; 0 表示 E 不可达 → 返回 [0,0]</text>
</svg>
