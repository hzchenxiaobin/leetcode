<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：二分区间四次收缩，锁定答案 11</text>
  <path d="M 120 38 Q 280 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">jobs=[1,2,4,7,8]（降序 [8,7,4,2,1]），k=2，sum=22，max=8，初始 [lo,hi]=[8,22]</text>

  <!-- table header: x=20..540, cols: 步36 | lo46 | hi46 | mid50 | check190 | 判定64 | 新区间88 -->
  <g filter="url(#rough2)">
    <rect x="20" y="76" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="56" y="76" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="102" y="76" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="148" y="76" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="198" y="76" width="190" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="388" y="76" width="64" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="452" y="76" width="88" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="10.5" font-weight="bold" fill="#2f4e68" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="94">步</text>
    <text x="79" y="94">lo</text>
    <text x="125" y="94">hi</text>
    <text x="173" y="94">mid</text>
    <text x="293" y="94">check(mid) 依据</text>
    <text x="420" y="94">判定</text>
    <text x="496" y="94">新区间</text>
  </g>

  <!-- row 1: y=104 h=38 -->
  <g filter="url(#rough2)">
    <rect x="20" y="104" width="36" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="56" y="104" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="102" y="104" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="148" y="104" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="198" y="104" width="190" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="388" y="104" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="452" y="104" width="88" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="127" fill="#333">1</text>
    <text x="79" y="127" fill="#333">8</text>
    <text x="125" y="127" fill="#333">22</text>
    <text x="173" y="127" fill="#a07820" font-weight="bold">15</text>
    <text x="293" y="120" fill="#555" font-size="9.5">{8,7}=15, {4,2,1}=7</text>
    <text x="293" y="134" fill="#555" font-size="9.5">max=15 ≤ 15，回溯成功</text>
    <text x="420" y="127" fill="#2e6e2e" font-weight="bold">✓ 可行</text>
    <text x="496" y="127" fill="#333">hi=15 → [8,15]</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="20" y="146" width="36" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="56" y="146" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="102" y="146" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="148" y="146" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="198" y="146" width="190" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="388" y="146" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="452" y="146" width="88" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="169" fill="#333">2</text>
    <text x="79" y="169" fill="#333">8</text>
    <text x="125" y="169" fill="#333">15</text>
    <text x="173" y="169" fill="#a07820" font-weight="bold">11</text>
    <text x="293" y="162" fill="#555" font-size="9.5">{8,2,1}=11, {7,4}=11</text>
    <text x="293" y="176" fill="#555" font-size="9.5">max=11 ≤ 11，回溯成功</text>
    <text x="420" y="169" fill="#2e6e2e" font-weight="bold">✓ 可行</text>
    <text x="496" y="169" fill="#333">hi=11 → [8,11]</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#rough2)">
    <rect x="20" y="188" width="36" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="56" y="188" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="102" y="188" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="148" y="188" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="198" y="188" width="190" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="388" y="188" width="64" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="452" y="188" width="88" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="211" fill="#333">3</text>
    <text x="79" y="211" fill="#333">8</text>
    <text x="125" y="211" fill="#333">11</text>
    <text x="173" y="211" fill="#a07820" font-weight="bold">9</text>
    <text x="293" y="204" fill="#555" font-size="9.5">2×9=18 ＜ 22，总容量不足</text>
    <text x="293" y="218" fill="#555" font-size="9.5">（鸽笼剪枝，无需回溯）</text>
    <text x="420" y="211" fill="#b85450" font-weight="bold">✗ 不可行</text>
    <text x="496" y="211" fill="#333">lo=10 → [10,11]</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#rough2)">
    <rect x="20" y="230" width="36" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="56" y="230" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="102" y="230" width="46" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="148" y="230" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="198" y="230" width="190" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
    <rect x="388" y="230" width="64" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="452" y="230" width="88" height="38" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.1"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="253" fill="#333">4</text>
    <text x="79" y="253" fill="#333">10</text>
    <text x="125" y="253" fill="#333">11</text>
    <text x="173" y="253" fill="#a07820" font-weight="bold">10</text>
    <text x="293" y="246" fill="#555" font-size="9.5">2×10=20 ＜ 22，总容量不足</text>
    <text x="293" y="260" fill="#555" font-size="9.5">（鸽笼剪枝，无需回溯）</text>
    <text x="420" y="253" fill="#b85450" font-weight="bold">✗ 不可行</text>
    <text x="496" y="253" fill="#333">lo=11 → [11,11]</text>
  </g>

  <!-- convergence -->
  <g filter="url(#rough2)">
    <rect x="20" y="278" width="520" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">lo = hi = 11，区间收缩为单点 ⟹ 答案 = 11 ✓</text>

  <!-- final buckets -->
  <g filter="url(#rough2)">
    <rect x="45" y="326" width="220" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="155" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">工人 w₁</text>
  <g filter="url(#rough2)">
    <rect x="63" y="358" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <rect x="113" y="358" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <rect x="163" y="358" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="85" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">1</text>
  <text x="135" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">2</text>
  <text x="185" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">8</text>
  <text x="155" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4e68" filter="url(#rough2)">工作时间 = 11</text>

  <g filter="url(#rough2)">
    <rect x="295" y="326" width="220" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="405" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">工人 w₂</text>
  <g filter="url(#rough2)">
    <rect x="313" y="358" width="44" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="363" y="358" width="44" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="335" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">4</text>
  <text x="385" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">7</text>
  <text x="405" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">工作时间 = 11</text>
</svg>
