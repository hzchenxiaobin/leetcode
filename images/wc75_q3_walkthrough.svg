<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="428" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：poured = 6，逐行推动溢出</text>

  <rect x="52" y="60" width="598" height="42" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="87" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">行 r</text>
  <text x="226" y="87" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">交付量 cur[c]</text>
  <text x="389" y="87" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">盛放 min(1,·)</text>
  <text x="552" y="87" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">溢出 q[c]</text>

  <rect x="52" y="102" width="598" height="54" rx="4" fill="#ffffff" stroke="#d8dee6" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="226" y="135" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">6</text>
  <text x="389" y="135" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">1</text>
  <text x="552" y="135" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">2.5、2.5</text>

  <rect x="52" y="156" width="598" height="54" rx="4" fill="#f7f9fc" stroke="#d8dee6" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="189" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="226" y="189" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">2.5、2.5</text>
  <text x="389" y="189" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">1、1</text>
  <text x="552" y="189" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">0.75、0.75</text>

  <rect x="52" y="210" width="598" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="243" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="226" y="243" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">0.75、1.5、0.75</text>
  <text x="389" y="243" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">0.75、1、0.75</text>
  <text x="552" y="243" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">0、0.25、0</text>

  <rect x="52" y="264" width="598" height="54" rx="4" fill="#f7f9fc" stroke="#d8dee6" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="297" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="226" y="297" text-anchor="middle" font-size="13" fill="#2b4a6f" filter="url(#rough2)">0、0.25、0.25、0</text>
  <text x="389" y="297" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">0、0.25、0.25、0</text>
  <text x="552" y="297" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">0（落地）</text>

  <text x="80" y="343" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">第 2 行中间杯收到 1.5 杯：先盛 1 杯，多出的 0.5 杯左右各 0.25</text>

  <rect x="48" y="356" width="624" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="378" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">查询 (r=2, c=1)：min(1, 1.5) = 1.0　　查询 (r=3, c=1)：min(1, 0.25) = 0.25</text>
  <text x="360" y="400" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">每行只依赖上一行，因此两个长度为 query_row+2 的滚动数组就够</text>
</svg>
