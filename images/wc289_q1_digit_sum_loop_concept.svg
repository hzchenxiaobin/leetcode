<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一轮操作：切段 → 求和 → 拼接（循环直至 len ≤ k）</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input -->
  <g filter="url(#sk2)">
    <rect x="175" y="56" width="290" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">s = "11111222223",  k = 3</text>
  <text x="490" y="82" font-size="11" fill="#b85450">len = 11 &gt; 3</text>

  <!-- split label -->
  <text x="320" y="122" text-anchor="middle" font-size="12" fill="#666">切成 ⌈11 / 3⌉ = 4 组（末组可不足 k）</text>
  <path d="M 320 96 L 320 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- groups -->
  <g filter="url(#sk2)">
    <rect x="55" y="132" width="120" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="205" y="132" width="120" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="355" y="132" width="120" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="505" y="132" width="80" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="115" y="155" text-anchor="middle" font-size="14" fill="#2b4a6e" font-family="monospace">111</text>
  <text x="265" y="155" text-anchor="middle" font-size="14" fill="#2b4a6e" font-family="monospace">112</text>
  <text x="415" y="155" text-anchor="middle" font-size="14" fill="#2b4a6e" font-family="monospace">222</text>
  <text x="545" y="155" text-anchor="middle" font-size="14" fill="#2b4a6e" font-family="monospace">23</text>
  <text x="545" y="180" text-anchor="middle" font-size="10" fill="#b85450">末组仅 2 位</text>

  <!-- arrows down -->
  <path d="M 115 170 L 115 194" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 265 170 L 265 194" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 415 170 L 415 194" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 545 170 L 545 194" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- sums -->
  <g filter="url(#sk2)">
    <rect x="85" y="198" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="235" y="198" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="385" y="198" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="515" y="198" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="115" y="220" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">3</text>
  <text x="265" y="220" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">4</text>
  <text x="415" y="220" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">6</text>
  <text x="545" y="220" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">5</text>

  <!-- merge arrows -->
  <path d="M 115 234 Q 200 262 270 272" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 265 234 Q 290 260 300 270" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 415 234 Q 350 262 330 272" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 545 234 Q 400 268 340 274" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- merged -->
  <g filter="url(#sk2)">
    <rect x="225" y="278" width="180" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="315" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">"3465"</text>
  <text x="315" y="336" text-anchor="middle" font-size="11" fill="#666">拼接：各组和的十进制串依次连起来</text>

  <!-- loop arrow (left side) -->
  <path d="M 218 296 Q 60 300 55 190 Q 52 100 168 78" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="62" y="240" font-size="12" font-weight="bold" fill="#a06a1a">len &gt; k</text>
  <text x="62" y="256" font-size="11" fill="#a06a1a">再来一轮</text>

  <!-- stop box (right) -->
  <g filter="url(#sk2)">
    <rect x="445" y="278" width="180" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="535" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">len(s) ≤ k ？</text>
  <text x="535" y="316" text-anchor="middle" font-size="12" fill="#8a3a36">是 → 返回 s</text>
  <path d="M 410 297 L 440 297" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="40" y="362" width="560" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="383" text-anchor="middle" font-size="12" fill="#7a5415">总数字和 S 单调不增（存在段和 ≥ 10 时严格递减），长度也不会无限徘徊 →</text>
  <text x="320" y="402" text-anchor="middle" font-size="12" fill="#7a5415">循环必终止；和为 0 也要拼成 "0"，不能用空串。</text>
</svg>
