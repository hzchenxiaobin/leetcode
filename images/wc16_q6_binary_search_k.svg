<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">固定 m：在 [2, n−1] 上二分 k</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">f(k, m) 关于 k 严格递增，与水平线 f = n 至多一个交点</text>

  <line x1="70" y1="92" x2="500" y2="92" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56" y="96" font-size="11" fill="#8a3a36" filter="url(#rough2)">n</text>

  <path d="M 80 158 C 190 156, 285 130, 350 92 C 396 60, 446 48, 490 44" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="58" y="180" font-size="10" fill="#3a4a66" filter="url(#rough2)">f(k, m)</text>

  <line x1="70" y1="118" x2="505" y2="118" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="122" font-size="10" fill="#666" filter="url(#rough2)">k</text>
  <text x="74" y="134" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="486" y="134" font-size="10" fill="#666" filter="url(#rough2)">n−1</text>

  <circle cx="350" cy="92" r="5.5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="112" font-size="10" fill="#8a6a20" filter="url(#rough2)">f = n ⇒ 命中，返回 k</text>

  <rect x="100" y="170" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="190" y="190" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">f &lt; n ⇒ k 太小，lo = mid + 1</text>
  <rect x="300" y="170" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="390" y="190" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">f &gt; n ⇒ k 太大，hi = mid − 1</text>

  <rect x="90" y="212" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">for m = m_max, m_max − 1, …, 2（m 递减）</text>
  <path d="M 280 246 L 280 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="258" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">二分 k ∈ [2, n−1]，Horner 累加 1 + k + ⋯ + k^(m−1)</text>
  <path d="M 280 292 L 280 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="304" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">f = n ⇒ 立即返回 k：最大的可行 m 给出最小的 k</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">所有 m 都失败时返回 n − 1（n 在 n−1 进制下是 11，保底一定有解）</text>
</svg>
