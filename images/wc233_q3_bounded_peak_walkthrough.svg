<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 4, index = 2, maxSum = 6</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">二分区间 [1, maxSum−n+1] = [1, 3]；红色格子为峰值位置 index=2</text>

  <!-- Row 1 -->
  <text x="40" y="84" font-size="11" fill="#555" filter="url(#rough2)">① lo=1, hi=3</text>
  <text x="40" y="102" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">mid = 2</text>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle" font-weight="bold">
    <rect x="170" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="192" y="93" fill="#333">1</text>
    <rect x="220" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="242" y="93" fill="#333">1</text>
    <rect x="270" y="70" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="292" y="93" fill="#b85450">2</text>
    <rect x="320" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="342" y="93" fill="#333">1</text>
  </g>
  <text x="267" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">山峰 [1,1,2,1]，和 1+1+2+1 = 5</text>
  <text x="390" y="84" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 5 ≤ 6 ✓</text>
  <text x="390" y="102" font-size="10.5" fill="#555" filter="url(#rough2)">可行 → ans = 2，lo = 3</text>

  <!-- Row 2 -->
  <text x="40" y="164" font-size="11" fill="#555" filter="url(#rough2)">② lo=3, hi=3</text>
  <text x="40" y="182" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">mid = 3</text>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle" font-weight="bold">
    <rect x="170" y="150" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="192" y="173" fill="#333">2</text>
    <rect x="220" y="150" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="242" y="173" fill="#333">1</text>
    <rect x="270" y="150" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="292" y="173" fill="#b85450">3</text>
    <rect x="320" y="150" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="342" y="173" fill="#333">2</text>
  </g>
  <text x="267" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">山峰 [2,1,3,2]，和 2+1+3+2 = 8</text>
  <text x="390" y="164" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">total = 8 &gt; 6 ✗</text>
  <text x="390" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">太大 → hi = 2</text>

  <!-- Row 3 -->
  <text x="40" y="256" font-size="11" fill="#555" filter="url(#rough2)">③ lo = 3 &gt; hi = 2</text>
  <text x="40" y="274" font-size="10" fill="#888" filter="url(#rough2)">区间为空</text>
  <rect x="170" y="232" width="194" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="267" y="251" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans = 2</text>
  <text x="267" y="269" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">最优构造之一 [1, 1, 2, 1]</text>
  <text x="390" y="256" font-size="10.5" fill="#555" filter="url(#rough2)">峰值 2 即最大可行值</text>

  <!-- verification strip -->
  <rect x="44" y="300" width="472" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">验证 x=3 不可行：山峰 [2,1,3,2] 最小和 8 &gt; 6，任何 nums[2]=3 的数组和都 ≥ 8</text>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">验证 x=2 可行：山峰 [1,1,2,1] 最小和 5 ≤ 6，剩余 1 可自由分配</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">total = mid + sideSum(index, mid) + sideSum(n−index−1, mid)</text>
</svg>
