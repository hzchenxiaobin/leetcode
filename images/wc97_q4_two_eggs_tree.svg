<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">k = 2, n = 6：三次操作足够（最坏分支）</text>
  <rect x="270" y="52" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="335.0" y="77.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">第 1 次：扔 3</text>
  <path d="M300 94 L190 132" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M370 94 L470 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <rect x="110" y="134" width="170" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195.0" y="159.2" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">碎了 → 1-2 层</text>
  <text x="195.0" y="179.2" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">只剩 1 枚蛋</text>
  <rect x="400" y="134" width="200" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500.0" y="159.2" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">没碎 → 4-6 层</text>
  <text x="500.0" y="179.2" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">2 枚蛋，还剩 2 次</text>
  <path d="M195 196 L195 232" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M500 196 L500 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <rect x="110" y="234" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195.0" y="260.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">第 2 次：扔 1</text>
  <rect x="400" y="234" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500.0" y="260.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">第 2 次：扔 5</text>
  <path d="M195 278 L195 308" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M500 278 L500 308" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <rect x="60" y="310" width="140" height="62" fill="#f7f9fc" stroke="#9aa7b4" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130.0" y="335.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">碎 → f=0</text>
  <text x="130.0" y="355.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">没碎 → 再扔 2</text>
  <rect x="360" y="310" width="130" height="62" fill="#f7f9fc" stroke="#9aa7b4" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425.0" y="335.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">碎 → 再扔 4</text>
  <text x="425.0" y="355.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ f=3 或 4</text>
  <rect x="510" y="310" width="130" height="62" fill="#f7f9fc" stroke="#9aa7b4" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="575.0" y="335.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">没碎 → 再扔 6</text>
  <text x="575.0" y="355.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ f=5 或 6</text>
  <text x="330" y="410" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每条路径最多 3 次；2 次最多覆盖 3 层，因此 3 是最小值</text>
</svg>
