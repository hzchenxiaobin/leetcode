<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="448" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举最小 x，再找最小 y</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值域 ≤ 100，双重枚举即可；频次一次统计</text>
  <rect x="80" y="60" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">统计 freq[v]（v 为出现过的值）</text>
  <text x="200" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">并收集去重后的值集合</text>
  <path d="M 200 104 L 200 126" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="130" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">按值升序取 x</text>
  <text x="200" y="166" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">从小到大，第一个满足即答案</text>
  <path d="M 200 174 L 200 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="200,196.0 320.0,232 200,268.0 80.0,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">存在 y &gt; x 且</text>
  <text x="200" y="244" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">freq[y] ≠ freq[x] ？</text>
  <path d="M 320 232 L 356 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="338" y="222" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="360" y="206" width="168" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="444" y="226" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">换下一个 x</text>
  <text x="444" y="245" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">当前 x 无解，跳过</text>
  <path d="M 80 232 C 10 232 10 152 78 152" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 268 L 200 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="214" y="284" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="68" y="296" width="264" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="316" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">取最小的这种 y，返回 [x, y]</text>
  <text x="200" y="335" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x 已最小、y 也已最小 → 字典序最优</text>
  <text x="200" y="380" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">全部 x 都找不到 → 返回 [-1, -1]</text>
  <rect x="68" y="396" width="264" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="416" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">复杂度：时间 O(V²)，空间 O(V)，V ≤ 100</text>
</svg>
