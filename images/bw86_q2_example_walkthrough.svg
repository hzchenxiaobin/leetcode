<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="193"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：不同 n 在各自 b = n−2 进制下的“两位陷阱”</text>

  <!-- n=9 -->
  <text x="60" y="62" font-size="13.5" fill="#333" filter="url(#rough2)">n = 9（官方示例 1）：</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60"  y="74" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="103" y="94">b=2: 1001 ✓</text>
    <rect x="156" y="74" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="204" y="94" fill="#b85450">b=3: 100 ✗</text>
    <rect x="262" y="74" width="110" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="317" y="94">b=4..6 略 ✗</text>
    <rect x="382" y="74" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="442" y="94" fill="#b85450" font-weight="bold">b=7: 12 ✗ 定音</text>
  </g>
  <text x="204" y="122" font-size="12" fill="#888" text-anchor="middle" filter="url(#rough2)">逐进制检查 3 个才发现 ✗</text>
  <path d="M 442 110 C 442 118 442 122 442 126" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="122" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">直达反例</text>

  <!-- n=5 -->
  <text x="60" y="156" font-size="13.5" fill="#333" filter="url(#rough2)">n = 5：</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="130" y="168" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="190" y="188" fill="#b85450" font-weight="bold">b=3: 12 ✗</text>
  </g>
  <text x="300" y="188" font-size="12.5" fill="#888" filter="url(#rough2)">唯一要查的进制，一眼否决</text>

  <!-- n=4 特例 -->
  <text x="60" y="224" font-size="13.5" fill="#333" filter="url(#rough2)">n = 4（唯一特例，两位推导不适用）：</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="130" y="236" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="190" y="256" fill="#b85450" font-weight="bold">b=2: 100 ✗</text>
  </g>
  <text x="300" y="256" font-size="12.5" fill="#888" filter="url(#rough2)">三位：首 1 ≠ 尾 0</text>

  <!-- n=10^5 -->
  <text x="60" y="292" font-size="13.5" fill="#333" filter="url(#rough2)">n = 100000（约束上界）：</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="130" y="304" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="230" y="324" fill="#b85450" font-weight="bold">b=99998: 12 ✗</text>
  </g>
  <text x="380" y="324" font-size="12.5" fill="#888" filter="url(#rough2)">暴力要查 99996 个进制</text>

  <!-- 总结框 -->
  <g filter="url(#rough2)">
    <rect x="70" y="352" width="420" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="376" text-anchor="middle" font-size="14" fill="#1a2b45" filter="url(#rough2)">任何 n ≥ 5 都写成 1·(n−2) + 2 → 两位 “12”</text>
  <text x="280" y="398" text-anchor="middle" font-size="14" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">位数最少时回文约束最脆：两位要求两数字相等</text>
</svg>
