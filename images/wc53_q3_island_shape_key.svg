<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">同一个键 = 同一种岛（平移不变量）</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">把岛内每格写成「相对锚点的 (dr, dc)」，不同位置的同形岛会得到完全一样的键</text>

  <!-- 网格 A -->
  <g filter="url(#rough2)" stroke="#cfcfcf" stroke-width="1">
    <rect x="40" y="96" width="34" height="34" fill="#ffffff"/><rect x="74" y="96" width="34" height="34" fill="#ffffff"/>
    <rect x="108" y="96" width="34" height="34" fill="#ffffff"/><rect x="142" y="96" width="34" height="34" fill="#ffffff"/>
    <rect x="40" y="130" width="34" height="34" fill="#ffffff"/><rect x="74" y="130" width="34" height="34" fill="#ffffff"/>
    <rect x="108" y="130" width="34" height="34" fill="#ffffff"/><rect x="142" y="130" width="34" height="34" fill="#ffffff"/>
    <rect x="40" y="164" width="34" height="34" fill="#ffffff"/><rect x="74" y="164" width="34" height="34" fill="#ffffff"/>
    <rect x="108" y="164" width="34" height="34" fill="#ffffff"/><rect x="142" y="164" width="34" height="34" fill="#ffffff"/>
    <rect x="40" y="198" width="34" height="34" fill="#ffffff"/><rect x="74" y="198" width="34" height="34" fill="#ffffff"/>
    <rect x="108" y="198" width="34" height="34" fill="#ffffff"/><rect x="142" y="198" width="34" height="34" fill="#ffffff"/>
  </g>
  <text x="108" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">A · 原位置</text>
  <rect x="74" y="130" width="34" height="34" fill="#446688" stroke="#2f4a66" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="91" y="152" text-anchor="middle" font-size="12" fill="#ffffff" filter="url(#rough2)">锚</text>
  <rect x="108" y="130" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="74" y="164" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- 网格 B -->
  <g filter="url(#rough2)" stroke="#cfcfcf" stroke-width="1">
    <rect x="248" y="96" width="34" height="34" fill="#ffffff"/><rect x="282" y="96" width="34" height="34" fill="#ffffff"/>
    <rect x="316" y="96" width="34" height="34" fill="#ffffff"/><rect x="350" y="96" width="34" height="34" fill="#ffffff"/>
    <rect x="248" y="130" width="34" height="34" fill="#ffffff"/><rect x="282" y="130" width="34" height="34" fill="#ffffff"/>
    <rect x="316" y="130" width="34" height="34" fill="#ffffff"/><rect x="350" y="130" width="34" height="34" fill="#ffffff"/>
    <rect x="248" y="164" width="34" height="34" fill="#ffffff"/><rect x="282" y="164" width="34" height="34" fill="#ffffff"/>
    <rect x="316" y="164" width="34" height="34" fill="#ffffff"/><rect x="350" y="164" width="34" height="34" fill="#ffffff"/>
    <rect x="248" y="198" width="34" height="34" fill="#ffffff"/><rect x="282" y="198" width="34" height="34" fill="#ffffff"/>
    <rect x="316" y="198" width="34" height="34" fill="#ffffff"/><rect x="350" y="198" width="34" height="34" fill="#ffffff"/>
  </g>
  <text x="316" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">B · 平移后</text>
  <rect x="282" y="164" width="34" height="34" fill="#4a7a3a" stroke="#33552a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="299" y="186" text-anchor="middle" font-size="12" fill="#ffffff" filter="url(#rough2)">锚</text>
  <rect x="316" y="164" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="282" y="198" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- 网格 C（镜像） -->
  <g filter="url(#rough2)" stroke="#cfcfcf" stroke-width="1">
    <rect x="456" y="96" width="34" height="34" fill="#ffffff"/><rect x="490" y="96" width="34" height="34" fill="#ffffff"/>
    <rect x="524" y="96" width="34" height="34" fill="#ffffff"/><rect x="558" y="96" width="34" height="34" fill="#ffffff"/>
    <rect x="456" y="130" width="34" height="34" fill="#ffffff"/><rect x="490" y="130" width="34" height="34" fill="#ffffff"/>
    <rect x="524" y="130" width="34" height="34" fill="#ffffff"/><rect x="558" y="130" width="34" height="34" fill="#ffffff"/>
    <rect x="456" y="164" width="34" height="34" fill="#ffffff"/><rect x="490" y="164" width="34" height="34" fill="#ffffff"/>
    <rect x="524" y="164" width="34" height="34" fill="#ffffff"/><rect x="558" y="164" width="34" height="34" fill="#ffffff"/>
    <rect x="456" y="198" width="34" height="34" fill="#ffffff"/><rect x="490" y="198" width="34" height="34" fill="#ffffff"/>
    <rect x="524" y="198" width="34" height="34" fill="#ffffff"/><rect x="558" y="198" width="34" height="34" fill="#ffffff"/>
  </g>
  <text x="524" y="90" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">C · 镜像后</text>
  <rect x="490" y="130" width="34" height="34" fill="#b85450" stroke="#8f3f3c" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="507" y="152" text-anchor="middle" font-size="12" fill="#ffffff" filter="url(#rough2)">锚</text>
  <rect x="524" y="130" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="524" y="164" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <path d="M 91 236 L 91 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 299 236 L 299 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 507 236 L 507 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 键盒子 -->
  <rect x="24" y="268" width="184" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="116" y="292" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">键：{(0,0),(0,1),(1,0)}</text>
  <text x="116" y="316" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">共 3 格</text>
  <text x="116" y="340" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">照此写法记作 key(A)</text>

  <text x="220" y="312" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">=</text>

  <rect x="232" y="268" width="184" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="324" y="292" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">键：{(0,0),(0,1),(1,0)}</text>
  <text x="324" y="316" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">与 A 完全相同 → 同形</text>
  <text x="324" y="340" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">平移不改变任何偏移</text>

  <text x="428" y="312" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">≠</text>

  <rect x="440" y="268" width="184" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="532" y="292" text-anchor="middle" font-size="11" fill="#8f3f3c" filter="url(#rough2)">键：{(0,0),(0,1),(1,1)}</text>
  <text x="532" y="316" text-anchor="middle" font-size="11" fill="#8f3f3c" filter="url(#rough2)">多出 (1,1)、少了 (1,0)</text>
  <text x="532" y="340" text-anchor="middle" font-size="11" fill="#8f3f3c" filter="url(#rough2)">镜像不算同形 → 新键</text>

  <rect x="48" y="378" width="544" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="405" text-anchor="middle" font-size="11.5" fill="#7a5a14" filter="url(#rough2)">锚点取「行优先扫描到的第一格」；键相同 ⇔ 平移可重合，旋转 / 翻转都算新形状</text>
</svg>
