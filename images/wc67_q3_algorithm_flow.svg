<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两趟扫描 + 一次合并</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">正序算 up / left，逆序算 down / right，最后逐格取四者最小值</text>

  <rect x="130" y="62" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 建图：全 1，mines 中的坐标置 0</text>

  <path d="M 280 94 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="112" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">② 正序扫描（r 增、c 增）：算 up 与 left</text>

  <path d="M 280 144 L 280 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="162" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">③ 逆序扫描（r 减、c 减）：算 down 与 right</text>

  <path d="M 280 194 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="212" width="300" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">④ 每格 k = min(up, down, left, right)</text>

  <path d="M 280 244 L 280 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="262" width="300" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">⑤ ans = max(ans, k)，继续下一个格子</text>

  <path d="M 280 294 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,312 400,342 280,372 160,342" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">格子还有剩？</text>

  <path d="M 400 342 L 430 342" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="430" y="326" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="482" y="347" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⑥ 返回 ans</text>

  <path d="M 160 342 L 100 342 L 100 228 L 126 228" stroke="#446688" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="112" y="336" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">正确性靠「同行/同列前一格已算完」：正序保证 up、left 依赖的格子已就绪</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">两趟各 O(n²)、合并 O(n²)：总时间 O(n²)，空间 O(n²)（4 张 int 表）</text>
</svg>
