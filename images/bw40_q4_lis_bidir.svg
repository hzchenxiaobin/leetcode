<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：最长「山形子序列」= 以每个 i 为峰，左 LIS[i] + 右 LDS[i] − 1</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">nums = 2 1 1 5 6 2 3 1：正向 LIS 与反向 LIS（即右侧严格递减长度）各扫一遍</text>

  <!-- numbers -->
  <g font-size="12" text-anchor="middle" fill="#999" filter="url(#r)">
    <text x="130" y="86">i=0</text><text x="200" y="86">1</text><text x="270" y="86">2</text><text x="340" y="86">3</text><text x="410" y="86">4</text><text x="480" y="86">5</text><text x="550" y="86">6</text><text x="620" y="86">7</text>
  </g>
  <g filter="url(#r)">
    <rect x="104" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
    <rect x="174" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
    <rect x="244" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
    <rect x="314" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
    <rect x="384" y="94" width="52" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="454" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
    <rect x="524" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
    <rect x="594" y="94" width="52" height="46" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="130" y="123" fill="#666">2</text>
    <text x="200" y="123" fill="#666">1</text>
    <text x="270" y="123" fill="#666">1</text>
    <text x="340" y="123" fill="#666">5</text>
    <text x="410" y="123" fill="#a67c1e">6</text>
    <text x="480" y="123" fill="#666">2</text>
    <text x="550" y="123" fill="#666">3</text>
    <text x="620" y="123" fill="#666">1</text>
  </g>

  <!-- lis row -->
  <g font-size="12.5" fill="#555" filter="url(#r)">
    <text x="60" y="180">lis（正扫）</text>
  </g>
  <g filter="url(#r)">
    <rect x="104" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="174" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="244" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="314" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="384" y="160" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="454" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="524" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="594" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="130" y="182" fill="#33517a">1</text>
    <text x="200" y="182" fill="#33517a">1</text>
    <text x="270" y="182" fill="#33517a">1</text>
    <text x="340" y="182" fill="#33517a">2</text>
    <text x="410" y="182" fill="#a67c1e">3</text>
    <text x="480" y="182" fill="#33517a">2</text>
    <text x="550" y="182" fill="#33517a">3</text>
    <text x="620" y="182" fill="#33517a">1</text>
  </g>

  <!-- lds row -->
  <g font-size="12.5" fill="#555" filter="url(#r)">
    <text x="60" y="242">lds（反扫）</text>
  </g>
  <g filter="url(#r)">
    <rect x="104" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="174" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="244" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="314" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="384" y="222" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="454" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="524" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="594" y="222" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="130" y="244" fill="#3a5c2c">2</text>
    <text x="200" y="244" fill="#3a5c2c">1</text>
    <text x="270" y="244" fill="#3a5c2c">1</text>
    <text x="340" y="244" fill="#3a5c2c">3</text>
    <text x="410" y="244" fill="#a67c1e">3</text>
    <text x="480" y="244" fill="#3a5c2c">2</text>
    <text x="550" y="244" fill="#3a5c2c">2</text>
    <text x="620" y="244" fill="#3a5c2c">1</text>
  </g>

  <!-- mountain shape -->
  <path d="M 130 320 L 130 320" stroke="none"/>
  <path d="M 270 330 L 340 316 L 410 296 L 480 324 L 550 318 L 620 336" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#r)"/>
  <circle cx="410" cy="296" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="410" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">峰 = 6：lis 3 + lds 3 − 1 = 5</text>

  <g filter="url(#r)">
    <rect x="80" y="350" width="540" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="350" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5c2c" filter="url(#r)">峰取 i=4（值 6）：lis+lds−1 = 3+3−1 = 5，如 1,5,6,3,1 → 删除次数 = 8 − 5 = 3 ✓</text>
</svg>
