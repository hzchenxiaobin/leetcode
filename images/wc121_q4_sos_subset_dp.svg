<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">SOS DP：每轮放宽一位，16 轮得到全部子集</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">外层必须是「位」、内层是 mask，否则会重复累加</text>
  <text x="30" y="72" font-size="11.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">SOS DP（3 位示意）：逐位把「δ 为 0」的版本累加</text>
  <text x="30" y="110" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">初始 sub = freq</text>
  <rect x="150" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="173.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(0)</text>
  <rect x="200" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="223.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(1)</text>
  <rect x="250" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="273.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(2)</text>
  <rect x="300" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="323.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(3)</text>
  <rect x="350" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="373.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(4)</text>
  <rect x="400" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="423.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(5)</text>
  <rect x="450" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="473.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(6)</text>
  <rect x="500" y="88" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="523.0" y="108.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f(7)</text>
  <text x="30" y="178" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 0 位后</text>
  <rect x="150" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="173.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f0</text>
  <rect x="200" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="223.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f0+f1</text>
  <rect x="250" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="273.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f2</text>
  <rect x="300" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="323.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f2+f3</text>
  <rect x="350" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="373.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f4</text>
  <rect x="400" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="423.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f4+f5</text>
  <rect x="450" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="473.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f6</text>
  <rect x="500" y="156" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="523.0" y="176.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f6+f7</text>
  <text x="30" y="246" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 1 位后</text>
  <rect x="150" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="173.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f0</text>
  <rect x="200" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="223.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f0+f1</text>
  <rect x="250" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="273.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f0+f2</text>
  <rect x="300" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="323.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">…</text>
  <rect x="350" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="373.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f4</text>
  <rect x="400" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="423.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f4+f5</text>
  <rect x="450" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="473.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f4+f6</text>
  <rect x="500" y="224" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="523.0" y="244.42" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">…</text>
  <text x="30" y="300" font-size="11.5" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">第 2 位后：sub[v] = 所有「v 的子集」的 freq 之和</text>
  <text x="30" y="322" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">16 位值域下共 16 轮 × 65536 次加法 ≈ 10^6</text>
</svg>
