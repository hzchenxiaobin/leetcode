<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 338"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="338" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">每个矩形会被 4 个直角顶点各枚举一次</text>
  <rect x="160" y="80" width="240" height="160" rx="2" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="160" cy="80" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="62" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">B₁</text>
  <circle cx="400" cy="80" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="62" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">B₂</text>
  <circle cx="400" cy="240" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">B₃</text>
  <circle cx="160" cy="240" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#33475b" font-weight="bold" filter="url(#rough2)">B₄</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">以 B 为直角顶点、A/C 为两条邻边端点 → 第四点 D 由 A + C − B 算出</text>
  <rect x="60" y="284" width="440" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">总枚举量 O(n³)：n = 50 时约 1.25×10⁵ 次</text>
</svg>
