<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="520" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：一次操作 = ± 2^i，求最少项数</text>
  <path d="M 170 44 Q 340 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="66" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">k 次操作把 n 变 0 ⟺ n 写成 k 个带符号 2 的幂之和（见 §5 引理 1）</text>

  <!-- 顶部等价关系横幅 -->
  <g filter="url(#rough2)">
    <rect x="46" y="80" width="596" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="104" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">n = ε₁·2^i₁ + ε₂·2^i₂ + ⋯ + ε_k·2^i_k，其中 ε_j ∈ {+1, −1}</text>
  <text x="340" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最少操作数 = 满足上式的最小 k，即「带符号二进制表示」的最小权重</text>

  <!-- 对比区标题 -->
  <text x="46" y="168" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">连续 1 段怎么消最省？以 39 = 100111₂ 的低位段「111」为例：</text>

  <!-- 左面板：逐位减（红） -->
  <g filter="url(#rough2)">
    <rect x="46" y="182" width="286" height="158" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="189" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">逐位减：一个 1 花一次</text>
  <text x="76" y="234" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">39 =</text>
  <g filter="url(#rough2)">
    <rect x="82" y="216" width="34" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <rect x="118" y="216" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="154" y="216" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="190" y="216" width="34" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <rect x="226" y="216" width="34" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <rect x="262" y="216" width="34" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#333">
    <text x="99" y="235" font-weight="bold">1</text>
    <text x="135" y="235" fill="#999">0</text>
    <text x="171" y="235" fill="#999">0</text>
    <text x="207" y="235" font-weight="bold">1</text>
    <text x="243" y="235" font-weight="bold">1</text>
    <text x="279" y="235" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" fill="#8f3a36">
    <text x="99" y="272">−2⁵</text>
    <text x="207" y="272">−2²</text>
    <text x="243" y="272">−2¹</text>
    <text x="279" y="272">−2⁰</text>
  </g>
  <text x="189" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">共 4 次（每个 1 各减一次）</text>

  <!-- 右面板：进位塌缩（绿） -->
  <g filter="url(#rough2)">
    <rect x="348" y="182" width="286" height="158" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="491" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">＋1 进位：整段塌缩</text>
  <text x="378" y="234" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">39 =</text>
  <g filter="url(#rough2)">
    <rect x="384" y="216" width="34" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="420" y="216" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="456" y="216" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="492" y="216" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="528" y="216" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="564" y="216" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#333">
    <text x="401" y="235">1</text>
    <text x="437" y="235" fill="#999">0</text>
    <text x="473" y="235" fill="#999">0</text>
    <text x="509" y="235" font-weight="bold">1</text>
    <text x="545" y="235" font-weight="bold">1</text>
    <text x="581" y="235" font-weight="bold">1</text>
  </g>
  <path d="M 581 246 L 581 262" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07310" filter="url(#rough2)">＋2⁰</text>
  <text x="378" y="286" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">40 =</text>
  <g filter="url(#rough2)">
    <rect x="384" y="268" width="34" height="28" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="420" y="268" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="456" y="268" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="492" y="268" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="528" y="268" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="564" y="268" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#333">
    <text x="401" y="287">1</text>
    <text x="437" y="287" fill="#999">0</text>
    <text x="473" y="287" font-weight="bold" fill="#b07310">1</text>
    <text x="509" y="287" fill="#999">0</text>
    <text x="545" y="287" fill="#999">0</text>
    <text x="581" y="287" fill="#999">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" fill="#2e5a24">
    <text x="401" y="312">−2⁵</text>
    <text x="473" y="312">−2³</text>
  </g>
  <text x="491" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">1 次进位 + 2 次消位 = 3 次</text>

  <!-- 底部警示：桥接 -->
  <g filter="url(#rough2)">
    <rect x="46" y="356" width="596" height="142" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="344" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6210" filter="url(#rough2)">⚠ 别静态数「1 的段数」——进位会桥接只隔一个 0 的相邻段</text>
  <g filter="url(#rough2)">
    <rect x="56" y="394" width="110" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="111" y="414" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">110110</text>
  <path d="M 168 409 L 212 409" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07310" filter="url(#rough2)">＋2¹</text>
  <g filter="url(#rough2)">
    <rect x="216" y="394" width="110" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="271" y="414" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">111000</text>
  <path d="M 328 409 L 372 409" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07310" filter="url(#rough2)">＋2³</text>
  <g filter="url(#rough2)">
    <rect x="376" y="394" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="436" y="414" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1000000</text>
  <path d="M 498 409 L 542 409" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">−2⁶</text>
  <g filter="url(#rough2)">
    <rect x="546" y="394" width="44" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="568" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">0</text>
  <text x="344" y="452" text-anchor="middle" font-size="11.5" fill="#8a6210" filter="url(#rough2)">54 = 110110₂：＋2¹ 让低位段「11」塌缩，进位恰好落在两段之间唯一的 0 上，两段焊成「111」</text>
  <text x="344" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6210" filter="url(#rough2)">两段 1 ≠ 2 + 2 次：54 只要 3 次（＋2、＋8、−64）</text>
</svg>
