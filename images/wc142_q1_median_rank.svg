<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">中位数：在计数前缀上定位第 rank 个元素</text>
  <text x="320.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P(k) 单调不减，找最小的 k 使 P(k) ≥ rank</text>

  <rect x="70" y="96" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="112.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="112.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[1]</text>
  <rect x="170" y="96" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="212.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="212.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[2]</text>
  <rect x="270" y="96" width="84" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="312.0" y="123.0" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="312.0" y="142.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">count[3]</text>
  <rect x="70" y="206" width="84" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="112.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="112.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">P(k) 累计</text>
  <rect x="170" y="206" width="84" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="212.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="212.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">P(k) 累计</text>
  <rect x="270" y="206" width="84" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="312.0" y="231.0" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="312.0" y="248.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">P(k) 累计</text>
  <path d="M 112 152 L 112 200" stroke="#78909c" stroke-width="1.4" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 212 152 L 212 200" stroke="#78909c" stroke-width="1.4" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 312 152 L 312 200" stroke="#78909c" stroke-width="1.4" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <rect x="392" y="84" width="200" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="404" y="104" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">中位数的 rank</text>
  <text x="404" y="121" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">N = 8（偶）→ rank 4 与 5</text>
  <text x="404" y="138" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">奇数 N 只取 (N+1)/2</text>
  <text x="404" y="155" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">rank 从 1 开始计</text>
  <rect x="392" y="212" width="200" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="404" y="232" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">查表结果</text>
  <text x="404" y="249" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">kth(4) = 2</text>
  <text x="404" y="266" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">kth(5) = 3</text>
  <text x="404" y="283" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">median = (2+3)/2 = 2.5</text>
  <text x="24" y="330" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">kth(rank)：从 k = 0 起累加 count[k]，首个 acc ≥ rank 的 k 即排序后第 rank 个元素。</text>
  <text x="24" y="354" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">P(k) = Σ_{j≤k} count[j] 就是「≤ k 的元素个数」，于是定位不需要任何真实的元素展开。</text>
  <text x="24" y="364" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">整个定位过程 O(256)，与样本总量 N（可达 1e9）无关。</text>
</svg>
