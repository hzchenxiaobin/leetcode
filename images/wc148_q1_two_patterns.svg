<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">锯齿数组的两种模式：偶峰 vs 奇峰</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只能递减 → 波峰保持原值，把波谷压到「邻居最小值 − 1」</text>

  <rect x="30" y="66" width="240" height="152" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="86" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">模式 A：偶数下标是波峰</text>

  <rect x="60" y="118" width="24" height="78" fill="#446688" stroke="#2f4a66" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="95" y="156" width="24" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="130" y="108" width="24" height="88" fill="#446688" stroke="#2f4a66" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="165" y="152" width="24" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="126" width="24" height="70" fill="#446688" stroke="#2f4a66" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <path d="M 55 196 L 235 196" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="72" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0峰</text>
  <text x="107" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1谷</text>
  <text x="142" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2峰</text>
  <text x="177" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3谷</text>
  <text x="212" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4峰</text>

  <rect x="290" y="66" width="240" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="304" y="86" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">模式 B：奇数下标是波峰</text>

  <rect x="320" y="156" width="24" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="112" width="24" height="84" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="154" width="24" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="425" y="106" width="24" height="90" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="460" y="148" width="24" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <path d="M 315 196 L 490 196" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="332" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0谷</text>
  <text x="367" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1峰</text>
  <text x="402" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2谷</text>
  <text x="437" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3峰</text>
  <text x="472" y="211" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4谷</text>

  <rect x="30" y="234" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="256" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">偶峰：A[0] &gt; A[1] &lt; A[2] &gt; A[3] &lt; ...　　奇峰：A[0] &lt; A[1] &gt; A[2] &lt; A[3] &gt; ...</text>
  <text x="44" y="274" font-size="10" fill="#555" filter="url(#rough2)">两种模式互斥、只需满足其一：分别求成本，答案取较小者，各 O(n) 扫描即可</text>
  <text x="44" y="290" font-size="10" fill="#555" filter="url(#rough2)">同一模式内波峰互为「邻居」而非约束对象，因此波谷可以逐个压低、互不干扰</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 nums = [9,6,1,6,2]：偶峰需 12 次，奇峰需 4 次 → 答案 4</text>
</svg>
