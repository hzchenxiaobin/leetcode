<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="409" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">阈值分层：min(a, b) = 两条线共同拥有的“层数”</text>
  <path d="M 130 40 Q 320 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- shared layer region (t = 1..5) behind the two bars -->
  <g filter="url(#sk)">
    <rect x="94" y="150" width="142" height="130" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5 4" rx="4"/>
  </g>
  <!-- bars a=7 (blue) and b=5 (orange), unit layer = 26px, baseline y=280 -->
  <g filter="url(#sk)">
    <rect x="100" y="98" width="52" height="182" fill="#e8f0fa" stroke="#446688" stroke-width="2" rx="3"/>
    <rect x="178" y="150" width="52" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
  </g>
  <text x="126" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">a = 7</text>
  <text x="204" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a20">b = 5</text>
  <!-- layer dashed lines -->
  <g filter="url(#sk)">
    <path d="M 94 254 L 236 254" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 94 228 L 236 228" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 94 202 L 236 202" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 94 176 L 236 176" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 94 150 L 236 150" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 94 124 L 236 124" stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 94 98  L 236 98"  stroke="#999" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 90 280 L 240 280" stroke="#3a3a3a" stroke-width="1.6" fill="none"/>
  </g>
  <g font-size="11" fill="#666" text-anchor="end">
    <text x="88" y="258">t=1</text>
    <text x="88" y="232">t=2</text>
    <text x="88" y="206">t=3</text>
    <text x="88" y="180">t=4</text>
    <text x="88" y="154">t=5</text>
    <text x="88" y="128">t=6</text>
    <text x="88" y="102">t=7</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 236 296 Q 220 290 210 272" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="165" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">共同 5 层 → min(7, 5) = 5</text>

  <!-- right: identity + layer table -->
  <text x="300" y="86" font-size="13.5" font-weight="bold" fill="#2b2b2b">min(a, b) = Σ<tspan font-size="10" baseline-shift="sub">t≥1</tspan> [a≥t]·[b≥t]</text>
  <text x="300" y="112" font-size="13" font-weight="bold" fill="#2b6e9e">把所有配对按层翻转：Σ<tspan font-size="10" baseline-shift="sub">对</tspan> min = Σ<tspan font-size="10" baseline-shift="sub">t=1..C</tspan> H≥(t) · V≥(t)</text>
  <g filter="url(#sk)">
    <rect x="300" y="130" width="46" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="346" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="383" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="420" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="457" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="494" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="531" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="568" y="130" width="37" height="26" fill="#f2f2ee" stroke="#aaa" stroke-width="1" rx="3"/>
    <rect x="346" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="383" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="420" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="457" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="494" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="531" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="568" y="156" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="346" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="383" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="420" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="457" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="494" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="531" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="568" y="182" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="346" y="208" width="37" height="26" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4" rx="3"/>
    <rect x="383" y="208" width="37" height="26" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4" rx="3"/>
    <rect x="420" y="208" width="37" height="26" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4" rx="3"/>
    <rect x="457" y="208" width="37" height="26" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4" rx="3"/>
    <rect x="494" y="208" width="37" height="26" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4" rx="3"/>
    <rect x="531" y="208" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="568" y="208" width="37" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="323" y="147" fill="#666" font-weight="bold">t</text>
    <text x="364" y="147" fill="#666">1</text>
    <text x="401" y="147" fill="#666">2</text>
    <text x="438" y="147" fill="#666">3</text>
    <text x="475" y="147" fill="#666">4</text>
    <text x="512" y="147" fill="#666">5</text>
    <text x="549" y="147" fill="#666">6</text>
    <text x="586" y="147" fill="#666">7</text>
    <text x="323" y="173" fill="#446688" font-weight="bold">H≥</text>
    <text x="364" y="173" fill="#446688">3</text>
    <text x="401" y="173" fill="#446688">1</text>
    <text x="438" y="173" fill="#446688">1</text>
    <text x="475" y="173" fill="#446688">1</text>
    <text x="512" y="173" fill="#446688">1</text>
    <text x="549" y="173" fill="#446688">1</text>
    <text x="586" y="173" fill="#446688">1</text>
    <text x="323" y="199" fill="#a06a20" font-weight="bold">V≥</text>
    <text x="364" y="199" fill="#a06a20">2</text>
    <text x="401" y="199" fill="#a06a20">2</text>
    <text x="438" y="199" fill="#a06a20">2</text>
    <text x="475" y="199" fill="#a06a20">1</text>
    <text x="512" y="199" fill="#a06a20">1</text>
    <text x="549" y="199" fill="#a06a20">0</text>
    <text x="586" y="199" fill="#a06a20">0</text>
    <text x="323" y="225" fill="#2e6e2e" font-weight="bold">积</text>
    <text x="364" y="225" fill="#2e6e2e" font-weight="bold">6</text>
    <text x="401" y="225" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="438" y="225" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="475" y="225" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="512" y="225" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="549" y="225" fill="#888">0</text>
    <text x="586" y="225" fill="#888">0</text>
  </g>
  <text x="300" y="258" font-size="12.5" font-weight="bold" fill="#2e6e2e">Σ = 6+2+2+1+1+0+0 = 12 ✓（与逐对取 min 完全一致）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="308" width="560" height="72" rx="8" fill="#fff4e4" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="12.5" fill="#a06a20">开销 ≤ 10³（C=1000）→ 两个后缀计数“桶”从高到低一趟扫出 H≥(t)、V≥(t)</text>
  <text x="320" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a20">总复杂度 O(m+n+C)，连排序都省掉 —— II 版独有的小值域福利</text>
</svg>
