<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：BST 的中序遍历天然升序</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两棵树各产出一条有序流，再做一次二路归并，全程 O(n₁ + n₂)</text>

  <text x="70" y="76" font-size="10.5" fill="#446688" filter="url(#rough2)">root1 = [2,1,4]</text>
  <path d="M 112 104 L 74 148" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 112 104 L 150 148" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="112" cy="104" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="74" cy="148" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="150" cy="148" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="109" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <text x="74" y="153" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="150" y="153" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">4</text>

  <path d="M 176 126 H 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="100" font-size="10" fill="#446688" filter="url(#rough2)">流 A（升序）</text>
  <rect x="224" y="112" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="258" y="112" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="292" y="112" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="239" y="130" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="273" y="130" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="307" y="130" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">4</text>

  <text x="70" y="200" font-size="10.5" fill="#446688" filter="url(#rough2)">root2 = [1,0,3]</text>
  <path d="M 112 228 L 74 272" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 112 228 L 150 272" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="112" cy="228" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="74" cy="272" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="150" cy="272" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="233" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="74" y="277" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <text x="150" y="277" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">3</text>

  <path d="M 176 250 H 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="224" font-size="10" fill="#446688" filter="url(#rough2)">流 B（升序）</text>
  <rect x="224" y="236" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="258" y="236" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="292" y="236" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="239" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="273" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="307" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3</text>

  <path d="M 324 125 H 338 V 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 324 249 H 356 V 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="300" width="340" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="322" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">二路归并：比较两流头部，取较小者输出</text>
  <text x="128" y="342" font-size="10.5" fill="#555" filter="url(#rough2)">两流都走完，就得到全部 n₁ + n₂ 个元素的升序序列</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同一思路可推广到 k 棵 BST：k 路归并（小顶堆）</text>
</svg>
