<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：'i' 不搬数据，只翻转方向标志</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- brute force -->
  <g filter="url(#sk)"><rect x="100" y="56" width="440" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="320" y="77" text-anchor="middle" font-size="12" fill="#9e3b38">暴力：每遇 'i' 就整体 reverse()，单次 O(n)，最坏 O(n²)</text>

  <!-- deque -->
  <text x="320" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">屏幕内容 = 双端队列 dq + 方向标志 flag</text>
  <text x="262" y="128" text-anchor="middle" font-size="10.5" fill="#888">头 front</text>
  <text x="438" y="128" text-anchor="middle" font-size="10.5" fill="#888">尾 back</text>
  <g filter="url(#sk)">
    <rect x="240" y="134" width="44" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <rect x="284" y="134" width="44" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <rect x="328" y="134" width="44" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <rect x="372" y="134" width="44" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <rect x="416" y="134" width="44" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#333" filter="url(#sk)">
    <text x="262" y="159" text-anchor="middle">g</text>
    <text x="306" y="159" text-anchor="middle">n</text>
    <text x="350" y="159" text-anchor="middle">s</text>
    <text x="394" y="159" text-anchor="middle">t</text>
    <text x="438" y="159" text-anchor="middle">r</text>
  </g>
  <path d="M 170 154 L 232 154" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="200" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">push_front</text>
  <path d="M 530 154 L 468 154" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="500" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">push_back</text>

  <!-- two modes -->
  <g filter="url(#sk)"><rect x="50" y="196" width="540" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#2b6e9e">flag = → 正向：新字符 push_back 进尾端；屏幕 = dq 从左往右读</text>
  <g filter="url(#sk)"><rect x="50" y="242" width="540" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#2e6e2e">flag = ← 反向：新字符 push_front 进头端；屏幕 = dq 从右往左读</text>

  <!-- insight -->
  <g filter="url(#sk)"><rect x="50" y="292" width="540" height="46" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="320" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">遇到 'i'：只做 flag = !flag（O(1)）——「惰性反转」</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#8a6a2b">连续的 'i' 两两抵消（反转偶数次 = 没反转）</text>

  <!-- invariant -->
  <g filter="url(#sk)"><rect x="50" y="348" width="540" height="24" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/></g>
  <text x="320" y="365" text-anchor="middle" font-size="10.5" fill="#888">不变量：任意时刻，屏幕内容 = 按当前 flag 方向读 dq（证明见正文 §5）</text>
</svg>
