<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：偶数 ∩ 被 3 整除 ⇔ 被 6 整除</text>
  <path d="M 150 40 Q 280 48 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- callout: both conditions hit -->
  <g filter="url(#rough2)">
    <rect x="288" y="52" width="238" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="407" y="73" text-anchor="middle" font-size="13" fill="#3a6a2a" font-weight="bold">同时命中 ⇔ x % 6 == 0</text>
  <path d="M 350 86 Q 280 100 224 112" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 460 86 Q 430 100 400 112" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- orange ticks above multiples of 3 -->
  <g stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)">
    <path d="M 124 108 L 130 98 L 136 108"/>
    <path d="M 214 108 L 220 98 L 226 108"/>
    <path d="M 304 108 L 310 98 L 316 108"/>
    <path d="M 394 108 L 400 98 L 406 108"/>
    <path d="M 484 108 L 490 98 L 496 108"/>
  </g>

  <!-- number line cells 1..15 -->
  <g filter="url(#rough2)">
    <rect x="55" y="116" width="450" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="55" y="116" width="450" height="34" fill="none" stroke="#555" stroke-width="1.4"/>
  </g>
  <!-- internal grid lines -->
  <g stroke="#aaa" stroke-width="1" filter="url(#rough2)">
    <path d="M 85 116 v34"/><path d="M 115 116 v34"/><path d="M 145 116 v34"/>
    <path d="M 175 116 v34"/><path d="M 205 116 v34"/><path d="M 235 116 v34"/>
    <path d="M 265 116 v34"/><path d="M 295 116 v34"/><path d="M 325 116 v34"/>
    <path d="M 355 116 v34"/><path d="M 385 116 v34"/><path d="M 415 116 v34"/>
    <path d="M 445 116 v34"/><path d="M 475 116 v34"/>
  </g>
  <!-- hit cells 6 and 12 -->
  <g filter="url(#rough2)">
    <rect x="205" y="116" width="30" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="385" y="116" width="30" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <!-- numbers -->
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="70" y="138">1</text><text x="100" y="138">2</text><text x="130" y="138">3</text>
    <text x="160" y="138">4</text><text x="190" y="138">5</text>
    <text x="220" y="138" fill="#2e6e2e" font-weight="bold" font-size="14">6</text>
    <text x="250" y="138">7</text><text x="280" y="138">8</text><text x="310" y="138">9</text>
    <text x="340" y="138">10</text><text x="370" y="138">11</text>
    <text x="400" y="138" fill="#2e6e2e" font-weight="bold" font-size="14">12</text>
    <text x="430" y="138">13</text><text x="460" y="138">14</text><text x="490" y="138">15</text>
  </g>

  <!-- blue dots below evens -->
  <g fill="#446688" filter="url(#rough2)">
    <circle cx="100" cy="166" r="4.5"/><circle cx="160" cy="166" r="4.5"/>
    <circle cx="220" cy="166" r="4.5"/><circle cx="280" cy="166" r="4.5"/>
    <circle cx="340" cy="166" r="4.5"/><circle cx="400" cy="166" r="4.5"/>
    <circle cx="460" cy="166" r="4.5"/>
  </g>
  <text x="505" y="170" font-size="11" fill="#446688">← 偶数</text>
  <text x="505" y="104" font-size="11" fill="#d6a040">← 3 的倍数</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="45" y="192" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="66" y="204" font-size="12" fill="#446688">偶数（2 的倍数）</text>
  <g filter="url(#rough2)">
    <path d="M 228 206 L 234 196 L 240 206" stroke="#d6a040" stroke-width="2.2" fill="none"/>
  </g>
  <text x="248" y="204" font-size="12" fill="#b88030">3 的倍数</text>
  <g filter="url(#rough2)">
    <rect x="330" y="192" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="351" y="204" font-size="12" fill="#3a6a2a">交集 = 6 的倍数</text>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="50" y="228" width="460" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="252" text-anchor="middle" font-size="14" fill="#8a5f14" font-weight="bold"
        font-family="monospace">x % 2 == 0 且 x % 3 == 0  ⇔  x % 6 == 0</text>
  <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#8a5f14">2 与 3 互素，lcm(2, 3) = 6，两次取模折叠成一次</text>

  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#888">1..15 中仅 6、12 同时落在两个集合里（绿色格子）</text>
</svg>
