<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：沿 target 把 BST「剪」成两棵子树</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同侧父子边必须原地保留，跨过 target 的边断开后交给父层重新挂接</text>

  <!-- 边：先画线，再画圆覆盖端点 -->
  <path d="M 280 95 L 180 170" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 280 95 L 380 170" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 180 170 L 125 245" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 180 170 L 235 245" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 380 170 L 325 245" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 380 170 L 435 245" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 大树一侧（蓝）：4, 6, 3, 5, 7 -->
  <circle cx="280" cy="95" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="380" cy="170" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="175" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">6</text>
  <circle cx="235" cy="245" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="250" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="325" cy="245" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="250" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">5</text>
  <circle cx="435" cy="245" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="250" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">7</text>

  <!-- 小树一侧（绿）：2, 1 -->
  <circle cx="180" cy="170" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="175" text-anchor="middle" font-size="13" fill="#33552c" filter="url(#rough2)">2</text>
  <circle cx="125" cy="245" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="250" text-anchor="middle" font-size="13" fill="#33552c" filter="url(#rough2)">1</text>

  <!-- 分组标签 -->
  <rect x="62" y="286" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="118" y="304" text-anchor="middle" font-size="10.5" fill="#33552c" filter="url(#rough2)">小树 {1, 2}</text>
  <rect x="322" y="286" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="392" y="304" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">大树 {3, 4, 5, 6, 7}</text>

  <!-- 图例 -->
  <path d="M 120 340 L 164 340" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="344" font-size="10" fill="#33552c" filter="url(#rough2)">保留：父子同侧</text>
  <path d="M 300 340 L 344 340" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="350" y="344" font-size="10" fill="#8a3a36" filter="url(#rough2)">断开：父子跨侧</text>

  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">断边的两侧节点各自成为本侧的「最上层节点」，由递归返回值交给父层重新挂接</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">target = 2 时 4→2、2→3 两条边断裂，其余边一根不动</text>
</svg>
