<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">代价公式：Σ |原位 - 目标位|（同一奇偶性内部保序最优）</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">相邻交换的最小次数 = 逆序对 = 逐元素位移之和</text>
  <rect x="40" y="58" width="520" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="85.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">把某一组元素按原顺序对到目标位置 0,2,4,...：总距离 = Σ |pos[t] - 2t|</text>
  <rect x="40" y="122" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100.0" y="140.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">元素（偶）</text>
  <rect x="160" y="122" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210.0" y="140.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">原位</text>
  <rect x="260" y="122" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="310.0" y="140.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">目标位</text>
  <rect x="360" y="122" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410.0" y="140.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">距离</text>
  <rect x="40" y="150" width="120" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="160" y="150" width="100" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="260" y="150" width="100" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="360" y="150" width="100" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="40" y="178" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="160" y="178" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="260" y="178" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="360" y="178" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="40" y="206" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="224.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="160" y="206" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="224.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="260" y="206" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="224.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="360" y="206" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410.0" y="224.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="40" y="232" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="254.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">合计 0 + 1 + 2 = 3，正好等于示例 1 的答案</text>
  <text x="300.0" y="274.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">为什么「同一奇偶性内部保序」最优：交叉对调会引入额外逆序对，不会更优</text>
  <text x="40" y="322" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">目标位 0,2,4 只是「偶数打头」图案；奇数打头时改成 1,3,5</text>
</svg>
