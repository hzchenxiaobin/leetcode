<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例回放：search → rent → report → drop → search</text>

  <!-- 步骤 1 -->
  <text x="60" y="66" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① search(1)：avail[1] 的最小端</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="204" y="78" width="140" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="348" y="78" width="140" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="130" y="97">(4, 商店1)</text><text x="274" y="97">(5, 商店0)</text><text x="418" y="97">(5, 商店2)</text>
  </g>
  <text x="508" y="97" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">→ [1,0,2]</text>
  <text x="130" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最便宜</text>
  <text x="296" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同价 5 → 按商店编号排 0 在 2 前</text>

  <!-- 步骤 2 -->
  <text x="60" y="156" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② rent(0,1)、rent(1,2) 后：rented =</text>
  <g filter="url(#rough2)">
    <rect x="60" y="168" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="244" y="168" width="180" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="150" y="187">(5, 商店0, 电影1)</text><text x="334" y="187">(7, 商店1, 电影2)</text>
  </g>

  <!-- 步骤 3 -->
  <text x="60" y="224" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">③ report()：取 rented 最小端前 5</text>
  <g filter="url(#rough2)">
    <rect x="60" y="238" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="160" y="259" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">→ [[0,1], [1,2]]</text>
  <text x="290" y="259" font-size="11" fill="#888" filter="url(#rough2)">5 &lt; 7：价格主导排序</text>

  <!-- 步骤 4 -->
  <text x="60" y="296" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">④ drop(1,2)：电影 2 回到柜台</text>
  <path d="M 334 200 C 380 232 420 240 440 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 步骤 5 -->
  <text x="60" y="326" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">⑤ search(2)：avail[2] =</text>
  <g filter="url(#rough2)">
    <rect x="60" y="338" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="204" y="338" width="140" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="130" y="357">(6, 商店0)</text><text x="274" y="357">(7, 商店1) 刚还回</text>
  </g>
  <text x="440" y="357" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">→ [0, 1]</text>

  <!-- 底部 -->
  <g filter="url(#rough2)">
    <rect x="60" y="380" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="280" y="401" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">与官方输出 [1,0,2] / [[0,1],[1,2]] / [0,1] 逐项一致</text>
</svg>
