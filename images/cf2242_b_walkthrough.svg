<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 434"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="660" height="434" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    10 组官方样例走查：候选 i 与它的后缀最小值 M_i
  </text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    M_i = min(f_(i+1), …, f_(n−1))；命中条件：g_i ≥ 0 且 M_i ≤ f_i（取 i 从大到小扫，先命中的即终点）
  </text>
  <rect x="26" y="58" width="608" height="32" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="43" y="79" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">#</text>
  <text x="346" y="79" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">g_i ≥ 0 的 i</text>
  <text x="471" y="79" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">命中：f_i 与 M_i</text>
  <text x="595" y="79" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">答案</text>
  <text x="66" y="79" font-size="11.5" fill="#333" filter="url(#rough2)">数组 a</text>
  <rect x="26" y="90" width="608" height="30" rx="4" fill="#eef7f0" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="66" y="110" font-size="10.5" fill="#333" filter="url(#rough2)">2 1 1 3 3 1 2 3</text>
  <text x="346" y="110" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2 3 4 6</text>
  <text x="471" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=6：−2 ≥ −3</text>
  <rect x="573" y="94" width="46" height="21" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">YES</text>
  <rect x="26" y="122" width="608" height="30" rx="4" fill="#fdf2f5" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="66" y="142" font-size="10.5" fill="#333" filter="url(#rough2)">2 1 3 3 3 2 3</text>
  <text x="346" y="142" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="471" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=2：−2 &lt; −1</text>
  <rect x="573" y="126" width="46" height="21" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">NO</text>
  <rect x="26" y="154" width="608" height="30" rx="4" fill="#fdf2f5" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="174" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="66" y="174" font-size="10.5" fill="#333" filter="url(#rough2)">1 3 3 2</text>
  <text x="346" y="174" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 2</text>
  <text x="471" y="174" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=1,2 均失败</text>
  <rect x="573" y="158" width="46" height="21" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="174" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">NO</text>
  <rect x="26" y="186" width="608" height="30" rx="4" fill="#fdf2f5" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="206" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="66" y="206" font-size="10.5" fill="#333" filter="url(#rough2)">2 2 2 1 1 1</text>
  <text x="346" y="206" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">无</text>
  <text x="471" y="206" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">无候选 i</text>
  <rect x="573" y="190" width="46" height="21" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">NO</text>
  <rect x="26" y="218" width="608" height="30" rx="4" fill="#eef7f0" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="238" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="66" y="238" font-size="10.5" fill="#333" filter="url(#rough2)">3 2 1 2 1 1 2 3</text>
  <text x="346" y="238" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">6</text>
  <text x="471" y="238" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=6：−4 ≥ −5</text>
  <rect x="573" y="222" width="46" height="21" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">YES</text>
  <rect x="26" y="250" width="608" height="30" rx="4" fill="#fdf2f5" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="270" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="66" y="270" font-size="10.5" fill="#333" filter="url(#rough2)">2 1 2</text>
  <text x="346" y="270" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">无</text>
  <text x="471" y="270" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">无候选 i</text>
  <rect x="573" y="254" width="46" height="21" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">NO</text>
  <rect x="26" y="282" width="608" height="30" rx="4" fill="#eef7f0" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="302" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="66" y="302" font-size="10.5" fill="#333" filter="url(#rough2)">1 2 3</text>
  <text x="346" y="302" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="471" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=1：−1 ≥ −2</text>
  <rect x="573" y="286" width="46" height="21" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">YES</text>
  <rect x="26" y="314" width="608" height="30" rx="4" fill="#eef7f0" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="334" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="66" y="334" font-size="10.5" fill="#333" filter="url(#rough2)">1 3 3 1 1</text>
  <text x="346" y="334" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 2</text>
  <text x="471" y="334" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=1 失败，i=2：0 ≥ 0</text>
  <rect x="573" y="318" width="46" height="21" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="334" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">YES</text>
  <rect x="26" y="346" width="608" height="30" rx="4" fill="#eef7f0" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="366" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">9</text>
  <text x="66" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">1 1 3 3 1</text>
  <text x="346" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 2 3</text>
  <text x="471" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=1：−1 ≥ −2</text>
  <rect x="573" y="350" width="46" height="21" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="366" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">YES</text>
  <rect x="26" y="378" width="608" height="30" rx="4" fill="#fdf2f5" stroke="#d8d8d8"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="43" y="398" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">10</text>
  <text x="66" y="398" font-size="10.5" fill="#333" filter="url(#rough2)">1 3 1</text>
  <text x="346" y="398" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="471" y="398" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i=1：−1 &lt; 0</text>
  <rect x="573" y="382" width="46" height="21" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="596" y="398" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">NO</text>
  <text x="330" y="426" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">
    第 8 组是最左贪心的反例：i=1 时 M_1 = 0 &gt; f_1 = −1，但 i=2 就能切成 [1,3] [3,1] [1] → 必须枚举全部候选 i
  </text>
</svg>
