<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="356" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">先把 word 按相同的连续字符切段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">word = "abbcccc"，切成 a | bb | cccc 三段，长度为 1, 2, 4</text>

  <rect x="60" y="66" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="91" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold">a</text>
  <text x="90" y="120" text-anchor="middle" font-size="10" fill="#888">1 个</text>

  <rect x="160" y="66" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="91" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold">b b</text>
  <text x="200" y="120" text-anchor="middle" font-size="10" fill="#888">2 个</text>

  <rect x="280" y="66" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="350" y="91" text-anchor="middle" font-size="15" fill="#8a6a20" font-weight="bold">c c c c</text>
  <text x="350" y="120" text-anchor="middle" font-size="10" fill="#888">4 个</text>

  <text x="470" y="91" text-anchor="middle" font-size="10.5" fill="#666">段内字符必须相同</text>
  <text x="470" y="110" text-anchor="middle" font-size="10.5" fill="#666">段的顺序不会变</text>

  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="156" width="480" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">关键观察：原本想输入的串，每段的长度只会 ≤ 现在的长度</text>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#555">因为「按太久」只会多打，不会少打；且 Alice 至多犯错一次</text>
  <text x="280" y="216" text-anchor="middle" font-size="10.5" fill="#555">⇒ 最多只有一段被缩短，其余各段长度必须保持原样</text>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" fill="#8a3a36">注意第 1 段的长度是 1，已经无法再短，所以它不可能成为被缩短的那一段</text>

  <path d="M 280 248 L 280 264" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="270" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">方案数 = 1 + Σ (c_i − 1) = n − 段数 + 1</text>

  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#666">+1 是「一次都没犯错」；每段贡献 c_i − 1 是「这一段被缩短成 1 到 c_i − 1 个」</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#888">不同段被缩短、或同一段缩到不同长度，得到的原串一定不同 ⇒ 不会重复计数</text>
</svg>
