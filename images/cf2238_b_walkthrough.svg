<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：n = 20，8 个块累加得到 612
  </text>
  <text x="350" y="54" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    每块贡献 = 段长 × q²；累计列就是 ans 的中间值
  </text>

  <rect x="40" y="68" width="620" height="32" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="89" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">块 [l, r]</text>
  <text x="250" y="89" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">q = ⌊20/b⌋</text>
  <text x="360" y="89" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段长 r−l+1</text>
  <text x="480" y="89" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">贡献 段长·q²</text>
  <text x="600" y="89" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">累计 ans</text>

  <rect x="40" y="102" width="620" height="30" fill="#ffffff" stroke="#c9d6e8"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 … 1</text>
  <text x="250" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">20</text>
  <text x="360" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">400</text>
  <text x="600" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">400</text>

  <rect x="40" y="132" width="620" height="30" fill="#f2f6fc" stroke="#c9d6e8"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 … 2</text>
  <text x="250" y="152" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="360" y="152" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="152" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">100</text>
  <text x="600" y="152" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">500</text>

  <rect x="40" y="162" width="620" height="30" fill="#ffffff" stroke="#c9d6e8"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3 … 3</text>
  <text x="250" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="360" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">36</text>
  <text x="600" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">536</text>

  <rect x="40" y="192" width="620" height="30" fill="#f2f6fc" stroke="#c9d6e8"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4 … 4</text>
  <text x="250" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="360" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">25</text>
  <text x="600" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">561</text>

  <rect x="40" y="222" width="620" height="30" fill="#ffffff" stroke="#c9d6e8"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5 … 5</text>
  <text x="250" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="360" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="600" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">577</text>

  <rect x="40" y="252" width="620" height="30" fill="#f2f6fc" stroke="#c9d6e8"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6 … 6</text>
  <text x="250" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="360" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="480" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="600" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">586</text>

  <rect x="40" y="282" width="620" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7 … 10</text>
  <text x="250" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="360" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="480" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="600" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">602</text>

  <rect x="40" y="312" width="620" height="32" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">11 … 20</text>
  <text x="250" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="360" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="480" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="600" y="333" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">612</text>

  <text x="350" y="376" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">
    第 8 块 r = 20 = n，之后 l = 21 &gt; 20，循环结束，输出 612
  </text>
  <text x="350" y="400" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    与官方样例输出一致；直接枚举 (a, b, c) 的暴力同样得到 612
  </text>

  <rect x="120" y="418" width="460" height="38" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="443" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    8 块 vs 20 项：n 越大，分块的省时越明显
  </text>
</svg>
