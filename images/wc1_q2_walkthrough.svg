<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = “loveleetcode”（n = 12）</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第一遍把频次表填满，第二遍只做一次「读表 + 比较」</text>

  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="69" y="72">0</text><text x="107" y="72">1</text><text x="145" y="72">2</text>
    <text x="183" y="72">3</text><text x="221" y="72">4</text><text x="259" y="72">5</text>
    <text x="297" y="72">6</text><text x="335" y="72">7</text><text x="373" y="72">8</text>
    <text x="411" y="72">9</text><text x="449" y="72">10</text><text x="487" y="72">11</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="52" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="90" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="78" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="166" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="242" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="318" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="356" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="394" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="432" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="470" y="78" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#3a4a66" text-anchor="middle" font-weight="bold">
    <text x="69" y="99">l</text><text x="107" y="99">o</text><text x="145" y="99" fill="#3a5a30">v</text>
    <text x="183" y="99">e</text><text x="221" y="99">l</text><text x="259" y="99">e</text>
    <text x="297" y="99">e</text><text x="335" y="99">t</text><text x="373" y="99">c</text>
    <text x="411" y="99">o</text><text x="449" y="99">d</text><text x="487" y="99">e</text>
  </g>

  <text x="30" y="124" font-size="9.5" fill="#999" filter="url(#rough2)">频次</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="69" y="124" fill="#b85450">2</text><text x="107" y="124" fill="#b85450">2</text>
    <text x="145" y="124" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="183" y="124" fill="#b85450">4</text><text x="221" y="124" fill="#b85450">2</text>
    <text x="259" y="124" fill="#b85450">4</text><text x="297" y="124" fill="#b85450">4</text>
    <text x="335" y="124" fill="#4a7a3a">1</text><text x="373" y="124" fill="#4a7a3a">1</text>
    <text x="411" y="124" fill="#b85450">2</text><text x="449" y="124" fill="#4a7a3a">1</text>
    <text x="487" y="124" fill="#b85450">4</text>
  </g>

  <rect x="124" y="130" width="42" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="9" filter="url(#rough2)"/>
  <text x="145" y="143" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案</text>

  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">第二遍：i=0 cnt[l]=2 跳过 → i=1 cnt[o]=2 跳过</text>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">i=2 cnt[v]=1 命中 ⇒ 立即返回 2</text>

  <rect x="28" y="190" width="246" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="210" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">频次表（只列非零项）</text>
  <text x="42" y="232" font-size="10" fill="#555" filter="url(#rough2)">l:2　o:2　v:1　e:4</text>
  <text x="42" y="252" font-size="10" fill="#555" filter="url(#rough2)">t:1　c:1　d:1</text>
  <text x="42" y="272" font-size="10" fill="#888" filter="url(#rough2)">其余 19 个字母为 0</text>
  <text x="42" y="292" font-size="10" fill="#888" filter="url(#rough2)">cnt 与位置无关，可任意顺序填</text>

  <rect x="286" y="190" width="246" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300" y="210" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结论</text>
  <text x="300" y="232" font-size="10" fill="#3a5a30" filter="url(#rough2)">第一个 cnt = 1 的下标是 2</text>
  <text x="300" y="252" font-size="10" fill="#3a5a30" filter="url(#rough2)">s[2] = 'v'，全串仅出现 1 次</text>
  <text x="300" y="272" font-size="10" fill="#3a5a30" filter="url(#rough2)">下标又最小 ⇒ 正是答案 2</text>
  <text x="300" y="292" font-size="10" fill="#888" filter="url(#rough2)">若所有 cnt ≥ 2，则扫完返回 −1</text>

  <rect x="28" y="314" width="246" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="334" font-size="10" fill="#3a4a66" filter="url(#rough2)">“leetcode”：cnt[l] = 1 且 l 在首位</text>
  <text x="42" y="354" font-size="10" fill="#3a4a66" filter="url(#rough2)">⇒ 第二遍第一步就返回 0</text>

  <rect x="286" y="314" width="246" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300" y="334" font-size="10" fill="#8a3a36" filter="url(#rough2)">“aabb”：cnt[a] = cnt[b] = 2</text>
  <text x="300" y="354" font-size="10" fill="#8a3a36" filter="url(#rough2)">⇒ 第二遍无命中，返回 −1</text>

  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">判定用「频次」，返回用「下标」：两件事分别由两遍扫描负责</text>
</svg>
