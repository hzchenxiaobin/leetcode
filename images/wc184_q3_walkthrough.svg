<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 455" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="455" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">示例演算：命中实体跳整段，伪实体判否只 +1</text>
  <text x="340" y="44" text-anchor="middle" font-size="10.5" fill="#888">text = "&amp;amp; is an HTML entity but &amp;ambassador; is not."（n = 48）</text>

  <!-- ===================== row 1: i=0 hit &amp; ===================== -->
  <text x="44" y="97" font-size="11" font-weight="bold" fill="#666">i=0</text>
  <path d="M 100 72 L 100 68 L 320 68 L 320 72" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="210" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">首个 ';' 在 i+4 → '&amp;amp;' ∈ 表 → 命中</text>
  <g>
    <rect x="100" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="144" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="188" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="232" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="276" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="122" y="98">&amp;</text>
    <text x="166" y="98">a</text>
    <text x="210" y="98">m</text>
    <text x="254" y="98">p</text>
    <text x="298" y="98">;</text>
  </g>
  <rect x="324" y="76" width="236" height="34" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="442" y="98" text-anchor="middle" font-size="10" fill="#999">后续 23 个字符（见下行）</text>
  <text x="572" y="92" font-size="11" font-weight="bold" fill="#2e6e2e">输出 &amp;</text>
  <text x="572" y="108" font-size="10" fill="#666">i: 0 → 5</text>
  <text x="100" y="130" font-size="10.5" fill="#999">整段 &amp;amp; 一次消费，i 直接跳到 5（一步跳 5 格）</text>

  <!-- ===================== row 2: i=5..27 fast path ===================== -->
  <text x="44" y="169" font-size="11" font-weight="bold" fill="#666">i=5–27</text>
  <rect x="100" y="148" width="440" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="169" font-size="12" fill="#333">" is an HTML entity but "</text>
  <text x="572" y="169" font-size="10.5" fill="#666">原样输出</text>
  <text x="100" y="200" font-size="10.5" fill="#999">无 &amp;，全走快路径，i 一路走到 28</text>

  <!-- ===================== row 3: i=28 miss &ambassador; ===================== -->
  <text x="44" y="243" font-size="11" font-weight="bold" fill="#666">i=28</text>
  <path d="M 100 218 L 100 212 L 366 212 L 366 218" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="233" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818">窗口 [i, i+7) 内无 ';'（';' 远在 i+11）</text>
  <g>
    <rect x="100" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="138" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="176" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="214" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="252" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="290" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="328" y="222" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="366" y="222" width="38" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="404" y="222" width="38" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="442" y="222" width="38" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="480" y="222" width="38" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="518" y="222" width="38" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="119" y="244">&amp;</text>
    <text x="157" y="244">a</text>
    <text x="195" y="244">m</text>
    <text x="233" y="244">b</text>
    <text x="271" y="244">a</text>
    <text x="309" y="244">s</text>
    <text x="347" y="244">s</text>
    <text x="385" y="244">a</text>
    <text x="423" y="244">d</text>
    <text x="461" y="244">o</text>
    <text x="499" y="244">r</text>
    <text x="537" y="244" fill="#b85450">;</text>
  </g>
  <text x="566" y="236" font-size="11" font-weight="bold" fill="#b85450">判否</text>
  <text x="566" y="252" font-size="10" fill="#666">i 只 +1</text>
  <text x="100" y="276" font-size="10.5" fill="#999">&amp; 按普通字符输出，i 从 28 只走到 29；后续 ambassador; 原样保留</text>

  <!-- ===================== row 4: i=29..47 literal ===================== -->
  <text x="44" y="313" font-size="11" font-weight="bold" fill="#666">i=29–47</text>
  <rect x="100" y="292" width="300" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="313" font-size="12" fill="#333">ambassador; is not.</text>
  <text x="572" y="313" font-size="10.5" fill="#666">原样输出</text>
  <text x="100" y="344" font-size="10.5" fill="#999">扫描至串尾，结束</text>

  <!-- summary box -->
  <rect x="60" y="358" width="560" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">输出 = &amp; + " is an HTML entity but " + &amp; + "ambassador; is not." ✓ 与示例 1 一致</text>
  <text x="340" y="404" text-anchor="middle" font-size="11" fill="#555">命中实体 → i 跳过整段（0 → 5）；伪实体 → 判否只 +1（28 → 29）</text>
  <text x="340" y="424" text-anchor="middle" font-size="11" fill="#555">两种结局都由窗口 [i, i+7) 内的首个 ';' 一锤定音</text>
</svg>
