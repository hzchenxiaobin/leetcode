<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">手写 width(x)：以 x = -1000000000 为例走一遍</text>

  <rect x="150" y="46" width="220" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">len = 1（0 也占 1 位的兜底）</text>
  <path d="M 260 84 L 260 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,110 346 148 260,186 174,148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x &lt; 0 ?</text>
  <path d="M 174 148 L 120 148 L 120 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="139" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="358" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="52" y="178" width="136" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">len += 1（负号）</text>
  <text x="120" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = -x → 1000000000</text>

  <rect x="336" y="188" width="160" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">跳过负号处理，直接数位</text>

  <path d="M 120 218 L 120 246 L 258 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 416 218 L 416 246 L 262 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="254" width="220" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">while (x ≥ 10)：len++，x /= 10</text>

  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1000000000 除 9 次 → len = 1 + 1 + 9 = 11 ✓</text>
</svg>
