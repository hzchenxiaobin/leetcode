<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：按 m mod 3 分类 + 快速幂取模</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="255" y="54" width="170" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">输入 m = primeFactors</text>
  <path d="M 340 92 L 340 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: m <= 3 ? -->
  <g filter="url(#sk)">
    <polygon points="340,110 440,152 340,194 240,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">m ≤ 3 ?</text>
  <text x="345" y="166" text-anchor="middle" font-size="10" fill="#888">(m = 1, 2, 3)</text>

  <!-- yes branch: return m -->
  <path d="M 440 152 L 520 152 L 520 176" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="470" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="440" y="178" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="520" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b26">直接返回 m</text>
  <text x="520" y="220" text-anchor="middle" font-size="10.5" fill="#555">n = p^m，好因子 = m</text>
  <g font-size="10" fill="#2f6b26" text-anchor="middle">
    <text x="474" y="236">1→1　2→2　3→3</text>
  </g>

  <!-- no branch -->
  <path d="M 340 194 L 340 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="356" y="212" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <!-- diamond: r = m mod 3 -->
  <g filter="url(#sk)">
    <polygon points="340,220 452,262 340,304 228,262" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">r = m mod 3 = ?</text>
  <text x="345" y="270" text-anchor="middle" font-size="10" fill="#888">(记 q = m div 3)</text>
  <text x="340" y="292" text-anchor="middle" font-size="10" fill="#888">m ≥ 4 保证 r = 1 时 q ≥ 1</text>

  <!-- three branches -->
  <path d="M 228 262 L 130 262 L 130 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="175" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">r = 0</text>
  <path d="M 452 262 L 550 262 L 550 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="505" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">r = 2</text>
  <path d="M 340 304 L 340 326" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="362" y="320" font-size="11" font-weight="bold" fill="#b85450">r = 1</text>

  <g filter="url(#sk)">
    <rect x="52" y="298" width="156" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="262" y="298" width="156" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="472" y="298" width="156" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="130" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">ans = 3^q</text>
  <text x="130" y="342" text-anchor="middle" font-size="10.5" fill="#555">全拆 3</text>
  <text x="130" y="357" text-anchor="middle" font-size="10.5" fill="#555">n = p^3·q^3·…</text>
  <text x="340" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">ans = 4·3^(q−1)</text>
  <text x="340" y="342" text-anchor="middle" font-size="10.5" fill="#555">3+1 换 2+2（即 4）</text>
  <text x="340" y="357" text-anchor="middle" font-size="10.5" fill="#555">n = …·p^4·q^3·…</text>
  <text x="550" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b26">ans = 2·3^q</text>
  <text x="550" y="342" text-anchor="middle" font-size="10.5" fill="#555">多补一个 2</text>
  <text x="550" y="357" text-anchor="middle" font-size="10.5" fill="#555">n = p^2·q^3·…</text>

  <!-- merge to fast pow -->
  <path d="M 130 364 L 130 396 Q 130 404 138 404 L 316 404" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 340 364 L 340 396" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 550 364 L 550 396 Q 550 404 542 404 L 364 404" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- fast pow panel -->
  <g filter="url(#sk)">
    <rect x="170" y="416" width="340" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="437" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">快速幂 pow(3, e, 10⁹+7)：反复平方法</text>
  <text x="340" y="457" text-anchor="middle" font-size="11" fill="#555">指数 e 高达 3.3×10⁸，逐次乘会超时；O(log e) 次乘法取模即可</text>
</svg>
