<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">从尾部弹出，直到集齐 1..k</text>

  <!-- 数组 [3,1,5,4,2] -->
  <rect x="80"  y="70" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="70" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="70" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="70" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="70" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="106" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="162" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="218" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="274" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="330" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="106" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="162" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="218" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="274" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=4</text>

  <!-- 弹出箭头 -->
  <path d="M 330 66 C 330 30, 400 30, 424 52" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="392" y="24" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">每次操作弹出末尾</text>

  <!-- 集合 -->
  <rect x="392" y="56" width="104" height="96" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">集合 S</text>
  <text x="444" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">收集 1..k</text>
  <text x="444" y="128" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">k = 2 → 要 {1,2}</text>

  <!-- 底部流程 -->
  <rect x="36" y="190" width="448" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="218" font-size="13" fill="#333" filter="url(#rough2)">从 i = n−1 往左扫，v ≤ k 且没见过就标记：</text>
  <text x="60" y="244" font-size="13" fill="#333" filter="url(#rough2)">弹 2（集齐 2）→ 弹 4、5（&gt;k 直接丢）→ 弹 1 ✓</text>
  <text x="60" y="270" font-size="13" fill="#333" filter="url(#rough2)">标记满 k 个时停在下标 i，操作数 = n − i</text>
  <text x="60" y="296" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">本例停在 i=1：5 − 1 = 4 次操作</text>
</svg>
