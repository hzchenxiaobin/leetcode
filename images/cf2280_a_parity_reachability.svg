<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：奇偶类之间只有一条单向通道</text>
    <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888">2a 必为偶数，所以 a := 2a + k 的结果奇偶性完全由 k 决定</text>
  </g>

  <!-- 左面板：k 偶 -->
  <g filter="url(#rough2)">
    <rect x="30" y="68" width="250" height="252" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="155" y="94" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">k 为偶数</text>

    <rect x="62" y="142" width="80" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="102" y="171" text-anchor="middle" font-size="13" fill="#3a4a66">偶类</text>
    <path d="M 90 142 Q 102 118 114 142" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="102" y="114" text-anchor="middle" font-size="9" fill="#446688">±2</text>

    <rect x="168" y="142" width="80" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="208" y="171" text-anchor="middle" font-size="13" fill="#3a4a66">奇类</text>
    <path d="M 196 142 Q 208 118 220 142" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="208" y="114" text-anchor="middle" font-size="9" fill="#446688">±2</text>

    <path d="M 166 165 L 147 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
    <text x="157" y="157" text-anchor="middle" font-size="9" fill="#b85450">2a+k</text>

    <text x="155" y="212" text-anchor="middle" font-size="10" fill="#3a4a66">偶 → 偶：允许（±2）</text>
    <text x="155" y="232" text-anchor="middle" font-size="10" fill="#b85450">奇 → 偶：允许一次，之后锁死</text>
    <text x="155" y="252" text-anchor="middle" font-size="10" fill="#b85450">偶 → 奇：永远不可能</text>
    <text x="155" y="284" text-anchor="middle" font-size="10" fill="#888">结论：数一数 a 里的偶数够不够放</text>
    <text x="155" y="304" text-anchor="middle" font-size="10.5" fill="#3a5a30">evenA ≤ evenB  ⟺  YES</text>
  </g>

  <!-- 右面板：k 奇 -->
  <g filter="url(#rough2)">
    <rect x="300" y="68" width="250" height="252" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="425" y="94" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold">k 为奇数</text>

    <rect x="332" y="142" width="80" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="372" y="171" text-anchor="middle" font-size="13" fill="#3a5a30">偶类</text>
    <path d="M 360 142 Q 372 118 384 142" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="372" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">±2</text>

    <rect x="438" y="142" width="80" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="478" y="171" text-anchor="middle" font-size="13" fill="#3a5a30">奇类</text>
    <path d="M 466 142 Q 478 118 490 142" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="478" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">±2</text>

    <path d="M 412 165 L 436 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
    <text x="425" y="157" text-anchor="middle" font-size="9" fill="#b85450">2a+k</text>

    <text x="425" y="212" text-anchor="middle" font-size="10" fill="#3a5a30">奇 → 奇：允许（±2）</text>
    <text x="425" y="232" text-anchor="middle" font-size="10" fill="#b85450">偶 → 奇：允许一次，之后锁死</text>
    <text x="425" y="252" text-anchor="middle" font-size="10" fill="#b85450">奇 → 偶：永远不可能</text>
    <text x="425" y="284" text-anchor="middle" font-size="10" fill="#888">结论：数一数 a 里的奇数够不够放</text>
    <text x="425" y="304" text-anchor="middle" font-size="10.5" fill="#8a6a20">evenA ≥ evenB  ⟺  YES</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#999">
    <text x="290" y="348" text-anchor="middle">±2 不改变奇偶，且能在同一类里把值挪到任意大小（中间允许为负）</text>
    <text x="290" y="370" text-anchor="middle">所以每个元素只有两种命运：留在本类，或被操作 ① 单向送到 k 指定的那一类</text>
  </g>
</svg>
