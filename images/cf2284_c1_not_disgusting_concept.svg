<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="38" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    「不恶心」= 每一对都落进下面三格之一
  </text>
  <text x="340" y="64" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">
    因为 gcd(b_i,b_j) ≤ min(b_i,b_j)，所以 1 &lt; gcd &lt; min 正是唯一被禁止的情形
  </text>

  <!-- three allowed relations -->
  <rect x="34" y="86" width="188" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="128" y="114" text-anchor="middle" font-size="14" fill="#1f3b57" filter="url(#rough2)">① 互质</text>
  <text x="128" y="138" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">gcd(u,v) = 1</text>
  <text x="128" y="160" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">不同素数之间</text>

  <rect x="246" y="86" width="188" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="340" y="114" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">② 相等</text>
  <text x="340" y="138" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">gcd = min = u = v</text>
  <text x="340" y="160" text-anchor="middle" font-size="11.5" fill="#6a8c5c" filter="url(#rough2)">重复的素数之间</text>

  <rect x="458" y="86" width="188" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="552" y="114" text-anchor="middle" font-size="14" fill="#6b4c12" filter="url(#rough2)">③ 一个整除另一个</text>
  <text x="552" y="138" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">u | v，gcd(u,v) = u</text>
  <text x="552" y="160" text-anchor="middle" font-size="11.5" fill="#9a7a2c" filter="url(#rough2)">如 26 与 78</text>

  <!-- transition band -->
  <rect x="34" y="192" width="612" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"
        filter="url(#rough3)"/>
  <text x="340" y="217" text-anchor="middle" font-size="12.5" fill="#8d3b38" filter="url(#rough3)">
    容斥：gcd &gt; 1 又不相等、又不整除 —— 这才是「恶心」，必须消灭
  </text>

  <path d="M340,238 L340,262" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <!-- prime row -->
  <text x="340" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    把每个 a_i 抬到「不小于它的最小素数」b_i —— 于是每一对都自动落进 ① 或 ②
  </text>

  <g filter="url(#rough2)">
    <rect x="48" y="304" width="74" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="85" y="330" text-anchor="middle" font-size="13" fill="#1f3b57">11</text>
    <rect x="140" y="304" width="74" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="177" y="330" text-anchor="middle" font-size="13" fill="#1f3b57">79</text>
    <rect x="232" y="304" width="74" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="269" y="330" text-anchor="middle" font-size="13" fill="#1f3b57">53</text>
    <rect x="324" y="304" width="74" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="361" y="330" text-anchor="middle" font-size="13" fill="#2c4a22">29</text>
    <rect x="416" y="304" width="74" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="453" y="330" text-anchor="middle" font-size="13" fill="#2c4a22">29</text>
    <rect x="508" y="304" width="74" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="545" y="330" text-anchor="middle" font-size="13" fill="#1f3b57">83</text>
    <rect x="600" y="304" width="46" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="623" y="330" text-anchor="middle" font-size="12.5" fill="#1f3b57">101</text>
  </g>

  <text x="340" y="372" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    绿格：24 与 26 都抬到 29 —— 相等合法，所以不必去重（这正是暴力构造会卡死的地方）
  </text>
  <rect x="95" y="386" width="490" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="340" y="408" text-anchor="middle" font-size="12" fill="#6b4c12" filter="url(#rough2)">
    剩下两件事：操作合法 gcd(a_i, x_i) = 1，总代价 Σx ≤ Σa（见 §3.3）
  </text>
</svg>
