<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：排序后 [1,1,2,3,7,10]，p = 2</text>

  <!-- row 1: sorted array with adjacent gaps -->
  <text x="287" y="44" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">（两格之间标出相邻差）</text>
  <text x="24" y="80" font-size="12" fill="#888" filter="url(#rough2)">排序后</text>
  <text x="154" y="58" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="218" y="58" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="282" y="58" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="346" y="58" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="410" y="58" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="100" y="64" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="64" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="64" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="292" y="64" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="356" y="64" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="420" y="64" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>

  <!-- row 2: check(0) -->
  <text x="24" y="162" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(t = 0)：</text>
  <text x="159" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ≤ 0 ✓</text>
  <path d="M 127 142 Q 159 100 191 142" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="127" cy="142" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="191" cy="142" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="287" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 &gt; 0 ✗</text>
  <path d="M 255 142 Q 287 100 319 142" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="415" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 &gt; 0 ✗</text>
  <path d="M 383 142 Q 415 100 447 142" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <rect x="100" y="144" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="144" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="144" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="292" y="144" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="356" y="144" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="420" y="144" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>

  <rect x="100" y="184" width="374" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt = 1 &lt; p = 2 ⇒ check(0) = false</text>

  <!-- row 3: check(1) -->
  <text x="24" y="282" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">check(t = 1)：</text>
  <text x="159" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ≤ 1 ✓</text>
  <path d="M 127 262 Q 159 222 191 262" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="127" cy="262" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="191" cy="262" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="287" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ≤ 1 ✓</text>
  <path d="M 255 262 Q 287 222 319 262" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="255" cy="262" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="319" cy="262" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="415" y="228" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">3 &gt; 1 ✗</text>
  <path d="M 383 262 Q 415 222 447 262" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <rect x="100" y="264" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="264" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="264" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="292" y="264" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="356" y="264" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="420" y="264" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="285" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>

  <rect x="100" y="304" width="374" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt = 2 ≥ p = 2 ⇒ check(1) = true</text>

  <!-- conclusion -->
  <rect x="56" y="348" width="448" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">t = 0 不可行 · t = 1 可行 ⇒ 答案 = 1 ⭐</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对应原数组的下标对 (1,4) 与 (2,5)，差分别为 0 和 1</text>
</svg>
