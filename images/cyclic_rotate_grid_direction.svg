<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：逆时针轮转一次 = 顺时针环数组左移一位</text>
  <path d="M 175 44 Q 470 54 765 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: 2x2 matrix ring ===== -->
  <text x="185" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">矩阵的一层（2×2 环）</text>
  <g filter="url(#sk)">
    <rect x="88" y="100" width="64" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="156" y="100" width="64" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="88" y="168" width="64" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="156" y="168" width="64" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="120" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">40</text>
  <text x="188" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="120" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">30</text>
  <text x="188" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">20</text>

  <!-- counterclockwise movement arrows -->
  <g stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 104 142 Q 98 166 104 190" marker-end="url(#arR)" filter="url(#sk)"/>
    <path d="M 130 214 Q 154 220 178 214" marker-end="url(#arR)" filter="url(#sk)"/>
    <path d="M 204 190 Q 210 166 204 142" marker-end="url(#arR)" filter="url(#sk)"/>
    <path d="M 178 118 Q 154 112 130 118" marker-end="url(#arR)" filter="url(#sk)"/>
  </g>
  <text x="185" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">红箭头 = 元素移动方向（逆时针）</text>
  <text x="185" y="288" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">每个元素取代它逆时针方向的邻居</text>
  <text x="185" y="310" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">于是左上取到原右上的 10</text>
  <text x="185" y="332" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">输出左上 = 10 ✓（示例 1）</text>

  <!-- ===== Right: clockwise ring arrays ===== -->
  <text x="620" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">按顺时针顺序提取成一维数组 ring</text>

  <!-- row 1: ring -->
  <g filter="url(#sk)">
    <rect x="352" y="100" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="428" y="100" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="504" y="100" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="580" y="100" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="384" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">40</text>
  <text x="460" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="536" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">20</text>
  <text x="612" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">30</text>
  <text x="384" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">左上 0</text>
  <text x="460" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">右上 1</text>
  <text x="536" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">右下 2</text>
  <text x="612" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">左下 3</text>
  <text x="672" y="129" font-size="12" fill="#666" filter="url(#sk)">← 顺时针排</text>

  <path d="M 460 178 Q 448 212 460 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="214" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">逆时针轮转 1 次 = 左移 1 位</text>

  <!-- row 2: after one rotation -->
  <g filter="url(#sk)">
    <rect x="352" y="252" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="428" y="252" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="504" y="252" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="580" y="252" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="384" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="460" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">20</text>
  <text x="536" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">30</text>
  <text x="612" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#sk)">40</text>
  <text x="384" y="314" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">来自下标 1</text>
  <text x="612" y="314" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">来自下标 0（绕回末尾）</text>

  <text x="620" y="348" text-anchor="middle" font-size="13" fill="#444" font-family="monospace" filter="url(#sk)">new[i] = ring[(i + 1) mod L]</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="340" y="384" width="560" height="128" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="360" y="412" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">轮转 k 次 = 左移 (k mod L) 位</text>
  <text x="360" y="438" font-size="11" fill="#444" filter="url(#sk)">环长 L：转 L 次每个元素回到原位（操作周期恰为 L）</text>
  <text x="360" y="462" font-size="11" fill="#444" filter="url(#sk)">k ≤ 10⁹ 也没关系：k mod L &lt; L ≤ 2(m+n)−4 &lt; 200</text>
  <text x="360" y="486" font-size="11" fill="#444" filter="url(#sk)">左移 shift 位一次切片搞定：ring[shift:] + ring[:shift]</text>
</svg>
