<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">转移：枚举「最后一个配对」的 nums2 下标 j</text>

  <!-- mask 二进制 -->
  <text x="150" y="60" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">mask = 01101（n=5，含 3 个下标）</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="46" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="68" y="101">0</text>
    <rect x="90" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="112" y="101">1</text>
    <rect x="134" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="156" y="101">1</text>
    <rect x="178" y="76" width="44" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4"/><text x="200" y="101">0</text>
    <rect x="222" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="244" y="101">1</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="68" y="132">j=4</text><text x="112" y="132">j=3</text><text x="156" y="132">j=2</text>
    <text x="200" y="132">j=1</text><text x="244" y="132">j=0</text>
  </g>
  <text x="156" y="160" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">popcount(mask) = 3 → 已配 nums1[0..2]</text>

  <!-- 拆位示意 -->
  <path d="M 156 172 Q 156 190, 156 206" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="46" y="210" width="220" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="156" y="232" text-anchor="middle">去掉 j=2 这一位：</text>
    <text x="156" y="252" text-anchor="middle" font-weight="bold">dp[01001] + (nums1[2] XOR nums2[2])</text>
    <text x="156" y="270" text-anchor="middle" fill="#666" font-size="12">i = popcount−1 = 2 是「最后配对」的 nums1</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="46" y="288" width="220" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="156" y="310" text-anchor="middle">去掉 j=0：</text>
    <text x="156" y="330" text-anchor="middle" font-weight="bold">dp[01100] + (nums1[2] XOR nums2[0])</text>
    <text x="156" y="348" text-anchor="middle" fill="#666" font-size="12">对 mask 中每个 1 位各取一次 min</text>
  </g>

  <!-- 右：为什么这样设计是充分的 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="300" y="210" width="236" height="144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="418" y="234" text-anchor="middle" font-weight="bold" fill="#2d5a22">为什么只需「前 k 个」？</text>
    <text x="418" y="258" text-anchor="middle" font-size="12">代价只与配对结构有关，与配对先后无关；</text>
    <text x="418" y="276" text-anchor="middle" font-size="12">固定「nums1 侧按前缀推进」，每个完美匹配</text>
    <text x="418" y="294" text-anchor="middle" font-size="12">都恰有一条到全 1 掩码的 DP 路径。</text>
    <text x="418" y="318" text-anchor="middle" font-size="12">顺序性消除了“同一集合、不同顺序”的</text>
    <text x="418" y="336" text-anchor="middle" font-size="12">重复状态（排列 → 组合级别的压缩）。</text>
    <text x="418" y="350" text-anchor="middle" font-size="12" fill="#666">复杂度 O(2ⁿ·n) ≈ 2.3×10⁵</text>
  </g>
</svg>
