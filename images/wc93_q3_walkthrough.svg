<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="380" fill="#fafafa"/>

  <text x="22" y="34" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums1=[12,24,8,32]  nums2=[13,25,32,11]</text>
  <text x="22" y="58" font-size="12" fill="#666" filter="url(#rough2)">a 升序 = [8, 12, 24, 32]；处理顺序按 nums2 降序：位置 2（32）, 1（25）, 0（13）, 3（11）</text>

  <!-- 表头 -->
  <rect x="24" y="76" width="612" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="46" y="98" font-size="12" fill="#2c4a63" filter="url(#rough2)">处理位置</text>
  <text x="150" y="98" font-size="12" fill="#2c4a63" filter="url(#rough2)">对手 nums2[i]</text>
  <text x="290" y="98" font-size="12" fill="#2c4a63" filter="url(#rough2)">a[hi]</text>
  <text x="380" y="98" font-size="12" fill="#2c4a63" filter="url(#rough2)">判定</text>
  <text x="500" y="98" font-size="12" fill="#2c4a63" filter="url(#rough2)">派出的牌</text>

  <!-- 行 1：牺牲 -->
  <rect x="24" y="112" width="612" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="134" font-size="12" fill="#8d3b37" filter="url(#rough2)">i = 2</text>
  <text x="168" y="134" font-size="12" fill="#8d3b37" filter="url(#rough2)">32</text>
  <text x="300" y="134" font-size="12" fill="#8d3b37" filter="url(#rough2)">32</text>
  <text x="380" y="134" font-size="12" fill="#8d3b37" filter="url(#rough2)">32 &gt; 32 不成立</text>
  <text x="500" y="134" font-size="12" fill="#8d3b37" filter="url(#rough2)">8（最小，牺牲）</text>

  <!-- 行 2 -->
  <rect x="24" y="148" width="612" height="34" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="170" font-size="12" fill="#444" filter="url(#rough2)">i = 1</text>
  <text x="168" y="170" font-size="12" fill="#444" filter="url(#rough2)">25</text>
  <text x="300" y="170" font-size="12" fill="#444" filter="url(#rough2)">32</text>
  <text x="380" y="170" font-size="12" fill="#444" filter="url(#rough2)">32 &gt; 25 ✓</text>
  <text x="500" y="170" font-size="12" fill="#444" filter="url(#rough2)">32（赢）</text>

  <!-- 行 3 -->
  <rect x="24" y="184" width="612" height="34" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="206" font-size="12" fill="#444" filter="url(#rough2)">i = 0</text>
  <text x="168" y="206" font-size="12" fill="#444" filter="url(#rough2)">13</text>
  <text x="300" y="206" font-size="12" fill="#444" filter="url(#rough2)">24</text>
  <text x="380" y="206" font-size="12" fill="#444" filter="url(#rough2)">24 &gt; 13 ✓</text>
  <text x="500" y="206" font-size="12" fill="#444" filter="url(#rough2)">24（赢）</text>

  <!-- 行 4 -->
  <rect x="24" y="220" width="612" height="34" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="242" font-size="12" fill="#444" filter="url(#rough2)">i = 3</text>
  <text x="168" y="242" font-size="12" fill="#444" filter="url(#rough2)">11</text>
  <text x="300" y="242" font-size="12" fill="#444" filter="url(#rough2)">12</text>
  <text x="380" y="242" font-size="12" fill="#444" filter="url(#rough2)">12 &gt; 11 ✓</text>
  <text x="500" y="242" font-size="12" fill="#444" filter="url(#rough2)">12（赢）</text>

  <text x="24" y="286" font-size="13" fill="#333" filter="url(#rough2)">按原位置填回：ans = [24, 32, 8, 12]</text>

  <rect x="24" y="300" width="300" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="174" y="322" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">逐位比较：24&gt;13 ✓，32&gt;25 ✓，</text>
  <text x="174" y="340" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">8&gt;32 ✗，12&gt;11 ✓</text>

  <rect x="348" y="300" width="288" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="492" y="322" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">优势 = 3，等于「赢的场次上限」</text>
  <text x="492" y="340" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">（32 无解，只能输掉一场）</text>
</svg>
