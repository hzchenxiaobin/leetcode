<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察①：好因子数 = 各质因数指数的乘积（乘法原理）</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="11.5" fill="#666">以 n = 12 = 2² × 3¹ 为例：任意因子 d = 2^b1 · 3^b2，其中 0 ≤ b1 ≤ 2、0 ≤ b2 ≤ 1</text>

  <!-- factor grid -->
  <text x="150" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">n = 12 的全部因子</text>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="196" y="104">b2=0</text>
    <text x="262" y="104">b2=1</text>
  </g>
  <g font-size="10.5" fill="#888" text-anchor="end">
    <text x="158" y="125">b1=0</text>
    <text x="158" y="171">b1=1</text>
    <text x="158" y="217">b1=2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="166" y="110" width="58" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="228" y="110" width="58" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="166" y="156" width="58" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="166" y="202" width="58" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="228" y="156" width="58" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="228" y="202" width="58" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="195" y="136" fill="#999">1</text>
    <text x="257" y="136" fill="#999">3</text>
    <text x="195" y="182" fill="#999">2</text>
    <text x="257" y="182" fill="#2f6b26">6</text>
    <text x="195" y="228" fill="#999">4</text>
    <text x="257" y="228" fill="#2f6b26">12</text>
  </g>
  <text x="226" y="268" text-anchor="middle" font-size="10.5" fill="#666">好因子 ⟺ 每个不同质因数都出现（b1 ≥ 1 且 b2 ≥ 1）→ 只有绿色格</text>
  <g filter="url(#sk)">
    <rect x="152" y="278" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
  </g>
  <text x="174" y="289" font-size="10.5" fill="#4a7a3a">好因子（6、12）</text>
  <g filter="url(#sk)">
    <rect x="286" y="278" width="16" height="14" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="2"/>
  </g>
  <text x="308" y="289" font-size="10.5" fill="#888">普通因子</text>

  <!-- right reasoning chain -->
  <g filter="url(#sk)">
    <rect x="380" y="102" width="250" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="505" y="123" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">第 1 步：质因数分解</text>
  <text x="505" y="143" text-anchor="middle" font-size="11" fill="#444">12 = 2² × 3¹，指数 a1 = 2，a2 = 1</text>
  <path d="M 505 156 L 505 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="380" y="174" width="250" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="505" y="195" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">第 2 步：好因子的形状</text>
  <text x="505" y="215" text-anchor="middle" font-size="11" fill="#444">d 是好因子 ⟺ b1 ≥ 1 且 b2 ≥ 1（缺一不可）</text>
  <path d="M 505 228 L 505 242" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="380" y="246" width="250" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="505" y="267" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b26">第 3 步：乘法原理计数</text>
  <text x="505" y="287" text-anchor="middle" font-size="11" fill="#444">b1 有 2 种（1,2），b2 有 1 种（1）→ 2 × 1 = 2</text>

  <!-- bottom formula panel -->
  <g filter="url(#sk)">
    <rect x="50" y="312" width="580" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">n = p1^a1 · p2^a2 · … · pk^ak　⟹　好因子数 = a1 · a2 · … · ak</text>
  <text x="340" y="360" text-anchor="middle" font-size="11" fill="#555">每个指数 bi 独立地从 1..ai 中选取，乘法原理相乘</text>

  <!-- bottom transformation panel -->
  <g filter="url(#sk)">
    <rect x="50" y="392" width="580" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">原题 ⟺ 把 m = primeFactors 个配额分给若干不同质数（指数 ai ≥ 1，Σai ≤ m）</text>
  <text x="340" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">最大化指数乘积 ∏ ai —— 与"选哪些质数"完全无关，纯整数拆分问题</text>
</svg>
