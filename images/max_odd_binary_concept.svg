<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">守末位 + 冲高位 —— 答案的三段式结构</text>

  <!-- 输入行 -->
  <text x="130" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">输入 s =</text>
  <rect x="225" y="54" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="265" y="54" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="305" y="54" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="345" y="54" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 输入到两个观察框的分叉箭头 -->
  <path d="M 280 94 Q 270 106 150 120" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 94 Q 320 106 375 120" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 观察框 1（绿）：奇数约束 -->
  <rect x="28" y="122" width="225" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">观察 1：奇数 ⇔ 末位是 '1'</text>
  <text x="140" y="174" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">扣下一个 '1' 守住末位</text>

  <!-- 观察框 2（蓝）：最大化 -->
  <rect x="268" y="122" width="225" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="150" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">观察 2：'1' 越靠高位数值越大</text>
  <text x="380" y="174" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">其余 k−1 个 '1' 全冲最前</text>

  <!-- 汇合箭头 -->
  <path d="M 150 192 Q 200 210 250 226" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 192 Q 350 210 320 226" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 答案行 -->
  <text x="130" y="253" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 =</text>
  <rect x="225" y="228" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="252" text-anchor="middle" font-size="14" fill="#33445e" filter="url(#rough2)">1</text>
  <rect x="265" y="228" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="252" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="305" y="228" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="252" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="345" y="228" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="363" y="252" text-anchor="middle" font-size="14" fill="#8a3030" filter="url(#rough2)">1</text>

  <!-- 三段下划线与标注 -->
  <path d="M 226 270 L 260 270" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 266 270 L 340 270" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 346 270 L 380 270" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="243" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k−1 个 '1'</text>
  <text x="303" y="292" text-anchor="middle" font-size="12" fill="#a07828" filter="url(#rough2)">n−k 个 '0'</text>
  <text x="363" y="292" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">末位 '1'</text>

  <!-- 底部公式 -->
  <rect x="80" y="308" width="360" height="38" rx="8" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = '1'×(k−1) + '0'×(n−k) + '1'</text>
</svg>
