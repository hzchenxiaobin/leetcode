<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：DFS 回溯 —— 到 0 记账、超时剪枝、进出配对</text>
  <text x="320" y="40" text-anchor="middle" font-size="11" fill="#666666">状态：(当前点 u, 已用时间 t, 当前价值和 cur)；cnt[] 记录各点在当前 walk 上的出现次数</text>

  <g filter="url(#sk)">
    <rect x="150" y="54" width="380" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">建邻接表 g（无向边加两次），cnt[0] = 1</text>
  <text x="340" y="88" text-anchor="middle" font-size="11" fill="#2b6e9e">调用 dfs(u=0, t=0, cur=values[0])</text>

  <path d="M340,96 L340,106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="340,108 428,144 340,180 252,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="148" text-anchor="middle" font-size="11.5" fill="#8a6415">u == 0 ?</text>

  <path d="M428,144 L470,144" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="444" y="137" font-size="10" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="476" y="118" width="148" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="550" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = max(ans, cur)</text>
  <text x="550" y="158" text-anchor="middle" font-size="9.5" fill="#2e6e2e">记完账继续走，不 return！</text>

  <path d="M550,170 L550,194 L348,194" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="188" font-size="9" fill="#888888">记账后并入主流程</text>

  <path d="M340,180 L340,200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="196" text-anchor="end" font-size="10" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="150" y="202" width="380" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">遍历 u 的邻边 (v, w)</text>

  <path d="M340,240 L340,250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="340,252 440,290 340,328 240,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="294" text-anchor="middle" font-size="11.5" fill="#8a6415">t + w ≤ maxTime ?</text>

  <path d="M240,290 L188,290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="206" y="282" font-size="10" fill="#b85450">剪枝</text>

  <g filter="url(#sk)">
    <rect x="44" y="268" width="136" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="112" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">放弃这条边</text>
  <text x="112" y="303" text-anchor="middle" font-size="9.5" fill="#b85450">时间预算不够</text>

  <path d="M112,268 L112,221 L144,221" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="118" y="250" font-size="9" fill="#888888">下一条边</text>

  <path d="M440,290 L482,290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="454" y="282" font-size="10" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="488" y="252" width="136" height="82" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="556" y="272" text-anchor="middle" font-size="10.5" fill="#2e6e2e">cnt[v] += 1（进点）</text>
  <text x="556" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">cur+values[v]（仅首访）</text>
  <text x="556" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">dfs(v, t+w, cur′)</text>
  <text x="556" y="326" text-anchor="middle" font-size="10.5" fill="#2e6e2e">cnt[v] −= 1（撤销）</text>

  <path d="M556,252 L556,231 L534,231" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="562" y="247" font-size="9" fill="#888888">下一条边</text>

  <path d="M200,240 L200,366" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="208" y="310" font-size="9" fill="#888888">邻边试完</text>

  <g filter="url(#sk)">
    <rect x="110" y="366" width="270" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="245" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">u 的邻边全部试完</text>
  <text x="245" y="395" text-anchor="middle" font-size="9.5" fill="#2b6e9e">本层返回（cnt 已还原）</text>

  <path d="M380,383 L398,383" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="402" y="366" width="222" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="513" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">最外层返回后</text>
  <text x="513" y="395" text-anchor="middle" font-size="11" fill="#2e6e2e">return ans</text>

  <text x="320" y="424" text-anchor="middle" font-size="10.5" fill="#555555">唯一的剪枝是 t + w &gt; maxTime —— 它保证被探索的每条 walk 都在预算内；到达 0 不停，穿过 0 继续走</text>
</svg>
