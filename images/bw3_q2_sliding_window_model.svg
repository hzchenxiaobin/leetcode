<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：定长窗口每滑一格，只有「一进一出」两个计数变化</text>

  <text x="100" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">窗口 [0, 4]</text>
  <g filter="url(#rough2)">
    <rect x="152" y="42" width="160" height="44" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="160" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="190" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="220" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="250" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="280" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="310" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="340" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="370" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="400" y="48" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="174" y="68">h</text><text x="204" y="68">a</text><text x="234" y="68">v</text><text x="264" y="68">e</text><text x="294" y="68">f</text>
    <text x="324" y="68">u</text><text x="354" y="68">n</text><text x="384" y="68">o</text><text x="414" y="68">n</text>
  </g>
  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#999">
    <text x="174" y="92">0</text><text x="204" y="92">1</text><text x="234" y="92">2</text><text x="264" y="92">3</text><text x="294" y="92">4</text>
    <text x="324" y="92">5</text><text x="354" y="92">6</text><text x="384" y="92">7</text><text x="414" y="92">8</text>
  </g>
  <text x="478" y="60" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">havef：5 种字符 ✓</text>
  <text x="478" y="78" font-size="9.5" fill="#555" filter="url(#rough2)">distinct = k = 5 → ans++</text>

  <text x="100" y="138" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">窗口 [4, 8]</text>
  <g filter="url(#rough2)">
    <rect x="184" y="114" width="170" height="44" fill="none" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="160" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="190" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="220" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="250" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="280" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="310" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="340" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="370" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="400" y="118" width="28" height="32" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <path d="M 264 112 L 264 104 L 324 104 L 324 112" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="174" y="138">e</text><text x="204" y="138">f</text><text x="234" y="138">u</text><text x="264" y="138" fill="#b85450">n</text><text x="294" y="138">o</text><text x="324" y="138" fill="#b85450">n</text>
    <text x="354" y="138">l</text><text x="384" y="138">e</text><text x="414" y="138">e</text>
  </g>
  <text x="294" y="100" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">n 出现两次</text>
  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#999">
    <text x="174" y="162">3</text><text x="204" y="162">4</text><text x="234" y="162">5</text><text x="264" y="162">6</text><text x="294" y="162">7</text>
    <text x="324" y="162">8</text><text x="354" y="162">9</text><text x="384" y="162">10</text><text x="414" y="162">11</text>
  </g>
  <text x="478" y="130" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">funon：n 重复 ✗</text>
  <text x="478" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">distinct = 4 &lt; 5</text>

  <g filter="url(#rough2)">
    <path d="M 158 176 L 128 176" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)"/>
    <path d="M 296 176 L 326 176" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  </g>
  <text x="143" y="192" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">← 左端 s[i−k] 出窗</text>
  <text x="311" y="192" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">右端 s[i] 进窗 →</text>

  <rect x="40" y="205" width="540" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="228" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">进窗 cnt[c]++：旧计数为 0 → distinct++（窗口里多了一种新字符）</text>
  <text x="310" y="248" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">出窗 cnt[c]−−：减到 0 → distinct−−（窗口里少了一种字符）</text>
  <text x="310" y="268" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">窗口合法 ⟺ distinct == k：k 个位置恰好装了 k 种互异字符</text>

  <rect x="40" y="296" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">每步 O(1) 增量更新，整体 O(n) —— 暴力 O(nk) 在 n, k ≤ 10⁴ 时达 10⁸ 会超时</text>
  <text x="310" y="338" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">窗口长度恒为 k：进一格必出一格，天然适配定长滑动窗口模板</text>

  <text x="310" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">⚠ k &gt; 26 时直接返回 0：小写字母只有 26 种，装不进更长的无重复窗口（鸽巢原理）</text>
</svg>
