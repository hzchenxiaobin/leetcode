<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">九进制重标号：第 n 个数 = 把 n 的九进制读成十进制</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">九进制每位只取 0~8，天然不含 9 ⇒ 正整数到「不含 9 的数」的保序双射</text>

  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">n（十进制序号）</text>
  <text x="410" y="72" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">f(n)（同一串数字读成十进制）</text>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="70" y="86" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="150" y="105" fill="#3a4a66">1</text>
    <rect x="70" y="122" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="150" y="141" fill="#3a4a66">8</text>
    <rect x="70" y="158" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="150" y="177" fill="#8a6a20">9</text>
    <rect x="70" y="194" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="150" y="213" fill="#3a4a66">10</text>
    <rect x="70" y="230" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="150" y="249" fill="#3a4a66">100</text>
    <rect x="70" y="266" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
    <text x="150" y="285" fill="#8a3a36">900000000</text>

    <rect x="330" y="86" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="410" y="105" fill="#3a5a30">1</text>
    <rect x="330" y="122" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="410" y="141" fill="#3a5a30">8</text>
    <rect x="330" y="158" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <text x="410" y="177" fill="#8a6a20">10</text>
    <rect x="330" y="194" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="410" y="213" fill="#3a5a30">11</text>
    <rect x="330" y="230" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="410" y="249" fill="#3a5a30">121</text>
    <rect x="330" y="266" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="410" y="285" fill="#8a3a36">2281451810</text>
  </g>

  <g filter="url(#rough2)" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M 238 100 L 320 100"/>
    <path d="M 238 136 L 320 136"/>
    <path d="M 238 172 L 320 172"/>
    <path d="M 238 208 L 320 208"/>
    <path d="M 238 244 L 320 244"/>
    <path d="M 238 280 L 320 280"/>
  </g>

  <rect x="60" y="306" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="326" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么基数是 9 而不是 10</text>
  <text x="76" y="344" font-size="10" fill="#555" filter="url(#rough2)">十进制每位取值 0~9；删掉 9 后每位只剩 9 种，进位基数由 10 变为 9。</text>
  <text x="76" y="360" font-size="10" fill="#555" filter="url(#rough2)">九进制第 k 位权重 9^k，映射到十进制变为 10^k，大小顺序被完整保留。</text>

  <text x="280" y="390" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">对拍：n = 1..5000 与暴力枚举一致；大 n 用独立数位计数 C(f(n)) = n 校验</text>
</svg>
