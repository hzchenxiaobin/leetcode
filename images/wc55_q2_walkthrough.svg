<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">s1 = "sea"，s2 = "eat"：按行填表求 W</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 0 行与第 0 列是全空前缀，权重为 0</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">
    <text x="224" y="92">e</text>
    <text x="280" y="92">a</text>
    <text x="336" y="92">t</text>
    <text x="126" y="166" text-anchor="end">s</text>
    <text x="126" y="210" text-anchor="end">e</text>
    <text x="126" y="254" text-anchor="end">a</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.3">
    <rect x="140" y="100" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="196" y="100" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="252" y="100" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="308" y="100" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="140" y="144" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="196" y="144" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="252" y="144" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="308" y="144" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="140" y="188" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="196" y="188" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="252" y="188" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="308" y="188" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="140" y="232" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="196" y="232" width="56" height="44" fill="#ffffff" rx="3"/>
    <rect x="252" y="232" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="308" y="232" width="56" height="44" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="3"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12" fill="#333">
    <text x="168" y="128">0</text>
    <text x="224" y="128">0</text>
    <text x="280" y="128">0</text>
    <text x="336" y="128">0</text>
    <text x="168" y="172">0</text>
    <text x="224" y="172">0</text>
    <text x="280" y="172">0</text>
    <text x="336" y="172">0</text>
    <text x="168" y="216">0</text>
    <text x="224" y="216" fill="#3a5a30" font-weight="bold">101</text>
    <text x="280" y="216">101</text>
    <text x="336" y="216">101</text>
    <text x="168" y="260">0</text>
    <text x="224" y="260">101</text>
    <text x="280" y="260" fill="#3a5a30" font-weight="bold">198</text>
    <text x="336" y="260" fill="#8a3a36" font-weight="bold">198</text>
  </g>

  <rect x="384" y="96" width="162" height="126" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="398" y="118" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">W = dp[3][3] = 198</text>
  <text x="398" y="138" font-size="10" fill="#555" filter="url(#rough2)">保留子序列 "ea"</text>
  <text x="398" y="158" font-size="10" fill="#555" filter="url(#rough2)">Σ = 313 + 314 = 627</text>
  <text x="398" y="180" font-size="10" fill="#8a3a36" filter="url(#rough2)">ans = 627 − 2×198</text>
  <text x="398" y="200" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">    = 231</text>

  <path d="M 370 254 L 356 254" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="244" font-size="9" fill="#8a6a20" filter="url(#rough2)">答案格</text>

  <text x="280" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">匹配 e：dp[2][1] = dp[1][0] + 101 = 0 + 101 = 101</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">匹配 a：dp[3][2] = dp[2][1] + 97 = 101 + 97 = 198（末列 t 无处匹配，取左邻 198）</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">绿色格子表示字符相同，走左上角 + 权值；其余格子取上 / 左两者较大者</text>
</svg>
