<svg xmlns="http://www.w3.org/2000/svg" width="660" height="370" viewBox="0 0 660 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="370" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 走查</text>
  <path d="M 250 40 Q 330 48 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="25" y="62" width="40" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="65" y="62" width="130" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="195" y="62" width="150" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="345" y="62" width="90" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="435" y="62" width="200" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="45" y="82">i</text>
    <text x="130" y="82">code</text>
    <text x="270" y="82">businessLine</text>
    <text x="390" y="82">isActive</text>
    <text x="535" y="82">判定</text>
  </g>

  <!-- 行 1：SAVE20 有效 -->
  <g filter="url(#sk)">
    <rect x="25" y="96" width="40" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="65" y="96" width="130" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="195" y="96" width="150" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="345" y="96" width="90" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="435" y="96" width="200" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="45" y="120" fill="#444">0</text>
    <text x="130" y="120" fill="#444" font-family="monospace">SAVE20</text>
    <text x="270" y="120" fill="#444" font-family="monospace">restaurant</text>
    <text x="390" y="120" fill="#444">true</text>
    <text x="535" y="120" fill="#2e6e2e" font-weight="bold">✓ 有效 (rank 3)</text>
  </g>

  <!-- 行 2：空串无效 -->
  <g filter="url(#sk)">
    <rect x="25" y="138" width="40" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="65" y="138" width="130" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="195" y="138" width="150" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="345" y="138" width="90" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="435" y="138" width="200" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="45" y="162" fill="#444">1</text>
    <text x="130" y="162" fill="#444" font-family="monospace">""</text>
    <text x="270" y="162" fill="#444" font-family="monospace">grocery</text>
    <text x="390" y="162" fill="#444">true</text>
    <text x="535" y="162" fill="#b85450" font-weight="bold">✗ code 为空</text>
  </g>

  <!-- 行 3：PHARMA5 有效 -->
  <g filter="url(#sk)">
    <rect x="25" y="180" width="40" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="65" y="180" width="130" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="195" y="180" width="150" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="345" y="180" width="90" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="435" y="180" width="200" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="45" y="204" fill="#444">2</text>
    <text x="130" y="204" fill="#444" font-family="monospace">PHARMA5</text>
    <text x="270" y="204" fill="#444" font-family="monospace">pharmacy</text>
    <text x="390" y="204" fill="#444">true</text>
    <text x="535" y="204" fill="#2e6e2e" font-weight="bold">✓ 有效 (rank 2)</text>
  </g>

  <!-- 行 4：SAVE@20 无效 -->
  <g filter="url(#sk)">
    <rect x="25" y="222" width="40" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="65" y="222" width="130" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="195" y="222" width="150" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="345" y="222" width="90" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="435" y="222" width="200" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="45" y="246" fill="#444">3</text>
    <text x="130" y="246" fill="#444" font-family="monospace">SAVE@20</text>
    <text x="270" y="246" fill="#444" font-family="monospace">restaurant</text>
    <text x="390" y="246" fill="#444">true</text>
    <text x="535" y="246" fill="#b85450" font-weight="bold">✗ 含 '@' 非法字符</text>
  </g>

  <!-- 排序输出 -->
  <path d="M 330 262 L 330 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="80" y="280" width="500" height="66" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="330" y="302" text-anchor="middle" font-size="12" fill="#7a5415">有效项按 (rank, code) 排序：pharmacy(2) 先于 restaurant(3)</text>
  <text x="330" y="328" text-anchor="middle" font-size="15" fill="#7a5415" font-family="monospace" font-weight="bold">输出 ["PHARMA5", "SAVE20"]</text>

  <!-- 底注 -->
  <text x="330" y="360" text-anchor="middle" font-size="11" fill="#888">过滤是逐条独立的与（AND）判断；排序才需要用到类别序 rank。</text>
</svg>
