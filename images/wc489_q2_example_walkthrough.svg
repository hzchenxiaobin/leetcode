<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [20, 10, 30, 30] → 答案 30</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① cnt -->
  <text x="36" y="70" font-size="11.5" fill="#446688" filter="url(#rough2)">① cnt：</text>
  <rect x="115" y="52" width="110" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="245" y="52" width="110" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="375" y="52" width="110" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">20 → 1</text>
  <text x="300" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">10 → 1</text>
  <text x="430" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">30 → 2</text>

  <!-- ② freqCnt -->
  <text x="36" y="118" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">② freqCnt：</text>
  <rect x="115" y="100" width="200" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">f=1 → 2 个值 {20,10} ✗</text>
  <rect x="335" y="100" width="200" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">f=2 → 1 个值 {30} ✓</text>

  <!-- ③ 扫描 -->
  <text x="320" y="150" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">③ 从左到右扫描，逐个判定 freqCnt[ cnt[v] ]：</text>

  <rect x="209" y="158" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="267" y="158" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="325" y="158" width="48" height="32" rx="4" fill="#ffd76e" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="383" y="158" width="48" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="233" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">20</text>
  <text x="291" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="349" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="407" y="178" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">30</text>

  <text x="233" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="291" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="349" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="407" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <text x="233" y="224" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace" filter="url(#rough2)">f = 1</text>
  <text x="291" y="224" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace" filter="url(#rough2)">f = 1</text>
  <text x="349" y="224" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace" filter="url(#rough2)">f = 2</text>
  <text x="407" y="230" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">未扫描</text>

  <text x="233" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" filter="url(#rough2)">freqCnt[1]=2</text>
  <text x="291" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" filter="url(#rough2)">freqCnt[1]=2</text>
  <text x="349" y="240" text-anchor="middle" font-size="10" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">freqCnt[2]=1</text>
  <text x="407" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（已返回）</text>

  <text x="233" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不独特</text>
  <text x="291" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不独特</text>
  <text x="349" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 命中！</text>

  <rect x="313" y="212" width="72" height="52" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M349,266 L349,282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="170" y="286" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 30 —— 第一个频率被独占的元素</text>

  <!-- 左右解释 -->
  <rect x="40" y="336" width="280" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">为什么 20、10 被否决？</text>
  <text x="180" y="372" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">f = 1 被 {20,10} 两个值共用</text>
  <text x="180" y="386" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" filter="url(#rough2)">freqCnt[1] = 2 ≠ 1</text>

  <rect x="320" y="336" width="280" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="460" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">为什么 30 是答案？</text>
  <text x="460" y="372" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">f = 2 只属于 30 一个值</text>
  <text x="460" y="386" text-anchor="middle" font-size="10" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">freqCnt[2] = 1 ✓</text>

  <!-- 底部提示 -->
  <rect x="60" y="404" width="520" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="421" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">「第一个」按扫描顺序：20 ✗ → 10 ✗ → 30 ✓，与数值大小无关</text>
</svg>
