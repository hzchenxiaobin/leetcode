<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：n = 8 的三轮首尾配对</text>
  <text x="330" y="47" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">第 1 轮括号在最内层，每过一轮整体再多包一层</text>

  <text x="108" y="86" font-size="10.5" fill="#8a6a20" text-anchor="end" filter="url(#rough2)">第 0 轮</text>
  <rect x="120" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="148" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="185" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="213" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="250" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="278" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="315" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="343" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="380" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="408" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="445" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="473" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="510" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="538" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="575" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="603" y="86" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>

  <path d="M 360 98 L 360 126" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="108" y="154" font-size="10.5" fill="#446688" text-anchor="end" filter="url(#rough2)">第 1 轮</text>
  <rect x="130" y="132" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="154" font-size="12.5" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(1,8)</text>
  <rect x="260" y="132" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="154" font-size="12.5" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(2,7)</text>
  <rect x="390" y="132" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="154" font-size="12.5" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(3,6)</text>
  <rect x="520" y="132" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="565" y="154" font-size="12.5" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(4,5)</text>

  <path d="M 360 166 L 360 194" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="108" y="222" font-size="10.5" fill="#4a7a3a" text-anchor="end" filter="url(#rough2)">第 2 轮</text>
  <rect x="140" y="200" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="222" font-size="12.5" fill="#3a5f2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">((1,8),(4,5))</text>
  <rect x="380" y="200" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="222" font-size="12.5" fill="#3a5f2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">((2,7),(3,6))</text>

  <path d="M 360 234 L 360 262" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="108" y="292" font-size="10.5" fill="#b85450" text-anchor="end" filter="url(#rough2)">第 3 轮</text>
  <rect x="190" y="268" width="380" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="292" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(((1,8),(4,5)),((2,7),(3,6)))</text>

  <rect x="40" y="332" width="580" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="356" font-size="11" fill="#2f3f55" filter="url(#rough2)">• 第 1 轮：1 打 8、2 打 7、3 打 6、4 打 5（最内层括号）</text>
  <text x="58" y="378" font-size="11" fill="#2f3f55" filter="url(#rough2)">• 第 2 轮：首尾再配——(1,8) 对 (4,5)，(2,7) 对 (3,6)</text>
  <text x="58" y="400" font-size="11" fill="#2f3f55" filter="url(#rough2)">• 第 3 轮：只剩两项，整体包一层即答案；n = 2³ ⇒ 3 轮</text>
</svg>
