<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Q1 签到策略：枚举直接拿分，公式顺手验证</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="54" width="240" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">读约束：n ≤ 12</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#2b6e9e">子集只有 2¹² = 4096 个</text>

  <path d="M 320 102 L 320 120" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,124 470,160 320,196 170,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">3 分钟内想到公式？</text>

  <path d="M 168 162 Q 110 190 145 222" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="128" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 472 162 Q 530 190 495 222" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="512" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8761a">否</text>

  <g filter="url(#sk)">
    <rect x="40" y="228" width="210" height="84" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="145" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">公式路线（思维热身）</text>
  <text x="145" y="272" text-anchor="middle" font-size="12" fill="#2e6e2e">按位拆解 + 翻折配对</text>
  <text x="145" y="292" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">ans = OR × 2ⁿ⁻¹，O(n)</text>
  <text x="145" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a">一行代码，顺手想出来就赚</text>

  <g filter="url(#sk)">
    <rect x="390" y="228" width="210" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="495" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">枚举路线（求稳首选）</text>
  <text x="495" y="272" text-anchor="middle" font-size="12" fill="#8a6415">DFS「选/不选」或位掩码</text>
  <text x="495" y="292" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">O(2ⁿ)，4096 个子集</text>
  <text x="495" y="308" text-anchor="middle" font-size="11" fill="#a1782a">几分钟内必过，Q1 别恋战</text>

  <path d="M 145 314 Q 145 336 200 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 495 314 Q 495 336 440 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="348" width="520" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">提交前自测：样例 [5,1,6] = 28</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#b85450">若两版都写了，答案必须一致 —— 交叉验证防手滑</text>
</svg>
