<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：按第 k = 2 列降序重排行</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- k badge -->
  <g filter="url(#sk)">
    <rect x="176" y="52" width="44" height="20" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="198" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">k = 2</text>

  <!-- original matrix -->
  <text x="82" y="92" text-anchor="end" font-size="12" fill="#666">#0</text>
  <text x="82" y="124" text-anchor="end" font-size="12" fill="#666">#1</text>
  <text x="82" y="156" text-anchor="end" font-size="12" fill="#666">#2</text>

  <g filter="url(#sk)">
    <rect x="90" y="72" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="138" y="72" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="186" y="72" width="48" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="234" y="72" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="90" y="104" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="138" y="104" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="186" y="104" width="48" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="234" y="104" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="90" y="136" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="138" y="136" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="186" y="136" width="48" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="234" y="136" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
  </g>
  <text x="114" y="93" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">10</text>
  <text x="162" y="93" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">6</text>
  <text x="210" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">9</text>
  <text x="258" y="93" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">1</text>
  <text x="114" y="125" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">7</text>
  <text x="162" y="125" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">5</text>
  <text x="210" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">11</text>
  <text x="258" y="125" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">2</text>
  <text x="114" y="157" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">4</text>
  <text x="162" y="157" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">8</text>
  <text x="210" y="157" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">3</text>
  <text x="258" y="157" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">15</text>
  <text x="186" y="184" text-anchor="middle" font-size="12" fill="#666">① 原矩阵（行号 #0~#2）</text>

  <!-- step 2: keys -->
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">② 排序键 = 第 2 列的值</text>

  <g filter="url(#sk)">
    <rect x="330" y="92" width="84" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="330" y="124" width="84" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="330" y="156" width="84" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="372" y="109" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">9 · #0</text>
  <text x="372" y="141" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">11 · #1</text>
  <text x="372" y="173" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">3 · #2</text>

  <g filter="url(#sk)">
    <path d="M 418 135 L 464 135" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="441" y="124" text-anchor="middle" font-size="11" fill="#888">降序</text>

  <g filter="url(#sk)">
    <rect x="472" y="92" width="84" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="472" y="124" width="84" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="472" y="156" width="84" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="514" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">11 · #1</text>
  <text x="514" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">9 · #0</text>
  <text x="514" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">3 · #2</text>

  <g filter="url(#sk)">
    <rect x="330" y="192" width="310" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="485" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">⇒ 新行序：#1 → #0 → #2</text>

  <!-- step 3: result matrix -->
  <text x="82" y="268" text-anchor="end" font-size="12" fill="#666">原#1</text>
  <text x="82" y="300" text-anchor="end" font-size="12" fill="#666">原#0</text>
  <text x="82" y="332" text-anchor="end" font-size="12" fill="#666">原#2</text>

  <g filter="url(#sk)">
    <rect x="90" y="248" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="138" y="248" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="186" y="248" width="48" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="234" y="248" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="90" y="280" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="138" y="280" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="186" y="280" width="48" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="234" y="280" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="90" y="312" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="138" y="312" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
    <rect x="186" y="312" width="48" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="234" y="312" width="48" height="32" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.1"/>
  </g>
  <text x="114" y="269" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">7</text>
  <text x="162" y="269" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">5</text>
  <text x="210" y="269" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">11</text>
  <text x="258" y="269" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">2</text>
  <text x="114" y="301" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">10</text>
  <text x="162" y="301" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">6</text>
  <text x="210" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">9</text>
  <text x="258" y="301" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">1</text>
  <text x="114" y="333" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">4</text>
  <text x="162" y="333" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">8</text>
  <text x="210" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">3</text>
  <text x="258" y="333" text-anchor="middle" font-size="15" fill="#555" font-family="monospace">15</text>
  <text x="186" y="364" text-anchor="middle" font-size="12" fill="#666">③ 按新行序整行取回 → 结果矩阵</text>

  <!-- verification box -->
  <g filter="url(#sk)">
    <rect x="330" y="248" width="310" height="112" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="485" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">第 k 列自上而下：11 &gt; 9 &gt; 3 ✓</text>
  <text x="485" y="300" text-anchor="middle" font-size="11" fill="#555">行内成绩原样保留，整行只是换了位置</text>
  <text x="485" y="322" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">[[7,5,11,2],[10,6,9,1],[4,8,3,15]]</text>
  <text x="485" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">与示例输出一致 ✓</text>
</svg>
