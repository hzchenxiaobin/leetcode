<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="530" fill="#fafafa"/>
  <text x="26" y="26" font-size="15" fill="#333" filter="url(#rough2)">算法流程：解析 → 排序 → 相邻差 + 首尾回绕</text>

  <rect x="230" y="44" width="260" height="50" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="75" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">解析 "HH:MM" → 分钟 h*60 + m</text>

  <rect x="230" y="118" width="260" height="50" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="142" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">升序排序</text>
  <text x="360" y="160" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">t[0] ≤ t[1] ≤ … ≤ t[n−1]</text>

  <polygon points="268,224 360,180 452,224 360,268" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="230" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">n &gt; 1440 ?</text>

  <rect x="520" y="196" width="170" height="56" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="605" y="220" text-anchor="middle" font-size="13" fill="#8b3a3a" filter="url(#rough2)">返回 0</text>
  <text x="605" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（鸽巢原理：必有重复）</text>

  <rect x="230" y="290" width="260" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="322" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">ans ← t[0] + 1440 − t[n−1]</text>

  <rect x="230" y="368" width="260" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#2f4f2f" filter="url(#rough2)">遍历 i = 1 … n−1：</text>
  <text x="360" y="414" text-anchor="middle" font-size="12" fill="#2f4f2f" filter="url(#rough2)">ans ← min(ans, t[i] − t[i−1])</text>

  <rect x="230" y="454" width="260" height="52" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="486" text-anchor="middle" font-size="14" fill="#2c3e50" filter="url(#rough2)">返回 ans</text>

  <path d="M360,94 L360,116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M360,168 L360,178" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M452,224 L516,224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M360,268 L360,288" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M360,342 L360,366" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M360,428 L360,452" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="468" y="216" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="370" y="284" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
</svg>
