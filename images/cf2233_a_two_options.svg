<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="372" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">Nikita 只有两种策略，每条都是线性累加</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间按整小时计：不满一小时也算一小时 ⇒ 向上取整</text>

  <g filter="url(#rough2)">
    <rect x="30" y="62" width="520" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="46" y="84" font-size="11.5" fill="#33445c" font-weight="bold">方案一 · 不用 AI：两人从第 0 小时起一起写</text>
    <rect x="46" y="94" width="488" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="290" y="112" text-anchor="middle" font-size="10" fill="#333">Maxim 速度 x　＋　Nikita 速度 y　＝　x + y 行/小时</text>
    <text x="46" y="150" font-size="11" fill="#3a4a66">完成时间　H₁ = ceil( n / (x + y) )</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="178" width="520" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="46" y="200" font-size="11.5" fill="#8a6a20" font-weight="bold">方案二 · 用 AI：先空手搭 z 小时，之后 10 倍速</text>
    <rect x="46" y="210" width="190" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="141" y="228" text-anchor="middle" font-size="10" fill="#8a3a36">0 → z：只有 Maxim 写</text>
    <rect x="236" y="210" width="298" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="385" y="228" text-anchor="middle" font-size="10" fill="#3a5a30">z 之后：(x + 10y) 行/小时</text>
    <text x="46" y="262" font-size="10.5" fill="#8a6a20">若 x·z ≥ n：H₂ = ceil( n / x )　（搭好之前就完工）</text>
    <text x="46" y="288" font-size="10.5" fill="#8a6a20">否则：H₂ = z + ceil( (n − x·z) / (x + 10y) )</text>
    <text x="46" y="314" font-size="9.5" fill="#a08040">前一条容易被忽略：工程可能在搭 AI 期间就结束了</text>
  </g>

  <text x="290" y="352" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = min( H₁ , H₂ )，逐组输出</text>
</svg>
