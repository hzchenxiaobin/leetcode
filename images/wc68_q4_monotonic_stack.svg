<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>
  <text x="280.0" y="28.0" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">单调栈：栈中存「每块的最大值」</text>
  <rect x="40.0" y="42.0" width="480.0" height="58.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56.0" y="62.0" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① x ≥ 栈顶：x 自己成一块，直接压栈</text>
  <text x="56.0" y="80.0" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② x &lt; 栈顶：弹出所有 &gt; x 的块，再把被弹块中的最大值 mx 压回</text>
  <text x="56.0" y="95.0" text-anchor="start" font-size="9.8" fill="#888" filter="url(#rough2)">栈自底向上非递减，长度就是当前前缀的最优块数</text>
  <rect x="34.0" y="112.0" width="158.0" height="112.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="113.0" y="130.0" text-anchor="middle" font-size="10.2" fill="#444" font-weight="bold" filter="url(#rough2)">读入 x = 4</text>
  <rect x="85.0" y="174.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="113.0" y="189.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="113.0" y="218.0" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">空栈 → 压入 4</text>
  <rect x="202.0" y="112.0" width="158.0" height="112.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="281.0" y="130.0" text-anchor="middle" font-size="10.2" fill="#444" font-weight="bold" filter="url(#rough2)">读入 x = 4</text>
  <rect x="253.0" y="174.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="281.0" y="189.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="253.0" y="152.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="281.0" y="167.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="281.0" y="218.0" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">4 ≥ 4 → 相等也新开一块</text>
  <rect x="370.0" y="112.0" width="158.0" height="112.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="449.0" y="130.0" text-anchor="middle" font-size="10.2" fill="#444" font-weight="bold" filter="url(#rough2)">读入 x = 2</text>
  <rect x="421.0" y="174.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="449.0" y="189.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="449.0" y="218.0" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">2 &lt; 4 → 弹出 4,4，压回 mx = 4</text>
  <rect x="34.0" y="234.0" width="158.0" height="112.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="113.0" y="252.0" text-anchor="middle" font-size="10.2" fill="#444" font-weight="bold" filter="url(#rough2)">读入 x = 3</text>
  <rect x="85.0" y="296.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="113.0" y="311.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="113.0" y="340.0" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">3 &lt; 4 → 弹出 4，压回 4</text>
  <rect x="202.0" y="234.0" width="158.0" height="112.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="281.0" y="252.0" text-anchor="middle" font-size="10.2" fill="#444" font-weight="bold" filter="url(#rough2)">读入 x = 1</text>
  <rect x="253.0" y="296.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="281.0" y="311.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="281.0" y="340.0" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">1 &lt; 4 → 弹出 4，压回 4</text>
  <rect x="370.0" y="234.0" width="158.0" height="112.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="449.0" y="252.0" text-anchor="middle" font-size="10.2" fill="#444" font-weight="bold" filter="url(#rough2)">读完，栈长 = 2</text>
  <rect x="421.0" y="296.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="449.0" y="311.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="421.0" y="274.0" width="56.0" height="20.0" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="449.0" y="289.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="449.0" y="340.0" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">5 ≥ 4 → 新块，2 块</text>
  <text x="280.0" y="372.0" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">块的最大值序列非递减 ⇒ 被合并的块总是栈顶连续一段</text>
  <text x="280.0" y="394.0" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a = [4,4,2,3,1,5] → 栈 [4,5] → 答案 2</text>
</svg>
