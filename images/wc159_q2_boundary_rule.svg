<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="620" height="408" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：判定要带 "/" 边界，排序后祖先紧邻在前</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两个性质一拼，n² 的两两比对就被压成了单遍扫描</text>

  <rect x="40" y="62" width="540" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="84" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 判定引理：f 是 g 的子文件夹 ⟺ f 以 g + "/" 开头</text>
  <text x="58" y="110" font-size="10.5" fill="#2e5a3a" filter="url(#rough2)">"/a/b/c/d"  以  "/a/b/c/"  开头  →  ✓ 子文件夹，删除</text>
  <text x="58" y="134" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"/a/b/ca"   不以 "/a/b/c/" 开头（下一位是 a）→  ✗ 兄弟目录，保留</text>
  <text x="58" y="158" font-size="10" fill="#666" filter="url(#rough2)">只判「以 /a/b/c 开头」会把 /a/b/ca 误删，这是本题最容易踩的坑</text>

  <rect x="40" y="180" width="540" height="142" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="200" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 区间封闭性：排序后，祖先与后代之间夹着的全是该祖先的后代</text>
  <rect x="58" y="212" width="112" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="232" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">/a</text>
  <rect x="182" y="212" width="112" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="232" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">/a/b</text>
  <rect x="306" y="212" width="112" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="362" y="232" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">/a/b/c</text>
  <rect x="430" y="212" width="112" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="486" y="232" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">/a/b/d</text>
  <path d="M 182 258 L 542 258" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="274" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">/a 的后代区间：中间三项全是 /a 的后代，会被连续跳过</text>
  <path d="M 306 290 L 542 290" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="306" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">/a/b 的后代区间</text>

  <rect x="40" y="332" width="540" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="354" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结论：扫描时只需要与「最后被保留的路径」prev 比较</text>
  <text x="58" y="378" font-size="10" fill="#555" filter="url(#rough2)">一旦离开 prev 的后代区间，prev 就换成新区间起点，旧祖先不会复现</text>
</svg>
