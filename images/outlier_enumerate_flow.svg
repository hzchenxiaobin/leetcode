<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 610"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="610" fill="#fafafa"/>

  <text x="290" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">算法流程：两趟线性扫描 + 带同值修正的存在性检查</text>

  <rect x="120" y="48" width="320" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">第一趟：预处理</text>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">total = Σnums；cnt[v] 记录值 v 出现次数</text>

  <path d="M 280 104 L 280 122" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="120" y="126" width="320" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">第二趟：枚举 s ∈ nums 充当「和元素」</text>

  <path d="M 280 170 L 280 188" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="150" y="192" width="260" height="40" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="13.5" fill="#33506b" filter="url(#rough2)">cand = total − 2s</text>

  <path d="M 280 232 L 280 250" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <polygon points="280,254 402,296 280,338 158,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#rough2)">cand 在 cnt 中？</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">（O(1) 查表）</text>

  <path d="M 402 296 L 424 296" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="412" y="287" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="428" y="275" width="112" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="484" y="292" text-anchor="middle" font-size="11" fill="#8a2e28" filter="url(#rough2)">跳过，</text>
  <text x="484" y="308" text-anchor="middle" font-size="11" fill="#8a2e28" filter="url(#rough2)">看下一个 s</text>

  <path d="M 280 338 L 280 356" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="293" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="280,360 412,404 280,448 148,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#rough2)">cand == s ？</text>
  <text x="280" y="418" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">（需 cnt[s] ≥ 2 才够用）</text>

  <path d="M 412 404 L 424 404" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="417" y="424" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不足</text>
  <rect x="428" y="383" width="112" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="484" y="400" text-anchor="middle" font-size="11" fill="#8a2e28" filter="url(#rough2)">跳过，</text>
  <text x="484" y="416" text-anchor="middle" font-size="11" fill="#8a2e28" filter="url(#rough2)">看下一个 s</text>

  <path d="M 280 448 L 280 466" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="293" y="462" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="150" y="470" width="260" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="499" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">ans = max(ans, cand)</text>

  <path d="M 410 493 L 556 493 L 556 148 L 446 148" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">继续枚举下一个 s</text>

  <path d="M 280 516 L 280 534" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="145" y="538" width="270" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="567" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">枚举结束，返回 ans</text>
</svg>
