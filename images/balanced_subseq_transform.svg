<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：移项之后，条件只取决于 b[i] = nums[i] − i</text>
  <path d="M 140 42 Q 350 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== 左列：三步变形 ====== -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="330" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="195" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e8a" filter="url(#sk)">原条件：值的增量 ≥ 下标的增量</text>
  <text x="195" y="114" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">相邻选中下标 p &lt; q 需满足：</text>
  <text x="195" y="140" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e5e8a" filter="url(#sk)">nums[q] − nums[p] ≥ q − p</text>

  <g filter="url(#sk)">
    <path d="M 195 164 L 195 190" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="212" y="182" font-size="12" fill="#666" filter="url(#sk)">移项：值、下标各归各</text>

  <g filter="url(#sk)">
    <rect x="30" y="200" width="330" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="195" y="226" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⟺ nums[q] − q ≥ nums[p] − p</text>
  <text x="195" y="252" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">令 b[i] = nums[i] − i：平衡 ⟺ b 依次非递减</text>
  <text x="195" y="276" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">（相等也行，条件本来就是 ≥）</text>

  <g filter="url(#sk)">
    <path d="M 195 300 L 195 326" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="336" width="330" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="195" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">问题定型：LIS 最大权和变体</text>
  <text x="195" y="388" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">在 b 上选非递减子序列，使 nums 之和最大</text>
  <text x="195" y="412" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">负前缀可以整体弃掉，随时另起炉灶</text>
  <text x="195" y="438" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">f[i] = nums[i] + max(0, 前驱最优)</text>

  <!-- ====== 右列：示例 2 ====== -->
  <text x="540" y="76" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">示例 2：nums = [5, −1, −3, 8]</text>

  <g filter="url(#sk)">
    <rect x="412" y="86" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="478" y="86" width="56" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="544" y="86" width="56" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="610" y="86" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="440" y="107">5</text>
    <text x="506" y="107">−1</text>
    <text x="572" y="107">−3</text>
    <text x="638" y="107">8</text>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="440" y="134">i=0</text>
    <text x="506" y="134">i=1</text>
    <text x="572" y="134">i=2</text>
    <text x="638" y="134">i=3</text>
  </g>

  <text x="540" y="162" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">b[i] = nums[i] − i：</text>

  <g filter="url(#sk)">
    <rect x="412" y="172" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="478" y="172" width="56" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="544" y="172" width="56" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="610" y="172" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="440" y="193">5</text>
    <text x="506" y="193">−2</text>
    <text x="572" y="193">−5</text>
    <text x="638" y="193">5</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 440 210 Q 540 250 634 212" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  </g>
  <text x="540" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">选中部分 b：5 ≤ 5，非递减 ✓</text>

  <g filter="url(#sk)">
    <rect x="400" y="260" width="280" height="64" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="540" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e8a" filter="url(#sk)">选 {0, 3}：b = 5, 5 ✓</text>
  <text x="540" y="308" text-anchor="middle" font-size="12.5" fill="#2e5e8a" filter="url(#sk)">和 = 5 + 8 = 13（最优）</text>

  <g filter="url(#sk)">
    <rect x="400" y="336" width="280" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="540" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#sk)">选 {1, 2, 3}：b = −2, −5, 5 ✗</text>
  <text x="540" y="384" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#sk)">−5 &lt; −2，领先量倒退，不合法</text>

  <g filter="url(#sk)">
    <rect x="400" y="412" width="280" height="44" rx="10" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="540" y="430" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">直觉：b 是「跑赢每步 +1 基准线的领先量」，</text>
  <text x="540" y="448" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">平衡 = 一路选下来领先量不许倒退</text>
</svg>
