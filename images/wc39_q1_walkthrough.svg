<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect x="-6" y="-6" width="572" height="412" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：c = 21（答案为 false）</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始 a = 0、b = 4，因为 ⌊√21⌋ = 4</text>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="62" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="62" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="62" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="62" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="62" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="65" y="81" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步</text>
    <text x="115" y="81" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a</text>
    <text x="170" y="81" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>
    <text x="240" y="81" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a² + b²</text>
    <text x="400" y="81" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">与 21 比较 → 动作</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="90" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="90" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="90" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="90" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="90" width="240" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="109" fill="#555" filter="url(#rough2)">1</text>
    <text x="115" y="109" fill="#555" filter="url(#rough2)">0</text>
    <text x="170" y="109" fill="#555" filter="url(#rough2)">4</text>
    <text x="240" y="109" fill="#555" filter="url(#rough2)">16</text>
    <text x="400" y="109" fill="#8a6a20" filter="url(#rough2)">16 &lt; 21 → a 加 1</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="118" width="50" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="118" width="50" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="118" width="60" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="118" width="80" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="118" width="240" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="137" fill="#555" filter="url(#rough2)">2</text>
    <text x="115" y="137" fill="#555" filter="url(#rough2)">1</text>
    <text x="170" y="137" fill="#555" filter="url(#rough2)">4</text>
    <text x="240" y="137" fill="#555" filter="url(#rough2)">17</text>
    <text x="400" y="137" fill="#8a6a20" filter="url(#rough2)">17 &lt; 21 → a 加 1</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="146" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="146" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="146" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="146" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="146" width="240" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="165" fill="#555" filter="url(#rough2)">3</text>
    <text x="115" y="165" fill="#555" filter="url(#rough2)">2</text>
    <text x="170" y="165" fill="#555" filter="url(#rough2)">4</text>
    <text x="240" y="165" fill="#555" filter="url(#rough2)">20</text>
    <text x="400" y="165" fill="#8a6a20" filter="url(#rough2)">20 &lt; 21 → a 加 1</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="174" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="174" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="174" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="174" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="174" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="65" y="193" fill="#8a6a20" filter="url(#rough2)">4</text>
    <text x="115" y="193" fill="#8a6a20" filter="url(#rough2)">3</text>
    <text x="170" y="193" fill="#8a6a20" filter="url(#rough2)">4</text>
    <text x="240" y="193" fill="#8a6a20" filter="url(#rough2)">25</text>
    <text x="400" y="193" fill="#8a3a36" filter="url(#rough2)">25 &gt; 21 → b 减 1</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="202" width="50" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="202" width="50" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="202" width="60" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="202" width="80" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="202" width="240" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="221" fill="#555" filter="url(#rough2)">5</text>
    <text x="115" y="221" fill="#555" filter="url(#rough2)">3</text>
    <text x="170" y="221" fill="#555" filter="url(#rough2)">3</text>
    <text x="240" y="221" fill="#555" filter="url(#rough2)">18</text>
    <text x="400" y="221" fill="#8a6a20" filter="url(#rough2)">18 &lt; 21 → a 加 1</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <rect x="40" y="230" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="90" y="230" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="140" y="230" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="200" y="230" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="280" y="230" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="65" y="249" fill="#8a3a36" filter="url(#rough2)">6</text>
    <text x="115" y="249" fill="#8a3a36" filter="url(#rough2)">4</text>
    <text x="170" y="249" fill="#8a3a36" filter="url(#rough2)">3</text>
    <text x="240" y="249" fill="#8a3a36" filter="url(#rough2)">—</text>
    <text x="400" y="249" fill="#8a3a36" filter="url(#rough2)">a &gt; b，指针交错 → false</text>
  </g>

  <path d="M 280 262 L 280 282" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="284" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="304" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">对照：c = 20 只需 3 步就命中</text>
  <text x="56" y="324" font-size="10.5" fill="#555" filter="url(#rough2)">(a,b) = (0,4) → 16 &lt;20；(1,4) → 17 &lt;20；(2,4) → 20 = 20 → true</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">任何一次迭代都让 a 增 1 或 b 减 1，两者都只朝对方走，故最多 2⌊√c⌋+1 步</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 ⌊√21⌋=4，a 上界与 b 下界都是同一个 ⌊√c⌋，不需要单独判断奇偶</text>
</svg>
