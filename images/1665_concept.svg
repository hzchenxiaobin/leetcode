<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：能量只降不升，初始能量由最紧的门槛决定</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="396" y="50" width="220" height="36" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <path d="M 406 60 L 434 60" stroke="#446688" stroke-width="2.6" fill="none"/>
    <path d="M 406 74 L 434 74" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" fill="none"/>
  </g>
  <text x="442" y="64" font-size="10.5" fill="#555" filter="url(#sk)">最优水位 E = 8</text>
  <text x="442" y="78" font-size="10.5" fill="#555" filter="url(#sk)">E = 7（不够）</text>

  <text x="40" y="98" font-size="12.5" fill="#666" filter="url(#sk)">能量</text>
  <g font-size="11" fill="#888" text-anchor="end" filter="url(#sk)">
    <text x="74" y="166">8</text>
    <text x="74" y="250">4</text>
    <text x="74" y="292">2</text>
    <text x="74" y="313">1</text>
    <text x="74" y="334">0</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 78 162 L 84 162 M 78 246 L 84 246 M 78 288 L 84 288 M 78 309 L 84 309 M 78 330 L 84 330" stroke="#999" stroke-width="1.2"/>
    <path d="M 70 330 L 610 330" stroke="#999999" stroke-width="1.6"/>
  </g>

  <g filter="url(#sk)">
    <rect x="130" y="246" width="90" height="84" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="250" y="288" width="90" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="370" y="309" width="90" height="21" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b4a66" filter="url(#sk)">
    <text x="175" y="296">a=4</text>
    <text x="295" y="315">a=2</text>
    <text x="415" y="325">a=1</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 130 162 L 220 162" stroke="#d6a040" stroke-width="4"/>
    <path d="M 250 246 L 340 246" stroke="#d6a040" stroke-width="4"/>
    <path d="M 370 288 L 460 288" stroke="#d6a040" stroke-width="4"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b07818" filter="url(#sk)">
    <text x="175" y="152">m=8</text>
    <text x="295" y="236">m=4</text>
    <text x="415" y="278">m=2</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 232 166 L 232 242" stroke="#4a7a3a" stroke-width="1.6" marker-start="url(#arg)" marker-end="url(#arg)"/>
    <path d="M 352 250 L 352 284" stroke="#4a7a3a" stroke-width="1.6" marker-start="url(#arg)" marker-end="url(#arg)"/>
    <path d="M 472 292 L 472 305" stroke="#4a7a3a" stroke-width="1.6" marker-start="url(#arg)" marker-end="url(#arg)"/>
  </g>
  <g font-size="11.5" fill="#4a7a3a" filter="url(#sk)">
    <text x="240" y="208">d=4</text>
    <text x="360" y="271">d=2</text>
    <text x="480" y="303">d=1</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 80 162 L 130 162 L 220 246 L 250 246 L 340 288 L 370 288 L 460 309 L 505 309" stroke="#446688" stroke-width="2.8" fill="none"/>
    <path d="M 80 183 L 130 183 L 220 267 L 268 267" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" fill="none"/>
  </g>
  <g fill="#446688" filter="url(#sk)">
    <circle cx="130" cy="162" r="3.2"/>
    <circle cx="220" cy="246" r="3.2"/>
    <circle cx="250" cy="246" r="3.2"/>
    <circle cx="340" cy="288" r="3.2"/>
    <circle cx="370" cy="288" r="3.2"/>
    <circle cx="460" cy="309" r="3.2"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">
    <text x="90" y="156">8</text>
    <text x="216" y="264" text-anchor="end">4</text>
    <text x="336" y="306" text-anchor="end">2</text>
    <text x="470" y="300">1</text>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">
    <text x="90" y="178">7</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 243 260 L 257 274 M 257 260 L 243 274" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="295" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">剩 3 &lt; 4 ✗</text>

  <text x="320" y="352" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">排序后：[4,8] → [2,4] → [1,2]，押金差 d = m − a = 4 &gt; 2 &gt; 1</text>

  <g filter="url(#sk)">
    <rect x="55" y="364" width="565" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="337" y="381" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">E = max( 前缀消耗和 + 当前门槛 ) = max(0+8, 4+4, 6+2) = 8</text>
  <text x="337" y="398" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">最优水位一路恰好贴着每道门槛滑下来</text>

  <g filter="url(#sk)">
    <rect x="55" y="414" width="565" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="337" y="433" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">能量只降不升（每个任务至少实耗 1）→ 高门槛任务必须趁早做</text>
  <text x="337" y="453" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">E=7：做到第 2 个任务只剩 3，够不到门槛 4，开工失败 ✗</text>
</svg>
