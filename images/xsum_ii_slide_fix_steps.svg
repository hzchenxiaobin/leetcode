<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 495"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="495" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">fix 三步：每次频次变动后恢复桶界</text>
  <path d="M 150 36 Q 330 44 510 36" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ① 缩容 -->
  <rect x="24" y="52" width="612" height="126" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="38" y="66" width="170" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="123" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 缩容</text>
  <text x="123" y="108" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">触发：|L| &gt; x</text>

  <rect x="230" y="64" width="210" height="66" rx="8" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="80" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L（Top-x）</text>
  <rect x="240" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3,9</text>
  <rect x="284" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,7</text>
  <rect x="328" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,4</text>
  <rect x="372" y="86" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="105" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1,6</text>

  <rect x="462" y="64" width="170" height="66" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="80" font-size="9.5" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R（其余）</text>
  <rect x="472" y="86" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1,3</text>
  <rect x="516" y="86" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1,1</text>

  <path d="M 416 100 Q 442 92 466 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="164" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">L 最弱者降级入 R，sumL −= 频次 × 值</text>

  <!-- ② 补位 -->
  <rect x="24" y="190" width="612" height="126" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="38" y="204" width="170" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="123" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 补位</text>
  <text x="123" y="246" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">触发：|L| &lt; x 且 R 非空</text>

  <rect x="230" y="202" width="210" height="66" rx="8" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="218" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L（Top-x）</text>
  <rect x="240" y="224" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3,9</text>
  <rect x="284" y="224" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,7</text>
  <rect x="328" y="224" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,4</text>

  <rect x="462" y="202" width="170" height="66" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="218" font-size="9.5" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R（其余）</text>
  <rect x="472" y="224" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="243" text-anchor="middle" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">2,2</text>
  <rect x="516" y="224" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1,5</text>
  <rect x="560" y="224" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1,1</text>

  <path d="M 466 238 Q 442 248 424 238" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">R 最强者升级入 L，sumL += 频次 × 值</text>

  <!-- ③ 换防 -->
  <rect x="24" y="328" width="612" height="126" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="38" y="342" width="170" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="123" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 换防</text>
  <text x="123" y="384" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">触发：L 最弱 &lt; R 最强</text>

  <rect x="230" y="340" width="210" height="66" rx="8" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="356" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L（Top-x）</text>
  <rect x="240" y="362" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3,9</text>
  <rect x="284" y="362" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,7</text>
  <rect x="328" y="362" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,4</text>
  <rect x="372" y="362" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="381" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1,6</text>

  <rect x="462" y="340" width="170" height="66" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="356" font-size="9.5" font-weight="bold" fill="#a06a15" filter="url(#rough2)">R（其余）</text>
  <rect x="472" y="362" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="381" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2,2</text>
  <rect x="516" y="362" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1,5</text>
  <rect x="560" y="362" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1,1</text>

  <path d="M 416 372 Q 444 360 468 370" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 468 384 Q 444 394 424 386" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="440" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两者互换：频次下降的 key 跌破桶界时，sumL 一加一减同步更新</text>

  <text x="330" y="478" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">每步至多搬运 O(1) 个 key，单次 O(log n) ⇒ 全程 O(n log n)</text>
</svg>
