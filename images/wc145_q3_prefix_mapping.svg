<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心转化：劳累 → +1，不劳累 → −1，区间和 &gt; 0 即合法</text>

  <text x="40" y="56" font-size="11" fill="#666" filter="url(#rough2)">hours[i]</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#333">
    <rect x="40" y="62" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="67" y="87">9</text>
    <rect x="100" y="62" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="127" y="87">9</text>
    <rect x="160" y="62" width="54" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="187" y="87">6</text>
    <rect x="220" y="62" width="54" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="247" y="87">0</text>
    <rect x="280" y="62" width="54" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="307" y="87">6</text>
    <rect x="340" y="62" width="54" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="367" y="87">6</text>
    <rect x="400" y="62" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="427" y="87">9</text>
  </g>

  <g stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M187,100 L187,116" marker-end="url(#arr)"/>
    <path d="M307,100 L307,116" marker-end="url(#arr)"/>
    <path d="M427,100 L427,116" marker-end="url(#arr)"/>
  </g>

  <text x="40" y="114" font-size="11" fill="#666" filter="url(#rough2)">A[i] = +1 / −1</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#333">
    <rect x="40" y="120" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="67" y="145">+1</text>
    <rect x="100" y="120" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="127" y="145">+1</text>
    <rect x="160" y="120" width="54" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="187" y="145">−1</text>
    <rect x="220" y="120" width="54" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="247" y="145">−1</text>
    <rect x="280" y="120" width="54" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="307" y="145">−1</text>
    <rect x="340" y="120" width="54" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="367" y="145">−1</text>
    <rect x="400" y="120" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="427" y="145">+1</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="474" y="62" width="186" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="567" y="88" font-size="11.5" fill="#8a6a20">劳累（&gt; 8）→ +1</text>
    <text x="567" y="112" font-size="11.5" fill="#8a6a20">不劳累（≤ 8）→ −1</text>
    <text x="567" y="140" font-size="11.5" fill="#8a6a20" font-weight="bold">区间和 &gt; 0 即合法</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="40" y="182" width="620" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="350" y="208" font-size="11.5" fill="#3a4a66">前缀和 S[j] = A[0] + A[1] + … + A[j−1]，其中 S[0] = 0</text>
    <text x="350" y="234" font-size="11.5" fill="#3a4a66">区间 (i, j] 合法 ⟺ S[j] − S[i] &gt; 0 ⟺ S[i] &lt; S[j]，长度 = j − i</text>
    <text x="350" y="260" font-size="11.5" fill="#3a4a66">答案 = max{ j − i ｜ 0 ≤ i &lt; j ≤ n 且 S[i] &lt; S[j] }</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="288" width="620" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="58" y="312" font-size="10.5" fill="#3a5a30">• A 每次只变 ±1 ⇒ 前缀和「一步一台阶」，从 i 走到 j 必先经过值 S[j] − 1</text>
    <text x="58" y="336" font-size="10.5" fill="#3a5a30">• 所以最小的合法 i 恰好是值 S[j] − 1 的首次出现位置 f(S[j] − 1)</text>
    <text x="58" y="360" font-size="10.5" fill="#3a5a30">• 每轮只需查表一次、再记下 S[j] 的首次出现 ⇒ 整题线性时间</text>
  </g>
</svg>
