<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="350" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">枚举回文根的流程</text>
  <rect x="60" y="60" width="240" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180.0" y="85.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">half = 1 … 10^5</text>
  <rect x="340" y="60" width="280" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="85.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">拼奇数位：s + reverse(s[0..-2])</text>
  <rect x="340" y="120" width="280" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480.0" y="145.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">拼偶数位：s + reverse(s)</text>
  <rect x="60" y="120" width="240" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180.0" y="145.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">得到回文根 p</text>
  <path d="M 180,102 L 180,120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340,81 L 300,81" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340,141 L 300,141" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180,162 L 180,196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="196" width="560" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="221.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">若 p² 落在 [left, right] 且 p² 是回文 → 计数 +1</text>
  <rect x="60" y="258" width="560" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="283.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每层只处理 2 个根，共 2·10^5 次判定，无需暴力扫区间</text>
  <text x="330" y="328" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">p &gt; 10^9 时 p² 超出 64 位可表示的范围上限，直接跳过</text>
</svg>
