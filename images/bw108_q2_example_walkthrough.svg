<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#888" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：S 的四次快照（每步只动两个键）</text>

  <!-- 快照 0 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="70" y="76" text-anchor="middle" font-size="12" fill="#555">初始</text>
    <rect x="40" y="86" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="70" y="108" text-anchor="middle">1</text>
    <rect x="100" y="86" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="130" y="108" text-anchor="middle">6</text>
    <rect x="160" y="86" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="190" y="108" text-anchor="middle">7</text>
    <rect x="220" y="86" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="108" text-anchor="middle">8</text>
  </g>
  <path d="M 150 126 C 150 134, 150 136, 150 142" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="140" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① erase(1), insert(2)</text>

  <!-- 快照 1 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="70" y="176" text-anchor="middle" font-size="12" fill="#555">① 后</text>
    <rect x="40" y="186" width="60" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4 3"/>
    <text x="70" y="208" text-anchor="middle" fill="#b85450">1 ✂</text>
    <rect x="100" y="186" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="130" y="208" text-anchor="middle">2</text>
    <rect x="160" y="186" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="190" y="208" text-anchor="middle">6</text>
    <rect x="220" y="186" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="208" text-anchor="middle">7</text>
    <rect x="280" y="186" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="310" y="208" text-anchor="middle">8</text>
  </g>
  <path d="M 150 226 C 150 232, 150 236, 150 242" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="242" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">② erase(7), insert(9)</text>

  <!-- 快照 2/3 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="70" y="276" text-anchor="middle" font-size="12" fill="#555">② 后</text>
    <rect x="40" y="286" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="70" y="308" text-anchor="middle">2</text>
    <rect x="100" y="286" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="130" y="308" text-anchor="middle">6</text>
    <rect x="160" y="286" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="190" y="308" text-anchor="middle">8</text>
    <rect x="220" y="286" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="250" y="308" text-anchor="middle">9</text>
  </g>

  <!-- 右侧：最终 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="470" y="276" text-anchor="middle" font-size="12" fill="#555">③ erase(2), insert(5) 后 → 输出</text>
    <rect x="360" y="286" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="388" y="308" text-anchor="middle" fill="#b85450">5</text>
    <rect x="416" y="286" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="444" y="308" text-anchor="middle" fill="#b85450">6</text>
    <rect x="472" y="286" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="500" y="308" text-anchor="middle" fill="#b85450">8</text>
    <rect x="528" y="286" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="556" y="308" text-anchor="middle" fill="#b85450">9</text>
  </g>

  <!-- 右上：示例 2 -->
  <g filter="url(#rough2)">
    <rect x="400" y="60" width="200" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.6"/>
    <text x="500" y="84" text-anchor="middle" font-size="12.5" fill="#d6a040">示例 2（合并到同一位置）</text>
    <text x="500" y="106" text-anchor="middle" font-size="12" fill="#333">nums = [1,1,3,3] → S = {1,3}</text>
    <text x="500" y="130" text-anchor="middle" font-size="12" fill="#333">① 1→2：S = {2,3}</text>
    <text x="500" y="154" text-anchor="middle" font-size="12" fill="#333">② 3→2：S = {2}</text>
    <text x="500" y="182" text-anchor="middle" font-size="12.5" fill="#b85450">返回 [2]（4 块石块挤在</text>
    <text x="500" y="198" text-anchor="middle" font-size="12.5" fill="#b85450">同一个位置）</text>
  </g>
</svg>
