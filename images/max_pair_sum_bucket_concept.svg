<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按最大数位分桶，桶内取最大的两个</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums chips: max digit in red -->
  <g filter="url(#sk)">
    <rect x="74" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="204" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="334" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="454" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="564" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="100" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333"><tspan fill="#b85450">5</tspan>1</text>
  <text x="230" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333"><tspan fill="#b85450">7</tspan>1</text>
  <text x="360" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1<tspan fill="#b85450">7</tspan></text>
  <text x="480" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2<tspan fill="#b85450">4</tspan></text>
  <text x="590" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333"><tspan fill="#b85450">4</tspan>2</text>
  <text x="100" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">最大位 5</text>
  <text x="230" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">最大位 7</text>
  <text x="360" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">最大位 7</text>
  <text x="480" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">最大位 4</text>
  <text x="590" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">最大位 4</text>

  <!-- arrows chips -> buckets -->
  <path d="M 100 118 Q 103 145 115 164" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 230 118 Q 255 150 300 164" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 360 118 Q 355 148 342 164" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 480 118 Q 490 145 508 164" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 590 118 Q 575 148 532 164" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- buckets -->
  <g filter="url(#sk)">
    <rect x="50" y="170" width="150" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="125" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">桶 5</text>
  <text x="125" y="218" text-anchor="middle" font-size="12.5" fill="#333">元素：51</text>
  <text x="125" y="248" text-anchor="middle" font-size="11.5" fill="#b85450">只有 1 个数</text>
  <text x="125" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">凑不成对 ✗</text>

  <g filter="url(#sk)">
    <rect x="245" y="170" width="150" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="320" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">桶 7</text>
  <text x="320" y="218" text-anchor="middle" font-size="12.5" fill="#333">元素：71, 17</text>
  <text x="320" y="248" text-anchor="middle" font-size="12" fill="#333">Top-2：71 + 17</text>
  <text x="320" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">= 88 ✓</text>

  <g filter="url(#sk)">
    <rect x="440" y="170" width="150" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="515" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">桶 4</text>
  <text x="515" y="218" text-anchor="middle" font-size="12.5" fill="#333">元素：24, 42</text>
  <text x="515" y="248" text-anchor="middle" font-size="12" fill="#333">Top-2：42 + 24</text>
  <text x="515" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">= 66</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="316" width="560" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="11.5" fill="#7a5415">最大数位只有 1~9 共 9 种 → 值域有限，用长度 10 的定长数组代替哈希表</text>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415">答案 = 各桶 Top-2 和的最大值 = max(88, 66) = 88；所有桶都凑不成对时才返回 -1</text>
</svg>
