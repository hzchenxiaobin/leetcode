<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="600" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：后缀最小 + 一遍扫描 + 尽情弹栈</text>

  <!-- start -->
  <g filter="url(#sk)"><ellipse cx="310" cy="64" rx="52" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="69" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#sk)">开始</text>
  <path d="M 310 84 L 310 104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- preprocess -->
  <g filter="url(#sk)"><rect x="160" y="106" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="310" y="124" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">倒序预处理后缀最小数组</text>
  <text x="310" y="140" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">suf[i] = min(s[i..n−1])，suf[n] = '{'（哨兵）</text>
  <path d="M 310 146 L 310 166" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- loop init -->
  <g filter="url(#sk)"><rect x="190" y="168" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="189" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#sk)">i = 0 … n−1 逐字符扫描</text>
  <path d="M 310 202 L 310 222" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- push -->
  <g filter="url(#sk)"><rect x="200" y="224" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="245" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#sk)">操作①：s[i] 压入栈 t</text>
  <path d="M 310 258 L 310 278" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)"><path d="M 310 282 L 420 324 L 310 366 L 200 324 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="318" text-anchor="middle" font-size="12" fill="#a06a1a" filter="url(#sk)">t 非空 且</text>
  <text x="310" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#sk)">top(t) ≤ suf[i+1] ?</text>

  <!-- yes: pop loop -->
  <path d="M 420 324 L 492 324 L 492 384 L 320 384" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="470" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="160" y="368" width="160" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="240" y="389" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">操作②：弹出，p += top</text>
  <path d="M 240 368 L 240 324 L 196 324" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="150" y="358" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">弹完继续判断</text>

  <!-- no: next i -->
  <path d="M 200 324 L 120 324 L 120 185 L 186 185" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="146" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <text x="118" y="256" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">i++</text>

  <!-- after loop -->
  <path d="M 120 185 L 120 100 L 310 100 L 310 76" fill="none" stroke="#8aa2b8" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="98" y="142" text-anchor="middle" font-size="11" fill="#8aa2b8" filter="url(#sk)">扫完</text>
  <path d="M 310 370 L 310 440" fill="none" stroke="#8aa2b8" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)" transform="translate(0,40)"/>
  <path d="M 310 410 L 310 448" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- final drain -->
  <g filter="url(#sk)"><rect x="170" y="450" width="280" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="310" y="468" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">s 已空：把 t 里剩下的全部弹出</text>
  <text x="310" y="484" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">（此时无后顾之忧，m = +∞）</text>
  <path d="M 310 490 L 310 510" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- end -->
  <g filter="url(#sk)"><ellipse cx="310" cy="534" rx="66" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="539" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#sk)">输出 p，结束</text>

  <text x="310" y="580" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">每个字符恰好压一次、弹一次 → 总操作 2n 次，时间 O(n)</text>
</svg>
