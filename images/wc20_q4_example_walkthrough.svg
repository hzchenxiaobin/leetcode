<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：machines = [1, 0, 5]，avg = 2，答案 3</text>
  <text x="320" y="47" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">左表逐台累加前缀，右图给出三件「衣服」实际怎么走</text>

  <g filter="url(#rough2)">
    <rect x="55" y="62" width="530" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="95" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">i</text>
    <text x="200" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">a_i</text>
    <text x="325" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">d_i = a_i − 2</text>
    <text x="455" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">cur（= S_i）</text>
    <text x="545" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66">ans</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="55" y="94" width="530" height="30" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="4"/>
    <text x="95" y="114" text-anchor="middle">0</text>
    <text x="200" y="114" text-anchor="middle">1</text>
    <text x="325" y="114" text-anchor="middle" fill="#b85450">−1</text>
    <text x="455" y="114" text-anchor="middle">−1</text>
    <text x="545" y="114" text-anchor="middle">1</text>

    <rect x="55" y="124" width="530" height="30" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="4"/>
    <text x="95" y="144" text-anchor="middle">1</text>
    <text x="200" y="144" text-anchor="middle">0</text>
    <text x="325" y="144" text-anchor="middle" fill="#b85450">−2</text>
    <text x="455" y="144" text-anchor="middle" fill="#b85450">−3</text>
    <text x="545" y="144" text-anchor="middle">3</text>

    <rect x="55" y="154" width="530" height="30" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="4"/>
    <text x="95" y="174" text-anchor="middle">2</text>
    <text x="200" y="174" text-anchor="middle">5</text>
    <text x="325" y="174" text-anchor="middle" fill="#4a7a3a">+3</text>
    <text x="455" y="174" text-anchor="middle">0</text>
    <text x="545" y="174" text-anchor="middle" fill="#4a7a3a">3</text>
  </g>

  <text x="320" y="203" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">max|S_i| = 3（缝隙 1 要往左搬 3 件）｜max d_i = 3（机器 2 每步最多送 1 件，共 3 件）</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#444">
    <text x="62" y="238" font-weight="bold">第 1 步</text>
    <text x="62" y="283" font-weight="bold">第 2 步</text>
    <text x="62" y="328" font-weight="bold">第 3 步</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="140" y="220" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="155" y="238" fill="#22334a">1</text>
    <rect x="178" y="220" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="193" y="238" fill="#22334a">0</text>
    <rect x="216" y="220" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="231" y="238" fill="#8a6a20">5</text>
    <text x="272" y="238" fill="#888">⇒</text>
    <rect x="296" y="220" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="311" y="238" fill="#22334a">1</text>
    <rect x="334" y="220" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="349" y="238" fill="#2f5426">1</text>
    <rect x="372" y="220" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="387" y="238" fill="#2f5426">4</text>
    <text x="470" y="238" fill="#777">机器 2 → 机器 1</text>

    <rect x="140" y="265" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="155" y="283" fill="#22334a">1</text>
    <rect x="178" y="265" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="193" y="283" fill="#22334a">1</text>
    <rect x="216" y="265" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="231" y="283" fill="#8a6a20">4</text>
    <text x="272" y="283" fill="#888">⇒</text>
    <rect x="296" y="265" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="311" y="283" fill="#2f5426">2</text>
    <rect x="334" y="265" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="349" y="283" fill="#22334a">1</text>
    <rect x="372" y="265" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="387" y="283" fill="#2f5426">3</text>
    <text x="470" y="283" fill="#777">机器 2 → 1，机器 1 → 0</text>

    <rect x="140" y="310" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="155" y="328" fill="#2f5426">2</text>
    <rect x="178" y="310" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="193" y="328" fill="#8a6a20">1</text>
    <rect x="216" y="310" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="231" y="328" fill="#8a6a20">3</text>
    <text x="272" y="328" fill="#888">⇒</text>
    <rect x="296" y="310" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="311" y="328" fill="#2f5426">2</text>
    <rect x="334" y="310" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="349" y="328" fill="#2f5426">2</text>
    <rect x="372" y="310" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="387" y="328" fill="#2f5426">2</text>
    <text x="470" y="328" fill="#777">机器 2 → 机器 1，结束</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="80" y="352" width="480" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#2f5426">两个下界同时取到：缝隙 1 每步搬 1 件、机器 2 每步送 1 件，3 步恰好搬完</text>
    <text x="320" y="388" text-anchor="middle" font-size="9.8" fill="#3f5a36">注意第 2 步里机器 1 一边从右边收件、一边向左边送件，这正是「接力」不需要额外步数的原因</text>
  </g>
</svg>
