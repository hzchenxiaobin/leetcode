  <text x="245.0" y="96.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk2)"><rect x="276" y="72" width="46" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="299.0" y="96.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><rect x="330" y="72" width="46" height="40" rx="7" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.7"/></g>
  <text x="353.0" y="96.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0</text>
