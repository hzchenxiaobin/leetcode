  <text x="67.0" y="208.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">i</text>
  <g filter="url(#sk2)"><rect x="94" y="192" width="84" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="136.0" y="208.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">seats[i]</text>
  <g filter="url(#sk2)"><rect x="178" y="192" width="74" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
