  <text x="137" y="126" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="191" y="126" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="245" y="126" text-anchor="middle" font-size="10" fill="#888">3</text>
