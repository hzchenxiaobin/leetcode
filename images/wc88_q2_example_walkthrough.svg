  </defs>
  <rect width="660" height="462" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：seats = [1,0,0,0,1,0,1]</text>
