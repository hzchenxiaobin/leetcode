  <text x="340.0" y="208.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">候选距离</text>
  <g filter="url(#sk2)"><rect x="428" y="192" width="56" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="456.0" y="208.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">ans</text>
