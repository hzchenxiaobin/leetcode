  <text x="215.0" y="233.5" text-anchor="middle" font-size="11.5" fill="#333">-1 → 0</text>
  <g filter="url(#sk2)"><rect x="252" y="217" width="176" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="340.0" y="233.5" text-anchor="middle" font-size="11.5" fill="#333">max(0, 0) = 0（首段）</text>
  <g filter="url(#sk2)"><rect x="428" y="217" width="56" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="456.0" y="233.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="40" y="242" width="54" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="67.0" y="258.5" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <g filter="url(#sk2)"><rect x="94" y="242" width="84" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="136.0" y="258.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="178" y="242" width="74" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="215.0" y="258.5" text-anchor="middle" font-size="11.5" fill="#333">0 → 4</text>
  <g filter="url(#sk2)"><rect x="252" y="242" width="176" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="340.0" y="258.5" text-anchor="middle" font-size="11.5" fill="#333">(4-0)/2 = 2（中段）</text>
  <g filter="url(#sk2)"><rect x="428" y="242" width="56" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="456.0" y="258.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="40" y="267" width="54" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="67.0" y="283.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <g filter="url(#sk2)"><rect x="94" y="267" width="84" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="136.0" y="283.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="178" y="267" width="74" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="215.0" y="283.5" text-anchor="middle" font-size="11.5" fill="#333">4 → 6</text>
  <g filter="url(#sk2)"><rect x="252" y="267" width="176" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="340.0" y="283.5" text-anchor="middle" font-size="11.5" fill="#333">(6-4)/2 = 1（中段）</text>
  <g filter="url(#sk2)"><rect x="428" y="267" width="56" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="456.0" y="283.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="40" y="292" width="54" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="67.0" y="308.5" text-anchor="middle" font-size="11.5" fill="#333">收尾</text>
  <g filter="url(#sk2)"><rect x="94" y="292" width="84" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="136.0" y="308.5" text-anchor="middle" font-size="11.5" fill="#333">—</text>
  <g filter="url(#sk2)"><rect x="178" y="292" width="74" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="215.0" y="308.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <g filter="url(#sk2)"><rect x="252" y="292" width="176" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="340.0" y="308.5" text-anchor="middle" font-size="11.5" fill="#333">7-1-6 = 0（尾段）</text>
  <g filter="url(#sk2)"><rect x="428" y="292" width="56" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="456.0" y="308.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="45.0" y="341.0" width="570" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="362.5" text-anchor="middle" font-size="10.5" fill="#2b4a6e">示例 2：seats = [1,0,0,0] → 尾段距离 = 4-1-0 = 3</text>
  <text x="330" y="377.0" text-anchor="middle" font-size="10.5" fill="#2b4a6e">示例 3：seats = [0,1] → 首段距离 = 1</text>
  <g filter="url(#sk2)"><rect x="150.0" y="408.0" width="360" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="429.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">答案分别是 2 / 3 / 1</text>
