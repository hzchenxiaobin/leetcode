<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">最左边的 0 只有一种救法：翻转以它为左端的那一段</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">任何覆盖 index 0 的长度 k 窗口，左端点只能落在 0（越界），所以决策被迫</text>

  <rect x="60" y="80" width="60" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="90" y="114" font-size="17" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="124" y="80" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="154" y="114" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="188" y="80" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="218" y="114" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="252" y="80" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="282" y="114" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="316" y="80" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="346" y="114" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>

  <text x="90" y="152" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="154" y="152" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="218" y="152" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="282" y="152" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="346" y="152" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">4</text>

  <rect x="60" y="168" width="188" height="40" fill="none" stroke="#b85450" stroke-width="2" rx="6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="154" y="228" font-size="10.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">k = 3 时唯一覆盖 index 0 的窗口 [0,2]</text>
  <path d="M 154 210 L 154 236" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="30" y="248" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="268" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">从左往右扫：遇到实际为 0 的位置 i 就必须翻 [i, i+k−1]；若 i+k &gt; n 则无解。</text>
  <text x="42" y="286" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每一步都被迫，因此贪心的选择唯一，不存在「选了另一个更好」的可能 —— 这就是最优性来源。</text>
</svg>
