<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">选定一个下标与最终值 v，所有与 v 不互质的元素都必须改</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">改一个元素的最小代价是 1（改成 1 即可与任何数互质）</text>
  <text x="40" y="86" text-anchor="start" font-size="11" fill="#333" font-weight="bold">nums = [3, 4, 6]，maxVal = 5</text>
  <rect x="60" y="100" width="66" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93.0" y="128.04" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="93.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="138" y="100" width="66" height="46" fill="#f2f2f2" stroke="#999999" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171.0" y="128.04" text-anchor="middle" font-size="14" fill="#999999" font-weight="bold">4</text>
  <text x="171.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="216" y="100" width="66" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249.0" y="128.04" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="249.0" y="168" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <rect x="300" y="100" width="220" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">选 v = 5（把 6 改成 5）</text>
  <text x="410" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">gcd(5,3)=1，gcd(5,4)=1 ✓</text>
  <rect x="40" y="196" width="236" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="158" y="223" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">情形 A：不改被选元素</text>
  <text x="158" y="236" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">v = nums[i]，代价 = 不互质者个数</text>
  <rect x="296" y="196" width="236" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="414" y="223" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">情形 B：改被选元素</text>
  <text x="414" y="236" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">v ≤ maxVal，代价 = 1 + 不互质者个数</text>
  <rect x="40" y="272" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">得分 = v − 代价；只需枚举「存在的 v」与「1..maxVal 的 v」两类候选</text>
  <rect x="40" y="328" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例 1 最优：v = 5、代价 1 → 得分 4；v = 6、代价 2 → 得分 4</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">关键：不互质的元素改成 1 一定合法（1 与任何数互质，且 1 ≤ maxVal）</text>
</svg>
