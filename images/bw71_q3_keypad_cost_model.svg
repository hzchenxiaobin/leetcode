<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">按键代价模型：移动 moveCost + 按下 pushCost</text>

  <!-- keypad -->
  <text x="130" y="60" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">微波炉数字键盘</text>
  <g filter="url(#rough2)">
    <rect x="76" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="72" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="76" y="112" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="112" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="112" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="152" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="152" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="152" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="192" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="192" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="168" y="192" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="96" y="94">1</text><text x="142" y="94">2</text><text x="188" y="94">3</text>
    <text x="96" y="134">4</text><text x="142" y="134">5</text><text x="188" y="134">6</text>
    <text x="96" y="174">7</text><text x="142" y="174">8</text><text x="188" y="174">9</text>
    <text x="96" y="214">0</text>
  </g>
  <text x="188" y="246" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">startAt：起点</text>
  <text x="142" y="246" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">目标键</text>

  <!-- move arrow -->
  <path d="M 186 138 C 176 146, 166 154, 154 162" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="150" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">移指</text>

  <!-- cost formula box -->
  <g filter="url(#rough2)">
    <rect x="280" y="66" width="250" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <text x="405" y="92" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)" text-anchor="middle">按一个数字串 s 的总代价</text>
  <text x="405" y="120" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">cost = (位数 × pushCost)</text>
  <text x="405" y="140" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">      + (换键次数 × moveCost)</text>
  <text x="405" y="168" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">换键次数：s 中相邻不同字符的对数</text>
  <text x="405" y="186" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">（起点 startAt 也要参与第一次比较）</text>
  <text x="405" y="204" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">连续相同数字只按一次移指！</text>

  <!-- display semantics -->
  <g filter="url(#rough2)">
    <rect x="280" y="236" width="250" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="405" y="260" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">显示语义：不足 4 位补前导 0</text>
  <text x="405" y="284" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">输入「9 5 4」→ 补成 0954</text>
  <text x="405" y="304" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">0954 → 09 分 54 秒 = 594 秒</text>
  <text x="405" y="328" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">但「954」只需按 3 个键，比</text>
  <text x="405" y="346" font-size="12" fill="#666" filter="url(#rough2)" text-anchor="middle">「0954」少一次按键 → 少付 pushCost</text>
</svg>
