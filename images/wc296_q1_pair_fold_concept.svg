<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：两两配对折叠，min/max 由「写位置 i」的奇偶决定</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A : one round 8 -> 4 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="56" width="590" height="264" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="76" y="78" font-size="13" font-weight="bold" fill="#555">一轮折叠：n = 8 → n/2 = 4</text>

  <!-- 8 source cells -->
  <g filter="url(#sk)">
    <rect x="76" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="140" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="204" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="268" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="332" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="396" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="460" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="524" y="90" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="103" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">1</text>
  <text x="167" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">3</text>
  <text x="231" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">5</text>
  <text x="295" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
  <text x="359" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">4</text>
  <text x="423" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">8</text>
  <text x="487" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
  <text x="551" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">2</text>
  <text x="103" y="142" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="167" y="142" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="231" y="142" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="295" y="142" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="359" y="142" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="423" y="142" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="487" y="142" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="551" y="142" text-anchor="middle" font-size="10" fill="#888">7</text>

  <!-- pair braces -->
  <path d="M 80 148 Q 135 166 190 148" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 208 148 Q 263 166 318 148" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 336 148 Q 391 166 446 148" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 464 148 Q 519 166 574 148" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- pair center arrows -->
  <path d="M 135 168 L 135 194" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 263 168 L 263 194" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 391 168 L 391 194" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <path d="M 519 168 L 519 194" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>

  <!-- formulas between arrows -->
  <text x="199" y="186" text-anchor="middle" font-size="11" fill="#777">min(1,3)</text>
  <text x="327" y="186" text-anchor="middle" font-size="11" fill="#777">max(5,2)</text>
  <text x="455" y="186" text-anchor="middle" font-size="11" fill="#777">min(4,8)</text>
  <text x="586" y="186" text-anchor="middle" font-size="11" fill="#777">max(2,2)</text>

  <!-- new array 4 cells -->
  <g filter="url(#sk)">
    <rect x="107" y="200" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="235" y="200" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="363" y="200" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="491" y="200" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="135" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="263" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">5</text>
  <text x="391" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">4</text>
  <text x="519" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">2</text>
  <text x="135" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">新下标 0（偶→min）</text>
  <text x="263" y="256" text-anchor="middle" font-size="10" fill="#a0751c">新下标 1（奇→max）</text>
  <text x="391" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">新下标 2（偶→min）</text>
  <text x="519" y="256" text-anchor="middle" font-size="10" fill="#a0751c">新下标 3（奇→max）</text>
  <text x="345" y="300" text-anchor="middle" font-size="11" fill="#777">配对方式固定：第 i 个结果 ← 第 2i、2i+1 个原值（与值的大小、原奇偶位无关）</text>

  <!-- ===== right note : parity rule ===== -->
  <g filter="url(#sk)">
    <rect x="660" y="56" width="240" height="264" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="780" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">奇偶规则看哪里？</text>
  <text x="680" y="112" font-size="12" fill="#444">min / max 由「新下标 i」</text>
  <text x="680" y="134" font-size="12" fill="#444">——即 写入位置—— 的奇偶</text>
  <text x="680" y="156" font-size="12" fill="#b85450" font-weight="bold">决定，与读取位置无关！</text>
  <g filter="url(#sk)">
    <rect x="692" y="176" width="86" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="794" y="176" width="86" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="735" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">i 偶 → min</text>
  <text x="837" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i 奇 → max</text>
  <text x="680" y="232" font-size="12" fill="#444">例：max(5,2)=5 落在 i=1</text>
  <text x="680" y="254" font-size="12" fill="#444">（奇），5 虽来自偶位 2、</text>
  <text x="680" y="276" font-size="12" fill="#444">2 来自奇位 3，都不影响。</text>
  <text x="680" y="304" font-size="11" fill="#b85450" font-weight="bold">看错这一句是本题头号 WA</text>

  <!-- ===== Panel B1 : in-place fold ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="346" width="430" height="196" rx="10" fill="#f4f9f4" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="372" font-size="14" font-weight="bold" fill="#2e5e2e">原地折叠：读取位置恒在写位置右边</text>
  <g filter="url(#sk)">
    <rect x="76" y="392" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="164" y="446" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="238" y="446" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="109" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">写 i</text>
  <text x="197" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">读 2i</text>
  <text x="271" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">读 2i+1</text>
  <path d="M 195 442 Q 160 428 132 434" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 269 442 Q 210 424 138 432" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="330" y="404" font-size="11.5" fill="#444">2i ＞ i，2i+1 ＞ i（i ≥ 1）</text>
  <text x="330" y="428" font-size="11.5" fill="#444">从左到右处理：读的格子</text>
  <text x="330" y="452" font-size="11.5" fill="#444">还没被本轮写过，不踩踏</text>
  <text x="330" y="476" font-size="11.5" fill="#444">后半段 [n/2, n) 直接废弃</text>
  <text x="76" y="516" font-size="11.5" fill="#b85450" font-weight="bold">唯一边界 i=0：自读自写，赋值「右值先算」即安全</text>

  <!-- ===== Panel B2 : why direct translation suffices ===== -->
  <g filter="url(#sk)">
    <rect x="500" y="346" width="400" height="196" rx="10" fill="#fdf8ec" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="520" y="372" font-size="14" font-weight="bold" fill="#7a5415">为什么直译题面就能过？</text>
  <text x="520" y="402" font-size="12.5" fill="#444">每轮长度 n → n/2，共 log₂n ≤ log₂1024 = 10 轮</text>
  <text x="520" y="430" font-size="12.5" fill="#444">每轮 n/2 次 min/max，总工作量：</text>
  <text x="700" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">n + n/2 + … + 1 = 2n − 1 ≤ 2047</text>
  <text x="520" y="494" font-size="12.5" fill="#444">n ≤ 1024：O(n) 直译稳过，签到题不恋战</text>
  <text x="520" y="522" font-size="11.5" fill="#b85450" font-weight="bold">时间无忧 ⇒ 剩下的考点只有「照抄题面不出错」</text>
</svg>
