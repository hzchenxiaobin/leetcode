<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" viewBox="0 0 880 650" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="880" height="650" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：逐词扫描 → 判定 → 整数换算 → 格式化拼接</text>
  <path d="M 240 44 Q 440 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主流程左列 -->
  <rect x="80" y="64" width="260" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="89" text-anchor="middle" font-size="13" fill="#333">按单空格切分 sentence</text>

  <rect x="80" y="128" width="260" height="40" rx="20" fill="#fef9ef" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="153" text-anchor="middle" font-size="13" fill="#333">取出下一个单词 w</text>

  <polygon points="210,198 350,244 210,290 70,244" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="210" y="249" text-anchor="middle" font-size="13" fill="#333">w 是价格单词？</text>

  <rect x="80" y="312" width="260" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="337" text-anchor="middle" font-size="13" fill="#333">p ← w[1..] 解析为整数（64 位）</text>

  <rect x="80" y="376" width="260" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="401" text-anchor="middle" font-size="13" fill="#333">v ← p × (100 − discount)</text>

  <rect x="80" y="440" width="260" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="465" text-anchor="middle" font-size="13" fill="#333">整数部分 v/100，角分 v%100</text>

  <rect x="80" y="504" width="260" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="210" y="529" text-anchor="middle" font-size="13" fill="#333">格式化 $整数.角分（%02d 补零）</text>

  <rect x="80" y="568" width="260" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="210" y="596" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">单空格拼接 → 返回答案</text>

  <!-- 箭头：主链 -->
  <path d="M 210 104 L 210 124" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 210 168 L 210 194" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 210 290 L 210 308" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="222" y="306" font-size="12.5" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 210 352 L 210 372" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 210 416 L 210 436" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 210 480 L 210 500" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 210 544 L 210 564" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 否分支 -->
  <path d="M 350 244 L 426 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="372" y="234" font-size="12.5" font-weight="bold" fill="#b85450">否</text>
  <rect x="430" y="224" width="170" height="40" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="515" y="249" text-anchor="middle" font-size="13" fill="#333">原样保留 w</text>
  <path d="M 515 264 C 515 560, 420 590, 344 590" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- 循环回边 -->
  <path d="M 80 590 C 24 590, 24 148, 76 148" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#arK)" filter="url(#sk)"/>
  <text x="36" y="384" font-size="11" fill="#999" transform="rotate(-90 36 384)">逐词循环，直至句末</text>

  <!-- 右侧要点 -->
  <rect x="560" y="320" width="288" height="180" rx="10" fill="#fef9ef" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="704" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">全程整数，不碰浮点</text>
  <text x="704" y="374" text-anchor="middle" font-size="12" fill="#333">p ≤ 9999999999（10 位数字）</text>
  <text x="704" y="396" text-anchor="middle" font-size="12" fill="#333">v = p × (100 − discount) ≤ 10¹²</text>
  <text x="704" y="418" text-anchor="middle" font-size="12" fill="#333">64 位整数装得下，32 位会爆</text>
  <text x="704" y="440" text-anchor="middle" font-size="12" fill="#333">角分 v%100 用 %02d 补零（5 分 → .05）</text>
  <text x="704" y="462" text-anchor="middle" font-size="12" fill="#333">折后价恰两位小数，零舍入</text>
  <text x="704" y="484" text-anchor="middle" font-size="11" fill="#888">价格是整数 × 整百分比，天然无第三位小数</text>

  <rect x="560" y="520" width="288" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="704" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36">⚠ 常见翻车点</text>
  <text x="704" y="570" text-anchor="middle" font-size="11.5" fill="#8c3a36">先算乘积再拆 v/100、v%100；用 int 存 10 位价格必溢出</text>
</svg>
