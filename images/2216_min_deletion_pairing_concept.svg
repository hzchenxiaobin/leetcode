<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：保留流两两配对、对内不等；撞上相等必删其一</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">删除后的保留元素是子序列，按 (槽1,槽2)(槽3,槽4)… 分组，每组两值不同</text>

  <!-- original array -->
  <text x="56" y="106" font-size="12" fill="#666" filter="url(#sk)">原数组</text>
  <g filter="url(#sk)">
    <rect x="120" y="84" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="164" y="84" width="44" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="208" y="84" width="44" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="252" y="84" width="44" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="296" y="84" width="44" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="340" y="84" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="142" y="107">1</text>
    <text x="186" y="107">1</text>
    <text x="230" y="107">2</text>
    <text x="274" y="107">2</text>
    <text x="318" y="107">3</text>
    <text x="362" y="107">3</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="142" y="132">0</text>
    <text x="186" y="132">1</text>
    <text x="230" y="132">2</text>
    <text x="274" y="132">3</text>
    <text x="318" y="132">4</text>
    <text x="362" y="132">5</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#sk)">
    <path d="M 127 89 L 157 115"/>
    <path d="M 157 89 L 127 115"/>
    <path d="M 347 89 L 377 115"/>
    <path d="M 377 89 L 347 115"/>
  </g>

  <!-- arrow down -->
  <path d="M 252 146 L 252 172" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="163" font-size="11.5" fill="#a04038" filter="url(#sk)">删 nums[0]、nums[5]</text>

  <!-- kept stream -->
  <text x="56" y="204" font-size="12" fill="#666" filter="url(#sk)">保留流</text>
  <g filter="url(#sk)">
    <rect x="120" y="180" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="164" y="180" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="208" y="180" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="252" y="180" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="142" y="203">1</text>
    <text x="186" y="203">2</text>
    <text x="230" y="203">2</text>
    <text x="274" y="203">3</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="142" y="228">槽1</text>
    <text x="186" y="228">槽2</text>
    <text x="230" y="228">槽3</text>
    <text x="274" y="228">槽4</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#4a8e4a" stroke-width="2.2">
    <rect x="116" y="176" width="96" height="44" rx="7"/>
    <rect x="204" y="176" width="96" height="44" rx="7"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="164" y="252">✓ 对① (1,2)</text>
    <text x="252" y="252">✓ 对② (2,3)</text>
  </g>

  <!-- annotation about the two 2s -->
  <path d="M 340 196 L 286 196" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="348" y="176" width="308" height="66" rx="8" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>
  <text x="502" y="198" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">两个 2 虽相邻，但落在 (槽2, 槽3)</text>
  <text x="502" y="216" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">= (奇, 偶) 位，不构成一对</text>
  <text x="502" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">→ 无需「不相等」，合法！</text>

  <!-- decision boxes -->
  <g filter="url(#sk)">
    <rect x="36" y="282" width="300" height="104" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="352" y="282" width="292" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="186" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">情形① nums[i] ≠ nums[i+1]</text>
  <g filter="url(#sk)">
    <rect x="96" y="320" width="36" height="30" fill="#fff" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="140" y="320" width="36" height="30" fill="#fff" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="92" y="316" width="88" height="38" rx="6" fill="none" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="114" y="340">3</text>
    <text x="158" y="340">4</text>
  </g>
  <text x="196" y="334" font-size="12" fill="#2e6e2e" filter="url(#sk)">立即锁成一对</text>
  <text x="196" y="354" font-size="12" fill="#2e6e2e" filter="url(#sk)">指针 i += 2，规模 −2</text>

  <text x="498" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">情形② nums[i] == nums[i+1]</text>
  <g filter="url(#sk)">
    <rect x="412" y="320" width="36" height="30" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="456" y="320" width="36" height="30" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="430" y="340">2</text>
    <text x="474" y="340">2</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#sk)">
    <path d="M 416 323 L 444 347"/>
    <path d="M 444 323 L 416 347"/>
  </g>
  <text x="506" y="334" font-size="12" fill="#a04038" filter="url(#sk)">必删其一，i += 1</text>
  <text x="506" y="354" font-size="12" fill="#a04038" filter="url(#sk)">删左删右：结果数组相同</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="402" width="560" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="421" text-anchor="middle" font-size="12" fill="#7a5415">扫描结束若剩 1 个落单元素 → 再删 1 个，保证长度为偶数（空数组也是美丽数组）</text>
  <text x="340" y="440" text-anchor="middle" font-size="11" fill="#999">贪心全程不回头：每个元素只在指针 i 抵达时被判定一次</text>
</svg>
