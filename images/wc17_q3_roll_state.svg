<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态建模：把「一次滚动」压成一条边</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">球只有撞墙或掉洞才停，滚动途中没有任何选择 → 停点才是状态</text>

  <rect x="44" y="84" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="84" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="84" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="84" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="188" y="84" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="44" y="120" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <path d="M 51 148 L 73 128" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="120" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <path d="M 87 148 L 109 128" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="116" y="120" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="120" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="188" y="120" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <path d="M 195 148 L 217 128" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="44" y="156" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="156" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="156" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="156" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="188" y="156" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="44" y="192" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="192" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <path d="M 87 220 L 109 200" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="116" y="192" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="192" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="188" y="192" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <path d="M 195 220 L 217 200" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="44" y="228" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="80" y="228" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <path d="M 87 256 L 109 236" stroke="#b85450" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="116" y="228" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="228" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="188" y="228" width="36" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <rect x="40" y="80" width="188" height="188" fill="none" stroke="#888" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 170.0 238.0 L 170.0 112.0" stroke="#999" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="175.0" y="178.0" font-size="9.5" fill="#888" filter="url(#rough2)">u：4 格</text>
  <text x="175.0" y="191.0" font-size="9.5" fill="#888" filter="url(#rough2)">→ (0,3)</text>
  <path d="M 164.0 246.0 L 142.0 246.0" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152.0" y="238.0" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">l：1 格</text>
  <path d="M 134.0 240.0 L 134.0 111.0" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128.0" y="178.0" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">u：4 格</text>
  <path d="M 126.0 102.0 L 109.0 102.0" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116.0" y="94.0" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">l：1 格</text>
  <circle cx="98.0" cy="102.0" r="11" fill="#fff8e1" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="98.0" cy="102.0" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="170.0" cy="246.0" r="9.5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170.0" y="249.5" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">球</text>
  <text x="40" y="286" font-size="9.5" fill="#446688" filter="url(#rough2)">实线：lul（6 格，答案）</text>
  <text x="40" y="302" font-size="9.5" fill="#888" filter="url(#rough2)">虚线：先 u 再接 l，同样 6 格</text>
  <text x="40" y="318" font-size="9.5" fill="#888" filter="url(#rough2)">但 "ul" &gt; "lul" → 被淘汰</text>
  <text x="40" y="340" font-size="9.5" fill="#777" filter="url(#rough2)">例：圆 = 球，双圆 = 洞，叉格 = 墙</text>
  <rect x="252" y="62" width="326" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="266" y="82" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">① 图建模</text>
  <text x="266" y="101" font-size="10" fill="#44586e" filter="url(#rough2)">节点 = 停止格（撞墙处、洞）</text>
  <text x="266" y="118" font-size="10" fill="#44586e" filter="url(#rough2)">边 = 一次滚动：方向 ch + 权重 w（经过的空格数）</text>
  <text x="266" y="135" font-size="10" fill="#44586e" filter="url(#rough2)">起点 = 球的位置，终点 = 洞</text>

  <rect x="252" y="164" width="326" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="266" y="184" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 排序键 = (总距离 d, 指令串 p)</text>
  <text x="266" y="203" font-size="10" fill="#6b5a33" filter="url(#rough2)">d 小者优先；d 相同则比字典序</text>
  <text x="266" y="220" font-size="10" fill="#6b5a33" filter="url(#rough2)">字母序：d &lt; l &lt; r &lt; u</text>
  <text x="266" y="244" font-size="10" fill="#6b5a33" filter="url(#rough2)">两个键都可「逐段累加」→ 可套 Dijkstra</text>

  <rect x="252" y="270" width="326" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="266" y="290" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 一次滚动的边权</text>
  <text x="266" y="309" font-size="10" fill="#44583c" filter="url(#rough2)">每进入一个空格 +1；起点不计，洞计入</text>
  <text x="266" y="326" font-size="10" fill="#44583c" filter="url(#rough2)">撞墙前最后一格才是停点，可继续换向</text>
  <text x="266" y="343" font-size="10" fill="#44583c" filter="url(#rough2)">滚到洞 → 立即掉入，不再越过</text>

  <text x="300" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">迷宫俯视图：球 (4,3) 出发，滚到 (0,1) 的洞里</text>
</svg>
