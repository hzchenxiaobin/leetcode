<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="100%" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">演算：arr = ["un","iq","ue"]，S 逐步长大</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">∅ 表示一个串都不选；每步只把「与当前掩码不冲突」的并集加进 S</text>
  <rect x="24" y="76" width="570" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="54" y="100" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="159" y="100" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">处理串 → 掩码</text>
  <text x="309" y="100" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">新增的可达掩码</text>
  <text x="459" y="100" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">S（可达掩码集合）</text>
  <text x="564" y="100" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">最优</text>
  <rect x="24" y="116" width="570" height="40" fill="#ffffff" stroke="#d8dee4" stroke-width="1" filter="url(#rough2)"/>
  <text x="54" y="140" text-anchor="middle" font-size="10" fill="#2f4a26" font-weight="bold" filter="url(#rough2)">初始</text>
  <text x="159" y="140" text-anchor="middle" font-size="9.5" fill="#3a3a3a" filter="url(#rough2)">—</text>
  <text x="309" y="140" text-anchor="middle" font-size="9.5" fill="#2f4a26" filter="url(#rough2)">—</text>
  <text x="459" y="140" text-anchor="middle" font-size="9" fill="#3a3a3a" filter="url(#rough2)">{∅}</text>
  <text x="564" y="140" text-anchor="middle" font-size="10" fill="#2f4a26" filter="url(#rough2)">0</text>
  <rect x="24" y="156" width="570" height="40" fill="#fbfcfe" stroke="#d8dee4" stroke-width="1" filter="url(#rough2)"/>
  <text x="54" y="180" text-anchor="middle" font-size="10" fill="#2f4a26" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="159" y="180" text-anchor="middle" font-size="9.5" fill="#3a3a3a" filter="url(#rough2)">"un" → {u, n}</text>
  <text x="309" y="180" text-anchor="middle" font-size="9.5" fill="#2f4a26" filter="url(#rough2)">un（新）</text>
  <text x="459" y="180" text-anchor="middle" font-size="9" fill="#3a3a3a" filter="url(#rough2)">{∅, un}</text>
  <text x="564" y="180" text-anchor="middle" font-size="10" fill="#2f4a26" filter="url(#rough2)">2</text>
  <rect x="24" y="196" width="570" height="40" fill="#ffffff" stroke="#d8dee4" stroke-width="1" filter="url(#rough2)"/>
  <text x="54" y="220" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="159" y="220" text-anchor="middle" font-size="9.5" fill="#3a3a3a" filter="url(#rough2)">"iq" → {i, q}</text>
  <text x="309" y="220" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">iq、uniq</text>
  <text x="459" y="220" text-anchor="middle" font-size="9" fill="#3a3a3a" filter="url(#rough2)">{∅, un, iq, uniq}</text>
  <text x="564" y="220" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">4</text>
  <rect x="24" y="236" width="570" height="40" fill="#fbfcfe" stroke="#d8dee4" stroke-width="1" filter="url(#rough2)"/>
  <text x="54" y="260" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="159" y="260" text-anchor="middle" font-size="9.5" fill="#3a3a3a" filter="url(#rough2)">"ue" → {u, e}</text>
  <text x="309" y="260" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">ue、ique</text>
  <text x="459" y="260" text-anchor="middle" font-size="9" fill="#3a3a3a" filter="url(#rough2)">{∅, un, iq, uniq, ue, ique}</text>
  <text x="564" y="260" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">4</text>
  <path d="M 84 78 L 84 274" stroke="#d8dee4" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 234 78 L 234 274" stroke="#d8dee4" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 384 78 L 384 274" stroke="#d8dee4" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 534 78 L 534 274" stroke="#d8dee4" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="34" y="290" width="552" height="122" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="314" font-size="10" fill="#8a3a36" filter="url(#rough2)">"ue" 与 "un" 都含 u，掩码按位与不为 0 → "ue" + "un" 被拒绝，不会进入 S。</text>
  <text x="52" y="334" font-size="10" fill="#8a3a36" filter="url(#rough2)">"ue" 与 "iq" 不冲突 → 生成 ique（长度 4）；"uniq" 也已是 4，最优值不再增加。</text>
  <text x="52" y="354" font-size="10" fill="#8a3a36" filter="url(#rough2)">遍历结束取 max popcount = 4，对应串是 "uniq"（或 "ique"）。</text>
</svg>
