<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="880" height="680" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：行 / 列一趟同检</text>
  <path d="M 300 44 Q 440 52 580 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <g filter="url(#rough2)">
    <rect x="250" y="62" width="280" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#33455c" filter="url(#rough2)">外层循环 i = 0 … n−1</text>
  <text x="390" y="106" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">每轮新建 seen_row / seen_col（大小 n+1）</text>

  <path d="M 390 116 L 390 132" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环 -->
  <g filter="url(#rough2)">
    <rect x="230" y="138" width="320" height="60" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="390" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#33455c" filter="url(#rough2)">内层循环 j = 0 … n−1</text>
  <text x="390" y="184" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#rough2)">v_row = matrix[i][j]，v_col = matrix[j][i]</text>

  <path d="M 390 198 L 390 214" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：行 -->
  <g filter="url(#rough2)">
    <polygon points="390,220 496,270 390,320 284,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="390" y="264" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#rough2)">seen_row[v_row]</text>
  <text x="390" y="283" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#rough2)">已标记？</text>

  <path d="M 496 270 L 552 270" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="556" y="244" width="260" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="686" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4442" filter="url(#rough2)">return false</text>
  <text x="686" y="285" text-anchor="middle" font-size="11" fill="#8a4442" filter="url(#rough2)">第 i 行有重复元素</text>

  <path d="M 390 320 L 390 338" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="336" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="290" y="344" width="200" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="390" y="371" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#rough2)">seen_row[v_row] ← true</text>

  <path d="M 390 386 L 390 402" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2：列 -->
  <g filter="url(#rough2)">
    <polygon points="390,408 496,458 390,508 284,458" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="390" y="452" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#rough2)">seen_col[v_col]</text>
  <text x="390" y="471" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#rough2)">已标记？</text>

  <path d="M 496 458 L 552 458" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="450" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="556" y="432" width="260" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="686" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4442" filter="url(#rough2)">return false</text>
  <text x="686" y="473" text-anchor="middle" font-size="11" fill="#8a4442" filter="url(#rough2)">第 i 列有重复元素</text>

  <path d="M 390 508 L 390 526" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="524" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="290" y="532" width="200" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="390" y="559" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#rough2)">seen_col[v_col] ← true</text>

  <!-- j+1 回边（左侧） -->
  <path d="M 290 553 L 252 553 L 252 168 L 222 168" stroke="#888" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="368" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">j+1 ↺</text>

  <!-- 出口：i+1 与 return true -->
  <path d="M 390 574 L 390 596" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="592" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i = n：全部通过</text>

  <path d="M 390 585 L 840 585 L 840 89 L 538 89" stroke="#888" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="700" y="575" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">j 扫完 → i+1 ↺（重建 seen）</text>

  <g filter="url(#rough2)">
    <rect x="250" y="602" width="280" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="390" y="625" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">所有 i 均通过</text>
  <text x="390" y="645" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#rough2)">return true ✓</text>
</svg>
