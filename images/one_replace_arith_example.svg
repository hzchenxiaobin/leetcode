<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="370" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">示例演算：nums = [1, 2, 3, 100, 5, 6, 7]</text>

  <!-- 表头 i -->
  <g filter="url(#r)">
    <text x="90" y="63" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">i</text>
    <rect x="102" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="154" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="206" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="258" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="310" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="362" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="414" y="42" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="128" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
    <text x="180" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
    <text x="232" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="284" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
    <text x="336" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
    <text x="388" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
    <text x="440" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>

    <!-- nums 行 -->
    <text x="90" y="97" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">nums</text>
    <rect x="102" y="76" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="154" y="76" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="206" y="76" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="258" y="76" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="310" y="76" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="362" y="76" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="414" y="76" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="128" y="97" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="180" y="97" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="232" y="97" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="284" y="97" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">100</text>
    <text x="336" y="97" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="388" y="97" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="440" y="97" text-anchor="middle" font-size="12" fill="#333">7</text>

    <!-- diff 行 -->
    <text x="90" y="131" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">diff</text>
    <rect x="102" y="110" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="154" y="110" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="206" y="110" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="258" y="110" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="310" y="110" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="362" y="110" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="414" y="110" width="52" height="32" fill="#f7f7f7" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="4"/>
    <text x="128" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="180" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="232" y="131" text-anchor="middle" font-size="12" fill="#333">97</text>
    <text x="284" y="131" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−95</text>
    <text x="336" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="388" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="440" y="131" text-anchor="middle" font-size="10" fill="#bbb">—</text>
    <text x="513" y="118" text-anchor="middle" font-size="9" fill="#888">diff[i] =</text>
    <text x="513" y="131" text-anchor="middle" font-size="9" fill="#888">nums[i+1]</text>
    <text x="513" y="144" text-anchor="middle" font-size="9" fill="#888">− nums[i]</text>

    <!-- left 行 -->
    <text x="90" y="165" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">left</text>
    <rect x="102" y="144" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="154" y="144" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="206" y="144" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="258" y="144" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="310" y="144" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="362" y="144" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="414" y="144" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="128" y="165" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="180" y="165" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="232" y="165" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="284" y="165" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <text x="336" y="165" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="388" y="165" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="440" y="165" text-anchor="middle" font-size="12" fill="#333">3</text>

    <!-- right 行 -->
    <text x="90" y="199" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">right</text>
    <rect x="102" y="178" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="154" y="178" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="206" y="178" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="258" y="178" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="310" y="178" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="362" y="178" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="414" y="178" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="128" y="199" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="180" y="199" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="232" y="199" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="284" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <text x="336" y="199" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="388" y="199" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="440" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- 三类候选 -->
  <rect x="15" y="222" width="165" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="97" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">不替换：max(left) = 3</text>
  <text x="97" y="260" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">（[1,2,3] 或 [5,6,7]）</text>

  <rect x="195" y="222" width="170" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#r)">端点替换：1 + right[4] = 4</text>
  <text x="280" y="260" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">（p=3 作左端点，v = 4）</text>

  <rect x="380" y="222" width="165" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#r)"/>
  <text x="462" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">内部替换 p = 3</text>
  <text x="462" y="260" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">（见下方推导，答案 7）</text>

  <!-- 推导 -->
  <rect x="15" y="288" width="530" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#r)">s = nums[4] − nums[2] = 5 − 3 = 2（偶数）→ d = 1</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#r)">diff[1] = 1 = d → L = left[2] = 3；diff[4] = 1 = d → R = right[4] = 3</text>
  <text x="280" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">候选 = 3 + 1 + 3 = 7 → 把 100 替换为 4，整段公差全为 1 ✓</text>
</svg>
