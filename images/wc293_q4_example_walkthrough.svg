<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例演算：三次 add，并集覆盖与 count 递增</text>
  <text x="260" y="47" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">绿格 = 已覆盖 ｜ 橙格 = 本次新覆盖（数轴只画 1~12，真实值域到 10⁹）</text>

  <text x="94" y="85" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">① add(2, 3)</text>
  <rect x="102" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="134" y="64" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="166" y="64" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="198" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="262" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="294" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="326" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="358" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="390" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="422" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="454" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="149" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="181" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="213" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <text x="245" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <text x="277" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <text x="309" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">7</text>
  <text x="341" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">8</text>
  <text x="373" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">9</text>
  <text x="405" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">10</text>
  <text x="437" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">11</text>
  <text x="469" y="84" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">12</text>
  <rect x="252" y="102" width="80" height="22" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">count = 2</text>

  <text x="94" y="165" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">② add(7, 10)</text>
  <rect x="102" y="144" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="134" y="144" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="166" y="144" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="198" y="144" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="144" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="262" y="144" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="294" y="144" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="326" y="144" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="358" y="144" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="390" y="144" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="422" y="144" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="454" y="144" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="149" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="181" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="213" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <text x="245" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <text x="277" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <text x="309" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="341" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="373" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="405" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="437" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">11</text>
  <text x="469" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">12</text>
  <rect x="246" y="182" width="92" height="22" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="198" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">count = 2+4 = 6</text>

  <text x="94" y="245" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">③ add(5, 8)</text>
  <rect x="102" y="224" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="134" y="224" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="166" y="224" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="198" y="224" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="224" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="262" y="224" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="294" y="224" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="326" y="224" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="358" y="224" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="390" y="224" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="422" y="224" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="454" y="224" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="117" y="244" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="149" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="181" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="213" y="244" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <text x="245" y="244" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="277" y="244" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">6</text>
  <text x="309" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="341" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="373" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="405" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="437" y="244" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">11</text>
  <text x="469" y="244" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">12</text>
  <text x="325" y="216" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已被覆盖，重复染色不重复计数</text>

  <rect x="240" y="262" width="104" height="24" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="292" y="279" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#8a6d1f" filter="url(#rough2)">count = 6+2 = 8</text>

  <rect x="36" y="298" width="448" height="48" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">并集语义：add(5, 8) 仅新增 5、6 两个整数；7、8 已在 [7,10] 中，白染</text>
  <text x="260" y="337" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">树视角：每次 add 沿 O(log V) 路径下行打标记，根的 covered 始终等于 |S|</text>

  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最终并集 [2,3] ∪ [5,10]，count = 2 + 6 = 8，与示例输出一致</text>
</svg>
