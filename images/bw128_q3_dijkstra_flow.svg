<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">Dijkstra 只在松弛前多一个判断：nd 是否仍早于 disappear[v]</text>

  <rect x="40" y="48" width="480" height="230" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="56" y="76">dist[0] = 0，堆 = [(0, 0)]</text>
    <text x="56" y="102">while 堆非空：</text>
    <text x="56" y="128">    (d, u) = 弹出最小堆顶</text>
    <text x="56" y="154">    if d &gt; dist[u]: continue              # 过期堆项</text>
    <text x="56" y="180">    for (v, w) in adj[u]:</text>
    <text x="56" y="206">        nd = d + w</text>
    <text x="56" y="232">        if nd &gt;= disappear[v]: continue    # 到达时已消失</text>
    <text x="56" y="258">        if nd &lt; dist[v]: dist[v] = nd，入堆</text>
  </g>
  <text x="404" y="232" font-size="10" fill="#8a2b26" filter="url(#rough2)">← 本题唯一改动</text>

  <rect x="40" y="296" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">输出：answer[i] = dist[i] 有限 ? dist[i] : −1（起点恒为 0）</text>
  <rect x="40" y="340" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">丢弃 nd ≥ disappear[v] 是安全的：更晚到达只会让后续全部更晚</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">边权为正，故「最早到达」支配一切后续路径 ⇒ Dijkstra 仍然正确</text>
</svg>
