<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：k = 19，贪心三步收敛</text>

  <!-- 三步 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="36" y="58" width="150" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="206" y="58" width="150" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="376" y="58" width="150" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="111" y="84" fill="#446688">第 1 步</text>
    <text x="111" y="108">≤19 最大 = 13</text>
    <text x="111" y="132" fill="#b85450">余 19−13 = 6</text>
    <text x="281" y="84" fill="#4a7a3a">第 2 步</text>
    <text x="281" y="108">≤6 最大 = 5</text>
    <text x="281" y="132" fill="#b85450">余 6−5 = 1</text>
    <text x="451" y="84" fill="#8a6d1a">第 3 步</text>
    <text x="451" y="108">≤1 最大 = 1</text>
    <text x="451" y="132" fill="#b85450">余 1−1 = 0</text>
  </g>

  <!-- 汇总 -->
  <g filter="url(#rough2)">
    <rect x="90" y="176" width="380" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="280" y="206" text-anchor="middle" font-size="14.5" fill="#4a7a3a" filter="url(#rough2)">19 = 13 + 5 + 1，共 3 项（示例 3 答案 ✓）</text>

  <!-- 另两例 -->
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <rect x="60" y="242" width="210" height="42" rx="8" fill="#fff" stroke="#888" stroke-width="1.4"/>
    <text x="165" y="268">k=7：7 = 5 + 2 → 2 项</text>
    <rect x="290" y="242" width="210" height="42" rx="8" fill="#fff" stroke="#888" stroke-width="1.4"/>
    <text x="395" y="268">k=10：10 = 8 + 2 → 2 项</text>
  </g>
</svg>
