<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一步之差：&gt; 与 &gt;= 在 cur = 14 处分道扬镳</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 公共前提框 -->
  <g filter="url(#sk)"><rect x="90" y="56" width="460" height="50" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="78" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">排序后 [7,7,6,4,4]，total = 28</text>
  <text x="320" y="97" text-anchor="middle" font-size="12.5" fill="#2b6e9e">第 ② 步累加后 cur = 14，total − cur = 14 —— <tspan font-weight="bold" fill="#b85450">恰好压线！</tspan></text>

  <!-- 分叉箭头 -->
  <path d="M 250 106 Q 180 122 170 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
  <path d="M 390 106 Q 460 122 470 138" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>

  <!-- 左框：错误 -->
  <g filter="url(#sk)"><rect x="36" y="142" width="268" height="128" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="170" y="166" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3030">误写成 &gt;=（大于等于）</text>
  <text x="170" y="192" text-anchor="middle" font-size="12" fill="#8a3030" font-family="monospace">第 ② 步：14 &gt;= 14 成立 → 提前停</text>
  <text x="170" y="216" text-anchor="middle" font-size="12" fill="#8a3030">返回 [7,7]：子和 14 = 剩余和 14</text>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#8a3030">不满足「严格大于」</text>
  <text x="170" y="262" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b85450">✗ Wrong Answer</text>

  <!-- 右框：正确 -->
  <g filter="url(#sk)"><rect x="336" y="142" width="268" height="128" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="470" y="166" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">正确写 &gt;（严格大于）</text>
  <text x="470" y="192" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">第 ② 步：14 &gt; 14 不成立 → 继续</text>
  <text x="470" y="216" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">第 ③ 步取 6：20 &gt; 8 → 停</text>
  <text x="470" y="240" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">返回 [7,7,6]：子和 20 &gt; 剩余 8</text>
  <text x="470" y="262" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e6e2e">✓ Accepted</text>

  <!-- 底部提示 -->
  <g filter="url(#sk)"><rect x="60" y="292" width="520" height="48" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5 3"/></g>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#666">题面的「严格大于」要逐字翻译成 &gt;；total 为偶数时前缀和可能恰好压线，</text>
  <text x="320" y="330" text-anchor="middle" font-size="11.5" fill="#666">差一个等号，答案就差一个元素。</text>
</svg>
