<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序后只需判定 a + b &gt; c</text>
  <text x="340" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">固定最长边 c，只在它左边的区间里找另外两条边 a ≤ b</text>

  <rect x="90" y="82" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="118" y="111" text-anchor="middle" font-size="15" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <rect x="156" y="82" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184" y="111" text-anchor="middle" font-size="15" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <rect x="222" y="82" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="111" text-anchor="middle" font-size="15" fill="#2f3f5c" filter="url(#rough2)">3</text>
  <rect x="288" y="82" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="316" y="111" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">4</text>

  <text x="118" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="184" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="250" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="316" y="144" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>

  <path d="M 118 78 L 118 70" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 250 78 L 250 70" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="316" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c（最长边）</text>

  <path d="M 90 156 L 90 164 L 278 164 L 278 156" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="184" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a、b 只在前 k 个位置里取</text>

  <rect x="392" y="78" width="252" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="100" font-size="11.5" fill="#33502a" font-weight="bold" filter="url(#rough2)">排序后 a ≤ b ≤ c：</text>
  <text x="410" y="122" font-size="11" fill="#33502a" filter="url(#rough2)">a + b &gt; c  ← 唯一要判定的</text>
  <text x="410" y="144" font-size="11" fill="#6d8a62" filter="url(#rough2)">a + c &gt; b  自动成立</text>
  <text x="410" y="166" font-size="11" fill="#6d8a62" filter="url(#rough2)">b + c &gt; a  自动成立</text>
  <text x="410" y="184" font-size="9.5" fill="#888" filter="url(#rough2)">（成立时必有 a ≥ 1）</text>

  <rect x="60" y="212" width="268" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="78" y="234" font-size="11" fill="#33502a" font-weight="bold" filter="url(#rough2)">命中 nums[i] + nums[j] &gt; nums[k]</text>
  <text x="78" y="256" font-size="10.5" fill="#33502a" filter="url(#rough2)">a 取 i .. j−1 全都合法</text>
  <text x="78" y="276" font-size="10.5" fill="#33502a" filter="url(#rough2)">⇒ 一次加 j − i 个，j 左移</text>
  <text x="78" y="296" font-size="10" fill="#6d8a62" filter="url(#rough2)">b = nums[j] 固定不动</text>

  <rect x="352" y="212" width="292" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="370" y="234" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">未命中 nums[i] + nums[j] ≤ nums[k]</text>
  <text x="370" y="256" font-size="10.5" fill="#555" filter="url(#rough2)">a 已经是最小值，b 再大也没用</text>
  <text x="370" y="276" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ i 右移，换更大的 a</text>
  <text x="370" y="296" font-size="10" fill="#8a3a36" filter="url(#rough2)">单调性：j 只左移、i 只右移</text>

  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">每个 k 只花 O(n)：双指针在整个区间上各走一遍</text>
  <text x="340" y="366" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">外层 k 从 n−1 递减到 2，合计 O(n²)</text>
  <text x="340" y="388" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">枚举项从「任取三边」的 C(n,3) 压到「固定 c + 双指针」的 O(n²)</text>
</svg>
