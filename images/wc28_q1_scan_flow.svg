<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单次扫描：每个字符只做两种更新</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">状态只有两个计数器，取值为有限小集合，可随时早退</text>

  <rect x="220" y="62" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">读入 s[i]</text>

  <path d="M 250 96 L 110 128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 96 L 280 128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 96 L 450 128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="132" width="140" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="152" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">字符 'A'</text>
  <text x="52" y="174" font-size="10" fill="#555" filter="url(#rough2)">cntA += 1</text>
  <text x="52" y="194" font-size="10" fill="#555" filter="url(#rough2)">curL = 0</text>
  <text x="52" y="214" font-size="10" fill="#b85450" filter="url(#rough2)">cntA ≥ 2 → false</text>

  <rect x="210" y="132" width="140" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="222" y="152" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">字符 'L'</text>
  <text x="222" y="174" font-size="10" fill="#555" filter="url(#rough2)">curL += 1</text>
  <text x="222" y="194" font-size="10" fill="#555" filter="url(#rough2)">cntA 不变</text>
  <text x="222" y="214" font-size="10" fill="#b85450" filter="url(#rough2)">curL ≥ 3 → false</text>

  <rect x="380" y="132" width="140" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="152" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">字符 'P'</text>
  <text x="392" y="174" font-size="10" fill="#555" filter="url(#rough2)">curL = 0</text>
  <text x="392" y="194" font-size="10" fill="#555" filter="url(#rough2)">cntA 不变</text>
  <text x="392" y="214" font-size="10" fill="#888" filter="url(#rough2)">到场打断连续段</text>

  <path d="M 280 228 L 280 254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="258" width="368" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">扫完全部字符且从未触发违规 → 返回 true</text>
  <text x="280" y="297" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">两个计数器就是全部需要记忆的状态</text>

  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">关键：只有遇到非 'L' 才把 curL 清零；遇到 'L' 时 curL 必须自增而不是重置为 1</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">早退不改变答案：违规一旦发生就不可撤销</text>
</svg>
