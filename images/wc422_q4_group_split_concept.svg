<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：平衡只取决于「哪些数字落在偶位」</text>
  <path d="M 240 44 Q 480 52 720 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: three sample strings ===== -->
  <!-- "132" -->
  <g filter="url(#sk)"><rect x="78" y="72" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="128" y="72" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="178" y="72" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="100" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="150" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#a87820" filter="url(#sk)">3</text>
  <text x="200" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="256" cy="94" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="256" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="280" y="99" font-size="11" fill="#444" filter="url(#sk)">偶位 1+2 = 3 = 奇位 3</text>

  <!-- "231" -->
  <g filter="url(#sk)"><rect x="78" y="142" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="128" y="142" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="178" y="142" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="100" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#sk)">2</text>
  <text x="150" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#a87820" filter="url(#sk)">3</text>
  <text x="200" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="256" cy="164" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="256" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="280" y="169" font-size="11" fill="#444" filter="url(#sk)">偶位 2+1 = 3 = 奇位 3</text>

  <!-- "123" (unbalanced) -->
  <g filter="url(#sk)"><rect x="78" y="212" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="128" y="212" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="178" y="212" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="100" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#b03a3a" filter="url(#sk)">1</text>
  <text x="150" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#a87820" filter="url(#sk)">2</text>
  <text x="200" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#b03a3a" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="256" cy="234" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="256" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">✗</text>
  <text x="280" y="239" font-size="11" fill="#b03a3a" filter="url(#sk)">偶位 1+3 = 4 ≠ 奇位 2</text>

  <!-- converge arrows -->
  <path d="M 150 122 Q 190 200 240 278" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <path d="M 150 192 Q 200 235 244 280" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>

  <!-- group box -->
  <g filter="url(#sk)">
    <rect x="70" y="286" width="430" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="86" y="310" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">分组相同：k = (k₁,k₂,k₃) = (1,1,0)</text>
  <text x="86" y="332" font-size="11" fill="#444" filter="url(#sk)">偶位多重集 {1,2}、奇位 {3}——组内怎么换顺序都平衡</text>
  <text x="86" y="350" font-size="11" fill="#666" filter="url(#sk)">(蓝 = 偶位格，橙 = 奇位格；平衡只看分组，不看组内顺序)</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="372" width="430" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="86" y="396" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">该分组的排列数 = m!/(k₁!k₂!k₃!) × (n−m)!/((c₁−k₁)!(c₃−k₃)!)</text>
  <text x="86" y="418" font-size="11.5" fill="#444" filter="url(#sk)">= 2!/(1!·1!) × 1!/(0!·1!) = 2 × 1 = 2</text>
  <text x="86" y="440" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">→ 恰好数出 "132"、"231" 两个排列 ✓</text>

  <!-- ===== right: observation boxes ===== -->
  <g filter="url(#sk)">
    <rect x="540" y="66" width="400" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="558" y="90" font-size="13" font-weight="bold" fill="#2e6e2e">观察一：总和守恒</text>
  <text x="558" y="112" font-size="11" fill="#444" filter="url(#sk)">偶位和 + 奇位和 = S 恒成立 ⇒ 平衡 ⟺ 偶位和 = S/2</text>
  <text x="558" y="132" font-size="11" fill="#444" filter="url(#sk)">S 为奇数 ⇒ 两组和不可能相等，直接返回 0</text>
  <text x="558" y="152" font-size="11" fill="#666" filter="url(#sk)">(示例 3 "12345"：S = 15 为奇，答案 0)</text>

  <g filter="url(#sk)">
    <rect x="540" y="172" width="400" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="558" y="196" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">观察二：顺序是冗余自由度</text>
  <text x="558" y="218" font-size="11" fill="#444" filter="url(#sk)">是否平衡只取决于「哪些数字（多重集）进偶位组」</text>
  <text x="558" y="238" font-size="11" fill="#444" filter="url(#sk)">组内怎么排不改变和 → 先数分组，再乘组内排列数</text>
  <text x="558" y="258" font-size="11" fill="#666" filter="url(#sk)">分组由向量 k = (k₀,…,k₉) 唯一刻画，k_d 个 d 进偶位</text>

  <g filter="url(#sk)">
    <rect x="540" y="278" width="400" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="558" y="302" font-size="13" font-weight="bold" fill="#a87820" filter="url(#sk)">观察三：多重集排列定值</text>
  <text x="558" y="324" font-size="11" fill="#444" filter="url(#sk)">固定 k：偶位排法 m!/∏k_d! × 奇位排法 (n−m)!/∏(c_d−k_d)!</text>
  <text x="558" y="344" font-size="11" fill="#444" filter="url(#sk)">不同分组的排列互不相同（互斥）→ 对所有合法 k 求和</text>
  <text x="558" y="364" font-size="11" fill="#666" filter="url(#sk)">约束：Σk_d = m（偶位个数）且 Σd·k_d = S/2（偶位和）</text>

  <g filter="url(#sk)">
    <rect x="540" y="384" width="400" height="70" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="558" y="406" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">⚠ 陷阱：逐位填数 DP 会重复计数</text>
  <text x="558" y="426" font-size="10.5" fill="#444" filter="url(#sk)">相同的数字互换「填入次序」→ 多条路径对应同一排列</text>
  <text x="558" y="444" font-size="10.5" fill="#444" filter="url(#sk)">按分组计数：k 唯一决定方案，天然不重不漏</text>
</svg>
