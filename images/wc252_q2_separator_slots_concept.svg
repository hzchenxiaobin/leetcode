<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：其余任务是「隔板」，rest 个隔板隔出 rest+1 个 A 槽</text>
  <path d="M 180 40 Q 360 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel 1: M <= rest+1 -->
  <g filter="url(#sk)"><rect x="20" y="50" width="680" height="174" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="360" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">情形一 M ≤ rest+1：A 全部入槽 → 全部完成（例 [4,2,1]：M=4，rest=3，S=7）</text>

  <!-- slot row: slot0 sep slot1 sep slot2 sep slot3 -->
  <g filter="url(#sk)"><rect x="151" y="98" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="180" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="215" y="98" width="50" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="240" y="125" text-anchor="middle" font-size="14" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="271" y="98" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="300" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="335" y="98" width="50" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="360" y="125" text-anchor="middle" font-size="14" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="391" y="98" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="420" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="455" y="98" width="50" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="480" y="125" text-anchor="middle" font-size="14" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="511" y="98" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="540" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>

  <text x="360" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a">槽（虚线框）：每槽至多放 1 个 A · 隔板（实心块）：其余项目的任务（rest = 3 个）</text>
  <text x="360" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">4 个 A 恰好塞满 4 个槽 → 7 = S 周做完全部任务，答案 = S（边界 M = rest+1 仍全完成）</text>

  <!-- Panel 2: M >= rest+2 -->
  <g filter="url(#sk)"><rect x="20" y="234" width="680" height="174" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="360" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">情形二 M ≥ rest+2：A 多到放不下（例 [5,2,1]：M=5，rest=3，S=8）</text>

  <g filter="url(#sk)"><rect x="151" y="282" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="180" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="215" y="282" width="50" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="240" y="309" text-anchor="middle" font-size="14" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="271" y="282" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="300" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="335" y="282" width="50" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="360" y="309" text-anchor="middle" font-size="14" fill="#2c4a6e">B</text>
  <g filter="url(#sk)"><rect x="391" y="282" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="420" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="455" y="282" width="50" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="480" y="309" text-anchor="middle" font-size="14" fill="#2f5d25">C</text>
  <g filter="url(#sk)"><rect x="511" y="282" width="58" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="540" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">A</text>

  <!-- leftover A crossed out -->
  <g filter="url(#sk)"><rect x="597" y="282" width="58" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4"/></g>
  <text x="626" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">A</text>
  <path d="M 601 286 L 651 322" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 651 286 L 601 322" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="626" y="340" text-anchor="middle" font-size="10" fill="#b85450">放不下</text>

  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#7a5415">还是只有 rest+1 = 4 个槽 → 第 5 个 A 无处安放，只能丢弃</text>
  <text x="360" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">答案 = 4 + 3 = 2·rest+1 = 7 —— 多出的 A 全部浪费，M 再涨答案也不变</text>

  <!-- Bottom banner -->
  <g filter="url(#sk)"><rect x="20" y="418" width="680" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="360" y="441" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4a6e">答案 = min(S, 2·(S−M)+1)</text>
  <text x="360" y="459" text-anchor="middle" font-size="10.5" fill="#446688">分界线：M 与 rest+1 的大小（等价于 2M 与 S+1）· 同一时刻至多一个项目能成为瓶颈，它必是最大项目</text>
</svg>
