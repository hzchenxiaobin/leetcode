<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：pre 两数相减，答案立即出炉</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">示例 2 + 单元素查询自造例，每问都是一次比较出结果</text>

  <!-- 示例 2 -->
  <text x="30" y="72" font-size="13" font-weight="bold" fill="#333" filter="url(#r)">示例 2：nums = [4, 3, 1, 6]</text>

  <rect x="48" y="80" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="80" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">4</text>
  <text x="80" y="113" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="152" y="80" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="184" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">3</text>
  <text x="184" y="113" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="256" y="80" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="288" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">1</text>
  <text x="288" y="113" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="360" y="80" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="392" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">6</text>
  <text x="392" y="113" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>

  <text x="128" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">d1=0 ✓</text>
  <text x="228" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">d2=1 ✗</text>
  <text x="328" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">d3=0 ✓</text>

  <rect x="48" y="146" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="80" y="168" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="152" y="146" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="184" y="168" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="256" y="146" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="288" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>
  <rect x="360" y="146" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="392" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>

  <text x="80" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre0</text>
  <text x="184" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre1</text>
  <text x="288" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre2</text>
  <text x="392" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre3</text>

  <path d="M 234 134 C 258 142, 274 140, 285 144" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#r)"/>
  <text x="258" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">+1</text>

  <rect x="48" y="208" width="410" height="32" rx="6" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#r)"/>
  <text x="64" y="228" font-size="11.5" fill="#333" filter="url(#r)">查询 [0,2]：pre[2] - pre[0] = 1 - 0 = 1 ≠ 0（跨过 d2 跳变）</text>
  <rect x="396" y="213" width="52" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <text x="422" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">false</text>

  <rect x="48" y="246" width="410" height="32" rx="6" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#r)"/>
  <text x="64" y="266" font-size="11.5" fill="#333" filter="url(#r)">查询 [2,3]：pre[3] - pre[2] = 1 - 1 = 0（区间内无跳变）</text>
  <rect x="396" y="251" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="422" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">true</text>

  <!-- 自造例 -->
  <text x="30" y="308" font-size="13" font-weight="bold" fill="#333" filter="url(#r)">自造例：nums = [2, 4]（覆盖单元素查询）</text>

  <rect x="48" y="318" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="80" y="337" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">2</text>
  <text x="80" y="351" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="152" y="318" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="184" y="337" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">4</text>
  <text x="184" y="351" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>

  <text x="128" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">d1=1 ✗（同为偶数）</text>

  <rect x="48" y="386" width="64" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="80" y="408" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="152" y="386" width="64" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="184" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>

  <text x="80" y="436" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre0</text>
  <text x="184" y="436" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">pre1</text>

  <path d="M 134 378 C 152 384, 168 382, 180 384" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#r)"/>

  <text x="30" y="460" font-size="11.5" fill="#333" filter="url(#r)">[0,1]：pre[1] - pre[0] = 1 → false；[0,0]：pre[0] - pre[0] = 0 → true（单元素查询，空真）</text>
</svg>
