<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">递归契约：dfs(v) 返回一个二元组 (子树高度, 该子树内的答案结点)</text>

  <rect x="255" y="52" width="130" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">结点 v</text>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">当前子树根</text>

  <rect x="70" y="140" width="170" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dfs(v.left)</text>
  <text x="155" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= (hL, x)</text>

  <rect x="400" y="140" width="170" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dfs(v.right)</text>
  <text x="485" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= (hR, y)</text>

  <path d="M290,100 L190,138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M350,100 L450,138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M155,194 L300,232" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,212 L320,236" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M485,194 L360,232" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">比较 hL 与 hR</text>

  <rect x="40" y="246" width="170" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="268" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">hL &gt; hR</text>
  <text x="125" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 (hL + 1, x)</text>
  <text x="125" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最深点全在左边</text>

  <rect x="235" y="246" width="170" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">hL == hR</text>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 (hL + 1, v)</text>
  <text x="320" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">两侧都有最深点 ⇒ v 即答案</text>

  <rect x="430" y="246" width="170" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">hR &gt; hL</text>
  <text x="515" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 (hR + 1, y)</text>
  <text x="515" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">最深点全在右边</text>
</svg>
