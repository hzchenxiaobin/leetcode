<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：n = 6，按对搬运共 5 + 3 + 1 = 9 步</text>
  <path d="M 160 32 Q 320 39 480 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 行标签 -->
  <text x="48" y="58" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">初始（目标 = n = 6）</text>
  <text x="48" y="126" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 对 (1, 11)：搬 5 个单位</text>
  <text x="48" y="194" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 对 (3, 9)：搬 3 个单位</text>
  <text x="48" y="262" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 对 (5, 7)：搬 1 个单位 → 全部相等 ✓</text>

  <!-- R0 初始 [1,3,5,7,9,11] -->
  <rect x="48" y="64" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="98" y="64" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="148" y="64" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="198" y="64" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <rect x="248" y="64" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">9</text>
  <rect x="298" y="64" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">11</text>

  <!-- 行间箭头 -->
  <path d="M 194 102 L 194 128" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 194 170 L 194 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 194 238 L 194 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- R1 [6,3,5,7,9,6]，新变格加粗 -->
  <rect x="48" y="132" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="98" y="132" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="148" y="132" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="198" y="132" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <rect x="248" y="132" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">9</text>
  <rect x="298" y="132" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>

  <!-- R2 [6,6,5,7,6,6] -->
  <rect x="48" y="200" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="98" y="200" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="148" y="200" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="198" y="200" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <rect x="248" y="200" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="298" y="200" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>

  <!-- R3 [6,6,6,6,6,6] 全相等 -->
  <rect x="48" y="268" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="98" y="268" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="148" y="268" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="198" y="268" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="248" y="268" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="298" y="268" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>

  <!-- 左侧底部注释 -->
  <text x="194" y="336" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每对内部和恒为 2n = 12：搬完恰好双双等于 6</text>
  <text x="194" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">粗框 = 本轮新到达目标的格子</text>

  <!-- 右侧：目标提示 -->
  <rect x="372" y="64" width="244" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">总和不变 ⇒ 目标 = 平均值 = 6</text>

  <!-- 右侧：各对步数 -->
  <rect x="372" y="124" width="244" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">对 (1, 11)</text>
  <text x="494" y="166" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(11 − 1) / 2 = 5 步</text>
  <path d="M 368 150 L 348 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="372" y="196" width="244" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">对 (3, 9)</text>
  <text x="494" y="238" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(9 − 3) / 2 = 3 步</text>
  <path d="M 368 222 L 348 222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="372" y="268" width="244" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">对 (5, 7)</text>
  <text x="494" y="310" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(7 − 5) / 2 = 1 步</text>
  <path d="M 368 294 L 348 286" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右侧：总计 -->
  <rect x="372" y="332" width="244" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="494" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">总操作数 = 5 + 3 + 1 = 9</text>
  <text x="494" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= ⌊6²/4⌋ = ⌊36/4⌋ ✓ 与示例 2 一致</text>
</svg>
