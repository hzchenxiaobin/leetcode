<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>
  <text x="20" y="28" font-size="14" fill="#333" filter="url(#rough2)">环形排列 0→2→3→4→5→1→6→7→0：分解成上升段与下降段</text>
  <text x="20" y="52" font-size="12" fill="#446688" filter="url(#rough2)">m = Σ上升段(峰 − 谷)：只用上升段的「净升高」，与下降段无关</text>

  <!-- 坐标轴 -->
  <line x1="46" y1="242" x2="540" y2="242" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 上升段 A：0->2->3->4->5 -->
  <path d="M62,226 Q122,168 182,226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="186" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <path d="M182,226 Q212,200 242,226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M242,226 Q272,200 302,226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M302,226 Q332,200 362,226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="415" y="200" font-size="11" fill="#4a7a3a" filter="url(#rough2)">小步各 +1</text>

  <!-- 上升段 B：1->6->7 -->
  <path d="M122,226 Q272,96 422,226" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+5</text>
  <path d="M422,226 Q452,200 482,226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 下降段：5->1, 7->0 -->
  <path d="M362,258 C320,320 164,320 122,258" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="322" font-size="12" fill="#b85450" filter="url(#rough2)">下降 4</text>
  <path d="M482,258 C420,380 124,380 62,258" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="392" font-size="12" fill="#b85450" filter="url(#rough2)">下降 7（绕回 0）</text>

  <!-- 刻度盒：谷 0,1 / 内部 2,3,4,6 / 峰 5,7 -->
  <rect x="45" y="226" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="62" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">0</text>
  <rect x="105" y="226" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="122" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
  <rect x="165" y="226" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="182" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
  <rect x="225" y="226" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="242" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">3</text>
  <rect x="285" y="226" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="302" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">4</text>
  <rect x="345" y="226" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="362" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">5</text>
  <rect x="405" y="226" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="422" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">6</text>
  <rect x="465" y="226" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="482" y="248" font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">7</text>

  <!-- 图例与结论 -->
  <rect x="45" y="60" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="66" y="72" font-size="11" fill="#333" filter="url(#rough2)">谷 0,1（第 i 个谷取 i−1）</text>
  <rect x="45" y="82" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="66" y="94" font-size="11" fill="#333" filter="url(#rough2)">峰 5,7（最大峰必为 n−1）</text>
  <rect x="45" y="104" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="66" y="116" font-size="11" fill="#333" filter="url(#rough2)">内部点 2,3,4,6（挂到第一个大于它的峰）</text>

  <rect x="46" y="336" width="486" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="358" font-size="13" fill="#333" filter="url(#rough2)">m = (5−0) + (7−1) = 11 ≤ ⌊8²/4⌋ = 16 ⇒ S = 2m = 22 可达</text>
</svg>
