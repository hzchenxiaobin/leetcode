<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：频次表 + 枚举约数</text>

  <rect x="90" y="48" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">统计频次表 cnt1、cnt2</text>

  <path d="M 200 82 L 200 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="100" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">遍历 cnt1 去重值 x（记频次 c）</text>

  <path d="M 200 134 L 200 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="200,152 292,190 200,228 108,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="195" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k | x ?</text>

  <path d="M 292 190 L 372 190 L 372 117 L 314 117" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="352" y="182" font-size="10.5" fill="#b85450" filter="url(#rough2)">否：剪枝</text>

  <path d="M 200 228 L 200 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="240" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="90" y="246" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">y ← x / k</text>

  <path d="M 200 280 L 200 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="58" y="298" width="284" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">试除循环 d = 1 … ⌊√y⌋：</text>
  <text x="200" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">• d | y 命中 → ans += c · cnt2[d]</text>
  <text x="200" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">• d² &lt; y → 再 += c · cnt2[y/d]（对称约数）</text>
  <text x="200" y="376" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ d² = y（完全平方）只计一次</text>

  <path d="M 342 344 L 430 344 L 430 117 L 314 117" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="238" font-size="10.5" fill="#555" filter="url(#rough2)">取下一个 x</text>

  <path d="M 200 390 L 200 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="200" cy="420" rx="66" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="425" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="360" y="256" width="188" height="54" rx="8" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="454" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans 用 long long：</text>
  <text x="454" y="297" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">上界 n·m = 10¹⁰ &gt; int</text>
</svg>
