<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：japanese 菜系的三次 highestRated</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="68" text-anchor="middle" font-size="11.5" fill="#666">条目按 (−r, f) 升序；红 = 有效堆顶（答案）；灰 ✗ = 幽灵条目（记录评分 ≠ 当前真值）</text>

  <!-- 阶段 0 -->
  <rect x="48" y="98" width="200" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="148" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">初始化完成</text>
  <text x="148" y="137" text-anchor="middle" font-size="11" fill="#555">highestRated("japanese")</text>
  <rect x="48" y="164" width="200" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="148" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">→ "ramen"（14 分）</text>

  <rect x="300" y="126" width="104" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="352" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36">(−14, ramen) ★</text>
  <rect x="416" y="126" width="104" height="40" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="468" y="151" text-anchor="middle" font-size="11.5" fill="#444">(−12, miso)</text>
  <rect x="532" y="126" width="104" height="40" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="584" y="151" text-anchor="middle" font-size="11.5" fill="#444">(−8, sushi)</text>
  <text x="352" y="118" text-anchor="middle" font-size="10" fill="#b85450">堆顶</text>

  <path d="M 148 216 L 148 242" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 阶段 1 -->
  <rect x="48" y="250" width="200" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="148" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">changeRating</text>
  <text x="148" y="289" text-anchor="middle" font-size="11" fill="#7a5415">("sushi", 16)</text>
  <rect x="48" y="316" width="200" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="148" y="343" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">→ "sushi"（16 分）</text>

  <rect x="300" y="278" width="104" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="352" y="303" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36">(−16, sushi) ★</text>
  <rect x="416" y="278" width="104" height="40" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="468" y="303" text-anchor="middle" font-size="11.5" fill="#444">(−14, ramen)</text>
  <rect x="532" y="278" width="104" height="40" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="584" y="303" text-anchor="middle" font-size="11.5" fill="#444">(−12, miso)</text>
  <rect x="648" y="278" width="104" height="40" rx="6" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="700" y="303" text-anchor="middle" font-size="11.5" fill="#999">(−8, sushi) ✗</text>
  <text x="352" y="270" text-anchor="middle" font-size="10" fill="#b85450">堆顶</text>

  <path d="M 148 368 L 148 394" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 阶段 2 -->
  <rect x="48" y="402" width="200" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="148" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">changeRating</text>
  <text x="148" y="441" text-anchor="middle" font-size="11" fill="#7a5415">("ramen", 16)</text>
  <rect x="48" y="468" width="200" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="148" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">→ "ramen"</text>
  <text x="148" y="504" text-anchor="middle" font-size="10" fill="#4a7a3a">平局：ramen &lt; sushi</text>

  <rect x="300" y="430" width="104" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="352" y="455" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36">(−16, ramen) ★</text>
  <rect x="416" y="430" width="104" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="468" y="449" text-anchor="middle" font-size="11.5" fill="#7a5415">(−16, sushi)</text>
  <text x="468" y="464" text-anchor="middle" font-size="9.5" fill="#a07020">平局 16 分</text>
  <rect x="532" y="430" width="104" height="40" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="584" y="455" text-anchor="middle" font-size="11.5" fill="#444">(−12, miso)</text>
  <rect x="648" y="430" width="104" height="40" rx="6" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="700" y="455" text-anchor="middle" font-size="11.5" fill="#999">(−14, ramen) ✗</text>
  <rect x="764" y="430" width="104" height="40" rx="6" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.4" filter="url(#sk)"/>
  <text x="816" y="455" text-anchor="middle" font-size="11.5" fill="#999">(−8, sushi) ✗</text>
  <text x="352" y="422" text-anchor="middle" font-size="10" fill="#b85450">堆顶</text>

  <!-- 底部小结 -->
  <rect x="40" y="546" width="820" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="450" y="574" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">平局在第二维决出：(−16, "ramen") &lt; (−16, "sushi")——堆顶自动落在字典序更小者</text>
  <text x="450" y="600" text-anchor="middle" font-size="11.5" fill="#555">幽灵条目不参与答案：弹出条件 = 记录评分 ≠ foodRating（当前真值）</text>
</svg>
