<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="25"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：edges=[[0,1],[1,2],[1,3],[3,4]], bob=3</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">amount=[−2,4,2,−4,6]，Bob 走 3→1→0；Alice 选最优叶子</text>

  <g filter="url(#rough2)">
    <rect x="40" y="62" width="480" height="188" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8"/>
  </g>

  <text x="66" y="88" font-size="11" fill="#666" font-weight="bold">节点</text>
  <text x="130" y="88" font-size="11" fill="#666" font-weight="bold">Alice 时刻</text>
  <text x="220" y="88" font-size="11" fill="#666" font-weight="bold">Bob 时刻</text>
  <text x="310" y="88" font-size="11" fill="#666" font-weight="bold">判定</text>
  <text x="420" y="88" font-size="11" fill="#666" font-weight="bold">gain</text>

  <text x="66" y="114" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="130" y="114" font-size="12" fill="#555">0</text>
  <text x="220" y="114" font-size="12" fill="#b85450">2</text>
  <text x="310" y="114" font-size="11" fill="#4a7a3a">0 &lt; 2 → 先到</text>
  <text x="420" y="114" font-size="12" fill="#4a7a3a" font-weight="bold">−2</text>

  <line x1="56" y1="124" x2="504" y2="124" stroke="#eee" stroke-width="1"/>

  <text x="66" y="146" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="130" y="146" font-size="12" fill="#555">1</text>
  <text x="220" y="146" font-size="12" fill="#b85450">1</text>
  <text x="310" y="146" font-size="11" fill="#d6a040">1 = 1 → 同时</text>
  <text x="420" y="146" font-size="12" fill="#d6a040" font-weight="bold">+2</text>

  <line x1="56" y1="156" x2="504" y2="156" stroke="#eee" stroke-width="1"/>

  <text x="66" y="178" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="130" y="178" font-size="12" fill="#555">2</text>
  <text x="220" y="178" font-size="12" fill="#999">∞（不在路径）</text>
  <text x="310" y="178" font-size="11" fill="#4a7a3a">2 &lt; ∞ → 先到</text>
  <text x="420" y="178" font-size="12" fill="#4a7a3a" font-weight="bold">+2</text>

  <line x1="56" y1="188" x2="504" y2="188" stroke="#eee" stroke-width="1"/>

  <text x="66" y="210" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="130" y="210" font-size="12" fill="#555">2</text>
  <text x="220" y="210" font-size="12" fill="#b85450">0</text>
  <text x="310" y="210" font-size="11" fill="#b85450">2 &gt; 0 → 已开门</text>
  <text x="420" y="210" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <line x1="56" y1="220" x2="504" y2="220" stroke="#eee" stroke-width="1"/>

  <text x="66" y="242" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="130" y="242" font-size="12" fill="#555">3</text>
  <text x="220" y="242" font-size="12" fill="#999">∞（不在路径）</text>
  <text x="310" y="242" font-size="11" fill="#4a7a3a">3 &lt; ∞ → 先到</text>
  <text x="420" y="242" font-size="12" fill="#4a7a3a" font-weight="bold">+6</text>

  <rect x="40" y="264" width="230" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="286" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">叶子 2（路径 0→1→2）</text>
  <text x="155" y="306" text-anchor="middle" font-size="11" fill="#555">score = −2 + 2 + 2 = 2</text>

  <rect x="290" y="264" width="230" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="405" y="286" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">叶子 4（路径 0→1→3→4）</text>
  <text x="405" y="306" text-anchor="middle" font-size="11" fill="#555">score = −2 + 2 + 0 + 6 = 6 ← 最优</text>

  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">答案 = max(2, 6) = 6 ✓</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999">对照示例 2：链 0—1，bob=1，Alice 在 0（Bob 在 t=1 才到 0）→ 全取 −7280</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999">节点 3 虽然在 Bob 的「起点」被开门（t=0），Alice t=2 才到 → 0 分</text>
</svg>
