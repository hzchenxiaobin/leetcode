<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：m=3, n=2, H=[1,3], V=[5]，按开销从大到小切</text>
  <path d="M 110 36 Q 320 46 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: cut v0 -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="180" height="188" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="130" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">第 1 步：切 v₀（开销 5）</text>
  <g filter="url(#sk)">
    <rect x="85" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="115" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="85" y="128" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="115" y="128" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="85" y="158" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="115" y="158" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.1"/>
    <path d="M 115 94 L 115 192" stroke="#446688" stroke-width="2.6" fill="none"/>
  </g>
  <text x="160" y="112" font-size="10.5" fill="#446688" font-weight="bold">v₀ 一刀</text>
  <text x="160" y="126" font-size="10.5" fill="#446688">穿过 1 块</text>
  <text x="130" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">付 5 × 1 = 5</text>
  <text x="130" y="234" text-anchor="middle" font-size="10.5" fill="#2b6e9e">得到两个 3×1 竖条</text>

  <g filter="url(#sk)">
    <path d="M 224 150 L 248 150" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Step 2: cut h1 in both strips -->
  <g filter="url(#sk)">
    <rect x="252" y="56" width="180" height="188" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="342" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">第 2 步：两竖条各切 h₁（3）</text>
  <g filter="url(#sk)">
    <rect x="292" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="292" y="128" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="292" y="158" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="366" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="366" y="128" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="366" y="158" width="30" height="30" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.1"/>
    <path d="M 288 158 L 326 158" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none"/>
    <path d="M 362 158 L 400 158" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none"/>
  </g>
  <text x="342" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">h₁ × 2 刀</text>
  <text x="342" y="126" text-anchor="middle" font-size="10.5" fill="#b85450">(每竖条一刀)</text>
  <text x="342" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">付 3 × 2 = 6</text>
  <text x="342" y="234" text-anchor="middle" font-size="10.5" fill="#2e6e2e">剩两个 2×1 待切</text>

  <g filter="url(#sk)">
    <path d="M 436 150 L 460 150" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Step 3: cut h0 in the two 2x1 pieces -->
  <g filter="url(#sk)">
    <rect x="464" y="56" width="180" height="188" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="554" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a20">第 3 步：两块 2×1 各切 h₀（1）</text>
  <g filter="url(#sk)">
    <rect x="500" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="500" y="128" width="30" height="60" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="574" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="574" y="128" width="30" height="60" rx="3" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <path d="M 496 128 L 534 128" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
    <path d="M 570 128 L 608 128" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
  </g>
  <text x="554" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">h₀ × 2 刀</text>
  <text x="554" y="126" text-anchor="middle" font-size="10.5" fill="#b85450">(只切 2×1 的块)</text>
  <text x="554" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a20">付 1 × 2 = 2</text>
  <text x="554" y="234" text-anchor="middle" font-size="10.5" fill="#a06a20">全部切成 1×1 ✓</text>

  <!-- Total bar -->
  <g filter="url(#sk)">
    <rect x="40" y="260" width="604" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="342" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">总开销 = 5 + 6 + 2 = 13 ✓</text>
  <text x="342" y="306" text-anchor="middle" font-size="11" fill="#b85450">闭式验证：Σ线开销 9 + min(1,5) + min(3,5) = 9 + 4 = 13，两条路对上了</text>
</svg>
