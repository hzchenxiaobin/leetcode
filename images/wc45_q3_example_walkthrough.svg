<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,3,4,4,5,5]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始 cnt = {1:1, 2:1, 3:2, 4:2, 5:2}，tail 为空</text>

  <g filter="url(#rough2)">
    <rect x="24" y="62" width="512" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="52" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">x</text>
    <text x="117" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">cnt[x]</text>
    <text x="239" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">tail（结尾值→条数）</text>
    <text x="430" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">动作</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="92" width="512" height="40" fill="#e6f4ea" stroke="#c8d8c4" stroke-width="1" rx="4"/>
    <text x="52" y="117" text-anchor="middle" font-size="10" fill="#3a5a30">1</text>
    <text x="117" y="117" text-anchor="middle" font-size="10" fill="#3a5a30">1</text>
    <text x="239" y="117" text-anchor="middle" font-size="9.5" fill="#4a5a44">空</text>
    <text x="336" y="117" font-size="9.5" fill="#3a5a30">tail[0]=0 → 新建 [1,2,3]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="132" width="512" height="40" fill="#f4f4f4" stroke="#dcdcdc" stroke-width="1" rx="4"/>
    <text x="52" y="157" text-anchor="middle" font-size="10" fill="#777">2</text>
    <text x="117" y="157" text-anchor="middle" font-size="10" fill="#777">0</text>
    <text x="239" y="157" text-anchor="middle" font-size="9.5" fill="#777">{3:1}</text>
    <text x="336" y="157" font-size="9.5" fill="#777">cnt[2]=0 → 跳过</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="172" width="512" height="40" fill="#e6f4ea" stroke="#c8d8c4" stroke-width="1" rx="4"/>
    <text x="52" y="197" text-anchor="middle" font-size="10" fill="#3a5a30">3</text>
    <text x="117" y="197" text-anchor="middle" font-size="10" fill="#3a5a30">1</text>
    <text x="239" y="197" text-anchor="middle" font-size="9.5" fill="#4a5a44">{3:1}</text>
    <text x="336" y="197" font-size="9.5" fill="#3a5a30">tail[2]=0 → 新建 [3,4,5]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="212" width="512" height="40" fill="#e8f0fe" stroke="#c4d2e4" stroke-width="1" rx="4"/>
    <text x="52" y="237" text-anchor="middle" font-size="10" fill="#3a4a66">4</text>
    <text x="117" y="237" text-anchor="middle" font-size="10" fill="#3a4a66">1</text>
    <text x="239" y="237" text-anchor="middle" font-size="9.5" fill="#4a5568">{3:1, 5:1}</text>
    <text x="336" y="237" font-size="9.5" fill="#3a4a66">tail[3]=1 → 延长成 [1,2,3,4]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="252" width="512" height="40" fill="#e8f0fe" stroke="#c4d2e4" stroke-width="1" rx="4"/>
    <text x="52" y="277" text-anchor="middle" font-size="10" fill="#3a4a66">5</text>
    <text x="117" y="277" text-anchor="middle" font-size="10" fill="#3a4a66">1</text>
    <text x="239" y="277" text-anchor="middle" font-size="9.5" fill="#4a5568">{4:1, 5:1}</text>
    <text x="336" y="277" font-size="9.5" fill="#3a4a66">tail[4]=1 → 延长成 [1,2,3,4,5]</text>
  </g>

  <rect x="24" y="302" width="512" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="38" y="324" font-size="10" fill="#8a3a36" font-weight="bold">反例 [1,2,3,4,4,5]：x=4 第二次出现时 tail[3]=0，又凑不出 x+1、x+2</text>
  <text x="38" y="344" font-size="9.5" fill="#6a4a46">唯一以 3 结尾的链已经被第一个 4 用掉，cnt[6]=0 也无法新建 → 返回 false</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最终得到两条链：[1,2,3,4,5] 与 [3,4,5] → true（官方示例 2）</text>
</svg>
