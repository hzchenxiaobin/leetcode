<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 二分演算：排序后 [1, 2, 5, 8, 13, 21]，k = 3，M = 20</text>

  <!-- table header -->
  <g filter="url(#sk)"><rect x="30" y="44" width="580" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="50" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">轮</text>
  <text x="94" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">lo</text>
  <text x="142" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">hi</text>
  <text x="190" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">mid</text>
  <text x="319" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">check(mid) 贪心选中</text>
  <text x="447" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">cnt</text>
  <text x="540" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">动作</text>

  <!-- rows -->
  <g filter="url(#sk)"><rect x="30" y="76" width="580" height="34" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/></g>
  <text x="50" y="98" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="94" y="98" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="142" y="98" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="190" y="98" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="214" y="98" text-anchor="start" font-size="11" fill="#333">[1, 13]（21−13=8 &lt; 10）</text>
  <text x="447" y="98" text-anchor="middle" font-size="11" fill="#8a3a3a">2 ✗</text>
  <text x="478" y="98" text-anchor="middle" font-size="10.5" fill="#8a3a3a">hi = 9</text>

  <g filter="url(#sk)"><rect x="30" y="112" width="580" height="34" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/></g>
  <text x="50" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="94" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="142" y="134" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="190" y="134" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="214" y="134" text-anchor="start" font-size="11" fill="#333">[1, 5, 13]（cnt≥k 提前终止）</text>
  <text x="447" y="134" text-anchor="middle" font-size="11" fill="#2e5e2e">3 ✓</text>
  <text x="478" y="134" text-anchor="middle" font-size="10.5" fill="#2e5e2e">ans=4, lo=5</text>

  <g filter="url(#sk)"><rect x="30" y="148" width="580" height="34" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/></g>
  <text x="50" y="170" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="94" y="170" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="142" y="170" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="214" y="170" text-anchor="start" font-size="11" fill="#333">[1, 8, 21]</text>
  <text x="447" y="170" text-anchor="middle" font-size="11" fill="#2e5e2e">3 ✓</text>
  <text x="478" y="170" text-anchor="middle" font-size="10.5" fill="#2e5e2e">ans=7, lo=8</text>

  <g filter="url(#sk)"><rect x="30" y="184" width="580" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="50" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">4</text>
  <text x="94" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">8</text>
  <text x="142" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">9</text>
  <text x="190" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">8</text>
  <text x="214" y="206" text-anchor="start" font-size="11" font-weight="bold" fill="#2e5e2e">[1, 13, 21]</text>
  <text x="447" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">3 ✓</text>
  <text x="478" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">ans=8, lo=9 ★</text>

  <g filter="url(#sk)"><rect x="30" y="220" width="580" height="34" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/></g>
  <text x="50" y="242" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="94" y="242" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="142" y="242" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="190" y="242" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="214" y="242" text-anchor="start" font-size="11" fill="#333">[1, 13]（21−13=8 &lt; 9）</text>
  <text x="447" y="242" text-anchor="middle" font-size="11" fill="#8a3a3a">2 ✗</text>
  <text x="478" y="242" text-anchor="middle" font-size="10.5" fill="#8a3a3a">hi=8 → lo&gt;hi 结束</text>

  <!-- conclusion -->
  <g filter="url(#sk)"><rect x="70" y="270" width="500" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a">答案 ans = 8：选中 {1, 13, 21}</text>
  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#a06a1a">d = 8 可行且 d = 9 不可行 ⇒ 8 就是最大甜蜜度</text>

  <!-- selected candies gaps -->
  <g filter="url(#sk)"><ellipse cx="150" cy="362" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="150" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">1</text>
  <path d="M 170 362 L 420 362" stroke="#d6a040" stroke-width="2" marker-start="url(#arO)" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="295" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a1a">12</text>
  <g filter="url(#sk)"><ellipse cx="440" cy="362" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="440" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">13</text>
  <path d="M 460 362 L 510 362" stroke="#b85450" stroke-width="2.4" marker-start="url(#arR)" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="485" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a3a">8</text>
  <g filter="url(#sk)"><ellipse cx="530" cy="362" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="530" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">21</text>
  <text x="320" y="394" text-anchor="middle" font-size="10.5" fill="#888">选中序列相邻差 12、8 → 甜蜜度 = min(12, 8) = 8</text>
</svg>
