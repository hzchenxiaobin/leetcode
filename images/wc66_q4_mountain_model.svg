<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：1 记 +1、0 记 −1 的山脉视角</text>
  <text x="320" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">特殊串 ⇔ 合法括号串：前缀高度非负、末位回到 0；每回到 0 就是一个块边界</text>

  <!-- 坐标轴 -->
  <path d="M 88 300 L 88 142" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="132" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">bal</text>
  <path d="M 92 280 L 452 280" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="548" y="284" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">bal = 0</text>

  <!-- 两座山：s = 101100 -->
  <path d="M 110 280 L 160 234 L 210 280 L 160 234 Z" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <path d="M 210 280 L 260 234 L 310 188 L 360 234 L 410 280 L 310 188 Z" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <path d="M 110 280 L 160 234 L 210 280 L 260 234 L 310 188 L 360 234 L 410 280"
        stroke="#446688" stroke-width="2.2" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <circle cx="110" cy="280" r="3" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="160" cy="234" r="3" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="210" cy="280" r="3" fill="#d6a040" stroke="#b8860b" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="260" cy="234" r="3" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="310" cy="188" r="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="360" cy="234" r="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="410" cy="280" r="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 切点 -->
  <path d="M 210 196 L 210 300" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="148" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">回到 0 → 切块</text>

  <!-- 字符 -->
  <rect x="124" y="306" width="22" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="321" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="174" y="306" width="22" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185" y="321" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="224" y="306" width="22" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="235" y="321" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="274" y="306" width="22" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="285" y="321" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="324" y="306" width="22" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="335" y="321" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="374" y="306" width="22" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="385" y="321" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="470" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s = 101100</text>

  <!-- 块标注 -->
  <rect x="96" y="344" width="118" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="360" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">块 A = 1 · ε · 0</text>
  <text x="155" y="376" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">= "10"（本原）</text>

  <rect x="250" y="344" width="170" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="360" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">块 B = 1 · (10) · 0</text>
  <text x="335" y="376" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">= "1100"（本原）</text>

  <path d="M 220 364 L 244 364" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="70" y="396" width="500" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="417" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">每个块形如 1 · A · 0 且 A 仍是特殊串 ⇒ 可递归；块之间是相邻关系 ⇒ 可任意换序</text>
</svg>
