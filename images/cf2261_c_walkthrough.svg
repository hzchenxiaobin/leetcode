<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例走查：只数奇偶，两秒出答案</text>

  <!-- 表头 -->
  <rect x="30" y="78" width="66" height="38" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="63" y="102" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">来源</text>
  <rect x="96" y="78" width="256" height="38" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="102" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">数组</text>
  <rect x="352" y="78" width="84" height="38" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="102" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">(e, o)</text>
  <rect x="436" y="78" width="140" height="38" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="506" y="102" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">是否必败态</text>
  <rect x="576" y="78" width="114" height="38" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="633" y="102" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">输出</text>

  <!-- 第 1 行 -->
  <rect x="30" y="116" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="142" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">官方 1</text>
  <rect x="96" y="116" width="256" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[7]</text>
  <rect x="352" y="116" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <rect x="436" y="116" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否（1 步删完）</text>
  <rect x="576" y="116" width="114" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="633" y="142" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">Moggity</text>

  <!-- 第 2 行 -->
  <rect x="30" y="158" width="66" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="184" text-anchor="middle" font-size="11" fill="#8a3030" filter="url(#rough2)">官方 2</text>
  <rect x="96" y="158" width="256" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 3]</text>
  <rect x="352" y="158" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <rect x="436" y="158" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">是（一偶一奇）</text>
  <rect x="576" y="158" width="114" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="633" y="184" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">Larpity</text>

  <!-- 第 3 行 -->
  <rect x="30" y="200" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="226" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">官方 3</text>
  <rect x="96" y="200" width="256" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000000 999999 5 4 3 2</text>
  <rect x="352" y="200" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 3)</text>
  <rect x="436" y="200" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否（留 1 偶 1 奇）</text>
  <rect x="576" y="200" width="114" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="633" y="226" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">Moggity</text>

  <!-- 第 4 行：自造 -->
  <rect x="30" y="242" width="66" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="268" text-anchor="middle" font-size="11" fill="#8a3030" filter="url(#rough2)">自造</text>
  <rect x="96" y="242" width="256" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1, 3, 5]</text>
  <rect x="352" y="242" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 3)</text>
  <rect x="436" y="242" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">是（3 个奇数）</text>
  <rect x="576" y="242" width="114" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="633" y="268" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">Larpity</text>

  <!-- 第 5 行：自造 -->
  <rect x="30" y="284" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="310" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">自造</text>
  <rect x="96" y="284" width="256" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 4]</text>
  <rect x="352" y="284" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 0)</text>
  <rect x="436" y="284" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="506" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否（2 偶一起删）</text>
  <rect x="576" y="284" width="114" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="633" y="310" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">Moggity</text>

  <!-- 底部：官方 3 的具体走法 -->
  <rect x="30" y="342" width="660" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="364" text-anchor="middle" font-size="11" fill="#6b5314" filter="url(#rough2)">官方 3 的具体必胜手：删 1000000、4（2 个偶数）与 999999、5（2 个奇数），和 2000008 是偶数，走法合法</text>
  <text x="360" y="384" text-anchor="middle" font-size="11" fill="#6b5314" filter="url(#rough2)">留给 Larpity 的正是 {3, 2} = 一偶一奇，即 (1, 1) 必败态 ⇒ 再多元素也只是这两步的推广</text>

  <text x="360" y="412" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">红色行 = 先手必败，绿色行 = 先手必胜</text>
</svg>
