<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">验证码生命周期：generate 定寿命，renew 只对「未过期」延长（ttl=5 示例）</text>

  <!-- 时间轴 -->
  <path d="M 70 250 L 510 250" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="90" y="268">0</text><text x="150" y="268">2</text><text x="210" y="268">4</text><text x="270" y="268">6</text><text x="330" y="268">8</text><text x="390" y="268">10</text><text x="450" y="268">12</text><text x="500" y="268">15</text>
  </g>
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <path d="M 90 250 L 90 242 M 150 250 L 150 242 M 210 250 L 210 242 M 270 250 L 270 242 M 330 250 L 330 242 M 390 250 L 390 242 M 450 250 L 450 242 M 500 250 L 500 242"/>
  </g>

  <!-- aaa 的寿命区间 [2, 7)：过期前有效 -->
  <g filter="url(#rough2)">
    <rect x="150" y="80" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <text x="240" y="103" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">aaa：generate(2) → 存活 [2, 7)</text>
  <path d="M 150 116 L 150 246" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 330 116 L 330 246" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="330" y="136" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">7 时刻过期</text>

  <!-- count(6) -->
  <path d="M 270 60 L 270 240" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="270" y="54" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">countUnexpiredTokens(6) = 1</text>

  <!-- renew(aaa, 8) 被忽略 -->
  <path d="M 318 148 L 336 168" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="160" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">renew(aaa, 8)：</text>
  <text x="360" y="176" font-size="10.5" fill="#b85450" filter="url(#rough2)">8 ≥ 7 已过期 → 忽略</text>

  <!-- bbb 的寿命区间 [7, 12) → renew(10) 延长到 [10, 15) -->
  <g filter="url(#rough2)">
    <rect x="330" y="190" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="390" y="192" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" opacity="0.95"/>
  </g>
  <text x="384" y="211" text-anchor="middle" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">bbb: [7, 12)</text>
  <text x="470" y="211" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">renew(10) → [10, 15)</text>
  <path d="M 390 222 L 390 246" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 500 222 L 500 246" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="500" y="236" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">15 过期</text>

  <!-- count(15) -->
  <path d="M 500 268 L 500 306" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">count(15) = 0（过期优先）</text>

  <!-- 说明框 -->
  <rect x="40" y="340" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">判活规则统一为「expiry &gt; currentTime」：恰好在过期时刻 t，token 已算过期；</text>
  <text x="56" y="380" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">map 中无需真的删除——惰性判活即可，过期记录只是永远不再通过检查。</text>
</svg>
