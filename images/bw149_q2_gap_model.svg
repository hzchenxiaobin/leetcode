<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把时间轴切成 n+1 段“空余时间” gap[0..n]</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 2：eventTime = 10，会议 [0,1]、[2,4]、[9,10]</text>

  <line x1="50" y1="150" x2="580" y2="150" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="60" y="172" filter="url(#rough2)">0</text>
    <text x="160" y="172" filter="url(#rough2)">2</text>
    <text x="260" y="172" filter="url(#rough2)">4</text>
    <text x="510" y="172" filter="url(#rough2)">9</text>
    <text x="560" y="172" filter="url(#rough2)">10</text>
  </g>
  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1">
    <line x1="60" y1="144" x2="60" y2="158" filter="url(#rough2)"/>
    <line x1="160" y1="144" x2="160" y2="158" filter="url(#rough2)"/>
    <line x1="260" y1="144" x2="260" y2="158" filter="url(#rough2)"/>
    <line x1="510" y1="144" x2="510" y2="158" filter="url(#rough2)"/>
    <line x1="560" y1="144" x2="560" y2="158" filter="url(#rough2)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="160" y="120" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="510" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="85" y="140" filter="url(#rough2)">[0,1]</text>
    <text x="210" y="140" filter="url(#rough2)">[2,4] 长 2</text>
    <text x="535" y="140" filter="url(#rough2)">[9,10]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="110" y="190" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="260" y="190" width="250" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <rect x="560" y="190" width="12" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="48" y="190" width="12" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="135" y="205" fill="#3a5a30" filter="url(#rough2)">g₁ = 1</text>
    <text x="385" y="205" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">g₂ = 5</text>
    <text x="566" y="230" fill="#8a3a36" filter="url(#rough2)">g₃ = 0</text>
    <text x="54" y="230" fill="#8a3a36" filter="url(#rough2)">g₀ = 0</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="50" y="76" filter="url(#rough2)">gap[0] = startTime[0] = 0</text>
    <text x="50" y="94" filter="url(#rough2)">gap[i] = startTime[i] − endTime[i−1]　（1 ≤ i ≤ n−1）</text>
    <text x="50" y="112" filter="url(#rough2)">gap[n] = eventTime − endTime[n−1] = 0</text>
  </g>

  <path d="M 135 218 L 135 246" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 218 L 385 246" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="250" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="64" y="270" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">移走中间那个会议 [2,4]，g₁ 与 g₂ 拼成一段：1 + 5 = 6（会议长度 2 本身也算进这段跨度，随后被会议占回去）</text>

  <rect x="50" y="292" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="64" y="310" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">一般结论：移走 k 个会议 ⟺ 把 k+1 段相邻的 gap 拼成一段，答案 = max(连续 k+1 段 gap 之和)</text>

  <text x="310" y="248" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">零长度的 gap（g₀、g₃）也要保留，它们让“窗口合并”在边界处同样成立</text>
</svg>
