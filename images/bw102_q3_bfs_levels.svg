<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <rect x="170" y="22" width="180" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">root.val = 0，level = [root]</text>
  <path d="M 260 60 L 260 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="86" width="328" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">nextSum = Σ 当前层所有孩子的 val</text>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">★ 必须在任何修改之前算（读的是原始值）</text>
  <path d="M 260 130 L 260 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="156" width="360" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">逐父：childSum = 该父两个孩子的原始值之和</text>
  <path d="M 260 196 L 260 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="64" y="222" width="392" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">每个孩子：c.val = nextSum − childSum，并入 next 队列</text>
  <path d="M 260 262 L 260 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="288" width="220" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">level = next；非空则回到 nextSum</text>

  <path d="M 150 307 C 60 307, 55 108, 96 106" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">层内顺序：先统计 nextSum，再逐父读 childSum、改孩子</text>
</svg>
