<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：移除时刻表 + 二分答案 + 双指针判定</text>
  <path d="M 160 40 Q 340 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A: preprocess -->
  <g filter="url(#sk)">
    <rect x="170" y="54" width="260" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="300" y="75" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">预处理：removeTime[removable[t]] = t，其余 −1</text>
  <g filter="url(#sk)">
    <path d="M 300 88 L 300 102" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- B: init -->
  <g filter="url(#sk)">
    <rect x="215" y="106" width="170" height="30" rx="8" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="300" y="125" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">lo = 0，hi = m，ans = 0</text>
  <g filter="url(#sk)">
    <path d="M 300 136 L 300 152" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- C: loop condition diamond -->
  <g filter="url(#sk)">
    <polygon points="300,158 384,184 300,210 216,184" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="300" y="189" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">lo ≤ hi ?</text>
  <g filter="url(#sk)">
    <path d="M 216 184 L 152 184" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="184" y="176" text-anchor="middle" font-size="11" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="24" y="168" width="124" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="86" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">return ans</text>
  <g filter="url(#sk)">
    <path d="M 300 210 L 300 228" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="310" y="224" font-size="11" fill="#2e6e2e">是</text>

  <!-- D: mid -->
  <g filter="url(#sk)">
    <rect x="205" y="232" width="190" height="30" rx="8" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="300" y="251" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">mid = (lo + hi) / 2</text>
  <g filter="url(#sk)">
    <path d="M 300 262 L 300 280" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- E: check box -->
  <g filter="url(#sk)">
    <rect x="140" y="284" width="320" height="88" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="300" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">check(mid)：双指针判子序列</text>
  <text x="300" y="323" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">i 升序扫 s：removeTime[i] ∈ [0, mid) 则跳过</text>
  <text x="300" y="340" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">未删且 s[i] == p[j] → j++</text>
  <text x="300" y="357" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">返回 j 是否走完 p</text>
  <text x="480" y="330" font-size="11" fill="#888" font-family="monospace">O(|s|)</text>

  <g filter="url(#sk)">
    <path d="M 300 372 L 300 390" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- F: feasible diamond -->
  <g filter="url(#sk)">
    <polygon points="300,396 378,422 300,448 222,422" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="300" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">可行？</text>
  <g filter="url(#sk)">
    <path d="M 378 422 L 424 422" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="396" y="414" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="432" y="406" width="172" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="518" y="426" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">ans = mid，lo = mid + 1</text>
  <g filter="url(#sk)">
    <path d="M 222 422 L 174 422" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="198" y="414" text-anchor="middle" font-size="11" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <rect x="24" y="406" width="146" height="32" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="97" y="426" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-family="monospace">hi = mid − 1</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 604 422 L 648 422 L 648 184 L 392 184" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 97 438 L 97 456 L 648 456 L 648 424" stroke="#3a3a3a" stroke-width="1.6" fill="none"/>
  </g>
  <text x="520" y="174" text-anchor="middle" font-size="11" fill="#888">每轮区间减半，共 O(log m) 轮</text>
</svg>
