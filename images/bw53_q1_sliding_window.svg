<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">定长 3 的窗口：窗口内三个字符两两不同才算「好」</text>

  <!-- 第一行：窗口在 i=2 -->
  <text x="60" y="72" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 i=2</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="66" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="102" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="138" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="282" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="318" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="354" y="80" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="84" y="101">a</text><text x="120" y="101">a</text><text x="156" y="101">b</text>
    <text x="192" y="101">a</text><text x="228" y="101">b</text><text x="264" y="101">c</text>
    <text x="300" y="101">a</text><text x="336" y="101">b</text><text x="372" y="101">c</text>
  </g>
  <rect x="136" y="74" width="112" height="44" fill="none" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="262" y="94" font-size="13" fill="#b85450" filter="url(#rough2)">aba：a 出现两次 → ✗</text>

  <path d="M 240 142 Q 268 156, 296 142" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">右移一格</text>

  <!-- 第二行：窗口在 i=3 -->
  <text x="60" y="196" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 i=3</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="66" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="102" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="138" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="282" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="318" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="354" y="204" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="84" y="225">a</text><text x="120" y="225">a</text><text x="156" y="225">b</text>
    <text x="192" y="225">a</text><text x="228" y="225">b</text><text x="264" y="225">c</text>
    <text x="300" y="225">a</text><text x="336" y="225">b</text><text x="372" y="225">c</text>
  </g>
  <rect x="172" y="198" width="112" height="44" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="298" y="218" font-size="13" fill="#4a7a3a" filter="url(#rough2)">abc：两两不同 → ✓</text>

  <!-- 判定条件 -->
  <rect x="70" y="262" width="420" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">判定只需三次比较（O(1)）</text>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">s[i] ≠ s[i+1] 且 s[i] ≠ s[i+2] 且 s[i+1] ≠ s[i+2]</text>
</svg>
