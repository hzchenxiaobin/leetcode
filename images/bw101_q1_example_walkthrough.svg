<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- 示例 1 -->
  <text x="280" y="36" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：nums1 = [4,1,3]，nums2 = [5,7]（无公共数位）</text>
  <g filter="url(#rough2)">
    <rect x="120" y="56" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="137" y="76" text-anchor="middle" font-size="13" fill="#333">4</text>
    <rect x="154" y="56" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="171" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
    <rect x="188" y="56" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="76" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="300" y="56" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="317" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">5</text>
    <rect x="334" y="56" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="351" y="76" text-anchor="middle" font-size="13" fill="#333">7</text>
  </g>
  <text x="171" y="102" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a = 1</text>
  <text x="317" y="102" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b = 5</text>
  <path d="M 171 106 C 171 132, 220 132, 245 138" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 317 106 C 317 132, 268 132, 258 138" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="196" y="140" width="112" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="162" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">min(15, 51) = 15</text>

  <!-- 分隔线 -->
  <path d="M 40 190 L 520 190" stroke="#c8c8c8" stroke-width="1.3" stroke-dasharray="8 7" fill="none" filter="url(#rough2)"/>

  <!-- 示例 2 -->
  <text x="280" y="222" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2：nums1 = [3,5,2,6]，nums2 = [3,1,7]（公共数位 3）</text>
  <g filter="url(#rough2)">
    <rect x="96" y="240" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="113" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
    <rect x="130" y="240" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="147" y="260" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="164" y="240" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="181" y="260" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="198" y="240" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="215" y="260" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="300" y="240" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="317" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
    <rect x="334" y="240" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="351" y="260" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="368" y="240" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="385" y="260" text-anchor="middle" font-size="13" fill="#333">7</text>
  </g>
  <path d="M 113 272 C 113 300, 160 300, 186 302" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 317 272 C 317 300, 268 300, 246 302" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="188" y="296" width="66" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="221" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
</svg>
