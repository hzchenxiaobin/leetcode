<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心不变量：剩下的数始终是等差数列</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只需记住首项 head、公差 step、剩余个数 rem，不必真的建表</text>

  <text x="108" y="96" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">起始</text>
  <text x="108" y="110" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">n = 9</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="78" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="138" y="99" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="162" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="180" y="99" fill="#333">2</text>
    <rect x="204" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="222" y="99" fill="#333">3</text>
    <rect x="246" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="264" y="99" fill="#333">4</text>
    <rect x="288" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="306" y="99" fill="#333">5</text>
    <rect x="330" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="348" y="99" fill="#333">6</text>
    <rect x="372" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="390" y="99" fill="#333">7</text>
    <rect x="414" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="432" y="99" fill="#333">8</text>
    <rect x="456" y="78" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="474" y="99" fill="#333">9</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="128" y1="86" x2="148" y2="102"/>
    <line x1="148" y1="86" x2="128" y2="102"/>
    <line x1="212" y1="86" x2="232" y2="102"/>
    <line x1="232" y1="86" x2="212" y2="102"/>
    <line x1="296" y1="86" x2="316" y2="102"/>
    <line x1="316" y1="86" x2="296" y2="102"/>
    <line x1="380" y1="86" x2="400" y2="102"/>
    <line x1="400" y1="86" x2="380" y2="102"/>
    <line x1="464" y1="86" x2="484" y2="102"/>
    <line x1="484" y1="86" x2="464" y2="102"/>
  </g>

  <text x="120" y="130" font-size="10" fill="#446688" filter="url(#rough2)">第 1 轮 L→R 后：head = 1 + 1 = 2，step = 2，rem = 4</text>

  <text x="108" y="162" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">第 1 轮后</text>
  <text x="108" y="176" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">L → R</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="144" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="138" y="165" fill="#8a6a20" font-weight="bold">2</text>
    <rect x="162" y="144" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="180" y="165" fill="#333">4</text>
    <rect x="204" y="144" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="222" y="165" fill="#333">6</text>
    <rect x="246" y="144" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="264" y="165" fill="#333">8</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="170" y1="152" x2="190" y2="168"/>
    <line x1="190" y1="152" x2="170" y2="168"/>
    <line x1="254" y1="152" x2="274" y2="168"/>
    <line x1="274" y1="152" x2="254" y2="168"/>
  </g>

  <text x="120" y="196" font-size="10" fill="#446688" filter="url(#rough2)">第 2 轮 R→L 后：rem = 4 为偶数，首项幸存，head 不变 = 2，step = 4，rem = 2</text>

  <text x="108" y="226" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">第 2 轮后</text>
  <text x="108" y="240" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">R → L</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="208" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="138" y="229" fill="#8a6a20" font-weight="bold">2</text>
    <rect x="162" y="208" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="180" y="229" fill="#333">6</text>
  </g>

  <text x="120" y="262" font-size="10" fill="#446688" filter="url(#rough2)">第 3 轮 L→R 后：删掉 2，head = 2 + 4 = 6，step = 8，rem = 1 → 结束</text>

  <text x="108" y="300" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">第 3 轮后</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="282" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="138" y="303" fill="#2f5424" font-weight="bold">6</text>
  </g>

  <rect x="40" y="340" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="358" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">「隔一个删一个」= 只留下原序列的奇数位或偶数位</text>
  <text x="56" y="373" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⇒ 仍是等差数列：公差翻倍、长度减半，只有首项可能移动</text>
</svg>
