<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法：把 n−1 的二进制位从低到高填进 x 的 0 位插槽</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- example 1 -->
  <text x="320" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">例 1：n = 3, x = 4（100₂）</text>

  <text x="322" y="100" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2b2b2b">x 的位：</text>
  <g filter="url(#sk)">
    <rect x="332" y="80" width="46" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="384" y="80" width="46" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="436" y="80" width="46" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="488" y="80" width="46" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
  </g>
  <text x="355" y="105" text-anchor="middle" font-size="14" fill="#7a5415">0</text>
  <text x="407" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="459" y="105" text-anchor="middle" font-size="14" fill="#7a5415">?</text>
  <text x="511" y="105" text-anchor="middle" font-size="14" fill="#7a5415">?</text>
  <text x="355" y="132" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="407" y="132" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="459" y="132" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="511" y="132" text-anchor="middle" font-size="9.5" fill="#999">0</text>

  <text x="152" y="188" text-anchor="end" font-size="12.5" font-weight="bold" fill="#7a5415">k = n−1 = 10₂：</text>
  <g filter="url(#sk)">
    <rect x="166" y="164" width="46" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="218" y="164" width="46" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="189" y="189" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="241" y="189" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="189" y="216" text-anchor="middle" font-size="9.5" fill="#999">k 位 1</text>
  <text x="241" y="216" text-anchor="middle" font-size="9.5" fill="#999">k 位 0</text>

  <g filter="url(#sk)">
    <path d="M 240 208 Q 330 240 480 124" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
    <path d="M 188 208 Q 260 250 516 124" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
  </g>
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#b85450">k 位 1 = 1 → 插槽 1</text>
  <text x="452" y="248" text-anchor="middle" font-size="11" fill="#b85450">k 位 0 = 0 → 插槽 0</text>

  <text x="320" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">填入后 ans = 0110₂ = 6 ✓（数组 [4, 5, 6]，更高插槽默认 0）</text>

  <!-- example 2 -->
  <text x="320" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">例 2：n = 2, x = 7（011₂… 前 3 位全锁，第一个插槽跳到位置 3）</text>

  <text x="322" y="344" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2b2b2b">x 的位：</text>
  <g filter="url(#sk)">
    <rect x="332" y="324" width="46" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="384" y="324" width="46" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="436" y="324" width="46" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="488" y="324" width="46" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="355" y="349" text-anchor="middle" font-size="14" fill="#7a5415">?</text>
  <text x="407" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="459" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="511" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="355" y="376" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="407" y="376" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="459" y="376" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="511" y="376" text-anchor="middle" font-size="9.5" fill="#999">0</text>

  <text x="152" y="352" text-anchor="end" font-size="12.5" font-weight="bold" fill="#7a5415">k = 1₂：</text>
  <g filter="url(#sk)">
    <rect x="218" y="328" width="46" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="241" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="241" y="380" text-anchor="middle" font-size="9.5" fill="#999">k 位 0</text>

  <g filter="url(#sk)">
    <path d="M 240 372 Q 310 410 348 368" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
  </g>
  <text x="252" y="412" text-anchor="middle" font-size="11" fill="#b85450">k 位 0 = 1 → 插槽 3</text>

  <text x="320" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">填入后 ans = 1111₂ = 15 ✓（数组 [7, 15]）</text>

  <!-- implementation box -->
  <g filter="url(#sk)">
    <rect x="56" y="456" width="528" height="36" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="479" text-anchor="middle" font-size="12" fill="#2b6e9e">实现：j 从低位到高位扫 ans，遇到 0 位 ⇒ 该位 ← k 的最低位，k 右移一位；k = 0 时结束</text>
</svg>
