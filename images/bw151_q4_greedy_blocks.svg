<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">逐位确定：按值从小到大分组，组内方案数与 k 比较</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">n = 4, k = 6：每个首位的组都恰好 2 个交替排列</text>
  <text x="20" y="84" text-anchor="start" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">首位候选</text>
  <rect x="100" y="70" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="128.0" y="94.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="128.0" y="122" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">2 个</text>
  <rect x="182" y="70" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210.0" y="94.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="210.0" y="122" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">2 个</text>
  <rect x="264" y="70" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="292.0" y="94.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="292.0" y="122" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">2 个</text>
  <rect x="346" y="70" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="374.0" y="94.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="374.0" y="122" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">2 个</text>
  <text x="20" y="140" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">k 的变化：6 →（减去 1 组的 2 个）4 →（减去 2 组的 2 个）2，第 3 组装得下</text>
  <text x="20" y="182" text-anchor="start" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">第二位候选（必须偶数）</text>
  <rect x="100" y="200" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="128.0" y="224.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="128.0" y="252" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">1 个</text>
  <rect x="182" y="200" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210.0" y="224.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="210.0" y="252" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">1 个</text>
  <text x="290" y="224" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">k = 2 &gt; 1 减去 → 1 ≤ 1 选中 4</text>
  <text x="20" y="296" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">于是前两位锁死 3、4，剩下的奇数 1 只能放第三位</text>
  <rect x="150" y="310" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176.0" y="335.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="210" y="310" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236.0" y="335.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="270" y="310" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296.0" y="335.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="330" y="310" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356.0" y="335.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="396" y="336" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="40" y="366" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">关键：一组候选的方案数 = rest_o! × rest_e!，槽型对不上就是 0</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">阶乘要封顶（&gt; 10¹⁵ 即可），避免 long long 溢出</text>
</svg>
