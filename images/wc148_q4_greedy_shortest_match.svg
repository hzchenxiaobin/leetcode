<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每次配对最短的可配对前后缀</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">配得越短，剩下的中间部分越长，能继续切出的块只会更多</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="44" y="96" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="72" y="96" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="126" y="96" width="26" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="154" y="96" width="78" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="234" y="96" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="288" y="96" width="78" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="368" y="96" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="422" y="96" width="78" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="502" y="96" width="26" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="530" y="96" width="52" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="584" y="96" width="26" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>

    <text x="57" y="123" fill="#3a4a66">a</text>
    <text x="98" y="123" fill="#3a4a66">nt</text>
    <text x="139" y="123" fill="#3a4a66">a</text>
    <text x="193" y="123" fill="#3a4a66">pre</text>
    <text x="260" y="123" fill="#3a4a66">za</text>
    <text x="327" y="123" fill="#8a6a20">tep</text>
    <text x="394" y="123" fill="#3a5a30">za</text>
    <text x="461" y="123" fill="#3a5a30">pre</text>
    <text x="515" y="123" fill="#3a5a30">a</text>
    <text x="556" y="123" fill="#3a5a30">nt</text>
    <text x="597" y="123" fill="#3a5a30">a</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="57" y="152">1</text><text x="98" y="152">2</text><text x="139" y="152">3</text>
    <text x="193" y="152">4</text><text x="260" y="152">5</text><text x="327" y="152">6</text>
    <text x="394" y="152">7</text><text x="461" y="152">8</text><text x="515" y="152">9</text>
    <text x="556" y="152">10</text><text x="597" y="152">11</text>
  </g>

  <text x="44" y="88" font-size="10" fill="#b85450" filter="url(#rough2)">L 从 1 开始试：1, 2, 3 …（取第一个配得上的）</text>

  <path d="M 70 160 C 70 180, 560 180, 570 160" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 160 C 100 196, 540 196, 546 160" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">① ↔ ⑪　② ↔ ⑩　③ ↔ ⑨　④ ↔ ⑧　⑤ ↔ ⑦　⑥ 居中</text>

  <rect x="60" y="212" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="234" font-size="11" fill="#8a6a20" filter="url(#rough2)">块数 = 2 × 配对数 +（中间是否还剩字符）。</text>
  <text x="76" y="252" font-size="11" fill="#8a6a20" filter="url(#rough2)">贪心取最短配对块，把更多字符留在中间，中间越长越可能继续配对。</text>

  <rect x="60" y="276" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="300" font-size="10" fill="#8a3a3a" filter="url(#rough2)">外层先取长块 (anta)(pre)(za)(tep)(za)(pre)(anta) → k = 7</text>

  <rect x="60" y="320" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="344" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">外层取最短 (a)(nt)(a)(pre)(za)(tep)(za)(pre)(a)(nt)(a) → k = 11（最优）</text>

  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同一个字符串：外层块取越长，能切出的块数越少——这就是贪心取「最短匹配」的动机</text>
</svg>
