<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀 ∪ 后缀 = 整个数组，跨越分割点的质数计两次</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 查询 2 后 nums = [2, 2, 3, 3, 2]，选 k = 3</text>

  <!-- 分割虚线 -->
  <path d="M 270 50 L 270 108" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="276" y="50" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 3</text>

  <!-- 前缀 / 后缀外框 -->
  <rect x="132" y="51" width="134" height="50" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="274" y="51" width="88" height="50" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="138" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="226" y="58" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="270" y="58" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="314" y="58" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="160" y="70" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="204" y="70" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="248" y="70" text-anchor="middle" font-size="9" fill="#999">2</text>
    <text x="292" y="70" text-anchor="middle" font-size="9" fill="#999">3</text>
    <text x="336" y="70" text-anchor="middle" font-size="9" fill="#999">4</text>
    <text x="160" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a4666">2</text>
    <text x="204" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a4666">2</text>
    <text x="248" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a4666">3</text>
    <text x="292" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a5a2a">3</text>
    <text x="336" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a5a2a">2</text>
  </g>

  <text x="134" y="116" font-size="10" fill="#446688" filter="url(#rough2)">前缀 nums[0..k-1]</text>
  <text x="278" y="116" font-size="10" fill="#4a7a3a" filter="url(#rough2)">后缀 nums[k..n-1]</text>

  <!-- 两侧集合 -->
  <g filter="url(#rough2)">
    <rect x="95" y="128" width="167" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="178" y="149" text-anchor="middle" font-size="11.5" fill="#2a4666" font-weight="bold">前缀 {2, 3} → 2 个</text>
    <text x="270" y="150" text-anchor="middle" font-size="16" fill="#333">＋</text>
    <rect x="278" y="128" width="167" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="361" y="149" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">后缀 {3, 2} → 2 个</text>
  </g>

  <!-- 计两次解释 -->
  <g filter="url(#rough2)">
    <rect x="58" y="174" width="404" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="193" text-anchor="middle" font-size="10.5" fill="#8a6d1f">质数 2：first=0 &lt; k=3 ≤ last=4，两边都出现 → 计 2 次</text>
    <text x="260" y="215" text-anchor="middle" font-size="10.5" fill="#8a6d1f">质数 3：first=2 &lt; k=3 ≤ last=3，两边都出现 → 计 2 次</text>
  </g>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="120" y="240" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8"/>
    <text x="260" y="262" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">ans(k) = C + D(k) = 2 + 2 = 4</text>
  </g>

  <!-- 定义 -->
  <g filter="url(#rough2)">
    <rect x="48" y="288" width="424" height="46" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#555">C = 整个数组中不同质数的个数（与 k 无关）= |{2, 3}| = 2</text>
    <text x="260" y="325" text-anchor="middle" font-size="10.5" fill="#555">D(k) = 跨越 k 的质数个数 = |{v : first(v) &lt; k ≤ last(v)}| = 2</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="38" y="346" width="444" height="36" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="260" y="369" text-anchor="middle" font-size="9.5" fill="#555">前缀 ∪ 后缀 = 整个数组 ⇒ 任何出现的质数至少计 1 次；两边都出现 ⇔ first(v) &lt; k ≤ last(v)，恰计 2 次</text>
  </g>
</svg>
