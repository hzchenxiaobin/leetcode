<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">美丽值：排序后第 x 小的数，是负数才取它</text>
  <path d="M 190 40 Q 380 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- mini counter-example -->
  <g filter="url(#rough2)">
    <rect x="470" y="54" width="268" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="604" y="75" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">小反例：窗口 [1, 2]，x = 2</text>
  <text x="604" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">第 2 小 = 2 不是负数 → 美丽值 = 0</text>

  <!-- original window -->
  <text x="88" y="72" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">原窗口（k = 3）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="122" y="80" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="80" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="88" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="150" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="212" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="88" y="130" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">i=0</text>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">i=1</text>
  <text x="212" y="130" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">i=2</text>

  <!-- sort arrow -->
  <line x1="150" y1="140" x2="150" y2="172" stroke="#888888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="160" font-size="11" fill="#666666" filter="url(#rough2)">排序，重复保留</text>

  <!-- sorted window -->
  <g filter="url(#rough2)">
    <rect x="60" y="180" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="122" y="180" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="184" y="180" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="88" y="203" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="150" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="212" y="203" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="88" y="232" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">第 1 小</text>
  <text x="150" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 2 小</text>
  <text x="212" y="232" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">第 3 小</text>

  <!-- x pointer -->
  <line x1="150" y1="266" x2="150" y2="242" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 2</text>

  <!-- arrow to decision -->
  <line x1="246" y1="198" x2="472" y2="198" stroke="#888888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="188" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">取第 x 小的数</text>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="480,198 560,162 640,198 560,234" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="560" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">是负数？</text>

  <!-- yes branch -->
  <line x1="560" y1="234" x2="560" y2="268" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="572" y="256" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="440" y="272" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="540" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">美丽值 = −1</text>

  <!-- no branch -->
  <line x1="640" y1="198" x2="682" y2="270" stroke="#888888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="668" y="236" font-size="11" font-weight="bold" fill="#888888" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="650" y="272" width="100" height="40" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.5"/>
  </g>
  <text x="700" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#666666" filter="url(#rough2)">美丽值 = 0</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="50" y="336" width="660" height="78" rx="10" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="380" y="362" text-anchor="middle" font-size="12" fill="#444444" filter="url(#rough2)">等价说法：窗口内负数个数 ≥ x ⇔ 第 x 小是负数</text>
  <text x="380" y="384" text-anchor="middle" font-size="12" fill="#444444" filter="url(#rough2)">此时美丽值 = 第 x 小的负数；负数不够 x 个 → 美丽值 = 0</text>
  <text x="380" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">所以全程只需数负数、扫负数！</text>
</svg>
