<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：任取三个互异数，中位数必可行</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array row -->
  <text x="320" y="72" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">任取三个元素（比如前三个），无需看完整个数组</text>
  <g filter="url(#sk)">
    <rect x="212" y="86" width="176" height="62" rx="10" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7,5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="218" y="92" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="268" y="92" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="318" y="92" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="368" y="92" width="44" height="38" rx="6" fill="#f2f2ee" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="240" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <text x="290" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2</text>
  <text x="340" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="390" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#777" filter="url(#sk)">4</text>
  <text x="445" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">…其余不用看</text>

  <!-- arrow down -->
  <path d="M 300 148 L 300 172" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- three sorted circles -->
  <text x="320" y="196" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">把这组三个数排好序：x &lt; y &lt; z</text>
  <g filter="url(#sk)">
    <circle cx="180" cy="244" r="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="320" cy="244" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="460" cy="244" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="180" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">x</text>
  <text x="320" y="250" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6415" filter="url(#sk)">y</text>
  <text x="460" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e24" filter="url(#sk)">z</text>
  <text x="250" y="238" text-anchor="middle" font-size="14" fill="#555" filter="url(#sk)">&lt;</text>
  <text x="390" y="238" text-anchor="middle" font-size="14" fill="#555" filter="url(#sk)">&lt;</text>
  <text x="180" y="286" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">全局最小若在这组里</text>
  <text x="180" y="301" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">只能是最左端 ✗</text>
  <text x="320" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">中位数：合法答案 ✓</text>
  <text x="460" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">全局最大若在这组里</text>
  <text x="460" y="301" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">只能是最右端 ✗</text>

  <!-- reason boxes -->
  <g filter="url(#sk)">
    <rect x="48" y="316" width="268" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="182" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">左边有 x &lt; y：存在更小的数</text>
  <text x="182" y="349" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#sk)">⇒ y 不是全局最小</text>
  <g filter="url(#sk)">
    <rect x="324" y="316" width="268" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="458" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">右边有 z &gt; y：存在更大的数</text>
  <text x="458" y="349" text-anchor="middle" font-size="11.5" fill="#2e5e24" filter="url(#sk)">⇒ y 不是全局最大</text>

  <!-- conclusion -->
  <text x="320" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">两个方向都排除 ⇒ 中位数既非最小也非最大，直接返回前三个元素的中位数，O(1) 收工</text>
</svg>
