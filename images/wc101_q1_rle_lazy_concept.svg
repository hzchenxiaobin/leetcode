<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：RLE 是「惰性视图」，不必真的展开</text>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">encoding = [3,8, 0,9, 2,5] 代表 8,8,8,5,5（3 个 8 + 0 个 9 + 2 个 5）</text>
  <rect x="130" y="82" width="50" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3</text>
  <rect x="180" y="82" width="50" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <text x="180" y="146" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">计数 | 值</text>
  <rect x="280" y="82" width="50" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">0</text>
  <rect x="330" y="82" width="50" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">9</text>
  <text x="330" y="146" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">计数 | 值</text>
  <rect x="430" y="82" width="50" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="480" y="82" width="50" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <text x="480" y="146" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="" filter="url(#rough2)">计数 | 值</text>
  <text x="90" y="190" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" font-style="" filter="url(#rough2)">展开后</text>
  <rect x="150" y="172" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172.0" y="196.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <rect x="199" y="172" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="221.0" y="196.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <rect x="248" y="172" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270.0" y="196.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <rect x="297" y="172" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319.0" y="196.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="346" y="172" width="44" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368.0" y="196.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <text x="80" y="230" text-anchor="start" font-size="12" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">指针只需记住「游程下标 i」和「该游程剩余计数」，无需展开整个序列</text>
  <rect x="60" y="240" width="520" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="279.4" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="320.0" dy="0">next(n)：从当前游程开始连续耗尽 n 个元素</tspan><tspan x="320.0" dy="17">整段不够就整段跳过（i += 2）；跨段时只把最后一段的计数减 n</tspan></text>
</svg>
