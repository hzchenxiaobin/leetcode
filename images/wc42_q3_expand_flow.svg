<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举中心 → 向外扩展到失配</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">半径单调：r 可行 ⇒ 所有更小的半径都可行，所以边走边累加不会漏也不会重</text>

  <rect x="160" y="64" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="11.5" fill="#2f4666" filter="url(#rough2)">for i ← 0 … n−1：中心 (i, i) 与 (i, i + 1)</text>
  <path d="M 320 98 L 320 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="122" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="142" text-anchor="middle" font-size="11.5" fill="#2f4a26" filter="url(#rough2)">cnt ← 0，取 l = left，r = right</text>
  <text x="320" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">若 s[l] == s[r]：cnt++、l−−、r++</text>
  <path d="M 320 164 L 320 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,188 450,232 320,276 190,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">仍相等且不越界？</text>
  <text x="320" y="246" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#rough2)">l ≥ 0 且 r &lt; n</text>

  <path d="M 190 232 L 120 232 L 120 146 L 154 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="214" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是，继续循环</text>

  <path d="M 450 232 L 520 232 L 520 302" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="222" font-size="10" fill="#b85450" filter="url(#rough2)">否，该中心结束</text>

  <rect x="400" y="304" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="326" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">ans ← ans + cnt</text>
  <text x="510" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">换下一个中心 i</text>

  <rect x="40" y="304" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="326" text-anchor="middle" font-size="10.5" fill="#2f4666" filter="url(#rough2)">每个中心只做一次 while 扩展，代价 = 该中心半径</text>
  <text x="200" y="346" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">最坏（全为同一字符）Σ 半径 = O(n²)</text>

  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">全部中心处理完 → 返回 ans（回文子串总数）</text>
</svg>
