<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：n = 5, x = 2, y = 4（d = 2，C = 3，环 = [2,4]）</text>
  <path d="M 150 38 Q 320 44 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- graph -->
  <g filter="url(#sk)">
    <rect x="222" y="62" width="236" height="56" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="340" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">环 [2,4]，C = 3</text>
  <path d="M 156 95 L 224 95" stroke="#666" stroke-width="1.8" filter="url(#sk)"/>
  <path d="M 256 95 L 324 95" stroke="#666" stroke-width="1.8" filter="url(#sk)"/>
  <path d="M 356 95 L 424 95" stroke="#666" stroke-width="1.8" filter="url(#sk)"/>
  <path d="M 456 95 L 524 95" stroke="#666" stroke-width="1.8" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="140" cy="95" rx="16" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <ellipse cx="240" cy="95" rx="16" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <ellipse cx="340" cy="95" rx="16" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <ellipse cx="440" cy="95" rx="16" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <ellipse cx="540" cy="95" rx="16" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="140" y="100" text-anchor="middle" font-size="13" fill="#2b5d85">1</text>
  <text x="240" y="100" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="340" y="100" text-anchor="middle" font-size="13" fill="#2e6e2e">3</text>
  <text x="440" y="100" text-anchor="middle" font-size="13" fill="#2e6e2e">4</text>
  <text x="540" y="100" text-anchor="middle" font-size="13" fill="#2b5d85">5</text>
  <path d="M 240 112 Q 340 158 434 113" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="340" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a5a">弦（1 步）</text>

  <!-- step 1: baseline -->
  <g filter="url(#sk)">
    <rect x="50" y="178" width="540" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="185" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">① 基线（当作纯链）</text>
  <text x="185" y="228" text-anchor="middle" font-size="12" fill="#2e6e2e">无序对 cnt[k] = n − k</text>
  <g filter="url(#sk)">
    <rect x="330" y="190" width="36" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="372" y="190" width="36" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="414" y="190" width="36" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="456" y="190" width="36" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="498" y="190" width="36" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="348" y="208" text-anchor="middle" font-size="13" fill="#2e6e2e">4</text>
  <text x="390" y="208" text-anchor="middle" font-size="13" fill="#2e6e2e">3</text>
  <text x="432" y="208" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="474" y="208" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <text x="516" y="208" text-anchor="middle" font-size="13" fill="#2e6e2e">0</text>
  <text x="348" y="238" text-anchor="middle" font-size="9.5" fill="#888">k=1</text>
  <text x="390" y="238" text-anchor="middle" font-size="9.5" fill="#888">k=2</text>
  <text x="432" y="238" text-anchor="middle" font-size="9.5" fill="#888">k=3</text>
  <text x="474" y="238" text-anchor="middle" font-size="9.5" fill="#888">k=4</text>
  <text x="516" y="238" text-anchor="middle" font-size="9.5" fill="#888">k=5</text>

  <!-- step 2: helped pairs table -->
  <text x="320" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5d85">② 受益点对（d = 2 ⇒ 四类条件全开，恰好 4 对）：从 t 桶搬进 W 桶</text>
  <g filter="url(#sk)">
    <rect x="60" y="284" width="520" height="150" rx="8" fill="#f4f8fd" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="110" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85">点对</text>
  <text x="230" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85">类型</text>
  <text x="345" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85">旧 t</text>
  <text x="415" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85">新 W</text>
  <text x="515" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85">差分修正</text>
  <path d="M 70 316 L 570 316" stroke="#9dc3e6" stroke-width="1" filter="url(#sk)"/>

  <text x="110" y="338" text-anchor="middle" font-size="12.5" fill="#333">(1, 5)</text>
  <text x="230" y="338" text-anchor="middle" font-size="12" fill="#333">异侧尾巴</text>
  <text x="345" y="338" text-anchor="middle" font-size="12.5" fill="#a04a5a">4</text>
  <path d="M 362 334 L 396 334" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="415" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="515" y="338" text-anchor="middle" font-size="11.5" fill="#666">cnt[3]+1，cnt[4]−1</text>
  <path d="M 70 348 L 570 348" stroke="#dde8f4" stroke-width="1" filter="url(#sk)"/>

  <text x="110" y="372" text-anchor="middle" font-size="12.5" fill="#333">(1, 4)</text>
  <text x="230" y="372" text-anchor="middle" font-size="12" fill="#333">左尾—环内</text>
  <text x="345" y="372" text-anchor="middle" font-size="12.5" fill="#a04a5a">3</text>
  <path d="M 362 368 L 396 368" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="415" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="515" y="372" text-anchor="middle" font-size="11.5" fill="#666">cnt[2]+1，cnt[3]−1</text>
  <path d="M 70 382 L 570 382" stroke="#dde8f4" stroke-width="1" filter="url(#sk)"/>

  <text x="110" y="406" text-anchor="middle" font-size="12.5" fill="#333">(2, 5)</text>
  <text x="230" y="406" text-anchor="middle" font-size="12" fill="#333">环内—右尾</text>
  <text x="345" y="406" text-anchor="middle" font-size="12.5" fill="#a04a5a">3</text>
  <path d="M 362 402 L 396 402" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="415" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="515" y="406" text-anchor="middle" font-size="11.5" fill="#666">cnt[2]+1，cnt[3]−1</text>
  <path d="M 70 416 L 570 416" stroke="#dde8f4" stroke-width="1" filter="url(#sk)"/>

  <text x="110" y="436" text-anchor="middle" font-size="12.5" fill="#333">(2, 4)</text>
  <text x="230" y="436" text-anchor="middle" font-size="12" fill="#333">环内—环内</text>
  <text x="345" y="436" text-anchor="middle" font-size="12.5" fill="#a04a5a">2</text>
  <path d="M 362 432 L 396 432" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="415" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="515" y="436" text-anchor="middle" font-size="11.5" fill="#666">cnt[1]+1，cnt[2]−1</text>

  <!-- step 3: restore -->
  <g filter="url(#sk)">
    <rect x="50" y="448" width="540" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="470" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">③ 前缀和还原：cnt[k] = 基线 + 搬入 − 搬出</text>
  <text x="320" y="490" text-anchor="middle" font-size="12" fill="#2b5d85">k=1：4+1　k=2：3+2−1　k=3：2+1−2　k=4：1−1　k=5：0</text>

  <!-- step 4: x2 -->
  <g filter="url(#sk)">
    <rect x="50" y="512" width="540" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="534" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">④ cnt = [5, 4, 1, 0, 0]，× 2（有序对）⇒ res = [10, 8, 2, 0, 0] ✓</text>
  <text x="320" y="552" text-anchor="middle" font-size="11.5" fill="#2e6e2e">自检：Σ res = 20 = 5 × 4（= n(n−1)）✓</text>
</svg>
