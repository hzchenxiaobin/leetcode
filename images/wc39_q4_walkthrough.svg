<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：三个列表归并后滑动窗口</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888">0 4 5 9 10 12 15 18 20 22 24 26 30（共 13 个元素）</text>

  <rect x="40" y="60" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="54" y="80" font-size="10.5" fill="#3a4a66" font-weight="bold">right</text>
  <text x="126" y="80" font-size="10.5" fill="#3a4a66" font-weight="bold">右端点 b</text>
  <text x="210" y="80" font-size="10.5" fill="#3a4a66" font-weight="bold">收缩得到的候选区间 [a, b]（长度）</text>
  <text x="436" y="80" font-size="10.5" fill="#3a4a66" font-weight="bold">best</text>

  <g filter="url(#rough2)" font-size="10">
    <rect x="40" y="96" width="480" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="5"/>
    <text x="54" y="116" fill="#555">2</text>
    <text x="126" y="116" fill="#555">5</text>
    <text x="210" y="116" fill="#555">[0,5] (5)</text>
    <text x="436" y="116" fill="#4a7a3a">[0,5]</text>

    <rect x="40" y="134" width="480" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="5"/>
    <text x="54" y="154" fill="#555">3</text>
    <text x="126" y="154" fill="#555">9</text>
    <text x="210" y="154" fill="#555">[4,9] (5)</text>
    <text x="436" y="154" fill="#999">不变</text>

    <rect x="40" y="172" width="480" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="5"/>
    <text x="54" y="192" fill="#555">4</text>
    <text x="126" y="192" fill="#555">10</text>
    <text x="210" y="192" fill="#555">[5,10] (5)</text>
    <text x="436" y="192" fill="#999">不变</text>

    <rect x="40" y="210" width="480" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="5"/>
    <text x="54" y="230" fill="#555">7</text>
    <text x="126" y="230" fill="#555">18</text>
    <text x="210" y="230" fill="#555">[9,18] → [10,18] → [12,18] (9/8/6)</text>
    <text x="436" y="230" fill="#999">不变</text>

    <rect x="40" y="248" width="480" height="32" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="5"/>
    <text x="54" y="268" fill="#555">8</text>
    <text x="126" y="268" fill="#555">20</text>
    <text x="210" y="268" fill="#555">[15,20] (5)</text>
    <text x="436" y="268" fill="#999">不变</text>

    <rect x="40" y="286" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="54" y="306" fill="#8a3a36">10</text>
    <text x="126" y="306" fill="#8a3a36">24</text>
    <text x="210" y="306" fill="#8a3a36">[18,24] → [20,24] (6/4)</text>
    <text x="436" y="306" fill="#b85450" font-weight="bold">[20,24]</text>
  </g>

  <text x="280" y="336" text-anchor="middle" font-size="9.5" fill="#777">right = 5,6,9,11,12 时窗口覆盖不足 k = 3，不产生候选；等长时比左端点，4 &gt; 0 故不更新</text>

  <rect x="90" y="350" width="380" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">最终答案 [20, 24]，长度 4</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#555">列表0 取 24，列表1 取 20，列表2 取 22 — 三者都在区间内</text>
</svg>
