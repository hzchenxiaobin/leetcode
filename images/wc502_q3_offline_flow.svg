<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="580" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：按值从大到小离线，前缀和整轮重建</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A 开始 -->
  <g filter="url(#sk)"><rect x="100" y="58" width="220" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">非零格子按值入桶，v ← 200</text>
  <path d="M 210 94 L 210 114" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B 重建前缀和 -->
  <g filter="url(#sk)"><rect x="100" y="118" width="220" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210" y="136" text-anchor="middle" font-size="12.5" fill="#2b6e9e">重建 cnt 的二维前缀和 P</text>
  <text x="210" y="154" text-anchor="middle" font-size="10" fill="#555">（O(nm)；cnt = 1 表示该格子的值 &gt; v）</text>
  <path d="M 210 162 L 210 180" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C 查询 -->
  <g filter="url(#sk)"><rect x="100" y="184" width="220" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210" y="206" text-anchor="middle" font-size="12" fill="#2b6e9e">对每个 (i,j) ∈ pos[v]：</text>
  <text x="210" y="226" text-anchor="middle" font-size="12" fill="#2b6e9e">g ← 正方形计数(P) − 四角修正</text>
  <path d="M 210 240 L 210 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D 判定 -->
  <g filter="url(#sk)"><polygon points="210,262 345,300 210,338 75,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">g = 0 ?</text>
  <path d="M 345 300 L 398 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="370" y="292" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="402" y="278" width="196" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="500" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans++</text>
  <text x="500" y="314" text-anchor="middle" font-size="10.5" fill="#2e6e2e">（找到一个局部最大值）</text>
  <path d="M 500 322 L 500 396 L 324 396" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 338 L 210 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="360" font-size="11" fill="#b03a3a" font-weight="bold">否</text>

  <!-- E 标记 -->
  <g filter="url(#sk)"><rect x="100" y="376" width="220" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210" y="394" text-anchor="middle" font-size="11.5" fill="#2b6e9e">把 pos[v] 的格子全部 cnt ← 1</text>
  <text x="210" y="412" text-anchor="middle" font-size="10.5" fill="#555">（加入「更大值」集合；查完才标 → 等值互不威胁）</text>
  <path d="M 210 420 L 210 440" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- F 循环 -->
  <g filter="url(#sk)"><polygon points="210,444 305,476 210,508 115,476" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="481" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">v ≥ 1 ?</text>
  <path d="M 115 476 L 58 476 L 58 140 L 96 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="86" y="494" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">是：v−−，下一轮</text>
  <path d="M 210 508 L 210 528" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="524" font-size="11" fill="#b03a3a" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="130" y="532" width="160" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="210" y="554" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return ans ✓</text>

  <!-- 右侧要点 -->
  <g filter="url(#sk)"><rect x="352" y="80" width="264" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="484" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a80">不变量（离线的正确性核心）</text>
  <text x="484" y="120" text-anchor="middle" font-size="11" fill="#2b5a80">处理值 v 的查询时刻：</text>
  <text x="484" y="138" text-anchor="middle" font-size="11" fill="#2b5a80">cnt[r][c] = 1 ⟺ matrix[r][c] &gt; v</text>
  <text x="484" y="156" text-anchor="middle" font-size="10.5" fill="#2b5a80">（更大值已进场，等值 / 更小值未进场）</text>

  <g filter="url(#sk)"><rect x="352" y="188" width="264" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="484" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">为什么整轮重建？</text>
  <text x="484" y="228" text-anchor="middle" font-size="11" fill="#7a5415">逐格更新前缀和要 O(nm)，4×10⁴ 格</text>
  <text x="484" y="246" text-anchor="middle" font-size="11" fill="#7a5415">共 1.6×10⁹ → 超时；按值分轮重建</text>
  <text x="484" y="264" text-anchor="middle" font-size="11" fill="#7a5415">≤ 200 次 × O(nm) = 8×10⁶ → 稳过</text>

  <g filter="url(#sk)"><rect x="352" y="408" width="264" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="484" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">复杂度</text>
  <text x="484" y="448" text-anchor="middle" font-size="11" fill="#2e6e2e">时间 O(V·nm) ≈ 8×10⁶，空间 O(nm)</text>
  <text x="484" y="464" text-anchor="middle" font-size="10.5" fill="#2e6e2e">（只维护一张前缀表，逐轮复用）</text>

  <g filter="url(#sk)"><rect x="352" y="492" width="264" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="484" y="510" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">实现备注</text>
  <text x="484" y="528" text-anchor="middle" font-size="11" fill="#b03a3a">空桶直接跳过、不重建；也可换二维 BIT</text>
  <text x="484" y="544" text-anchor="middle" font-size="10.5" fill="#b03a3a">（更新 / 查询均 O(log²)，总量级相同）</text>
</svg>
