<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">拼接串 = a 的头 + b 的尾：两端跨界配对，中间段自由落位</text>
  <path d="M 130 34 Q 320 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="36" y="62" font-size="13.5" font-weight="bold" fill="#2b6e9e">① s = aprefix + bsuffix：第 k 对要求 s[k] = s[n−1−k]</text>

  <g filter="url(#sk)"><rect x="150" y="76" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="170" y="102" text-anchor="middle" font-size="15" fill="#2b6e9e">u</text>
  <g filter="url(#sk)"><rect x="194" y="76" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="214" y="102" text-anchor="middle" font-size="15" fill="#2b6e9e">l</text>
  <g filter="url(#sk)"><rect x="238" y="76" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="258" y="102" text-anchor="middle" font-size="15" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="282" y="76" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="302" y="102" text-anchor="middle" font-size="15" fill="#2e6e2e">a</text>
  <g filter="url(#sk)"><rect x="326" y="76" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="346" y="102" text-anchor="middle" font-size="15" fill="#2e6e2e">l</text>
  <g filter="url(#sk)"><rect x="370" y="76" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="390" y="102" text-anchor="middle" font-size="15" fill="#2e6e2e">u</text>

  <path d="M 280 70 L 280 122" stroke="#b07818" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="292" y="64" font-size="12" font-weight="bold" fill="#b07818">i</text>

  <path d="M 170 74 Q 270 36 390 74" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="270" y="47" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <path d="M 214 74 Q 270 46 346 74" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <path d="M 258 74 Q 270 56 302 74" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>

  <text x="170" y="128" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="214" y="128" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="258" y="128" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="302" y="128" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="346" y="128" text-anchor="middle" font-size="10.5" fill="#888">4</text>
  <text x="390" y="128" text-anchor="middle" font-size="10.5" fill="#888">5</text>

  <text x="204" y="146" text-anchor="middle" font-size="11" fill="#2b6e9e">← 来自 a[0:3]（头）</text>
  <text x="346" y="146" text-anchor="middle" font-size="11" fill="#2e6e2e">来自 b[3:6]（尾）→</text>

  <g filter="url(#sk)"><rect x="436" y="74" width="180" height="52" rx="8" fill="#f7f6f1" stroke="#b8b4a6" stroke-width="1.2"/></g>
  <text x="526" y="92" text-anchor="middle" font-size="11" fill="#555">跨界对：a[k] = b[n−1−k]</text>
  <text x="526" y="108" text-anchor="middle" font-size="11" fill="#555">只要跨过去，i 在哪无关</text>
  <text x="526" y="122" text-anchor="middle" font-size="10.5" fill="#999">（示例 3：i=3，ula+alu=ulaalu）</text>

  <text x="36" y="176" font-size="13.5" font-weight="bold" fill="#b07818">② 双指针停在 (l, r) 后：中间段 [l, r] 只能整段落到同一侧</text>

  <text x="171" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = r+1：中间全取 a</text>
  <g filter="url(#sk)"><rect x="50" y="210" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="64" y="229" text-anchor="middle" font-size="11" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="80" y="210" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="94" y="229" text-anchor="middle" font-size="11" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="110" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="140" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="170" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="200" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="230" y="210" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="244" y="229" text-anchor="middle" font-size="11" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="260" y="210" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="274" y="229" text-anchor="middle" font-size="11" fill="#2e6e2e">b</text>
  <path d="M 124 254 L 124 246" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="124" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a3a">l</text>
  <path d="M 214 254 L 214 246" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="214" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a3a">r</text>
  <text x="171" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">需 a[l..r] 是回文</text>

  <text x="473" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = l：中间全取 b</text>
  <g filter="url(#sk)"><rect x="348" y="210" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="362" y="229" text-anchor="middle" font-size="11" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="378" y="210" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="392" y="229" text-anchor="middle" font-size="11" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="408" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="438" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="468" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="498" y="210" width="28" height="28" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="528" y="210" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="542" y="229" text-anchor="middle" font-size="11" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="558" y="210" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="572" y="229" text-anchor="middle" font-size="11" fill="#2e6e2e">b</text>
  <path d="M 422 254 L 422 246" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="422" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a3a">l</text>
  <path d="M 512 254 L 512 246" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="512" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a3a">r</text>
  <text x="473" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">需 b[l..r] 是回文</text>

  <g filter="url(#sk)"><rect x="52" y="308" width="536" height="104" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">失配 a[l] ≠ b[r] 把 i 锁死在两端：i = l 或 i = r+1</text>
  <text x="320" y="354" text-anchor="middle" font-size="12" fill="#2e6e2e">两段中间 [l..r] 任一回文 ⇒ check(x, y) = true；都败 ⇒ false</text>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#555">收缩 O(n) + 两段检测 O(n) ⇒ 单方向 O(n)，两个方向仍 O(n)</text>
  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#888">（自然汇合 l ≥ r 时中间段空或单字符，必回文，直接成功）</text>
</svg>
