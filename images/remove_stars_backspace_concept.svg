<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：* 是退格键，「左侧最近的未删字母」就是栈顶</text>

  <!-- ===== ① backspace analogy ===== -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">① 打字视角：* 随到随消，存活候选只有字母</text>

  <g filter="url(#rough2)">
    <rect x="70" y="70" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="90" y="97" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">l</text>
    <rect x="116" y="70" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="136" y="97" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">e</text>
    <rect x="162" y="70" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="182" y="97" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">e</text>
    <rect x="208" y="70" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="228" y="97" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">t</text>
    <rect x="254" y="70" width="40" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="274" y="97" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">⌫</text>
    <rect x="300" y="70" width="40" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="320" y="97" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">⌫</text>
  </g>
  <path d="M 348 91 Q 366 91 384 91" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <g filter="url(#rough2)">
    <rect x="390" y="70" width="86" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="433" y="97" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">lee</text>
  </g>
  <text x="40" y="136" font-size="11.5" fill="#666">敲入 l、e、e、t，再按两次退格："leet" → "lee"。星号从不留到最后，也永远不会被别的星号选中。</text>

  <line x1="40" y1="154" x2="520" y2="154" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== ② stack top = nearest ===== -->
  <text x="40" y="180" font-size="12" fill="#d6a040" font-weight="bold">② LIFO 恰好刻画「最近」：栈顶 = 最近入栈、尚未弹出的字母</text>

  <g filter="url(#rough2)">
    <text x="130" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">← 栈顶</text>
    <rect x="100" y="206" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="5"/>
    <text x="130" y="230" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">t</text>
    <rect x="100" y="246" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="130" y="270" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">e</text>
    <rect x="100" y="286" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="130" y="310" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">e</text>
    <rect x="100" y="326" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <text x="130" y="350" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">l</text>
    <text x="130" y="378" text-anchor="middle" font-size="11" fill="#446688">栈底</text>
  </g>

  <g filter="url(#rough2)">
    <ellipse cx="260" cy="216" rx="20" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="260" y="223" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">*</text>
    <text x="292" y="206" font-size="11.5" fill="#666">我要删掉左侧最近的</text>
    <text x="292" y="224" font-size="11.5" fill="#666">那个未删除字母——</text>
    <text x="292" y="242" font-size="11.5" fill="#b85450" font-weight="bold">就是你，栈顶！</text>
  </g>
  <path d="M 240 224 Q 200 224 164 224" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <g filter="url(#rough2)">
    <rect x="292" y="286" width="240" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="412" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">遇字母 → push(c)（可能幸存）</text>
    <text x="412" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">遇 * → pop()（当场消费）</text>
    <text x="412" y="352" text-anchor="middle" font-size="11" fill="#888">星号从不入栈 → 栈里全是字母</text>
  </g>

  <!-- ===== ③ conclusion ===== -->
  <g filter="url(#rough2)">
    <rect x="46" y="396" width="470" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="281" y="415" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">一遍扫描：字母 push、星号 pop，扫完拼接栈（底 → 顶）即答案</text>
    <text x="281" y="432" text-anchor="middle" font-size="10.5" fill="#666">"leet**cod*e" → 栈 l e c o e → "lecoe"</text>
  </g>
</svg>
