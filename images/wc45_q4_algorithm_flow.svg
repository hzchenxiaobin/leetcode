<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：除 9 取余，把余数按十进制权位拼回答案</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环轮数 = n 的九进制位数 ≤ 10，每轮 O(1)</text>

  <rect x="90" y="58" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">输入 n，ans = 0，place = 1</text>

  <polygon points="200,100 288,132 200,164 112,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="137" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">n &gt; 0 ?</text>

  <rect x="330" y="104" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="124" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">d = n % 9</text>
  <text x="435" y="142" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">ans += d × place</text>

  <rect x="330" y="186" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="206" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">n = n // 9</text>
  <text x="435" y="224" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">place = place × 10</text>

  <rect x="100" y="308" width="170" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="328" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 ans</text>
  <text x="185" y="345" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">即序列第 n 个数</text>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 200 90 L 200 98"/>
    <path d="M 288 132 L 326 132"/>
    <path d="M 435 154 L 435 184"/>
    <path d="M 435 236 L 435 272 L 200 272 L 200 168"/>
    <path d="M 112 132 L 60 132 L 60 331 L 96 331"/>
  </g>

  <text x="306" y="124" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="286" y="264" font-size="9.5" fill="#888" filter="url(#rough2)">继续下一轮</text>
  <text x="78" y="122" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="364" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="382" font-size="10" fill="#555" filter="url(#rough2)">place 依次为 1, 10, 100, …；每轮取出的 d 是九进制最低位，对应十进制的个位，</text>
  <text x="76" y="400" font-size="10" fill="#555" filter="url(#rough2)">因此只要「低位在前」地累加，最后自然右对齐，无需额外反转字符串。</text>
</svg>
