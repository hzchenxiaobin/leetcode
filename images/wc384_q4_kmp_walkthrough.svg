<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 2 演算：cmp = [1,0,−1,1,1,0,−1]，pattern = [1,0,−1]，π = [0,0,0]</text>

  <!-- 匹配行底色 -->
  <rect x="36" y="128" width="488" height="26" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>
  <rect x="36" y="232" width="488" height="26" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="36" y="48" width="488" height="28" fill="#f0f0f0" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="103" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">cmp[i]</text>
  <text x="268" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="435" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">处理后 j</text>
  <text x="495" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 表格线 -->
  <line x1="76" y1="48" x2="76" y2="258" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="130" y1="48" x2="130" y2="258" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="406" y1="48" x2="406" y2="258" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="465" y1="48" x2="465" y2="258" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <rect x="36" y="48" width="488" height="210" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="36" y1="76" x2="524" y2="76" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="102" x2="524" y2="102" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="128" x2="524" y2="128" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="154" x2="524" y2="154" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="180" x2="524" y2="180" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="206" x2="524" y2="206" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="232" x2="524" y2="232" stroke="#666" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行内容 -->
  <text x="56" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="103" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="94" font-size="11.5" fill="#333" filter="url(#rough2)">命中 P[0]=1 → j++</text>
  <text x="435" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="495" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="56" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="103" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="138" y="120" font-size="11.5" fill="#333" filter="url(#rough2)">命中 P[1]=0 → j++</text>
  <text x="435" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="495" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="56" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="103" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="138" y="146" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">命中 P[2]=−1 → j=3=m：ans++，j 回跳 π[2]=0</text>
  <text x="435" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="495" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="56" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="103" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="172" font-size="11.5" fill="#333" filter="url(#rough2)">命中 P[0]=1 → j++</text>
  <text x="435" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="495" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="56" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="103" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="198" font-size="11.5" fill="#b85450" filter="url(#rough2)">失配（≠P[1]=0）→ j=π[0]=0；再命中 P[0] → j++</text>
  <text x="435" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="495" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="56" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="103" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="138" y="224" font-size="11.5" fill="#333" filter="url(#rough2)">命中 P[1]=0 → j++</text>
  <text x="435" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="495" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="56" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="103" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="138" y="250" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">命中 P[2]=−1 → j=3=m：ans++，j 回跳 π[2]=0</text>
  <text x="435" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="495" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans = 2 ✓，对应子数组 [1,4,4,1] 与 [3,5,5,3]，全程 i 只前进不回退</text>

  <!-- 重叠陷阱 -->
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">重叠陷阱：cmp = [1,1,1,1]，pattern = [1,1]，π = [0,1]</text>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">—— 完整匹配后 j 应回跳到 π[m−1]=1（而不是重置 0）</text>

  <rect x="30" y="342" width="245" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="364" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ j = π[m−1] = 1</text>
  <text x="48" y="386" font-size="11" fill="#333" filter="url(#rough2)">i=0: 命中 P[0] → j=1</text>
  <text x="48" y="406" font-size="11" fill="#333" filter="url(#rough2)">i=1: j=2=m → ans=1，j=1</text>
  <text x="48" y="426" font-size="11" fill="#333" filter="url(#rough2)">i=2: 命中 P[1] → j=2=m → ans=2，j=1</text>
  <text x="48" y="446" font-size="11" fill="#333" filter="url(#rough2)">i=3: 命中 P[1] → j=2=m → ans=3</text>
  <text x="152" y="460" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3 = n − m ✓</text>

  <rect x="285" y="342" width="245" height="122" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="407" y="364" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ j = 0（错误重置）</text>
  <text x="303" y="386" font-size="11" fill="#333" filter="url(#rough2)">i=0: 命中 P[0] → j=1</text>
  <text x="303" y="406" font-size="11" fill="#333" filter="url(#rough2)">i=1: j=2=m → ans=1，j=0</text>
  <text x="303" y="426" font-size="11" fill="#333" filter="url(#rough2)">i=2: 从头再比 → j=1（丢掉重叠信息）</text>
  <text x="303" y="446" font-size="11" fill="#333" filter="url(#rough2)">i=3: j=2=m → ans=2</text>
  <text x="407" y="460" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 2 ✗ 漏掉起点 1 的窗口</text>

  <text x="280" y="486" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">可重叠出现：总窗口数 = (n−1) − m + 1 = n − m；π[m−1] 恰是重叠续接长度</text>
</svg>
