<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个示例的构造与分数</text>
  <rect x="24" y="60" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="202" y="60" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="267" y="82" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">q / r</text>
  <rect x="340" y="60" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">拼接</text>
  <rect x="468" y="60" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="503" y="82" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">输出</text>
  <rect x="546" y="60" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="82" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">分数</text>
  <rect x="24" y="100" width="170" height="48" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">num=2, sum=3</text>
  <rect x="202" y="100" width="130" height="48" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="267" y="129" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q=0, r=3</text>
  <rect x="340" y="100" width="120" height="48" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="129" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"3" + "0"</text>
  <rect x="468" y="100" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="503" y="129" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">30</text>
  <rect x="546" y="100" width="60" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="129" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">9</text>
  <rect x="24" y="154" width="170" height="48" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">num=2, sum=17</text>
  <rect x="202" y="154" width="130" height="48" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="267" y="183" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">q=1, r=8</text>
  <rect x="340" y="154" width="120" height="48" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="183" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">"9" + "8"</text>
  <rect x="468" y="154" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="503" y="183" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">98</text>
  <rect x="546" y="154" width="60" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="183" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">145</text>
  <rect x="24" y="208" width="170" height="48" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="109" y="237" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">num=1, sum=10</text>
  <rect x="202" y="208" width="130" height="48" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="267" y="237" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">10 &gt; 9</text>
  <rect x="340" y="208" width="120" height="48" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="237" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">不可行</text>
  <rect x="468" y="208" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="503" y="237" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">""</text>
  <rect x="546" y="208" width="60" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="237" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">—</text>
  <rect x="24" y="270" width="582" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="294" text-anchor="start" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">为什么不是「平均分」：平方是凸函数，越集中越大（9 的平方远大于 4+5 的平方和）</text>
  <text x="42" y="314" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">并列取最大：结构唯一，按降序写出来（9 在前、r 次之、0 最后）就是最大的数</text>
</svg>
