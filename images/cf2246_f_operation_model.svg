<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">操作 i：p_i 飞到队首，p_i+1 飞到队尾，其余元素相对顺序不变</text>

  <!-- before row -->
  <text x="40" y="70" font-size="13" fill="#446688" filter="url(#rough2)">操作前</text>
  <g>
    <rect x="40" y="82" width="48" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="64" y="112" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
    <rect x="94" y="82" width="48" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="118" y="112" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>
    <rect x="148" y="82" width="48" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="172" y="112" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>
    <rect x="202" y="82" width="48" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="226" y="112" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
    <rect x="256" y="82" width="48" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="112" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  </g>
  <text x="64" y="146" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位置 1</text>
  <text x="118" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i</text>
  <text x="172" y="146" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">i+1</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位置 n</text>

  <path d="M145,74 L145,142" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="145" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">切口 i=2</text>

  <!-- arrows -->
  <path d="M112,136 C92,182 70,206 64,240" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M178,136 C222,182 264,206 278,240" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M58,136 C66,180 84,210 108,238" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- after row -->
  <text x="40" y="238" font-size="13" fill="#446688" filter="url(#rough2)">操作后</text>
  <g>
    <rect x="40" y="250" width="48" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="64" y="280" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>
    <rect x="94" y="250" width="48" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="118" y="280" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
    <rect x="148" y="250" width="48" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="172" y="280" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
    <rect x="202" y="250" width="48" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="226" y="280" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
    <rect x="256" y="250" width="48" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="280" y="280" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>
  </g>

  <!-- notes on the right -->
  <rect x="360" y="66" width="390" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="92" font-size="13" fill="#333" filter="url(#rough2)">p' = [p_i, p_1 … p_i-1, p_i+2 … p_n, p_i+1]</text>
  <text x="376" y="114" font-size="12" fill="#446688" filter="url(#rough2)">等价说法：相邻对 (p_i, p_i+1) 被拆开放到两端</text>

  <rect x="360" y="146" width="390" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="172" font-size="13" fill="#333" filter="url(#rough2)">前缀 [1 … i] 右循环 1 位</text>
  <text x="376" y="194" font-size="13" fill="#333" filter="url(#rough2)">后缀 [i+1 … n] 左循环 1 位</text>
  <text x="376" y="218" font-size="12" fill="#4a7a3a" filter="url(#rough2)">两个循环移位互补：外圈元素几乎不动</text>

  <rect x="360" y="250" width="390" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="276" font-size="13" fill="#333" filter="url(#rough2)">对换数 = (i-1) + (n-i-1) = n-2</text>
  <text x="376" y="298" font-size="12" fill="#b85450" filter="url(#rough2)">所以 n 为偶数时排列奇偶性不变</text>

  <rect x="360" y="330" width="390" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="354" font-size="13" fill="#333" filter="url(#rough2)">逆操作：取出首尾两元素，成对插回中间</text>
  <text x="376" y="374" font-size="12" fill="#d6a040" filter="url(#rough2)">从排好的数组出发更容易想象</text>

  <text x="64" y="404" font-size="13" fill="#555" filter="url(#rough2)">示例 n=5, i=2：[1,5,4,3,2] 变成 [5,1,3,2,4]</text>
</svg>
