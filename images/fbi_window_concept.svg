<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">i 是美丽下标 ⟺ 窗口 [i−k, i+k] 覆盖某个 j</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel 1: i=16, window [1,31] covers both j -->
  <text x="70" y="72" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">① i = 16，k = 15 → 窗口 [1, 31]</text>
  <rect x="71" y="92" width="324" height="42" rx="6" fill="#fff8e1" fill-opacity="0.8" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="76" y="88" font-size="10" fill="#a07820" filter="url(#sk)">i−k=1</text>
  <text x="386" y="88" font-size="10" fill="#a07820" filter="url(#sk)">i+k=31</text>
  <path d="M 60 133 Q 330 137 600 131" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="9.5" fill="#9a9a9a" text-anchor="middle">
    <text x="60" y="148">0</text><text x="168" y="148">10</text><text x="276" y="148">20</text><text x="384" y="148">30</text><text x="492" y="148">40</text><text x="600" y="148">50</text>
  </g>
  <path d="M 60 133 l 0 5 M 168 133 l 0 5 M 276 133 l 0 5 M 384 133 l 0 5 M 492 133 l 0 5 M 600 133 l 0 5" stroke="#9a9a9a" stroke-width="1" filter="url(#sk)"/>
  <circle cx="103" cy="133" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="103" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">j=4</text>
  <circle cx="254" cy="133" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="254" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">j=18</text>
  <path d="M 233 94 L 233 74" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <path d="M 233 74 l 12 5 l -12 5 z" fill="#446688" filter="url(#sk)"/>
  <text x="243" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">i=16</text>
  <text x="404" y="117" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">j=4、j=18 都在窗口内</text>
  <text x="404" y="133" font-size="11" fill="#4a7a3a" filter="url(#sk)">→ 16 是美丽下标 ✓</text>

  <!-- Panel 2: i=33, window [18,48], boundary hit -->
  <text x="70" y="182" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">② i = 33，k = 15 → 窗口 [18, 48]</text>
  <rect x="254" y="202" width="326" height="42" rx="6" fill="#fff8e1" fill-opacity="0.8" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="198" text-anchor="end" font-size="10" fill="#a07820" filter="url(#sk)">i−k=18</text>
  <text x="552" y="198" font-size="10" fill="#a07820" filter="url(#sk)">i+k=48</text>
  <path d="M 60 243 Q 330 247 600 241" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="9.5" fill="#9a9a9a" text-anchor="middle">
    <text x="60" y="258">0</text><text x="168" y="258">10</text><text x="276" y="258">20</text><text x="384" y="258">30</text><text x="492" y="258">40</text><text x="600" y="258">50</text>
  </g>
  <path d="M 60 243 l 0 5 M 168 243 l 0 5 M 276 243 l 0 5 M 384 243 l 0 5 M 492 243 l 0 5 M 600 243 l 0 5" stroke="#9a9a9a" stroke-width="1" filter="url(#sk)"/>
  <circle cx="103" cy="243" r="6.5" fill="#f5f5f5" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="103" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">j=4 ✗太左</text>
  <circle cx="254" cy="243" r="7" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="254" y="276" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">j=18 恰在左边界</text>
  <path d="M 416 204 L 416 184" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <path d="M 416 184 l 12 5 l -12 5 z" fill="#446688" filter="url(#sk)"/>
  <text x="426" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">i=33</text>
  <text x="404" y="227" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">|33−18| = 15 = k（闭区间边界命中）</text>
  <text x="404" y="243" font-size="11" fill="#4a7a3a" filter="url(#sk)">→ 33 是美丽下标 ✓</text>

  <!-- Panel 3: i=16, k=1, narrow window misses both -->
  <text x="70" y="296" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">③ 换 k = 1：i = 16 → 窗口 [15, 17]</text>
  <rect x="222" y="314" width="22" height="42" rx="4" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="196" y="310" text-anchor="end" font-size="10" fill="#b85450" filter="url(#sk)">i−k=15</text>
  <text x="250" y="310" font-size="10" fill="#b85450" filter="url(#sk)">i+k=17</text>
  <path d="M 60 355 Q 330 359 600 353" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="9.5" fill="#9a9a9a" text-anchor="middle">
    <text x="60" y="370">0</text><text x="168" y="370">10</text><text x="276" y="370">20</text><text x="384" y="370">30</text><text x="492" y="370">40</text><text x="600" y="370">50</text>
  </g>
  <path d="M 60 355 l 0 5 M 168 355 l 0 5 M 276 355 l 0 5 M 384 355 l 0 5 M 492 355 l 0 5 M 600 355 l 0 5" stroke="#9a9a9a" stroke-width="1" filter="url(#sk)"/>
  <circle cx="103" cy="355" r="6.5" fill="#f5f5f5" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="103" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">j=4 ✗太左</text>
  <circle cx="254" cy="355" r="6.5" fill="#f5f5f5" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="254" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">j=18 ✗太右</text>
  <path d="M 233 316 L 233 296" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <path d="M 233 296 l 12 5 l -12 5 z" fill="#446688" filter="url(#sk)"/>
  <text x="243" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">i=16</text>
  <text x="404" y="339" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">第一个 ≥ i−k 的候选 B[p]=18</text>
  <text x="404" y="355" font-size="11" fill="#b85450" filter="url(#sk)">> i+k=17 ⇒ 一次比较否定</text>
  <text x="404" y="371" font-size="11" fill="#b85450" filter="url(#sk)">→ 不美丽 ✗</text>

  <!-- Takeaway -->
  <rect x="95" y="400" width="450" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="418" text-anchor="middle" font-size="11.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">B 升序 ⇒ 只查第一个 ≥ i−k 的候选 B[p]</text>
  <text x="320" y="435" text-anchor="middle" font-size="11" fill="#2f5a25" filter="url(#sk)">B[p] ≤ i+k ⇔ 窗口非空 ⇔ i 美丽</text>
</svg>
