<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="392" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：alex / aaleex（true）与 saeed / ssaaedd（false）</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">name = "alex"，typed = "aaleex"</text>
  <rect x="60" y="74" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="91.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j</text>
  <rect x="110" y="74" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="91.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">typed[j]</text>
  <rect x="220" y="74" width="250" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="91.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">走哪条规则</text>
  <rect x="470" y="74" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="91.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="60" y="104" width="50" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="122.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="110" y="104" width="110" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="122.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="220" y="104" width="250" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="122.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">name[0] == typed[0]</text>
  <rect x="470" y="104" width="90" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="122.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="60" y="134" width="50" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="152.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="134" width="110" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="152.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="220" y="134" width="250" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="152.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">typed[1] == typed[0]（长按）</text>
  <rect x="470" y="134" width="90" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="152.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="60" y="164" width="50" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="182.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="164" width="110" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="182.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <rect x="220" y="164" width="250" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="182.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">name[1] == typed[2]</text>
  <rect x="470" y="164" width="90" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="182.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="60" y="194" width="50" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="194" width="110" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <rect x="220" y="194" width="250" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">name[2] == typed[3]</text>
  <rect x="470" y="194" width="90" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="60" y="224" width="50" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="242.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="110" y="224" width="110" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="242.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <rect x="220" y="224" width="250" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="242.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">typed[4] == typed[3]（长按）</text>
  <rect x="470" y="224" width="90" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="242.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="60" y="254" width="50" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="272.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="110" y="254" width="110" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="272.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x</text>
  <rect x="220" y="254" width="250" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="272.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">name[3] == typed[5]</text>
  <rect x="470" y="254" width="90" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="272.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 = n → true</text>
  <text x="60" y="320" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">反例 saeed / ssaaedd：typed 只有 2 个 e，而 name 需要 2 个 e，</text>
  <text x="60" y="342" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">多出的 d 之后又出现 e 的错位 → 第 4 个字符起判 false</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">逐字符走一遍即可确认：合法当且仅当 typed 能按「对位或长按」被完全解释</text>
</svg>
