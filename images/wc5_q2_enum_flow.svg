<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：外层枚举小时，内层只找需要的位数</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">12 × 60 = 720 次检查，纯常数时间；need 不在 [0,5] 时整行剪枝</text>

  <rect x="170" y="60" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">输入 turnedOn = k</text>

  <path d="M 280 94 L 280 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,108 382,140 280,172 178,140" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">k &gt; 8 ?</text>

  <path d="M 382 140 L 408 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="132" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">是</text>
  <rect x="410" y="122" width="132" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="145" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回空列表 []</text>

  <text x="290" y="188" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 280 172 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="196" width="280" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">h 从 0 到 11 逐个枚举</text>

  <path d="M 280 232 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="248" width="280" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">need = k − popcount(h)</text>

  <path d="M 280 284 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,302 400,336 280,370 160,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">0 ≤ need ≤ 5 ?</text>

  <path d="M 400 336 L 424 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="328" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">否</text>
  <rect x="426" y="318" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="341" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">跳过该小时</text>

  <text x="290" y="386" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 280 370 L 280 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="394" width="428" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="414" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">m 从 0 到 59：popcount(m) == need 时收集</text>
  <text x="80" y="432" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">格式化为 "h:mm"（小时不补零，分钟补两位）</text>

  <path d="M 280 442 L 280 456" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="458" width="340" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="480" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">输出列表（h 升序、m 升序，天然无重复）</text>
</svg>
