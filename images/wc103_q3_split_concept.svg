<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="336" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">排序后总存在分界点：左边 +k，右边 −k</text>
  <rect x="150" y="108" width="76" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="108" width="76" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="334" y="108" width="76" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="426" y="108" width="76" height="50" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464.0" y="138.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <rect x="150" y="58" width="76" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188.0" y="79.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+k</text>
  <rect x="242" y="58" width="76" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280.0" y="79.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+k</text>
  <rect x="334" y="174" width="76" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372.0" y="195.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−k</text>
  <rect x="426" y="174" width="76" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464.0" y="195.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−k</text>
  <path d="M 330,48 L 330,204" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="330" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">分界 t</text>
  <rect x="96" y="246" width="470" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="331.0" y="273.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">分数 = max(a[t−1]+k, a[n−1]−k) − min(a[0]+k, a[t]−k)</text>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">枚举 t 取最小；t=0 或 t=n（全 −k / 全 +k）就是原数组的极差</text>
</svg>
