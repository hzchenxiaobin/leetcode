<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例走查：colors = [0,1,0,0,1]，答案 3</text>

  <!-- i = 0 -->
  <text x="140" y="86" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">i = 0</text>
  <rect x="150" y="66" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="66" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="250" y="66" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="88" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="222" y="88" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="272" y="88" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="316" y="88" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 交替</text>
  <text x="400" y="88" font-size="10" fill="#999" filter="url(#rough2)">下标 4,0,1</text>

  <!-- i = 1 -->
  <text x="140" y="138" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">i = 1</text>
  <rect x="150" y="118" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="118" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="250" y="118" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="140" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="222" y="140" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="272" y="140" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="316" y="140" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 交替</text>
  <text x="400" y="140" font-size="10" fill="#999" filter="url(#rough2)">下标 0,1,2</text>

  <!-- i = 2 -->
  <text x="140" y="190" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">i = 2</text>
  <rect x="150" y="170" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="170" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="250" y="170" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="192" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="222" y="192" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="272" y="192" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="316" y="192" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 右边也是 0</text>
  <text x="400" y="192" font-size="10" fill="#999" filter="url(#rough2)">下标 1,2,3</text>

  <!-- i = 3 -->
  <text x="140" y="242" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">i = 3</text>
  <rect x="150" y="222" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="222" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="250" y="222" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="244" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="222" y="244" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="272" y="244" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="316" y="244" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 左边也是 0</text>
  <text x="400" y="244" font-size="10" fill="#999" filter="url(#rough2)">下标 2,3,4</text>

  <!-- i = 4 -->
  <text x="140" y="294" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">i = 4</text>
  <rect x="150" y="274" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="274" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="250" y="274" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="296" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="222" y="296" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="272" y="296" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="316" y="296" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 交替</text>
  <text x="400" y="296" font-size="10" fill="#999" filter="url(#rough2)">下标 3,4,0</text>

  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三组命中 ⇒ 返回 3（粗框 = 作为「中间」的那块瓷砖）</text>
</svg>
