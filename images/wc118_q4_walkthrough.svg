<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：两种写法，同一个 52/99</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">循环节起点不同（l_n = 0 与 1），精确分数把它们拉回同一个值</text>
  <rect x="30" y="66" width="238" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="87" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">s = "0.(52)"</text><text x="40" y="102.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">I = 0，N 为空，l_n = 0</text><text x="40" y="118.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">R = 52，l_r = 2</text><text x="40" y="134.85" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">num = 0·99 + 52 = 52</text><text x="40" y="150.79999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">den = 1·99 = 99</text>
  <rect x="292" y="66" width="238" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="302" y="87" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">t = "0.5(25)"</text><text x="302" y="102.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">I = 0，N = 5，l_n = 1</text><text x="302" y="118.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">R = 25，l_r = 2</text><text x="302" y="134.85" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">num = (0·10 + 5)·99 + 25 = 520</text><text x="302" y="150.79999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">den = 10·99 = 990</text>
  <path d="M 272 126 L 288 126" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="202" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="223.5" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">交叉相乘：52 × 990 = 51480，520 × 99 = 51480</text><text x="40" y="240.175" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">两者都约分为 52/99 → 返回 true</text><text x="40" y="256.85" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">注意 l_n 不同（0 与 1），展开后却是同一个无限小数</text>
  <rect x="30" y="288" width="500" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="309" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">若用 double：0.5252525252… 与 0.5252525252… 看似相等，但 0.9(9) 与 1. 必然失败</text>
</svg>
