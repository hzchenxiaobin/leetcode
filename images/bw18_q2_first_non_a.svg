<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">贪心：把前半部分第一个非 'a' 改成 'a'</text>
  <rect x="106" y="62" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131.0" y="87.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="131.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <rect x="160" y="62" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185.0" y="87.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="185.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <rect x="214" y="62" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239.0" y="87.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="239.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <rect x="268" y="62" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293.0" y="87.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="293.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <rect x="322" y="62" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347.0" y="87.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="347.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <rect x="376" y="62" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="401.0" y="87.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="401.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <line x1="106" y1="138" x2="214" y2="138" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="322" y1="138" x2="430" y2="138" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">只能在前半段（下标 0..n/2−1）改动</text>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">把下标 1 的 b 改成 a 得到 "aaccba"（字典序最小的非回文）</text>
  <rect x="60" y="232" width="400" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="250" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">贪心正确性直觉</text>
  <text x="72" y="266" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">为什么改第一个非 'a'？越靠前的位越「值钱」，</text>
  <text x="72" y="281" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">把它压到最小的 'a' 比改动后面任何位置都更优。</text>
  <text x="72" y="296" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">改完必然非回文：该位与镜像位不同（原串是回文，</text>
  <text x="72" y="311" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">镜像位仍是原字符，而新字符 'a' 更小）。</text>
</svg>
