<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">时间轴：奇数秒移动、偶数秒等待</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">第 1 秒先进入 (0,0)，此后「移动—等待—移动—等待」交替</text>
  <path d="M 60 120 L 580 120" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 90 112 L 90 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="90" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">1</text>
  <path d="M 170 112 L 170 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">2</text>
  <path d="M 250 112 L 250 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="250" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">3</text>
  <path d="M 330 112 L 330 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">4</text>
  <path d="M 410 112 L 410 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="410" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">5</text>
  <path d="M 490 112 L 490 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="490" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">6</text>
  <path d="M 560 112 L 560 128" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="560" y="148" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="48" y="60" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90.0" y="73.0" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">进入 (0,0)</text>
  <text x="90.0" y="89.0" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">付 1×1 = 1</text>
  <rect x="152" y="60" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="190.0" y="73.0" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">移动</text>
  <text x="190.0" y="89.0" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">付入场费</text>
  <rect x="232" y="60" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="73.0" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">等待</text>
  <text x="270.0" y="89.0" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">付 waitCost</text>
  <rect x="312" y="60" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="350.0" y="73.0" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">移动</text>
  <text x="350.0" y="89.0" font-size="9.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">付入场费</text>
  <rect x="392" y="60" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="430.0" y="73.0" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">等待</text>
  <text x="430.0" y="89.0" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">付 waitCost</text>
  <rect x="472" y="60" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="510.0" y="73.0" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">移动</text>
  <text x="510.0" y="89.0" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">到达终点</text>
  <rect x="40" y="186" width="540" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="210.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">关键推论：等待只发生在「既不是起点、也不是终点」的路径格子上</text>
  <text x="310.0" y="230.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">起点不用等（第 1 秒直接走），终点不用等（到了就结束）</text>
  <rect x="40" y="262" width="540" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="286.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">于是路径总代价 = Σ 所有经过格的入场费 (i+1)(j+1) + Σ 途经格（除起点终点）的 waitCost</text>
  <text x="310.0" y="306.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">移动次数固定为 (m-1)+(n-1)，与具体路径无关</text>
  <text x="40" y="356" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">入场费只与格子坐标有关，可以放进 DP 的转移里</text>
</svg>
