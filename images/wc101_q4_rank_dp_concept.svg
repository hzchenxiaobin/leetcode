<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：只关心「上一位在已用数字中的相对排名」</text>
  <rect x="50" y="58" width="600" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="93.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="350.0" dy="0">构造排列时，已排好 i+1 个数，记最后一位的排名 j（0 ≤ j ≤ i，只计相对大小）</tspan><tspan x="350.0" dy="16">新加入一个数成为新的末位，其排名 j' 决定与前一位的大小关系</tspan></text>
  <rect x="50" y="158" width="290" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195.0" y="194.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="195.0" dy="0">s[i] = 'I'（递增）</tspan><tspan x="195.0" dy="16">旧末位排名 &lt; j'</tspan><tspan x="195.0" dy="16">⇒ dp'[j'] = Σ dp[k]，k &lt; j'</tspan></text>
  <rect x="360" y="158" width="290" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505.0" y="194.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="505.0" dy="0">s[i] = 'D'（递减）</tspan><tspan x="505.0" dy="16">旧末位排名 ≥ j'</tspan><tspan x="505.0" dy="16">⇒ dp'[j'] = Σ dp[k]，k ≥ j'</tspan></text>
  <rect x="50" y="282" width="600" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="319.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">两式都是「前缀和」形式 ⇒ 每层转移 O(n)，总 O(n^2)</text>
  <text x="350" y="380" text-anchor="middle" font-size="13" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">答案 = Σ_j dp[j]（最后一层所有排名都合法）</text>
</svg>
