<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：[1,3,4,2,6,8] 的逐步配对</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="56" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="56" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="270" y="56" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="56" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="105" y="77">扫描值 v</text>
    <text x="215" y="77">动作</text>
    <text x="330" y="77">original</text>
    <text x="455" y="77">cnt 消耗</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="94" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="160" y="94" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="270" y="94" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="94" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>

    <rect x="50" y="132" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="160" y="132" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="270" y="132" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="132" width="130" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>

    <rect x="50" y="170" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="160" y="170" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="270" y="170" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="170" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>

    <rect x="50" y="208" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="160" y="208" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="270" y="208" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="208" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>

    <rect x="50" y="246" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="160" y="246" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="270" y="246" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="246" width="130" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="105" y="115">1</text><text x="215" y="115">原数，消耗 2</text>
    <text x="330" y="115">[1]</text><text x="455" y="115">cnt[2]: 1→0</text>
    <text x="105" y="153">2</text><text x="215" y="153">跳过（已清零）</text>
    <text x="330" y="153">[1]</text><text x="455" y="153">—</text>
    <text x="105" y="191">3</text><text x="215" y="191">原数，消耗 6</text>
    <text x="330" y="191">[1,3]</text><text x="455" y="191">cnt[6]: 1→0</text>
    <text x="105" y="229">4</text><text x="215" y="229">原数，消耗 8</text>
    <text x="330" y="229">[1,3,4]</text><text x="455" y="229">cnt[8]: 1→0</text>
    <text x="105" y="267">6, 8</text><text x="215" y="267">跳过（已清零）</text>
    <text x="330" y="267">[1,3,4]</text><text x="455" y="267">—</text>
  </g>

  <!-- 结论 -->
  <rect x="50" y="300" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="170" y="322" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">所有桶清零 ✓</text>
  <text x="170" y="342" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回 [1,3,4]</text>

  <rect x="310" y="300" width="210" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="322" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">反例 [6,3,0,1]：</text>
  <text x="415" y="342" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">cnt[0]=1 奇数 ⇒ []</text>
</svg>
