<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：求 gcd → 枚举到 √g 成对计数</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: gcd -->
  <g filter="url(#sk)">
    <rect x="245" y="62" width="190" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="88" text-anchor="middle" font-size="13" fill="#3a5a2e" filter="url(#sk)">g = gcd(a, b)</text>
  <g filter="url(#sk)">
    <line x1="340" y1="102" x2="340" y2="122" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="245" y="124" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="147" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">ans = 0,  i = 1</text>
  <g filter="url(#sk)">
    <line x1="340" y1="160" x2="340" y2="180" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- decision 1: i*i <= g ? -->
  <g filter="url(#sk)">
    <polygon points="340,182 460,222 340,262 220,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="218" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">i × i ≤ g ?</text>
  <text x="340" y="238" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">(写 i &lt;= g / i 更稳)</text>

  <!-- no -> return -->
  <g filter="url(#sk)">
    <line x1="460" y1="222" x2="580" y2="222" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <text x="520" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="530" y="244" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="585" y="268" text-anchor="middle" font-size="13" fill="#3a5a2e" filter="url(#sk)">return ans</text>
  <g filter="url(#sk)">
    <line x1="585" y1="244" x2="585" y2="228" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- yes -> decision 2 -->
  <g filter="url(#sk)">
    <line x1="340" y1="262" x2="340" y2="286" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="356" y="280" font-size="12" fill="#5a5a5a" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <polygon points="340,288 450,326 340,364 230,326" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="332" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">g % i == 0 ?</text>

  <!-- no -> loop back to i+1 -->
  <g filter="url(#sk)">
    <line x1="230" y1="326" x2="130" y2="326" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
  </g>
  <text x="180" y="316" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="60" y="306" width="70" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="95" y="330" text-anchor="middle" font-size="13" fill="#b03a3a" filter="url(#sk)">i++</text>

  <!-- yes -> count -->
  <g filter="url(#sk)">
    <line x1="340" y1="364" x2="340" y2="384" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="356" y="380" font-size="12" fill="#5a5a5a" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="230" y="386" width="220" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="410" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">i×i == g ? ans += 1 : ans += 2</text>
</svg>
