<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="370" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：target = 0 时的 4 个答案</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">矩阵里的 4 个 0 各自构成 1×1 子矩阵，其他矩形和都不为 0</text>
  <rect x="120" y="66" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="90.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="172" y="66" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="90.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="224" y="66" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="248" y="90.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="120" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="134.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="172" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="134.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="224" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="248" y="134.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="120" y="154" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="178.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="172" y="154" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="178.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="224" y="154" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="248" y="178.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="60" y="92" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">矩阵</text>
  <rect x="330" y="60" width="250" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="342" y="85.6" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">(0,0)(0,0)：和 0 ✓</text>
  <text x="342" y="101.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">(0,2)(0,2)：和 0 ✓</text>
  <text x="342" y="117.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">(2,0)(2,0)：和 0 ✓</text>
  <text x="342" y="133.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">(2,2)(2,2)：和 0 ✓</text>
  <rect x="330" y="166" width="250" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="342" y="183.6" font-size="10" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">其余矩形：</text>
  <text x="342" y="199.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">含 1 的行/列都会使和 &gt; 0</text>
  <text x="342" y="215.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">（全为正数，不可能抵消）</text>
  <text x="60" y="240" font-size="11" fill="#8a6a10" text-anchor="start" font-weight="bold" filter="url(#rough2)">按 (top, bottom) 分组看列和：</text>
  <text x="60" y="262" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">top=0,bottom=0 → [0,1,0]；top=1,bottom=1 → [1,1,1]；top=2,bottom=2 → [0,1,0]</text>
  <text x="60" y="284" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">top=0,bottom=1 → [1,2,1]；top=1,bottom=2 → [1,2,1]；top=0,bottom=2 → [1,3,1]</text>
  <text x="60" y="306" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">每个列和数组里「和为 0 的子数组」个数相加，正好等于 4。</text>
  <rect x="60" y="320" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="341.8" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">复杂度 O(m² · n)：m = n = 100 时约 10⁶ 次哈希操作</text>
</svg>
