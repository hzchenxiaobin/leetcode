<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">换引擎①：s = w + '#' + target，一遍 Z 函数批量拿 LCP</text>

  <!-- 匹配弧线：s[0..3) = s[5..8) = "abc" -->
  <g fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)">
    <path d="M 47,70 Q 132,10 217,70"/>
    <path d="M 81,70 Q 166,26 251,70"/>
    <path d="M 115,70 Q 200,42 285,70"/>
  </g>
  <text x="305" y="46" font-size="11" fill="#8a6a10" filter="url(#rough2)">s[0..3) = s[5..8) = "abc"</text>
  <text x="305" y="62" font-size="11" fill="#8a6a10" filter="url(#rough2)">（最右 Z-box [l, r)）</text>

  <!-- 拼接串格子：abc#aabcdabc -->
  <g filter="url(#rough2)">
    <rect x="30" y="72" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="64" y="72" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="98" y="72" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="72" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="166" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="200" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="234" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="268" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="302" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="336" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="370" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="404" y="72" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="47" y="93" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="81" y="93" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="115" y="93" text-anchor="middle" font-size="14" fill="#333">c</text>
    <text x="149" y="93" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">#</text>
    <text x="183" y="93" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="217" y="93" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="251" y="93" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="285" y="93" text-anchor="middle" font-size="14" fill="#333">c</text>
    <text x="319" y="93" text-anchor="middle" font-size="14" fill="#333">d</text>
    <text x="353" y="93" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="387" y="93" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="421" y="93" text-anchor="middle" font-size="14" fill="#333">c</text>
  </g>

  <!-- 下标 -->
  <text x="20" y="118" font-size="9" fill="#666" filter="url(#rough2)">i</text>
  <g font-size="9" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="47" y="118">0</text><text x="81" y="118">1</text><text x="115" y="118">2</text>
    <text x="149" y="118">3</text><text x="183" y="118">4</text><text x="217" y="118">5</text>
    <text x="251" y="118">6</text><text x="285" y="118">7</text><text x="319" y="118">8</text>
    <text x="353" y="118">9</text><text x="387" y="118">10</text><text x="421" y="118">11</text>
  </g>

  <!-- 段标签 -->
  <text x="81" y="136" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">w 段</text>
  <text x="302" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">target 段</text>

  <!-- z 值行 -->
  <text x="20" y="160" font-size="11" fill="#666" filter="url(#rough2)">z</text>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="47" y="160" font-size="10" fill="#999">–</text>
    <text x="81" y="160" font-size="10" fill="#999">–</text>
    <text x="115" y="160" font-size="10" fill="#999">–</text>
    <text x="149" y="160" font-size="10" fill="#999">–</text>
    <text x="183" y="160" font-size="11" fill="#333">1</text>
    <text x="217" y="160" font-size="13" fill="#b07810" font-weight="bold">3</text>
    <text x="251" y="160" font-size="11" fill="#999">0</text>
    <text x="285" y="160" font-size="11" fill="#999">0</text>
    <text x="319" y="160" font-size="11" fill="#999">0</text>
    <text x="353" y="160" font-size="13" fill="#b07810" font-weight="bold">3</text>
    <text x="387" y="160" font-size="11" fill="#999">0</text>
    <text x="421" y="160" font-size="11" fill="#999">0</text>
  </g>

  <!-- 说明框 1 -->
  <rect x="28" y="176" width="464" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">① z[|w|+1+j] = LCP(w, target[j:]) —— target 段的 z 就是 mn[j] 的候选</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">② 哨兵 '#' 挡在 w 尾部：z ≤ |w| 天然成立，无需 min</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">③ mn[j] = 各 word 的 z 逐位取 max</text>

  <!-- 说明框 2 -->
  <rect x="28" y="248" width="464" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#2f5524" filter="url(#rough2)">Z 为何线性：维护最右 Z-box [l, r)，满足 s[l..r) = s[0..r−l)</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#2f5524" filter="url(#rough2)">i 落在框内 → z[i] 初值复用 z[i−l]；只有冲出 r 才逐字符比较</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#2f5524" filter="url(#rough2)">r 全程只右移 |s| 次 → 总比较 O(|s|)：信息复用 vs 重复劳动</text>

  <!-- 说明框 3 -->
  <rect x="28" y="316" width="464" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#7a5410" filter="url(#rough2)">账单：每 word 一遍 O(|w|+n)，合计 O(Σ|w| + W·n) ≈ 10⁵ + 5×10⁶（乘的是没被放大的 W）</text>
</svg>
