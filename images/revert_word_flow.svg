<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="500" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：t 从 1 升序枚举，命中即返回</text>
  <path d="M 180 36 Q 330 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <rect x="210" y="46" width="300" height="36" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="69" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">读入 word、k；令 n = len(word)</text>
  <path d="M 360 82 L 360 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- t = 1 -->
  <rect x="310" y="104" width="100" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="125" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">t ← 1</text>
  <path d="M 360 136 L 360 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="360,158 510,200 360,242 210,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">t·k ≥ n ？</text>
  <text x="360" y="216" text-anchor="middle" font-size="11" fill="#8a6a30" filter="url(#rough2)">原字符已删光？</text>

  <!-- yes branch 1 -->
  <path d="M 510 200 L 552 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">是</text>
  <rect x="556" y="178" width="94" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="603" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">return t</text>
  <text x="603" y="213" text-anchor="middle" font-size="10.5" fill="#8a6a30" filter="url(#rough2)">整串照抄重建</text>

  <!-- no branch 1 -->
  <path d="M 360 242 L 360 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="260" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="360,272 540,322 360,372 180,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">word[t·k:] == word[: n−t·k] ？</text>
  <text x="360" y="337" text-anchor="middle" font-size="11" fill="#8a6a30" filter="url(#rough2)">存活后缀是前缀？</text>

  <!-- yes branch 2 -->
  <path d="M 540 322 L 580 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="558" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="584" y="300" width="68" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="618" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return t</text>
  <text x="618" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">照抄尾部</text>

  <!-- no branch 2 -->
  <path d="M 360 372 L 360 396" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="388" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>

  <!-- t = t + 1 -->
  <rect x="305" y="400" width="110" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="421" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#rough2)">t ← t + 1</text>

  <!-- loop back -->
  <path d="M 305 416 L 158 416 Q 140 416 140 398 L 140 218 Q 140 200 158 200 L 206 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="440" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">继续判定下一秒</text>

  <!-- note box -->
  <rect x="60" y="452" width="540" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="476" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">上界：t = ⌈n/k⌉ 时必有 t·k ≥ n → 答案必存在，循环必然终止</text>
</svg>
