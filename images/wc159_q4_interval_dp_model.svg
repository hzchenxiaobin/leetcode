<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：按结束时间升序排序，与 i 兼容的工作是一个前缀</text>
  <text x="320" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1 的三元组 (start, end, profit) 已按 end 升序排好，当前工作 i = (3, 6, 70)</text>

  <text x="270" y="84" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">start_i = 3</text>
  <path d="M 270 90 L 270 252" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>

  <text x="120" y="116" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">j = 1</text>
  <rect x="130" y="100" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">1 → 3，收益 50</text>
  <text x="496" y="116" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">end = 3 ≤ 3 ✓</text>

  <text x="120" y="148" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">j = 2</text>
  <rect x="200" y="132" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">2 → 4，收益 10</text>
  <text x="496" y="148" font-size="9.5" fill="#b85450" filter="url(#rough2)">end = 4 &gt; 3 ✗</text>

  <text x="120" y="180" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">j = 3</text>
  <rect x="270" y="164" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="340" y="180" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">3 → 5，收益 40</text>
  <text x="496" y="180" font-size="9.5" fill="#b85450" filter="url(#rough2)">end = 5 &gt; 3 ✗</text>

  <text x="120" y="212" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="270" y="196" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="375" y="212" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i：3 → 6，收益 70</text>
  <text x="496" y="212" font-size="9.5" fill="#446688" filter="url(#rough2)">当前工作，不能自接</text>

  <path d="M 60 250 L 560 250" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <path d="M 60 246 L 60 254" stroke="#999" stroke-width="1.2"/>
    <text x="60" y="268">0</text>
    <path d="M 130 246 L 130 254" stroke="#999" stroke-width="1.2"/>
    <text x="130" y="268">1</text>
    <path d="M 200 246 L 200 254" stroke="#999" stroke-width="1.2"/>
    <text x="200" y="268">2</text>
    <path d="M 270 246 L 270 254" stroke="#999" stroke-width="1.2"/>
    <text x="270" y="268">3</text>
    <path d="M 340 246 L 340 254" stroke="#999" stroke-width="1.2"/>
    <text x="340" y="268">4</text>
    <path d="M 410 246 L 410 254" stroke="#999" stroke-width="1.2"/>
    <text x="410" y="268">5</text>
    <path d="M 480 246 L 480 254" stroke="#999" stroke-width="1.2"/>
    <text x="480" y="268">6</text>
    <path d="M 550 246 L 550 254" stroke="#999" stroke-width="1.2"/>
    <text x="550" y="268">7</text>
    <text x="590" y="268">时间</text>
  </g>

  <rect x="60" y="284" width="520" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="76" y="304" font-size="10" fill="#3a5a30" filter="url(#rough2)">绿色：end ≤ start_i = 3，因为 ends 升序，它们恰好是开头一段 → p(i) = 1</text>
  <text x="76" y="324" font-size="10" fill="#3a5a30" filter="url(#rough2)">红色：end &gt; start_i，与 i 的时间区间重叠，绝不能与 i 同时选</text>

  <rect x="60" y="348" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="320" y="370" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[i] = max( dp[i−1], dp[p(i)] + profit_i )</text>
  <text x="320" y="390" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">p(i) = 满足 j &lt; i 且 ends[j] ≤ start_i 的工作个数，一次二分求出</text>
</svg>
