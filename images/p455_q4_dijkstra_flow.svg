<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 664"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="664" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：惰性堆 Dijkstra —— 首次弹出 mask = 0 的距离就是答案</text>

  <rect x="185" y="36" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="10.5" fill="#2a4666" filter="url(#rough2)">预处理 gmax[子集]</text>
  <path d="M 260 66 V 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="86" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10" fill="#2a4666" filter="url(#rough2)">dist[所有状态] = ∞</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#2a4666" filter="url(#rough2)">起点 (FULL, 0, 营地) 入堆</text>
  <path d="M 260 124 V 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="175,172 260,142 345,172 260,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">堆空？</text>
  <path d="M 345 172 H 396" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="164" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">是</text>
  <rect x="400" y="156" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <path d="M 260 202 V 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">否</text>

  <rect x="170" y="222" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="10" fill="#2a4666" filter="url(#rough2)">弹出堆顶 (d, mask, stage, side)</text>
  <path d="M 260 258 V 274" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="160,306 260,276 360,306 260,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">过期条目？</text>
  <text x="260" y="317" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">d &gt; dist[该状态]</text>
  <path d="M 360 306 H 420 V 240 H 354" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="298" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">是，跳过</text>
  <path d="M 260 336 V 352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,384 260,354 340,384 260,414" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">mask = 0？</text>
  <path d="M 340 384 H 396" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="376" text-anchor="middle" font-size="9" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <rect x="400" y="366" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="14" filter="url(#rough2)"/>
  <text x="455" y="382" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 d ✓</text>
  <text x="455" y="397" text-anchor="middle" font-size="9" fill="#2a5a2a" filter="url(#rough2)">（首次出堆即最优）</text>
  <path d="M 260 414 V 430" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,462 260,432 350,462 260,492" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="458" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">船在营地？</text>
  <text x="260" y="472" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">（side = 0）</text>
  <path d="M 170 462 H 135 V 496" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="454" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 350 462 H 385 V 496" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="454" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">否</text>

  <rect x="28" y="500" width="214" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="516" text-anchor="middle" font-size="9.5" fill="#2a4666" filter="url(#rough2)">枚举渡河组 g ⊆ mask</text>
  <text x="135" y="531" text-anchor="middle" font-size="9.5" fill="#2a4666" filter="url(#rough2)">（非空且 |g| ≤ k）：</text>
  <text x="135" y="546" text-anchor="middle" font-size="9.5" fill="#2a4666" filter="url(#rough2)">c = gmax[g] × mul[stage]</text>
  <text x="135" y="561" text-anchor="middle" font-size="9" fill="#2a4666" filter="url(#rough2)">松弛 (mask⊕g, (stage+⌊c+ε⌋)%m, 对岸)</text>
  <text x="135" y="576" text-anchor="middle" font-size="9" fill="#2a4666" filter="url(#rough2)">更优则更新并入堆</text>

  <rect x="278" y="500" width="214" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="385" y="516" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">枚举返回人 r ∉ mask：</text>
  <text x="385" y="531" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">c = time[r] × mul[stage]</text>
  <text x="385" y="546" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">松弛 (mask∪{r}, (stage+⌊c+ε⌋)%m, 营地)</text>
  <text x="385" y="561" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">更优则更新并入堆</text>
  <text x="385" y="576" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">（营地还有人 ⇒ 必须返回）</text>

  <path d="M 135 584 V 608 H 46 V 172 H 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 584 V 608 H 140" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="54" y="400" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">循环</text>

  <g filter="url(#rough2)">
    <rect x="60" y="622" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="260" y="636" text-anchor="middle" font-size="9.5" fill="#8a6a20">⌊c + ε⌋（ε = 10⁻⁹）防浮点误差：如 5 × 1.3 算成 6.49…⌋ 取 6 就错推进格数</text>
    <text x="260" y="650" text-anchor="middle" font-size="9.5" fill="#8a6a20">k = 1 且 n ≥ 2 ⇒ 弹空堆也见不到 mask = 0，自然返回 -1，无需特判</text>
  </g>
</svg>
