  <rect x="18" y="76" width="64" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="93" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s[i−1]</text>
  <rect x="86" y="76" width="378" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="107" y="93" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="149" y="93" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">1</text>
