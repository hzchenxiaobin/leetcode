  <text x="50" y="121" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">P[i]</text>
  <rect x="86" y="104" width="378" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="107" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
