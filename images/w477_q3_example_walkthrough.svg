  <text x="401" y="121" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">123</text>
  <text x="443" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1234</text>

  <rect x="18" y="132" width="64" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="149" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">C[i]</text>
  <rect x="86" y="132" width="378" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="107" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="149" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
