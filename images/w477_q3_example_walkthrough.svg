  <text x="443" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>

  <rect x="127" y="102" width="44" height="86" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="253" y="102" width="44" height="86" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <text x="260" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">查询 [1,3] 只读 i = 1 与 i = 4 两端的 P/C/S —— 中间的 0 列（灰）全透明</text>

  <rect x="22" y="216" width="476" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">查询 [1,3]（子串 "020"）：x = P[4] − P[1]·10^(C[4]−C[1]) = 12 − 1×10 = 2</text>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" fill="#8a6a30" filter="url(#rough2)">sum = S[4] − S[1] = 2，answer = 2 × 2 = 4 ✓</text>

  <rect x="22" y="292" width="476" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">查询 [4,6]（子串 "300"）：x = P[7] − P[4]·10^(C[7]−C[4]) = 123 − 12×10 = 3</text>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">sum = S[7] − S[4] = 3，answer = 3 × 3 = 9 ✓</text>

  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">查询 [0,7]：x = P[8] − P[0]·10^4 = 1234，sum = 10，answer = 12340 ✓（P[0] = 0 是空前缀）</text>
