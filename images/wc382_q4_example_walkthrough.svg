<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="900" height="720" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [7,3,15,14,2,8]，k = 4（full = 1111）</text>
  <path d="M 170 42 Q 450 50 730 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <text x="79" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#sk)">元素</text>
  <g filter="url(#sk)">
    <rect x="120" y="62" width="90" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="216" y="62" width="90" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="312" y="62" width="90" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="408" y="62" width="90" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="504" y="62" width="90" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="600" y="62" width="90" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5d85">
    <text x="165" y="82">7</text>
    <text x="261" y="82">3</text>
    <text x="357" y="82">15</text>
    <text x="453" y="82">14</text>
    <text x="549" y="82">2</text>
    <text x="645" y="82">8</text>
  </g>
  <g filter="url(#sk)" font-size="9" text-anchor="middle" fill="#7a94b5">
    <text x="165" y="98">0111</text>
    <text x="261" y="98">0011</text>
    <text x="357" y="98">1111</text>
    <text x="453" y="98">1110</text>
    <text x="549" y="98">0010</text>
    <text x="645" y="98">1000</text>
  </g>
  <text x="742" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#sk)">掩码 / 操作数</text>
  <text x="834" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#sk)">结论</text>

  <!-- ===== row bit 3 ===== -->
  <text x="79" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">bit 3</text>
  <text x="79" y="168" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">值 8</text>
  <g filter="url(#sk)">
    <rect x="120" y="112" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="216" y="112" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="312" y="112" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="408" y="112" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="504" y="112" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="600" y="112" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="165" y="150" fill="#2e6e2e">切</text>
    <text x="261" y="150" fill="#2e6e2e">切</text>
    <text x="357" y="150" fill="#a06b1a">吞</text>
    <text x="453" y="150" fill="#a06b1a">吞</text>
    <text x="549" y="150" fill="#2e6e2e">切</text>
    <text x="645" y="150" fill="#a06b1a">吞</text>
  </g>
  <g filter="url(#sk)" font-size="9" text-anchor="middle" fill="#777">
    <text x="165" y="170">0111</text>
    <text x="261" y="170">0011</text>
    <text x="357" y="170">1111</text>
    <text x="453" y="170">1110</text>
    <text x="549" y="170">0010</text>
    <text x="645" y="170">1000</text>
  </g>
  <text x="645" y="188" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">尾段→并上一段</text>
  <text x="742" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">mask 1000</text>
  <text x="742" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">cnt = 3</text>
  <text x="834" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="834" y="172" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">清零</text>

  <!-- ===== row bit 2 ===== -->
  <text x="79" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">bit 2</text>
  <text x="79" y="260" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">值 4</text>
  <g filter="url(#sk)">
    <rect x="120" y="204" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="216" y="204" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="312" y="204" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="408" y="204" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="504" y="204" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="600" y="204" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="165" y="242" fill="#a06b1a">吞</text>
    <text x="261" y="242" fill="#2e6e2e">切</text>
    <text x="357" y="242" fill="#a06b1a">吞</text>
    <text x="453" y="242" fill="#a06b1a">吞</text>
    <text x="549" y="242" fill="#2e6e2e">切</text>
    <text x="645" y="242" fill="#a06b1a">吞</text>
  </g>
  <g filter="url(#sk)" font-size="9" text-anchor="middle" fill="#777">
    <text x="165" y="262">0111</text>
    <text x="261" y="262">0011</text>
    <text x="357" y="262">1111</text>
    <text x="453" y="262">1110</text>
    <text x="549" y="262">0010</text>
    <text x="645" y="262">1000</text>
  </g>
  <text x="645" y="280" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">尾段→并上一段</text>
  <text x="742" y="242" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">mask 1100</text>
  <text x="742" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">cnt = 4</text>
  <text x="834" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="834" y="264" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">清零</text>

  <!-- ===== row bit 1 ===== -->
  <text x="79" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">bit 1</text>
  <text x="79" y="352" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">值 2</text>
  <g filter="url(#sk)">
    <rect x="120" y="296" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="216" y="296" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="312" y="296" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="408" y="296" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="504" y="296" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="600" y="296" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="165" y="334" fill="#a06b1a">吞</text>
    <text x="261" y="334" fill="#a06b1a">吞</text>
    <text x="357" y="334" fill="#a06b1a">吞</text>
    <text x="453" y="334" fill="#a06b1a">吞</text>
    <text x="549" y="334" fill="#a06b1a">吞</text>
    <text x="645" y="334" fill="#2e6e2e">切</text>
  </g>
  <g filter="url(#sk)" font-size="9" text-anchor="middle" fill="#777">
    <text x="165" y="354">0111</text>
    <text x="261" y="354">0011</text>
    <text x="357" y="354">0011</text>
    <text x="453" y="354">0010</text>
    <text x="549" y="354">0010</text>
    <text x="645" y="354">0000</text>
  </g>
  <text x="645" y="372" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#sk)">切得太晚</text>
  <text x="742" y="334" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">mask 1110</text>
  <text x="742" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">cnt = 5</text>
  <text x="834" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="834" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">保留</text>

  <!-- ===== row bit 0 ===== -->
  <text x="79" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">bit 0</text>
  <text x="79" y="444" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">值 1</text>
  <g filter="url(#sk)">
    <rect x="120" y="388" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="216" y="388" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="312" y="388" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="408" y="388" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="504" y="388" width="90" height="86" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="600" y="388" width="90" height="86" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="165" y="426" fill="#a06b1a">吞</text>
    <text x="261" y="426" fill="#a06b1a">吞</text>
    <text x="357" y="426" fill="#a06b1a">吞</text>
    <text x="453" y="426" fill="#2e6e2e">切</text>
    <text x="549" y="426" fill="#2e6e2e">切</text>
    <text x="645" y="426" fill="#a06b1a">吞</text>
  </g>
  <g filter="url(#sk)" font-size="9" text-anchor="middle" fill="#777">
    <text x="165" y="446">0111</text>
    <text x="261" y="446">0011</text>
    <text x="357" y="446">0011</text>
    <text x="453" y="446">0010</text>
    <text x="549" y="446">0010</text>
    <text x="645" y="446">1000</text>
  </g>
  <text x="645" y="464" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">尾段→并上一段</text>
  <text x="742" y="426" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">mask 1101</text>
  <text x="742" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">cnt = 4</text>
  <text x="834" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="834" y="448" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">清零</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="60" y="486" width="16" height="16" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="82" y="499" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">切：段在此收尾（0 次操作），cur 复位全 1</text>
  <g filter="url(#sk)">
    <rect x="430" y="486" width="16" height="16" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="452" y="499" font-size="10.5" fill="#a06b1a" filter="url(#sk)">吞：必须并入下一位（+1 次操作）</text>

  <!-- bottom left: answer -->
  <g filter="url(#sk)">
    <rect x="40" y="518" width="400" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="240" y="540" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案：cleared = 1101（bit 3、bit 2、bit 0 清零）</text>
  <text x="240" y="566" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">full &amp; ~cleared = 1111 &amp; 0010 = 0010 = 2</text>

  <!-- bottom right: partition -->
  <g filter="url(#sk)">
    <rect x="460" y="518" width="400" height="88" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="660" y="540" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85" filter="url(#sk)">bit 0 检查对应的划分</text>
  <g filter="url(#sk)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="660" y="560">[7,3,15,14] → AND = 2；　[2,8] → AND = 2 &amp; 8 = 0</text>
    <text x="660" y="580">OR = 2 | 0 = 2，操作 3 + 1 = 4 = k ✓</text>
    <text x="660" y="598" fill="#7a94b5">（与官方解释 [2, 0] 完全一致）</text>
  </g>

  <!-- note: why bit 1 fails -->
  <g filter="url(#sk)">
    <rect x="40" y="622" width="820" height="78" rx="8" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="450" y="646" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">bit 1 为何失败？</text>
  <g filter="url(#sk)" font-size="11" fill="#666" text-anchor="middle">
    <text x="450" y="668">7、3、15、14、2 逐一吞并后 cur 始终含 mask 位（如 0010 &amp; 1110 ≠ 0），直到 8 才把 cur 清空——</text>
    <text x="450" y="688">但那时 cnt = 5 已超预算 k = 4。前缀越长 AND 越「瘦」，可惜瘦得太晚；bit 1 只能留在答案里。</text>
  </g>
</svg>
