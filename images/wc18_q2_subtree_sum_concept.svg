<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">子树元素和 = 以该结点为根的子树上所有值之和</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">每个结点恰好贡献一个值；统计这些值的频次，取频次最高的全部取值</text>

  <!-- 左：示例树 + 每个结点的子树和 -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="104" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="150" y="110" text-anchor="middle" font-size="13" fill="#3a4a66">5</text>
    <circle cx="90" cy="196" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="90" y="202" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
    <circle cx="212" cy="196" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="212" y="202" text-anchor="middle" font-size="13" fill="#8a3a36">−3</text>
    <path d="M 141 122 L 100 176" stroke="#666" stroke-width="1.4" fill="none"/>
    <path d="M 160 122 L 202 176" stroke="#666" stroke-width="1.4" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="176" y="92" width="84" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="218" y="107" text-anchor="middle" font-size="10" fill="#3a5a30">和 = 5+2−3 = 4</text>
    <rect x="118" y="184" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="148" y="199" text-anchor="middle" fill="#3a5a30">和 = 2</text>
    <rect x="240" y="184" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="270" y="199" text-anchor="middle" fill="#3a5a30">和 = −3</text>
  </g>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#999">root = [5, 2, −3]</text>

  <!-- 右：频次表 -->
  <g filter="url(#rough2)">
    <rect x="330" y="72" width="200" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="346" y="94" fill="#8a6a20" font-size="11" font-weight="bold">哈希表：子树和 → 出现次数</text>
    <path d="M 344 102 L 516 102" stroke="#d6a040" stroke-width="1.1" fill="none"/>
    <text x="356" y="122">4</text>
    <text x="440" y="122">1 次</text>
    <text x="356" y="146">2</text>
    <text x="440" y="146">1 次</text>
    <text x="356" y="170">−3</text>
    <text x="440" y="170">1 次</text>
    <path d="M 344 182 L 516 182" stroke="#d6a040" stroke-width="1.1" fill="none"/>
    <text x="346" y="200" fill="#8a3a36" font-size="11" font-weight="bold">最大频次 = 1</text>
    <text x="346" y="220" fill="#8a3a36">答：[2, −3, 4]（顺序不限）</text>
  </g>

  <path d="M 280 250 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="50" y="282" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="66" y="304" font-size="11.5" font-weight="bold">为什么一次 DFS 就够</text>
    <text x="66" y="324">父结点的子树和 = 自己的值 + 左子树和 + 右子树和 —— 子树和天然自底向上可算；</text>
    <text x="66" y="344">而「哪些值出现最多」只是对这些和做一次频次统计，不需要第二次遍历。</text>
    <text x="66" y="360" fill="#8a3a36">频次并列时全部保留，因此答案是一个集合，输出顺序任意。</text>
  </g>
</svg>
