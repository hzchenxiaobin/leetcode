<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：k = 2，按效率降序扫描六步（对应示例 1）</text>
  <text x="340" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后依次为 (9,1) (7,5) (5,2) (4,10) (3,3) (2,8) —— 每步先 push，超员踢堆顶</text>

  <!-- 表头 -->
  <rect x="46" y="66" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="102" y="66" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="66" width="188" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="66" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="66" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="560" y="66" width="74" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="152" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">(e, s)</text>
  <text x="296" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">小顶堆（速度）</text>
  <text x="425" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">sum</text>
  <text x="510" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">perf = sum×e</text>
  <text x="597" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 第 1 行 -->
  <rect x="46" y="98" width="56" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="98" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="202" y="98" width="188" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="390" y="98" width="70" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="98" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="560" y="98" width="74" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="152" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(9, 1)</text>
  <text x="296" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">推入 1 → {1}</text>
  <text x="425" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="510" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 × 9 = 9</text>
  <text x="597" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>

  <!-- 第 2 行 -->
  <rect x="46" y="140" width="56" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="140" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="202" y="140" width="188" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="390" y="140" width="70" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="140" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="560" y="140" width="74" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="152" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(7, 5)</text>
  <text x="296" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">推入 5 → {1, 5}</text>
  <text x="425" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 × 7 = 42</text>
  <text x="597" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">42</text>

  <!-- 第 3 行 -->
  <rect x="46" y="182" width="56" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="182" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="202" y="182" width="188" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="390" y="182" width="70" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="182" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="560" y="182" width="74" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="208" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="152" y="208" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(5, 2)</text>
  <text x="296" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">推入 2，踢 1 → {2, 5}</text>
  <text x="425" y="208" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="510" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7 × 5 = 35</text>
  <text x="597" y="208" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">42</text>

  <!-- 第 4 行（高亮） -->
  <rect x="46" y="224" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="102" y="224" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="202" y="224" width="188" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="390" y="224" width="70" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="460" y="224" width="100" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="560" y="224" width="74" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="74" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <text x="152" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">(4, 10)</text>
  <text x="296" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">推入 10，踢 2 → {5, 10}</text>
  <text x="425" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">15</text>
  <text x="510" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">15 × 4 = 60 ✓</text>
  <text x="597" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">60</text>

  <!-- 第 5 行 -->
  <rect x="46" y="266" width="56" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="266" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="202" y="266" width="188" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="390" y="266" width="70" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="266" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="560" y="266" width="74" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="152" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3, 3)</text>
  <text x="296" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">推入 3，踢 3 → {5, 10}</text>
  <text x="425" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="510" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15 × 3 = 45</text>
  <text x="597" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">60</text>

  <!-- 第 6 行 -->
  <rect x="46" y="308" width="56" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="308" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="202" y="308" width="188" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="390" y="308" width="70" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="308" width="100" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="560" y="308" width="74" height="42" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="334" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="152" y="334" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 8)</text>
  <text x="296" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">推入 8，踢 5 → {8, 10}</text>
  <text x="425" y="334" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">18</text>
  <text x="510" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18 × 2 = 36</text>
  <text x="597" y="334" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">60</text>

  <!-- 左注：第 4 步登顶 -->
  <rect x="46" y="372" width="296" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">第 4 步登顶（60）：效率 e=4 不算低，</text>
  <text x="194" y="415" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">堆里又攒下 top-2 速度 {5, 10}，</text>
  <text x="194" y="434" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">速度和与效率的乘积到达峰值</text>
  <text x="194" y="452" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（选的是工程师 5 与工程师 2）</text>

  <!-- 右注：第 6 步反面教材 -->
  <rect x="360" y="372" width="274" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="497" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 6 步反面教材：速度和最大（18），</text>
  <text x="497" y="415" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">但效率下界已跌到 2：</text>
  <text x="497" y="434" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">18 × 2 = 36 &lt; 60</text>
  <text x="497" y="452" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两维互相牵制的直观体现</text>
</svg>
