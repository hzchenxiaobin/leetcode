<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按长度递增填表</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个区间尝试三种候选，取长度最小者写入 dp</text>

  <rect x="150" y="60" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① for len = 1 … n（区间长度递增）</text>

  <path d="M 310 96 V 110" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="112" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="135" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">② for i = 0 … n−len：j = i + len，best = s[i..j)</text>

  <path d="M 310 148 V 160" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 160 160 H 460" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 160 160 V 176" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 160 V 176" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="178" width="250" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="165" y="200" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 枚举切点 k（i &lt; k &lt; j）</text>
  <text x="165" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">候选 = dp[i][k] + dp[k][j]</text>
  <text x="165" y="242" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j − i − 1 种切法，O(len)</text>

  <rect x="330" y="178" width="250" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="455" y="198" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ 枚举周期 L（L | len，L &lt; len）</text>
  <text x="455" y="219" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">校验 s[i+t] == s[i + t mod L]</text>
  <text x="455" y="240" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">候选 = (len/L) [ dp[i][i+L] ]</text>

  <path d="M 165 254 V 272 H 310" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 455 254 V 272 H 310" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 310 272 V 292" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,294 430,330 310,366 190,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="335" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">候选长度 &lt; best ？</text>

  <path d="M 430 330 H 500" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="334" font-size="10" fill="#8a3a36" filter="url(#rough2)">否：丢弃</text>

  <path d="M 310 366 V 386" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="382" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是：best ← 候选</text>

  <rect x="180" y="388" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="410" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">dp[i][j] ← best（本区间定稿）</text>

  <path d="M 310 422 V 440" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="460" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">全部区间填完后，答案 = dp[0][n]</text>
</svg>
