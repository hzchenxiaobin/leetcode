<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">计数栈：把「连续相同字符」压成一个 (字符, 计数) 块</text>
  <text x="320" y="45" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">栈中相邻两块的字符一定不同；计数一旦涨到 k 就整块弹出（图中 k = 3）</text>

  <!-- 左：输入串与扫描边界 -->
  <rect x="24" y="62" width="300" height="192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① 自左向右读入字符（k = 3）</text>

  <rect x="48" y="96" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="96" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="96" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="96" width="30" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="96" width="30" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="96" width="30" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="96" width="30" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="96" width="30" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" rx="4" filter="url(#rough2)"/>

  <text x="63" y="118" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">d</text>
  <text x="95" y="118" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">e</text>
  <text x="127" y="118" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">e</text>
  <text x="159" y="118" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">e</text>
  <text x="191" y="118" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">d</text>
  <text x="223" y="118" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">b</text>
  <text x="255" y="118" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">b</text>
  <text x="287" y="118" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">c</text>

  <path d="M 174 92 L 174 132" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="63" y="148" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">已归约前缀</text>
  <text x="238" y="148" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">尚未读入</text>

  <text x="40" y="176" font-size="10" fill="#555555" filter="url(#rough2)">读入 e 三次：计数 1 → 2 → 3</text>
  <text x="40" y="196" font-size="10" fill="#555555" filter="url(#rough2)">第 3 个 e 一到，eee 整段可删</text>
  <text x="40" y="216" font-size="10" fill="#b85450" filter="url(#rough2)">→ 计数正好等于 k 的那块整体弹出</text>
  <text x="40" y="236" font-size="10" fill="#555555" filter="url(#rough2)">删除 = 左右拼接，露出新栈顶继续比</text>

  <!-- 右：栈的形态 -->
  <rect x="344" y="62" width="272" height="192" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="360" y="84" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 栈的形态（底 → 顶）</text>
  <text x="360" y="108" font-size="9.5" fill="#555555" filter="url(#rough2)">栈非空且同字符 ⇒ cnt += 1</text>
  <text x="360" y="126" font-size="9.5" fill="#555555" filter="url(#rough2)">否则压入新块 (c, 1)</text>

  <text x="443" y="144" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">栈顶</text>
  <rect x="368" y="148" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="443" y="173" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">e　|　cnt = 3</text>

  <path d="M 518 168 L 530 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="534" y="164" font-size="9.5" fill="#b85450" filter="url(#rough2)">cnt == k</text>
  <text x="534" y="180" font-size="9.5" fill="#b85450" filter="url(#rough2)">整块弹出</text>

  <rect x="368" y="196" width="150" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="443" y="221" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">d　|　cnt = 1</text>

  <text x="443" y="252" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">栈底</text>

  <!-- 下：不变式 -->
  <rect x="24" y="262" width="592" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="282" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 三条不变式</text>
  <text x="40" y="303" font-size="10" fill="#3a5a30" filter="url(#rough2)">· 栈内永远不存在 k 个连续相同字符（到 k 立刻弹出）</text>
  <text x="40" y="322" font-size="10" fill="#3a5a30" filter="url(#rough2)">· 相邻两块字符一定不同，所以「能否合并」只需看栈顶</text>
  <text x="40" y="341" font-size="10" fill="#3a5a30" filter="url(#rough2)">· 每个字符至多入栈一次、出栈一次 ⇒ 总代价 O(n)</text>
</svg>
