<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描同时统计 land 与 shared</text>

  <rect x="140" y="54" width="340" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">双重循环遍历每个格子 (i, j)</text>

  <rect x="140" y="110" width="340" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">grid[i][j] == 1 ？</text>

  <rect x="140" y="166" width="340" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">land += 1（该格先按 4 条边计）</text>

  <rect x="140" y="222" width="340" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下方是陆地 → shared += 1</text>

  <rect x="140" y="282" width="340" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">右方是陆地 → shared += 1</text>

  <rect x="140" y="342" width="340" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="365" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 4 × land − 2 × shared</text>

  <path d="M 310 88 L 310 106" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 144 L 310 162" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 200 L 310 218" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 260 L 310 278" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 320 L 310 338" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 480 127 L 496 127" fill="none" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="502" y="123" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">为 0 则跳过，</text>
  <text x="502" y="140" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">什么都不加</text>

  <text x="502" y="238" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只查「下 / 右」</text>
  <text x="502" y="258" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">两个方向，</text>
  <text x="502" y="278" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">每对相邻</text>
  <text x="502" y="298" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只统计一次</text>

  <text x="360" y="410" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">越界判断 i+1 &lt; rows / j+1 &lt; cols 提前短路，等价于把网格外都当成水域</text>
</svg>
