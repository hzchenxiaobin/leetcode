<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：'*' 是 1–9 的「数字集合」</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步只吞 1 位或 2 位 → 答案来自两条转移来源之和</text>

  <rect x="28" y="68" width="236" height="214" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">一位成码：dp[i-1] 的系数</text>
  <text x="146" y="115" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">'*' 可取 1–9，共 9 个数字</text>

  <rect x="68" y="130" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="151" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="130" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="151" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="130" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="202" y="151" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="68" y="174" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="124" y="174" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="180" y="174" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="202" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="68" y="218" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="124" y="218" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="180" y="218" width="44" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="202" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <text x="146" y="272" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">贡献 one × dp[i-1]，此处 one = 9</text>

  <rect x="296" y="68" width="236" height="214" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">两位成码：dp[i-2] 的系数</text>

  <rect x="308" y="108" width="102" height="50" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="359" y="130" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">1*</text>
  <text x="359" y="148" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">9 种：11–19</text>
  <rect x="418" y="108" width="102" height="50" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="469" y="130" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">2*</text>
  <text x="469" y="148" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">6 种：21–26</text>

  <text x="414" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'*' '*' 合计 9 + 6 = 15 种</text>
  <text x="414" y="206" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">*b：b ≤ 6 有 2 种，b ≥ 7 只剩 1 种</text>
  <text x="414" y="228" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">a*：a = 1 → 9 种，a = 2 → 6 种，a ≥ 3 → 0</text>
  <text x="414" y="272" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">贡献 two × dp[i-2]，此处 two = 15</text>

  <text x="280" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">dp[i] = one × dp[i-1] + two × dp[i-2]　(mod 10⁹+7)</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">例 s = "2*"：一位 9 × dp[1] = 9，两位 6 × dp[0] = 6 → dp[2] = 15</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两条硬边界：26 是两位编码上界，0 不能单独成码</text>
</svg>
