<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="780" height="450" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：答案就是偶权元素的个数</text>
  <path d="M 150 46 Q 390 54 630 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">每组只统计 popcount 为偶数的位置，与数组顺序、操作细节都无关</text>

  <rect x="40" y="84" width="700" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="107" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">数组（更新后）</text>
  <text x="300" y="107" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">各元素的 popcount</text>
  <text x="560" y="107" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">偶权位置数 = 答案</text>

  <text x="62" y="146" font-size="13.5" fill="#333" filter="url(#rough2)">[10, 3]</text>
  <text x="300" y="146" font-size="12.5" fill="#333" filter="url(#rough2)">10 → 2（偶），3 → 2（偶）</text>
  <text x="590" y="146" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="62" y="180" font-size="13.5" fill="#333" filter="url(#rough2)">[0, 3]</text>
  <text x="300" y="180" font-size="12.5" fill="#333" filter="url(#rough2)">0 → 0，3 → 2</text>
  <text x="590" y="180" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="62" y="214" font-size="13.5" fill="#333" filter="url(#rough2)">[15, 1, 5]</text>
  <text x="300" y="214" font-size="12.5" fill="#333" filter="url(#rough2)">15 → 4，1 → 1（奇），5 → 2</text>
  <text x="590" y="214" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="62" y="248" font-size="13.5" fill="#333" filter="url(#rough2)">[15, 1, 0]</text>
  <text x="300" y="248" font-size="12.5" fill="#333" filter="url(#rough2)">15 → 4，1 → 1（奇），0 → 0</text>
  <text x="590" y="248" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="62" y="282" font-size="13.5" fill="#333" filter="url(#rough2)">[10, 1, 0]</text>
  <text x="300" y="282" font-size="12.5" fill="#333" filter="url(#rough2)">10 → 2，1 → 1（奇），0 → 0</text>
  <text x="590" y="282" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="62" y="316" font-size="13.5" fill="#333" filter="url(#rough2)">[10, 0, 0]</text>
  <text x="300" y="316" font-size="12.5" fill="#333" filter="url(#rough2)">10 → 2，0 → 0，0 → 0</text>
  <text x="590" y="316" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="62" y="350" font-size="13.5" fill="#333" filter="url(#rough2)">[1, 2, 3, 4]</text>
  <text x="300" y="350" font-size="12.5" fill="#333" filter="url(#rough2)">1、2、4 都奇，只有 3 是偶权</text>
  <text x="590" y="350" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <path d="M 40 122 L 740 122 M 40 158 L 740 158 M 40 192 L 740 192 M 40 226 L 740 226 M 40 260 L 740 260 M 40 294 L 740 294 M 40 328 L 740 328 M 40 364 L 740 364"
        stroke="#c9d3dd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="376" width="720" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="400" font-size="12.5" fill="#5c5140" filter="url(#rough2)">构造见证：[10, 3] 取 s_1 = 3 ⇒ [10⊕3, 3⊕3] = [9, 0]，两个都成了 3 的倍数</text>
  <text x="52" y="424" font-size="12.5" fill="#5c5140" filter="url(#rough2)">[10, 1, 5] 取 s_1 = s_2 = 9 ⇒ [10⊕9, 1⊕9⊕9, 5⊕9] = [3, 1, 12]，两个偶权位都归位</text>
</svg>
