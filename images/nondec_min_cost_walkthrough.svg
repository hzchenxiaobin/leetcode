<svg xmlns="http://www.w3.org/2000/svg" width="940" height="710" viewBox="0 0 940 710" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="710" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 3, 2, 1]</text>
  <path d="M 330 42 Q 470 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 原数组 ===== -->
  <text x="80" y="103" font-size="13" fill="#444" filter="url(#sk)">原数组</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="76" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="312" y="76" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="384" y="76" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="456" y="76" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <text x="268" y="104">3</text>
    <text x="340" y="104">3</text>
    <text x="412" y="104">2</text>
    <text x="484" y="104">1</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="268" y="134">0</text>
    <text x="340" y="134">1</text>
    <text x="412" y="134">2</text>
    <text x="484" y="134">3</text>
  </g>
  <path d="M 376 84 L 376 114" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 448 84 L 448 114" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="376" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">δ=1</text>
  <text x="448" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">δ=1</text>
  <text x="560" y="103" font-size="13" fill="#8c3a36" filter="url(#sk)">两处下坠 → D = 2</text>

  <!-- Step 1 -->
  <text x="80" y="188" font-size="12" fill="#555" filter="url(#sk)">Step 1  检查对 (0,1)：3 ≤ 3 合规，不操作</text>

  <!-- Step 2 -->
  <text x="80" y="218" font-size="12" fill="#555" filter="url(#sk)">Step 2  检查对 (1,2)：3 &gt; 2，δ = 1 → op① 后缀 [2..3] 整体 +1</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="228" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="312" y="228" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="384" y="228" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="456" y="228" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <text x="268" y="256">3</text>
    <text x="340" y="256">3</text>
    <text x="412" y="256">3</text>
    <text x="484" y="256">2</text>
  </g>
  <text x="560" y="256" font-size="13" fill="#444" filter="url(#sk)">ans = 1（蓝色 = 本次被抬升）</text>

  <!-- Step 3 -->
  <text x="80" y="308" font-size="12" fill="#555" filter="url(#sk)">Step 3  检查对 (2,3)：3 &gt; 2，δ = 1 → op② 后缀 [3..3] 整体 +1</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="318" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="312" y="318" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="384" y="318" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="456" y="318" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="268" y="346">3</text>
    <text x="340" y="346">3</text>
    <text x="412" y="346">3</text>
    <text x="484" y="346">3</text>
  </g>
  <text x="560" y="346" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2 ✓ 非递减</text>

  <!-- ===== 示例 2 ===== -->
  <text x="80" y="408" font-size="14" font-weight="bold" fill="#444" filter="url(#sk)">再走示例 2：nums = [5, 1, 2, 3]</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="422" width="56" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="312" y="422" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="384" y="422" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="456" y="422" width="56" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <text x="268" y="450">5</text>
    <text x="340" y="450">1</text>
    <text x="412" y="450">2</text>
    <text x="484" y="450">3</text>
  </g>
  <path d="M 376 430 L 376 460" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="376" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">δ=4</text>
  <text x="560" y="450" font-size="13" fill="#8c3a36" filter="url(#sk)">一处大下坠 → D = 4</text>

  <path d="M 340 472 L 340 494" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="356" y="488" font-size="12" fill="#555" filter="url(#sk)">一次操作：后缀 [1..3] 整体 +4</text>

  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="500" width="56" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="312" y="500" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="384" y="500" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="456" y="500" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="268" y="528">5</text>
    <text x="340" y="528">5</text>
    <text x="412" y="528">6</text>
    <text x="484" y="528">7</text>
  </g>
  <text x="560" y="528" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 4 ✓ 非递减</text>

  <!-- ===== 底部对照 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="566" width="840" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="592" font-size="12" fill="#444" filter="url(#sk)">⚠ 对照自造用例 nums = [4, 2, 3]：一处下坠 δ = 2，答案 2 —— 后缀 [1..2] 整体 +2 得 [4, 4, 5]。</text>
  <text x="70" y="616" font-size="12" fill="#444" filter="url(#sk)">若误套「单点 +1 抬到前缀最大」的单点版贪心（0 + 2 + 1 = 3）会多付 1：区间操作的「宽度免费」</text>
  <text x="70" y="640" font-size="12" fill="#444" filter="url(#sk)">正是本题与单点增量类题目的本质差别。</text>
  <text x="70" y="666" font-size="11" fill="#7a7a7a" filter="url(#sk)">复杂度：时间 O(n) | 额外空间 O(1)</text>
</svg>
