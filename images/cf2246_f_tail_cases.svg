<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">收尾：循环结束后只剩两个元素，形态只有两种</text>

  <!-- CASE A -->
  <rect x="40" y="50" width="820" height="170" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="78" font-size="14.5" fill="#2f4f28" filter="url(#rough2)">形态 A（n 奇偶都会出现）：[n−1, n, 1, 2, …, n−2]</text>
  <text x="58" y="104" font-size="13" fill="#333" filter="url(#rough2)">4 步：apply(2) → apply(1) → apply(n−1) → apply(1)</text>
  <text x="58" y="132" font-size="12.5" fill="#333" filter="url(#rough2)">apply(2)：[n, n−1, 2, 3, …, n−2, 1]　　（n 顶到队首，1 落到队尾）</text>
  <text x="58" y="156" font-size="12.5" fill="#333" filter="url(#rough2)">apply(1)：[n, 2, 3, …, n−2, 1, n−1]　　（不动 p1，后缀左循环）</text>
  <text x="58" y="180" font-size="12.5" fill="#333" filter="url(#rough2)">apply(n−1)：[1, n, 2, 3, …, n−1]　　　　（1 顶到队首，n 留在队尾）</text>
  <text x="58" y="204" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">apply(1)：[1, 2, 3, …, n]　✓　共 4 步</text>

  <!-- CASE B -->
  <rect x="40" y="238" width="820" height="150" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="266" font-size="14.5" fill="#8a5a10" filter="url(#rough2)">形态 B（只在 n 为奇数时出现）：[n, n−1, 1, 2, …, n−2]</text>
  <text x="58" y="292" font-size="12.5" fill="#333" filter="url(#rough2)">apply(1) → [n, 1, 2, …, n−1]：整个数组是“升序循环移位”，n 为偶数时这种状态本来就无解</text>
  <text x="58" y="316" font-size="12.5" fill="#333" filter="url(#rough2)">再 apply(2) 共 n−2 次，记 A_t 为第 t 次之后的状态：</text>
  <text x="58" y="340" font-size="12.5" fill="#333" filter="url(#rough2)">t 偶：A_t = [n, 1, t+2 … n−1, 2 … t+1]　　t 奇：A_t = [1, n, t+2 … n−1, 2 … t+1]</text>
  <text x="58" y="364" font-size="12.5" fill="#333" filter="url(#rough2)">t = n−2 为奇数 ⇒ A = [1, n, 2, 3, …, n−1]，最后一次 apply(1) 排好</text>
  <text x="58" y="382" font-size="12" fill="#8a5a10" filter="url(#rough2)">代价 1 + (n−2) + 1 = n 步</text>

  <rect x="40" y="404" width="820" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="430" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">总操作数 ≤ 3(n−2) + max(4, n) ≤ 4n　（n ≥ 4 时更紧：≤ 4n − 6）</text>
  <path d="M450,222 L450,234" stroke="#446688" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
</svg>
