<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：jewels = "aA"，stones = "aAAbbbb"</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">掩码只有第 0 位（'a'）与第 26 位（'A'）为 1，其余 50 位都是 0</text>

  <rect x="80" y="68" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="125" y="87" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">石头 c</text>
  <text x="215" y="87" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">bit(c)</text>
  <text x="325" y="87" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">第 bit(c) 位</text>
  <text x="435" y="87" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">判定</text>
  <text x="520" y="87" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">ans</text>

  <g filter="url(#rough2)">
    <rect x="80" y="96" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="80" y="126" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="80" y="156" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="80" y="186" width="480" height="30" fill="#fce4ec" stroke="#d6a040" stroke-width="2"/>
    <rect x="80" y="216" width="480" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1"/>
    <rect x="80" y="246" width="480" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1"/>
    <rect x="80" y="276" width="480" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1"/>

    <path d="M 170 68 L 170 306 M 260 68 L 260 306 M 390 68 L 390 306 M 480 68 L 480 306"
          stroke="#bbb" stroke-width="1" fill="none"/>

    <text x="125" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33552a">'a'</text>
    <text x="215" y="116" text-anchor="middle" font-size="11" fill="#444">0</text>
    <text x="325" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a">1</text>
    <text x="435" y="116" text-anchor="middle" font-size="10" fill="#33552a">✓ 宝石</text>
    <text x="520" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a">1</text>

    <text x="125" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33552a">'A'</text>
    <text x="215" y="146" text-anchor="middle" font-size="11" fill="#444">26</text>
    <text x="325" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a">1</text>
    <text x="435" y="146" text-anchor="middle" font-size="10" fill="#33552a">✓ 宝石</text>
    <text x="520" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a">2</text>

    <text x="125" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33552a">'A'</text>
    <text x="215" y="176" text-anchor="middle" font-size="11" fill="#444">26</text>
    <text x="325" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a">1</text>
    <text x="435" y="176" text-anchor="middle" font-size="10" fill="#33552a">✓ 宝石</text>
    <text x="520" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a">3</text>

    <text x="125" y="206" text-anchor="middle" font-size="11.5" fill="#8a3a36">'b'</text>
    <text x="215" y="206" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="325" y="206" text-anchor="middle" font-size="11" fill="#8a3a36">0</text>
    <text x="435" y="206" text-anchor="middle" font-size="10" fill="#8a3a36">✗ 非宝石</text>
    <text x="520" y="206" text-anchor="middle" font-size="11" fill="#8a3a36">3</text>

    <text x="125" y="236" text-anchor="middle" font-size="11.5" fill="#8a3a36">'b'</text>
    <text x="215" y="236" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="325" y="236" text-anchor="middle" font-size="11" fill="#8a3a36">0</text>
    <text x="435" y="236" text-anchor="middle" font-size="10" fill="#8a3a36">✗ 非宝石</text>
    <text x="520" y="236" text-anchor="middle" font-size="11" fill="#8a3a36">3</text>

    <text x="125" y="266" text-anchor="middle" font-size="11.5" fill="#8a3a36">'b'</text>
    <text x="215" y="266" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="325" y="266" text-anchor="middle" font-size="11" fill="#8a3a36">0</text>
    <text x="435" y="266" text-anchor="middle" font-size="10" fill="#8a3a36">✗ 非宝石</text>
    <text x="520" y="266" text-anchor="middle" font-size="11" fill="#8a3a36">3</text>

    <text x="125" y="296" text-anchor="middle" font-size="11.5" fill="#8a3a36">'b'</text>
    <text x="215" y="296" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="325" y="296" text-anchor="middle" font-size="11" fill="#8a3a36">0</text>
    <text x="435" y="296" text-anchor="middle" font-size="10" fill="#8a3a36">✗ 非宝石</text>
    <text x="520" y="296" text-anchor="middle" font-size="11" fill="#8a3a36">3</text>
  </g>

  <text x="80" y="328" font-size="10" fill="#666" filter="url(#rough2)">第 4 行（橙色框）是第一个未命中：'b' 落在第 1 位，该位为 0 于是直接跳过，后三个 'b' 同理。</text>
  <text x="80" y="350" font-size="10" fill="#666" filter="url(#rough2)">示例 2：jewels = "z" 只置第 25 位，stones = "ZZ" 落在第 51 位 → 两位皆 0，答案 0。</text>
  <text x="80" y="372" font-size="10" fill="#666" filter="url(#rough2)">大小写各自独立成位，"a" 与 "A" 绝不会互相冒充，正是题目强调的区分方式。</text>
</svg>
