<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="392" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">最小绝对差值：边扫边记「最近的 1」和「最近的 2」</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1,0,0,2,0,1]；每遇到新的 1 或 2，就与对方最近出现的位置配一次</text>
  <rect x="100" y="70" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126.0" y="93.68" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="126" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=0</text>
  <rect x="162" y="70" width="52" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188.0" y="93.68" text-anchor="middle" font-size="13" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="188" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=1</text>
  <rect x="224" y="70" width="52" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250.0" y="93.68" text-anchor="middle" font-size="13" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="250" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=2</text>
  <rect x="286" y="70" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312.0" y="93.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="312" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=3</text>
  <rect x="348" y="70" width="52" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374.0" y="93.68" text-anchor="middle" font-size="13" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="374" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=4</text>
  <rect x="410" y="70" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436.0" y="93.68" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="436" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=5</text>
  <text x="474" y="94" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">1 与 2 交替出现</text>
  <text x="64" y="148" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">时机</text>
  <text x="200" y="148" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">last1</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">last2</text>
  <text x="396" y="148" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">|last1−last2|</text>
  <text x="500" y="148" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">best</text>
  <rect x="50" y="162" width="468" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="64" y="184" text-anchor="start" font-size="9.5" fill="#333" filter="url(#rough2)">i=3（遇到 2）</text>
  <text x="200" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="300" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="396" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="500" y="184" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="50" y="202" width="468" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="64" y="224" text-anchor="start" font-size="9.5" fill="#333" filter="url(#rough2)">i=5（遇到 1）</text>
  <text x="200" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="300" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="396" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="500" y="224" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="36" y="248" width="488" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="268" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">扫描时维护的两个量</text>
  <text x="48" y="286" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">last1 / last2 = 最近一次出现 1 / 2 的下标（没有则 −1）</text>
  <text x="48" y="304" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">两者都出现过之后，每步都用 |last1 − last2| 更新 best</text>
  <rect x="36" y="320" width="236" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="340" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么只需「最近的」</text>
  <text x="48" y="356" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">更早的同值下标距离更大，</text>
  <text x="48" y="372" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">必然不会更优。</text>
  <rect x="288" y="320" width="236" height="50" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="start" font-size="10.5" fill="#666666" font-weight="bold" filter="url(#rough2)">无解</text>
  <text x="300" y="356" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">某个值从未出现 → 没有有效数对</text>
  <text x="300" y="372" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">→ 返回 −1</text>
  <text x="280" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">有效数对 = 一个下标取 1、另一个取 2，顺序无关，只取绝对差</text>
</svg>
