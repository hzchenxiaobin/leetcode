<svg xmlns="http://www.w3.org/2000/svg" width="680" height="548" viewBox="0 0 680 548" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="548" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：mat = [[1,0,1],[1,1,0],[1,1,0]] → 13</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">三个底边行各自的高度直方图与贡献（行贡献 2 + 4 + 7）</text>

  <!-- band 0 -->
  <rect x="20" y="62" width="640" height="96" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="40" y1="140" x2="150" y2="140" stroke="#8a7a66" stroke-width="2.5" filter="url(#sk)"/>
  <rect x="52" y="118" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="120" y="118" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <g font-size="10" fill="#33517a" font-weight="bold" filter="url(#sk)">
    <text x="65" y="114" text-anchor="middle">1</text>
    <text x="99" y="136" text-anchor="middle" fill="#999">0</text>
    <text x="133" y="114" text-anchor="middle">1</text>
  </g>
  <g font-size="8.5" fill="#999" filter="url(#sk)">
    <text x="65" y="153" text-anchor="middle">j=0</text>
    <text x="99" y="153" text-anchor="middle">j=1</text>
    <text x="133" y="153" text-anchor="middle">j=2</text>
  </g>
  <text x="180" y="88" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">底边行 i = 0：h = [1, 0, 1]</text>
  <text x="180" y="114" font-size="11.5" fill="#333" filter="url(#sk)">各右端点贡献：r=0 → 1；r=1 → 0；r=2 → 1</text>
  <text x="180" y="140" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">行贡献 = 2</text>

  <!-- band 1 -->
  <rect x="20" y="164" width="640" height="96" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="40" y1="242" x2="150" y2="242" stroke="#8a7a66" stroke-width="2.5" filter="url(#sk)"/>
  <rect x="52" y="198" width="26" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="86" y="220" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <g font-size="10" fill="#33517a" font-weight="bold" filter="url(#sk)">
    <text x="65" y="194" text-anchor="middle">2</text>
    <text x="99" y="216" text-anchor="middle">1</text>
    <text x="133" y="238" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="180" y="190" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">底边行 i = 1：h = [2, 1, 0]</text>
  <text x="180" y="216" font-size="11.5" fill="#333" filter="url(#sk)">各右端点贡献：r=0 → 2；r=1 → 2；r=2 → 0</text>
  <text x="180" y="242" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">行贡献 = 4</text>

  <!-- band 2 -->
  <rect x="20" y="266" width="640" height="96" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="40" y1="344" x2="150" y2="344" stroke="#8a7a66" stroke-width="2.5" filter="url(#sk)"/>
  <rect x="52" y="278" width="26" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="86" y="300" width="26" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <g font-size="10" fill="#33517a" font-weight="bold" filter="url(#sk)">
    <text x="65" y="274" text-anchor="middle">3</text>
    <text x="99" y="296" text-anchor="middle">2</text>
    <text x="133" y="340" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="180" y="292" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">底边行 i = 2：h = [3, 2, 0]</text>
  <text x="180" y="318" font-size="11.5" fill="#333" filter="url(#sk)">各右端点贡献：r=0 → 3；r=1 → 4；r=2 → 0</text>
  <text x="180" y="344" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">行贡献 = 7 ← 分胜负的一行，明细见下</text>

  <!-- detail box -->
  <rect x="20" y="368" width="640" height="128" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="340" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">底边行 i = 2 的扫描明细（h = [3, 2, 0]）</text>
  <line x1="40" y1="427" x2="640" y2="427" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <line x1="40" y1="453" x2="640" y2="453" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <text x="44" y="416" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">r = 0</text>
  <text x="130" y="416" font-size="12" fill="#333" filter="url(#sk)">l=0：mn = 3（高 1、2、3 各一个，都在列 [0,0]）</text>
  <text x="600" y="416" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">累计 3</text>
  <text x="44" y="442" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">r = 1</text>
  <text x="130" y="442" font-size="12" fill="#333" filter="url(#sk)">l=1：mn = 2；l=0：mn = min(2, 3) = 2</text>
  <text x="600" y="442" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">累计 2+2 = 4</text>
  <text x="44" y="468" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">r = 2</text>
  <text x="130" y="468" font-size="12" fill="#333" filter="url(#sk)">l=2：0；l=1：0；l=0：0（h[2]=0 把运行 min 压死）</text>
  <text x="600" y="468" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">累计 0</text>

  <!-- banner -->
  <rect x="20" y="506" width="640" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="524" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">总计 = 2 + 4 + 7 = 13 ✓（与官方解释的尺寸分布完全吻合）</text>
  <text x="340" y="540" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">直方图逐行滚动：遇 1 加一、遇 0 归零，一个 O(n) 数组用到底</text>
</svg>
