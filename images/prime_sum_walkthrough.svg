<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 20（答案 17）</text>

  <!-- header row -->
  <rect x="40" y="52" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k</text>
  <rect x="90" y="52" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">质数 p</text>
  <rect x="150" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s ← s + p</text>
  <rect x="230" y="52" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s ≤ 20 ?</text>
  <rect x="300" y="52" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">查表判素</text>
  <rect x="400" y="52" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- row 1 -->
  <rect x="40" y="82" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="82" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="82" width="80" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="82" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="300" y="82" width="100" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>
  <rect x="400" y="82" width="80" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <rect x="40" y="112" width="50" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="90" y="112" width="60" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="150" y="112" width="80" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="112" width="70" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="300" y="112" width="100" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>
  <rect x="400" y="112" width="80" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- row 3 -->
  <rect x="40" y="142" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="90" y="142" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="150" y="142" width="80" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="230" y="142" width="70" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="300" y="142" width="100" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 10 = 2×5</text>
  <rect x="400" y="142" width="80" height="30" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- row 4 (answer) -->
  <rect x="40" y="172" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="90" y="172" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="150" y="172" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <rect x="230" y="172" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="300" y="172" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 质数</text>
  <rect x="400" y="172" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">17</text>

  <!-- row 5 (overflow break) -->
  <rect x="40" y="202" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="90" y="202" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="150" y="202" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">28</text>
  <rect x="230" y="202" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="222" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 越界</text>
  <rect x="300" y="202" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="222" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—（不查表）</text>
  <rect x="400" y="202" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>

  <!-- note boxes -->
  <rect x="40" y="254" width="440" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = 28 &gt; 20 → break：后面的前缀和只会更大</text>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">且必须先 break 再查表，否则 comp[28] 越界访问</text>

  <rect x="40" y="316" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">S_k 严格递增 ⇒ ans 每次被更大的质数前缀和覆盖</text>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最后一次更新（k = 4 的 17）即最终答案 ✓</text>
</svg>
