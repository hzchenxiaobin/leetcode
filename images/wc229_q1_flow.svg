<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="227" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="620" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单索引 k 一轮循环统一两阶段</text>
  <path d="M 200 36 Q 340 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="58" rx="40" ry="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">开始</text>
  <path d="M 300 74 L 300 86" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="225" y="88" width="150" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="108" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">res = [], k = 0</text>
  <path d="M 300 118 L 300 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形1：循环条件 -->
  <g filter="url(#sk)">
    <polygon points="300,134 425,180 300,226 175,180" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="185" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">k &lt; max(n1, n2) ?</text>

  <!-- 否分支：返回 -->
  <path d="M 425 180 L 505 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="455" y="172" text-anchor="middle" font-size="12" fill="#a04348" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="505" y="163" width="140" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="575" y="184" text-anchor="middle" font-size="13" fill="#a04348" font-family="monospace" font-weight="bold">return join(res)</text>
  <path d="M 575 197 L 575 213" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="575" cy="231" rx="38" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="575" y="236" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">结束</text>

  <!-- 是分支向下 -->
  <path d="M 300 226 L 300 244" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="240" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- 菱形2：k < n1 ? -->
  <g filter="url(#sk)">
    <polygon points="300,248 415,294 300,340 185,294" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="299" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">k &lt; n1 ?</text>

  <!-- 否绕行1：跳过追加 word1，直达菱形3 -->
  <path d="M 185 294 L 110 294 L 110 408 L 288 408" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="286" text-anchor="middle" font-size="12" fill="#a04348" font-weight="bold">否</text>

  <!-- 是：追加 word1[k] -->
  <path d="M 300 340 L 300 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="352" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="210" y="358" width="180" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="300" y="379" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">res += word1[k]</text>
  <path d="M 300 390 L 300 404" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形3：k < n2 ? -->
  <g filter="url(#sk)">
    <polygon points="300,408 415,454 300,500 185,454" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="459" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">k &lt; n2 ?</text>

  <!-- 否绕行2：跳过追加 word2，直达 k += 1 -->
  <path d="M 185 454 L 75 454 L 75 581 L 208 581" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="446" text-anchor="middle" font-size="12" fill="#a04348" font-weight="bold">否</text>

  <!-- 是：追加 word2[k] -->
  <path d="M 300 500 L 300 516" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="512" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="210" y="518" width="180" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="300" y="539" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">res += word2[k]</text>
  <path d="M 300 550 L 300 564" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- k += 1 -->
  <g filter="url(#sk)">
    <rect x="215" y="566" width="170" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="586" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">k += 1</text>

  <!-- 回路：回到循环条件 -->
  <path d="M 385 581 L 655 581 L 655 203 L 372 203" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="395" text-anchor="middle" font-size="12" fill="#666" transform="rotate(-90 600 395)">回到循环条件</text>
</svg>
