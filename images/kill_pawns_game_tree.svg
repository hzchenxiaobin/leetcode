<svg xmlns="http://www.w3.org/2000/svg" width="940" height="830" viewBox="0 0 940 830" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="830" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 博弈树：马在 (0,2)，兵 A(1,1)、B(2,2)、C(3,3)</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g font-size="11" fill="#666">
    <g filter="url(#sk)"><circle cx="330" cy="64" r="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
    <text x="346" y="68">Alice（max，拖长）</text>
    <g filter="url(#sk)"><circle cx="520" cy="64" r="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <text x="536" y="68">Bob（min，速通）</text>
    <g filter="url(#sk)"><rect x="676" y="54" width="20" height="14" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="702" y="68">终局合计</text>
  </g>

  <!-- ===== edges root -> L1 ===== -->
  <path d="M 445 158 Q 260 225 185 306" stroke="#c9a04a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 171 L 470 303" stroke="#4a8e4a" stroke-width="2.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 495 158 Q 680 225 755 306" stroke="#c9a04a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="245" y="228" font-size="11" fill="#7a5415" font-weight="bold">吃 A(1,1) +2</text>
  <text x="484" y="244" font-size="11" fill="#2e6e2e" font-weight="bold">吃 B(2,2) +2 ★</text>
  <text x="632" y="228" font-size="11" fill="#7a5415" font-weight="bold">吃 C(3,3) +2</text>

  <!-- ===== edges L1 -> leaves ===== -->
  <g stroke="#7a9ec4" stroke-width="1.6" fill="none" filter="url(#sk)">
    <path d="M 152 358 Q 100 435 87 514" marker-end="url(#ar)"/>
    <path d="M 188 358 Q 240 435 253 514" marker-end="url(#ar)"/>
    <path d="M 752 358 Q 700 435 687 514" marker-end="url(#ar)"/>
    <path d="M 788 358 Q 840 435 853 514" marker-end="url(#ar)"/>
  </g>
  <g stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)">
    <path d="M 452 358 Q 400 435 387 514" marker-end="url(#arG)"/>
    <path d="M 488 358 Q 540 435 553 514" marker-end="url(#arG)"/>
  </g>
  <g font-size="10.5" fill="#446688">
    <text x="86" y="452">选 B +2</text><text x="232" y="452" text-anchor="end">选 C +4</text>
    <text x="398" y="452" fill="#2e6e2e" font-weight="bold">选 A +2</text><text x="548" y="452" fill="#2e6e2e" font-weight="bold" text-anchor="end">选 C +2</text>
    <text x="690" y="452">选 A +4</text><text x="848" y="452" text-anchor="end">选 B +2</text>
  </g>

  <!-- ===== root node ===== -->
  <g filter="url(#sk)"><circle cx="470" cy="135" r="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="470" y="132" text-anchor="middle" font-size="11" fill="#7a5415">Alice</text>
  <text x="470" y="148" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">8</text>
  <text x="416" y="120" text-anchor="end" font-size="10" fill="#888">max(6, 8, 6) =</text>

  <!-- ===== L1 Bob nodes ===== -->
  <g filter="url(#sk)"><circle cx="170" cy="335" r="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="170" y="332" text-anchor="middle" font-size="10" fill="#2b6e9e">Bob</text>
  <text x="170" y="346" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">6</text>
  <text x="170" y="296" text-anchor="middle" font-size="10" fill="#888">min(6, 8)</text>

  <g filter="url(#sk)"><circle cx="470" cy="335" r="28" fill="#e8f0fa" stroke="#4a8e4a" stroke-width="2.4"/></g>
  <text x="470" y="332" text-anchor="middle" font-size="10" fill="#2b6e9e">Bob</text>
  <text x="470" y="346" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">8</text>
  <text x="470" y="296" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">min(8, 8) ★</text>

  <g filter="url(#sk)"><circle cx="770" cy="335" r="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="770" y="332" text-anchor="middle" font-size="10" fill="#2b6e9e">Bob</text>
  <text x="770" y="346" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">6</text>
  <text x="770" y="296" text-anchor="middle" font-size="10" fill="#888">min(8, 6)</text>

  <!-- ===== leaf boxes ===== -->
  <!-- box1: x 85 -->
  <g filter="url(#sk)"><rect x="10" y="520" width="150" height="118" rx="6" fill="#eaf6ee" stroke="#9ec99e" stroke-width="1.3"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="85" y="548">Bob 吃 B(2,2) +2</text>
    <text x="85" y="568">Alice 吃 C(3,3) +2</text>
    <text x="85" y="604" font-size="12" fill="#2b6e9e" font-weight="bold">合计 6</text>
  </g>
  <!-- box2: x 255 -->
  <g filter="url(#sk)"><rect x="180" y="520" width="150" height="118" rx="6" fill="#eaf6ee" stroke="#9ec99e" stroke-width="1.3"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="255" y="548">Bob 吃 C(3,3) +4</text>
    <text x="255" y="568">Alice 吃 B(2,2) +2</text>
    <text x="255" y="604" font-size="12" fill="#2b6e9e" font-weight="bold">合计 8</text>
  </g>
  <!-- box3: x 385 -->
  <g filter="url(#sk)"><rect x="310" y="520" width="150" height="118" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="385" y="548">Bob 吃 A(1,1) +2</text>
    <text x="385" y="568">Alice 吃 C(3,3) +4</text>
    <text x="385" y="604" font-size="12" fill="#2e6e2e" font-weight="bold">合计 8</text>
  </g>
  <!-- box4: x 555 -->
  <g filter="url(#sk)"><rect x="480" y="520" width="150" height="118" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="555" y="548">Bob 吃 C(3,3) +2</text>
    <text x="555" y="568">Alice 吃 A(1,1) +4</text>
    <text x="555" y="604" font-size="12" fill="#2e6e2e" font-weight="bold">合计 8</text>
  </g>
  <!-- box5: x 685 -->
  <g filter="url(#sk)"><rect x="610" y="520" width="150" height="118" rx="6" fill="#eaf6ee" stroke="#9ec99e" stroke-width="1.3"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="685" y="548">Bob 吃 A(1,1) +4</text>
    <text x="685" y="568">Alice 吃 B(2,2) +2</text>
    <text x="685" y="604" font-size="12" fill="#2b6e9e" font-weight="bold">合计 8</text>
  </g>
  <!-- box6: x 855 -->
  <g filter="url(#sk)"><rect x="780" y="520" width="150" height="118" rx="6" fill="#eaf6ee" stroke="#9ec99e" stroke-width="1.3"/></g>
  <g font-size="10.5" fill="#444" text-anchor="middle">
    <text x="855" y="548">Bob 吃 B(2,2) +2</text>
    <text x="855" y="568">Alice 吃 A(1,1) +2</text>
    <text x="855" y="604" font-size="12" fill="#2b6e9e" font-weight="bold">合计 6</text>
  </g>

  <!-- ===== conclusion ===== -->
  <g filter="url(#sk)"><rect x="60" y="666" width="820" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="692" font-size="12" font-weight="bold" fill="#2b2b2b">为什么 Alice 偏偏先吃「中间」的 B(2,2)？</text>
  <text x="80" y="716" font-size="11" fill="#444">★ 吃掉 B 后，剩下的 A(1,1)、C(3,3) 相隔 4 步（对角 2+2 型距离）；无论 Bob 先吃哪个，</text>
  <text x="96" y="734" font-size="11" fill="#444">最后一跳 A↔C 都逃不掉 → 总步数锁死为 8。</text>
  <text x="80" y="758" font-size="11" fill="#444">★ 若 Alice 先吃 A 或 C，Bob 立刻吃掉对角另一端，把「4」斩成两个「2」→ 只剩 6。</text>
  <text x="80" y="782" font-size="11" fill="#7a2828" font-weight="bold">★ 局部贪心（每回合挑当前最远的兵）不可靠：Alice 的选择会改变 Bob 后续的选择空间，必须整树 minimax。</text>
</svg>
