<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="350" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">两个方向各扫一遍，答案取最小（示例 1 演算）</text>
  <rect x="46" y="66" width="290" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="191" y="92" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">先陆地，再水上游乐</text>
  <text x="191" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">minLandFinish = 6</text>
  <text x="191" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j=0：max(6, 6) + 3 = 9</text>
  <text x="191" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ 9</text>
  <rect x="364" y="66" width="290" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="509" y="92" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">先水上游乐，再陆地</text>
  <text x="509" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">minWaterFinish = 9</text>
  <text x="509" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=0：max(9, 2) + 4 = 13</text>
  <text x="509" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=1：max(9, 8) + 1 = 10</text>
  <path d="M 341 125 L 360 125" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="46" y="206" width="608" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="232" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">答案 = min(9, 13, 10) = 9</text>
  <text x="350" y="254" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">（示例 2 同理：先水上游乐 max(11,5)+3 = 14 取胜）</text>
  <rect x="46" y="282" width="608" height="52" rx="10" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="314" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个方向 O(n + m)，总计 O(n + m)，n,m ≤ 5·10^4</text>
</svg>
