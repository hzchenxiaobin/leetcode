<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 走查：nums1=[4,3,1,4] → nums2=[1,3,7,1]，k=3</text>

  <!-- 初始状态 -->
  <text x="70" y="66" font-size="13" fill="#666" filter="url(#rough2)">初始：d = nums2 − nums1 = [−3, 0, +6, −3]（都是 3 的倍数 ✓，Σd = 0 ✓）</text>
  <g filter="url(#rough2)">
    <rect x="100" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="156" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="80" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="268" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="126" y="101" fill="#446688">4</text><text x="182" y="101">3</text>
    <text x="238" y="101" fill="#b85450" font-weight="bold">1</text><text x="294" y="101" fill="#446688">4</text>
  </g>
  <text x="340" y="101" font-size="12" fill="#666" filter="url(#rough2)">→ 目标 [1, 3, 7, 1]</text>

  <!-- 操作 1 -->
  <text x="70" y="152" font-size="13" fill="#666" filter="url(#rough2)">操作 ①：i=2, j=0 → nums1[2] += 3，nums1[0] −= 3</text>
  <g filter="url(#rough2)">
    <rect x="100" y="166" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="156" y="166" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="166" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="268" y="166" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="126" y="187" fill="#2d5a22">1</text><text x="182" y="187">3</text>
    <text x="238" y="187" fill="#2d5a22">4</text><text x="294" y="187">4</text>
  </g>
  <text x="340" y="187" font-size="12" fill="#2d5a22" filter="url(#rough2)">位置 0、2 配平 ✓</text>

  <!-- 操作 2 -->
  <text x="70" y="238" font-size="13" fill="#666" filter="url(#rough2)">操作 ②：i=2, j=3 → nums1[2] += 3，nums1[3] −= 3</text>
  <g filter="url(#rough2)">
    <rect x="100" y="252" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="156" y="252" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="212" y="252" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="268" y="252" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle" font-weight="bold">
    <text x="126" y="273">1</text><text x="182" y="273">3</text>
    <text x="238" y="273">7</text><text x="294" y="273">1</text>
  </g>
  <text x="340" y="273" font-size="12" fill="#2d5a22" filter="url(#rough2)">全部等于目标 ✓</text>

  <!-- 结论 -->
  <rect x="100" y="312" width="360" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="330">pos = 6/3 = 2，neg = 3/3 + 3/3 = 2，pos = neg → 答案 2</text>
    <text x="280" y="348">势函数 Φ=Σ|d|=12，每步至多降 2k=6 → 至少 2 步（下界即答案）</text>
  </g>
</svg>
