<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [2,3,1,5,4]</text>
  <text x="60" y="88" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">原数组</text>
  <rect x="170" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191.0" y="87.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="216" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237.0" y="87.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="262" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283.0" y="87.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="308" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329.0" y="87.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="354" y="66" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375.0" y="87.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="118" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">值 = 1+2+4+1 = 8</text>
  <text x="60" y="172" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">翻转 [1..3]</text>
  <rect x="170" y="150" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191.0" y="171.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="216" y="150" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237.0" y="171.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="262" y="150" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283.0" y="171.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="308" y="150" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329.0" y="171.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="354" y="150" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375.0" y="171.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="202" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">值 = 3+4+2+1 = 10</text>
  <rect x="60" y="236" width="400" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="254" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">逐项对比</text>
  <text x="72" y="270" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">被翻转段内部的相邻差 (1,2,4) 只是换了方向，值不变：</text>
  <text x="72" y="285" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  |2−3| + |3−1| + |1−5| = 1+2+4</text>
  <text x="72" y="300" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">翻转后：|2−5| + |5−1| + |1−3| = 3+4+2</text>
  <text x="72" y="315" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">边界贡献从 |2−3|+|5−4| = 1+1 变为 |2−5|+|1−4| = 3+3。</text>
</svg>
