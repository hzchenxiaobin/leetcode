<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：前缀移除集合嵌套 ⇒ 可行 k 构成前缀区间</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="48" y="64" font-size="11" fill="#888">绿 = 可行 ✓ · 红 = 不可行 ✗</text>

  <!-- ① nested removal sets -->
  <text x="48" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">① 移除集合按「前缀」嵌套（示例 1）</text>
  <g filter="url(#sk)">
    <rect x="48" y="98" width="78" height="26" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="148" y="98" width="92" height="26" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="262" y="98" width="108" height="26" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="87" y="116" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">D₁ = {3}</text>
  <text x="136" y="117" text-anchor="middle" font-size="15" fill="#7a5415">⊂</text>
  <text x="194" y="116" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">D₂ = {1,3}</text>
  <text x="252" y="117" text-anchor="middle" font-size="15" fill="#7a5415">⊂</text>
  <text x="316" y="116" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">D₃ = {0,1,3}</text>
  <text x="48" y="144" font-size="11" fill="#666">k 增大 ⇒ 删得更多，保留集合 R₁ ⊃ R₂ ⊃ R₃ 是嵌套链</text>

  <!-- ② prefix number line -->
  <text x="48" y="172" font-size="13" font-weight="bold" fill="#2b2b2b">② 可行 k 恰构成前缀 {0, …, k*}</text>
  <g filter="url(#sk)">
    <path d="M 70 216 L 224 216" stroke="#4a8e4a" stroke-width="5" stroke-linecap="round"/>
    <path d="M 236 216 L 378 216" stroke="#b85450" stroke-width="5" stroke-linecap="round"/>
    <path d="M 230 192 L 230 238" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M 70 210 L 70 222" stroke="#3a3a3a" stroke-width="1.6"/>
    <path d="M 378 210 L 378 222" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="230" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">k*</text>
  <text x="70" y="236" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">0</text>
  <text x="378" y="236" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">m</text>
  <text x="147" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0..k* 全可行 ✓</text>
  <text x="307" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">k*+1..m 全不可行 ✗</text>
  <text x="48" y="256" font-size="11" fill="#666">k = 0 恒可行（题设 p 是 s 的子序列）⇒ 可行集是非空前缀</text>

  <!-- ③ binary search action -->
  <text x="48" y="286" font-size="13" font-weight="bold" fill="#2b2b2b">③ 在 [0, m] 上二分定位分界点 k*</text>
  <g filter="url(#sk)">
    <rect x="48" y="296" width="168" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="232" y="296" width="156" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="132" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">check(mid) ✓</text>
  <text x="132" y="331" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">ans = mid，lo = mid+1</text>
  <text x="310" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" font-family="monospace">check(mid) ✗</text>
  <text x="310" y="331" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">hi = mid − 1</text>
  <text x="48" y="360" font-size="11" fill="#444">每轮 O(|s|) 双指针验证，共 O(log m) 轮 ⇒ 总 O(|s| log m)</text>
  <text x="48" y="378" font-size="11" fill="#888">|s| ≤ 10⁵，log m ≈ 17，约 1.7 × 10⁶ 次字符比较，轻松通过</text>

  <!-- right observation boxes -->
  <g filter="url(#sk)">
    <rect x="430" y="60" width="226" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="543" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">观察① 保留集合单调</text>
  <text x="543" y="106" text-anchor="middle" font-size="11" fill="#444">k′ ≤ k ⇒ 删得更少</text>
  <text x="543" y="124" text-anchor="middle" font-size="11" fill="#444">保留字符集合是超集</text>
  <text x="543" y="146" text-anchor="middle" font-size="11" fill="#666">子序列只可能更容易保持</text>
  <g filter="url(#sk)">
    <rect x="430" y="172" width="226" height="108" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="543" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察② 嵌入可复用</text>
  <text x="543" y="220" text-anchor="middle" font-size="11" fill="#444">k 可行时的匹配位置序列</text>
  <text x="543" y="242" text-anchor="middle" font-size="11" fill="#444">在 k′ ≤ k 时全部仍然有效</text>
  <text x="543" y="264" text-anchor="middle" font-size="11" fill="#666">⇒ 更小的 k 全可行（引理 1）</text>
  <g filter="url(#sk)">
    <rect x="430" y="294" width="226" height="102" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="543" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">观察③ 二段性 ⇒ 二分</text>
  <text x="543" y="340" text-anchor="middle" font-size="11" fill="#444">可行集向下封闭且含 0</text>
  <text x="543" y="360" text-anchor="middle" font-size="11" fill="#444">⇒ 恰为 {0, 1, …, k*}</text>
  <text x="543" y="382" text-anchor="middle" font-size="11" fill="#666">「最大可行值」→ 二分答案模板</text>
</svg>
