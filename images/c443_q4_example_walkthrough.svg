<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：滑动求出 7 个窗口代价，DP 选出不相交两窗</text>
  <path d="M 150 33 Q 360 40 570 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组 -->
  <g filter="url(#sk)">
    <rect x="80" y="48" width="60" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="140" y="48" width="60" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="200" y="48" width="60" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="260" y="48" width="60" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="320" y="48" width="60" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="380" y="48" width="60" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="440" y="48" width="60" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="500" y="48" width="60" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="560" y="48" width="60" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="110" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="170" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">−2</text>
  <text x="230" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="290" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="350" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="410" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="470" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">6</text>
  <text x="530" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="590" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">−1</text>
  <text x="110" y="102" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="170" y="102" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="230" y="102" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="290" y="102" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="350" y="102" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="410" y="102" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="470" y="102" text-anchor="middle" font-size="9.5" fill="#999">6</text>
  <text x="530" y="102" text-anchor="middle" font-size="9.5" fill="#999">7</text>
  <text x="590" y="102" text-anchor="middle" font-size="9.5" fill="#999">8</text>

  <!-- 两个选中窗口的括号 -->
  <g filter="url(#sk)">
    <rect x="140" y="116" width="180" height="20" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="380" y="116" width="180" height="20" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="230" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">选中 s=1 → 调成 [1,1,1]（代价 5）</text>
  <text x="470" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6b1f">选中 s=5 → 调成 [4,4,4]（代价 3）</text>

  <!-- 代价表 -->
  <text x="66" y="180" font-size="11" fill="#666">cost</text>
  <g filter="url(#sk)">
    <rect x="80" y="156" width="60" height="36" rx="6" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="140" y="156" width="60" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="200" y="156" width="60" height="36" rx="6" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="260" y="156" width="60" height="36" rx="6" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="320" y="156" width="60" height="36" rx="6" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="380" y="156" width="60" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="440" y="156" width="60" height="36" rx="6" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="110" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="170" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="230" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">6</text>
  <text x="290" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="350" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="410" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6b1f">3</text>
  <text x="470" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="110" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=0</text>
  <text x="170" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=1</text>
  <text x="230" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=2</text>
  <text x="290" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=3</text>
  <text x="350" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=4</text>
  <text x="410" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=5</text>
  <text x="470" y="208" text-anchor="middle" font-size="9.5" fill="#999">s=6</text>
  <path d="M 170 152 C 170 146, 200 144, 220 140" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 152 C 410 146, 440 144, 460 140" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- DP 演算 -->
  <g filter="url(#sk)">
    <rect x="40" y="222" width="640" height="152" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="360" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">j = 1 行（前缀最小）：dp₁[5] = min(7,5,6,4,4) = 5，来自窗口 s=1</text>
  <text x="360" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">j = 2 行：dp₂[i] = min(dp₂[i−1], dp₁[i−3] + cost[i−3])</text>
  <g filter="url(#sk)">
    <rect x="200" y="282" width="70" height="30" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="290" y="282" width="70" height="30" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="380" y="282" width="70" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="470" y="282" width="70" height="30" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="235" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">11</text>
  <text x="325" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">9</text>
  <text x="415" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">8</text>
  <text x="505" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">8</text>
  <text x="235" y="326" text-anchor="middle" font-size="10" fill="#999">i=6</text>
  <text x="325" y="326" text-anchor="middle" font-size="10" fill="#999">i=7</text>
  <text x="415" y="326" text-anchor="middle" font-size="10" fill="#999">i=8</text>
  <text x="505" y="326" text-anchor="middle" font-size="10" fill="#999">i=9</text>
  <text x="360" y="350" text-anchor="middle" font-size="12" fill="#7a5415">dp₂[8] = dp₁[5] + cost[5] = 5 + 3 = 8（s=1、s=5 恰好不相交）</text>
  <text x="360" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">答案 dp[n][k] = dp₂[9] = 8 ✓（贪心选两个最便宜的 s=3、s=5 会重叠，DP 才能全局最优）</text>

  <text x="360" y="408" text-anchor="middle" font-size="11.5" fill="#666">提示：代价最小的两个窗口 s=5（3）与 s=3 / s=4（4）均与 s=5 重叠，组合 7 不可行 —— DP 全局权衡后取 s=1 + s=5</text>
  <g filter="url(#sk)">
    <rect x="150" y="420" width="420" height="42" rx="10" fill="#f0f7ff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="360" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b8f">两个选中子数组相邻（1..3 与 5..7）是允许的：「不相交」不要求中间留空位</text>
</svg>
