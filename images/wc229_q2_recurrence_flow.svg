<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="523" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟预处理 + 一趟递推</text>
  <path d="M 210 34 Q 340 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="60" rx="38" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="65" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">开始</text>
  <path d="M 300 75 L 300 87" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="172" y="89" width="256" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-family="monospace">
    <text x="300" y="106" text-anchor="middle">total ← 球总数；answer[0] ← 球位置和</text>
    <text x="300" y="124" text-anchor="middle">left ← (boxes[0]=='1')；i ← 1</text>
  </g>
  <path d="M 300 133 L 300 149" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形：i < n ? -->
  <g filter="url(#sk)">
    <polygon points="300,153 428,197 300,241 172,197" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="202" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">i &lt; n ?</text>

  <!-- 否分支：返回 -->
  <path d="M 428 197 L 500 197" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="189" text-anchor="middle" font-size="12" fill="#a04348" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="500" y="180" width="142" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="571" y="201" text-anchor="middle" font-size="13" fill="#a04348" font-family="monospace" font-weight="bold">return answer</text>
  <path d="M 571 214 L 571 227" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="571" cy="243" rx="36" ry="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="571" y="248" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">结束</text>

  <!-- 是分支：递推 -->
  <path d="M 300 241 L 300 256" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="253" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="183" y="260" width="234" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" fill="#2e6e2e" font-family="monospace">
    <text x="300" y="279" text-anchor="middle">answer[i] = answer[i−1]</text>
    <text x="300" y="298" text-anchor="middle">+ left − (total − left)</text>
  </g>
  <path d="M 300 306 L 300 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="188" y="322" width="224" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="300" y="342" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">若 boxes[i]=='1'：left += 1</text>
  <path d="M 300 352 L 300 364" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="252" y="368" width="96" height="28" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="387" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">i += 1</text>

  <!-- 回路 -->
  <path d="M 348 382 L 658 382 L 658 222 L 362 222" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="644" y="302" text-anchor="middle" font-size="12" fill="#666" transform="rotate(-90 644 302)">回到循环条件</text>

  <!-- 左侧注释框 -->
  <g filter="url(#sk)">
    <rect x="25" y="264" width="138" height="76" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <g font-size="11" fill="#7a5415">
    <text x="94" y="286" text-anchor="middle">Δ = L − R</text>
    <text x="94" y="304" text-anchor="middle">其中 R = total − L</text>
    <text x="94" y="322" text-anchor="middle">每轮仅 O(1) 开销</text>
  </g>
</svg>
