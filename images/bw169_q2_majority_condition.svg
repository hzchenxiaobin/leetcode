<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">判定式：2 × cnt &gt; len（严格大于）</text>

  <!-- 数组格子 -->
  <text x="60" y="52" font-size="11" fill="#999" filter="url(#rough2)">nums =</text>

  <rect x="90" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="118" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−1</text>

  <rect x="150" y="62" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="178" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="210" y="62" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="238" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="270" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="298" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−1</text>

  <text x="340" y="88" font-size="11" fill="#4a7a3a" filter="url(#rough2)">target = 2 的格子记 +1</text>
  <text x="340" y="106" font-size="11" fill="#446688" filter="url(#rough2)">其余记 −1</text>

  <!-- 绿色示例 -->
  <rect x="60" y="146" width="190" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,2,3]：cnt=2, len=3</text>
  <text x="155" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2×2 = 4 &gt; 3 ✓ 主要元素</text>

  <!-- 红色示例 -->
  <rect x="280" y="146" width="190" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="375" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,2,2,3]：cnt=2, len=4</text>
  <text x="375" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2×2 = 4 ≯ 4 ✗ 平局不算</text>

  <!-- 权重和视角 -->
  <rect x="60" y="228" width="410" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="265" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">等价改写：区间权重和 Σw = cnt − (len − cnt) = 2·cnt − len</text>
  <text x="265" y="276" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">「target 是主要元素」⟺「Σw &gt; 0」</text>
</svg>
