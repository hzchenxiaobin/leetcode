<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">官方示例走查：value = 4，k = 3</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="50" width="210" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="50" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="450" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="70">调用</text><text x="145" y="70">num</text>
    <text x="285" y="70">数据流（尾 3 个为窗口）</text>
    <text x="420" y="70">cnt</text><text x="490" y="70">返回</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="70" height="42" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="110" y="84" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="390" y="84" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="450" y="84" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="180" y="90" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="109">consec¹</text><text x="145" y="109">4</text>
    <text x="200" y="109">4</text>
    <text x="420" y="109">1</text><text x="490" y="109">false</text>
  </g>
  <text x="240" y="109" font-size="11" fill="#666" filter="url(#rough2)">← 流里只有 1 个数，不足 k</text>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="130" width="70" height="42" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="110" y="130" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="390" y="130" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="450" y="130" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="180" y="136" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="222" y="136" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="155">consec²</text><text x="145" y="155">4</text>
    <text x="200" y="155">4</text><text x="242" y="155">4</text>
    <text x="420" y="155">2</text><text x="490" y="155">false</text>
  </g>
  <text x="282" y="155" font-size="11" fill="#666" filter="url(#rough2)">← 2 &lt; k = 3，仍不足</text>

  <!-- 行 3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="70" height="42" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="110" y="176" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="390" y="176" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="450" y="176" width="80" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="180" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="222" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="264" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="201">consec³</text><text x="145" y="201">4</text>
    <text x="200" y="201">4</text><text x="242" y="201">4</text><text x="284" y="201">4</text>
    <text x="420" y="201">3</text><text x="490" y="201">true</text>
  </g>
  <text x="324" y="201" font-size="11" fill="#2d5a22" filter="url(#rough2)">← cnt 达到 3，窗口全命中</text>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="222" width="70" height="42" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="110" y="222" width="70" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="390" y="222" width="60" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="450" y="222" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="180" y="228" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="222" y="228" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="228" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="306" y="228" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="75" y="247">consec⁴</text><text x="145" y="247">3</text>
    <text x="200" y="247">4</text><text x="242" y="247">4</text><text x="284" y="247">4</text><text x="326" y="247">3</text>
    <text x="420" y="247">0</text><text x="490" y="247">false</text>
  </g>
  <text x="366" y="247" font-size="11" fill="#b85450" filter="url(#rough2)">← 异类，cnt 直接归零</text>

  <!-- 小结 -->
  <rect x="70" y="288" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">返回 false, false, true, false —— 与官方输出一致</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（注意先更新 cnt 再比较 cnt ≥ k，顺序不能反）</text>
</svg>
