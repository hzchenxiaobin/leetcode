<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="396" fill="#fafafa"/>

  <text x="380" y="31" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：算 c → 排序去重 → 扫最长连续段</text>
  <path d="M 130 41 Q 380 48 630 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 四个步骤框 -->
  <rect x="36" y="56" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="111" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 算 cᵢ = aᵢ − i</text>
  <text x="111" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">O(n)</text>

  <rect x="216" y="56" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="291" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 排序 + 去重</text>
  <text x="291" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">O(n log n)</text>

  <rect x="396" y="56" width="150" height="70" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="471" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">③ 看相邻差是否 1</text>
  <text x="471" y="106" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">差 1 则 cur++，否则 cur = 1</text>

  <rect x="576" y="56" width="150" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="651" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">④ 取 cur 的最大值</text>
  <text x="651" y="106" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">这就是答案，一组 O(1)</text>

  <path d="M 188 91 L 212 91" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 368 91 L 392 91" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 548 91 L 572 91" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 例子：去重后的 c -->
  <text x="44" y="172" font-size="12" fill="#2b2b2b" filter="url(#rough2)">例：去重后 c = {3, 4, 5, 7, 8}，最长连续段长度 3</text>

  <rect x="130" y="186" width="52" height="36" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="194" y="186" width="52" height="36" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="258" y="186" width="52" height="36" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="284" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <rect x="330" y="186" width="52" height="36" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7</text>
  <rect x="394" y="186" width="52" height="36" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>

  <path d="M 130 232 L 130 240 L 310 240 L 310 232" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="220" y="258" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">长 3 ← 答案</text>
  <path d="M 330 232 L 330 240 L 446 240 L 446 232" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="388" y="258" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">长 2</text>

  <!-- 右侧：连续的 c 一定能摆出来 -->
  <rect x="470" y="150" width="250" height="126" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="488" y="176" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">连续 L 个 c 一定摆得出来</text>
  <text x="488" y="200" font-size="11" fill="#a14340" filter="url(#rough2)">按 c 降序放进位置 1 … L：</text>
  <text x="488" y="222" font-size="11" fill="#a14340" filter="url(#rough2)">第 1+t 位放 c = k + L − 1 − t，</text>
  <text x="488" y="244" font-size="11" fill="#a14340" filter="url(#rough2)">高度 = c + 位置 = k + L，全相等。</text>
  <text x="488" y="266" font-size="10.5" fill="#b85450" filter="url(#rough2)">（任意排列都可达，见引理 3）</text>

  <!-- 结论条 -->
  <rect x="40" y="296" width="680" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="12" fill="#8a6015" filter="url(#rough2)">上界：等高段里位置每 +1、高度不变 ⇒ c 必须 −1，所以只能是一段连续且互异的整数。</text>
  <text x="58" y="348" font-size="12" fill="#8a6015" filter="url(#rough2)">下界：反过来一段连续互异的 c 按降序摆就真的等高 ⇒ 两者等价，答案 = 最长连续段长度。</text>
</svg>
