<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：depth 随扫描位置的变化（示例 1）</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- gridlines -->
  <path d="M 58 70 L 606 70" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 58 110 L 606 110" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 58 150 L 606 150" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 58 190 L 606 190" stroke="#3a3a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="46" y="54" font-size="12" font-style="italic" fill="#666666">depth</text>
  <text x="46" y="74" text-anchor="end" font-size="12" fill="#666666">3</text>
  <text x="46" y="114" text-anchor="end" font-size="12" fill="#666666">2</text>
  <text x="46" y="154" text-anchor="end" font-size="12" fill="#666666">1</text>
  <text x="46" y="194" text-anchor="end" font-size="12" fill="#666666">0</text>

  <!-- step path -->
  <path d="M 70 190 L 70 150 L 154 150 L 154 110 L 266 110 L 266 150 L 322 150 L 322 110 L 350 110 L 350 70 L 406 70 L 406 110 L 490 110 L 490 150 L 518 150 L 518 190 L 602 190"
        stroke="#4a8edb" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <circle cx="70" cy="150" r="3.5" fill="#4a8edb"/>
  <circle cx="154" cy="110" r="3.5" fill="#4a8edb"/>
  <circle cx="266" cy="150" r="3.5" fill="#4a8edb"/>
  <circle cx="322" cy="110" r="3.5" fill="#4a8edb"/>
  <circle cx="350" cy="70" r="4.5" fill="#b85450"/>
  <circle cx="406" cy="110" r="3.5" fill="#4a8edb"/>
  <circle cx="490" cy="150" r="3.5" fill="#4a8edb"/>
  <circle cx="518" cy="190" r="3.5" fill="#4a8edb"/>

  <!-- peak highlight -->
  <rect x="344" y="58" width="68" height="24" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 416 70 L 452 64" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="458" y="68" font-size="13" font-weight="bold" fill="#b85450">ans = 3 ← 峰值</text>

  <!-- x-axis chars -->
  <text x="70" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8edb">(</text>
  <text x="98" y="210" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <text x="126" y="210" text-anchor="middle" font-size="12" fill="#333333">+</text>
  <text x="154" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">(</text>
  <text x="182" y="210" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <text x="210" y="210" text-anchor="middle" font-size="12" fill="#333333">*</text>
  <text x="238" y="210" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <text x="266" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">)</text>
  <text x="294" y="210" text-anchor="middle" font-size="12" fill="#333333">+</text>
  <text x="322" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">(</text>
  <text x="350" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">(</text>
  <text x="378" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">8</text>
  <text x="406" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">)</text>
  <text x="434" y="210" text-anchor="middle" font-size="12" fill="#333333">/</text>
  <text x="462" y="210" text-anchor="middle" font-size="12" fill="#333333">4</text>
  <text x="490" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">)</text>
  <text x="518" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8edb">)</text>
  <text x="546" y="210" text-anchor="middle" font-size="12" fill="#333333">+</text>
  <text x="574" y="210" text-anchor="middle" font-size="12" fill="#333333">1</text>

  <!-- event table -->
  <text x="56" y="232" font-size="12" fill="#555555">只列括号事件（8 步），其余字符全部跳过：</text>
  <g filter="url(#sk)">
    <rect x="56" y="240" width="528" height="218" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.2"/>
  </g>
  <rect x="58" y="363" width="524" height="22" fill="#fff8e1"/>
  <text x="95" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">步</text>
  <text x="175" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">字符</text>
  <text x="285" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">动作</text>
  <text x="402" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">depth</text>
  <text x="517" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">ans</text>
  <path d="M 62 268 Q 320 270 578 268" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 62 290 Q 320 292 578 290" stroke="#dddddd" stroke-width="1" fill="none"/>
  <path d="M 62 314 Q 320 316 578 314" stroke="#dddddd" stroke-width="1" fill="none"/>
  <path d="M 62 338 Q 320 340 578 338" stroke="#dddddd" stroke-width="1" fill="none"/>
  <path d="M 62 362 Q 320 364 578 362" stroke="#dddddd" stroke-width="1" fill="none"/>
  <path d="M 62 386 Q 320 388 578 386" stroke="#dddddd" stroke-width="1" fill="none"/>
  <path d="M 62 410 Q 320 412 578 410" stroke="#dddddd" stroke-width="1" fill="none"/>
  <path d="M 62 434 Q 320 436 578 434" stroke="#dddddd" stroke-width="1" fill="none"/>

  <text x="95" y="282" text-anchor="middle" font-size="12.5" fill="#333333">1</text>
  <text x="175" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8edb">(</text>
  <text x="285" y="282" text-anchor="middle" font-size="12.5" fill="#333333">depth+1，刷新 ans</text>
  <text x="402" y="282" text-anchor="middle" font-size="12.5" fill="#333333">1</text>
  <text x="517" y="282" text-anchor="middle" font-size="12.5" fill="#333333">1</text>

  <text x="95" y="306" text-anchor="middle" font-size="12.5" fill="#333333">2</text>
  <text x="175" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">(</text>
  <text x="285" y="306" text-anchor="middle" font-size="12.5" fill="#333333">depth+1，刷新 ans</text>
  <text x="402" y="306" text-anchor="middle" font-size="12.5" fill="#333333">2</text>
  <text x="517" y="306" text-anchor="middle" font-size="12.5" fill="#333333">2</text>

  <text x="95" y="330" text-anchor="middle" font-size="12.5" fill="#333333">3</text>
  <text x="175" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">)</text>
  <text x="285" y="330" text-anchor="middle" font-size="12.5" fill="#333333">depth−1</text>
  <text x="402" y="330" text-anchor="middle" font-size="12.5" fill="#333333">1</text>
  <text x="517" y="330" text-anchor="middle" font-size="12.5" fill="#333333">2</text>

  <text x="95" y="354" text-anchor="middle" font-size="12.5" fill="#333333">4</text>
  <text x="175" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">(</text>
  <text x="285" y="354" text-anchor="middle" font-size="12.5" fill="#333333">depth+1，刷新 ans</text>
  <text x="402" y="354" text-anchor="middle" font-size="12.5" fill="#333333">2</text>
  <text x="517" y="354" text-anchor="middle" font-size="12.5" fill="#333333">2</text>

  <text x="95" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">5</text>
  <text x="175" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">(</text>
  <text x="285" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">depth+1，刷新 ans</text>
  <text x="402" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">3</text>
  <text x="517" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">3 ← 峰值</text>

  <text x="95" y="402" text-anchor="middle" font-size="12.5" fill="#333333">6</text>
  <text x="175" y="402" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">)</text>
  <text x="285" y="402" text-anchor="middle" font-size="12.5" fill="#333333">depth−1</text>
  <text x="402" y="402" text-anchor="middle" font-size="12.5" fill="#333333">2</text>
  <text x="517" y="402" text-anchor="middle" font-size="12.5" fill="#333333">3</text>

  <text x="95" y="426" text-anchor="middle" font-size="12.5" fill="#333333">7</text>
  <text x="175" y="426" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8e4a">)</text>
  <text x="285" y="426" text-anchor="middle" font-size="12.5" fill="#333333">depth−1</text>
  <text x="402" y="426" text-anchor="middle" font-size="12.5" fill="#333333">1</text>
  <text x="517" y="426" text-anchor="middle" font-size="12.5" fill="#333333">3</text>

  <text x="95" y="450" text-anchor="middle" font-size="12.5" fill="#333333">8</text>
  <text x="175" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a8edb">)</text>
  <text x="285" y="450" text-anchor="middle" font-size="12.5" fill="#333333">depth−1</text>
  <text x="402" y="450" text-anchor="middle" font-size="12.5" fill="#333333">0</text>
  <text x="517" y="450" text-anchor="middle" font-size="12.5" fill="#333333">3</text>
</svg>
