<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Q4 的复杂度墙：m, n ≤ 10⁵ 把一切“盯着块 / 盯着区间”的做法挡在门外</text>
  <path d="M 90 40 Q 320 50 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- gridlines + y ticks (log scale: 10px per decade, baseline y=290 is 10^0) -->
  <g filter="url(#sk)">
    <line x1="70" y1="90"  x2="610" y2="90"  stroke="#dcdcdc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="70" y1="140" x2="610" y2="140" stroke="#dcdcdc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="70" y1="190" x2="610" y2="190" stroke="#dcdcdc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="70" y1="240" x2="610" y2="240" stroke="#dcdcdc" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="70" y1="290" x2="610" y2="290" stroke="#3a3a3a" stroke-width="1.6"/>
    <line x1="70" y1="90"  x2="70"  y2="290" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#777" text-anchor="end">
    <text x="62" y="94">10²⁰</text>
    <text x="62" y="144">10¹⁵</text>
    <text x="62" y="194">10¹⁰</text>
    <text x="62" y="244">10⁵</text>
    <text x="62" y="294">10⁰</text>
  </g>
  <text x="30" y="200" font-size="12" fill="#777" transform="rotate(-90 30 200)" text-anchor="middle">操作量（对数刻度）</text>

  <!-- 1-second reference line -->
  <g filter="url(#sk)">
    <line x1="70" y1="205" x2="610" y2="205" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="604" y="197" text-anchor="end" font-size="11" fill="#b85450">1 秒 ≈ 10⁸⁻⁹ 次基本操作，线上即超时</text>

  <!-- bars -->
  <g filter="url(#sk)">
    <rect x="100" y="90"  width="95" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="228" y="190" width="95" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="356" y="225" width="95" height="65"  fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="484" y="237" width="95" height="53"  fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="147" y="80" fill="#b85450">≈10²⁰ ✗</text>
    <text x="275" y="180" fill="#a06a20">≈10¹⁰ ✗</text>
    <text x="403" y="215" fill="#2e6e2e">≈3×10⁶ ✓</text>
    <text x="531" y="227" fill="#2e6e2e">≈2×10⁵ ✓</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#2b2b2b">
    <text x="147" y="310">区间 DP</text>
    <text x="275" y="310">模拟每块</text>
    <text x="403" y="310">排序 + 归并</text>
    <text x="531" y="310">桶 + 闭式</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#777">
    <text x="147" y="326">状态数 m²n²</text>
    <text x="275" y="326">≥ mn = 10¹⁰</text>
    <text x="403" y="326">(m+n)·log(m+n)</text>
    <text x="531" y="326">O(m+n+C)</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="560" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" fill="#2b6e9e">m = n = 10⁵ 时蛋糕最终有 10¹⁰ 块 —— 任何“盯着块”的做法连遍历都做不到</text>
  <text x="320" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">必须“只看线”：让答案成为两条开销表的函数（闭式），规模再大也只是求和</text>
</svg>
