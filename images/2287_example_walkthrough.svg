    <rect x="360" y="432" width="150" height="34" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="510" y="432" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
