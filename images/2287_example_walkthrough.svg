  <text x="135" y="488" text-anchor="middle" font-size="12.5" fill="#7a5415">e</text>
  <text x="285" y="488" text-anchor="middle" font-size="12.5" fill="#444">4</text>
  <text x="435" y="488" text-anchor="middle" font-size="12.5" fill="#444">1</text>
