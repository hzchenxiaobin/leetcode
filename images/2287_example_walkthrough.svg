  <text x="132" y="190" text-anchor="middle" font-size="15" fill="#333">i</text>
  <text x="182" y="190" text-anchor="middle" font-size="15" fill="#333">n</text>
  <text x="234" y="190" text-anchor="middle" font-size="15" fill="#333">g</text>
  <text x="286" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">o</text>
