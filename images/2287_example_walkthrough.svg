    <rect x="210" y="466" width="150" height="34" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/>
    <rect x="360" y="466" width="150" height="34" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/>
