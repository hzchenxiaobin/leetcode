  <text x="135" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">字母 c</text>
  <text x="285" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">cntS[c]（s 中）</text>
  <text x="435" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">cntT[c]（每份）</text>
  <text x="590" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">可拼份数 ⌊÷⌋</text>

  <text x="135" y="386" text-anchor="middle" font-size="12.5" fill="#7a5415">c</text>
