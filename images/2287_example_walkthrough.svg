  <text x="450" y="548" text-anchor="middle" font-size="12.5" fill="#333">target 里 4 种字母各需 1 个，s 里 c、d 只有 2 个 → 至多 2 份；</text>
  <text x="450" y="568" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">与示例输出 2 一致，验证通过</text>
