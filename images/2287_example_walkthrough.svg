  <text x="655" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">第 1 份：下标 4, 5, 6, 7 → "ecod"</text>
  <text x="655" y="150" text-anchor="middle" font-size="11.5" fill="#555">第 2 份：下标 17, 18, 19, 20 → "code"</text>
  <text x="655" y="174" text-anchor="middle" font-size="11.5" fill="#555">顺序无关，重排后都是 "code"</text>

  <rect x="470" y="204" width="370" height="64" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="655" y="230" text-anchor="middle" font-size="12" fill="#7a5415">剩下的 o、e 再多也没用 —— c、d 已用完</text>
  <text x="655" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">木桶短板决定份数</text>

