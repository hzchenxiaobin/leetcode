  <text x="435" y="386" text-anchor="middle" font-size="12.5" fill="#444">1</text>
  <text x="590" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36">2 ★ min</text>

  <text x="135" y="420" text-anchor="middle" font-size="12.5" fill="#7a5415">o</text>
