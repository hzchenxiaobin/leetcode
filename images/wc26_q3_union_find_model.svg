<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：省份 = 无向图的连通块 = 等价类</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">isConnected = [[1,1,0],[1,1,0],[0,0,1]]</text>

  <!-- 邻接矩阵 -->
  <text x="118" y="86" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">邻接矩阵（对称）</text>
  <text x="82" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="126" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="170" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="56" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="56" y="184" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="56" y="228" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <rect x="60" y="120" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="148" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="120" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="126" y="148" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="120" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="148" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">0</text>

  <rect x="60" y="164" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="192" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="164" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="192" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="164" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="192" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">0</text>

  <rect x="60" y="208" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="236" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">0</text>
  <rect x="104" y="208" width="44" height="44" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="236" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">0</text>
  <rect x="148" y="208" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <text x="126" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">只扫上三角 j &lt; i</text>

  <path d="M 205 186 L 268 186" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">建图</text>

  <!-- 图 -->
  <circle cx="352" cy="140" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="352" y="147" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="462" cy="140" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="462" y="147" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <path d="M 378 140 L 436 140" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="556" cy="252" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="259" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <rect x="300" y="188" width="176" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">省份 1：{0, 1}</text>
  <rect x="470" y="292" width="176" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="558" y="310" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">省份 2：{2}（孤立）</text>

  <rect x="60" y="344" width="560" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="371" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">省份数 = n − 成功合并（union）的次数，初始有 n 个「各自为政」的省</text>
</svg>
