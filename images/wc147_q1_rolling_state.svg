<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三变量滚动的状态转移</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">a = T(i−3)，b = T(i−2)，c = T(i−1)；每轮算 d = a + b + c 后整体左移一格</text>

  <!-- 初始状态 -->
  <text x="70" y="68" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">初始化（i = 3 之前）</text>

  <rect x="96" y="78" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="96" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">a = T(0) = 0</text>
  <text x="146" y="112" text-anchor="middle" font-size="9.5" fill="#7a8a72" filter="url(#rough2)">最旧的一项</text>
  <rect x="230" y="78" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">b = T(1) = 1</text>
  <text x="280" y="112" text-anchor="middle" font-size="9.5" fill="#7a8a72" filter="url(#rough2)">中间项</text>
  <rect x="364" y="78" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="414" y="96" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">c = T(2) = 1</text>
  <text x="414" y="112" text-anchor="middle" font-size="9.5" fill="#7a8a72" filter="url(#rough2)">最新的一项</text>

  <path d="M 280 126 L 280 152" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arrow)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="120" y="158" width="320" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">for i = 3 … n：d = a + b + c</text>
  <text x="280" y="199" text-anchor="middle" font-size="10" fill="#7a6a40" filter="url(#rough2)">d 就是 T(i)，一轮只做一次加法</text>

  <!-- 左移箭头 -->
  <path d="M 280 214 L 280 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrowG)" filter="url(#rough2)"/>

  <rect x="96" y="246" width="368" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#30436b" font-weight="bold" filter="url(#rough2)">整体左移：a ← b，b ← c，c ← d</text>
  <text x="280" y="283" text-anchor="middle" font-size="10" fill="#5a6b88" filter="url(#rough2)">三个变量始终保存「最近三项」，旧值被覆盖，空间 O(1)</text>

  <!-- 循环回边 -->
  <path d="M 470 269 C 512 269 512 184 446 184" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowG)" filter="url(#rough2)"/>
  <text x="522" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i &lt;= n</text>
  <text x="522" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续</text>

  <path d="M 280 294 L 280 316" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arrow)" filter="url(#rough2)"/>

  <rect x="176" y="322" width="208" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">循环结束时返回 c = T(n)</text>
</svg>
