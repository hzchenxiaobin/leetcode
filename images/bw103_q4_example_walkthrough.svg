<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [3, 4, −1]，三段删除</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12">
    <text x="90" y="60" text-anchor="middle" fill="#666">目标值</text>
    <text x="200" y="60" text-anchor="middle" fill="#666">prev → cur</text>
    <text x="340" y="60" text-anchor="middle" fill="#666">弧上存活 cnt</text>
    <text x="460" y="60" text-anchor="middle" fill="#666">moves</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5">
    <!-- 行 1 -->
    <rect x="40" y="72" width="100" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="101" text-anchor="middle" fill="#2f4a66">−1</text>
    <rect x="150" y="72" width="100" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="200" y="94" text-anchor="middle" fill="#555">0 → 3</text>
    <text x="200" y="112" text-anchor="middle" font-size="11" fill="#888">初始虚拟 prev=0</text>
    <rect x="290" y="72" width="100" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="340" y="94" text-anchor="middle" fill="#7a5a10">Q(3)−Q(0)=3</text>
    <text x="340" y="112" text-anchor="middle" font-size="11" fill="#7a5a10">（全存活）</text>
    <rect x="420" y="72" width="60" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="450" y="101" text-anchor="middle" fill="#2f5527">2</text>

    <!-- 行 2 -->
    <rect x="40" y="128" width="100" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="157" text-anchor="middle" fill="#2f4a66">3</text>
    <rect x="150" y="128" width="100" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="200" y="157" text-anchor="middle" fill="#555">3 → 1</text>
    <rect x="290" y="128" width="100" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="340" y="150" text-anchor="middle" fill="#7a5a10">(Q(3)−Q(3))+Q(1)</text>
    <text x="340" y="168" text-anchor="middle" font-size="11" fill="#7a5a10">= 0 + 1 = 1（跨环尾）</text>
    <rect x="420" y="128" width="60" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="450" y="157" text-anchor="middle" fill="#2f5527">0</text>

    <!-- 行 3 -->
    <rect x="40" y="184" width="100" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="213" text-anchor="middle" fill="#2f4a66">4</text>
    <rect x="150" y="184" width="100" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="200" y="213" text-anchor="middle" fill="#555">1 → 2</text>
    <rect x="290" y="184" width="100" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="340" y="206" text-anchor="middle" fill="#7a5a10">Q(2)−Q(1)=1</text>
    <text x="340" y="224" text-anchor="middle" font-size="11" fill="#7a5a10">（仅位置 2 存活）</text>
    <rect x="420" y="184" width="60" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="450" y="213" text-anchor="middle" fill="#2f5527">0</text>
  </g>

  <!-- 汇总 -->
  <rect x="40" y="248" width="440" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="13.5" fill="#8c3a36" filter="url(#rough2)">ans = n + Σmoves = 3 + (2 + 0 + 0) = 5</text>

  <text x="40" y="300" font-size="12" fill="#7a5a10" filter="url(#rough2)">对照官方操作表：前两次“移到末尾”对应 moves=2；</text>
  <text x="40" y="318" font-size="12" fill="#7a5a10" filter="url(#rough2)">之后 −1、3、4 轮到队首即删，各 0 次移动，共 3 次删除。</text>
</svg>
