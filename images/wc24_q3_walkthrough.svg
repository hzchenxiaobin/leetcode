  <rect x="40" y="252" width="640" height="122" fill="#ffffff" stroke="#9aa5b5" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="60" y="276" font-size="10.5" fill="#446688" text-anchor="start" filter="url(#rough2)">① 初始：5 个 0 全部入队，dist = 0；其余格子 dist = -1（未访问），记作 ?</text>
  <text x="60" y="302" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">② 第 1 层：5 个 0 依次出队，把四邻中未访问的 (1,1)、(2,0)、(2,2) 写成 dist = 1</text>
  <text x="60" y="328" font-size="10.5" fill="#b8860b" text-anchor="start" filter="url(#rough2)">③ 第 2 层：只剩 (2,1)，两个邻居 dist 都为 1，写入 dist = 2，队列清空 → 返回</text>
  <text x="60" y="356" font-size="10.5" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">第一次被写入的值即最短距离，之后不会再被更新，这就是 BFS 的正确性来源。</text>
