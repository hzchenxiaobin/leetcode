<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">选 c 个数的最小总和：从小到大取</text>

  <!-- 数轴 1..n -->
  <text x="280" y="70" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">范围 [1, n]，banned 里的数被划掉</text>
  <g filter="url(#rough2)">
    <rect x="60" y="86" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="102" y="86" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="144" y="86" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="186" y="86" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="228" y="86" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="270" y="86" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="312" y="86" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="354" y="86" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="81" y="113">1</text><text x="123" y="113">2</text><text x="165" y="113">3</text>
    <text x="207" y="113">4</text><text x="249" y="113">5</text><text x="291" y="113">6</text>
    <text x="333" y="113">7</text><text x="375" y="113">8</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle">
    <text x="81" y="141">禁</text><text x="165" y="141">禁</text><text x="333" y="141">禁</text>
  </g>

  <!-- 选取箭头：2,4,5,6 -->
  <path d="M 123 134 C 123 164, 123 168, 123 178" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 207 134 C 207 158, 222 158, 249 158 C 268 158, 270 162, 270 178" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 249 134 C 252 152, 260 156, 288 168 C 300 174, 291 174, 291 178" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle">
    <text x="123" y="196">✓2</text><text x="207" y="196">✓4</text><text x="249" y="196">✓5</text><text x="291" y="196">✓6</text>
  </g>

  <!-- 停止线 -->
  <path d="M 291 86 L 291 178" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="420" y="108" font-size="12.5" fill="#b85450" filter="url(#rough2)">sum=17，再取 8 就超 maxSum</text>
  <text x="420" y="126" font-size="12.5" fill="#b85450" filter="url(#rough2)">→ 在此 break，返回 cnt</text>

  <!-- 交换论证示意 -->
  <text x="280" y="236" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">为什么贪心最优？交换论证</text>
  <rect x="70" y="252" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="277" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">任取方案 A：{2, 4, 6}</text>
  <path d="M 254 272 C 274 272, 282 272, 300 272" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="304" y="252" width="186" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="277" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">换成更小的 5：{2, 4, 5} 更省</text>
  <text x="280" y="318" font-size="12.5" fill="#333" filter="url(#rough2)" text-anchor="middle">任何包含「跳过更小可用数」的方案都能被交换改进，</text>
  <text x="280" y="338" font-size="12.5" fill="#333" filter="url(#rough2)" text-anchor="middle">故最小总和方案必是「从小到大的前 c 个可用数」。</text>

  <rect x="70" y="348" width="420" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">S(c) 随 c 严格递增 → 第一个超限处即最优停点</text>
</svg>
