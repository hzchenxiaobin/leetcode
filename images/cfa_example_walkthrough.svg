<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：查表取货、整段核对、i 跳整段</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- success panel -->
  <rect x="18" y="50" width="604" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="330" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a28" filter="url(#sk)">示例 3：arr = [91,4,64,78]，pieces = [[78],[4,64],[91]] → true</text>
  <text x="75" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">取 [91]</text>
  <text x="165" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#38506e" filter="url(#sk)">取 [4,64]</text>
  <text x="255" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6015" filter="url(#sk)">取 [78]</text>
  <rect x="50" y="94" width="50" height="32" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="75" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">91</text>
  <rect x="110" y="94" width="50" height="32" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="135" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <rect x="170" y="94" width="50" height="32" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="195" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">64</text>
  <rect x="230" y="94" width="50" height="32" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="255" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">78</text>
  <path d="M 296 94 L 296 126" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="296" y="115" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">n</text>
  <text x="75" y="140" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">0</text>
  <text x="135" y="140" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">1</text>
  <text x="195" y="140" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">2</text>
  <text x="255" y="140" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">3</text>
  <!-- pointer jump arcs -->
  <path d="M 75 150 Q 105 138 133 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="104" y="136" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">①</text>
  <path d="M 135 150 Q 195 130 253 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="194" y="128" text-anchor="middle" font-size="9" fill="#38506e" filter="url(#sk)">②</text>
  <path d="M 255 150 Q 276 138 294 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="275" y="136" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#sk)">③</text>
  <!-- steps -->
  <text x="340" y="100" font-size="11" fill="#444" filter="url(#sk)">① i=0：查 91 → [91]，核对 ✓ → i=1</text>
  <text x="340" y="126" font-size="11" fill="#444" filter="url(#sk)">② i=1：查 4 → [4,64]，核对 [4,64] ✓ → i=3</text>
  <text x="340" y="152" font-size="11" fill="#444" filter="url(#sk)">③ i=3：查 78 → [78]，核对 ✓ → i=4 = n</text>
  <text x="340" y="184" font-size="12" font-weight="bold" fill="#2f4a28" filter="url(#sk)">三段恰好拼满 arr → 返回 true ✓</text>

  <!-- failure A panel -->
  <rect x="18" y="236" width="300" height="178" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="168" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a35" filter="url(#sk)">失败 A：查表未命中（示例 2）</text>
  <text x="61" y="268" text-anchor="middle" font-size="9.5" fill="#a04a44" filter="url(#sk)">查 49</text>
  <rect x="40" y="272" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="61" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a35" filter="url(#sk)">49</text>
  <rect x="90" y="272" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <text x="111" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">18</text>
  <rect x="140" y="272" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <text x="161" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">16</text>
  <text x="61" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">i=0</text>
  <text x="111" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">1</text>
  <text x="161" y="316" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">2</text>
  <text x="36" y="342" font-size="11" fill="#555" filter="url(#sk)">pieces = [[16,18,49]]，表中键只有 16</text>
  <text x="36" y="364" font-size="11" fill="#555" filter="url(#sk)">查 49 → 未命中</text>
  <text x="36" y="390" font-size="12" font-weight="bold" fill="#8a3a35" filter="url(#sk)">→ 立即返回 false ✗</text>

  <!-- failure B panel -->
  <rect x="322" y="236" width="300" height="178" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="472" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a35" filter="url(#sk)">失败 B：整段不符（只比首元素的 WA）</text>
  <text x="338" y="292" text-anchor="end" font-size="10" fill="#777" filter="url(#sk)">arr</text>
  <rect x="344" y="272" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="365" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <rect x="394" y="272" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="415" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a35" filter="url(#sk)">2</text>
  <rect x="444" y="272" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="465" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a35" filter="url(#sk)">3</text>
  <path d="M 365 302 L 365 316" stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <path d="M 415 302 L 415 316" stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <path d="M 465 302 L 465 316" stroke="#999" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="338" y="336" text-anchor="end" font-size="10" fill="#777" filter="url(#sk)">piece</text>
  <rect x="344" y="316" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="365" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <rect x="394" y="316" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="415" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a35" filter="url(#sk)">3</text>
  <rect x="444" y="316" width="42" height="30" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="465" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a35" filter="url(#sk)">2</text>
  <text x="344" y="368" font-size="11" fill="#555" filter="url(#sk)">查 1 → 命中 [1,3,2]</text>
  <text x="344" y="390" font-size="11" fill="#555" filter="url(#sk)">但 arr = [1,2,3] ≠ [1,3,2] → false ✗</text>
</svg>
