<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，增量维护 distinct，一行比较计数</text>

  <!-- 初始化 -->
  <rect x="200" y="44" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans ← 0，distinct ← 0</text>
  <text x="330" y="77" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">seen[26] ← 全 false</text>
  <path d="M330,84 L330,100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="200" y="102" width="260" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">取下一个字符 ch（前缀长度 L）</text>
  <path d="M330,138 L330,154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 增量更新 -->
  <rect x="170" y="156" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="175" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">若 ch 首次出现（seen[ch − 'a'] == false）：</text>
  <text x="330" y="192" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">标记 seen，distinct ← distinct + 1；否则什么都不做</text>
  <path d="M330,202 L330,218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 比较判定 -->
  <polygon points="330,220 456,256 330,292 204,256" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">distinct == L % 3 ?</text>
  <text x="330" y="268" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（L 为当前前缀长度）</text>
  <text x="464" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M456,256 L474,256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="478" y="238" width="142" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="549" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">ans ← ans + 1</text>
  <path d="M549,274 L549,352 L464,352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M330,292 L330,314" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判定 -->
  <polygon points="330,316 456,352 330,388 204,352" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="356" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">还有字符？</text>
  <text x="152" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M204,352 L92,352 L92,120 L192,120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="372" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M330,388 L330,404" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="210" y="406" width="240" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>

  <!-- 提示框 -->
  <rect x="462" y="392" width="172" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="410" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">💡 L%3==0 时 d ≥ 1 恒不等</text>
  <text x="548" y="426" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">一行比较天然覆盖</text>
  <text x="548" y="442" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">三种余数，无需特判</text>
</svg>
