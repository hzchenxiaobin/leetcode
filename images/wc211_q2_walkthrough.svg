<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：s = "5525", a = 9, b = 2 —— 两条轮转轨道 × 十种累加</text>
  <path d="M 180 36 Q 340 44 500 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- top strip: s with parity -->
  <g filter="url(#r)">
    <rect x="40" y="46" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="84" y="46" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="128" y="46" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="172" y="46" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#r)" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="62" y="68" fill="#2b4a6e">5</text>
    <text x="106" y="68" fill="#2e6e2e">5</text>
    <text x="150" y="68" fill="#2b4a6e">2</text>
    <text x="194" y="68" fill="#2e6e2e">5</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="62" y="92">0</text><text x="106" y="92">1</text>
    <text x="150" y="92">2</text><text x="194" y="92">3</text>
  </g>

  <!-- top info box -->
  <rect x="250" y="46" width="390" height="42" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2" filter="url(#r)"/>
  <text x="445" y="64" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#r)">奇数位（下标 1、3）累加 +9 ≡ −1 (mod 10)：每做一次，奇数位数字减 1</text>
  <text x="445" y="82" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#r)">n=4、b=2：右移 2 位 → 偏移只有 {0, 2} 两种；gcd(9,10)=1 → 累加周期为 10</text>

  <!-- panel A -->
  <rect x="40" y="112" width="292" height="258" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4" filter="url(#r)"/>
  <rect x="40" y="112" width="292" height="28" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2" filter="url(#r)"/>
  <text x="186" y="131" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#r)">轨道 A：偏移 0（不轮转）</text>
  <g filter="url(#r)" font-size="10.5" font-weight="bold" fill="#888" text-anchor="middle">
    <text x="85" y="155">k</text>
    <text x="165" y="155">奇数位增量</text>
    <text x="230" y="155">字符串</text>
  </g>

  <!-- panel B -->
  <rect x="348" y="112" width="292" height="258" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4" filter="url(#r)"/>
  <rect x="348" y="112" width="292" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="494" y="131" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">轨道 B：偏移 2（右移 2 位 → "2555"）</text>
  <g filter="url(#r)" font-size="10.5" font-weight="bold" fill="#888" text-anchor="middle">
    <text x="393" y="155">k</text>
    <text x="473" y="155">奇数位增量</text>
    <text x="538" y="155">字符串</text>
  </g>

  <!-- separators -->
  <g filter="url(#r)" stroke="#d8dee6" stroke-width="1">
    <line x1="48" y1="186" x2="324" y2="186"/>
    <line x1="48" y1="213" x2="324" y2="213"/>
    <line x1="48" y1="240" x2="324" y2="240"/>
    <line x1="48" y1="267" x2="324" y2="267"/>
    <line x1="356" y1="186" x2="632" y2="186"/>
    <line x1="356" y1="213" x2="632" y2="213"/>
    <line x1="356" y1="240" x2="632" y2="240"/>
    <line x1="356" y1="267" x2="632" y2="267"/>
  </g>

  <!-- orbit A rows -->
  <g filter="url(#r)" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="85" y="176">0</text><text x="85" y="203">1</text><text x="85" y="230">2</text>
    <text x="85" y="257">3</text><text x="85" y="284">4</text><text x="85" y="311">5</text>
  </g>
  <g filter="url(#r)" font-size="12" fill="#555" text-anchor="middle">
    <text x="165" y="176">+0</text><text x="165" y="203">+9</text><text x="165" y="230">+8</text>
    <text x="165" y="257">+7</text><text x="165" y="284">+6</text><text x="165" y="311">+5</text>
  </g>
  <g filter="url(#r)" font-size="14" font-weight="bold">
    <text x="205" y="176" fill="#2b4a6e">5</text><text x="219" y="176" fill="#2e6e2e">5</text><text x="233" y="176" fill="#2b4a6e">2</text><text x="247" y="176" fill="#2e6e2e">5</text>
    <text x="205" y="203" fill="#2b4a6e">5</text><text x="219" y="203" fill="#2e6e2e">4</text><text x="233" y="203" fill="#2b4a6e">2</text><text x="247" y="203" fill="#2e6e2e">4</text>
    <text x="205" y="230" fill="#2b4a6e">5</text><text x="219" y="230" fill="#2e6e2e">3</text><text x="233" y="230" fill="#2b4a6e">2</text><text x="247" y="230" fill="#2e6e2e">3</text>
    <text x="205" y="257" fill="#2b4a6e">5</text><text x="219" y="257" fill="#2e6e2e">2</text><text x="233" y="257" fill="#2b4a6e">2</text><text x="247" y="257" fill="#2e6e2e">2</text>
    <text x="205" y="284" fill="#2b4a6e">5</text><text x="219" y="284" fill="#2e6e2e">1</text><text x="233" y="284" fill="#2b4a6e">2</text><text x="247" y="284" fill="#2e6e2e">1</text>
  </g>
  <rect x="48" y="292" width="276" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#r)"/>
  <g filter="url(#r)" font-size="14" font-weight="bold">
    <text x="205" y="311" fill="#2b4a6e">5</text><text x="219" y="311" fill="#2e6e2e">0</text><text x="233" y="311" fill="#2b4a6e">2</text><text x="247" y="311" fill="#2e6e2e">0</text>
  </g>
  <text x="262" y="311" font-size="10" font-weight="bold" fill="#a8741a" filter="url(#r)">← 轨道内最优</text>
  <text x="186" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">… k=6..9 继续绕，k=10 回到 5525</text>

  <!-- orbit B rows -->
  <g filter="url(#r)" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="393" y="176">0</text><text x="393" y="203">1</text><text x="393" y="230">2</text>
    <text x="393" y="257">3</text><text x="393" y="284">4</text><text x="393" y="311">5</text>
  </g>
  <g filter="url(#r)" font-size="12" fill="#555" text-anchor="middle">
    <text x="473" y="176">+0</text><text x="473" y="203">+9</text><text x="473" y="230">+8</text>
    <text x="473" y="257">+7</text><text x="473" y="284">+6</text><text x="473" y="311">+5</text>
  </g>
  <g filter="url(#r)" font-size="14" font-weight="bold">
    <text x="513" y="176" fill="#2b4a6e">2</text><text x="527" y="176" fill="#2e6e2e">5</text><text x="541" y="176" fill="#2b4a6e">5</text><text x="555" y="176" fill="#2e6e2e">5</text>
    <text x="513" y="203" fill="#2b4a6e">2</text><text x="527" y="203" fill="#2e6e2e">4</text><text x="541" y="203" fill="#2b4a6e">5</text><text x="555" y="203" fill="#2e6e2e">4</text>
    <text x="513" y="230" fill="#2b4a6e">2</text><text x="527" y="230" fill="#2e6e2e">3</text><text x="541" y="230" fill="#2b4a6e">5</text><text x="555" y="230" fill="#2e6e2e">3</text>
    <text x="513" y="257" fill="#2b4a6e">2</text><text x="527" y="257" fill="#2e6e2e">2</text><text x="541" y="257" fill="#2b4a6e">5</text><text x="555" y="257" fill="#2e6e2e">2</text>
    <text x="513" y="284" fill="#2b4a6e">2</text><text x="527" y="284" fill="#2e6e2e">1</text><text x="541" y="284" fill="#2b4a6e">5</text><text x="555" y="284" fill="#2e6e2e">1</text>
  </g>
  <rect x="356" y="292" width="276" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#r)"/>
  <g filter="url(#r)" font-size="14" font-weight="bold">
    <text x="513" y="311" fill="#2b4a6e">2</text><text x="527" y="311" fill="#2e6e2e">0</text><text x="541" y="311" fill="#2b4a6e">5</text><text x="555" y="311" fill="#2e6e2e">0</text>
  </g>
  <text x="568" y="311" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">← 答案</text>
  <text x="494" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">… k=6..9 继续绕，k=10 回到 2555</text>

  <!-- bottom analysis -->
  <rect x="40" y="384" width="600" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#r)"/>
  <text x="340" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">轨道 A 首字符恒为 '5'，轨道 B 首字符恒为 '2' → 答案在轨道 B；其奇数位 5→4→3→2→1→0，k = 5 时最优</text>
  <text x="340" y="422" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#r)">可达状态共 2 种偏移 × 10 种增量 = 20 个；BFS 全遍历取 min ⇒ 答案 "2050"</text>
</svg>
