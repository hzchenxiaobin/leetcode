<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="419" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：目标右移一格，左球各 +1 步、右球各 −1 步</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 区域标签 -->
  <text x="254" y="56" text-anchor="middle" font-size="12" fill="#a04348" font-weight="bold">位置 ≤ 3 的球：各 +1 步（左区 L）</text>
  <text x="445" y="56" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">位置 ≥ 4 的球：各 −1 步（右区 R）</text>

  <!-- 区域虚框 -->
  <g filter="url(#sk)">
    <rect x="130" y="62" width="248" height="62" rx="9" fill="#fce4ec" fill-opacity="0.28" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6,4"/>
    <rect x="386" y="62" width="118" height="62" rx="9" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="6,4"/>
  </g>

  <!-- 盒子行 -->
  <g filter="url(#sk)">
    <rect x="140" y="68" width="50" height="40" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="202" y="68" width="50" height="40" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="264" y="68" width="50" height="40" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="326" y="68" width="50" height="40" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="388" y="68" width="50" height="40" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="450" y="68" width="50" height="40" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="289" cy="88" r="8" fill="#f2c14e" stroke="#c98a2b" stroke-width="1.5"/>
    <circle cx="413" cy="88" r="8" fill="#f2c14e" stroke="#c98a2b" stroke-width="1.5"/>
    <circle cx="475" cy="88" r="8" fill="#f2c14e" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#666" font-family="monospace">
    <text x="165" y="136" text-anchor="middle">i=0</text>
    <text x="227" y="136" text-anchor="middle">i=1</text>
    <text x="289" y="136" text-anchor="middle">i=2</text>
    <text x="351" y="136" text-anchor="middle">i=3</text>
    <text x="413" y="136" text-anchor="middle">i=4</text>
    <text x="475" y="136" text-anchor="middle">i=5</text>
  </g>
  <text x="320" y="158" text-anchor="middle" font-size="11" fill="#666">boxes = 001011，球在位置 2、4、5（total = 3）</text>

  <!-- 目标标记：i=3 实线，i+1=4 虚线 -->
  <path d="M 351 200 L 351 168" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 413 200 L 413 168" stroke="#c98a2b" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="216" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">目标 i=3</text>
  <text x="428" y="216" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">右移后 i+1=4</text>
  <path d="M 345 228 L 420 228" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="382" y="246" text-anchor="middle" font-size="12" fill="#7a5415">右移一格</text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="70" y="258" width="500" height="62" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="282" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold" font-family="monospace">answer[i+1] = answer[i] + L − R</text>
  <text x="320" y="306" text-anchor="middle" font-size="12" fill="#2b6e9e">本例：L = 1（球 2）、R = 2（球 4、5），Δ = −1 → answer[4] = 4 − 1 = 3 ✓</text>

  <!-- 直觉框 -->
  <g filter="url(#sk)">
    <rect x="70" y="334" width="500" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="356" text-anchor="middle" font-size="12" fill="#2e6e2e">把目标想成磁铁：右移一格，左侧每个球被拉远 1 步（+L），右侧被拉近 1 步（−R）</text>
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#2e6e2e">L 随扫描 O(1) 更新（扫过 '1' 就 +1）→ 从 answer[0] 一趟递推出全部 n 个答案</text>
</svg>
