<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="450" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：a = [−1, 0, 1, −1, 0, 0, 1]</text>
  <text x="390" y="56" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">固定 1 在位置 3 和 7 ⇒ 切成 [1,3]、[3,7]、[7,7] 三段，逐段算跨度</text>

  <!-- 原数组 -->
  <rect x="155" y="76" width="62" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="110" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">−1</text>
  <rect x="223" y="76" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="111" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="291" y="76" width="62" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="111" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="359" y="76" width="62" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="110" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">−1</text>
  <rect x="427" y="76" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="111" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="495" y="76" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="526" y="111" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="563" y="76" width="62" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="594" y="111" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>

  <!-- 位置编号 -->
  <text x="186" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="254" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="322" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="390" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="458" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="526" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">6</text>
  <text x="594" y="146" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">7</text>

  <!-- 表头 -->
  <rect x="110" y="162" width="560" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">区间</text>
  <text x="392" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">段内非 0 位置</text>
  <text x="537" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">跨度</text>
  <text x="632" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结论</text>

  <!-- 第 1 行 -->
  <rect x="110" y="196" width="560" height="34" rx="7" fill="#fafafa" stroke="#66788c" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="219" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[1,3]</text>
  <text x="392" y="219" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1, 3</text>
  <text x="537" y="219" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="632" y="219" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">—</text>

  <!-- 第 2 行（最优） -->
  <rect x="110" y="230" width="560" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="212" y="253" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">[3,7]</text>
  <text x="392" y="253" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">3, 4, 7</text>
  <text x="537" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="632" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">✓ 最优</text>

  <!-- 第 3 行 -->
  <rect x="110" y="264" width="560" height="34" rx="7" fill="#fafafa" stroke="#66788c" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="287" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[7,7]</text>
  <text x="392" y="287" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="537" y="287" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="632" y="287" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">—</text>

  <text x="390" y="326" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">取跨度最大的 [3,7]：内部 4、5、6 全是 −1 或固定 0，一律填 0</text>

  <!-- 构造结果 -->
  <rect x="155" y="342" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="377" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="223" y="342" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="377" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="291" y="342" width="62" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="322" y="377" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <rect x="359" y="342" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="377" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="427" y="342" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="377" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="495" y="342" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="526" y="377" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="563" y="342" width="62" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="594" y="377" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <text x="390" y="424" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">分数 = 7 − 3 + 1 = 5，与官方输出 0 0 1 0 0 0 1 完全一致</text>
  <text x="390" y="444" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">其余 −1 全部填 0：它们可能组出别的 1，但分数只会更大，不会更小</text>
</svg>
