<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：上三角全 0 ⟺ 每行尾零足够</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11" fill="#888">grid = [[0,0,1],[1,1,0],[1,0,0]]，n = 3 —— 交换两行不改变行内容，每行的合法性只取决于自己的「尾零数」</text>

  <!-- 左：3x3 网格 -->
  <g filter="url(#sk)">
    <!-- row 0: [0,0,1] -->
    <rect x="88" y="84" width="48" height="42" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="136" y="84" width="48" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="184" y="84" width="48" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <!-- row 1: [1,1,0] -->
    <rect x="88" y="126" width="48" height="42" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="136" y="126" width="48" height="42" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="184" y="126" width="48" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <!-- row 2: [1,0,0] -->
    <rect x="88" y="168" width="48" height="42" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="136" y="168" width="48" height="42" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="184" y="168" width="48" height="42" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <!-- 尾零段绿框：行1 末 1 格，行2 末 2 格 -->
    <rect x="184" y="126" width="48" height="42" rx="4" fill="none" stroke="#4a8e4a" stroke-width="2.4"/>
    <rect x="136" y="168" width="96" height="42" rx="4" fill="none" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="112" y="110" fill="#666">0</text>
    <text x="160" y="110" fill="#b8641e">0</text>
    <text x="208" y="110" fill="#b85450">1</text>
    <text x="112" y="152" fill="#666">1</text>
    <text x="160" y="152" fill="#666">1</text>
    <text x="208" y="152" fill="#2e6e2e">0</text>
    <text x="112" y="194" fill="#666">1</text>
    <text x="160" y="194" fill="#2e6e2e">0</text>
    <text x="208" y="194" fill="#2e6e2e">0</text>
  </g>
  <g font-size="12" font-weight="bold" fill="#444" text-anchor="end">
    <text x="80" y="110">行 0</text>
    <text x="80" y="152">行 1</text>
    <text x="80" y="194">行 2</text>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2e6e2e">
    <text x="248" y="110">tz = 0</text>
    <text x="248" y="152">tz = 1</text>
    <text x="248" y="194">tz = 2</text>
  </g>
  <g font-size="10.5" fill="#777" text-anchor="middle">
    <text x="160" y="240">绿框 = 行末尾的连续 0（尾零段）</text>
    <text x="160" y="260">橙底 = 上三角（必须全 0）· 灰虚线 = 主对角线（无约束）</text>
  </g>

  <!-- 右：每个位置的需求 -->
  <text x="475" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">位置 p 需要末尾 n−1−p 格全 0</text>
  <g font-size="11" font-weight="bold" fill="#444" text-anchor="end">
    <text x="352" y="131">p = 0</text>
    <text x="352" y="179">p = 1</text>
    <text x="352" y="227">p = 2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="362" y="112" width="40" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="406" y="112" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="450" y="112" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="362" y="160" width="40" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="406" y="160" width="40" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="450" y="160" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="362" y="208" width="40" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="406" y="208" width="40" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="450" y="208" width="40" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="382" y="131" fill="#999">任意</text>
    <text x="426" y="131" fill="#2e6e2e" font-weight="bold">0</text>
    <text x="470" y="131" fill="#2e6e2e" font-weight="bold">0</text>
    <text x="382" y="179" fill="#999">任意</text>
    <text x="426" y="179" fill="#999">任意</text>
    <text x="470" y="179" fill="#2e6e2e" font-weight="bold">0</text>
    <text x="382" y="227" fill="#999">任意</text>
    <text x="426" y="227" fill="#999">任意</text>
    <text x="470" y="227" fill="#999">任意</text>
  </g>
  <g font-size="12" font-weight="bold" fill="#444">
    <text x="504" y="124">req = 2</text>
    <text x="504" y="172">req = 1</text>
    <text x="504" y="220">req = 0</text>
  </g>
  <g font-size="9.5" fill="#999">
    <text x="504" y="138">需 tz ≥ 2</text>
    <text x="504" y="186">需 tz ≥ 1</text>
    <text x="504" y="234">需 tz ≥ 0</text>
  </g>
  <text x="475" y="262" text-anchor="middle" font-size="11" fill="#777">需求随 p 递减 → 高尾零行「向下兼容」</text>

  <!-- 底部说明框 -->
  <g filter="url(#sk)">
    <rect x="36" y="282" width="568" height="140" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⇒ 降维：n×n 网格 → 一维数组 tz 的重排问题</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#7a5415">行 i 放到位置 p ⟺ tz[i] ≥ n−1−p，合法性只由这两个数决定</text>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#7a5415">交换相邻两行不改变行内容，只改变行的顺序</text>
  <text x="320" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">最少交换次数 = 把行冒泡成某个合法顺序的最少相邻交换</text>
</svg>
