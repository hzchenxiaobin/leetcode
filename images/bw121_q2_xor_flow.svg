<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两步走：先求整体异或和 x，再数 x 与 k 的不同位</text>
  <rect x="30" y="70" width="96" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums</text>
  <text x="78" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">[2,1,3,4]</text>
  <path d="M126,97 L168,97" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="70" width="124" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="94" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">x = XOR</text>
  <text x="232" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">= 4 = 100₂</text>
  <path d="M294,97 L336,97" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="338" y="70" width="130" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="403" y="94" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">d = x XOR k</text>
  <text x="403" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">= 4 XOR 1 = 101₂</text>
  <path d="M403,124 L403,158" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="330" y="160" width="156" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="408" y="190" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">答案 = popcount(d) = 2</text>
  <rect x="30" y="160" width="280" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="182" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么每位独立？</text>
  <text x="44" y="206" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 异或和是各元素逐位异或，位与位之间互不干扰</text>
  <text x="44" y="226" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 一次操作只改动一个位，故下界 = 不同位个数</text>
  <text x="44" y="246" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">• 对每个不同位翻一次即可达到下界</text>
  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">前导 0 也能翻（题面允许），所以高位的差异同样只需一次操作</text>
</svg>
