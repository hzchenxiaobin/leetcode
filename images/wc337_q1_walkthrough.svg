<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 50 移位扫描全过程</text>
  <path d="M 170 38 Q 320 44 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: iteration table -->
  <g filter="url(#sk)">
    <rect x="40" y="54" width="390" height="256" rx="10" fill="#f4f7fb" stroke="#8899aa" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" fill="#446688">
    <text x="70" y="76" filter="url(#sk)">轮次 i</text>
    <text x="150" y="76" filter="url(#sk)">n（二进制）</text>
    <text x="225" y="76" filter="url(#sk)">n &amp; 1</text>
    <text x="300" y="76" filter="url(#sk)">动作</text>
    <text x="368" y="76" filter="url(#sk)">even</text>
    <text x="408" y="76" filter="url(#sk)">odd</text>
  </g>
  <path d="M 50 84 L 420 84" stroke="#8899aa" stroke-width="1" filter="url(#sk)"/>

  <!-- highlight rows where a 1 is counted -->
  <g filter="url(#sk)">
    <rect x="46" y="118" width="378" height="26" rx="4" fill="#fff8e1" opacity="0.65"/>
    <rect x="46" y="238" width="378" height="26" rx="4" fill="#fff8e1" opacity="0.65"/>
    <rect x="46" y="268" width="378" height="26" rx="4" fill="#fff8e1" opacity="0.65"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <text x="70" y="108" fill="#333">0</text><text x="150" y="108" fill="#333" font-family="monospace">110010</text><text x="225" y="108" fill="#333">0</text><text x="300" y="108" fill="#999">跳过</text><text x="368" y="108" fill="#333">0</text><text x="408" y="108" fill="#333">0</text>
    <text x="70" y="138" fill="#333">1</text><text x="150" y="138" fill="#333" font-family="monospace">11001</text><text x="225" y="138" fill="#333">1</text><text x="300" y="138" fill="#a07818" font-weight="bold">odd += 1</text><text x="368" y="138" fill="#333">0</text><text x="408" y="138" fill="#a07818" font-weight="bold">1</text>
    <text x="70" y="168" fill="#333">2</text><text x="150" y="168" fill="#333" font-family="monospace">1100</text><text x="225" y="168" fill="#333">0</text><text x="300" y="168" fill="#999">跳过</text><text x="368" y="168" fill="#333">0</text><text x="408" y="168" fill="#333">1</text>
    <text x="70" y="198" fill="#333">3</text><text x="150" y="198" fill="#333" font-family="monospace">110</text><text x="225" y="198" fill="#333">0</text><text x="300" y="198" fill="#999">跳过</text><text x="368" y="198" fill="#333">0</text><text x="408" y="198" fill="#333">1</text>
    <text x="70" y="228" fill="#333">4</text><text x="150" y="228" fill="#333" font-family="monospace">11</text><text x="225" y="228" fill="#333">1</text><text x="300" y="228" fill="#2c4a6e" font-weight="bold">even += 1</text><text x="368" y="228" fill="#2c4a6e" font-weight="bold">1</text><text x="408" y="228" fill="#333">1</text>
    <text x="70" y="258" fill="#333">5</text><text x="150" y="258" fill="#333" font-family="monospace">1</text><text x="225" y="258" fill="#333">1</text><text x="300" y="258" fill="#a07818" font-weight="bold">odd += 1</text><text x="368" y="258" fill="#333">1</text><text x="408" y="258" fill="#a07818" font-weight="bold">2</text>
  </g>
  <path d="M 50 272 L 420 272" stroke="#8899aa" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g font-size="12" text-anchor="middle">
    <text x="70" y="298" fill="#555">结束</text><text x="150" y="298" fill="#555" font-family="monospace">0</text><text x="225" y="298" fill="#999">—</text><text x="300" y="298" fill="#2e5e2e" font-weight="bold">返回</text><text x="368" y="298" fill="#2c4a6e" font-weight="bold">1</text><text x="408" y="298" fill="#a07818" font-weight="bold">2</text>
  </g>

  <!-- right: bits falling out -->
  <g filter="url(#sk)">
    <rect x="450" y="54" width="160" height="256" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="530" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">掉出来的最低位</text>
  <g font-size="11.5" text-anchor="middle">
    <text x="530" y="102" fill="#999">i=0：0 → 跳过</text>
    <text x="530" y="130" fill="#a07818" font-weight="bold">i=1：1 → odd</text>
    <text x="530" y="158" fill="#999">i=2：0 → 跳过</text>
    <text x="530" y="186" fill="#999">i=3：0 → 跳过</text>
    <text x="530" y="214" fill="#2c4a6e" font-weight="bold">i=4：1 → even</text>
    <text x="530" y="242" fill="#a07818" font-weight="bold">i=5：1 → odd</text>
  </g>
  <g filter="url(#sk)">
    <rect x="465" y="256" width="130" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="530" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">返回 [1, 2] ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="326" width="570" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="325" y="345" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">边界：n = 1 → 只有下标 0（偶）为 1 → [1, 0]；n = 2 → 只有下标 1（奇）为 1 → [0, 1]</text>
  <text x="325" y="362" text-anchor="middle" font-size="11" fill="#446688">先偶后奇：返回顺序是 [even, odd]，别写反</text>
</svg>
