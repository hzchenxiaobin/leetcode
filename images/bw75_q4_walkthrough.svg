<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "azbazbzaz" 的 Z 数组</text>

  <!-- 字符串行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="256" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="344" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="388" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="432" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="102" y="79">a</text><text x="146" y="79">z</text><text x="190" y="79">b</text>
    <text x="234" y="79">a</text><text x="278" y="79">z</text><text x="322" y="79">b</text>
    <text x="366" y="79">z</text><text x="410" y="79">a</text><text x="454" y="79">z</text>
  </g>

  <!-- i 下标 -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="102" y="108">i=0</text><text x="146" y="108">1</text><text x="190" y="108">2</text>
    <text x="234" y="108">3</text><text x="278" y="108">4</text><text x="322" y="108">5</text>
    <text x="366" y="108">6</text><text x="410" y="108">7</text><text x="454" y="108">8</text>
  </g>

  <!-- Z 值行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="124" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="124" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="168" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="212" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="256" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="300" y="124" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="344" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="388" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="432" y="124" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="102" y="147" font-weight="bold">9</text><text x="146" y="147">0</text><text x="190" y="147">0</text>
    <text x="234" y="147">0</text><text x="278" y="147">0</text>
    <text x="322" y="147" font-weight="bold" fill="#b85450">3</text>
    <text x="366" y="147">0</text><text x="410" y="147">0</text>
    <text x="454" y="147" font-weight="bold" fill="#b85450">2</text>
  </g>
  <text x="64" y="147" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">z[i]</text>

  <!-- 后缀对照 -->
  <g filter="url(#rough2)" font-size="13" fill="#555">
    <text x="110" y="196">s₆ = "zaz"（从 i=6 起）与前缀 "azb" 比到第 3 位分叉 → z[6] = 3 ✓</text>
    <text x="110" y="222">s₈ = "az"（从 i=8 起）与前缀 "az" 完全相同 → z[8] = 2 ✓</text>
    <text x="110" y="248">其余后缀首字符即与前缀 'a' 不同 → z[i] = 0</text>
  </g>

  <!-- 求和 -->
  <path d="M 280 260 C 280 266, 280 270, 280 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="282" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">总得分 = 9 + 0×5 + 3 + 0 + 2 = 14 ✓（与官方示例一致）</text>

  <rect x="130" y="328" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">构造顺序：s₉ → s₈ → … → s₁ 恰好后缀从短到长</text>
</svg>
