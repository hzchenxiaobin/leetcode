<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：k = 10 ⇒ j = 9 = 1001₂ ⇒ popcount = 2 ⇒ 'c'</text>

  <!-- 二进制位 -->
  <rect x="170" y="42" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="62" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="206" y="42" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="62" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="242" y="42" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="278" y="42" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="62" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="188" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₃（长16层）</text>
  <text x="224" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₂</text>
  <text x="260" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₁</text>
  <text x="296" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₀（长2层）</text>
  <text x="188" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="296" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="415" y="56" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">两个 1 ⇒ 两次落后半段</text>
  <text x="415" y="72" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（串长 16 层与串长 2 层）</text>

  <!-- 下落表：表头 -->
  <rect x="70" y="112" width="430" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">串长</text>
  <text x="190" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">位置 k</text>
  <text x="310" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定（前半 / 后半）</text>
  <text x="445" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- 行 1：串长16，落后半 -->
  <rect x="70" y="136" width="430" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="154" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">16</text>
  <text x="190" y="154" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">10</text>
  <text x="310" y="154" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">10 &gt; 8 ⇒ 落后半段</text>
  <text x="445" y="154" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k→2，记 +1</text>

  <!-- 行 2：串长8，前半 -->
  <rect x="70" y="164" width="430" height="28" fill="#f4f7fb" stroke="#9db4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">8</text>
  <text x="190" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="310" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2 ≤ 4 ⇒ 前半段</text>
  <text x="445" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">原样下落</text>

  <!-- 行 3：串长4，前半 -->
  <rect x="70" y="192" width="430" height="28" fill="#f4f7fb" stroke="#9db4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="190" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="310" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2 ≤ 2 ⇒ 前半段（压线）</text>
  <text x="445" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">原样下落</text>

  <!-- 行 4：串长2，落后半 -->
  <rect x="70" y="220" width="430" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="190" y="238" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="310" y="238" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">2 &gt; 1 ⇒ 落后半段</text>
  <text x="445" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k→1，记 +1</text>

  <!-- 行 5：基准 -->
  <rect x="70" y="248" width="430" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="190" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="310" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">到达基准</text>
  <text x="445" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">字符 'a'</text>

  <!-- 结果 -->
  <rect x="70" y="290" width="430" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="285" y="308" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">累计位移 +2 ⇒ ans = 'a' + 2 = 'c' ✓</text>
  <text x="285" y="326" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">对照闭式：popcount(1001₂) = 2，与逐层下落完全一致；k=5 时 j=4=100₂ ⇒ 'b' ✓</text>
</svg>
