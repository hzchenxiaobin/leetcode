<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：三组样例的逆序扫描轨迹</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: "52" -->
  <text x="40" y="105" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">示例① num = "52"</text>
  <g filter="url(#sk)">
    <rect x="180" y="80" width="40" height="40" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="226" y="80" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <text x="200" y="106" text-anchor="middle" font-size="18" fill="#b03a3a" font-weight="bold" font-family="monospace">5</text>
    <text x="246" y="106" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">2</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 246 72 L 204 72" stroke="#b03a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="180" y="142" font-size="11" fill="#444" font-family="monospace">i=1 '2' 偶 ✗ → i=0 '5' 奇 ✓ 命中</text>
  <g filter="url(#sk)">
    <rect x="470" y="80" width="170" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="555" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 "5"</text>
  <text x="555" y="140" text-anchor="middle" font-size="10" fill="#888">最右奇位在头部，前缀即单字符</text>
  <g filter="url(#sk)">
    <line x1="40" y1="168" x2="640" y2="168" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Row 2: "4206" -->
  <text x="40" y="220" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">示例② num = "4206"</text>
  <g filter="url(#sk)">
    <rect x="180" y="195" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="226" y="195" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="272" y="195" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="318" y="195" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <text x="200" y="221" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">4</text>
    <text x="246" y="221" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">2</text>
    <text x="292" y="221" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">0</text>
    <text x="338" y="221" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">6</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 338 187 L 202 187" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  </g>
  <text x="180" y="257" font-size="11" fill="#444" font-family="monospace">i=3→0：'4' '2' '0' '6' 全偶 ✗✗✗✗</text>
  <g filter="url(#sk)">
    <rect x="470" y="195" width="170" height="42" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="555" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">返回 ""</text>
  <text x="555" y="255" text-anchor="middle" font-size="10" fill="#888">扫描到 i = −1 越界，无奇子串</text>
  <g filter="url(#sk)">
    <line x1="40" y1="283" x2="640" y2="283" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Row 3: "35427" -->
  <text x="40" y="330" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">示例③ num = "35427"</text>
  <g filter="url(#sk)">
    <rect x="180" y="305" width="40" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="226" y="305" width="40" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="272" y="305" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="318" y="305" width="40" height="40" rx="6" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="364" y="305" width="40" height="40" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <text x="200" y="331" text-anchor="middle" font-size="18" fill="#2e6e2e" font-family="monospace">3</text>
    <text x="246" y="331" text-anchor="middle" font-size="18" fill="#2e6e2e" font-family="monospace">5</text>
    <text x="292" y="331" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">4</text>
    <text x="338" y="331" text-anchor="middle" font-size="18" fill="#777" font-family="monospace">2</text>
    <text x="384" y="331" text-anchor="middle" font-size="18" fill="#b03a3a" font-weight="bold" font-family="monospace">7</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 384 297 L 384 297" stroke="#b03a3a" stroke-width="1.6"/>
  </g>
  <text x="180" y="362" font-size="11" fill="#444" font-family="monospace">i=4 '7' 奇 ✓ 一步命中（无需向左）</text>
  <g filter="url(#sk)">
    <rect x="470" y="305" width="170" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="555" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 "35427"</text>
  <text x="555" y="365" text-anchor="middle" font-size="10" fill="#888">最右奇位恰在末位，整串即答案</text>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="40" y="384" width="600" height="38" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">三种形态：奇位在头 / 无奇位 / 奇位在尾 —— 覆盖该算法的全部边界情形</text>
</svg>
