<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,1,2,2,3] → 降序 [3,2,2,1,1] → ans = 4</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- scan table -->
  <text x="185" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">一遍扫描（降序）</text>
  <g filter="url(#sk)">
    <rect x="52" y="84" width="42" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="94" y="84" width="58" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="152" y="84" width="86" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="84" width="66" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="52" y="112" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="94" y="112" width="58" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="152" y="112" width="86" height="34" rx="4" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="238" y="112" width="66" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="52" y="146" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="94" y="146" width="58" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="152" y="146" width="86" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="238" y="146" width="66" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="52" y="180" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="94" y="180" width="58" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="152" y="180" width="86" height="34" rx="4" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="238" y="180" width="66" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="52" y="214" width="42" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="94" y="214" width="58" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="152" y="214" width="86" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="238" y="214" width="66" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="73" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="123" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">nums[i]</text>
  <text x="195" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">与前值比较</text>
  <text x="271" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">ans</text>
  <text x="73" y="133" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="123" y="133" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="195" y="133" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">2 ≠ 3 换值</text>
  <text x="271" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">0+1=1</text>
  <text x="73" y="167" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="123" y="167" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="195" y="167" text-anchor="middle" font-size="11.5" fill="#666">2 = 2</text>
  <text x="271" y="167" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="73" y="201" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="123" y="201" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="195" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">1 ≠ 2 换值</text>
  <text x="271" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1+3=4</text>
  <text x="73" y="235" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="123" y="235" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="195" y="235" text-anchor="middle" font-size="11.5" fill="#666">1 = 1</text>
  <text x="271" y="235" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="185" y="272" text-anchor="middle" font-size="11" fill="#888">换值时 ans += i：i=1 → +1；i=3 → +3</text>

  <!-- right side: boundary view -->
  <text x="520" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">边界视角 ↔ 操作对照</text>
  <g filter="url(#sk)">
    <rect x="376" y="84" width="288" height="56" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="520" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">边界① 3|2：值 ≥ 3 的元素 1 个</text>
  <text x="520" y="126" text-anchor="middle" font-size="11.5" fill="#7a4040">→ 操作①：3 → 2</text>

  <g filter="url(#sk)">
    <rect x="376" y="150" width="288" height="56" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="520" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">边界② 2|1：值 ≥ 2 的元素 3 个</text>
  <text x="520" y="192" text-anchor="middle" font-size="11.5" fill="#7a4040">→ 操作②③④：2 → 1 ×3</text>

  <!-- array evolution -->
  <text x="520" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">真实操作序列（原数组下标）</text>
  <g filter="url(#sk)">
    <rect x="384" y="244" width="272" height="120" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="520" y="266" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">① 3→2：[1,1,2,2,2]</text>
  <text x="520" y="288" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">② 2→1：[1,1,1,2,2]</text>
  <text x="520" y="310" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">③ 2→1：[1,1,1,1,2]</text>
  <text x="520" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">④ 2→1：[1,1,1,1,1]</text>
  <text x="520" y="354" text-anchor="middle" font-size="10.5" fill="#888">每次恰降一层，与扫描计数一一对应</text>

  <!-- verdict -->
  <g filter="url(#sk)">
    <rect x="230" y="380" width="220" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="340" y="401" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">ans = 1 + 3 = 4 ✓</text>
</svg>
