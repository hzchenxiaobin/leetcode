<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="424" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一个回合的结构：手数恒为偶数，所以末手是 K</text>
  <path d="M 158 42 Q 380 49 602 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三个流程框 -->
  <rect x="36" y="66" width="208" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S 的回合</text>
  <text x="140" y="112" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">交出自己的一个整数</text>
  <text x="140" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">|S| : k → k − 1</text>

  <path d="M 250 109 L 286 109" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="292" y="66" width="208" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="396" y="90" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">K 的回合</text>
  <text x="396" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">把自己一个整数送出</text>
  <text x="396" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">|S| : k − 1 → k</text>

  <path d="M 506 109 L 542 109" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="548" y="66" width="176" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="636" y="90" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">一轮结束</text>
  <text x="636" y="112" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">|S| 回到 k</text>
  <text x="636" y="136" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">末手 K ⇒ |S| = k</text>

  <!-- 中间的关键不等式 -->
  <rect x="36" y="172" width="688" height="60" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="196" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">S 想在每回合都送出一个「不心疼」的元素：k 个元素里最多只有 2 个是端点，</text>
  <text x="380" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">可牺牲的名额 = k − 2，所以 k ≥ 3 时两端能永久保命；k = 2 时一次都保不住两个。</text>

  <!-- 三种情形 -->
  <rect x="36" y="252" width="212" height="108" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="142" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">k ≥ 3</text>
  <text x="142" y="300" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">永远保 L 与 R</text>
  <text x="142" y="320" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">K 每一步都不会缩小范围</text>
  <text x="142" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案 = R − L</text>

  <rect x="274" y="252" width="212" height="108" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">k = 2</text>
  <text x="380" y="300" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">只能守住其中一个</text>
  <text x="380" y="320" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">K 把它的邻居喂给它</text>
  <text x="380" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">答案 = 1</text>

  <rect x="512" y="252" width="212" height="108" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="618" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k = 1</text>
  <text x="618" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">集合只有一个数</text>
  <text x="618" y="320" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">范围只能是 0</text>
  <text x="618" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案 = 0 = R − L</text>

  <!-- 结论条 -->
  <rect x="36" y="376" width="688" height="34" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="398" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">k = 1 与 k ≥ 3 都能被 R − L 统一，只有 k = 2 是特例 —— 这是本题唯一的分支</text>
</svg>
