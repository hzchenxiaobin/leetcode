<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="350" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">并查集：可交换关系把下标划成若干连通分量</text>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：swaps = [[0,2],[1,2]] → 一个分量</text>
  <circle cx="150" cy="130" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="136" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="300" cy="200" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="450" cy="130" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="136" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 176 138 L 276 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 424 192 L 324 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="246" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0 — 2 — 1 连通：任意重排 [1,2,3]</text>
  <rect x="40" y="268" width="520" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="292" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">同一分量内：元素可任取到任意位置（沿路径做相邻交换）</text>
  <text x="58" y="314" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">不同分量间：元素不能跨越 → 每个分量的元素多重集固定不变</text>
</svg>
