<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：tasks = [[1,6],[2,3]]</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="64" width="240" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="180" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">任务 1</text>
  <g font-size="13" fill="#444" font-family="monospace" text-anchor="middle">
    <text x="180" y="112">[s, t] = [1, 6]</text>
    <text x="180" y="132">完成 = 1 + 6</text>
    <text x="180" y="156" font-weight="bold" fill="#2b6e9e">= 7</text>
  </g>

  <g filter="url(#sk)">
    <rect x="340" y="64" width="240" height="104" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="460" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">任务 2</text>
  <g font-size="13" fill="#444" font-family="monospace" text-anchor="middle">
    <text x="460" y="112">[s, t] = [2, 3]</text>
    <text x="460" y="132">完成 = 2 + 3</text>
    <text x="460" y="156" font-weight="bold" fill="#2e6e2e">= 5 ← 最早！</text>
  </g>

  <g filter="url(#sk)">
    <rect x="180" y="190" width="280" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="217" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold" font-family="monospace">ans = min(7, 5) = 5 ✓</text>

  <g filter="url(#sk)">
    <rect x="60" y="256" width="520" height="88" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="320" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">示例 2：三个任务完全相同</text>
  <text x="320" y="302" text-anchor="middle" font-size="12.5" fill="#555" font-family="monospace">tasks = [[100,100],[100,100],[100,100]]</text>
  <text x="320" y="326" text-anchor="middle" font-size="12.5" fill="#555">都在 100 + 100 = 200 完成 → ans = 200（重复值不影响 min）</text>
</svg>
