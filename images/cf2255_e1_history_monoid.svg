<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">每个位置的历史 = 一条随时间增长的序列（查询 = 该序列的最大子段和）</text>

  <!-- 网格：行=版本，列=位置 -->
  <text x="96" y="98" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">版本 0</text>
  <text x="96" y="138" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">版本 1</text>
  <text x="96" y="178" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">版本 2</text>
  <text x="96" y="218" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">版本 3</text>
  <text x="96" y="258" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">版本 4</text>

  <text x="150" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">p=1</text>
  <text x="212" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">p=2</text>
  <text x="274" y="70" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">p=3</text>
  <text x="336" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">p=4</text>
  <text x="398" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">p=5</text>

  <rect x="246" y="80" width="56" height="196" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="124" y="84" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="84" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="84" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="310" y="84" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="84" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="124" y="124" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="124" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="124" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="310" y="124" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="124" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="124" y="164" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="164" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="164" width="52" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="310" y="164" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="164" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="124" y="204" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="204" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="204" width="52" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="310" y="204" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="204" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="124" y="244" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="244" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="244" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="310" y="244" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="244" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>

  <text x="150" y="105" text-anchor="middle" font-size="14" fill="#3f6633" filter="url(#rough2)">1</text>
  <text x="212" y="105" text-anchor="middle" font-size="14" fill="#3f6633" filter="url(#rough2)">-1</text>
  <text x="274" y="105" text-anchor="middle" font-size="14" fill="#3f6633" filter="url(#rough2)">1</text>
  <text x="274" y="145" text-anchor="middle" font-size="14" fill="#3f6633" filter="url(#rough2)">1</text>
  <text x="274" y="185" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">-1</text>
  <text x="274" y="225" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">-1</text>
  <text x="274" y="265" text-anchor="middle" font-size="14" fill="#3f6633" filter="url(#rough2)">1</text>
  <text x="450" y="145" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">…</text>
  <text x="450" y="225" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">…</text>

  <!-- 高亮列说明 -->
  <path d="M274,278 L274,294 L404,294" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="404" cy="294" r="3.2" fill="#b85450" filter="url(#rough2)"/>
  <text x="290" y="292" font-size="12.5" fill="#b85450" filter="url(#rough2)">p=3 这条竖列就是它的历史</text>

  <!-- 四元组 -->
  <rect x="478" y="96" width="392" height="70" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="674" y="122" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">序列信息四元组 (s, p, q, m)</text>
  <text x="674" y="152" text-anchor="middle" font-size="12.5" fill="#8a6420" filter="url(#rough2)">s 总和 · p 最大前缀 · q 最大后缀 · m 最大子段（均非空）</text>

  <!-- 合并公式 -->
  <rect x="478" y="186" width="392" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="674" y="212" text-anchor="middle" font-size="15" fill="#3f6633" filter="url(#rough2)">合并 A ⊕ B（拼接两段序列）</text>
  <text x="508" y="242" font-size="14" fill="#3f6633" filter="url(#rough2)">s = s₁ + s₂</text>
  <text x="508" y="266" font-size="14" fill="#3f6633" filter="url(#rough2)">p = max(p₁, s₁ + p₂)</text>
  <text x="508" y="290" font-size="14" fill="#3f6633" filter="url(#rough2)">q = max(q₂, s₂ + q₁)</text>
  <text x="508" y="314" font-size="14" fill="#3f6633" filter="url(#rough2)">m = max(m₁, m₂, q₁ + p₂)</text>

  <text x="478" y="368" font-size="13.5" fill="#446688" filter="url(#rough2)">空序列作为幺元，合并 O(1) 且满足结合律</text>
  <text x="478" y="396" font-size="13.5" fill="#446688" filter="url(#rough2)">⇒ 可以用线段树 / 懒标记批量维护</text>
  <text x="478" y="424" font-size="13" fill="#888" filter="url(#rough2)">查询 p 的答案就是 p 这条历史的 m</text>

  <text x="124" y="310" font-size="13" fill="#666" filter="url(#rough2)">每个版本只改一段前缀/区间</text>
  <text x="124" y="334" font-size="13" fill="#666" filter="url(#rough2)">未覆盖的位置「值不变」</text>
  <text x="124" y="358" font-size="13" fill="#666" filter="url(#rough2)">⇒ 历史是一条阶梯序列</text>
</svg>
