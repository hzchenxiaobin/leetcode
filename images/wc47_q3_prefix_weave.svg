<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀差恒为 1，剩余 k 个数首尾交替织出 k, k−1, …, 1</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">相邻差一共只有 n−1 个 ⇒ k ≤ n−1；题面保证 k &lt; n，故任何 k 都有解，只需构造</text>

  <!-- ① 前缀段 -->
  <text x="34" y="76" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 前缀 1 … n−k（m = n−k 个）：单调递增，差值只贡献 1 种</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <rect x="34" y="88" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="108" y="88" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="88" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="256" y="88" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="330" y="88" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="58" y="110" filter="url(#rough2)">1</text>
    <text x="132" y="110" filter="url(#rough2)">2</text>
    <text x="206" y="110" filter="url(#rough2)">3</text>
    <text x="280" y="110" filter="url(#rough2)">⋯</text>
    <text x="354" y="110" font-size="10.5" filter="url(#rough2)">n−k</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#d6a040">
    <text x="95" y="110" filter="url(#rough2)">1</text>
    <text x="169" y="110" filter="url(#rough2)">1</text>
    <text x="243" y="110" filter="url(#rough2)">1</text>
    <text x="317" y="110" filter="url(#rough2)">1</text>
  </g>
  <text x="392" y="110" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">差恒为 1</text>

  <!-- ② 交替段 -->
  <text x="34" y="152" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 剩余区间 [n−k+1, n] 共 k 个数：最大值、最小值交替取出</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a5a30" font-weight="bold">
    <rect x="34" y="164" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="108" y="164" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="182" y="164" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="256" y="164" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="330" y="164" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="58" y="186" filter="url(#rough2)">n</text>
    <text x="132" y="186" font-size="10.5" filter="url(#rough2)">n−k+1</text>
    <text x="206" y="186" filter="url(#rough2)">n−1</text>
    <text x="280" y="186" font-size="10.5" filter="url(#rough2)">n−k+2</text>
    <text x="354" y="186" filter="url(#rough2)">⋯</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#b85450" font-weight="bold">
    <text x="95" y="186" filter="url(#rough2)">k</text>
    <text x="169" y="186" filter="url(#rough2)">k−1</text>
    <text x="243" y="186" filter="url(#rough2)">k−2</text>
    <text x="317" y="186" filter="url(#rough2)">⋯</text>
  </g>
  <text x="392" y="180" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">依次递减</text>
  <text x="392" y="194" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">直到 1</text>

  <path d="M 58 124 L 58 162" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="137" font-size="9" fill="#446688" filter="url(#rough2)">接缝差 = n−m = k</text>

  <!-- ③ 结论 -->
  <rect x="34" y="222" width="240" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="242" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">差值序列的组成</text>
  <text x="48" y="264" font-size="10" fill="#555" filter="url(#rough2)">m−1 个 1（前缀内部）</text>
  <text x="48" y="284" font-size="10" fill="#555" filter="url(#rough2)">1 个 k（前缀 → 最大的接缝）</text>
  <text x="48" y="304" font-size="10" fill="#555" filter="url(#rough2)">k−1 个：k−1, k−2, …, 1（交替内部）</text>
  <text x="48" y="324" font-size="10" fill="#888" filter="url(#rough2)">合计 (m−1)+1+(k−1) = n−1 个差</text>

  <rect x="292" y="222" width="234" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="242" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">不同取值恰为 {1, 2, …, k}</text>
  <text x="306" y="264" font-size="10" fill="#555" filter="url(#rough2)">k 由接缝提供，k−1 … 2 由交替段提供</text>
  <text x="306" y="284" font-size="10" fill="#555" filter="url(#rough2)">1 由前缀（或交替段末项）提供</text>
  <text x="306" y="304" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">⇒ 不同整数个数 = k ✓</text>
  <text x="306" y="324" font-size="10" fill="#888" filter="url(#rough2)">不重不漏，恰好命中题意</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">要点：接缝差 n − (n−k) = k 与交替段首差 k 是同一个值，所以两段拼起来不会多出新的差值</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若把交替段的顺序反过来（先取最小），接缝差会退化成 1、首差退化成 k−1，最终只剩下 k−1 种差值</text>
</svg>
