<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">正向难贪心，逆向只有一条路</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">从 target 往回走：偶数只能「除以 2」或「加 1」，奇数只剩「加 1」</text>

  <rect x="24" y="70" width="240" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="144" y="92" font-size="12" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">正向（题面给的两种操作）</text>
  <text x="40" y="116" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">Double：x → 2x</text>
  <text x="40" y="138" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">Decrement：x → x − 1</text>
  <text x="40" y="162" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">每步都有两个选择 → 搜索空间指数级</text>

  <rect x="296" y="70" width="240" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="416" y="92" font-size="12" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">逆向（从 target 出发）</text>
  <text x="312" y="116" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">除以 2：仅当 x 为偶数</text>
  <text x="312" y="138" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">加 1：始终可用</text>
  <text x="312" y="162" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">奇数时第一种不合法 → 选择被唯一化</text>

  <path d="M 266 122 L 294 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="196" width="512" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="217" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">算法：while target &gt; startValue: 偶数就 target /= 2，奇数就 target += 1，计数加一</text>
  <text x="36" y="237" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">循环结束后 target ≤ startValue，剩余差距靠正向递减补齐，共 startValue − target 步。</text>

  <rect x="24" y="262" width="512" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="283" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">为什么偶数时「除以 2」不会更差？设最优正序列最后一次加倍前的值为 v，之后连续 r 次递减到 t。</text>
  <text x="36" y="303" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">因 t = 2v − r 为偶数、2v 为偶数，故 r 必为偶数；改为先递减 r/2 次到 t/2 再加倍，步数不增。</text>
</svg>
