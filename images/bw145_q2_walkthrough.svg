<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：strength = [3,4,1]，k = 1</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最优顺序是 1 → 4 → 3：先开最小的锁把 x 顶起来</text>

  <rect x="46" y="64" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="101" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">时间</text>
  <rect x="160" y="64" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="234" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="279" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">能量 E</text>
  <rect x="328" y="64" width="186" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="421" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="46" y="106" width="110" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="101" y="129" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">第 1 分钟</text>
  <rect x="160" y="106" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="195" y="129" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="234" y="106" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="279" y="129" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="328" y="106" width="186" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="421" y="129" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">破 strength = 1，x 变 2</text>

  <rect x="46" y="150" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="101" y="173" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">第 2~3 分钟</text>
  <rect x="160" y="150" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="195" y="173" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="234" y="150" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="279" y="173" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">4</text>
  <rect x="328" y="150" width="186" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="421" y="173" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">破 strength = 4，x 变 3</text>

  <rect x="46" y="194" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="101" y="217" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">第 4 分钟</text>
  <rect x="160" y="194" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="195" y="217" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3</text>
  <rect x="234" y="194" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="279" y="217" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3</text>
  <rect x="328" y="194" width="186" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="421" y="217" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">破 strength = 3，全部完成</text>

  <rect x="130" y="252" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">总时间 1 + 2 + 1 = 4 分钟</text>
  <text x="280" y="291" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">对比"最强优先"：4 + 2 + 1 = 7 分钟</text>
</svg>
