<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 走查：nums1=[1,3,3,2]，nums2=[2,1,3,4]，k=3</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="48" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="48" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="48" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="410" y="48" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="68">进入下标(瓶颈)</text><text x="205" y="68">堆内容</text>
    <text x="335" y="68">sum（堆和）</text><text x="465" y="68">候选分数</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="82" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="150" y="82" width="110" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="260" y="82" width="150" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="410" y="82" width="110" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="105">3（b=4）</text><text x="205" y="105">{2}</text>
    <text x="335" y="105">2</text><text x="465" y="105" fill="#999">不足 k</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="124" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="124" width="110" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="260" y="124" width="150" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="410" y="124" width="110" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="147">2（b=3）</text><text x="205" y="147">{2, 3}</text>
    <text x="335" y="147">5</text><text x="465" y="147" fill="#999">不足 k</text>
  </g>

  <!-- 行 3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="166" width="110" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="150" y="166" width="110" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="260" y="166" width="150" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="410" y="166" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="189">0（b=2）</text><text x="205" y="189">{1, 2, 3}</text>
    <text x="335" y="189">6</text><text x="465" y="189" fill="#2d5a22" font-weight="bold">6 × 2 = 12</text>
  </g>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="208" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="150" y="208" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="260" y="208" width="150" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="410" y="208" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="231">1（b=1）</text><text x="205" y="231">{2,3,3}</text>
    <text x="335" y="231">8</text><text x="465" y="231" fill="#2d5a22">8 × 1 = 8</text>
  </g>
  <text x="300" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">（第 4 步压入 3 后弹出的是刚进来的 1——瓶颈元素被挤走是正常现象，见引理 1 的放缩方向）</text>

  <!-- 结论 -->
  <rect x="100" y="284" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">ans = max(12, 8) = 12 ✓（官方输出）</text>

  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">最优解 {0,2,3}：(1+3+2) × min(2,3,4) = 12，</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">在第 3 步（其最后一个元素下标 0 进入时）被堆罩住并记录</text>
</svg>
