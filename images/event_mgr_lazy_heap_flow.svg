<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">pollHighest：弹出 → 查真伪 → 丢弃或返回</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#444">尸体只是被跳过，不影响正确性；循环弹到首个有效条目为止</text>

  <!-- 主流程 -->
  <g filter="url(#sk)">
    <rect x="60" y="64" width="170" height="38" rx="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="145" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">pollHighest()</text>
  <g filter="url(#sk)">
    <path d="M 145 102 L 145 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <polygon points="145,126 215,168 145,210 75,168" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="145" y="173" text-anchor="middle" font-size="12" fill="#7a5415">堆空？</text>
  <text x="224" y="160" font-size="11" fill="#b03a3a">是</text>
  <g filter="url(#sk)">
    <path d="M 215 168 L 279 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="283" y="148" width="120" height="40" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="343" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">return −1</text>
  <text x="153" y="228" font-size="11" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <path d="M 145 210 L 145 234" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="55" y="238" width="180" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="145" y="263" text-anchor="middle" font-size="12" fill="#2e6e2e">弹出堆顶 (−p, id)</text>
  <g filter="url(#sk)">
    <path d="M 145 278 L 145 302" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <polygon points="145,304 258,352 145,400 32,352" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="145" y="348" text-anchor="middle" font-size="11.5" fill="#7a5415">id ∈ cur 且</text>
  <text x="145" y="366" text-anchor="middle" font-size="11.5" fill="#7a5415">cur[id] == p ?</text>
  <text x="264" y="344" font-size="11" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <path d="M 258 352 L 324 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="328" y="330" width="205" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="430" y="348" text-anchor="middle" font-size="12" fill="#2e6e2e">del cur[id]（变不活跃）</text>
  <text x="430" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">return id</text>
  <text x="153" y="416" font-size="11" fill="#b03a3a">否</text>
  <g filter="url(#sk)">
    <path d="M 145 400 L 145 420" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="55" y="424" width="180" height="36" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="145" y="447" text-anchor="middle" font-size="12" fill="#b03a3a">丢弃尸体，继续弹</text>
  <g filter="url(#sk)">
    <path d="M 53 442 C 16 438 18 180 71 168" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  </g>

  <!-- 右列：其余两个操作 -->
  <g filter="url(#sk)">
    <rect x="450" y="64" width="200" height="104" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="550" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">updatePriority(id, np)</text>
  <text x="466" y="108" font-size="11" fill="#444">① cur[id] = np（覆盖真相）</text>
  <text x="466" y="126" font-size="11" fill="#444">② push (−np, id)（追加候选）</text>
  <text x="466" y="146" font-size="10.5" fill="#b03a3a">旧条目不动，自动变尸体</text>

  <g filter="url(#sk)">
    <rect x="450" y="182" width="200" height="74" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="550" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">构造（初始化）</text>
  <text x="466" y="224" font-size="11" fill="#444">全部 (−p, id) 入堆</text>
  <text x="466" y="242" font-size="11" fill="#444">heapify O(n)；cur 建表</text>

  <g filter="url(#sk)">
    <rect x="450" y="272" width="200" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="550" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">排序键 (−p, id)</text>
  <text x="466" y="314" font-size="11" fill="#444">小根堆弹出序：</text>
  <text x="466" y="332" font-size="11" fill="#444">p 大者优先；</text>
  <text x="466" y="350" font-size="11" fill="#444">p 并列 → id 小者优先</text>

  <g filter="url(#sk)">
    <rect x="450" y="378" width="200" height="66" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="550" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">均摊代价</text>
  <text x="466" y="418" font-size="11" fill="#444">每条目至多一压一弹</text>
  <text x="466" y="436" font-size="11" fill="#444">总 O((n+q) log(n+q))，n, q ≤ 1e5</text>
</svg>
