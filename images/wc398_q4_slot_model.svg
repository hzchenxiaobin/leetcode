<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：终点位置 = 2ˣ − y，「不能连续向下」⟹ 槽位组合数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">向上跳距只由「这是第几次向上」决定，与向下怎么穿插无关——一条方案被压缩成两个整数 (x, y)</text>

  <!-- 面板 A：跳距结构 -->
  <rect x="30" y="54" width="500" height="178" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="46" y="78" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">第一步：第 j 次向上恰跳 2ʲ 级（j 从 0 数起）——与向下插在哪儿无关</text>

  <!-- 台阶轴 -->
  <line x1="70" y1="160" x2="510" y2="160" stroke="#c5cede" stroke-width="1.2" filter="url(#r)"/>
  <rect x="77" y="144" width="26" height="16" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="137" y="144" width="26" height="16" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="197" y="144" width="26" height="16" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="317" y="144" width="26" height="16" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="457" y="144" width="26" height="16" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <text x="90" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">0</text>
  <text x="150" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">1</text>
  <text x="210" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">2</text>
  <text x="330" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">4</text>
  <text x="470" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">8</text>

  <!-- 向上弧线 -->
  <path d="M 150 140 C 162 104, 198 104, 210 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">2⁰=1</text>
  <path d="M 210 140 C 240 96, 300 96, 330 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="270" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">2¹=2</text>
  <path d="M 330 140 C 370 88, 440 88, 470 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">2²=4</text>

  <!-- 向下弧线 -->
  <path d="M 150 162 C 136 188, 104 188, 90 162" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#r)"/>
  <text x="120" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">D：−1</text>

  <text x="280" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">总升高 = 2⁰ + 2¹ + ⋯ + 2ˣ⁻¹ = 2ˣ − 1   ⟹   终点 = 1 + (2ˣ−1) − y = 2ˣ − y</text>

  <!-- 面板 B：槽位模型 -->
  <rect x="30" y="248" width="500" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="46" y="272" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">第二步：「不能连续向下」⟹ 槽位模型——每个空档至多放 1 个 D</text>

  <rect x="66" y="288" width="54" height="32" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#r)"/>
  <text x="93" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">空₀</text>
  <rect x="128" y="288" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="155" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">U₁</text>
  <rect x="190" y="288" width="54" height="32" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#r)"/>
  <text x="217" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">空₁</text>
  <rect x="252" y="288" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="279" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">U₂</text>
  <rect x="314" y="288" width="54" height="32" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#r)"/>
  <text x="341" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">空₂</text>
  <rect x="376" y="288" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="403" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">U₃</text>
  <rect x="438" y="288" width="54" height="32" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#r)"/>
  <text x="465" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">空₃</text>

  <text x="46" y="346" font-size="12" fill="#333" filter="url(#r)">x 个 U 产生 x+1 个空档（首档 + 每个 U 之后各一档），从 x+1 个空档里选 y 个放 D</text>
  <text x="46" y="368" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">⟹ 方案数 = C(x+1, y)；例：x=2、y=2 选空₁空₂ → U D U D：1→2→1→3→2 ✓</text>

  <!-- 底部要点 -->
  <rect x="30" y="392" width="500" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">第三步：合法性自动满足——第 i 次向上后再向下时，位置 ≥ 2ⁱ − i ≥ 1，D 永远踩在 ≥1 处</text>
  <text x="280" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r)">第四步：ans = Σ C(x+1, 2ˣ − k)，只累加满足 0 ≤ 2ˣ − k ≤ x+1 的 x</text>

  <text x="280" y="470" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">「到达后离开再回来」= 更长的序列，被更大的 x 枚举到——方案口径严丝合缝</text>
</svg>
