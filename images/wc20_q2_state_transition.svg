<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">一次转移：mask 决定位置，allowed[pos] 决定候选</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">以 n = 4、mask = 0100（已用 {3}，popcount = 1）为例</text>

  <text x="145" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">值 4</text>
  <rect x="120" y="84" width="50" height="46" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="145" y="116" text-anchor="middle" font-size="21" fill="#66788f" filter="url(#rough2)">0</text>
  <text x="145" y="146" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="203" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">值 3</text>
  <rect x="178" y="84" width="50" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" rx="5" filter="url(#rough2)"/>
  <text x="203" y="116" text-anchor="middle" font-size="21" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="203" y="146" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="261" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">值 2</text>
  <rect x="236" y="84" width="50" height="46" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="261" y="116" text-anchor="middle" font-size="21" fill="#66788f" filter="url(#rough2)">0</text>
  <text x="261" y="146" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="319" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">值 1</text>
  <rect x="294" y="84" width="50" height="46" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="319" y="116" text-anchor="middle" font-size="21" fill="#66788f" filter="url(#rough2)">0</text>
  <text x="319" y="146" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">bit0</text>

  <rect x="372" y="80" width="256" height="66" fill="#f2f6fc" stroke="#9aa8bb" stroke-width="1.3" rx="9" filter="url(#rough2)"/>
  <text x="388" y="102" font-size="10.5" fill="#555" filter="url(#rough2)">popcount(0100) = 1 ⇔ pos = 2</text>
  <text x="388" y="120" font-size="10.5" fill="#555" filter="url(#rough2)">allowed[2] = {1, 2, 4}（2 的约数 ∪ 倍数）</text>
  <text x="388" y="138" font-size="10.5" fill="#555" filter="url(#rough2)">cand = allowed[2] &amp; ~mask = {1, 2, 4}</text>

  <path d="M 330 152 L 330 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 196 L 510 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 196 L 150 224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 196 L 330 224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 196 L 510 224" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="188" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">逐个 lowbit 取出候选值</text>
  <text x="160" y="216" font-size="10" fill="#b8860b" filter="url(#rough2)">k = 1</text>
  <text x="340" y="216" font-size="10" fill="#b8860b" filter="url(#rough2)">k = 2</text>
  <text x="520" y="216" font-size="10" fill="#b8860b" filter="url(#rough2)">k = 4</text>

  <rect x="75" y="229" width="150" height="46" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="249" text-anchor="middle" font-size="12.5" fill="#33502c" font-weight="bold" filter="url(#rough2)">0101</text>
  <text x="150" y="266" text-anchor="middle" font-size="10" fill="#4a6a42" filter="url(#rough2)">已用 {1, 3}　dp +1dp[0100]</text>
  <rect x="255" y="229" width="150" height="46" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="249" text-anchor="middle" font-size="12.5" fill="#33502c" font-weight="bold" filter="url(#rough2)">0110</text>
  <text x="330" y="266" text-anchor="middle" font-size="10" fill="#4a6a42" filter="url(#rough2)">已用 {2, 3}　dp +1dp[0100]</text>
  <rect x="435" y="229" width="150" height="46" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="249" text-anchor="middle" font-size="12.5" fill="#33502c" font-weight="bold" filter="url(#rough2)">1100</text>
  <text x="510" y="266" text-anchor="middle" font-size="10" fill="#4a6a42" filter="url(#rough2)">已用 {3, 4}　dp +1dp[0100]</text>

  <text x="330" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每条边只把一个 0 翻成 1 ⇒ 状态图是 DAG，按 mask 递增遍历天然是拓扑序</text>
  <text x="330" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">同一 mask 可能由多条路径到达（如 0011 有 2 条）⇒ 必须用 dp 累加方案数</text>
  <text x="330" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（图中数值均按 n = 4 计算）</text>
</svg>
