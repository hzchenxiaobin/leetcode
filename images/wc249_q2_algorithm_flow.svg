<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：一趟预处理 + 外层 26 字符 × 内层扫开区间</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 预处理 -->
  <g filter="url(#sk)"><rect x="150" y="60" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">一趟扫描 s</text>
  <text x="250" y="95" text-anchor="middle" font-size="10.5" fill="#444">记录 first[26] / last[26]，O(n)</text>
  <path d="M 250 104 L 250 118" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- for 循环 -->
  <g filter="url(#sk)"><rect x="180" y="118" width="140" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">for c = 'a' … 'z'</text>
  <path d="M 250 148 L 250 162" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 判空菱形 -->
  <path d="M 250 162 L 365 196 L 250 230 L 135 196 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="250" y="191" text-anchor="middle" font-size="11" fill="#8c3a36">first[c] = -1 或</text>
  <text x="250" y="207" text-anchor="middle" font-size="11" fill="#8c3a36">first[c] = last[c] ?</text>
  <path d="M 365 196 L 425 196" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="393" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">是</text>

  <!-- 跳过分支 -->
  <g filter="url(#sk)"><rect x="429" y="176" width="178" height="42" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.5"/></g>
  <text x="518" y="194" text-anchor="middle" font-size="11" fill="#666">跳过：中间窗口为空</text>
  <text x="518" y="210" text-anchor="middle" font-size="9.5" fill="#999">（该字符做不了两端）</text>
  <path d="M 518 176 C 518 150, 400 133, 325 133" stroke="#999999" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="440" y="152" text-anchor="middle" font-size="9.5" fill="#888">下一个 c</text>

  <!-- 扫区间 -->
  <path d="M 250 230 L 250 246" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="262" y="243" font-size="10.5" font-weight="bold" fill="#4a7a3a">否</text>
  <g filter="url(#sk)"><rect x="105" y="246" width="290" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">扫描开区间 (first[c], last[c])</text>
  <text x="250" y="285" text-anchor="middle" font-size="11" fill="#444">mask |= 1 &lt;&lt; (s[i] - 'a')</text>
  <path d="M 250 296 L 250 310" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>

  <!-- 累加 -->
  <g filter="url(#sk)"><rect x="140" y="310" width="220" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">ans += popcount(mask)</text>
  <text x="250" y="345" text-anchor="middle" font-size="9.5" fill="#666">窗口内不同字符数 = 该 c 的回文贡献</text>

  <!-- 循环回边 -->
  <path d="M 140 331 C 78 331, 78 133, 178 133" stroke="#999999" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="100" y="242" text-anchor="middle" font-size="9.5" fill="#888">下一个 c</text>

  <!-- 结束 -->
  <path d="M 250 352 L 250 368" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="322" y="364" text-anchor="middle" font-size="9.5" fill="#888">26 个字符全部处理完</text>
  <g filter="url(#sk)"><rect x="155" y="368" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="250" y="391" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">返回 ans</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="90" y="420" width="460" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="438" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">时间 O(26n) · 额外空间 O(26)</text>
  <text x="320" y="456" text-anchor="middle" font-size="10.5" fill="#444">按 (x, y) 对计数天然去重，答案上界 26 × 26 = 676</text>
</svg>
