<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">官方示例走查：BookMyShow(2, 5)</text>

  <!-- 步骤 1: gather(4,0) -->
  <text x="150" y="58" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">① gather(4, 0) → [0, 0]</text>
  <g filter="url(#rough2)">
    <rect x="50" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="86" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="122" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="158" y="70" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="194" y="70" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="50" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="86" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="122" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="158" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="194" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#888" text-anchor="middle">
    <text x="140" y="152">第 0 排坐 [0,3]，剩 1 座</text>
  </g>

  <!-- 步骤 2: gather(2,0) -->
  <text x="420" y="58" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">② gather(2, 0) → []</text>
  <g filter="url(#rough2)">
    <rect x="330" y="70" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="366" y="70" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="402" y="70" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="438" y="70" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="474" y="70" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="330" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="366" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="402" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="438" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="474" y="104" width="36" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text x="420" y="152" font-size="10.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">maxRow=0 且该排仅剩 1 座 &lt; 2 → 失败</text>

  <!-- 步骤 3: scatter(5,1) -->
  <text x="150" y="196" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">③ scatter(5, 1) → true</text>
  <g filter="url(#rough2)">
    <rect x="50" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="86" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="122" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="158" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="194" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="50" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="86" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="122" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="158" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="194" y="242" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="140" y="290" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">5 人拆开坐：第 0 排坐 1 位 + 第 1 排坐 4 位</text>

  <!-- 步骤 4: scatter(5,1) -->
  <text x="420" y="196" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">④ scatter(5, 1) → false</text>
  <g filter="url(#rough2)">
    <rect x="330" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="366" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="402" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="438" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="474" y="208" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="330" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="366" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="402" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="438" y="242" width="36" height="30" fill="#b85450" opacity="0.75" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="474" y="242" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="420" y="290" font-size="10.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">[0,1] 排仅剩 1 座 &lt; 5 → false</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="70" y="322" width="420" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="280" y="346" text-anchor="middle">输出序列：[null, [0,0], [], true, false]</text>
    <text x="280" y="368" text-anchor="middle">scatter 成功与否只看「总量够不够」，</text>
    <text x="280" y="388" text-anchor="middle">gather 成功与否只看「单排剩余够不够」</text>
  </g>
</svg>
