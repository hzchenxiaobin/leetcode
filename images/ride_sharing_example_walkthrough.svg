<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 478"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="478" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 走查：每次调用后的两条队列</text>
  <text x="30" y="54" font-size="12" fill="#666" filter="url(#rough2)">操作与返回</text>
  <text x="180" y="54" font-size="12" fill="#666" filter="url(#rough2)">乘客队列 riderQ</text>
  <text x="380" y="54" font-size="12" fill="#666" filter="url(#rough2)">司机队列 driverQ</text>

  <rect x="20" y="64" width="520" height="36" fill="#fafafa" rx="6" filter="url(#rough2)"/>
  <text x="30" y="87" font-size="12" fill="#333" filter="url(#rough2)">① addRider(3)</text>
  <rect x="180" y="68" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="87" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="396" y="87" font-size="12" fill="#999" filter="url(#rough2)">∅</text>

  <rect x="20" y="108" width="520" height="36" fill="#fafafa" rx="6" filter="url(#rough2)"/>
  <text x="30" y="131" font-size="12" fill="#333" filter="url(#rough2)">② addDriver(2)</text>
  <rect x="180" y="112" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="380" y="112" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="20" y="152" width="520" height="36" fill="#fafafa" rx="6" filter="url(#rough2)"/>
  <text x="30" y="175" font-size="12" fill="#333" filter="url(#rough2)">③ addRider(1)</text>
  <rect x="180" y="156" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="216" y="156" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="156" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="20" y="196" width="520" height="36" fill="#fafafa" rx="6" filter="url(#rough2)"/>
  <text x="30" y="219" font-size="12" fill="#333" filter="url(#rough2)">④ match → [2, 3]</text>
  <rect x="180" y="200" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="396" y="219" font-size="12" fill="#999" filter="url(#rough2)">∅</text>

  <rect x="20" y="240" width="520" height="36" fill="#fafafa" rx="6" filter="url(#rough2)"/>
  <text x="30" y="263" font-size="12" fill="#333" filter="url(#rough2)">⑤ addDriver(5)</text>
  <rect x="180" y="244" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="244" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <rect x="20" y="284" width="520" height="36" fill="#fff8e1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="307" font-size="12" fill="#333" filter="url(#rough2)">⑥ cancelRider(3) 无效</text>
  <rect x="180" y="288" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="288" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <rect x="20" y="328" width="520" height="36" fill="#fafafa" rx="6" filter="url(#rough2)"/>
  <text x="30" y="351" font-size="12" fill="#333" filter="url(#rough2)">⑦ match → [5, 1]</text>
  <text x="196" y="351" font-size="12" fill="#999" filter="url(#rough2)">∅</text>
  <text x="396" y="351" font-size="12" fill="#999" filter="url(#rough2)">∅</text>

  <rect x="20" y="372" width="520" height="36" fill="#fce4ec" rx="6" filter="url(#rough2)"/>
  <text x="30" y="395" font-size="12" fill="#333" filter="url(#rough2)">⑧ match → [-1, -1]</text>
  <text x="196" y="395" font-size="12" fill="#999" filter="url(#rough2)">∅</text>
  <text x="396" y="395" font-size="12" fill="#999" filter="url(#rough2)">∅</text>

  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">⑥：乘客 3 已在 ④ 被匹配、移出 waiting，取消是空操作</text>
  <text x="280" y="456" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">⑧：乘客队列已空 → 无可配对的人，返回 [-1, -1]（司机队列恰好也空）</text>
</svg>
