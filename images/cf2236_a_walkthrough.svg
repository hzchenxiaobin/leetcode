<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="710" height="330" fill="#fafafa"/>
  <text x="355" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">四组官方样例的走查（H = M + 1，k = H − m）</text>

  <!-- 表头底色 -->
  <rect x="20" y="40" width="670" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- 答案列底色 -->
  <rect x="620" y="72" width="70" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- 横线 -->
  <path d="M 20 72 L 690 72" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 20 114 L 690 114" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 156 L 690 156" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 198 L 690 198" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 244 L 690 244" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 竖线 -->
  <path d="M 160 40 L 160 244" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 230 40 L 230 244" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 300 40 L 300 244" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 390 40 L 390 244" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 530 40 L 530 244" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 620 40 L 620 244" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头文字 -->
  <text x="90" y="62" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">h 数组</text>
  <text x="195" y="62" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">m</text>
  <text x="265" y="62" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">M</text>
  <text x="345" y="62" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">H = M+1</text>
  <text x="460" y="62" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">x_i = H − h</text>
  <text x="575" y="62" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">k = H − m</text>
  <text x="655" y="62" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">答案</text>

  <!-- 第 1 行 -->
  <text x="90" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 3</text>
  <text x="195" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="345" y="102" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="460" y="102" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">3 1</text>
  <text x="575" y="102" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="655" y="102" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">3</text>

  <!-- 第 2 行 -->
  <text x="90" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 6 4</text>
  <text x="195" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="265" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="345" y="144" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="460" y="144" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">5 1 3</text>
  <text x="575" y="144" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="655" y="144" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">5</text>

  <!-- 第 3 行 -->
  <text x="90" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 4 6 6 1</text>
  <text x="195" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="265" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="345" y="186" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="460" y="186" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2 3 1 1 6</text>
  <text x="575" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="655" y="186" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">6</text>

  <!-- 第 4 行 -->
  <text x="90" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 3 3 3</text>
  <text x="195" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="265" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="345" y="228" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="460" y="228" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1 1 1 1</text>
  <text x="575" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="655" y="228" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">1</text>

  <!-- 注释 -->
  <text x="26" y="272" font-size="11" fill="#444" filter="url(#rough2)">第 3 行：最矮的塔要补 6 格，它决定 k；第 4 行：m = M，增量全为 1，故 k = 1。</text>
  <text x="26" y="296" font-size="11" fill="#444" filter="url(#rough2)">恒定关系：最大增量 = H − m = (M + 1) − m，所以 k 只由 m 与 M 决定。</text>
</svg>
