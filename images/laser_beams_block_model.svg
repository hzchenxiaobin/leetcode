<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">激光束只存在于「相邻的非空行」之间</text>
  <path d="M 170 42 Q 380 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行标签 -->
  <text x="138" y="107" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">第 0 行</text>
  <text x="138" y="123" text-anchor="end" font-size="11" fill="#8a6415" filter="url(#sk)">3 个设备</text>
  <text x="138" y="197" text-anchor="end" font-size="12.5" fill="#8a8a8a" font-weight="bold" filter="url(#sk)">第 1 行</text>
  <text x="138" y="213" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#sk)">空行</text>
  <text x="138" y="287" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">第 2 行</text>
  <text x="138" y="303" text-anchor="end" font-size="11" fill="#8a6415" filter="url(#sk)">2 个设备</text>
  <text x="138" y="377" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">第 3 行</text>
  <text x="138" y="393" text-anchor="end" font-size="11" fill="#8a6415" filter="url(#sk)">1 个设备</text>

  <!-- 第 0 行：011001 -->
  <g filter="url(#sk)">
    <rect x="150" y="88" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="194" y="88" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="238" y="88" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="282" y="88" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="326" y="88" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="370" y="88" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="216" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="260" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="392" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>

  <!-- 第 1 行：000000（空行，被穿过） -->
  <g filter="url(#sk)">
    <rect x="150" y="178" width="44" height="44" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="194" y="178" width="44" height="44" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="238" y="178" width="44" height="44" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="282" y="178" width="44" height="44" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="326" y="178" width="44" height="44" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="370" y="178" width="44" height="44" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="292" y="204" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#sk)">全空 → 激光束自由穿过</text>

  <!-- 第 2 行：010100 -->
  <g filter="url(#sk)">
    <rect x="150" y="268" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="194" y="268" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="238" y="268" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="282" y="268" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="326" y="268" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="370" y="268" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="216" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1</text>
  <text x="304" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1</text>

  <!-- 第 3 行：001000 -->
  <g filter="url(#sk)">
    <rect x="150" y="358" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="194" y="358" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="238" y="358" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="282" y="358" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="326" y="358" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="370" y="358" width="44" height="44" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="260" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">1</text>

  <!-- 激光束：第 0 行 → 第 2 行（3×2 = 6 条） -->
  <g stroke="#d68440" stroke-width="1.3" opacity="0.75" filter="url(#sk)">
    <path d="M 216 112 L 216 292" fill="none"/>
    <path d="M 216 112 L 304 292" fill="none"/>
    <path d="M 260 112 L 216 292" fill="none"/>
    <path d="M 260 112 L 304 292" fill="none"/>
    <path d="M 392 112 L 216 292" fill="none"/>
    <path d="M 392 112 L 304 292" fill="none"/>
  </g>

  <!-- 激光束：第 2 行 → 第 3 行（2×1 = 2 条） -->
  <g stroke="#4a8a5a" stroke-width="1.3" opacity="0.8" filter="url(#sk)">
    <path d="M 216 292 L 260 382" fill="none"/>
    <path d="M 304 292 L 260 382" fill="none"/>
  </g>

  <!-- 被阻挡：第 0 行 → 第 3 行 -->
  <path d="M 392 112 L 260 382" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 336 270 L 352 286" stroke="#b85450" stroke-width="3" fill="none"/>
    <path d="M 352 270 L 336 286" stroke="#b85450" stroke-width="3" fill="none"/>
  </g>
  <text x="418" y="238" font-size="11.5" fill="#b85450" filter="url(#sk)">第 0 行 ↔ 第 3 行：</text>
  <text x="418" y="253" font-size="11.5" fill="#b85450" filter="url(#sk)">中间有非空行 → 阻挡 ✗</text>

  <!-- 组标注 -->
  <g filter="url(#sk)">
    <rect x="418" y="128" width="118" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="477" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">3 × 2 = 6 条</text>
  <g filter="url(#sk)">
    <rect x="322" y="408" width="112" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="378" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">2 × 1 = 2 条</text>

  <!-- 右侧：乘法计数公式框 -->
  <g filter="url(#sk)">
    <rect x="470" y="290" width="260" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="600" y="316" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688">乘法计数</text>
  <text x="600" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">每行设备数：3, 0, 2, 1</text>
  <text x="600" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">非空行序列：3, 2, 1</text>
  <text x="600" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">ans = 3×2 + 2×1 = 8</text>
  <text x="600" y="406" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">相邻非空行两两配对相乘</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="80" y="462" width="600" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="380" y="482" text-anchor="middle" font-size="12" fill="#8a6415">中间任何一个非空行都会挡住两侧设备的激光束 —— 所以只需看「紧挨着的」非空行对</text>

  <!-- 页脚小注 -->
  <text x="380" y="530" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">对应示例 1：bank = ["011001","000000","010100","001000"]</text>
</svg>
