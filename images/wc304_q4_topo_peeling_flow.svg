<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">拓扑剥挂链：先删链、后数环</text>

  <rect x="362" y="48" width="148" height="56" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="68" text-anchor="middle" font-size="10.5" fill="#333"
        filter="url(#rough2)">全程不建邻接表</text>
  <text x="436" y="83" text-anchor="middle" font-size="10.5" fill="#333"
        filter="url(#rough2)">edges[u] 即唯一后继</text>
  <text x="436" y="98" text-anchor="middle" font-size="10.5" fill="#333"
        filter="url(#rough2)">每点至多出队一次</text>

  <rect x="90" y="44" width="250" height="42" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="70" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">① 统计入度：edges[i] ≠ −1 ⇒ indeg[edges[i]]++</text>

  <path d="M 215 86 L 215 108" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="90" y="108" width="250" height="42" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="134" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">② 入度 0 的节点全部入队 order</text>

  <path d="M 215 150 L 215 168" stroke="#446688" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="215,168 340,210 215,252 90,210" fill="#fce4ec"
           stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="204" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">③ 队列还有</text>
  <text x="215" y="221" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">节点？</text>

  <path d="M 340 210 L 366 210" stroke="#b85450" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="352" y="200" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">是</text>

  <rect x="368" y="182" width="142" height="58" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="199" text-anchor="middle" font-size="10.5" fill="#333"
        filter="url(#rough2)">出队 u（扫到即出队）</text>
  <text x="439" y="214" text-anchor="middle" font-size="10.5" fill="#333"
        filter="url(#rough2)">edges[u] ≠ −1：</text>
  <text x="439" y="229" text-anchor="middle" font-size="10.5" fill="#333"
        filter="url(#rough2)">indeg[后继]−−，</text>
  <text x="439" y="236" text-anchor="middle" font-size="10.5" fill="#b85450"
        filter="url(#rough2)">归 0 ⇒ 追加入队</text>

  <path d="M 439 182 C 436 146, 382 156, 350 197" stroke="#d6a040"
        stroke-width="2" fill="none" stroke-linecap="round"
        marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="404" y="152" text-anchor="middle" font-size="10.5" fill="#a07820"
        filter="url(#rough2)">继续剥</text>

  <path d="M 215 252 L 215 290" stroke="#b85450" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="228" y="276" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">否</text>

  <rect x="90" y="290" width="250" height="42" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="316" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">④ 幸存者（indeg &gt; 0）= 全部环上节点</text>

  <path d="M 215 332 L 215 354" stroke="#4a7a3a" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="90" y="354" width="250" height="46" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="372" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">⑤ 每个未访问幸存者沿出边走一圈</text>
  <text x="215" y="390" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">步数即环长，vis 哨兵防重复</text>

  <path d="M 215 400 L 215 418" stroke="#4a7a3a" stroke-width="2"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="90" y="418" width="250" height="42" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="444" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">⑥ 返回 max(环长)；无环返回 −1</text>
</svg>
