<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">短路论证：为什么「每字母至多传一次」不用记状态</text>
  <path d="M 120 42 Q 320 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#888">若路径两次经过同一虚拟节点 V_X，中间整段路程都可以被跳过</text>

  <text x="52" y="201" text-anchor="middle" font-size="15" fill="#888" font-family="monospace">…</text>
  <g filter="url(#sk)">
    <circle cx="108" cy="196" r="21" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="196" cy="196" r="24" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="284" cy="196" r="21" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="414" cy="196" r="21" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="502" cy="196" r="24" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="578" cy="196" r="21" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <g font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="108" y="201">a</text>
    <text x="284" y="201">b</text>
    <text x="414" y="201">c</text>
    <text x="578" y="201">d</text>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7a5415">
    <text x="196" y="201">V_X</text>
    <text x="502" y="201">V_X</text>
  </g>

  <g filter="url(#sk)">
    <line x1="68" y1="196" x2="85" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="129" y1="196" x2="170" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="220" y1="196" x2="261" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="435" y1="196" x2="476" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="526" y1="196" x2="555" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrB)"/>
    <line x1="599" y1="196" x2="616" y2="196" stroke="#888" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>
  <g font-size="10.5" fill="#666" text-anchor="middle" font-family="monospace">
    <text x="150" y="188">0</text>
    <text x="240" y="188">0</text>
    <text x="456" y="188">0</text>
    <text x="540" y="188">0</text>
  </g>

  <path d="M 307 196 Q 318 216 334 200 Q 350 184 366 202 Q 380 216 391 196" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="350" y="244" text-anchor="middle" font-size="11" fill="#666">σ：一段代价 ≥ 0 的步行（可含别的传送）</text>

  <g stroke="#b85450" stroke-width="3" stroke-linecap="round" filter="url(#sk)">
    <line x1="333" y1="182" x2="367" y2="212"/>
    <line x1="367" y1="182" x2="333" y2="212"/>
  </g>
  <text x="350" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">删掉 σ：代价只减不增</text>

  <path d="M 196 172 Q 380 70 578 172" stroke="#4a8e4a" stroke-width="2.6" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="386" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">短路：a → V_X → d（0 权直达）</text>

  <g filter="url(#sk)">
    <rect x="30" y="274" width="288" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="174" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">新路径代价 ≤ 原路径</text>
  <text x="174" y="315" text-anchor="middle" font-size="11" fill="#555">且 V_X 经过次数恰减一，其余不增</text>

  <g filter="url(#sk)">
    <rect x="338" y="274" width="272" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="474" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">反复短路 ⇒ 必存在最短路</text>
  <text x="474" y="315" text-anchor="middle" font-size="11" fill="#555">其中每个字母至多传送一次</text>

  <g filter="url(#sk)">
    <rect x="30" y="338" width="580" height="34" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">约束是「免费」的 ⇒ 无需把字母集合放进 BFS 状态，直接求最短路即可</text>
</svg>
