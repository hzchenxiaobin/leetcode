<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：n = 7，quantities = [15, 10, 10]（示例 2）</text>
  <text x="320" y="40" text-anchor="middle" font-size="11" fill="#666666">二分 [1, 15]，每轮用 check(mid) 收缩区间，答案恰在 ✗/✓ 分界处</text>

  <g filter="url(#sk)">
    <rect x="36" y="54" width="44" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="80" y="54" width="44" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="124" y="54" width="44" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="168" y="54" width="192" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="360" y="54" width="44" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="404" y="54" width="48" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="452" y="54" width="152" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="58" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">lo</text>
  <text x="102" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">hi</text>
  <text x="146" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">mid</text>
  <text x="264" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">各 ⌈qᵢ/mid⌉</text>
  <text x="382" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">总和</text>
  <text x="428" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">≤ 7 ?</text>
  <text x="528" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">收缩动作</text>

  <g filter="url(#sk)">
    <rect x="36" y="80" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="80" y="80" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="124" y="80" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="168" y="80" width="192" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="360" y="80" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="404" y="80" width="48" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="452" y="80" width="152" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="58" y="99" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="102" y="99" text-anchor="middle" font-size="11" fill="#333">15</text>
  <text x="146" y="99" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="264" y="99" text-anchor="middle" font-size="11" fill="#333">2 + 2 + 2</text>
  <text x="382" y="99" text-anchor="middle" font-size="11" fill="#2e6e2e">6</text>
  <text x="428" y="99" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="528" y="99" text-anchor="middle" font-size="10.5" fill="#2e6e2e">hi = 8</text>

  <g filter="url(#sk)">
    <rect x="36" y="110" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="80" y="110" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="124" y="110" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="168" y="110" width="192" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="360" y="110" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="404" y="110" width="48" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="452" y="110" width="152" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="58" y="129" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="102" y="129" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="146" y="129" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="264" y="129" text-anchor="middle" font-size="11" fill="#333">4 + 3 + 3</text>
  <text x="382" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">10</text>
  <text x="428" y="129" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <text x="528" y="129" text-anchor="middle" font-size="10.5" fill="#b85450">lo = 5</text>

  <g filter="url(#sk)">
    <rect x="36" y="140" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="80" y="140" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="124" y="140" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="168" y="140" width="192" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="360" y="140" width="44" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="404" y="140" width="48" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="452" y="140" width="152" height="30" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="58" y="159" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="102" y="159" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="146" y="159" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="264" y="159" text-anchor="middle" font-size="11" fill="#333">3 + 2 + 2</text>
  <text x="382" y="159" text-anchor="middle" font-size="11" fill="#2e6e2e">7</text>
  <text x="428" y="159" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="528" y="159" text-anchor="middle" font-size="10.5" fill="#2e6e2e">hi = 6</text>

  <g filter="url(#sk)">
    <rect x="36" y="170" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="80" y="170" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="124" y="170" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="168" y="170" width="192" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="360" y="170" width="44" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="404" y="170" width="48" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="452" y="170" width="152" height="30" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="58" y="189" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="102" y="189" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="146" y="189" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="264" y="189" text-anchor="middle" font-size="11" fill="#333">3 + 2 + 2</text>
  <text x="382" y="189" text-anchor="middle" font-size="11" fill="#2e6e2e">7</text>
  <text x="428" y="189" text-anchor="middle" font-size="11" fill="#2e6e2e">✓</text>
  <text x="528" y="189" text-anchor="middle" font-size="10.5" fill="#2e6e2e">hi = 5</text>

  <g filter="url(#sk)">
    <rect x="36" y="200" width="568" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="58" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">5</text>
  <text x="102" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">5</text>
  <text x="146" y="219" text-anchor="middle" font-size="11" fill="#8a6415">—</text>
  <text x="264" y="219" text-anchor="middle" font-size="10.5" fill="#8a6415">lo == hi，退出循环</text>
  <text x="528" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">答案 = 5</text>

  <text x="60" y="254" font-size="11.5" font-weight="bold" fill="#2b6e9e">x = 5 对应的一种分配（恰好用满 7 间商店，每间 ≤ 5 件）：</text>

  <g filter="url(#sk)">
    <rect x="60" y="264" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="118" y="264" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="176" y="264" width="50" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="242" y="264" width="50" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="300" y="264" width="50" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="366" y="264" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="424" y="264" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="85" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">5</text>
  <text x="143" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">5</text>
  <text x="201" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">5</text>
  <text x="267" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="325" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="391" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="449" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="143" y="322" text-anchor="middle" font-size="9.5" fill="#8a6415">商品 0：15 件 → 3 间</text>
  <text x="292" y="322" text-anchor="middle" font-size="9.5" fill="#2b6e9e">商品 1：10 件 → 2 间</text>
  <text x="420" y="322" text-anchor="middle" font-size="9.5" fill="#2e6e2e">商品 2：10 件 → 2 间</text>

  <g filter="url(#sk)">
    <rect x="500" y="258" width="120" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="560" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">max = 5</text>
  <text x="560" y="310" text-anchor="middle" font-size="10" fill="#555555">每间商店 ≤ 5 件 ✓</text>

  <g filter="url(#sk)">
    <rect x="36" y="348" width="568" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">答案总在 ✗/✓ 分界：check(4) = 4+3+3 = 10 &gt; 7（不可行），check(5) = 3+2+2 = 7 ≤ 7（可行）</text>
  <text x="320" y="390" text-anchor="middle" font-size="10.5" fill="#555555">可行性关于 x 单调 → 二分 17 轮内锁定分界，每轮 check 只需 O(m)</text>
</svg>
