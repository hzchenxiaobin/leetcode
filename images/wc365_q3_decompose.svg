<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">结构分解：任意子数组 = 若干整份 + 一段环弧</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">以 nums = [1,2,3]、target = 17 为例：S = 6，k = 2，r = 5</text>

  <!-- linear view -->
  <text x="76" y="90" font-size="12" fill="#555" filter="url(#sk)">线性视角：答案子数组 = 环弧 [2,3] + 2 个「连续 n 格」</text>

  <!-- copy boundary dashed lines -->
  <g stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)">
    <path d="M 208 96 L 208 144"/>
    <path d="M 340 96 L 340 144"/>
  </g>

  <!-- cells: outside window -->
  <rect x="76" y="100" width="44" height="40" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="98" y="126" text-anchor="middle" font-size="14" fill="#999" filter="url(#sk)">1</text>

  <!-- cells: arc (orange) -->
  <g filter="url(#sk)">
    <rect x="120" y="100" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="164" y="100" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="142" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">2</text>
  <text x="186" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">3</text>

  <!-- cells: two full n-blocks (blue) -->
  <g filter="url(#sk)">
    <rect x="208" y="100" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="100" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="100" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="340" y="100" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="384" y="100" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="428" y="100" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">
    <text x="230" y="126">1</text>
    <text x="274" y="126">2</text>
    <text x="318" y="126">3</text>
    <text x="362" y="126">1</text>
    <text x="406" y="126">2</text>
    <text x="450" y="126">3</text>
  </g>
  <text x="488" y="126" font-size="16" fill="#999" filter="url(#sk)">⋯</text>

  <!-- braces row 1 -->
  <g fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)">
    <path d="M 120 144 L 120 156 L 208 156 L 208 144"/>
  </g>
  <text x="164" y="172" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">环弧（和 = r = 5）</text>
  <g fill="none" stroke="#446688" stroke-width="1.6" filter="url(#sk)">
    <path d="M 212 144 L 212 156 L 336 156 L 336 144"/>
    <path d="M 344 144 L 344 156 L 468 156 L 468 144"/>
  </g>
  <text x="274" y="172" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">连续 n 格（和 = S = 6）</text>
  <text x="406" y="172" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">连续 n 格（和 = 6）</text>

  <!-- whole-window brace -->
  <g fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)">
    <path d="M 120 182 L 120 194 L 468 194 L 468 182"/>
  </g>
  <text x="294" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">答案子数组：和 = 5 + 6 + 6 = 17 ✓，长 = 2 + 3 + 3 = 8 = k·n + 环弧长</text>

  <!-- ring view -->
  <text x="60" y="254" font-size="12" fill="#555" filter="url(#sk)">环视角：环弧 = 首尾相接的一段弧，可跨份边界</text>

  <!-- gray ring -->
  <circle cx="160" cy="362" r="74" fill="none" stroke="#c9c9c9" stroke-width="2" filter="url(#sk)"/>
  <!-- rotation arrows on gray part -->
  <g fill="none" stroke="#999" stroke-width="1.5" filter="url(#sk)">
    <path d="M 213 305 Q 248 348 230 386" marker-end="url(#arr)"/>
    <path d="M 100 392 Q 68 344 108 300" marker-end="url(#arr)"/>
  </g>
  <!-- highlighted arc from node 2 to node 3 (through bottom) -->
  <path d="M 224 399 A 74 74 0 0 1 96 399" fill="none" stroke="#d6a040" stroke-width="5.5" filter="url(#sk)"/>

  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="160" cy="288" r="16" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>
    <circle cx="224" cy="399" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="96" cy="399" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" filter="url(#sk)">
    <text x="160" y="293" fill="#777">1</text>
    <text x="224" y="404" fill="#8a6520">2</text>
    <text x="96" y="404" fill="#8a6520">3</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">
    <text x="160" y="262">位置 0</text>
    <text x="256" y="424">位置 1</text>
    <text x="64" y="424">位置 2</text>
  </g>
  <text x="160" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">环弧 [2,3]：和 = 5 = r</text>

  <!-- right column -->
  <g filter="url(#sk)">
    <rect x="300" y="258" width="356" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="478" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">带余除法</text>
  <text x="478" y="302" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">target = k·S + r：17 = 2×6 + 5 → k = 2，r = 5</text>

  <g filter="url(#sk)">
    <rect x="300" y="334" width="356" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="478" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">答案公式</text>
  <text x="478" y="378" text-anchor="middle" font-size="11.5" fill="#8a6520" filter="url(#sk)">ans = k·n + minlen(r)：8 = 2×3 + 2</text>
  <text x="478" y="392" text-anchor="middle" font-size="11" fill="#a08040" filter="url(#sk)">r = 0 时环弧为空，ans = k·n</text>

  <g filter="url(#sk)">
    <rect x="300" y="410" width="356" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="478" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">剩余子问题</text>
  <text x="478" y="452" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">minlen(r)：和恰为 r 的最短环弧 → 翻倍数组滑窗求出</text>
</svg>
