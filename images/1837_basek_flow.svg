<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一个 while 循环，两行核心代码</text>
  <text x="360" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">余数产生即累加 —— 不需要数组，也不需要倒序</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="310" y="64" width="180" height="54" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="400" y="86" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">读入 n、k</text>
  <text x="400" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">sum ＝ 0</text>
  <path d="M 400,118 V 138" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 400,142 L 492,188 L 400,234 L 308,188 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="400" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">n ＞ 0 ?</text>

  <!-- yes branch -->
  <path d="M 400,234 V 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="252" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="290" y="264" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="400" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">sum ＋＝ n % k</text>
  <text x="400" y="304" text-anchor="middle" font-size="9.5" fill="#3a6a2e" filter="url(#sk)">（n % k ＝ 当前最低位）</text>

  <path d="M 400,316 V 328" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="290" y="332" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="400" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">n ＝ n / k（整除）</text>
  <text x="400" y="372" text-anchor="middle" font-size="9.5" fill="#3a6a2e" filter="url(#sk)">（剥掉最低位，处理剩余高位）</text>

  <!-- loop back -->
  <path d="M 510,358 H 562 Q 570,358 570,350 V 196 Q 570,188 562,188 H 500" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="582" y="268" font-size="10" fill="#555" filter="url(#sk)">每轮商严格变小，</text>
  <text x="582" y="284" font-size="10" fill="#555" filter="url(#sk)">循环必然终止</text>

  <!-- no branch -->
  <path d="M 308,188 H 190 Q 184,188 184,194 V 344" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="240" y="178" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- output -->
  <g filter="url(#sk)">
    <rect x="88" y="348" width="192" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="184" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038" filter="url(#sk)">返回 sum</text>
  <text x="184" y="390" text-anchor="middle" font-size="9.5" fill="#a04038" filter="url(#sk)">（十进制答案）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="420" width="610" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="365" y="438" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">k ≤ 10 ⇒ 余数 r ∈ [0, k) 天然是一位十进制数字，直接相加</text>
  <text x="365" y="456" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">n ≥ 1 保证至少执行一轮；k ＝ 10 时就是十进制数位和</text>
</svg>
