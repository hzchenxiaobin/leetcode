<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="306" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,6]，k = 3</text>
  <rect x="40" y="58" width="250" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">分界位置</text>
  <rect x="300" y="58" width="300" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">hi − lo 计算</text>
  <rect x="610" y="58" width="60" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">分数</text>
  <rect x="40" y="102" width="250" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="126.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始（全 −k / 全 +k）</text>
  <rect x="300" y="102" width="300" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450.0" y="126.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <rect x="610" y="102" width="60" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="126.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="40" y="152" width="250" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="176.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 0（1 加，3/6 减）</text>
  <rect x="300" y="152" width="300" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450.0" y="176.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(4, 3) − min(4, 0) = 4</text>
  <rect x="610" y="152" width="60" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="176.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="40" y="202" width="250" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165.0" y="226.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 1（1/3 加，6 减）</text>
  <rect x="300" y="202" width="300" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450.0" y="226.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(6, 3) − min(4, 3) = 3</text>
  <rect x="610" y="202" width="60" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="226.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="286" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">最优是把 [1,3,6] 变成 [4,3,6]（1 加 3，6 减 3）→ 分数 3</text>
</svg>
