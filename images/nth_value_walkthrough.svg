<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="311" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a9cc0"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 4, k = 5 —— 追踪数组的每个瞬间</text>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">每秒同时更新：新 a[i] = 旧 a[0] + … + 旧 a[i]（含自身的左缀和）</text>

  <!-- row labels -->
  <g font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="64" y="76" filter="url(#sk)">t=0</text>
    <text x="64" y="122" filter="url(#sk)">t=1</text>
    <text x="64" y="168" filter="url(#sk)">t=2</text>
    <text x="64" y="214" filter="url(#sk)">t=3</text>
    <text x="64" y="260" filter="url(#sk)">t=4</text>
    <text x="64" y="306" filter="url(#sk)">t=5</text>
  </g>

  <!-- strip cells -->
  <g filter="url(#sk)">
    <rect x="90" y="58" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="134" y="58" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="178" y="58" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="58" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="90" y="104" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="134" y="104" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="178" y="104" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="104" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="90" y="150" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="134" y="150" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="178" y="150" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="150" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="90" y="196" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="134" y="196" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="178" y="196" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="196" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="90" y="242" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="134" y="242" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="178" y="242" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="242" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="90" y="288" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="134" y="288" width="44" height="28" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="178" y="288" width="44" height="28" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="288" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>

  <!-- cell values -->
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="112" y="77" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="156" y="77" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="200" y="77" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="244" y="77" fill="#8a6a20" filter="url(#sk)">1</text>

    <text x="112" y="123" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="156" y="123" fill="#2b4a66" filter="url(#sk)">2</text>
    <text x="200" y="123" fill="#8a6a20" filter="url(#sk)">3</text>
    <text x="244" y="123" fill="#8a6a20" filter="url(#sk)">4</text>

    <text x="112" y="169" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="156" y="169" fill="#2b4a66" filter="url(#sk)">3</text>
    <text x="200" y="169" fill="#8a6a20" filter="url(#sk)">6</text>
    <text x="244" y="169" fill="#8a6a20" filter="url(#sk)">10</text>

    <text x="112" y="215" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="156" y="215" fill="#2b4a66" filter="url(#sk)">4</text>
    <text x="200" y="215" fill="#8a6a20" filter="url(#sk)">10</text>
    <text x="244" y="215" fill="#8a6a20" filter="url(#sk)">20</text>

    <text x="112" y="261" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="156" y="261" fill="#2b4a66" filter="url(#sk)">5</text>
    <text x="200" y="261" fill="#8a6a20" filter="url(#sk)">15</text>
    <text x="244" y="261" fill="#8a6a20" filter="url(#sk)">35</text>

    <text x="112" y="307" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="156" y="307" fill="#2b4a66" filter="url(#sk)">6</text>
    <text x="200" y="307" fill="#8a6a20" filter="url(#sk)">21</text>
    <text x="244" y="307" font-size="14" fill="#b85450" filter="url(#sk)">56</text>
  </g>

  <!-- down arrows between strips -->
  <g stroke="#7a9cc0" stroke-width="1.4" fill="none">
    <path d="M 112 88 L 112 100" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 112 134 L 112 146" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 112 180 L 112 192" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 112 226 L 112 238" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 112 272 L 112 284" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>

  <!-- brace under t=4 row -->
  <path d="M 90 274 Q 90 283 98 283 L 168 283 Q 176 283 178 290 Q 180 283 188 283 L 258 283 Q 266 283 266 274"
        stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 178 292 C 195 296 205 298 218 300" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- card D -->
  <rect x="310" y="58" width="300" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="460" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">一轮更新 = 同时取前缀和</text>
  <text x="460" y="102" text-anchor="middle" font-size="12" fill="#5a7a9e" filter="url(#sk)">旧 [1, 2, 3, 4] → 新 [1, 3, 6, 10]</text>
  <text x="460" y="122" text-anchor="middle" font-size="11.5" fill="#5a7a9e" filter="url(#sk)">新 a[i] = 旧 a[0] + … + 旧 a[i]</text>
  <text x="460" y="142" text-anchor="middle" font-size="11.5" fill="#5a7a9e" filter="url(#sk)">例如 10 = 1 + 2 + 3 + 4</text>

  <!-- card E -->
  <rect x="310" y="178" width="300" height="96" rx="10" fill="#fff4e0" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#sk)">最后一跳：t = 4 → t = 5</text>
  <text x="460" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#sk)">新 a[3] = 1 + 5 + 15 + 35</text>
  <text x="460" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">= 56</text>
  <path d="M 308 226 C 288 238 278 270 268 296" stroke="#d6a040" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- card F -->
  <rect x="310" y="296" width="300" height="82" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="318" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">末列沿途：1, 4, 10, 20, 35, 56</text>
  <text x="460" y="338" text-anchor="middle" font-size="11.5" fill="#a06058" filter="url(#sk)">= C(3,3), C(4,3), …, C(8,3)</text>
  <text x="460" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">答案 C(8,5) = C(8,3) = 56 ✓</text>

  <text x="320" y="416" text-anchor="middle" font-size="11.5" fill="#7a7a7a" font-style="italic" filter="url(#sk)">闭式核对：C(n+k−1, k) = C(4+5−1, 5) = 56，与逐步演算一致</text>
</svg>
