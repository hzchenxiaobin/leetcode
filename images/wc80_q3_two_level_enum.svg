<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">两层枚举：逗号切点 × 小数点位置</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个决策互不影响，直接双重穷举即可（n ≤ 10）</text>

  <rect x="26" y="66" width="250" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="151" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">① 外层：枚举逗号位置 i</text>

  <rect x="44" y="100" width="214" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="151" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 1 → 左 "0" │ 右 "123"</text>

  <rect x="44" y="140" width="214" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="151" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 2 → 左 "01" │ 右 "23"</text>

  <rect x="44" y="180" width="214" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="151" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 3 → 左 "012" │ 右 "3"</text>

  <text x="151" y="232" text-anchor="middle" font-size="10" fill="#7a8aa0" filter="url(#rough2)">两侧都非空 ⇒ 1 ≤ i ≤ n−1</text>

  <path d="M 280 156 L 296 156" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="66" width="234" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="417" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">② 内层：给每段挑形态</text>

  <rect x="316" y="100" width="202" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="417" y="117" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">不插小数点：整段就是整数</text>

  <rect x="316" y="132" width="202" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="417" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">插小数点：k = 1 … L−1</text>

  <rect x="316" y="164" width="202" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="417" y="181" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整数部：k = 1 或 首位 ≠ '0'</text>

  <rect x="316" y="196" width="202" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="417" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">小数部：末位 ≠ '0'</text>

  <rect x="36" y="272" width="488" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="294" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 组合：left（≤ i 种）× right（≤ n−i 种）</text>
  <text x="56" y="314" font-size="10.5" fill="#555" filter="url(#rough2)">每个组合拼成 "(x, y)"，逗号后固定一个空格</text>
  <text x="56" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">总数上界 Σ i(n−i) = (n³−n)/6，n = 10 时恰为 165</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">顺序任意：官方答案的排列不同不算错</text>
</svg>
