<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：目标值逐断点右移，f 先降后升</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#sk)">nums = [1,3,5,2]，cost = [2,3,1,14] → 排序后 v = [1,2,3,5]，w = [2,14,3,1]，总权重 W = 20</text>

  <!-- 表格 -->
  <g filter="url(#sk)">
    <rect x="75" y="70" width="490" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="75" y="102" width="490" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="75" y="142" width="490" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="75" y="182" width="490" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="75" y="222" width="490" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
    <path d="M 161 70 V 262" stroke="#bbbbbb" stroke-width="1"/>
    <path d="M 239 70 V 262" stroke="#bbbbbb" stroke-width="1"/>
    <path d="M 317 70 V 262" stroke="#bbbbbb" stroke-width="1"/>
    <path d="M 399 70 V 262" stroke="#bbbbbb" stroke-width="1"/>
    <path d="M 463 70 V 262" stroke="#bbbbbb" stroke-width="1"/>
  </g>

  <text x="118" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">目标 t</text>
  <text x="200" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">左和 L</text>
  <text x="278" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">右和 R</text>
  <text x="358" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">斜率 L−R</text>
  <text x="431" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">步长 d</text>
  <text x="514" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">f(t)</text>

  <text x="118" y="127" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">1</text>
  <text x="200" y="127" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">2</text>
  <text x="278" y="127" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">18</text>
  <text x="358" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">−16</text>
  <text x="431" y="127" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">1</text>
  <text x="514" y="127" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">24</text>

  <text x="118" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">2</text>
  <text x="200" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">16</text>
  <text x="278" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">4</text>
  <text x="358" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">+12</text>
  <text x="431" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">1</text>
  <text x="514" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" filter="url(#sk)">8 ✓</text>

  <text x="118" y="207" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">3</text>
  <text x="200" y="207" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">19</text>
  <text x="278" y="207" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">1</text>
  <text x="358" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">+18</text>
  <text x="431" y="207" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">2</text>
  <text x="514" y="207" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">20</text>

  <text x="118" y="247" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">5</text>
  <text x="200" y="247" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">20</text>
  <text x="278" y="247" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">0</text>
  <text x="358" y="247" text-anchor="middle" font-size="13" fill="#999999" filter="url(#sk)">—</text>
  <text x="431" y="247" text-anchor="middle" font-size="13" fill="#999999" filter="url(#sk)">—</text>
  <text x="514" y="247" text-anchor="middle" font-size="13" fill="#333333" filter="url(#sk)">56</text>

  <!-- 脚注 -->
  <text x="320" y="288" text-anchor="middle" font-size="11" fill="#333333" filter="url(#sk)">起步：f(1) = 14·1 + 3·2 + 1·4 = 24（所有元素先按「拉到 v₀ = 1」计价）</text>
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="#333333" filter="url(#sk)">1→2：f += (2−18)·1 = −16 → 8　　2→3：f += (16−4)·1 = +12 → 20</text>
  <text x="320" y="332" text-anchor="middle" font-size="11" fill="#333333" filter="url(#sk)">3→5：f += (19−1)·2 = +36 → 56　　全程最小 ans = 8，落在 t = 2 ✓</text>

  <!-- 底部两个结论框 -->
  <g filter="url(#sk)">
    <rect x="55" y="354" width="270" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="190" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">斜率在 t = 2 变号：−16 → +12</text>
  <text x="190" y="400" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#sk)">累计权重 2 → 16 首次 ≥ W/2 = 10</text>
  <text x="190" y="420" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#sk)">谷底 f(2) = 8 即答案</text>
  <text x="190" y="438" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#sk)">t = 2 正是加权中位数</text>

  <g filter="url(#sk)">
    <rect x="335" y="354" width="270" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="470" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">增量视角 = 凸函数斜率扫描</text>
  <text x="470" y="400" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">变号前每步 (−16)·1 都在省钱</text>
  <text x="470" y="420" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">变号后 (+12)·1、(+18)·2 都在花钱</text>
  <text x="470" y="438" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">无需预定位中位数，min 自动选中谷底</text>
</svg>
