<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：枚举所有候选 vs 贪心一步到位</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A -->
  <g filter="url(#sk)">
    <rect x="30" y="56" width="620" height="172" rx="10" fill="#f2f7fc" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">number = "1231"，digit = '1'</text>

  <text x="58" y="118" font-size="12" fill="#444">删 index 0 →</text>
  <g filter="url(#sk)">
    <rect x="160" y="100" width="36" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="200" y="100" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="240" y="100" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="178" y="118">2</text>
    <text x="218" y="118">3</text>
    <text x="258" y="118">1</text>
  </g>
  <text x="296" y="118" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">"231"</text>
  <text x="352" y="118" font-size="12.5" fill="#2e6e2e" font-weight="bold">✓ 最大</text>

  <text x="58" y="158" font-size="12" fill="#444">删 index 3 →</text>
  <g filter="url(#sk)">
    <rect x="160" y="140" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="200" y="140" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="240" y="140" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="178" y="158">1</text>
    <text x="218" y="158">2</text>
    <text x="258" y="158">3</text>
  </g>
  <text x="296" y="158" font-size="13" fill="#a04038" font-family="monospace">"123"</text>
  <path d="M 178 128 L 178 138" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,3" filter="url(#sk)"/>
  <text x="450" y="140" font-size="11.5" fill="#666">首位 '2' &gt; '1'，231 &gt; 123</text>

  <text x="340" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">贪心：i=0 时 number[1]='2' &gt; '1' → 立即删 index 0 → "231" ✓</text>

  <!-- Panel B -->
  <g filter="url(#sk)">
    <rect x="30" y="248" width="620" height="140" rx="10" fill="#fdf9f0" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a15" font-family="monospace">number = "551"，digit = '5'</text>

  <text x="58" y="310" font-size="12" fill="#444">删 index 0 →</text>
  <g filter="url(#sk)">
    <rect x="160" y="292" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="200" y="292" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="178" y="310">5</text>
    <text x="218" y="310">1</text>
  </g>
  <text x="256" y="310" font-size="13" fill="#444" font-family="monospace">"51"</text>

  <text x="58" y="350" font-size="12" fill="#444">删 index 1 →</text>
  <g filter="url(#sk)">
    <rect x="160" y="332" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="200" y="332" width="36" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="178" y="350">5</text>
    <text x="218" y="350">1</text>
  </g>
  <text x="256" y="350" font-size="13" fill="#444" font-family="monospace">"51"</text>
  <text x="430" y="330" font-size="11.5" fill="#666">两候选相等，删哪个都一样</text>

  <text x="340" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a15">贪心：后继均不大于 '5' → 走兜底分支，删最后一个 → "51" ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="30" y="398" width="620" height="24" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#888">口诀：后继严格更大才提前删；否则删最后一个出现位置。</text>
</svg>
