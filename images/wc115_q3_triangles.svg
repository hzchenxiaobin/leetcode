<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">每个 1×1 方块切成上、右、下、左四个三角形</text>
  <rect x="46" y="60" width="190" height="190" rx="2" fill="#ffffff" stroke="#666666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="46" y1="60" x2="236" y2="250" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="46" y1="250" x2="236" y2="60" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="141" y="94" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">上 0</text>
  <text x="210" y="155" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">右 1</text>
  <text x="141" y="232" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">下 2</text>
  <text x="72" y="155" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">左 3</text>
  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">两条对角线把方块分成 4 块；实际每格至多一条斜线</text>
  <rect x="300" y="60" width="230" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="82" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">'/'（左下→右上）</text>
  <text x="415" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">合并 (上,左) 与 (右,下)</text>
  <rect x="300" y="130" width="230" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="152" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">'\'（左上→右下）</text>
  <text x="415" y="174" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">合并 (上,右) 与 (下,左)</text>
  <rect x="300" y="200" width="230" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="222" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">' '（空格）</text>
  <text x="415" y="244" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">四块全部连通</text>
</svg>
