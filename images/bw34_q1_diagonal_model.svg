<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    第 i 行恰踩中 (i, i) 与 (i, n−1−i) 两格
  </text>

  <!-- 左：4x4 偶数阶 -->
  <text x="128" y="66" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">n = 4（偶）：无重叠</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="48"  y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="88"  y="80" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="128" y="80" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="168" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="48"  y="120" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="88"  y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="128" y="120" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="168" y="120" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="48"  y="160" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="88"  y="160" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="128" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="168" y="160" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="48"  y="200" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="88"  y="200" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="128" y="200" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="168" y="200" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="128" y="266" fill="#446688">蓝 = 主对角线 (i,i)</text>
    <text x="128" y="286" fill="#2f5a24">绿 = 副对角线 (i, n−1−i)</text>
    <text x="128" y="306" fill="#666">8 个格子，无重叠</text>
  </g>

  <!-- 右：5x5 奇数阶 -->
  <text x="384" y="66" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">n = 5（奇）：中心重叠</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="298" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="332" y="80" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="366" y="80" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="400" y="80" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="434" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="298" y="114" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="332" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="366" y="114" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="400" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="434" y="114" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="298" y="148" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="332" y="148" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="366" y="148" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="400" y="148" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="434" y="148" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="298" y="182" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="332" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="366" y="182" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="400" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="434" y="182" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="298" y="216" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="332" y="216" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="366" y="216" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="400" y="216" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="434" y="216" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="384" y="280" fill="#b85450">红 = 中心 (n/2, n/2)</text>
    <text x="384" y="300" fill="#b85450">2i = n−1 有唯一解 i = n/2</text>
  </g>

  <rect x="90" y="322" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12.5" fill="#8a6a1a" filter="url(#rough2)">
    先全加，再对奇数阶减一次中心 → 容斥
  </text>
</svg>
