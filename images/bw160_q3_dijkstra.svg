<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">Dijkstra 流程</text>
  <text x="280" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">状态只有 (节点, 最早到达时刻)</text>
  <rect x="110" y="56" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="77.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">dist[0] = 0，其余 +inf，小根堆放 (0, 0)</text>
  <path d="M 270.0 90 L 270.0 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="104" width="320" height="34" fill="#f1f3f4" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="125.0" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">弹出 (t, u)，若 t &gt; dist[u] 则跳过</text>
  <path d="M 270.0 138 L 270.0 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="152" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="173.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">u == n-1 ？是则返回 t</text>
  <path d="M 270.0 186 L 270.0 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="200" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="221.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">对每条出边 (u,v,s,e)：t &gt; e 则跳过</text>
  <path d="M 270.0 234 L 270.0 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="248" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270.0" y="269.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">arrive = max(t, s) + 1，松弛 dist[v]</text>
  <text x="40" y="356" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">堆里最多 O(E) 个状态，复杂度 O((n + E) log n)</text>
</svg>
