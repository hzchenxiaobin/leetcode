<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="63"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "cb34" 的两轮删除</text>

  <!-- 第一轮 -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="90" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="64" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="182" y="64" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="228" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="113" y="91" fill="#333">c</text>
    <text x="159" y="91" fill="#b85450">b</text>
    <text x="205" y="91" fill="#b85450">3</text>
    <text x="251" y="91" fill="#333">4</text>
  </g>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 136 64 L 182 104"/>
    <path d="M 182 64 L 136 104"/>
    <path d="M 182 64 L 228 104"/>
    <path d="M 228 64 L 182 104"/>
  </g>
  <text x="90" y="126" font-size="12" fill="#b85450" filter="url(#rough2)">第 1 步：删掉数字 3 与它左侧最近的字母 b</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 286 84 L 330 84" marker-end="url(#arr)"/>
  </g>
  <text x="308" y="74" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">得到</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="342" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="388" y="64" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="365" y="91" fill="#333">c</text>
    <text x="411" y="91" fill="#a06c10">4</text>
  </g>

  <!-- 第二轮 -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="90" y="168" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="136" y="168" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="113" y="195" fill="#b85450">c</text>
    <text x="159" y="195" fill="#b85450">4</text>
  </g>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2" fill="none">
    <path d="M 90 168 L 136 208"/>
    <path d="M 136 168 L 90 208"/>
    <path d="M 136 168 L 182 208"/>
    <path d="M 182 168 L 136 208"/>
  </g>
  <text x="90" y="230" font-size="12" fill="#b85450" filter="url(#rough2)">第 2 步：删掉数字 4 与它左侧最近的字母 c</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 240 188 L 320 188" marker-end="url(#arr)"/>
  </g>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">得到</text>
  <rect x="330" y="166" width="150" height="46" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="405" y="196" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">空串（没有数字了）</text>

  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">每次都是「第一个数字」+「它左边最近的字母」，贪心地从左往右处理</text>
  <text x="300" y="298" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">栈模拟：push c → push b → 遇 3 弹 b → 遇 4 弹 c ⇒ 空</text>
  <text x="300" y="324" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">最终返回 ""</text>
</svg>
