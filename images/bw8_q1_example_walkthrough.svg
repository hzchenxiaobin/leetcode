<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐位累加 run</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">示例 1：s = "aaaba"，i 从左到右，run 与 ans 同步滚动</text>

  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="60" y="70">i</text>
    <text x="120" y="70">s[i]</text>
    <text x="200" y="70">run</text>
    <text x="280" y="70">ans（累加后）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="80" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="96" y="80" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="80" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="256" y="80" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="100">0</text><text x="120" y="100">a</text><text x="200" y="100">1</text><text x="280" y="100">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="114" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="96" y="114" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="114" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="256" y="114" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="134">1</text><text x="120" y="134">a</text><text x="200" y="134">2</text><text x="280" y="134">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="148" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="96" y="148" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="148" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="256" y="148" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="168">2</text><text x="120" y="168">a</text><text x="200" y="168">3</text><text x="280" y="168">6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="182" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="96" y="182" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="182" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="256" y="182" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="202">3</text><text x="120" y="202">b</text><text x="200" y="202">1</text><text x="280" y="202">7</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="216" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="96" y="216" width="48" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="176" y="216" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="256" y="216" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="236">4</text><text x="120" y="236">a</text><text x="200" y="236">1</text><text x="280" y="236">8 ✓</text>
  </g>

  <text x="330" y="236" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">← 输出 8，与官方一致</text>

  <rect x="36" y="266" width="238" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="155" y="288" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">示例 2：s = "aaaaaaaaaa"</text>
  <text x="155" y="308" text-anchor="middle" font-size="10.5" fill="#555">单一游程 L = 10</text>
  <text x="155" y="324" text-anchor="middle" font-size="10.5" fill="#555">10·11/2 = 55 ✓</text>

  <rect x="290" y="266" width="238" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="409" y="288" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">上界一览（n = 1000 全同字母）</text>
  <text x="409" y="308" text-anchor="middle" font-size="10.5" fill="#555">ans = 1000·1001/2 = 500500</text>
  <text x="409" y="324" text-anchor="middle" font-size="10.5" fill="#555">int 完全够用，无溢出风险</text>
</svg>
