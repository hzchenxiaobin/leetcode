<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：区域包含关系 = 一棵树，答案 = LCA</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <ellipse cx="280" cy="72" rx="52" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <ellipse cx="150" cy="168" rx="64" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <ellipse cx="420" cy="168" rx="58" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <ellipse cx="86"  cy="268" rx="56" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <ellipse cx="216" cy="268" rx="56" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <ellipse cx="420" cy="268" rx="44" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <ellipse cx="60"  cy="362" rx="40" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="116" cy="362" rx="40" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="190" cy="362" rx="40" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <ellipse cx="246" cy="362" rx="40" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="280" y="77">Earth</text>
    <text x="150" y="173" fill="#2d5a22" font-weight="bold">North America</text>
    <text x="420" y="173">South America</text>
    <text x="86"  y="273">United States</text>
    <text x="216" y="273">Canada</text>
    <text x="420" y="273">Brazil</text>
    <text x="60"  y="367">New York</text>
    <text x="116" y="367">Boston</text>
    <text x="190" y="367">Ontario</text>
    <text x="246" y="367">Quebec</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 260 94 L 180 148"/>
    <path d="M 300 94 L 396 148"/>
    <path d="M 118 190 L 88 246"/>
    <path d="M 176 190 L 208 246"/>
    <path d="M 420 190 L 420 246"/>
    <path d="M 76 290 L 62 342"/>
    <path d="M 96 290 L 112 342"/>
    <path d="M 202 290 L 192 342"/>
    <path d="M 228 290 L 242 342"/>
  </g>

  <!-- 查询高亮 -->
  <path d="M 246 344 C 260 320, 250 300, 232 290" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 344 C 40 320, 60 300, 82 290" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="330" font-size="12" fill="#b85450" filter="url(#rough2)">查询：Quebec 与</text>
  <text x="352" y="346" font-size="12" fill="#b85450" filter="url(#rough2)">New York 的最小</text>
  <text x="352" y="362" font-size="12" fill="#b85450" filter="url(#rough2)">公共区域</text>

  <rect x="356" y="376" width="182" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="447" y="399" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">两条链首个交点 = LCA</text>
</svg>
