<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 442" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="442" fill="#fafafa"/>
<text x="280" y="26" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#roughs)">dp[s]：和为 s 的子集权重之和，权重 = 2^(已处理个数 − |S|)</text>
<rect x="60" y="150" width="62" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="91" y="180" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">dp[0]</text>
<text x="91" y="216" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#roughs)">s=0</text>
<rect x="148" y="150" width="62" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="179" y="180" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">dp[1]</text>
<text x="179" y="216" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#roughs)">s=1</text>
<rect x="236" y="150" width="62" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="267" y="180" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">dp[2]</text>
<text x="267" y="216" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#roughs)">s=2</text>
<rect x="324" y="150" width="62" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="355" y="180" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">dp[3]</text>
<text x="355" y="216" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#roughs)">s=3</text>
<path d="M70,150 C66,112 112,112 112,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="91" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">×2</text>
<path d="M158,150 C154,112 200,112 200,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="179" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">×2</text>
<path d="M246,150 C242,112 288,112 288,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="267" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">×2</text>
<path d="M334,150 C330,112 376,112 376,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="355" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">×2</text>
<path d="M391,174 L336,174" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="364" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="normal" filter="url(#roughs)">+dp[s−x]</text>
<text x="280" y="246" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#roughs)">转移：dp'[s] = 2·dp[s] + dp[s − x]</text>
<rect x="50" y="262" width="460" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="289" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">不选 x：指数 +1 → 权重 ×2</text>
<rect x="50" y="314" width="460" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="341" text-anchor="middle" font-size="12" fill="#7a2f2c" font-weight="normal" filter="url(#roughs)">选 x：和从 s−x 变成 s，指数不变 → 直接累加</text>
<rect x="50" y="366" width="460" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="393" text-anchor="middle" font-size="11" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">按 s 从 k 递减到 0 就地更新（0-1 背包，避免重复使用 x）</text>
<text x="280" y="428" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">初值 dp[0] = 1（空集，权重 2^0），答案为 dp[k]</text>
</svg>
