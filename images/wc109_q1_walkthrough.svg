<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="344" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：ping(1)、(100)、(3001)、(3002)</text>
  <rect x="60" y="56" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">调用</text>
  <rect x="180" y="56" width="170" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">窗口范围</text>
  <rect x="350" y="56" width="240" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">窗口内请求</text>
  <rect x="590" y="56" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回</text>
  <rect x="60" y="90" width="120" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="110.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ping(1)</text>
  <rect x="180" y="90" width="170" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="110.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[-2999, 1]</text>
  <rect x="350" y="90" width="240" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="110.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="590" y="90" width="80" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.0" y="110.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="60" y="124" width="120" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="144.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ping(100)</text>
  <rect x="180" y="124" width="170" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="144.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[-2900, 100]</text>
  <rect x="350" y="124" width="240" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="144.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 100]</text>
  <rect x="590" y="124" width="80" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.0" y="144.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="60" y="158" width="120" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="178.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ping(3001)</text>
  <rect x="180" y="158" width="170" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="178.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 3001]</text>
  <rect x="350" y="158" width="240" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="178.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 100, 3001]</text>
  <rect x="590" y="158" width="80" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.0" y="178.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="60" y="192" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ping(3002)</text>
  <rect x="180" y="192" width="170" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 3002]</text>
  <rect x="350" y="192" width="240" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[100, 3001, 3002]</text>
  <rect x="590" y="192" width="80" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.0" y="212.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="246" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">第 4 次调用：1 &lt; 3002−3000 = 2，被淘汰；窗口剩 3 个</text>
  <text x="330" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案序列 [1, 2, 3, 3]，与官方示例一致</text>
  <text x="330" y="324" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意 3001 恰好落在下界 1 上（3001−3000 = 1），因此仍被计入</text>
</svg>
