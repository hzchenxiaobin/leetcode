<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">区间 DP：dp[i][j] 表示让 s[i..j] 变成回文串的最少插入次数</text>
  <rect x="205" y="46" width="270" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="72" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">状态：区间 s[i..j]，目标代价最小</text>
  <path d="M 340 88 V 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="340,126 452,168 340,210 228,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="173" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">s[i] == s[j] ?</text>
  <path d="M 240 186 L 168 244" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 440 186 L 512 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="52" y="248" width="212" height="78" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="272" text-anchor="middle" font-size="12.5" fill="#2f4a28" filter="url(#rough2)">dp[i][j] = dp[i+1][j-1]</text>
  <text x="158" y="293" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">两端字符相同，直接配成一对</text>
  <text x="158" y="311" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">包在外层，代价 0</text>
  <rect x="416" y="248" width="212" height="78" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="270" text-anchor="middle" font-size="12.5" fill="#7a2f2c" filter="url(#rough2)">dp[i][j] = 1 + min(</text>
  <text x="522" y="288" text-anchor="middle" font-size="11.5" fill="#7a2f2c" filter="url(#rough2)">dp[i+1][j] , dp[i][j-1] )</text>
  <text x="522" y="310" text-anchor="middle" font-size="10.5" fill="#8a4a46" filter="url(#rough2)">必有一端靠插入的镜像配对，先付 1</text>
  <rect x="104" y="348" width="472" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="371" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">base：长度为 1 或空区间时 dp = 0（二维数组默认 0 即可）</text>
  <text x="340" y="394" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">顺序：len 从 2 递增到 n；答案 dp[0][n-1]</text>
</svg>
