<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：n = 5，灯在 (0,0) 与 (4,4)</text>
  <text x="280" y="42" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">查询 (1,1) 落在主对角线上 → 1；随后关掉 (0,0)，下一次查询 (1,0) → 0</text>

  
    <path filter="url(#rough2)" d="M 50 70 L 270 70 M 50 114 L 270 114 M 50 158 L 270 158 M 50 202 L 270 202 M 50 246 L 270 246 M 50 290 L 270 290" stroke="#cfd8dc" stroke-width="1.1" fill="none"/>
    <path filter="url(#rough2)" d="M 50 70 L 50 290 M 94 70 L 94 290 M 138 70 L 138 290 M 182 70 L 182 290 M 226 70 L 226 290 M 270 70 L 270 290" stroke="#cfd8dc" stroke-width="1.1" fill="none"/>
  

  <rect x="50" y="70" width="132" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="216" font-size="9.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">(1,1) 周围 3×3 关灯范围</text>

  <text x="72" y="97" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">灯</text>
  <text x="248" y="273" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">灯</text>

  <circle cx="116" cy="136" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="140" font-size="9.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">q1</text>
  <circle cx="72" cy="136" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="140" font-size="9.5" fill="#446688" text-anchor="start" filter="url(#rough2)">q2</text>

  <path d="M 72 92 L 116 136" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="60" y="120" font-size="9" fill="#d6a040" text-anchor="end" filter="url(#rough2)">r−c = 0</text>

  <rect x="292" y="60" width="246" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="80" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">查询 (1,1)</text>
  <text x="304" y="99" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">row[1]=0、col[1]=0</text>
  <text x="304" y="117" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">diag[1−1=0]=1（有灯）</text>
  <text x="304" y="135" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">→ 结果 1，随后关掉 3×3 内的灯</text>
  <text x="304" y="150" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">(0,0) 在范围内 → 四个计数器各减一</text>

  <rect x="292" y="166" width="246" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="186" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">查询 (1,0)</text>
  <text x="304" y="205" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">row[1]=0、col[0]=0（灯已关）</text>
  <text x="304" y="223" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">diag[1]=0、anti[1]=0</text>
  <text x="304" y="241" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">→ 结果 0</text>
  <text x="304" y="256" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">(4,4) 离得太远，不在关灯范围内</text>

  <rect x="30" y="286" width="508" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="42" y="307" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">答案 [1,0]。注意 (4,4) 那盏灯没被关掉：它到 (1,1) 的距离是 3，超出 8 邻域。</text>
</svg>
