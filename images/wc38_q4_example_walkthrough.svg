<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例走查：公式存的是依赖，不是快照</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">Set 只改常数并清空公式；Get 时才沿依赖图重新求和</text>

  <text x="98" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① Set(1,"A",2)</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="62" y="89" fill="#777">A</text>
    <text x="98" y="89" fill="#777">B</text>
    <text x="134" y="89" fill="#777">C</text>
    <text x="28" y="115" fill="#777">1</text>
    <text x="28" y="143" fill="#777">2</text>
    <text x="28" y="171" fill="#777">3</text>
    <rect x="44" y="96" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="4"/>
    <text x="62" y="115" fill="#8a6a20">2</text>
    <rect x="80" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="98" y="115" fill="#888">0</text>
    <rect x="116" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="134" y="115" fill="#888">0</text>
    <rect x="44" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="62" y="143" fill="#888">0</text>
    <rect x="80" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="98" y="143" fill="#888">0</text>
    <rect x="116" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="134" y="143" fill="#888">0</text>
    <rect x="44" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="62" y="171" fill="#888">0</text>
    <rect x="80" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="98" y="171" fill="#888">0</text>
    <rect x="116" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="134" y="171" fill="#888">0</text>
  </g>
  <text x="98" y="202" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">A1 ← 2</text>
  <text x="300" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② Sum(3,"C",…) = 4</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="264" y="89" fill="#777">A</text>
    <text x="300" y="89" fill="#777">B</text>
    <text x="336" y="89" fill="#777">C</text>
    <text x="230" y="115" fill="#777">1</text>
    <text x="230" y="143" fill="#777">2</text>
    <text x="230" y="171" fill="#777">3</text>
    <rect x="246" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="264" y="115" fill="#888">2</text>
    <rect x="282" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="300" y="115" fill="#888">0</text>
    <rect x="318" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="336" y="115" fill="#888">0</text>
    <rect x="246" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="264" y="143" fill="#888">0</text>
    <rect x="282" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="300" y="143" fill="#888">0</text>
    <rect x="318" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="336" y="143" fill="#888">0</text>
    <rect x="246" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="264" y="171" fill="#888">0</text>
    <rect x="282" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="300" y="171" fill="#888">0</text>
    <rect x="318" y="152" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="4"/>
    <text x="336" y="171" fill="#8a6a20">4</text>
  </g>
  <text x="300" y="202" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">C3 挂上公式，返回 4</text>
  <text x="502" y="76" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">③ Set(2,"B",2) → 6</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="466" y="89" fill="#777">A</text>
    <text x="502" y="89" fill="#777">B</text>
    <text x="538" y="89" fill="#777">C</text>
    <text x="432" y="115" fill="#777">1</text>
    <text x="432" y="143" fill="#777">2</text>
    <text x="432" y="171" fill="#777">3</text>
    <rect x="448" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="466" y="115" fill="#888">2</text>
    <rect x="484" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="502" y="115" fill="#888">0</text>
    <rect x="520" y="96" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="538" y="115" fill="#888">0</text>
    <rect x="448" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="466" y="143" fill="#888">0</text>
    <rect x="484" y="124" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="4"/>
    <text x="502" y="143" fill="#8a6a20">2</text>
    <rect x="520" y="124" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="538" y="143" fill="#888">0</text>
    <rect x="448" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="466" y="171" fill="#888">0</text>
    <rect x="484" y="152" width="36" height="28" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <text x="502" y="171" fill="#888">0</text>
    <rect x="520" y="152" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="4"/>
    <text x="538" y="171" fill="#8a6a20">6</text>
  </g>
  <text x="502" y="202" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">B2 ← 2，C3 跟着变 6</text>

  <path d="M 160 210 L 234 210" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362 210 L 436 210" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="228" width="532" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="250" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">求值（以 C3 为根做记忆化 DFS）</text>
  <text x="60" y="271" font-size="10.5" fill="#555" filter="url(#rough2)">C3 = A1 + (A1 + B1 + A2 + B2)：注意 A1 出现两次，要加两遍</text>
  <text x="60" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">① 之后：C3 = 2 + (2 + 0 + 0 + 0) = 4</text>
  <text x="60" y="313" font-size="10.5" fill="#555" filter="url(#rough2)">③ 之后：C3 = 2 + (2 + 0 + 0 + 2) = 6  ← 依赖变了，自动跟着变</text>

  <text x="310" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反例：若 Sum 时把 4 当常数存下来，③ 之后 C3 仍返回 4，答案就错了</text>
</svg>
