<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="123"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：TTFTTFTT 压 F 方向的窗口推进</text>

  <!-- 字符下标轴 -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="80" y="58">0</text><text x="124" y="58">1</text><text x="168" y="58">2</text>
    <text x="212" y="58">3</text><text x="256" y="58">4</text><text x="300" y="58">5</text>
    <text x="344" y="58">6</text><text x="388" y="58">7</text>
  </g>

  <!-- 8 行窗口状态（r=0..7），压缩为 5 行关键状态 -->
  <!-- r=2: [0,2] bad=1 -->
  <text x="60" y="86" font-size="12.5" fill="#888" filter="url(#rough2)">r=2：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="70" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="124" y="70" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="168" y="70" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="102" y="91">T</text><text x="146" y="91">T</text><text x="190" y="91">F</text>
  </g>
  <text x="240" y="91" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">窗口 [0,2]，bad=1 ≤ 1 ✓，best=3</text>

  <!-- r=4: [0,4] bad=1 -->
  <text x="60" y="138" font-size="12.5" fill="#888" filter="url(#rough2)">r=4：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="124" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="168" y="122" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="212" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="256" y="122" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="102" y="143">T</text><text x="146" y="143">T</text><text x="190" y="143">F</text>
    <text x="234" y="143">T</text><text x="278" y="143">T</text>
  </g>
  <text x="330" y="143" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">bad=1，best=5 ★</text>

  <!-- r=5: 收缩后 [3,5] -->
  <text x="60" y="190" font-size="12.5" fill="#888" filter="url(#rough2)">r=5：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="174" width="132" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" rx="4"/>
    <rect x="212" y="174" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="256" y="174" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="174" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="234" y="195">T</text><text x="278" y="195">T</text><text x="322" y="195">F</text>
  </g>
  <text x="146" y="195" font-size="12" fill="#b85450" filter="url(#rough2)">已收缩（2 个 F 超标）</text>
  <text x="360" y="195" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">窗口 [3,5]，bad=1，best 仍 5</text>

  <!-- r=7: [3,7] -->
  <text x="60" y="242" font-size="12.5" fill="#888" filter="url(#rough2)">r=7：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="226" width="132" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" rx="4"/>
    <rect x="212" y="226" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="256" y="226" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="226" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="344" y="226" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="388" y="226" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="234" y="247">T</text><text x="278" y="247">T</text><text x="322" y="247">F</text>
    <text x="366" y="247">T</text><text x="410" y="247">T</text>
  </g>
  <text x="460" y="247" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">[3,7]，长 5</text>

  <!-- 最优段标亮 -->
  <rect x="76" y="118" width="228" height="40" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="278" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">↑ 最优窗口 [0,4]：TTFTT → 改 F 后 TTTTT（5 连 T）</text>

  <!-- 结论 -->
  <rect x="60" y="298" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">压 F 方向 longest = 5；压 T 方向 longest = 3</text>
  <text x="280" y="344" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = max(5, 3) = 5</text>

  <text x="280" y="382" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">观察：窗口收缩后 best 不会回退——每个 r 记录一次，最大值单调不减</text>
  <text x="280" y="402" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">两方向独立取 max，不必担心「混合颜色」的段（最优必纯色）</text>
</svg>
