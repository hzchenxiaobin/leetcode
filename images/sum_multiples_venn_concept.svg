<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：三个「倍数集合」的并集 → 容斥原理</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- three circles -->
  <g filter="url(#sk)">
    <circle cx="205" cy="175" r="88" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="2"/>
    <circle cx="325" cy="175" r="88" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="265" cy="272" r="88" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="2"/>
  </g>

  <!-- region labels -->
  <text x="158" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">3k</text>
  <text x="372" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">5k</text>
  <text x="265" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87818" filter="url(#sk)">7k</text>
  <text x="265" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">15k</text>
  <text x="212" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">21k</text>
  <text x="318" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">35k</text>
  <text x="265" y="213" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a2430" filter="url(#sk)">105k</text>

  <!-- arrow: 15k region -> note box -->
  <path d="M 305 148 Q 420 150 452 228" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="6 4" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- legend box -->
  <g filter="url(#sk)">
    <rect x="460" y="92" width="152" height="92" rx="8" fill="#ffffff" stroke="#8a97a8" stroke-width="1.3"/>
  </g>
  <rect x="472" y="106" width="15" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="495" y="119" font-size="12" fill="#2b2b2b" filter="url(#sk)">被 3 整除的数</text>
  <rect x="472" y="131" width="15" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="495" y="144" font-size="12" fill="#2b2b2b" filter="url(#sk)">被 5 整除的数</text>
  <rect x="472" y="156" width="15" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="495" y="169" font-size="12" fill="#2b2b2b" filter="url(#sk)">被 7 整除的数</text>

  <!-- overlap note box -->
  <g filter="url(#sk)">
    <rect x="460" y="204" width="152" height="114" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="536" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">重叠 = 身兼多职</text>
  <text x="536" y="249" text-anchor="middle" font-size="11" fill="#8a2430" filter="url(#sk)">15 同时被 3、5 整除</text>
  <text x="536" y="267" text-anchor="middle" font-size="11" fill="#8a2430" filter="url(#sk)">直接相加算两次</text>
  <text x="536" y="285" text-anchor="middle" font-size="11" fill="#8a2430" filter="url(#sk)">→ 减回一次</text>
  <text x="536" y="306" text-anchor="middle" font-size="10.5" fill="#8a2430" filter="url(#sk)">交叠处数字 = 该组合的 lcm</text>

  <!-- bottom formula box -->
  <g filter="url(#sk)">
    <rect x="55" y="336" width="530" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="359" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#sk)">ans = S(3) + S(5) + S(7) − S(15) − S(21) − S(35) + S(105)</text>
  <text x="320" y="380" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">S(k) = [1,n] 内被 k 整除的数之和；加减号交替 = 容斥的「多退少补」</text>
</svg>
