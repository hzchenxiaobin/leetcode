<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：中项 x 一旦确定，两端值唯一确定</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- middle anchor tag -->
  <text x="308" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">中项 x = 4</text>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="148" y="64" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="212" y="64" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="276" y="64" width="64" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="340" y="64" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="404" y="64" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="468" y="64" width="64" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>

  <text x="180" y="94" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="244" y="94" text-anchor="middle" font-size="16" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="308" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#a06a10" filter="url(#sk)">4</text>
  <text x="372" y="94" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#sk)">6</text>
  <text x="436" y="94" text-anchor="middle" font-size="16" fill="#2e6e2e" filter="url(#sk)">7</text>
  <text x="500" y="94" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#sk)">10</text>

  <text x="180" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="244" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">1</text>
  <text x="308" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">2</text>
  <text x="372" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">3</text>
  <text x="436" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">4</text>
  <text x="500" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">5</text>

  <!-- arcs from middle x=4 to both neighbors -->
  <g filter="url(#sk)">
    <path d="M 244 112 Q 276 154 308 112" stroke="#4a8e4a" stroke-width="2.2" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 308 112 Q 372 172 436 112" stroke="#4a8e4a" stroke-width="2.2" fill="none"/>
  </g>
  <text x="262" y="150" text-anchor="middle" font-size="11" fill="#4a8e4a" filter="url(#sk)">diff</text>
  <text x="374" y="168" text-anchor="middle" font-size="11" fill="#4a8e4a" filter="url(#sk)">diff</text>

  <text x="244" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">查 S：x−diff = 1 ✓</text>
  <text x="436" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">查 S：x+diff = 7 ✓</text>
  <text x="340" y="208" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">两端齐备 → 这组计入答案</text>

  <!-- left box: anchor idea -->
  <g filter="url(#sk)">
    <rect x="40" y="228" width="300" height="130" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="190" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">中项为锚：两步搜索压成两次查表</text>
  <text x="56" y="276" font-size="11.5" fill="#444" filter="url(#sk)">nums[i] = x − diff</text>
  <text x="56" y="294" font-size="11.5" fill="#444" filter="url(#sk)">nums[k] = x + diff</text>
  <text x="56" y="312" font-size="11.5" fill="#444" filter="url(#sk)">中项 x 定 ⇒ 两端值唯一确定</text>
  <text x="56" y="332" font-size="11.5" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">哈希集合 S：每次判定 O(1)</text>

  <!-- right box: why strictly increasing helps -->
  <g filter="url(#sk)">
    <rect x="356" y="228" width="284" height="130" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="498" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">严格递增送的两个赠品</text>
  <text x="372" y="276" font-size="11.5" fill="#444" filter="url(#sk)">值互异：每个 x 至多贡献一组</text>
  <text x="372" y="294" font-size="11.5" fill="#444" filter="url(#sk)">值序 = 下标序：x−diff &lt; x &lt; x+diff</text>
  <text x="382" y="312" font-size="11.5" fill="#444" filter="url(#sk)">⇒ 下标 i &lt; j &lt; k 自动成立</text>
  <text x="372" y="332" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">「查到值」即「存在合法下标」</text>

  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">整体 O(n) 时间 / O(n) 空间，n ≤ 200 轻松通过</text>
</svg>
