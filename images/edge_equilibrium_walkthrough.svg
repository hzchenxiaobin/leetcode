<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="490" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：查询 (a, b) = (2, 6) → 答案 1</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="28" y="74" width="284" height="400" rx="10" fill="#f7fafc" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="170" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">示例 1 的树（以 0 为根）</text>

  <g stroke-width="2.2" fill="none" filter="url(#sk)">
    <line x1="100" y1="133" x2="100" y2="163" stroke="#4a8edb"/>
    <line x1="100" y1="183" x2="100" y2="203" stroke="#4a8edb"/>
  </g>
  <g stroke-width="3" fill="none" filter="url(#sk)">
    <line x1="100" y1="223" x2="100" y2="253" stroke="#b85450"/>
    <line x1="100" y1="273" x2="100" y2="303" stroke="#b85450"/>
    <line x1="100" y1="323" x2="100" y2="353" stroke="#b85450"/>
    <line x1="100" y1="373" x2="100" y2="403" stroke="#b85450"/>
  </g>
  <g font-size="13" font-weight="bold" filter="url(#sk)">
    <text x="112" y="152" fill="#2b6e9e">1</text>
    <text x="112" y="202" fill="#2b6e9e">1</text>
    <text x="112" y="242" fill="#b85450">1</text>
    <text x="112" y="292" fill="#7a5415">2</text>
    <text x="112" y="342" fill="#7a5415">2</text>
    <text x="112" y="392" fill="#7a5415">2</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="100" cy="118" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <circle cx="100" cy="168" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <circle cx="100" cy="218" r="15" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.6"/>
    <circle cx="100" cy="268" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <circle cx="100" cy="318" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <circle cx="100" cy="368" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <circle cx="100" cy="418" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#sk)">
    <text x="100" y="123">0</text>
    <text x="100" y="173">1</text>
    <text x="100" y="223" fill="#7a5415">2</text>
    <text x="100" y="273">3</text>
    <text x="100" y="323">4</text>
    <text x="100" y="373">5</text>
    <text x="100" y="423" fill="#b85450">6</text>
  </g>
  <g font-size="10.5" filter="url(#sk)">
    <text x="128" y="212" fill="#7a5415" font-weight="bold">a = l = 2（lca）</text>
    <text x="128" y="228" fill="#7a5415">cnt[2] = {1: 2}</text>
    <text x="128" y="412" fill="#b85450" font-weight="bold">b = 6</text>
    <text x="128" y="428" fill="#b85450">cnt[6] = {1: 3, 2: 3}</text>
  </g>
  <text x="170" y="458" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">红色边 = 查询路径 2→3→4→5→6</text>

  <g filter="url(#sk)">
    <rect x="328" y="74" width="284" height="400" rx="10" fill="#f9f8f2" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="470" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">四步计算</text>
  <g font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="344" y="122">① l = lca(2, 6) = 2（a 本身是 b 的祖先）</text>
    <text x="344" y="144">② L = depth[6] + depth[2] − 2·depth[2] = 4</text>
  </g>

  <g filter="url(#sk)">
    <rect x="340" y="160" width="262" height="26" fill="#e8f0fe" stroke="#9bb8d8"/>
    <rect x="340" y="186" width="262" height="26" fill="#ffffff" stroke="#cfcfcf"/>
    <rect x="340" y="212" width="262" height="26" fill="#e6f4ea" stroke="#8ec08e" stroke-width="1.6"/>
    <rect x="340" y="238" width="262" height="26" fill="#f8fafd" stroke="#cfcfcf"/>
    <line x1="370" y1="160" x2="370" y2="264" stroke="#cfcfcf"/>
    <line x1="432" y1="160" x2="432" y2="264" stroke="#cfcfcf"/>
    <line x1="494" y1="160" x2="494" y2="264" stroke="#cfcfcf"/>
    <line x1="554" y1="160" x2="554" y2="264" stroke="#cfcfcf"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">
    <text x="355" y="177">c</text>
    <text x="401" y="177">cnt[b][c]</text>
    <text x="463" y="177">cnt[a][c]</text>
    <text x="524" y="177">−2·cnt[l][c]</text>
    <text x="588" y="177">合计</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">
    <text x="355" y="203">1</text><text x="401" y="203">3</text><text x="463" y="203">2</text><text x="524" y="203">−4</text><text x="588" y="203">1</text>
    <text x="355" y="229" fill="#2e6e2e" font-weight="bold">2</text><text x="401" y="229" fill="#2e6e2e" font-weight="bold">3</text><text x="463" y="229" fill="#2e6e2e" font-weight="bold">0</text><text x="524" y="229" fill="#2e6e2e" font-weight="bold">0</text><text x="588" y="229" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="355" y="255" fill="#999">…</text><text x="401" y="255" fill="#999">0</text><text x="463" y="255" fill="#999">0</text><text x="524" y="255" fill="#999">0</text><text x="588" y="255" fill="#999">0</text>
  </g>

  <g font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="344" y="288">③ best = max{1, 3} = 3：保留三条权 2 的边</text>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="470" y="320" font-size="17" font-weight="bold" fill="#b85450">④ ans = L − best = 4 − 3 = 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="340" y="340" width="262" height="64" rx="10" fill="#f2faf4" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="471" y="362">同法验证示例 1 其余三问：</text>
    <text x="471" y="380">(0,3)→0，(3,6)→0，(0,6)→3</text>
    <text x="471" y="396" font-weight="bold" fill="#2e6e2e">answer = [0, 0, 1, 3] ✓</text>
  </g>
  <text x="470" y="432" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">l 不为端点祖先时公式同样成立（见正文证明）</text>
  <text x="470" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">a 为 b 祖先时退化为 cnt[b][c] − cnt[a][c]</text>
</svg>
