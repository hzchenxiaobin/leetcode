<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单遍扫描，组内维护最大值</text>

  <!-- start -->
  <rect x="60" y="38" width="240" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="60" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = −1；best = 空表</text>
  <path d="M 180 72 V 88" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- take next element -->
  <rect x="60" y="92" width="240" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 180 126 V 142" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- digit sum -->
  <rect x="60" y="146" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="169" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s ← x 的数位和（%10、/10）</text>
  <path d="M 180 182 V 198" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: best[s] exists? -->
  <polygon points="180,202 270,238 180,274 90,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="243" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">best[s] 存在？</text>

  <!-- yes branch -->
  <path d="M 270 238 H 324" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="230" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- update ans -->
  <rect x="330" y="218" width="200" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="243" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(ans, best[s]+x)</text>

  <!-- from ans box into update box -->
  <path d="M 430 258 V 324 H 306" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 180 274 V 302" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="294" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- update best -->
  <rect x="60" y="306" width="240" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="329" text-anchor="middle" font-size="12.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">best[s] = max(best[s], x)</text>
  <path d="M 180 342 V 356" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: more elements? -->
  <polygon points="180,358 252,388 180,418 108,388" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="393" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">还有元素？</text>

  <!-- loop back -->
  <path d="M 108 388 H 42 V 109 H 54" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="378" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- no -> return -->
  <path d="M 252 388 H 314" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="378" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="320" y="370" width="190" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="393" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- warning -->
  <rect x="336" y="120" width="198" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="435" y="142" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">⚠ 顺序不能反：</text>
  <text x="435" y="160" text-anchor="middle" font-size="10.5" fill="#7a6020" filter="url(#rough2)">先用旧 best[s] 更新 ans，</text>
  <text x="435" y="176" text-anchor="middle" font-size="10.5" fill="#7a6020" filter="url(#rough2)">再更新 best[s]，否则 x 自配</text>
</svg>
