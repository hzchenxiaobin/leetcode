<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：seq = "(()())"，整串深度 d = 2</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888">「染色时 level」就是该字符所属括号对的层数，答案 = ⌈d/2⌉ = 1</text>

  <g filter="url(#rough2)">
    <rect x="52" y="66" width="456" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="74" y="84" text-anchor="middle" font-size="9.5" fill="#33475f">i</text>
    <text x="123" y="84" text-anchor="middle" font-size="9.5" fill="#33475f">seq[i]</text>
    <text x="200" y="84" text-anchor="middle" font-size="9.5" fill="#33475f">染色时 level</text>
    <text x="280" y="84" text-anchor="middle" font-size="9.5" fill="#33475f">ans[i]</text>
    <text x="360" y="84" text-anchor="middle" font-size="9.5" fill="#33475f">结束后 level</text>
    <text x="459" y="84" text-anchor="middle" font-size="9.5" fill="#33475f">分组</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <rect x="52" y="94" width="456" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="74" y="111">0</text><text x="123" y="111">(</text><text x="200" y="111">1</text>
    <text x="280" y="111">0</text><text x="360" y="111">1</text><text x="459" y="111">A</text>

    <rect x="52" y="118" width="456" height="24" fill="#f2f8f4" stroke="#ccc" stroke-width="1"/>
    <text x="74" y="135">1</text><text x="123" y="135">(</text><text x="200" y="135">2</text>
    <text x="280" y="135">1</text><text x="360" y="135">2</text><text x="459" y="135">B</text>

    <rect x="52" y="142" width="456" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="74" y="159">2</text><text x="123" y="159">)</text><text x="200" y="159">2</text>
    <text x="280" y="159">1</text><text x="360" y="159">1</text><text x="459" y="159">B</text>

    <rect x="52" y="166" width="456" height="24" fill="#f2f8f4" stroke="#ccc" stroke-width="1"/>
    <text x="74" y="183">3</text><text x="123" y="183">(</text><text x="200" y="183">2</text>
    <text x="280" y="183">1</text><text x="360" y="183">2</text><text x="459" y="183">B</text>

    <rect x="52" y="190" width="456" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="74" y="207">4</text><text x="123" y="207">)</text><text x="200" y="207">2</text>
    <text x="280" y="207">1</text><text x="360" y="207">1</text><text x="459" y="207">B</text>

    <rect x="52" y="214" width="456" height="24" fill="#f2f8f4" stroke="#ccc" stroke-width="1"/>
    <text x="74" y="231">5</text><text x="123" y="231">)</text><text x="200" y="231">1</text>
    <text x="280" y="231">0</text><text x="360" y="231">0</text><text x="459" y="231">A</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="52" y="252" width="216" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="160" y="272" fill="#33475f" font-weight="bold">A = seq[0] + seq[5] = "()"</text>
    <text x="160" y="294" fill="#555">depth(A) = 1</text>

    <rect x="292" y="252" width="216" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="400" y="272" fill="#3a5a30" font-weight="bold">B = seq[1..4] = "()()"</text>
    <text x="400" y="294" fill="#555">depth(B) = 1</text>
  </g>

  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#8a6a20">输出 [0, 1, 1, 1, 1, 0]，max(depth) = 1，恰好等于 ⌈2/2⌉，与官方示例一致</text>

  <rect x="52" y="346" width="456" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="68" y="366" font-size="10.5" fill="#8a6a20" font-weight="bold">示例 2 的答案不唯一，不必与官方逐位相同</text>
  <text x="68" y="384" font-size="10" fill="#555">对 "()(())()" 本算法输出 [0,0,0,1,1,0,0,0]（A = "()()()"，B = "()"），</text>
  <text x="68" y="398" font-size="10" fill="#555">官方给出 [0,0,0,1,1,0,1,1]，两者 max(depth) 都是 1，都合法且最优。</text>
</svg>
