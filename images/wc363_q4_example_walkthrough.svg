<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 435"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="435" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [8, 7, 3, 5, 7, 2, 4, 9]（n = 8）</text>

  <!-- array strip -->
  <rect x="58" y="38" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标1</text>
  <text x="82" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <rect x="109" y="38" width="48" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标2</text>
  <text x="133" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <rect x="160" y="38" width="48" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标3</text>
  <text x="184" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="211" y="38" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标4</text>
  <text x="235" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="262" y="38" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标5</text>
  <text x="286" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <rect x="313" y="38" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标6</text>
  <text x="337" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="364" y="38" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标7</text>
  <text x="388" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="415" y="38" width="48" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="53" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下标8</text>
  <text x="439" y="73" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>

  <!-- table -->
  <rect x="32" y="94" width="456" height="240" rx="4" fill="none" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="32" y="94" width="456" height="24" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="51" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">k</text>
  <text x="82" y="110" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">桶内下标（k·m² ≤ 8）</text>
  <text x="299" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">桶和</text>
  <text x="340" y="110" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">备注</text>
  <line x1="70" y1="94" x2="70" y2="334" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="268" y1="94" x2="268" y2="334" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="94" x2="330" y2="334" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="145" x2="488" y2="145" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="172" x2="488" y2="172" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="199" x2="488" y2="199" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="226" x2="488" y2="226" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="253" x2="488" y2="253" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="280" x2="488" y2="280" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="32" y1="307" x2="488" y2="307" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- highlight row 2 -->
  <rect x="34" y="146" width="452" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="51" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="82" y="136" font-size="11.5" fill="#333" filter="url(#rough2)">1, 4</text>
  <text x="299" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8 + 5 = 13</text>
  <text x="340" y="136" font-size="9.5" fill="#666" filter="url(#rough2)">核 1 的完整桶</text>

  <!-- row 2 -->
  <text x="51" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="82" y="163" font-size="11.5" fill="#333" filter="url(#rough2)">2, 8</text>
  <text x="299" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">7 + 9 = 16 ★</text>
  <text x="340" y="163" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案！核 2 的完整桶</text>

  <!-- row 3 -->
  <text x="51" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="82" y="190" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="299" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="190" font-size="9.5" fill="#666" filter="url(#rough2)">单元素桶</text>

  <!-- row 4 -->
  <text x="51" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="82" y="217" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="299" y="217" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="340" y="217" font-size="9.5" fill="#666" filter="url(#rough2)">4 = 1·2²，核 1 桶的子集</text>

  <!-- row 5 -->
  <text x="51" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="82" y="244" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="299" y="244" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="340" y="244" font-size="9.5" fill="#666" filter="url(#rough2)">单元素桶</text>

  <!-- row 6 -->
  <text x="51" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="82" y="271" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="299" y="271" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="340" y="271" font-size="9.5" fill="#666" filter="url(#rough2)">单元素桶</text>

  <!-- row 7 -->
  <text x="51" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="82" y="298" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="299" y="298" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="340" y="298" font-size="9.5" fill="#666" filter="url(#rough2)">单元素桶</text>

  <!-- row 8 -->
  <text x="51" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="82" y="325" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="299" y="325" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="340" y="325" font-size="9.5" fill="#666" filter="url(#rough2)">8 = 2·2²，核 2 桶的子集</text>

  <!-- summary box -->
  <rect x="32" y="352" width="456" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">ans = max(13, 16, 3, 5, 7, 2, 4, 9) = 16 —— 选下标 {2, 8}</text>
  <text x="260" y="391" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">验证：2 × 8 = 16 = 4²，是完全平方数 ✓</text>

  <text x="260" y="422" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">k = 4、8 本身含平方因子，枚举出的只是真桶的子集 —— 不影响 max，代码无需特判</text>
</svg>
