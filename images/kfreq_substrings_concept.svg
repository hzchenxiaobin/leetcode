<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="670" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：至少型条件 → 固定右端点「数左边」</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A ===== -->
  <text x="60" y="86" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 合法性对「扩窗」封闭（至少型：存在字符频次 ≥ k）</text>

  <text x="118" y="142" font-size="14" fill="#555" filter="url(#rough2)">s =</text>

  <rect x="163" y="112" width="199" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="120" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="234" y="120" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="298" y="120" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="362" y="120" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="426" y="120" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <text x="199" y="150" text-anchor="middle" font-size="17" fill="#333">a</text>
    <text x="263" y="150" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="327" y="150" text-anchor="middle" font-size="17" fill="#333">a</text>
    <text x="391" y="150" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="455" y="150" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="199" y="178" text-anchor="middle" font-size="11" fill="#999">0</text>
    <text x="263" y="178" text-anchor="middle" font-size="11" fill="#999">1</text>
    <text x="327" y="178" text-anchor="middle" font-size="11" fill="#999">2</text>
    <text x="391" y="178" text-anchor="middle" font-size="11" fill="#999">3</text>
    <text x="455" y="178" text-anchor="middle" font-size="11" fill="#999">4</text>
  </g>

  <path d="M 170 200 v 8 h 186 v -8" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="213" font-size="12" fill="#3a6e3a" filter="url(#rough2)">「aba」'a'×2 ≥ k，合法 ✓</text>

  <path d="M 234 228 v 8 h 122 v -8" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="241" font-size="12" fill="#a04a46" filter="url(#rough2)">「ba」最高频次 1 &lt; k，坏 ✗</text>

  <path d="M 170 256 v 8 h 314 v -8" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="269" font-size="12" fill="#3a6e3a" filter="url(#rough2)">「abacb」是 [0,2] 的超集 ⇒ 仍合法 ✓</text>

  <text x="60" y="292" font-size="12.5" fill="#666" filter="url(#rough2)">扩窗 ⇒ 频次不减 ⇒ 合法的超集仍合法；缩窗 ⇒ 频次不增 ⇒ 坏的子集仍坏</text>

  <!-- ===== Panel B ===== -->
  <text x="60" y="322" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">② 固定右端点 r：合法起点是一段前缀</text>
  <text x="455" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">r = 4（固定）</text>
  <path d="M 455 324 L 455 336" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="340" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="234" y="340" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="298" y="340" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="362" y="340" width="58" height="48" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="426" y="340" width="58" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="199" y="370" text-anchor="middle" font-size="17" fill="#333">a</text>
    <text x="263" y="370" text-anchor="middle" font-size="17" fill="#333">b</text>
    <text x="327" y="370" text-anchor="middle" font-size="17" fill="#333">a</text>
    <text x="391" y="370" text-anchor="middle" font-size="17" fill="#333">c</text>
    <text x="455" y="370" text-anchor="middle" font-size="17" fill="#2b4a6e">b</text>
    <text x="199" y="398" text-anchor="middle" font-size="11" fill="#999">0</text>
    <text x="263" y="398" text-anchor="middle" font-size="11" fill="#999">1</text>
    <text x="327" y="398" text-anchor="middle" font-size="11" fill="#999">2</text>
    <text x="391" y="398" text-anchor="middle" font-size="11" fill="#999">3</text>
    <text x="455" y="398" text-anchor="middle" font-size="11" fill="#999">4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 170 414 v 8 h 314 v -8" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="498" y="427" font-size="12" fill="#3a6e3a">l=0「abacb」'a'×2 ✓</text>
    <path d="M 234 440 v 8 h 250 v -8" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="498" y="453" font-size="12" fill="#3a6e3a">l=1「bacb」'b'×2 ✓</text>
    <path d="M 298 466 v 8 h 186 v -8" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="498" y="479" font-size="12" fill="#a04a46">l=2「acb」✗</text>
    <path d="M 362 492 v 8 h 122 v -8" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="498" y="505" font-size="12" fill="#a04a46">l=3「cb」✗</text>
    <path d="M 426 518 v 8 h 58 v -8" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="498" y="531" font-size="12" fill="#a04a46">l=4「b」✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="548" width="780" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="450" y="577" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6215">合法起点 = 前缀 [0, 1]，恰是「以 r 结尾的最长坏窗口」[lo = 2, r] 的左边界</text>
    <text x="450" y="602" text-anchor="middle" font-size="13.5" fill="#8a6215">以 r 结尾的合法子串个数 = lo = 2 ⇒ ans += lo</text>
    <text x="450" y="628" text-anchor="middle" font-size="11" fill="#a08a56">lo 随 r 单调不降 ⇒ 双指针：每个字符至多入窗 / 出窗各一次，O(n)</text>
  </g>
</svg>
