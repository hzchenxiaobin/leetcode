<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：状态＝后缀起点，价值＝净胜分</text>
  <path d="M 150 40 Q 310 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">规则双方对称 ⇒ 不必记录「轮到谁」，只需 i</text>

  <g filter="url(#sk)">
    <rect x="200" y="80" width="220" height="46" rx="9" fill="#eceff1" stroke="#78909c" stroke-width="1.6"/>
  </g>
  <text x="310" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">后缀 nums[i .. n−1]</text>
  <text x="310" y="118" text-anchor="middle" font-size="11" fill="#555">轮到「我」行动</text>

  <path d="M 310 126 L 310 148" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="150" width="320" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="171" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">取走前 k 个（k = 1 或 2），和为 s</text>
  <text x="310" y="188" text-anchor="middle" font-size="11" fill="#8a6415">取 2 个需剩余至少 2 个元素</text>

  <path d="M 250 196 Q 185 210 172 234" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 370 196 Q 435 210 448 234" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="25" y="238" width="270" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="325" y="238" width="270" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="160" y="261" text-anchor="middle" font-size="13" fill="#2f4f6f" font-weight="bold">s % 3 == 0：交棒给对手</text>
  <text x="160" y="284" text-anchor="middle" font-size="12" fill="#2f4f6f">我的净胜 ＝ s − dp[j]</text>
  <text x="160" y="303" text-anchor="middle" font-size="10.5" fill="#446688">dp[j] 记的是对手的领先量，取负号</text>
  <text x="460" y="261" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">s % 3 ≠ 0：我继续行动</text>
  <text x="460" y="284" text-anchor="middle" font-size="12" fill="#2e5a24">我的净胜 ＝ s + dp[j]</text>
  <text x="460" y="303" text-anchor="middle" font-size="10.5" fill="#4a7a3a">dp[j] 仍记在我账上，取正号</text>

  <g filter="url(#sk)">
    <rect x="60" y="330" width="500" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="310" y="352" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">dp[i] ＝ max｛ s − dp[j] ｝∪｛ s + dp[j] ｝</text>
  <text x="310" y="371" text-anchor="middle" font-size="11" fill="#8f3830">j = i+1，以及 i+2（当 i+2 ≤ n）；边界 dp[n] ＝ 0</text>
</svg>
