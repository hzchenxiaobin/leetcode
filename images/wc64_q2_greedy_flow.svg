<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心流程：每步吃掉最大的合法块</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环不变式：已输出的块恰好覆盖 [ip, c)，剩下 m = ip + n − c 个</text>

  <ellipse cx="280" cy="76" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">开始</text>

  <path d="M 280 96 L 280 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,118 358,146 280,174 202,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">m &gt; 0 ?</text>

  <path d="M 358 146 L 424 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="388" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <ellipse cx="470" cy="146" rx="46" ry="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="151" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">结束</text>

  <path d="M 280 174 L 280 192" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="188" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="140" y="196" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="152" y="221" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">low = c &amp; (−c)　（c = 0 时取 2³²）</text>

  <path d="M 280 236 L 280 254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="258" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="152" y="283" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">s = low；while s &gt; m: s &gt;&gt;= 1</text>

  <path d="M 280 298 L 280 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="320" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="152" y="345" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">输出  ipStr(c) + "/" + (32 − log₂s)</text>

  <path d="M 280 360 L 280 378" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="382" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="152" y="405" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">c += s；m −= s　（回到循环判断）</text>

  <path d="M 140 400 H 62 V 146 H 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="70" y="270" font-size="9" fill="#4a7a3a" filter="url(#rough2)">回边</text>
</svg>
