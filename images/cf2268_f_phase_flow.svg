<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按值分阶段，阶段内按列对「抬令牌」</text>
  <text x="330" y="45" text-anchor="middle" font-size="10" fill="#888">阶段 x 全程只用 i ≥ x 的操作 ⇒ 前 x−1 行一旦就位就再也不会被碰</text>

  <!-- stage box -->
  <g filter="url(#rough2)">
    <rect x="150" y="58" width="360" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="330" y="77" text-anchor="middle" font-size="11" fill="#2f4f6f" font-weight="bold" filter="url(#rough2)">阶段 x = 1, 2, …, 2n−2</text>
  <text x="330" y="95" text-anchor="middle" font-size="10" fill="#2f4f6f" filter="url(#rough2)">目标：把每列的 x 搬到第 x 行（t = x−1 为 0-indexed 行号）</text>

  <path d="M330 104 L330 124" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pair loop -->
  <g filter="url(#rough2)">
    <rect x="120" y="126" width="420" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="330" y="151" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">对每个列对 (L,R)：p = x 在 L 的行号，q = x 在 R 的行号</text>

  <path d="M330 166 L330 182" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <g filter="url(#rough2)">
    <rect x="150" y="184" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="215" y="203" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold" filter="url(#rough2)">p = q ?</text>
  <text x="215" y="218" text-anchor="middle" font-size="9" fill="#33502a" filter="url(#rough2)">等高 ⇒ 一起抬</text>

  <g filter="url(#rough2)">
    <rect x="330" y="184" width="270" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="465" y="202" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">p ≠ q ⇒ 先等深，再一起抬</text>
  <text x="465" y="217" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">借外侧邻列拖深的那一个，代价仍 = max(p,q) − x</text>

  <!-- four sub-cases -->
  <path d="M215 224 L215 240" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="242" width="580" height="28" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.2" rx="6"/>
  </g>
  <text x="330" y="261" text-anchor="middle" font-size="9.5" fill="#334" filter="url(#rough2)">① p=q：连做 p−x 次 op(i,L)　② p&gt;q：op(i,L−1) 拖 L 到第 q 行，再①　③ p&lt;q：op(i,R) 拖 R 到第 p 行，再①</text>

  <g filter="url(#rough2)">
    <rect x="40" y="278" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
  </g>
  <text x="330" y="298" text-anchor="middle" font-size="9.5" fill="#7a3a36" filter="url(#rough2)">④ 一侧已正好在第 x 行（q=x 或 p=x）⇒ 最后一步会动到它，多花 1 步；首尾列对没有外侧邻列，最坏多 3 步</text>

  <!-- order choice -->
  <path d="M330 308 L330 324" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="130" y="326" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="330" y="344" text-anchor="middle" font-size="10" fill="#2f4f6f" font-weight="bold" filter="url(#rough2)">列对处理顺序：O(n) 估计两种顺序的代价，取小的</text>
  <text x="330" y="361" text-anchor="middle" font-size="9" fill="#2f4f6f" filter="url(#rough2)">左→右 (1,2)(3,4)… 让「右侧邻列总是未处理」；右→左反过来。哪边多就选哪边</text>

  <path d="M330 370 L330 386" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- last two rows -->
  <g filter="url(#rough2)">
    <rect x="90" y="388" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="330" y="406" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold" filter="url(#rough2)">收尾：只剩最后两行，每列是 {2n−1, 2n} 的某个顺序</text>
  <text x="330" y="422" text-anchor="middle" font-size="9.5" fill="#33502a" filter="url(#rough2)">「坏列」= 底行是 2n−1 的列；xor 不变量 ⇒ 坏列个数为偶数</text>
  <text x="330" y="437" text-anchor="middle" font-size="9.5" fill="#33502a" filter="url(#rough2)">从左到右扫：遇到坏列就 op(2n−2, j)，缺陷右移一格；偶数保证最后一列自动变好</text>

  <path d="M574 168 C 620 168, 626 300, 574 340" stroke="#4a7a3a" stroke-width="1.1" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="636" y="206" font-size="9" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">下一</text>
  <text x="636" y="220" font-size="9" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">阶段</text>
</svg>
