<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="432" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下界：从最高层的质数乘到 n，层号至少升 Ω − 1 次</text>
  <text x="380" y="54" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">以 n = 120 = 2³ · 3 · 5 为例（Ω = 5，ω = 3，答案 7）</text>

  <!-- 层梯子 -->
  <rect x="40" y="84" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="128" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="172" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="216" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="260" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="304" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="348" width="56" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="68" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L1</text>
  <text x="68" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L2</text>
  <text x="68" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L3</text>
  <text x="68" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L4</text>
  <text x="68" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L5</text>
  <text x="68" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L6</text>
  <text x="68" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">L7</text>

  <!-- 三个质数 -->
  <rect x="150" y="84" width="80" height="30" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#a4463f" filter="url(#rough2)">2</text>
  <rect x="150" y="128" width="80" height="30" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#a4463f" filter="url(#rough2)">3</text>
  <rect x="150" y="172" width="80" height="30" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#a4463f" filter="url(#rough2)">5</text>

  <text x="244" y="104" font-size="11.5" fill="#a4463f" filter="url(#rough2)">质数两两互素 → 各占一层</text>
  <text x="244" y="148" font-size="11.5" fill="#a4463f" filter="url(#rough2)">所以层(最高质数) ≥ ω = 3</text>

  <!-- 整除链 -->
  <rect x="150" y="216" width="80" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">10</text>
  <rect x="150" y="260" width="80" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">30</text>
  <rect x="150" y="304" width="80" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">60</text>
  <rect x="150" y="348" width="80" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">120</text>

  <!-- 链箭头 -->
  <path d="M 190 202 L 190 212" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 246 L 190 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 290 L 190 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 334 L 190 344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="240" y="216" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">× 2</text>
  <text x="240" y="260" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">× 3</text>
  <text x="240" y="304" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">× 2</text>
  <text x="240" y="348" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">× 2</text>
  <text x="240" y="392" font-size="11.5" fill="#555" filter="url(#rough2)">这条链共 Ω = 5 个数，每一步都严格 +1 层</text>

  <!-- 结论面板 -->
  <rect x="436" y="96" width="298" height="228" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="120" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">下界推导</text>
  <text x="458" y="146" font-size="12.5" fill="#444" filter="url(#rough2)">① 质数互素 ⇒ ω 个质数占 ω 层</text>
  <text x="458" y="170" font-size="12.5" fill="#444" filter="url(#rough2)">② 取层号最大的质数 p</text>
  <text x="458" y="194" font-size="12.5" fill="#444" filter="url(#rough2)">③ p | p·q | … | n 共 Ω 个数，</text>
  <text x="458" y="216" font-size="12.5" fill="#444" filter="url(#rough2)">　　层号严格递增</text>
  <text x="458" y="242" font-size="12.5" fill="#444" filter="url(#rough2)">④ ⇒ k ≥ 层(p) + (Ω − 1)</text>
  <text x="458" y="266" font-size="12.5" fill="#444" filter="url(#rough2)">　　　 ≥ ω + Ω − 1</text>
  <text x="458" y="296" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">n = 120：k ≥ 3 + 4 = 7</text>

  <text x="380" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下界 7 已被构造达到（见下一张图），故答案就是 Ω(n) + ω(n) − 1</text>
</svg>
