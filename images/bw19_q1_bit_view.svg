<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">二进制视角：除以 2 = 右移，每个 1 各需一次减 1</text>

  <!-- 14 的二进制 -->
  <text x="120" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">14 = 1110₂</text>
  <g filter="url(#rough2)">
    <rect x="70" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="138" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="76" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="87" y="98">1</text><text x="121" y="98">1</text><text x="155" y="98">1</text><text x="189" y="98">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a5c1e" text-anchor="middle">
    <text x="87" y="126">8</text><text x="121" y="126">4</text><text x="155" y="126">2</text><text x="189" y="126">1</text>
  </g>

  <!-- 右移过程 -->
  <text x="120" y="158" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">整个过程（右移 R、减 1 S）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="60" y="186">1110</text>
    <path d="M 92 182 L 118 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="105" y="174" font-size="11" fill="#4a7a3a">R</text>
    <text x="145" y="186">111</text>
    <path d="M 166 182 L 192 182" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="179" y="174" font-size="11" fill="#d6a040">S</text>
    <text x="220" y="186">110</text>
    <path d="M 244 182 L 270 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="257" y="174" font-size="11" fill="#4a7a3a">R</text>
    <text x="295" y="186">11</text>
    <path d="M 312 182 L 338 182" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="325" y="174" font-size="11" fill="#d6a040">S</text>
    <text x="362" y="186">10</text>
    <path d="M 382 182 L 408 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="395" y="174" font-size="11" fill="#4a7a3a">R</text>
    <text x="432" y="186">1</text>
    <path d="M 442 182 L 468 182" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="455" y="174" font-size="11" fill="#d6a040">S</text>
    <text x="490" y="186" font-weight="bold">0</text>
  </g>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">最高位一路右移到底：位数 − 1 次除法；中途每个 1 都要单独减掉：popcount 次减法</text>

  <!-- 公式 -->
  <rect x="60" y="238" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="15" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">步数 = (二进制位数 − 1) + 1 的个数</text>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（num = 0 时直接为 0 步）</text>

  <!-- 两个验证 -->
  <g filter="url(#rough2)">
    <rect x="60" y="306" width="205" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="295" y="306" width="205" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="162" y="328" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">14：4 位、3 个 1 → 3 + 3 = 6 ✓</text>
  <text x="162" y="346" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">1110₂ 右移 3 次、减 1 三次</text>
  <text x="397" y="328" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">8：4 位、1 个 1 → 3 + 1 = 4 ✓</text>
  <text x="397" y="346" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">1000₂ 连续右移 3 次后减 1</text>
</svg>
