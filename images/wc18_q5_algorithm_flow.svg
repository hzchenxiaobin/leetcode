<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：排下标 → 定名次 → 回填</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="320" cy="70" rx="152" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="190" y="104" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="160" y="172" width="320" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <polygon points="232,264 320,230 408,264 320,298" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="30" y="330" width="240" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="370" y="330" width="240" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <ellipse cx="320" cy="452" rx="176" ry="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>

  <text x="320" y="75" text-anchor="middle" font-size="12.5" fill="#2b4a6e">输入 score，n = score.length</text>
  <text x="320" y="125" text-anchor="middle" font-size="12.5" fill="#2b4a6e">建下标数组 idx = [0, 1, …, n−1]</text>
  <text x="320" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">sort(idx)，关键字 score[idx] 从大到小</text>
  <text x="320" y="213" text-anchor="middle" font-size="10.5" fill="#a8873c">O(n log n)，比较不移动数据</text>
  <text x="320" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">r &lt; 3 ?</text>

  <text x="150" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">ans[idx[r]] ← 奖牌[r]</text>
  <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#446688">Gold / Silver / Bronze</text>
  <text x="490" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">ans[idx[r]] ← str(r+1)</text>
  <text x="490" y="376" text-anchor="middle" font-size="10.5" fill="#446688">如 r = 3 → "4"</text>
  <text x="320" y="456" text-anchor="middle" font-size="12.5" fill="#2b4a6e">r 走完 0 … n−1，返回 ans</text>

  <path d="M 320 91 L 320 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 150 L 320 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 320 218 L 320 226" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 232 264 L 150 264 L 150 326" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 408 264 L 490 264 L 490 326" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="196" y="256" text-anchor="middle" font-size="11.5" fill="#2e5a24">是</text>
  <text x="444" y="256" text-anchor="middle" font-size="11.5" fill="#8f3830">否</text>

  <path d="M 150 390 L 150 418 L 320 418 L 320 425" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 490 390 L 490 418 L 326 418" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>

  <text x="320" y="492" text-anchor="middle" font-size="10" fill="#8a8a8a">循环：r 从 0 到 n−1，每轮写一个位置</text>
  <g filter="url(#sk)">
    <rect x="516" y="96" width="112" height="62" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5,4"/>
  </g>
  <text x="572" y="118" text-anchor="middle" font-size="10.5" fill="#4a5a6e">一次排序</text>
  <text x="572" y="136" text-anchor="middle" font-size="10.5" fill="#4a5a6e">一遍扫描</text>
  <text x="572" y="152" text-anchor="middle" font-size="10" fill="#8a8a8a">无需二次查找</text>
</svg>
