<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">演算：asteroids = [3, 5, −6, 2, −1, 4]</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888">橙色两行发生了碰撞，其余行星一路直接入栈</text>

  <rect x="20" y="56" width="520" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="74" text-anchor="middle" font-size="10" fill="#3a4a66">i</text>
  <text x="96" y="74" text-anchor="middle" font-size="10" fill="#3a4a66">a</text>
  <text x="150" y="74" font-size="10" fill="#3a4a66">动作（与栈顶搏斗）</text>
  <text x="414" y="74" font-size="10" fill="#3a4a66">栈状态（自底向上）</text>

  <rect x="20" y="82" width="520" height="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="103" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="96" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3</text>
  <text x="150" y="103" font-size="9.5" fill="#555">a &gt; 0，与栈顶不同向相向 → 直接入栈</text>
  <text x="414" y="103" font-size="10.5" fill="#333">[3]</text>

  <rect x="20" y="114" width="520" height="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="135" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="96" y="135" text-anchor="middle" font-size="10.5" fill="#4a7a3a">5</text>
  <text x="150" y="135" font-size="9.5" fill="#555">a &gt; 0，直接入栈</text>
  <text x="414" y="135" font-size="10.5" fill="#333">[3, 5]</text>

  <rect x="20" y="146" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="167" text-anchor="middle" font-size="10" fill="#8a6a20">2</text>
  <text x="96" y="167" text-anchor="middle" font-size="10.5" fill="#b85450">−6</text>
  <text x="150" y="167" font-size="9.5" fill="#8a6a20">5、3 更小 → 连续 pop 两次，栈空后入栈</text>
  <text x="414" y="167" font-size="10.5" fill="#8a3a36">[−6]</text>

  <rect x="20" y="178" width="520" height="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="199" text-anchor="middle" font-size="10" fill="#666">3</text>
  <text x="96" y="199" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2</text>
  <text x="150" y="199" font-size="9.5" fill="#555">a &gt; 0，直接入栈</text>
  <text x="414" y="199" font-size="10.5" fill="#333">[−6, 2]</text>

  <rect x="20" y="210" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="231" text-anchor="middle" font-size="10" fill="#8a6a20">4</text>
  <text x="96" y="231" text-anchor="middle" font-size="10.5" fill="#b85450">−1</text>
  <text x="150" y="231" font-size="9.5" fill="#8a6a20">栈顶 2 更大 → a 爆炸，不入栈</text>
  <text x="414" y="231" font-size="10.5" fill="#333">[−6, 2]</text>

  <rect x="20" y="242" width="520" height="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="46" y="263" text-anchor="middle" font-size="10" fill="#666">5</text>
  <text x="96" y="263" text-anchor="middle" font-size="10.5" fill="#4a7a3a">4</text>
  <text x="150" y="263" font-size="9.5" fill="#555">a &gt; 0，直接入栈</text>
  <text x="414" y="263" font-size="10.5" fill="#333">[−6, 2, 4]</text>

  <rect x="20" y="274" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="295" text-anchor="middle" font-size="10" fill="#3a5a30">—</text>
  <text x="96" y="295" text-anchor="middle" font-size="10.5" fill="#3a5a30">—</text>
  <text x="150" y="295" font-size="10" fill="#3a5a30">扫描结束，栈即答案</text>
  <text x="414" y="295" font-size="10.5" fill="#3a5a30" font-weight="bold">[−6, 2, 4]</text>

  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#999">注意 i=2：−6 连续吃掉两颗正数，说明「a 的搏斗」必须用 while 而不是 if</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999">注意 i=4：同向/背向都不碰，只有「栈顶为正」才需要比较大小</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#999">栈自底向上就是行星从左到右的位置顺序，因此无需反转结果</text>
</svg>
