<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="620" height="500" fill="#fafafa"/>
  <text x="310" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：层序 BFS + 奇数层双指针交换</text>
  <path d="M 110 44 Q 310 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="220" y="62" width="180" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="310" y="85" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">root 入队，depth = 0</text>

  <g filter="url(#sk)"><path d="M 310 98 L 310 122" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="310,128 420,168 310,208 200,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">队列空？</text>
  <text x="310" y="182" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">（所有层处理完）</text>

  <g filter="url(#sk)"><path d="M 420 168 L 492 168" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="455" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="494" y="150" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="546" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 root</text>

  <g filter="url(#sk)"><path d="M 310 208 L 310 232" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="322" y="226" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="160" y="234" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="310" y="256" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">sz = q.size()（层快照）</text>
  <text x="310" y="276" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">弹出本层节点存入 level，孩子依次入队</text>

  <g filter="url(#sk)"><path d="M 310 286 L 310 310" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="310,316 408,352 310,388 212,352" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="310" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">depth 为奇？</text>

  <g filter="url(#sk)"><path d="M 212 352 L 118 352" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="166" y="342" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="46" y="328" width="70" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="81" y="349" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">depth+1</text>
  <text x="81" y="367" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">回到队空判定</text>
  <g filter="url(#sk)"><path d="M 81 328 Q 81 108 218 80" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><path d="M 310 388 L 310 412" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="322" y="406" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="160" y="414" width="300" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="436" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">l = 0, r = sz − 1</text>
  <text x="310" y="456" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">当 l &lt; r：swap(level[l]-&gt;val, level[r]-&gt;val)</text>
  <text x="310" y="476" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">l++，r−−；随后 depth+1 回到队空判定</text>

  <g filter="url(#sk)"><path d="M 460 449 Q 530 449 530 420 Q 530 118 404 76" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/></g>
  <text x="540" y="290" font-size="11" fill="#7a5415" filter="url(#sk)" transform="rotate(90 540 290)">交换完一层，继续下一层</text>
</svg>
