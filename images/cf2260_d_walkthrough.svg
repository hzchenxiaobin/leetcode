<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="468" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">走查：+--+ 需要 3 ；+0++- 的代价 1 在第 5 位崩掉</text>

  <!-- 行 1：C = 2 -->
  <text x="38" y="100" font-size="14" fill="#8a3b38" filter="url(#rough2)">C = 2</text>
  <text x="38" y="120" font-size="13" fill="#666" filter="url(#rough2)">s = +--+</text>

  <rect x="120" y="70" width="126" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="183" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 1 段 L=1</text>
  <text x="183" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E=2 → lo=1</text>
  <text x="183" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下段额度 1</text>

  <path d="M248 99 L258 99" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="70" width="126" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 段 L=2</text>
  <text x="325" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E=1 → lo=2</text>
  <text x="325" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下段额度 0</text>

  <path d="M390 99 L400 99" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="404" y="70" width="126" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="467" y="92" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">第 3 段无路</text>
  <text x="467" y="110" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">额度 0 &lt; 1</text>
  <text x="467" y="124" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 代价 2 失败</text>

  <text x="560" y="104" font-size="12" fill="#666" filter="url(#rough2)">正负之间来回 3 次</text>

  <!-- 行 2：C = 3 -->
  <text x="38" y="188" font-size="14" fill="#33562a" filter="url(#rough2)">C = 3</text>
  <text x="38" y="208" font-size="13" fill="#666" filter="url(#rough2)">s = +--+</text>

  <rect x="120" y="158" width="126" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="183" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 1 段 L=1</text>
  <text x="183" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E=3 → lo=1</text>
  <text x="183" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下段额度 2</text>

  <path d="M248 187 L258 187" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="158" width="126" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 段 L=2</text>
  <text x="325" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E=2 → lo=1</text>
  <text x="325" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下段额度 2</text>

  <path d="M390 187 L400 187" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="404" y="158" width="126" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="467" y="180" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">第 3 段 L=1</text>
  <text x="467" y="198" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">E=2 → lo=1</text>
  <text x="467" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 答案 3</text>

  <text x="560" y="192" font-size="12" fill="#666" filter="url(#rough2)">额度始终 ≥ 2，不会再死</text>

  <!-- 行 3：C = 1 -->
  <text x="38" y="276" font-size="14" fill="#8a6d1f" filter="url(#rough2)">C = 1</text>
  <text x="38" y="296" font-size="13" fill="#666" filter="url(#rough2)">s = +0++-</text>

  <rect x="120" y="246" width="126" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="183" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 1 位 '+'</text>
  <text x="183" y="292" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">可达 {1}</text>

  <path d="M248 275 L258 275" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="246" width="126" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 位 '0'</text>
  <text x="325" y="292" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">{1} → {0}</text>

  <path d="M390 275 L400 275" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="404" y="246" width="126" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="467" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 3、4 位 '+'</text>
  <text x="467" y="292" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">{0}→{1}→{2}</text>

  <path d="M532 275 L542 275" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="546" y="246" width="126" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="609" y="268" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">第 5 位 '-'</text>
  <text x="609" y="286" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">{1,3} 全为正</text>
  <text x="609" y="300" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 代价 1 失败</text>

  <!-- 图例 -->
  <rect x="34" y="326" width="652" height="118" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="350" font-size="12" fill="#333" filter="url(#rough2)">E = 入口额度：本段首项幅值的上限；第一段 E = C，之后 E ← C − lo</text>
  <text x="52" y="372" font-size="12" fill="#333" filter="url(#rough2)">lo = 本段末项可达的最小幅值：L=1 或 L ≥ 3 时为 1，仅当 E=1 且 L=2 时为 2</text>
  <text x="52" y="394" font-size="12" fill="#333" filter="url(#rough2)">C=2 时第 2 段起 E 恒为 1，所以「中间的 L=2」把下一段额度直接打成 0</text>
  <text x="52" y="416" font-size="12" fill="#333" filter="url(#rough2)">C=1 时步长恰好 ±1：pᵢ ≡ i (mod 2)，异号翻转至少要 2 的步长，所以只能同号延续</text>
  <text x="52" y="436" font-size="11" fill="#888" filter="url(#rough2)">注意末段豁免：它后面没有下一段，额度降到 0 也无所谓</text>
</svg>
