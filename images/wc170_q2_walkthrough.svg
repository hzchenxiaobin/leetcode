<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：arr = [1, 3, 4, 8] 的建表与查询</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">左边先滚出前缀表，右边对每个查询做一次「大前缀 ⊕ 小前缀」</text>

  <text x="30" y="70" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 建前缀表</text>
  <text x="300" y="70" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 逐查询套公式</text>

  <rect x="30" y="78" width="262" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#3a4a66">
    <text x="52" y="95">i</text>
    <text x="112" y="95">arr[i]</text>
    <text x="176" y="95">pre[i]</text>
    <text x="248" y="95">pre[i+1]</text>
  </g>

  <rect x="300" y="78" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#3a5a30">
    <text x="340" y="95">[L, R]</text>
    <text x="416" y="95">pre[R+1]</text>
    <text x="468" y="95">pre[L]</text>
    <text x="522" y="95">结果</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="104" width="262" height="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="1" rx="4"/>
    <rect x="30" y="130" width="262" height="26" fill="#f7fafd" stroke="#cfd8e3" stroke-width="1" rx="4"/>
    <rect x="30" y="156" width="262" height="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="1" rx="4"/>
    <rect x="30" y="182" width="262" height="26" fill="#f7fafd" stroke="#cfd8e3" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="52" y="121">0</text><text x="112" y="121">1</text><text x="176" y="121">0</text><text x="248" y="121">1</text>
    <text x="52" y="147">1</text><text x="112" y="147">3</text><text x="176" y="147">1</text><text x="248" y="147">2</text>
    <text x="52" y="173">2</text><text x="112" y="173">4</text><text x="176" y="173">2</text><text x="248" y="173">6</text>
    <text x="52" y="199">3</text><text x="112" y="199">8</text><text x="176" y="199">6</text><text x="248" y="199">14</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="300" y="104" width="240" height="26" fill="#ffffff" stroke="#c6d8c0" stroke-width="1" rx="4"/>
    <rect x="300" y="130" width="240" height="26" fill="#f7faf5" stroke="#c6d8c0" stroke-width="1" rx="4"/>
    <rect x="300" y="156" width="240" height="26" fill="#ffffff" stroke="#c6d8c0" stroke-width="1" rx="4"/>
    <rect x="300" y="182" width="240" height="26" fill="#f7faf5" stroke="#c6d8c0" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="340" y="121">[0,1]</text><text x="416" y="121">2</text><text x="468" y="121">0</text>
    <text x="340" y="147">[1,2]</text><text x="416" y="147">6</text><text x="468" y="147">1</text>
    <text x="340" y="173">[0,3]</text><text x="416" y="173">14</text><text x="468" y="173">0</text>
    <text x="340" y="199">[3,3]</text><text x="416" y="199">14</text><text x="468" y="199">6</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#8a3a36">
    <text x="522" y="121">2</text>
    <text x="522" y="147">7</text>
    <text x="522" y="173">14</text>
    <text x="522" y="199">8</text>
  </g>

  <rect x="30" y="222" width="480" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="246" font-size="10.3" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">再看示例 2：arr = [4, 8, 2, 10] ⇒ pre = [0, 4, 12, 14, 4]</text>
  <text x="46" y="270" font-size="10.3" fill="#555" filter="url(#rough2)">[2,3] = pre[4] ⊕ pre[2] = 4 ⊕ 12 = 8</text>
  <text x="46" y="292" font-size="10.3" fill="#555" filter="url(#rough2)">[1,3] = pre[4] ⊕ pre[1] = 4 ⊕ 4 = 0　（两端前缀相同 ⇒ 区间异或为 0）</text>
  <text x="46" y="314" font-size="10.3" fill="#555" filter="url(#rough2)">[0,0] = pre[1] ⊕ pre[0] = 4 ⊕ 0 = 4　（单点查询也走同一公式）</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 右端一律写成 pre[R+1]：arr[R] 要留在区间里，所以前缀必须取到 R+1</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">arr[i] &lt; 2³⁰，异或不会进位，任意区间结果同样 &lt; 2³⁰，int 足够</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">共 4 个查询，每个只做 1 次异或、2 次查表 —— 与区间长度无关，这正是前缀法的价值</text>
</svg>
