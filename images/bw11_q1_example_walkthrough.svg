<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三个用例，同一公式</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">第三行是 d = 0 的情形：计算过程与前两行逐字符相同</text>

  <g filter="url(#rough2)">
    <rect x="30" y="60" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="60" width="70" height="40" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="220" y="60" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="60" width="80" height="40" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="410" y="60" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>

    <rect x="30" y="100" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="100" width="70" height="40" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="220" y="100" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="100" width="80" height="40" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="410" y="100" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>

    <rect x="30" y="140" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="140" width="70" height="40" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="220" y="140" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="140" width="80" height="40" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="410" y="140" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="90" y="78" fill="#3a4a66" font-weight="bold">arr</text>
    <text x="185" y="78" fill="#333">m=n+1</text>
    <text x="275" y="78" fill="#8a6a20" font-weight="bold">S原</text>
    <text x="370" y="78" fill="#333">现和</text>
    <text x="470" y="78" fill="#3a5a30" font-weight="bold">缺失值</text>

    <text x="90" y="125" fill="#333" font-weight="bold">[5,7,11,13]</text>
    <text x="185" y="125" fill="#333">5</text>
    <text x="275" y="125" fill="#8a6a20">45</text>
    <text x="370" y="125" fill="#333">36</text>
    <text x="470" y="125" fill="#3a5a30" font-weight="bold">9</text>

    <text x="90" y="165" fill="#333" font-weight="bold">[15,13,12]</text>
    <text x="185" y="165" fill="#333">4</text>
    <text x="275" y="165" fill="#8a6a20">54</text>
    <text x="370" y="165" fill="#333">40</text>
    <text x="470" y="165" fill="#3a5a30" font-weight="bold">14</text>

    <text x="90" y="205" fill="#333" font-weight="bold">[7,7,7]</text>
    <text x="185" y="205" fill="#333">4</text>
    <text x="275" y="205" fill="#8a6a20">28</text>
    <text x="370" y="205" fill="#333">21</text>
    <text x="470" y="205" fill="#3a5a30" font-weight="bold">7</text>
  </g>

  <rect x="60" y="240" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">差分法需要为 d=0（无断点）与负公差（找最大差还是最小差）各开分支</text>
  <text x="280" y="285" text-anchor="middle" font-size="11.5" fill="#8a6a20">求和法把它们全部折叠进同一条减法：S原 − S现</text>
  <text x="280" y="305" text-anchor="middle" font-size="10" fill="#999">对照验证：d=(末−首)/n，扫描找 arr[i+1]−arr[i] ≠ d 的断点</text>
</svg>
