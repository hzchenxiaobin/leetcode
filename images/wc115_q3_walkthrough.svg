<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="13.5" fill="#333333" filter="url(#rough2)">示例 1：[" /","/ "] 被一条贯通斜线切成 2 块</text>
  <rect x="120" y="56" width="200" height="200" rx="2" fill="#ffffff" stroke="#666666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="320" y1="56" x2="120" y2="256" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="154" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">区域 A</text>
  <text x="286" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区域 B</text>
  <text x="420" y="120" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">格 (0,1) = '/'</text>
  <text x="420" y="144" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">格 (1,0) = '/'</text>
  <text x="420" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">首尾相接 → 贯通</text>
  <rect x="40" y="276" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">并查集最终剩 2 个连通分量 → 区域数 = 2</text>
</svg>
