<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="330" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">逐轮演算：fast 走 2 步、slow 走 1 步，直到 fast 无法再走两步</text>

  <rect x="24" y="48" width="592" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="68" font-size="12" fill="#2c4a63" filter="url(#rough2)">轮次</text>
  <text x="140" y="68" font-size="12" fill="#2c4a63" filter="url(#rough2)">slow 位置</text>
  <text x="300" y="68" font-size="12" fill="#2c4a63" filter="url(#rough2)">fast 位置</text>
  <text x="470" y="68" font-size="12" fill="#2c4a63" filter="url(#rough2)">fast / fast.next</text>

  <rect x="24" y="80" width="592" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="100" font-size="12" fill="#444" filter="url(#rough2)">初始</text>
  <text x="152" y="100" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="312" y="100" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="474" y="100" font-size="12" fill="#444" filter="url(#rough2)">都存在</text>

  <rect x="24" y="112" width="592" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="132" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="152" y="132" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="312" y="132" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="474" y="132" font-size="12" fill="#444" filter="url(#rough2)">都存在</text>

  <rect x="24" y="144" width="592" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="164" font-size="12" fill="#8a6410" filter="url(#rough2)">2</text>
  <text x="152" y="164" font-size="12" fill="#8a6410" filter="url(#rough2)">3</text>
  <text x="312" y="164" font-size="12" fill="#8a6410" filter="url(#rough2)">5</text>
  <text x="474" y="164" font-size="12" fill="#8a6410" filter="url(#rough2)">fast.next = null，停</text>

  <text x="24" y="204" font-size="13" fill="#333" filter="url(#rough2)">返回 slow 所指的 3 —— 恰是 5 个结点的中间结点</text>

  <rect x="24" y="220" width="288" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="168" y="244" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">偶数长度为何是「后一个中间」？</text>
  <text x="168" y="268" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">slow 走到倒数第二对时已进 1 格，</text>
  <text x="168" y="288" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">而 fast 还需要再走 2 步才停</text>

  <rect x="328" y="220" width="288" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="472" y="244" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">不要数长度再走一半</text>
  <text x="472" y="268" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">两趟遍历 O(2n) 且要多存一遍；</text>
  <text x="472" y="288" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">快慢指针一趟 O(n)、O(1) 空间</text>
</svg>
