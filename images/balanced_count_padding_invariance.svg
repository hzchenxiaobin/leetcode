<svg xmlns="http://www.w3.org/2000/svg" width="620" height="460" viewBox="0 0 620 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：左边补零，不改变平衡性</text>
  <text x="310" y="48" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">奇位（蓝，第 1,3,5… 位）/ 偶位（橙，第 2,4,6… 位）都从最左边数起</text>

  <!-- Row 1: 121 -->
  <g filter="url(#sk)">
    <text x="52" y="122" font-size="12.5" fill="#446688" font-weight="bold">原数</text>
    <rect x="140" y="96" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="182" y="96" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="224" y="96" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="160" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="202" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="244" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="160" y="149" text-anchor="middle" font-size="9.5" fill="#888">位置1 奇</text>
    <text x="202" y="149" text-anchor="middle" font-size="9.5" fill="#888">位置2 偶</text>
    <text x="244" y="149" text-anchor="middle" font-size="9.5" fill="#888">位置3 奇</text>
    <text x="300" y="112" font-size="11.5" fill="#33506b">奇位和 = 1 + 1 = 2</text>
    <text x="300" y="130" font-size="11.5" fill="#8a6d1a">偶位和 = 2</text>
    <text x="300" y="150" font-size="12" fill="#2f5d24" font-weight="bold">✓ 平衡</text>
  </g>

  <path d="M 118 156 L 118 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="100" y="174" font-size="10.5" fill="#888" filter="url(#sk)">补 0</text>

  <!-- Row 2: 0121 -->
  <g filter="url(#sk)">
    <text x="30" y="214" font-size="12" fill="#446688" font-weight="bold">补 1 个零</text>
    <rect x="120" y="188" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="162" y="188" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="204" y="188" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="246" y="188" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="140" y="213" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">0</text>
    <text x="182" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="224" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="266" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="140" y="241" text-anchor="middle" font-size="9.5" fill="#888">1 奇</text>
    <text x="182" y="241" text-anchor="middle" font-size="9.5" fill="#888">2 偶</text>
    <text x="224" y="241" text-anchor="middle" font-size="9.5" fill="#888">3 奇</text>
    <text x="266" y="241" text-anchor="middle" font-size="9.5" fill="#888">4 偶</text>
    <text x="310" y="204" font-size="11.5" fill="#33506b">奇位和 = 0 + 2 = 2</text>
    <text x="310" y="222" font-size="11.5" fill="#8a6d1a">偶位和 = 1 + 1 = 2</text>
    <text x="310" y="242" font-size="12" fill="#2f5d24" font-weight="bold">✓ 仍平衡（两个和互换）</text>
  </g>

  <path d="M 110 248 L 110 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="92" y="266" font-size="10.5" fill="#888" filter="url(#sk)">再补 0</text>

  <!-- Row 3: 00121 -->
  <g filter="url(#sk)">
    <text x="30" y="306" font-size="12" fill="#446688" font-weight="bold">补 2 个零</text>
    <rect x="100" y="280" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="142" y="280" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="184" y="280" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="226" y="280" width="40" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="268" y="280" width="40" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="305" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">0</text>
    <text x="162" y="305" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">0</text>
    <text x="204" y="305" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="246" y="305" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <text x="288" y="305" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="120" y="333" text-anchor="middle" font-size="9.5" fill="#888">1 奇</text>
    <text x="162" y="333" text-anchor="middle" font-size="9.5" fill="#888">2 偶</text>
    <text x="204" y="333" text-anchor="middle" font-size="9.5" fill="#888">3 奇</text>
    <text x="246" y="333" text-anchor="middle" font-size="9.5" fill="#888">4 偶</text>
    <text x="288" y="333" text-anchor="middle" font-size="9.5" fill="#888">5 奇</text>
    <text x="340" y="296" font-size="11.5" fill="#33506b">奇位和 = 0 + 1 + 1 = 2</text>
    <text x="340" y="314" font-size="11.5" fill="#8a6d1a">偶位和 = 0 + 2 = 2</text>
    <text x="340" y="334" font-size="12" fill="#2f5d24" font-weight="bold">✓ 仍平衡</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="30" y="352" width="560" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="310" y="370" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">每次补零：旧数字整体右移一位，奇 ↔ 偶身份互换，两个和互换；新增的 0 不贡献</text>
    <text x="310" y="388" text-anchor="middle" font-size="11" fill="#2f5d24">从右数的交替和 A = Σ(−1)^j·dj 视角更显然：补零只是添了 ±0 项，A 不变</text>

    <rect x="30" y="404" width="560" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="310" y="422" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">唯一伪影：全零串（数 0）的 A = 0，会被多算 1 次；个位数 d 补零后 A = ±d ≠ 0，不会误算</text>
    <text x="310" y="440" text-anchor="middle" font-size="11" fill="#7a4a48">因此 count(x) = f(x) + 1；作差 count(high) − count(low−1) 时伪影自动抵消</text>
  </g>
</svg>
