<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="404" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把人数拆成左右两段：左段选 L 可见，右段选 R 可见</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 n = 9、pos = 4 为例：左侧 a = 4 人，右侧 b = 4 人</text>
  <rect x="82" y="76" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="126" y="76" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="170" y="76" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="214" y="76" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="258" y="76" width="38" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277.0" y="97.96" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="302" y="76" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="346" y="76" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="390" y="76" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="434" y="76" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453.0" y="97.96" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="36" y="96" text-anchor="start" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">下标</text>
  <text x="277" y="132" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">▲ pos</text>
  <rect x="76" y="148" width="178" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="164.0" y="170" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">左侧 a = pos 人：选 L 才可见</text>
  <rect x="300" y="148" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="388.0" y="170" text-anchor="middle" font-size="9" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">右侧 b = n−1−pos 人：选 R 才可见</text>
  <rect x="254" y="188" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="277" y="210" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">pos 自己</text>
  <rect x="36" y="232" width="488" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="252" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">可见人数怎么算</text>
  <text x="48" y="270" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">设左侧有 i 人选 L、右侧有 k−i 人选 R，则 pos 恰好看到 k 人</text>
  <text x="48" y="288" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">pos 本人的方向不影响任何人的可见性 → 贡献一个固定的因子 2</text>
  <rect x="36" y="304" width="488" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="324" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">计数公式</text>
  <text x="48" y="342" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">答案 = 2 · Σ_i C(a, i) · C(b, k−i)，其中 a = pos，b = n−1−pos</text>
  <text x="48" y="360" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">i 的取值范围要同时满足 0 ≤ i ≤ a 与 0 ≤ k−i ≤ b（越界项按 0 计）</text>
  <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">C(a,i) 选出哪 i 个左侧的人选 L；右侧同理，两侧独立相乘</text>
</svg>
