<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：统一成权值 t 的代价 = L − cnt(t)</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888">一次操作只改一条边、改成什么互不干扰 ⇒ 代价只由「留下不动的边数」决定</text>

  <g stroke-width="2.4" fill="none" filter="url(#sk)">
    <line x1="76" y1="120" x2="119" y2="120" stroke="#4a8edb"/>
    <line x1="161" y1="120" x2="204" y2="120" stroke="#4a8edb"/>
    <line x1="246" y1="120" x2="289" y2="120" stroke="#4a8edb"/>
    <line x1="331" y1="120" x2="374" y2="120" stroke="#c98a2b"/>
    <line x1="416" y1="120" x2="459" y2="120" stroke="#c98a2b"/>
    <line x1="501" y1="120" x2="544" y2="120" stroke="#c98a2b"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" filter="url(#sk)">
    <text x="97" y="106" fill="#2b6e9e">1</text>
    <text x="182" y="106" fill="#2b6e9e">1</text>
    <text x="267" y="106" fill="#2b6e9e">1</text>
    <text x="352" y="106" fill="#7a5415">2</text>
    <text x="437" y="106" fill="#7a5415">2</text>
    <text x="522" y="106" fill="#7a5415">2</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="55" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
    <circle cx="140" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
    <circle cx="225" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
    <circle cx="310" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
    <circle cx="395" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
    <circle cx="480" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
    <circle cx="565" cy="120" r="19" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">
    <text x="55" y="125">0</text>
    <text x="140" y="125">1</text>
    <text x="225" y="125">2</text>
    <text x="310" y="125">3</text>
    <text x="395" y="125">4</text>
    <text x="480" y="125">5</text>
    <text x="565" y="125">6</text>
  </g>

  <path d="M 55 148 Q 182 168 310 148" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 310 148 Q 437 168 565 148" stroke="#c98a2b" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="182" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">权 1 出现 3 次</text>
  <text x="437" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">权 2 出现 3 次</text>
  <text x="320" y="214" text-anchor="middle" font-size="12" fill="#666">查询 (0, 6)：路径长 L = 6（示例 1 第 4 问）</text>

  <g filter="url(#sk)">
    <rect x="36" y="236" width="300" height="128" rx="10" fill="#f7fafc" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="186" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">逐个目标 t 试代价 ops(t) = L − cnt(t)</text>
  <g font-size="12.5" text-anchor="middle" fill="#444" filter="url(#sk)">
    <text x="186" y="286">t = 1：6 − 3 = 3</text>
    <text x="186" y="308">t = 2：6 − 3 = 3</text>
    <text x="186" y="330">其他 t：6 − 0 = 6（路径上没有）</text>
  </g>
  <text x="186" y="354" text-anchor="middle" font-size="11.5" fill="#888">逐条边算代价 → 只需数出每种权值的个数</text>

  <g filter="url(#sk)">
    <rect x="356" y="236" width="248" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="480" y="262" font-size="14" font-weight="bold" fill="#7a5415">ans = min ops(t)</text>
    <text x="480" y="286" font-size="14" font-weight="bold" fill="#7a5415">= L − max cnt(t)</text>
    <text x="480" y="318" font-size="22" font-weight="bold" fill="#b85450">= 6 − 3 = 3</text>
    <text x="480" y="350" font-size="12" fill="#666">保留众数权值，其余边全改</text>
  </g>

  <g filter="url(#sk)">
    <rect x="36" y="380" width="568" height="28" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="320" y="399" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">结论：单次查询只需求「路径上 26 种权值各自的出现次数」，取其最大者即可</text>
</svg>
