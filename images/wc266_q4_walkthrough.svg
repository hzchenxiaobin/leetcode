<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：values = [0, 32, 10, 43]，maxTime = 49（示例 1）</text>
  <text x="320" y="40" text-anchor="middle" font-size="11" fill="#666666">最优 walk：0 → 1 → 0 → 3 → 0，总时间 40 ≤ 49 —— 每次回到 0 都记账，价值只按「到过」算</text>

  <g filter="url(#sk)" stroke="#9db8d8" stroke-width="1.4" fill="none">
    <path d="M100,225 L228,112"/>
    <path d="M228,112 L258,248"/>
    <path d="M100,225 L158,300"/>
  </g>
  <g filter="url(#sk)" stroke="#d6a040" stroke-width="3.2" fill="none">
    <path d="M104,221 L224,116"/>
    <path d="M104,229 L154,294"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="100" cy="225" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="228" cy="112" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="258" cy="248" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="158" cy="300" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="100" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="228" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="258" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="158" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">3</text>

  <text x="76" y="230" text-anchor="end" font-size="10" fill="#555555">值 0</text>
  <text x="228" y="86" text-anchor="middle" font-size="10" fill="#555555">值 32</text>
  <text x="258" y="282" text-anchor="middle" font-size="10" fill="#555555">值 10</text>
  <text x="158" y="334" text-anchor="middle" font-size="10" fill="#555555">值 43</text>

  <text x="146" y="160" font-size="10.5" fill="#666666">10</text>
  <text x="256" y="178" font-size="10.5" fill="#666666">15</text>
  <text x="108" y="262" font-size="10.5" fill="#666666">10</text>

  <g filter="url(#sk)">
    <circle cx="150" cy="188" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="180" cy="162" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="146" cy="256" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="114" cy="282" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="150" y="191.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a6415">1</text>
  <text x="180" y="165.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a6415">2</text>
  <text x="146" y="259.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a6415">3</text>
  <text x="114" y="285.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a6415">4</text>

  <text x="155" y="358" text-anchor="middle" font-size="10.5" fill="#555555">顺序 ① 0→1、② 1→0、③ 0→3、④ 3→0</text>
  <text x="155" y="374" text-anchor="middle" font-size="10.5" fill="#8a6415">总时间 10+10+10+10 = 40 ≤ 49</text>

  <g filter="url(#sk)">
    <rect x="285" y="62" width="28" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="313" y="62" width="102" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="415" y="62" width="34" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="449" y="62" width="104" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="553" y="62" width="71" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="299" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">步</text>
  <text x="364" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">走边</text>
  <text x="432" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">t</text>
  <text x="501" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">cur（价值和）</text>
  <text x="588" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">回到 0？</text>

  <g filter="url(#sk)">
    <rect x="285" y="88" width="28" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="313" y="88" width="102" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="415" y="88" width="34" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="449" y="88" width="104" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="553" y="88" width="71" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="299" y="105" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="364" y="105" text-anchor="middle" font-size="10" fill="#333">出发于 0</text>
  <text x="432" y="105" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="501" y="105" text-anchor="middle" font-size="10" fill="#333">0（起点值计入）</text>
  <text x="588" y="105" text-anchor="middle" font-size="10" fill="#2e6e2e">✓ ans=0</text>

  <g filter="url(#sk)">
    <rect x="285" y="115" width="28" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="313" y="115" width="102" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="415" y="115" width="34" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="449" y="115" width="104" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="553" y="115" width="71" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="299" y="132" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="364" y="132" text-anchor="middle" font-size="10" fill="#333">0→1（10 秒）</text>
  <text x="432" y="132" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="501" y="132" text-anchor="middle" font-size="10" fill="#333">32（首访 +32）</text>
  <text x="588" y="132" text-anchor="middle" font-size="10" fill="#999999">—</text>

  <g filter="url(#sk)">
    <rect x="285" y="142" width="28" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="313" y="142" width="102" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="415" y="142" width="34" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="449" y="142" width="104" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
    <rect x="553" y="142" width="71" height="27" fill="#ffffff" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="299" y="159" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="364" y="159" text-anchor="middle" font-size="10" fill="#333">1→0（10 秒）</text>
  <text x="432" y="159" text-anchor="middle" font-size="10" fill="#333">20</text>
  <text x="501" y="159" text-anchor="middle" font-size="10" fill="#333">32（0 已计入）</text>
  <text x="588" y="159" text-anchor="middle" font-size="10" fill="#2e6e2e">✓ ans=32</text>

  <g filter="url(#sk)">
    <rect x="285" y="169" width="28" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="313" y="169" width="102" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="415" y="169" width="34" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="449" y="169" width="104" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
    <rect x="553" y="169" width="71" height="27" fill="#fafafa" stroke="#9db8d8" stroke-width="1"/>
  </g>
  <text x="299" y="186" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="364" y="186" text-anchor="middle" font-size="10" fill="#333">0→3（10 秒）</text>
  <text x="432" y="186" text-anchor="middle" font-size="10" fill="#333">30</text>
  <text x="501" y="186" text-anchor="middle" font-size="10" fill="#333">75（首访 +43）</text>
  <text x="588" y="186" text-anchor="middle" font-size="10" fill="#999999">—</text>

  <g filter="url(#sk)">
    <rect x="285" y="196" width="28" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="313" y="196" width="102" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="415" y="196" width="34" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="449" y="196" width="104" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="553" y="196" width="71" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="299" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6415">4</text>
  <text x="364" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6415">3→0（10 秒）</text>
  <text x="432" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6415">40</text>
  <text x="501" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6415">75（0 已计入）</text>
  <text x="588" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">✓ ans=75 ←</text>

  <g filter="url(#sk)">
    <rect x="285" y="240" width="339" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="454" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">绕道去捡节点 2（值 10）？0→1→2→1→0 要 50 &gt; 49 ✗</text>
  <text x="454" y="282" text-anchor="middle" font-size="10" fill="#555555">在 t = 40 处想走最后一步 1→0：40 + 10 = 50 &gt; 49 被剪枝（且 42 &lt; 75 本就不划算）</text>

  <g filter="url(#sk)">
    <rect x="285" y="312" width="339" height="94" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="454" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">记账规则：cnt 从 0→1 时 cur += values[v]，归零时减回</text>
  <text x="454" y="354" text-anchor="middle" font-size="10" fill="#555555">节点 0 在这条 walk 上走了 3 次，价值只计 1 次；节点 1 离开再回来也不重复计值</text>
  <text x="454" y="374" text-anchor="middle" font-size="10" fill="#555555">回到 0 不停：中途两次经过 0，每次都用当时的 cur 刷新 ans</text>
  <text x="454" y="394" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">最终 ans = 75 = values[0] + values[1] + values[3]</text>
</svg>
