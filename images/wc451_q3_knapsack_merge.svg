<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="700" fill="#fafafa"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">算法流程：DFS(u) —— 两条合并链 + 一次组装</text>
  <path d="M 280 42 Q 460 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="150" y="58" width="180" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="83" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#sk)">进入 DFS(u)</text>
  <path d="M 240 98 L 240 124" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <rect x="105" y="126" width="270" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="240" y="149" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#sk)">NB ← 全 0 数组</text>
  <text x="240" y="170" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#sk)">CH ← 全 0 数组（长度 B+1）</text>
  <path d="M 240 180 L 240 206" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <polygon points="240,208 352,258 240,308 128,258" fill="#fffdf3" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="240" y="252" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">还有孩子 v</text>
  <text x="240" y="272" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">未处理？</text>
  <text x="253" y="325" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>
  <path d="M 240 308 L 240 334" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <rect x="95" y="338" width="290" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="362" text-anchor="middle" font-size="12.5" fill="#3d5a30" filter="url(#sk)">(f, h) ← DFS(v)　递归孩子</text>
  <text x="240" y="386" text-anchor="middle" font-size="12.5" fill="#3d5a30" filter="url(#sk)">NB ← merge(NB, f)</text>
  <text x="240" y="410" text-anchor="middle" font-size="12.5" fill="#3d5a30" filter="url(#sk)">CH ← merge(CH, h)</text>
  <text x="240" y="430" text-anchor="middle" font-size="10.5" fill="#7a9a6a" filter="url(#sk)">（f = full[v]，h = half[v]）</text>
  <path d="M 385 388 L 420 388 L 420 258 L 356 258" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="112" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>
  <path d="M 128 258 L 76 258 L 76 566 L 91 566" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <rect x="95" y="514" width="290" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="536" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#sk)">full[j] = max(NB[j],</text>
  <text x="240" y="554" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#sk)">w − present[u] + CH[j−present[u]])</text>
  <text x="240" y="574" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#sk)">half[j] = max(NB[j],</text>
  <text x="240" y="592" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#sk)">w − ⌊present[u]/2⌋ + CH[j−⌊present[u]/2⌋])</text>
  <text x="240" y="611" text-anchor="middle" font-size="10.5" fill="#a8843a" filter="url(#sk)">（j ≥ 对应价格，w = future[u]）</text>
  <path d="M 240 618 L 240 644" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <rect x="150" y="646" width="180" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="671" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">return (full, half)</text>

  <rect x="470" y="120" width="420" height="124" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="680" y="144" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#sk)">merge 算子（花费 ≤ j 语义）</text>
  <text x="680" y="170" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#sk)">merge(A, C)[j] = max{ A[x] + C[y] : x + y = j }</text>
  <text x="490" y="196" text-anchor="start" font-size="11.5" fill="#8a6a20" filter="url(#sk)">· 空选利润为 0 → 恒等元是全 0 数组</text>
  <text x="490" y="220" text-anchor="start" font-size="11.5" fill="#8a6a20" filter="url(#sk)">· 合并后仍单调不降，无需再取前缀 max</text>

  <rect x="470" y="266" width="420" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="680" y="290" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">两条链 = 两个平行世界</text>
  <text x="490" y="314" text-anchor="start" font-size="11.5" fill="#3d5a30" filter="url(#sk)">· NB 链：「u 不买」世界，孩子付全价（查 full）</text>
  <text x="490" y="336" text-anchor="start" font-size="11.5" fill="#3d5a30" filter="url(#sk)">· CH 链：「u 买」世界，孩子付半价（查 half）</text>
  <text x="490" y="358" text-anchor="start" font-size="11.5" fill="#3d5a30" filter="url(#sk)">· CH 不含 u 自身花费，留到组装时再扣预算</text>

  <rect x="470" y="392" width="420" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="680" y="416" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#sk)">为什么 full / half 能共用两条链？</text>
  <text x="490" y="440" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#sk)">· 孩子查哪张表，只取决于「u 买没买」</text>
  <text x="490" y="462" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#sk)">· u 自己付全价还是半价，只影响组装那一项</text>

  <rect x="470" y="506" width="420" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="680" y="530" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">复杂度与答案</text>
  <text x="490" y="554" text-anchor="start" font-size="11.5" fill="#a04a46" filter="url(#sk)">· 每条树边恰好 2 次 O(B²) 合并 → 总时间 O(n·B²)</text>
  <text x="490" y="576" text-anchor="start" font-size="11.5" fill="#a04a46" filter="url(#sk)">· 答案 = full[1][budget]：根没有上司，</text>
  <text x="502" y="596" text-anchor="start" font-size="11.5" fill="#a04a46" filter="url(#sk)">只能全价买入</text>
</svg>
