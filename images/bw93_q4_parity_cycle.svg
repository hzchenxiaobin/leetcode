<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：b = 5 为奇数，槽位 0 免费复用</text>
  <text x="260" y="46" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums1 = nums2 = [1,2,3,4,5]，坏下标 {0,1,2,3,4}</text>

  <!-- 下标格子 -->
  <rect x="50" y="66" width="80" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="90" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下标 0</text>
  <text x="90" y="100" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 1</text>

  <rect x="150" y="66" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下标 1</text>
  <text x="190" y="100" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 2</text>

  <rect x="250" y="66" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下标 2</text>
  <text x="290" y="100" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 3</text>

  <rect x="350" y="66" width="80" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下标 3</text>
  <text x="390" y="100" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 4</text>

  <rect x="450" y="66" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下标 4</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 5</text>

  <!-- 三循环 (0,3,4)：两次交换，槽 0 出现两次 -->
  <path d="M90,116 Q230,190 386,112" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <path d="M394,112 Q482,180 94,118" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)" marker-end="url(#arrG)"/>

  <rect x="120" y="150" width="150" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">交换① (0,3)：代价 0+3</text>
  <rect x="290" y="196" width="160" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">交换② (0,4)：代价 0+4</text>

  <text x="66" y="216" font-size="12" fill="#d6a040" filter="url(#rough2)">0 号槽用了两次，</text>
  <text x="66" y="232" font-size="12" fill="#d6a040" filter="url(#rough2)">第二次免费！</text>

  <!-- 剩余配对 (1,2) -->
  <path d="M190,116 Q240,150 286,116" fill="none" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="238" y="146" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">交换③ (1,2)：代价 1+2</text>

  <!-- 结果 -->
  <rect x="50" y="258" width="440" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">三循环后：0 得 5、3 得 1、4 得 2，再配上 (1,2) 互换</text>
  <text x="270" y="296" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">总代价 = 3 + 4 + 3 = 10 = 0+1+2+3+4</text>

  <!-- 说明 -->
  <rect x="50" y="316" width="440" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="337" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">奇数个坏下标无需额外付费：额外槽位永远是下标 0</text>
</svg>
