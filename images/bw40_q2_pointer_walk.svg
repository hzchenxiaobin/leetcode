<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">指针走位：一个游标两次步行，先停 a−1 再多走 (b+1)−(a−1) 步到 b+1</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">示例 2：list1 = 0→1→2→3→4→5→6，a = 2，b = 5，list2 = 1000000→…→1000004</text>

  <!-- chain -->
  <g filter="url(#r)">
    <rect x="50" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="230" y="100" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="320" y="100" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="410" y="100" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="500" y="100" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="590" y="100" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="590" y="180" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="78" y="129" fill="#33517a">0</text>
    <text x="168" y="129" fill="#33517a">1</text>
    <text x="258" y="129" fill="#a67c1e">2</text>
    <text x="348" y="129" fill="#b85450">3</text>
    <text x="438" y="129" fill="#b85450">4</text>
    <text x="528" y="129" fill="#b85450">5</text>
    <text x="618" y="129" fill="#b85450">6</text>
    <text x="618" y="209" fill="#3a5c2c">6</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#999" filter="url(#r)">
    <text x="78" y="156">下标 0</text>
    <text x="168" y="156">下标 1</text>
    <text x="258" y="156">下标 2</text>
    <text x="348" y="156">下标 3</text>
    <text x="438" y="156">下标 4</text>
    <text x="528" y="156">下标 5</text>
    <text x="618" y="156">下标 6</text>
  </g>
  <path d="M 108 123 L 136 123" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 198 123 L 226 123" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- walk 1 -->
  <path d="M 100 176 Q 170 90 250 94" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="150" y="86" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#r)">走 a−1 = 1 步 → before</text>

  <!-- walk 2 -->
  <path d="M 268 176 Q 400 70 606 96" stroke="#4a7a3a" stroke-width="2.2" fill="none" stroke-dasharray="7,5" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="420" y="76" font-size="12.5" font-weight="bold" fill="#3a5c2c" filter="url(#r)">再走 (b+1)−(a−1) = 4 步 → after（下标 6）</text>

  <!-- result note -->
  <g filter="url(#r)">
    <rect x="50" y="262" width="580" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="286" text-anchor="middle" font-size="13.5" fill="#3a5c2c" filter="url(#r)">结果：0 → 1 → [list2 的 5 个节点] → 6；返回头指针 list1 不变</text>
  <text x="340" y="308" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">约束 1 ≤ a ≤ b &lt; n−1 保证 before 与 after 都存在，无需判空</text>
</svg>
