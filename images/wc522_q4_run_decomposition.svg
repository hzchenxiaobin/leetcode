<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="445" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">好字符串的递归结构：切分只发生在游程边界</text>

  <!-- 例 1: aaab -->
  <text x="40" y="76" font-size="13" fill="#4a7a3a" filter="url(#rough2)">aaab：</text>
  <rect x="95" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="127" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="159" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="191" y="58" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <path d="M 96 94 L 190 94 L 182 100 M 96 94 L 104 100" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="143" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">游程长 3（奇 ✓）</text>
  <path d="M 192 94 L 222 94 L 214 100 M 192 94 L 200 100" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="112" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1（奇 ✓）</text>
  <text x="330" y="76" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是好串 ✓</text>

  <!-- 例 2: aabb -->
  <text x="40" y="148" font-size="13" fill="#b85450" filter="url(#rough2)">aabb：</text>
  <rect x="95" y="130" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="127" y="130" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="159" y="130" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="191" y="130" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <path d="M 96 166 L 158 166 L 150 172 M 96 166 L 104 172" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="127" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2（偶 ✗）</text>
  <path d="M 160 166 L 222 166 L 214 172 M 160 166 L 168 172" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="225" y="184" font-size="11" fill="#b85450" filter="url(#rough2)">2（偶 ✗）</text>
  <text x="330" y="148" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">不是好串 ✗</text>

  <!-- 递归树 -->
  <text x="260" y="212" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">递归展开：abab = ab + ab = (a + b) + (a + b)</text>

  <rect x="213" y="228" width="94" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">abab</text>
  <text x="365" y="242" font-size="11" fill="#446688" filter="url(#rough2)">拆分点 b|a</text>
  <text x="365" y="257" font-size="11" fill="#446688" filter="url(#rough2)">字符不同 ✓</text>

  <path d="M 240 258 L 165 288" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 258 L 355 288" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="290" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="309" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ab</text>
  <rect x="360" y="290" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="309" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ab</text>

  <path d="M 115 318 L 90 338" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 145 318 L 170 338" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 375 318 L 350 338" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 405 318 L 430 338" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="66" y="340" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="88" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="150" y="340" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="326" y="340" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="348" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="410" y="340" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="432" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <text x="260" y="383" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个叶子：单一字符、长度为奇数的最小好串</text>

  <rect x="70" y="392" width="380" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="411" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">s 是好字符串 ⟺ s 的每个游程长度都是奇数</text>
  <text x="260" y="428" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">（拆到不能再拆，叶子恰是各个游程：全奇 ⟺ 全部叶子合法）</text>
</svg>
