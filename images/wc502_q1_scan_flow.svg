<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">单趟扫描流程：遇到违规立即短路</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="170" y="54" width="140" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开始</text>
  <path d="M 240 90 L 240 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i = 1 -->
  <g filter="url(#sk)"><rect x="170" y="116" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="139" text-anchor="middle" font-size="13" fill="#2b6e9e">i = 1（0-indexed）</text>
  <path d="M 240 152 L 240 184" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1 -->
  <g filter="url(#sk)"><polygon points="240,188 375,222 240,256 105,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="240" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">|s[i]−s[i−1]| ≤ 2 ?</text>

  <!-- no -> return false -->
  <path d="M 375 222 L 462 222" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="214" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="466" y="202" width="148" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="540" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">return false ✗</text>

  <!-- yes -> decision 2 -->
  <path d="M 240 256 L 240 292" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="248" y="278" font-size="11" fill="#2e6e2e" font-weight="bold">是（这对合法）</text>

  <!-- decision 2 -->
  <g filter="url(#sk)"><polygon points="240,296 340,330 240,364 140,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="240" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i &lt; n ?</text>

  <!-- yes -> loop back -->
  <path d="M 140 330 L 62 330 L 62 222 L 99 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="70" y="284" font-size="11" fill="#2e6e2e" font-weight="bold">是：i++，检查下一对</text>

  <!-- no -> return true -->
  <path d="M 240 364 L 240 398" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="248" y="386" font-size="11" fill="#2e6e2e" font-weight="bold">否（全部检查完）</text>
  <g filter="url(#sk)"><rect x="160" y="402" width="160" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="240" y="429" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return true ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="458" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="480" text-anchor="middle" font-size="11" fill="#7a5415">短路返回不改变结果：一旦发现违规对，答案已确定为 false，后续对不再影响结论</text>
</svg>
