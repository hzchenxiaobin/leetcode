<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两条规则：缺勤次数 + 连续迟到</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个条件必须同时满足，任一被破坏就返回 false</text>

  <rect x="34" y="70" width="240" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="94" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">规则 ①：缺勤要「少」</text>
  <text x="50" y="118" font-size="11" fill="#555" filter="url(#rough2)">'A' 的总数严格少于 2</text>
  <text x="50" y="140" font-size="11" fill="#555" filter="url(#rough2)">等价于 cntA ≤ 1</text>
  <text x="50" y="162" font-size="10" fill="#888" filter="url(#rough2)">出现第 2 个 A 就可以直接判负</text>

  <rect x="286" y="70" width="240" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="302" y="94" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">规则 ②：迟到不能「连着」</text>
  <text x="302" y="118" font-size="11" fill="#555" filter="url(#rough2)">不存在连续 3 天及以上迟到</text>
  <text x="302" y="140" font-size="11" fill="#555" filter="url(#rough2)">等价于 curL ≥ 3 时判负</text>
  <text x="302" y="162" font-size="10" fill="#888" filter="url(#rough2)">即字符串中不出现 "LLL"</text>

  <path d="M 154 176 L 154 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 406 176 L 406 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="210" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两条件同时成立 → 返回 true</text>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">（AND 关系，不是 OR）</text>

  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">易错点：只统计 A 却忘了把连续 L 计数清零，或把「至少 2 个 A」当成违规</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">一句话判据：cntA &lt; 2 且 全程 curL &lt; 3</text>
</svg>
