<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：nums = [4,2,5,6,7]，k = 2</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">分割点 i 必须满足 i ≥ k 且 n − i ≥ k，即 i ∈ [2, 3]</text>

  <rect x="60" y="64" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66">分割点 i</text>
  <rect x="130" y="64" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="195" y="84" text-anchor="middle" font-size="10.5" fill="#3a5a30">pre[i][2]</text>
  <rect x="270" y="64" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="335" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66">suf[i][2]</text>
  <rect x="410" y="64" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="465" y="84" text-anchor="middle" font-size="10.5" fill="#8a6a20">最大 XOR</text>

  <rect x="60" y="100" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="120" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="130" y="100" width="130" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="120" text-anchor="middle" font-size="11" fill="#666">{ 6 }</text>
  <rect x="270" y="100" width="130" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="120" text-anchor="middle" font-size="11" fill="#666">{ 7 }</text>
  <rect x="410" y="100" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="120" text-anchor="middle" font-size="11" fill="#666">6 ⊕ 7 = 1</text>

  <rect x="60" y="136" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="130" y="136" width="130" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="156" text-anchor="middle" font-size="11" fill="#666">{ 5, 6, 7 }</text>
  <rect x="270" y="136" width="130" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="156" text-anchor="middle" font-size="11" fill="#666">{ 7 }</text>
  <rect x="410" y="136" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="156" text-anchor="middle" font-size="11" fill="#3a5a30">5 ⊕ 7 = 2 ✓</text>

  <text x="60" y="188" font-size="10" fill="#999">↓ pre 表的递推过程（k = 2 的那一列）</text>

  <rect x="60" y="200" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="218" text-anchor="middle" font-size="9.5" fill="#3a5a30">i=2</text>
  <text x="100" y="218" font-size="10" fill="#555">{4,2} → OR = 6</text>
  <rect x="60" y="232" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="250" text-anchor="middle" font-size="9.5" fill="#3a5a30">i=3</text>
  <text x="100" y="250" font-size="10" fill="#555">{4,5}→5，{2,5}→7，保留 6 ⟹ {5,6,7}</text>
  <rect x="60" y="264" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="282" text-anchor="middle" font-size="9.5" fill="#3a5a30">i=4</text>
  <text x="100" y="282" font-size="10" fill="#555">加入 6 后 OR 仍是 {5,6,7}，集合饱和</text>

  <rect x="300" y="200" width="230" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="220" text-anchor="middle" font-size="10" fill="#3a4a66">suf[i][2] 从右往左算：</text>
  <text x="415" y="238" text-anchor="middle" font-size="10" fill="#3a4a66">i=3 时是 {6,7} 选 2 个 → {7}</text>
  <text x="415" y="254" text-anchor="middle" font-size="10" fill="#3a4a66">i=2 时是 {5,6,7} 选 2 个 → {7}</text>

  <rect x="40" y="306" width="490" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="330" text-anchor="middle" font-size="11" fill="#8a6a20">最大值为 2（取子序列 [4,5,6,7]：(4|5) ⊕ (6|7) = 5 ⊕ 7 = 2）</text>
</svg>
