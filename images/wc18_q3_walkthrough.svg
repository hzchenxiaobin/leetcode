<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：k = 2, w = 0, profits = [1,2,3], capital = [0,1,1]</text>
  <text x="300" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮先按当前 w 解锁项目入堆，再弹出堆顶（利润最大者）</text>

  <rect x="30" y="58" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="68" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">阶段</text>

  <rect x="110" y="58" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="210" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">本轮新解锁（capital ≤ w）</text>

  <rect x="314" y="58" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="369" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">堆（大顶堆）</text>

  <rect x="428" y="58" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="463" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">弹出</text>

  <rect x="502" y="58" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="537" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">w 变为</text>

  <rect x="30" y="94" width="76" height="52" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="68" y="126" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>

  <rect x="110" y="94" width="200" height="52" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="122" y="118" font-size="9.8" fill="#555" filter="url(#rough2)">项目 0（cap 0, profit 1）</text>
  <text x="122" y="134" font-size="9.5" fill="#999" filter="url(#rough2)">capital=1 的两个项目还进不来</text>

  <rect x="314" y="94" width="110" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="369" y="126" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">[1]</text>

  <rect x="428" y="94" width="70" height="52" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="463" y="126" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="502" y="94" width="70" height="52" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="537" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>

  <rect x="30" y="150" width="76" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="68" y="182" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">第 1 轮</text>

  <rect x="110" y="150" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="122" y="182" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">无（cap ≤ 0 的只剩项目 0）</text>

  <rect x="314" y="150" width="110" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="369" y="182" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">[1]</text>

  <rect x="428" y="150" width="70" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="463" y="182" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="502" y="150" width="70" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="537" y="182" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>

  <rect x="30" y="206" width="76" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="68" y="238" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">第 2 轮</text>

  <rect x="110" y="206" width="200" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="122" y="230" font-size="9.8" fill="#8a3a36" filter="url(#rough2)">项目 1（profit 3）、项目 2（profit 2）</text>
  <text x="122" y="246" font-size="9.5" fill="#999" filter="url(#rough2)">两者 capital 都是 1 ≤ w = 1</text>

  <rect x="314" y="206" width="110" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="369" y="238" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">[3,2]</text>

  <rect x="428" y="206" width="70" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="463" y="238" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="502" y="206" width="70" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="537" y="238" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">4</text>

  <text x="30" y="284" font-size="10.5" fill="#555" filter="url(#rough2)">资本轨迹（w 只增不减）：</text>

  <rect x="180" y="296" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="215" y="321" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">w = 0</text>

  <path d="M 252 316 L 320 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="308" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="324" y="296" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="359" y="321" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">w = 1</text>

  <path d="M 396 316 L 464 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="308" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">+3</text>

  <rect x="468" y="296" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="503" y="321" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">w = 4</text>

  <text x="300" y="366" text-anchor="middle" font-size="9.8" fill="#555" filter="url(#rough2)">若第 2 轮按编号取了 profit 2 的项目，终值只有 3 —— 贪心关键就在「挑利润最大」</text>
  <text x="300" y="390" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">k = 2 已用尽 → 最终资本 = 0 + 1 + 3 = 4 ✔</text>
</svg>
