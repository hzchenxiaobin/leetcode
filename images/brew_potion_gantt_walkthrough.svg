<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：skill = [1,5,2,4]，mana = [5,1,4，2] —— 逐个药水尽早开工</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 时间轴 -->
  <g font-size="10.5" fill="#999" text-anchor="middle">
    <text x="70" y="92">0</text><text x="150" y="92">20</text><text x="230" y="92">40</text>
    <text x="310" y="92">60</text><text x="390" y="92">80</text><text x="470" y="92">100</text>
  </g>
  <path d="M 70 96 L 70 262 M 150 96 L 150 262 M 230 96 L 230 262 M 310 96 L 310 262 M 390 96 L 390 262 M 470 96 L 470 262" stroke="#e3e3e3" stroke-width="1" filter="url(#sk)"/>

  <!-- 行标签 -->
  <g font-size="11.5" fill="#2b4a6b" text-anchor="end" font-weight="bold">
    <text x="62" y="118">巫师0 (1)</text><text x="62" y="162">巫师1 (5)</text>
    <text x="62" y="206">巫师2 (2)</text><text x="62" y="250">巫师3 (4)</text>
  </g>

  <!-- 药水0 蓝 -->
  <g filter="url(#sk)">
    <g stroke="#446688" stroke-width="1.5" fill="#e8f0fe">
      <rect x="70" y="102" width="20" height="24" rx="3"/>
      <rect x="90" y="146" width="100" height="24" rx="3"/>
      <rect x="190" y="190" width="40" height="24" rx="3"/>
      <rect x="230" y="234" width="80" height="24" rx="3"/>
    </g>
  </g>
  <!-- 药水1 绿 -->
  <g filter="url(#sk)">
    <g stroke="#4a7a3a" stroke-width="1.5" fill="#e6f4ea">
      <rect x="278" y="102" width="4" height="24" rx="2"/>
      <rect x="282" y="146" width="20" height="24" rx="3"/>
      <rect x="302" y="190" width="8" height="24" rx="2"/>
      <rect x="310" y="234" width="16" height="24" rx="3"/>
    </g>
  </g>
  <!-- 药水2 橙 -->
  <g filter="url(#sk)">
    <g stroke="#d6a040" stroke-width="1.5" fill="#fff8e1">
      <rect x="286" y="102" width="16" height="24" rx="3"/>
      <rect x="302" y="146" width="80" height="24" rx="3"/>
      <rect x="382" y="190" width="32" height="24" rx="3"/>
      <rect x="414" y="234" width="64" height="24" rx="3"/>
    </g>
  </g>
  <!-- 药水3 粉 -->
  <g filter="url(#sk)">
    <g stroke="#b85450" stroke-width="1.5" fill="#fce4ec">
      <rect x="414" y="102" width="8" height="24" rx="2"/>
      <rect x="422" y="146" width="40" height="24" rx="3"/>
      <rect x="462" y="190" width="16" height="24" rx="3"/>
      <rect x="478" y="234" width="32" height="24" rx="3"/>
    </g>
  </g>

  <!-- 块内药水编号 -->
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <text x="140" y="119" fill="#2b4a6b">0</text>
    <text x="318" y="251" fill="#2e5e2e">1</text>
    <text x="342" y="163" fill="#a67c2e">2</text>
    <text x="442" y="163" fill="#93392f">3</text>
  </g>

  <!-- T1 = 52 推导 -->
  <path d="M 278 96 L 278 262" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="278" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">T₁ = 52</text>
  <path d="M 310 246 L 288 246" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="300" y="230" text-anchor="middle" font-size="10.5" fill="#b85450">60 − 8 = 52</text>
  <text x="510" y="251" font-size="10.5" fill="#888">巫师3 忙完药水0 是 60</text>
  <text x="510" y="265" font-size="10.5" fill="#888">药水1 需 8 拍后到达</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <g stroke-width="1.4">
      <rect x="88" y="278" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688"/>
      <rect x="196" y="278" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="304" y="278" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040"/>
      <rect x="412" y="278" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450"/>
    </g>
  </g>
  <g font-size="11" fill="#555">
    <text x="108" y="289">药水0 (mana=5)</text><text x="216" y="289">药水1 (mana=1)</text>
    <text x="324" y="289">药水2 (mana=4)</text><text x="432" y="289">药水3 (mana=2)</text>
  </g>

  <!-- 递推演算 -->
  <g font-size="11.5" fill="#444">
    <text x="70" y="322">T₀ = 0，药水 0 直通流水线，60 拍完成</text>
    <text x="70" y="344">Δ₁ = max(5, 29, 34, 52) = 52 → T₁ = 52   （巫师3 拖后腿）</text>
    <text x="70" y="366">Δ₂ = max(1, 2, −16, −20) = 2 → T₂ = 54   （巫师1 拖后腿）</text>
    <text x="70" y="388">Δ₃ = max(4, 22, 20, 32) = 32 → T₃ = 86   （巫师3 拖后腿）</text>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="402" width="360" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="250" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">总时间 = T₃ + P[4]·mana₃ = 86 + 12×2 = 110</text>
  <text x="470" y="420" font-size="10.5" fill="#888">压着最晚腾手的巫师开工</text>
</svg>
