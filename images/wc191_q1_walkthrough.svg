<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 5, 4, 5]，两个 5 都要用上</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一步都保持不变式 mx1 ≥ mx2，且两者来自不同下标</text>

  <rect x="30" y="70" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="90" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="135" y="90" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">x</text>
  <text x="265" y="90" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">判断与动作</text>
  <text x="400" y="90" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">mx1</text>
  <text x="485" y="90" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">mx2</text>

  <rect x="30" y="100" width="500" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="121" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="135" y="121" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="180" y="121" font-size="9.8" fill="#555" filter="url(#rough2)">x ≥ mx1（−1）：降级</text>
  <text x="400" y="121" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="485" y="121" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">−1</text>

  <rect x="30" y="132" width="500" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="153" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="135" y="153" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="180" y="153" font-size="9.8" fill="#555" filter="url(#rough2)">x ≥ mx1（1）：降级</text>
  <text x="400" y="153" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="485" y="153" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="30" y="164" width="500" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="185" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="135" y="185" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="180" y="185" font-size="9.8" fill="#555" filter="url(#rough2)">x &gt; mx2（1）：更新次大</text>
  <text x="400" y="185" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="485" y="185" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4</text>

  <rect x="30" y="196" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="217" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="135" y="217" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="180" y="217" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">x ≥ mx1（5）：降级，mx2 = 旧 mx1 = 5</text>
  <text x="400" y="217" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="485" y="217" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">5</text>

  <path d="M 280 228 L 280 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="246" width="360" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">mx1 = 5，mx2 = 5（两个不同下标）</text>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">(5 − 1) × (5 − 1) = 16</text>

  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">关键：判断写成「x ≥ mx1」，并列的最大值也会走「降级」</text>
  <text x="280" y="338" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">换成「x &gt; mx1」配合 else-if 同样正确，但「≥」让降级语义覆盖并列情形</text>
</svg>
