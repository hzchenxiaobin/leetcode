<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">六条转移：平移只看新占的格子</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">旋转会「扫过」一个对角格，所以要求两格同时为空</text>

  <g font-size="10" fill="#777" filter="url(#rough2)">
    <text x="85" y="76" text-anchor="middle">朝向</text>
    <text x="206" y="76" text-anchor="middle">动作</text>
    <text x="322" y="76" text-anchor="middle">新状态 (r, c, o)</text>
    <text x="392" y="76">前置条件（需全部满足）</text>
  </g>

  <!-- 六行 -->
  <g filter="url(#rough2)">
    <rect x="20" y="88" width="600" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <rect x="20" y="134" width="600" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <rect x="20" y="180" width="600" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <rect x="20" y="226" width="600" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <rect x="20" y="272" width="600" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <rect x="20" y="318" width="600" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
  </g>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="85" y="114" text-anchor="middle">水平 o=0</text>
    <text x="206" y="114" text-anchor="middle" font-size="11" font-weight="bold">右移 →</text>
    <text x="322" y="114" text-anchor="middle">(r,c+1) 水平</text>
    <text x="392" y="114">c+2 &lt; n 且 grid[r][c+2] = 0</text>

    <text x="85" y="160" text-anchor="middle">水平 o=0</text>
    <text x="206" y="160" text-anchor="middle" font-size="11" font-weight="bold">下移 ↓</text>
    <text x="322" y="160" text-anchor="middle">(r+1,c) 水平</text>
    <text x="392" y="160">r+1 &lt; n 且下方两格为空</text>

    <text x="85" y="206" text-anchor="middle" fill="#8a3a36">水平 o=0</text>
    <text x="206" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">顺时针旋转</text>
    <text x="322" y="206" text-anchor="middle" fill="#8a3a36">(r,c) 竖直</text>
    <text x="392" y="206" fill="#8a3a36">r+1 &lt; n 且下方两格为空</text>

    <text x="85" y="252" text-anchor="middle">竖直 o=1</text>
    <text x="206" y="252" text-anchor="middle" font-size="11" font-weight="bold">右移 →</text>
    <text x="322" y="252" text-anchor="middle">(r,c+1) 竖直</text>
    <text x="392" y="252">c+1 &lt; n 且右侧两格为空</text>

    <text x="85" y="298" text-anchor="middle">竖直 o=1</text>
    <text x="206" y="298" text-anchor="middle" font-size="11" font-weight="bold">下移 ↓</text>
    <text x="322" y="298" text-anchor="middle">(r+1,c) 竖直</text>
    <text x="392" y="298">r+2 &lt; n 且 grid[r+2][c] = 0</text>

    <text x="85" y="344" text-anchor="middle" fill="#8a3a36">竖直 o=1</text>
    <text x="206" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">逆时针旋转</text>
    <text x="322" y="344" text-anchor="middle" fill="#8a3a36">(r,c) 水平</text>
    <text x="392" y="344" fill="#8a3a36">c+1 &lt; n 且右侧两格为空</text>
  </g>

  <rect x="20" y="374" width="600" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="392" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">「下方两格」= (r+1,c)、(r+1,c+1)；「右侧两格」= (r,c+1)、(r+1,c+1)。</text>
  <text x="34" y="408" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">旋转后蛇仍贴着同一个 (r,c)，但这一步同样只算 1 次移动；蛇尾让出的格子不必为空。</text>
</svg>
