<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 的图与最优序列 [0,1,2,3]（总分 24）</text>

  <!-- 图节点：0(5) 1(2) 2(9) 3(8) 4(4) -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="150" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="300" cy="90"  r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="420" cy="180" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="300" cy="250" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <circle cx="170" cy="290" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <!-- 边：(0,1) (1,2) (2,3) (0,2) (1,3) (2,4) -->
  <g filter="url(#rough2)">
    <path d="M 168 133 L 282 100" stroke="#bbb" stroke-width="1.5"/>
    <path d="M 320 108 L 402 164" stroke="#446688" stroke-width="3"/>
    <path d="M 400 199 L 324 240" stroke="#446688" stroke-width="3"/>
    <path d="M 172 164 C 260 200, 330 170, 398 181" stroke="#bbb" stroke-width="1.5"/>
    <path d="M 284 111 C 320 150, 330 190, 312 228" stroke="#bbb" stroke-width="1.5"/>
    <path d="M 434 190 C 360 230, 260 270, 192 286" stroke="#bbb" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="150" y="155">0</text><text x="300" y="95">1</text><text x="420" y="185">2</text>
    <text x="300" y="255">3</text><text x="170" y="295">4</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="150" y="192">score 5</text><text x="300" y="58">score 2</text><text x="420" y="152">score 9</text>
    <text x="300" y="292">score 8</text><text x="170" y="332">score 4</text>
  </g>

  <!-- 中间边高亮 -->
  <rect x="330" y="120" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="141" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">最优解的中间边是 (1,2)</text>
  <text x="430" y="160" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">x=0（top 邻居）、y=3</text>

  <!-- 序列条 -->
  <g filter="url(#rough2)">
    <rect x="90" y="352" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="186" y="352" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="282" y="352" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="378" y="352" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="135" y="373">节点 0 · 5</text><text x="231" y="373">节点 1 · 2</text>
    <text x="327" y="373">节点 2 · 9</text><text x="423" y="373">节点 3 · 8</text>
  </g>
  <text x="80" y="373" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">序列</text>
  <text x="280" y="344" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">总分 = 5 + 2 + 9 + 8 = 24 ✓</text>
</svg>
