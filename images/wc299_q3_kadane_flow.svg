<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟循环，双 Kadane 同跑，两个候选取大</text>
  <path d="M 130 34 Q 330 42 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧流程 -->
  <g filter="url(#sk)"><rect x="130" y="48" width="120" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="190" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">输入 nums1, nums2</text>
  <path d="M 190 74 L 190 86" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="110" y="86" width="160" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="190" y="103" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2b2b2b">sum1 = Σnums1; sum2 = Σnums2</text>
  <path d="M 190 112 L 190 124" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="82" y="124" width="216" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="190" y="141" text-anchor="middle" font-size="11" font-family="monospace" fill="#2b2b2b">curMax = maxS = curMin = minS = 0</text>
  <path d="M 190 150 L 190 158" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="190,162 258,192 190,222 122,192" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="190" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">i &lt; n ?</text>

  <text x="266" y="186" font-size="11" font-weight="bold" fill="#2e5e2e">是</text>
  <path d="M 258 192 L 268 192" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="272" y="154" width="156" height="90" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="350" y="172" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b2b2b">d = nums2[i] − nums1[i]</text>
  <text x="350" y="187" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b6e9e">curMax = max(d, curMax+d)</text>
  <text x="350" y="202" text-anchor="middle" font-size="10" font-family="monospace" fill="#2b6e9e">maxS = max(maxS, curMax)</text>
  <text x="350" y="217" text-anchor="middle" font-size="10" font-family="monospace" fill="#a04a48">curMin = min(d, curMin+d)</text>
  <text x="350" y="232" text-anchor="middle" font-size="10" font-family="monospace" fill="#a04a48">minS = min(minS, curMin)</text>
  <text x="350" y="243" text-anchor="middle" font-size="10" font-family="monospace" fill="#555">i++</text>
  <path d="M 350 154 L 350 142 L 190 142 L 190 158" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="200" y="236" font-size="11" font-weight="bold" fill="#a04a48">否</text>
  <path d="M 190 222 L 190 238" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="90" y="238" width="200" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="190" y="255" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2b2b2b">ans = max(sum1+maxS, sum2−minS)</text>
  <path d="M 190 264 L 190 274" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="150" y="274" width="80" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="190" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">返回 ans</text>

  <!-- 右侧要点 -->
  <g filter="url(#sk)"><rect x="456" y="56" width="184" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="548" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">两个 Kadane 完全独立</text>
  <text x="548" y="94" text-anchor="middle" font-size="10.5" fill="#555">max 系与 min 系互不影响，</text>
  <text x="548" y="108" text-anchor="middle" font-size="10.5" fill="#555">塞进同一趟循环各跑各的；</text>
  <text x="548" y="122" text-anchor="middle" font-size="10.5" fill="#555">d 即时计算，不必建 diff 数组</text>

  <g filter="url(#sk)"><rect x="456" y="148" width="184" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="548" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">负前缀果断丢弃</text>
  <text x="548" y="186" text-anchor="middle" font-size="10.5" fill="#555">curMax 一旦为负，带上它只会</text>
  <text x="548" y="200" text-anchor="middle" font-size="10.5" fill="#555">拖累后面的段：</text>
  <text x="548" y="214" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">max(d, curMax+d) 自动重启</text>

  <g filter="url(#sk)"><rect x="456" y="240" width="184" height="78" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="548" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">初值 0 = 允许不交换</text>
  <text x="548" y="278" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">maxS ≥ 0 ≥ minS</text>
  <text x="548" y="294" text-anchor="middle" font-size="10.5" fill="#555">自动覆盖 S = 0 基线：</text>
  <text x="548" y="308" text-anchor="middle" font-size="10.5" fill="#555">diff 全负（示例 3）时 maxS 停在 0</text>

  <g filter="url(#sk)"><rect x="456" y="332" width="184" height="60" rx="8" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1.3"/></g>
  <text x="548" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" font-family="monospace">时间 O(n) · 空间 O(1)</text>
  <text x="548" y="374" text-anchor="middle" font-size="10.5" fill="#888">n = 10⁵ 一趟扫描轻松通过</text>

  <g filter="url(#sk)"><rect x="48" y="412" width="570" height="36" rx="8" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1.2"/></g>
  <text x="333" y="435" text-anchor="middle" font-size="11.5" fill="#555">关键归约：一次交换 → 差值数组的子数组和；外层 max 可拆 → 两个独立的 Kadane，一趟同跑</text>
</svg>
