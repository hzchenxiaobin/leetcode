<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold"
        filter="url(#rough2)">示例演算：[1,2,3,4,5,6,null,null,null,7,8,9,10] → 输出 9 个节点</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">圆圈内是节点值，右上角标 ①–⑨ 是它在答案中的位置</text>

  <!-- 边 -->
  <path d="M 310 82 L 175 150" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 310 82 L 455 150" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 175 150 L 92 218" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 175 150 L 245 218" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 455 150 L 390 218" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 92 218 L 56 286" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 92 218 L 142 286" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 390 218 L 352 286" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 390 218 L 432 286" stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="310" cy="82" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1</text>

  <circle cx="175" cy="150" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="156" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>

  <circle cx="455" cy="150" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="156" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">3</text>

  <circle cx="92" cy="218" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="224" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">4</text>

  <circle cx="245" cy="218" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="224" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">5</text>

  <circle cx="390" cy="218" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="224" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">6</text>

  <circle cx="56" cy="286" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="292" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">7</text>

  <circle cx="142" cy="286" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="292" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">8</text>

  <circle cx="352" cy="286" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="352" y="292" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">9</text>

  <circle cx="432" cy="286" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="292" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">10</text>

  <!-- 顺序角标 -->
  <circle cx="336" cy="68" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="336" y="72" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">①</text>
  <circle cx="201" cy="136" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="201" y="140" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">②</text>
  <circle cx="118" cy="204" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="118" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">③</text>
  <circle cx="82" cy="272" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="276" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">④</text>
  <circle cx="168" cy="272" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="276" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑤</text>
  <circle cx="378" cy="272" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="276" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑥</text>
  <circle cx="458" cy="272" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="276" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑦</text>
  <circle cx="416" cy="204" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑧</text>
  <circle cx="481" cy="136" r="10" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="481" y="140" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑨</text>

  <!-- 走查表 -->
  <text x="34" y="334" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">左边界（绿）：1 → 2；走到 4 时发现 4 是叶子，于是不入左边界（叶子留给下一段）</text>
  <text x="34" y="356" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">叶子（橙）：先左后右 DFS → 4, 7, 8, 9, 10（自然就是自左向右）</text>
  <text x="34" y="378" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">右边界（红）：1 → 3 → 6 → 10；压栈后逆序 → 10, 6, 3，去掉叶子 10 只剩 6, 3</text>
  <text x="34" y="400" font-size="10.5" fill="#555" filter="url(#rough2)">拼接：1 ｜ 2 ｜ 4 7 8 9 10 ｜ 6 3（四段首尾相接，无需去重表）</text>

  <path d="M 320 410 L 320 424" stroke="#666" stroke-width="1.3" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="430" width="520" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="452" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">输出 [1, 2, 4, 7, 8, 9, 10, 6, 3]</text>
  <text x="320" y="468" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">9 个节点各出现一次：10 已在叶子段出现，故右边界段不再重复</text>
</svg>
