<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">I 版算法：枚举行三元组，每行试 3 个候选</text>

  <rect x="140" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">每行取前 3 大，得到候选表 top[行]</text>

  <path d="M 270 86 L 270 106" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="108" width="300" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">枚举三个互不相同的行 a &lt; b &lt; c</text>
  <text x="270" y="147" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">共 C(m, 3) 组，m ≤ 100 时约 1.6 × 10^5</text>

  <path d="M 270 154 L 270 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="176" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">对每组行三元组，枚举 3 × 3 × 3 = 27 种取法</text>
  <text x="270" y="215" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">筛掉列号重复的组合，只保留三个列号两两不同者</text>

  <path d="M 270 224 L 270 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="246" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">对每组行三元组记录价值之和的最大值</text>
  <text x="270" y="283" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">最后对所有行三元组取最大，即为答案</text>

  <rect x="52" y="308" width="436" height="46" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="66" y="330" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">代价</text>
  <text x="66" y="346" font-size="10.5" fill="#555" filter="url(#rough2)">预处理 O(m n log n)，枚举 C(m,3) × 27 ≤ 4.4 × 10^6 次比较，轻松过</text>

  <rect x="52" y="364" width="436" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="66" y="390" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">II 版 m ≤ 500：C(500,3) × 27 ≈ 5.6 × 10^8，必须换算法</text>
</svg>
