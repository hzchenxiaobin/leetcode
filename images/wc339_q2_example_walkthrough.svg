<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="332" fill="#fafafa"/>

  <text x="320" y="20" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,4,1,2,3,1]，一遍扫描逐元素投放</text>

  <!-- input strip: 7 cells w=52 h=32 y=38, x=132+52i -->
  <rect x="132" y="38" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="141" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">①</text>
  <text x="158" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="38" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">②</text>
  <text x="210" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="236" y="38" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">③</text>
  <text x="262" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="288" y="38" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">④</text>
  <text x="314" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="340" y="38" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">⑤</text>
  <text x="366" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="392" y="38" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="401" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">⑥</text>
  <text x="418" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="444" y="38" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="453" y="49" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">⑦</text>
  <text x="470" y="64" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- drop arrows -->
  <path d="M 158 74 L 158 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 74 L 210 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 262 74 L 262 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 314 74 L 314 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 366 74 L 366 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 418 74 L 418 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 74 L 470 202" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- row labels -->
  <text x="120" y="125" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">第0行</text>
  <text x="120" y="177" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">第1行</text>
  <text x="120" y="229" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">第2行</text>

  <!-- new-row annotations -->
  <text x="306" y="150" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">新开行!</text>
  <text x="462" y="202" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">新开行!</text>

  <!-- dashed placeholders (untouched slots) -->
  <g fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3">
    <rect x="288" y="104" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="392" y="104" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="444" y="104" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="132" y="156" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="184" y="156" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="236" y="156" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="340" y="156" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="444" y="156" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="132" y="208" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="184" y="208" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="236" y="208" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="288" y="208" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="340" y="208" width="52" height="34" rx="4" filter="url(#rough2)"/>
    <rect x="392" y="208" width="52" height="34" rx="4" filter="url(#rough2)"/>
  </g>

  <!-- filled cells: step → (row, value) -->
  <rect x="132" y="104" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="104" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="236" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="340" y="104" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="288" y="156" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="392" y="156" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="444" y="208" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="470" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- result -->
  <rect x="90" y="254" width="460" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="12.5" fill="#2d5a1f" filter="url(#rough2)">最终 ans = [[1,3,4,2],[1,3],[1]]：值 1 的三份副本分落三行，3 行 = maxFreq</text>

  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">灰色虚线框 = 该步未触及的行位置；红色 = 值 1 的副本（永远互不同行）</text>
</svg>
