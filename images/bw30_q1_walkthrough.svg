<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    三个官方示例的逐段转换
  </text>

  <!-- 示例行模板 -->
  <g filter="url(#rough2)" font-size="14">
    <!-- 表头 -->
    <text x="90" y="70" text-anchor="middle" fill="#666">输入</text>
    <text x="210" y="70" text-anchor="middle" fill="#666">日</text>
    <text x="292" y="70" text-anchor="middle" fill="#666">月</text>
    <text x="394" y="70" text-anchor="middle" fill="#666">年</text>
    <text x="478" y="70" text-anchor="middle" fill="#666">输出</text>

    <!-- 行 1 -->
    <text x="90" y="106" text-anchor="middle" fill="#333">20th Oct 2052</text>
    <rect x="188" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="210" y="108" text-anchor="middle" fill="#446688">20</text>
    <rect x="270" y="90" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="292" y="108" text-anchor="middle" fill="#2f5a24">10</text>
    <text x="394" y="108" text-anchor="middle" fill="#8a6a1a">2052</text>
    <text x="478" y="108" text-anchor="middle" fill="#b85450">2052-10-20</text>

    <!-- 行 2（重点：补零） -->
    <text x="90" y="152" text-anchor="middle" fill="#333">6th Jun 1933</text>
    <rect x="188" y="136" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="210" y="154" text-anchor="middle" fill="#446688">06</text>
    <rect x="270" y="136" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="292" y="154" text-anchor="middle" fill="#2f5a24">06</text>
    <text x="394" y="154" text-anchor="middle" fill="#8a6a1a">1933</text>
    <text x="478" y="154" text-anchor="middle" fill="#b85450">1933-06-06</text>

    <!-- 行 3 -->
    <text x="90" y="198" text-anchor="middle" fill="#333">26th May 1960</text>
    <rect x="188" y="182" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="210" y="200" text-anchor="middle" fill="#446688">26</text>
    <rect x="270" y="182" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="292" y="200" text-anchor="middle" fill="#2f5a24">05</text>
    <text x="394" y="200" text-anchor="middle" fill="#8a6a1a">1960</text>
    <text x="478" y="200" text-anchor="middle" fill="#b85450">1960-05-26</text>
  </g>

  <!-- 补零高亮说明 -->
  <g filter="url(#rough2)">
    <path d="M 214 166 C 240 190, 268 192, 284 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <rect x="130" y="222" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">个位数字 → %02d 补前导零</text>

  <!-- 后缀规律说明 -->
  <rect x="60" y="280" width="400" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    st / nd / rd / th 一律两个字符
  </text>
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    day[:-2] 一刀切，无需理会 11th/12th/13th 的特例规则
  </text>
</svg>
