<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：首现座次 = 座位号，频次必须等于座次</text>
  <path d="M 110 36 Q 320 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <text x="152" y="76" text-anchor="end" font-size="13" fill="#666666">nums</text>
  <g filter="url(#sk)">
    <rect x="164" y="52" width="52" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="216" y="52" width="52" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="268" y="52" width="52" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="320" y="52" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="372" y="52" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="424" y="52" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="190" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="242" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="294" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="346" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">2</text>
  <text x="398" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">2</text>
  <text x="450" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">2</text>
  <text x="190" y="104" text-anchor="middle" font-size="10" fill="#999999">0</text>
  <text x="242" y="104" text-anchor="middle" font-size="10" fill="#999999">1</text>
  <text x="294" y="104" text-anchor="middle" font-size="10" fill="#999999">2</text>
  <text x="346" y="104" text-anchor="middle" font-size="10" fill="#999999">3</text>
  <text x="398" y="104" text-anchor="middle" font-size="10" fill="#999999">4</text>
  <text x="450" y="104" text-anchor="middle" font-size="10" fill="#999999">5</text>

  <!-- arrow to seat table -->
  <path d="M 96 104 Q 92 116 100 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="106" y="122" font-size="11" fill="#3a3a3a">按首现就座，颜色 = 首现分组</text>

  <!-- seat rows -->
  <g filter="url(#sk)">
    <rect x="70" y="130" width="440" height="30" rx="6" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="70" y="166" width="440" height="30" rx="6" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="70" y="202" width="440" height="30" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="78" y="135" width="34" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="78" y="171" width="34" height="20" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="78" y="207" width="34" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="95" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="95" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="95" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">2</text>
  <text x="122" y="149" font-size="12" fill="#333333">座次 1 · 要求频次 1 · 实际 1</text>
  <text x="122" y="185" font-size="12" fill="#333333">座次 2 · 要求频次 2 · 实际 2</text>
  <text x="122" y="221" font-size="12" fill="#333333">座次 3 · 要求频次 3 · 实际 3</text>
  <text x="440" y="149" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="440" y="185" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="440" y="221" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- good badge -->
  <g filter="url(#sk)">
    <rect x="524" y="152" width="104" height="58" rx="8" fill="#f5c6c0" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="576" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2e28">good = 3 = k</text>
  <text x="576" y="194" text-anchor="middle" font-size="11" fill="#8a2e28">全部对号 ⇒ 阶梯!</text>

  <!-- comparison boxes -->
  <g filter="url(#sk)">
    <rect x="30" y="260" width="290" height="152" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="175" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓ [5, 8, 8] 是阶梯</text>
  <text x="48" y="310" font-size="12" fill="#333333">首现次序：5 → 8</text>
  <text x="48" y="334" font-size="12" fill="#333333">5：频次 1 = 座次 1　✓</text>
  <text x="48" y="358" font-size="12" fill="#333333">8：频次 2 = 座次 2　✓</text>
  <text x="48" y="392" font-size="12" font-weight="bold" fill="#2e6e2e">频次序列 (1, 2)，逐位对号</text>

  <g filter="url(#sk)">
    <rect x="330" y="260" width="290" height="152" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="475" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2e28">✗ [7, 9, 7] 不是阶梯</text>
  <text x="348" y="310" font-size="12" fill="#333333">首现次序：7 → 9</text>
  <text x="348" y="334" font-size="12" fill="#333333">7：频次 2 ≠ 座次 1　✗</text>
  <text x="348" y="358" font-size="12" fill="#333333">9：频次 1 ≠ 座次 2　✗</text>
  <text x="348" y="392" font-size="12" font-weight="bold" fill="#8a2e28">多重集同为 {1,2}，座次错位</text>

  <text x="320" y="438" text-anchor="middle" font-size="12" fill="#7a7a7a">关键：判定要按首现次序逐位对齐，而不是频次多重集相等</text>
</svg>
