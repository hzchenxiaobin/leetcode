<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：枚举操作次数 k，增量维护各类型的窗口最小</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="64" width="300" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="250" y="84" text-anchor="middle" font-size="12" fill="#2e5e24" filter="url(#sk)">cost[t] ← nums[t]（k = 0：窗口只有自己）</text>
  <text x="250" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">ans ← Σ cost（「不操作」也是候选）</text>

  <path d="M 250 110 L 250 128" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="85" y="132" width="330" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">对 k = 1 … n−1 每一轮、每个 t = 0 … n−1：</text>
  <text x="250" y="173" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">cost[t] ← min(cost[t], nums[(t−k) mod n])</text>

  <path d="M 250 186 L 250 204" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="105" y="208" width="290" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="233" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">ans ← min(ans, Σ cost + k·x)</text>

  <path d="M 250 248 L 250 266" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="250,272 376,306 250,340 124,306" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="250" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">k = n−1 ？</text>
  <text x="250" y="320" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">（窗口已覆盖全部 n 个位置）</text>

  <path d="M 250 340 L 250 358" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="354" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="140" y="362" width="220" height="46" rx="9" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.6"/>
  </g>
  <text x="250" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">返回 ans</text>
  <text x="250" y="400" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">时间 O(n²) · 额外空间 O(n)</text>

  <g filter="url(#sk)">
    <path d="M 124 306 L 62 306 L 62 159 L 85 159" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="112" y="298" text-anchor="end" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <text transform="rotate(-90 44 235)" x="44" y="235" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">k ← k+1，继续下一轮</text>

  <g filter="url(#sk)">
    <rect x="440" y="64" width="186" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="533" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">为什么要增量</text>
  <text x="533" y="106" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">k 每加一，每个类型</text>
  <text x="533" y="122" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">的窗口只新增位置</text>
  <text x="533" y="138" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">(t−k) mod n（只进</text>
  <text x="533" y="154" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">不出），直接 min</text>
  <text x="533" y="170" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">进来即可：每轮 O(n)</text>

  <g filter="url(#sk)">
    <rect x="440" y="196" width="186" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="533" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">两个不变式</text>
  <text x="533" y="238" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">只读原始 nums（不变）</text>
  <text x="533" y="254" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">只写 cost[t]（各 t 独立）</text>
  <text x="533" y="270" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">→ t 的遍历顺序任意</text>
  <text x="533" y="286" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">→ ans 覆盖所有候选 k</text>
  <text x="533" y="306" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#sk)">（k = 0 … n−1，引理 3）</text>
</svg>
