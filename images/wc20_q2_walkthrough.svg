  <rect x="44" y="448" width="572" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="466" font-size="11" fill="#8a3a36" filter="url(#rough2)">三条入边汇总：0111 --k=4--&gt; +3　｜　1101 --k=2--&gt; +3　｜　1110 --k=1--&gt; +2</text>
  <text x="60" y="484" font-size="11" fill="#8a3a36" filter="url(#rough2)">合计 3 + 3 + 2 = 8，正是 n = 4 的优美排列数</text>
  <text x="60" y="516" font-size="10.5" fill="#666" filter="url(#rough2)">0011 由 0001、0010 两条路径到达 ⇒ dp 累加；0101、1011（黄色）无候选值，是死路</text>
  <text x="60" y="532" font-size="10.5" fill="#666" filter="url(#rough2)">16 个 mask 全部可达，但「dp 非零」不等于「能走到终点」，0101 就是反例</text>
