  <rect width="660" height="540" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">n = 4 走查：按「已用个数」分层看 dp 如何累加</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">dp[mask] = 用 mask 中的值填满前 popcount(mask) 个位置的方案数</text>

