<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 全流程演算（另补一组 u 侧查询 [4,3]）</text>
  <text x="290" y="42" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">预计算 dist[root]：0→0，1→2，2→5，3→3，4→8（根为 0）</text>

  <!-- 表头 -->
  <rect x="24" y="56" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="56" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="56" width="172" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="396" y="56" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">查询</text>
  <text x="162" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">LCA / A / B</text>
  <text x="310" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">判定（W 与 2A）</text>
  <text x="476" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">爬链与答案</text>

  <!-- 行 1：[3,4] -->
  <rect x="24" y="90" width="76" height="92" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="90" width="124" height="92" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="224" y="90" width="172" height="92" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="396" y="90" width="160" height="92" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[3, 4]</text>
  <text x="162" y="112" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">l = 0</text>
  <text x="162" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">A = 3, B = 8</text>
  <text x="162" y="156" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">W = 11</text>
  <text x="310" y="112" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2A = 6 &lt; 11</text>
  <text x="310" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ v 侧</text>
  <text x="310" y="156" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">条件 2·dist(l,z) ≥ B−A = 5</text>
  <text x="476" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2^1→0 ✗；2^0→2 ✓</text>
  <text x="476" y="134" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">z = 2（最高满足者）</text>
  <text x="476" y="156" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 2</text>

  <!-- 行 2：[1,2] -->
  <rect x="24" y="184" width="76" height="92" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="184" width="124" height="92" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="224" y="184" width="172" height="92" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="396" y="184" width="160" height="92" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[1, 2]</text>
  <text x="162" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">l = 0</text>
  <text x="162" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">A = 2, B = 5</text>
  <text x="162" y="250" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">W = 7</text>
  <text x="310" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2A = 4 &lt; 7</text>
  <text x="310" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ v 侧</text>
  <text x="310" y="250" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">条件 2·dist(l,z) ≥ B−A = 3</text>
  <text x="476" y="206" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2^0→0 ✗（0 ≥ 3 假）</text>
  <text x="476" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">z = 2（无法再爬）</text>
  <text x="476" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 2</text>

  <!-- 行 3：[4,3] u 侧 -->
  <rect x="24" y="278" width="76" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="100" y="278" width="124" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="224" y="278" width="172" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="396" y="278" width="160" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">[4, 3]</text>
  <text x="162" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">l = 0</text>
  <text x="162" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">A = 8, B = 3</text>
  <text x="162" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">W = 11</text>
  <text x="310" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2A = 16 ≥ 11</text>
  <text x="310" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒ u 侧</text>
  <text x="310" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">条件 2·dist(u,y) &lt; W = 11</text>
  <text x="476" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2^2, 2^1→0 ✗；2^0→2 ✓</text>
  <text x="476" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y = 2（最高未越界）</text>
  <text x="476" y="344" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = parent(2) = 0</text>

  <!-- 脚注 -->
  <text x="290" y="386" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">u 侧对照：[4,3] 路径 4→2→0→1→3，前缀 2d = 0, 6, 16, 20, 22，首个 ≥ 11 的是节点 0</text>
  <text x="290" y="402" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">与表格末行 parent(2) = 0 一致 ✓</text>
</svg>
