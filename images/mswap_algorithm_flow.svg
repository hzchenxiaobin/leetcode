<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：三步计数，O(n) 一趟扫描</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="250" y="54" width="140" height="32" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="320" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">开始</text>
  <path d="M 320 86 L 320 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- 框1：计数 -->
  <g filter="url(#sk)"><rect x="160" y="102" width="320" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="121" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">cnt[v] ← 值 v 在 nums 与 forbidden 中</text>
  <text x="320" y="139" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">出现的总次数（一趟哈希计数）</text>
  <path d="M 320 148 L 320 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- 菱形1：无解? -->
  <g filter="url(#sk)"><polygon points="320,164 424,198 320,232 216,198" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="320" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">∃v: cnt[v] &gt; n ?</text>
  <path d="M 424 198 L 470 198" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="447" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="472" y="178" width="130" height="40" rx="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="537" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#sk)">return −1</text>
  <path d="M 320 232 L 320 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="332" y="243" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">否</text>

  <!-- 框2：统计坏位置 -->
  <g filter="url(#sk)"><rect x="160" y="248" width="320" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="267" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">扫一遍：nums[i] == forbidden[i] 的位置为坏位置，</text>
  <text x="320" y="285" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">累计 b 与同值频次 bad[v]</text>
  <path d="M 320 294 L 320 308" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- 菱形2：b==0? -->
  <g filter="url(#sk)"><polygon points="320,310 406,344 320,378 234,344" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="320" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">b == 0 ?</text>
  <path d="M 406 344 L 466 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="436" y="336" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="468" y="324" width="130" height="40" rx="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="533" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">return 0</text>
  <path d="M 320 378 L 320 392" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="332" y="389" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>

  <!-- 返回公式 -->
  <g filter="url(#sk)"><rect x="180" y="394" width="280" height="42" rx="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="320" y="413" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">return max(⌈b/2⌉, p_max)</text>
  <text x="320" y="429" text-anchor="middle" font-size="10.5" fill="#6a8aa8" filter="url(#sk)">其中 p_max = max(bad[v])</text>

  <!-- 底注 -->
  <g filter="url(#sk)"><rect x="40" y="444" width="560" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="320" y="463" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">无解判定是「鸽笼/Hall」计数；答案只依赖 b 与 p_max，无需模拟交换</text>
</svg>
