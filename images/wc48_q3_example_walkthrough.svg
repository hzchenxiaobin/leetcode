<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：num = 2736，从右往左扫描</text>

  <!-- 表头 -->
  <text x="72" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i</text>
  <text x="140" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d[i]</text>
  <text x="225" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">maxDigit</text>
  <text x="305" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">maxIdx</text>
  <text x="352" y="68" font-size="10" fill="#888" filter="url(#rough2)">动作</text>
  <path d="M40,76 L680,76" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <rect x="40" y="86" width="640" height="30" rx="6" fill="#f2f5fa" filter="url(#rough2)"/>
  <text x="72" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="225" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="305" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="352" y="106" font-size="9.6" fill="#2e6e2e" filter="url(#rough2)">6 &gt; '0' ⇒ maxDigit = 6，maxIdx = 3</text>

  <!-- 行 2 -->
  <rect x="40" y="122" width="640" height="30" rx="6" fill="#ffffff" filter="url(#rough2)"/>
  <text x="72" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="225" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="305" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="352" y="142" font-size="9.6" fill="#b85450" filter="url(#rough2)">3 &lt; 6 ⇒ 记 (u, v) = (2, 3)</text>

  <!-- 行 3 -->
  <rect x="40" y="158" width="640" height="30" rx="6" fill="#f2f5fa" filter="url(#rough2)"/>
  <text x="72" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="225" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="305" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="352" y="178" font-size="9.6" fill="#2e6e2e" filter="url(#rough2)">7 &gt; 6 ⇒ 更新 maxDigit = 7，maxIdx = 1</text>

  <!-- 行 4 -->
  <rect x="40" y="194" width="640" height="30" rx="6" fill="#ffffff" filter="url(#rough2)"/>
  <text x="72" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="140" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="225" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="305" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="352" y="214" font-size="9.6" fill="#b85450" filter="url(#rough2)">2 &lt; 7 ⇒ 覆盖为 (u, v) = (0, 1)（最靠左）</text>

  <!-- 结论 -->
  <rect x="40" y="240" width="640" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="269" text-anchor="middle" font-size="10.2" fill="#2e6e2e" filter="url(#rough2)">最终 (u, v) = (0, 1)：交换 2 与 7 ⇒ 2736 → 7236（最大）</text>

  <!-- 第二个例子 -->
  <text x="40" y="312" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">再看 num = 98368：等值不更新 + 覆盖旧记录</text>
  <text x="40" y="336" font-size="9.4" fill="#666" filter="url(#rough2)">i=4: 8 &gt; '0' ⇒ max=8@4　　i=3: 6 &lt; 8 ⇒ (3,4)　　i=2: 3 &lt; 8 ⇒ (2,4) 覆盖</text>
  <text x="40" y="358" font-size="9.4" fill="#666" filter="url(#rough2)">i=1: 8 == max（相等，不更新）⇒ maxIdx 仍为 4，即最靠右的那个 8</text>
  <text x="40" y="380" font-size="9.4" fill="#666" filter="url(#rough2)">i=0: 9 &gt; 8 ⇒ max=9@0，位置 0 已无处可换；(u,v) = (2,4) ⇒ 交换 3 ⇄ 8 ⇒ 98863</text>
</svg>
