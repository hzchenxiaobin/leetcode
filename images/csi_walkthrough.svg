<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：扫描 [1200, 1230] 命中 4 个</text>

  <!-- 数轴 -->
  <line x1="50" y1="70" x2="510" y2="70" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="50" y1="64" x2="50" y2="76" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="510" y1="64" x2="510" y2="76" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="58" text-anchor="middle" font-size="11" fill="#333">1200</text>
  <text x="510" y="58" text-anchor="middle" font-size="11" fill="#333">1230</text>

  <!-- 刻度点 -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <circle cx="127" cy="70" r="2.5" fill="#888" filter="url(#rough2)"/><text x="127" y="92">1205</text>
    <circle cx="203" cy="70" r="2.5" fill="#888" filter="url(#rough2)"/><text x="203" y="92">1210</text>
    <circle cx="280" cy="70" r="2.5" fill="#888" filter="url(#rough2)"/><text x="280" y="92">1215</text>
    <circle cx="357" cy="70" r="2.5" fill="#888" filter="url(#rough2)"/><text x="357" y="92">1220</text>
    <circle cx="433" cy="70" r="2.5" fill="#888" filter="url(#rough2)"/><text x="433" y="92">1225</text>
  </g>

  <!-- 命中标记 -->
  <g filter="url(#rough2)">
    <circle cx="50" cy="70" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="96" cy="70" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="234" cy="70" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="372" cy="70" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="510" cy="70" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="96" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a">1203</text>
  <text x="234" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a">1212</text>
  <text x="372" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a">1221</text>
  <text x="510" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a">1230</text>
  <text x="50" y="116" font-size="10" fill="#b85450">1200 ✗（3 ≠ 0）</text>

  <!-- 演算卡片 -->
  <g filter="url(#rough2)">
    <rect x="46" y="136" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="206" y="136" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="366" y="136" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="46" y="200" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="121" y="158" font-weight="bold">1203</text><text x="121" y="178">1+2 = 0+3 = 3 ✓</text>
    <text x="281" y="158" font-weight="bold">1212</text><text x="281" y="178">1+2 = 1+2 = 3 ✓</text>
    <text x="441" y="158" font-weight="bold">1221</text><text x="441" y="178">1+2 = 2+1 = 3 ✓</text>
    <text x="121" y="222" font-weight="bold">1230</text><text x="121" y="242">1+2 = 3+0 = 3 ✓</text>
  </g>

  <!-- 失败示例 -->
  <g filter="url(#rough2)">
    <rect x="206" y="200" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <text x="281" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1210</text>
  <text x="281" y="242" text-anchor="middle" font-size="11" fill="#333">1+2 = 3 ≠ 1 ✗</text>

  <!-- 结论 -->
  <rect x="366" y="200" width="150" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="441" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ans = 4</text>
  <text x="441" y="242" text-anchor="middle" font-size="11" fill="#888">31 个数只中 4 个</text>

  <text x="46" y="288" font-size="11" fill="#888">每 10 个连续 4 位数里恰有 1 个：后两位之和凑成 1+2=3，即 03/12/21/30 四种排列</text>
  <text x="46" y="310" font-size="11" fill="#888">1200~1209 → 1203；1210~1219 → 1212；1220~1229 → 1221；1230~ → 1230</text>
</svg>
