<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：memory1 = 8, memory2 = 11 → [6, 0, 4]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="110" y="52" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="280" y="52" width="115" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="395" y="52" width="115" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="75" y="71">秒 t</text><text x="195" y="71">扣给谁（为何）</text>
    <text x="337" y="71">之后 m1</text><text x="452" y="71">之后 m2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="470" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="110" width="470" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="140" width="470" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="170" width="470" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="200" width="470" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="40" y="230" width="470" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="75" y="100" text-anchor="middle">1</text><text x="195" y="100" text-anchor="middle">条 2（11 &gt; 8）</text><text x="337" y="100" text-anchor="middle">8</text><text x="452" y="100" text-anchor="middle">10</text>
    <text x="75" y="130" text-anchor="middle">2</text><text x="195" y="130" text-anchor="middle">条 2（10 &gt; 8）</text><text x="337" y="130" text-anchor="middle">8</text><text x="452" y="130" text-anchor="middle">8</text>
    <text x="75" y="160" text-anchor="middle">3</text><text x="195" y="160" text-anchor="middle">条 1（8 = 8，平局取前）</text><text x="337" y="160" text-anchor="middle">5</text><text x="452" y="160" text-anchor="middle">8</text>
    <text x="75" y="190" text-anchor="middle">4</text><text x="195" y="190" text-anchor="middle">条 2（8 &gt; 5）</text><text x="337" y="190" text-anchor="middle">5</text><text x="452" y="190" text-anchor="middle">4</text>
    <text x="75" y="220" text-anchor="middle">5</text><text x="195" y="220" text-anchor="middle">条 1（5 &gt; 4）</text><text x="337" y="220" text-anchor="middle">0</text><text x="452" y="220" text-anchor="middle">4</text>
    <text x="75" y="250" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="195" y="250" text-anchor="middle" fill="#b85450" font-weight="bold">崩溃：max(0, 4) = 4 &lt; 6</text>
    <text x="337" y="250" text-anchor="middle" fill="#b85450">0</text><text x="452" y="250" text-anchor="middle" fill="#b85450">4</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="286" width="235" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="308" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">循环条件写成 max(m1, m2) ≥ t：</text>
  <text x="56" y="326" font-size="11" fill="#3a4a66" filter="url(#rough2)">较大者付不起 ⇒ 两条都付不起。</text>

  <rect x="285" y="286" width="235" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="301" y="308" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">内存可达 2³¹−1：内部用 64 位，</text>
  <text x="301" y="326" font-size="11" fill="#2f5226" filter="url(#rough2)">返回前再转回 int。</text>

  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">总扣减不超过 m1+m2 &lt; 2³²，崩溃时刻 t 满足 t(t+1)/2 ≈ m1+m2，故 t ≤ 92681，模拟步数不过 ~10⁵</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">用等差数列求和也可以解出 t 的闭式，但直接模拟更不易写错</text>
</svg>
