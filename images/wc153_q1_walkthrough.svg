<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例走查：distance = [1, 2, 3, 4]，total = 10</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">答案 = min(cw, total − cw)，两条弧一长一短，取短者</text>

  <!-- 表头 -->
  <rect x="40" y="68" width="520" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="91" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">组</text>
  <text x="143" y="91" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">start</text>
  <text x="213" y="91" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">destination</text>
  <text x="333" y="91" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">顺时针区间和 cw</text>
  <text x="453" y="91" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">total − cw</text>
  <text x="528" y="91" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">答案</text>

  <!-- 行 ① -->
  <rect x="40" y="104" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="128" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">①</text>
  <text x="143" y="128" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="213" y="128" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="333" y="128" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">d[0] = 1</text>
  <text x="453" y="128" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">9</text>
  <text x="528" y="128" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 ② -->
  <rect x="40" y="142" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="166" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">②</text>
  <text x="143" y="166" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="213" y="166" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="333" y="166" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">d[0] + d[1] = 3</text>
  <text x="453" y="166" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="528" y="166" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 ③ -->
  <rect x="40" y="180" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="204" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">③</text>
  <text x="143" y="204" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0</text>
  <text x="213" y="204" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="333" y="204" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">d[0] + d[1] + d[2] = 6</text>
  <text x="453" y="204" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="528" y="204" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 行 ④ -->
  <rect x="40" y="218" width="520" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">④</text>
  <text x="143" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="213" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="333" y="242" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">区间为空 → 0</text>
  <text x="453" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">10</text>
  <text x="528" y="242" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 行 ⑤ -->
  <rect x="40" y="256" width="520" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="280" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">⑤</text>
  <text x="143" y="280" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="213" y="280" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="333" y="280" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">交换后 d[1] + d[2] = 5</text>
  <text x="453" y="280" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">5</text>
  <text x="528" y="280" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 图例 -->
  <rect x="80" y="310" width="11" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="98" y="320" font-size="10" fill="#555555" filter="url(#rough2)">顺时针更短</text>
  <rect x="200" y="310" width="11" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="218" y="320" font-size="10" fill="#555555" filter="url(#rough2)">另一侧更短</text>
  <rect x="320" y="310" width="11" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="338" y="320" font-size="10" fill="#555555" filter="url(#rough2)">两条等长</text>

  <text x="300" y="346" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">④ 起点与终点相同时区间为空，答案为 0；⑤ 交换下标后区间必须跟着换成新的 start 与 destination</text>
</svg>
