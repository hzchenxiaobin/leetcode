<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="abO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="500" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：叶值命中根值定位挂接，根值不在叶值集合定位最终根</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 根值行 ===== -->
  <text x="40" y="66" font-size="11" font-weight="bold" fill="#446688">全部根值（互不相同）</text>
  <g filter="url(#sk)"><rect x="60" y="74" width="140" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="130" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Tree0 · 根 2</text>
  <text x="130" y="112" text-anchor="middle" font-size="10" fill="#2e6e2e">被叶 2 命中 → 吸收 ✓</text>
  <g filter="url(#sk)"><rect x="260" y="74" width="140" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="330" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Tree1 · 根 3</text>
  <text x="330" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">没有任何叶值命中 → 最终根</text>
  <g filter="url(#sk)"><rect x="460" y="74" width="140" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="530" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Tree2 · 根 5</text>
  <text x="530" y="112" text-anchor="middle" font-size="10" fill="#2e6e2e">被叶 5 命中 → 吸收 ✓</text>
  <g filter="url(#sk)"><ellipse cx="330" cy="97" rx="88" ry="30" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 5"/></g>

  <!-- ===== 叶值行 ===== -->
  <text x="40" y="152" font-size="11" font-weight="bold" fill="#4a7a3a">全部叶值（可以重复）</text>
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="40" y="160" width="130" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="105" y="181" fill="#2e6e2e">叶 1 · Tree0 左叶</text>
    <g filter="url(#sk)"><rect x="200" y="160" width="130" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="265" y="181" fill="#2e6e2e">叶 2 · Tree1 左叶</text>
    <g filter="url(#sk)"><rect x="360" y="160" width="130" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="425" y="181" fill="#2e6e2e">叶 4 · Tree2 左叶</text>
    <g filter="url(#sk)"><rect x="520" y="160" width="130" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="585" y="181" fill="#2e6e2e">叶 5 · Tree1 右叶</text>
  </g>

  <!-- 命中箭头：叶 2 → Tree0，叶 5 → Tree2 -->
  <path d="M 265 156 Q 195 132 138 124" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <path d="M 585 156 Q 555 135 536 126" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <text x="105" y="208" text-anchor="middle" font-size="9.5" fill="#888">无树可挂 → 保留为叶</text>
  <text x="425" y="208" text-anchor="middle" font-size="9.5" fill="#888">无树可挂 → 保留为叶</text>

  <!-- ===== 中部说明 ===== -->
  <text x="330" y="244" text-anchor="middle" font-size="11.5" fill="#444">一次操作只有一种形式：叶值命中某棵树的根值 → 把那棵树整棵挂到叶位置、移出数组</text>
  <text x="330" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">根值互不相同 ⟹ 每片叶子至多命中一棵树 ——「挂谁」没有任何自由度</text>

  <!-- ===== 三个观察 ===== -->
  <g filter="url(#sk)"><rect x="25" y="286" width="200" height="188" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="125" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">观察 ① 哈希定位「挂谁」</text>
  <text x="125" y="336" text-anchor="middle" font-size="11" fill="#444">rootOf：根值 → 树</text>
  <text x="125" y="358" text-anchor="middle" font-size="11" fill="#444">叶子值 v 一查便知挂谁</text>
  <text x="125" y="380" text-anchor="middle" font-size="11" fill="#444">查不到 → 叶子保留原位</text>
  <text x="125" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">O(1) 定位，没有搜索</text>
  <text x="125" y="436" text-anchor="middle" font-size="11" fill="#888">看似 n! 顺序的搜索题</text>
  <text x="125" y="456" text-anchor="middle" font-size="11" fill="#888">其实是确定性拼图题</text>

  <g filter="url(#sk)"><rect x="235" y="286" width="200" height="188" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="335" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">观察 ② 最终根唯一</text>
  <text x="335" y="336" text-anchor="middle" font-size="11" fill="#444">树被吸收 ⟺ 根值出现在</text>
  <text x="335" y="356" text-anchor="middle" font-size="11" fill="#444">当时某片叶子上</text>
  <text x="335" y="378" text-anchor="middle" font-size="11" fill="#444">叶值始终来自原始叶集合</text>
  <text x="335" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">根值 ∉ 叶值集合的树</text>
  <text x="335" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">永不被吸收 → 唯一候选根</text>
  <text x="335" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">候选 0 或 ≥ 2 → 直接 null</text>

  <g filter="url(#sk)"><rect x="445" y="286" width="200" height="188" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="545" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">观察 ③ 局部合法 ⇏ 全局</text>
  <text x="545" y="336" text-anchor="middle" font-size="11" fill="#444">每棵输入树都是合法 BST</text>
  <text x="545" y="358" text-anchor="middle" font-size="11" fill="#444">但拼接引入跨树祖先约束</text>
  <text x="545" y="384" text-anchor="middle" font-size="11" fill="#444">示例 2：6 在 [3,2,6] 内合法</text>
  <text x="545" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">住进 5 的左子树 → 6 ≥ 5 ✗</text>
  <text x="545" y="434" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">合并完必须上下界整体验证</text>
  <text x="545" y="456" text-anchor="middle" font-size="11" fill="#888">左子传 (lo, val)、右子传 (val, hi)</text>
</svg>
