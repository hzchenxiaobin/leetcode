<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把单词竖起来：一列一个单词，逐行读取</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "HOW ARE YOU"　→　三列、三行，每行从左到右拼成一个答案串</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="133" y="96">HOW</text>
    <text x="183" y="96">ARE</text>
    <text x="233" y="96">YOU</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#888">
    <text x="96" y="130">行 0</text>
    <text x="96" y="172">行 1</text>
    <text x="96" y="214">行 2</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="110" y="108" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="160" y="108" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="210" y="108" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="133" y="128" fill="#3a4a66">H</text>
    <text x="183" y="128" fill="#3a4a66">A</text>
    <text x="233" y="128" fill="#3a4a66">Y</text>

    <rect x="110" y="150" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="160" y="150" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="210" y="150" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="133" y="170" fill="#3a5a30">O</text>
    <text x="183" y="170" fill="#3a5a30">R</text>
    <text x="233" y="170" fill="#3a5a30">O</text>

    <rect x="110" y="192" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="160" y="192" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="192" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="133" y="212" fill="#8a6a20">W</text>
    <text x="183" y="212" fill="#8a6a20">E</text>
    <text x="233" y="212" fill="#8a6a20">U</text>
  </g>

  <path d="M 264 123 L 300 123" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 165 L 300 165" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 207 L 300 207" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="310" y="128">"HAY"</text>
    <text x="310" y="170">"ORO"</text>
    <text x="310" y="212">"WEU"</text>
  </g>

  <rect x="40" y="248" width="480" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="11" fill="#8a3a38" font-weight="bold" filter="url(#rough2)">关键：列数 = 单词数，行数 = 最长单词长度</text>
  <text x="56" y="286" font-size="10" fill="#8a3a38" filter="url(#rough2)">短单词在后面的行「没有字符」，该格填空格占位；每行末尾的空格必须删掉</text>

  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空格是占位符而不是分隔符：它只保证同一行的字符仍落在原来的列上</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">所以绝不能先删空格再拼接，必须整行拼完再 rstrip</text>
</svg>
