<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单次遍历，逐株记账</text>
  <path d="M 150 38 Q 320 48 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)">
    <rect x="210" y="54" width="220" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="77" text-anchor="middle" font-size="12.5" fill="#2b4a6e">ans = 0，cur = capacity</text>
  <path d="M 320 90 L 320 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- loop -->
  <g filter="url(#sk2)">
    <rect x="195" y="110" width="250" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="136" text-anchor="middle" font-size="12.5" fill="#2e6e2e">取下一株植物 i ∈ [0, n−1]</text>
  <path d="M 320 152 L 320 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- diamond -->
  <g filter="url(#sk2)">
    <polygon points="320,170 425,225 320,280 215,225" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">cur ≥ plants[i] ?</text>

  <!-- branches -->
  <path d="M 215 225 C 200 258, 214 292, 228 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="196" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 425 225 C 440 258, 434 292, 442 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="458" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">否</text>

  <!-- yes box -->
  <g filter="url(#sk2)">
    <rect x="150" y="326" width="164" height="76" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="232" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">直走 1 步</text>
  <text x="232" y="378" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">ans += 1</text>

  <!-- no box -->
  <g filter="url(#sk2)">
    <rect x="356" y="326" width="184" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="448" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">折返：2i+1 步</text>
  <text x="448" y="368" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">ans += 2i + 1</text>
  <text x="448" y="390" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">cur = capacity</text>

  <!-- merge -->
  <path d="M 232 402 C 248 434, 288 446, 312 448" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 448 402 C 432 434, 352 446, 328 448" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <circle cx="320" cy="452" r="4.5" fill="#555" filter="url(#sk2)"/>
  <text x="320" y="478" text-anchor="middle" font-size="12" fill="#555">汇合后统一执行：cur −= plants[i]（浇掉这株）</text>

  <!-- loop back -->
  <path d="M 320 462 C 90 486, 55 286, 194 138" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="62" y="316" font-size="12" fill="#888">i + 1</text>

  <!-- exit / return -->
  <path d="M 445 131 C 530 140, 570 190, 556 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="575" y="204" font-size="11" fill="#888">浇完全部</text>
  <g filter="url(#sk2)">
    <rect x="486" y="252" width="140" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="556" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 ans</text>
</svg>
