<svg xmlns="http://www.w3.org/2000/svg" width="660" height="370" viewBox="0 0 660 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="370" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">关 3 · 闭矩形查空洞：边界上的点同样作废</text>
  <path d="M 200 42 Q 330 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: big square, rejected -->
  <text x="170" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">大正方形 [1,3]×[1,3]</text>
  <g filter="url(#sk)">
    <rect x="75" y="95" width="190" height="190" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="75" cy="95" r="6" fill="#4a7a3a"/>
    <circle cx="265" cy="95" r="6" fill="#4a7a3a"/>
    <circle cx="75" cy="285" r="6" fill="#4a7a3a"/>
    <circle cx="265" cy="285" r="6" fill="#4a7a3a"/>
    <circle cx="75" cy="190" r="6" fill="#b85450" stroke="#fdfcf7" stroke-width="1.5"/>
    <circle cx="265" cy="190" r="6" fill="#b85450" stroke="#fdfcf7" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#2b2b2b">
    <text x="66" y="180" text-anchor="end" fill="#b85450" font-weight="bold">(1,2)</text>
    <text x="66" y="212" text-anchor="end" fill="#b85450">踩在边上</text>
    <text x="274" y="180" text-anchor="start" fill="#b85450" font-weight="bold">(3,2)</text>
    <text x="274" y="212" text-anchor="start" fill="#b85450">踩在边上</text>
    <text x="170" y="148" text-anchor="middle" fill="#b85450" font-size="15" font-weight="bold">✗</text>
  </g>
  <text x="170" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">面积 4 → 作废 ✗</text>

  <!-- right panel: short rectangle, accepted -->
  <text x="490" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">矮矩形 [1,3]×[2,3]</text>
  <g filter="url(#sk)">
    <rect x="395" y="95" width="190" height="95" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="395" cy="95" r="6" fill="#4a7a3a"/>
    <circle cx="585" cy="95" r="6" fill="#4a7a3a"/>
    <circle cx="395" cy="190" r="6" fill="#4a7a3a"/>
    <circle cx="585" cy="190" r="6" fill="#4a7a3a"/>
    <circle cx="395" cy="285" r="6" fill="#999"/>
    <circle cx="585" cy="285" r="6" fill="#999"/>
  </g>
  <g font-size="12" fill="#2b2b2b">
    <text x="386" y="280" text-anchor="end" fill="#888">(1,1)</text>
    <text x="594" y="280" text-anchor="start" fill="#888">(3,1)</text>
    <text x="490" y="228" text-anchor="middle" fill="#888">这两点在闭矩形外</text>
    <text x="490" y="136" text-anchor="middle" fill="#2e6e2e" font-size="15" font-weight="bold">✓</text>
  </g>
  <text x="490" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">面积 2 → 合法 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="80" y="326" width="500" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="347" text-anchor="middle" font-size="12" fill="#7a5415">判定用闭区间：lx ≤ px ≤ rx 且 ly ≤ py ≤ ry；四个顶点本身豁免</text>
</svg>
