<svg xmlns="http://www.w3.org/2000/svg" width="740" height="572" viewBox="0 0 740 572" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="572" fill="#fdfcf7"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">小步长批处理：同余类拆链 + 乘法差分（k = 2，n = 8）</text>
  <text x="370" y="54" text-anchor="middle" font-size="12" fill="#888">查询① [0,5,2,3]、查询② [2,7,2,5] 的落点全在链 c = l mod 2 = 0，即 {0, 2, 4, 6}</text>

  <!-- row 1: index cells, chain highlighted -->
  <text x="42" y="114" font-size="12" font-weight="bold" fill="#446688">数组</text>
  <g filter="url(#sk)">
    <rect x="140" y="86" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="201" y="86" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="262" y="86" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="323" y="86" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="384" y="86" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="445" y="86" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="506" y="86" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="567" y="86" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
  </g>
  <text x="168" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">0</text>
  <text x="229" y="114" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">1</text>
  <text x="290" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">2</text>
  <text x="351" y="114" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">3</text>
  <text x="412" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">4</text>
  <text x="473" y="114" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">5</text>
  <text x="534" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" font-family="monospace">6</text>
  <text x="595" y="114" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">7</text>
  <text x="370" y="150" text-anchor="middle" font-size="11.5" fill="#446688">蓝 = 同余类 c = 0；灰 = 其它链，本 k 的查询碰不到它们</text>

  <!-- coverage brackets -->
  <g filter="url(#sk)">
    <path d="M 140 170 L 140 162 L 440 162 L 440 170" stroke="#d6a040" stroke-width="1.8" fill="none"/>
    <path d="M 262 200 L 262 192 L 562 192 L 562 200" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
  </g>
  <text x="290" y="184" text-anchor="middle" font-size="11.5" fill="#a06a10">查询① [0,5,2,3]：落点 {0,2,4}，last = 4</text>
  <text x="412" y="214" text-anchor="middle" font-size="11.5" fill="#2e6e2e">查询② [2,7,2,5]：落点 {2,4,6}，last = 6</text>

  <!-- row 2: diff cells -->
  <text x="42" y="260" font-size="12" font-weight="bold" fill="#b85450">diff</text>
  <g filter="url(#sk)">
    <rect x="140" y="232" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="201" y="232" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="262" y="232" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="323" y="232" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="384" y="232" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="445" y="232" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="506" y="232" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="567" y="232" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
  </g>
  <text x="168" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" font-family="monospace">×3</text>
  <text x="229" y="260" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="290" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">×5</text>
  <text x="351" y="260" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="412" y="260" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="473" y="260" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="534" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace">×3⁻¹</text>
  <text x="595" y="260" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="370" y="294" text-anchor="middle" font-size="11.5" fill="#b85450">还账点 = last+k：①的 4+2 = 6 &lt; 8 → 写 ×3⁻¹；②的 6+2 = 8 ≥ n 越界 → 免写</text>

  <!-- row 3: prefix product along the chain -->
  <text x="42" y="346" font-size="12" font-weight="bold" fill="#446688">前缀积</text>
  <text x="534" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">15·3⁻¹ = 5 ← 望远镜抵消！</text>
  <g filter="url(#sk)">
    <rect x="140" y="320" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="262" y="320" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="384" y="320" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="506" y="320" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <path d="M 204 342 L 254 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 326 342 L 376 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 448 342 L 498 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="168" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">3</text>
  <text x="168" y="356" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">pos 0</text>
  <text x="290" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">15</text>
  <text x="290" y="356" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">pos 2</text>
  <text x="412" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">15</text>
  <text x="412" y="356" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">pos 4</text>
  <text x="534" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="534" y="356" text-anchor="middle" font-size="9" fill="#b85450" font-family="monospace">pos 6</text>
  <text x="370" y="386" text-anchor="middle" font-size="11.5" fill="#888">P 沿链逐步累乘 diff：v 在 l 处上车、在 last+k 处被 v⁻¹ 还清</text>

  <!-- row 4: mult -->
  <text x="42" y="432" font-size="12" font-weight="bold" fill="#446688">mult</text>
  <g filter="url(#sk)">
    <rect x="140" y="404" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="201" y="404" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="262" y="404" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="323" y="404" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="384" y="404" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="445" y="404" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="506" y="404" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="567" y="404" width="56" height="44" rx="4" fill="#f7f7f7" stroke="#c5c5c5" stroke-width="1.2"/>
  </g>
  <text x="168" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="monospace">3</text>
  <text x="229" y="432" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="290" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="monospace">15</text>
  <text x="351" y="432" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="412" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="monospace">15</text>
  <text x="473" y="432" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="534" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace">5</text>
  <text x="595" y="432" text-anchor="middle" font-size="12" fill="#999" font-family="monospace">1</text>
  <text x="168" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">0</text>
  <text x="229" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">1</text>
  <text x="290" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">2</text>
  <text x="351" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">3</text>
  <text x="412" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">4</text>
  <text x="473" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">5</text>
  <text x="534" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">6</text>
  <text x="595" y="466" text-anchor="middle" font-size="9.5" fill="#888" font-family="monospace">7</text>
  <text x="370" y="484" text-anchor="middle" font-size="11.5" fill="#446688">mult[i] ×= P：本 k 对各位置的贡献；未被覆盖的位置 P = 1，不变</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="90" y="498" width="560" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="370" y="522" text-anchor="middle" font-size="12.5" fill="#2b2b2b">乘法差分 = 加法差分的乘法版：起点乘 v、还账点乘 v⁻¹</text>
  <text x="370" y="544" text-anchor="middle" font-size="12.5" fill="#2b2b2b">沿链做前缀积，因子 v 恰好只注入 [l, last] 这一段</text>
</svg>
