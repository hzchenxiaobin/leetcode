<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：prevRoom 构成一棵以 0 为根的树，合法顺序 = 「父先于子」的排列</text>
  <path d="M 210 40 Q 470 50 730 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">构筑 i 的唯一门槛是父房间已建成；已建房间始终连通含 0、可自由穿行 → 除「父先于子」外没有别的约束</text>

  <!-- tree edges -->
  <g stroke="#8a8a8a" stroke-width="2" fill="none">
    <path d="M 220 162 Q 168 208 134 232" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 260 162 Q 312 208 346 232" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 125 284 Q 121 322 125 344" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 355 284 Q 359 322 355 344" marker-end="url(#arr)" filter="url(#sk)"/>
  </g>

  <!-- tree nodes -->
  <g filter="url(#sk)">
    <circle cx="240" cy="134" r="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <circle cx="125" cy="258" r="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="355" cy="258" r="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="125" cy="372" r="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="355" cy="372" r="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="240" y="141" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="125" y="264" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <text x="355" y="264" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="125" y="378" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <text x="355" y="378" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">4</text>

  <!-- subtree size badges -->
  <g filter="url(#sk)">
    <circle cx="266" cy="112" r="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <circle cx="150" cy="238" r="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <circle cx="380" cy="238" r="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <circle cx="150" cy="352" r="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <circle cx="380" cy="352" r="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="266" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5518" filter="url(#sk)">5</text>
  <text x="150" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5518" filter="url(#sk)">2</text>
  <text x="380" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5518" filter="url(#sk)">2</text>
  <text x="150" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5518" filter="url(#sk)">1</text>
  <text x="380" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5518" filter="url(#sk)">1</text>

  <text x="240" y="428" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">prevRoom = [-1, 0, 0, 1, 2]</text>
  <text x="240" y="450" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#sk)">橙色角标 = 子树大小 sz(v)</text>

  <!-- valid order -->
  <text x="700" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">✓ 合法顺序：父总在子之前</text>
  <g filter="url(#sk)">
    <rect x="480" y="112" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="536" y="112" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="592" y="112" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="648" y="112" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="704" y="112" width="44" height="40" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="502" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="558" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <text x="614" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="670" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="726" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <g stroke="#8a8a8a" stroke-width="1.6" fill="none">
    <path d="M 526 132 L 534 132" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 582 132 L 590 132" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 638 132 L 646 132" marker-end="url(#arr)" filter="url(#sk)"/>
    <path d="M 694 132 L 702 132" marker-end="url(#arr)" filter="url(#sk)"/>
  </g>

  <!-- invalid order -->
  <text x="700" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03d38" filter="url(#sk)">✗ 非法顺序：1 抢在父 0 之前</text>
  <g filter="url(#sk)">
    <rect x="480" y="208" width="44" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="536" y="208" width="44" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="592" y="208" width="44" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="648" y="208" width="44" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="704" y="208" width="44" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="502" y="233" text-anchor="middle" font-size="16" font-weight="bold" fill="#a03d38" filter="url(#sk)">1</text>
  <text x="558" y="233" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="614" y="233" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="670" y="233" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <text x="726" y="233" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="700" y="272" text-anchor="middle" font-size="12" fill="#a03d38" filter="url(#sk)">构筑 1 时 prevRoom[1] = 0 还没建成 → 无法开工</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="470" y="296" width="400" height="90" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="670" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">「父先于子」的排列 = 树的拓扑序（线性拓展）</text>
  <text x="670" y="348" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#sk)">本题 = 统计这棵树的线性拓展个数</text>
  <text x="670" y="370" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">树上计数有经典闭式（见下）↓</text>

  <!-- formula strip -->
  <g filter="url(#sk)">
    <rect x="60" y="470" width="820" height="84" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="470" y="502" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5518" filter="url(#sk)">树的线性拓展数 = n! / ∏ sz(v)　（sz(v) 为 v 的子树大小）</text>
  <text x="470" y="532" text-anchor="middle" font-size="13.5" fill="#444" filter="url(#sk)">本例：5! / (5·2·2·1·1) = 120 / 20 = 6 ✓　——这个闭式怎么来的？见下一张图</text>
</svg>
