<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一个包，三本账：队列管 FIFO、集合管查重、分桶管计数</text>
  <path d="M 80 38 Q 280 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 账本① FIFO 队列 -->
  <g filter="url(#sk)">
    <rect x="26" y="52" width="306" height="142" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="42" y="74" font-size="13" font-weight="bold" fill="#2b5f9e">账本① 双端队列：管 FIFO</text>
  <text x="42" y="90" font-size="10.5" fill="#4a8edb">队头 = 最旧；addPacket 只从队尾进</text>
  <g filter="url(#sk)">
    <rect x="40" y="100" width="88" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="84" y="119" text-anchor="middle" font-size="11.5" fill="#b85450">(2,5,90)</text>
  <g filter="url(#sk)">
    <rect x="134" y="100" width="88" height="30" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="178" y="119" text-anchor="middle" font-size="11.5" fill="#333">(3,5,95)</text>
  <g filter="url(#sk)">
    <rect x="228" y="100" width="88" height="30" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="272" y="119" text-anchor="middle" font-size="11.5" fill="#333">(4,5,105)</text>
  <text x="42" y="152" font-size="11" fill="#2b2b2b">◀ 满员先淘汰队头；转发也从队头出</text>
  <text x="42" y="174" font-size="10.5" fill="#4a8edb">长度 ≤ memoryLimit</text>

  <!-- 账本② 查重集合 -->
  <g filter="url(#sk)">
    <rect x="346" y="52" width="188" height="142" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="360" y="74" font-size="13" font-weight="bold" fill="#2e6e2e">账本② 查重集合</text>
  <text x="360" y="98" font-size="11" fill="#333">{(2,5,90), (3,5,95),</text>
  <text x="360" y="116" font-size="11" fill="#333">  (4,5,105)}</text>
  <text x="360" y="142" font-size="10.5" fill="#2e6e2e">addPacket 先查这里：</text>
  <text x="360" y="158" font-size="10.5" fill="#b85450">已存在 → false（重复）</text>
  <text x="360" y="180" font-size="10.5" fill="#2e6e2e">出队必同步删（只查「在存」）</text>

  <!-- 连接箭头 -->
  <path d="M 179 194 L 179 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 194 L 440 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 账本③ 分桶 -->
  <g filter="url(#sk)">
    <rect x="26" y="214" width="508" height="162" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="40" y="236" font-size="13" font-weight="bold" fill="#7a5415">账本③ 按 destination 分桶 —— 包的 t 同时追加进桶 d</text>
  <text x="40" y="254" font-size="10.5" fill="#8a6d3b">灰格 = 已销账（head 惰性失效）；白格 = 当前在存</text>

  <text x="42" y="282" font-size="11" fill="#333">dest=4</text>
  <g filter="url(#sk)">
    <rect x="108" y="264" width="56" height="28" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="136" y="282" text-anchor="middle" font-size="11" fill="#888">90</text>
  <text x="180" y="282" font-size="10.5" fill="#8a6d3b">90 已随 (1,4,90) 淘汰 —— head=1，桶已空</text>

  <text x="42" y="312" font-size="11" fill="#333">dest=5</text>
  <g filter="url(#sk)">
    <rect x="108" y="294" width="56" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="136" y="312" text-anchor="middle" font-size="11" fill="#333">90</text>
  <g filter="url(#sk)">
    <rect x="172" y="294" width="56" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#333">95</text>
  <g filter="url(#sk)">
    <rect x="236" y="294" width="56" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="264" y="312" text-anchor="middle" font-size="11" fill="#333">105</text>
  <text x="312" y="312" font-size="10.5" fill="#7a5415">全部在存（t 非递减 → 追加即有序）</text>

  <text x="42" y="342" font-size="11" fill="#333">dest=2</text>
  <g filter="url(#sk)">
    <rect x="108" y="326" width="56" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="136" y="344" text-anchor="middle" font-size="11" fill="#333">110</text>
  <text x="180" y="342" font-size="10.5" fill="#8a6d3b">后加入的包</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="26" y="392" width="508" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="280" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">getCount(d, st, en) = upper_bound(en) − lower_bound(st)，只看桶 d 的有效区间</text>
  <text x="280" y="440" text-anchor="middle" font-size="12" fill="#a04040">白送的单调性：addPacket 时间戳非递减 → 桶内天然非降，全程零排序</text>
</svg>
