  <text x="40" y="252" font-size="10" fill="#666" filter="url(#rough2)">黄色三格：dp[3][5] 在 j = 2, 3, 4 处要查的三个区间代价</text>
  <text x="40" y="268" font-size="10" fill="#666" filter="url(#rough2)">灰色 · 与 ∞：不存在的区间 / 段数多于字符数，均不可行</text>
  <rect x="40" y="284" width="540" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[3][5] = min{ dp[2][2]+cost(2,4)=0+1,  dp[2][3]+cost(3,4)=0+1,  dp[2][4]+cost(4,4)=0+0 } = 0</text>
  <text x="56" y="326" font-size="10" fill="#555" filter="url(#rough2)">对应切法 "aa" | "bb" | "c"：三段本身就是回文，一个字符都不用改</text>
  <text x="56" y="346" font-size="10" fill="#555" filter="url(#rough2)">对照：k = 3 时若硬拆成 "a" | "a" | "bbc"，仅最后一段就要改 1 次，故 dp[3][5] 取 0</text>
  <text x="310" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">填表顺序：c 从小到大，同一行内 i 从小到大，每个状态只回头查第 c−1 行</text>
</svg>
