<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="570" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：奇偶前缀和一遍扫描，逐位置 O(1) 判定</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="54" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">① 统计 totalEven / totalOdd</text>
  <text x="320" y="92" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">按 i 奇偶分流累加，一遍完成</text>

  <path d="M 320 100 L 320 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="120" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="143" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-family="monospace" filter="url(#sk)">leftEven = leftOdd = ans = 0</text>

  <path d="M 320 156 L 320 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="80" y="176" width="480" height="266" rx="14" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5"/>
  </g>
  <text x="104" y="200" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">③ 依次枚举删除位置 i = 0 … n−1</text>

  <g filter="url(#sk)">
    <rect x="118" y="210" width="404" height="66" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">总量减法即时算出 i 右侧（下标 &gt; i）的原奇偶和</text>
  <text x="320" y="248" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-family="monospace" filter="url(#sk)">rightEven = totalEven - leftEven - (i 偶 ? nums[i] : 0)</text>
  <text x="320" y="265" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-family="monospace" filter="url(#sk)">rightOdd  = totalOdd  - leftOdd  - (i 奇 ? nums[i] : 0)</text>

  <path d="M 320 276 L 320 290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,292 418,326 320,360 222,326" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36" filter="url(#sk)">平衡？</text>
  <text x="212" y="320" text-anchor="end" font-size="9.5" fill="#888" font-family="monospace" filter="url(#sk)">leftE + rightO</text>
  <text x="212" y="334" text-anchor="end" font-size="9.5" fill="#888" font-family="monospace" filter="url(#sk)">== leftO + rightE</text>

  <path d="M 418 326 L 460 326" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="438" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="462" y="308" width="70" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="497" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a3a" font-family="monospace" filter="url(#sk)">ans++</text>
  <path d="M 497 344 L 497 368" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 320 360 L 320 368" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="368" text-anchor="start" font-size="11" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="150" y="372" width="360" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">④ 判定后，把 nums[i] 累入左侧</text>
  <text x="330" y="408" text-anchor="middle" font-size="10.5" fill="#2b4a66" font-family="monospace" filter="url(#sk)">i 偶 ? leftEven += nums[i] : leftOdd += nums[i]</text>

  <path d="M 150 395 L 98 395 L 98 240 L 112 240" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="88" y="320" transform="rotate(-90 88 320)" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">下一个 i</text>

  <path d="M 320 442 L 320 456" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="210" y="460" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="320" y="485" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">⑤ 返回 ans</text>

  <g filter="url(#sk)">
    <rect x="60" y="516" width="520" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="534" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">总量减法：右侧和 = 全量 − 左侧 − 自身，无需后缀数组，额外空间 O(1)</text>
  <text x="320" y="552" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">顺序必须先判定后累入：判定时 nums[i] 尚未入左侧，恰好对应它已被删除</text>
</svg>
