<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">三种情况一览</text>

  <!-- 情况 1：唯一下降点在环绕处（已递增） -->
  <text x="30" y="70" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 下降点在环绕处</text>
  <rect x="150" y="48" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="48" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="48" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="71" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="225" y="71" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="277" y="71" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 300 44 C 330 22, 168 22, 198 46" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="435" y="46" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5 &gt; 1 也算下降点</text>
  <rect x="380" y="52" width="110" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="71" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 0</text>

  <!-- 情况 2：恰 1 个下降点 -->
  <text x="30" y="148" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② 下降点 1 个</text>
  <rect x="150" y="120" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="120" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="120" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="306" y="120" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="358" y="120" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="225" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="277" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="329" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="381" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 277 160 C 277 180, 329 180, 329 160" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="380" y="124" width="110" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">n−i−1 = 2</text>

  <!-- 情况 3：两个下降点 -->
  <text x="30" y="228" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 下降点 ≥2 个</text>
  <rect x="150" y="204" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="204" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="204" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="225" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="277" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 225 244 C 225 264, 277 264, 277 244" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 300 200 C 330 176, 372 176, 400 214" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">环形处又有一个：4 &gt; 2</text>
  <rect x="380" y="208" width="110" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 −1</text>

  <!-- 底部注解 -->
  <rect x="36" y="270" width="448" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">比较 i 与 (i+1) mod n：互异元素的环形序列必有下降点</text>
  <text x="260" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">恰 1 个 → 是某个递增数组旋转而来（n=1 无下降点，答案 0）</text>
</svg>
