<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：距离坍缩为 2 × 端点跨度</text>

  <!-- 数轴 -->
  <path d="M60 96 L462 96" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="120" cy="96" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="260" cy="96" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="96" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">p（左端）</text>
  <text x="260" y="122" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">q（中间）</text>
  <text x="400" y="122" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">r（右端）</text>
  <text x="190" y="82" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">q − p</text>
  <text x="330" y="82" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">r − q</text>

  <!-- 跨度标注 -->
  <path d="M120 136 L400 136" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M400 136 L120 136" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跨度 r − p</text>

  <!-- 公式框 -->
  <rect x="70" y="170" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">|i−j| + |j−k| + |k−i| = (q−p) + (r−q) + (r−p) = 2(r−p)</text>
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">中间下标 q 一加一减正好抵消 → 只要「存在」即可</text>

  <!-- 底部管线 -->
  <rect x="36" y="268" width="128" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">暴力枚举三元组</text>
  <text x="100" y="310" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">O(n³) ≈ 10¹⁵ ✗</text>

  <rect x="178" y="234" width="164" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">三个观察各砍一刀</text>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 距离 = 2 × 跨度</text>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 按值收集下标</text>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 组内只看相邻三个</text>

  <rect x="356" y="268" width="128" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一趟线性扫描</text>
  <text x="420" y="310" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">O(n) ✓</text>

  <path d="M100 332 Q 260 356 414 330" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
