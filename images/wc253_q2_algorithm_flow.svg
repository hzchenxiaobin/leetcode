<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="530" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：建大根堆 → k 轮摘堆顶减半 → 返回 sum</text>
  <path d="M 120 38 Q 320 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><ellipse cx="210" cy="68" rx="84" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="210" y="73" text-anchor="middle" font-size="13" fill="#2f5d25" filter="url(#sk)">开始：piles, k</text>
  <path d="M 210 92 L 210 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)"><rect x="90" y="110" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="210" y="132" text-anchor="middle" font-size="12.5" fill="#2b4a6b" filter="url(#sk)">pq ← 大根堆(piles)（O(n) 建堆）</text>
  <text x="210" y="152" text-anchor="middle" font-size="12.5" fill="#2b4a6b" filter="url(#sk)">sum ← Σ piles</text>
  <path d="M 210 166 L 210 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop guard -->
  <g filter="url(#sk)"><polygon points="210,186 278,218 210,250 142,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="210" y="223" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">k &gt; 0 ?</text>
  <text x="290" y="222" font-size="11.5" fill="#8a6d2f" filter="url(#sk)">否</text>
  <path d="M 278 218 L 512 218" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="212" y="266" font-size="11.5" fill="#8a6d2f" filter="url(#sk)">是</text>
  <path d="M 210 250 L 210 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- peek top -->
  <g filter="url(#sk)"><rect x="90" y="270" width="240" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="210" y="296" text-anchor="middle" font-size="12.5" fill="#2b4a6b" filter="url(#sk)">t ← 堆顶（当前最大）</text>
  <path d="M 210 312 L 210 328" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- t==1 check -->
  <g filter="url(#sk)"><polygon points="210,332 278,362 210,392 142,362" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="210" y="367" text-anchor="middle" font-size="12.5" fill="#8c3a36" filter="url(#sk)">堆顶 t = 1 ?</text>
  <text x="290" y="366" font-size="11.5" fill="#8c3a36" filter="url(#sk)">是</text>
  <text x="212" y="408" font-size="11.5" fill="#8a6d2f" filter="url(#sk)">否</text>
  <path d="M 210 392 L 210 408" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- break box -->
  <g filter="url(#sk)"><rect x="420" y="340" width="188" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="514" y="358" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#sk)">break：提前终止</text>
  <text x="514" y="376" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#sk)">（堆顶为 1 → 后续移除恒 0）</text>
  <path d="M 278 362 L 416 362" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- update -->
  <g filter="url(#sk)"><rect x="70" y="412" width="280" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="210" y="435" text-anchor="middle" font-size="12.5" fill="#2b4a6b" filter="url(#sk)">sum −= ⌊t/2⌋</text>
  <text x="210" y="457" text-anchor="middle" font-size="12.5" fill="#2b4a6b" filter="url(#sk)">堆顶 ← t − ⌊t/2⌋，k −−</text>

  <!-- loop back -->
  <path d="M 70 443 L 38 443 Q 30 443 30 435 L 30 226 Q 30 218 38 218 L 138 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="34" y="336" font-size="11" fill="#4a7a3a" filter="url(#sk)">下一轮</text>

  <!-- return -->
  <path d="M 512 218 L 512 285" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 514 384 L 514 450" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><ellipse cx="514" cy="478" rx="74" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="514" y="483" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#sk)">返回 sum</text>

  <!-- footer -->
  <text x="320" y="520" text-anchor="middle" font-size="11.5" fill="#8a8f98" filter="url(#sk)">建堆 O(n) + 每轮堆顶替换 O(log n) → 总时间 O(n + k log n)，sum 全程 O(1) 维护</text>
</svg>
