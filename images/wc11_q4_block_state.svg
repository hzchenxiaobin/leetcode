<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="392" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：只跟踪 s₂ 的匹配指针 p</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把 str1 按 s₁ 切块，每块扫完后唯一有用的状态就是 p ∈ [0, |s₂|)</text>

  <text x="44" y="74" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 块划分：str1 = s₁ s₁ … s₁（共 n₁ 块）</text>

  <rect x="52" y="82" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="92" y="105" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">s₁</text>
  <rect x="148" y="82" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="188" y="105" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">s₁</text>
  <rect x="244" y="82" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="284" y="105" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">s₁</text>
  <text x="340" y="107" font-size="14" fill="#888" filter="url(#rough2)">…</text>
  <rect x="356" y="82" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="406" y="105" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">第 n₁ 块</text>

  <path d="M 134 100 L 146 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 100 L 242 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="124" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="92" y="141" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">p₀ = 0</text>
  <rect x="156" y="124" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="188" y="141" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">p₁</text>
  <rect x="252" y="124" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="284" y="141" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">p₂</text>
  <rect x="374" y="124" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="406" y="141" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">pₙ</text>

  <rect x="44" y="158" width="512" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="180" font-size="9.8" fill="#8a3a36" filter="url(#rough2)">块内贪心：见到 s₂[p] 就吃掉并把 p 右移，永不回退；块数 n₁ 达 10⁶，逐块模拟 O(n₁·|s₁|) 会超时</text>

  <text x="44" y="216" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 状态只有 |s₂| 种 → 状态序列必然成环（鸽笼原理）</text>

  <ellipse cx="70" cy="256" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="260" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">p₀</text>
  <ellipse cx="158" cy="256" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="260" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">p₁</text>
  <ellipse cx="246" cy="256" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="260" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">p₂</text>
  <text x="288" y="261" font-size="14" fill="#888" filter="url(#rough2)">…</text>

  <path d="M 90 256 L 136 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 256 L 224 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="230" width="228" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="344" y="250" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">|s₂|+1 个状态落进 |s₂| 个取值里</text>
  <text x="344" y="270" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">→ 必有 a &lt; b 使 pₐ = p_b，第 a+1…b 块成环</text>

  <rect x="44" y="302" width="512" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">环一旦闭合：此后每 (b−a) 块完成的 s₂ 份数恒为 G = cnt_b − cnt_a，</text>
  <text x="58" y="340" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">于是可用 k = ⌊剩余块数 / (b−a)⌋ 一次跳完，剩余不足一环的块再逐块补算</text>

  <text x="300" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">复杂度：O(|s₂|·|s₁| + |s₂|)，与 n₁ 无关</text>
</svg>
