<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="356" fill="#fafafa"/>
  <text x="280" y="27" font-size="14" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">扩展：窗口边长可调时改用二维前缀和</text>
  <text x="280" y="47" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">每格 O(k²) 降为 O(1)，预处理一张 (m+1)×(n+1) 的表</text>
  <rect x="62" y="78" width="115" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="177" y="78" width="115" height="90" fill="#fff8e1" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="168" width="115" height="90" fill="#fff8e1" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="177" y="168" width="115" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="78" width="230" height="180" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="128" font-size="15" fill="#3a4a66" text-anchor="True" filter="url(#rough2)">A</text>
  <text x="234" y="128" font-size="15" fill="#3a4a66" text-anchor="True" filter="url(#rough2)">B</text>
  <text x="120" y="218" font-size="15" fill="#3a4a66" text-anchor="True" filter="url(#rough2)">C</text>
  <text x="234" y="218" font-size="15" fill="#8a3a36" text-anchor="True" filter="url(#rough2)">D</text>
  <text x="234" y="238" font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">( 查询区 )</text>
  <text x="318" y="96" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">查询区 D 的和等于</text>
  <text x="318" y="122" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">A+B+C+D  −  (A+B)  −  (A+C)  +  A</text>
  <text x="318" y="150" font-size="10" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">pre[r2+1][c2+1]  右下角</text>
  <text x="318" y="170" font-size="10" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">− pre[r1][c2+1]  上侧长条</text>
  <text x="318" y="190" font-size="10" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">− pre[r2+1][c1]  左侧长条</text>
  <text x="318" y="210" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">+ pre[r1][c1]    左上角加回</text>
  <rect x="40" y="282" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="304" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">区间和 = pre[r2+1][c2+1] − pre[r1][c2+1] − pre[r2+1][c1] + pre[r1][c1]</text>
  <text x="56" y="326" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">res[i][j] = 区间和 ÷ ((rHi−rLo+1)×(cHi−cLo+1))，分母照样随边界收缩</text>
</svg>
