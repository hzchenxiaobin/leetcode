<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">样例走查：s = 0 ? 1 ? ?（n = 5），逐组检查四个候选</text>
  <text x="360" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">候选串只由 (b1, b2) 决定；? 位置不构成任何限制，「成功」即整串与固定字符一致</text>

  <!-- 表头 -->
  <rect x="26" y="60" width="112" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="60" width="88" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="60" width="88" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="60" width="88" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="60" width="88" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="500" y="60" width="88" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="590" y="60" width="104" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">候选 (b1, b2)</text>
  <text x="184" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">1 位 s=0</text>
  <text x="274" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">2 位 s=?</text>
  <text x="364" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">3 位 s=1</text>
  <text x="454" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">4 位 s=?</text>
  <text x="544" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">5 位 s=?</text>
  <text x="642" y="77" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">结论</text>

  <!-- 第 1 行 (0,0)：00110 合法 -->
  <rect x="26" y="88" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="88" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="88" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="88" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="88" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="500" y="88" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="590" y="88" width="104" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="82" y="105" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">b1=0, b2=0</text>
  <text x="184" y="105" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0 ✓</text>
  <text x="274" y="105" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="364" y="105" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">1 ✓</text>
  <text x="454" y="105" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="544" y="105" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="642" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">✓ 00110</text>

  <!-- 第 2 行 (0,1)：01100 合法 -->
  <rect x="26" y="116" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="116" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="116" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="116" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="116" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="500" y="116" width="88" height="26" fill="#f2fbf4" stroke="#cbe3cd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="590" y="116" width="104" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="82" y="133" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">b1=0, b2=1</text>
  <text x="184" y="133" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0 ✓</text>
  <text x="274" y="133" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="364" y="133" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">1 ✓</text>
  <text x="454" y="133" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="544" y="133" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="642" y="133" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">✓ 01100</text>

  <!-- 第 3 行 (1,0)：1 位就冲突 -->
  <rect x="26" y="144" width="112" height="26" fill="#fdf0f2" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="144" width="88" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="144" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="144" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="144" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="500" y="144" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="590" y="144" width="104" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="82" y="161" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">b1=1, b2=0</text>
  <text x="184" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <text x="274" y="161" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">0</text>
  <text x="364" y="161" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">0</text>
  <text x="454" y="161" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">1</text>
  <text x="544" y="161" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">1</text>
  <text x="642" y="161" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">✗ 1 位不符</text>

  <!-- 第 4 行 (1,1)：同样 1 位冲突 -->
  <rect x="26" y="172" width="112" height="26" fill="#fdf0f2" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="172" width="88" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="172" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="320" y="172" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="172" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="500" y="172" width="88" height="26" fill="#fdf7f8" stroke="#ecd2d5" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="590" y="172" width="104" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="82" y="189" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">b1=1, b2=1</text>
  <text x="184" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <text x="274" y="189" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">1</text>
  <text x="364" y="189" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">0</text>
  <text x="454" y="189" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">0</text>
  <text x="544" y="189" text-anchor="middle" font-size="11" fill="#b0797c" filter="url(#rough2)">1</text>
  <text x="642" y="189" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">✗ 1 位不符</text>

  <rect x="26" y="210" width="668" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="227" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">两个候选通过 ⇒ ans = 2，正好是官方样例的 00110 与 01100</text>
  <text x="360" y="243" text-anchor="middle" font-size="9.5" fill="#9a7a30" filter="url(#rough2)">b1 一旦取 1，1 号位（固定为 0）立刻否掉整个候选：一半的枚举在第一位就结束</text>

  <!-- 第三个样例 -->
  <text x="26" y="278" font-size="11" font-weight="bold" fill="#444" filter="url(#rough2)">再看样例 3：s = 0 ? 0 ? ?（n = 5），同样的四个候选</text>

  <text x="40" y="302" font-size="10" fill="#555" filter="url(#rough2)">(0,0) → 00110：3 号位要求 1，但 s_3 = 0，冲突 ✗</text>
  <text x="40" y="322" font-size="10" fill="#555" filter="url(#rough2)">(0,1) → 01100：3 号位同样要求 1，冲突 ✗</text>
  <text x="40" y="342" font-size="10" fill="#555" filter="url(#rough2)">(1,0)、(1,1) → 1 号位就是 1，与 s_1 = 0 冲突 ✗</text>

  <rect x="26" y="356" width="668" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="378" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">四条全废 ⇒ ans = 0：奇链要求 s_3 = 1、偶链起点要求 s_1 = 0，两个约束无法同时满足</text>

  <text x="360" y="414" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">对照：若改成 s = ? ? ? ? ?，则四组全过，答案恰为 4（每组的 2^(#?) 种填法都收敛到同一串）</text>
  <text x="360" y="432" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">n = 2 时没有任何 i 满足 1 ≤ i ≤ n−2，四个候选全部合法，答案恒为 4</text>
</svg>
