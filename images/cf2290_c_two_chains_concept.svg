<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">可见结构：升序左链 + 唯一顶点 + 降序右链</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">左可见 ⟺ 前缀严格最大；右可见 ⟺ 后缀严格最大</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="68" y="76" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="90" y="104" fill="#3a5a30">1</text>
    <rect x="114" y="76" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="136" y="104" fill="#3a5a30">2</text>
    <rect x="160" y="76" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="182" y="104" fill="#3a5a30">3</text>
    <rect x="206" y="76" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="228" y="104" fill="#3a5a30">4</text>
    <rect x="252" y="76" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="274" y="104" fill="#3a5a30">5</text>
    <rect x="298" y="76" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="320" y="104" fill="#3a5a30">6</text>
    <rect x="344" y="76" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="366" y="104" fill="#8a6a20" font-weight="bold">9</text>
    <rect x="390" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="412" y="104" fill="#3a4a66">5</text>
    <rect x="436" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="458" y="104" fill="#3a4a66">5</text>
    <rect x="482" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="504" y="104" fill="#3a4a66">3</text>
    <rect x="528" y="76" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="550" y="104" fill="#3a4a66">1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#666">
    <text x="90" y="136">L</text>
    <text x="136" y="136">L</text>
    <text x="182" y="136">L</text>
    <text x="228" y="136">L</text>
    <text x="274" y="136">L</text>
    <text x="320" y="136">L</text>
    <text x="366" y="136" font-weight="bold" fill="#b85450">L R</text>
    <text x="412" y="136">·</text>
    <text x="458" y="136">R</text>
    <text x="504" y="136">R</text>
    <text x="550" y="136">R</text>
  </g>

  <path d="M 70 158 L 386 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 572 158 L 388 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="176" text-anchor="middle" font-size="10.5" fill="#3a5a30">左链：从头到尾严格递增</text>
  <text x="480" y="176" text-anchor="middle" font-size="10.5" fill="#3a4a66">右链：从尾到头严格递增</text>

  <rect x="52" y="196" width="516" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="68" y="218" font-size="11" fill="#8a6a20" font-weight="bold">每个高度 v 的贡献上界</text>
  <text x="68" y="238" font-size="10.5" fill="#555">左链中同高度至多 1 本（链上高度严格递增），右链同理；</text>
  <text x="68" y="256" font-size="10.5" fill="#555">故高度 v 至多贡献 min(cnt_v, 2) 本可见书。求和即得 k 的上界。</text>

  <rect x="52" y="288" width="516" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="68" y="310" font-size="10.5" fill="#3a5a30" font-weight="bold">示例（样例 5）：1 2 3 4 5 6 9 5 5 3 1</text>
  <text x="68" y="330" font-size="10.5" fill="#555">cnt = 1:2, 2:1, 3:2, 4:1, 5:3, 6:1, 9:1 → k = 2+1+2+1+2+1+1 = 10</text>

  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#999">同高度出现两次以上，就必然有一本“两边都排不进去”地挤进中间</text>
</svg>
