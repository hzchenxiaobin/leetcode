<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
  </defs>
  <rect width="680" height="410" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">长度奇偶定生死：偶数为 0，奇数是「AND 的高位前缀」</text>

  <!-- Panel A : even length -->
  <rect x="36" y="48" width="296" height="238" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">偶数长度：f = 0</text>
  <text x="184" y="94" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">例：[6, 5]　6 = 110，5 = 101</text>

  <text x="72" y="124" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">S</text>
  <rect x="84" y="106" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="126" y="106" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="106" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="101" y="125" fill="#2e6e2e" filter="url(#rough2)">0</text>
    <text x="143" y="125" fill="#2e6e2e" filter="url(#rough2)">1</text>
    <text x="185" y="125" fill="#2e6e2e" filter="url(#rough2)">1</text>
  </g>

  <text x="72" y="156" text-anchor="end" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">A</text>
  <rect x="84" y="138" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="126" y="138" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="138" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="101" y="157" fill="#a0761e" filter="url(#rough2)">1</text>
    <text x="143" y="157" fill="#a0761e" filter="url(#rough2)">0</text>
    <text x="185" y="157" fill="#b85450" filter="url(#rough2)">0</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="101" y="176" filter="url(#rough2)">位 2</text>
    <text x="143" y="176" filter="url(#rough2)">位 1</text>
    <text x="185" y="176" filter="url(#rough2)">位 0</text>
  </g>

  <text x="58" y="204" text-anchor="start" font-size="12" fill="#33517a" filter="url(#rough2)">长度为偶数 ⇒ 每一位的 1 都是偶数个</text>
  <text x="58" y="224" text-anchor="start" font-size="12" fill="#33517a" filter="url(#rough2)">⇒ AND 是 1 的位在 S 里一定是 0</text>
  <text x="58" y="244" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ t = MSB(S)，整个 S 被清空：f = 0</text>
  <text x="58" y="268" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">（把 5 加成 6，异或立刻变 0）</text>

  <!-- Panel B : odd length -->
  <rect x="348" y="48" width="296" height="238" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">奇数长度：f = A 高于 t 的部分</text>
  <text x="496" y="94" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">例：[5, 4, 6]　101，100，110</text>

  <text x="384" y="124" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">S</text>
  <rect x="396" y="106" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="438" y="106" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="480" y="106" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="413" y="125" fill="#2e6e2e" filter="url(#rough2)">1</text>
    <text x="455" y="125" fill="#2e6e2e" filter="url(#rough2)">1</text>
    <text x="497" y="125" fill="#2e6e2e" filter="url(#rough2)">1</text>
  </g>

  <text x="384" y="156" text-anchor="end" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">A</text>
  <rect x="396" y="138" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="438" y="138" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="480" y="138" width="34" height="26" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="413" y="157" fill="#a0761e" filter="url(#rough2)">1</text>
    <text x="455" y="157" fill="#a0761e" filter="url(#rough2)">0</text>
    <text x="497" y="157" fill="#bbb" filter="url(#rough2)">0</text>
  </g>
  <text x="530" y="157" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">← t = 1</text>
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="413" y="176" filter="url(#rough2)">位 2</text>
    <text x="455" y="176" filter="url(#rough2)">位 1</text>
    <text x="497" y="176" filter="url(#rough2)">位 0</text>
  </g>

  <text x="370" y="204" text-anchor="start" font-size="12" fill="#2e6e2e" filter="url(#rough2)">长度为奇数 ⇒ A 是 1 的位在 S 里也是 1</text>
  <text x="370" y="224" text-anchor="start" font-size="12" fill="#33517a" filter="url(#rough2)">t 之上 S 与 A 完全相同，t 位 A=0、S=1</text>
  <text x="370" y="244" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ f = A 抹掉不高于 t 的位 = 100 = 4</text>
  <text x="370" y="268" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">（同一区间也等于 4，见样例一）</text>

  <!-- bottom -->
  <rect x="36" y="300" width="608" height="94" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="324" text-anchor="start" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">两条结论合成一句话</text>
  <text x="56" y="348" text-anchor="start" font-size="12.5" fill="#8a4a44" filter="url(#rough2)">位 j 在 f 里为 1　⇔　AND 的第 j 位为 1，且 j 之上 XOR 与 AND 每一位都相等。</text>
  <text x="56" y="372" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">于是答案可以按位拆成 25 个「计数问题」：2 的 j 次幂 × 满足条件的区间个数。</text>
</svg>
