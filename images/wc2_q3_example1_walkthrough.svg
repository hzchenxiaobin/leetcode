<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：面积过关，角点异或也只剩四角</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5 个矩形 A–E，外接矩形 (1,1)–(4,4)</text>

  <g filter="url(#rough2)">
    <rect x="55" y="210" width="90" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="145" y="255" width="45" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="145" y="165" width="45" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="55" y="165" width="45" height="45" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="100" y="165" width="45" height="45" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="55" y="165" width="135" height="135" fill="none" stroke="#446688" stroke-width="2.2"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="100" y="260">A</text>
    <text x="167" y="283">B</text>
    <text x="167" y="214">C</text>
    <text x="77" y="192">D</text>
    <text x="122" y="192">E</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#888">
    <text x="55" y="316" text-anchor="middle">1</text>
    <text x="100" y="316" text-anchor="middle">2</text>
    <text x="145" y="316" text-anchor="middle">3</text>
    <text x="190" y="316" text-anchor="middle">4</text>
    <text x="48" y="304" text-anchor="end">1</text>
    <text x="48" y="259" text-anchor="end">2</text>
    <text x="48" y="214" text-anchor="end">3</text>
    <text x="48" y="169" text-anchor="end">4</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#777">
    <text x="215" y="118">角点</text>
    <text x="268" y="118">贡献矩形</text>
    <text x="332" y="118">奇偶</text>
    <text x="372" y="118">角点</text>
    <text x="425" y="118">贡献矩形</text>
    <text x="489" y="118">奇偶</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="215" y="140">(1,1)</text>
    <text x="268" y="140">A</text>
    <text x="332" y="140" fill="#b85450">奇 ✓</text>
    <text x="215" y="160">(1,3)</text>
    <text x="268" y="160">A,D</text>
    <text x="332" y="160">偶</text>
    <text x="215" y="180">(3,1)</text>
    <text x="268" y="180">A,B</text>
    <text x="332" y="180">偶</text>
    <text x="215" y="200">(3,3)</text>
    <text x="268" y="200">A,E</text>
    <text x="332" y="200">偶</text>
    <text x="215" y="220">(3,2)</text>
    <text x="268" y="220">B,C</text>
    <text x="332" y="220">偶</text>
    <text x="215" y="240">(4,1)</text>
    <text x="268" y="240">B</text>
    <text x="332" y="240" fill="#b85450">奇 ✓</text>

    <text x="372" y="140">(4,2)</text>
    <text x="425" y="140">B,C</text>
    <text x="489" y="140">偶</text>
    <text x="372" y="160">(3,4)</text>
    <text x="425" y="160">C,E</text>
    <text x="489" y="160">偶</text>
    <text x="372" y="180">(1,4)</text>
    <text x="425" y="180">D</text>
    <text x="489" y="180" fill="#b85450">奇 ✓</text>
    <text x="372" y="200">(2,3)</text>
    <text x="425" y="200">D,E</text>
    <text x="489" y="200">偶</text>
    <text x="372" y="220">(2,4)</text>
    <text x="425" y="220">D,E</text>
    <text x="489" y="220">偶</text>
    <text x="372" y="240">(4,4)</text>
    <text x="425" y="240">C</text>
    <text x="489" y="240" fill="#b85450">奇 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="215" y="264" width="365" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="228" y="284" font-size="10" fill="#8a6a20">面积：4 + 1 + 2 + 1 + 1 = 9</text>
    <text x="228" y="300" font-size="10" fill="#8a6a20">外接矩形 (1,1)–(4,4) → 3 × 3 = 9 ✓ 通过</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="215" y="322" width="365" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="228" y="342" font-size="10" fill="#3a5a30">剩余奇点 = {(1,1), (4,1), (1,4), (4,4)} = 外接四角 ✓</text>
    <text x="228" y="360" font-size="10" fill="#3a5a30" font-weight="bold">→ 返回 true</text>
  </g>

  <text x="215" y="392" font-size="9" fill="#999" filter="url(#rough2)">注：(3,1)、(3,3)、(3,2)、(3,4) 等点在共享边上出现两次，异或后抵消 —— 相邻不算重叠</text>
</svg>
