<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">计数 + 分组连排填回：算法流程</text>
  <path d="M 280 42 Q 470 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="820" height="96" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="88" font-size="14" font-weight="bold" fill="#2b6e9e">Step 1：一趟扫描，统计 freq 与 first</text>
  <text x="80" y="112" font-size="12" fill="#444">i 从 0 到 n−1：若 s[i] 是元音 → freq[s[i]]++；若首次遇到 → first[s[i]] = i</text>
  <text x="80" y="136" font-size="11" fill="#7a7a7a">只有 5 个元音 → 两个 26 桶计数数组即可；辅音不进表 → O(n)</text>

  <path d="M 470 160 L 470 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 2 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="176" width="820" height="96" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="202" font-size="14" font-weight="bold" fill="#2e6e2e">Step 2：对出现过的元音字符按 (freq 降序, first 升序) 排序</text>
  <text x="80" y="226" font-size="12" fill="#444">比较器：fa ≠ fb 时频率大者在前；频率相同时首现位置小者在前</text>
  <text x="80" y="250" font-size="11" fill="#7a7a7a">参与排序的 ≤ 5 个字符 → O(5 log 5) = O(1)；freq = 0 的字符排最后且展开为空</text>

  <path d="M 470 274 L 470 286" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 3 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="290" width="820" height="96" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="316" font-size="14" font-weight="bold" fill="#7a5415">Step 3：展开成「分组连排」序列 t</text>
  <text x="80" y="340" font-size="12" fill="#444">按排序结果依次拼接：每个元音字符连续重复 freq 次 → t = c₁^f₁ c₂^f₂ …</text>
  <text x="80" y="364" font-size="11" fill="#7a7a7a">|t| = 元音总数 m ≤ n；频率全相同时退化为按首现位置拼接 = 保持原相对顺序</text>

  <path d="M 470 388 L 470 400" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Step 4 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="404" width="820" height="96" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="80" y="430" font-size="14" font-weight="bold" fill="#5a3a7a">Step 4：第二趟扫描，依序填回元音槽位</text>
  <text x="80" y="454" font-size="12" fill="#444">指针 k = 0；i 从 0 到 n−1：若 s[i] 是元音 → s[i] = t[k++]；辅音跳过不动</text>
  <text x="80" y="478" font-size="11" fill="#7a7a7a">元音槽位数恰为 m，k 与槽位同步推进，不会越界 → O(n)</text>

  <!-- ===== 示例虚线框 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="520" width="820" height="98" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="544" font-size="13" font-weight="bold" fill="#2b2b2b">示例走查：s = "leetcode"</text>
  <text x="80" y="568" font-size="12" fill="#444">Step1: freq = {e:3, o:1}, first = {e:1, o:5} → Step2: e(3) &gt; o(1) → e 排前</text>
  <text x="80" y="590" font-size="12" fill="#444">Step3: t = "eeeo" → Step4: 槽位 1,2,5,7 依序填入 → 输出 <tspan fill="#2e6e2e" font-weight="bold">"leetcedo"</tspan></text>
  <text x="80" y="610" font-size="11" fill="#7a7a7a">复杂度：时间 O(n) | 额外空间 O(1)（C++ 原地）/ O(n)（Python 需转 list）</text>
</svg>
