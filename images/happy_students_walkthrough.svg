<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 2：nums = [6,0,3,3,6,7,2,7]，排序后逐个 k 判定</text>

  <!-- 排序后数组 -->
  <text x="36" y="70" font-size="11" fill="#999" filter="url(#rough2)">排序后</text>
  <rect x="44" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="98" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="152" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="206" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="233" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="260" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="314" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="368" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="422" y="48" width="54" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="71" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="125" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="179" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="233" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="287" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="341" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="395" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="449" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 表头 -->
  <text x="60" y="134" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">k</text>
  <text x="178" y="134" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">① k==0 或 nums[k−1] &lt; k</text>
  <text x="335" y="134" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">② k==n 或 nums[k] &gt; k</text>
  <text x="458" y="134" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">可行?</text>

  <!-- k = 0 -->
  <rect x="28" y="140" width="474" height="29" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="178" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k==0 ✓</text>
  <text x="335" y="160" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[0]=0 &gt; 0 ✗</text>
  <text x="458" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 1 可行 -->
  <rect x="28" y="172" width="474" height="29" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="178" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums[0]=0 &lt; 1 ✓</text>
  <text x="335" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums[1]=2 &gt; 1 ✓</text>
  <text x="458" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- k = 2 -->
  <rect x="28" y="204" width="474" height="29" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="178" y="224" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[1]=2 &lt; 2 ✗</text>
  <text x="335" y="224" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="458" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 3 -->
  <rect x="28" y="236" width="474" height="29" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="178" y="256" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[2]=3 &lt; 3 ✗</text>
  <text x="335" y="256" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="458" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 4 可行 -->
  <rect x="28" y="268" width="474" height="29" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="178" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums[3]=3 &lt; 4 ✓</text>
  <text x="335" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums[4]=6 &gt; 4 ✓</text>
  <text x="458" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- k = 5 -->
  <rect x="28" y="300" width="474" height="29" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="178" y="320" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[4]=6 &lt; 5 ✗</text>
  <text x="335" y="320" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="458" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 6 -->
  <rect x="28" y="332" width="474" height="29" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="178" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[5]=6 &lt; 6 ✗</text>
  <text x="335" y="352" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="458" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 7 -->
  <rect x="28" y="364" width="474" height="29" rx="5" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="384" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="178" y="384" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums[6]=7 &lt; 7 ✗</text>
  <text x="335" y="384" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="458" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- k = 8 可行 -->
  <rect x="28" y="396" width="474" height="29" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="178" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums[7]=7 &lt; 8 ✓</text>
  <text x="335" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k==n ✓</text>
  <text x="458" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 结论 -->
  <path d="M 265 428 L 265 444" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="448" width="360" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="480" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">可行 k = {1, 4, 8} ⟹ ans = 3</text>
</svg>
