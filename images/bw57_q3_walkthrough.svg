<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算表：示例 3 —— 净变化为 0 的端点也要断段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">segments = [[1,4,5],[1,4,7],[4,7,1],[4,7,11]]，期望输出两段而不是一段</text>

  <!-- 表头 -->
  <g font-size="12" font-weight="bold" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <rect x="60" y="60" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="150" y="60" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="270" y="60" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="410" y="60" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="105" y="80">位置 p</text>
    <text x="210" y="80">diff 事件</text>
    <text x="340" y="80">进入前 cur</text>
    <text x="460" y="80">输出段</text>
  </g>

  <!-- 行 1：p=1 -->
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <rect x="60" y="90" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="150" y="90" width="120" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="270" y="90" width="140" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="410" y="90" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="105" y="110">1</text>
    <text x="210" y="110">+5 +7</text>
    <text x="340" y="110">0</text>
    <text x="460" y="110">—（和 0 跳过）</text>
  </g>

  <!-- 行 2：p=4（重点行） -->
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <rect x="60" y="120" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="150" y="120" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="270" y="120" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="410" y="120" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="105" y="142" font-weight="bold">4</text>
    <text x="210" y="142" font-weight="bold">−5 −7 +1 +11 = 0</text>
    <text x="340" y="142" font-weight="bold">12</text>
    <text x="460" y="142" font-weight="bold">[1,4,12]</text>
  </g>

  <!-- 行 3：p=7 -->
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <rect x="60" y="154" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="150" y="154" width="120" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="270" y="154" width="140" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="410" y="154" width="100" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="105" y="174">7</text>
    <text x="210" y="174">−1 −11</text>
    <text x="340" y="174">12</text>
    <text x="460" y="174">[4,7,12]</text>
  </g>

  <!-- 注释 -->
  <path d="M 210 158 L 210 200" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="202" width="450" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="226" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">位置 4：净变化 = 0，mix 前后都是 12，</text>
  <text x="285" y="246" text-anchor="middle" font-size="12" fill="#8a6a1f" filter="url(#rough2)">但颜色集合 {5,7} → {1,11} 不同，必须断成两段 [1,4) 与 [4,7)</text>

  <!-- 结论 -->
  <rect x="60" y="282" width="450" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="306" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">正确输出：[[1,4,12],[4,7,12]]（两段）</text>
  <text x="285" y="326" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">若只按「diff ≠ 0」断段，会错误合并为 [1,7,12]（一段）——官方示例 3 的陷阱</text>
</svg>
