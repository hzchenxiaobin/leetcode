<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 306"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="306" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5,0,3,8,6] → 3</text>
  <rect x="60" y="58" width="70" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="150" y="58" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <rect x="270" y="58" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">prefixMax</text>
  <rect x="430" y="58" width="140" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">suffixMin[i+1]</text>
  <rect x="590" y="58" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="645.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="60" y="102" width="70" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="150" y="102" width="100" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="270" y="102" width="140" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="430" y="102" width="140" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="590" y="102" width="110" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="645.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 ≤ 0 ✗</text>
  <rect x="60" y="150" width="70" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="150" width="100" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="270" y="150" width="140" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="430" y="150" width="140" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="590" y="150" width="110" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="645.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 ≤ 3 ✗</text>
  <rect x="60" y="198" width="70" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="198" width="100" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="270" y="198" width="140" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="430" y="198" width="140" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="590" y="198" width="110" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="645.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 ≤ 6 ✓</text>
  <text x="350" y="286" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">切在 i=2 之后：left = [5,0,3]，right = [8,6]，长度 3</text>
</svg>
