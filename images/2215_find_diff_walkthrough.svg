<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums1 = [1,2,3,3]，nums2 = [1,1,2,2]</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- construction: nums1 -> S1 -->
  <text x="48" y="60" font-size="11" font-weight="bold" fill="#999" filter="url(#sk)">第一步 · 建集合（去重自动完成）</text>
  <g filter="url(#sk)">
    <rect x="48" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="84" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="120" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="156" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="64" y="86">1</text>
    <text x="100" y="86">2</text>
    <text x="136" y="86">3</text>
    <text x="172" y="86" fill="#9a6a15">3</text>
  </g>
  <path d="M 194 81 L 224 81" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="209" y="72" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">set( )</text>
  <g filter="url(#sk)">
    <rect x="230" y="68" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="266" y="68" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="302" y="68" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b6e9e" text-anchor="middle" font-family="monospace">
    <text x="246" y="86">1</text>
    <text x="282" y="86">2</text>
    <text x="318" y="86">3</text>
  </g>
  <text x="160" y="112" font-size="10.5" fill="#999" filter="url(#sk)">两个 3 → 只留一个：S1 = {1,2,3}</text>

  <!-- construction: nums2 -> S2 -->
  <g filter="url(#sk)">
    <rect x="370" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="406" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="442" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="478" y="68" width="32" height="26" rx="4" fill="#fff" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="386" y="86">1</text>
    <text x="422" y="86" fill="#9a6a15">1</text>
    <text x="458" y="86">2</text>
    <text x="494" y="86" fill="#9a6a15">2</text>
  </g>
  <path d="M 516 81 L 546 81" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="531" y="72" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">set( )</text>
  <g filter="url(#sk)">
    <rect x="552" y="68" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="588" y="68" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b6e9e" text-anchor="middle" font-family="monospace">
    <text x="568" y="86">1</text>
    <text x="604" y="86">2</text>
  </g>
  <text x="490" y="112" font-size="10.5" fill="#999" filter="url(#sk)">重复 1、2 各合并：S2 = {1,2}</text>

  <!-- table A: scan S1 -->
  <text x="203" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">第二步 · 扫描 S1（判 x ∈ S2 ?）</text>
  <g filter="url(#sk)">
    <rect x="48" y="146" width="70" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="118" y="146" width="110" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="228" y="146" width="130" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="48" y="174" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="118" y="174" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="228" y="174" width="130" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="48" y="202" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="118" y="202" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="228" y="202" width="130" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="48" y="230" width="70" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="118" y="230" width="110" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="228" y="230" width="130" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="83" y="165" font-weight="bold">x</text>
    <text x="173" y="165" font-weight="bold">x ∈ S2 ?</text>
    <text x="293" y="165" font-weight="bold">动作</text>
    <text x="83" y="193">1</text>
    <text x="173" y="193">在 ✓</text>
    <text x="293" y="193">跳过</text>
    <text x="83" y="221">2</text>
    <text x="173" y="221">在 ✓</text>
    <text x="293" y="221">跳过</text>
    <text x="83" y="249" font-weight="bold">3</text>
    <text x="173" y="249" font-weight="bold" fill="#2e6e2e">不在 ✗</text>
    <text x="293" y="249" font-weight="bold" fill="#2e6e2e">收入 answer[0]</text>
  </g>

  <!-- table B: scan S2 -->
  <text x="515" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">第三步 · 扫描 S2（判 x ∈ S1 ?）</text>
  <g filter="url(#sk)">
    <rect x="360" y="146" width="70" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="430" y="146" width="110" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="540" y="146" width="130" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="360" y="174" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="430" y="174" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="540" y="174" width="130" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="360" y="202" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="430" y="202" width="110" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="540" y="202" width="130" height="28" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="360" y="230" width="310" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="395" y="165" font-weight="bold">x</text>
    <text x="485" y="165" font-weight="bold">x ∈ S1 ?</text>
    <text x="605" y="165" font-weight="bold">动作</text>
    <text x="395" y="193">1</text>
    <text x="485" y="193">在 ✓</text>
    <text x="605" y="193">跳过</text>
    <text x="395" y="221">2</text>
    <text x="485" y="221">在 ✓</text>
    <text x="605" y="221">跳过</text>
    <text x="515" y="249" font-weight="bold" fill="#a04038">全部跳过 → answer[1] = [ ]</text>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="200" y="288" width="280" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="310" text-anchor="middle" font-size="13.5" font-family="monospace" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">answer = [[3], [ ]]</text>
  <text x="340" y="327" text-anchor="middle" font-size="10.5" fill="#777">answer[1] 为空列表是完全合法的输出</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="90" y="352" width="500" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#7a5415">去重由 set( ) 自动完成 —— 官方示例 2 的两个 3 正是此坑</text>
  <text x="340" y="388" text-anchor="middle" font-size="11" fill="#999">若暴力逐元素收集，须另建 seen 表判重，否则 3 会入答案两次</text>
</svg>
