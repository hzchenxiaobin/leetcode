<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">易错点：非递减（LNIS）用 upper_bound / bisect_right —— 等值元素才能延长子序列</text>
  <path d="M 110 42 Q 340 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11.5" fill="#888">链 S = [1,2,2,3] 本身已非递减 —— 正确答案 0；两种二分给出不同长度</text>

  <!-- ===== left panel: upper_bound (green) ===== -->
  <rect x="16" y="78" width="316" height="300" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="174" y="102" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">upper_bound / bisect_right ✓（找第一个 &gt; x）</text>

  <text x="36" y="133" font-size="10.5" fill="#333" font-weight="bold">x=1</text>
  <rect x="88" y="116" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="105" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="134" y="133" font-size="10" fill="#555">（空）→ 追加</text>

  <text x="36" y="171" font-size="10.5" fill="#333" font-weight="bold">x=2</text>
  <rect x="88" y="154" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="105" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="124" y="154" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="141" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="172" y="171" font-size="10" fill="#555">全部 ≤ 2 → 追加</text>

  <text x="36" y="209" font-size="10.5" fill="#333" font-weight="bold">x=2</text>
  <rect x="88" y="192" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="105" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="124" y="192" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="141" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="160" y="192" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="177" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="206" y="209" font-size="10" fill="#4a7a3a" font-weight="bold">没有 &gt; 2 → 追加 ✓</text>

  <text x="36" y="247" font-size="10.5" fill="#333" font-weight="bold">x=3</text>
  <rect x="88" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="105" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="124" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="141" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="160" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="177" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="196" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="213" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="242" y="247" font-size="10" fill="#555">追加</text>

  <rect x="36" y="272" width="276" height="32" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="174" y="293" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">LNIS = 4 → 改动 = 4 − 4 = 0 ✓</text>
  <text x="174" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a">等值 2 没有被顶掉，而是追加保留</text>
  <text x="174" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a">—— 这正是「非递减」的打开方式</text>

  <!-- ===== right panel: lower_bound (red) ===== -->
  <rect x="348" y="78" width="316" height="300" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="506" y="102" text-anchor="middle" font-size="12.5" fill="#8c3a36" font-weight="bold">lower_bound / bisect_left ✗（找第一个 ≥ x）</text>

  <text x="368" y="133" font-size="10.5" fill="#333" font-weight="bold">x=1</text>
  <rect x="420" y="116" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="437" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="466" y="133" font-size="10" fill="#555">（空）→ 追加</text>

  <text x="368" y="171" font-size="10.5" fill="#333" font-weight="bold">x=2</text>
  <rect x="420" y="154" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="437" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="456" y="154" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="473" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="504" y="171" font-size="10" fill="#555">没有 ≥ 2 → 追加</text>

  <text x="368" y="209" font-size="10.5" fill="#333" font-weight="bold">x=2</text>
  <rect x="420" y="192" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="437" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="456" y="192" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="473" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="504" y="209" font-size="10" fill="#b85450" font-weight="bold">命中 ≥ 2 → 替换 ✗ 长度没涨！</text>

  <text x="368" y="247" font-size="10.5" fill="#333" font-weight="bold">x=3</text>
  <rect x="420" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="437" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="456" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="473" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="492" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="509" y="248" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="538" y="247" font-size="10" fill="#555">追加 → 算出的是严格 LIS</text>

  <rect x="368" y="272" width="276" height="32" rx="6" fill="#fdfcf7" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="506" y="293" text-anchor="middle" font-size="12" fill="#8c3a36" font-weight="bold">长度 = 3 → 改动 = 4 − 3 = 1 ✗</text>
  <text x="506" y="330" text-anchor="middle" font-size="10.5" fill="#b85450">等值 2 被替换掉，丢了一次延长机会</text>
  <text x="506" y="348" text-anchor="middle" font-size="10.5" fill="#b85450">S 明明一个都不用改！低估 LNIS ⇒ 高估答案</text>

  <!-- ===== bottom note ===== -->
  <rect x="60" y="400" width="560" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="420" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">口诀：严格递增（LIS）配 lower_bound / bisect_left；非递减（LNIS）配 upper_bound / bisect_right</text>
  <text x="340" y="440" text-anchor="middle" font-size="10.5" fill="#557">一字之差 = 等值 x 到底是「替换等值结尾」还是「延长子序列」，直接决定 LNIS 算大算小</text>
</svg>
