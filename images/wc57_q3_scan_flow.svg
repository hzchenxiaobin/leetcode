<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：外层逐行、内层逐字符</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把 2×2 种「双字符标记」按状态分流，同一字符最多被访问一次</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="110" y="62" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="84" fill="#3a4a66">取下一行 line，i ← 0（buffer 不清空）</text>
  </g>

  <path d="M 280 96 L 280 104" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,106 428,140 280,174 132,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="145" text-anchor="middle" font-size="12" fill="#8a6a20">in_block ?</text>
  </g>

  <path d="M 132 140 L 132 190" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="118" y="168" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <path d="M 428 140 L 428 190" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="442" y="168" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="24" y="192" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="149" y="211" font-size="10.5" fill="#3a4a66">代码态：按顺序挑一个分支</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="226" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="38" y="246" font-size="10" fill="#3a5a30">① line[i..i+1] 是 /*  → 进块，i += 2</text>
    <rect x="24" y="262" width="250" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="38" y="282" font-size="10" fill="#8a3a36">② 是 //  → break，丢掉本行剩余</text>
    <rect x="24" y="298" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="38" y="318" font-size="10" fill="#3a4a66">③ 否则 → buffer += line[i]，i += 1</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="286" y="192" width="250" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="411" y="211" font-size="10.5" fill="#8a3a36">块注释态：只认一个标记</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="286" y="226" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="300" y="246" font-size="10" fill="#3a5a30">① line[i..i+1] 是 */  → 出块，i += 2</text>
    <rect x="286" y="262" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="300" y="282" font-size="10" fill="#3a4a66">② 否则 → i += 1（字符白白丢弃）</text>
  </g>

  <path d="M 149 334 L 149 352" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 411 296 L 411 330 L 300 330 L 300 352" stroke="#666" stroke-width="1.3" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="48" y="354" width="464" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="64" y="374" font-size="10" fill="#8a6a20">行末：in_block = false 且 buffer 非空 → buffer 输出为一行，然后清空</text>
    <text x="64" y="392" font-size="10" fill="#8a6a20">还有行 → 回到顶部取下一行；全部取完 → 返回结果数组</text>
  </g>

  <path d="M 520 372 L 520 79 L 456 79" stroke="#4a7a3a" stroke-width="1.3" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502" y="320" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <text x="280" y="424" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行内 while (i &lt; n)：每次要么 i += 1，要么 i += 2，要么 break —— 天然线性</text>
</svg>
