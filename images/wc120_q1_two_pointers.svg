<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="344" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">平方后是单谷序列：最大值只出现在两端</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">负数段的绝对值递减、正数段递增 —— 这就是双指针成立的根本原因</text>
  <text x="30" y="78" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">nums（已升序）</text>
  <rect x="30" y="90" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="59.0" y="114.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-4</text>
  <rect x="88" y="90" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="117.0" y="114.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="146" y="90" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="175.0" y="114.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="204" y="90" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="233.0" y="114.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="262" y="90" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="291.0" y="114.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="30" y="168" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">平方后先降后升（单谷）</text>
  <rect x="30" y="180" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="59.0" y="204.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="88" y="180" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="117.0" y="204.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="180" width="58" height="40" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="175.0" y="204.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="204" y="180" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="233.0" y="204.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="262" y="180" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="291.0" y="204.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="350" y="106" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">i →</text>
  <text x="350" y="130" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">← j</text>
  <text x="350" y="196" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">最大值只可能在两端</text>
  <text x="350" y="216" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">16 或 100</text>
  <rect x="30" y="252" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="273" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">双指针从两端取较大者，逆序填入结果数组</text><text x="40" y="288.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每取走一个端点，剩下的仍然「两端大、中间小」</text><text x="40" y="304.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">迭代 n 次即得非递减结果，复杂度 O(n)</text>
</svg>
