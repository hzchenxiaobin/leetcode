<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2.2" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">答案 = 每个房屋到最近供暖器距离的最大值</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">外层取 max（最难覆盖的房屋），内层取 min（最近的供暖器）</text>

  <!-- 数轴 -->
  <path d="M 50 176 L 520 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="180" font-size="11" fill="#666" filter="url(#rough2)">x</text>

  <!-- 刻度 -->
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.2" font-size="10" fill="#888" text-anchor="middle">
    <path d="M 90 171 L 90 181"/><text x="90" y="196">0</text>
    <path d="M 180 171 L 180 181"/><text x="180" y="196">1</text>
    <path d="M 270 171 L 270 181"/><text x="270" y="196">2</text>
    <path d="M 360 171 L 360 181"/><text x="360" y="196">3</text>
    <path d="M 450 171 L 450 181"/><text x="450" y="196">4</text>
  </g>

  <!-- 房屋（数轴上方）：位置 1,2,3,4 -->
  <g filter="url(#rough2)">
    <rect x="172" y="108" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <path d="M 180 124 L 180 170" stroke="#aabbcc" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="180" y="100" text-anchor="middle" font-size="10" fill="#446688">房屋 1</text>

    <rect x="262" y="108" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <path d="M 270 124 L 270 170" stroke="#aabbcc" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="270" y="100" text-anchor="middle" font-size="10" fill="#446688">房屋 2</text>

    <rect x="352" y="108" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <path d="M 360 124 L 360 170" stroke="#d8a8a4" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="360" y="100" text-anchor="middle" font-size="10" fill="#b85450">房屋 3</text>

    <rect x="442" y="108" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <path d="M 450 124 L 450 170" stroke="#aabbcc" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="450" y="100" text-anchor="middle" font-size="10" fill="#446688">房屋 4</text>
  </g>

  <!-- 供暖器（数轴下方）：位置 1,4 -->
  <g filter="url(#rough2)">
    <circle cx="180" cy="196" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="180" y="222" text-anchor="middle" font-size="10" fill="#8a6a20">供暖器</text>
    <circle cx="450" cy="196" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="450" y="222" text-anchor="middle" font-size="10" fill="#8a6a20">供暖器</text>
  </g>

  <!-- 最近距离标注：d = 0,1,1,0 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#4a7a3a">
    <path d="M 186 126 L 186 190" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dot)"/>
    <text x="192" y="152">d=0</text>
    <path d="M 276 126 L 194 192" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dot)"/>
    <text x="228" y="148">d=1</text>
    <path d="M 354 126 L 444 192" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#dot)"/>
    <text x="382" y="146" fill="#b85450">d=1</text>
    <path d="M 456 126 L 456 190" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dot)"/>
    <text x="462" y="152">d=0</text>
  </g>

  <!-- 公式框 -->
  <rect x="60" y="240" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="12.5" fill="#3a5a30">R* = max over 房屋 h ( min over 供暖器 t |h − t| )</text>

  <!-- 结论 -->
  <rect x="60" y="290" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="312" font-size="10.5" fill="#8a6a20">取 R* = 1：半径 1 覆盖全部房屋；半径 0 时房屋 2、3 无人供暖 → 1 就是最小值。</text>

  <text x="280" y="336" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">把「全局最小半径」拆成「每个房屋的最近距离」再取最大</text>
</svg>
