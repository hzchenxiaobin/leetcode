<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：配对按「值类」消耗，频次表一次算清</text>

  <!-- 左列：多重集 → 频次表 -->
  <text x="146" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">多重集 nums = [3,1,3,4,3]（示例 2）</text>

  <rect x="30" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="78" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="126" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="174" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="222" y="66" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M146,104 L146,126" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="120" font-size="11" fill="#999" filter="url(#rough2)">统计频次</text>

  <!-- 频次表 -->
  <rect x="40" y="132" width="76" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">值 v</text>
  <rect x="116" y="132" width="94" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">频次 freq[v]</text>

  <rect x="40" y="158" width="76" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="158" width="94" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">×1</text>

  <rect x="40" y="184" width="76" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="116" y="184" width="94" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">×3</text>

  <rect x="40" y="210" width="76" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="116" y="210" width="94" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">×1</text>

  <text x="125" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">freq = {1:1, 3:3, 4:1}</text>

  <!-- 右列：值类配对（k=6） -->
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">k = 6：值 v 只与补数 k−v 配对</text>

  <!-- 行 A：1 ↔ 5（补数缺失） -->
  <rect x="286" y="72" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <path d="M334,88 L376,88" stroke="#999" stroke-width="1.5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="72" width="44" height="32" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="402" y="93" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">5</text>
  <text x="436" y="93" font-size="12" fill="#333" filter="url(#rough2)">min(1, 0) = 0 对</text>

  <!-- 行 B：3 ↔ 3（自配对） -->
  <rect x="286" y="124" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <path d="M334,140 L376,140" stroke="#4a7a3a" stroke-width="2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">自配对</text>
  <rect x="380" y="124" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="436" y="145" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 // 2 = 1 对 ✓</text>

  <!-- 行 C：4 ↔ 2（补数缺失） -->
  <rect x="286" y="176" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <path d="M334,192 L376,192" stroke="#999" stroke-width="1.5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="176" width="44" height="32" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="402" y="197" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">2</text>
  <text x="436" y="197" font-size="12" fill="#333" filter="url(#rough2)">min(1, 0) = 0 对</text>

  <text x="420" y="230" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">虚线框 = 补数不在表中（该值类贡献 0 对）</text>

  <!-- 汇总公式 -->
  <rect x="70" y="264" width="420" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = Σ min(freq[v], freq[k−v]) + freq[k/2] // 2</text>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">= 0 + 1 + 0 = 1（示例 2 的答案，k 奇数时无末项）</text>

  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">每个值只属于一个值类 ⇒ 各值类独立结算、互不争抢，一次统计即全局最优</text>
</svg>
