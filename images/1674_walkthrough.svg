<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,2,4,3]，limit = 4</text>
  <path d="M 190 34 Q 320 42 450 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="64" y="46" width="246" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="187" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">数对① (1, 3)，和 = 4</text>
  <text x="187" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">改 1 个数的区间 [2, 7]</text>

  <g filter="url(#sk)">
    <rect x="330" y="46" width="246" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="453" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">数对② (2, 4)，和 = 6</text>
  <text x="453" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">改 1 个数的区间 [3, 8]</text>

  <g filter="url(#sk)">
    <rect x="92" y="112" width="70" height="28" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="162" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="222" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="282" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="342" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="402" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="462" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="522" y="112" width="60" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b4a66" text-anchor="middle" filter="url(#sk)">
    <text x="127" y="131">T</text>
    <text x="192" y="131">2</text>
    <text x="252" y="131">3</text>
    <text x="312" y="131">4</text>
    <text x="372" y="131">5</text>
    <text x="432" y="131">6</text>
    <text x="492" y="131">7</text>
    <text x="552" y="131">8</text>
  </g>

  <g filter="url(#sk)">
    <rect x="92" y="140" width="70" height="28" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="162" y="140" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="222" y="140" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="282" y="140" width="60" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="342" y="140" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="402" y="140" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="462" y="140" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="522" y="140" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <text x="127" y="159" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">数对①</text>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="192" y="159">1</text>
    <text x="252" y="159">1</text>
    <text x="312" y="159" font-weight="bold" fill="#3a7a3a">0</text>
    <text x="372" y="159">1</text>
    <text x="432" y="159">1</text>
    <text x="492" y="159">1</text>
    <text x="552" y="159">2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="92" y="168" width="70" height="28" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="162" y="168" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="222" y="168" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="282" y="168" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="342" y="168" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="402" y="168" width="60" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="462" y="168" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="522" y="168" width="60" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <text x="127" y="187" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">数对②</text>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="192" y="187">2</text>
    <text x="252" y="187">2</text>
    <text x="312" y="187">1</text>
    <text x="372" y="187">1</text>
    <text x="432" y="187" font-weight="bold" fill="#3a7a3a">0</text>
    <text x="492" y="187">1</text>
    <text x="552" y="187">1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="92" y="196" width="70" height="34" rx="3" fill="#f4e9d2" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="162" y="196" width="60" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="222" y="196" width="60" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="282" y="196" width="60" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="342" y="196" width="60" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="402" y="196" width="60" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="462" y="196" width="60" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="522" y="196" width="60" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="127" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818" filter="url(#sk)">总代价</text>
  <g font-size="14" fill="#7a5a18" text-anchor="middle" filter="url(#sk)">
    <text x="192" y="219">3</text>
    <text x="252" y="219">2</text>
    <text x="312" y="219" font-weight="bold" font-size="15" fill="#b85450">1 ★</text>
    <text x="372" y="219">2</text>
    <text x="432" y="219" font-weight="bold" font-size="15" fill="#b85450">1 ★</text>
    <text x="492" y="219">2</text>
    <text x="552" y="219">3</text>
  </g>

  <text x="320" y="256" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)"><tspan font-weight="bold" fill="#b85450">T = 4：</tspan>数对① 的 1+3=4 不动，数对② 把 4 改成 2 → [1,2,2,3]</text>
  <text x="320" y="276" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)"><tspan font-weight="bold" fill="#b85450">T = 6：</tspan>数对② 的 2+4=6 不动，数对① 把 1 改成 3 → [3,2,4,3]</text>

  <g filter="url(#sk)">
    <rect x="210" y="298" width="220" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="320" y="329" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = 1 ✓</text>

  <g filter="url(#sk)">
    <rect x="80" y="366" width="480" height="38" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="390" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">差分数组一遍前缀和即得整行“总代价”，无需对每个 T 重算全部数对</text>
</svg>
