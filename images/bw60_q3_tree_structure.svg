<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">数据结构：parent 数组 + children 邻接表 + lockUser 状态表</text>

  <!-- 树（示例 1 的 parent = [-1,0,0,1,1,2,2]） -->
  <text x="180" y="60" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">parent = [−1,0,0,1,1,2,2]</text>
  <g filter="url(#rough2)">
    <circle cx="180" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="100" cy="180" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="260" cy="180" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="60" cy="260" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="140" cy="260" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="220" cy="260" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="300" cy="260" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="163" y1="116" x2="118" y2="164" stroke="#446688" stroke-width="2"/>
    <line x1="197" y1="116" x2="242" y2="164" stroke="#446688" stroke-width="2"/>
    <line x1="85" y1="197" x2="68" y2="238" stroke="#446688" stroke-width="2"/>
    <line x1="115" y1="197" x2="130" y2="238" stroke="#446688" stroke-width="2"/>
    <line x1="242" y1="197" x2="226" y2="238" stroke="#446688" stroke-width="2"/>
    <line x1="278" y1="197" x2="294" y2="238" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="180" y="105" font-weight="bold">0</text>
    <text x="100" y="185" font-weight="bold">1</text><text x="260" y="185" font-weight="bold">2</text>
    <text x="60" y="265">3</text><text x="140" y="265">4</text><text x="220" y="265">5</text><text x="300" y="265">6</text>
  </g>
  <!-- 节点 4 上锁标记（官方示例 lock(4,5)） -->
  <g filter="url(#rough2)">
    <rect x="120" y="222" width="40" height="17" fill="#b85450" rx="8"/>
  </g>
  <text x="140" y="235" font-size="11" fill="#fff" text-anchor="middle" filter="url(#rough2)">user5</text>

  <!-- 右：三张表 -->
  <text x="440" y="60" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">构造时一次性建好</text>
  <g filter="url(#rough2)">
    <rect x="330" y="74" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#33506e">
    <text x="440" y="96" text-anchor="middle" font-weight="bold">parent[ ]：向上找祖先（O(树高)）</text>
    <text x="440" y="118" text-anchor="middle">upgrade 条件 2：一路上溯到根查锁</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="144" width="220" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#2d5a22">
    <text x="440" y="166" text-anchor="middle" font-weight="bold">children[ ]：父 → 子邻接表</text>
    <text x="440" y="188" text-anchor="middle">upgrade 条件 3：DFS/BFS 整棵子树找锁</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="214" width="220" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a5c1e">
    <text x="440" y="236" text-anchor="middle" font-weight="bold">lockUser[ ]：每节点 −1 或持有者</text>
    <text x="440" y="258" text-anchor="middle">lock/unlock 都是 O(1) 查表改表</text>
  </g>

  <!-- 底部：操作复杂度 -->
  <rect x="50" y="300" width="470" height="84" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="324" font-size="13" fill="#33506e" font-weight="bold" filter="url(#rough2)" text-anchor="middle">单次操作复杂度（n ≤ 2000，操作 ≤ 2000 次）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#33506e">
    <text x="285" y="348" text-anchor="middle">lock / unlock：O(1)　|　upgrade：O(n)（祖先链 + 子树遍历）</text>
    <text x="285" y="370" text-anchor="middle">最坏 2000×2000 = 4×10⁶ 次基本操作，数组实现轻松通过</text>
  </g>
</svg>
