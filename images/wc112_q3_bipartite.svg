<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">把「行」与「列」当节点，石头就是一条边</text>
  <circle cx="90" cy="70" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="75" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">行 0</text>
  <circle cx="90" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="155" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">行 1</text>
  <circle cx="90" cy="230" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="235" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">行 2</text>
  <circle cx="300" cy="70" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">列 0</text>
  <circle cx="300" cy="150" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="155" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">列 1</text>
  <circle cx="300" cy="230" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="235" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">列 2</text>
  <path d="M 112 70 L 278 70" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 112 70 L 278 150" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 112 150 L 278 70" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 112 150 L 278 230" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 112 230 L 278 150" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 112 230 L 278 230" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="44" text-anchor="middle" font-size="11" fill="#a9761f" filter="url(#rough2)">6 条边 = 6 块石头</text>
  <text x="195" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">整张图连通 ⇒ 1 个分量</text>
  <text x="195" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">可移除 = 6 − 1 = 5</text>
  <rect x="348" y="60" width="230" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="82" text-anchor="middle" font-size="11.5" fill="#a9761f" font-weight="bold" filter="url(#rough2)">一个连通分量里</text>
  <text x="463" y="104" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">有 k 块石头，</text>
  <text x="463" y="126" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">最多移除 k − 1 块（留一块垫底）</text>
  <rect x="348" y="172" width="230" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">块与块之间互不影响</text>
  <text x="463" y="216" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">答案 = Σ(k_i − 1)</text>
  <text x="463" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= n − 连通分量数</text>
</svg>
