<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">按值分桶：能配对 ⇔ 每个桶的计数是偶数</text>

  <!-- 数组 -->
  <text x="60" y="68" font-size="13" fill="#446688" filter="url(#rough2)">nums：</text>
  <g filter="url(#rough2)">
    <rect x="104" y="50" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="148" y="50" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="192" y="50" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="236" y="50" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="280" y="50" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="324" y="50" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="126" y="71">3</text><text x="170" y="71">2</text><text x="214" y="71">3</text>
    <text x="258" y="71">2</text><text x="302" y="71">2</text><text x="346" y="71">2</text>
  </g>

  <!-- 入桶箭头 -->
  <g filter="url(#rough2)">
    <path d="M 126 86 C 120 120, 100 140, 96 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 214 86 C 220 120, 236 140, 240 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 170 86 C 160 110, 156 130, 250 150 C 290 158, 340 160, 384 168" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>

  <!-- 计数桶 -->
  <g filter="url(#rough2)">
    <rect x="60" y="162" width="130" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
    <rect x="220" y="162" width="130" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="125" y="192">值 3</text>
    <text x="125" y="220">cnt = 2 ✓</text>
    <text x="285" y="192">值 2</text>
    <text x="285" y="220">cnt = 4 ✓</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#4a7a3a" text-anchor="middle">
    <text x="125" y="238">偶 → 1 对</text>
    <text x="285" y="238">偶 → 2 对</text>
  </g>

  <!-- 奇数桶的反例 -->
  <g filter="url(#rough2)">
    <rect x="386" y="162" width="150" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#6a3a36" text-anchor="middle">
    <text x="461" y="192">反例 [1,2,3,4]</text>
    <text x="461" y="216">四个桶 cnt 全 = 1</text>
    <text x="461" y="238">奇 → false</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="272" width="476" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="298" y="297" font-size="14" fill="#2a4a22" filter="url(#rough2)" text-anchor="middle">配对只发生在同值内部：所有计数为偶 ⇔ 可划分，返回 true</text>
</svg>
