<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">极差只由窗口的 max 与 min 决定</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">nums = [10, 1, 2, 4, 7, 2]，limit = 5；窗口 [2..5] = [2, 4, 7, 2] 的极差正好是 5</text>

  <!-- 合法窗口背景 -->
  <rect x="196" y="92" width="259" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <rect x="70" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="135" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="200" y="96" width="56" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="265" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="330" y="96" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="395" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="98" y="125" text-anchor="middle" font-size="16" fill="#2b4a6e" filter="url(#rough2)">10</text>
  <text x="163" y="125" text-anchor="middle" font-size="16" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="228" y="125" text-anchor="middle" font-size="16" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="293" y="125" text-anchor="middle" font-size="16" fill="#2b4a6e" filter="url(#rough2)">4</text>
  <text x="358" y="125" text-anchor="middle" font-size="16" fill="#2e5e22" filter="url(#rough2)">7</text>
  <text x="423" y="125" text-anchor="middle" font-size="16" fill="#2b4a6e" filter="url(#rough2)">2</text>

  <text x="98" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="163" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="228" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="293" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="358" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="423" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>

  <!-- 左右端点标注 -->
  <path d="M 200 172 L 200 184 L 451 184 L 451 172" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">left = 2</text>
  <text x="451" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">right = 5</text>

  <!-- 右侧极值说明 -->
  <rect x="500" y="88" width="238" height="96" rx="10" fill="#f2f6ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="112" font-size="13" fill="#2b4a6e" filter="url(#rough2)">max = nums[4] = 7</text>
  <text x="516" y="136" font-size="13" fill="#8a3a36" filter="url(#rough2)">min = nums[2] = 2</text>
  <text x="516" y="164" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">极差 7 − 2 = 5 ≤ 5 ✓</text>

  <!-- 两条单调性规则 -->
  <rect x="60" y="216" width="310" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">右端加入新元素</text>
  <text x="215" y="262" text-anchor="middle" font-size="12.5" fill="#33552a" filter="url(#rough2)">max 不减、min 不增</text>
  <text x="215" y="282" text-anchor="middle" font-size="12.5" fill="#33552a" filter="url(#rough2)">⇒ 极差只增不减</text>

  <rect x="390" y="216" width="310" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">左端删掉旧元素</text>
  <text x="545" y="262" text-anchor="middle" font-size="12.5" fill="#7d3b37" filter="url(#rough2)">max 不增、min 不减</text>
  <text x="545" y="282" text-anchor="middle" font-size="12.5" fill="#7d3b37" filter="url(#rough2)">⇒ 极差只减不增</text>

  <!-- 结论 -->
  <rect x="110" y="306" width="540" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="330" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#rough2)">所以 left 随 right 单调不减：每个 right 只有一个最小合法左端点 l_right</text>
  <text x="380" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">答案 = max over right of ( right − l_right + 1 )</text>

  <text x="380" y="384" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">单调性成立 ⇒ 双指针一次扫描，left 的总位移不超过 n</text>
</svg>
