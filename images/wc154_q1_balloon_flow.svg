<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次计数 + 五次除法 + 一次 min</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">O(n) 时间、O(1) 空间，不需要模拟、不需要枚举答案</text>

  <!-- step 1 -->
  <rect x="90" y="66" width="380" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="86" font-size="11" fill="#2f4460" font-weight="bold">① 建立计数表</text>
  <text x="106" y="104" font-size="10.5" fill="#444">int cnt[26] = {0}；for (c : text) cnt[c − 'a']++</text>

  <path d="M 280 116 L 280 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="90" y="142" width="380" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="162" font-size="11" fill="#3a5a30" font-weight="bold">② 只取 5 个有用字母</text>
  <text x="106" y="181" font-size="10.5" fill="#444">b = cnt[1]，a = cnt[0]，l = cnt[11] / 2，o = cnt[14] / 2，n = cnt[13]</text>
  <text x="106" y="196" font-size="10" fill="#888">注意：只有 l、o 需要整除 2（整数除法天然向下取整）</text>

  <path d="M 280 206 L 280 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="90" y="228" width="380" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="106" y="248" font-size="11" fill="#8a6a20" font-weight="bold">③ 取最小值作为瓶颈</text>
  <text x="106" y="266" font-size="10.5" fill="#444">return min({b, a, l, o, n})</text>

  <path d="M 280 278 L 280 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="150" y="300" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#8a3a36">返回最多能拼出的 "balloon" 个数</text>

  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#999">任意顺序遍历 text 都得到同一张计数表，故结果与字母位置无关</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">剪枝（可选）：答案不会超过 ⌊n / 7⌋</text>
</svg>
