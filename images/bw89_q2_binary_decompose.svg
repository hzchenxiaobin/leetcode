<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">n = 15 的二进制分解与同底数幂</text>

  <g filter="url(#rough2)">
    <rect x="120" y="50" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="76" text-anchor="middle" font-size="14" fill="#1a2b45" filter="url(#rough2)">15 = 1 + 2 + 4 + 8 = 1111₂</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#rough2)">
      <rect x="80" y="110" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    </g>
    <text x="125" y="132">2⁰ = 1</text>
    <g filter="url(#rough2)">
      <rect x="185" y="110" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    </g>
    <text x="230" y="132">2¹ = 2</text>
    <g filter="url(#rough2)">
      <rect x="290" y="110" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    </g>
    <text x="335" y="132">2² = 4</text>
    <g filter="url(#rough2)">
      <rect x="395" y="110" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    </g>
    <text x="440" y="132">2³ = 8</text>
  </g>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">powers = [1, 2, 4, 8]（非递减、个数最少、构造唯一）</text>

  <path d="M 280 178 L 280 204" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="196" font-size="12" fill="#b85450" filter="url(#rough2)">只看指数！</text>

  <g filter="url(#rough2)">
    <rect x="90" y="210" width="380" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="234" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">区间乘积 = 同底数幂相乘 = 指数相加</text>
  <text x="280" y="256" text-anchor="middle" font-size="13.5" fill="#7a5a14" filter="url(#rough2)">2·4·8 = 2^(1+2+3) = 2^6 = 64</text>

  <g filter="url(#rough2)">
    <rect x="60" y="288" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="280" y="310" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">乘积 ≈ 2^400（n = 10⁹ 时指数和几百）</text>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">→ 前缀和管「指数」，快速幂管「取模」</text>
</svg>
