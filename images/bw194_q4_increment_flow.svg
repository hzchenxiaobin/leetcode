<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：主循环每步的两侧增量更新与桶乘积</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">断点集合每步只变一个元素：重建 = 扫 26 槽 + 排序 + 差分，O(26) 级</text>

  <!-- 预处理框 -->
  <rect x="150" y="58" width="340" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">预处理：nxtSame[i] = 下一个相同字符位置</text>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">curNext[c] = 各字符从位置 1 起的首次出现</text>
  <path d="M320,100 L320,116" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 主循环框 -->
  <rect x="96" y="122" width="448" height="240" rx="10" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="128" y="140" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">for j = 0 … n−2（右侧起点 p = j+1）</text>

  <rect x="116" y="148" width="408" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① lastPos[s[j]] = j —— 左断点集合唯一变化，新值必为最大</text>
  <path d="M320,188 L320,200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="116" y="202" width="408" height="40" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 收集断点：lastPos 中非 −1 值降序为 L₁&gt;…&gt;L_m</text>
  <text x="320" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">curNext 中非 n 值升序为 N₁&lt;…&lt;N_r</text>
  <path d="M320,242 L320,254" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="116" y="256" width="408" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 桶乘积：ans += (L_d − L_{d+1}) × (N_{d+1} − N_d)</text>
  <text x="320" y="295" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">d = 1 … min(m, r)；哨兵 L_{m+1} = −1，N_{r+1} = n</text>
  <path d="M320,296 L320,308" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="116" y="310" width="408" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="335" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ curNext[s[j+1]] = nxtSame[j+1] —— 右断点唯一变化</text>
  <text x="320" y="348" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">s[p] 的首现必是 p 自己，直接换成下一次出现</text>

  <!-- 循环回边 -->
  <path d="M524,330 L560,330 Q572,330 572,318 L572,148 Q572,136 560,136 L532,136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="592" y="240" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">j++</text>

  <!-- 出口 -->
  <path d="M320,362 L320,378" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="374" font-size="10" fill="#888" filter="url(#rough2)">j = n−1 结束</text>
  <rect x="200" y="382" width="240" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">返回 ans（全同串可达 ≈1.67×10¹⁴，long long）</text>

  <text x="320" y="448" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步 O(26)，总计 O(26n) ≈ 2.6×10⁶ 次槽位扫描（n = 10⁵）</text>
</svg>
