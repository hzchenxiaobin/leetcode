<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两个目标各扫一趟，取最小与 k 比较</text>

  <!-- 左列：主流程 -->
  <rect x="40" y="44" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">输入 nums（只含 ±1）、k</text>

  <path d="M 148 74 L 148 90" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="94" width="216" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">① target = +1：一趟 O(n) 扫描</text>
  <text x="148" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">→ ops₊（不可达记 ∞）</text>

  <path d="M 148 138 L 148 154" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="158" width="216" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">② target = −1：一趟 O(n) 扫描</text>
  <text x="148" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">→ ops₋（不可达记 ∞）</text>

  <path d="M 148 202 L 148 218" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="222" width="216" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">ans = min(ops₊, ops₋)</text>

  <path d="M 148 254 L 148 270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="274" width="156" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="148" y="294" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">ans ≤ k ？</text>

  <path d="M 100 306 Q 92 314 88 326" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 306 Q 204 314 208 326" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="330" width="98" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="89" y="349" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true</text>
  <rect x="158" y="330" width="98" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="207" y="349" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- 右列：扫描内部 -->
  <rect x="288" y="60" width="244" height="304" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一趟扫描的内部（对每个 target）</text>

  <rect x="300" y="96" width="220" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="116" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">扫描规则（每个位置 i）</text>
  <text x="310" y="134" font-size="10.5" fill="#333" filter="url(#rough2)">flipped = 位置 i 被操作 i−1 连带翻转？</text>
  <text x="310" y="152" font-size="10.5" fill="#333" filter="url(#rough2)">当前值 v = nums[i] × (−1)^flipped</text>

  <rect x="300" y="178" width="220" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="198" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">失配（v ≠ target）</text>
  <text x="310" y="216" font-size="10.5" fill="#333" filter="url(#rough2)">操作 i 被迫执行：ops++，</text>
  <text x="310" y="232" font-size="10.5" fill="#333" filter="url(#rough2)">flipped = true（失配右推给 i+1）</text>
  <text x="310" y="252" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">若 i = n−1 仍失配：末位修不掉，</text>
  <text x="310" y="268" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">该目标不可达，记 ∞</text>

  <rect x="300" y="286" width="220" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="306" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">匹配（v = target）</text>
  <text x="310" y="324" font-size="10.5" fill="#333" filter="url(#rough2)">不操作：flipped = false</text>
  <text x="310" y="342" font-size="10.5" fill="#333" filter="url(#rough2)">（i+1 不被连带翻转）</text>

  <path d="M 256 116 L 284 120" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 256 180 L 284 188" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
