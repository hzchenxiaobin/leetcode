<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">插入保序的“前缀陷阱”：为何需要 weight ≥ 1</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">引理 2 要求：等得分的 A &lt; B（非前缀）⇒ 插入同一个 x 后仍 A' &lt; B'；前缀情形是唯一漏洞</text>

  <!-- 左半：正常情形 -->
  <text x="165" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">① 非前缀：保序成立 ✓</text>

  <g filter="url(#rough2)"><rect x="55" y="94" width="106" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="108" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">A = [1,5]</text>
  <g filter="url(#rough2)"><rect x="175" y="94" width="106" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="228" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">B = [1,6]</text>
  <text x="165" y="146" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">等得分、A &lt; B（首位分叉 5 &lt; 6，非前缀）</text>

  <path d="M 165 158 L 165 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="178" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">插入 x = 3</text>

  <g filter="url(#rough2)"><rect x="55" y="192" width="106" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="108" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">A' = [1,3,5]</text>
  <g filter="url(#rough2)"><rect x="175" y="192" width="106" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="228" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">B' = [1,3,6]</text>
  <text x="165" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">A' &lt; B' ✓ 保序</text>

  <!-- 右半：陷阱情形 -->
  <text x="478" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 前缀情形：保序失效 ✗（本题被排除）</text>

  <g filter="url(#rough2)"><rect x="375" y="94" width="96" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="423" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">A = [1]</text>
  <g filter="url(#rough2)"><rect x="485" y="94" width="106" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="538" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">B = [1,2]</text>
  <text x="478" y="146" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">仅当 w(idx2) = 0 时才能等分（1 + 0 = 1）</text>

  <path d="M 478 158 L 478 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="509" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">插入 x = 3</text>

  <g filter="url(#rough2)"><rect x="375" y="192" width="96" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="423" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">A' = [1,3]</text>
  <g filter="url(#rough2)"><rect x="485" y="192" width="106" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="538" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">B' = [1,2,3]</text>
  <text x="478" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">A' &gt; B' ✗ 保序失效！</text>

  <!-- 中间分隔虚线 -->
  <path d="M 320 70 L 320 258" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <g filter="url(#rough2)"><rect x="42" y="272" width="556" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">本题 weight ≥ 1 ⇒ 得分并列的两方案不可能互为子集</text>
  <text x="320" y="314" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">（下标集合被包含者恰少若干个区间，每个至少贡献 1 分，得分必严格更小）</text>
  <text x="320" y="328" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">⇒ 等分方案之间“前缀 = 子集”情形不存在，引理 2 始终适用，min 一把梭正确</text>
</svg>
