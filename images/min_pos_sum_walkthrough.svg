<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 演算：nums = [3, −2, 1, 4]，l = 2，r = 3</text>

  <!-- header -->
  <rect x="45" y="60" width="430" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">子数组</text>
  <text x="210" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">长度</text>
  <text x="275" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">和</text>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">和 &gt; 0 ?</text>
  <text x="425" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- row 1: winner -->
  <rect x="45" y="90" width="430" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">[3, −2]</text>
  <text x="210" y="118" text-anchor="middle" font-size="13" fill="#2d5a20" filter="url(#rough2)">2</text>
  <text x="275" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <text x="340" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="425" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">+∞ → 1</text>

  <!-- row 2 -->
  <rect x="45" y="136" width="430" height="46" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[−2, 1]</text>
  <text x="210" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="340" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="425" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <rect x="45" y="182" width="430" height="46" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1, 4]</text>
  <text x="210" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="340" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="425" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1（不更新）</text>

  <!-- row 4 -->
  <rect x="45" y="228" width="430" height="46" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[3, −2, 1]</text>
  <text x="210" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="275" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="340" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="425" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1（不更新）</text>

  <!-- row 5 -->
  <rect x="45" y="274" width="430" height="46" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[−2, 1, 4]</text>
  <text x="210" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="275" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="425" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1（不更新）</text>

  <!-- result boxes -->
  <rect x="45" y="340" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">示例 1 答案 = 1</text>
  <rect x="265" y="340" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="370" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">示例 2 答案 = −1</text>

  <!-- note -->
  <text x="260" y="406" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 2 中 [−2,2] 与 [2,−3,1] 的和恰好为 0，不满足「严格大于 0」</text>
  <text x="260" y="426" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">哨兵 +∞ 未被更新 ⇒ 返回 −1</text>
</svg>
