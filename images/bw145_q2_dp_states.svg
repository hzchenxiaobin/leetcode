<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">子集 DP：dp[S] = 破完集合 S 的最小耗时</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按 |S| 分层，每次只多破一把锁；n = 3 时共 8 个状态</text>

  <rect x="245" y="62" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">空集</text>
  <text x="222" y="83" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">|S|=0</text>

  <rect x="105" y="132" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="153" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{0}</text>
  <rect x="245" y="132" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{1}</text>
  <rect x="385" y="132" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="153" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">{2}</text>
  <text x="82" y="153" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">|S|=1</text>

  <rect x="105" y="212" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="233" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{0,1}</text>
  <rect x="245" y="212" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">{0,2}</text>
  <rect x="385" y="212" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="233" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">{1,2}</text>
  <text x="82" y="233" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">|S|=2</text>

  <rect x="245" y="292" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">{0,1,2}</text>
  <text x="222" y="313" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">|S|=3</text>

  <path d="M 262 94 L 150 130" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 94 L 280 128" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 298 94 L 410 130" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 130 164 L 130 208" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 155 164 L 265 208" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 164 L 150 208" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 164 L 408 208" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 164 L 296 208" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 164 L 430 208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 130 244 L 265 288" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 244 L 158 288" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 244 L 296 288" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="36" y="332" width="488" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">转移：dp[S ∪ {i}] = min(dp[S] + 上取整(strength[i] / (1 + |S|·k)))</text>
</svg>
