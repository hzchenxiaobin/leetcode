<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="432" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：head = [0,1,2,3,4]，nums = [0,3,1,4]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">S = {0,1,3,4}，逐节点检查「属于 S 且后继不属于 S」</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="30" y="68" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="62" y="89" fill="#3a4a66" filter="url(#rough2)">节点</text>
    <rect x="94" y="68" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="126" y="89" fill="#3a4a66" filter="url(#rough2)">val</text>
    <rect x="158" y="68" width="84" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="200" y="89" fill="#3a4a66" filter="url(#rough2)">val ∈ S</text>
    <rect x="242" y="68" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="290" y="89" fill="#3a4a66" filter="url(#rough2)">next.val</text>
    <rect x="338" y="68" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="386" y="89" fill="#3a4a66" filter="url(#rough2)">next ∈ S</text>
    <rect x="434" y="68" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="482" y="89" fill="#3a4a66" filter="url(#rough2)">计入 ans</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="30" y="100" width="64" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="94" y="100" width="64" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="158" y="100" width="84" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="242" y="100" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="338" y="100" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="434" y="100" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <text x="62" y="124" fill="#444" filter="url(#rough2)">i=0</text>
    <text x="126" y="124" fill="#444" filter="url(#rough2)">0</text>
    <text x="200" y="124" fill="#444" filter="url(#rough2)">是</text>
    <text x="290" y="124" fill="#444" filter="url(#rough2)">1</text>
    <text x="386" y="124" fill="#444" filter="url(#rough2)">是</text>
    <text x="482" y="124" fill="#444" filter="url(#rough2)">否</text>
    <rect x="30" y="138" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="94" y="138" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="158" y="138" width="84" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="242" y="138" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="338" y="138" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="434" y="138" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="62" y="162" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">i=1</text>
    <text x="126" y="162" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="200" y="162" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">是</text>
    <text x="290" y="162" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="386" y="162" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">否</text>
    <text x="482" y="162" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">是</text>
    <rect x="30" y="176" width="64" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="94" y="176" width="64" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="158" y="176" width="84" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="242" y="176" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="338" y="176" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="434" y="176" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <text x="62" y="200" fill="#444" filter="url(#rough2)">i=2</text>
    <text x="126" y="200" fill="#444" filter="url(#rough2)">2</text>
    <text x="200" y="200" fill="#444" filter="url(#rough2)">否</text>
    <text x="290" y="200" fill="#444" filter="url(#rough2)">3</text>
    <text x="386" y="200" fill="#444" filter="url(#rough2)">是</text>
    <text x="482" y="200" fill="#444" filter="url(#rough2)">否</text>
    <rect x="30" y="214" width="64" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="94" y="214" width="64" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="158" y="214" width="84" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="242" y="214" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="338" y="214" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <rect x="434" y="214" width="96" height="38" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
    <text x="62" y="238" fill="#444" filter="url(#rough2)">i=3</text>
    <text x="126" y="238" fill="#444" filter="url(#rough2)">3</text>
    <text x="200" y="238" fill="#444" filter="url(#rough2)">是</text>
    <text x="290" y="238" fill="#444" filter="url(#rough2)">4</text>
    <text x="386" y="238" fill="#444" filter="url(#rough2)">是</text>
    <text x="482" y="238" fill="#444" filter="url(#rough2)">否</text>
    <rect x="30" y="252" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="94" y="252" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="158" y="252" width="84" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="242" y="252" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="338" y="252" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="434" y="252" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="62" y="276" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">i=4</text>
    <text x="126" y="276" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4</text>
    <text x="200" y="276" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">是</text>
    <text x="290" y="276" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">尾节点</text>
    <text x="386" y="276" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">—</text>
    <text x="482" y="276" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">是</text>
  </g>

  <rect x="30" y="302" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="324" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">计数过程</text>
  <text x="46" y="344" font-size="10" fill="#555" filter="url(#rough2)">i=1：val=1 ∈ S，next.val=2 ∉ S → 段尾，ans 从 0 变 1（组件 [0,1] 结束）</text>
  <text x="46" y="362" font-size="10" fill="#555" filter="url(#rough2)">i=4：val=4 ∈ S，next 为空 → 段尾，ans 从 1 变 2（组件 [3,4] 结束）</text>
  <text x="46" y="378" font-size="10" fill="#888" filter="url(#rough2)">其余节点：i=0、i=3 的后继仍在 S 中；i=2 本身不在 S 中（它把链表断开）</text>

  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">nums 的原始顺序 [0,3,1,4] 与链表顺序无关——只关心「值是否在集合里」</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案 2 与官方输出一致</text>
</svg>
