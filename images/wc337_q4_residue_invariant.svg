<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="660" height="430" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：加减 value 不改变余数 —— 元素只能在同余类内移动</text>
  <path d="M 150 44 Q 330 52 508 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top info boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="285" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="182" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">每次操作 ±value ⟹ 余数不变</text>
  <text x="182" y="112" text-anchor="middle" font-size="11.5" fill="#446688">x mod value 是操作下的「不变量」</text>

  <g filter="url(#sk)">
    <rect x="345" y="58" width="285" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="487" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">类内任取：可变成任何非负同余数</text>
  <text x="487" y="112" text-anchor="middle" font-size="11.5" fill="#4a7a3a">余 r 的元素担任 r, r+v, r+2v, r+3v, …</text>

  <!-- number line: value = 5, class r = 2 -->
  <text x="330" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">实例：value = 5，取元素 7（7 mod 5 = 2），同余类 = {…, −3, 2, 7, 12, …}</text>

  <path d="M 56 258 Q 340 252 614 260" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- gray dots: unreachable integers -->
  <g filter="url(#sk)" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2">
    <circle cx="80" cy="258" r="6"/>
    <circle cx="110" cy="258" r="6"/>
    <circle cx="140" cy="258" r="6"/>
    <circle cx="170" cy="258" r="6"/>
    <circle cx="200" cy="258" r="6"/>
    <circle cx="230" cy="258" r="6"/>
    <circle cx="260" cy="258" r="6"/>
    <circle cx="290" cy="258" r="6"/>
    <circle cx="320" cy="258" r="6"/>
    <circle cx="350" cy="258" r="6"/>
    <circle cx="380" cy="258" r="6"/>
    <circle cx="410" cy="258" r="6"/>
    <circle cx="440" cy="258" r="6"/>
    <circle cx="470" cy="258" r="6"/>
    <circle cx="500" cy="258" r="6"/>
    <circle cx="530" cy="258" r="6"/>
    <circle cx="560" cy="258" r="6"/>
    <circle cx="590" cy="258" r="6"/>
  </g>
  <text x="230" y="286" text-anchor="middle" font-size="10" fill="#8a8a84" filter="url(#sk)">灰点 = 余数不同，永远变不到</text>
  <text x="545" y="286" text-anchor="middle" font-size="10" fill="#8a8a84" filter="url(#sk)">（0、1、3、4 都在此列）</text>

  <!-- class circles (r = 2 mod 5) -->
  <g filter="url(#sk)">
    <circle cx="155" cy="258" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="155" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">−3</text>
  <text x="155" y="263" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#sk)">−3</text>

  <g filter="url(#sk)">
    <circle cx="305" cy="258" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="305" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">2</text>
  <text x="305" y="263" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#sk)">2</text>

  <g filter="url(#sk)">
    <circle cx="455" cy="258" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <text x="455" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">7 ∈ nums</text>
  <text x="455" y="263" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">7</text>

  <g filter="url(#sk)">
    <circle cx="605" cy="258" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="605" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">12</text>
  <text x="605" y="263" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#sk)">12</text>

  <!-- hop arrows within class -->
  <path d="M 440 232 Q 380 200 322 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="380" y="212" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">−value（一次）</text>

  <path d="M 474 232 Q 540 200 592 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="536" y="212" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">+value（一次）</text>

  <path d="M 290 232 Q 224 206 170 232" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="230" y="206" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">再 −value</text>

  <text x="76" y="234" font-size="13" fill="#8a8a84" filter="url(#sk)">…</text>
  <text x="622" y="234" font-size="13" fill="#8a8a84" filter="url(#sk)">…</text>

  <!-- bottom takeaway strip -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="580" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">想覆盖靶点 t，只需要「某个元素 ≡ t (mod value)」</text>
  <text x="330" y="382" text-anchor="middle" font-size="11.5" fill="#a07818">与元素的初始大小、正负统统无关 —— 整个数组压缩成计数向量 cnt[0..value−1]</text>
</svg>
