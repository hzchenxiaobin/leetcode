<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：coins = [[1,3,2],[5,6,4],[8,10,1]]，k = 4</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">排序后三段区间：[1,3]×2、[5,6]×4、[8,10]×1；pre = [0, 6, 14, 17]</text>

  <!-- 数轴格子：坐标 1..12 -->
  <!-- v 的格子左边缘 x = 62 + (v-1)*40，宽 40 -->
  <g filter="url(#rough2)"><rect x="62" y="96" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="102" y="96" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="142" y="96" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="182" y="96" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="222" y="96" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="262" y="96" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="302" y="96" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="342" y="96" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="382" y="96" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="422" y="96" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="462" y="96" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="502" y="96" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/></g>

  <!-- 袋内硬币数 -->
  <text x="82" y="117" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="122" y="117" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="162" y="117" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="202" y="117" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="242" y="117" text-anchor="middle" font-size="12" fill="#2c5f2c" filter="url(#rough2)">4</text>
  <text x="282" y="117" text-anchor="middle" font-size="12" fill="#2c5f2c" filter="url(#rough2)">4</text>
  <text x="322" y="117" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="362" y="117" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="402" y="117" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="442" y="117" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="482" y="117" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="522" y="117" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- 坐标刻度 -->
  <text x="82" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="122" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="162" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="202" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">4</text>
  <text x="242" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="282" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">6</text>
  <text x="322" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">7</text>
  <text x="362" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">8</text>
  <text x="402" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">9</text>
  <text x="442" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">10</text>
  <text x="482" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">11</text>
  <text x="522" y="152" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">12</text>

  <!-- 最优窗口 [3,6] -->
  <g filter="url(#rough2)"><rect x="142" y="88" width="160" height="50" rx="6" fill="none" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="222" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">窗口 [3, 6]（右端贴 r₁ = 6）</text>

  <path d="M 222 138 C 222 168 150 172 128 186" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="52" y="188" width="176" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="140" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 + 0 + 4 + 4 = 10 ★</text>

  <!-- 候选窗口表 -->
  <text x="300" y="196" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2n = 6 个候选窗口逐一求值：</text>

  <!-- 表头 -->
  <g filter="url(#rough2)"><rect x="300" y="204" width="112" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="412" y="204" width="112" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="524" y="204" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="356" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">对齐方式</text>
  <text x="468" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">窗口</text>
  <text x="556" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">硬币</text>

  <!-- 行 1 -->
  <g filter="url(#rough2)"><rect x="300" y="226" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="412" y="226" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="524" y="226" width="64" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <text x="356" y="241" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">右端贴 r₀=3</text>
  <text x="468" y="241" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[0, 3]</text>
  <text x="556" y="241" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">6</text>

  <!-- 行 2 最优 -->
  <g filter="url(#rough2)"><rect x="300" y="248" width="112" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="412" y="248" width="112" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="524" y="248" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="356" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">右端贴 r₁=6</text>
  <text x="468" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">[3, 6]</text>
  <text x="556" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">10 ★</text>

  <!-- 行 3 -->
  <g filter="url(#rough2)"><rect x="300" y="270" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="412" y="270" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="524" y="270" width="64" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <text x="356" y="285" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">右端贴 r₂=10</text>
  <text x="468" y="285" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[7, 10]</text>
  <text x="556" y="285" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>

  <!-- 行 4 -->
  <g filter="url(#rough2)"><rect x="300" y="292" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="412" y="292" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="524" y="292" width="64" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <text x="356" y="307" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">左端贴 l₀=1</text>
  <text x="468" y="307" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[1, 4]</text>
  <text x="556" y="307" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">6</text>

  <!-- 行 5 -->
  <g filter="url(#rough2)"><rect x="300" y="314" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="412" y="314" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="524" y="314" width="64" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <text x="356" y="329" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">左端贴 l₁=5</text>
  <text x="468" y="329" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[5, 8]</text>
  <text x="556" y="329" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">9</text>

  <!-- 行 6 -->
  <g filter="url(#rough2)"><rect x="300" y="336" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="412" y="336" width="112" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="524" y="336" width="64" height="22" fill="#fafafa" stroke="#999" stroke-width="1"/></g>
  <text x="356" y="351" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">左端贴 l₂=8</text>
  <text x="468" y="351" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">[8, 11]</text>
  <text x="556" y="351" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>

  <!-- 三段式演算框 -->
  <g filter="url(#rough2)"><rect x="52" y="240" width="176" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="140" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">[3,6] 的三段式求和（趟 A，i=1）</text>
  <text x="140" y="274" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">L = 6−4+1 = 3</text>
  <text x="140" y="288" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">left = 0（r₀=3 ≥ 3）</text>
  <text x="140" y="302" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">整段：pre[2]−pre[1] = 8</text>
  <text x="140" y="316" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">部分：2×(3−max(1,3)+1) = 2</text>
  <text x="140" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">合计 8 + 2 = 10</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)"><rect x="52" y="366" width="536" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">答案 = max{6, 10, 3, 6, 9, 3} = 10</text>
  <text x="320" y="398" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">左端对齐的最优 [5,8] = 9 略逊 —— 两趟都必须跑，缺一不可</text>

  <text x="320" y="440" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">注意：输入未必按 l 有序（本例 [8,10] 排在最前），先排序再扫描</text>
</svg>
