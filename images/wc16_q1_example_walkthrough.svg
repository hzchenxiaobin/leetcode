<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "DDIDI"，n = 6</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始 res 就是最省事的升序；每遇到一段 D，把它覆盖的格子倒序</text>

  <!-- 表头 -->
  <rect x="40" y="60" width="78" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">步骤</text>
  <rect x="118" y="60" width="262" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="249" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">动作（指针 i 的推进）</text>
  <rect x="380" y="60" width="140" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">res</text>

  <!-- 第 1 行：初始 -->
  <rect x="40" y="90" width="78" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="117" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="118" y="90" width="262" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="130" y="117" font-size="10" fill="#555" filter="url(#rough2)">i = 0，res 取升序 1…6</text>
  <rect x="380" y="90" width="140" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="450" y="117" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1 2 3 4 5 6</text>

  <!-- 第 2 行 -->
  <rect x="40" y="134" width="78" height="44" fill="#fff8e1" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="161" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">① i = 0</text>
  <rect x="118" y="134" width="262" height="44" fill="#fff8e1" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="130" y="155" font-size="10" fill="#8a6a20" filter="url(#rough2)">s[0] = 'D'，D 段 s[0..1]，j = 2</text>
  <text x="130" y="170" font-size="10" fill="#8a6a20" filter="url(#rough2)">翻转 1,2,3（3 个数）</text>
  <rect x="380" y="134" width="140" height="44" fill="#fff8e1" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="450" y="161" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3 2 1 4 5 6</text>

  <!-- 第 3 行 -->
  <rect x="40" y="178" width="78" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="205" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">② i = 2</text>
  <rect x="118" y="178" width="262" height="44" fill="#e6f4ea" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="130" y="205" font-size="10" fill="#3a5a30" filter="url(#rough2)">s[2] = 'I'：不动，i → 3</text>
  <rect x="380" y="178" width="140" height="44" fill="#e6f4ea" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="450" y="205" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3 2 1 4 5 6</text>

  <!-- 第 4 行 -->
  <rect x="40" y="222" width="78" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="249" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">③ i = 3</text>
  <rect x="118" y="222" width="262" height="44" fill="#fff8e1" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="130" y="243" font-size="10" fill="#8a6a20" filter="url(#rough2)">s[3] = 'D'，D 段 s[3..3]，j = 4</text>
  <text x="130" y="258" font-size="10" fill="#8a6a20" filter="url(#rough2)">翻转 4,5（2 个数）</text>
  <rect x="380" y="222" width="140" height="44" fill="#fff8e1" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="450" y="249" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3 2 1 5 4 6</text>

  <!-- 第 5 行 -->
  <rect x="40" y="266" width="78" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="293" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">④ i = 4</text>
  <rect x="118" y="266" width="262" height="44" fill="#fce4ec" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="130" y="293" font-size="10" fill="#8a3a36" filter="url(#rough2)">s[4] = 'I'：i → 5 = |s|，扫描结束</text>
  <rect x="380" y="266" width="140" height="44" fill="#fce4ec" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="450" y="293" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3 2 1 5 4 6</text>

  <rect x="40" y="322" width="480" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">校验与最优性</text>
  <text x="56" y="358" font-size="10" fill="#555" filter="url(#rough2)">3 &gt; 2 &gt; 1 &lt; 5 &gt; 4 &lt; 6 恰好对应 D D I D I；且 s[0..1] 是两个 D，</text>
  <text x="56" y="372" font-size="10" fill="#555" filter="url(#rough2)">首位不可能取 1 或 2，只能取 3 → 该结果即字典序最小。</text>
</svg>
