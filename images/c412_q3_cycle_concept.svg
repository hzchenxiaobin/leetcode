<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8e5db8"/>
    </marker>
  </defs>

  <rect width="960" height="545" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：停机条件把 10^9 次操作切成「便宜模拟 + 周期快进」</text>
  <path d="M 240 42 Q 480 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左：阶段一 堆模拟 ============ -->
  <text x="240" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">阶段一：堆模拟（真值比较，不取模）</text>

  <g font-size="14">
    <rect x="109" y="84" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="132" y="105" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="163" y="84" width="46" height="32" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="186" y="105" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="217" y="84" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="240" y="105" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="271" y="84" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="294" y="105" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="325" y="84" width="46" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
    <text x="348" y="105" text-anchor="middle" fill="#2e6e2e" font-weight="bold">6</text>
  </g>
  <g font-size="9" fill="#999">
    <text x="132" y="130" text-anchor="middle">0</text>
    <text x="186" y="130" text-anchor="middle">1</text>
    <text x="240" y="130" text-anchor="middle">2</text>
    <text x="294" y="130" text-anchor="middle">3</text>
    <text x="348" y="130" text-anchor="middle">4</text>
  </g>
  <text x="186" y="78" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">min</text>
  <text x="348" y="78" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">mx</text>

  <rect x="60" y="144" width="370" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="245" y="166" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">继续条件：堆顶 × m ≤ mx（如 1×2 = 2 ≤ 6 ✓）</text>

  <g font-size="11.5" fill="#444">
    <text x="68" y="204">① 乘积 ≤ mx ⇒ 最大值恒不变，真值 ≤ 10^9 不溢出</text>
    <text x="68" y="226">② m ≥ 2 ⇒ 每乘一次至少翻倍 ⇒ 每元素至多被乘 ~30 次</text>
    <text x="68" y="248" fill="#2e6e2e" font-weight="bold">③ 模拟总步数 ≤ 30n ≈ 3×10^5，与 k 无关</text>
    <text x="68" y="270">④ 全程用真值：取模会破坏大小关系（10^9+8 → 1）</text>
  </g>

  <!-- 过渡箭头 -->
  <path d="M 430 330 C 458 330, 472 330, 498 330" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="466" y="316" text-anchor="middle" font-size="10.5" fill="#c98a2b" font-weight="bold">堆顶×m &gt; mx</text>
  <text x="466" y="348" text-anchor="middle" font-size="10.5" fill="#c98a2b">触发停机</text>

  <!-- ============ 右：阶段二 周期轮转 ============ -->
  <text x="712" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">阶段二：周期轮转（剩余 k 次整块快进）</text>

  <rect x="530" y="82" width="384" height="32" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="722" y="103" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">停机时刻：不止 min，所有 y 都满足 y × m &gt; mx</text>

  <circle cx="712" cy="240" r="88" fill="none" stroke="#c4c4c4" stroke-width="1" stroke-dasharray="4 4" filter="url(#sk)"/>

  <g font-size="11.5">
    <rect x="684" y="138" width="56" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" filter="url(#sk)"/>
    <text x="712" y="156" text-anchor="middle" fill="#7a5415" font-weight="bold">(4,0)</text>
    <rect x="768" y="199" width="56" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="796" y="217" text-anchor="middle" fill="#2b4a6e">(4,1)</text>
    <rect x="736" y="297" width="56" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="764" y="315" text-anchor="middle" fill="#2b4a6e">(5,3)</text>
    <rect x="632" y="297" width="56" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="660" y="315" text-anchor="middle" fill="#2b4a6e">(6,2)</text>
    <rect x="600" y="199" width="56" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
    <text x="628" y="217" text-anchor="middle" fill="#2b4a6e">(6,4)</text>
  </g>

  <g stroke="#8e5db8" stroke-width="1.8" fill="none" filter="url(#sk)">
    <path d="M 750.5 160.9 A 88 88 0 0 1 775.3 178.8" marker-end="url(#arP)"/>
    <path d="M 799.1 252.2 A 88 88 0 0 1 789.7 281.3" marker-end="url(#arP)"/>
    <path d="M 727.3 326.7 A 88 88 0 0 1 696.7 326.7" marker-end="url(#arP)"/>
    <path d="M 634.3 281.3 A 88 88 0 0 1 624.9 252.2" marker-end="url(#arP)"/>
    <path d="M 648.7 178.8 A 88 88 0 0 1 673.5 160.9" marker-end="url(#arP)"/>
  </g>

  <text x="712" y="228" text-anchor="middle" font-size="12.5" fill="#5a3a7a" font-weight="bold">一轮 = n 次</text>
  <text x="712" y="246" text-anchor="middle" font-size="10.5" fill="#5a3a7a">全体各乘一次 m</text>
  <text x="712" y="263" text-anchor="middle" font-size="10.5" fill="#5a3a7a">次序复原 → 永续</text>

  <text x="712" y="354" text-anchor="middle" font-size="11" fill="#444">此后每次操作取「当前最小」，乘后甩开所有未乘者（&gt; mx）</text>
  <text x="712" y="372" text-anchor="middle" font-size="11" fill="#5a3a7a" font-weight="bold">→ 操作顺序 = (值, 下标) 升序循环，周期 n</text>

  <!-- 底部公式框 -->
  <rect x="60" y="395" width="840" height="130" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="480" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">剩余 k 次的分配：k = q·n + r</text>
  <text x="480" y="446" text-anchor="middle" font-size="12" fill="#444">每人再乘 m^q；升序前 r 名多乘一次 m</text>
  <text x="480" y="472" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">ans[i] = x · m^(q + [rank &lt; r]) mod (10^9+7)</text>
  <text x="480" y="498" text-anchor="middle" font-size="11.5" fill="#888">指数 q ≤ 10^9 交给快速幂 O(log k)；k 提前用完时 q = r = 0，公式退化为 x mod p</text>
  <text x="480" y="518" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">10^9 次操作 = 3×10^5 步模拟 + n 个快速幂</text>
</svg>
