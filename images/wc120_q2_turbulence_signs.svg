<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把数组压成符号序列，湍流 = 符号严格交替</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">9,4,2 是连续下降（− −），所以最长段从下标 1 开始</text>
  <text x="30" y="76" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">arr</text>
  <rect x="30" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="55.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="80" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="105.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="130" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="155.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="180" y="86" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="205.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="230" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="255.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="280" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="305.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="330" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="355.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="380" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="405.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="430" y="86" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="455.0" y="109.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="80" y="152" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="130" y="152" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="180" y="152" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="230" y="152" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="280" y="152" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="330" y="152" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="380" y="152" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">−</text>
  <text x="430" y="152" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="30" y="196" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">符号序列</text>
  <rect x="30" y="208" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="125.0" y="228.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">− + − + 交替段</text>
  <text x="232" y="230" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">对应子数组 4,2,10,7,8 → 长度 5</text>
  <rect x="30" y="262" width="500" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="283" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">0 表示相等：任何跨越它的子数组都不可能是湍流</text><text x="40" y="298.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">相邻符号必须不同（严格交替），连续两个 − 或 + 都要断开</text><text x="40" y="314.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">问题化为：符号序列里最长的「交替且无零」连续段</text>
</svg>
