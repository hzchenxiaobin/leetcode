<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="370" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两种操作：反转前 k 个字符，或反转后 k 个字符</text>
  <text x="310" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = "dcab"，以 k = 3 为例</text>
  <rect x="150" y="88" width="54" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="177" y="118" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="177" y="154" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="214" y="88" width="54" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="241" y="118" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="241" y="154" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="278" y="88" width="54" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="118" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="305" y="154" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=2</text>
  <rect x="342" y="88" width="54" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="369" y="118" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="369" y="154" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=3</text>
  <path d="M 150 164 L 150 182 L 342 182 L 342 164" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="246" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前 3 个</text>
  <rect x="60" y="214" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="170" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">反转前 3 个："dca" → "acd"</text>
  <text x="170" y="254" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">结果 "acdb"  ← 答案</text>
  <path d="M 214 164 L 214 182 L 406 182 L 406 164" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">后 3 个</text>
  <rect x="300" y="214" width="260" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="236" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">反转后 3 个："cab" → "bac"</text>
  <text x="430" y="254" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">结果 "dbac"</text>
  <rect x="60" y="288" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="312" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">候选总数只有 2n 个：k = 1..n，方向 2 种</text>
  <text x="78" y="334" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">k = n 时两种操作相同（都反转整个串）；k = 1 时结果就是原串</text>
</svg>
