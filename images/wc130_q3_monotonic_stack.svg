<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">单调栈：栈里保存「还在等答案」的下标</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">遇到更大的值，就把它前面所有更小的等待者一次性结算</text>
  <rect x="40.0" y="84.0" width="70.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="75.0" y="112.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="75.0" y="148.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=0</text>
  <rect x="118.0" y="84.0" width="70.0" height="46.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="153.0" y="112.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="153.0" y="148.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=1</text>
  <rect x="196.0" y="84.0" width="70.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="231.0" y="112.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="231.0" y="148.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=2</text>
  <rect x="274.0" y="84.0" width="70.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="309.0" y="112.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="309.0" y="148.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=3</text>
  <rect x="352.0" y="84.0" width="70.0" height="46.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="387.0" y="112.1" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="387.0" y="148.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=4</text>
  <text x="450.0" y="112.0" font-size="12" fill="#888" text-anchor="start" filter="url(#rough2)">a[]</text>
  <rect x="40.0" y="176.0" width="120.0" height="44.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100.0" y="201.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">栈（自底→顶）</text>
  <rect x="172.0" y="176.0" width="46.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="195.0" y="202.8" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="230.0" y="176.0" width="46.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="253.0" y="202.8" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="288.0" y="176.0" width="46.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="311.0" y="202.8" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 352.0 198.0 L 386.0 198.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="390.0" y="172.0" width="170.0" height="52.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475.0" y="194.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">读到 5：弹出 3、4</text>
  <text x="475.0" y="208.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans[3] = ans[2] = 5</text>
  <text x="25.0" y="256.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">· 栈内值单调不增：新值若更大，会把比它小的元素连环弹走；</text>
  <text x="25.0" y="282.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">· 每个下标只入栈、出栈各一次 ⇒ 均摊 O(n)，与暴力 O(n^2) 拉开差距。</text>
  <rect x="40.0" y="300.0" width="510.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="295.0" y="325.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">相等值不弹栈（严格大于才算下一个更大节点）</text>
</svg>
