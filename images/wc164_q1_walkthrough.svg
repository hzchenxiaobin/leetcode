<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：points = [[1,1],[3,4],[-1,0]]</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">逐段算 max(|dx|,|dy|)，两段相加即答案</text>

  <!-- 点位卡片 -->
  <rect x="34" y="70" width="104" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="86" y="90" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">A (1, 1)</text>
  <text x="86" y="107" text-anchor="middle" font-size="9.5" fill="#666">起点</text>

  <path d="M 140 93 L 204 93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="86" text-anchor="middle" font-size="9.5" fill="#446688">3 秒</text>

  <rect x="206" y="70" width="104" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="258" y="90" text-anchor="middle" font-size="11.5" fill="#2f4f6f" font-weight="bold">B (3, 4)</text>
  <text x="258" y="107" text-anchor="middle" font-size="9.5" fill="#666">第 2 个点</text>

  <path d="M 312 93 L 376 93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="86" text-anchor="middle" font-size="9.5" fill="#446688">4 秒</text>

  <rect x="378" y="70" width="120" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="438" y="90" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">C (-1, 0)</text>
  <text x="438" y="107" text-anchor="middle" font-size="9.5" fill="#666">终点</text>

  <!-- 走查表 -->
  <rect x="60" y="146" width="444" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="92" y="167" text-anchor="middle" font-size="10.5" fill="#2f4f6f">段</text>
  <text x="200" y="167" text-anchor="middle" font-size="10.5" fill="#2f4f6f">起点 → 终点</text>
  <text x="300" y="167" text-anchor="middle" font-size="10.5" fill="#2f4f6f">|dx|</text>
  <text x="356" y="167" text-anchor="middle" font-size="10.5" fill="#2f4f6f">|dy|</text>
  <text x="412" y="167" text-anchor="middle" font-size="10.5" fill="#2f4f6f">max</text>
  <text x="472" y="167" text-anchor="middle" font-size="10.5" fill="#2f4f6f">累计</text>

  <rect x="60" y="178" width="444" height="36" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="92" y="201" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <text x="200" y="201" text-anchor="middle" font-size="10.5" fill="#555">(1,1) → (3,4)</text>
  <text x="300" y="201" text-anchor="middle" font-size="10.5" fill="#555">|3-1| = 2</text>
  <text x="356" y="201" text-anchor="middle" font-size="10.5" fill="#555">|4-1| = 3</text>
  <text x="412" y="201" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <text x="472" y="201" text-anchor="middle" font-size="10.5" fill="#555">3</text>

  <rect x="60" y="214" width="444" height="36" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="92" y="237" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <text x="200" y="237" text-anchor="middle" font-size="10.5" fill="#555">(3,4) → (-1,0)</text>
  <text x="300" y="237" text-anchor="middle" font-size="10.5" fill="#555">|-1-3| = 4</text>
  <text x="356" y="237" text-anchor="middle" font-size="10.5" fill="#555">|0-4| = 4</text>
  <text x="412" y="237" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4</text>
  <text x="472" y="237" text-anchor="middle" font-size="10.5" fill="#555">3+4=7</text>

  <rect x="60" y="250" width="444" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="92" y="272" text-anchor="middle" font-size="10.5" fill="#8a6a20">合计</text>
  <text x="200" y="272" text-anchor="middle" font-size="10.5" fill="#8a6a20">2 段，各 3 秒与 4 秒</text>
  <text x="360" y="272" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">3 + 4 = 7 秒</text>

  <text x="60" y="310" font-size="10" fill="#999">第 1 段：对角走 2 步到 (3,3)，再竖直 1 步到 (3,4)</text>
  <text x="60" y="328" font-size="10" fill="#999">第 2 段：dx 与 dy 都是 4，全走对角线即可，耗时 4 秒</text>

  <!-- 对照：错误做法 -->
  <rect x="60" y="344" width="444" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="362" font-size="10.5" fill="#8a3a36" font-weight="bold">易错：不能因为线段「顺路」就跳过中间点</text>
  <text x="74" y="379" font-size="10" fill="#555">A→C 直接走只需 max(2,1)=2 秒，但 B 必须先被访问，否则 B 不计入有效访问</text>
</svg>
