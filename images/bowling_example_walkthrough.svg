<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="474" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：示例 4 的 73 vs 75，一轮「余热」定胜负</text>
  <path d="M 140 34 Q 320 40 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

