<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 486" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="660" height="486" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：滚动数组 + 前缀和差分，把每层从 O(k·target) 压到 O(target)</text>
  <rect x="40" y="64" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="90.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 剪枝：target &lt; n 或 target &gt; n·k ⇒ 返回 0</text>
  <rect x="40" y="126" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="152.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② dp[0] = 1，dp[s &gt; 0] = 0（0 个骰子和为 0）</text>
  <rect x="40" y="188" width="300" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="218.0" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ for i = 1 … n：先算上一层前缀和 P</text>
  <rect x="40" y="260" width="300" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="284" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">④ ndp[s] = P[s] − P[max(0, s−k)]</text>
  <text x="190" y="304" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">     s ∈ [i, min(i·k, target)]</text>
  <rect x="40" y="344" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="370.0" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⑤ dp ← ndp，进入下一层（只留一层）</text>
  <rect x="40" y="408" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="434.0" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⑥ 返回 dp[target]</text>
  <path d="M 190 108 L 190 124" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 170 L 190 186" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 240 L 190 256" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 324 L 190 340" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 388 L 190 404" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="64" width="268" height="156" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="386" y="86" text-anchor="start" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">前缀和差分</text>
  <text x="386" y="110" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">dp[i][s] = P[s] − P[max(0, s−k)]</text>
  <text x="386" y="132" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">P[j] = dp[i−1][0] + … + dp[i−1][j−1]</text>
  <text x="386" y="158" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">P 只算一遍，每个 s 两次查表相减</text>
  <text x="386" y="184" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">⇒ 每层 O(target)，总计 O(n·target)</text>
  <text x="386" y="206" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">朴素三重循环要 O(n·k·target)</text>
  <rect x="372" y="240" width="268" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="386" y="262" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">窗口为什么能「滑动」</text>
  <text x="386" y="286" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">s 增大 1 ⇒ 窗口整体右移 1 格：</text>
  <text x="386" y="308" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">右端新进 dp[s−1]，左端去掉 dp[s−k−1]</text>
  <text x="386" y="334" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">但前缀和不用真维护窗口，</text>
  <text x="386" y="354" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">两端各查一次前缀即可。</text>
  <text x="386" y="376" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">i ≤ s ≤ i·k 保证窗口内状态有效</text>
  <text x="330" y="470" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环不变量：进入第 i 轮时，dp 恰好是第 i−1 层的完整一行</text>
</svg>
