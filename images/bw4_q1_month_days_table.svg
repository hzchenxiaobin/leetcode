<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">十二个月的天数表：只有 2 月需要看年份</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">days = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]，闰年把 days[2] 改成 29</text>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#888">
    <text x="49" y="80">1月</text>
    <text x="91" y="80">2月</text>
    <text x="133" y="80">3月</text>
    <text x="175" y="80">4月</text>
    <text x="217" y="80">5月</text>
    <text x="259" y="80">6月</text>
    <text x="301" y="80">7月</text>
    <text x="343" y="80">8月</text>
    <text x="385" y="80">9月</text>
    <text x="427" y="80">10月</text>
    <text x="469" y="80">11月</text>
    <text x="511" y="80">12月</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="28"  y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="70"  y="86" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="112" y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="154" y="86" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="238" y="86" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="322" y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="364" y="86" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="406" y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="448" y="86" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="490" y="86" width="42" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="49"  y="113" fill="#3a5a30">31</text>
    <text x="91"  y="113" fill="#b85450">28</text>
    <text x="133" y="113" fill="#3a5a30">31</text>
    <text x="175" y="113" fill="#3a4a66">30</text>
    <text x="217" y="113" fill="#3a5a30">31</text>
    <text x="259" y="113" fill="#3a4a66">30</text>
    <text x="301" y="113" fill="#3a5a30">31</text>
    <text x="343" y="113" fill="#3a5a30">31</text>
    <text x="385" y="113" fill="#3a4a66">30</text>
    <text x="427" y="113" fill="#3a5a30">31</text>
    <text x="469" y="113" fill="#3a4a66">30</text>
    <text x="511" y="113" fill="#3a5a30">31</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="150" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="125" y="167" text-anchor="middle" font-size="9.5" fill="#3a5a30">大月 31 天：1,3,5,7,8,10,12</text>
    <rect x="225" y="150" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="295" y="167" text-anchor="middle" font-size="9.5" fill="#3a4a66">小月 30 天：4,6,9,11</text>
    <rect x="380" y="150" width="152" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6"/>
    <text x="456" y="167" text-anchor="middle" font-size="9.5" fill="#8a3a36">二月：平年 28 / 闰年 29</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="196" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="280" y="221" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold">口诀：一三五七八十腊，三十一天永不差</text>
    <text x="280" y="241" text-anchor="middle" font-size="11" fill="#8a6a20">四六九冬三十日，唯有二月二十八（闰年再添一）</text>
    <text x="280" y="256" text-anchor="middle" font-size="9" fill="#999">腊 = 12 月，冬 = 11 月</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="276" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="280" y="299" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">拳头记忆法：拳峰 = 大月（1,3,5,7,8,10,12），指缝 = 小月</text>
    <text x="280" y="318" text-anchor="middle" font-size="10" fill="#555">数到 7 月后折返再数 8 月，所以 7、8 月是连续两个大月</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="344" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="280" y="361" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">if (M == 2 &amp;&amp; 闰年) return 29; else return days[M];</text>
    <text x="280" y="377" text-anchor="middle" font-size="9.5" fill="#555">自检：闰年 12 个月合计 366 天，平年合计 365 天</text>
  </g>
</svg>
