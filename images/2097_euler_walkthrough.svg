<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：度数定起点 → 后序入栈 → 逆序配对</text>

  <!-- ============ 左上：度数表 ============ -->
  <text x="165" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">① 度数统计（哈希表）</text>

  <g filter="url(#rough2)">
    <rect x="30" y="64" width="270" height="26" fill="#e8f0fe"/>
    <rect x="30" y="90" width="270" height="26" fill="#e6f4ea"/>
    <rect x="30" y="116" width="270" height="26" fill="#ffffff"/>
    <rect x="30" y="142" width="270" height="26" fill="#ffffff"/>
    <rect x="30" y="168" width="270" height="26" fill="#ffffff"/>
    <rect x="30" y="194" width="270" height="26" fill="#fff8e1"/>
    <rect x="30" y="64" width="270" height="156" fill="none" stroke="#446688" stroke-width="1.4"/>
    <line x1="30" y1="90" x2="300" y2="90" stroke="#446688" stroke-width="1"/>
    <line x1="30" y1="116" x2="300" y2="116" stroke="#446688" stroke-width="1"/>
    <line x1="30" y1="142" x2="300" y2="142" stroke="#446688" stroke-width="1"/>
    <line x1="30" y1="168" x2="300" y2="168" stroke="#446688" stroke-width="1"/>
    <line x1="30" y1="194" x2="300" y2="194" stroke="#446688" stroke-width="1"/>
    <line x1="100" y1="64" x2="100" y2="220" stroke="#446688" stroke-width="1"/>
    <line x1="160" y1="64" x2="160" y2="220" stroke="#446688" stroke-width="1"/>
    <line x1="220" y1="64" x2="220" y2="220" stroke="#446688" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5">
    <text x="65" y="81" font-weight="bold" fill="#333">节点</text>
    <text x="130" y="81" font-weight="bold" fill="#333">out</text>
    <text x="190" y="81" font-weight="bold" fill="#333">in</text>
    <text x="260" y="81" font-weight="bold" fill="#333">out−in</text>
    <text x="65" y="107" font-weight="bold" fill="#2f5e24">11</text>
    <text x="130" y="107" fill="#333">1</text>
    <text x="190" y="107" fill="#333">0</text>
    <text x="260" y="107" font-weight="bold" fill="#2f5e24">+1 起点</text>
    <text x="65" y="133" fill="#333">9</text>
    <text x="130" y="133" fill="#333">1</text>
    <text x="190" y="133" fill="#333">1</text>
    <text x="260" y="133" fill="#333">0</text>
    <text x="65" y="159" fill="#333">4</text>
    <text x="130" y="159" fill="#333">1</text>
    <text x="190" y="159" fill="#333">1</text>
    <text x="260" y="159" fill="#333">0</text>
    <text x="65" y="185" fill="#333">5</text>
    <text x="130" y="185" fill="#333">1</text>
    <text x="190" y="185" fill="#333">1</text>
    <text x="260" y="185" fill="#333">0</text>
    <text x="65" y="211" font-weight="bold" fill="#8a6a1a">1</text>
    <text x="130" y="211" fill="#333">0</text>
    <text x="190" y="211" fill="#333">1</text>
    <text x="260" y="211" font-weight="bold" fill="#8a6a1a">−1 终点</text>
  </g>

  <text x="165" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">起点 = 11（out − in = +1）</text>
  <text x="165" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">终点 = 1（in − out = +1）</text>

  <!-- ============ 右上：链图 ============ -->
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">② 从起点沿出边深入</text>

  <g stroke="#446688" stroke-width="1.7">
    <line x1="386" y1="109" x2="424" y2="121" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="456" y1="139" x2="494" y2="151" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="494" y1="168" x2="458" y2="186" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="424" y1="204" x2="388" y2="216" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="370" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="370" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5e24">11</text>
    <circle cx="440" cy="130" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="440" y="135" text-anchor="middle" font-size="12" fill="#333">9</text>
    <circle cx="510" cy="160" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="510" y="165" text-anchor="middle" font-size="12" fill="#333">4</text>
    <circle cx="440" cy="195" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="440" y="200" text-anchor="middle" font-size="12" fill="#333">5</text>
    <circle cx="370" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="370" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">1</text>
  </g>

  <path d="M 370 250 Q 370 262 384 262" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="490" y="266" text-anchor="middle" font-size="9.5" fill="#8a6a1a" filter="url(#rough2)">死胡同（1 无出边）→ 回退入栈</text>

  <!-- ============ 底部：三步转换 ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="300" width="175" height="96" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="117" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">③ 后序入栈（回退时）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="38" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="52" y="352" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="69" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="83" y="352" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="100" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="114" y="352" text-anchor="middle" font-size="10" fill="#333">4</text>
    <rect x="131" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="145" y="352" text-anchor="middle" font-size="10" fill="#333">9</text>
    <rect x="162" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="176" y="352" text-anchor="middle" font-size="10" fill="#333">11</text>
  </g>
  <text x="117" y="382" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">ans = [1, 5, 4, 9, 11]</text>

  <line x1="205" y1="348" x2="240" y2="348" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="242" y="300" width="175" height="96" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="329" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">④ 逆序</text>
    <path d="M 398 332 Q 329 322 260 332" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="250" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="264" y="352" text-anchor="middle" font-size="10" fill="#333">11</text>
    <rect x="281" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="295" y="352" text-anchor="middle" font-size="10" fill="#333">9</text>
    <rect x="312" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="326" y="352" text-anchor="middle" font-size="10" fill="#333">4</text>
    <rect x="343" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="357" y="352" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="374" y="336" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="388" y="352" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>
  <text x="329" y="382" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">节点路径 [11, 9, 4, 5, 1]</text>

  <line x1="417" y1="348" x2="452" y2="348" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="452" y="300" width="138" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="521" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5e24">⑤ 配对输出</text>
    <text x="521" y="348" text-anchor="middle" font-size="10" fill="#2f5e24">[11,9] [9,4]</text>
    <text x="521" y="364" text-anchor="middle" font-size="10" fill="#2f5e24">[4,5] [5,1]</text>
    <text x="521" y="386" text-anchor="middle" font-size="9" fill="#2f5e24">4 条边，合法 ✓</text>
  </g>

  <text x="310" y="424" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">相邻节点配对 = 用过的边，首尾自动相接 —— 输出即合法排列</text>
</svg>
