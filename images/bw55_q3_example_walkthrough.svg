<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [6, 2, 1, 2, 4, 5]</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="70" y="56" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="90" width="420" height="34" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="124" width="420" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="158" width="420" height="34" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="192" width="420" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="226" width="420" height="34" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="260" width="420" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="70" y="294" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <!-- 竖线 -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="150" y1="56" x2="150" y2="328"/>
    <line x1="280" y1="56" x2="280" y2="328"/>
    <line x1="410" y1="56" x2="410" y2="328"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="78">读入 x</text><text x="215" y="78">even</text><text x="345" y="78">odd</text>
    <text x="478" y="78">对应子序列</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="110" y="112">初始</text><text x="215" y="112">0</text><text x="345" y="112">−∞</text><text x="478" y="112">（空）</text>
    <text x="110" y="146">6</text><text x="215" y="146">6</text><text x="345" y="146">−6</text><text x="478" y="146">[6]</text>
    <text x="110" y="180">2</text><text x="215" y="180">6</text><text x="345" y="180">4</text><text x="478" y="180">[6,2]</text>
    <text x="110" y="214">1</text><text x="215" y="214">6</text><text x="345" y="214">5</text><text x="478" y="214">[6,1]</text>
    <text x="110" y="248">2</text><text x="215" y="248" fill="#b85450" font-weight="bold">7</text><text x="345" y="248">5</text><text x="478" y="248">[6,1,2]</text>
    <text x="110" y="282">4</text><text x="215" y="282" fill="#b85450" font-weight="bold">9</text><text x="345" y="282">5</text><text x="478" y="282">[6,1,4]</text>
    <text x="110" y="316">5</text><text x="215" y="316" fill="#2f5226" font-weight="bold">10</text><text x="345" y="316">5</text><text x="478" y="316">[6,1,5]</text>
  </g>
  <!-- 高亮最终行 -->
  <rect x="70" y="294" width="420" height="34" fill="none" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>

  <text x="478" y="346" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（只展示取得最值的子序列）</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="70" y="352" width="420" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">最终 even = 10，即子序列 [6, 1, 5]：(6 + 5) − 1 = 10 ✓</text>

  <!-- 侧注：偶数位步进说明 -->
  <text x="222" y="146" font-size="9.5" fill="#888" filter="url(#rough2)">单开 [x] 进入 even</text>
  <text x="222" y="248" font-size="9.5" fill="#b85450" filter="url(#rough2)">odd+2：跨谷拼接</text>
  <text x="222" y="282" font-size="9.5" fill="#b85450" filter="url(#rough2)">odd+4：跨谷拼接</text>
</svg>
