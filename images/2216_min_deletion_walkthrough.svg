<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,1,2,2,3,3]（官方示例 2）</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">双指针逐步走查：i 始终停在当前流的偶数位，末尾落单补一刀</text>

  <!-- pair labels -->
  <text x="194" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 对① (1,2)</text>
  <text x="298" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 对② (2,3)</text>

  <!-- pair frames -->
  <g filter="url(#sk)" fill="none" stroke="#4a8e4a" stroke-width="2.2">
    <rect x="138" y="90" width="112" height="50" rx="7"/>
    <rect x="242" y="90" width="112" height="50" rx="7"/>
  </g>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="90" y="94" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="142" y="94" width="52" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="194" y="94" width="52" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="246" y="94" width="52" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="298" y="94" width="52" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="350" y="94" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="116" y="121">1</text>
    <text x="168" y="121">1</text>
    <text x="220" y="121">2</text>
    <text x="272" y="121">2</text>
    <text x="324" y="121">3</text>
    <text x="376" y="121">3</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="116" y="152">0</text>
    <text x="168" y="152">1</text>
    <text x="220" y="152">2</text>
    <text x="272" y="152">3</text>
    <text x="324" y="152">4</text>
    <text x="376" y="152">5</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#sk)">
    <path d="M 98 100 L 134 130"/>
    <path d="M 134 100 L 98 130"/>
    <path d="M 358 100 L 394 130"/>
    <path d="M 394 100 L 358 130"/>
  </g>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="436" y="100" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="436" y="126" width="20" height="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/>
  </g>
  <text x="464" y="113" font-size="11.5" fill="#555" filter="url(#sk)">红：删除（nums[0]、nums[5]）</text>
  <text x="464" y="139" font-size="11.5" fill="#555" filter="url(#sk)">绿框：锁成一对（对①、对②）</text>

  <!-- step table -->
  <g filter="url(#sk)">
    <rect x="60" y="180" width="555" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="60" y="208" width="555" height="32" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="240" width="555" height="32" fill="#f8f8f2" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="272" width="555" height="32" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="304" width="555" height="32" fill="#f8f8f2" stroke="#999" stroke-width="1.1"/>
    <path d="M 100 180 L 100 336 M 165 180 L 165 336 M 345 180 L 345 336 M 560 180 L 560 336" stroke="#999" stroke-width="1.1" fill="none"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#33475e" text-anchor="middle">
    <text x="80" y="198">步</text>
    <text x="132" y="198">指针 i</text>
    <text x="255" y="198">比较（当前流下两位）</text>
    <text x="452" y="198">动作</text>
    <text x="588" y="198">ans</text>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="80" y="228">1</text>
    <text x="132" y="228">0</text>
    <text x="255" y="228">nums[0]=1 与 nums[1]=1 相等</text>
    <text x="452" y="228">删 nums[0]，i → 1</text>
    <text x="588" y="228">1</text>

    <text x="80" y="262">2</text>
    <text x="132" y="262">1</text>
    <text x="255" y="262">nums[1]=1 与 nums[2]=2 不等</text>
    <text x="452" y="262">配成对①，i → 3</text>
    <text x="588" y="262">1</text>

    <text x="80" y="294">3</text>
    <text x="132" y="294">3</text>
    <text x="255" y="294">nums[3]=2 与 nums[4]=3 不等</text>
    <text x="452" y="294">配成对②，i → 5</text>
    <text x="588" y="294">1</text>

    <text x="80" y="326">4</text>
    <text x="132" y="326">5</text>
    <text x="255" y="326">i+1=6 越界，无伙伴可配</text>
    <text x="452" y="326">删落单的 nums[5]，扫描结束</text>
  </g>
  <text x="588" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">2</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="70" y="362" width="540" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2 ✓   保留流 [1,2,2,3]：长度 4（偶数）</text>
  <text x="340" y="408" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">对① (1,2)、对② (2,3) 对内均不相等 —— 美丽数组达成</text>

  <text x="340" y="448" text-anchor="middle" font-size="11" fill="#999">i 每步前进 1 或 2 格，总步数不超过 n：时间 O(n)、额外空间 O(1)</text>
</svg>
