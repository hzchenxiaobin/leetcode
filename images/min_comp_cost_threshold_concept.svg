<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：只保留权 ≤ x 的边，数连通分量 c(x)</text>
  <path d="M 175 40 Q 330 48 485 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：示例 1 的图 -->
  <text x="185" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">示例 1 的图（k = 2）</text>

  <!-- 分量包围椭圆 -->
  <ellipse cx="192" cy="182" rx="122" ry="98" fill="none" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="8 6" filter="url(#sk)"/>

  <!-- 边 -->
  <line x1="185" y1="105" x2="215" y2="255" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="163" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <line x1="185" y1="105" x2="290" y2="150" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="243" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <line x1="95" y1="175" x2="185" y2="105" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="128" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <line x1="215" y1="255" x2="345" y2="315" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5" filter="url(#sk)"/>
  <text x="290" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040" filter="url(#sk)">w = 6</text>
  <text x="268" y="306" text-anchor="middle" font-size="10" fill="#a04040" filter="url(#sk)">&gt; x，删</text>

  <!-- 节点 -->
  <circle cx="95" cy="175" r="16" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="95" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">0</text>
  <circle cx="185" cy="105" r="16" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="185" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">1</text>
  <circle cx="290" cy="150" r="16" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2</text>
  <circle cx="215" cy="255" r="16" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="215" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">3</text>
  <circle cx="345" cy="315" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="345" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040" filter="url(#sk)">4</text>

  <text x="150" y="308" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">分量 {0,1,2,3}：成本 4</text>
  <text x="345" y="352" text-anchor="middle" font-size="11.5" fill="#a04040" filter="url(#sk)">分量 {4}：成本 0</text>
  <text x="185" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">x = 4：保留 w ≤ 4 的边 → 2 个分量 ≤ k ✓</text>

  <!-- 右：c(x) 阶梯函数 -->
  <text x="522" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">分量数 c(x) 随阈值 x 单调不增</text>

  <rect x="415" y="265" width="217" height="85" fill="#eaf6ee" opacity="0.55"/>
  <text x="523" y="342" text-anchor="middle" font-size="11" fill="#4a8e4a" filter="url(#sk)">可行区 c(x) ≤ k</text>

  <line x1="415" y1="130" x2="632" y2="130" stroke="#d8d8d0" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="415" y1="175" x2="632" y2="175" stroke="#d8d8d0" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="415" y1="220" x2="632" y2="220" stroke="#d8d8d0" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="415" y1="310" x2="632" y2="310" stroke="#d8d8d0" stroke-width="1" stroke-dasharray="3 5"/>

  <line x1="415" y1="350" x2="415" y2="108" stroke="#555" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <line x1="415" y1="350" x2="640" y2="350" stroke="#555" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="120" font-size="12" font-style="italic" fill="#555" filter="url(#sk)">c(x)</text>
  <text x="528" y="392" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">阈值 x（边权）</text>

  <text x="405" y="134" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">5</text>
  <text x="405" y="179" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">4</text>
  <text x="405" y="224" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">3</text>
  <text x="405" y="269" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">2</text>
  <text x="405" y="314" text-anchor="end" font-size="11" fill="#666" filter="url(#sk)">1</text>

  <line x1="465" y1="350" x2="465" y2="356" stroke="#666" stroke-width="1.2" filter="url(#sk)"/>
  <text x="465" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">2</text>
  <line x1="515" y1="350" x2="515" y2="356" stroke="#666" stroke-width="1.2" filter="url(#sk)"/>
  <text x="515" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">3</text>
  <line x1="565" y1="350" x2="565" y2="356" stroke="#666" stroke-width="1.2" filter="url(#sk)"/>
  <text x="565" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">4</text>
  <line x1="620" y1="350" x2="620" y2="356" stroke="#666" stroke-width="1.2" filter="url(#sk)"/>
  <text x="620" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">6</text>

  <line x1="415" y1="265" x2="632" y2="265" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="628" y="256" text-anchor="end" font-size="12" font-weight="bold" fill="#a04040" filter="url(#sk)">k = 2</text>

  <path d="M 415 130 H 465 V 175 H 515 V 220 H 565 V 265 H 620 V 310 H 638" stroke="#4a8edb" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="475" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040" filter="url(#sk)">✗</text>
  <text x="525" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040" filter="url(#sk)">✗</text>
  <circle cx="565" cy="265" r="7" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="590" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <path d="M 554 251 L 561 262" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="553" y="232" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c(4) = 2 ≤ k</text>
  <text x="553" y="248" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 = 4 ✓</text>

  <text x="522" y="414" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">首个 c(x) ≤ k 的 x = 最小可行阈值 = 答案</text>
</svg>
