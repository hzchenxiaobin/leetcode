<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="392" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：好 ⟺ 所有元素都是最大值的子掩码</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="22" y="56" width="294" height="202" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="169" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 好子数组 [2, 3]</text>
  <g filter="url(#rough2)">
    <rect x="116" y="92" width="46" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="176" y="92" width="46" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="139" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="199" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="169" y="148" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2 | 3 = 3 = max</text>
  <text x="169" y="166" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3 就在子数组中出现 → ✓ 好</text>
  <text x="60" y="194" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">2 =</text>
  <g filter="url(#rough2)">
    <rect x="92" y="182" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="116" y="182" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="102" y="195" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="126" y="195" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="60" y="222" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">3 =</text>
  <g filter="url(#rough2)">
    <rect x="92" y="210" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="116" y="210" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="102" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="126" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <path d="M 150 191 C 178 191 178 219 152 219" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="205" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">bits(2) ⊆ bits(3)</text>
  <text x="262" y="222" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2 的位被 3</text>
  <text x="262" y="238" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">完全包含</text>

  <g filter="url(#rough2)">
    <rect x="324" y="56" width="294" height="202" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="471" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04040" filter="url(#rough2)">✗ 坏子数组 [4, 2]</text>
  <g filter="url(#rough2)">
    <rect x="418" y="92" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <rect x="478" y="92" width="46" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="441" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="501" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="471" y="148" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4 | 2 = 6 ＞ 4 = max</text>
  <text x="471" y="166" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6 不在子数组中出现 → ✗ 坏</text>
  <text x="362" y="194" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">4 =</text>
  <g filter="url(#rough2)">
    <rect x="394" y="182" width="20" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="418" y="182" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="442" y="182" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="404" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04040" filter="url(#rough2)">1</text>
  <text x="428" y="195" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="452" y="195" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="362" y="222" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">2 =</text>
  <g filter="url(#rough2)">
    <rect x="394" y="210" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="418" y="210" width="20" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="442" y="210" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="404" y="223" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="428" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04040" filter="url(#rough2)">1</text>
  <text x="452" y="223" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="362" y="250" text-anchor="start" font-size="11.5" fill="#a04040" filter="url(#rough2)">OR =</text>
  <g filter="url(#rough2)">
    <rect x="394" y="238" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="418" y="238" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="442" y="238" width="20" height="18" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="404" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1</text>
  <text x="428" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1</text>
  <text x="452" y="251" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="556" y="205" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">4、2 互有对方</text>
  <text x="556" y="221" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">没有的位</text>
  <text x="556" y="243" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">OR 冒出了</text>
  <text x="556" y="259" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">新的值 6</text>

  <g filter="url(#rough2)">
    <rect x="22" y="274" width="596" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">OR 的位集 ⊇ max 的位集 ⟹ 数值上 OR ≥ max 恒成立</text>
  <text x="320" y="326" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">于是：OR == 某个元素 ⟺ OR == max ⟺ 全员 ⊆ max</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">「x 是 y 的子掩码」一次位运算可判：(x | y) == y</text>
</svg>
