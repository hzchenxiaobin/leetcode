<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：示例 3 —— 全出现值凑不出零，占位轨道兜底</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">nums = [1,2,4,1,2,5,1,2,6]，k = 3 ⇒ 组 0 = [1,1,1]，组 1 = [2,2,2]，组 2 = [4,5,6]</text>

  <!-- Row labels -->
  <text x="36" y="75" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下标 0~2</text>
  <text x="36" y="113" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">3~5</text>
  <text x="36" y="151" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">6~8</text>

  <!-- Grid row 0 -->
  <rect x="42" y="56" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="56" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="56" width="38" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Grid row 1 -->
  <rect x="42" y="94" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="94" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="94" width="38" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="114" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Grid row 2 -->
  <rect x="42" y="132" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="132" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="132" width="38" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Column headers -->
  <text x="61" y="178" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">组 0</text>
  <text x="109" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">组 1</text>
  <text x="157" y="178" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">组 2</text>
  <text x="61" y="192" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">{1:3}</text>
  <text x="109" y="192" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">{2:3}</text>
  <text x="157" y="192" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">{4:1, 5:1, 6:1}</text>

  <!-- Right box 1 -->
  <path d="M 182 110 Q 208 98 228 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="232" y="56" width="292" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="244" y="74" font-size="10" fill="#2f4a66" filter="url(#rough2)">组 0 只能取 1、组 1 只能取 2 ⇒ 已定异或 = 1 ⊕ 2 = 3</text>
  <text x="244" y="91" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">组 2 想补零必须取 3，但 3 ∉ {4,5,6}</text>
  <text x="244" y="108" font-size="10" fill="#2f4a66" filter="url(#rough2)">⇒ 全出现值凑不出异或零：dp[0] = ∞</text>

  <!-- Right box 2 -->
  <rect x="232" y="126" width="292" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="244" y="144" font-size="10" fill="#8a6a1c" filter="url(#rough2)">组 2 走占位转移：g[3] = dp[3] + sz₂ = 0 + 3</text>
  <text x="244" y="160" font-size="10" fill="#8a6a1c" filter="url(#rough2)">结算值被逼为 3：整组 [4,5,6] → 3（3 处改动）</text>

  <!-- DP table -->
  <rect x="42" y="210" width="484" height="27" fill="#f0efe9" stroke="none" filter="url(#rough2)"/>
  <path d="M 42 210 L 526 210" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 42 237 L 526 237" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 42 264 L 526 264" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 42 291 L 526 291" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 42 318 L 526 318" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 42 345 L 526 345" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 160 210 L 160 345" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 330 210 L 330 345" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <text x="101" y="228" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">处理到</text>
  <text x="245" y="228" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">dp（全出现值）</text>
  <text x="428" y="228" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">g（恰一组占位）</text>

  <text x="101" y="255" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">初始</text>
  <text x="245" y="255" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{0: 0}</text>
  <text x="428" y="255" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">∅（全为 ∞）</text>

  <text x="101" y="282" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">组 0 ｜{1:3}</text>
  <text x="245" y="282" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1: 0}</text>
  <text x="428" y="282" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">{0: 3} ← 组 0 占位</text>

  <text x="101" y="309" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">组 1 ｜{2:3}</text>
  <text x="245" y="309" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{3: 0}</text>
  <text x="428" y="309" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1: 3, 2: 3}</text>

  <text x="101" y="336" text-anchor="middle" font-size="9" fill="#444" filter="url(#rough2)">组 2 ｜{4:1,5:1,6:1}</text>
  <text x="172" y="336" font-size="9.5" fill="#333" filter="url(#rough2)">{7:2, 6:2, 5:2}</text>
  <text x="252" y="336" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">无 0！</text>
  <text x="340" y="336" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3:3</text>
  <text x="362" y="336" font-size="9.5" fill="#333" filter="url(#rough2)">, 4:5, 5:5, 6:5, 7:5</text>

  <!-- Bottom red box -->
  <rect x="42" y="358" width="484" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="374" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">dp 轨在组 2 之后没有 0 状态：1 ⊕ 2 = 3，而 3 未在组 2 出现，全出现值无解</text>
  <text x="284" y="390" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">min_x g[x] = g[3] = 3 —— 占位轨道兜底</text>

  <!-- Bottom green box -->
  <rect x="42" y="412" width="484" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="428" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">结算：占位组（组 2）取 3，最终数组 [1,2,3, 1,2,3, 1,2,3]</text>
  <text x="284" y="444" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1 ⊕ 2 ⊕ 3 = 0 ✓，所有长度 3 的窗口异或为零，答案 = 3</text>
</svg>
