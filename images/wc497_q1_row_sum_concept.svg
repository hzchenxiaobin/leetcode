<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：deg(i) = 第 i 行中 1 的个数（行和）</text>

  <!-- 左：无向图（三角形） -->
  <line x1="105" y1="115" x2="65" y2="225" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="105" y1="115" x2="160" y2="225" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="65" y1="225" x2="160" y2="225" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="105" cy="115" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <circle cx="65" cy="225" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <circle cx="160" cy="225" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="110" y="285" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 1：三角形，每个点度都为 2</text>

  <!-- 图 → 矩阵 箭头 -->
  <path d="M128,110 C 180,92 240,96 292,102" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">顶点 0 的邻居看第 0 行</text>

  <!-- 右：邻接矩阵 -->
  <text x="323" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="369" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="415" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="292" y="111" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="292" y="157" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="292" y="203" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">2</text>

  <!-- 第 0 行高亮框 -->
  <rect x="296" y="80" width="148" height="54" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 单元格 -->
  <rect x="300" y="84" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="84" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="392" y="84" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="300" y="130" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="130" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="392" y="130" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="176" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="176" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="392" y="176" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="323" y="112" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="369" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="415" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="323" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="369" y="158" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="415" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="323" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="369" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="415" y="204" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <text x="452" y="111" font-size="12" fill="#d6a040" filter="url(#rough2)">第 0 行</text>
  <text x="369" y="256" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">第 0 行有两个 1 ⇒ deg(0) = 1 + 1 = 2 ✓</text>

  <!-- 说明框 -->
  <rect x="300" y="275" width="235" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="300" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· 对角线恒为 0（无自环）</text>
  <text x="312" y="325" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· matrix 对称 ⇒ 行和 = 列和</text>
  <text x="312" y="350" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· 行内每个 1 ↔ 恰好一条邻边</text>
</svg>
