<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">两个示例并排看</text>

  <!-- 例 1 -->
  <text x="30" y="60" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：[3, 2, 1, 4, 5]</text>
  <g filter="url(#rough2)">
    <rect x="30" y="70" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="80" y="70" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="130" y="70" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="180" y="70" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="230" y="70" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="53" y="93">3</text><text x="103" y="93">2</text><text x="153" y="93">1</text>
    <text x="203" y="93">4</text><text x="253" y="93">5</text>
  </g>
  <text x="63" y="120" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <text x="163" y="120" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <text x="253" y="120" font-size="9.5" fill="#999" filter="url(#rough2)">剩 1 个</text>
  <text x="300" y="93" font-size="10.5" fill="#2f5226" filter="url(#rough2)">→ 2 次操作</text>

  <!-- 例 2 -->
  <text x="30" y="164" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：[3, 2, 6, 1, 4]</text>
  <g filter="url(#rough2)">
    <rect x="30" y="174" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="80" y="174" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="130" y="174" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="180" y="174" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="230" y="174" width="46" height="34" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="53" y="197">3</text><text x="103" y="197">2</text><text x="153" y="197">6</text>
    <text x="203" y="197">1</text><text x="253" y="197">4</text>
  </g>
  <text x="63" y="224" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <text x="163" y="224" font-size="9.5" fill="#b85450" filter="url(#rough2)">7 ✗</text>
  <text x="300" y="197" font-size="10.5" fill="#8c3a3a" filter="url(#rough2)">→ 1 次操作后停</text>

  <rect x="30" y="242" width="500" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="262" font-size="10.8" fill="#7a5a10" filter="url(#rough2)">示例 1：第二对 1+4 = 5 与首对同分，可以继续；示例 2：第二对 6+1 = 7 ≠ 5，立刻停下。</text>
  <text x="46" y="282" font-size="10.5" fill="#a08a50" filter="url(#rough2)">注意「最多」在这里没有选择余地：能继续就必须继续，所以答案是确定的。</text>
</svg>
