<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：costs=[4,8,5,3]，capacity=[1,5,2,7]，budget=8</text>

  <!-- 排序后 -->
  <text x="126" y="68" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">排序后：</text>
  <rect x="134" y="40" width="82" height="48" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c = 3</text>
  <text x="175" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 7</text>
  <rect x="222" y="40" width="82" height="48" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c = 4</text>
  <text x="263" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 1</text>
  <rect x="310" y="40" width="82" height="48" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c = 5</text>
  <text x="351" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 2</text>
  <rect x="398" y="40" width="82" height="48" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c = 8</text>
  <text x="439" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 5</text>
  <rect x="496" y="48" width="110" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="551" y="68" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">budget = 8</text>
  <text x="320" y="104" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre = [0, 7, 7, 7, 7]</text>

  <!-- 走查表 -->
  <rect x="40" y="118" width="560" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="40" y="118" width="560" height="182" fill="none" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="40" y="186" width="560" height="38" fill="#fff8e1" opacity="0.9" filter="url(#rough2)"/>
  <line x1="40" y1="148" x2="600" y2="148" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="186" x2="600" y2="186" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="224" x2="600" y2="224" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="262" x2="600" y2="262" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="78" y1="118" x2="78" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="118" x2="140" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="202" y1="118" x2="202" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="118" x2="272" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="362" y1="118" x2="362" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="118" x2="470" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="540" y1="118" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1" filter="url(#rough2)"/>

  <text x="59" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="109" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">cost_j</text>
  <text x="171" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">cap_j</text>
  <text x="237" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">窗口 p</text>
  <text x="317" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">m=min(p,j)</text>
  <text x="416" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">配对候选</text>
  <text x="505" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">单台</text>
  <text x="570" y="137" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <text x="59" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="109" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="171" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="237" y="171" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2（≤4）</text>
  <text x="317" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="416" y="171" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="505" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="570" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <text x="59" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="109" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="171" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="237" y="209" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1（≤3）</text>
  <text x="317" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="416" y="209" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1+pre[1]=8</text>
  <text x="505" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="570" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="59" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="109" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="171" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="237" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0（≤2）</text>
  <text x="317" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="416" y="243" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="505" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="570" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <text x="59" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="109" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="171" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="237" y="281" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0（≤−1）</text>
  <text x="317" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="416" y="281" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="505" y="281" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="570" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <!-- 注释 -->
  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">p 随 j 单调不增：2 → 1 → 0 → 0，双指针全程只左移（等价：每个 j 二分一次）</text>
  <text x="320" y="334" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">j=0 的窗口 [0,2) 含自身 → m=min(p,j)=0 排除；j=1 的搭档是 (3,7) → 候选 1+7=8</text>

  <!-- 答案框 -->
  <rect x="70" y="346" width="500" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = 8：原下标 0（成本 4，容量 1）+ 原下标 3（成本 3，容量 7）</text>
  <text x="320" y="386" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">总成本 4 + 3 = 7 &lt; budget = 8，总容量 1 + 7 = 8 ✓</text>

  <!-- 警示框 -->
  <rect x="60" y="410" width="520" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="428" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ 是「严格小于」：成本和恰为 budget 的组合不合法</text>
  <text x="320" y="444" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">二分要查 budget − cost[j] − 1（即搭档成本 ≤ budget − cost[j] − 1），别写成 budget − cost[j]</text>
</svg>
