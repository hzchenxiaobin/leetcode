<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="340" y="28" font-size="15" fill="#444" font-weight="bold">示例演算：候选集合与差值</text>
    <text x="340" y="50" font-size="10.5" fill="#888">✓ 为最终答案，括号内是与 n 的绝对差</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="66" width="620" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="30" y="96" width="620" height="46" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="30" y="142" width="620" height="46" fill="#e6f4ea" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="30" y="188" width="620" height="46" fill="#fce4ec" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="30" y="234" width="620" height="46" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" stroke="#bbbbbb" stroke-width="1">
    <path d="M 130 66 L 130 280"/>
    <path d="M 206 66 L 206 280"/>
    <path d="M 290 66 L 290 280"/>
    <path d="M 580 66 L 580 280"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5" fill="#3a4a66">
    <text x="80" y="86">n</text>
    <text x="168" y="86">L / h</text>
    <text x="248" y="86">prefix</text>
    <text x="435" y="86">候选（差值）</text>
    <text x="615" y="86">答案</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#333">
    <text x="80" y="125">123</text>
    <text x="168" y="125">3 / 2</text>
    <text x="248" y="125">12</text>
    <text x="80" y="171">1000</text>
    <text x="168" y="171">4 / 2</text>
    <text x="248" y="171">10</text>
    <text x="80" y="217">1</text>
    <text x="168" y="217">1 / 1</text>
    <text x="248" y="217">1</text>
    <text x="80" y="263">11</text>
    <text x="168" y="263">2 / 1</text>
    <text x="248" y="263">1</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#444">
    <text x="300" y="125">99 (24)   111 (12)   121 (2) ✓   131 (8)</text>
    <text x="300" y="171">999 (1) ✓   1001 (1)   1111 (111)</text>
    <text x="300" y="217">0 (1) ✓   2 (1)   11 (10)</text>
    <text x="300" y="263">0 (11)   9 (2) ✓   22 (11)   101 (90)</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5" fill="#3a7a3a" font-weight="bold">
    <text x="615" y="125">121</text>
    <text x="615" y="171">999</text>
    <text x="615" y="217">0</text>
    <text x="615" y="263">9</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#666">
    <text x="340" y="304">并列取小：1000 的 999 与 1001 差值同为 1，取 999；1 的 0 与 2 同为 1，取 0。</text>
    <text x="340" y="326">哨兵来源：999 = 10^(L−1) − 1 是「短一位」全 9；1001 = 10^L + 1 是「长一位」回文。</text>
    <text x="340" y="348">进位作废：n = 99 时 h = 1、prefix = 9，prefix + 1 = 10 不是 1 位数，镜像失败，由 101 兜底。</text>
    <text x="340" y="370">自身排除：n = 12321 这类回文，原样镜像恰好等于 n，必须丢弃后重选。</text>
  </g>
</svg>
