<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：判无解 → 定位缺口 → 距离贪心</text>

  <rect x="150" y="42" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：环形数组 balance</text>

  <path d="M260 72 L260 86" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,90 365,124 260,158 155,124" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum &lt; 0 ?</text>

  <path d="M365 124 L402 124" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="114" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="406" y="106" width="96" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="129" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 -1</text>

  <path d="M260 158 L260 174" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <polygon points="260,178 370,212 260,246 150,212" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">存在负数 ?</text>

  <path d="M370 212 L402 212" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="406" y="194" width="96" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="217" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 0</text>

  <path d="M260 246 L260 262" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="260" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="140" y="264" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">定位缺口 p，need = −balance[p]</text>

  <path d="M260 296 L260 312" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="314" width="330" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个 i≠p：dist = min((p−i) mod n, (i−p) mod n)</text>

  <path d="M260 346 L260 362" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="364" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按 dist 升序排序 (dist, supply)</text>

  <path d="M260 396 L260 412" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,414 370,448 260,482 150,448" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="453" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">need &gt; 0 ?</text>

  <path d="M370 448 L386 448" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="438" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="390" y="420" width="118" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="449" y="442" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">use = min(need, s)</text>
  <text x="449" y="460" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += use × dist</text>
  <text x="449" y="474" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">need −= use</text>

  <!-- 循环回路 -->
  <path d="M445 418 L445 404 L328 404 L318 430" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M260 482 L260 498" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="496" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="170" y="500" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="522" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
</svg>
