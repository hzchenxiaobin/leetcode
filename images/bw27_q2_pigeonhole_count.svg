<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">鸽笼视角：distinct 数满 2^k 即成功，不用知道缺谁</text>

  <!-- 2^k 个格子 -->
  <text x="60" y="66" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">seen[0 .. 2^k−1]（k=2 共 4 格）</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="78" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="163" y="78" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="266" y="78" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="369" y="78" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
  </g>
  <text y="106" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="107">00 ✓</tspan><tspan x="210">01 ✓</tspan><tspan x="313">10 ✓</tspan><tspan x="416">11 ✓</tspan></text>
  <path d="M 107 128 Q 240 152 416 128" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="262" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt == 2^k → 全部出现，返回 true</text>

  <!-- 计数条 -->
  <text x="60" y="196" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">每遇到一个新的编码：seen[cur] = 1，cnt++</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="206" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="126" y="206" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="192" y="206" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="258" y="206" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="324" y="206" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <text y="224" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">旧编码</tspan><tspan x="156">旧编码</tspan><tspan x="222">旧编码</tspan><tspan x="288">新！cnt=4</tspan><tspan x="354">新！cnt=5</tspan></text>
  <text x="420" y="224" font-size="11.5" fill="#888" filter="url(#rough2)">← 重复出现的不再计数</text>

  <!-- 提前剪枝 -->
  <rect x="55" y="256" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="278" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">剪枝：长度 n 的串只有 n − k + 1 个长度为 k 的窗口，</text>
  <text x="72" y="298" font-size="11.5" fill="#555" filter="url(#rough2)">若 n − k + 1 &lt; 2^k，连窗口都不够，直接返回 false（还能省下 2^k 的建表内存）</text>
</svg>
