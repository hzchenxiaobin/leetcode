<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">星形分组：以质数 p 为中心清点它的合法路径</text>

  <!-- connectors -->
  <g stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)">
    <line x1="160" y1="205" x2="160" y2="112"/>
    <line x1="160" y1="205" x2="96"  y2="205"/>
    <line x1="160" y1="205" x2="160" y2="300"/>
  </g>

  <!-- prime center -->
  <circle cx="160" cy="205" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="160" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3a34" filter="url(#sk)">p</text>

  <!-- p's own group note -->
  <g filter="url(#sk)">
    <path d="M 214 148 L 178 190" stroke="#b85450" stroke-width="1.1" stroke-dasharray="4 3" fill="none"/>
    <text x="218" y="140" font-size="10.5" fill="#b85450">{p} 自成一组</text>
    <text x="218" y="155" font-size="10.5" fill="#b85450">（大小 1）</text>
  </g>

  <!-- island arms -->
  <g filter="url(#sk)">
    <rect x="100" y="70"  width="120" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="24"  y="186" width="112" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="100" y="300" width="120" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#2f5a22" filter="url(#sk)">
    <text x="160" y="95">孤岛₁（s₁ 个点）</text>
    <text x="80"  y="209">孤岛₂（s₂）</text>
    <text x="160" y="325">孤岛₃（s₃ 个点）</text>
  </g>
  <text x="160" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">（可以有 k 个臂，s₁ … s_k 为各孤岛大小）</text>

  <!-- formula card -->
  <rect x="312" y="60" width="344" height="280" rx="10" fill="#f0f0f0" stroke="#888" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="12" fill="#333" filter="url(#sk)">
    <text x="330" y="92" font-size="13.5" font-weight="bold" fill="#2b2b2b">贡献公式（p 这一类的路径条数）</text>
    <text x="330" y="124">组：{p}（大小 1）+ k 个邻接孤岛</text>
    <text x="330" y="146">孤岛大小 s₁, …, s_k，记 S = Σsᵢ</text>
    <text x="330" y="180">① 一端是 p（另一端任取岛内点）→ S 条</text>
    <text x="330" y="204">② 两端在不同岛 → Σ sᵢ·sⱼ 对（i &lt; j）</text>
    <text x="344" y="224">= (S² − Σsᵢ²) / 2</text>
    <text x="330" y="258" font-size="13.5" font-weight="bold" fill="#2b2b2b">合计 |C_p| = S + (S² − Σsᵢ²)/2</text>
  </g>
  <line x1="330" y1="276" x2="638" y2="276" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>
  <g font-size="11" fill="#666" filter="url(#sk)">
    <text x="330" y="298">校验（示例 2 的 p=2，s = (1,1)）：S = 2</text>
    <text x="330" y="318">→ 2 + (4 − 2)/2 = 3 条：(2,1)、(2,4)、(1,4) ✓</text>
  </g>
</svg>
