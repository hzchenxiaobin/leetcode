<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">划分点 DP：第 j 段恰以第 i 个元素结尾</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">覆盖元素 p+1 … i ⟹ 长度 i−p ≥ m ⟺ p ≤ i−m；其余 j−1 段全在前 p 个元素里</text>

  <!-- 划分点 / 结尾标记 -->
  <text x="260" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">p = 3</text>
  <line x1="260" y1="73" x2="260" y2="78" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="452" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">i = 6</text>
  <line x1="452" y1="73" x2="452" y2="78" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- 数组格子：前 3 个 = 前 p 个元素 -->
  <rect x="68" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 第 j 段 -->
  <rect x="260" y="78" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="78" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="388" y="78" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <text x="100" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="164" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="228" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−1</text>
  <text x="292" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="356" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- 前缀和标在边界上 -->
  <text x="38" y="146" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">pre</text>
  <text x="68" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="132" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="196" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="260" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="324" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="388" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>
  <text x="452" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">12</text>

  <!-- 左括号：前 p 个元素 -->
  <path d="M68,152 v16 h192 v-16" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="192" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">前 p 个元素 → f[p][j−1]</text>

  <!-- 右括号：第 j 段 -->
  <path d="M260,152 v16 h192 v-16" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="356" y="192" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第 j 段和 = pre[i]−pre[p] = 10</text>

  <!-- 转移公式 -->
  <rect x="36" y="208" width="488" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">f[i][j] = max( f[i−1][j],  max_{0 ≤ p ≤ i−m} ( f[p][j−1] + pre[i] − pre[p] ) )</text>
  <text x="280" y="260" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第一支：第 j 段不含第 i 个元素；第二支：恰以 i 结尾，起点交给 p 枚举</text>

  <!-- 底部要点 -->
  <rect x="36" y="296" width="488" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">上界 p ≤ i−m 正是「长度 ≥ m」；元素数不足 j·m 时为 −∞</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">−∞ 状态沿递推自动传播，无需特判非法情形</text>
</svg>
