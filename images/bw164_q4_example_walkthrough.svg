<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 2 演算：s = 0101，k = 3，答案 2</text>
  <text x="50" y="78" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">t = 1：flip 3 位，总量 3 与 z = 2 的奇偶不符（3 − 2 = 1 为奇数）→ 跳过</text>
  <text x="50" y="108" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">t = 2：总量 6，6 − 2 = 4 为偶数 ✓；容量 z·1 + (n−z)·1 = 2 + 2 = 4 ≥ 2 ✓</text>
  <text x="84" y="140" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">操作</text>
  <text x="194" y="140" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">翻转下标</text>
  <text x="344" y="140" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">结果</text>
  <line x1="80" y1="148" x2="460" y2="148" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="178" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">初始</text>
  <text x="194" y="178" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="344" y="178" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0101</text>
  <text x="84" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">操作 1</text>
  <text x="194" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">0, 1, 3</text>
  <text x="344" y="216" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1000</text>
  <text x="84" y="254" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">操作 2</text>
  <text x="194" y="254" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1, 2, 3</text>
  <text x="344" y="254" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1111</text>
  <rect x="430" y="140" width="226" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="543" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对应 f = (1,0,1,2)</text>
  <text x="543" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">偶数下标 0、2 一次</text>
  <text x="543" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">奇数下标 1 最多两次</text>
  <text x="543" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">总和 4 = t·k − z</text>
  <rect x="50" y="296" width="610" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="322" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">示例 3（s = 101，k = 2）：k 为偶数 ⇒ t·k 恒为偶数，</text>
  <text x="355" y="346" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">而 z = 1 为奇数，条件 ② 永远不成立 → 返回 −1</text>
</svg>
