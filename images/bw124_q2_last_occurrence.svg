<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">答案 = 频次最高那些字符的「最后一次出现」按位置拼起来</text>

  <g filter="url(#rough2)">
    <rect x="56" y="70" width="50" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.3"/>
    <rect x="112" y="70" width="50" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.3"/>
    <rect x="168" y="70" width="50" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.3"/>
    <rect x="224" y="70" width="50" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.3"/>
    <rect x="280" y="70" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="336" y="70" width="50" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3"/>
    <rect x="392" y="70" width="50" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g font-size="18" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="81" y="97">a</text><text x="137" y="97">a</text><text x="193" y="97">b</text>
    <text x="249" y="97">c</text><text x="305" y="97">b</text><text x="361" y="97">c</text>
    <text x="417" y="97">a</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="81" y="122">0</text><text x="137" y="122">1</text><text x="193" y="122">2</text>
    <text x="249" y="122">3</text><text x="305" y="122">4</text><text x="361" y="122">5</text>
    <text x="417" y="122">6</text>
  </g>
  <text x="305" y="140" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">b 的最后一次（第 4 位）</text>
  <text x="417" y="140" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">a 的最后一次（第 6 位）</text>
  <text x="361" y="58" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">c 只出现 2 次，被淘汰</text>

  <path d="M 305 148 C 330 176, 380 176, 410 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="184" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="14" fill="#2f5226" font-weight="bold" filter="url(#rough2)">答案 "ba"</text>

  <text x="280" y="248" text-anchor="middle" font-size="10.8" fill="#666" filter="url(#rough2)">a 的频次 3、b 的频次 3，都是最高；c 只有 2，第 2 轮就没了</text>
  <text x="280" y="268" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所以只需从右往左扫一遍，遇到「频次 = 最大值」且首次出现的字符就收集</text>
  <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">倒序收集再翻转，恰好就是它们在原串里的先后顺序</text>
</svg>
