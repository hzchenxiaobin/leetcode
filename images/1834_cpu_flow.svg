<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="560" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：外层 while 转 4 个动作</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">排序 → 快进（堆空）→ 解锁 → 选择执行，循环直到任务清空</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="240" y="58" width="240" height="56" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">tasks → (enq, proc, idx) 三元组</text>
  <text x="360" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">按 enq 排序；time=0, ptr=0, heap=∅</text>
  <path d="M 360,114 V 132" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <path d="M 360,138 L 462,184 L 360,230 L 258,184 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="360" y="189" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">ptr ＜ n 或 堆非空？</text>

  <!-- no branch -->
  <path d="M 258,184 H 150 V 254" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="200" y="176" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="60" y="258" width="180" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="150" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038" filter="url(#sk)">返回 result</text>
  <text x="150" y="302" text-anchor="middle" font-size="9.5" fill="#a04038" filter="url(#sk)">（长度恰为 n）</text>

  <!-- yes branch -->
  <path d="M 360,230 V 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="246" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <path d="M 360,256 L 452,300 L 360,344 L 268,300 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="360" y="305" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">堆空？</text>

  <!-- yes2: time jump -->
  <path d="M 452,300 H 560 V 322" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="498" y="292" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="470" y="326" width="190" height="52" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="565" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">time = max(time, enq[ptr])</text>
  <text x="565" y="366" text-anchor="middle" font-size="9.5" fill="#7a5415" filter="url(#sk)">时间快进：防 10¹⁴ 空转</text>
  <path d="M 565,378 V 428 H 486" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- no2 -->
  <path d="M 360,344 V 394" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="360" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- push box -->
  <g filter="url(#sk)">
    <rect x="240" y="400" width="240" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="422" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">while ptr＜n 且 enq[ptr] ≤ time</text>
  <text x="360" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">push (proc, idx)；ptr++</text>
  <text x="360" y="458" text-anchor="middle" font-size="9" fill="#3a6a2e" filter="url(#sk)">解锁：游标单调放行已到达任务</text>
  <path d="M 360,466 V 482" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pop box -->
  <g filter="url(#sk)">
    <rect x="240" y="486" width="240" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="508" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">pop (proc, idx) → result</text>
  <text x="360" y="526" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">time += proc</text>
  <text x="360" y="544" text-anchor="middle" font-size="9" fill="#3a6a2e" filter="url(#sk)">选择并执行：堆顶即答案</text>

  <!-- loop back -->
  <path d="M 480,519 H 636 Q 644,519 644,511 V 192 Q 644,184 636,184 H 470" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="652" y="298" font-size="9.5" fill="#555" filter="url(#sk)">每任务恰好</text>
  <text x="652" y="314" font-size="9.5" fill="#555" filter="url(#sk)">一进一出堆</text>

  <!-- amortized note -->
  <text x="40" y="516" font-size="9.5" fill="#555" filter="url(#sk)">摊还：内层 while 每轮 ptr++，</text>
  <text x="40" y="532" font-size="9.5" fill="#555" filter="url(#sk)">总迭代恰 n 次</text>
  <text x="40" y="548" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">→ 整体 O(n log n)</text>
</svg>
