<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟遍历计数 → 先乘 100 → 整除取整</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="230" cy="70" rx="44" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="230" y="75" text-anchor="middle" font-size="12.5" fill="#33455e">开始</text>
  <path d="M 230 90 V 106" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 计数循环 -->
  <g filter="url(#sk)"><rect x="130" y="112" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="230" y="134" text-anchor="middle" font-size="12.5" fill="#33455e">cnt = 0，遍历 s 的每个字符 c</text>
  <path d="M 230 146 V 168" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定 -->
  <g filter="url(#sk)"><path d="M 230 226 L 172 192 L 230 158 L 288 192 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="230" y="197" text-anchor="middle" font-size="12" fill="#7a5415">c == letter ?</text>
  <path d="M 172 192 Q 130 192 128 160 Q 126 130 128 129" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 128 132 Q 128 120 134 118" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="112" y="172" text-anchor="middle" font-size="10" fill="#666">否</text>
  <text x="112" y="185" font-size="9.5" fill="#999">(看下一个)</text>

  <!-- 命中分支 -->
  <path d="M 288 192 H 336" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="311" y="185" text-anchor="middle" font-size="10.5" fill="#4a7a3a">是</text>
  <g filter="url(#sk)"><rect x="342" y="176" width="96" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="390" y="197" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e">cnt += 1</text>
  <path d="M 438 176 Q 470 140 400 130 Q 340 122 336 129" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="492" y="158" font-size="10" fill="#4a7a3a">回到遍历</text>

  <!-- 遍历结束 -->
  <path d="M 230 226 V 252" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="245" y="244" font-size="10" fill="#666">遍历结束</text>

  <!-- 关键步骤：先乘后除 -->
  <g filter="url(#sk)"><rect x="130" y="258" width="308" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="284" y="276" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#2e5e2e">ans = cnt × 100 // n</text>
  <text x="284" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a">先乘 100 放大，再整除取整 —— 顺序是胜负手</text>
  <path d="M 284 298 V 320" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 返回 -->
  <g filter="url(#sk)"><ellipse cx="284" cy="346" rx="52" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="284" y="351" text-anchor="middle" font-size="12.5" fill="#33455e">返回 ans</text>

  <!-- 右侧注解 -->
  <g filter="url(#sk)"><rect x="466" y="112" width="150" height="66" rx="10" fill="#f4f4f4" stroke="#bdbdbd" stroke-width="1.3"/></g>
  <text x="541" y="134" text-anchor="middle" font-size="11" fill="#555">Python 计数一步到位:</text>
  <text x="541" y="152" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#33455e">s.count(letter)</text>
  <text x="541" y="169" text-anchor="middle" font-size="9.5" fill="#888">O(n) 内建，替代手写循环</text>

  <g filter="url(#sk)"><rect x="466" y="258" width="150" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="541" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">顺序铁律</text>
  <text x="541" y="297" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#7a5415">cnt×100//n ✔</text>
  <text x="541" y="314" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#a04040">cnt//n×100 ✘</text>
  <text x="541" y="330" text-anchor="middle" font-size="9.5" fill="#888">整除过早，放大无效</text>

  <text x="320" y="404" text-anchor="middle" font-size="11" fill="#888">非负操作数上，C++ 截断除与 Python // 向下取整结果一致 —— 「向下取整」由整数算术天然满足</text>
</svg>
