<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">染色区域是不断长大的菱形</text>

  <!-- n=1 -->
  <rect x="60" y="70" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n=1</text>
  <text x="68" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1 格</text>

  <!-- n=2: 1 + 4 -->
  <g filter="url(#rough2)">
    <rect x="182" y="54" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="166" y="70" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="182" y="70" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="198" y="70" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="182" y="86" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="190" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n=2</text>
  <text x="190" y="142" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1+4 = 5 格</text>

  <!-- n=3: 1+4+8 -->
  <g filter="url(#rough2)">
    <rect x="368" y="38" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="352" y="54" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="368" y="54" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="384" y="54" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="336" y="70" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="352" y="70" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="368" y="70" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="384" y="70" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="400" y="70" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="352" y="86" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="368" y="86" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="384" y="86" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="368" y="102" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="376" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n=3</text>
  <text x="376" y="158" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1+4+8 = 13 格</text>

  <path d="M 100 78 L 140 78" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 230 78 L 300 78" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="60" y="170" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="182" font-size="12" fill="#333" filter="url(#rough2)">第 1 分钟：任选一格</text>
  <rect x="60" y="192" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="204" font-size="12" fill="#333" filter="url(#rough2)">第 2 分钟：新增一圈 4 格</text>
  <rect x="60" y="214" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="226" font-size="12" fill="#333" filter="url(#rough2)">第 3 分钟：再新增一圈 8 格</text>

  <!-- 关键结论 -->
  <rect x="56" y="252" width="408" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">第 i 分钟把曼哈顿距离恰为 i−1 的格子全部染上</text>
  <text x="260" y="300" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">第 i 分钟新增 4(i−1) 个格子</text>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（四个方向各往外推 i−1 步）</text>
</svg>
