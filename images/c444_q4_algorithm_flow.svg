<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：bad 驱动停机，堆驱动选对</text>
  <path d="M 170 36 Q 320 43 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="140" y="50" width="360" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527c">初始化：prv/nxt 建链表</text>
  <text x="320" y="89" text-anchor="middle" font-size="11.5" fill="#28527c">n−1 个相邻对按现和入堆；统计初始 bad</text>
  <path d="M 320 100 L 320 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 bad==0 -->
  <g filter="url(#sk)">
    <polygon points="320,118 450,152 320,186 190,152" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">bad == 0 ?</text>
  <text x="320" y="166" text-anchor="middle" font-size="11" fill="#7a5415">（非递减？）</text>
  <path d="M 450 152 L 476 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="456" y="142" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="480" y="130" width="130" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="545" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">输出 ops</text>
  <path d="M 320 186 L 320 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="200" font-size="11" font-weight="bold" fill="#8a3a34">否</text>

  <!-- 弹堆顶 -->
  <g filter="url(#sk)">
    <rect x="140" y="206" width="360" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#28527c">弹出堆顶 (s, i)</text>
  <path d="M 320 250 L 320 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 校验 -->
  <g filter="url(#sk)">
    <polygon points="320,268 480,304 320,340 160,304" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">过三合一校验？</text>
  <text x="320" y="316" text-anchor="middle" font-size="10.5" fill="#7a5415">alive[i] 且 nxt[i]≠−1 且 现和 == s</text>
  <path d="M 480 304 L 560 304 Q 572 304 572 292 L 572 240 Q 572 228 560 228 L 504 228" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="574" y="266" font-size="11" font-weight="bold" fill="#b85450">否：过期，</text>
  <text x="574" y="280" font-size="11" font-weight="bold" fill="#b85450">丢弃再弹</text>
  <path d="M 320 340 L 320 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="352" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 合并 -->
  <g filter="url(#sk)">
    <rect x="140" y="358" width="360" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527c">合并 (i, j)：ops++；val[i] += val[j]</text>
  <text x="320" y="397" text-anchor="middle" font-size="11.5" fill="#28527c">从链表摘除 j，接回 (p, i, k)</text>
  <path d="M 320 410 L 320 424" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 维护 bad + 补推 -->
  <g filter="url(#sk)">
    <rect x="140" y="426" width="360" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#28527c">维护 bad 四处：(i,j)(j,k) 消失</text>
  <text x="320" y="466" text-anchor="middle" font-size="11.5" fill="#28527c">(p,i) 重判、(i,k) 新生；补推两对现和条目入堆</text>

  <!-- 回路：回到 bad==0 判定 -->
  <path d="M 140 453 L 90 453 Q 78 453 78 441 L 78 164 Q 78 152 90 152 L 186 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="86" y="300" font-size="11" font-weight="bold" fill="#666">下一轮</text>
</svg>
