<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：k = 10，operations = [0,1,0,1] ⇒ 'b'</text>
  <rect x="170" y="42" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="62" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="206" y="42" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="62" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="242" y="42" width="36" height="30" fill="#f2f4f7" stroke="#9aa7b5" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#5b6675" filter="url(#rough2)">0</text>
  <rect x="278" y="42" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="62" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="188" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₃</text>
  <text x="224" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₂</text>
  <text x="260" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₁</text>
  <text x="296" y="86" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">b₀</text>
  <text x="188" y="102" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ops[3]=1 ⇒ +1</text>
  <text x="224" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">位 0 ⇒ —</text>
  <text x="260" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">位 0 ⇒ —</text>
  <text x="296" y="102" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">ops[0]=0 ⇒ +0</text>
  <text x="430" y="56" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">落后半段的层：i = 3、i = 0</text>
  <text x="430" y="72" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（其中只有第 3 步是 +1）</text>
  <rect x="40" y="112" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">串长</text>
  <text x="130" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">位置 k</text>
  <text x="228" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定（前半 / 后半）</text>
  <text x="330" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">operations[i]</text>
  <text x="435" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="40" y="136" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">16</text>
  <text x="130" y="154" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">10</text>
  <text x="228" y="154" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">10 &gt; 8 ⇒ 落后半段</text>
  <text x="330" y="154" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">ops[3] = 1</text>
  <text x="435" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">k→2，记 +1</text>
  <rect x="40" y="164" width="440" height="28" fill="#f4f7fb" stroke="#9db4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">8</text>
  <text x="130" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="228" y="182" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2 ≤ 4 ⇒ 前半段</text>
  <text x="330" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ops[2] = 0</text>
  <text x="435" y="182" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">原样下落</text>
  <rect x="40" y="192" width="440" height="28" fill="#f4f7fb" stroke="#9db4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="130" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="228" y="210" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2 ≤ 2 ⇒ 前半段（压线）</text>
  <text x="330" y="210" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ops[1] = 1</text>
  <text x="435" y="210" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">原样下落（位是 0）</text>
  <rect x="40" y="220" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="130" y="238" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="228" y="238" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">2 &gt; 1 ⇒ 落后半段</text>
  <text x="330" y="238" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">ops[0] = 0</text>
  <text x="435" y="238" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">k→1，该步不加</text>
  <rect x="40" y="248" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="130" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="228" y="266" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">到达基准</text>
  <text x="330" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">—</text>
  <text x="435" y="266" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">字符 'a'（位移 0）</text>
  <rect x="40" y="286" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">累计位移 +1 ⇒ ans = 'a' + 1 = 'b' ✓</text>
  <text x="260" y="322" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">闭式对照：bits(9) = {0, 3}，ops[3] + ops[0] = 1 + 0 = 1</text>
  <text x="260" y="336" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">掩码：1001₂ &amp; 1010₂ = 1000₂，popcount = 1 ⇒ 'b'，两条路线吻合</text>
</svg>
