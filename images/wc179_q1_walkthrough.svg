<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 4 / 2 / 7 的构造与频次校验</text>

  <text x="160" y="62" font-size="11" fill="#999" filter="url(#rough2)">构造输出</text>
  <text x="420" y="62" font-size="11" fill="#999" filter="url(#rough2)">频次校验</text>

  <!-- n = 4 偶 -->
  <text x="60" y="102" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n = 4（偶）</text>
  <rect x="160" y="82" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="103" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="196" y="82" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211" y="103" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="232" y="82" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="103" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="268" y="82" width="30" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="283" y="103" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">b</text>
  <text x="420" y="95" font-size="11.5" fill="#333" filter="url(#rough2)">a: 3（奇）✓ b: 1（奇）✓</text>
  <text x="420" y="113" font-size="10.5" fill="#666" filter="url(#rough2)">3 + 1 = 4 ✓</text>

  <!-- n = 2 偶 -->
  <text x="60" y="182" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n = 2（偶）</text>
  <rect x="160" y="162" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="183" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="196" y="162" width="30" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="211" y="183" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">b</text>
  <text x="420" y="175" font-size="11.5" fill="#333" filter="url(#rough2)">a: 1（奇）✓ b: 1（奇）✓</text>
  <text x="420" y="193" font-size="10.5" fill="#666" filter="url(#rough2)">1 + 1 = 2 ✓</text>

  <!-- n = 7 奇 -->
  <text x="60" y="262" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">n = 7（奇）</text>
  <rect x="160" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="194" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="228" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="262" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="277" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="296" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="330" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <rect x="364" y="242" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="263" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">a</text>
  <text x="420" y="255" font-size="11.5" fill="#333" filter="url(#rough2)">a: 7（奇）✓</text>
  <text x="420" y="273" font-size="10.5" fill="#666" filter="url(#rough2)">7 = 7 ✓</text>

  <!-- 底部说明框 -->
  <rect x="60" y="300" width="440" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">官方示例 n=4 输出「pppz」= p:3 + z:1，与「aaab」同为 3+1 拆分</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Special Judge：任意合法串均判通过，输出不必与示例一致</text>
  <text x="280" y="369" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n=7 官方输出「holasss」是 1+1+1+1+3 的五块拆分 —— 拆法无穷，最简只有两块</text>
</svg>
