<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单调栈：从右往左前插 x，水位 ≤ x 的台阶整体压平</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">蓝色阶梯 = 前缀最大值 M_l，绿柱 = 原值；栈条目 (水位 v, 起点 q, 长度 len, 区间和 w, 后缀代价 T)</text>

  <!-- ===== left panel: before flatten ===== -->
  <text x="195" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">压平前（l=2：[3,5,2,12,2,11,6]）</text>

  <line x1="42" y1="265" x2="350" y2="265" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 57 265 L 57 229 L 93 229 L 93 205 L 173 205 L 173 121 L 333 121 L 333 265 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="57" y="229" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="97" y="205" width="36" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="137" y="241" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="177" y="121" width="36" height="144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="217" y="241" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="257" y="133" width="36" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="297" y="193" width="36" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>

  <text x="75" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">v=3</text>
  <text x="135" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">v=5</text>
  <text x="255" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">v=12</text>

  <text x="75" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="115" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <text x="155" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <text x="195" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">12</text>
  <text x="235" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <text x="275" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">11</text>
  <text x="315" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">6</text>
  <text x="75" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="115" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="155" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="195" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="235" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="275" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="315" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <text x="195" y="318" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">单调栈（左 = 底端，右 = 顶端）</text>
  <g filter="url(#rough2)"><rect x="57" y="326" width="88" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="101" y="347" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">v=3 q=2</text>
  <g filter="url(#rough2)"><rect x="153" y="326" width="88" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="197" y="347" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">v=5 q=3</text>
  <g filter="url(#rough2)"><rect x="249" y="326" width="88" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="293" y="347" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">v=12 q=5</text>

  <!-- ===== middle arrow ===== -->
  <path d="M 350 190 L 402 190" stroke="#d6a040" stroke-width="3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">前插 x=10</text>
  <text x="378" y="214" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（l: 2 → 1）</text>

  <!-- ===== right panel: after flatten ===== -->
  <text x="570" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">压平后（l=1：[10,3,5,2,12,2,11,6]）</text>

  <line x1="427" y1="265" x2="715" y2="265" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 429 265 L 429 145 L 569 145 L 569 121 L 713 121 L 713 265 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="429" y="145" width="32" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="465" y="229" width="32" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="501" y="205" width="32" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="537" y="241" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="573" y="121" width="32" height="144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="609" y="241" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="645" y="133" width="32" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="681" y="193" width="32" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <!-- newly raised water: idx 2..4 lifted to level 10 -->
  <g filter="url(#rough2)"><rect x="465" y="145" width="32" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="501" y="145" width="32" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="537" y="145" width="32" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>

  <text x="500" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">v=10</text>
  <text x="643" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">v=12</text>

  <text x="445" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">10</text>
  <text x="481" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="517" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <text x="553" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <text x="589" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">12</text>
  <text x="625" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <text x="661" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">11</text>
  <text x="697" y="283" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">6</text>
  <text x="445" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="481" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="517" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="553" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="589" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="625" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="661" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="697" y="299" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <text x="570" y="318" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">v=3、v=5 两级台阶被压平进 v=10</text>
  <g filter="url(#rough2)"><rect x="429" y="326" width="140" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="499" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">v=10 q=1 len=4</text>
  <g filter="url(#rough2)"><rect x="583" y="326" width="110" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="638" y="347" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">v=12 q=5</text>

  <!-- ===== bottom strip ===== -->
  <g filter="url(#rough2)"><rect x="40" y="392" width="680" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="60" y="412" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">合并：len = 1+Σlen_pop，w = x+Σw_pop，新台阶代价 S = x·len − w（本例 len=1+1+2=4，S=10×4−20=20）</text>
  <text x="60" y="428" font-size="11" fill="#444" filter="url(#rough2)">每个元素至多进栈 / 出栈一次（均摊 O(1)）；台阶只在底端进出，上方条目的 T（该台阶到末尾的代价和）不受影响</text>
</svg>
