<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例 2 走查：n = 4，三个串 1010 / 0001 / 0110</text>

  <text x="44" y="82" font-size="12.5" fill="#555" filter="url(#rough2)">收到序</text>
  <text x="64" y="108" font-size="12.5" fill="#555" filter="url(#rough2)">L0</text>
  <text x="64" y="140" font-size="12.5" fill="#555" filter="url(#rough2)">L1</text>
  <text x="64" y="172" font-size="12.5" fill="#555" filter="url(#rough2)">L2</text>

  <rect x="96" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="132" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="168" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="204" y="88" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <text x="114" y="108" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">1</text>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>
  <text x="186" y="108" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">1</text>
  <text x="222" y="108" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>

  <rect x="96" y="120" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="132" y="120" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="168" y="120" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="204" y="120" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <text x="114" y="140" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>
  <text x="150" y="140" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>
  <text x="186" y="140" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>
  <text x="222" y="140" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">1</text>

  <rect x="96" y="152" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="132" y="152" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="168" y="152" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <rect x="204" y="152" width="36" height="28" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <text x="114" y="172" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>
  <text x="150" y="172" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">1</text>
  <text x="186" y="172" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">1</text>
  <text x="222" y="172" text-anchor="middle" font-size="13" fill="#1f3b57" filter="url(#rough2)">0</text>

  <text x="114" y="200" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="150" y="200" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="186" y="200" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="222" y="200" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">4</text>

  <text x="44" y="228" font-size="12.5" fill="#444" filter="url(#rough2)">列值：1, 4, 5, 2</text>
  <text x="44" y="250" font-size="11.5" fill="#b85450" filter="url(#rough2)">多出 5、少了 3 —— 需要换位序</text>

  <path d="M256,130 L300,130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <rect x="308" y="76" width="356" height="192" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="486" y="100" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">DFS：N=4，d=3 ⇒ need = 4−4+1 = 1</text>
  <text x="328" y="128" font-size="12" fill="#4a7a3a" filter="url(#rough2)">① 最高位那一行在 5 列上只能有 1 个 1</text>
  <text x="344" y="150" font-size="12" fill="#2c4a22" filter="url(#rough2)">⇒ 只有 0001 合格，bit2 ← L1</text>
  <text x="328" y="178" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② L1=0 的 4 列（含补的 0 列）正好是</text>
  <text x="344" y="200" font-size="12" fill="#2c4a22" filter="url(#rough2)">2 位满立方体 ⇒ 自动成立</text>
  <text x="328" y="228" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ L1=1 只有第 4 列，值是 0，</text>
  <text x="344" y="250" font-size="12" fill="#2c4a22" filter="url(#rough2)">剩下两位自由 ⇒ 2! 种</text>

  <rect x="44" y="288" width="620" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="354" y="310" text-anchor="middle" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">合法位序：bit2←0001，bit1←0110，bit0←1010 ⇒ p = [1,2,3,4]</text>
  <text x="354" y="332" text-anchor="middle" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">交换 bit0 / bit1 得 p = [2,1,3,4]，共 2 个</text>

  <rect x="44" y="356" width="620" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="354" y="378" text-anchor="middle" font-size="12.5" fill="#8a3040" filter="url(#rough2)">2 = |Aut({1,2,3,4})|：只有“交换 bit0 / bit1”这一个非平凡对称</text>
  <text x="354" y="398" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">与收到的串是什么无关，只要列集合能靠换位序接回 {1,…,n}</text>
</svg>
