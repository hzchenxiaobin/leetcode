<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="492" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：[0,1,4,4,5,7]，答案 = F(6) − F(2) = 6</text>
  <path d="M 140 34 Q 320 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sorted array with l / r and batch arcs -->
  <text x="62" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">有序数组</text>
  <g filter="url(#sk)">
    <rect x="130" y="78" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="188" y="78" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="246" y="78" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="304" y="78" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="362" y="78" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="420" y="78" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="156" y="100" fill="#2b4a6b">0</text>
    <text x="214" y="100" fill="#2e5a22">1</text>
    <text x="272" y="100" fill="#2e5a22">4</text>
    <text x="330" y="100" fill="#2e5a22">4</text>
    <text x="388" y="100" fill="#8a6415">5</text>
    <text x="446" y="100" fill="#8a3430">7</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#999">
    <text x="156" y="124">0</text>
    <text x="214" y="124">1</text>
    <text x="272" y="124">2</text>
    <text x="330" y="124">3</text>
    <text x="388" y="124">4</text>
    <text x="446" y="124">5</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="1.5">
    <path d="M 156 72 Q 185 50 214 72"/>
    <path d="M 156 72 Q 214 44 272 72"/>
    <path d="M 156 72 Q 243 38 330 72"/>
    <path d="M 156 72 Q 272 30 388 72"/>
  </g>
  <text x="480" y="66" font-size="12" font-weight="bold" fill="#2e5a22">一次计入 4 对</text>
  <text x="480" y="84" font-size="10" fill="#4a7a3a">0+1, 0+4, 0+4, 0+5 全部 ≤ 6</text>
  <text x="480" y="100" font-size="10" fill="#4a7a3a">（r−l = 4−0 = 4）</text>
  <path d="M 156 150 L 156 134" stroke="#446688" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="156" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">l</text>
  <path d="M 388 150 L 388 134" stroke="#d6a040" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="388" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">r</text>
  <text x="446" y="164" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗ 上轮 r−− 已淘汰</text>

  <!-- F(6) step table -->
  <g filter="url(#sk)">
    <ellipse cx="60" cy="200" rx="40" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="60" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a22">F(6)</text>
  <g filter="url(#sk)">
    <rect x="120" y="182" width="490" height="160" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="120" y="182" width="490" height="24" rx="4" fill="#e8f0fe" stroke="none"/>
    <rect x="120" y="228" width="490" height="22" rx="4" fill="#e6f4ea" stroke="none"/>
    <rect x="120" y="338" width="490" height="22" rx="4" fill="#e6f4ea" stroke="none"/>
  </g>
  <g filter="url(#sk)" stroke="#b0b0b0" stroke-width="1">
    <line x1="120" y1="206" x2="610" y2="206"/>
    <line x1="120" y1="250" x2="610" y2="250"/>
    <line x1="120" y1="272" x2="610" y2="272"/>
    <line x1="120" y1="294" x2="610" y2="294"/>
    <line x1="120" y1="316" x2="610" y2="316"/>
    <line x1="120" y1="338" x2="610" y2="338"/>
    <line x1="170" y1="182" x2="170" y2="360"/>
    <line x1="210" y1="182" x2="210" y2="360"/>
    <line x1="300" y1="182" x2="300" y2="360"/>
    <line x1="370" y1="182" x2="370" y2="360"/>
    <line x1="500" y1="182" x2="500" y2="360"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b">
    <text x="145" y="198">l</text>
    <text x="190" y="198">r</text>
    <text x="255" y="198">a[l]+a[r]</text>
    <text x="335" y="198">vs 6</text>
    <text x="435" y="198">动作</text>
    <text x="555" y="198">累计 ans</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#444">
    <text x="145" y="223">0</text><text x="190" y="223">5</text><text x="255" y="223">0+7=7</text><text x="335" y="223" font-weight="bold" fill="#b85450">&gt;</text><text x="435" y="223">r−−</text><text x="555" y="223">0</text>
    <text x="145" y="245">0</text><text x="190" y="245">4</text><text x="255" y="245">0+5=5</text><text x="335" y="245" font-weight="bold" fill="#4a7a3a">≤</text><text x="435" y="245" font-weight="bold">+4 对，l++</text><text x="555" y="245" font-weight="bold">4</text>
    <text x="145" y="267">1</text><text x="190" y="267">4</text><text x="255" y="267">1+5=6</text><text x="335" y="267" font-weight="bold" fill="#4a7a3a">≤</text><text x="435" y="267">+3 对，l++</text><text x="555" y="267">7</text>
    <text x="145" y="289">2</text><text x="190" y="289">4</text><text x="255" y="289">4+5=9</text><text x="335" y="289" font-weight="bold" fill="#b85450">&gt;</text><text x="435" y="289">r−−</text><text x="555" y="289">7</text>
    <text x="145" y="311">2</text><text x="190" y="311">3</text><text x="255" y="311">4+4=8</text><text x="335" y="311" font-weight="bold" fill="#b85450">&gt;</text><text x="435" y="311">r−−</text><text x="555" y="311">7</text>
    <text x="145" y="333" font-weight="bold">相遇</text><text x="190" y="333">—</text><text x="255" y="333">—</text><text x="335" y="333">—</text><text x="435" y="333">结束</text><text x="555" y="333" font-weight="bold">F(6) = 7</text>
  </g>

  <!-- F(2) condensed -->
  <g filter="url(#sk)">
    <ellipse cx="60" cy="392" rx="40" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="60" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3430">F(2)</text>
  <g filter="url(#sk)">
    <rect x="120" y="372" width="490" height="42" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="365" y="389" text-anchor="middle" font-size="10.5" fill="#444">0+7、0+5、0+4、0+4 都 &gt; 2 → 连续 r−− 直至 r = 1</text>
  <text x="365" y="407" text-anchor="middle" font-size="10.5" fill="#444">0+1 = 1 ≤ 2 → ans += 1，随后 l = r 相遇结束，F(2) = 1</text>

  <!-- final bar -->
  <g filter="url(#sk)">
    <rect x="120" y="426" width="490" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="365" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a22">答案 = F(upper) − F(lower−1) = 7 − 1 = 6 ✓</text>

  <!-- bottom note -->
  <text x="365" y="478" text-anchor="middle" font-size="10.5" fill="#888">批量性：l 一次右移计入 r−l 对；r 一次左移淘汰一个元素 → 每步 O(1)，单次 F 共 O(n)</text>
</svg>
