<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">固定阈值 d = 3：按「上一个被选下标」做链式 DP</text>

  <g filter="url(#rough2)">
    <rect x="120" y="52" width="88" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="208" y="52" width="88" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="296" y="52" width="88" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="384" y="52" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="164" y="74">−1</text><text x="252" y="74">3</text><text x="340" y="74">4</text><text x="428" y="74">8</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="164" y="100">i=0</text><text x="252" y="100">i=1</text><text x="340" y="100">i=2</text><text x="428" y="100">i=3</text>
  </g>
  <path d="M 118 44 L 392 44" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="38" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">i=3 时 8 − d = 5，可接的起点是 −1、3、4</text>

  <g font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="130">c=1</text><text x="70" y="170">c=2</text><text x="70" y="210">c=3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="120" y="112" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="208" y="112" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="296" y="112" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="384" y="112" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="120" y="152" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="208" y="152" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="296" y="152" width="88" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="384" y="152" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="120" y="192" width="88" height="30" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="208" y="192" width="88" height="30" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="296" y="192" width="88" height="30" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="384" y="192" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="164" y="132">1</text><text x="252" y="132">1</text><text x="340" y="132">1</text><text x="428" y="132">1</text>
    <text x="164" y="172">0</text><text x="252" y="172">1</text><text x="340" y="172">1</text><text x="428" y="172">3</text>
    <text x="164" y="212">0</text><text x="252" y="212">0</text><text x="340" y="212">0</text><text x="428" y="212">2</text>
  </g>
  <text x="280" y="248" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">ways[c][i] = Σ ways[c−1][p]（p 满足 a[i] − a[p] ≥ d）</text>

  <rect x="60" y="262" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">count(能量 ≥ 3) = 0 + 0 + 0 + 2 = 2</text>
  <rect x="60" y="302" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">指针 p 随 i 单调右移 ⇒ 每层 O(n)，总共 O(n·k)</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对应子序列：{−1,3,8}、{−1,4,8}（都不含相邻差小于 3 的一对）</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后「相邻差都 ≥ d」等价于「任意两元素差 ≥ d」</text>
</svg>
