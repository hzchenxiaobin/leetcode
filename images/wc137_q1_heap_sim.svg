<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">大顶堆模拟：每次取两个最大，差回堆</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">堆里元素不足 2 个时结束，堆顶（或 0）即答案</text>

  <polygon points="280,72 340,112 280,152 220,112" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#3a4a66">堆大小 &gt; 1 ?</text>

  <path d="M 280 152 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="170" font-size="10" fill="#4a7a3a">是</text>

  <rect x="150" y="178" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="10.5" fill="#3a5a30">x = pop()，y = pop()（x ≥ y）</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888">两次 O(log n) 取最大</text>

  <path d="M 280 222 L 280 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,246 350,282 280,318 210,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#8a6a20">x == y ?</text>

  <path d="M 350 282 L 448 282 L 448 226" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="274" font-size="10" fill="#4a7a3a">是</text>
  <rect x="368" y="176" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="452" y="196" text-anchor="middle" font-size="10" fill="#3a5a30">两块都粉碎，什么都不放回</text>
  <text x="452" y="212" text-anchor="middle" font-size="10" fill="#888">堆大小减 2</text>

  <path d="M 210 282 L 120 282 L 120 300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="274" font-size="10" fill="#8a3a36">否</text>
  <rect x="30" y="302" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="322" text-anchor="middle" font-size="10" fill="#8a3a36">push(x − y)：新石头入堆</text>
  <text x="120" y="338" text-anchor="middle" font-size="10" fill="#888">堆大小减 1</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999">每轮至少减少一个元素 → 至多 n−1 轮，总时间 O(n log n)</text>
</svg>
