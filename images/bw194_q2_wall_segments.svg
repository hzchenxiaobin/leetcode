<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：越界元素是「墙」，墙切出的极大合法段各自独立计数</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1, 4, 7, 3]，minK = 1，maxK = 5 —— 子数组合法当且仅当它不含墙</text>

  <!-- 数组格子 -->
  <rect x="190" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="326" y="72" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="354" y="97" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="394" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="218" y="128" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">在界内</text>
  <text x="286" y="128" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">在界内</text>
  <text x="354" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">越界 → 墙</text>
  <text x="422" y="128" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">在界内</text>

  <!-- 段括线 -->
  <path d="M192,146 L192,158 L312,158 L312,146" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="252" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段A：L = 2，贡献 1+2 = 3</text>
  <text x="252" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">[1]　[4]　[1,4]</text>
  <path d="M396,146 L396,158 L448,158 L448,146" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="422" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段B：L = 1</text>
  <text x="422" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">贡献 1：[3]</text>

  <!-- 反例框 -->
  <rect x="60" y="212" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">含墙全非法：[7]✗　[4,7]✗　[7,3]✗　[1,4,7,3]✗ —— 只要碰到 7 都不算，墙两侧不能拼接</text>

  <!-- 公式框 -->
  <rect x="60" y="262" width="520" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">长度为 L 的极大合法段内，任意连续子数组都合法，共 L×(L+1)/2 个</text>

  <!-- 汇总框 -->
  <rect x="60" y="316" width="520" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="340" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 各段贡献之和 = 3 + 1 = 4（示例 1）</text>

  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「全在界内」「不含墙」「完整落在某段内」是同一件事的三种说法</text>
</svg>
