<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">机器人是挡板：数轴被切成一个个独立间隙</text>

  <rect x="40" y="44" width="285" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="182" y="66" text-anchor="middle" font-size="11" fill="#9a7218" filter="url(#rough2)">每堵墙只属于一个间隙（或某个机器人位置）</text>
  <rect x="340" y="44" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="66" text-anchor="middle" font-size="11" fill="#2f5d26" filter="url(#rough2)">间隙里的墙只能由它两侧相邻的机器人打到</text>

  <path d="M137,122 L228,122" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="185" y="112" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">R₁ 向右：被 R₂ 挡住 ✗</text>

  <path d="M267,160 L400,160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">R₂ 向右：打到 min(r₂+d₂, r₃) 为止</text>

  <rect x="50" y="218" width="57" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="137" y="218" width="100" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="263" y="218" width="144" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="433" y="218" width="99" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="558" y="218" width="62" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <path d="M50,225 L620,225" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="180" y="214" width="9" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="300" y="214" width="9" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="345" y="214" width="9" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="385" y="214" width="9" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="480" y="214" width="9" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="590" y="214" width="9" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <circle cx="120" cy="225" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">R₁</text>
  <circle cx="250" cy="225" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">R₂</text>
  <circle cx="420" cy="225" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">R₃</text>
  <circle cx="545" cy="225" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">R₄</text>

  <rect x="541" y="188" width="9" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="528" y="184" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">与 R₄ 同位置 → 必毁 ✓</text>

  <text x="78" y="250" text-anchor="middle" font-size="10" fill="#9a7218" filter="url(#rough2)">左外</text>
  <text x="187" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">G₁</text>
  <text x="335" y="250" text-anchor="middle" font-size="10" fill="#2f5d26" filter="url(#rough2)">G₂</text>
  <text x="482" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">G₃</text>
  <text x="589" y="250" text-anchor="middle" font-size="10" fill="#9a7218" filter="url(#rough2)">右外</text>

  <path d="M413,278 L341,278" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="377" y="296" text-anchor="middle" font-size="10" fill="#9a7218" filter="url(#rough2)">R₃ 向左：打到 ≥ r₃−d₃ 为止</text>

  <text x="120" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r₁</text>
  <text x="250" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r₂</text>
  <text x="420" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r₃</text>
  <text x="545" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r₄</text>

  <rect x="40" y="348" width="290" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">间隙独立</text>
  <text x="185" y="392" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">Gᵢ 里的墙只能由 rᵢ 向右、rᵢ₊₁ 向左摧毁</text>
  <text x="185" y="408" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">端外间隙只归端点机器人管</text>

  <rect x="345" y="348" width="275" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="482" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d26" filter="url(#rough2)">全员开枪不亏</text>
  <text x="482" y="392" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">与机器人同位置的墙恒被摧毁 → 固定 base</text>
  <text x="482" y="408" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">剩下每个间隙的得分只看相邻两个方向</text>
</svg>
