<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算（示例 1 的同一个 grid）</text>

  <!-- ===== left: adjacentSum(4) ===== -->
  <text x="130" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">adjacentSum(4)</text>

  <g filter="url(#rough2)">
    <rect x="55" y="66" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="155" y="66" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="155" y="116" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="55" y="166" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="155" y="166" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>

    <rect x="105" y="66" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="55" y="116" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="155" y="116" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="105" y="166" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>

    <rect x="105" y="116" width="50" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <text x="80" y="97" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>
  <text x="130" y="97" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="180" y="97" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">2</text>
  <text x="80" y="147" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">3</text>
  <text x="130" y="147" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="180" y="147" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">5</text>
  <text x="80" y="197" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">6</text>
  <text x="130" y="197" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">7</text>
  <text x="180" y="197" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">8</text>

  <text x="130" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1 + 3 + 5 + 7 = 16</text>

  <!-- ===== right: diagonalSum(8) ===== -->
  <text x="365" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07820" filter="url(#rough2)">diagonalSum(8)</text>

  <g filter="url(#rough2)">
    <rect x="290" y="66" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="340" y="66" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="390" y="66" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="290" y="116" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="390" y="116" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="290" y="166" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="340" y="166" width="50" height="50" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>

    <rect x="340" y="116" width="50" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="390" y="166" width="50" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <text x="315" y="97" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">0</text>
  <text x="365" y="97" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">1</text>
  <text x="415" y="97" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">2</text>
  <text x="315" y="147" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">3</text>
  <text x="365" y="147" text-anchor="middle" font-size="15" fill="#a07820" filter="url(#rough2)">4</text>
  <text x="415" y="147" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">5</text>
  <text x="315" y="197" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">6</text>
  <text x="365" y="197" text-anchor="middle" font-size="15" fill="#999999" filter="url(#rough2)">7</text>
  <text x="415" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">8</text>

  <!-- out-of-grid ghost cells (diagonals of corner 8) -->
  <g filter="url(#rough2)">
    <rect x="440" y="116" width="50" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="340" y="216" width="50" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="440" y="216" width="50" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <text x="465" y="146" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="365" y="246" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="465" y="246" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">×</text>

  <text x="365" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07820" filter="url(#rough2)">越界方向不计入 → 答案 4</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="75" y="298" width="370" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#7a6a30" filter="url(#rough2)">绿色 = 被查询的值　蓝色 = 上下左右邻居　橙色 = 对角邻居</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#7a6a30" filter="url(#rough2)">红色虚线 × = 越界方向，直接跳过</text>
</svg>
