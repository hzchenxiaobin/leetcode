<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="axg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888888"/>
    </marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="abr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：摘到的 = 含 startPos 区间内的全部水果，先走的一侧要「走两遍」</text>
  <path d="M 150 40 Q 360 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">每步 ±1 ⇒ 足迹是连续区间 [L, R] 且 L ≤ s ≤ R；来回折返不改变摘取量，只浪费步数</text>

  <text x="46" y="88" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">观察一：任意走法的足迹 = 含 s 的区间</text>

  <path d="M 70 152 L 648 152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#axg)" filter="url(#sk)"/>

  <circle cx="100" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="100" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">5</text>
  <circle cx="175" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="175" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">3</text>
  <circle cx="225" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="225" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">8</text>
  <circle cx="300" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="300" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">2</text>
  <circle cx="420" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="420" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">6</text>
  <circle cx="465" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="465" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">4</text>
  <circle cx="515" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="515" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">3</text>
  <circle cx="630" cy="152" r="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="630" y="137" text-anchor="middle" font-size="9.5" fill="#b06a10" filter="url(#sk)">9</text>

  <line x1="140" y1="144" x2="140" y2="160" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="140" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">L</text>
  <text x="140" y="190" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">最左到过</text>
  <line x1="580" y1="144" x2="580" y2="160" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="580" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">R</text>
  <text x="580" y="190" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">最右到过</text>

  <line x1="360" y1="152" x2="360" y2="98" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#sk)"/>
  <polygon points="360,94 384,102 360,110" fill="#b85450" filter="url(#sk)"/>
  <text x="392" y="106" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">startPos (s)</text>
  <line x1="360" y1="142" x2="360" y2="162" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="360" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">s</text>

  <path d="M 144 122 L 144 114 M 144 118 L 356 118 M 356 122 L 356 114" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="250" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">a = s − L</text>
  <path d="M 364 122 L 364 114 M 364 118 L 576 118 M 576 122 L 576 114" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="470" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">b = R − s</text>

  <path d="M 140 160 L 140 168 M 140 164 L 580 164 M 580 160 L 580 168" stroke="#888" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">区间 [L, R]：内部水果全摘（一颗不剩），外部全无（一步没到）</text>
  <text x="360" y="204" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">哪怕路线来回折返 N 次，去过位置的 min / max 仍是 L、R —— 摘取量只由 [L, R] 决定</text>

  <rect x="40" y="218" width="310" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="195" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">形状一：先左后右（左走两遍）</text>
  <path d="M 70 296 L 316 296" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#axg)" filter="url(#sk)"/>
  <line x1="105" y1="290" x2="105" y2="302" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="185" y1="290" x2="185" y2="302" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="285" y1="290" x2="285" y2="302" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="105" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">L</text>
  <text x="185" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">s</text>
  <text x="285" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">R</text>
  <path d="M 181 278 L 112 278" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#agr)" filter="url(#sk)"/>
  <text x="145" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">① 左 a 步</text>
  <path d="M 112 262 L 291 262" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#abr)" filter="url(#sk)"/>
  <text x="200" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">② 折返向右 a + b 步</text>
  <rect x="125" y="320" width="140" height="22" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="195" y="335" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">代价 = 2a + b</text>

  <rect x="370" y="218" width="310" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="525" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">形状二：先右后左（右走两遍）</text>
  <path d="M 400 296 L 646 296" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#axg)" filter="url(#sk)"/>
  <line x1="435" y1="290" x2="435" y2="302" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="515" y1="290" x2="515" y2="302" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="615" y1="290" x2="615" y2="302" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="435" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">L</text>
  <text x="515" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">s</text>
  <text x="615" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">R</text>
  <path d="M 519 278 L 611 278" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="568" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">① 右 b 步</text>
  <path d="M 611 262 L 442 262" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#abr)" filter="url(#sk)"/>
  <text x="530" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">② 折返向左 a + b 步</text>
  <rect x="455" y="320" width="140" height="22" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#sk)"/>
  <text x="525" y="335" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">代价 = a + 2b</text>

  <rect x="60" y="362" width="600" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="360" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">覆盖 [L, R] 的最少步数 = min(2a + b, a + 2b) —— 先走的一侧被计算两次，先走短的一侧更划算</text>
  <text x="360" y="408" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">单侧退化无需特判：b = 0 时 min(2a, a) = a（只向左）；a = 0 时 min(b, 2b) = b（只向右）</text>

  <text x="360" y="452" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">问题归约：选区间 [L, R] 使代价 ≤ k，最大化区间内水果数 —— 位置已排序，前缀和 O(1) 查询</text>
</svg>
