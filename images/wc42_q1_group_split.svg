<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按最低不同位分组：一次遍历拆出两个数</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">x = 2 ⊕ 3 = 0b001，最低位 b = 0（2 的末位为 0，3 的末位为 1）</text>

  <rect x="40" y="60" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="82" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">2 = 0b010</text>
  <rect x="205" y="60" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">3 = 0b011</text>
  <rect x="370" y="60" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="82" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">x = 0b001</text>

  <text x="280" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">二者在第 0 位不同 ⇒ 按 v &amp; low 分组，一定落入两个不同的桶</text>

  <rect x="40" y="132" width="230" height="176" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="155" y="156" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">组 A：v &amp; low = 0</text>
  <text x="58" y="182" font-size="10" fill="#3a4a66" filter="url(#rough2)">1..n 中：2, 4</text>
  <text x="58" y="202" font-size="10" fill="#3a4a66" filter="url(#rough2)">nums 中：2, 2, 4</text>
  <text x="58" y="226" font-size="10" fill="#3a4a66" filter="url(#rough2)">异或：2 ⊕ 4 ⊕ 2 ⊕ 2 ⊕ 4</text>
  <text x="58" y="246" font-size="10" fill="#3a4a66" filter="url(#rough2)">　　　= 2</text>
  <rect x="126" y="258" width="86" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a = 2</text>

  <rect x="290" y="132" width="230" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="405" y="156" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">组 B：v &amp; low = 1</text>
  <text x="308" y="182" font-size="10" fill="#8a6a20" filter="url(#rough2)">1..n 中：1, 3</text>
  <text x="308" y="202" font-size="10" fill="#8a6a20" filter="url(#rough2)">nums 中：1</text>
  <text x="308" y="226" font-size="10" fill="#8a6a20" filter="url(#rough2)">异或：1 ⊕ 3 ⊕ 1</text>
  <text x="308" y="246" font-size="10" fill="#8a6a20" filter="url(#rough2)">　　　= 3</text>
  <rect x="352" y="258" width="86" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b = 3</text>

  <path d="M 155 312 L 155 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 312 L 405 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="330" width="460" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2 在 nums 中出现 → 重复值；3 不在 nums 中 → 缺失值</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">返回 [2, 3]</text>

  <text x="280" y="392" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">nums 与 1..n 两个来源都要参与分组，漏掉一边会破坏抵消</text>
</svg>
