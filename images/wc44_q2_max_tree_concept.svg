<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">最大二叉树：最大值定根，左右分段递归</text>
  <rect x="70" y="58" width="64" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102.0" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="102.0" y="118" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i=0</text>
  <rect x="146" y="58" width="64" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178.0" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="178.0" y="118" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i=1</text>
  <rect x="222" y="58" width="64" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254.0" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="254.0" y="118" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i=2</text>
  <rect x="298" y="58" width="64" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330.0" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">6</text>
  <text x="330.0" y="118" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i=3</text>
  <rect x="374" y="58" width="64" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406.0" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="406.0" y="118" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i=4</text>
  <rect x="450" y="58" width="64" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482.0" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <text x="482.0" y="118" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i=5</text>
  <text x="368" y="82" font-size="11.5" fill="#b85450" filter="url(#rough2)">← 全局最大值</text>
  <path d="M 70,126 L 70,132 L 286,132 L 286,126" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="178" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">左段 [3,2,1] → 左子树</text>
  <path d="M 374,126 L 374,132 L 514,132 L 514,126" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="444" y="154" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">右段 [0,5] → 右子树</text>
  <path d="M 352,102 L 352,198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <ellipse cx="330" cy="212" rx="27" ry="23" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="219" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">6</text>
  <path d="M 310,230 L 216,284" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="246" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">左子树</text>
  <path d="M 350,230 L 446,284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="0"/>
  <text x="416" y="256" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">右子树</text>
  <ellipse cx="196" cy="300" rx="24" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="306" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <ellipse cx="464" cy="300" rx="24" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="464" y="306" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="48" y="344" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="370" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">中序遍历顺序 = 原数组顺序</text>
  <rect x="372" y="344" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="370" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">父节点值 ≥ 子节点值（大顶堆）</text>
</svg>
