<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="580" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：闭区间扫描 + 单串两次 O(1) 判定 + 计数</text>

  <!-- 开始 -->
  <rect x="280" y="32" width="80" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="49" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,58 L320,72" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="220" y="74" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="93" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans ← 0，i ← left</text>
  <path d="M320,104 L320,118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 pill -->
  <rect x="170" y="120" width="300" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">i ≤ right ？处理 words[i]（闭区间，含两端）</text>

  <!-- 退出路径：i > right -->
  <path d="M170,127 L40,127 L40,494 L266,494" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="120" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i &gt; right：范围扫完</text>

  <path d="M320,146 L320,160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：首字符 -->
  <polygon points="320,160 452,196 320,232 188,196" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">首字符 w[0] 是元音？</text>
  <text x="320" y="208" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（w.front() ∈ V）</text>

  <!-- 否：右侧跳过 -->
  <text x="466" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M452,196 L486,196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="178" width="138" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="559" y="194" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">跳过：ans 不加</text>
  <text x="559" y="208" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">看下一个 i</text>
  <path d="M559,178 L559,146 L474,144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="162" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 是 -->
  <text x="330" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M320,232 L320,250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：尾字符 -->
  <polygon points="320,252 452,288 320,324 188,288" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="284" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">尾字符 w.back() 是元音？</text>
  <text x="320" y="300" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（串长 1 时与 w[0] 同一格）</text>

  <!-- 否：右侧跳过 -->
  <text x="466" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M452,288 L486,288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="270" width="138" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="559" y="286" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">跳过：ans 不加</text>
  <text x="559" y="300" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">看下一个 i</text>
  <path d="M628,288 L632,288 L632,138 L474,138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="572" y="132" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 是：ans++ -->
  <text x="330" y="340" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M320,324 L320,342" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="246" y="344" width="148" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="364" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans ← ans + 1</text>

  <!-- ans++ 回到循环 -->
  <path d="M246,360 L104,360 L104,139 L164,139" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="354" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 返回 -->
  <rect x="270" y="478" width="100" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="498" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <path d="M320,510 L320,524" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="285" y="526" width="70" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="542" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- 底部警示 -->
  <rect x="30" y="552" width="580" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="568" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">⚠️ 头号罚时点：闭区间是 i ≤ right（C++）/ range(left, right+1)（Python）——写成半开会静默漏掉 right 处的字符串</text>
</svg>
