<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">x = 3：f(19) 只有两种主项可选</text>
  <rect x="200" y="52" width="160" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">f(19)</text>
  <path d="M 240 96 L 160 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 96 L 400 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">9 + 10（k=2）</text>
  <text x="410" y="116" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">27 − 8（k=2, 借位）</text>
  <rect x="80" y="138" width="160" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">f(10)</text>
  <rect x="320" y="138" width="160" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="165" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">f(8)</text>
  <path d="M 140 182 L 100 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">9 + 1</text>
  <path d="M 400 182 L 440 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">9 − 1</text>
  <rect x="50" y="216" width="100" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">f(1)=1</text>
  <rect x="390" y="216" width="100" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="240" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">f(1)=1</text>
  <rect x="60" y="268" width="440" height="56" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">f(10) = 2 + 1 = 3，f(8) = 2 + 1 = 3</text>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">f(19) = min(2 + 3, 3 + 3) = 5 ✓</text>
</svg>
