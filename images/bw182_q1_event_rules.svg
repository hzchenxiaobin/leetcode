<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分数验证器：9 种事件，两个计数器</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">score 记分，counter 记 "W" 的次数；counter 到 10 立刻停</text>
  <rect x="30" y="76" width="140" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="101" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">"0" "1" "2"</text>
  <rect x="178" y="76" width="350" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="101" text-anchor="start" font-size="10.5" fill="#555">score += 0 / 1 / 2</text>
  <rect x="30" y="120" width="140" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="145" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">"3" "4" "6"</text>
  <rect x="178" y="120" width="350" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="145" text-anchor="start" font-size="10.5" fill="#555">score += 3 / 4 / 6</text>
  <rect x="30" y="164" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="189" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">"W"</text>
  <rect x="178" y="164" width="350" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="189" text-anchor="start" font-size="10.5" fill="#555">counter += 1，score 不变</text>
  <rect x="30" y="208" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="233" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">"WD"</text>
  <rect x="178" y="208" width="350" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="233" text-anchor="start" font-size="10.5" fill="#555">score += 1，counter 不变</text>
  <rect x="30" y="252" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="277" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">"NB"</text>
  <rect x="178" y="252" width="350" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="277" text-anchor="start" font-size="10.5" fill="#555">score += 1，counter 不变</text>
  <rect x="30" y="300" width="498" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="279" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">停止条件：所有事件处理完 或 counter 变成 10</text>
  <text x="279" y="332" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">达到 10 后剩余事件一律忽略，不再加分</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">"W" 只加计数不加分；"WD"/"NB" 只加 1 分不加计数</text>
</svg>
