<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双重枚举切分点 (i, j) 取最小</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)">
    <ellipse cx="340" cy="66" rx="40" ry="17" fill="#f2f7fc" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="71" text-anchor="middle" font-size="13" fill="#2b6e9e">开始</text>
  <path d="M 340 83 L 340 96" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- split -->
  <g filter="url(#sk2)">
    <rect x="215" y="100" width="250" height="28" rx="6" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.5"/>
  </g>
  <text x="340" y="119" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">定位 '+' → 拆出 num1、num2</text>
  <path d="M 340 128 L 340 142" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- outer loop i -->
  <g filter="url(#sk2)">
    <rect x="205" y="146" width="270" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="166" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-family="monospace">外层 i = 0 … len(num1)−1   b=num1[i:]</text>
  <path d="M 340 176 L 340 190" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- inner loop j -->
  <g filter="url(#sk2)">
    <rect x="205" y="194" width="270" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="214" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-family="monospace">内层 j = 1 … len(num2)   c=num2[:j]</text>
  <path d="M 340 224 L 340 238" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- evaluate -->
  <g filter="url(#sk2)">
    <rect x="185" y="242" width="310" height="44" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="260" text-anchor="middle" font-size="12" fill="#9a6a15" font-family="monospace">A=a 非空? int(a):1   D=d 非空? int(d):1</text>
  <text x="340" y="279" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a15" font-family="monospace">val = A × (B + C) × D</text>
  <path d="M 340 286 L 340 298" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision -->
  <g filter="url(#sk2)">
    <polygon points="340,302 480,330 340,358 200,330" fill="#fdf6ee" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="335" text-anchor="middle" font-size="12.5" fill="#9a6a15" font-family="monospace">val &lt; best ?</text>

  <!-- yes branch -->
  <text x="488" y="320" font-size="11.5" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 480 330 L 494 330" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <rect x="500" y="302" width="160" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="580" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">best = val</text>
  <text x="580" y="344" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">ans = a+(b+c)+d</text>

  <!-- no branch: next j -->
  <text x="186" y="322" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 200 330 L 140 330 L 140 209 L 201 209" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="132" y="272" font-size="10.5" fill="#888" text-anchor="end">下一个 j</text>

  <!-- j exhausted: next i -->
  <path d="M 340 358 L 340 372" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="352" y="370" font-size="10.5" fill="#888">j 扫完</text>
  <path d="M 340 372 L 96 372 L 96 161 L 201 161" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="88" y="272" font-size="10.5" fill="#888" text-anchor="end">下一个 i</text>

  <!-- green box to end -->
  <path d="M 580 358 L 580 404 L 392 404" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- end -->
  <g filter="url(#sk2)">
    <ellipse cx="348" cy="404" rx="44" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="348" y="409" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="26" y="432" width="628" height="30" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="340" y="452" text-anchor="middle" font-size="12.5" fill="#333">切分组合 ≤ 5×5 = 25，每组 O(n) 切串转整数；n ≤ 10 ⇒ 整体 O(n²)，实际常数级瞬过。</text>
</svg>
