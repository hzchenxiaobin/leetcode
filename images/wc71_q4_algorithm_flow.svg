<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先判可行，再分别数行 / 列错位</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行与列是两个独立的一维子问题，答案直接相加</text>

  <rect x="160" y="66" width="300" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="91" text-anchor="middle" font-size="12" fill="#2f3f55" filter="url(#rough2)">输入 n × n 的 0/1 矩阵 board</text>
  <path d="M 310 108 L 310 124" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="120" y="128" width="380" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">验证 b[i][j] ⊕ b[i][0] ⊕ b[0][j] ⊕ b[0][0] = 0</text>
  <path d="M 310 176 L 310 192" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="160" y="196" width="300" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">对所有 i, j 都成立 ？</text>
  <path d="M 460 217 L 528 217" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="492" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="532" y="196" width="76" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="570" y="222" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <path d="M 310 240 L 310 256" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="320" y="252" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="120" y="260" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="287" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">取一维序列 R[i] = b[i][0]，C[j] = b[0][j]</text>
  <path d="M 310 306 L 310 320" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="90" y="324" width="440" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="351" text-anchor="middle" font-size="11.5" fill="#2f3f55" filter="url(#rough2)">枚举 t ∈ {0,1}：目标位 target_i = i%2 ⊕ t</text>
  <path d="M 310 370 L 310 384" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="90" y="388" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="410" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">数量一致 → 候选 = 错位数 ÷ 2</text>
  <text x="310" y="432" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">两个 t 都取最小，转成 0/1 排序的最少交换</text>
  <path d="M 310 446 L 310 460" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="110" y="464" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="492" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">答案 = rowCost + colCost</text>
  <text x="310" y="534" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">任一序列数量不匹配或无合法 t → 返回 -1</text>
</svg>
