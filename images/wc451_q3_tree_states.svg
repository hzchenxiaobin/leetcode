<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="920" height="580" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">核心观察：买入价只由「直属上司是否购买」决定</text>
  <path d="M 280 44 Q 460 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="36" y="60" width="400" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="236" y="81" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#sk)">情形 A：上司 ✗ 未购买 → v 付全价</text>

  <rect x="96" y="128" width="140" height="50" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="166" y="149" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#sk)">上司 u</text>
  <text x="166" y="168" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">✗ 不买</text>
  <path d="M 166 180 L 166 222" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="96" y="226" width="140" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="166" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#sk)">员工 v</text>
  <text x="166" y="266" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">今天买入</text>
  <rect x="264" y="226" width="168" height="50" rx="6" fill="#fffdf3" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="348" y="247" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#sk)">花费 present[v]</text>
  <text x="348" y="266" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">利润 future[v]−present[v]</text>
  <text x="236" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">v 的价格与祖父 / 兄弟 / 更远的亲戚无关！</text>

  <rect x="484" y="60" width="400" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="684" y="81" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">情形 B：上司 ✓ 购买 → v 可付半价</text>

  <rect x="544" y="128" width="140" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="614" y="149" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#sk)">上司 u</text>
  <text x="614" y="168" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✓ 买了</text>
  <path d="M 614 180 L 614 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="648" y="207" text-anchor="start" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#sk)">解锁半价</text>
  <rect x="544" y="226" width="140" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="614" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#sk)">员工 v</text>
  <text x="614" y="266" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">今天买入</text>
  <rect x="712" y="226" width="172" height="50" rx="6" fill="#fffdf3" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="798" y="247" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">花费 ⌊present[v]/2⌋</text>
  <text x="798" y="266" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">利润 future[v]−⌊present[v]/2⌋</text>
  <text x="684" y="306" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">「可以」半价而非强制，但半价 ≤ 全价，永不更差</text>

  <rect x="36" y="330" width="848" height="94" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="354" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#sk)">每个结点 u 递归返回两张表（j = 花费上限，B = budget）</text>
  <text x="460" y="378" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">full[u][j]：上司没买（u 只能付全价 present[u]）时，子树(u) 花费 ≤ j 的最大利润</text>
  <text x="460" y="402" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">half[u][j]：上司买了（u 可付半价 ⌊present[u]/2⌋）时，子树(u) 花费 ≤ j 的最大利润</text>

  <rect x="36" y="444" width="848" height="116" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="468" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">两个独立自由度：u 的「价格」与 u 的「决策」互不干扰</text>
  <text x="460" y="492" text-anchor="middle" font-size="12" fill="#3d5a30" filter="url(#sk)">上司买没买 → 决定 u 查 full 还是 half（只影响 u 自己那一项）</text>
  <text x="460" y="516" text-anchor="middle" font-size="12" fill="#3d5a30" filter="url(#sk)">u 买不买 → 决定孩子查 half 还是 full（只影响孩子的世界）</text>
  <text x="460" y="542" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">预算是唯一的跨子树耦合 → 树上背包 merge 逐个合并孩子</text>
</svg>
