<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">合并模型：每合并两段，代价 = 两段最大值之积</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">叶子看作 n 个长度为 1 的区间；一棵树恰好对应 n−1 次「相邻区间合并」</text>

  <text x="150" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">方案 A：先并 6,2</text>
  <text x="420" y="76" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">方案 B：先并 2,4</text>

  <g filter="url(#rough2)">
    <path d="M 162 112 L 136 140" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 162 112 L 219 204" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 136 166 L 91 204" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 136 166 L 143 204" stroke="#446688" stroke-width="1.5" fill="none"/>
    <rect x="118" y="86" width="88" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="162" y="104" text-anchor="middle" font-size="11" fill="#8a3a36">6 × 4 = 24</text>
    <rect x="104" y="140" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="136" y="158" text-anchor="middle" font-size="11" fill="#8a3a36">6 × 2 = 12</text>
    <rect x="72" y="205" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="91" y="223" text-anchor="middle" font-size="11" fill="#3a4a66">6</text>
    <rect x="124" y="205" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="143" y="223" text-anchor="middle" font-size="11" fill="#3a4a66">2</text>
    <rect x="200" y="205" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="219" y="223" text-anchor="middle" font-size="11" fill="#3a4a66">4</text>
    <text x="150" y="252" text-anchor="middle" font-size="11" fill="#b85450">非叶总和 12 + 24 = 36</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 462 112 L 436 140" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 462 112 L 339 204" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 436 166 L 391 204" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 436 166 L 467 204" stroke="#446688" stroke-width="1.5" fill="none"/>
    <rect x="418" y="86" width="88" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="462" y="104" text-anchor="middle" font-size="11" fill="#3a5a30">6 × 4 = 24</text>
    <rect x="404" y="140" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="436" y="158" text-anchor="middle" font-size="11" fill="#3a5a30">2 × 4 = 8</text>
    <rect x="320" y="205" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="339" y="223" text-anchor="middle" font-size="11" fill="#3a4a66">6</text>
    <rect x="372" y="205" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="391" y="223" text-anchor="middle" font-size="11" fill="#3a4a66">2</text>
    <rect x="448" y="205" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="467" y="223" text-anchor="middle" font-size="11" fill="#3a4a66">4</text>
    <text x="415" y="252" text-anchor="middle" font-size="11" fill="#3a5a30">非叶总和 8 + 24 = 32（更优）</text>
  </g>

  <rect x="30" y="268" width="500" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="46" y="290" font-size="11" fill="#8a6a20" font-weight="bold">逐元素计费：每个元素（全局最大除外）贡献 a[i] × min(左最近 ≥, 右最近 ≥)</text>
    <text x="46" y="312" font-size="10.5" fill="#555">元素 2 ：min(6, 4) = 4 → 2 × 4 = 8　　元素 4 ：min(6, ∞) = 6 → 4 × 6 = 24</text>
    <text x="46" y="334" font-size="10.5" fill="#555">元素 6 是全局最大 → 不贡献；合计 8 + 24 = 32，与方案 B 一致</text>
    <text x="46" y="356" font-size="10" fill="#888">「最近 ≥」指左右两侧第一个不小于它的元素；某一侧不存在时记为 ∞</text>
  </g>

  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n ≤ 40 时区间 DP 也能过，但上面的计费公式给出 O(n) 的单调栈实现</text>
</svg>
