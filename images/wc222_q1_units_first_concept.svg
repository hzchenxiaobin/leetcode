<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
  </defs>
  <rect width="620" height="460" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：一个箱子 = 一个车位（代价相同），单元数 = 收益</text>
  <path d="M 150 38 Q 310 46 470 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- inventory row -->
  <text x="70" y="68" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#r)">仓库 boxTypes = [[1,3],[2,2],[3,1]]（示例 1）</text>
  <g filter="url(#r)">
    <rect x="70" y="78" width="56" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="150" y="78" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="216" y="78" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="296" y="78" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="362" y="78" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="428" y="78" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#r)">
    <text x="98" y="105" fill="#2e6e2e">3</text>
    <text x="178" y="105" fill="#2b4a6e">2</text>
    <text x="244" y="105" fill="#2b4a6e">2</text>
    <text x="324" y="105" fill="#888">1</text>
    <text x="390" y="105" fill="#888">1</text>
    <text x="456" y="105" fill="#888">1</text>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#r)">
    <text x="98" y="140" fill="#4a7a3a">3 单元/箱 ×1</text>
    <text x="211" y="140" fill="#446688">2 单元/箱 ×2</text>
    <text x="390" y="140" fill="#999">1 单元/箱 ×3</text>
  </g>

  <!-- arrow to truck -->
  <path d="M 300 152 L 300 186" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="470" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b0722a" filter="url(#r)">按单元数降序装车：先装 3，再装 2，最后 1</text>

  <!-- truck -->
  <text x="70" y="200" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">卡车（truckSize = 4 个车位）</text>
  <g filter="url(#r)">
    <rect x="70" y="208" width="380" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <path d="M 165 212 L 165 266" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M 260 212 L 260 266" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M 355 212 L 355 266" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4"/>
  </g>
  <g filter="url(#r)">
    <rect x="89" y="216" width="56" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="184" y="216" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="279" y="216" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="374" y="216" width="56" height="44" rx="5" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#r)">
    <text x="117" y="243" fill="#2e6e2e">3</text>
    <text x="212" y="243" fill="#2b4a6e">2</text>
    <text x="307" y="243" fill="#2b4a6e">2</text>
    <text x="402" y="243" fill="#888">1</text>
  </g>
  <g filter="url(#r)">
    <rect x="458" y="194" width="70" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="470" y="204" width="34" height="18" rx="3" fill="#fdfcf7" stroke="#999" stroke-width="1.2"/>
    <circle cx="140" cy="274" r="9" fill="#fdfcf7" stroke="#446688" stroke-width="2"/>
    <circle cx="250" cy="274" r="9" fill="#fdfcf7" stroke="#446688" stroke-width="2"/>
    <circle cx="360" cy="274" r="9" fill="#fdfcf7" stroke="#446688" stroke-width="2"/>
    <circle cx="486" cy="274" r="9" fill="#fdfcf7" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="260" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">装车单元 = 3 + 2 + 2 + 1 = 8（4 个车位全部用满）✓</text>

  <!-- leftover boxes -->
  <g filter="url(#r)">
    <rect x="70" y="316" width="44" height="36" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <rect x="124" y="316" width="44" height="36" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
    <path d="M 76 322 L 108 346" stroke="#b85450" stroke-width="2"/>
    <path d="M 108 322 L 76 346" stroke="#b85450" stroke-width="2"/>
    <path d="M 130 322 L 162 346" stroke="#b85450" stroke-width="2"/>
    <path d="M 162 322 L 130 346" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="178" y="338" font-size="11.5" fill="#999" filter="url(#r)">剩下 2 个 1 单元箱：</text>
  <text x="178" y="354" font-size="11.5" fill="#999" filter="url(#r)">车位已满，装不下</text>

  <!-- wrong-direction compare -->
  <g filter="url(#r)">
    <rect x="280" y="316" width="300" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="430" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#r)">反着装（先小后大）：1+1+1+2 = 5 单元</text>
  <text x="430" y="360" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#r)">同样 4 个车位，少赚 3 个单元 ✗</text>

  <!-- conclusion callout -->
  <g filter="url(#r)">
    <rect x="55" y="390" width="510" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">每个箱子代价相同（都占 1 个车位），收益不同（单元数）</text>
  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#444" filter="url(#r)">⇒ 按单元数降序装车，贪心即最优（等代价、最大收益）</text>
</svg>
