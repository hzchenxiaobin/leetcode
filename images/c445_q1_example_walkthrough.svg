<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：三个示例的数轴快照</text>
  <path d="M 210 40 Q 330 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="185" cy="60" rx="10" ry="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="185" y="64" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="200" y="64" font-size="11" fill="#555">第 1 人（x）</text>
  <g filter="url(#sk)">
    <ellipse cx="315" cy="60" rx="10" ry="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="315" y="64" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="330" y="64" font-size="11" fill="#555">第 2 人（y）</text>
  <g filter="url(#sk)">
    <ellipse cx="450" cy="60" rx="10" ry="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="450" y="64" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">z</text>
  <text x="465" y="64" font-size="11" fill="#555">第 3 人（不动）</text>

  <!-- Row 1 -->
  <text x="55" y="86" font-size="11" font-weight="bold" fill="#2b2b2b">示例 1：x=2, y=7, z=4</text>
  <path d="M 110 112 L 510 112" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <g stroke="#aaa" stroke-width="1" filter="url(#sk)">
    <path d="M 110 108 L 110 116"/><path d="M 160 108 L 160 116"/><path d="M 210 108 L 210 116"/>
    <path d="M 260 108 L 260 116"/><path d="M 310 108 L 310 116"/><path d="M 360 108 L 360 116"/>
    <path d="M 410 108 L 410 116"/><path d="M 460 108 L 460 116"/><path d="M 510 108 L 510 116"/>
  </g>
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="110" y="129">0</text><text x="160" y="129">1</text><text x="210" y="129">2</text>
    <text x="260" y="129">3</text><text x="310" y="129">4</text><text x="360" y="129">5</text>
    <text x="410" y="129">6</text><text x="460" y="129">7</text><text x="510" y="129">8</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="210" cy="112" rx="12" ry="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="210" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)">
    <ellipse cx="310" cy="112" rx="12" ry="11" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="310" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">z</text>
  <g filter="url(#sk)">
    <ellipse cx="460" cy="112" rx="12" ry="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="460" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="260" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">d1=2</text>
  <text x="385" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">d2=3</text>
  <g filter="url(#sk)">
    <rect x="540" y="93" width="105" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="592" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">返回 1</text>

  <!-- Row 2 -->
  <text x="55" y="188" font-size="11" font-weight="bold" fill="#2b2b2b">示例 2：x=2, y=5, z=6</text>
  <path d="M 110 214 L 510 214" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <g stroke="#aaa" stroke-width="1" filter="url(#sk)">
    <path d="M 110 210 L 110 218"/><path d="M 160 210 L 160 218"/><path d="M 210 210 L 210 218"/>
    <path d="M 260 210 L 260 218"/><path d="M 310 210 L 310 218"/><path d="M 360 210 L 360 218"/>
    <path d="M 410 210 L 410 218"/><path d="M 460 210 L 460 218"/><path d="M 510 210 L 510 218"/>
  </g>
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="110" y="231">0</text><text x="160" y="231">1</text><text x="210" y="231">2</text>
    <text x="260" y="231">3</text><text x="310" y="231">4</text><text x="360" y="231">5</text>
    <text x="410" y="231">6</text><text x="460" y="231">7</text><text x="510" y="231">8</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="210" cy="214" rx="12" ry="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="210" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)">
    <ellipse cx="360" cy="214" rx="12" ry="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="360" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)">
    <ellipse cx="410" cy="214" rx="12" ry="11" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="410" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">z</text>
  <text x="290" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">d1=4</text>
  <text x="385" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">d2=1</text>
  <g filter="url(#sk)">
    <rect x="540" y="195" width="105" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="592" y="219" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">返回 2</text>

  <!-- Row 3 -->
  <text x="55" y="290" font-size="11" font-weight="bold" fill="#2b2b2b">示例 3：x=1, y=5, z=3</text>
  <path d="M 110 316 L 510 316" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <g stroke="#aaa" stroke-width="1" filter="url(#sk)">
    <path d="M 110 312 L 110 320"/><path d="M 160 312 L 160 320"/><path d="M 210 312 L 210 320"/>
    <path d="M 260 312 L 260 320"/><path d="M 310 312 L 310 320"/><path d="M 360 312 L 360 320"/>
    <path d="M 410 312 L 410 320"/><path d="M 460 312 L 460 320"/><path d="M 510 312 L 510 320"/>
  </g>
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="110" y="333">0</text><text x="160" y="333">1</text><text x="210" y="333">2</text>
    <text x="260" y="333">3</text><text x="310" y="333">4</text><text x="360" y="333">5</text>
    <text x="410" y="333">6</text><text x="460" y="333">7</text><text x="510" y="333">8</text>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="160" cy="316" rx="12" ry="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="160" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)">
    <ellipse cx="260" cy="316" rx="12" ry="11" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="260" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">z</text>
  <g filter="url(#sk)">
    <ellipse cx="360" cy="316" rx="12" ry="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="360" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="210" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">d1=2</text>
  <text x="310" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">d2=2</text>
  <g filter="url(#sk)">
    <rect x="540" y="297" width="105" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="592" y="321" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">返回 0</text>

  <g filter="url(#sk)">
    <rect x="40" y="364" width="580" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="381" text-anchor="middle" font-size="11" fill="#888">三个示例恰好命中三分支：d1&lt;d2 → 1；d2&lt;d1 → 2；d1=d2 → 0（同时到达）</text>
</svg>
