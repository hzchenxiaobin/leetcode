<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">围栏 = 凸包的边界（含边上的树）</text>

  <polygon points="110,260 230,320 470,200 350,140 230,80"
           fill="#e8f0fe" fill-opacity="0.72" stroke="#446688" stroke-width="2.2"
           filter="url(#rough2)"/>

  <path d="M 350,140 L 418,122" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3"
        fill="none" filter="url(#rough2)"/>
  <rect x="420" y="98" width="200" height="48" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="117" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">共线点 (3,3) 也在边上：</text>
  <text x="430" y="135" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">它落在 (4,2)-(2,4) 这条边上</text>

  <circle cx="110" cy="260" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="230" cy="320" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="470" cy="200" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="350" cy="140" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="230" cy="80" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="230" cy="200" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"
          stroke-dasharray="3 2" filter="url(#rough2)"/>

  <text x="76" y="252" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(1,1)</text>
  <text x="240" y="344" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(2,0)</text>
  <text x="482" y="196" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(4,2)</text>
  <text x="358" y="128" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(3,3)</text>
  <text x="240" y="70" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(2,4)</text>
  <text x="248" y="196" font-size="11.5" fill="#b85450" filter="url(#rough2)" paint-order="stroke" stroke="#fafafa" stroke-width="2.8" stroke-linejoin="round">(2,2) 严格在内部</text>

  <circle cx="52" cy="368" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="372" font-size="11.5" fill="#333" filter="url(#rough2)">围栏上的树（返回）</text>
  <circle cx="252" cy="368" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="266" y="372" font-size="11.5" fill="#333" filter="url(#rough2)">内部的树（不返回）</text>

  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">绳子只绕一圈 → 贴绳的树恰是凸包边界上的点</text>
</svg>
