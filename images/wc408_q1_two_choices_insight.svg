<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="580" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：两个选择互为镜像，胜负塌缩为 s₁ ≠ s₂</text>
  <path d="M 190 40 Q 380 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A: bucketing ===== -->
  <text x="380" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 按位数分桶：值域 1 ≤ x ≤ 99，每个数恰属一类</text>

  <text x="238" y="105" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">nums =</text>
  <g filter="url(#rough2)">
    <rect x="245" y="82" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="291" y="82" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="337" y="82" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="383" y="82" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="429" y="82" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="475" y="82" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="265" y="103" fill="#446688">1</text>
    <text x="311" y="103" fill="#446688">2</text>
    <text x="357" y="103" fill="#446688">3</text>
    <text x="403" y="103" fill="#446688">4</text>
    <text x="449" y="103" fill="#446688">5</text>
    <text x="495" y="103" fill="#a07820" font-weight="bold">14</text>
  </g>

  <path d="M 245 122 Q 357 134 469 122" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 475 122 Q 495 134 515 122" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="272" y="136" width="156" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="350" y="153" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">个位数之和 s₁ = 15</text>
  <g filter="url(#rough2)">
    <rect x="436" y="136" width="156" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="514" y="153" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">两位数之和 s₂ = 14</text>

  <text x="380" y="182" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">两桶不重不漏——Bob 没有决策权，他拿到的永远是「另一桶」的全部</text>

  <!-- ===== Panel B: two mirrored choices ===== -->
  <text x="380" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② Alice 只有两种整类选法（得分互为镜像）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="228" width="316" height="130" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="198" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">选择①：拿走所有个位数</text>
  <text x="198" y="280" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">Alice 得 s₁ = 15，Bob 得 s₂ = 14</text>
  <text x="198" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">获胜 ⟺ s₁ &gt; s₂</text>
  <text x="198" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">15 &gt; 14 ✓ 成立</text>

  <text x="380" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666" filter="url(#rough2)">或</text>

  <g filter="url(#rough2)">
    <rect x="404" y="228" width="316" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="562" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">选择②：拿走所有两位数</text>
  <text x="562" y="280" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">Alice 得 s₂ = 14，Bob 得 s₁ = 15</text>
  <text x="562" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">获胜 ⟺ s₂ &gt; s₁</text>
  <text x="562" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#rough2)">14 &gt; 15 ✗ 不成立</text>

  <path d="M 198 358 C 200 382, 250 378, 310 374" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 562 358 C 560 382, 510 378, 450 374" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel C: merge ===== -->
  <g filter="url(#rough2)">
    <rect x="110" y="372" width="540" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="380" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">两个条件互斥：s₁ &gt; s₂ 与 s₂ &gt; s₁ 不能同时成立</text>
  <text x="380" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">Alice 获胜 ⟺ s₁ &gt; s₂ 或 s₂ &gt; s₁ ⟺ s₁ ≠ s₂</text>

  <!-- ===== takeaway ===== -->
  <g filter="url(#rough2)">
    <rect x="24" y="468" width="712" height="100" rx="10" fill="#fffdf3" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">签到题最短路径：别模拟两次选择、别单独算 Bob 的和——一趟分桶求和，比较两桶是否相等</text>
  <text x="380" y="518" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">s₁ = s₂ → false（平局，两种选择都「严格大于」失败）；否则谁大选谁 → true</text>
  <text x="380" y="544" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">本例 15 ≠ 14 → true：Alice 选个位数，Bob 拿两位数</text>
</svg>
