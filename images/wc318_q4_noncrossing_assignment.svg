<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="29" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：交叉配对可以交换成不交叉配对</text>
  <path d="M 165 41 Q 340 49 515 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="35" y="58" width="290" height="275" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="180" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5f14" filter="url(#sk)">交叉：a → F，b → G</text>
  <text x="85" y="124" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">机器人 a</text>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">机器人 b</text>
  <g filter="url(#sk)"><circle cx="85" cy="153" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="260" cy="153" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="85" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#31506f" filter="url(#sk)">a</text>
  <text x="260" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#31506f" filter="url(#sk)">b</text>
  <text x="172" y="139" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">a ≤ b</text>
  <path d="M 90 176 Q 155 213 253 249" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 255 176 Q 188 213 92 249" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="58" y="251" width="55" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="232" y="251" width="55" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="85" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#35602c" filter="url(#sk)">G</text>
  <text x="260" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#35602c" filter="url(#sk)">F</text>
  <text x="172" y="313" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">G ≤ F</text>

  <g filter="url(#sk)"><rect x="355" y="58" width="290" height="275" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="500" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#35602c" filter="url(#sk)">交换后：a → G，b → F</text>
  <text x="405" y="124" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">机器人 a</text>
  <text x="580" y="124" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">机器人 b</text>
  <g filter="url(#sk)"><circle cx="405" cy="153" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="580" cy="153" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="405" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#31506f" filter="url(#sk)">a</text>
  <text x="580" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#31506f" filter="url(#sk)">b</text>
  <path d="M 405 177 Q 399 213 405 246" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 580 177 Q 586 213 580 246" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="378" y="251" width="55" height="38" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="552" y="251" width="55" height="38" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="405" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#35602c" filter="url(#sk)">G</text>
  <text x="580" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#35602c" filter="url(#sk)">F</text>
  <text x="500" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#35602c" filter="url(#sk)">总距离不增，工厂用量不变</text>

  <g filter="url(#sk)"><rect x="55" y="351" width="570" height="57" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="340" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#31506f" filter="url(#sk)">|a−F| + |b−G|  ≥  |a−G| + |b−F|</text>
  <text x="340" y="397" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">反复交换消除所有交叉 → 存在排序后单调对应的最优解</text>
</svg>
