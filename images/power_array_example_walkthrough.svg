<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 1, 7]（只需看低 3 位）</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1: bit 2 ===== -->
  <text x="70" y="76" font-size="12" font-weight="bold" fill="#2b6e9e">位 b = 2 → power[12]　B₂ = {7}</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="88" width="70" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <g filter="url(#sk)"><rect x="130" y="88" width="70" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <g filter="url(#sk)"><rect x="200" y="88" width="70" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="95" y="112" text-anchor="middle" fill="#2b2b2b" font-weight="bold">3</text>
    <text x="165" y="112" text-anchor="middle" fill="#2b2b2b" font-weight="bold">1</text>
    <text x="235" y="112" text-anchor="middle" fill="#2b2b2b" font-weight="bold">7</text>
  </g>
  <text x="95" y="142" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">bit₂=0</text>
  <text x="165" y="142" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">bit₂=0</text>
  <text x="235" y="142" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">bit₂=1</text>
  <text x="330" y="100" font-size="11" fill="#444" font-family="monospace">单个块 {3,1,7}：cnt₀ = 1（只有 7 的第 2 位是 1）</text>
  <text x="330" y="122" font-size="11" fill="#b03a3a" font-family="monospace" font-weight="bold">m = cp[0] + cnt₀ = 0 + 1 = 1</text>
  <path d="M 330 136 L 330 168" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="158" font-size="10" fill="#888">分裂 → 产生检查点 c₁ = 1</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="172" width="70" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <g filter="url(#sk)"><rect x="138" y="172" width="66" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <g filter="url(#sk)"><rect x="204" y="172" width="66" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <text x="95" y="196" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="171" y="196" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
    <text x="237" y="196" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
  </g>
  <path d="M 130 166 L 130 218" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="130" y="160" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">c₁ = 1</text>
  <g filter="url(#sk)"><rect x="640" y="90" width="230" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="755" y="112" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">power[12] = 1</text>
  <text x="755" y="130" text-anchor="middle" font-size="10" fill="#666">7 放最前，前缀延伸 1 格</text>

  <!-- ===== Row 2: bit 1 ===== -->
  <text x="70" y="252" font-size="12" font-weight="bold" fill="#2b6e9e">位 b = 1 → power[13]　B₁ = {3, 7}</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="264" width="70" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <g filter="url(#sk)"><rect x="138" y="264" width="66" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <g filter="url(#sk)"><rect x="204" y="264" width="66" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <text x="95" y="288" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="171" y="288" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
    <text x="237" y="288" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
  </g>
  <path d="M 130 258 L 130 310" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="130" y="252" text-anchor="middle" font-size="0" fill="#b03a3a"> </text>
  <text x="95" y="318" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">bit₁=1</text>
  <text x="171" y="318" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">bit₁=1</text>
  <text x="237" y="318" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">bit₁=0</text>
  <text x="330" y="276" font-size="11" fill="#444" font-family="monospace">块0 {7} 全 ⊆ B₁ ✓ → 允许从块1 继续延伸</text>
  <text x="330" y="298" font-size="11" fill="#444" font-family="monospace">块0 候选 = 0+1 = 1；块1 候选 = c₁+cnt₁ = 1+1 = 2</text>
  <text x="330" y="320" font-size="11" fill="#b03a3a" font-family="monospace" font-weight="bold">m = 2，落在块1 内部 → 分裂块1</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="348" width="70" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <g filter="url(#sk)"><rect x="138" y="348" width="66" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <g filter="url(#sk)"><rect x="212" y="348" width="66" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="95" y="372" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="171" y="372" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
    <text x="245" y="372" text-anchor="middle" fill="#2b6e9e" font-weight="bold">1</text>
  </g>
  <path d="M 130 342 L 130 394" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 204 342 L 204 394" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="130" y="336" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">c₁ = 1</text>
  <text x="204" y="336" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">c₂ = 2</text>
  <g filter="url(#sk)"><rect x="640" y="266" width="230" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="755" y="288" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">power[13] = 2</text>
  <text x="755" y="306" text-anchor="middle" font-size="10" fill="#666">前缀 [7, 3] 的第 1 位全为 1</text>

  <!-- ===== Row 3: bit 0 ===== -->
  <text x="70" y="440" font-size="12" font-weight="bold" fill="#2b6e9e">位 b = 0 → power[14]　B₀ = {3, 1, 7}（全部元素）</text>
  <g font-size="13">
    <g filter="url(#sk)"><rect x="60" y="452" width="70" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <g filter="url(#sk)"><rect x="138" y="452" width="66" height="38" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <g filter="url(#sk)"><rect x="212" y="452" width="66" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="95" y="476" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="171" y="476" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
    <text x="245" y="476" text-anchor="middle" fill="#2b6e9e" font-weight="bold">1</text>
  </g>
  <path d="M 130 446 L 130 498" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 204 446 L 204 498" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="95" y="506" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">bit₀=1</text>
  <text x="171" y="506" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">bit₀=1</text>
  <text x="245" y="506" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">bit₀=1</text>
  <text x="330" y="464" font-size="11" fill="#444" font-family="monospace">块0、块1 全 ⊆ B₀ ✓ → 块2 候选 = c₂ + cnt₂ = 2 + 1 = 3</text>
  <text x="330" y="486" font-size="11" fill="#b03a3a" font-family="monospace" font-weight="bold">m = 3 = n，顶满尾块，无需分裂</text>
  <g filter="url(#sk)"><rect x="640" y="454" width="230" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="755" y="476" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">power[14] = 3</text>
  <text x="755" y="494" text-anchor="middle" font-size="10" fill="#666">全部元素第 0 位均为 1</text>

  <!-- ===== Summary ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="540" width="820" height="94" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="568" font-size="13" font-weight="bold" fill="#2b2b2b">最终结果</text>
  <text x="80" y="594" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">power = [0, 0, …, 0, 1, 2, 3]　（高 12 位全为 0）</text>
  <text x="80" y="620" font-size="11" fill="#444">任取一个满足块结构的排列都得到同一个 power，例如 perm = [7, 3, 1]；</text>
  <text x="480" y="620" font-size="11" fill="#7a2828" font-weight="bold">每一步「取最大候选」都可回溯为一个真实的排列选择 → 贪心值 = 最优值</text>
</svg>
