<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "aaabbb"，words = ["aa", "b"]</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">字典树只有两条链：root→a→a（terminal）、root→b（terminal）</text>

  <rect x="60" y="64" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="165" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="295" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">从 i 出发命中的词</text>
  <text x="440" y="81" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">endAt[i]</text>

  <rect x="60" y="90" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="90" y="106" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="165" y="106" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <text x="295" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">"aa"（覆盖 0..1）</text>
  <text x="440" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="60" y="114" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="90" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="165" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <text x="295" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">"aa"（覆盖 1..2）</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="60" y="138" width="440" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="90" y="154" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="165" y="154" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a</text>
  <text x="295" y="154" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—（"ab" 不在树里，break）</text>
  <text x="440" y="154" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−1</text>

  <rect x="60" y="162" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="90" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="165" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>
  <text x="295" y="178" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"b"（覆盖 3..3）</text>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <rect x="60" y="186" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="90" y="202" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="165" y="202" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>
  <text x="295" y="202" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"b"（覆盖 4..4）</text>
  <text x="440" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>

  <rect x="60" y="210" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="90" y="226" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="165" y="226" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>
  <text x="295" y="226" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"b"（覆盖 5..5）</text>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">5</text>

  <path d="M 280 234 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="250" width="440" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="270" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">贪心合并（end 初值 = endAt[0] = 1）</text>
  <text x="76" y="290" font-size="10" fill="#444" filter="url(#rough2)">j=1：1 ≤ end+1，endAt[1]=2 &gt; 1 → end=2（顺带吃掉"相邻"）</text>
  <text x="76" y="306" font-size="10" fill="#444" filter="url(#rough2)">j=3：3 ≤ end+1，endAt[3]=3 &gt; 2 → end=3；j=4、5 继续扩到 5</text>
  <text x="76" y="324" font-size="10" fill="#444" filter="url(#rough2)">j=6 越界 → 段落在 [0, 5]，i 直接跳到 6，扫描结束</text>

  <rect x="150" y="352" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">&lt;b&gt;aaabbb&lt;/b&gt;</text>

  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">若 s = "abcxyz123"：endAt = [2, −1, −1, −1, −1, 6, −1, −1, −1]</text>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">得到 [0,2]、[6,8] 两段，中间 "xyz" 自然露出</text>
</svg>
