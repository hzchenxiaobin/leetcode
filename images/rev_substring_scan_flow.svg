<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="530" height="600" fill="#fafafa"/>
  <text x="265" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：一遍扫描，先判后记，遇镜像立即返回</text>
  <path d="M 90 32 Q 265 40 440 32" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- start -->
  <g filter="url(#r)">
    <ellipse cx="250" cy="66" rx="44" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="250" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#r)">开始</text>
  <path d="M 250 86 L 250 104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- take pair -->
  <g filter="url(#r)">
    <rect x="105" y="108" width="290" height="44" rx="8" fill="#fdfcf7" stroke="#666" stroke-width="1.6"/>
  </g>
  <text x="250" y="126" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#r)">取相邻对 (a, b) = (s[i−1], s[i])</text>
  <text x="250" y="143" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">i 自 1 递增至 n−1</text>
  <path d="M 250 152 L 250 168" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- diamond 1: a == b ? -->
  <g filter="url(#r)">
    <polygon points="250,172 336,216 250,260 164,216" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="250" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#r)">a = b ?</text>
  <text x="250" y="230" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">自镜像对</text>
  <path d="M 336 216 L 398 216" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="362" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="398" y="196" width="112" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="454" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 true ✓</text>
  <path d="M 250 260 L 250 284" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#r)"/>
  <text x="259" y="277" font-size="11" fill="#b85450" filter="url(#r)">否</text>

  <!-- diamond 2: seen[b][a] ? -->
  <g filter="url(#r)">
    <polygon points="250,288 342,334 250,380 158,334" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="250" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#r)">seen[b][a] ?</text>
  <text x="250" y="348" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">镜像对已出现过</text>
  <path d="M 342 334 L 398 334" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="365" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="398" y="314" width="112" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="454" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 true ✓</text>
  <path d="M 250 380 L 250 404" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#r)"/>
  <text x="259" y="397" font-size="11" fill="#b85450" filter="url(#r)">否</text>

  <!-- record -->
  <g filter="url(#r)">
    <rect x="112" y="408" width="276" height="40" rx="8" fill="#fdfcf7" stroke="#666" stroke-width="1.6"/>
  </g>
  <text x="250" y="432" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#r)">记录 seen[a][b] = true</text>
  <path d="M 250 448 L 250 464" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- diamond 3: more pairs ? -->
  <g filter="url(#r)">
    <polygon points="250,468 324,502 250,536 176,502" fill="#fdfcf7" stroke="#666" stroke-width="1.6"/>
  </g>
  <text x="250" y="507" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">还有下一对 ?</text>
  <path d="M 176 502 L 55 502 L 55 130 L 100 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#r)"/>
  <text x="67" y="490" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是</text>
  <text x="44" y="320" transform="rotate(-90 44 320)" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">i ← i + 1</text>
  <path d="M 250 536 L 250 552" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#r)"/>
  <text x="259" y="549" font-size="11" fill="#b85450" filter="url(#r)">否</text>

  <!-- return false -->
  <g filter="url(#r)">
    <rect x="185" y="556" width="130" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="250" y="579" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#r)">返回 false ✗</text>
</svg>
