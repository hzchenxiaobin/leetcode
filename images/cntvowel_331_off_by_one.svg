<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="310" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">最大坑 off-by-one：右端点必须「+1」</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">以查询 [1,4] 为例（b = [1,0,1,1,1]，正确答案 3）</text>

  <!-- pre row -->
  <text x="109" y="76" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2b2b2b">pre =</text>
  <g filter="url(#sk)">
    <rect x="129" y="56" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="195" y="56" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="261" y="56" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="327" y="56" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="393" y="56" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="459" y="56" width="52" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="155" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="221" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="287" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="353" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="419" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="485" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="155" y="102" text-anchor="middle" font-size="10" fill="#999999">0</text>
  <text x="221" y="102" text-anchor="middle" font-size="10" fill="#999999">1</text>
  <text x="287" y="102" text-anchor="middle" font-size="10" fill="#999999">2</text>
  <text x="353" y="102" text-anchor="middle" font-size="10" fill="#999999">3</text>
  <text x="419" y="102" text-anchor="middle" font-size="10" fill="#999999">4</text>
  <text x="485" y="102" text-anchor="middle" font-size="10" fill="#999999">5</text>

  <!-- step labels -->
  <text x="188" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e">+b[0]=+1</text>
  <text x="254" y="118" text-anchor="middle" font-size="10" fill="#555555">+b[1]=+0</text>
  <text x="320" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e">+b[2]=+1</text>
  <text x="386" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e">+b[3]=+1</text>
  <text x="452" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">+b[4]=+1</text>
  <ellipse cx="452" cy="114" rx="34" ry="11" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="530" y="118" font-size="10" fill="#b85450">← 会被漏掉</text>

  <!-- correct bracket -->
  <path d="M 221 132 L 221 138 L 485 138 L 485 132" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="353" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓ pre[5] − pre[1] = 4 − 1 = 3　（覆盖 b[1] … b[4] 全部）</text>

  <!-- wrong bracket -->
  <path d="M 221 176 L 221 182 L 419 182 L 419 176" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="320" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗ pre[4] − pre[1] = 3 − 1 = 2　（漏掉 b[4]——"e" 未计入）</text>
  <path d="M 452 127 Q 436 158 408 190" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="40" y="216" width="560" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">口诀：闭区间 [l, r] ↔ 半开区间 [l, r+1)，查询 = pre[r+1] − pre[l]</text>
  <text x="320" y="257" text-anchor="middle" font-size="11" fill="#8a6415">右端 +1：跨过 b[r] 那一步，把 b[r] 计入；左端不动：pre[l] 恰好停在 b[l] 之前</text>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#b85450">经典 WA：pre[r] − pre[l]（漏 b[r]）、pre[r+1] − pre[l+1]（漏 b[l]）、pre 只开 n（越界）</text>
</svg>
