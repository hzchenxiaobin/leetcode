<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">填充顺序：先取到最大的平方值 → 放到最右边</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">如果正序填，得到的会是降序；逆序填才符合「非递减」要求</text>
  <text x="30" y="90" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 1 步</text>
  <text x="100" y="90" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">比较 16 与 100 → 取右端</text>
  <text x="360" y="90" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">res[4] = 100</text>
  <rect x="470" y="74" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="500.0" y="90.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res[4]</text>
  <text x="30" y="130" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 2 步</text>
  <text x="100" y="130" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">比较 16 与 9 → 取左端</text>
  <text x="360" y="130" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">res[3] = 16</text>
  <rect x="470" y="114" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="500.0" y="130.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res[3]</text>
  <text x="30" y="170" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 3 步</text>
  <text x="100" y="170" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">比较 1 与 9 → 取右端</text>
  <text x="360" y="170" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">res[2] = 9</text>
  <rect x="470" y="154" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="500.0" y="170.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res[2]</text>
  <text x="30" y="210" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 4 步</text>
  <text x="100" y="210" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">比较 1 与 0 → 取左端</text>
  <text x="360" y="210" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">res[1] = 1</text>
  <rect x="470" y="194" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="500.0" y="210.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res[1]</text>
  <text x="30" y="250" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 5 步</text>
  <text x="100" y="250" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">只剩 0</text>
  <text x="360" y="250" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">res[0] = 0</text>
  <rect x="470" y="234" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="500.0" y="250.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">res[0]</text>
  <rect x="100" y="274" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="120.0" y="292.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="140" y="274" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="292.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="180" y="274" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="200.0" y="292.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="220" y="274" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="240.0" y="292.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="260" y="274" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="280.0" y="292.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="100" y="322" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">res 从后往前被填满，天然非递减</text>
  <rect x="30" y="340" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="361" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">关键：res[k] 的 k 从 n-1 递减，而取到的平方值从大到小</text>
</svg>
