<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,4,8,2]，maxOperations = 4，答案区间 [1, 8]</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 第 1 轮 -->
  <g filter="url(#sk)">
    <rect x="40" y="48" width="560" height="92" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="56" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 轮</text>
  <g filter="url(#sk)" fill="none" stroke="#4a8edb" stroke-width="2">
    <path d="M 74 96 L 74 88 L 268 88 L 268 96"/>
  </g>
  <text x="171" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">[1, 8]</text>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M 74 108 L 268 108" fill="none"/>
    <path d="M 80 104 L 80 112"/><path d="M 106 104 L 106 112"/><path d="M 132 104 L 132 112"/>
    <path d="M 158 104 L 158 112"/><path d="M 184 104 L 184 112"/><path d="M 210 104 L 210 112"/>
    <path d="M 236 104 L 236 112"/><path d="M 262 104 L 262 112"/>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#333">
    <text x="80" y="126" text-anchor="middle">1</text><text x="106" y="126" text-anchor="middle">2</text>
    <text x="132" y="126" text-anchor="middle">3</text><text x="158" y="126" text-anchor="middle">4</text>
    <text x="184" y="126" text-anchor="middle">5</text><text x="210" y="126" text-anchor="middle">6</text>
    <text x="236" y="126" text-anchor="middle">7</text><text x="262" y="126" text-anchor="middle">8</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="158" cy="108" r="5" fill="#b85450"/>
  </g>
  <text x="300" y="76" text-anchor="start" font-size="12.5" fill="#333">ops(4) = 0+0+1+0 = 1</text>
  <g filter="url(#sk)">
    <rect x="300" y="86" width="70" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="335" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓ 可行</text>
  <text x="382" y="101" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">ans ← 4，hi ← 3</text>
  <text x="300" y="128" text-anchor="start" font-size="10.5" fill="#666">预算富余 3 次，继续向左找更小的 x</text>

  <!-- 第 2 轮 -->
  <g filter="url(#sk)">
    <rect x="40" y="148" width="560" height="92" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="56" y="172" text-anchor="start" font-size="13" font-weight="bold" fill="#2b6e9e">第 2 轮</text>
  <g filter="url(#sk)" fill="none" stroke="#4a8edb" stroke-width="2">
    <path d="M 74 196 L 74 188 L 138 188 L 138 196"/>
  </g>
  <text x="106" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">[1, 3]</text>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M 74 208 L 268 208" fill="none"/>
    <path d="M 80 204 L 80 212"/><path d="M 106 204 L 106 212"/><path d="M 132 204 L 132 212"/>
    <path d="M 158 204 L 158 212"/><path d="M 184 204 L 184 212"/><path d="M 210 204 L 210 212"/>
    <path d="M 236 204 L 236 212"/><path d="M 262 204 L 262 212"/>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#333">
    <text x="80" y="226" text-anchor="middle">1</text><text x="106" y="226" text-anchor="middle">2</text>
    <text x="132" y="226" text-anchor="middle">3</text><text x="158" y="226" text-anchor="middle">4</text>
    <text x="184" y="226" text-anchor="middle">5</text><text x="210" y="226" text-anchor="middle">6</text>
    <text x="236" y="226" text-anchor="middle">7</text><text x="262" y="226" text-anchor="middle">8</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="106" cy="208" r="5" fill="#b85450"/>
  </g>
  <text x="300" y="176" text-anchor="start" font-size="12.5" fill="#333">ops(2) = 0+1+3+0 = 4</text>
  <g filter="url(#sk)">
    <rect x="300" y="186" width="70" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="335" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓ 可行</text>
  <text x="382" y="201" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450">ans ← 2，hi ← 1</text>
  <text x="300" y="228" text-anchor="start" font-size="10.5" fill="#666">恰好用满 4 次操作，压线可行（最终答案在此轮锁定）</text>

  <!-- 第 3 轮 -->
  <g filter="url(#sk)">
    <rect x="40" y="248" width="560" height="92" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="56" y="272" text-anchor="start" font-size="13" font-weight="bold" fill="#2b6e9e">第 3 轮</text>
  <g filter="url(#sk)" fill="none" stroke="#4a8edb" stroke-width="2">
    <path d="M 74 296 L 74 288 L 86 288 L 86 296"/>
  </g>
  <text x="80" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">[1, 1]</text>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M 74 308 L 268 308" fill="none"/>
    <path d="M 80 304 L 80 312"/><path d="M 106 304 L 106 312"/><path d="M 132 304 L 132 312"/>
    <path d="M 158 304 L 158 312"/><path d="M 184 304 L 184 312"/><path d="M 210 304 L 210 312"/>
    <path d="M 236 304 L 236 312"/><path d="M 262 304 L 262 312"/>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#333">
    <text x="80" y="326" text-anchor="middle">1</text><text x="106" y="326" text-anchor="middle">2</text>
    <text x="132" y="326" text-anchor="middle">3</text><text x="158" y="326" text-anchor="middle">4</text>
    <text x="184" y="326" text-anchor="middle">5</text><text x="210" y="326" text-anchor="middle">6</text>
    <text x="236" y="326" text-anchor="middle">7</text><text x="262" y="326" text-anchor="middle">8</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="80" cy="308" r="5" fill="#b85450"/>
  </g>
  <text x="300" y="276" text-anchor="start" font-size="12.5" fill="#333">ops(1) = 1+3+7+1 = 12</text>
  <g filter="url(#sk)">
    <rect x="300" y="286" width="70" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="335" y="301" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04348">✗ 不可行</text>
  <text x="382" y="301" text-anchor="start" font-size="12" font-weight="bold" fill="#7a5415">lo ← 2</text>
  <text x="300" y="328" text-anchor="start" font-size="10.5" fill="#666">全部拆成每袋 1 球也需 12 次 &gt; 4，必须放宽 x</text>

  <!-- 汇总橙条 -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="560" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">第 3 轮后 lo = 2 &gt; hi = 1，区间已空 → 返回 ans = 2</text>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" fill="#7a5415">3 轮二分定位 x* = 2（log₂8 = 3，轮数恰为理论值）</text>

  <!-- 底部：mid=2 的可行拆法 -->
  <g filter="url(#sk)">
    <rect x="40" y="412" width="560" height="134" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="320" y="434" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">mid = 2 的可行拆法（共 4 次操作，全部袋子 ≤ 2）</text>
  <g filter="url(#sk)" font-size="12">
    <rect x="90" y="450" width="34" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="107" y="470" text-anchor="middle" fill="#2b6e9e">2</text>
    <rect x="134" y="450" width="34" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="151" y="470" text-anchor="middle" fill="#2b6e9e">4</text>
    <rect x="178" y="450" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <text x="195" y="470" text-anchor="middle" fill="#7a5415" font-weight="bold">8</text>
    <rect x="222" y="450" width="34" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <text x="239" y="470" text-anchor="middle" fill="#2b6e9e">2</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 262 466 L 298 466" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="280" y="458" text-anchor="middle" font-size="10.5" fill="#666">拆 4 次</text>
  <g filter="url(#sk)" font-size="12" fill="#2e6e2e">
    <rect x="306" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="319" y="470" text-anchor="middle">2</text>
    <rect x="337" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="350" y="470" text-anchor="middle">2</text>
    <rect x="368" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="381" y="470" text-anchor="middle">2</text>
    <rect x="399" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="412" y="470" text-anchor="middle">2</text>
    <rect x="430" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="443" y="470" text-anchor="middle">2</text>
    <rect x="461" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="474" y="470" text-anchor="middle">2</text>
    <rect x="492" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="505" y="470" text-anchor="middle">2</text>
    <rect x="523" y="450" width="26" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <text x="536" y="470" text-anchor="middle">2</text>
  </g>
  <text x="320" y="506" text-anchor="middle" font-size="11.5" fill="#2e6e2e">8 → 2+2+2+2（3 次）、4 → 2+2（1 次）、两个 2 保持不动</text>
  <text x="320" y="526" text-anchor="middle" font-size="11.5" fill="#2e6e2e">最终 8 个袋子全部 ≤ 2，开销 = 2 ✓；而 x = 1 需 12 次 &gt; 4，不可行</text>
</svg>
