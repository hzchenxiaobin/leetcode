<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只在 depth−1 层做一次局部挂接</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cur 的原左子树挂到新左节点的左边，原右子树挂到新右节点的右边，其余结构不变</text>

  <!-- 左侧：插入前 -->
  <rect x="24" y="64" width="272" height="290" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">插入前</text>

  <rect x="124" y="144" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="166" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">cur</text>

  <text x="160" y="196" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">深度 depth−1</text>

  <path d="M 132 178 L 104 248" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 178 L 216 248" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="248" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="103" y="269" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">原左子树</text>

  <rect x="184" y="248" width="66" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="217" y="269" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">原右子树</text>

  <text x="160" y="310" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">深度 depth 起，原本挂着两棵子树</text>
  <text x="160" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（子树可以是空，也可以很深）</text>

  <!-- 中间箭头 -->
  <path d="M 304 210 L 345 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="323" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">插入</text>

  <!-- 右侧：插入后 -->
  <rect x="346" y="64" width="270" height="290" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="481" y="88" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">插入后</text>

  <rect x="447" y="126" width="68" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="481" y="147" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">cur</text>

  <path d="M 459 158 L 421 216" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 503 158 L 541 216" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="383" y="216" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" rx="6" filter="url(#rough2)"/>
  <text x="416" y="237" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">val</text>

  <rect x="513" y="216" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" rx="6" filter="url(#rough2)"/>
  <text x="546" y="237" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">val</text>

  <path d="M 416 248 L 416 296" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 546 248 L 546 296" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="383" y="296" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="416" y="316" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">原左子树</text>

  <rect x="513" y="296" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="546" y="316" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">原右子树</text>

  <text x="481" y="342" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">新节点占住 depth 层，原子树整体下移一层</text>

  <!-- 底部图例 -->
  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">黄色 = 本次新建的 val 节点（左节点的左指针 / 右节点的右指针接原树）</text>
  <text x="320" y="402" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">绿色 = 原有子树，一根指针都不改，只是换了父亲</text>
</svg>
