<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="520" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：排序分组 → 逐组解出 v_i → 按原下标写回</text>

  <!-- A: 分组 -->
  <rect x="150" y="42" width="360" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">把 b 排序并相等元素归为一组</text>
  <text x="330" y="86" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">得到 s₀ &lt; s₁ &lt; … &lt; s_{k−1} 与各组人数 c_i</text>
  <path d="M330,100 L330,120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: s0 == 0 ? -->
  <polygon points="330,122 470,158 330,194 190,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="163" text-anchor="middle" font-size="13" fill="#c08820" filter="url(#rough2)">s₀ = 0 ？</text>
  <path d="M470,158 L512,158" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="490" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="514" y="134" width="120" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="574" y="163" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">输出 −1</text>
  <text x="330" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是（最小值组必须 shadow = 0）</text>
  <path d="M330,218 L330,236" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: 逐组求解 -->
  <rect x="70" y="238" width="520" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">对 i = 0 … k−2：diff = s_{i+1} − s_i，v_i = diff / c_i</text>
  <text x="330" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">合法性：diff % c_i = 0，且 v_i &gt; v_{i−1}（i &gt; 0 时）</text>
  <text x="330" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（等价于「每组的值严格大于前一组的取值」）</text>
  <path d="M330,312 L330,332" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: 全部合法 ? -->
  <polygon points="330,334 460,368 330,402 200,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="373" text-anchor="middle" font-size="13" fill="#c08820" filter="url(#rough2)">全部合法？</text>
  <path d="M460,368 L502,368" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="481" y="358" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="504" y="344" width="120" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="564" y="373" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">输出 −1</text>
  <path d="M330,402 L330,420" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: 最后一组 -->
  <rect x="150" y="422" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="449" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">最后一组：v_{k−1} = v_{k−2} + 1（k = 1 时 v₀ = 1）</text>
  <path d="M330,466 L330,482" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: 输出 -->
  <rect x="150" y="484" width="360" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="504" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">ans[原下标] = 该下标所属组的 v → 输出 ans</text>
</svg>
