<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：素数占用滑窗</text>
  <path d="M 210 40 Q 330 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init box -->
  <g filter="url(#sk)">
    <rect x="240" y="52" width="180" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="72" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">ans = 2，left = 0，win = ∅</text>

  <path d="M 330 84 L 330 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- enumerate box -->
  <g filter="url(#sk)">
    <rect x="185" y="100" width="290" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="120" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">枚举 right：mx = mask(nums[right])</text>

  <path d="M 330 132 L 330 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="330,148 475,206 330,264 185,206" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="330" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">win 与 mx</text>
  <text x="330" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">共享素数？</text>

  <!-- no branch -->
  <text x="492" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">否</text>
  <path d="M 475 206 Q 528 212 530 262" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- accept box -->
  <g filter="url(#sk)">
    <rect x="430" y="266" width="200" height="66" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#2e6e2e">
    <text x="530" y="290" text-anchor="middle" font-weight="bold">win |= mx</text>
    <text x="530" y="312" text-anchor="middle">ans = max(ans,</text>
    <text x="530" y="326" text-anchor="middle">right − left + 1)</text>
  </g>

  <!-- loop back to enumerate -->
  <path d="M 630 300 Q 650 296 650 210 Q 650 112 556 112 L 478 112" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="565" y="102" text-anchor="middle" font-size="10.5" fill="#888">下一个 right</text>

  <!-- yes branch -->
  <text x="138" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">是</text>
  <path d="M 185 206 Q 132 212 140 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- shrink box -->
  <g filter="url(#sk)">
    <rect x="40" y="264" width="200" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#8a3a3a">
    <text x="140" y="288" text-anchor="middle" font-weight="bold">移出 nums[left]</text>
    <text x="140" y="308" text-anchor="middle">win 清掉其素数</text>
    <text x="140" y="322" text-anchor="middle">left++</text>
  </g>

  <!-- loop back to diamond -->
  <path d="M 140 330 L 140 372 L 330 372 L 330 268" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="235" y="390" text-anchor="middle" font-size="10.5" fill="#888">重复判断，直至无共享素数</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="40" y="404" width="580" height="54" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#7a5415">
    <text x="330" y="426" text-anchor="middle">值域 ≤ 10：只涉及素数 {2, 3, 5, 7} → win / mx 压缩成 4 位二进制掩码</text>
    <text x="330" y="446" text-anchor="middle">窗口不变量：任意两元素互素（每个素数至多被一个元素占用）</text>
  </g>
</svg>
