<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="540" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：BFS 按层出队，边出队边给两个孩子编号</text>

  <ellipse cx="350" cy="74" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="79" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M350,94 L350,102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="104" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">队列放入 (root, 1)，ans = 0</text>
  <text x="350" y="137" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">根从 0 或 1 起都行，全树统一即可</text>

  <path d="M350,144 L350,172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M350,176 L432,216 L350,256 L268,216 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">队列非空？</text>

  <!-- 否 -->
  <path d="M432,216 L518,216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="474" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="522" y="192" width="150" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="597" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>
  <text x="597" y="229" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">每层处理完就更新</text>

  <!-- 是 -->
  <path d="M350,256 L350,290" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="140" y="292" width="420" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">size = q.size()，first = 队首下标，last = first</text>
  <text x="350" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">锁定本层的节点个数与最左下标</text>

  <path d="M350,334 L350,364" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="366" width="520" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="388" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">弹出 (node, idx)：rel = idx − first，last = rel</text>
  <text x="350" y="410" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">左孩子入队 rel × 2，右孩子入队 rel × 2 + 1</text>

  <path d="M350,430 L350,460" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="462" width="280" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="487" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">ans = max(ans, last + 1)</text>

  <path d="M210,482 L60,482 L60,216 L264,216" stroke="#666" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="330" font-size="10.5" fill="#666" filter="url(#rough2)">处理下一层</text>
</svg>
