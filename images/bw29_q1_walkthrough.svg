<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例演算：[4000, 3000, 1000, 2000]
  </text>

  <!-- 演算表 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="70" y="62" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="190" y="62" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="280" y="62" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="370" y="62" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="130" y="84" text-anchor="middle" fill="#446688">元素 s</text>
    <text x="235" y="84" text-anchor="middle" fill="#446688">sum</text>
    <text x="325" y="84" text-anchor="middle" fill="#446688">mn</text>
    <text x="415" y="84" text-anchor="middle" fill="#446688">mx</text>
  </g>
  <g filter="url(#rough2)" font-size="14">
    <rect x="70" y="100" width="120" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="190" y="100" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="280" y="100" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="370" y="100" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="130" y="122" text-anchor="middle" fill="#333">4000</text>
    <text x="235" y="122" text-anchor="middle" fill="#2f5a24">4000</text>
    <text x="325" y="122" text-anchor="middle" fill="#b85450">4000</text>
    <text x="415" y="122" text-anchor="middle" fill="#8a6a1a">4000</text>

    <rect x="70" y="136" width="120" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="190" y="136" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="280" y="136" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="370" y="136" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="130" y="158" text-anchor="middle" fill="#333">3000</text>
    <text x="235" y="158" text-anchor="middle" fill="#2f5a24">7000</text>
    <text x="325" y="158" text-anchor="middle" fill="#b85450">3000</text>
    <text x="415" y="158" text-anchor="middle" fill="#8a6a1a">4000</text>

    <rect x="70" y="172" width="120" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="190" y="172" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="280" y="172" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="370" y="172" width="90" height="32" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="130" y="194" text-anchor="middle" fill="#333">1000</text>
    <text x="235" y="194" text-anchor="middle" fill="#2f5a24">8000</text>
    <text x="325" y="194" text-anchor="middle" fill="#b85450">1000</text>
    <text x="415" y="194" text-anchor="middle" fill="#8a6a1a">4000</text>

    <rect x="70" y="208" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="190" y="208" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="280" y="208" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="370" y="208" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="130" y="230" text-anchor="middle" fill="#333">2000</text>
    <text x="235" y="230" text-anchor="middle" fill="#2f5a24">10000</text>
    <text x="325" y="230" text-anchor="middle" fill="#b85450">1000</text>
    <text x="415" y="230" text-anchor="middle" fill="#8a6a1a">4000</text>
  </g>

  <!-- 结论框 -->
  <rect x="86" y="268" width="348" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="15" fill="#8a6a1a" filter="url(#rough2)">
    (10000 − 1000 − 4000) / (4 − 2)
  </text>
  <text x="260" y="324" text-anchor="middle" font-size="16" fill="#8a6a1a" filter="url(#rough2)">
    = 5000 / 2 = 2500.00000
  </text>
</svg>
