<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">第一步：按值分组——同值下标才有距离，跨组无关</text>

  <!-- array cells: 5 cells, 60px wide, origin (128, 48) -->
  <rect x="128" y="48" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="76" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="158" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 0</text>

  <rect x="188" y="48" width="60" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="76" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="218" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 1</text>

  <rect x="248" y="48" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="76" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="278" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 2</text>

  <rect x="308" y="48" width="60" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="76" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="338" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 3</text>

  <rect x="368" y="48" width="60" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="76" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="398" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 4</text>

  <text x="110" y="78" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">nums =</text>

  <!-- arrows from cells to group boxes -->
  <path d="M 158 104 Q 152 136 150 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 278 104 Q 240 140 196 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 338 104 Q 282 142 210 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 218 104 Q 280 138 336 166" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 448 104 Q 462 136 468 166" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- group box: value 1 -->
  <rect x="44" y="170" width="212" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="194" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">值 1 → 下标组 [0, 2, 3]（m = 3）</text>
  <rect x="88" y="206" width="40" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="132" y="206" width="40" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="206" width="40" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="260" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">组内两两算距离和（本题主战场）</text>

  <!-- group box: value 3 -->
  <rect x="276" y="170" width="130" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="341" y="196" text-anchor="middle" font-size="13.5" fill="#a07820" font-weight="bold" filter="url(#rough2)">值 3 → [1]</text>
  <text x="341" y="222" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">m = 1</text>
  <text x="341" y="244" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">没有同值伙伴</text>
  <text x="341" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ f = 0</text>

  <!-- group box: value 2 -->
  <rect x="424" y="170" width="92" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="470" y="196" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值 2 → [4]</text>
  <text x="470" y="222" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">m = 1</text>
  <text x="470" y="244" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">同上</text>
  <text x="470" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ f = 0</text>

  <!-- bottom notes -->
  <rect x="44" y="296" width="472" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 下标按遍历顺序 push_back ⇒ 组内天然升序，无需排序</text>
  <text x="280" y="342" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② |i − j| 只在同值组内累计，不同组互不贡献</text>
  <text x="280" y="364" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 值域 0 ≤ nums[i] ≤ 10⁹ ⇒ 必须哈希表分组，开不了值域数组</text>
</svg>
