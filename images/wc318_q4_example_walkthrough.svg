<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="29" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1：最优分配 0→2，4→2，6→6，总距离 4</text>
  <path d="M 170 42 Q 340 49 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <path d="M 85 121 Q 340 113 595 121" stroke="#777777" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="100" cy="82" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><circle cx="320" cy="82" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><circle cx="540" cy="82" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="100" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#31506f" filter="url(#sk)">0</text>
  <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#31506f" filter="url(#sk)">4</text>
  <text x="540" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#31506f" filter="url(#sk)">6</text>
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">r₀</text>
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">r₁</text>
  <text x="540" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">r₂</text>
  <g filter="url(#sk)"><rect x="180" y="137" width="76" height="43" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="502" y="137" width="76" height="43" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="218" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5f14" filter="url(#sk)">工厂 2</text>
  <text x="218" y="172" text-anchor="middle" font-size="10" fill="#8a5f14" filter="url(#sk)">limit = 2</text>
  <text x="540" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#35602c" filter="url(#sk)">工厂 6</text>
  <text x="540" y="172" text-anchor="middle" font-size="10" fill="#35602c" filter="url(#sk)">limit = 2</text>
  <path d="M 107 99 Q 145 125 190 139" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 313 99 Q 280 126 246 139" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 540 101 L 540 132" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="130" y="121" font-size="11" font-weight="bold" fill="#8a5f14" filter="url(#sk)">+2</text>
  <text x="291" y="121" font-size="11" font-weight="bold" fill="#8a5f14" filter="url(#sk)">+2</text>
  <text x="550" y="120" font-size="11" font-weight="bold" fill="#35602c" filter="url(#sk)">+0</text>

  <text x="55" y="215" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">DP 表 f[i][j]（∞ 表示容量不足）</text>
  <g filter="url(#sk)">
    <rect x="55" y="232" width="150" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="205" y="232" width="90" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="295" y="232" width="90" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="385" y="232" width="90" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="475" y="232" width="90" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="55" y="274" width="150" height="42" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="205" y="274" width="90" height="42" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="295" y="274" width="90" height="42" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="385" y="274" width="90" height="42" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="475" y="274" width="90" height="42" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
    <rect x="55" y="316" width="150" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="205" y="316" width="90" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="295" y="316" width="90" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="385" y="316" width="90" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="475" y="316" width="90" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="55" y="358" width="150" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="205" y="358" width="90" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="295" y="358" width="90" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="385" y="358" width="90" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="475" y="358" width="90" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="130" y="259" filter="url(#sk)">已考虑的工厂</text>
    <text x="250" y="259" font-weight="bold" filter="url(#sk)">j=0</text>
    <text x="340" y="259" font-weight="bold" filter="url(#sk)">j=1</text>
    <text x="430" y="259" font-weight="bold" filter="url(#sk)">j=2</text>
    <text x="520" y="259" font-weight="bold" filter="url(#sk)">j=3</text>
    <text x="130" y="301" filter="url(#sk)">无工厂</text>
    <text x="250" y="301" filter="url(#sk)">0</text>
    <text x="340" y="301" filter="url(#sk)">∞</text>
    <text x="430" y="301" filter="url(#sk)">∞</text>
    <text x="520" y="301" filter="url(#sk)">∞</text>
    <text x="130" y="343" fill="#8a5f14" filter="url(#sk)">工厂 2，容量 2</text>
    <text x="250" y="343" filter="url(#sk)">0</text>
    <text x="340" y="343" filter="url(#sk)">2</text>
    <text x="430" y="343" filter="url(#sk)">4</text>
    <text x="520" y="343" filter="url(#sk)">∞</text>
    <text x="130" y="385" fill="#35602c" filter="url(#sk)">工厂 2、6</text>
    <text x="250" y="385" filter="url(#sk)">0</text>
    <text x="340" y="385" filter="url(#sk)">2</text>
    <text x="430" y="385" filter="url(#sk)">4</text>
    <text x="520" y="385" font-size="15" font-weight="bold" fill="#b03a3a" filter="url(#sk)">4</text>
  </g>

  <g filter="url(#sk)"><rect x="55" y="418" width="570" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="441" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#31506f" filter="url(#sk)">f[2][3] = f[1][2] + |6−6| = 4 + 0 = 4</text>
</svg>
