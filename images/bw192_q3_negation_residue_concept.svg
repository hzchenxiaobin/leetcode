<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：取反一个元素 x，子和恰好减少 2x</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">子数组 nums[i..j] 的和为 S，把其中的 nums[m] = x 换成 −x（取 k = 3 为例）</text>

  <text x="96" y="94" text-anchor="end" font-size="11" fill="#888">取反前</text>
  <g filter="url(#rough2)">
    <rect x="104" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="160" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="216" y="74" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="272" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="328" y="74" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text x="130" y="96" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="186" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="242" y="96" text-anchor="middle" font-size="13" fill="#a07820" font-weight="bold">7</text>
  <text x="298" y="96" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="354" y="96" text-anchor="middle" font-size="13" fill="#333">2</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="130" y="124">0</text><text x="186" y="124">1</text><text x="242" y="124">2</text>
    <text x="298" y="124">3</text><text x="354" y="124">4</text>
  </g>
  <text x="130" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="242" y="139" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">m</text>
  <text x="354" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j</text>
  <text x="470" y="88" text-anchor="middle" font-size="10.5" fill="#666">子和</text>
  <text x="470" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">S = 17</text>

  <path d="M 242 150 V 178" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="170" font-size="11" fill="#666">取反 nums[m]：x → −x</text>

  <text x="96" y="216" text-anchor="end" font-size="11" fill="#888">取反后</text>
  <g filter="url(#rough2)">
    <rect x="104" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="160" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="216" y="196" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="272" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="328" y="196" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="186" y="218" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="242" y="218" text-anchor="middle" font-size="13" fill="#a07820" font-weight="bold">−7</text>
  <text x="298" y="218" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="354" y="218" text-anchor="middle" font-size="13" fill="#333">2</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="130" y="246">0</text><text x="186" y="246">1</text><text x="242" y="246">2</text>
    <text x="298" y="246">3</text><text x="354" y="246">4</text>
  </g>
  <text x="470" y="210" text-anchor="middle" font-size="10.5" fill="#666">子和</text>
  <text x="470" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">S − 2x = 3</text>
  <text x="470" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≡ 0 (mod 3) ✓</text>

  <rect x="40" y="268" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">有效 ⟺ S ≡ 0 (mod k)，或 [i..j] 中存在 m 使 2·nums[m] ≡ S (mod k)</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#555">取反后要求 S − 2x ≡ 0，移项即 2x ≡ S —— 条件里 m 只以残差 2·nums[m] 出现</text>

  <rect x="40" y="336" width="480" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">于是无需枚举 m：维护 seen = { 2·nums[m] mod k : m 在窗口内 }</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#555">判定一次取反是否可行 = 查询 S mod k 是否落在 seen 中，哈希 O(1)</text>

  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#999">「至多一次取反」被改写成「一次 O(1) 残差查询」—— 内层 m 循环消失</text>
</svg>
