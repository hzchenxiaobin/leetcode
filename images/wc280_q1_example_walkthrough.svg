<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：除法批量版的逐步走查</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Table 1: (7,3) -->
  <text x="70" y="66" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① num1 = 7, num2 = 3</text>

  <rect x="65" y="76" width="510" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">轮次</text>
  <text x="193" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">num1</text>
  <text x="278" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">num2</text>
  <text x="363" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">商 k</text>
  <text x="448" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">余数</text>
  <text x="533" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">累计 ops</text>

  <rect x="65" y="104" width="510" height="28" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="193" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="278" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="363" y="123" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">7/3 = 2</text>
  <rect x="413" y="107" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="123" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="533" y="123" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">2</text>

  <rect x="65" y="132" width="510" height="28" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="193" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="278" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="363" y="151" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">3/1 = 3</text>
  <rect x="413" y="135" width="70" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="151" text-anchor="middle" font-size="11.5" fill="#a04040" filter="url(#rough2)">0</text>
  <text x="533" y="151" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">5</text>

  <text x="70" y="180" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 轮后 num2 = 0，退出 → 返回 5 ✓（暴力核对：7→4→1 共 2 次，3→2→1→0 共 3 次）</text>

  <!-- Table 2: (2,3) -->
  <text x="70" y="216" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② num1 = 2, num2 = 3（官方示例 1）</text>

  <rect x="65" y="226" width="510" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">轮次</text>
  <text x="193" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">num1</text>
  <text x="278" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">num2</text>
  <text x="363" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">商 k</text>
  <text x="448" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">余数</text>
  <text x="533" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">累计 ops</text>

  <rect x="65" y="254" width="510" height="28" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="273" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="193" y="273" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="278" y="273" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="363" y="273" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">3/2 = 1</text>
  <rect x="413" y="257" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="273" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="533" y="273" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <rect x="65" y="282" width="510" height="28" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="301" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="193" y="301" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="278" y="301" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="363" y="301" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">2/1 = 2</text>
  <rect x="413" y="285" width="70" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="301" text-anchor="middle" font-size="11.5" fill="#a04040" filter="url(#rough2)">0</text>
  <text x="533" y="301" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <text x="70" y="330" font-size="10.5" fill="#666" filter="url(#rough2)">返回 3 ✓ —— 高亮格的余数，正是下一轮替换进去的新值</text>

  <!-- Bottom note -->
  <rect x="26" y="348" width="588" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="369" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">两个直查边界：num1 = 10, num2 = 10 → 一轮商 1 余 0，返回 1；num1 = 0 → 循环不进入，返回 0</text>

  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">除法版把每轮「一串同向减法」折叠成商 k：两轮走查 = 暴力的 5 次逐减，答案一致</text>
</svg>
