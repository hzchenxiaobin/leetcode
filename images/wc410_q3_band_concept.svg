<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：arr2 是影子，两条单调性合并成对前值的单侧上界</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="40" y="38" width="22" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="68" y="49" font-size="10" fill="#555">arr1（垫底，非减）</text>
    <rect x="190" y="38" width="22" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="218" y="49" font-size="10" fill="#555">arr2（盖顶，非增）</text>
  </g>

  <!-- bars: nums = [2,3,2], pair ([0,1,2],[2,2,0]) -->
  <!-- unit = 26px, baseline y = 310, bar width 58 -->
  <g filter="url(#rough2)">
    <!-- i=0: nums=2, arr1=0, arr2=2 -->
    <rect x="62" y="258" width="58" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <!-- i=1: nums=3, arr1=1, arr2=2 -->
    <rect x="146" y="232" width="58" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <rect x="146" y="284" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <!-- i=2: nums=2, arr1=2, arr2=0 -->
    <rect x="230" y="258" width="58" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
  </g>

  <!-- divider line (blue height = arr1) -->
  <g filter="url(#rough2)">
    <path d="M 55 310 L 90 310 L 110 308 L 174 286 L 210 283 L 258 261 L 295 258"
          fill="none" stroke="#446688" stroke-width="2.4" stroke-dasharray="7 5"/>
    <text x="305" y="252" font-size="10.5" fill="#446688" font-weight="bold">分界线 = arr1[i]</text>
    <text x="305" y="266" font-size="10.5" fill="#446688">只能不降 ↗</text>
  </g>

  <!-- illegal flat line -->
  <g filter="url(#rough2)">
    <path d="M 62 322 L 205 320" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="128" y="340" font-size="10" fill="#b85450" font-weight="bold">停在 0 ✗</text>
  </g>

  <!-- baseline + nums labels -->
  <g filter="url(#rough2)">
    <path d="M 48 312 L 300 310" stroke="#888" stroke-width="1.5"/>
    <text x="91" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums=2</text>
    <text x="175" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums=3</text>
    <text x="259" y="362" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums=2</text>
    <text x="91" y="378" text-anchor="middle" font-size="9.5" fill="#888">arr1=0</text>
    <text x="175" y="378" text-anchor="middle" font-size="9.5" fill="#888">arr1=1</text>
    <text x="259" y="378" text-anchor="middle" font-size="9.5" fill="#888">arr1=2</text>
    <!-- delta labels -->
    <text x="133" y="330" font-size="10" fill="#b85450" font-weight="bold">Δ=+1</text>
    <text x="217" y="330" font-size="10" fill="#4a7a3a" font-weight="bold">Δ=−1</text>
  </g>

  <!-- right panel: formula derivation -->
  <g filter="url(#rough2)">
    <rect x="330" y="76" width="212" height="212" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="436" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">记 s = arr1[i]，t = arr1[i−1]</text>
    <text x="436" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Δ = nums[i] − nums[i−1]</text>
    <text x="344" y="140" font-size="10.5" fill="#555">① arr1 非减：t ≤ s</text>
    <text x="344" y="164" font-size="10.5" fill="#555">② arr2 非增：</text>
    <text x="356" y="180" font-size="10.5" fill="#555">nums[i]−s ≤ nums[i−1]−t</text>
    <text x="356" y="196" font-size="10.5" fill="#555">⟺ t ≤ s − Δ</text>
    <rect x="340" y="208" width="192" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="436" y="226" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">合并：t ≤ min(s, s−Δ)</text>
    <text x="344" y="252" font-size="10" fill="#888">两条约束同向——都是对前一位</text>
    <text x="344" y="266" font-size="10" fill="#888">取值的上界，窗口恒为前缀 [0, t_max]</text>
    <text x="344" y="280" font-size="10" fill="#888">→ 前缀和一次查询 O(1)</text>
  </g>

  <!-- squeeze annotation near bar i=1 -->
  <g filter="url(#rough2)">
    <path d="M 175 226 C 200 200, 290 196, 322 190" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="150" y="86" font-size="10.5" fill="#8a6a1a">nums 涨得快（Δ&gt;0）</text>
    <text x="150" y="100" font-size="10.5" fill="#8a6a1a">可行带被挤压得越窄</text>
    <text x="326" y="184" font-size="9.5" fill="#8a6a1a">红色死路：分界线不动</text>
    <text x="326" y="172" font-size="9.5" fill="#b85450" font-weight="bold">arr2 反而要涨 → 违反非增</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="396" width="512" height="26" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="414" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">arr2[i] = nums[i] − arr1[i]：arr2 没有任何自由度，数 arr1 的合法填法 = 数单调数组对</text>
  </g>
</svg>
