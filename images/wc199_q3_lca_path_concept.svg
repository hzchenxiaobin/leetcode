<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：两叶之间的最短路径必经最近公共祖先</text>
  <path d="M 120 38 Q 310 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">示例 1：root = [1,2,3,null,4]，distance = 3，好对只有一对（叶 3 与叶 4）</text>

  <text x="240" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">LCA</text>

  <g filter="url(#sk)">
    <line x1="240" y1="118" x2="140" y2="198" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="240" y1="118" x2="340" y2="198" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="140" y1="198" x2="215" y2="278" stroke="#8899aa" stroke-width="1.6"/>
    <line x1="140" y1="198" x2="60" y2="278" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 4"/>
  </g>

  <path d="M 215 278 Q 172 238 140 198 Q 180 148 240 118 Q 296 148 340 198"
        fill="none" stroke="#b85450" stroke-width="3" stroke-dasharray="7 4"
        marker-end="url(#arrR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="240" cy="118" r="27" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/>
    <circle cx="240" cy="118" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="140" cy="198" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="340" cy="198" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="215" cy="278" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="60" cy="278" r="13" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <text x="240" y="123" text-anchor="middle" font-size="14" fill="#8a6415" font-weight="bold">1</text>
  <text x="140" y="203" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="340" y="203" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">3</text>
  <text x="215" y="283" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">4</text>
  <text x="60" y="283" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <text x="340" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a">叶</text>
  <text x="215" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a">叶</text>

  <text x="92" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d₁ = 2</text>
  <path d="M 114 238 Q 145 240 166 238" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="368" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d₂ = 1</text>
  <path d="M 356 166 Q 320 160 298 158" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arrR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="392" y="76" width="204" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="494" y="100" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">在 LCA 处会师</text>
  <text x="494" y="122" text-anchor="middle" font-size="11.5" fill="#2e5a24">路径长度 = d₁ + d₂ = 2 + 1 = 3</text>
  <text x="494" y="144" text-anchor="middle" font-size="11.5" fill="#2e5a24">3 ≤ distance = 3 ⇒ 好对 ✓</text>
  <text x="494" y="160" text-anchor="middle" font-size="10.5" fill="#66775f">判定只需知道两侧叶子到 LCA 的距离</text>

  <g filter="url(#sk)">
    <rect x="392" y="186" width="204" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="494" y="210" text-anchor="middle" font-size="13" fill="#34506e" font-weight="bold">向上传什么？</text>
  <text x="494" y="232" text-anchor="middle" font-size="11.5" fill="#34506e">每个结点向上汇报子树内</text>
  <text x="494" y="250" text-anchor="middle" font-size="11.5" fill="#34506e">叶子的「距离直方图」cnt[d]</text>
  <text x="494" y="272" text-anchor="middle" font-size="11.5" fill="#34506e">好对只在 LCA 合并两侧时统计</text>

  <g filter="url(#sk)">
    <rect x="392" y="310" width="204" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="494" y="334" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">剪枝</text>
  <text x="494" y="356" text-anchor="middle" font-size="11.5" fill="#8a6415">distance ≤ 10 ⇒ 直方图仅 11 格</text>
  <text x="494" y="376" text-anchor="middle" font-size="11.5" fill="#8a6415">距离 &gt; distance 的叶子继续上移</text>
  <text x="494" y="394" text-anchor="middle" font-size="11.5" fill="#8a6415">只会更远 ⇒ 直接丢弃</text>

  <g filter="url(#sk)">
    <rect x="36" y="330" width="328" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="200" y="352" text-anchor="middle" font-size="12.5" fill="#8f3830" font-weight="bold">树中两点间路径唯一</text>
  <text x="200" y="372" text-anchor="middle" font-size="11.5" fill="#8f3830">u → … → LCA → … → v：先上后下，</text>
  <text x="200" y="392" text-anchor="middle" font-size="11.5" fill="#8f3830">不可能绕过 LCA 抄近道</text>
</svg>
