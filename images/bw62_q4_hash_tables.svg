<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="132"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：left / right 两张计数表的迁移</text>

  <!-- 位置带 -->
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="300" y="76" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
  </g>
  <text x="160" y="103" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">pivot p ≤ i（左表 left）</text>
  <text x="400" y="103" text-anchor="middle" font-size="13.5" fill="#7a5c1e" filter="url(#rough2)">pivot p &gt; i（右表 right）</text>

  <!-- 修改位 i -->
  <path d="M 280 60 L 280 128" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">修改位 i（nums[i] → k）</text>

  <!-- 两类查询 -->
  <rect x="60" y="150" width="200" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">p ≤ i：改动落在右半</text>
  <text x="160" y="194" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">left[(S+δ)/2]</text>
  <text x="160" y="210" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">（左半和不动，右半 +δ）</text>

  <rect x="300" y="150" width="200" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="174" text-anchor="middle" font-size="12.5" fill="#7a2e2a" filter="url(#rough2)">p &gt; i：改动落在左半</text>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">right[(S−δ)/2]</text>
  <text x="400" y="210" text-anchor="middle" font-size="11.5" fill="#7a2e2a" filter="url(#rough2)">（左半 +δ，需 pre[p]=（S−δ)/2）</text>

  <!-- 迁移箭头 -->
  <path d="M 350 126 C 330 140, 220 140, 190 126" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="140" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">统计完 i 后：pivot i+1 从 right 迁入 left</text>

  <!-- 主循环骨架 -->
  <rect x="60" y="236" width="440" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="260">初始化：right ← { pre[1..n−1] }（left 为空）</text>
    <text x="80" y="282">基线 ans：S 偶数时 right[S/2]（不改的方案）</text>
    <text x="80" y="304">for i = 0 … n−1：δ = k − nums[i]</text>
    <text x="100" y="326">cand = left[(S+δ)/2] + right[(S−δ)/2]（奇数项记 0）</text>
    <text x="100" y="348">ans = max(ans, cand)；迁移 pre[i+1]：right → left</text>
  </g>

  <text x="280" y="384" text-anchor="middle" font-size="12.5" fill="#7a2e2a" filter="url(#rough2)">⚠ 方向是最大易错点：p ≤ i 查 (S+δ)/2、p &gt; i 查 (S−δ)/2</text>
  <text x="280" y="404" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">每轮只迁移一个 pivot，两张表合计始终装着 n−1 个键 ⇒ O(n)</text>
</svg>
