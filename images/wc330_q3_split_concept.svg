<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="368" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：分数 = 固定底座 (w₀+wₙ₋₁) + 切点相邻和（袋价求和会「换搭档」）</text>

  <!-- ====== bag price brackets ====== -->
  <rect x="56" y="52" width="128" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="67" text-anchor="middle" font-size="9.5" fill="#4a7a3a">袋1 价格 w₀+w₁</text>
  <rect x="216" y="52" width="128" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="9.5" fill="#4a7a3a">袋2 价格 w₂+w₃</text>
  <rect x="376" y="52" width="128" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="67" text-anchor="middle" font-size="9.5" fill="#4a7a3a">袋3 价格 w₄+w₅</text>

  <!-- ====== marble row: first/last blue (fixed ends), middle plain ====== -->
  <circle cx="80" cy="110" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="80" y="114" text-anchor="middle" font-size="11" fill="#333">w₀</text>
  <circle cx="160" cy="110" r="22" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="11" fill="#333">w₁</text>
  <circle cx="240" cy="110" r="22" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="114" text-anchor="middle" font-size="11" fill="#333">w₂</text>
  <circle cx="320" cy="110" r="22" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#333">w₃</text>
  <circle cx="400" cy="110" r="22" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="11" fill="#333">w₄</text>
  <circle cx="480" cy="110" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="480" y="114" text-anchor="middle" font-size="11" fill="#333">w₅</text>

  <text x="80" y="84" text-anchor="middle" font-size="8.5" fill="#446688">固定左端</text>
  <text x="480" y="84" text-anchor="middle" font-size="8.5" fill="#446688">固定右端</text>

  <!-- ====== cut marks at gaps 1 and 3 ====== -->
  <path d="M 200 88 L 200 134" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✂</text>
  <path d="M 360 88 L 360 134" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✂</text>

  <!-- ====== pair boxes under each gap ====== -->
  <rect x="88" y="146" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="163" text-anchor="middle" font-size="9.5" fill="#888">w₀+w₁</text>
  <rect x="168" y="146" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="163" text-anchor="middle" font-size="9.5" fill="#8a6510" font-weight="bold">w₁+w₂</text>
  <rect x="248" y="146" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="9.5" fill="#888">w₂+w₃</text>
  <rect x="328" y="146" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="163" text-anchor="middle" font-size="9.5" fill="#8a6510" font-weight="bold">w₃+w₄</text>
  <rect x="408" y="146" width="64" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="163" text-anchor="middle" font-size="9.5" fill="#888">w₄+w₅</text>

  <text x="280" y="192" text-anchor="middle" font-size="9.5" fill="#555">切点 i 的贡献 = wᵢ + wᵢ₊₁（左袋右端 + 右袋左端）；未切处不产生任何项</text>

  <!-- ====== identity / regrouping box ====== -->
  <rect x="30" y="202" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#333">袋价求和 (w₀+w₁)+(w₂+w₃)+(w₄+w₅)　展开重排 ⇓</text>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#333">
    <tspan fill="#446688" font-weight="bold">= (w₀+w₅)</tspan>
    <tspan fill="#d6a040" font-weight="bold"> + (w₁+w₂)</tspan>
    <tspan fill="#d6a040" font-weight="bold"> + (w₃+w₄)</tspan>
  </text>
  <text x="280" y="260" text-anchor="middle" font-size="9.5" fill="#555">首尾两颗永远固定；中间端点全部「换搭档」，两两配对挂在切点上</text>

  <!-- ====== conclusion box ====== -->
  <rect x="30" y="282" width="500" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">底座 w₀+wₙ₋₁ 与切点选择无关 ⇒ 最大 / 最小分数可各自独立地贪心</text>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#333">最大分数 = 底座 + 前 k−1 大相邻和；　最小分数 = 底座 + 前 k−1 小相邻和</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">答案 = 最大 − 最小 ⇒ 底座抵消，只看相邻和数组的前 k−1 大 / 小</text>
</svg>
