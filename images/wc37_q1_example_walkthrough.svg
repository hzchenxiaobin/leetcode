<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：arrays = [[1,2,3],[4,5],[1,2,3]] 的三步走查</text>
  <path d="M 150 38 Q 360 46 570 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
    <rect x="45" y="54" width="630" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="155" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">mn</text>
  <text x="228" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">mx</text>
  <text x="316" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">prefMin</text>
  <text x="404" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">prefMax</text>
  <text x="486" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">A = mx−prefMin</text>
  <text x="590" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">B = prefMax−mn</text>
  <text x="655" y="77" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">best</text>

  <!-- 第 0 步 -->
    <rect x="45" y="94" width="630" height="38" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="119" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="155" y="119" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">1</text>
  <text x="228" y="119" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="316" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">+∞</text>
  <text x="404" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="486" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">跳过（前缀空）</text>
  <text x="590" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">跳过（前缀空）</text>
  <text x="655" y="119" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 1 步 -->
    <rect x="45" y="136" width="630" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="161" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">4</text>
  <text x="228" y="161" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="316" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="404" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="486" y="161" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5−1 = 4</text>
  <text x="590" y="161" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3−4 = −1</text>
  <text x="655" y="161" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 第 2 步 -->
    <rect x="45" y="178" width="630" height="38" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="155" y="203" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">1</text>
  <text x="228" y="203" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="316" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="404" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="486" y="203" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3−1 = 2</text>
  <text x="590" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5−1 = 4</text>
  <text x="655" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 前缀更新说明 -->
  <text x="360" y="236" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步末再更新前缀：第 1 步后 prefMin = 1、prefMax = 5；第 2 步后不变</text>

  <!-- 答案 -->
    <rect x="230" y="248" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="273" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">best = 4（取 arr1 的 5 与 arr0 的 1）</text>

  <!-- 陷阱校验 -->
    <rect x="45" y="302" width="630" height="94" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="324" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">同数组陷阱校验：arrays = [[0,9],[3,4]]</text>
  <text x="360" y="346" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">i = 0：(mn, mx) = (0, 9)，前缀空 ⇒ 只更新 prefMin = 0、prefMax = 9</text>
  <text x="360" y="366" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">i = 1：(mn, mx) = (3, 4)；A = 4 − 0 = 4，B = 9 − 3 = 6 ⇒ best = 6</text>
  <text x="360" y="386" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">若拿全局 max−min 直接减会得 9，但 0 与 9 同属 arr0，非法</text>

    <rect x="45" y="406" width="630" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="424" text-anchor="middle" font-size="11.5" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">示例 2：[[1],[1]] ⇒ 唯一一组候选 A = B = 0，故 best = 0</text>
  <text x="360" y="441" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#rough2)">m = 2 时第 1 步就能定出答案，后续元素只会让 best 单调不减</text>
</svg>
