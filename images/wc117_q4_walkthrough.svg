<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="372" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">示例 2：链 root → A → B → C → D（D 是 C 的右孩子）</text>
  <circle cx="70" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="95" text-anchor="middle" font-size="10.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">root</text>
  <circle cx="160" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="95" text-anchor="middle" font-size="10.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="250" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="10.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="340" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="95" text-anchor="middle" font-size="10.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">C</text>
  <circle cx="430" cy="160" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="165" text-anchor="middle" font-size="10.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">D</text>
  <line x1="94" y1="90" x2="136" y2="90" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="184" y1="90" x2="226" y2="90" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="274" y1="90" x2="316" y2="90" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="356" y1="104" x2="414" y2="148" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">D 返回 0</text>
  <text x="340" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">C 装📷</text>
  <text x="70" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">root 装📷</text>
  <rect x="60" y="226" width="460" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="253" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">D→0；C 见孩子未覆盖 → 装（ans=1）；B 见孩子有摄像头 → 已覆盖(2)</text>
  <rect x="60" y="280" width="460" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="307" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">A 见孩子已覆盖无摄像头 → 未覆盖(0)；root 见 A=0 → 装（ans=2）</text>
  <text x="290" y="348" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">根返回 1，无需补充 → 答案 2</text>
</svg>
