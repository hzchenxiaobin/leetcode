<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三种情况：n = 1 / n 偶 / n 奇</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">答案：n = 1 → 0；n 偶 → n/2；n 奇 → n</text>

  <g filter="url(#rough2)">
    <circle cx="90" cy="150" r="52" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="90" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n = 1</text>
  <text x="90" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 0</text>
  <text x="90" y="266" text-anchor="middle" font-size="10" fill="#555">整个圆本身就是 1 份</text>
  <text x="90" y="282" text-anchor="middle" font-size="10" fill="#555">不需要任何切割</text>

  <g filter="url(#rough2)">
    <circle cx="280" cy="150" r="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="228" y1="150" x2="332" y2="150" stroke="#b85450" stroke-width="2.4"/>
    <line x1="280" y1="98" x2="280" y2="202" stroke="#b85450" stroke-width="2.4"/>
    <line x1="243" y1="113" x2="317" y2="187" stroke="#b85450" stroke-width="2.4"/>
    <line x1="317" y1="113" x2="243" y2="187" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n = 8（偶数）</text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 n/2 = 4</text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#555">4 条互不相同的直径</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#555">每条直径切成 2 份 → 8 份</text>

  <g filter="url(#rough2)">
    <circle cx="470" cy="150" r="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <line x1="470" y1="150" x2="516" y2="150" stroke="#b85450" stroke-width="2.4"/>
    <line x1="470" y1="150" x2="493" y2="106" stroke="#b85450" stroke-width="2.4"/>
    <line x1="470" y1="150" x2="493" y2="194" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="470" y="228" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n = 3（奇数）</text>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 n = 3</text>
  <text x="470" y="266" text-anchor="middle" font-size="10" fill="#555">3 条半径（相隔 120°）</text>
  <text x="470" y="282" text-anchor="middle" font-size="10" fill="#555">直径只能产生偶数份</text>

  <rect x="60" y="310" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">易错点：n = 1 时返回 0 而不是 1</text>
  <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#555">「不切割」也是 1 等分；同理 n = 2 → 1 条直径（不是 2 条半径）</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999">判断次序：先特判 n == 1，再按奇偶分流</text>
</svg>
