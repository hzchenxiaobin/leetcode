<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="450" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四组官方样例走查：划掉第一个 0 与第一个 1</text>
  <text x="350" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">位置从 1 开始计数；两次删除相互独立，与先后顺序无关</text>

  <!-- 表头 -->
  <rect x="36" y="64" width="628" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12.5" font-weight="bold" fill="#33517a">
    <text x="56" y="87" filter="url(#rough2)">组</text>
    <text x="96" y="87" filter="url(#rough2)">s</text>
    <text x="330" y="87" filter="url(#rough2)">第一个 0</text>
    <text x="420" y="87" filter="url(#rough2)">第一个 1</text>
    <text x="506" y="87" filter="url(#rough2)">终串</text>
  </g>

  <!-- 行 1 -->
  <rect x="36" y="102" width="628" height="40" rx="5" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="128" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="96" y="128" font-size="12" fill="#2b2b2b" filter="url(#rough2)">101</text>
  <text x="330" y="128" font-size="12" fill="#b85450" filter="url(#rough2)">第 2 位</text>
  <text x="420" y="128" font-size="12" fill="#a0761e" filter="url(#rough2)">第 1 位</text>
  <text x="506" y="128" font-size="12" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="596" y="128" font-size="10.5" fill="#999" filter="url(#rough2)">n−2 = 1</text>

  <!-- 行 2 -->
  <rect x="36" y="146" width="628" height="40" rx="5" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="172" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="96" y="172" font-size="12" fill="#2b2b2b" filter="url(#rough2)">11001</text>
  <text x="330" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">第 3 位</text>
  <text x="420" y="172" font-size="12" fill="#a0761e" filter="url(#rough2)">第 1 位</text>
  <text x="506" y="172" font-size="12" fill="#2e6e2e" filter="url(#rough2)">101</text>
  <text x="596" y="172" font-size="10.5" fill="#999" filter="url(#rough2)">n−2 = 3</text>

  <!-- 行 3 -->
  <rect x="36" y="190" width="628" height="40" rx="5" fill="#f7f9fd" stroke="#dfe6f2" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="216" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="96" y="216" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0010</text>
  <text x="330" y="216" font-size="12" fill="#b85450" filter="url(#rough2)">第 1 位</text>
  <text x="420" y="216" font-size="12" fill="#a0761e" filter="url(#rough2)">第 3 位</text>
  <text x="506" y="216" font-size="12" fill="#2e6e2e" filter="url(#rough2)">00</text>
  <text x="596" y="216" font-size="10.5" fill="#999" filter="url(#rough2)">n−2 = 2</text>

  <!-- 行 4 -->
  <rect x="36" y="234" width="628" height="40" rx="5" fill="#fdfbf4" stroke="#eee3c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="260" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="96" y="260" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">0101010000010100100101</text>
  <text x="330" y="260" font-size="12" fill="#b85450" filter="url(#rough2)">第 1 位</text>
  <text x="420" y="260" font-size="12" fill="#a0761e" filter="url(#rough2)">第 2 位</text>
  <text x="506" y="260" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">01010000010100100101</text>

  <!-- 说明 -->
  <rect x="36" y="288" width="628" height="146" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="54" y="312" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">读表要点</text>
  <text x="54" y="338" font-size="12" fill="#2e6e2e" filter="url(#rough2)">第 1 组：唯一的 0 被删，Bob 两个 1 删哪个都一样，终串只剩 1 位。</text>
  <text x="54" y="362" font-size="12" fill="#2e6e2e" filter="url(#rough2)">第 2 组：最左的 1 比最左的 0 还靠前 —— 两个下标谁大谁小不固定，拼串不能假设顺序。</text>
  <text x="54" y="386" font-size="12" fill="#2e6e2e" filter="url(#rough2)">第 3 组：删掉第 1 位的 0 后，第 3 位的 1 前移一位，被 Bob 删掉，只剩 00。</text>
  <text x="54" y="410" font-size="12" fill="#2e6e2e" filter="url(#rough2)">第 4 组：22 位的串划掉第 1 位的 0 与第 2 位的 1，剩下 20 位按原顺序拼接。</text>
</svg>
