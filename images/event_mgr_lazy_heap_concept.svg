<svg xmlns="http://www.w3.org/2000/svg" width="680" height="445" viewBox="0 0 680 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="445" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">懒删除堆：哈希表存「真相」，堆里允许留「尸体」</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#444">update 不删旧条目、只压新条目；poll 时把浮到堆顶的「尸体」当场丢弃</text>

  <!-- 左：哈希表 -->
  <text x="155" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">哈希表 cur（真相：活跃事件）</text>
  <g filter="url(#sk)">
    <rect x="40" y="98" width="230" height="130" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 52 136 Q 155 140 258 136" stroke="#9db8d6" stroke-width="1" fill="none"/>
    <path d="M 52 168 Q 155 172 258 168" stroke="#9db8d6" stroke-width="1" fill="none"/>
    <path d="M 52 200 Q 155 204 258 200" stroke="#9db8d6" stroke-width="1" fill="none"/>
  </g>
  <text x="62" y="126" font-size="13" fill="#2e6e2e">5 → 7</text>
  <text x="62" y="158" font-size="13" fill="#b03a3a">2 → 7</text>
  <path d="M 58 154 L 112 152" stroke="#b03a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="138" y="158" font-size="10" fill="#b03a3a">已被 poll ✗</text>
  <text x="62" y="190" font-size="13" font-weight="bold" fill="#2b6e9e">9 → 7</text>
  <text x="138" y="190" font-size="10" fill="#888">刚被 update</text>
  <text x="62" y="220" font-size="10" fill="#888">只存活跃事件（poll 命中即删）</text>

  <!-- 中：箭头 -->
  <g filter="url(#sk)">
    <path d="M 272 163 L 366 163" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="150" text-anchor="middle" font-size="10.5" fill="#2b6e9e">init / update</text>
  <text x="320" y="181" text-anchor="middle" font-size="10.5" fill="#2b6e9e">压入 (−p, id)</text>

  <!-- 右：堆 -->
  <text x="505" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">堆（含尸体，堆顶在左）</text>
  <g filter="url(#sk)">
    <rect x="370" y="98" width="270" height="130" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="382" y="108" width="58" height="30" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="411" y="127" text-anchor="middle" font-size="12" fill="#b03a3a">7,2 ✗</text>
  <g filter="url(#sk)">
    <rect x="448" y="108" width="58" height="30" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="477" y="127" text-anchor="middle" font-size="12" fill="#2e6e2e">7,5</text>
  <g filter="url(#sk)">
    <rect x="514" y="108" width="58" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="543" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">7,9</text>
  <g filter="url(#sk)">
    <rect x="580" y="108" width="52" height="30" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="606" y="127" text-anchor="middle" font-size="12" fill="#b03a3a">4,9 ✗</text>
  <text x="382" y="156" font-size="10" fill="#666">堆顶在左：按 (−p, id) 升序 ≈ p 降、id 升</text>
  <text x="382" y="174" font-size="10" fill="#666">红虚线＝尸体（过期 / 已 poll）　橙＝刚压入</text>
  <text x="382" y="192" font-size="10" fill="#888">尸体不主动清理，留在堆里</text>
  <text x="382" y="220" font-size="10" fill="#888">条目记 (p, id)，总数最多 n + q</text>

  <!-- 有效性判定 -->
  <g filter="url(#sk)">
    <rect x="40" y="250" width="600" height="64" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="58" y="272" font-size="12.5" font-weight="bold" fill="#b03a3a">有效性判定（核心）</text>
  <text x="58" y="291" font-size="11.5" fill="#333">堆顶条目 (−p, id) 有效 ⟺ id ∈ cur 且 cur[id] == p；poll 命中返回 id 前先执行 del cur[id]</text>
  <text x="58" y="307" font-size="11.5" fill="#333">不满足 → 是尸体，弹出即丢，继续弹下一个</text>

  <!-- 为什么不删 -->
  <g filter="url(#sk)">
    <rect x="40" y="324" width="600" height="62" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="58" y="346" font-size="12.5" font-weight="bold" fill="#7a5415">为什么不删旧条目也能对？</text>
  <text x="58" y="365" font-size="11.5" fill="#444">堆不支持高效任意位置删除；尸体迟早浮到堆顶，一查 cur 即知真假</text>
  <text x="58" y="380" font-size="11.5" fill="#444">每个条目至多被压一次、弹一次 → 总代价 O((n+q) log(n+q))</text>

  <!-- 排序键 -->
  <g filter="url(#sk)">
    <rect x="40" y="394" width="600" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="58" y="417" font-size="11.5" font-weight="bold" fill="#2e6e2e">排序键 (−p, id)：小根堆弹出序 = 优先级大者优先、并列 id 小者优先 —— 恰是 pollHighest 的要求</text>
</svg>
