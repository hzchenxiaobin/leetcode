<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：k = 5 整块落空，k = 3 整块命中</text>

  <text x="56" y="56" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">k = 5：两轮收缩后 lo = 5，g(5) = 6 &gt; 5 → 返回 0</text>

  <rect x="56" y="66" width="448" height="22" rx="4" fill="#e8eef5" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="81" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">轮</text>
  <text x="140" y="81" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">lo</text>
  <text x="196" y="81" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">hi</text>
  <text x="252" y="81" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">mid</text>
  <text x="320" y="81" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">g(mid)</text>
  <text x="432" y="81" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">判定与动作</text>

  <rect x="56" y="90" width="448" height="26" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="108" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">1</text>
  <text x="140" y="108" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">0</text>
  <text x="196" y="108" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">5</text>
  <text x="252" y="108" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="320" y="108" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="432" y="108" text-anchor="middle" font-size="10.2" fill="#b85450" filter="url(#rough2)">2 &lt; 5 → lo = 3</text>

  <rect x="56" y="118" width="448" height="26" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="136" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="140" y="136" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">3</text>
  <text x="196" y="136" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">5</text>
  <text x="252" y="136" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">4</text>
  <text x="320" y="136" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">4</text>
  <text x="432" y="136" text-anchor="middle" font-size="10.2" fill="#b85450" filter="url(#rough2)">4 &lt; 5 → lo = 5</text>

  <rect x="56" y="152" width="448" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10.3" fill="#8a3a36" filter="url(#rough2)">终止 lo = hi = 5，g(5) = 5 + f(5) = 5 + 1 = 6 ≠ 5 → return 0</text>

  <path d="M 56 198 L 504 198" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <text x="56" y="226" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">k = 3：两轮收缩后 lo = 3，g(3) = 3 = 3 → 返回 5</text>

  <rect x="56" y="236" width="448" height="22" rx="4" fill="#e8eef5" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="251" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">轮</text>
  <text x="140" y="251" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">lo</text>
  <text x="196" y="251" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">hi</text>
  <text x="252" y="251" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">mid</text>
  <text x="320" y="251" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">g(mid)</text>
  <text x="432" y="251" text-anchor="middle" font-size="9.8" fill="#444" filter="url(#rough2)">判定与动作</text>

  <rect x="56" y="260" width="448" height="26" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="278" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">1</text>
  <text x="140" y="278" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">0</text>
  <text x="196" y="278" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">3</text>
  <text x="252" y="278" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">1</text>
  <text x="320" y="278" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">1</text>
  <text x="432" y="278" text-anchor="middle" font-size="10.2" fill="#4a7a3a" filter="url(#rough2)">1 &lt; 3 → lo = 2</text>

  <rect x="56" y="288" width="448" height="26" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="306" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="140" y="306" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="196" y="306" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">3</text>
  <text x="252" y="306" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="320" y="306" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">2</text>
  <text x="432" y="306" text-anchor="middle" font-size="10.2" fill="#4a7a3a" filter="url(#rough2)">2 &lt; 3 → lo = 3</text>

  <rect x="56" y="322" width="448" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="10.3" fill="#3a5a30" filter="url(#rough2)">终止 lo = hi = 3，g(3) = 3 + f(3) = 3 + 0 = 3 == k → return 5</text>

  <text x="280" y="370" text-anchor="middle" font-size="10.2" fill="#555" filter="url(#rough2)">块 t = 3 对应 x = 15, 16, 17, 18, 19：f 全都是 3，恰好 5 个解</text>

  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照：k = 5 正好落在 g(4) = 4 跳到 g(5) = 6 的空隙里，整块落空</text>
</svg>
