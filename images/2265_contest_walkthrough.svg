<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：root = [4,8,5,0,1,null,6] 的后序走查</text>
  <path d="M 150 38 Q 340 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- mini tree -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.5">
    <line x1="141" y1="88" x2="109" y2="114"/>
    <line x1="159" y1="88" x2="194" y2="114"/>
    <line x1="90" y1="136" x2="79" y2="164"/>
    <line x1="110" y1="136" x2="122" y2="164"/>
    <line x1="205" y1="138" x2="232" y2="164"/>
  </g>
  <circle cx="150" cy="75" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">4</text>
  <circle cx="100" cy="125" r="15" fill="#fff3d9" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
  <text x="100" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a15">8</text>
  <circle cx="205" cy="125" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="205" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">5</text>
  <circle cx="75" cy="178" r="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="75" y="183" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">0</text>
  <circle cx="128" cy="178" r="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="128" y="183" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1</text>
  <circle cx="240" cy="178" r="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="183" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">6</text>

  <!-- step badges on nodes -->
  <g filter="url(#sk)">
    <circle cx="164" cy="64" r="8" fill="#fff" stroke="#3a3a3a" stroke-width="1.1"/>
    <circle cx="114" cy="114" r="8" fill="#fff" stroke="#3a3a3a" stroke-width="1.1"/>
    <circle cx="219" cy="114" r="8" fill="#fff" stroke="#3a3a3a" stroke-width="1.1"/>
    <circle cx="88" cy="167" r="8" fill="#fff" stroke="#3a3a3a" stroke-width="1.1"/>
    <circle cx="141" cy="167" r="8" fill="#fff" stroke="#3a3a3a" stroke-width="1.1"/>
    <circle cx="253" cy="167" r="8" fill="#fff" stroke="#3a3a3a" stroke-width="1.1"/>
  </g>
  <text x="164" y="67.5" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="114" y="117.5" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="219" y="117.5" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="88" y="170.5" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="141" y="170.5" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="253" y="170.5" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="55" y="215" font-size="10.5" fill="#888">圆内为节点值，角标为后序步号</text>

  <!-- postorder sequence chips -->
  <text x="330" y="66" font-size="12" font-weight="bold" fill="#555">后序访问顺序：</text>
  <g filter="url(#sk)">
    <rect x="330" y="78" width="48" height="24" rx="10" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="388" y="78" width="48" height="24" rx="10" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="446" y="78" width="48" height="24" rx="10" fill="#fff3d9" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="504" y="78" width="48" height="24" rx="10" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="562" y="78" width="48" height="24" rx="10" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="620" y="78" width="48" height="24" rx="10" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="354" y="95" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">① 0</text>
  <text x="412" y="95" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">② 1</text>
  <text x="470" y="95" text-anchor="middle" font-size="11.5" fill="#8a5a15" font-weight="bold">③ 8</text>
  <text x="528" y="95" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">④ 6</text>
  <text x="586" y="95" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">⑤ 5</text>
  <text x="644" y="95" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">⑥ 4</text>

  <text x="330" y="130" font-size="10.5" fill="#555">绿色 = 命中（平均值恰等于节点值）</text>
  <text x="330" y="150" font-size="10.5" fill="#8a5a15">橙色 = 未命中（仅节点 8）</text>
  <text x="330" y="180" font-size="10.5" fill="#666">所有叶子必然命中：</text>
  <text x="330" y="197" font-size="10.5" fill="#666">子树和 = val、cnt = 1，val/1 = val</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="240" width="40" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="80" y="240" width="50" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="130" y="240" width="72" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="202" y="240" width="72" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="274" y="240" width="76" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="350" y="240" width="58" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="408" y="240" width="48" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
    <rect x="456" y="240" width="42" height="28" fill="#e8f0fa" stroke="#8aa4c8" stroke-width="1.1"/>
  </g>
  <text x="60" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">步</text>
  <text x="105" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">节点</text>
  <text x="166" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">dfs(L)</text>
  <text x="238" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">dfs(R)</text>
  <text x="312" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">sum / cnt</text>
  <text x="379" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">平均值</text>
  <text x="432" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">命中</text>
  <text x="477" y="258" text-anchor="middle" font-size="11" fill="#2b4a66" font-weight="bold">ans</text>

  <!-- rows: y 268..436, 6 rows of 28 -->
  <g filter="url(#sk)">
    <rect x="40" y="268" width="458" height="28" fill="#fdfcf7" stroke="#b8c0c8" stroke-width="1"/>
    <rect x="40" y="296" width="458" height="28" fill="#fdfcf7" stroke="#b8c0c8" stroke-width="1"/>
    <rect x="40" y="324" width="458" height="28" fill="#fce4ec" stroke="#c88aa4" stroke-width="1.2"/>
    <rect x="40" y="352" width="458" height="28" fill="#fdfcf7" stroke="#b8c0c8" stroke-width="1"/>
    <rect x="40" y="380" width="458" height="28" fill="#fff3d9" stroke="#c9a45b" stroke-width="1.2"/>
    <rect x="40" y="408" width="458" height="28" fill="#fdfcf7" stroke="#b8c0c8" stroke-width="1"/>
  </g>
  <!-- vertical grid -->
  <g filter="url(#sk)" stroke="#c8ccd0" stroke-width="0.8">
    <line x1="80" y1="268" x2="80" y2="436"/>
    <line x1="130" y1="268" x2="130" y2="436"/>
    <line x1="202" y1="268" x2="202" y2="436"/>
    <line x1="274" y1="268" x2="274" y2="436"/>
    <line x1="350" y1="268" x2="350" y2="436"/>
    <line x1="408" y1="268" x2="408" y2="436"/>
    <line x1="456" y1="268" x2="456" y2="436"/>
  </g>

  <!-- row 1: 0 -->
  <text x="60" y="286" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="105" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="166" y="286" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="238" y="286" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="312" y="286" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">0 / 1</text>
  <text x="379" y="286" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">0</text>
  <text x="432" y="286" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="477" y="286" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1</text>

  <!-- row 2: 1 -->
  <text x="60" y="314" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="105" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="166" y="314" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="238" y="314" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="312" y="314" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1 / 1</text>
  <text x="379" y="314" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">1</text>
  <text x="432" y="314" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="477" y="314" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">2</text>

  <!-- row 3: 8 (miss) -->
  <text x="60" y="342" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="105" y="342" text-anchor="middle" font-size="11" fill="#8a5a15" font-weight="bold">8</text>
  <text x="166" y="342" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 1)</text>
  <text x="238" y="342" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(1, 1)</text>
  <text x="312" y="342" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">9 / 3</text>
  <text x="379" y="342" text-anchor="middle" font-size="10.5" fill="#8e3a36" font-family="monospace" font-weight="bold">3</text>
  <text x="432" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="477" y="342" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row 4: 6 -->
  <text x="60" y="370" text-anchor="middle" font-size="11" fill="#333">④</text>
  <text x="105" y="370" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="166" y="370" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="238" y="370" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="312" y="370" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">6 / 1</text>
  <text x="379" y="370" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">6</text>
  <text x="432" y="370" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="477" y="370" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">3</text>

  <!-- row 5: 5 (floor trap) -->
  <text x="60" y="398" text-anchor="middle" font-size="11" fill="#333">⑤</text>
  <text x="105" y="398" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="166" y="398" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(0, 0)</text>
  <text x="238" y="398" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(6, 1)</text>
  <text x="312" y="398" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">11 / 2</text>
  <text x="379" y="398" text-anchor="middle" font-size="10.5" fill="#9a6a15" font-family="monospace" font-weight="bold">5</text>
  <text x="432" y="398" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="477" y="398" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">4</text>

  <!-- row 6: root 4 -->
  <text x="60" y="426" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="105" y="426" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="166" y="426" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(9, 3)</text>
  <text x="238" y="426" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">(11, 2)</text>
  <text x="312" y="426" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">24 / 6</text>
  <text x="379" y="426" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">4</text>
  <text x="432" y="426" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="477" y="426" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">5</text>

  <!-- annotations -->
  <g filter="url(#sk)">
    <path d="M 512 338 L 502 338" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="516" y="336" font-size="10.5" fill="#8e3a36" font-weight="bold">⌊9/3⌋ = 3 ≠ 8</text>
  <text x="516" y="351" font-size="10" fill="#8e3a36">未命中</text>
  <g filter="url(#sk)">
    <path d="M 512 394 L 502 394" stroke="#c98a2b" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="516" y="392" font-size="10.5" fill="#9a6a15" font-weight="bold">11/2 = 5.5</text>
  <text x="516" y="407" font-size="10" fill="#9a6a15">向下取整 → 5，恰好命中</text>

  <!-- bottom bar -->
  <g filter="url(#sk)">
    <rect x="40" y="456" width="618" height="30" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="349" y="476" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">最终 ans = 5 ✓ ｜ 若误用四舍五入，⑤ 会得 6 ≠ 5 而漏计，答案错成 4</text>
</svg>
