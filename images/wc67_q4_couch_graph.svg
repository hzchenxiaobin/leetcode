<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">沙发图：座位折成点，情侣连成边</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">每个沙发坐 2 人，每人各带来一条情侣边 ⇒ 每个顶点度数恰为 2 ⇒ 图是若干环</text>

  <g filter="url(#rough2)">
    <rect x="62" y="66" width="108" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="182" y="66" width="108" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="116" y="60" text-anchor="middle" font-size="10" fill="#446688">沙发 0</text>
    <text x="236" y="60" text-anchor="middle" font-size="10" fill="#446688">沙发 1</text>

    <rect x="70" y="74" width="46" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="120" y="74" width="46" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="190" y="74" width="46" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="240" y="74" width="46" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="93" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">0</text>
    <text x="143" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">2</text>
    <text x="213" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">1</text>
    <text x="263" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a4a66">3</text>


    <rect x="320" y="62" width="246" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="332" y="82" font-size="10" font-weight="bold" fill="#8a6a20">读图规则</text>
    <text x="332" y="102" font-size="9.5" fill="#555">· 自环：这对情侣已同沙发</text>
    <text x="332" y="122" font-size="9.5" fill="#555">· 长度 k 的环：要 k − 1 次交换</text>
    <text x="332" y="142" font-size="9.5" fill="#555">· 答案 = n − c（c 为环数）</text>

    <path d="M 116 126 C 128 168, 140 192, 156 228" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 236 126 C 258 168, 282 196, 310 230" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <circle cx="170" cy="258" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="330" cy="258" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="170" y="253" text-anchor="middle" font-size="10" fill="#3a5a30">沙发</text>
    <text x="170" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30">0</text>
    <text x="330" y="253" text-anchor="middle" font-size="10" fill="#3a5a30">沙发</text>
    <text x="330" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30">1</text>

    <path d="M 196 243 Q 250 210 304 243" fill="none" stroke="#b85450" stroke-width="1.9" marker-end="url(#arr)"/>
    <path d="M 196 273 Q 250 306 304 273" fill="none" stroke="#b85450" stroke-width="1.9" marker-end="url(#arr)"/>
    <text x="250" y="216" text-anchor="middle" font-size="10" fill="#b85450">情侣 (0, 1)</text>
    <text x="250" y="314" text-anchor="middle" font-size="10" fill="#b85450">情侣 (2, 3)</text>

    <rect x="95" y="322" width="390" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="290" y="342" text-anchor="middle" font-size="10.5" fill="#8a3b38">答案 = n − c ｜ 自环（k = 1）贡献 0 次，长度 k 的环贡献 k − 1 次</text>
    <text x="290" y="360" text-anchor="middle" font-size="9.5" fill="#999">上图两个沙发被两条平行边连成 2-环 ⇒ 答案 = 2 − 1 = 1</text>
  </g>
</svg>
