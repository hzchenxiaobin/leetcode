<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：字母→键位表 + 相邻移动累加</text>

  <!-- 键盘布局条 -->
  <text x="280" y="64" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">keyboard = "pqrstuvwxyzabcdefghijklmno"（非标准布局）</text>
  <g filter="url(#rough2)">
    <rect x="42"  y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76"  y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="144" y="76" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="178" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="348" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="382" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="416" y="76" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="450" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="484" y="76" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="59" y="98">p</text><text x="93" y="98">q</text><text x="127" y="98">r</text>
    <text x="161" y="98" fill="#7a5c1e" font-weight="bold">s</text><text x="195" y="98">t</text>
    <text x="229" y="98">u</text><text x="263" y="98">v</text><text x="297" y="98">w</text>
    <text x="331" y="98">x</text><text x="365" y="98">y</text><text x="399" y="98">z</text>
    <text x="433" y="98" fill="#2d5a22" font-weight="bold">a</text><text x="467" y="98">b</text><text x="501" y="98">c</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="59" y="120">0</text><text x="93" y="120">1</text><text x="127" y="120">2</text>
    <text x="161" y="120">3</text><text x="195" y="120">4</text><text x="229" y="120">5</text>
    <text x="263" y="120">6</text><text x="297" y="120">7</text><text x="331" y="120">8</text>
    <text x="365" y="120">9</text><text x="399" y="120">10</text><text x="433" y="120">11</text>
    <text x="467" y="120">12</text><text x="501" y="120">13</text>
  </g>
  <text x="161" y="146" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">t 的键位 = 4</text>
  <text x="433" y="146" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">a 的键位 = 11</text>

  <!-- 位置表 -->
  <text x="60" y="184" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">静态位置表 pos[26]（构建一次，O(1) 查询）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="196" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)" font-family="'Comic Sans MS', monospace">pos['p']=0  pos['t']=4  pos['a']=11  pos['e']=15  pos['l']=22  pos['o']=25 …</text>

  <!-- 移动累加示意 -->
  <text x="60" y="258" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">打字 word = "leetcode" 的手指轨迹：</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="60" y="284">0</text>
    <path d="M 74 280 L 108 280" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="118" y="284">22 (l)</text>
    <path d="M 158 280 L 192 280" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="202" y="284">15 (e)</text>
    <path d="M 246 280 L 280 280" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="290" y="284">4 (t) …</text>
  </g>
  <text x="60" y="312" font-size="12" fill="#888" filter="url(#rough2)">每步耗时 = |新键位 − 旧键位|，总和即答案</text>
</svg>
