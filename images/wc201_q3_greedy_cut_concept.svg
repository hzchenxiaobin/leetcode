<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：命中即拿、拿完即剪——已选子数组只以「右端点」封锁未来</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2：nums = [−1, 3, 5, 1, 4, 2, −9]，target = 6</text>

  <g filter="url(#rough2)">
    <rect x="60" y="62" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="86" y="88" text-anchor="middle" font-size="14" fill="#333">−1</text>
    <rect x="112" y="62" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="138" y="88" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="164" y="62" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="190" y="88" text-anchor="middle" font-size="14" fill="#333">5</text>
    <rect x="216" y="62" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="242" y="88" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="268" y="62" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="294" y="88" text-anchor="middle" font-size="14" fill="#333">4</text>
    <rect x="320" y="62" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="346" y="88" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="372" y="62" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="398" y="88" text-anchor="middle" font-size="14" fill="#333">−9</text>

    <text x="86" y="118" text-anchor="middle" font-size="9.5" fill="#999">0</text>
    <text x="138" y="118" text-anchor="middle" font-size="9.5" fill="#999">1</text>
    <text x="190" y="118" text-anchor="middle" font-size="9.5" fill="#999">2</text>
    <text x="242" y="118" text-anchor="middle" font-size="9.5" fill="#999">3</text>
    <text x="294" y="118" text-anchor="middle" font-size="9.5" fill="#999">4</text>
    <text x="346" y="118" text-anchor="middle" font-size="9.5" fill="#999">5</text>
    <text x="398" y="118" text-anchor="middle" font-size="9.5" fill="#999">6</text>

    <path d="M 268 56 L 268 200" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <text x="268" y="134" text-anchor="middle" font-size="15" fill="#b85450">✂</text>

    <path d="M 166 140 L 166 148 L 266 148 L 266 140" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <text x="216" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">sum = 6 ✓</text>
    <text x="216" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a">右端点最早 → 先拿</text>

    <path d="M 272 140 L 272 148 L 372 148 L 372 140" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <text x="322" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">sum = 6 ✓</text>
    <text x="322" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a">剪断后重新累计</text>

    <path d="M 114 204 L 114 212 L 422 212 L 422 204" stroke="#b85450" stroke-width="2" fill="none"/>
    <text x="268" y="232" text-anchor="middle" font-size="11.5" fill="#b85450">sum = 6 ✗ 舍弃：与已选两个重叠（右端点太晚，交换不亏，见 §5）</text>

    <rect x="444" y="66" width="182" height="118" rx="8" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="535" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">和为 6 的候选共 3 个</text>
    <text x="535" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a">[5,1]、[4,2] 互不重叠</text>
    <text x="535" y="134" text-anchor="middle" font-size="11" fill="#b85450">[3,…,−9] 与两者都重叠</text>
    <text x="535" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d28">∴ 最多选 2 个</text>

    <rect x="40" y="258" width="560" height="128" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="320" y="284" text-anchor="middle" font-size="12" fill="#446688">① 定位：子数组和 = 前缀和之差，pre[j] = pre[i] − target，哈希集合 O(1) 判定（负数 ⇒ 滑动窗口失效）</text>
    <text x="320" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a">② 决策：已选子数组只以「右端点」封锁未来 ⇒ 结束越早越有利，命中即拿</text>
    <text x="320" y="344" text-anchor="middle" font-size="12" fill="#b07818">③ 重启：剪断后 cur ← 0、seen ← {0}，等价于「在后缀上重跑同一算法」（归纳结构，见 §5）</text>

    <text x="320" y="420" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d28">ans：0 → 1（✂ 剪断）→ 2（✂ 剪断）——扫描结束输出 2</text>
    <text x="320" y="448" text-anchor="middle" font-size="10.5" fill="#888">「拿完即剪」丢掉剪断点之前的全部前缀：跨剪断点的候选从此不可能被匹配——这正是不重叠约束的化身</text>
  </g>
</svg>
