<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：定长窗口内 0 的个数 = 交换次数</text>

  <!-- 数组 data = [1,0,1,0,1,0,0,1,1,0,1]，窗口 [5,10] -->
  <g filter="url(#rough2)">
    <rect x="52"  y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="94"  y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="178" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="304" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="346" y="70" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="388" y="70" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="430" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="472" y="70" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="73"  y="97">1</text><text x="115" y="97">0</text><text x="157" y="97">1</text>
    <text x="199" y="97">0</text><text x="241" y="97">1</text>
    <text x="283" y="97" fill="#7a5c1e" font-weight="bold">0</text>
    <text x="325" y="97" fill="#7a5c1e" font-weight="bold">0</text>
    <text x="367" y="97" fill="#2d5a22" font-weight="bold">1</text>
    <text x="409" y="97" fill="#2d5a22" font-weight="bold">1</text>
    <text x="451" y="97" fill="#7a5c1e" font-weight="bold">0</text>
    <text x="493" y="97" fill="#2d5a22" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#888" text-anchor="middle">
    <text x="73" y="122">0</text><text x="115" y="122">1</text><text x="157" y="122">2</text>
    <text x="199" y="122">3</text><text x="241" y="122">4</text><text x="283" y="122">5</text>
    <text x="325" y="122">6</text><text x="367" y="122">7</text><text x="409" y="122">8</text>
    <text x="451" y="122">9</text><text x="493" y="122">10</text>
  </g>

  <!-- 窗口标注 -->
  <path d="M 258 52 L 258 44 L 516 44 L 516 52" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="38" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">窗口 [5,10]，长度 = ones = 6</text>

  <!-- 窗内 0 与窗外 1 配对 -->
  <text x="60" y="156" font-size="13.5" fill="#7a5c1e" filter="url(#rough2)">窗内 0（黄色，3 个）：下标 5、6、9</text>
  <text x="60" y="178" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">窗外 1（绿色，3 个）：下标 0、2、4</text>

  <!-- 配对箭头 -->
  <path d="M 115 200 C 160 236, 260 236, 283 216" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 199 216 C 280 250, 340 244, 325 216" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 283 216 C 360 262, 430 250, 451 216" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="387" y="258" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">一一配对互换，每次消灭一个「窗内 0 + 窗外 1」</text>

  <!-- 结论框 -->
  <rect x="90" y="278" width="380" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = min（所有长度为 ones 的窗口内 0 的个数）</text>
</svg>
