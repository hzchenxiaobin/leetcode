<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">递推：同一巫师「忙完上一个才能接下一个」，开工时刻取所有约束的 max</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 情形 A：开太早 -->
  <g filter="url(#sk)">
    <rect x="52" y="66" width="64" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="84" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b">巫师 i</text>
  <text x="140" y="86" font-size="12.5" fill="#b85450" font-weight="bold">情形 A：开太早 ✗</text>
  <g filter="url(#sk)">
    <rect x="190" y="66" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="238" y="60" width="120" height="42" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4"/>
  </g>
  <text x="265" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">药水 j−1</text>
  <text x="298" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">药水 j 的到达</text>
  <path d="M 332 74 Q 356 60 374 74" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="420" y="70" font-size="11" fill="#b85450">药水 j 到了，巫师 i 还在处理 j−1</text>
  <text x="420" y="86" font-size="11" fill="#b85450">→ 违反「一到马上开工」✗</text>

  <!-- 情形 B：恰好 -->
  <text x="140" y="136" font-size="12.5" fill="#4a7a3a" font-weight="bold">情形 B：压着约束开工 ✓</text>
  <g filter="url(#sk)">
    <rect x="190" y="116" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="348" y="116" width="120" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="265" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">药水 j−1</text>
  <text x="408" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">药水 j</text>
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="190" y="162">T&#8202;ⱼ₋₁+P[i]·m&#8202;ⱼ₋₁</text>
    <text x="340" y="162">T&#8202;ⱼ₋₁+P[i+1]·m&#8202;ⱼ₋₁</text>
    <text x="468" y="162">T&#8202;ⱼ+P[i+1]·m&#8202;ⱼ</text>
    <text x="348" y="108">T&#8202;ⱼ+P[i]·m&#8202;ⱼ ≥ 左边 ✃</text>
  </g>
  <path d="M 340 116 L 340 152" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#sk)"/>

  <!-- 推导框 -->
  <g filter="url(#sk)">
    <rect x="80" y="184" width="480" height="88" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="212" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6b">硬性要求：T&#8202;ⱼ + P[i]·m&#8202;ⱼ ≥ T&#8202;ⱼ₋₁ + P[i+1]·m&#8202;ⱼ₋₁</text>
  <text x="320" y="238" text-anchor="middle" font-size="13" fill="#446688">⟹  T&#8202;ⱼ ≥ T&#8202;ⱼ₋₁ + ( P[i+1]·m&#8202;ⱼ₋₁ − P[i]·m&#8202;ⱼ )</text>
  <text x="320" y="262" text-anchor="middle" font-size="12.5" fill="#666">每个巫师 i 各给一条下界 → 全都要满足，取 max</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="80" y="296" width="480" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">Δ&#8202;ⱼ = max&#8202;₀≤ᵢ&lt;n ( P[i+1]·m&#8202;ⱼ₋₁ − P[i]·m&#8202;ⱼ )   ，   T&#8202;ⱼ = T&#8202;ⱼ₋₁ + Δ&#8202;ⱼ</text>
  <text x="320" y="352" text-anchor="middle" font-size="12.5" fill="#a05a20">Δ&#8202;ⱼ 只由相邻两个 mana 决定，与前面何时开工无关</text>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a05a20">晚开工只会把后面整体顺延 → 每步取最小值，全局就最优</text>

  <text x="320" y="416" text-anchor="middle" font-size="11" fill="#888">实现时不需要显式维护 T&#8202;ⱼ：只滚动记录 fin[i]（巫师 i 完成上一个药水的时刻）即可</text>
</svg>
