<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：交叉乘积改写为比值，左右两半解耦</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组（示例 1） -->
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#999">示例 1：nums = [1, 2, 3, 4, 3, 6, 1]，取 (p, q, r, s) = (0, 2, 4, 6)</text>
  <g filter="url(#sk)">
    <rect x="166" y="72" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="210" y="72" width="44" height="42" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="254" y="72" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="298" y="72" width="44" height="42" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="342" y="72" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="386" y="72" width="44" height="42" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="430" y="72" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <g font-size="15" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="188" y="98" fill="#2b6e9e">1</text>
    <text x="232" y="98" fill="#777">2</text>
    <text x="276" y="98" fill="#2b6e9e">3</text>
    <text x="320" y="98" fill="#777">4</text>
    <text x="364" y="98" fill="#7a5415">3</text>
    <text x="408" y="98" fill="#777">6</text>
    <text x="452" y="98" fill="#7a5415">1</text>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold" font-style="italic">
    <text x="188" y="128" fill="#2b6e9e">p</text>
    <text x="276" y="128" fill="#2b6e9e">q</text>
    <text x="364" y="128" fill="#7a5415">r</text>
    <text x="452" y="128" fill="#7a5415">s</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#aaa">
    <text x="188" y="141">0</text>
    <text x="232" y="141">1</text>
    <text x="276" y="141">2</text>
    <text x="320" y="141">3</text>
    <text x="364" y="141">4</text>
    <text x="408" y="141">5</text>
    <text x="452" y="141">6</text>
  </g>

  <!-- 等式改写框 -->
  <g filter="url(#sk)">
    <rect x="80" y="150" width="480" height="58" rx="10" fill="#fdfcf7" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="320" y="172" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">nums[p]·nums[r] = nums[q]·nums[s]   →   1·3 = 3·1 ✓</text>
  <text x="320" y="196" text-anchor="middle" font-size="13" font-family="monospace" fill="#333">⟺  nums[p]/nums[q] = nums[s]/nums[r]   →   1/3 = 1/3 ✓</text>
  <text x="548" y="172" font-size="9" fill="#999">交叉相乘</text>
  <text x="548" y="196" font-size="9" fill="#b85450">交叉相除</text>

  <!-- 左右两对解耦框 -->
  <g filter="url(#sk)">
    <rect x="58" y="222" width="230" height="74" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="352" y="222" width="230" height="74" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <ellipse cx="320" cy="259" rx="17" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="173" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">左对 (p, q)</text>
  <text x="173" y="263" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">分数 nums[p] / nums[q]</text>
  <text x="173" y="284" text-anchor="middle" font-size="11" fill="#555">key 只依赖 p、q 两个下标</text>
  <text x="320" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">=</text>
  <text x="467" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">右对 (r, s)</text>
  <text x="467" y="263" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">分数 nums[s] / nums[r]</text>
  <text x="467" y="284" text-anchor="middle" font-size="11" fill="#b85450">注意：分子是 s！（别写反）</text>

  <!-- 底部要点条 -->
  <g filter="url(#sk)">
    <rect x="80" y="308" width="480" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#9c3a34">两半之间只剩位置约束 q ≤ r−2 —— 可用「先入表、后查询」的扫描顺序实现</text>
  <text x="320" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#9c3a34">枚举 r：左对入表一次，右对查询一次 → O(n²)</text>
</svg>
