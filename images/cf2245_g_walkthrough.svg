<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="22" y="30" font-size="17" fill="#333" filter="url(#rough2)">样例走查：n = 5，边 1-2, 2-3, 2-4, 3-5</text>

  <!-- tree -->
  <g filter="url(#rough2)">
    <line x1="72" y1="86" x2="112" y2="126" stroke="#8899aa" stroke-width="2"/>
    <line x1="112" y1="126" x2="120" y2="176" stroke="#8899aa" stroke-width="2"/>
    <line x1="112" y1="126" x2="166" y2="88" stroke="#8899aa" stroke-width="2"/>
    <line x1="120" y1="176" x2="74" y2="204" stroke="#8899aa" stroke-width="2"/>
    <circle cx="72" cy="86" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="112" cy="126" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="166" cy="88" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="120" cy="176" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="74" cy="204" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="72" y="91" font-size="13" text-anchor="middle" fill="#333">5</text>
    <text x="112" y="131" font-size="13" text-anchor="middle" fill="#333">3</text>
    <text x="166" y="93" font-size="13" text-anchor="middle" fill="#333">4</text>
    <text x="120" y="181" font-size="13" text-anchor="middle" fill="#333">2</text>
    <text x="74" y="209" font-size="13" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="196" y="106" font-size="11" fill="#666" filter="url(#rough2)">绿 = S，红 = C</text>

  <!-- steps -->
  <g filter="url(#rough2)">
    <rect x="22" y="222" width="536" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="32" y="242" font-size="12" fill="#22333f">① 问 (5,3,4,1,2) → 1 0 1 1 0  ⇒ S={5,4,1}，C={3,2}　　代价 5</text>
  </g>
  <path d="M290,252 L290,262" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="22" y="264" width="536" height="30" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="32" y="284" font-size="12" fill="#4a2b2a">② 递归 C：问 (2,3) → 1 0，再问 (2,3) 得边 2-3；于是 C 染成 {3} 与 {2}　　代价 4</text>
  </g>
  <path d="M290,294 L290,304" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="22" y="306" width="536" height="30" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="32" y="326" font-size="12" fill="#4a3a15">③ work(S,{3})：问 (3,5,4,1) → 1 0 1 1 ⇒ 边 3-5　　代价 4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="22" y="340" width="536" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="32" y="360" font-size="12" fill="#2f5b23">④ work(S,{2})：问 (2,5,4,1) → 1 1 0 0，再问 (2,4)、(2,1) ⇒ 边 2-4、2-1　代价 8</text>
  </g>
</svg>
