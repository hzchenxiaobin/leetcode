<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">二分图 ⇔ 每条边两端异色；出现奇环必然撞色</text>
  <text x="330" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">颜色只有两种 ⇒ 固定起点颜色后，整个连通分量的染色唯一</text>

  <!-- 左：C4 可二染色 -->
  <rect x="30" y="66" width="290" height="304" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="90" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">二分图：四边形 C4</text>

  <g stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M110,152 L240,152" stroke="#446688"/>
    <path d="M240,152 L240,272" stroke="#446688"/>
    <path d="M110,272 L240,272" stroke="#446688"/>
    <path d="M110,152 L110,272" stroke="#4a7a3a"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="110" cy="152" r="20" fill="#ffffff" stroke="#446688" stroke-width="2.4"/>
    <text x="110" y="158" text-anchor="middle" font-size="13" fill="#333">0</text>
    <circle cx="240" cy="152" r="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="240" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
    <circle cx="240" cy="272" r="20" fill="#ffffff" stroke="#446688" stroke-width="2.4"/>
    <text x="240" y="278" text-anchor="middle" font-size="13" fill="#333">2</text>
    <circle cx="110" cy="272" r="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="110" y="278" text-anchor="middle" font-size="13" fill="#333">3</text>
  </g>

  <text x="175" y="316" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">A = {0, 2}（蓝）　B = {1, 3}（绿）</text>
  <text x="175" y="338" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每条边都跨越两组 ⇒ 合法划分</text>
  <text x="175" y="356" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">距离奇偶：dist(0,1)=1 → 1 号染 1</text>

  <!-- 右：C3 必冲突 -->
  <rect x="340" y="66" width="290" height="304" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="90" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">非二分图：三角形 C3</text>

  <g stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M485,142 L412,268" stroke="#446688"/>
    <path d="M485,142 L558,268" stroke="#4a7a3a"/>
    <path d="M412,268 L558,268" stroke="#b85450" stroke-width="3.2" stroke-dasharray="7 5"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="485" cy="142" r="20" fill="#ffffff" stroke="#446688" stroke-width="2.4"/>
    <text x="485" y="148" text-anchor="middle" font-size="13" fill="#333">0</text>
    <circle cx="412" cy="268" r="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="412" y="274" text-anchor="middle" font-size="13" fill="#333">1</text>
    <circle cx="558" cy="268" r="20" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="558" y="274" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="485" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 同色</text>
  </g>

  <text x="485" y="320" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">0 染 0 ⇒ 1、2 必染 1 ⇒ 边 (1,2) 撞色</text>
  <text x="485" y="340" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">换起点、换起始颜色都一样，冲突逃不掉</text>
  <text x="485" y="358" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">奇数长度的环 = 二分图的充要障碍</text>

  <!-- 底部结论 -->
  <rect x="60" y="384" width="540" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="407" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">BFS / DFS 交替染色：边两端同色 ⇒ 立刻 return false，全部染完 ⇒ true</text>
</svg>
