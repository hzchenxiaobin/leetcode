<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="28" font-size="16" fill="#333" filter="url(#rough2)">示例走查：先拿 a、再穿过门 A 拿 b，共 8 步</text>

  <text x="60" y="42" font-size="11" fill="#b85450" filter="url(#rough2)">红色箭头 = 实际路线，共 8 步</text>

  <rect x="60" y="50" width="60" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">@</text>
  <rect x="120" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">.</text>
  <rect x="180" y="50" width="60" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <rect x="240" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">.</text>
  <rect x="300" y="50" width="60" height="50" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">.</text>

  <rect x="60" y="100" width="60" height="50" rx="4" fill="#e0e0e0" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">#</text>
  <rect x="120" y="100" width="60" height="50" rx="4" fill="#e0e0e0" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">#</text>
  <rect x="180" y="100" width="60" height="50" rx="4" fill="#e0e0e0" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="132" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">#</text>
  <rect x="240" y="100" width="60" height="50" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">.</text>
  <rect x="300" y="100" width="60" height="50" rx="4" fill="#e0e0e0" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="132" text-anchor="middle" font-size="18" fill="#555" filter="url(#rough2)">#</text>

  <rect x="60" y="150" width="60" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="182" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="120" y="150" width="60" height="50" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">.</text>
  <rect x="180" y="150" width="60" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="182" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">A</text>
  <rect x="240" y="150" width="60" height="50" rx="4" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">.</text>
  <rect x="300" y="150" width="60" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="182" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">B</text>

  <path d="M120,75 L120,75" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M124,75 L176,75" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M214,75 L236,75" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M274,75 L274,98" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M274,128 L274,148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M236,178 L216,178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M176,178 L156,178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M116,178 L96,178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>


  <rect x="390" y="50" width="230" height="150" rx="9" fill="#ffffff" stroke="#c8d0da" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="74" font-size="12" fill="#446688" filter="url(#rough2)">步数账本</text>
  <text x="406" y="98" font-size="11" fill="#333" filter="url(#rough2)">(0,0) → (0,1) → (0,2)：拿 a，2 步</text>
  <text x="406" y="120" font-size="11" fill="#333" filter="url(#rough2)">(0,2) → (0,3) → (1,3)：2 步</text>
  <text x="406" y="142" font-size="11" fill="#333" filter="url(#rough2)">(1,3) → (2,3) → (2,2)：门 A 通过</text>
  <text x="406" y="164" font-size="11" fill="#333" filter="url(#rough2)">(2,2) → (2,1) → (2,0)：拿 b</text>
  <text x="406" y="186" font-size="12" fill="#4a7a3a" filter="url(#rough2)">总计 8 步，两把钥匙到手</text>

  <text x="60" y="230" font-size="12" fill="#333" filter="url(#rough2)">要点：目标是「拿到所有钥匙」，不是打开所有锁 —— 门 B 始终没开也不影响答案 8。</text>

  <rect x="60" y="248" width="560" height="120" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="272" font-size="12" fill="#446688" filter="url(#rough2)">BFS 队列里的关键帧</text>
  <text x="78" y="296" font-size="11" fill="#333" filter="url(#rough2)">dist 0：((0,0), mask 00)</text>
  <text x="78" y="318" font-size="11" fill="#333" filter="url(#rough2)">dist 2：((0,2), mask 01)　a 到手，门 A 变为可通行</text>
  <text x="78" y="340" font-size="11" fill="#333" filter="url(#rough2)">dist 6：((2,0), mask 11)　b 到手，mask 等于目标态 ⇒ 立刻返回 8</text>
  <text x="78" y="360" font-size="11" fill="#666" filter="url(#rough2)">同一格 (2,0) 在 mask 00 时不可达（被墙和门隔开），所以必须带 mask 记状态。</text>
</svg>
