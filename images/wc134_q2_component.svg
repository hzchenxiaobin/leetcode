<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">连通分量与“边界格子”：只染边，不染心</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">从 (row, col) 出发，只沿同色 4-邻格扩散</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="60" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="106" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="152" y="66" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="198" y="66" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="244" y="66" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>

    <rect x="60" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="106" y="112" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="152" y="112" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="198" y="112" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="244" y="112" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>

    <rect x="60" y="158" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="106" y="158" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="152" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="198" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="244" y="158" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>

    <rect x="60" y="204" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="106" y="204" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="152" y="204" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="198" y="204" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="244" y="204" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="83" y="95" fill="#446688">1</text><text x="129" y="95" fill="#446688">1</text><text x="175" y="95" fill="#446688">1</text>
    <text x="221" y="95" fill="#8a6a20">2</text><text x="267" y="95" fill="#8a6a20">2</text>
    <text x="83" y="141" fill="#446688">1</text><text x="129" y="141" fill="#4a7a3a">1</text><text x="175" y="141" fill="#446688">1</text>
    <text x="221" y="141" fill="#8a6a20">2</text><text x="267" y="141" fill="#8a3a36">3</text>
    <text x="83" y="187" fill="#446688">1</text><text x="129" y="187" fill="#446688">1</text><text x="175" y="187" fill="#8a6a20">2</text>
    <text x="221" y="187" fill="#8a6a20">2</text><text x="267" y="187" fill="#8a6a20">2</text>
    <text x="83" y="233" fill="#8a6a20">2</text><text x="129" y="233" fill="#8a6a20">2</text><text x="175" y="233" fill="#8a6a20">2</text>
    <text x="221" y="233" fill="#8a3a36">3</text><text x="267" y="233" fill="#8a6a20">2</text>
  </g>

  <text x="60" y="272" font-size="10.5" fill="#888">行 0</text>
  <text x="60" y="316" font-size="10.5" fill="#888">分量外</text>

  <rect x="330" y="66" width="200" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="86" font-size="11.5" fill="#3a4a66" font-weight="bold">蓝框 = 边界格子（要染色）</text>
  <text x="344" y="106" font-size="10" fill="#555">· 位于网格最外圈，或</text>
  <text x="344" y="124" font-size="10" fill="#555">· 4-邻格中存在异色格子</text>
  <text x="344" y="148" font-size="10" fill="#446688">共 7 个，含角与“贴着异色”的格</text>

  <rect x="330" y="170" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="190" font-size="11.5" fill="#3a5a30" font-weight="bold">绿框 = 分量内部格子</text>
  <text x="344" y="212" font-size="10" fill="#555">4 个邻格全在分量内</text>
  <text x="344" y="230" font-size="10" fill="#555">→ 颜色保持不变（本例仅 1 个）</text>

  <rect x="330" y="250" width="200" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="270" font-size="11.5" fill="#8a6a20" font-weight="bold">黄/红 = 其它分量</text>
  <text x="344" y="292" font-size="10" fill="#555">同色但不相邻 → 不同分量</text>
  <text x="344" y="310" font-size="10" fill="#555">绝不参与染色</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999">判定边界时网格还是“原色”，只有等所有格子判完才统一涂色</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999">否则先涂的格子会污染后判的格子，把内部格误染成边界色</text>
</svg>
