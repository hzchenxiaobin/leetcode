<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
<text x="280" y="26" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">覆盖判定：格子 pos 落在窗口 [start, start+L−1] 内</text>
<rect x="30" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="46.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<rect x="62" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="78.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<rect x="94" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="110.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<rect x="126" y="118" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="142.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<rect x="158" y="118" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="174.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
<rect x="190" y="118" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
<text x="206.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
<rect x="222" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="238.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">6</text>
<rect x="254" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="270.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">7</text>
<rect x="286" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="302.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">8</text>
<rect x="318" y="118" width="32" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
<text x="334.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">9</text>
<rect x="350" y="118" width="32" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
<text x="366.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">10</text>
<rect x="382" y="118" width="32" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
<text x="398.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">11</text>
<rect x="414" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="430.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">12</text>
<rect x="446" y="118" width="32" height="36" rx="4" fill="#ffffff" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
<text x="462.0" y="141" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">13</text>
<text x="174.0" y="86" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">匹配起点 3（覆盖 3,4,5）</text>
<text x="366.0" y="86" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">匹配起点 9（覆盖 9,10,11）</text>
<rect x="218" y="112" width="104" height="48" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
<text x="270.0" y="180" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">pos = 8 检查 [6,8]：无匹配 → 未覆盖</text>
<text x="280" y="236" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">pos ∈ [start, start+L−1]  ⟺  start ∈ [pos−L+1, pos]</text>
<text x="280" y="272" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">于是只需维护“当前区间内的匹配起点个数”：进一个、出一个，O(1) 更新</text>
<text x="280" y="302" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">H 与 V 分别求一次覆盖，最后统计同时被覆盖的格子</text>
</svg>
