<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">数置位数（popcount）：Brian Kernighan 技巧 n &amp;= n − 1</text>

  <!-- 状态 1：n = 13 (1101) -->
  <rect x="5" y="62" width="115" height="80" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 13</text>
  <rect x="9" y="96" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="21" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="37" y="96" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="49" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="65" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="77" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="93" y="96" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 箭头 1 -->
  <path d="M 124 102 L 144 102" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n&amp;=n−1</text>
  <text x="135" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- 状态 2：n = 12 (1100) -->
  <rect x="150" y="62" width="115" height="80" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 12</text>
  <rect x="154" y="96" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="166" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="182" y="96" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="210" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="222" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="238" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- 箭头 2 -->
  <path d="M 269 102 L 289 102" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n&amp;=n−1</text>
  <text x="280" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- 状态 3：n = 8 (1000) -->
  <rect x="295" y="62" width="115" height="80" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 8</text>
  <rect x="299" y="96" width="24" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="311" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="327" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="339" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="355" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="367" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="383" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="395" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- 箭头 3 -->
  <path d="M 414 102 L 434 102" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n&amp;=n−1</text>
  <text x="425" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- 状态 4：n = 0 -->
  <rect x="440" y="62" width="115" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="497" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">n = 0，停止</text>
  <rect x="444" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="456" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="472" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="484" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="500" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="512" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="528" y="96" width="24" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="540" y="117" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- 结论 -->
  <rect x="140" y="160" width="280" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">循环 3 次 ⇒ popcount(13) = 3</text>

  <!-- 三种实现对比 -->
  <text x="280" y="234" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">三种数置位数的方式</text>

  <rect x="20" y="248" width="165" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">逐位判断 n &amp; 1</text>
  <text x="102" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">O(log n)</text>

  <rect x="197" y="248" width="165" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Kernighan n &amp;= n − 1</text>
  <text x="279" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">O(置位数)</text>

  <rect x="374" y="248" width="165" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="456" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#b27a10" filter="url(#rough2)">内置 popcount</text>
  <text x="456" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">≈ O(1) 一条指令</text>
</svg>
