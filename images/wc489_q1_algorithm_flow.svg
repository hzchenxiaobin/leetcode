<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="510" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一次计数 + 一次扫描</text>

  <!-- 开始 -->
  <rect x="270" y="40" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="57" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,66 L320,80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="84" width="270" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace" filter="url(#rough2)">cnt[1..100] ← 0</text>
  <path d="M320,116 L320,130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop 1 -->
  <rect x="170" y="134" width="300" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="151" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">① 遍历 bulbs 中每个元素 x</text>
  <path d="M320,160 L320,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="178" width="270" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace" filter="url(#rough2)">cnt[x] ← cnt[x] + 1</text>

  <!-- 回边 1 -->
  <path d="M185,194 L150,194 L150,147 L166,147" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="175" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">下一个 x</text>

  <path d="M320,210 L320,224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="222" font-size="10" fill="#888" filter="url(#rough2)">遍历完</text>

  <!-- Loop 2 -->
  <rect x="170" y="228" width="300" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="245" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">② i 从 1 扫到 100</text>
  <path d="M320,254 L320,268" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,268 470,306 320,344 170,306" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="302" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-family="monospace" filter="url(#rough2)">cnt[i] &amp; 1 ?</text>
  <text x="320" y="318" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（i 出现奇数次？）</text>

  <!-- 是分支 -->
  <text x="152" y="298" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M170,306 L128,306" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="12" y="288" width="114" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="69" y="310" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">ans ← ans ∪ {i}</text>
  <path d="M69,288 L69,241 L166,241" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="69" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一个 i</text>

  <!-- 否分支（跳过 / 扫描结束） -->
  <text x="332" y="362" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M320,344 L320,376" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="185" y="380" width="270" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace" filter="url(#rough2)">return ans（天然升序）</text>
  <path d="M320,412 L320,424" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="285" y="428" width="70" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="445" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- 左侧注记：等价写法 -->
  <rect x="10" y="336" width="158" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="353" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">等价翻转版</text>
  <text x="89" y="368" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">on[x] = !on[x]</text>
  <text x="89" y="382" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">最后收集 on[i]=true 的 i</text>

  <!-- 右侧注记：否的含义 -->
  <rect x="474" y="336" width="156" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="552" y="353" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 = 偶数，跳过 i</text>
  <text x="552" y="368" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">i 超过 100 时</text>
  <text x="552" y="382" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">扫描自然结束 → 返回</text>

  <!-- 底部要点 -->
  <rect x="60" y="464" width="520" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="478" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 必须按编号 1→100 扫描输出，不能按 bulbs 的出现顺序</text>
  <text x="320" y="492" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">[10,30,20,10] 按出现顺序输出 [30,20] 就是错序</text>
</svg>
