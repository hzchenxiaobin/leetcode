<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 逐个有序对走查：points = [[3,1],[1,3],[1,1]]</text>

  <rect x="20" y="40" width="520" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="59" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A（左上）</text>
  <text x="176" y="59" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">B（右下）</text>
  <text x="290" y="59" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">矩形 / 线段</text>
  <text x="418" y="59" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">其它点入侵</text>
  <text x="505" y="59" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">计数</text>

  <g filter="url(#rough2)">
    <rect x="20" y="68" width="520" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="98" width="520" height="30" fill="#fce4ec" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="128" width="520" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="158" width="520" height="30" fill="#fce4ec" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="188" width="520" height="30" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="218" width="520" height="30" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="248" width="520" height="30" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
  </g>

  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="80" y="87" text-anchor="middle">(3,1)</text><text x="176" y="87" text-anchor="middle">(1,3)</text>
    <text x="290" y="87" text-anchor="middle">x 变小，方向反了</text><text x="418" y="87" text-anchor="middle">—</text>
    <text x="505" y="87" text-anchor="middle" fill="#b85450">✗</text>

    <text x="80" y="117" text-anchor="middle">(3,1)</text><text x="176" y="117" text-anchor="middle">(1,1)</text>
    <text x="290" y="117" text-anchor="middle">A 在 B 右侧</text><text x="418" y="117" text-anchor="middle">—</text>
    <text x="505" y="117" text-anchor="middle" fill="#b85450">✗</text>

    <text x="80" y="147" text-anchor="middle">(1,3)</text><text x="176" y="147" text-anchor="middle">(1,1)</text>
    <text x="290" y="147" text-anchor="middle">竖直线段 x = 1</text><text x="418" y="147" text-anchor="middle">无</text>
    <text x="505" y="147" text-anchor="middle" fill="#4a7a3a">✓ 1</text>

    <text x="80" y="177" text-anchor="middle">(1,3)</text><text x="176" y="177" text-anchor="middle">(3,1)</text>
    <text x="290" y="177" text-anchor="middle">整块矩形</text><text x="418" y="177" text-anchor="middle">(1,1) 在边界</text>
    <text x="505" y="177" text-anchor="middle" fill="#b85450">✗</text>

    <text x="80" y="207" text-anchor="middle">(1,1)</text><text x="176" y="207" text-anchor="middle">(3,1)</text>
    <text x="290" y="207" text-anchor="middle">水平线段 y = 1</text><text x="418" y="207" text-anchor="middle">无</text>
    <text x="505" y="207" text-anchor="middle" fill="#4a7a3a">✓ 2</text>

    <text x="80" y="237" text-anchor="middle">(1,1)</text><text x="176" y="237" text-anchor="middle">(1,3)</text>
    <text x="290" y="237" text-anchor="middle">A 在 B 下方</text><text x="418" y="237" text-anchor="middle">—</text>
    <text x="505" y="237" text-anchor="middle" fill="#b85450">✗</text>

    <text x="80" y="267" text-anchor="middle">(3,1)</text><text x="176" y="267" text-anchor="middle">(1,1)</text>
    <text x="290" y="267" text-anchor="middle">A 在 B 右侧</text><text x="418" y="267" text-anchor="middle">—</text>
    <text x="505" y="267" text-anchor="middle" fill="#b85450">✗</text>
  </g>

  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">答案为 2；两个合法对都是「退化矩形」（线段），题目明确允许</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 (1,3)→(3,1) 被判无效：(1,1) 落在矩形边界上，边界同样算「有人」</text>
</svg>
