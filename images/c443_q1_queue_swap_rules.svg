<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
  </defs>

  <rect width="760" height="408" fill="#fafafa"/>

  <text x="380" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交换规则：向前付费，向后免费</text>

  <!-- demo arc: paid jump from pos 6 to pos 3 -->
  <path d="M 663 96 C 590 30, 470 30, 392 90" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="528" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">付费 ¥1，从位置 6 直达位置 3（中间的人不动）</text>

  <!-- queue cells 0..6 -->
  <g filter="url(#rough2)"><rect x="55" y="64" width="88" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="150" y="64" width="88" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="245" y="64" width="88" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="340" y="64" width="88" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="435" y="64" width="88" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="530" y="64" width="88" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="625" y="64" width="88" height="78" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>

  <text x="99" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">位置 0</text>
  <text x="194" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">位置 1</text>
  <text x="289" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">位置 2</text>
  <text x="384" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">位置 3</text>
  <text x="479" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">位置 4</text>
  <text x="574" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">位置 5</text>
  <text x="669" y="80" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">位置 6</text>

  <g filter="url(#rough2)"><circle cx="99" cy="108" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="194" cy="108" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="289" cy="108" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="384" cy="108" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="479" cy="108" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="574" cy="108" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="669" cy="108" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>

  <text x="99" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="194" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="289" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="384" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="479" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="574" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="669" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">你</text>

  <text x="99" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥5</text>
  <text x="194" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥3</text>
  <text x="289" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥4</text>
  <text x="384" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">¥1</text>
  <text x="479" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥3</text>
  <text x="574" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">¥2</text>
  <text x="669" y="136" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">起点</text>

  <!-- forward: paid -->
  <text x="380" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">向前跳 = 付费 cost[i]，你直接落到他站的位置（可隔任意多人）</text>
  <path d="M 420 180 L 200 180" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- backward: free -->
  <text x="380" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">向后退 = 免费（对方在你后面，他顶到你身后的位置）</text>
  <path d="M 340 220 L 560 220" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- two explanation boxes -->
  <g filter="url(#rough2)"><rect x="40" y="248" width="330" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="55" y="272" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#rough2)">付费 = 传送：付 cost[i] 后你站到位置 i，</text>
  <text x="55" y="292" font-size="11" fill="#444" filter="url(#rough2)">中间编号更大的所有人原地不动，</text>
  <text x="55" y="310" font-size="11" fill="#444" filter="url(#rough2)">瞬间跨过整段队伍。</text>

  <g filter="url(#rough2)"><rect x="390" y="248" width="330" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="405" y="272" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">回程 = 白嫖：一旦站上位置 p，</text>
  <text x="405" y="292" font-size="11" fill="#444" filter="url(#rough2)">所有编号 &gt; p 的人都在你身后，</text>
  <text x="405" y="310" font-size="11" fill="#444" filter="url(#rough2)">想免费退到哪个位置都行。</text>

  <!-- bottom note -->
  <g filter="url(#rough2)"><rect x="40" y="336" width="680" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="60" y="360" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">关键前提：只有你在主动交换，其他人的位置只在与你互换时才改变</text>
  <text x="60" y="380" font-size="11" fill="#444" filter="url(#rough2)">—— 所以「付费对象原来站哪」永远是可推理的，这是下界证明的根基。</text>
</svg>
