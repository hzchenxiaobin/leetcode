<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">示例 1 演算：words = [able, area, echo, also]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">排序后 w = [able, also, area, echo]，按下标序嵌套枚举</text>

  <!-- 表头 -->
  <rect x="28" y="56" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="100" y="56" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="192" y="56" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="296" y="56" width="126" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="422" y="56" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">top</text>
  <text x="146" y="73" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">left（同首字母）</text>
  <text x="244" y="73" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">right（top 尾开头）</text>
  <text x="359" y="73" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">bottom（双卡首尾）</text>
  <text x="477" y="73" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">结果</text>

  <!-- 行 1 -->
  <rect x="28" y="82" width="72" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="82" width="92" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="82" width="104" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="296" y="82" width="126" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="422" y="82" width="110" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">able</text>
  <text x="146" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">also（'a' ✓）</text>
  <text x="244" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">echo（'e' ✓）</text>
  <text x="359" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">须 'o' 开头：无候选</text>
  <text x="477" y="104" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 剪掉</text>

  <!-- 行 2（✓） -->
  <rect x="28" y="118" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="100" y="118" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="192" y="118" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="296" y="118" width="126" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="422" y="118" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">able</text>
  <text x="146" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">area（'a' ✓）</text>
  <text x="244" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">echo（'e' ✓）</text>
  <text x="359" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">also：'a' ✓ 且尾 'o' ✓</text>
  <text x="477" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 收集</text>

  <!-- 行 3 -->
  <rect x="28" y="154" width="72" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="154" width="92" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="154" width="104" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="296" y="154" width="126" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="422" y="154" width="110" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">also</text>
  <text x="146" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">able / area</text>
  <text x="244" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">须 'o' 开头：无候选</text>
  <text x="359" y="176" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="477" y="176" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 剪掉</text>

  <!-- 行 4（✓） -->
  <rect x="28" y="190" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="100" y="190" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="192" y="190" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="296" y="190" width="126" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="422" y="190" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">area</text>
  <text x="146" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">able（'a' ✓）</text>
  <text x="244" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">also（'a' ✓）</text>
  <text x="359" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">echo：'e' ✓ 且尾 'o' ✓</text>
  <text x="477" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 收集</text>

  <!-- 行 5 -->
  <rect x="28" y="226" width="72" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="226" width="92" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="226" width="104" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="296" y="226" width="126" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="422" y="226" width="110" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">area</text>
  <text x="146" y="248" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">also（'a' ✓）</text>
  <text x="244" y="248" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">able（'a' ✓）</text>
  <text x="359" y="248" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">须 'o' 开头：无候选</text>
  <text x="477" y="248" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 剪掉</text>

  <!-- 行 6 -->
  <rect x="28" y="262" width="72" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="100" y="262" width="92" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="192" y="262" width="104" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="296" y="262" width="126" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="422" y="262" width="110" height="36" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">echo</text>
  <text x="146" y="284" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">须同 'e'：仅自身</text>
  <text x="244" y="284" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="359" y="284" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="477" y="284" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 剪掉</text>

  <!-- 结果框 -->
  <rect x="28" y="314" width="504" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出：[["able","area","echo","also"], ["area","able","also","echo"]]</text>
  <text x="280" y="357" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">恰好两个合法方块，且枚举顺序 = 字典序，无需再排序</text>

  <!-- 对照示例 2 -->
  <rect x="28" y="382" width="504" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">对照示例 2：code / cafe（'c' 开头）与 eden / edge（'e' 开头）首字母各自成对，</text>
  <text x="280" y="419" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">但链条推进到 bottom 时 w[l][3] == w[k][3] 永远配不齐尾字母 → 全部剪掉，返回 []</text>
</svg>
