    <rect x="166" y="708" width="46" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="212" y="708" width="46" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
