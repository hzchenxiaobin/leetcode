<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：从 0 出发逐条边检查（n = 6）</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">connections = [[0,1], [1,3], [2,3], [4,0], [4,5]]，按深度优先的访问顺序走查</text>

  <g filter="url(#rough2)">
    <rect x="60" y="62" width="600" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="60" y="98" width="600" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="60" y="136" width="600" height="38" fill="#f4f7f2" stroke="#8aa080" stroke-width="1.3"/>
    <rect x="60" y="174" width="600" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="60" y="212" width="600" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="60" y="250" width="600" height="38" fill="#f4f7f2" stroke="#8aa080" stroke-width="1.3"/>
  </g>

  <g font-size="10.5" fill="#3a4a66" text-anchor="middle" font-weight="bold">
    <text x="90" y="85" filter="url(#rough2)">步</text>
    <text x="157" y="85" filter="url(#rough2)">从 u</text>
    <text x="232" y="85" filter="url(#rough2)">到 v</text>
    <text x="320" y="85" filter="url(#rough2)">原方向</text>
    <text x="435" y="85" filter="url(#rough2)">相对 0 的方向</text>
    <text x="532" y="85" filter="url(#rough2)">w</text>
    <text x="610" y="85" filter="url(#rough2)">ans</text>
  </g>

  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="90" y="121" filter="url(#rough2)">1</text>
    <text x="157" y="121" filter="url(#rough2)">0</text>
    <text x="232" y="121" filter="url(#rough2)">1</text>
    <text x="320" y="121" filter="url(#rough2)">0→1</text>
    <text x="435" y="121" filter="url(#rough2)">背离 0</text>
    <text x="532" y="121" filter="url(#rough2)">1</text>
    <text x="610" y="121" fill="#b85450" filter="url(#rough2)">1</text>

    <text x="90" y="159" filter="url(#rough2)">2</text>
    <text x="157" y="159" filter="url(#rough2)">0</text>
    <text x="232" y="159" filter="url(#rough2)">4</text>
    <text x="320" y="159" filter="url(#rough2)">4→0</text>
    <text x="435" y="159" filter="url(#rough2)">指向 0</text>
    <text x="532" y="159" filter="url(#rough2)">0</text>
    <text x="610" y="159" filter="url(#rough2)">1</text>

    <text x="90" y="197" filter="url(#rough2)">3</text>
    <text x="157" y="197" filter="url(#rough2)">4</text>
    <text x="232" y="197" filter="url(#rough2)">5</text>
    <text x="320" y="197" filter="url(#rough2)">4→5</text>
    <text x="435" y="197" filter="url(#rough2)">背离 0</text>
    <text x="532" y="197" filter="url(#rough2)">1</text>
    <text x="610" y="197" fill="#b85450" filter="url(#rough2)">2</text>

    <text x="90" y="235" filter="url(#rough2)">4</text>
    <text x="157" y="235" filter="url(#rough2)">1</text>
    <text x="232" y="235" filter="url(#rough2)">3</text>
    <text x="320" y="235" filter="url(#rough2)">1→3</text>
    <text x="435" y="235" filter="url(#rough2)">背离 0</text>
    <text x="532" y="235" filter="url(#rough2)">1</text>
    <text x="610" y="235" fill="#b85450" filter="url(#rough2)">3</text>

    <text x="90" y="273" filter="url(#rough2)">5</text>
    <text x="157" y="273" filter="url(#rough2)">3</text>
    <text x="232" y="273" filter="url(#rough2)">2</text>
    <text x="320" y="273" filter="url(#rough2)">2→3</text>
    <text x="435" y="273" filter="url(#rough2)">指向 0</text>
    <text x="532" y="273" filter="url(#rough2)">0</text>
    <text x="610" y="273" filter="url(#rough2)">3</text>
  </g>

  <text x="70" y="308" font-size="9.5" fill="#b85450" filter="url(#rough2)">粉底 = w = 1，需要翻转</text>
  <text x="70" y="324" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">浅绿底 = w = 0，保持原方向</text>

  <rect x="220" y="300" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="236" y="320" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">5 次检查覆盖 n−1 = 5 条边，粉色行恰有 3 条</text>
  <text x="236" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">故最少翻转 3 条，与官方输出 ans = 3 一致；改完后 2→3→1→0、5→4→0 均可达 0</text>

  <text x="360" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：每条边只在「父 → 子」方向被检查一次，回头边（子 → 父）已由 vis 挡掉，不会重复计数</text>
</svg>
