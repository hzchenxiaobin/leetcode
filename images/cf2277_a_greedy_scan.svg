<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：v 从 0 往上扫，能过就 ans = v+1，第一个过不去就停</text>
  <path d="M 96 42 Q 380 49 664 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="62" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="89" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">S ← 0，v ← 0，ans ← 0</text>

  <rect x="90" y="130" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="157" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">S ← S + cnt[v]</text>

  <rect x="90" y="198" width="250" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="215" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">cnt[v] ≥ 1 且 S ≥ (v+1)·k ？</text>
  <text x="215" y="244" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">两条同时成立才算 v 可行</text>

  <rect x="90" y="288" width="250" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="315" text-anchor="middle" font-size="13.5" fill="#3c5e2e" filter="url(#rough2)">ans ← v+1，v ← v+1</text>

  <rect x="90" y="372" width="250" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="399" text-anchor="middle" font-size="13.5" fill="#a14340" filter="url(#rough2)">break，输出 ans</text>

  <path d="M 215 104 L 215 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 215 172 L 215 194" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 256 L 180 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="274" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 60 309 L 60 151 L 86 151" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 90 309 L 60 309" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="34" y="240" font-size="12" fill="#446688" filter="url(#rough2)">循环</text>

  <path d="M 340 227 L 400 227 L 400 393 L 344 393" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="356" y="216" font-size="12" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="420" y="62" width="300" height="352" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="570" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两个条件的来历</text>

  <text x="436" y="118" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">cnt[v] = 值恰好为 v 的元素个数</text>
  <text x="436" y="142" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">S = cnt[0] + cnt[1] + … + cnt[v]</text>

  <text x="436" y="178" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">① cnt[v] ≥ 1</text>
  <text x="436" y="200" font-size="12" fill="#8a6015" filter="url(#rough2)">组最大值要等于 v，就得有</text>
  <text x="436" y="220" font-size="12" fill="#8a6015" filter="url(#rough2)">一个真实的 v 去当组长</text>

  <text x="436" y="254" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② S ≥ (v+1)·k</text>
  <text x="436" y="276" font-size="12" fill="#8a6015" filter="url(#rough2)">最大值 0…v 的这 v+1 个组</text>
  <text x="436" y="296" font-size="12" fill="#8a6015" filter="url(#rough2)">共要 (v+1)·k 个 ≤ v 的元素，</text>
  <text x="436" y="316" font-size="12" fill="#8a6015" filter="url(#rough2)">而这些元素全部来自 ≤ v</text>

  <text x="436" y="352" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">两条同时成立 ⇔ 0…v 全可行</text>
  <text x="436" y="374" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">（充分性是 §5 引理 2 的贪心构造）</text>
  <text x="436" y="396" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第一个失败处恰是答案 v</text>
</svg>
