<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 全流程走查</text>
  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">grid = [[5,3,7],[8,2,6]]，limits = [2,2]，k = 3</text>

  <!-- 第 0 行 -->
  <text x="40" y="58" font-size="10.5" fill="#55677d" filter="url(#rough2)">第 0 行</text>
  <rect x="40" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="84" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="128" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <path d="M 174 79 L 202 79" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="188" y="72" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">降序</text>
  <rect x="208" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="252" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="296" y="64" width="40" height="30" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="360" y="74" font-size="10" fill="#b85450" filter="url(#rough2)">limits[0] = 2</text>
  <text x="360" y="90" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取 {7, 5}，3 被裁掉</text>

  <!-- 第 1 行 -->
  <text x="40" y="122" font-size="10.5" fill="#55677d" filter="url(#rough2)">第 1 行</text>
  <rect x="40" y="128" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="84" y="128" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="128" y="128" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <path d="M 174 143 L 202 143" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="188" y="136" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">降序</text>
  <rect x="208" y="128" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="148" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="252" y="128" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="148" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="296" y="128" width="40" height="30" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="148" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="360" y="138" font-size="10" fill="#b85450" filter="url(#rough2)">limits[1] = 2</text>
  <text x="360" y="154" font-size="10" fill="#4a7a3a" filter="url(#rough2)">取 {8, 6}，2 被裁掉</text>

  <!-- 候选池 -->
  <text x="40" y="192" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">候选池</text>
  <rect x="40" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="84" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="128" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="172" y="198" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <path d="M 222 213 L 246 213" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="234" y="206" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">降序</text>
  <rect x="252" y="198" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="296" y="198" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="340" y="198" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="384" y="198" width="40" height="30" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="218" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <text x="436" y="216" font-size="10" fill="#b85450" filter="url(#rough2)">k = 3</text>

  <!-- 圈选前 k -->
  <rect x="248" y="194" width="136" height="42" fill="none" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <path d="M 316 240 L 316 258" stroke="#b85450" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="190" y="262" width="250" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="315" y="281" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24">ans = 8 + 7 + 6 = 21 ✓</text>
    <text x="315" y="297" text-anchor="middle" font-size="9.5" fill="#557a4a">取池内前 k = 3 个，5 落选</text>
  </g>

  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">灰色虚线格 = 行内被裁掉的（3、2）与池内落选的（5）</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">它们在任何最优解中都不出现：行内与池内总有更大的替代者</text>
</svg>
