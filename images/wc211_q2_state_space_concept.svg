<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#fdfcf7"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：操作序列可以无限长，不同的字符串只有有限个</text>
  <path d="M 175 36 Q 310 44 445 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="310" y="57" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">（s = "5525", a = 9, b = 2 的局部状态图）</text>

  <!-- node: 5525 -->
  <rect x="272" y="62" width="76" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#r)"/>
  <text x="310" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#r)">5525</text>

  <!-- node: 5424 -->
  <rect x="112" y="192" width="76" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="150" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#r)">5424</text>

  <!-- node: 2555 -->
  <rect x="432" y="192" width="76" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="470" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#r)">2555</text>

  <!-- node: 2454 (converged) -->
  <rect x="272" y="318" width="76" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#r)"/>
  <text x="310" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07d20" filter="url(#r)">2454</text>

  <!-- edges: two ops from 5525 -->
  <path d="M 288 100 C 250 130 200 160 168 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="150" y="148" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#r)">① 累加：奇数位 +9</text>
  <path d="M 332 100 C 370 130 420 160 452 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="472" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">② 轮转：右移 b=2 位</text>

  <!-- edges: converge to 2454 -->
  <path d="M 168 230 C 200 265 240 295 276 318" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="182" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">② 轮转</text>
  <path d="M 432 230 C 400 265 360 295 324 318" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="438" y="288" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#r)">① 累加</text>

  <!-- convergence annotation -->
  <text x="366" y="332" font-size="12" font-weight="bold" fill="#b07d20" filter="url(#r)">殊途同归！</text>
  <text x="366" y="348" font-size="10.5" fill="#d6a040" filter="url(#r)">两条路径到达同一串 → 必须 visited 去重</text>

  <!-- dashed cycle: rotate back -->
  <path d="M 508 210 L 560 210 L 560 80 L 354 80" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arrGray)" filter="url(#r)"/>
  <text x="468" y="95" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">再轮转 1 次 → 回到 5525（周期 n/gcd(n,b) = 2）</text>

  <!-- dashed cycle: add back -->
  <path d="M 112 210 L 60 210 L 60 80 L 266 80" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arrGray)" filter="url(#r)"/>
  <text x="150" y="95" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">累加 10 次 → 回到 5525（周期 10/gcd(a,10)）</text>

  <!-- bottom summary -->
  <rect x="40" y="384" width="540" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#r)"/>
  <text x="310" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">把「枚举无限长的操作序列」换成「枚举有限个可达字符串」</text>
  <text x="310" y="422" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#r)">偏移 ≤ n 种 × 增量 ≤ 10 种（b 为奇数时再乘 10）→ 至多 10⁴ 个状态，BFS + visited 全遍历取最小</text>
</svg>
