<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心模型：把括号串压成「括号群」数组 c</text>
  <path d="M 130 42 Q 380 49 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="64" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">cᵢ = 第 i 个右括号左边紧挨着的左括号个数（左边是右括号就记 0）</text>

  <text x="112" y="118" font-size="15" fill="#2f4a66" filter="url(#rough2)">s =</text>

  <rect x="140" y="96" width="40" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="122" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">(</text>
  <rect x="186" y="96" width="40" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206" y="122" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">(</text>
  <rect x="232" y="96" width="40" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="252" y="122" text-anchor="middle" font-size="18" fill="#8a3a36" filter="url(#rough2)">)</text>
  <rect x="278" y="96" width="40" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="122" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">(</text>
  <rect x="324" y="96" width="40" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="122" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">(</text>
  <rect x="370" y="96" width="40" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="122" text-anchor="middle" font-size="18" fill="#8a3a36" filter="url(#rough2)">)</text>
  <rect x="416" y="96" width="40" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="436" y="122" text-anchor="middle" font-size="18" fill="#8a3a36" filter="url(#rough2)">)</text>
  <rect x="462" y="96" width="40" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="482" y="122" text-anchor="middle" font-size="18" fill="#8a3a36" filter="url(#rough2)">)</text>

  <circle cx="252" cy="78" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">2</text>
  <circle cx="390" cy="78" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">2</text>
  <circle cx="436" cy="78" r="12" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="436" y="83" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <circle cx="482" cy="78" r="12" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="83" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">0</text>

  <text x="522" y="120" font-size="12" fill="#8a6a20" filter="url(#rough2)">分数 = max cᵢ = 2</text>
  <text x="522" y="138" font-size="12" fill="#8a6a20" filter="url(#rough2)">Σcᵢ = 4 = n/2 = m（守恒）</text>

  <path d="M 380 152 L 380 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="170" font-size="11" fill="#66788c" filter="url(#rough2)">逐个右括号抄下来</text>

  <rect x="280" y="186" width="42" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="301" y="211" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="330" y="186" width="42" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="351" y="211" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="380" y="186" width="42" height="36" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="401" y="211" text-anchor="middle" font-size="16" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <rect x="430" y="186" width="42" height="36" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="451" y="211" text-anchor="middle" font-size="16" fill="#8a8a8a" filter="url(#rough2)">0</text>

  <text x="301" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c₁</text>
  <text x="351" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c₂</text>
  <text x="401" y="240" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">c₃</text>
  <text x="451" y="240" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">c₄</text>

  <rect x="40" y="256" width="680" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="278" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">一次操作（挑第 j 个右括号，要求 cⱼ ≥ 1）：</text>
  <text x="56" y="298" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">① 合并 cⱼ 与 cⱼ₊₁：cⱼ ← cⱼ + cⱼ₊₁ − 1，后面的堆整体左移一格，末尾补 0；</text>
  <text x="56" y="318" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">② 首堆 c₁ += 1：新加的 '(' 顶在最前面，与原来的第一堆连成一片。</text>

  <text x="56" y="362" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">例：c = [2,2,0,0]，取 j = 1 →</text>
  <rect x="300" y="344" width="34" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="364" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="340" y="344" width="34" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="364" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="380" y="344" width="34" height="28" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="397" y="364" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <rect x="420" y="344" width="34" height="28" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="437" y="364" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <path d="M 462 358 L 492 358" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500" y="344" width="34" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="517" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">4</text>
  <rect x="540" y="344" width="34" height="28" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="557" y="364" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <rect x="580" y="344" width="34" height="28" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="597" y="364" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <rect x="620" y="344" width="34" height="28" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="637" y="364" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <text x="668" y="364" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">分数 2→4</text>

  <text x="380" y="404" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">注意 j = 1 时合并的 −1 会被 ② 的 +1 抵消，等于「首堆无损吞并右邻居」</text>
</svg>
