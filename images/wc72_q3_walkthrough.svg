<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" filter="url(#rough2)">示例 1 演算：n = 4, k = 1 ⇒ 最多 2 条边</text>
  <text x="350" y="51" text-anchor="middle" font-size="10.5" fill="#888" font-weight="normal" filter="url(#rough2)">单元格 = 该轮结束时从城市 0 到该城市的最小花费（∞ 表示不可达）</text>
  <rect x="120" y="78" width="106" height="36" rx="6" fill="#eef2f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173.0" y="101" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">城市</text>
  <rect x="226" y="78" width="116" height="36" rx="6" fill="#eef2f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284.0" y="101" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 0 轮 · 0 条边</text>
  <rect x="342" y="78" width="116" height="36" rx="6" fill="#eef2f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400.0" y="101" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 1 轮 · ≤1 条边</text>
  <rect x="458" y="78" width="116" height="36" rx="6" fill="#eef2f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516.0" y="101" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 2 轮 · ≤2 条边</text>
  <rect x="120" y="114" width="106" height="42" rx="6" fill="#fafafa" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="173.0" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">城市 0</text>
  <rect x="226" y="114" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="284.0" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="342" y="114" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400.0" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="458" y="114" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="516.0" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="120" y="156" width="106" height="42" rx="6" fill="#fafafa" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="173.0" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">城市 1</text>
  <rect x="226" y="156" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="284.0" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">∞</text>
  <rect x="342" y="156" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400.0" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">100</text>
  <rect x="458" y="156" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="516.0" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">100</text>
  <rect x="120" y="198" width="106" height="42" rx="6" fill="#fafafa" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="173.0" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">城市 2</text>
  <rect x="226" y="198" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="284.0" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">∞</text>
  <rect x="342" y="198" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400.0" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">∞</text>
  <rect x="458" y="198" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="516.0" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">200</text>
  <rect x="120" y="240" width="106" height="42" rx="6" fill="#fafafa" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="173.0" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">城市 3</text>
  <rect x="226" y="240" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="284.0" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">∞</text>
  <rect x="342" y="240" width="116" height="42" rx="6" fill="#ffffff" stroke="#99a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400.0" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">∞</text>
  <rect x="458" y="240" width="116" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="516.0" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">700</text>
  <text x="350" y="308" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" filter="url(#rough2)">第 2 轮：1→2 得 200，1→3 得 700；2→3 的 200 属于第 3 轮，不允许</text>
  <rect x="60" y="324" width="580" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="345" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="normal" filter="url(#rough2)">答案 = 700（经 0→1→3，1 站）；0→1→2→3 仅需 400 但要 2 站，越界</text>
  <text x="350" y="364" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">每轮只允许在上一轮结果上再走一条边 ⇒ 层数天然等于边数上限</text>
</svg>
