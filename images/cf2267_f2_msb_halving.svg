<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两轮变换必砍掉一位最高位</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">所有数都小于 2^k 时，按第 k−1 位把数组劈成两半</text>

  <rect x="60" y="74" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">区间 [0, 2^k)　—— 全部 n 个数都在这里</text>

  <rect x="60" y="126" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">第 k−1 位 = 0：m−x 个</text>
  <text x="180" y="172" text-anchor="middle" font-size="10.5" fill="#557" filter="url(#rough2)">都在 [0, 2^(k−1)) 里</text>

  <rect x="300" y="126" width="240" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="150" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">第 k−1 位 = 1：x 个</text>
  <text x="420" y="172" text-anchor="middle" font-size="10.5" fill="#557" filter="url(#rough2)">都在 [2^(k−1), 2^k) 里</text>

  <path d="M 300 108 L 300 122" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="206" width="230" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="228" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">组内配对：C(m−x, 2) 对</text>
  <text x="175" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">异或 &lt; 2^(k−1)</text>

  <rect x="310" y="206" width="230" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="228" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">组内配对：C(x, 2) 对</text>
  <text x="425" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">异或同样 &lt; 2^(k−1)</text>

  <rect x="60" y="278" width="480" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">同类配对总数 C(x,2) + C(m−x,2) ≥ m − 1　（n ≥ 5，x 取 ⌊m/2⌋ 时最小）</text>
  <text x="300" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">所以变换后的 m 个数里，至多 1 个还带第 k−1 位</text>

  <path d="M 300 328 L 300 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="348" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">再做一次变换：C(m−1, 2) ≥ m 对同侧配对 ⇒ 全部 &lt; 2^(k−1)</text>
  <text x="300" y="392" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">位宽每 2 步至少降 1 ⇒ 至多 60 步全变成 0（实测 30 位数据 ≤ 9 步）</text>
</svg>
