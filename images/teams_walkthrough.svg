<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="490" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">示例演算：逐个中位 j 统计四量，累加贡献</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组 -->
  <g filter="url(#sk)"><rect x="96" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="120" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="152" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="176" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="208" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="232" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="264" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="288" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="320" y="56" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="344" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="410" y="72" font-size="10.5" fill="#888">rating = [2,5,3,4,1]，n = 5</text>

  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="120" y="103">下标 0</text>
    <text x="176" y="103">下标 1</text>
    <text x="232" y="103">下标 2</text>
    <text x="288" y="103">下标 3</text>
    <text x="344" y="103">下标 4</text>
  </g>
  <g filter="url(#sk)"><circle cx="176" cy="115" r="3.5" fill="#c98a2b"/></g>
  <g filter="url(#sk)"><circle cx="232" cy="115" r="3.5" fill="#c98a2b"/></g>
  <g filter="url(#sk)"><circle cx="288" cy="115" r="3.5" fill="#c98a2b"/></g>
  <text x="396" y="119" font-size="10.5" fill="#c98a2b">● = 可做中位（下标 1、2、3）</text>

  <!-- 演算表 -->
  <g filter="url(#sk)"><rect x="70" y="126" width="46" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="126" width="64" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="180" y="126" width="56" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="236" y="126" width="56" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="292" y="126" width="56" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="348" y="126" width="56" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="404" y="126" width="80" height="26" rx="3" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2"/></g>
  <g font-size="11.5" font-weight="bold" fill="#444" text-anchor="middle">
    <text x="93" y="143">j</text>
    <text x="148" y="143">rating[j]</text>
    <text x="208" y="143">左小</text>
    <text x="264" y="143">左大</text>
    <text x="320" y="143">右大</text>
    <text x="376" y="143">右小</text>
    <text x="444" y="143">贡献</text>
  </g>

  <!-- 行 1：j=1 -->
  <g filter="url(#sk)"><rect x="70" y="152" width="46" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="152" width="64" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="180" y="152" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="236" y="152" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="292" y="152" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="348" y="152" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="404" y="152" width="80" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="93" y="173">1</text>
    <text x="148" y="173">5</text>
    <text x="208" y="173">1</text>
    <text x="264" y="173">0</text>
    <text x="320" y="173">0</text>
    <text x="376" y="173">3</text>
    <text x="444" y="173">0</text>
  </g>
  <text x="496" y="168" font-size="10.5" fill="#8a9ab0">5 是全局最大</text>
  <text x="496" y="182" font-size="10.5" fill="#8a9ab0">两侧配不上对</text>

  <!-- 行 2：j=2（高亮） -->
  <g filter="url(#sk)"><rect x="70" y="184" width="46" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="116" y="184" width="64" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="180" y="184" width="56" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="236" y="184" width="56" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="292" y="184" width="56" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="348" y="184" width="56" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="404" y="184" width="80" height="32" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.4"/></g>
  <g font-size="12.5" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="93" y="205">2</text>
    <text x="148" y="205">3</text>
    <text x="208" y="205">1</text>
    <text x="264" y="205">1</text>
    <text x="320" y="205">1</text>
    <text x="376" y="205">1</text>
    <text x="444" y="205" font-size="13.5">2</text>
  </g>
  <text x="496" y="200" font-size="10.5" font-weight="bold" fill="#2e6e2e">递增 (2,3,4) ↑</text>
  <text x="496" y="214" font-size="10.5" font-weight="bold" fill="#b85450">递减 (5,3,1) ↓</text>

  <!-- 行 3：j=3 -->
  <g filter="url(#sk)"><rect x="70" y="216" width="46" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="116" y="216" width="64" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="180" y="216" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="236" y="216" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="292" y="216" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="348" y="216" width="56" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="404" y="216" width="80" height="32" rx="3" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.2"/></g>
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="93" y="237">3</text>
    <text x="148" y="237">4</text>
    <text x="208" y="237">2</text>
    <text x="264" y="237">1</text>
    <text x="320" y="237">0</text>
    <text x="376" y="237">1</text>
    <text x="444" y="237">1</text>
  </g>
  <text x="496" y="232" font-size="10.5" font-weight="bold" fill="#b85450">递减 (5,4,1) ↓</text>
  <text x="496" y="246" font-size="10.5" fill="#8a9ab0">递增 2×0 = 0</text>

  <!-- 求和 -->
  <g filter="url(#sk)"><ellipse cx="320" cy="283" rx="112" ry="16" fill="none" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="288" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b85450">ans = 0 + 2 + 1 = 3</text>

  <!-- 三支队伍 -->
  <g filter="url(#sk)"><rect x="70" y="312" width="160" height="46" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="150" y="334" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">(2, 3, 4)</text>
  <text x="150" y="350" text-anchor="middle" font-size="10.5" fill="#2e6e2e">严格递增 ↑（j = 2 供出）</text>

  <g filter="url(#sk)"><rect x="245" y="312" width="160" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="325" y="334" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">(5, 3, 1)</text>
  <text x="325" y="350" text-anchor="middle" font-size="10.5" fill="#b85450">严格递减 ↓（j = 2 供出）</text>

  <g filter="url(#sk)"><rect x="420" y="312" width="160" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="500" y="334" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">(5, 4, 1)</text>
  <text x="500" y="350" text-anchor="middle" font-size="10.5" fill="#b85450">严格递减 ↓（j = 3 供出）</text>

  <!-- 自检框 -->
  <g filter="url(#sk)"><rect x="40" y="376" width="560" height="96" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="402" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 自检守恒式（元素互异的红利）：左小 + 左大 = j，右大 + 右小 = n−1−j</text>
  <text x="320" y="426" text-anchor="middle" font-size="12.5" fill="#5a4a20">逐行验证：j=2 → 1+1=2 ✓；j=3 → 2+1=3 ✓、0+1=1 = n−1−3 ✓</text>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">守恒式一旦破裂 ⟹ 漏判「等于」或扫描区间写错，先查这里</text>
</svg>
