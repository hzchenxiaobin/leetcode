<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：升序加边，盯住 comp 降到 k = 2</text>
  <path d="M 160 40 Q 330 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表格外框 -->
  <rect x="40" y="54" width="560" height="244" rx="6" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4" filter="url(#sk)"/>
  <!-- 列分隔 -->
  <line x1="95" y1="56" x2="95" y2="296" stroke="#b9b9b0" stroke-width="1" filter="url(#sk)"/>
  <line x1="205" y1="56" x2="205" y2="296" stroke="#b9b9b0" stroke-width="1" filter="url(#sk)"/>
  <line x1="265" y1="56" x2="265" y2="296" stroke="#b9b9b0" stroke-width="1" filter="url(#sk)"/>
  <line x1="480" y1="56" x2="480" y2="296" stroke="#b9b9b0" stroke-width="1" filter="url(#sk)"/>
  <!-- 行分隔 -->
  <line x1="42" y1="88" x2="598" y2="88" stroke="#8a8a80" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="42" y1="130" x2="598" y2="130" stroke="#c9c9c0" stroke-width="1" filter="url(#sk)"/>
  <line x1="42" y1="172" x2="598" y2="172" stroke="#c9c9c0" stroke-width="1" filter="url(#sk)"/>
  <line x1="42" y1="214" x2="598" y2="214" stroke="#c9c9c0" stroke-width="1" filter="url(#sk)"/>
  <line x1="42" y1="256" x2="598" y2="256" stroke="#c9c9c0" stroke-width="1" filter="url(#sk)"/>

  <!-- 表头 -->
  <text x="67" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">步骤</text>
  <text x="150" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">加入边（权）</text>
  <text x="235" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">comp</text>
  <text x="372" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">分量划分</text>
  <text x="540" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">comp ≤ k ?</text>

  <!-- 行 0：初始 -->
  <text x="67" y="113" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">初始</text>
  <text x="150" y="113" text-anchor="middle" font-size="12" fill="#555" font-family="monospace" filter="url(#sk)">—</text>
  <text x="235" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">5</text>
  <text x="372" y="113" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace" filter="url(#sk)">{0} {1} {2} {3} {4}</text>
  <text x="540" y="113" text-anchor="middle" font-size="12" fill="#a04040" filter="url(#sk)">5 &gt; 2 ✗</text>

  <!-- 行 1 -->
  <text x="67" y="155" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">1</text>
  <text x="150" y="155" text-anchor="middle" font-size="12" fill="#555" font-family="monospace" filter="url(#sk)">(1,3) w=2</text>
  <text x="235" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="372" y="155" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace" filter="url(#sk)">{1,3} {0} {2} {4}</text>
  <text x="540" y="155" text-anchor="middle" font-size="12" fill="#a04040" filter="url(#sk)">4 &gt; 2 ✗</text>

  <!-- 行 2 -->
  <text x="67" y="197" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">2</text>
  <text x="150" y="197" text-anchor="middle" font-size="12" fill="#555" font-family="monospace" filter="url(#sk)">(1,2) w=3</text>
  <text x="235" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <text x="372" y="197" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace" filter="url(#sk)">{1,2,3} {0} {4}</text>
  <text x="540" y="197" text-anchor="middle" font-size="12" fill="#a04040" filter="url(#sk)">3 &gt; 2 ✗</text>

  <!-- 行 3：命中（高亮） -->
  <rect x="42" y="215" width="556" height="39" fill="#eaf6ee" opacity="0.8"/>
  <text x="67" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <text x="150" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">(0,1) w=4</text>
  <text x="235" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="372" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">{0,1,2,3} {4}</text>
  <text x="540" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2 ≤ 2 ✓</text>
  <text x="540" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 4</text>

  <!-- 行 4：不再处理 -->
  <rect x="42" y="257" width="556" height="39" fill="none" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="67" y="281" text-anchor="middle" font-size="12" fill="#8a8a80" filter="url(#sk)">—</text>
  <text x="150" y="281" text-anchor="middle" font-size="12" fill="#8a8a80" font-family="monospace" filter="url(#sk)">(3,4) w=6</text>
  <text x="235" y="281" text-anchor="middle" font-size="12" fill="#8a8a80" filter="url(#sk)">—</text>
  <text x="372" y="281" text-anchor="middle" font-size="11" fill="#8a8a80" filter="url(#sk)">无需处理，答案已出</text>
  <text x="540" y="281" text-anchor="middle" font-size="12" fill="#8a8a80" filter="url(#sk)">—</text>

  <!-- 底注 -->
  <rect x="75" y="318" width="510" height="62" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">分量 {0,1,2,3} 成本 = 内部最大边权 4；分量 {4} 无边，成本 0</text>
  <text x="330" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">最大成本 = max(4, 0) = 4 ✓（升序扫描在第 3 步停机）</text>
</svg>
