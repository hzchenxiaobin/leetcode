<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">W = A + B 的「洋葱剥皮」结构</text>

  <!-- s 串格子 abcde -->
  <text x="34" y="48" font-size="12" fill="#446688" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="62" y="52" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="94" y="52" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="52" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="52" width="30" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="190" y="52" width="30" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <text x="77" y="71" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="109" y="71" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="141" y="71" text-anchor="middle" font-size="13" fill="#333">c</text>
    <text x="173" y="71" text-anchor="middle" font-size="13" fill="#aaa">d</text>
    <text x="205" y="71" text-anchor="middle" font-size="13" fill="#aaa">e</text>
    <!-- A 高亮括线 -->
    <path d="M62,44 L62,38 L156,38 L156,44" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="109" y="34" text-anchor="middle" font-size="12" fill="#b85450">A ⊆ s</text>
  </g>

  <text x="232" y="71" font-size="16" fill="#333" filter="url(#rough2)">+</text>

  <!-- t 串格子 ecdba -->
  <text x="256" y="48" font-size="12" fill="#4a7a3a" filter="url(#rough2)">t =</text>
  <g filter="url(#rough2)">
    <rect x="284" y="52" width="30" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="316" y="52" width="30" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="348" y="52" width="30" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="380" y="52" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="412" y="52" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="299" y="71" text-anchor="middle" font-size="13" fill="#aaa">e</text>
    <text x="331" y="71" text-anchor="middle" font-size="13" fill="#aaa">c</text>
    <text x="363" y="71" text-anchor="middle" font-size="13" fill="#aaa">d</text>
    <text x="395" y="71" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="427" y="71" text-anchor="middle" font-size="13" fill="#333">a</text>
    <path d="M380,44 L380,38 L442,38 L442,44" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="411" y="34" text-anchor="middle" font-size="12" fill="#4a7a3a">B ⊆ t</text>
  </g>

  <text x="456" y="71" font-size="13" fill="#333" filter="url(#rough2)">→ W</text>

  <!-- W 格子 abcba -->
  <g filter="url(#rough2)">
    <rect x="130" y="130" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="170" y="130" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="210" y="130" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="250" y="130" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="290" y="130" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="150" y="153" text-anchor="middle" font-size="14" fill="#333">a</text>
    <text x="190" y="153" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="230" y="153" text-anchor="middle" font-size="14" fill="#333">c</text>
    <text x="270" y="153" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="310" y="153" text-anchor="middle" font-size="14" fill="#333">a</text>
    <!-- A | B 分界虚线 -->
    <path d="M250,124 L250,172" stroke="#999" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  </g>

  <!-- 剥皮配对弧线 -->
  <path d="M150,126 Q230,64 310,126" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M190,128 Q230,92 270,128" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="330" y="92" font-size="12" fill="#b85450" filter="url(#rough2)">第 1 对：W 首 = s[0]，W 尾 = t[4]</text>
  <text x="330" y="108" font-size="12" fill="#b85450" filter="url(#rough2)">相等 → 剥掉这层皮 +2</text>
  <text x="40" y="128" font-size="12" fill="#d6a040" filter="url(#rough2)">第 2 对 → 再剥 +2</text>

  <text x="230" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">剥完两对，剩下核 P = “c”（单侧回文）</text>

  <!-- 底部两个说明框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="212" width="235" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="137" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">核在 s 侧（剥到 B 空）</text>
    <text x="137" y="256" text-anchor="middle" font-size="12" fill="#333">核 = s 中以 i 开头的最长回文</text>
    <text x="137" y="276" text-anchor="middle" font-size="12" fill="#333">长度记作 p[i]</text>

    <rect x="275" y="212" width="235" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="392" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">核在 t 侧（剥到 A 空）</text>
    <text x="392" y="256" text-anchor="middle" font-size="12" fill="#333">核 = t 中以 j 结尾的最长回文</text>
    <text x="392" y="276" text-anchor="middle" font-size="12" fill="#333">长度记作 q[j]</text>
  </g>

  <!-- 总结条 -->
  <g filter="url(#rough2)">
    <rect x="20" y="310" width="490" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="265" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">W = k 对镜像翼 + 单侧回文核，|W| = 2k + |核|</text>
    <text x="265" y="362" text-anchor="middle" font-size="12" fill="#666">DP 把「同一锚点逐深度结算」折叠成 dp[i][j] = 2 + dp[i+1][j−1]</text>
  </g>
</svg>
