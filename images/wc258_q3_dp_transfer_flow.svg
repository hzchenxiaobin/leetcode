<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="118" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">dp[mask]：只对最低位 i 与最高位 j 做端点决策</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="24" y="62" width="592" height="252" rx="12" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
    <text x="320" y="82" text-anchor="middle" font-size="11" fill="#777777" font-weight="bold">阶段一：对每个 mask 递推 dp[mask]（转移目标严格更小 → 按数值递增即无环）</text>
  <g filter="url(#sk)">
    <rect x="225" y="96" width="190" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
    <text x="320" y="114" text-anchor="middle" font-size="11.5" fill="#2b5b8a">i = mask 的最低位 1</text>
    <text x="320" y="130" text-anchor="middle" font-size="11.5" fill="#2b5b8a">j = mask 的最高位 1</text>
  <path d="M 320 136 L 320 143" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <polygon points="320,146 402,172 320,198 238,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
    <text x="320" y="168" text-anchor="middle" font-size="11.5" fill="#555555" font-weight="bold">i == j ?</text>
    <text x="320" y="183" text-anchor="middle" font-size="9.5" fill="#999999">（mask 只有一个 1 位）</text>
  <path d="M 402 172 L 446 172" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="422" y="164" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="450" y="152" width="164" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
    <text x="532" y="170" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">dp[mask] = 1</text>
    <text x="532" y="185" text-anchor="middle" font-size="9.5" fill="#87663a">单字符必回文</text>
  <path d="M 320 198 L 320 210" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="330" y="209" text-anchor="middle" font-size="10.5" fill="#999999">否</text>
  <g filter="url(#sk)">
    <polygon points="320,214 410,258 320,302 230,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
    <text x="320" y="252" text-anchor="middle" font-size="11.5" fill="#555555" font-weight="bold">s[i] == s[j] ?</text>
    <text x="320" y="267" text-anchor="middle" font-size="9.5" fill="#999999">两端字符相同吗？</text>
  <path d="M 410 258 L 446 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="424" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="450" y="234" width="178" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
    <text x="539" y="254" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">dp[mask] = dp[去 i,j] + 2</text>
    <text x="539" y="270" text-anchor="middle" font-size="9.5" fill="#4a7a3a">两端相同 → 配成回文外壳</text>
  <path d="M 230 258 L 216 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="224" y="250" text-anchor="middle" font-size="10.5" fill="#999999" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="32" y="234" width="184" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
    <text x="124" y="254" text-anchor="middle" font-size="10.5" fill="#a04040" font-weight="bold">dp = max(dp[去 i], dp[去 j])</text>
    <text x="124" y="270" text-anchor="middle" font-size="9.5" fill="#b85450">两端不同 → 弃掉一端</text>
  <path d="M 320 314 L 320 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="140" y="334" width="360" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
    <text x="320" y="353" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">阶段二：ans = max dp[m] × dp[FULL ⊕ m]</text>
    <text x="320" y="370" text-anchor="middle" font-size="10" fill="#87663a">枚举全部 2^n 个划分 m —— dp[补集] 已聚合「剩余位置的最优伙伴」</text>
  <g filter="url(#sk)">
    <rect x="24" y="394" width="592" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
    <text x="320" y="415" text-anchor="middle" font-size="11" fill="#7a5415">n = 12：递推 4096 步 + 划分枚举 4096 步 ≈ 8×10^3 次操作，比 O(3^n) ≈ 5.3×10^5 快约 65 倍</text>
</svg>
