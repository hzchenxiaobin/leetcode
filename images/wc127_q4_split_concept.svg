<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">前序：根的左子树连续在前，右子树连续在后</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">preorder = [8,5,1,7,10,12]</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="60" y="72" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="95.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="126" y="72" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="156.0" y="95.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="192" y="72" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="222.0" y="95.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="72" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="288.0" y="95.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="324" y="72" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="354.0" y="95.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="390" y="72" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420.0" y="95.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">12</text>
  <path d="M 60.0 120.0 L 60.0 132.0 L 186.0 132.0 L 186.0 120.0" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123.0" y="150.0" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">左子树（都 &lt; 8）</text>
  <path d="M 246.0 120.0 L 246.0 132.0 L 456.0 132.0 L 456.0 120.0" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="351.0" y="150.0" font-size="11" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">右子树（都 &gt; 8）</text>
  <text x="62.0" y="178.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">根</text>
  <path d="M 75.0 162.0 L 90.0 116.0" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="30.0" y="208.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">对应 BST：</text>
  <path d="M 150.0 236.0 L 90.0 280.0" fill="none" stroke="#78909c" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 150.0 236.0 L 210.0 280.0" fill="none" stroke="#78909c" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 90.0 280.0 L 56.0 324.0" fill="none" stroke="#78909c" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 90.0 280.0 L 124.0 324.0" fill="none" stroke="#78909c" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 210.0 280.0 L 226.0 324.0" fill="none" stroke="#78909c" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="130" y="220" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="150.0" y="240.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="70" y="264" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="90.0" y="284.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="190" y="264" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="210.0" y="284.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="36" y="308" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="56.0" y="328.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="308" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="124.0" y="328.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="206" y="308" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="226.0" y="328.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="290.0" y="236.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">建树顺序就是前序顺序：</text>
  <text x="290.0" y="256.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">8 → 5 → 1 → 7 → 10 → 12</text>
  <text x="290.0" y="280.0" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">每次只判断「是否超过当前上界」</text>
  <rect x="30" y="344" width="520" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="365.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">上界递归：build(bound) 顺序消费数组，O(n) 建树</text>
</svg>
