<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每条边是一个「时间窗」：只在 [start, end] 内可通行</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">早到就等到 start，迟到（t &gt; end）就永远错过</text>
  <path d="M 70 150 L 550 150" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="70" y="176" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">t = 0</text>
  <text x="550" y="176" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">时间</text>
  <rect x="180" y="112" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265.0" y="133.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">可用区间 [start, end]</text>
  <path d="M 180 112 L 180 150" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 350 112 L 350 150" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="120" cy="150" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="196" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">到达 u 时 t 太早</text>
  <path d="M 120 168 L 176 100" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="210" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">t &lt; start：原地等到 start 再走，到达时间 = start + 1</text>
  <text x="250" y="234" font-size="10.5" fill="#446688" text-anchor="start" filter="url(#rough2)">start &lt;= t &lt;= end：立即通行，到达时间 = t + 1</text>
  <text x="250" y="258" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">t &gt; end：这条边已经不可用，只能换路</text>
  <rect x="40" y="282" width="520" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="303.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">所有边耗时都是 1，且可以在节点无限等待 -&gt; 问题满足「最早到达」的 Dijkstra 语义</text>
  <text x="300.0" y="323.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">按 dist 从小到大出堆，第一次弹出 n-1 就是答案</text>
</svg>
