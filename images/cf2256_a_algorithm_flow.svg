<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次排序 + 两个候选 + 取最小</text>
  <path d="M 190 42 Q 360 50 530 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="230" y="58" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（1 ≤ t ≤ 100），进入多测循环</text>
  <path d="M 360 100 L 360 119" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="120" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="141" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 a, b, c（long long），排序</text>
  <text x="360" y="159" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">得到 A ≤ B ≤ C</text>
  <path d="M 250 166 L 250 189" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 166 L 470 189" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="190" width="310" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">候选 1：一次操作都不做</text>
  <text x="195" y="233" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">极差 = C − A</text>
  <rect x="370" y="190" width="310" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="525" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">候选 2：把最大数 C 换成 A+B</text>
  <text x="525" y="233" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">极差 = B（中间那个数）</text>
  <path d="M 195 246 L 330 272" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 525 246 L 392 272" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="210" y="276" width="300" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="360" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">输出 min(C − A, B)</text>
  <path d="M 210 299 L 20 299 L 20 143 L 208 143" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="292" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">下一组（共 t 组）</text>
  <rect x="24" y="336" width="672" height="146" rx="12" fill="#f4f7fd" stroke="#c3d3e8" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="362" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">实现要点</text>
  <text x="44" y="390" font-size="12.2" fill="#3d5a75" filter="url(#rough2)">· long long 读入 a, b, c：C − A ≤ 10^9，int 也够，但差值统一用 long long 最省心。</text>
  <text x="44" y="416" font-size="12.2" fill="#3d5a75" filter="url(#rough2)">· 多测不需要清空任何东西：只有三个局部变量和一个答案，天然没有残留状态。</text>
  <text x="44" y="442" font-size="12.2" fill="#3d5a75" filter="url(#rough2)">· 每组输出一行，以 '\n' 结尾（不要 endl），组与组之间不加空行。</text>
  <text x="44" y="468" font-size="12.2" fill="#3d5a75" filter="url(#rough2)">· 千万不要真的去模拟操作：排序 + 两次减法就是全部工作，O(1) / 组。</text>
  <text x="360" y="508" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">总复杂度 O(t)，t ≤ 100：这是全场最「一句话」的题，别想复杂</text>
</svg>
