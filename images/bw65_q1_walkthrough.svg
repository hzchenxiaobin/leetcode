<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 2 演算：abcdeef vs abaaacc，逐字母查表</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">其余 20 个字母两边都是 0，差为 0，不用管</text>

  <!-- 表头 -->
  <rect x="70" y="72" width="90" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="115" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">字母</text>
  <rect x="160" y="72" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">a</text>
  <rect x="220" y="72" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">b</text>
  <rect x="280" y="72" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">c</text>
  <rect x="340" y="72" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">d</text>
  <rect x="400" y="72" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">e</text>
  <rect x="460" y="72" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="93" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">f</text>

  <!-- word1 计数 -->
  <rect x="70" y="108" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="129" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">word1 计数</text>
  <rect x="160" y="108" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="129" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="220" y="108" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="129" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="280" y="108" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="129" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="340" y="108" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="129" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="400" y="108" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="129" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="460" y="108" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="129" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>

  <!-- word2 计数 -->
  <rect x="70" y="144" width="90" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="165" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">word2 计数</text>
  <rect x="160" y="144" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="190" y="165" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">4</text>
  <rect x="220" y="144" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="165" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="280" y="144" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="165" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="340" y="144" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="165" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="400" y="144" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="165" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="460" y="144" width="60" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="165" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">0</text>

  <!-- 差值行 -->
  <rect x="70" y="180" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="202" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">|频率差|</text>
  <rect x="160" y="180" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <rect x="220" y="180" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="202" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="280" y="180" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="202" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="340" y="180" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="202" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="400" y="180" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="202" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="460" y="180" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="202" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="190" y="234" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">刚好压线 3，仍算"不超过"</text>

  <rect x="130" y="252" width="300" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">所有差值 ≤ 3 → 返回 true</text>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">注意是"不超过"，|差| = 3 合法，|差| = 4 才失败</text>
</svg>
