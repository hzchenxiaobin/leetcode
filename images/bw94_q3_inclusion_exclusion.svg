<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一个 lcm 周期：free = L − L/d₁ − L/d₂ + 1</text>

  <!-- 外框：周期 [1, L] -->
  <rect x="80" y="60" width="360" height="150" rx="10" fill="#ffffff" stroke="#333" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="232" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="424" y="232" font-size="13" fill="#333" filter="url(#rough2)">L</text>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">完整周期 L = lcm(d₁, d₂)</text>

  <!-- 两个圆：d1 倍数 与 d2 倍数 -->
  <circle cx="205" cy="135" r="80" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="315" cy="135" r="80" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="155" y="88" font-size="13" fill="#d6a040" filter="url(#rough2)">d₁ 的倍数</text>
  <text x="155" y="106" font-size="13" fill="#d6a040" filter="url(#rough2)">共 L/d₁ 个</text>

  <text x="330" y="88" font-size="13" fill="#446688" filter="url(#rough2)">d₂ 的倍数</text>
  <text x="330" y="106" font-size="13" fill="#446688" filter="url(#rough2)">共 L/d₂ 个</text>

  <!-- 交集 -->
  <text x="260" y="140" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">交集 = lcm 的倍数</text>
  <text x="260" y="158" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">周期内恰 1 个</text>

  <!-- free 区域标注 -->
  <rect x="96" y="180" width="80" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">free 区</text>
  <rect x="344" y="180" width="80" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">free 区</text>

  <!-- 公式推导 -->
  <rect x="70" y="256" width="380" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">|A ∪ B| = L/d₁ + L/d₂ − 1（容斥）</text>
  <text x="260" y="304" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">free = L − |A ∪ B|</text>
  <text x="260" y="330" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= L − L/d₁ − L/d₂ + 1</text>
</svg>
