<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：trips(t) = Σ⌊t/time[i]⌋ 单调不减 → 「不可行 | 可行」二段性</text>

  <!-- ===== Panel A: bar chart of trips(t) ===== -->
  <text x="76" y="56" font-size="11" fill="#888" filter="url(#rough2)">示例：time = [1,2,3]，totalTrips = 5</text>
  <text x="160" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">不可行：trips &lt; 5</text>
  <text x="352" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">可行：trips ≥ 5</text>
  <text x="251" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">t* = 3</text>

  <!-- threshold line: trips = 5 -->
  <path d="M 76 160 L 445 160" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="443" y="153" text-anchor="end" font-size="10.5" fill="#a8781f" filter="url(#rough2)">totalTrips = 5</text>

  <!-- bars: t=0..5, values 0,1,3,5,7,8; baseline y=250, 18px per trip -->
  <rect x="84" y="246" width="44" height="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="142" y="232" width="44" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="200" y="196" width="44" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="258" y="160" width="44" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="316" y="124" width="44" height="126" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="374" y="106" width="44" height="144" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- value labels -->
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="106" y="242" filter="url(#rough2)">0</text>
    <text x="164" y="226" filter="url(#rough2)">1</text>
    <text x="222" y="190" filter="url(#rough2)">3</text>
    <text x="280" y="154" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">5</text>
    <text x="338" y="118" filter="url(#rough2)">7</text>
    <text x="396" y="100" filter="url(#rough2)">8</text>
  </g>

  <!-- axis -->
  <path d="M 76 250 L 448 250" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="106" y="268" filter="url(#rough2)">t=0</text>
    <text x="164" y="268" filter="url(#rough2)">t=1</text>
    <text x="222" y="268" filter="url(#rough2)">t=2</text>
    <text x="280" y="268" filter="url(#rough2)">t=3</text>
    <text x="338" y="268" filter="url(#rough2)">t=4</text>
    <text x="396" y="268" filter="url(#rough2)">t=5</text>
  </g>
  <text x="262" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">时间 t →（柱高 = trips(t)）</text>
  <text x="60" y="178" text-anchor="middle" font-size="10.5" fill="#666" transform="rotate(-90 60 178)" filter="url(#rough2)">trips(t)</text>

  <!-- ===== Panel B: note box ===== -->
  <rect x="470" y="64" width="225" height="182" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="582" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">单调性 ⇒ 二段性</text>
  <g font-size="10.5" fill="#555">
    <text x="484" y="112" filter="url(#rough2)">t 增大 → 每辆车的 ⌊t/time[i]⌋</text>
    <text x="484" y="129" filter="url(#rough2)">只增不减 → trips(t) 单调不减</text>
    <text x="484" y="146" filter="url(#rough2)">「不可行 / 可行」只切换一次</text>
    <text x="484" y="163" filter="url(#rough2)">∃ 最小可行时刻 t*：</text>
    <text x="484" y="180" fill="#b85450" filter="url(#rough2)">t &lt; t*：跑不完（红柱）</text>
    <text x="484" y="197" fill="#2e5b2e" filter="url(#rough2)">t ≥ t*：跑得完（绿柱）</text>
    <text x="484" y="219" font-weight="bold" fill="#7a5415" filter="url(#rough2)">→ 在 [1, min×T] 上二分找 t*</text>
  </g>

  <!-- ===== Panel C: lower & upper bound ===== -->
  <rect x="70" y="300" width="280" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">二分下界 lo = 1</text>
  <g font-size="10" fill="#555">
    <text x="84" y="342" filter="url(#rough2)">time[i] ≥ 1，跑完一趟至少 1 单位时间</text>
    <text x="84" y="358" filter="url(#rough2)">trips(0) = 0 &lt; T → t=0 必不可行</text>
    <text x="84" y="376" font-size="9" fill="#888" filter="url(#rough2)">（取 min(time) 作下界亦可，只省常数轮）</text>
  </g>

  <rect x="370" y="300" width="280" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">二分上界 hi = min(time) × totalTrips</text>
  <g font-size="10" fill="#555">
    <text x="384" y="342" filter="url(#rough2)">最快的车独跑完全部 T 趟 → 必可行</text>
    <text x="384" y="358" filter="url(#rough2)">最坏 10^7 × 10^7 = 10^14 → long long</text>
    <text x="384" y="376" font-size="9" fill="#888" filter="url(#rough2)">（上界取松些不影响正确性，只多几轮）</text>
  </g>
</svg>
