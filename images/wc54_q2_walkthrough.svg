<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "00110011"</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三个分界点各贡献 2 个合法子串，合计 6</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="112" y="62" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="154" y="62" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="62" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="238" y="62" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="280" y="62" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="322" y="62" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="364" y="62" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="406" y="62" width="42" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="133" y="87" fill="#3a5a30">0</text>
    <text x="175" y="87" fill="#3a5a30">0</text>
    <text x="217" y="87" fill="#3a4a66">1</text>
    <text x="259" y="87" fill="#3a4a66">1</text>
    <text x="301" y="87" fill="#8a6a20">0</text>
    <text x="343" y="87" fill="#8a6a20">0</text>
    <text x="385" y="87" fill="#8c3a3a">1</text>
    <text x="427" y="87" fill="#8c3a3a">1</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="133" y="112">0</text><text x="175" y="112">1</text>
    <text x="217" y="112">2</text><text x="259" y="112">3</text>
    <text x="301" y="112">4</text><text x="343" y="112">5</text>
    <text x="385" y="112">6</text><text x="427" y="112">7</text>
  </g>

  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M 196 58 L 196 122" fill="none"/>
    <path d="M 280 58 L 280 122" fill="none"/>
    <path d="M 364 58 L 364 122" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#b85450" font-weight="bold">
    <text x="196" y="138">+2</text>
    <text x="280" y="138">+2</text>
    <text x="364" y="138">+2</text>
  </g>

  <path d="M 36 158 L 524 158" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" fill="#666" font-weight="bold" text-anchor="middle">
    <text x="80" y="176">分界下标</text>
    <text x="168" y="176">左段（长）</text>
    <text x="252" y="176">右段（长）</text>
    <text x="322" y="176">贡献 min</text>
    <text x="392" y="176">累计 ans</text>
  </g>
  <text x="430" y="176" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">新增子串</text>

  <path d="M 36 184 L 524 184" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#444">
    <text x="80" y="206">1</text>
    <text x="168" y="206">00（2）</text>
    <text x="252" y="206">11（2）</text>
    <text x="322" y="206">2</text>
    <text x="392" y="206">2</text>
    <text x="430" y="206" text-anchor="start" fill="#b85450">0011, 01</text>

    <text x="80" y="238">3</text>
    <text x="168" y="238">11（2）</text>
    <text x="252" y="238">00（2）</text>
    <text x="322" y="238">2</text>
    <text x="392" y="238">4</text>
    <text x="430" y="238" text-anchor="start" fill="#b85450">1100, 10</text>

    <text x="80" y="270">5</text>
    <text x="168" y="270">00（2）</text>
    <text x="252" y="270">11（2）</text>
    <text x="322" y="270">2</text>
    <text x="392" y="270">6</text>
    <text x="430" y="270" text-anchor="start" fill="#b85450">0011, 01</text>
  </g>

  <path d="M 36 288 L 524 288" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="300" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = 2 + 2 + 2 = 6</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">"0011" 与 "01" 在不同起点各出现两次，不同位置分别计数</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">而 "00110011" 本身无效：0 与 1 各自没有成组连续</text>
</svg>
