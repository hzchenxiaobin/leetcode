<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="227"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：4×3 矩阵的行掩码与 S={0,2} 判定</text>

  <!-- 矩阵与掩码对照 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <!-- 行 0: 000 -->
    <rect x="90" y="48" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="48" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="170" y="48" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="110" y="69">0</text><text x="150" y="69">0</text><text x="190" y="69">0</text>
    <text x="76" y="69" font-size="12" fill="#888">行0</text>
    <rect x="250" y="48" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="282" y="69" fill="#1d3a17">000</text>

    <!-- 行 1: 101 -->
    <rect x="90" y="84" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="130" y="84" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="170" y="84" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="110" y="105" fill="#1a2b45" font-weight="bold">1</text><text x="150" y="105">0</text><text x="190" y="105" fill="#1a2b45" font-weight="bold">1</text>
    <text x="76" y="105" font-size="12" fill="#888">行1</text>
    <rect x="250" y="84" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="282" y="105" fill="#1d3a17">101</text>

    <!-- 行 2: 011 -->
    <rect x="90" y="120" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="170" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="110" y="141">0</text><text x="150" y="141" fill="#1a2b45" font-weight="bold">1</text><text x="190" y="141" fill="#1a2b45" font-weight="bold">1</text>
    <text x="76" y="141" font-size="12" fill="#888">行2</text>
    <rect x="250" y="120" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="282" y="141" fill="#1d3a17">011</text>

    <!-- 行 3: 001 -->
    <rect x="90" y="156" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="130" y="156" width="40" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="170" y="156" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="110" y="177">0</text><text x="150" y="177">0</text><text x="190" y="177" fill="#1a2b45" font-weight="bold">1</text>
    <text x="76" y="177" font-size="12" fill="#888">行3</text>
    <rect x="250" y="156" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="282" y="177" fill="#1d3a17">001</text>
  </g>
  <text x="150" y="212" font-size="12" fill="#888" text-anchor="middle" filter="url(#rough2)">列0 列1 列2</text>
  <text x="282" y="212" font-size="12" fill="#888" text-anchor="middle" filter="url(#rough2)">行掩码 r</text>

  <!-- S = {0,2} 判定 -->
  <g filter="url(#rough2)">
    <rect x="60" y="228" width="440" height="120" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="252" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">S = {0, 2} → 掩码 101，~S（3 位内）= 010</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="130" y="278">行0: 000 &amp; 010 = 000</text>
    <text x="330" y="278" fill="#4a7a3a" font-weight="bold">→ 0 ✓ 覆盖</text>
    <text x="130" y="300">行1: 101 &amp; 010 = 000</text>
    <text x="330" y="300" fill="#4a7a3a" font-weight="bold">→ 0 ✓ 覆盖</text>
    <text x="130" y="322">行2: 011 &amp; 010 = 010</text>
    <text x="330" y="322" fill="#b85450" font-weight="bold">≠ 0 ✗ 不覆盖</text>
    <text x="130" y="344">行3: 001 &amp; 010 = 000</text>
    <text x="330" y="344" fill="#4a7a3a" font-weight="bold">→ 0 ✓ 覆盖</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="364" width="440" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="388" text-anchor="middle" font-size="14" fill="#1d3a17" filter="url(#rough2)">S = {0,2} 覆盖 3 行；S = {1,2} 同为 3 行</text>
  <text x="280" y="412" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">行1（101）与行2（011）的并集是 111，需 3 列 &gt; k=2 → 4 行不可达，答案 3</text>
</svg>
