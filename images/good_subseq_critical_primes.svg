<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">为什么 n ≥ 17 时「删一判定」恒通过</text>
  <path d="M 280 42 Q 470 52 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: classic bad case ===== -->
  <text x="470" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">① 经典「全坏」结构：b = {6, 10, 15}（p = 1，n = 3，整体 gcd = 1）</text>

  <!-- three element bubbles -->
  <g font-size="15">
    <g filter="url(#sk)"><circle cx="180" cy="130" r="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="180" y="136" text-anchor="middle" fill="#2b6e9e" font-weight="bold">6</text>
    <g filter="url(#sk)"><circle cx="330" cy="130" r="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="330" y="136" text-anchor="middle" fill="#2b6e9e" font-weight="bold">10</text>
    <g filter="url(#sk)"><circle cx="480" cy="130" r="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="480" y="136" text-anchor="middle" fill="#2b6e9e" font-weight="bold">15</text>
  </g>
  <text x="330" y="186" text-anchor="middle" font-size="10.5" fill="#888">gcd(6,10,15) = 1 ✓ 但…</text>

  <!-- deletion records on right -->
  <g font-size="11">
    <g filter="url(#sk)"><rect x="580" y="96" width="320" height="30" rx="6" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="600" y="116" font-family="monospace" fill="#7a4040">删 6  → gcd(10,15) = 5 &gt; 1　专属质数 q = 5</text>
    <g filter="url(#sk)"><rect x="580" y="132" width="320" height="30" rx="6" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="600" y="152" font-family="monospace" fill="#7a4040">删 10 → gcd(6,15) = 3 &gt; 1　专属质数 q = 3</text>
    <g filter="url(#sk)"><rect x="580" y="168" width="320" height="30" rx="6" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.2"/></g>
    <text x="600" y="188" font-family="monospace" fill="#7a4040">删 15 → gcd(6,10) = 2 &gt; 1　专属质数 q = 2</text>
  </g>
  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">每个下标 j 都被一个「专属临界质数 q_j」覆盖（q_j 整除其余全部元素）→ 怎么删都失败</text>

  <!-- ===== Panel 2: two arguments ===== -->
  <text x="470" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 两个论证：质数两两不同 + 乘积爆炸</text>

  <!-- argument A -->
  <g filter="url(#sk)">
    <rect x="60" y="276" width="400" height="130" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="300" font-size="12" font-weight="bold" fill="#2b6e9e">论证 A：q_j 两两不同</text>
  <text x="80" y="324" font-size="10.5" fill="#444">反设 q_j = q_j' = q（j ≠ j'）：</text>
  <text x="80" y="344" font-size="10.5" fill="#444">· q 整除所有 i ∉ {j, j'} 的 b_i（由 q_j）</text>
  <text x="80" y="362" font-size="10.5" fill="#444">· q | b_j'（因 j' ≠ j），q | b_j（因 j ≠ j'）</text>
  <text x="80" y="382" font-size="10.5" fill="#444">→ q 整除全部元素，q | gcd(全体) = 1，矛盾 ∎</text>

  <!-- argument B -->
  <g filter="url(#sk)">
    <rect x="480" y="276" width="400" height="130" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="500" y="300" font-size="12" font-weight="bold" fill="#2e6e2e">论证 B：n ≥ 17 时矛盾</text>
  <text x="500" y="324" font-size="10.5" fill="#444">得到 n 个两两不同的质数，任取 16 个：</text>
  <text x="500" y="344" font-size="10.5" fill="#444">乘积 P ≥ 2¹⁶ = 65536</text>
  <text x="500" y="362" font-size="10.5" fill="#444">必有元素 b_i* 同时被这 16 个质数整除 → P | b_i*</text>
  <text x="500" y="382" font-size="10.5" fill="#444">但 b_i* ≤ 5×10⁴ &lt; P，被 P 整除的正数 ≥ P，矛盾 ∎</text>

  <!-- ===== Panel 3: bar comparison ===== -->
  <text x="470" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">③ 直观对比：16 个不同质数的乘积 vs 值域上限</text>

  <!-- bar: 2^16 -->
  <g filter="url(#sk)">
    <rect x="120" y="470" width="560" height="34" rx="4" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="130" y="492" font-size="12" fill="#b03a3a" font-weight="bold">2¹⁶ = 65536（任意 16 个不同质数之积的下界）</text>
  <!-- bar: 5e4 -->
  <g filter="url(#sk)">
    <rect x="120" y="516" width="427" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="130" y="538" font-size="12" fill="#2b6e9e" font-weight="bold">5×10⁴（b_i 的值域上限）</text>
  <!-- overflow annotation -->
  <path d="M 688 487 Q 730 487 750 500 Q 770 514 700 528" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="800" y="520" font-size="10.5" fill="#b03a3a" font-weight="bold">装不下！</text>

  <!-- conclusion badge -->
  <g filter="url(#sk)">
    <rect x="120" y="572" width="700" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="470" y="598" text-anchor="middle" font-size="13.5" fill="#2e6e2e" font-weight="bold">结论：n ≥ 17 时「所有 j 都失败」不可能发生</text>
  <text x="470" y="622" text-anchor="middle" font-size="11.5" fill="#557a55">只要 gcd(b_S) = 1，就一定存在可删的 j → 判定只看线段树根是否为 1</text>
</svg>
