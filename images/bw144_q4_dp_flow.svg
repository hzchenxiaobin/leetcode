<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">DP 转移：第 i 行的状态只由第 i−1 行相邻三列决定</text>

  <!-- 上一行 -->
  <text x="86" y="76" font-size="11.5" fill="#666" filter="url(#rough2)">第 i−1 行</text>
  <g filter="url(#rough2)">
    <rect x="196" y="56" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="262" y="56" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="328" y="56" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="225" y="82">dp[j−1]</text>
    <text x="291" y="82">dp[j]</text>
    <text x="357" y="82">dp[j+1]</text>
  </g>

  <!-- 当前行 -->
  <text x="86" y="176" font-size="11.5" fill="#666" filter="url(#rough2)">第 i 行</text>
  <rect x="262" y="152" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="291" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ndp[j]</text>

  <g stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)">
    <path d="M 225 96 C 225 132, 258 140, 272 148" marker-end="url(#arr)"/>
    <path d="M 291 96 L 291 148" marker-end="url(#arr)"/>
    <path d="M 357 96 C 357 132, 324 140, 310 148" marker-end="url(#arr)"/>
  </g>

  <rect x="80" y="204" width="400" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ndp[j] = max(dp[j−1], dp[j], dp[j+1]) + v(i, j)</text>
  <text x="280" y="243" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">越界的前驱视为 −∞，不可达状态不参与运算</text>

  <rect x="80" y="262" width="400" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v(i, j) = fruits[i][j]（若 j &gt; i）否则 0（对角格已被第一位收走）</text>

  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">起点 dp[0][n−1] = fruits[0][n−1]，终点取 dp[n−1][n−1]，滚动两行 ⇒ 空间 O(n)</text>
</svg>
