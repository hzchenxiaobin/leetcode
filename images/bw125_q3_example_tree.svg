<text x="310" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">以 0 为中心：分支「6」中 6、5 的距离 3、6 都整除 3 → cnt = 2；分支「3」中只有 4 → cnt = 1</text>
