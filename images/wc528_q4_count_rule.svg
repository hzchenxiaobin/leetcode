<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">计数规则：段内只有起点 i ≤ p 才一致</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [2, 6, 3]，j = 2；段 [0, 1] 的 AND 都是 x = 2，x 最近出现在 p = 0</text>

  <g filter="url(#rough2)">
    <rect x="259" y="70" width="62" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="329" y="70" width="62" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="399" y="70" width="62" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="290" y="98" text-anchor="middle" font-size="16" fill="#8a6415" filter="url(#rough2)">2</text>
  <text x="360" y="98" text-anchor="middle" font-size="16" fill="#2f4f6f" filter="url(#rough2)">6</text>
  <text x="430" y="98" text-anchor="middle" font-size="16" fill="#2f4f6f" filter="url(#rough2)">3</text>
  <text x="290" y="128" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#rough2)">p = 0</text>
  <text x="360" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="430" y="128" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>

  <g filter="url(#rough2)">
    <rect x="259" y="140" width="132" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="325" y="161" text-anchor="middle" font-size="11" fill="#2f4f6f" filter="url(#rough2)">段 [0, 1]，AND = 2</text>

  <path d="M 290 172 L 290 186" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="50" y="190" width="620" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="62" y="214" text-anchor="start" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">i = 0 ≤ p：子数组 [2,6,3] 含 x ⇒ AND = 2，min = 2，计入 ✓</text>

  <g filter="url(#rough2)">
    <rect x="50" y="234" width="620" height="38" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="62" y="258" text-anchor="start" font-size="11.5" fill="#8f3830" filter="url(#rough2)">i = 1 &gt; p：子数组 [6,3] 不含 x ⇒ AND = 2，min = 3，不计 ✗</text>

  <g filter="url(#rough2)">
    <rect x="110" y="288" width="500" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="313" text-anchor="middle" font-size="13" fill="#8a6415" filter="url(#rough2)">本段贡献 = max(0, min(hi, p) − lo + 1)</text>

  <text x="360" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">若 x 在整个前缀 [0, j] 从未出现（p = −1），整段贡献为 0</text>
</svg>
