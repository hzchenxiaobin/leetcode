<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="620" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算："!this  1-s b8d!" → 0 个有效单词</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="56" width="620" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="80" y="80" font-size="13" font-family="monospace" fill="#333" filter="url(#rough2)">sentence = "!this  1-s b8d!"</text>
  <text x="700" y="80" font-size="11" fill="#888" filter="url(#rough2)">两个空格 → split() 合并</text>

  <!-- token 1: !this -->
  <text x="80" y="134" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">token ①</text>
  <g filter="url(#rough2)">
    <rect x="150" y="112" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="192" y="112" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="234" y="112" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="276" y="112" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="318" y="112" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="167" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">!</text>
  <text x="209" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t</text>
  <text x="251" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">h</text>
  <text x="293" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">i</text>
  <text x="335" y="134" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">s</text>
  <text x="380" y="126" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">首个违规：'!' 在 i=0，不在末尾</text>
  <text x="380" y="144" font-size="12" fill="#b85450" filter="url(#rough2)">违反规则 ③（位置）→ ✗ 无效</text>

  <!-- token 2: 1-s -->
  <text x="80" y="182" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">token ②</text>
  <g filter="url(#rough2)">
    <rect x="150" y="160" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="192" y="160" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="234" y="160" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="167" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="209" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-</text>
  <text x="251" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">s</text>
  <text x="380" y="174" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">首个违规：'1' 是数字</text>
  <text x="380" y="192" font-size="12" fill="#b85450" filter="url(#rough2)">违反规则 ① → ✗ 无效（后面字符无需再看）</text>

  <!-- token 3: b8d! -->
  <text x="80" y="230" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">token ③</text>
  <g filter="url(#rough2)">
    <rect x="150" y="208" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="192" y="208" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="234" y="208" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="276" y="208" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="167" y="230" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="209" y="230" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="251" y="230" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">d</text>
  <text x="293" y="230" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">!</text>
  <text x="380" y="222" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">首个违规：'8' 是数字</text>
  <text x="380" y="240" font-size="12" fill="#b85450" filter="url(#rough2)">违反规则 ① → ✗ 无效（'!' 在末尾也救不回来）</text>

  <g filter="url(#rough2)">
    <rect x="760" y="164" width="110" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="815" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 0</text>
  <text x="815" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三个 token 全无效</text>

  <!-- 分隔线 -->
  <path d="M 60 268 L 880 268" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- Part 2: a-b. 走查表 -->
  <text x="470" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对照：有效 token "a-b." 的计数器走查</text>

  <g filter="url(#rough2)">
    <rect x="60" y="312" width="820" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="90" y="333" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">ch</text>
  <text x="160" y="333" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">类型</text>
  <text x="330" y="333" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">检查（数量 + 位置）</text>
  <text x="658" y="333" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">hyphen</text>
  <text x="743" y="333" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">punct</text>
  <text x="830" y="333" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">结果</text>

  <g filter="url(#rough2)">
    <rect x="60" y="344" width="820" height="38" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="60" y="382" width="820" height="38" fill="#fff4e6" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="60" y="420" width="820" height="38" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="60" y="458" width="820" height="38" fill="#f0f9f1" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <text x="90" y="368" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="160" y="368" font-size="12" fill="#446688" filter="url(#rough2)">字母</text>
  <text x="240" y="368" font-size="12" fill="#444" filter="url(#rough2)">无额外约束</text>
  <text x="673" y="368" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="758" y="368" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="828" y="368" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="90" y="406" font-size="13" fill="#333" filter="url(#rough2)">-</text>
  <text x="160" y="406" font-size="12" fill="#a67c1e" filter="url(#rough2)">连字符</text>
  <text x="240" y="406" font-size="12" fill="#444" filter="url(#rough2)">cnt=1≤1；i=1 非首尾；两侧 'a'、'b' 均为字母</text>
  <text x="673" y="406" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="758" y="406" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="828" y="406" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="90" y="444" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="160" y="444" font-size="12" fill="#446688" filter="url(#rough2)">字母</text>
  <text x="240" y="444" font-size="12" fill="#444" filter="url(#rough2)">无额外约束</text>
  <text x="673" y="444" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="758" y="444" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="828" y="444" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="90" y="482" font-size="13" fill="#333" filter="url(#rough2)">.</text>
  <text x="160" y="482" font-size="12" fill="#4a7a3a" filter="url(#rough2)">标点</text>
  <text x="240" y="482" font-size="12" fill="#444" filter="url(#rough2)">cnt=1≤1；i=3=n-1，位于末尾</text>
  <text x="673" y="482" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="758" y="482" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="810" y="482" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 有效</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="516" width="820" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="82" y="540" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">短路生效点：违规字符处立即返回，后缀不再扫描（"1-s" 的 '-' 根本没被检查）</text>
  <text x="82" y="562" font-size="12" fill="#444" filter="url(#rough2)">"a-b." 四个字符全部通过 → 计入答案；若把它加进上面的句子，ans 变为 1</text>
  <text x="82" y="584" font-size="12" fill="#888" filter="url(#rough2)">连字符两侧检查是下标敏感的：先确认 i 非首尾，再访问 t[i-1]、t[i+1]，避免越界</text>
</svg>
