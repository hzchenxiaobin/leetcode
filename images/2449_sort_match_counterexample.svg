<svg xmlns="http://www.w3.org/2000/svg" width="940" height="770" viewBox="0 0 940 770" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="770" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">配对必须同类：「整体排序」是本题最大的陷阱</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: counterexample -->
  <text x="70" y="74" font-size="13" font-weight="bold" fill="#b03a3a">① 陷阱演示：整体排序后直接按位配对 ✗</text>
  <text x="70" y="100" font-size="11" fill="#444">自构造反例：nums = [1, 4]，target = [3, 2]（总和 5 = 5，奇数各 1 个 ⇒ 一定可达）</text>

  <text x="182" y="126" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">排序后 nums</text>
  <text x="462" y="126" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">排序后 target</text>

  <g filter="url(#sk)"><rect x="150" y="136" width="64" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="182" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="430" y="136" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="462" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">2</text>
  <path d="M 214 156 L 426 156" stroke="#b03a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 312 148 L 328 164 M 328 148 L 312 164" stroke="#b03a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="150" y="196" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="182" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="430" y="196" width="64" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="462" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">3</text>
  <path d="M 214 216 L 426 216" stroke="#b03a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 312 208 L 328 224 M 328 208 L 312 224" stroke="#b03a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>

  <text x="520" y="152" font-size="11" fill="#b03a3a">1(奇) ↔ 2(偶)：奇偶不同！</text>
  <text x="520" y="212" font-size="11" fill="#b03a3a">4(偶) ↔ 3(奇)：奇偶不同！</text>
  <text x="520" y="240" font-size="11" font-weight="bold" fill="#b03a3a">差为 1（奇数），±2 永远消不掉</text>
  <text x="470" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">✗ 丢掉奇偶约束的「整体排序配对」必然出错</text>

  <!-- Panel B: correct -->
  <text x="70" y="312" font-size="13" font-weight="bold" fill="#2e6e2e">② 正解：先奇偶分流，类内排序后按位配对 ✓</text>

  <text x="100" y="356" text-anchor="end" font-size="11" font-weight="bold" fill="#7a5415">奇数类</text>
  <g filter="url(#sk)"><rect x="110" y="332" width="64" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="142" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="390" y="332" width="64" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="422" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">3</text>
  <path d="M 174 352 L 386 352" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#444">|1 − 3| = 2</text>
  <text x="520" y="356" font-size="11" fill="#444">元素 1 需接收 1 个单位（亏损）</text>

  <text x="100" y="436" text-anchor="end" font-size="11" font-weight="bold" fill="#2b6e9e">偶数类</text>
  <g filter="url(#sk)"><rect x="110" y="412" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="142" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="390" y="412" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="422" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">2</text>
  <path d="M 174 432 L 386 432" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#444">|4 − 2| = 2</text>
  <text x="520" y="436" font-size="11" fill="#444">元素 4 需送出 1 个单位（盈余）</text>

  <g filter="url(#sk)"><rect x="660" y="330" width="230" height="130" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="680" y="358" font-size="13" font-weight="bold" fill="#2e6e2e">D = 2 + 2 = 4</text>
  <text x="680" y="388" font-size="15" font-weight="bold" fill="#2e6e2e">答案 = D ÷ 4 = 1</text>
  <text x="680" y="414" font-size="10" fill="#666">一次操作：4 把 2 送给 1</text>
  <text x="680" y="434" font-size="10" fill="#666">→ nums = [3, 2] ✓</text>

  <text x="470" y="486" text-anchor="middle" font-size="11" fill="#2e6e2e">验证：选 i=0（元素 1）、j=1（元素 4）→ nums = [1+2, 4−2] = [3, 2]，与 target 相似 ✓</text>

  <!-- Panel C: exchange argument -->
  <text x="70" y="524" font-size="13" font-weight="bold" fill="#5a3a7a">③ 类内为什么排序？—— 交换论证</text>
  <g filter="url(#sk)"><rect x="60" y="544" width="820" height="200" rx="8" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="570" font-size="12" font-weight="bold" fill="#2b2b2b">设 a₁ ≤ a₂、b₁ ≤ b₂，则顺序配对不差于交叉配对：</text>
  <text x="80" y="596" font-size="12" fill="#444" font-family="monospace">|a₁−b₁| + |a₂−b₂|  ≤  |a₁−b₂| + |a₂−b₁|</text>
  <text x="80" y="622" font-size="11" fill="#7a2828">交叉 − 顺序 = 2 × ([a₁,a₂] 与 [b₁,b₂] 的重叠长度) ≥ 0</text>

  <path d="M 180 652 L 180 642 L 560 642 L 560 652" stroke="#b03a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="568" y="650" font-size="10" fill="#b03a3a">交叉 a₁↔b₂</text>
  <path d="M 140 692 L 640 692" stroke="#666" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="180" cy="692" r="7" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="180" y="674" text-anchor="middle" font-size="11" fill="#7a5415">a₁</text>
  <g filter="url(#sk)"><circle cx="300" cy="692" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="300" y="674" text-anchor="middle" font-size="11" fill="#2b6e9e">b₁</text>
  <g filter="url(#sk)"><circle cx="420" cy="692" r="7" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="420" y="674" text-anchor="middle" font-size="11" fill="#7a5415">a₂</text>
  <g filter="url(#sk)"><circle cx="560" cy="692" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="560" y="674" text-anchor="middle" font-size="11" fill="#2b6e9e">b₂</text>
  <path d="M 180 708 L 180 718 L 300 718 L 300 708" stroke="#4a8e4a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="240" y="734" text-anchor="middle" font-size="10" fill="#2e6e2e">顺序 a₁↔b₁</text>
  <path d="M 420 708 L 420 718 L 560 718 L 560 708" stroke="#4a8e4a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="490" y="734" text-anchor="middle" font-size="10" fill="#2e6e2e">顺序 a₂↔b₂</text>
  <text x="670" y="672" font-size="10" fill="#888">图示 a₁ ≤ b₁ ≤ a₂ ≤ b₂ 的交错位置：</text>
  <text x="670" y="690" font-size="10" fill="#888">红色交叉区间覆盖了两个绿色</text>
  <text x="670" y="708" font-size="10" fill="#888">顺序区间还多出重叠段；其余</text>
  <text x="670" y="726" font-size="10" fill="#888">位置关系同理可验（不等式恒成立）</text>
</svg>
