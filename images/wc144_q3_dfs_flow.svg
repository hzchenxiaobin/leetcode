<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次 DFS：向下传 isRoot，向上返回修剪后的子树根</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">isRoot 表示「父节点为空或已被删」，即当前节点是否该登记为新树的根</text>

  <!-- 入口 -->
  <rect x="230" y="60" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">dfs(node, isRoot)</text>
  <path d="M 310 90 L 310 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：node 为空 -->
  <polygon points="310,112 402,134 310,156 218,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="138" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">node 为空？</text>
  <path d="M 402 134 L 456 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="126" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">是</text>
  <rect x="460" y="118" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="138" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">return null</text>

  <!-- 判定 2：是否被删 -->
  <path d="M 310 156 L 310 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="172" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <polygon points="310,180 448,204 310,228 172,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="208" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">val 在 to_delete 中？</text>

  <!-- 删除分支 -->
  <path d="M 448 204 L 540 204 L 540 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="197" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">是</text>
  <rect x="470" y="212" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="540" y="230" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">dfs(node.left, true)</text>
  <text x="540" y="244" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">dfs(node.right, true)</text>
  <text x="540" y="259" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">return null</text>

  <!-- 判定 3：isRoot -->
  <path d="M 310 228 L 310 240 L 250 240 L 250 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="252" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <polygon points="250,256 330,278 250,300 170,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="282" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">isRoot 为真？</text>

  <!-- 登记 -->
  <path d="M 330 278 L 368 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="349" y="270" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="372" y="262" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="282" text-anchor="middle" font-size="10" fill="#33507a" filter="url(#rough2)">forest.push_back(node)</text>

  <!-- 修剪子树 -->
  <path d="M 250 300 L 250 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="330" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">否</text>
  <path d="M 452 294 L 452 322 L 310 322 L 310 338" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="342" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="359" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">node.left = dfs(node.left, false)</text>
  <text x="300" y="374" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">node.right = dfs(node.right, false)</text>

  <path d="M 300 384 L 300 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="408" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="428" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">return node</text>
</svg>
