<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">餐厅过滤器：三段过滤 + 一个全序键</text>
  <text x="310" y="50" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">过滤是逐行谓词，排序只依赖 (rating, id)</text>

  <rect x="26" y="74" width="176" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="94" text-anchor="middle" font-size="12.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">① 素食过滤</text>
  <text x="114" y="114" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">veganFriendly=1 时</text>
  <text x="114" y="131" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">只留 vegan=1 的行</text>

  <text x="212" y="114" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">∧</text>

  <rect x="222" y="74" width="176" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="94" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 价格过滤</text>
  <text x="310" y="114" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">price ≤ maxPrice</text>
  <text x="310" y="131" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">上限含等于</text>

  <text x="408" y="114" text-anchor="middle" font-size="14" fill="#8a8a8a" filter="url(#rough2)">∧</text>

  <rect x="418" y="74" width="176" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="94" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 距离过滤</text>
  <text x="506" y="114" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">distance ≤ maxDistance</text>
  <text x="506" y="131" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">上限含等于</text>

  <path d="M 114 142 L 114 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 142 L 310 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 506 142 L 506 158" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="162" width="500" height="48" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="182" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">保留集合 K：三项检查全过的餐厅（veganFriendly=0 时跳过 ① 只查 ②③）</text>
  <text x="310" y="200" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">提示：id 不是数组下标，一律以 r[0] 为准</text>

  <path d="M 310 212 L 310 224" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="228" width="500" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="250" text-anchor="middle" font-size="12" fill="#2f4560" font-weight="bold" filter="url(#rough2)">排序键：(rating, id) 字典序降序</text>
  <text x="310" y="272" text-anchor="middle" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">rating 高者在前；rating 相同时 id 大者在前</text>
  <text x="310" y="292" text-anchor="middle" font-size="9.8" fill="#3a4a66" filter="url(#rough2)">id 互不相同 ⇒ 键唯一 ⇒ 全序，输出唯一，无需稳定排序</text>
  <text x="310" y="308" text-anchor="middle" font-size="9" fill="#7a8aa0" filter="url(#rough2)">过滤与排序解耦：先定集合，再定顺序</text>

  <path d="M 310 316 L 310 336" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="340" width="440" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">想只用一个整数比较？把二维键打包（B = 100001 &gt; max id）</text>
  <text x="310" y="381" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">key = rating × 100001 + id</text>

  <text x="310" y="416" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">B 严格大于最大 id，低位绝不向上进位；总时间 O(n log n)，空间 O(n)</text>
</svg>
