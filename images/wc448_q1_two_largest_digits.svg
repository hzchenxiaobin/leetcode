<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两个数字的最大乘积：答案 = 最大数位 × 次大数位</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 示例 1 ===== -->
  <text x="40" y="84" font-size="13" font-weight="bold" fill="#446688">示例 1：n = 2736</text>

  <g filter="url(#sk)"><rect x="100" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="128" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">2</text>

  <g filter="url(#sk)"><rect x="176" y="100" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="204" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#b07818">7</text>

  <g filter="url(#sk)"><rect x="252" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">3</text>

  <g filter="url(#sk)"><rect x="328" y="100" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="356" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#b07818">6</text>

  <path d="M 204 156 Q 290 208 422 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arr)"/>
  <path d="M 356 156 Q 396 196 422 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arr)"/>

  <g filter="url(#sk)"><rect x="428" y="102" width="176" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="516" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">7 × 6 = 42</text>

  <text x="40" y="196" font-size="11" fill="#444">按出现次数取最大的两个数位：7 与 6（各出现一次）→ 乘积 42</text>

  <!-- ===== 示例 2：陷阱 ===== -->
  <text x="40" y="234" font-size="13" font-weight="bold" fill="#b85450">示例 2（陷阱）：n = 19</text>

  <g filter="url(#sk)"><rect x="100" y="250" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="128" y="280" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>

  <g filter="url(#sk)"><rect x="176" y="250" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="204" y="280" text-anchor="middle" font-size="20" font-weight="bold" fill="#b07818">9</text>

  <path d="M 232 273 Q 280 278 326 273" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arrr)"/>

  <g filter="url(#sk)"><rect x="330" y="250" width="282" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="471" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">9 × 1 = 9（不是 9 × 9 = 81）</text>

  <text x="40" y="318" font-size="11" fill="#444">最大数位 9 只出现一次 → 第二个因子只能取次大数位 1</text>

  <!-- ===== 关键观察 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">关键观察：数位取值 0 ~ 9，全部非负</text>
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#444">没有「负负得正」的翻盘分支 → 直接取最大的两个数位相乘</text>
</svg>
