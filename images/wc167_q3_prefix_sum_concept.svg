<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 444" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="620" height="444" fill="#fafafa"/>

  <text x="24" y="30" font-size="15.2" fill="#444" text-anchor="start" font-weight="bold" filter="url(#rough2)">核心观察：二维前缀和 + 元素非负 ⇒ 边长可行性单调</text>

  <!-- 4x4 matrix -->
  <rect x="60" y="76" width="120" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <path d="M 90 76 L 90 196 M 120 76 L 120 196 M 150 76 L 150 196" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 60 106 L 180 106 M 60 136 L 180 136 M 60 166 L 180 166" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="106" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>

  <text x="75" y="97" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="105" y="97" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="135" y="97" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="165" y="97" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="75" y="127" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="105" y="127" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="135" y="127" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="165" y="127" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="75" y="157" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="105" y="157" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="135" y="157" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="165" y="157" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="75" y="187" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="105" y="187" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="135" y="187" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="165" y="187" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">1</text>

  <text x="186" y="106" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">↖ (r−L, c−L)</text>
  <text x="186" y="176" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">↘ (r, c)</text>
  <text x="60" y="216" font-size="11" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">橙色 L=2 子方阵，元素和 S = 11</text>

  <!-- formula box -->
  <rect x="260" y="64" width="330" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="274" y="86" font-size="11.5" fill="#3a4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">子方阵和 = 容斥（二维前缀和）</text>
  <text x="274" y="116" font-size="12.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">S = pre[r][c] − pre[r−L][c]</text>
  <text x="286" y="138" font-size="12.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">− pre[r][c−L] + pre[r−L][c−L]</text>

  <rect x="260" y="166" width="330" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="274" y="188" font-size="11" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">pre[i][j] = 左上角 i×j 个元素之和</text>
  <text x="274" y="208" font-size="11" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">每个右下角只需 4 次查询 ⇒ O(1)</text>

  <rect x="48" y="248" width="524" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="62" y="272" font-size="11.5" fill="#3a5a30" text-anchor="start" font-weight="bold" filter="url(#rough2)">元素非负 ⇒ 大正方形一定包含它左上角的每个小正方形</text>
  <text x="62" y="296" font-size="11.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">所以 L 可行 ⟹ 任意 L' &lt; L 也可行：可行性在边长上单调</text>

  <!-- nested squares -->
  <rect x="100" y="340" width="78" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="340" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="100" y="340" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="172" y="412" font-size="9.5" fill="#3a5a30" text-anchor="end" filter="url(#rough2)">L=3</text>
  <text x="146" y="386" font-size="9.5" fill="#8a6a20" text-anchor="end" filter="url(#rough2)">L=2</text>
  <text x="120" y="360" font-size="9.5" fill="#8a3a36" text-anchor="end" filter="url(#rough2)">L=1</text>

  <path d="M 300 314 L 300 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="352" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">同一左上角，边长 1 → 3 嵌套</text>
  <text x="200" y="374" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">S(1) ≤ S(2) ≤ S(3)：和单调不减</text>
  <text x="200" y="396" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">因此二分 check 只需问「存在吗」</text>

  <text x="48" y="436" font-size="10.5" fill="#777" text-anchor="start" font-weight="bold" filter="url(#rough2)">一次 check(L) 扫 O(mn) 个右下角，二分 O(log min(m,n)) 轮</text>
</svg>
