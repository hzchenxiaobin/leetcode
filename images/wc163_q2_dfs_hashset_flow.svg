<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次 DFS 还原 + 哈希集合查询</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">构造 O(n)，每次 find 期望 O(1)</text>
  <rect x="105" y="70" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="105" y="134" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="105" y="198" width="360" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="105" y="276" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="105" y="340" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="86" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 初始化：root.val ← 0，seen ← ∅，栈 ← [root]</text>
  <text x="285" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 循环：弹出 cur，seen.insert(cur.val)</text>
  <text x="285" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 孩子非空则赋值并入栈：left = 2x+1，right = 2x+2</text>
  <text x="285" y="292" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ 遍历结束：seen 已含还原树的全部节点值</text>
  <text x="285" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑤ find(t)：return t ∈ seen</text>
  <text x="285" y="238" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">左孩子 u′ = 2u（位 0）；右孩子 u′ = 2u+1（位 1）</text>
  <path d="M 285 104 L 285 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 285 168 L 285 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 285 250 L 285 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 285 310 L 285 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 105 224 L 60 224 L 60 151 L 101 151" stroke="#8a6a20" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="196" text-anchor="end" font-size="10" fill="#8a6a20" filter="url(#rough2)">栈非空 ↺</text>
  <rect x="490" y="70" width="120" height="52" fill="#f3f0ff" stroke="#7a6aa8" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="550" y="92" text-anchor="middle" font-size="10" fill="#4b3d78" filter="url(#rough2)">预处理只做一次</text>
  <text x="550" y="108" text-anchor="middle" font-size="10" fill="#4b3d78" filter="url(#rough2)">O(n) 时间</text>
  <rect x="490" y="176" width="120" height="52" fill="#f3f0ff" stroke="#7a6aa8" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="550" y="198" text-anchor="middle" font-size="10" fill="#4b3d78" filter="url(#rough2)">查询走哈希表</text>
  <text x="550" y="214" text-anchor="middle" font-size="10" fill="#4b3d78" filter="url(#rough2)">期望 O(1)</text>
  <path d="M 466 92 L 486 92" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 466 196 L 486 196" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="358" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="379" font-size="10" fill="#8a6a20" filter="url(#rough2)">顶点值只与树形有关，构造后不再变化：把还原结果全部缓存进集合，find 就退化为一次成员判断</text>
</svg>
