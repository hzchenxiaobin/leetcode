<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="940" height="680" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums = [8,12,6]，target = [2,14,10]</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: sorted matching -->
  <text x="70" y="72" font-size="13" font-weight="bold" fill="#2b6e9e">① 全是偶数 → 单一类内排序，按位配对</text>
  <text x="172" y="100" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">排序后 nums</text>
  <text x="472" y="100" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">排序后 target</text>

  <g filter="url(#sk)"><rect x="140" y="114" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="172" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)"><rect x="440" y="114" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="472" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">2</text>
  <path d="M 204 134 L 436 134" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="560" y="132" font-size="11" fill="#b03a3a">|6−2| = 4 → 送出 2 个单位</text>

  <g filter="url(#sk)"><rect x="140" y="172" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="172" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">8</text>
  <g filter="url(#sk)"><rect x="440" y="172" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="472" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">10</text>
  <path d="M 204 192 L 436 192" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="560" y="190" font-size="11" fill="#2e6e2e">|8−10| = 2 → 接收 1 个单位</text>

  <g filter="url(#sk)"><rect x="140" y="230" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="172" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">12</text>
  <g filter="url(#sk)"><rect x="440" y="230" width="64" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="472" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">14</text>
  <path d="M 204 250 L 436 250" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="560" y="248" font-size="11" fill="#2e6e2e">|12−14| = 2 → 接收 1 个单位</text>

  <text x="470" y="302" text-anchor="middle" font-size="13" fill="#2b2b2b">D = 4 + 2 + 2 = 8，<tspan fill="#2e6e2e" font-weight="bold">答案 = D ÷ 4 = 2 ✓</tspan></text>

  <!-- Panel B: unit flow -->
  <text x="70" y="334" font-size="13" font-weight="bold" fill="#5a3a7a">② 单位流向：每条箭头 = 1 次操作（搬运面额 2）</text>

  <path d="M 252 400 Q 400 366 520 374" stroke="#b03a3a" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 252 426 Q 400 458 520 456" stroke="#b03a3a" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="386" y="356" text-anchor="middle" font-size="10" fill="#b03a3a">op1：送一个单位（2）</text>
  <text x="386" y="486" text-anchor="middle" font-size="10" fill="#b03a3a">op2：送一个单位（2）</text>

  <g filter="url(#sk)"><circle cx="220" cy="412" r="32" fill="#fdecea" stroke="#b03a3a" stroke-width="2"/></g>
  <text x="220" y="419" text-anchor="middle" font-size="16" font-weight="bold" fill="#b03a3a">6</text>
  <text x="220" y="464" text-anchor="middle" font-size="10" fill="#b03a3a">6 → 目标 2（盈余 4）</text>

  <g filter="url(#sk)"><circle cx="560" cy="382" r="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="560" y="389" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="560" y="432" text-anchor="middle" font-size="10" fill="#2e6e2e">8 → 目标 10（亏 2）</text>

  <g filter="url(#sk)"><circle cx="560" cy="462" r="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="560" y="469" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">12</text>
  <text x="560" y="512" text-anchor="middle" font-size="10" fill="#2e6e2e">12 → 目标 14（亏 2）</text>

  <text x="470" y="540" text-anchor="middle" font-size="11" fill="#444">盈余 4 = 2 个单位，恰好 2 条箭头 = 2 次操作</text>

  <!-- Panel C: actual op sequence -->
  <text x="70" y="556" font-size="13" font-weight="bold" fill="#2b6e9e">③ 验证：题目给的操作序列</text>

  <g filter="url(#sk)"><rect x="80" y="578" width="54" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="107" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">8</text>
  <g filter="url(#sk)"><rect x="142" y="578" width="54" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="169" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">12</text>
  <g filter="url(#sk)"><rect x="204" y="578" width="54" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="231" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">6</text>

  <path d="M 266 596 L 366 596" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="316" y="572" text-anchor="middle" font-size="10" fill="#444">op1: i=0, j=2</text>
  <text x="316" y="634" text-anchor="middle" font-size="9" fill="#888">8+2，6−2</text>

  <g filter="url(#sk)"><rect x="380" y="578" width="54" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="407" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">10</text>
  <g filter="url(#sk)"><rect x="442" y="578" width="54" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="469" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">12</text>
  <g filter="url(#sk)"><rect x="504" y="578" width="54" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="531" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">4</text>

  <path d="M 566 596 L 666 596" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="616" y="572" text-anchor="middle" font-size="10" fill="#444">op2: i=1, j=2</text>
  <text x="616" y="634" text-anchor="middle" font-size="9" fill="#888">12+2，4−2</text>

  <g filter="url(#sk)"><rect x="676" y="578" width="54" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="703" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">10</text>
  <g filter="url(#sk)"><rect x="738" y="578" width="54" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="765" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">14</text>
  <g filter="url(#sk)"><rect x="800" y="578" width="54" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="827" y="601" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>

  <text x="470" y="662" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">排序 [10,14,2] = [2,10,14] = 排序 target ✓ 与 D ÷ 4 = 2 一致</text>
</svg>
