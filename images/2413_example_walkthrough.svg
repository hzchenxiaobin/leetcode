<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n=5（奇）→ 10；n=6（偶）→ 6</text>
  <path d="M 120 44 Q 340 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="42" y="60" width="292" height="290" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="188" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">n = 5（奇数）</text>
  <text x="188" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">沿 n 的倍数序列找首个偶数</text>

  <text x="58" y="134" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">5 的倍数：</text>
  <g filter="url(#sk)"><rect x="140" y="120" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="166" y="139" text-anchor="middle" font-size="12.5" fill="#a03a3a" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="200" y="120" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="226" y="139" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">10</text>
  <g filter="url(#sk)"><rect x="260" y="120" width="52" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="286" y="139" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">15…</text>

  <text x="166" y="166" text-anchor="middle" font-size="11.5" fill="#a03a3a" filter="url(#sk)">✗ 5 是奇数</text>
  <text x="226" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 10 = 2×5</text>

  <text x="58" y="196" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">2 的倍数：</text>
  <g filter="url(#sk)"><rect x="140" y="182" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="157" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="180" y="182" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="197" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="220" y="182" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="237" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="260" y="182" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="277" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="300" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="317" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">10</text>
  <text x="188" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">两条序列的首个公共元素 = 10</text>

  <text x="58" y="262" font-size="11.5" fill="#333" filter="url(#sk)">公式：gcd(2,5)=1（互质）</text>
  <text x="58" y="284" font-size="11.5" fill="#333" filter="url(#sk)">ans = 2×5 / 1 = 10 = 2n ✓</text>
  <text x="188" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">奇数：缺因子 2 → 补成 2n</text>

  <g filter="url(#sk)"><rect x="346" y="60" width="292" height="290" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="492" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">n = 6（偶数）</text>
  <text x="492" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">沿 n 的倍数序列找首个偶数</text>

  <text x="362" y="134" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">6 的倍数：</text>
  <g filter="url(#sk)"><rect x="444" y="120" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="470" y="139" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="504" y="120" width="52" height="28" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="530" y="139" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">12…</text>

  <text x="470" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 6 = 2×3，第一步就命中</text>

  <text x="362" y="196" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2 的倍数：</text>
  <g filter="url(#sk)"><rect x="444" y="182" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="461" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="484" y="182" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="501" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="524" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="541" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">6</text>
  <text x="492" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">首个公共元素 = 6，n 自身</text>

  <text x="362" y="262" font-size="11.5" fill="#333" filter="url(#sk)">公式：gcd(2,6)=2（2 整除 6）</text>
  <text x="362" y="284" font-size="11.5" fill="#333" filter="url(#sk)">ans = 2×6 / 2 = 6 = n ✓</text>
  <text x="492" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">偶数：已含因子 2 → 原样返回 n</text>

  <g filter="url(#sk)"><rect x="42" y="370" width="596" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">规律一目了然：答案只可能是 n 或 2n，二选一由奇偶决定</text>
  <text x="340" y="420" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">倍数序列里第一个偶数：偶数 n 在 k=1 命中，奇数 n 在 k=2 命中</text>
  <text x="340" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">ans = n &lt;&lt; (n &amp; 1)</text>
</svg>
