<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 逐前缀走查：nums = [2,2,1,1,5,3,3,5]</text>
  <text x="360" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">每次命中形态就刷新 ans；L = 4、6、8 不合法</text>
  <rect x="40" y="70" width="640" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="71.0" y="95" text-anchor="middle" font-size="12" fill="#2f4d68" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="227.0" y="95" text-anchor="middle" font-size="12" fill="#2f4d68" font-weight="bold" filter="url(#rough2)">频率分布</text>
  <text x="385.0" y="95" text-anchor="middle" font-size="12" fill="#2f4d68" font-weight="bold" filter="url(#rough2)">maxF</text>
  <text x="518.0" y="95" text-anchor="middle" font-size="12" fill="#2f4d68" font-weight="bold" filter="url(#rough2)">命中形态</text>
  <text x="649.0" y="95" text-anchor="middle" font-size="12" fill="#2f4d68" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="40" y="106" width="640" height="36" fill="#f4faf6" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="114" y="131" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:1</text>
  <text x="385" y="131" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">1</text>
  <text x="518" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="649" y="131" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="40" y="106" width="640" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="142" width="640" height="36" fill="#f4faf6" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="114" y="167" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2</text>
  <text x="385" y="167" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="649" y="167" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="40" y="142" width="640" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="178" width="640" height="36" fill="#f4faf6" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="114" y="203" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2, 1:1</text>
  <text x="385" y="203" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="203" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② ③</text>
  <text x="649" y="203" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="40" y="178" width="640" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="214" width="640" height="36" fill="#fdf3f4" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="114" y="239" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2, 1:2</text>
  <text x="385" y="239" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">不满足</text>
  <text x="649" y="239" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="40" y="250" width="640" height="36" fill="#f4faf6" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="114" y="275" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2, 1:2, 5:1</text>
  <text x="385" y="275" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="649" y="275" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="40" y="250" width="640" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="286" width="640" height="36" fill="#fdf3f4" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="311" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="114" y="311" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2, 1:2, 5:1, 3:1</text>
  <text x="385" y="311" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="311" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">不满足</text>
  <text x="649" y="311" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="40" y="322" width="640" height="36" fill="#f4faf6" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="347" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="114" y="347" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2, 1:2, 5:1, 3:2</text>
  <text x="385" y="347" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="649" y="347" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="40" y="322" width="640" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="358" width="640" height="36" fill="#fdf3f4" stroke="#d5dde6" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="71" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="114" y="383" text-anchor="start" font-size="11" fill="#445566" filter="url(#rough2)">2:2, 1:2, 5:2, 3:2</text>
  <text x="385" y="383" text-anchor="middle" font-size="11.5" fill="#445566" filter="url(#rough2)">2</text>
  <text x="518" y="383" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">不满足</text>
  <text x="649" y="383" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="360" y="418" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">L = 4 不合法而 L = 5 合法 ⇒ 合法性不单调，不能二分答案</text>
</svg>
