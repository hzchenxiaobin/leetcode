<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">连续段分解：特殊子串由 (字符, 长度) 唯一确定</text>
  <path d="M 250 42 Q 470 52 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells: a a a | b | a a a -->
  <text x="80" y="80" font-size="13" fill="#2b2b2b">以 s = "aaabaaa" 为例（本题官方示例之外的多段例子）：</text>
  <g filter="url(#sk)">
    <rect x="80" y="96" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="126" y="96" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="96" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="96" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="264" y="96" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="96" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="356" y="96" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="102" y="122" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="148" y="122" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="194" y="122" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="240" y="122" text-anchor="middle" font-size="15" fill="#7a5415">b</text>
  <text x="286" y="122" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="332" y="122" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="378" y="122" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="102" y="86" text-anchor="middle" font-size="11" fill="#446688">段 L=3</text>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="#b8862a">L=1</text>
  <text x="332" y="86" text-anchor="middle" font-size="11" fill="#446688">段 L=3</text>
  <text x="470" y="128" font-size="12" fill="#555">→ 拆成极大同字符段，按字符归组</text>
  <path d="M 400 116 L 430 116" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- runs buckets -->
  <g filter="url(#sk)">
    <rect x="80" y="170" width="380" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="194" font-size="13" font-weight="bold" fill="#2e6e2e">runs（每字符的段长列表）</text>
  <text x="100" y="216" font-size="12" fill="#333" font-family="monospace">a: [3, 3]    b: [1]</text>
  <text x="100" y="234" font-size="10" fill="#888">一个字符无论出现在哪些位置，都只关心它的段长集合</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="480" y="170" width="380" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="500" y="194" font-size="13" font-weight="bold" fill="#8e3a34">贡献公式：长度 k 的段内出现次数</text>
  <text x="500" y="216" font-size="13" fill="#333" font-family="monospace">段长 L → 出现 max(0, L − k + 1) 次</text>
  <text x="500" y="234" font-size="10" fill="#888">= 段内可放长度 k 滑窗的起点数，k &gt; L 时为 0</text>

  <!-- sliding window illustration -->
  <text x="80" y="278" font-size="13" fill="#2b2b2b">长 L = 5 的段 "aaaaa"，取 k = 2 → 4 个起点（重叠也算）：</text>
  <g filter="url(#sk)">
    <rect x="80" y="292" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="122" y="292" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="164" y="292" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="206" y="292" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="248" y="292" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="80" y="296" width="80" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="122" y="296" width="80" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 3"/>
    <rect x="164" y="296" width="80" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 4"/>
    <rect x="206" y="296" width="80" height="26" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="2 5"/>
  </g>
  <text x="100" y="314" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="142" y="314" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="184" y="314" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="226" y="314" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="268" y="314" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="320" y="314" font-size="12" fill="#8e3a34" font-family="monospace">5 − 2 + 1 = 4 次 ✓</text>

  <!-- counting collapse -->
  <g filter="url(#sk)">
    <rect x="80" y="360" width="780" height="118" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 3"/>
  </g>
  <text x="100" y="388" font-size="14" font-weight="bold" fill="#2b2b2b">问题坍缩：从「数子串」到「数段」</text>
  <text x="100" y="412" font-size="12" fill="#444">· 枚举子串：O(n²) 个起点-终点对，每个还要判「是否全同字符」</text>
  <text x="100" y="434" font-size="12" fill="#444">· 按 (字符 c, 长度 k) 计数：仅 26 × n 个键，每个键的出现次数用段长公式直接求和：</text>
  <text x="430" y="466" text-anchor="middle" font-size="14" fill="#446688" font-family="monospace" font-weight="bold">count(c, k) = Σ max(0, Li − k + 1)   （对 c 的各段 Li 求和）</text>

  <!-- monotonicity hint -->
  <g filter="url(#sk)">
    <rect x="80" y="496" width="780" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="524" font-size="14" font-weight="bold" fill="#2e6e2e">单调性：k 可行 ⇒ k−1 也可行（可行长度是前缀区间 [1, K]）</text>
  <text x="100" y="548" font-size="12" fill="#444">把 cᵏ 的 3 个出现各砍掉末尾一个字符，得到同一起点上的 3 次 cᵏ⁻¹ 出现</text>
  <text x="100" y="568" font-size="12" fill="#2e6e2e" font-weight="bold">→ 「最大可行 k」满足二分性，二分答案即可</text>
</svg>
