<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="820" height="430" fill="#fafafa"/>

  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心不变量：剪掉的原树边把树切成两块，再把“n 所在那块”用新边挂回 1</text>
  <path d="M 52 38 Q 410 45 768 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">操作前（n = 7，v = 5）</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">操作后：新边 (1,5)，删掉 (1,2)</text>

  <path d="M 150 80 L 150 130" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="163" y="112" font-size="12" fill="#a14340" filter="url(#rough2)">剪断</text>

  <path d="M 150 80 L 262 130" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 130 L 85 195" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 130 L 215 195" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 85 195 L 42 258" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 215 195 L 215 258" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="150" cy="80" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="150" y="85" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <circle cx="150" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="262" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="135" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">6</text>
  <circle cx="85" cy="195" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="200" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="215" cy="195" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="200" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="42" cy="258" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="42" y="263" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">7</text>
  <circle cx="215" cy="258" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="215" y="263" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <text x="152" y="290" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">剪 (1,2)，加 (1,5)</text>
  <text x="152" y="306" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">整块 {2,3,4,5,7} 改挂到 5 上</text>

  <path d="M 340 52 L 340 300" stroke="#c9c9c9" stroke-width="1.4" fill="none" stroke-dasharray="5 6" filter="url(#rough2)"/>

  <path d="M 415 135 L 487 135" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 487 135 L 559 135" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 559 135 L 631 135" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 631 135 L 703 135" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 703 135 L 775 135" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 415 135 L 415 208" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="415" cy="135" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="415" y="140" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <circle cx="487" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="487" y="140" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">5</text>
  <circle cx="559" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="559" y="140" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="631" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="631" y="140" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="703" cy="135" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="703" y="140" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="775" cy="135" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="775" y="140" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">7</text>
  <circle cx="415" cy="208" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="213" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">6</text>

  <text x="600" y="180" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">1 → 5 → 4 → 2 → 3 → 7：5 条边</text>
  <text x="600" y="240" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">块 {2,3,4,5,7} 内部一条边都没变</text>
  <text x="600" y="260" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">所以 dist(5,7) 仍是原来的 4</text>

  <rect x="34" y="312" width="752" height="104" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="336" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 新边一律是 (1, x)：除含 1 的那块，其余连通块都直接挂在 1 上</text>
  <text x="52" y="360" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">② 剪掉的全是原树边 ⇒ 每块仍是原树的连通子树，块内两点距离永远不变</text>
  <text x="52" y="384" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">③ 故 dep(n) 只能是 dep_原(n)，或者“1 + dist_原(v_i, n)”（v_i 为某次操作的顶点）</text>
  <text x="52" y="406" font-size="12" fill="#a14340" filter="url(#rough2)">④ 想变长，n 必须落在被剪下的一侧：即 c 同时是 v_i 与 n 的祖先，且 c ≠ 1</text>
</svg>
