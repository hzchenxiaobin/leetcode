<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算："leet" → "code"，所有代价均为 1</text>

  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="86" y="62">位置 / 转换</text>
    <text x="216" y="62">向后步数</text>
    <text x="316" y="62">向前步数</text>
    <text x="412" y="62">取小</text>
    <text x="490" y="62">逐位代价</text>
  </g>
  <path d="M 34 72 L 526 72" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="86" y="100">0：l(11) → c(2)</text>
    <text x="216" y="100">17</text>
    <text x="316" y="100">9</text>
    <text x="412" y="100" font-weight="bold" fill="#4a7a3a">9</text>
    <text x="490" y="100">9</text>

    <text x="86" y="132">1：e(4) → o(14)</text>
    <text x="216" y="132">10</text>
    <text x="316" y="132">16</text>
    <text x="412" y="132" font-weight="bold" fill="#446688">10</text>
    <text x="490" y="132">10</text>

    <text x="86" y="164">2：e(4) → d(3)</text>
    <text x="216" y="164">25</text>
    <text x="316" y="164">1</text>
    <text x="412" y="164" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="490" y="164">1</text>

    <text x="86" y="196">3：t(19) → e(4)</text>
    <text x="216" y="196">11</text>
    <text x="316" y="196">15</text>
    <text x="412" y="196" font-weight="bold" fill="#446688">11</text>
    <text x="490" y="196">11</text>
  </g>
  <path d="M 34 210 L 526 210" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="150" y="222" width="260" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9 + 10 + 1 + 11 = 31</text>

  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">位置 0 绕远路（9 步）反而比"只差 2 个字母"更便宜吗？不 —— 17 步才是绕远路</text>
  <text x="280" y="314" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">代价取决于经过的出发位置，所以必须两边都算、再取小</text>
</svg>
