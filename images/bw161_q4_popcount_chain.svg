<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">popcount 链：每走一步把 x 换成它的 1 的个数</text>
  <rect x="64" y="110" width="64" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96.0" y="144.3" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">7</text>
  <text x="96" y="190" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">111</text>
  <path d="M 130 138 L 212 138" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="171.0" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">popcount</text>
  <rect x="214" y="110" width="64" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246.0" y="144.3" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
  <text x="246" y="190" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">11</text>
  <path d="M 280 138 L 362 138" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="321.0" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">popcount</text>
  <rect x="364" y="110" width="64" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396.0" y="144.3" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <text x="396" y="190" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">10</text>
  <path d="M 430 138 L 512 138" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="471.0" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">popcount</text>
  <rect x="514" y="110" width="64" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="546.0" y="144.3" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <text x="546" y="190" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="96" y="84" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">x</text>
  <text x="546" y="84" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">终点</text>
  <rect x="70" y="214" width="540" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="242" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">depth(x) = 1 + depth(popcount(x))，且 depth(1) = 0</text>
  <text x="340" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⇒ depth(7) = 3（7 → 3 → 2 → 1 共 3 步）</text>
  <text x="340" y="294" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">因为 popcount(x) &lt; x（x &gt; 1），链一定递减，必然到 1</text>
</svg>
