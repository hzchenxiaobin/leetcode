<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：min + max 只看「选了哪些数」——排序不改答案</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">子序列 = 下标子集，条件只依赖集合的最小 / 最大值 → 先排序，再固定最小值计数</text>

  <g filter="url(#rough2)">
    <rect x="30" y="58" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="58" y="77" text-anchor="middle" font-size="12" fill="#555">6</text>
    <rect x="88" y="58" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="116" y="77" text-anchor="middle" font-size="12" fill="#555">3</text>
    <rect x="146" y="58" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="174" y="77" text-anchor="middle" font-size="12" fill="#555">7</text>
    <rect x="204" y="58" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="232" y="77" text-anchor="middle" font-size="12" fill="#555">5</text>

    <path d="M272,72 C 300,52 330,52 356,68" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="314" y="50" text-anchor="middle" font-size="10.5" fill="#446688">排序 = 下标重排的双射</text>

    <rect x="366" y="58" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="394" y="77" text-anchor="middle" font-size="12" fill="#2b4a66">3</text>
    <rect x="424" y="58" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="452" y="77" text-anchor="middle" font-size="12" fill="#2b4a66">5</text>
    <rect x="482" y="58" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="510" y="77" text-anchor="middle" font-size="12" fill="#2b4a66">6</text>
    <rect x="540" y="58" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="568" y="77" text-anchor="middle" font-size="12" fill="#2b4a66">7</text>
    <text x="481" y="102" text-anchor="middle" font-size="10.5" fill="#888">排序前后子序列一一对应，min+max 不变</text>
  </g>

  <g filter="url(#rough2)">
    <text x="320" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">排序后：固定最小值 nums[i]，三段结构（示例 target = 9）</text>

    <rect x="86" y="142" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="114" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a">3</text>

    <rect x="146" y="142" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="174" y="160" text-anchor="middle" font-size="13" fill="#2b4a66">5</text>
    <text x="174" y="172" text-anchor="middle" font-size="9" fill="#446688">选? 不选?</text>

    <rect x="206" y="142" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="234" y="160" text-anchor="middle" font-size="13" fill="#2b4a66">6</text>
    <text x="234" y="172" text-anchor="middle" font-size="9" fill="#446688">选? 不选?</text>

    <rect x="266" y="142" width="56" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="294" y="160" text-anchor="middle" font-size="13" fill="#8a3a36">7</text>
    <text x="294" y="172" text-anchor="middle" font-size="9" fill="#b85450">一选就超!</text>

    <text x="114" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">i：必选 (min)</text>
    <text x="204" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">i+1 … j：自由选</text>
    <text x="294" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">&gt; j：禁选 (max 超标)</text>

    <rect x="370" y="140" width="244" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="386" y="162" font-size="11.5" font-weight="bold" fill="#b07818">j 的定义：满足</text>
    <text x="500" y="162" font-size="12" font-weight="bold" fill="#b07818">nums[i] + nums[j] ≤ target</text>
    <text x="386" y="182" font-size="11" fill="#8a6a20">的最大下标（示例中 i=0 → j=2，</text>
    <text x="386" y="196" font-size="11" fill="#8a6a20">因为 3 + 6 = 9 ≤ 9 而 3 + 7 = 10 &gt; 9）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="216" width="580" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="46" y="240" font-size="13" font-weight="bold" fill="#3a5a3a">以 i 为最小值的合法子序列数 = 2^(j−i)</text>
    <text x="50" y="262" font-size="11.5" fill="#3a4a66">i+1 … j 共 (j−i) 个位置，每个「选 / 不选」两种独立决策 → 乘法原理 2 × 2 × … × 2</text>
    <text x="50" y="282" font-size="11.5" fill="#3a4a66">示例：i=0, j=2 → 2² = 4 个：[3]、[3,5]、[3,6]、[3,5,6]，其中 max 可以是 3、5、6 中的任何一个</text>
    <text x="50" y="299" font-size="11.5" font-weight="bold" fill="#b85450">注意：j 只是「允许的上界」，max 不必选！不是 2^(j−i−1)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="316" width="580" height="70" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="46" y="338" font-size="12" font-weight="bold" fill="#2b4a66">几何级数视角（两种数法等价）：</text>
    <text x="50" y="358" font-size="11.5" fill="#3a4a66">按 max 分类：1（只选 i） + 2⁰（必选 i,i+1） + 2¹（必选 i,i+2） + … + 2^(j−i−1)（必选 i,j）</text>
    <text x="50" y="376" font-size="12" font-weight="bold" fill="#4a7a3a">= 1 + (2^(j−i) − 1) = 2^(j−i)   —— 逐对枚举是 O(n²)，级数求和一步到位 O(1)</text>
  </g>
</svg>
