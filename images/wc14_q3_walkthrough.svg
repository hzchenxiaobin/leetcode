<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：s = "2-5g-3-J"，k = 2，从右往左读</text>
  <text x="280" y="46" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">res 是「反向」暂存串，所以每组成员的书写顺序与最终答案相反，最后统一翻转</text>

  <rect x="36" y="60" width="496" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="80" font-size="11" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">i / 读入</text>
  <text x="211" y="80" font-size="11" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">动作</text>
  <text x="386" y="80" font-size="11" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">反向串 res</text>
  <text x="499" y="80" font-size="11" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">cnt</text>

  <rect x="36" y="92" width="496" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="111" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">i=7  'J'</text>
  <text x="126" y="111" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">cnt=0 &lt; k，直接写入 J</text>
  <text x="386" y="111" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J"</text>
  <text x="499" y="111" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="122" width="496" height="30" fill="#f4f4f4" stroke="#cfcfcf" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="141" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i=6  '-'</text>
  <text x="126" y="141" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">破折号丢弃，i 继续左移</text>
  <text x="386" y="141" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J"</text>
  <text x="499" y="141" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="36" y="152" width="496" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="171" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">i=5  '3'</text>
  <text x="126" y="171" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">cnt=1 &lt; k，写入 3</text>
  <text x="386" y="171" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J3"</text>
  <text x="499" y="171" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="182" width="496" height="30" fill="#f4f4f4" stroke="#cfcfcf" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="201" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i=4  '-'</text>
  <text x="126" y="201" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">破折号丢弃，cnt 不变</text>
  <text x="386" y="201" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J3"</text>
  <text x="499" y="201" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>

  <rect x="36" y="212" width="496" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="76" y="231" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">i=3  'g'</text>
  <text x="126" y="231" font-size="10" fill="#3c6630" text-anchor="start" filter="url(#rough2)">cnt==k → 先补 '-'，再写大写 G</text>
  <text x="386" y="231" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J3-G"</text>
  <text x="499" y="231" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="242" width="496" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="261" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">i=2  '5'</text>
  <text x="126" y="261" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">cnt=1 &lt; k，写入 5</text>
  <text x="386" y="261" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J3-G5"</text>
  <text x="499" y="261" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="272" width="496" height="30" fill="#f4f4f4" stroke="#cfcfcf" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="291" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">i=1  '-'</text>
  <text x="126" y="291" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">破折号丢弃，cnt 不变</text>
  <text x="386" y="291" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J3-G5"</text>
  <text x="499" y="291" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>

  <rect x="36" y="302" width="496" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="76" y="321" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">i=0  '2'</text>
  <text x="126" y="321" font-size="10" fill="#3c6630" text-anchor="start" filter="url(#rough2)">cnt==k → 先补 '-'，再写 2</text>
  <text x="386" y="321" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">"J3-G5-2"</text>
  <text x="499" y="321" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 280 332 L 280 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="348" font-size="10" fill="#666" text-anchor="start" filter="url(#rough2)">reverse</text>

  <rect x="120" y="354" width="320" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="280" y="372" font-size="11" fill="#7a5a18" text-anchor="middle" filter="url(#rough2)">"J3-G5-2" 整体翻转</text>
  <text x="280" y="389" font-size="12.5" fill="#3c6630" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2-5G-3J ✓</text>
</svg>
