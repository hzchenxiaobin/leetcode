<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">g(m) 的滑动窗口：对每个右端点 r 贪心收缩出 l_max</text>

  <!-- 开始 -->
  <rect x="40" y="40" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="115" y="61" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">开始：l = 0，计数清零</text>

  <!-- r 右移 -->
  <path d="M 115 74 L 115 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="40" y="94" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">r 右移一格，纳入 word[r]</text>
  <text x="115" y="126" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">元音 → 计数 +1；辅音 → consonants +1</text>

  <!-- 菱形判断 -->
  <path d="M 115 134 L 115 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <polygon points="115,152 195,186 115,220 35,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="182" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">[l, r] 满足？</text>
  <text x="115" y="197" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">5 元音齐 且辅音 ≥ m</text>

  <!-- 是：收缩 -->
  <path d="M 195 186 L 250 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="222" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="254" y="164" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="319" y="182" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">移出 word[l]，l++</text>
  <text x="319" y="198" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（收缩后回到判断）</text>
  <path d="M 319 164 C 319 140, 230 128, 168 148" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 否：累加 -->
  <path d="M 115 220 L 115 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="132" y="234" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="40" y="240" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115" y="256" text-anchor="middle" font-size="11" fill="#2a4a22" filter="url(#rough2)">ans += l</text>
  <text x="115" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">l−1 = l_max，恰好 l_max+1 个左端点</text>

  <!-- r 扫完？ -->
  <path d="M 115 280 L 115 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <polygon points="115,298 175,322 115,346 55,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="326" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">r &lt; n ？</text>
  <path d="M 55 322 C 20 322, 20 114, 38 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="24" y="220" font-size="9.5" fill="#446688" filter="url(#rough2)">回到 r 右移</text>

  <!-- 结束 -->
  <path d="M 175 322 L 210 322" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="192" y="314" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="214" y="304" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="262" y="326" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">返回 ans</text>

  <!-- 右侧汇总框 -->
  <rect x="330" y="240" width="176" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="418" y="264" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">主流程只调两次</text>
  <text x="418" y="286" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">answer = g(k) − g(k+1)</text>
  <text x="418" y="306" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">g(k)：辅音 ≥ k 的都算上</text>
  <text x="418" y="322" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">g(k+1)：把 ≥ k+1 的减掉</text>

  <!-- 不变式注释 -->
  <path d="M 254 208 C 240 230, 240 250, 252 258" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="286" y="132" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">不变式：l 只前进不回退</text>
  <text x="286" y="146" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">（l_max 随 r 单调不减）</text>
</svg>
