<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" />
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a" />
    </marker>
  </defs>
  <rect width="780" height="372" fill="#fafafa" filter="url(#rough2)" />

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍扫描：先统计 sf(a_i)，再逐个 j 维护奇次质因子集合 S</text>
  <text x="390" y="55" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">sf(P_j) 本身可能大得存不下，但「它含哪些质因子」只需要一个集合</text>

  <rect x="26" y="74" width="212" height="88" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="40" y="98" font-size="12.5" font-weight="bold" fill="#2f4f70" filter="url(#rough2)">① 分解每个 a_i</text>
  <text x="40" y="120" font-size="11.5" fill="#3a3a3a" filter="url(#rough2)">只保留指数为奇数的质因子</text>
  <text x="40" y="140" font-size="11.5" fill="#3a3a3a" filter="url(#rough2)">freq[sf(a_i)] += 1（sf ≤ 10⁶）</text>

  <rect x="282" y="74" width="218" height="88" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
  <text x="296" y="98" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">② 扫 j = 1..n</text>
  <text x="296" y="120" font-size="11.5" fill="#3a3a3a" filter="url(#rough2)">把 sf(a_j) 的质因子在 S 中翻转</text>
  <text x="296" y="140" font-size="11.5" fill="#3a3a3a" filter="url(#rough2)">翻转后 S 就是 sf(P_j) 的质因子</text>

  <rect x="544" y="74" width="210" height="88" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="558" y="98" font-size="12.5" font-weight="bold" fill="#a03a36" filter="url(#rough2)">③ |S| ≤ 7 吗？</text>
  <text x="558" y="120" font-size="11.5" fill="#3a3a3a" filter="url(#rough2)">是 → 连乘得到 sf(P_j) 精确值</text>
  <text x="558" y="140" font-size="11.5" fill="#3a3a3a" filter="url(#rough2)">否 → 必然 &gt; 10⁶，直接跳过</text>

  <path d="M240,118 L276,118" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />
  <path d="M502,118 L538,118" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />

  <rect x="112" y="196" width="556" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)" />
  <text x="390" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">若 sf(P_j) ≤ 10⁶ 则 ans += freq[sf(P_j)]，否则该 j 贡献 0</text>
  <text x="390" y="245" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">元素翻转用 pos[] + 尾部交换，每步 O(1)；每个 a_i 至多 7 个奇次质因子</text>
  <path d="M649,164 L649,192" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />

  <text x="390" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">8 个最小质数之积 2·3·5·7·11·13·17·19 = 9699690 &gt; 10⁶</text>
  <text x="390" y="316" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">所以 |S| ≥ 8 时 sf(P_j) 必定超过 10⁶，而所有 sf(a_i) ≤ 10⁶，不可能相等</text>
  <text x="390" y="340" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">|S| ≤ 7 时边乘边判 &gt; 10⁶ 即停，乘法最多 7 次，绝不会溢出</text>
</svg>
