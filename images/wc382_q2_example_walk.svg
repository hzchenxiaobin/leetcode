<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [5, 4, 1, 2, 2]</text>
  <path d="M 210 38 Q 320 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- counter table -->
  <text x="535" y="52" text-anchor="middle" font-size="11" fill="#888">计数表 cnt</text>
  <g filter="url(#sk)">
    <rect x="460" y="58"  width="75" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="535" y="58"  width="75" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="460" y="80"  width="75" height="22" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="535" y="80"  width="75" height="22" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="460" y="102" width="75" height="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="535" y="102" width="75" height="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="460" y="124" width="75" height="22" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="535" y="124" width="75" height="22" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="460" y="146" width="75" height="22" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="535" y="146" width="75" height="22" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#2b5d85" text-anchor="middle">
    <text x="497" y="73" font-weight="bold">值 v</text>
    <text x="572" y="73" font-weight="bold">份数</text>
    <text x="497" y="95">1</text>
    <text x="572" y="95">1</text>
    <text x="497" y="117" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="572" y="117" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="497" y="139">4</text>
    <text x="572" y="139">1</text>
    <text x="497" y="161">5</text>
    <text x="572" y="161">1</text>
  </g>

  <!-- row 1: x = 1 -->
  <text x="118" y="104" text-anchor="end" font-size="12" fill="#5a4480" font-weight="bold">起点 x = 1</text>
  <g filter="url(#sk)">
    <rect x="130" y="84" width="220" height="32" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4"/>
  </g>
  <text x="240" y="105" text-anchor="middle" font-size="11" fill="#5a4480">特判：c₁ = 1（奇数）→ 候选 1</text>
  <g filter="url(#sk)">
    <rect x="350" y="84" width="64" height="32" rx="8" fill="#fdfcf7" stroke="#8a6db5" stroke-width="1.2"/>
  </g>
  <text x="382" y="105" text-anchor="middle" font-size="13" fill="#5a4480" font-weight="bold">= 1</text>

  <!-- row 2: x = 2 (winner) -->
  <text x="118" y="164" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">起点 x = 2</text>
  <g filter="url(#sk)">
    <rect x="130" y="144" width="56" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="158" y="166" text-anchor="middle" font-size="14" fill="#2b5d85" font-weight="bold">2</text>
  <text x="158" y="138" text-anchor="middle" font-size="10" fill="#4a8edb">+2（cnt ≥ 2）</text>
  <path d="M 188 161 L 221 161" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="225" y="144" width="56" height="34" rx="6" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="253" y="166" text-anchor="middle" font-size="14" fill="#a06b1a" font-weight="bold">4</text>
  <text x="253" y="192" text-anchor="middle" font-size="10" fill="#c98a2b">峰值 +1（cnt = 1）</text>
  <g filter="url(#sk)">
    <rect x="350" y="144" width="64" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="382" y="165" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">= 3 ★</text>

  <!-- row 3: x = 4 -->
  <text x="118" y="224" text-anchor="end" font-size="12" fill="#2b5d85" font-weight="bold">起点 x = 4</text>
  <g filter="url(#sk)">
    <rect x="130" y="204" width="56" height="34" rx="6" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="158" y="226" text-anchor="middle" font-size="14" fill="#a06b1a" font-weight="bold">4</text>
  <text x="265" y="226" text-anchor="middle" font-size="10" fill="#888">cnt = 1 → 只能当峰值</text>
  <g filter="url(#sk)">
    <rect x="350" y="204" width="64" height="32" rx="8" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="382" y="225" text-anchor="middle" font-size="13" fill="#2b5d85" font-weight="bold">= 1</text>
  <text x="510" y="226" text-anchor="middle" font-size="10" fill="#888">16 不在表中，无法延伸</text>

  <!-- row 4: x = 5 -->
  <text x="118" y="284" text-anchor="end" font-size="12" fill="#2b5d85" font-weight="bold">起点 x = 5</text>
  <g filter="url(#sk)">
    <rect x="130" y="264" width="56" height="34" rx="6" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="158" y="286" text-anchor="middle" font-size="14" fill="#a06b1a" font-weight="bold">5</text>
  <text x="265" y="286" text-anchor="middle" font-size="10" fill="#888">cnt = 1 → 只能当峰值</text>
  <g filter="url(#sk)">
    <rect x="350" y="264" width="64" height="32" rx="8" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="382" y="285" text-anchor="middle" font-size="13" fill="#2b5d85" font-weight="bold">= 1</text>

  <!-- final result -->
  <g filter="url(#sk)">
    <rect x="30" y="330" width="580" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 3：取子集 {2, 2, 4}，排成 [2, 4, 2]（2² = 4 ✓）</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a">四个起点的候选分别为 1、3、1、1，最大者胜出</text>
</svg>
