<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：nums = [6,3,1,2,4,4]，k = 7（答案 17）</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">从右往左枚举 l；绿色 = 累计代价 ≤ k，红色 = 超限；r* = 最后一个绿色位置</text>

  <!-- ===== left: per-l table ===== -->
  <text x="58" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">l</text>
  <text x="130" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b（前缀最大）</text>
  <text x="267" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">f_l(r) 累计代价</text>
  <text x="387" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r*（贡献）</text>
  <line x1="40" y1="94" x2="425" y2="94" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="58" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="130" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="267" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">0</text>
  <text x="387" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5（+1）</text>

  <text x="58" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4,4]</text>
  <text x="267" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">0, 0</text>
  <text x="387" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5（+2）</text>

  <text x="58" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2,4,4]</text>
  <text x="267" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">0, 2, 2</text>
  <text x="387" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5（+3）</text>

  <text x="58" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="206" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2,4,4]</text>
  <text x="267" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">0, 1, 3, 3</text>
  <text x="387" y="206" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5（+4）</text>

  <text x="58" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3,3,3,4,4]</text>
  <text x="267" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">0, 2, 3, 3, 3</text>
  <text x="387" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5（+5）</text>

  <g filter="url(#rough2)"><rect x="36" y="250" width="392" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="58" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="130" y="271" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">[6,6,6,6,6,6]</text>
  <text x="192" y="271" font-size="10.5" font-weight="bold" filter="url(#rough2)"><tspan fill="#2c5f2c">0, 3,</tspan><tspan fill="#b85450"> 8, 12, 14, 16</tspan></text>
  <text x="387" y="271" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1（+2）</text>

  <line x1="40" y1="290" x2="425" y2="290" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">Σ 贡献 = 1+2+3+4+5+2 = 17 ✓</text>
  <text x="230" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个 l 独立二分，不依赖 r* 的单调性</text>

  <!-- ===== right: l=0 crossing ===== -->
  <text x="585" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">l=0：水位线一路抬到 6</text>

  <line x1="450" y1="300" x2="725" y2="300" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="453" y="222" width="34" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="499" y="261" width="34" height="39" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="545" y="287" width="34" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="591" y="274" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="637" y="248" width="34" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="683" y="248" width="34" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="499" y="222" width="34" height="39" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="545" y="222" width="34" height="65" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="591" y="222" width="34" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="637" y="222" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="683" y="222" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <path d="M 453 222 L 717 222" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <text x="470" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">0</text>
  <text x="516" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="562" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="608" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">12</text>
  <text x="654" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">14</text>
  <text x="700" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">16</text>

  <line x1="539" y1="200" x2="539" y2="300" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="539" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">r* = 1</text>

  <text x="470" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="516" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="562" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="608" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="654" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="700" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="470" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="516" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="562" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="608" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="654" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="700" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <text x="585" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">累计 3 ≤ k=7 &lt; 8 ⇒ r*(0) = 1</text>

  <!-- ===== bottom strip ===== -->
  <g filter="url(#rough2)"><rect x="40" y="366" width="680" height="90" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="60" y="390" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">两轮二分（l=0 现场演示）：先定台阶 j，再在台阶内定 r</text>
  <text x="60" y="412" font-size="11" fill="#444" filter="url(#rough2)">台阶定位：找最小 j 使 T₀ − T_{j+1} &gt; k（T 沿栈自顶向底递增，可二分）；本例整条只有一级台阶，直接 j=0</text>
  <text x="60" y="432" font-size="11" fill="#444" filter="url(#rough2)">台阶内二分：g(r) = v·r − pre[r+1] 单调不减（增量 = v − nums[r+1] ≥ 0），二分最大 r 使 g(r) ≤ RHS</text>
  <text x="60" y="452" font-size="11" fill="#444" filter="url(#rough2)">代入：RHS = k − T₀ + Tⱼ + v·(qⱼ−1) − pre[qⱼ] = 7 − 16 + 16 + 6×(−1) − 0 = 1 → g(1)=−3 ≤ 1 &lt; 2=g(2) → r*=1 ✓</text>
</svg>
