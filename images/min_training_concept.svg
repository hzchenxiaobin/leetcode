<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="445" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：精力看总账，经验看逐场</text>
  <path d="M 170 40 Q 320 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel 1: energy -->
  <text x="60" y="68" font-size="14" font-weight="bold" fill="#2b6e9e">① 精力：只减不增 ⇒ 一锤定音看总账</text>
  <text x="64" y="97" text-anchor="end" font-size="10.5" fill="#666">战前总精力</text>
  <text x="64" y="143" text-anchor="end" font-size="10.5" fill="#666">对手总消耗</text>
  <g filter="url(#sk)">
    <rect x="70" y="78" width="100" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="170" y="78" width="120" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="120" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">E₀ = 5</text>
  <text x="230" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">训练 t_E = 6</text>
  <g filter="url(#sk)">
    <rect x="70" y="124" width="20" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="90" y="124" width="80" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="170" y="124" width="60" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="230" y="124" width="40" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">
    <text x="80" y="144">1</text>
    <text x="130" y="144">4</text>
    <text x="200" y="144">3</text>
    <text x="250" y="144">2</text>
  </g>
  <path d="M 290 72 L 290 162" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="297" y="91" font-size="12" font-weight="bold" fill="#4a8e4a">11 &gt; 10 ✓</text>
  <g filter="url(#sk)">
    <rect x="390" y="78" width="230" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="505" y="103" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e6e2e">t_E = max(0, S + 1 − E₀)</text>
  <text x="505" y="126" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e6e2e">= 10 + 1 − 5 = 6 小时</text>
  <text x="70" y="176" font-size="11.5" fill="#7a5415">前缀和逐场抬高门槛 ⇒ 最紧在最后一场：E₀ + t_E &gt; Σenergy[i] = S</text>
  <path d="M 40 194 Q 320 202 600 194" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- panel 2: experience -->
  <text x="60" y="220" font-size="14" font-weight="bold" fill="#2e6e2e">② 经验：只增不减 ⇒ 逐场判定，缺多少补多少</text>
  <path d="M 60 396 L 430 396" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <!-- threshold ticks -->
  <g stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#sk)">
    <path d="M 118 380 L 162 380"/>
    <path d="M 193 348 L 237 348"/>
    <path d="M 268 372 L 312 372"/>
    <path d="M 343 388 L 387 388"/>
  </g>
  <g font-size="11" fill="#b85450" font-weight="bold">
    <text x="166" y="384">2</text>
    <text x="241" y="352">6</text>
    <text x="316" y="376">3</text>
    <text x="391" y="384">1</text>
  </g>
  <!-- experience step line -->
  <path d="M 80 372 L 140 372 L 140 356 L 213 356" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 213 340 L 213 292 L 290 292 L 290 268 L 365 268 L 365 260 L 410 260" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <!-- training lift arrow -->
  <path d="M 207 356 L 207 344" stroke="#c98a2b" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="352" text-anchor="end" font-size="11" font-weight="bold" fill="#c98a2b">补 2 小时</text>
  <!-- value labels -->
  <g font-size="12" font-weight="bold" fill="#2e6e2e">
    <text x="80" y="364" text-anchor="middle">3</text>
    <text x="140" y="348" text-anchor="middle">5</text>
    <text x="224" y="334">7</text>
    <text x="213" y="284" text-anchor="middle">13</text>
    <text x="290" y="260" text-anchor="middle">16</text>
    <text x="398" y="252" text-anchor="middle">17</text>
  </g>
  <!-- fight labels -->
  <g text-anchor="middle" font-size="11" fill="#888">
    <text x="140" y="414">第 0 场</text>
    <text x="215" y="414">第 1 场</text>
    <text x="290" y="414">第 2 场</text>
    <text x="365" y="414">第 3 场</text>
  </g>
  <!-- annotation box -->
  <g filter="url(#sk)">
    <rect x="445" y="248" width="180" height="100" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" fill="#7a5415">
    <text x="535" y="272" font-size="12">胜利滚雪球：</text>
    <text x="535" y="291" font-size="12" font-family="monospace">cur += exp[i]</text>
    <text x="535" y="313" font-size="12">不足时恰补压线：</text>
    <text x="535" y="332" font-size="12" font-family="monospace">cur = exp[i] + 1</text>
  </g>
  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#888">绿线：你的经验 · 红色虚刻度：对手经验门槛（须严格超过）· 橙色箭头：训练补差</text>
</svg>
