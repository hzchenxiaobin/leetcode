<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：按 minSize 降序离线回答（rooms/queries 见题面）</text>

  <!-- 查询 1 -->
  <rect x="40" y="48" width="480" height="88" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="40" y="48" width="10" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="72" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 回答查询 [pref=2, minSize=5]</text>
  <text x="62" y="92" font-size="11" fill="#333" filter="url(#rough2)">面积 ≥ 5 的房间只有 (id=3, size=5) → 入库后 ids = { 3 }</text>
  <text x="62" y="112" font-size="11" fill="#333" filter="url(#rough2)">pref=2：无前驱（2 不在集合中，3 之前没有元素）；后继 3，|3−2| = 1 → 答案 3</text>
  <text x="488" y="112" font-size="12" fill="#2f5226" font-weight="bold" text-anchor="end" filter="url(#rough2)">ans = 3</text>

  <!-- 查询 2 -->
  <rect x="40" y="146" width="480" height="88" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="40" y="146" width="10" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="170" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 回答查询 [pref=2, minSize=4]</text>
  <text x="62" y="190" font-size="11" fill="#333" filter="url(#rough2)">指针前进：(id=1, size=4) 入库 → ids = { 1, 3 }</text>
  <text x="62" y="210" font-size="11" fill="#333" filter="url(#rough2)">pref=2：前驱 1（|1−2|=1）、后继 3（|3−2|=1）→ 距离平局，取较小 id</text>
  <text x="488" y="210" font-size="12" fill="#2f5226" font-weight="bold" text-anchor="end" filter="url(#rough2)">ans = 1</text>

  <!-- 查询 3 -->
  <rect x="40" y="244" width="480" height="88" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="40" y="244" width="10" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="268" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">③ 回答查询 [pref=2, minSize=3]</text>
  <text x="62" y="288" font-size="11" fill="#333" filter="url(#rough2)">指针前进：(id=2, size=3) 入库 → ids = { 1, 2, 3 }</text>
  <text x="62" y="308" font-size="11" fill="#333" filter="url(#rough2)">pref=2：lower_bound 恰好命中 2（距离 0，后继判定即胜出）</text>
  <text x="488" y="308" font-size="12" fill="#2f5226" font-weight="bold" text-anchor="end" filter="url(#rough2)">ans = 2</text>

  <!-- 汇总 -->
  <rect x="40" y="346" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="62" y="372" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">按查询原下标回填：原顺序 queries = [[2,3], [2,4], [2,5]]</text>
  <text x="62" y="394" font-size="11.5" fill="#2f5226" filter="url(#rough2)">answer = [ 2, 1, 3 ]（第 ③②① 个回答依次回填）✓ 与官方输出一致</text>
</svg>
