<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="404" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两趟扫描，O(m + n + |indices|)</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把所有操作折叠成「行奇偶数组 + 列奇偶数组」</text>

  <rect x="120" y="62" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="88" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">读入 m、n、indices；row[m]、col[n] 全置 0</text>

  <path d="M 270 104 L 270 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="126" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">遍历每个 [r, c]</text>
  <text x="270" y="170" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">row[r] ^= 1 ；col[c] ^= 1（加一次翻转一次，不必累加）</text>

  <path d="M 270 182 L 270 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="204" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="231" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">R = Σ row[i]，C = Σ col[j]（数 1 的个数）</text>

  <path d="M 270 248 L 270 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="270" width="350" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="297" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 R·(n − C) + (m − R)·C</text>

  <rect x="72" y="330" width="396" height="56" fill="#f5f5f5" stroke="#999" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">时间：O(|indices| + m + n)　空间：O(m + n)</text>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">正好达到题目「进阶」要求，且不构造 m×n 矩阵</text>
</svg>
