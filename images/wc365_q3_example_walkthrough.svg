<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 505" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="88" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="505" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,2,3]，target = 17</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">S = 6 → k = 2、r = 5；翻倍数组 B = [1,2,3,1,2,3]，滑窗找和恰为 5 的最短窗口</text>

  <!-- legend -->
  <rect x="452" y="56" width="12" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="468" y="66" font-size="10.5" fill="#555" filter="url(#sk)">在窗内</text>
  <rect x="524" y="56" width="12" height="12" rx="2" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="540" y="66" font-size="10.5" fill="#555" filter="url(#sk)">本轮弹出</text>
  <rect x="610" y="56" width="12" height="12" rx="2" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3" filter="url(#sk)"/>
  <text x="626" y="66" font-size="10.5" fill="#555" filter="url(#sk)">未入窗</text>

  <!-- column indices -->
  <g text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">
    <text x="114" y="78">0</text>
    <text x="154" y="78">1</text>
    <text x="194" y="78">2</text>
    <text x="234" y="78">3</text>
    <text x="274" y="78">4</text>
    <text x="314" y="78">5</text>
  </g>

  <!-- hit row backgrounds -->
  <rect x="40" y="184" width="612" height="46" rx="6" fill="#eef7ee" filter="url(#sk)"/>
  <rect x="40" y="346" width="612" height="46" rx="6" fill="#eef7ee" filter="url(#sk)"/>

  <!-- row 0: window {0} -->
  <text x="88" y="104" text-anchor="end" font-size="11.5" fill="#555" filter="url(#sk)">right=0</text>
  <g filter="url(#sk)">
    <rect x="96" y="82" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="136" y="82" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="176" y="82" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="216" y="82" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="256" y="82" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="296" y="82" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
  </g>
  <text x="114" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">1</text>
  <g text-anchor="middle" font-size="13" fill="#bbbbbb" filter="url(#sk)">
    <text x="154" y="104">2</text><text x="194" y="104">3</text><text x="234" y="104">1</text><text x="274" y="104">2</text><text x="314" y="104">3</text>
  </g>
  <text x="342" y="104" font-size="12" fill="#555" filter="url(#sk)">窗口 [1]，s = 1 ＜ 5</text>

  <!-- row 1: window {0,1} -->
  <text x="88" y="158" text-anchor="end" font-size="11.5" fill="#555" filter="url(#sk)">right=1</text>
  <g filter="url(#sk)">
    <rect x="96" y="136" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="136" y="136" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="176" y="136" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="216" y="136" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="256" y="136" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="296" y="136" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">
    <text x="114" y="158">1</text><text x="154" y="158">2</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#bbbbbb" filter="url(#sk)">
    <text x="194" y="158">3</text><text x="234" y="158">1</text><text x="274" y="158">2</text><text x="314" y="158">3</text>
  </g>
  <text x="342" y="158" font-size="12" fill="#555" filter="url(#sk)">窗口 [1,2]，s = 3 ＜ 5</text>

  <!-- row 2: pop 0, window {1,2} HIT -->
  <text x="88" y="212" text-anchor="end" font-size="11.5" fill="#555" filter="url(#sk)">right=2</text>
  <g filter="url(#sk)">
    <rect x="96" y="190" width="36" height="34" rx="4" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="136" y="190" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="176" y="190" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="216" y="190" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="256" y="190" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="296" y="190" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
  </g>
  <text x="114" y="212" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#sk)">1</text>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">
    <text x="154" y="212">2</text><text x="194" y="212">3</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#bbbbbb" filter="url(#sk)">
    <text x="234" y="212">1</text><text x="274" y="212">2</text><text x="314" y="212">3</text>
  </g>
  <text x="342" y="212" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">入 3 超了，弹 1 → [2,3]，s = 5 ✓ 记录 len = 2</text>

  <!-- row 3: pop 1, window {2,3} -->
  <text x="88" y="266" text-anchor="end" font-size="11.5" fill="#555" filter="url(#sk)">right=3</text>
  <g filter="url(#sk)">
    <rect x="96" y="244" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="136" y="244" width="36" height="34" rx="4" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="176" y="244" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="216" y="244" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="256" y="244" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="296" y="244" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#bbbbbb" filter="url(#sk)">
    <text x="114" y="266">1</text><text x="274" y="266">2</text><text x="314" y="266">3</text>
  </g>
  <text x="154" y="266" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#sk)">2</text>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">
    <text x="194" y="266">3</text><text x="234" y="266">1</text>
  </g>
  <text x="342" y="266" font-size="12" fill="#555" filter="url(#sk)">入 1 超了，弹 2 → [3,1]，s = 4 ＜ 5</text>

  <!-- row 4: pop 2, window {3,4} -->
  <text x="88" y="320" text-anchor="end" font-size="11.5" fill="#555" filter="url(#sk)">right=4</text>
  <g filter="url(#sk)">
    <rect x="96" y="298" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="136" y="298" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="176" y="298" width="36" height="34" rx="4" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="216" y="298" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="256" y="298" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="298" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#bbbbbb" filter="url(#sk)">
    <text x="114" y="320">1</text><text x="154" y="320">2</text><text x="314" y="320">3</text>
  </g>
  <text x="194" y="320" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#sk)">3</text>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">
    <text x="234" y="320">1</text><text x="274" y="320">2</text>
  </g>
  <text x="342" y="320" font-size="12" fill="#555" filter="url(#sk)">入 2 超了，弹 3 → [1,2]，s = 3 ＜ 5</text>

  <!-- row 5: pop 3, window {4,5} HIT -->
  <text x="88" y="374" text-anchor="end" font-size="11.5" fill="#555" filter="url(#sk)">right=5</text>
  <g filter="url(#sk)">
    <rect x="96" y="352" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="136" y="352" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="176" y="352" width="36" height="34" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.3"/>
    <rect x="216" y="352" width="36" height="34" rx="4" fill="#fffdf5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="256" y="352" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="352" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#bbbbbb" filter="url(#sk)">
    <text x="114" y="374">1</text><text x="154" y="374">2</text><text x="194" y="374">3</text>
  </g>
  <text x="234" y="374" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#sk)">1</text>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">
    <text x="274" y="374">2</text><text x="314" y="374">3</text>
  </g>
  <text x="342" y="374" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">入 3 超了，弹 1 → [2,3]，s = 5 ✓ len 仍为 2</text>

  <!-- conclusion -->
  <rect x="60" y="404" width="560" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="340" y="426" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">最短环弧 len = 2 → 答案 = k·n + len = 2×3 + 2 = 8</text>
  <text x="340" y="448" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">子数组 = [1,2,3] [1,2,3] 后接环弧 [2,3]：总和 6 + 6 + 5 = 17 ✓</text>

  <text x="340" y="492" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">示例 2 的最优窗口 [3,1] 恰好横跨两份边界 —— 只在一份里找会漏解，所以要扫「翻倍」数组</text>
</svg>
