<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：word1=word2="cd", target="ccd" → 4 种</text>
  <text x="60" y="66" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">#</text>
  <text x="120" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">target[0]</text>
  <text x="260" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">target[1]</text>
  <text x="400" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">target[2]</text>
  <line x1="50" y1="76" x2="470" y2="76" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w1[0]</text>
  <text x="320" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w2[0]</text>
  <text x="432" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d ← w1[1]</text>
  <text x="66" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w1[0]</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w2[0]</text>
  <text x="432" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d ← w2[1]</text>
  <text x="66" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="180" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w2[0]</text>
  <text x="320" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w1[0]</text>
  <text x="432" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d ← w1[1]</text>
  <text x="66" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="180" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w2[0]</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c ← w1[0]</text>
  <text x="432" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d ← w2[1]</text>
  <rect x="50" y="210" width="420" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="228" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">计数口径</text>
  <text x="62" y="244" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">两个 'c' 必须分别来自两个字符串（各自下标只能取一次）；</text>
  <text x="62" y="259" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">最后的 'd' 可以取 w1[1] 或 w2[1]，于是 2×2 = 4 种。</text>
  <text x="62" y="274" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">注意下标可以「跳过」：方案里并没有要求用完所有字符。</text>
</svg>
