<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一次操作 = 一个 1 跨过一整段 0</text>

  <rect x="112" y="64" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="132" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="64" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="192" y="64" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="212" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="232" y="64" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="64" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="312" y="64" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="332" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="352" y="64" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 132 58 Q 172 6 214 56" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="176" y="14" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 次操作</text>
  <text x="466" y="76" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">一次滑行跨过</text>
  <text x="466" y="94" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">整段连续 0</text>

  <path d="M 114 118 L 150 118" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1 段</text>
  <path d="M 154 118 L 230 118" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="136" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0段①</text>
  <path d="M 234 118 L 310 118" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1 段</text>
  <path d="M 314 118 L 350 118" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="136" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0段②</text>
  <path d="M 354 118 L 390 118" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1 段</text>

  <text x="280" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0段② 的清算：左侧 3 个 1 自右向左逐个跨过它</text>

  <rect x="170" y="186" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="186" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="186" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="248" y="186" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="261" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 235 182 Q 250 158 259 180" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 209 182 Q 236 144 263 178" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 183 182 Q 222 130 267 176" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="352" y="200" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">每个 1 各跨一次 → +3</text>

  <rect x="36" y="232" width="238" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="256" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按 0 段计数 ✓</text>
  <text x="155" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0段① 左侧 1 个 1 → +1</text>
  <text x="155" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0段② 左侧 3 个 1 → +3</text>
  <text x="155" y="330" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 1 + 3 = 4 ✓</text>

  <rect x="286" y="232" width="238" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="256" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">按 0 的个数计数 ✗</text>
  <text x="405" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逆序对 = 3+1+1+0 = 5</text>
  <text x="405" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最左的 1 一次跨过 2 个 0</text>
  <text x="405" y="330" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">多算了 1 ✗</text>

  <text x="280" y="380" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">ans = Σ(每段 0 左侧 1 的个数) = Σ(每个 1 右侧 0 的段数)</text>
</svg>
