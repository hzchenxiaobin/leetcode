<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：差分聚合 + 一遍扫描取最小</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="118" y="50" width="404" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">① 配对：a = nums[i]，b = nums[n−1−i]，令 a ≤ b</text>
  <g filter="url(#sk)">
    <path d="M 320 86 C 320 92, 320 98, 320 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="88" y="104" width="464" height="136" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">② 每对只写 5 个差分端点（diff[x]：T 跨过 x 时的增量）</text>
  <g font-family="monospace" font-size="12" fill="#333" filter="url(#sk)">
    <text x="110" y="149">diff[2]          += 2</text>
    <text x="110" y="169">diff[a+1]        -= 1</text>
    <text x="110" y="189">diff[a+b]        -= 1</text>
    <text x="110" y="209">diff[a+b+1]      += 1</text>
    <text x="110" y="229">diff[b+limit+1]  += 1</text>
  </g>
  <g font-size="11.5" fill="#777" filter="url(#sk)">
    <text x="340" y="149">基准先按“改两个数”计</text>
    <text x="340" y="169">进入“改一个数”区间</text>
    <text x="340" y="189">在 T = a+b 再降到 0</text>
    <text x="340" y="209">离开 a+b，回到 1</text>
    <text x="340" y="229">超过 b+limit，回到 2</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 292 223 L 296 231" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <circle cx="290" cy="226" r="5" fill="none" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 320 240 C 320 246, 320 252, 320 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="118" y="258" width="404" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="281" text-anchor="middle" font-size="13" fill="#b07818" filter="url(#sk)">③ 扫描 T = 2 … 2·limit：cur += diff[T] 即该 T 的总操作数</text>
  <g filter="url(#sk)">
    <path d="M 320 294 C 320 300, 320 306, 320 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="118" y="312" width="404" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="320" y="335" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">④ ans = min(ans, cur)，初值取上界 n</text>

  <g filter="url(#sk)">
    <rect x="90" y="370" width="460" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">端点更新每对 O(1)，共 O(n) 个；扫描 O(limit)</text>
  <text x="320" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#888" filter="url(#sk)">总时间 O(n + limit)，空间 O(limit)</text>
</svg>
