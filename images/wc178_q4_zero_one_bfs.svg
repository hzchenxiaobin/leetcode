<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="28" font-size="15" fill="#444" font-weight="bold">0-1 BFS：双端队列按代价分端入队</text>
    <text x="280" y="50" font-size="11" fill="#888">队列内距离非降、最多两种取值，故第一次弹出即最终距离</text>
  </g>

  <rect x="150" y="68" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="92" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">从队首弹出 u，dist[u] 已定型</text>

  <path d="M 280 106 L 280 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="134" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="158" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">枚举 4 条出边 u → v，边权 w ∈ {0, 1}</text>

  <path d="M 280 172 L 280 194" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 170 194 L 390 194" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 170 194 L 170 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 194 L 390 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="214" width="180" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="170" y="234" font-size="10.5" fill="#3a5a30" font-weight="bold">w = 0（顺箭头）</text>
    <text x="170" y="251" font-size="10" fill="#3a5a30">push_front(v)</text>
    <text x="170" y="267" font-size="9.5" fill="#3a5a30">距离不变</text>
  </g>

  <rect x="300" y="214" width="180" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="390" y="234" font-size="10.5" fill="#8a3a36" font-weight="bold">w = 1（要改方向）</text>
    <text x="390" y="251" font-size="10" fill="#8a3a36">push_back(v)</text>
    <text x="390" y="267" font-size="9.5" fill="#8a3a36">距离 + 1</text>
  </g>

  <path d="M 170 276 L 170 296 L 240 296" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 390 276 L 390 296 L 330 296" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="298" width="300" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="321" font-size="10.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">仅当 nd &lt; dist[v] 才入队；重复入队无害</text>

  <path d="M 280 334 L 280 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="358" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="198" y="358" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="246" y="358" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="294" y="358" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="342" y="358" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#555">
    <text x="173" y="380">0</text>
    <text x="221" y="380">0</text>
    <text x="269" y="380">1</text>
    <text x="317" y="380">1</text>
    <text x="365" y="380">2</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#777">
    <text x="173" y="408">队首 front</text>
    <text x="365" y="408">队尾 back</text>
  </g>
  <text x="280" y="428" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">同一时刻最多两种距离 d 和 d+1：弹出的 d 不会再被改进</text>
</svg>
