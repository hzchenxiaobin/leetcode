<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：排序 → 生成候选 → 二分计数 → 取最大</text>

  <rect x="40" y="56" width="200" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">把 nums 排序为 a（long long）</text>
  <text x="140" y="104" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">O(n log n)</text>

  <path d="M 140 122 L 140 146" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="148" width="200" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="174" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cand = {a[i]±k, a[i]}</text>
  <text x="140" y="196" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">排序去重，至多 3n 个</text>

  <path d="M 140 214 L 140 238" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="240" width="200" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="266" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">对每个 x 做两次二分</text>
  <text x="140" y="288" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">c = upper(x+k) − lower(x−k)</text>

  <path d="M 240 273 L 300 273" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="304" y="196" width="216" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="222" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = max(ans, min(c, f + m))</text>
  <text x="412" y="244" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">f = freq.get(x, 0)</text>
  <text x="412" y="262" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">m = numOperations</text>

  <path d="M 412 196 L 412 168" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="304" y="96" width="216" height="68" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="122" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回 ans</text>
  <text x="412" y="144" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">总时间 O(n log n)，空间 O(n)</text>

  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">值域放大到 10^9 后，桶与前缀和不可用，只能靠排序 + 二分</text>
</svg>
