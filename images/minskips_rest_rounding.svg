<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：休息 = 把到达时刻「向上取整」到整点</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#888">示例 1：dist = [1,3,2]，speed = 4，hoursBefore = 2（1 小时 = 140 像素）</text>
  <path d="M 170 60 Q 330 68 490 60" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- hour gridlines -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4">
    <line x1="90" y1="76" x2="90" y2="316"/>
    <line x1="230" y1="76" x2="230" y2="316"/>
    <line x1="370" y1="76" x2="370" y2="316"/>
    <line x1="510" y1="76" x2="510" y2="316"/>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="90" y="72">0h</text>
    <text x="230" y="72">1h</text>
    <text x="370" y="72">2h</text>
    <text x="510" y="72">3h</text>
  </g>

  <!-- ===== Timeline A: no skip ===== -->
  <text x="90" y="98" font-size="13" font-weight="bold" fill="#b03a3a">不跳过任何休息：被迫等两次，2.5h 到达 ✗</text>
  <!-- road0 [90,125] -->
  <g filter="url(#sk)"><rect x="90" y="106" width="35" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="107" y="100" text-anchor="middle" font-size="10" fill="#2e6e2e">路0</text>
  <!-- wait [125,230] -->
  <g filter="url(#sk)"><rect x="125" y="106" width="105" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <g stroke="#b85450" stroke-width="1" opacity="0.45">
    <line x1="150" y1="134" x2="165" y2="108"/><line x1="180" y1="134" x2="195" y2="108"/><line x1="210" y1="134" x2="225" y2="108"/>
  </g>
  <text x="177" y="100" text-anchor="middle" font-size="10" fill="#b03a3a">等 0.75h</text>
  <!-- road1 [230,335] -->
  <g filter="url(#sk)"><rect x="230" y="106" width="105" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="282" y="100" text-anchor="middle" font-size="10" fill="#2e6e2e">路1: 3/4h</text>
  <!-- wait [335,370] -->
  <g filter="url(#sk)"><rect x="335" y="106" width="35" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <g stroke="#b85450" stroke-width="1" opacity="0.45">
    <line x1="342" y1="134" x2="350" y2="108"/><line x1="354" y1="134" x2="362" y2="108"/>
  </g>
  <text x="352" y="100" text-anchor="middle" font-size="9" fill="#b03a3a">等 0.25h</text>
  <!-- road2 [370,440] -->
  <g filter="url(#sk)"><rect x="370" y="106" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="405" y="100" text-anchor="middle" font-size="10" fill="#2e6e2e">路2: 1/2h</text>
  <!-- arrival markers -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="125" y="152">0.25h</text>
    <text x="230" y="152">1h</text>
    <text x="335" y="152">1.75h</text>
    <text x="370" y="152">2h</text>
  </g>
  <text x="445" y="126" font-size="12" font-weight="bold" fill="#b03a3a">2.5h ✗</text>

  <!-- ===== Timeline B: skip rest 1 ===== -->
  <text x="90" y="224" font-size="13" font-weight="bold" fill="#2e6e2e">跳过第 1 次休息：一次跳过「顺带」消掉两次等待</text>
  <!-- road0+road1 continuous [90,230] -->
  <g filter="url(#sk)"><rect x="90" y="232" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="125" y="232" width="1" height="30" fill="#4a7a3a" opacity="0.35"/></g>
  <text x="160" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e">路0 + 路1 连续行驶</text>
  <!-- road2 [230,300] -->
  <g filter="url(#sk)"><rect x="230" y="232" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="265" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e">路2</text>
  <!-- integer point highlight -->
  <g filter="url(#sk)">
    <circle cx="230" cy="247" r="7" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="3 2"/>
  </g>
  <text x="230" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1.0h 恰为整点</text>
  <path d="M 230 278 L 230 262" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="230" y="304" text-anchor="middle" font-size="10" fill="#557">路1 后的休息等待自动为 0（级联）</text>
  <!-- arrival markers -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="125" y="278">0.25h</text>
  </g>
  <text x="306" y="252" font-size="12" font-weight="bold" fill="#2e6e2e">1.5h ✓</text>

  <!-- ===== bottom formula box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="330" width="520" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">休息后的出发时刻 = ⌈到达时刻⌉（下一个整点）；跳过 = 不取整、立即出发</text>
  <text x="330" y="382" text-anchor="middle" font-size="12" fill="#444">把时刻统一 × speed：路 i 恰好「走」dist[i] 千米，整点 = speed 的倍数</text>
  <text x="330" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">→ 全程整数运算，浮点误差彻底消失</text>
  <text x="330" y="422" text-anchor="middle" font-size="10" fill="#888">级联：跳过可能让后面的到达恰好落在整点，后续等待自动为 0（见时间线 B）</text>
</svg>
