<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：[[1,2],[3,4]]，按值 4 → 1 离线走查</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 阶段 v=4 ===== -->
  <text x="102" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">v = 4</text>
  <g filter="url(#sk)">
    <rect x="62" y="82" width="80" height="80" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="102" y="122" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="82" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="122" y="106" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="82" y="146" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="122" y="146" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="102" y="184" text-anchor="middle" font-size="10.5" fill="#333">查 (1,1)：x = 4</text>
  <text x="102" y="200" text-anchor="middle" font-size="10.5" fill="#333">正方形裁成全矩阵，</text>
  <text x="102" y="216" text-anchor="middle" font-size="10.5" fill="#333">四角全部越界</text>
  <text x="102" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">g = 0 → ✓（ans = 1）</text>

  <!-- ===== 阶段 v=3 ===== -->
  <text x="260" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">v = 3</text>
  <g filter="url(#sk)">
    <rect x="220" y="82" width="80" height="80" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="260" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="122" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="240" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="280" y="106" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="240" y="146" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="280" y="146" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#333">查 (1,0)：x = 3</text>
  <text x="260" y="200" text-anchor="middle" font-size="10.5" fill="#333">区域 = 全矩阵</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#333">g = 1（只有 4 &gt; 3）</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">→ ✗ 非局部最大</text>

  <!-- ===== 阶段 v=2 ===== -->
  <text x="418" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">v = 2</text>
  <g filter="url(#sk)">
    <rect x="378" y="82" width="80" height="80" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="418" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="378" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="418" y="82" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="398" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="438" y="106" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="398" y="146" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="438" y="146" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="418" y="184" text-anchor="middle" font-size="10.5" fill="#333">查 (0,1)：x = 2</text>
  <text x="418" y="200" text-anchor="middle" font-size="10.5" fill="#333">区域 = 全矩阵</text>
  <text x="418" y="216" text-anchor="middle" font-size="10.5" fill="#333">g = 2（3、4 &gt; 2）</text>
  <text x="418" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">→ ✗ 非局部最大</text>

  <!-- ===== 阶段 v=1 ===== -->
  <text x="576" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">v = 1</text>
  <g filter="url(#sk)">
    <rect x="536" y="82" width="80" height="80" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="576" y="122" width="40" height="40" fill="#e8f0fe" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="536" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="576" y="82" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="536" y="82" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="556" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="596" y="106" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="556" y="146" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="596" y="146" text-anchor="middle" font-size="13" fill="#333">4✗</text>
  <text x="576" y="184" text-anchor="middle" font-size="10.5" fill="#333">查 (0,0)：x = 1</text>
  <text x="576" y="200" text-anchor="middle" font-size="10.5" fill="#333">正方形内 &gt; 1 的有 3 个，</text>
  <text x="576" y="216" text-anchor="middle" font-size="10.5" fill="#333">角 (1,1) 剔除：g = 3−1 = 2</text>
  <text x="576" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">→ ✗ 非局部最大</text>

  <text x="320" y="262" text-anchor="middle" font-size="10" fill="#666">图例：橙 = 正在查询的格子　蓝 = 已标记（值 &gt; v）　红 ✗ = 被剔除的角</text>

  <!-- ===== 角剔除救命案例 ===== -->
  <text x="320" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">角剔除何时改变结局？matrix = [[1,0],[0,5]]</text>
  <text x="110" y="310" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">对 (0,0)：x = 1</text>
  <g filter="url(#sk)">
    <rect x="70" y="316" width="80" height="80" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="70" y="316" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="110" y="316" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="70" y="356" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="110" y="356" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="90" y="340" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="130" y="340" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="90" y="380" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="130" y="380" text-anchor="middle" font-size="13" fill="#333">5✗</text>
  <text x="110" y="414" text-anchor="middle" font-size="10" fill="#666">绿 / 橙 = 被考虑，红 ✗ = 角上被剔除</text>

  <g filter="url(#sk)"><rect x="180" y="316" width="436" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="398" y="338" text-anchor="middle" font-size="11.5" fill="#7a5415">正方形内值 &gt; 1 的只有 (1,1) = 5，而它恰在角上 → g = 1 − 1 = 0</text>
  <text x="398" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415">(0,0) ✓ 是局部最大值；(1,1) 自身 x = 5，区域 = 全矩阵、无值 &gt; 5 → ✓</text>
  <text x="398" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415">答案 = 2</text>
  <text x="398" y="400" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">若忘记剔角，(0,0) 会被误杀 —— 角修正是本题的灵魂</text>

  <!-- 底部备注 -->
  <g filter="url(#sk)"><rect x="40" y="440" width="560" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="320" y="464" text-anchor="middle" font-size="11" fill="#2b5a80">标记时机：同值格子「先查后标」，等值互不威胁 —— 示例 4 全 1 矩阵的 4 个格子因此全是局部最大值</text>
</svg>
