<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：每个下标 = 核 × 平方数（唯一分解）</text>

  <!-- left: decompositions -->
  <text x="24" y="54" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">唯一分解 i = P(i) · m²</text>

  <!-- row 1: 2 = 2·1² -->
  <rect x="30" y="64" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="74" y="82" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="92" y="64" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="134" y="82" font-size="13" fill="#333" filter="url(#rough2)">·</text>
  <rect x="146" y="64" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1²</text>
  <text x="200" y="81" font-size="10.5" fill="#b85450" filter="url(#rough2)">核 = 2</text>

  <!-- row 2: 8 = 2·2² -->
  <rect x="30" y="96" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="74" y="114" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="92" y="96" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="134" y="114" font-size="13" fill="#333" filter="url(#rough2)">·</text>
  <rect x="146" y="96" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2²</text>
  <text x="200" y="113" font-size="10.5" fill="#b85450" filter="url(#rough2)">核 = 2</text>

  <!-- row 3: 18 = 2·3² -->
  <rect x="30" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">18</text>
  <text x="74" y="146" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="92" y="128" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="134" y="146" font-size="13" fill="#333" filter="url(#rough2)">·</text>
  <rect x="146" y="128" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3²</text>
  <text x="200" y="145" font-size="10.5" fill="#b85450" filter="url(#rough2)">核 = 2</text>

  <!-- row 4: 50 = 2·5² -->
  <rect x="30" y="160" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">50</text>
  <text x="74" y="178" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="92" y="160" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="134" y="178" font-size="13" fill="#333" filter="url(#rough2)">·</text>
  <rect x="146" y="160" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5²</text>
  <text x="200" y="177" font-size="10.5" fill="#b85450" filter="url(#rough2)">核 = 2</text>

  <!-- row 5: 12 = 3·2² -->
  <rect x="30" y="192" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">12</text>
  <text x="74" y="210" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="92" y="192" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="134" y="210" font-size="13" fill="#333" filter="url(#rough2)">·</text>
  <rect x="146" y="192" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2²</text>
  <text x="200" y="209" font-size="10.5" fill="#b85450" filter="url(#rough2)">核 = 3</text>

  <!-- row 6: 75 = 3·5² -->
  <rect x="30" y="224" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">75</text>
  <text x="74" y="242" font-size="13" fill="#333" filter="url(#rough2)">=</text>
  <rect x="92" y="224" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="134" y="242" font-size="13" fill="#333" filter="url(#rough2)">·</text>
  <rect x="146" y="224" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5²</text>
  <text x="200" y="241" font-size="10.5" fill="#b85450" filter="url(#rough2)">核 = 3</text>

  <!-- right: pair tests -->
  <text x="268" y="54" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">两两配对：乘积是平方数吗？</text>

  <!-- pair A: 2 x 8 -->
  <rect x="268" y="66" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="83" font-size="12" fill="#333" filter="url(#rough2)">×</text>
  <rect x="310" y="66" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="342" y="83" font-size="12" fill="#333" filter="url(#rough2)">=</text>
  <text x="354" y="83" font-size="12" fill="#333" filter="url(#rough2)">16 = 4²</text>
  <text x="432" y="83" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 平方数</text>
  <text x="281" y="101" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核2</text>
  <text x="323" y="101" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核2</text>

  <!-- pair B: 18 x 50 -->
  <rect x="268" y="104" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="121" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">18</text>
  <text x="298" y="121" font-size="12" fill="#333" filter="url(#rough2)">×</text>
  <rect x="310" y="104" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="121" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">50</text>
  <text x="342" y="121" font-size="12" fill="#333" filter="url(#rough2)">=</text>
  <text x="354" y="121" font-size="12" fill="#333" filter="url(#rough2)">900 = 30²</text>
  <text x="432" y="121" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 平方数</text>
  <text x="281" y="139" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核2</text>
  <text x="323" y="139" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核2</text>

  <!-- pair C: 2 x 3 -->
  <rect x="268" y="152" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="169" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="169" font-size="12" fill="#333" filter="url(#rough2)">×</text>
  <rect x="310" y="152" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="169" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="342" y="169" font-size="12" fill="#333" filter="url(#rough2)">=</text>
  <text x="354" y="169" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="432" y="169" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 非平方数</text>
  <text x="281" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核2</text>
  <text x="323" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核3</text>

  <!-- pair D: 8 x 12 -->
  <rect x="268" y="190" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="298" y="207" font-size="12" fill="#333" filter="url(#rough2)">×</text>
  <rect x="310" y="190" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">12</text>
  <text x="342" y="207" font-size="12" fill="#333" filter="url(#rough2)">=</text>
  <text x="354" y="207" font-size="12" fill="#333" filter="url(#rough2)">96</text>
  <text x="432" y="207" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 非平方数</text>
  <text x="281" y="225" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核2</text>
  <text x="323" y="225" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核3</text>

  <!-- why box -->
  <rect x="268" y="232" width="232" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">同核为什么一定行？</text>
  <text x="384" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k·a² × k·b² = k²·a²·b² = (k·a·b)²</text>

  <!-- bottom lemma box -->
  <rect x="30" y="288" width="460" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">中心引理：i × j 是完全平方数 ⟺ P(i) = P(j)</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">核是下标的“身份证”：身份证相同 ⟺ 乘积为平方数 ⟺ 可以进同一个桶</text>

  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">求核：剥掉 i 的最大平方因子即得 —— P(8)=2、P(12)=3、P(45)=5、P(1)=1</text>
</svg>
