<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一遍扫描，(best, ans) 只在严格更优时更新</text>

  <!-- 起点 -->
  <ellipse cx="280" cy="66" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">best=∞, ans=−1</text>

  <!-- 遍历 -->
  <rect x="215" y="110" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">i = 0 … n−1 遍历 points</text>

  <!-- 判定有效 -->
  <polygon points="280,170 385,205 280,240 175,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">a=x 或 b=y？</text>
  <text x="280" y="218" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(a,b)=points[i] 是有效点吗)</text>

  <!-- 无效分支 -->
  <path d="M 385 205 L 470 205" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="198" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>
  <rect x="470" y="187" width="74" height="36" fill="#f2f2f2" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="507" y="210" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">跳过 i</text>

  <!-- 有效分支 -->
  <path d="M 280 240 L 280 268" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="260" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="200" y="270" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">d = |x−a| + |y−b|</text>

  <!-- 严格小于判定 -->
  <path d="M 280 306 L 280 326" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,328 395,360 280,392 165,360" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d &lt; best？</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(相等不更新 → 保留下标最小)</text>

  <!-- 更新分支 -->
  <path d="M 395 360 L 458 360" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="352" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="458" y="342" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="504" y="365" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">best=d, ans=i</text>

  <!-- 不更新回环 -->
  <path d="M 165 360 Q 120 360 118 190 Q 118 110 205 122" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="330" font-size="10.5" fill="#999" filter="url(#rough2)">否</text>

  <!-- 结束提示 -->
  <rect x="30" y="330" width="122" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="91" y="351" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">扫描完返回 ans</text>
  <text x="91" y="368" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(无有效点 ans=−1)</text>
</svg>
