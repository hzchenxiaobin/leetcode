<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：值域二分 + 逐行整除计数</text>

  <rect x="90" y="46" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 转置：m = min(m, n)，n = max(m, n)</text>
  <text x="250" y="83" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">乘法表对称，元素集合不变 → 外层只跑小维度</text>

  <path d="M 250 92 L 250 110" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="112" width="320" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 二分值域：lo = 1、hi = m · n</text>

  <path d="M 250 152 L 250 174" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,176 365,214 250,252 135,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="219" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">lo &lt; hi ?</text>

  <path d="M 365 214 L 400 214" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">否</text>
  <rect x="404" y="192" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="504" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 lo</text>
  <text x="504" y="227" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">lo = hi 即最小的可行值</text>

  <path d="M 250 252 L 250 276" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="270" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="70" y="278" width="360" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="297" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ mid = lo + (hi − lo) / 2</text>
  <text x="250" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ cnt = Σ min(n, ⌊mid / i⌋)，i = 1 … m</text>
  <text x="250" y="331" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（i &gt; mid 或 cnt ≥ k 时提前 break）</text>

  <path d="M 250 340 L 250 360" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,362 380,400 250,438 120,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="405" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">cnt ≥ k ?</text>

  <path d="M 120 400 L 106 400" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="113" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="6" y="374" width="96" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="54" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">hi = mid</text>
  <text x="54" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">答案在左闭区间</text>

  <path d="M 380 400 L 404 400" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="392" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="408" y="374" width="196" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="506" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">lo = mid + 1</text>
  <text x="506" y="412" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">mid 及左侧都不可能是答案</text>

  <path d="M 54 426 L 54 478 L 146 478" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 503 426 L 503 478 L 484 478" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="452" width="330" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="473" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">更新后回到 ②，继续循环</text>
  <text x="315" y="491" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">循环终止时 lo == hi == 第 k 小</text>
</svg>
