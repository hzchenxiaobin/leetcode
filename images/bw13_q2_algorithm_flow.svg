<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：哈希记父指针，两条链上溯求交</text>

  <rect x="110" y="54" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 扫描 regions：每个非首元素登记 parent[x] = r[0]</text>

  <rect x="110" y="122" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">② 从 region1 一路上溯到根，沿途全存进哈希集合</text>
  <path d="M 280 98 L 280 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="190" width="340" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">③ 从 region2 逐级上溯，第一个出现在集合里的即答案</text>
  <path d="M 280 166 L 280 186" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="258" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">④ 返回该区域（不存在已是前提，无需特判）</text>
  <path d="M 280 234 L 280 254" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="326" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">两条链都终止于同一棵树的根，必在根（或更深处）相遇；</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">「region2 链上第一个命中的祖先」恰是深度最大的公共祖先（最优）</text>
</svg>
