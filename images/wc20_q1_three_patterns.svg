<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">合法形态只有三种，其余全部非法</text>
  <path d="M 120 44 Q 340 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 卡片 ① 全大写 -->
  <rect x="30" y="62" width="190" height="142" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 全部大写</text>
  <text x="125" y="132" text-anchor="middle" font-size="26" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">USA</text>
  <text x="125" y="164" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#rough2)">大写个数 u = n</text>
  <text x="125" y="186" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#rough2)">一个都不许小写</text>

  <!-- 卡片 ② 全小写 -->
  <rect x="245" y="62" width="190" height="142" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 全部小写</text>
  <text x="340" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">leetcode</text>
  <text x="340" y="164" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#rough2)">大写个数 u = 0</text>
  <text x="340" y="186" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#rough2)">一个都不许大写</text>

  <!-- 卡片 ③ 仅首字母大写 -->
  <rect x="460" y="62" width="190" height="142" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="555" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b" filter="url(#rough2)">③ 仅首字母大写</text>
  <text x="555" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Google</text>
  <text x="555" y="164" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#rough2)">u = 1 且 word[0] 大写</text>
  <text x="555" y="186" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#rough2)">其余字母必须小写</text>

  <!-- 非法示例框 -->
  <rect x="110" y="228" width="460" height="94" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 非法：三种形态之外的混排</text>
  <text x="200" y="282" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">FlaG</text>
  <text x="200" y="309" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">大小写交替</text>
  <text x="340" y="282" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">ABc</text>
  <text x="340" y="309" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">两个大写但非全大写</text>
  <text x="480" y="282" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">aBC</text>
  <text x="480" y="309" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">首字母小写又有大写</text>

  <!-- 判据 -->
  <text x="340" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">关键量：大写字母个数 u（只数个数，与位置无关）</text>
  <text x="340" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">合法 ⟺ u = 0 或 u = n 或 ( u = 1 且 word[0] 是大写 )</text>
  <text x="340" y="406" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">第三条不可省：u = 1 的大小写位置仍需检查，见 "Google" 与 "aBC"</text>
</svg>
