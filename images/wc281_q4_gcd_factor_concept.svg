<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：与 k 配对的能力，全部浓缩在 g = gcd(x, k) 里</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: mapping -->
  <rect x="16" y="52" width="608" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">「数值 → 因子」：逐质因子截断，只保留与 k 共享的部分 —— 以 k = 12 = 2²·3 为例</text>

  <text x="26" y="114" font-size="11" fill="#666" filter="url(#rough2)">x</text>
  <rect x="44" y="94" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="116" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">8</text>
  <rect x="108" y="94" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="116" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">9</text>
  <rect x="172" y="94" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="116" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">25</text>
  <rect x="236" y="94" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="116" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">6</text>

  <path d="M66,130 L66,152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M130,130 L130,152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M194,130 L194,152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M258,130 L258,152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="146" font-size="10" fill="#4a7a3a" filter="url(#rough2)">gcd(x, 12)</text>

  <rect x="44" y="158" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="180" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="108" y="158" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="172" y="158" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="180" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="236" y="158" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="258" y="180" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6</text>

  <text x="140" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">g 全部落在 12 的因子 {1,2,3,4,6,12} 里</text>

  <text x="330" y="100" font-size="10.8" fill="#444" filter="url(#rough2)">8 = 2³ → g = 2² = 4（v₂ 封顶到 2）</text>
  <text x="330" y="122" font-size="10.8" fill="#444" filter="url(#rough2)">9 = 3² → g = 3（v₃ 封顶到 1）</text>
  <text x="330" y="144" font-size="10.8" fill="#444" filter="url(#rough2)">25 = 5² → g = 1（5 与 12 互质，全丢）</text>
  <text x="330" y="166" font-size="10.8" fill="#444" filter="url(#rough2)">6 = 2·3 → g = 6（恰好整除 k）</text>
  <text x="330" y="196" font-size="10.5" fill="#446688" filter="url(#rough2)">v_p(g) = min(v_p(x), v_p(k))：超出 k 幂次的部分</text>
  <text x="330" y="214" font-size="10.5" fill="#446688" filter="url(#rough2)">对「整除 k」零贡献，截断不损失信息</text>

  <!-- Panel B: equivalence -->
  <rect x="16" y="236" width="608" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">配对判定完全等价：k | x·y ⟺ k | g(x)·g(y)（k = 12）</text>

  <text x="130" y="282" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">原数乘积</text>
  <text x="330" y="282" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">因子乘积</text>
  <text x="500" y="282" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">判定一致</text>

  <text x="130" y="304" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(8,9): 72 ✓</text>
  <text x="330" y="304" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(4,3): 12 ✓</text>
  <text x="500" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="130" y="326" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(8,6): 48 ✓</text>
  <text x="330" y="326" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(4,6): 24 ✓</text>
  <text x="500" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="130" y="348" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(9,6): 54 ✗</text>
  <text x="330" y="348" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(3,6): 18 ✗</text>
  <text x="500" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="130" y="370" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(9,25): 225 ✗</text>
  <text x="330" y="370" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">(3,1): 3 ✗</text>
  <text x="500" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="175" y="381" font-size="9.5" fill="#b85450" filter="url(#rough2)">54 = 2·3³，缺一个 2</text>

  <!-- Bottom bar -->
  <rect x="16" y="398" width="608" height="68" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">g 的值域 = k 的因子集合；k ≤ 10⁵ 时 d(k) 至多 128 个（k = 83160 取到）</text>
  <text x="320" y="448" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">两两配对从 n² ≈ 10¹⁰ 次判定塌缩到 d(k)² ≤ 16384 次判定 —— 大维度 n 消失了</text>
</svg>
