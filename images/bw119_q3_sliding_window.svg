<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">只有新进元素可能超频；收缩时只盯住它一个</text>

  <!-- 数组与窗口 -->
  <g filter="url(#rough2)">
    <rect x="90" y="70" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="138" y="70" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="70" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="234" y="70" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="282" y="70" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="70" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="70" width="48" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="426" y="70" width="48" height="44" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="114" y="97" text-anchor="middle" font-size="15" fill="#333">1</text>
    <text x="162" y="97" text-anchor="middle" font-size="15" fill="#333">2</text>
    <text x="210" y="97" text-anchor="middle" font-size="15" fill="#333">3</text>
    <text x="258" y="97" text-anchor="middle" font-size="15" fill="#333">1</text>
    <text x="306" y="97" text-anchor="middle" font-size="15" fill="#333">2</text>
    <text x="354" y="97" text-anchor="middle" font-size="15" fill="#333">3</text>
    <text x="402" y="97" text-anchor="middle" font-size="15" fill="#7a3030">1</text>
    <text x="450" y="97" text-anchor="middle" font-size="15" fill="#999">2</text>
    <text x="114" y="128" text-anchor="middle" font-size="10" fill="#888">l（待弹出）</text>
    <text x="402" y="128" text-anchor="middle" font-size="10" fill="#b85450">r 刚进窗</text>
  </g>
  <!-- 窗口括线 -->
  <path d="M90,62 L90,52 L354,52 L354,62" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="44" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">当前窗口（r 进窗前合法）</text>

  <!-- 频率面板 -->
  <rect x="70" y="165" width="200" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="188" text-anchor="middle" font-size="13" fill="#1c3a1c" filter="url(#rough2)">窗口频率表（k = 2）</text>
  <text x="100" y="212" font-size="13" fill="#333" filter="url(#rough2)">1 → 2 ✓</text>
  <text x="100" y="234" font-size="13" fill="#333" filter="url(#rough2)">2 → 2 ✓</text>
  <text x="100" y="256" font-size="13" fill="#333" filter="url(#rough2)">3 → 2 ✓</text>
  <text x="100" y="277" font-size="12" fill="#b85450" filter="url(#rough2)">r 进窗后：1 → 3 ✗ 超频！</text>

  <!-- 收缩箭头 -->
  <path d="M114,140 C114,158 130,158 130,163" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M402,140 C400,168 320,185 260,200" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">弹到越过首个 1 为止</text>

  <!-- 收缩后 -->
  <g filter="url(#rough2)">
    <rect x="138" y="315" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="315" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="234" y="315" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="282" y="315" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="315" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="315" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="162" y="340" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="210" y="340" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="258" y="340" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="306" y="340" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="354" y="340" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="402" y="340" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>
  <path d="M138,307 L138,298 L378,298 L378,307" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="258" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收缩后窗口恢复合法（长度仍为 6）</text>

  <text x="440" y="330" font-size="11" fill="#555" filter="url(#rough2)">灰色 = 尚未</text>
  <text x="440" y="345" font-size="11" fill="#555" filter="url(#rough2)">进窗元素</text>
</svg>
