<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">从右往左单调栈：弹出的矮个子 + 留下的第一个更高者</text>

  <!-- 身高条形图 heights = [10,6,8,5,11,9] -->
  <g filter="url(#rough2)">
    <rect x="70"  y="150" width="34" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="130" y="240" width="34" height="40"  fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="190" y="215" width="34" height="65"  fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="250" y="255" width="34" height="25"  fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="310" y="120" width="34" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="370" y="168" width="34" height="112" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="87" y="144">10</text>
    <text x="147" y="234">6</text>
    <text x="207" y="209">8</text>
    <text x="267" y="249">5</text>
    <text x="327" y="114">11</text>
    <text x="387" y="162">9</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="87" y="296">i=0</text>
    <text x="147" y="296">i=1</text>
    <text x="207" y="296">i=2</text>
    <text x="267" y="296">i=3</text>
    <text x="327" y="296">i=4</text>
    <text x="387" y="296">i=5</text>
  </g>

  <!-- i=0 的视线 -->
  <path d="M 104 152 L 144 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 104 150 L 202 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 104 148 L 320 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="212" y="160" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">10 号看到 3 人：6、8（矮，被弹出）+ 11（第一个更高，+1）</text>

  <!-- 栈示意：处理 i=0 的过程 -->
  <rect x="440" y="120" width="100" height="160" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">栈（底→顶递减）</text>
  <!-- i=0 到来前的栈 [11, 8, 6]，顶是 6 -->
  <g filter="url(#rough2)">
    <rect x="458" y="238" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="458" y="204" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="458" y="170" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="490" y="256">6 ← 顶，被弹出</text>
    <text x="490" y="222">8 ← 被弹出</text>
    <text x="490" y="188">11 ← 留下（+1）</text>
  </g>
  <path d="M 404 188 L 452 186" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">随后 10 入栈 → [11, 10]</text>

  <!-- 底部要点 -->
  <rect x="40" y="330" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">answer[i] = 弹出个数（可见的矮个子）+（栈非空 ? 1 : 0）</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">每人至多入栈/出栈一次 → 总复杂度 O(n)</text>
</svg>
