<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="350" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    样例 2 走查：n = 6, x = 2, y = 4 → g = gcd(2, 4) = 2
  </text>

  <!-- 行标签 -->
  <text x="150" y="68" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">位置 i</text>
  <text x="150" y="113" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">p[i]</text>
  <text x="150" y="158" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">i mod 2</text>
  <text x="150" y="203" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">p[i] mod 2</text>
  <text x="150" y="248" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">一致？</text>

  <!-- 各格 -->
  <g filter="url(#rough2)">
    <rect x="170" y="46" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="236" y="46" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="302" y="46" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="368" y="46" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="434" y="46" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="500" y="46" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>

    <rect x="170" y="91" width="66" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="236" y="91" width="66" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="302" y="91" width="66" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="368" y="91" width="66" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="434" y="91" width="66" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="500" y="91" width="66" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>

    <rect x="170" y="136" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="236" y="136" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="302" y="136" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="368" y="136" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="434" y="136" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="500" y="136" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>

    <rect x="170" y="181" width="66" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="236" y="181" width="66" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="302" y="181" width="66" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="368" y="181" width="66" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="434" y="181" width="66" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="500" y="181" width="66" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>

    <rect x="170" y="226" width="66" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="236" y="226" width="66" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="302" y="226" width="66" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="368" y="226" width="66" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="434" y="226" width="66" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="500" y="226" width="66" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>

  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="203" y="68">1</text><text x="269" y="68">2</text><text x="335" y="68">3</text>
    <text x="401" y="68">4</text><text x="467" y="68">5</text><text x="533" y="68">6</text>

    <text x="203" y="113">2</text><text x="269" y="113">1</text><text x="335" y="113">4</text>
    <text x="401" y="113">3</text><text x="467" y="113">6</text><text x="533" y="113">5</text>

    <text x="203" y="158">1</text><text x="269" y="158">0</text><text x="335" y="158">1</text>
    <text x="401" y="158">0</text><text x="467" y="158">1</text><text x="533" y="158">0</text>

    <text x="203" y="203">0</text><text x="269" y="203">1</text><text x="335" y="203">0</text>
    <text x="401" y="203">1</text><text x="467" y="203">0</text><text x="533" y="203">1</text>
  </g>

  <g font-size="15" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="203" y="248">×</text><text x="269" y="248">×</text><text x="335" y="248">×</text>
    <text x="401" y="248">×</text><text x="467" y="248">×</text><text x="533" y="248">×</text>
  </g>

  <!-- 第 1 列：位置 1 与值 2 的余数不同（画在最上层做强调） -->
  <rect x="162" y="40" width="78" height="232" rx="6" fill="none" stroke="#b85450"
        stroke-width="2.2" filter="url(#rough2)"/>

  <text x="310" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    位置 1 属于奇连通块，而 p[1] = 2 属于偶连通块
  </text>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    第一列就不一致，交换永远跨不过去 → 输出 NO
  </text>
</svg>
