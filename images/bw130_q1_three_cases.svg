<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="27"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="600" height="330" fill="#fafafa"/>
  <text x="300.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">三种示例：一个通过，两个各有「一处坏」</text>
  <rect x="56.4" y="95.7" width="34.5" height="33.7" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="73.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="90.0" y="96.4" width="33.9" height="34.0" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="107.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="123.7" y="96.5" width="34.5" height="33.7" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="141.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="55.6" y="130.0" width="34.0" height="34.3" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="73.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="89.8" y="130.1" width="33.7" height="33.7" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="107.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="123.6" y="130.0" width="34.1" height="34.1" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="141.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">2</text>
  <text x="107.0" y="84.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
  <text x="107.0" y="186.0" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">三列各自相等，行内 1≠0≠2</text>
  <rect x="246.4" y="95.8" width="33.8" height="34.0" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="263.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="280.4" y="95.8" width="33.8" height="33.9" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="297.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="314.2" y="95.8" width="33.7" height="34.2" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="331.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="246.1" y="130.1" width="33.5" height="33.7" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="263.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="279.6" y="129.9" width="34.4" height="34.5" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="297.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="314.3" y="129.9" width="34.1" height="34.4" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="331.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">0</text>
  <text x="297.0" y="84.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="297.0" y="186.0" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">行内 1=1，违反「不等」</text>
  <rect x="435.8" y="95.9" width="34.2" height="33.8" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="453.0" y="118.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="436.0" y="129.9" width="34.3" height="34.0" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="453.0" y="152.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="435.6" y="163.5" width="34.1" height="33.6" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="453.0" y="186.0" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">3</text>
  <text x="453.0" y="84.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="453.0" y="220.0" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">同列 1,2,3 不等，违反「相等」</text>
  <rect x="30.2" y="223.7" width="540.0" height="59.8" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300.0" y="249.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">列方向用「跨行比较」，行方向用「相邻比较」，两件事互不干扰，可合并进同一趟双重循环</text>
  <text x="300.0" y="267.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">越界靠 i+1 &lt; m、j+1 &lt; n 两个判断挡住，不需要额外特判</text>
  <text x="300.0" y="300.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">注意示例 3 是 m×1 的单列矩阵：没有「行内相邻」可查，但列内相等依然必须成立</text>
</svg>
