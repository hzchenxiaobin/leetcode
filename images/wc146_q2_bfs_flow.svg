<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两状态 BFS 的算法流程</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">状态图上每条边权为 1，因此队列 BFS 一次就给出全部最短路</text>

  <rect x="80" y="66" width="400" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="98" y="88" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 建图：两个邻接表</text>
  <text x="98" y="108" font-size="10" fill="#555" filter="url(#rough2)">adj[0][u] 存红边，adj[1][u] 存蓝边，颜色直接当第一维下标</text>

  <path d="M 280 122 L 280 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="148" width="400" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="98" y="170" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 初始化：起点同时占两个状态</text>
  <text x="98" y="190" font-size="10" fill="#555" filter="url(#rough2)">dist[0][0] = dist[1][0] = 0，把 (0, 红)、(0, 蓝) 都压入队列</text>

  <path d="M 280 204 L 280 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="230" width="400" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="98" y="252" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 出队 (u, c)：只走另一种颜色</text>
  <text x="98" y="272" font-size="10" fill="#555" filter="url(#rough2)">对 adj[1−c][u] 中每个 v，尝试松弛到状态 (v, 1−c)</text>

  <path d="M 280 286 L 280 308" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="312" width="400" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="98" y="334" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 只有首次到达才入队</text>
  <text x="98" y="354" font-size="10" fill="#555" filter="url(#rough2)">dist[1−c][v] 仍为 INF 时置为 dist[c][u]+1 并压入队列</text>

  <path d="M 280 368 L 280 390" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="394" width="400" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="98" y="416" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">⑤ 队列空 → 合并两个状态</text>
  <text x="98" y="436" font-size="10" fill="#555" filter="url(#rough2)">answer[x] = min(dist[0][x], dist[1][x])，仍为 INF 则输出 −1</text>

  <text x="280" y="472" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个状态最多入队、出队一次 ⇒ 每条原边恰好被扫描一次，总代价 O(n + E)</text>
  <text x="280" y="490" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">状态数只有 2n ≤ 200，队列里不会出现重复状态，交替路径长度自然被限制在 2n 以内</text>
</svg>
