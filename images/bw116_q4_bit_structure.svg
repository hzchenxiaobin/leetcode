<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="65"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">每步一次「区间 +1」一次「区间求和」→ 双 BIT（或线段树）维护 D 数组</text>

  <!-- 上：树状数组 -->
  <g filter="url(#rough2)">
    <text x="96" y="62" font-size="13" fill="#446688">树状数组：单点改、前缀和，都是 O(log n)</text>

    <rect x="60" y="76" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="95" text-anchor="middle" font-size="11" fill="#333">b[1]</text>
    <rect x="108" y="76" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="128" y="95" text-anchor="middle" font-size="11" fill="#333">b[2]</text>
    <rect x="156" y="76" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="176" y="95" text-anchor="middle" font-size="11" fill="#333">b[3]</text>
    <rect x="204" y="76" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="224" y="95" text-anchor="middle" font-size="11" fill="#333">b[4]</text>
    <rect x="252" y="76" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="272" y="95" text-anchor="middle" font-size="11" fill="#333">b[5]</text>
    <rect x="300" y="76" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="95" text-anchor="middle" font-size="11" fill="#333">b[6]</text>

    <text x="80" y="126" font-size="11.5" fill="#555">lowbit 跳跃：</text>
    <text x="80" y="146" font-size="11.5" fill="#555">改 i → i += i&amp;−i</text>
    <text x="80" y="166" font-size="11.5" fill="#555">查 i → i −= i&amp;−i</text>

    <rect x="236" y="120" width="120" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="296" y="144" text-anchor="middle" font-size="12" fill="#555">区间加 + 区间和</text>
    <text x="296" y="164" text-anchor="middle" font-size="12" fill="#555">用 2 个 BIT 拼出</text>
  </g>

  <!-- 下：单步操作 -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="440" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="58" y="222" font-size="13" fill="#446688">右端从 i−1 扩到 i（新值 x = nums[i]，上次出现 j）：D[j+1..i] 全体 +1</text>
    <text x="58" y="246" font-size="12.5" fill="#555">先 T = query(j+1, i)，再 S += 2T + (i−j)，然后 update(j+1, i, +1)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="276" width="440" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="58" y="302" font-size="13" fill="#4a7a3a">复杂度：n 步 × (2 次 log n 查询 + 2 次 log n 更新) = O(n log n)</text>
    <text x="58" y="326" font-size="12.5" fill="#555">S 最多 n·n² = 10¹⁵ 级别？不会：S ≤ n·n² 但 n=10⁵ 时溢出 —— 计 64 位并用模意义小心处理</text>
  </g>
</svg>
