<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" width="660" height="404" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="404" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：n = 2 ⇒ m = 2，V = 4，答案 k = 7，beauty = 3</text>

  <!-- 前缀序列 -->
  <text x="330" y="62" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">前缀序列 p0 … p7：低半区 {0,1} 各 2 次，高半区 {2,3} 各 2 次</text>
  <g filter="url(#rough2)">
    <rect x="85" y="72" width="56" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="147" y="72" width="56" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="209" y="72" width="56" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="271" y="72" width="56" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="333" y="72" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="395" y="72" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="457" y="72" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="519" y="72" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="15.5" font-weight="bold" text-anchor="middle">
    <text x="113" y="95" fill="#33517a" filter="url(#rough2)">0</text>
    <text x="175" y="95" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="237" y="95" fill="#33517a" filter="url(#rough2)">1</text>
    <text x="299" y="95" fill="#33517a" filter="url(#rough2)">0</text>
    <text x="361" y="95" fill="#a0761e" filter="url(#rough2)">2</text>
    <text x="423" y="95" fill="#a0761e" filter="url(#rough2)">3</text>
    <text x="485" y="95" fill="#a0761e" filter="url(#rough2)">3</text>
    <text x="547" y="95" fill="#a0761e" filter="url(#rough2)">2</text>
  </g>
  <g font-size="10.5" fill="#9a9a9a" text-anchor="middle">
    <text x="113" y="120" filter="url(#rough2)">p0</text>
    <text x="175" y="120" filter="url(#rough2)">p1</text>
    <text x="237" y="120" filter="url(#rough2)">p2</text>
    <text x="299" y="120" filter="url(#rough2)">p3</text>
    <text x="361" y="120" filter="url(#rough2)">p4</text>
    <text x="423" y="120" filter="url(#rough2)">p5</text>
    <text x="485" y="120" filter="url(#rough2)">p6</text>
    <text x="547" y="120" filter="url(#rough2)">p7</text>
  </g>

  <!-- 数组 a -->
  <text x="330" y="150" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">数组 ai = p(i−1) ⊕ pi（相邻前缀异或，全部 ≤ n = 2，含一个 0）</text>
  <g filter="url(#rough2)">
    <rect x="116" y="160" width="56" height="34" rx="5" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.8"/>
    <rect x="178" y="160" width="56" height="34" rx="5" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.8"/>
    <rect x="240" y="160" width="56" height="34" rx="5" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.8"/>
    <rect x="302" y="160" width="56" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="364" y="160" width="56" height="34" rx="5" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.8"/>
    <rect x="426" y="160" width="56" height="34" rx="5" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.8"/>
    <rect x="488" y="160" width="56" height="34" rx="5" fill="#f3f3f3" stroke="#7a7a7a" stroke-width="1.8"/>
  </g>
  <g font-size="15.5" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="144" y="183" filter="url(#rough2)">1</text>
    <text x="206" y="183" filter="url(#rough2)">0</text>
    <text x="268" y="183" filter="url(#rough2)">1</text>
    <text x="330" y="183" fill="#8d3a3a" filter="url(#rough2)">2</text>
    <text x="392" y="183" filter="url(#rough2)">1</text>
    <text x="454" y="183" filter="url(#rough2)">0</text>
    <text x="516" y="183" filter="url(#rough2)">1</text>
  </g>
  <g font-size="10.5" fill="#9a9a9a" text-anchor="middle">
    <text x="144" y="208" filter="url(#rough2)">a1</text>
    <text x="206" y="208" filter="url(#rough2)">a2</text>
    <text x="268" y="208" filter="url(#rough2)">a3</text>
    <text x="330" y="208" fill="#b85450" filter="url(#rough2)">a4</text>
    <text x="392" y="208" filter="url(#rough2)">a5</text>
    <text x="454" y="208" filter="url(#rough2)">a6</text>
    <text x="516" y="208" filter="url(#rough2)">a7</text>
  </g>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="46" y="232" width="176" height="78" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="242" y="232" width="176" height="78" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="438" y="232" width="176" height="78" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="134" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">前缀计数</text>
  <text x="134" y="278" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">c0 = c1 = c2 = c3 = 2</text>
  <text x="134" y="298" text-anchor="middle" font-size="11.5" fill="#8d3a3a" filter="url(#rough2)">f = 4 × C(2,2) = 4</text>

  <text x="330" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">长度</text>
  <text x="330" y="278" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">k = 4m − 1 = 7</text>
  <text x="330" y="298" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">= 2V − 1（达到上界）</text>

  <text x="526" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#8d3a3a" filter="url(#rough2)">beauty</text>
  <text x="526" y="278" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">7 − 4 = 3</text>
  <text x="526" y="298" text-anchor="middle" font-size="11.5" fill="#8d3a3a" filter="url(#rough2)">= V − 1 = 3 ✓</text>

  <text x="330" y="336" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">官方样例给出的是 [2,2,1,0,2,0,1]，长度同为 7；输出任意最优数组均可</text>
  <text x="330" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">校验：每个 ai ∈ [0, n] = [0, 2]，且每个前缀值恰好出现 2 次 ⇒ 不会浪费额度</text>
  <text x="330" y="384" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">（a4 = 2 = n，说明「恰好等于 n」的元素也合法）</text>
</svg>
