<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">两条互斥路线，取代价更小者</text>

  <!-- 网格 -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="60" y="56" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="83" y="82" fill="#333">0</text>
    <rect x="106" y="56" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="129" y="82" fill="#333">1</text>
    <rect x="60" y="96" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="83" y="122" fill="#333">0</text>
    <rect x="106" y="96" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="129" y="122" fill="#333">1</text>
    <rect x="60" y="136" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="83" y="162" fill="#333">0</text>
    <rect x="106" y="136" width="46" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="129" y="162" fill="#333">0</text>
    <text x="106" y="196" text-anchor="middle" font-size="11" fill="#777">grid（3 行 2 列）</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="200" y="52" width="164" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="282" y="74" text-anchor="middle" fill="#a06c10">路线 1：所有行回文</text>
    <text x="282" y="96" text-anchor="middle" fill="#333">行 0、行 1 各翻 1 格</text>
    <text x="282" y="118" text-anchor="middle" fill="#333">行 2 已回文</text>
    <text x="282" y="140" text-anchor="middle" fill="#a06c10" font-weight="bold">rowFlips = 2</text>

    <rect x="380" y="52" width="164" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="462" y="74" text-anchor="middle" fill="#2d5a22">路线 2：所有列回文</text>
    <text x="462" y="96" text-anchor="middle" fill="#333">列 0 已是 0,0,0</text>
    <text x="462" y="118" text-anchor="middle" fill="#333">列 1 的 1 与 0 不等</text>
    <text x="462" y="140" text-anchor="middle" fill="#2d5a22" font-weight="bold">colFlips = 1</text>

    <path d="M 282 148 L 282 178" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 462 148 L 462 178" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="260" y="184" width="224" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
    <text x="372" y="206" text-anchor="middle" fill="#446688">答案 = min(2, 1) = 1</text>
    <text x="372" y="224" text-anchor="middle" font-size="11" fill="#666">不需要两者同时成立</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="48" y="264" width="484" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="64" y="288" fill="#333">行路线：对每行 j &lt; n/2 检查 grid[i][j] 与 grid[i][n−1−j]，不等就翻一个</text>
    <text x="64" y="310" fill="#333">列路线：对每列 i &lt; m/2 检查 grid[i][j] 与 grid[m−1−i][j]</text>
    <text x="64" y="326" fill="#666">两种统计互不影响，各自独立求和后取 min，O(m·n)</text>
  </g>
</svg>
