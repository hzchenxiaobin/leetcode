<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="320" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">栈的高度 ↔ 未匹配括号：两种缺失分开数</text>
  <rect x="60" y="60" width="150" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135.0" y="88.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫描字符串</text>
  <rect x="240" y="60" width="180" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="87.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">needRight：无 ( 可配的 )</text>
  <rect x="440" y="60" width="180" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="87.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">open：末尾残留的 (</text>
  <text x="330" y="150" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">"())"  →  needRight = 1, open = 0  →  答案 1</text>
  <text x="330" y="186" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">"((("  →  needRight = 0, open = 3  →  答案 3</text>
  <text x="330" y="222" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">")("  →  needRight = 1, open = 1  →  答案 2</text>
  <text x="330" y="270" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">答案 = needRight + open：左侧缺 ( 的、右侧缺 ) 的，恰好是全部必须补的括号</text>
  <text x="330" y="300" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两者不可能互相抵消：缺 ( 的位置在缺 ) 的左侧</text>
</svg>
