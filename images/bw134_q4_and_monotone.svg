<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">AND 只会把 1 变成 0：值随区间变长单调不增</text>

  <rect x="56" y="72" width="76" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="94" y="100" text-anchor="middle" font-size="15" fill="#2b4a66" filter="url(#rough2)">7</text>
  <text x="94" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">111</text>

  <rect x="156" y="72" width="76" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="100" text-anchor="middle" font-size="15" fill="#2b4a66" filter="url(#rough2)">6</text>
  <text x="194" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">110</text>

  <rect x="256" y="72" width="76" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="294" y="100" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">4</text>
  <text x="294" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100</text>

  <rect x="356" y="72" width="76" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="394" y="100" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="394" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">000</text>

  <path d="M 136 100 L 152 100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 236 100 L 252 100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 336 100 L 352 100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="144" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">&amp; 6</text>
  <text x="244" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">&amp; 4</text>
  <text x="344" y="64" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">&amp; 0</text>

  <text x="94" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">保留 2 位</text>
  <text x="194" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">丢掉 bit0</text>
  <text x="294" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">丢掉 bit1</text>
  <text x="394" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">丢掉 bit2</text>

  <rect x="50" y="176" width="420" height="44" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">固定右端点 r：left 左移 ⇒ 区间变长 ⇒ AND 只会更小或不变</text>

  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所以「以 r 结尾的所有子数组」的 AND 值只有少量不同取值</text>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每变化一次至少丢掉一个二进制位 ⇒ 至多 30 次变化（10^9 &lt; 2^30）</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">于是每个 r 维护一张「值 → 出现次数」的小表即可</text>
</svg>
