<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="440" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [2, 6, 4, 8, 10, 9, 15]</text>
  <path d="M 240 40 Q 450 48 660 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ================= 左表：求 r ================= -->
  <text x="30" y="64" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 左 → 右：nums[i] &lt; mx ？命中则 r = i</text>

  <rect x="30" y="76" width="406" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="53" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">i</text>
  <text x="118" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">nums[i]</text>
  <text x="208" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">mx（更新后）</text>
  <text x="264" y="96" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">动作</text>

  <rect x="30" y="106" width="406" height="28" fill="#ffffff" stroke="#c9d6e3" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="134" width="406" height="28" fill="#f4f6f8" stroke="#c9d6e3" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="162" width="406" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="30" y="190" width="406" height="28" fill="#f4f6f8" stroke="#c9d6e3" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="218" width="406" height="28" fill="#ffffff" stroke="#c9d6e3" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="246" width="406" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="30" y="274" width="406" height="28" fill="#f4f6f8" stroke="#c9d6e3" stroke-width="1" filter="url(#rough2)"/>

  <path d="M 76 76 L 76 302 M 160 76 L 160 302 M 256 76 L 256 302" stroke="#c9d6e3" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="53" y="125" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="118" y="125" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="125" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="264" y="125" font-size="11" fill="#555" filter="url(#rough2)">初始化 mx = 2，r = -1</text>

  <text x="53" y="153" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="118" y="153" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="208" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="264" y="153" font-size="11" fill="#555" filter="url(#rough2)">6 ≥ 2，mx 抬到 6</text>

  <text x="53" y="181" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="118" y="181" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">4</text>
  <text x="208" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="264" y="181" font-size="11" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">4 &lt; 6 ⇒ r = 2</text>

  <text x="53" y="209" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="118" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="208" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="264" y="209" font-size="11" fill="#555" filter="url(#rough2)">8 ≥ 6，mx 抬到 8</text>

  <text x="53" y="237" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="118" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">10</text>
  <text x="208" y="237" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="264" y="237" font-size="11" fill="#555" filter="url(#rough2)">10 ≥ 8，mx 抬到 10</text>

  <text x="53" y="265" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5</text>
  <text x="118" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">9</text>
  <text x="208" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="264" y="265" font-size="11" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">9 &lt; 10 ⇒ r = 5</text>

  <text x="53" y="293" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">6</text>
  <text x="118" y="293" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">15</text>
  <text x="208" y="293" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="264" y="293" font-size="11" fill="#555" filter="url(#rough2)">15 ≥ 10，mx 抬到 15</text>

  <text x="30" y="324" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">收尾：r = 5（最后一次被更新的下标）</text>

  <!-- ================= 右表：求 l ================= -->
  <text x="470" y="64" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 右 → 左：nums[i] &gt; mn ？命中则 l = i</text>

  <rect x="470" y="76" width="420" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6630" filter="url(#rough2)">i</text>
  <text x="558" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6630" filter="url(#rough2)">nums[i]</text>
  <text x="648" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6630" filter="url(#rough2)">mn（更新后）</text>
  <text x="704" y="96" font-size="11.5" font-weight="bold" fill="#3d6630" filter="url(#rough2)">动作</text>

  <rect x="470" y="106" width="420" height="28" fill="#ffffff" stroke="#cbdec7" stroke-width="1" filter="url(#rough2)"/>
  <rect x="470" y="134" width="420" height="28" fill="#f4f6f8" stroke="#cbdec7" stroke-width="1" filter="url(#rough2)"/>
  <rect x="470" y="162" width="420" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="470" y="190" width="420" height="28" fill="#f4f6f8" stroke="#cbdec7" stroke-width="1" filter="url(#rough2)"/>
  <rect x="470" y="218" width="420" height="28" fill="#ffffff" stroke="#cbdec7" stroke-width="1" filter="url(#rough2)"/>
  <rect x="470" y="246" width="420" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="470" y="274" width="420" height="28" fill="#f4f6f8" stroke="#cbdec7" stroke-width="1" filter="url(#rough2)"/>

  <path d="M 516 76 L 516 302 M 600 76 L 600 302 M 696 76 L 696 302" stroke="#cbdec7" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="493" y="125" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">6</text>
  <text x="558" y="125" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">15</text>
  <text x="648" y="125" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="704" y="125" font-size="11" fill="#555" filter="url(#rough2)">初始化 mn = 15，l = 6</text>

  <text x="493" y="153" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5</text>
  <text x="558" y="153" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <text x="648" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="704" y="153" font-size="11" fill="#555" filter="url(#rough2)">9 ≤ 15，mn 压到 9</text>

  <text x="493" y="181" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="558" y="181" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">10</text>
  <text x="648" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="704" y="181" font-size="11" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">10 &gt; 9 ⇒ l = 4</text>

  <text x="493" y="209" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="558" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="648" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="704" y="209" font-size="11" fill="#555" filter="url(#rough2)">8 ≤ 9，mn 压到 8</text>

  <text x="493" y="237" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="558" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="648" y="237" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="704" y="237" font-size="11" fill="#555" filter="url(#rough2)">4 ≤ 8，mn 压到 4</text>

  <text x="493" y="265" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="558" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">6</text>
  <text x="648" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="704" y="265" font-size="11" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">6 &gt; 4 ⇒ l = 1</text>

  <text x="493" y="293" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="558" y="293" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="648" y="293" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="704" y="293" font-size="11" fill="#555" filter="url(#rough2)">2 ≤ 4，mn 压到 2</text>

  <text x="470" y="324" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">收尾：l = 1（倒序中最后一次更新，即最左）</text>

  <!-- 结论 -->
  <rect x="200" y="342" width="500" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a7526" filter="url(#rough2)">长度 = r - l + 1 = 5 - 1 + 1 = 5</text>
  <text x="450" y="394" text-anchor="middle" font-size="12" fill="#7a5a1c" filter="url(#rough2)">只需把 [6, 4, 8, 10, 9] 升序，全数组即升序</text>
</svg>
