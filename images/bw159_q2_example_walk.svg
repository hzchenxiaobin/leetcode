<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：coords = [(1,1),(1,2),(3,2),(3,3)]</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">xmin=1, xmax=3, ymin=1, ymax=3</text>
  <rect x="40" y="66" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">底类型</text>
  <rect x="140" y="66" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">固定值</text>
  <rect x="240" y="66" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">底</text>
  <rect x="360" y="66" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">高</text>
  <rect x="510" y="66" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="555.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2×面积</text>
  <rect x="40" y="96" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">竖底</text>
  <rect x="140" y="96" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">x=1</text>
  <rect x="240" y="96" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2-1 = 1</text>
  <rect x="360" y="96" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">max(0,2) = 2</text>
  <rect x="510" y="96" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="555.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="40" y="126" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">竖底</text>
  <rect x="140" y="126" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">x=3</text>
  <rect x="240" y="126" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3-2 = 1</text>
  <rect x="360" y="126" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">max(2,0) = 2</text>
  <rect x="510" y="126" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="555.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="40" y="156" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">横底</text>
  <rect x="140" y="156" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">y=2</text>
  <rect x="240" y="156" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3-1 = 2</text>
  <rect x="360" y="156" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">max(1,1) = 1</text>
  <rect x="510" y="156" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="555.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="40" y="200" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">三种取法都得 2：官方示例答案为 2（面积 1，返回两倍面积）</text>
  <text x="300.0" y="242.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">示例 2 的三个点共线且无轴平行边 -&gt; 返回 -1</text>
  <text x="40" y="288" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">若底或高为 0，该候选面积为 0，必须排除</text>
</svg>
