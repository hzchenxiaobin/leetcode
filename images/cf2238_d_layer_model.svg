<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分层模型：整除关系决定层号，同层必须 gcd 连通</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">以 n = 12 为例：除 1 外的因数 2、3、4、6、12</text>

  <!-- 四个层带 -->
  <rect x="80" y="82" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="80" y="132" width="300" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="80" y="182" width="300" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="80" y="232" width="300" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="66" y="106" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">L1</text>
  <text x="66" y="156" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">L2</text>
  <text x="66" y="206" text-anchor="end" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">L3</text>
  <text x="66" y="256" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">L4</text>

  <!-- 元素 -->
  <rect x="112" y="88" width="46" height="26" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">2</text>

  <rect x="196" y="138" width="46" height="26" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <rect x="112" y="188" width="46" height="26" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6b18" filter="url(#rough2)">4</text>
  <rect x="196" y="188" width="46" height="26" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6b18" filter="url(#rough2)">6</text>

  <rect x="112" y="238" width="46" height="26" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#a4463f" filter="url(#rough2)">12</text>

  <!-- 整除箭头 -->
  <path d="M 135 116 L 135 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 116 L 208 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 219 166 L 219 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 135 216 L 135 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 213 216 L 152 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 规则面板 -->
  <rect x="470" y="72" width="270" height="212" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="96" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">规则 1（偏序）</text>
  <text x="492" y="118" font-size="12.5" fill="#444" filter="url(#rough2)">x ∈ Li ⇒ x 的所有真因数</text>
  <text x="492" y="140" font-size="12.5" fill="#444" filter="url(#rough2)">都落在更早的层 L1 … L(i−1)</text>
  <text x="486" y="166" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">规则 2（链）</text>
  <text x="492" y="188" font-size="12.5" fill="#444" filter="url(#rough2)">同层内能排成一条链，</text>
  <text x="492" y="210" font-size="12.5" fill="#444" filter="url(#rough2)">相邻两者的 gcd &gt; 1</text>
  <text x="486" y="236" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">推论</text>
  <text x="492" y="258" font-size="12.5" fill="#444" filter="url(#rough2)">层号(x) ≥ Ω(x)，层数 ≥ Ω(n)</text>

  <text x="80" y="302" font-size="12.5" fill="#555" filter="url(#rough2)">箭头 x → y 表示 x | y：x 必须严格出现在 y 之前的层</text>
  <text x="80" y="326" font-size="12.5" fill="#555" filter="url(#rough2)">L3 = {4, 6}：gcd(4,6) = 2 &gt; 1，可以同层</text>
  <text x="80" y="350" font-size="12.5" fill="#555" filter="url(#rough2)">但 gcd(3,4) = 1，二者不能同层 → 质数总是各占一层</text>
  <text x="380" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 12：Ω = 3，ω = 2 ⇒ 答案 3 + 2 − 1 = 4（正好 4 层）</text>
</svg>
