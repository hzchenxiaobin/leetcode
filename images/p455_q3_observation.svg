<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：兄弟子树的「差」只能在各自子树内部补齐</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">所有叶子得分相等 ⟺ 每个节点的各孩子子树「公共路径和」彼此相等（且只增不减）</text>

  <!-- 节点 u -->
  <circle cx="250" cy="92" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="97" text-anchor="middle" font-size="13" fill="#2a4666" font-weight="bold" filter="url(#rough2)">u</text>

  <!-- 边 u-A / u-B -->
  <path d="M 232 107 L 150 172" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 268 107 L 350 172" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 孩子圆圈 -->
  <circle cx="135" cy="190" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="195" text-anchor="middle" font-size="12.5" fill="#2a4666" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="385" cy="190" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="195" text-anchor="middle" font-size="12.5" fill="#2a4666" font-weight="bold" filter="url(#rough2)">B</text>

  <!-- 差值标注 -->
  <path d="M 159 190 L 361 190" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4"
        marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">差 3（只能由 B 侧补）</text>

  <!-- 子树 A -->
  <ellipse cx="135" cy="282" rx="88" ry="44" fill="#e8f0fe" fill-opacity="0.45"
           stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="135" y="272" text-anchor="middle" font-size="11" fill="#2a4666" filter="url(#rough2)">A 的子树</text>
  <text x="135" y="290" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold" filter="url(#rough2)">最大路径和 mx(A) = 8</text>
  <circle cx="105" cy="310" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="135" cy="315" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="165" cy="310" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 子树 B -->
  <ellipse cx="385" cy="282" rx="88" ry="44" fill="#e8f0fe" fill-opacity="0.45"
           stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="385" y="272" text-anchor="middle" font-size="11" fill="#2a4666" filter="url(#rough2)">B 的子树</text>
  <text x="385" y="290" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold" filter="url(#rough2)">最大路径和 mx(B) = 5</text>
  <circle cx="355" cy="310" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="385" cy="315" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="415" cy="310" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 红色提示：在 u 加价无用 -->
  <g filter="url(#rough2)">
    <rect x="352" y="56" width="158" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="431" y="74" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">在 u 处 +δ：</text>
    <text x="431" y="91" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">A、B 同涨，差值 3 不变 ✗</text>
  </g>
  <path d="M 350 82 L 282 90" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 绿色徽章：在 B 处一次加价 -->
  <path d="M 385 328 L 385 341" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="295" y="344" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
    <text x="385" y="365" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">在 B 处一次 +3 → 只计 1 个节点 ✓</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="25" y="388" width="470" height="34" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="260" y="403" text-anchor="middle" font-size="9.5" fill="#555">只增不减 ⟹ 每个孩子子树的公共值 ≥ 各自 mx；兄弟差 3 必须由 B 侧的加价补齐，祖先处加价无效</text>
    <text x="260" y="416" text-anchor="middle" font-size="9.5" fill="#555">缺口再大也只需在子树根 B 加价一次即可覆盖 B 的全部叶子 → 每个节点只数「低于兄弟最大值的孩子数」</text>
  </g>
</svg>
