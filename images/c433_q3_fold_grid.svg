<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#fdfcf7"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">把直线对折成 2×m 网格（以 n = 6 为例）</text>
  <path d="M 300 40 Q 480 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 直线上的房子 ===== -->
  <text x="110" y="122" text-anchor="end" font-size="10" fill="#888" filter="url(#sk)">直线上</text>
  <g>
    <g filter="url(#sk)"><rect x="140" y="96" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="172" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">0</text>
    <g filter="url(#sk)"><rect x="224" y="96" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="256" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="308" y="96" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="340" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="392" y="96" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="424" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="476" y="96" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="508" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
    <g filter="url(#sk)"><rect x="560" y="96" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="592" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">5</text>
  </g>

  <!-- 相邻约束（红虚线） -->
  <g stroke="#b85450" stroke-width="2" stroke-dasharray="3 2">
    <path d="M 204 117 L 224 117" filter="url(#sk)"/>
    <path d="M 288 117 L 308 117" filter="url(#sk)"/>
    <path d="M 372 117 L 392 117" filter="url(#sk)"/>
    <path d="M 456 117 L 476 117" filter="url(#sk)"/>
    <path d="M 540 117 L 560 117" filter="url(#sk)"/>
  </g>
  <text x="382" y="156" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#sk)">相邻约束：相邻位置颜色不同（红虚线）</text>

  <!-- 等距对弧线 -->
  <path d="M 172 94 Q 380 40 592 94" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 256 94 Q 382 64 508 94" stroke="#c98a2b" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 340 94 Q 382 82 424 94" stroke="#4a8e4a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="600" y="46" text-anchor="start" font-size="10" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">等距对 (0,5)</text>
  <text x="516" y="66" text-anchor="start" font-size="10" font-weight="bold" fill="#7a5415" filter="url(#sk)">(1,4)</text>
  <text x="430" y="86" text-anchor="start" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">(2,3)</text>
  <text x="648" y="122" text-anchor="start" font-size="10" fill="#666" filter="url(#sk)">弧 = 距两端等距的一对，</text>
  <text x="648" y="138" text-anchor="start" font-size="10" fill="#666" filter="url(#sk)">必须涂成不同颜色</text>

  <!-- 对折箭头 -->
  <path d="M 382 166 Q 352 196 376 226" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="396" y="200" text-anchor="start" font-size="12" font-weight="bold" fill="#666" filter="url(#sk)">从中点对折</text>

  <!-- ===== 2×3 网格 ===== -->
  <g font-size="10" fill="#888">
    <text x="178" y="230" text-anchor="middle" filter="url(#sk)">列0</text>
    <text x="262" y="230" text-anchor="middle" filter="url(#sk)">列1</text>
    <text x="346" y="230" text-anchor="middle" filter="url(#sk)">列2</text>
    <text x="126" y="262" text-anchor="end" filter="url(#sk)">上行</text>
    <text x="126" y="322" text-anchor="end" filter="url(#sk)">下行</text>
  </g>
  <g font-size="12" fill="#2b6e9e">
    <g filter="url(#sk)"><rect x="140" y="236" width="76" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="178" y="264" text-anchor="middle" filter="url(#sk)">位置0</text>
    <g filter="url(#sk)"><rect x="224" y="236" width="76" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="262" y="264" text-anchor="middle" filter="url(#sk)">位置1</text>
    <g filter="url(#sk)"><rect x="308" y="236" width="76" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="346" y="264" text-anchor="middle" filter="url(#sk)">位置2</text>
    <g filter="url(#sk)"><rect x="140" y="296" width="76" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="178" y="324" text-anchor="middle" filter="url(#sk)">位置5</text>
    <g filter="url(#sk)"><rect x="224" y="296" width="76" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="262" y="324" text-anchor="middle" filter="url(#sk)">位置4</text>
    <g filter="url(#sk)"><rect x="308" y="296" width="76" height="46" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="346" y="324" text-anchor="middle" filter="url(#sk)">位置3</text>
  </g>

  <!-- 竖直边：等距约束（颜色与弧一一对应） -->
  <path d="M 178 282 Q 173 289 178 296" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 262 282 Q 257 289 262 296" stroke="#c98a2b" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 346 282 Q 341 289 346 296" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>

  <!-- 水平边：相邻约束 -->
  <g stroke="#b85450" stroke-width="2" stroke-dasharray="3 2">
    <path d="M 216 259 Q 220 259 224 259" filter="url(#sk)"/>
    <path d="M 300 259 Q 304 259 308 259" filter="url(#sk)"/>
    <path d="M 216 319 Q 220 319 224 319" filter="url(#sk)"/>
    <path d="M 300 319 Q 304 319 308 319" filter="url(#sk)"/>
  </g>

  <text x="382" y="366" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">竖直边＝等距约束（颜色与上方弧一一对应）</text>
  <text x="382" y="384" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#sk)">水平边＝相邻约束（与直线上的红虚线一致）</text>

  <!-- 说明框 -->
  <g filter="url(#sk)"><rect x="430" y="236" width="500" height="106" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="452" y="262" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">折叠映射（双射）</text>
  <text x="452" y="284" font-size="11" fill="#444" filter="url(#sk)">位置 k（前半）→ 第 k 列上格；位置 n−1−k（后半）→ 第 k 列下格</text>
  <text x="452" y="306" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">漂亮涂色 ⟺ 网格中相邻格子（横/竖）颜色都不同</text>
  <text x="452" y="328" font-size="11" fill="#444" filter="url(#sk)">每列上下两色记作状态 (a, b)，要求 a ≠ b，共 3×2 = 6 个状态</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)"><rect x="140" y="402" width="790" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="535" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">对折的威力：等距约束从「非局部」变成「局部」的竖直相邻</text>
  <text x="535" y="446" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">逐位置 DP 失去无后效性（位置 0 依赖位置 n−1）→ 配对成列后即可按列转移</text>
</svg>
