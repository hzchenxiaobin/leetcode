<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：火 BFS → 三分支 → 二分 + 可行性 BFS</text>

  <!-- 开始 -->
  <rect x="220" y="46" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">多源 BFS 得 fire</text>

  <path d="M 280 82 L 280 106" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="280,108 400,148 280,188 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="143" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">canEscape(w=0)</text>
  <text x="280" y="160" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">可行？</text>

  <path d="M 160 148 L 90 148 L 90 178" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="140" font-size="12" fill="#8a3a36" filter="url(#rough2)">否</text>
  <rect x="40" y="180" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="201" text-anchor="middle" font-size="13.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 280 188 L 280 212" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="204" font-size="12" fill="#2d5a22" filter="url(#rough2)">是</text>

  <!-- 菱形 2 -->
  <polygon points="280,214 396,252 280,290 164,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">fire[安全屋] = +∞？</text>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（火到不了）</text>

  <path d="M 396 252 L 470 252 L 470 282" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="244" font-size="12" fill="#8a3a36" filter="url(#rough2)">是</text>
  <rect x="414" y="284" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="305" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 10⁹</text>

  <path d="M 280 290 L 280 314" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="306" font-size="12" fill="#2d5a22" filter="url(#rough2)">否</text>

  <!-- 二分 -->
  <rect x="130" y="316" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">二分 w ∈ [0, 10⁹]：最大 w 使 canEscape(w)</text>
  <text x="280" y="357" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">每轮一次人 BFS（fire 表复用），O(mn) 判定</text>
</svg>
