<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 4, k = 11 —— 三次进右半，回代三次取反</text>

  <g filter="url(#rough2)">
    <rect x="125" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="138" y="56" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="151" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="164" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="177" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="190" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="203" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="216" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="229" y="32" width="26" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="242" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">0</text>
    <rect x="255" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="268" y="56" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="281" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="294" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="307" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="320" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="333" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="346" y="56" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="359" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="372" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="385" y="32" width="26" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="398" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
    <rect x="411" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="424" y="56" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="437" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="450" y="56" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="463" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="476" y="56" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="489" y="36" width="26" height="30" rx="4" fill="#eef2f6" stroke="#8fa1b3" stroke-width="1.2"/>
    <text x="502" y="56" text-anchor="middle" font-size="12" fill="#333">1</text>

    <text x="138" y="74" text-anchor="middle" font-size="8" fill="#999">1</text>
    <text x="164" y="74" text-anchor="middle" font-size="8" fill="#999">2</text>
    <text x="190" y="74" text-anchor="middle" font-size="8" fill="#999">3</text>
    <text x="216" y="74" text-anchor="middle" font-size="8" fill="#999">4</text>
    <text x="242" y="74" text-anchor="middle" font-size="8" fill="#999">5</text>
    <text x="268" y="74" text-anchor="middle" font-size="8" fill="#999">6</text>
    <text x="294" y="74" text-anchor="middle" font-size="8" fill="#999">7</text>
    <text x="320" y="74" text-anchor="middle" font-size="8" fill="#999">8</text>
    <text x="346" y="74" text-anchor="middle" font-size="8" fill="#999">9</text>
    <text x="372" y="74" text-anchor="middle" font-size="8" fill="#999">10</text>
    <text x="398" y="74" text-anchor="middle" font-size="8" fill="#999">11</text>
    <text x="424" y="74" text-anchor="middle" font-size="8" fill="#999">12</text>
    <text x="450" y="74" text-anchor="middle" font-size="8" fill="#999">13</text>
    <text x="476" y="74" text-anchor="middle" font-size="8" fill="#999">14</text>
    <text x="502" y="74" text-anchor="middle" font-size="8" fill="#999">15</text>

    <text x="320" y="92" text-anchor="middle" font-size="10.5" fill="#666">S₄ = 011100110110001；红 = 所求第 11 位，橙 = 镜像位第 5 位（16 − 11 = 5，S₄[11] = 1 ⊕ S₄[5]）</text>

    <rect x="70" y="104" width="140" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="140" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">(n=4, k=11)</text>

    <path d="M 140 140 L 140 184" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="152" y="158" font-size="10.5" fill="#8a3a36">11 &gt; mid=8 → 右半</text>
    <text x="152" y="172" font-size="10.5" fill="#8a3a36">k ← 16−11 = 5，返回值取反</text>

    <rect x="70" y="190" width="140" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="140" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">(n=3, k=5)</text>

    <path d="M 140 226 L 140 270" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="152" y="244" font-size="10.5" fill="#8a3a36">5 &gt; mid=4 → 右半</text>
    <text x="152" y="258" font-size="10.5" fill="#8a3a36">k ← 8−5 = 3，返回值取反</text>

    <rect x="70" y="276" width="140" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="140" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">(n=2, k=3)</text>

    <path d="M 140 312 L 140 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="152" y="330" font-size="10.5" fill="#8a3a36">3 &gt; mid=2 → 右半</text>
    <text x="152" y="344" font-size="10.5" fill="#8a3a36">k ← 4−3 = 1，返回值取反</text>

    <rect x="70" y="362" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="140" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">(n=1, k=1)</text>
    <text x="140" y="416" text-anchor="middle" font-size="10.5" fill="#2e5e2e">基例：S₁ = "0" → 返回 '0'</text>

    <path d="M 330 358 L 330 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="342" y="344" font-size="10.5" fill="#b85450">返回 '0' → 取反 '1'</text>

    <path d="M 330 278 L 330 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="342" y="258" font-size="10.5" fill="#b85450">返回 '1' → 取反 '0'</text>

    <path d="M 330 198 L 330 144" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="342" y="176" font-size="10.5" fill="#b85450">返回 '0' → 取反 '1'</text>

    <path d="M 214 122 L 422 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="318" y="114" text-anchor="middle" font-size="10" fill="#666">回代完成</text>

    <rect x="426" y="100" width="190" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="521" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">S₄[11] = '1'</text>
    <text x="521" y="140" text-anchor="middle" font-size="9.5" fill="#8a3a36">基例 '0' 经奇数次取反</text>

    <text x="320" y="442" text-anchor="middle" font-size="10.5" fill="#666">验证：S₄ = 011100110110001，第 11 位 = '1'，与示例 2 一致 ✓</text>
  </g>
</svg>
