<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">分割型 DP：枚举最后一段的起点 j</text>

  <rect x="60" y="60" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="60" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="60" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="11" fill="#333">第 1 段</text>
  <text x="201" y="82" text-anchor="middle" font-size="11" fill="#333">第 2 段</text>
  <text x="312" y="82" text-anchor="middle" font-size="11" fill="#333">最后一段 [j, i)</text>

  <path d="M252,110 L252,132" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="126" font-size="11" fill="#d6a040">j</text>
  <path d="M372,110 L372,132" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="126" font-size="11" fill="#d6a040">i</text>

  <rect x="60" y="150" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="177" font-size="12" fill="#333">dp[t][i] = min{ dp[t−1][j] + w(j,i) }，w = S(S+1)/2，S = pre[i] − pre[j]</text>

  <rect x="60" y="204" width="210" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="226" font-size="11" fill="#b85450">暴力 O(k·n²)</text>
  <text x="74" y="244" font-size="11" fill="#333">n = k = 1000 → 10⁹，太慢</text>

  <rect x="290" y="204" width="210" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="304" y="226" font-size="11" fill="#4a7a3a">凸代价 → 决策单调</text>
  <text x="304" y="244" font-size="11" fill="#333">分治优化 O(k·n log n)</text>

  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#666">f(x)=x(x+1)/2 凸 ⇒ 四边形不等式 ⇒ opt(i) 随 i 右移</text>
</svg>
