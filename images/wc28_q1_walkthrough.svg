<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "PPALLL" → false</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cntA 只增不减，curL 遇非 L 归零、遇 L 自增</text>

  <rect x="60" y="70" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">索引 i</text>
  <text x="192" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cntA</text>
  <text x="368" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">curL</text>
  <text x="456" y="92" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">状态</text>

  <g filter="url(#rough2)">
    <rect x="60" y="108" width="440" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="104" y="128" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="192" y="128" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">P</text>
    <text x="280" y="128" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="368" y="128" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="456" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">继续</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="140" width="440" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="104" y="160" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="192" y="160" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">P</text>
    <text x="280" y="160" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="368" y="160" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="456" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">继续</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="172" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="104" y="192" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="192" y="192" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">A</text>
    <text x="280" y="192" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">1</text>
    <text x="368" y="192" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="456" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">继续</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="204" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="104" y="224" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="192" y="224" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">L</text>
    <text x="280" y="224" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="368" y="224" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">1</text>
    <text x="456" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">继续</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="236" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="104" y="256" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="192" y="256" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">L</text>
    <text x="280" y="256" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="368" y="256" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">2</text>
    <text x="456" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">继续</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="268" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="104" y="288" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="192" y="288" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">L</text>
    <text x="280" y="288" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="368" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <text x="456" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">违规</text>
  </g>

  <path d="M 490 283 L 508 283" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 5 步 curL 涨到 3，规则 ② 被破坏，立即返回 false</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照 "PPALLP"：curL 峰值只有 2、cntA = 1，两个条件都满足 → true</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 A 只把 curL 清零、不会让 curL 自增；P 既不增 cntA 也不增 curL</text>
</svg>
