<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="390" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">转移：换字符的 O(26) 枚举用“最小 + 次小”压成 O(1)</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">换字符的代价只依赖新字符 c′，所以可以预处理所有 c′ 的最优值</text>

  <text x="44" y="80" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">每个位置 i 先算两样东西：</text>
  <rect x="44" y="90" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="112" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">cost[c] = |s[i] − c|　（把 s[i] 改成 c）</text>

  <rect x="44" y="132" width="530" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="154" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">v[c′] = cost[c′] + f[i+1][c′][1]　（在 i 处换成 c′、开新段，之后的最小代价）</text>

  <text x="44" y="196" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">再取 v 的最小值与次小值：</text>
  <g filter="url(#rough2)">
    <rect x="44" y="206" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <rect x="222" y="206" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <rect x="400" y="206" width="174" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="124" y="222" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">best1 = min v[c′]</text>
    <text x="124" y="238" fill="#8a6a20" filter="url(#rough2)">及取到它的 arg1</text>
    <text x="302" y="222" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">best2 = 次小值</text>
    <text x="302" y="238" fill="#8a3a36" filter="url(#rough2)">（arg 与 arg1 不同）</text>
    <text x="487" y="222" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">换字符到 c 的最优值</text>
    <text x="487" y="238" fill="#3a4a66" filter="url(#rough2)">= best1（c ≠ arg1）否则 best2</text>
  </g>

  <path d="M 310 250 L 310 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="278" width="540" height="96" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <text x="56" y="298" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">转移式（i 从 n−1 倒推到 0）：</text>
    <text x="56" y="318" fill="#555" filter="url(#rough2)">f[i][c][1] = cost[c] + f[i+1][c][2]　　　　　（段长不足 3，只能继续放 c）</text>
    <text x="56" y="336" fill="#555" filter="url(#rough2)">f[i][c][2] = cost[c] + f[i+1][c][3]</text>
    <text x="56" y="354" fill="#555" filter="url(#rough2)">f[i][c][3] = min( cost[c] + f[i+1][c][3] , 换字符到其它 c′ 的最优值 )</text>
    <text x="56" y="370" fill="#4a7a3a" filter="url(#rough2)">起点：ans = min_c cost(0, c) + f[1][c][1]　；若 ans = ∞ 说明 n &lt; 3，返回 ""</text>
  </g>
</svg>
