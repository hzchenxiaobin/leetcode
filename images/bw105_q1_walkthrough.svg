<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：买得起 vs 买不起</text>

  <!-- 示例 1 -->
  <rect x="30" y="48" width="222" height="248" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="72" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">示例 1：prices = [1,2,2]，money = 3</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="56" y="86" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="77" y="110" fill="#8c3a36">1</text>
    <rect x="104" y="86" width="42" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="125" y="110" fill="#7a5a10">2</text>
    <rect x="152" y="86" width="42" height="38" rx="4" fill="#eef0f2" stroke="#999" stroke-width="1.4"/>
    <text x="173" y="110" fill="#777">2</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#2f5527">
    <text x="48" y="146">m₁ = 1，m₂ = 2</text>
    <text x="48" y="168">cost = 1 + 2 = 3 ≤ money = 3 ✓</text>
    <text x="48" y="190">买下价格 1 和 2 的两块</text>
    <text x="48" y="216" font-size="14" fill="#4a7a3a">返回 3 − 3 = 0</text>
    <text x="48" y="244" font-size="11" fill="#5a7a4a">另一块价格 2 与被选中的次小并列，</text>
    <text x="48" y="260" font-size="11" fill="#5a7a4a">选哪一块都一样便宜，不影响答案</text>
  </g>

  <!-- 示例 2 -->
  <rect x="268" y="48" width="222" height="248" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="72" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">示例 2：prices = [3,2,3]，money = 3</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="294" y="86" width="42" height="38" rx="4" fill="#eef0f2" stroke="#999" stroke-width="1.4"/>
    <text x="315" y="110" fill="#777">3</text>
    <rect x="342" y="86" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="363" y="110" fill="#8c3a36">2</text>
    <rect x="390" y="86" width="42" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="411" y="110" fill="#7a5a10">3</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="286" y="146">m₁ = 2，m₂ = 3</text>
    <text x="286" y="168">cost = 2 + 3 = 5 &gt; money = 3 ✗</text>
    <text x="286" y="190">最便宜的两块都买不起 →</text>
    <text x="286" y="212">任何两块必然更贵，全都买不起</text>
    <text x="286" y="238" font-size="14" fill="#b85450">返回 money = 3</text>
    <text x="286" y="264" font-size="11" fill="#a06660">“买不起”不扣钱：剩余非负天然满足</text>
  </g>
</svg>
