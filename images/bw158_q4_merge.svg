<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="390" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">树上 DP：f[u][mask] = 子树 u 内数位恰好为 mask 的最大分数</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">合并孩子 = 不相交掩码的 max-plus 子集卷积</text>
  <rect x="120" y="56" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="77.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">叶子：f[u][0] = 0，f[u][mask_u] = vals[u]</text>
  <path d="M 290.0 90 L 290.0 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="104" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="125.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">合并孩子 v：枚举 m 的子掩码 sub</text>
  <path d="M 290.0 138 L 290.0 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="152" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="173.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">g[m] = max(f_u[sub] + f_v[m ^ sub])</text>
  <path d="M 290.0 186 L 290.0 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="200" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="221.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">若 sub 与 m^sub 有交 -&gt; 该转移非法（自动被 0/负值排除）</text>
  <path d="M 290.0 234 L 290.0 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="248" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="269.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">答案：Σ_u max_m f[u][m]</text>
  <rect x="480" y="60" width="100" height="120" fill="#f1f3f4" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="530.0" y="108.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">次数</text>
  <text x="530.0" y="124.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">O(3^10)</text>
  <text x="530.0" y="140.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">每个孩子</text>
  <text x="40" y="360" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">枚举 m 的全部子掩码总计 3^10 ≈ 5.9e4 次，n &lt;= 500 -&gt; 约 3e7 次运算</text>
</svg>
