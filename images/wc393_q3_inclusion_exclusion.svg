<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：容斥原理数出「≤ x 的可制造金额」个数</text>
  <text x="320" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">以 coins = [2, 5]、x = 12 为例，A_c = {c, 2c, 3c, …}</text>

  <!-- Venn：2 的倍数 ∪ 5 的倍数 -->
  <ellipse cx="240" cy="185" rx="145" ry="100" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="400" cy="185" rx="145" ry="100" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M320,101 A145,100 0 0 1 320,269 A145,100 0 0 1 320,101 Z" fill="#fff8e1" fill-opacity="0.9" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="163" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2 的倍数</text>
  <text x="480" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 的倍数</text>
  <text x="320" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">10 的倍数 = lcm(2,5) 的倍数</text>

  <text x="150" y="175" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">2</text>
  <text x="198" y="152" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">4</text>
  <text x="145" y="215" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">6</text>
  <text x="205" y="212" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">8</text>
  <text x="175" y="258" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">12</text>
  <text x="320" y="192" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">10</text>
  <text x="320" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">被 +1 计了两次！</text>
  <path d="M320,215 V202" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="168" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="487" y="205" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">…</text>

  <!-- 容斥公式 -->
  <rect x="95" y="306" width="95" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="329" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">⌊x/2⌋</text>
  <text x="212" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">+</text>
  <rect x="235" y="306" width="95" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="329" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">⌊x/5⌋</text>
  <text x="352" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">−</text>
  <rect x="373" y="306" width="110" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="329" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">⌊x/10⌋</text>
  <text x="503" y="330" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">=</text>
  <text x="556" y="329" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#rough2)">count(x)</text>

  <!-- 说明框 -->
  <rect x="40" y="366" width="560" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="390" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">x = 12：⌊12/2⌋ + ⌊12/5⌋ − ⌊12/10⌋ = 6 + 2 − 1 = 7，恰为 {2, 4, 5, 6, 8, 10, 12}</text>
  <text x="320" y="414" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">交集结构：同时是 a、b 的倍数 ⟺ 是 lcm(a, b) 的倍数</text>
  <text x="320" y="440" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">符号规律：奇数个面值的子集取「+」，偶数个取「−」</text>
</svg>
