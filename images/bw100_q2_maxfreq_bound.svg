<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">答案 = n − 最大出现次数：上界与构造</text>

  <!-- 频次条形图 -->
  <text x="150" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[1,3,5,2,1,3,1] 的频次</text>
  <g filter="url(#rough2)">
    <rect x="76"  y="150" width="40" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="126" y="216" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="176" y="150" width="40" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="226" y="216" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="96"  y="270" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="146" y="270" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="196" y="270" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="246" y="270" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="96"  y="142" text-anchor="middle" font-size="12" fill="#b85450">×3</text>
    <text x="146" y="208" text-anchor="middle" font-size="12" fill="#446688">×1</text>
    <text x="196" y="142" text-anchor="middle" font-size="12" fill="#446688">×2</text>
    <text x="246" y="208" text-anchor="middle" font-size="12" fill="#446688">×1</text>
  </g>
  <text x="160" y="294" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">最多重复值 v*=1，f=3</text>
  <text x="160" y="314" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">答案 ≤ n − f = 7 − 3 = 4</text>

  <!-- 平移构造 -->
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">排序后整体右移 f 位再配对</text>
  <g filter="url(#rough2)">
    <rect x="316" y="80" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="354" y="80" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="392" y="80" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="80" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="333" y="98" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <text x="371" y="98" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <text x="409" y="98" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <text x="447" y="98" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <text x="306" y="98" text-anchor="end" font-size="12" fill="#888">位置</text>

    <rect x="316" y="160" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="354" y="160" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="392" y="160" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="430" y="160" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="333" y="178" text-anchor="middle" font-size="13" fill="#2f5527">2</text>
    <text x="371" y="178" text-anchor="middle" font-size="13" fill="#2f5527">3</text>
    <text x="409" y="178" text-anchor="middle" font-size="13" fill="#2f5527">3</text>
    <text x="447" y="178" text-anchor="middle" font-size="13" fill="#2f5527">5</text>
    <text x="306" y="178" text-anchor="end" font-size="12" fill="#888">值</text>
  </g>
  <path d="M 333 154 L 333 112" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 371 154 L 371 112" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 409 154 L 409 112" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 447 154 L 447 112" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a[j+f] &gt; a[j]（f = 最大频次时严格成立）</text>
  <text x="400" y="212" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">恰好配出 n − f = 4 对 ✓</text>

  <rect x="90" y="326" width="340" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">若 a[j+f] = a[j]，则该值频次 ≥ f+1，与 f 最大矛盾</text>
</svg>
