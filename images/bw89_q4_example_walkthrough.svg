<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：sum 与各因子的判定演算</text>

  <g filter="url(#rough2)">
    <rect x="50" y="42" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="9"/>
  </g>
  <text x="280" y="69" text-anchor="middle" font-size="12.5" fill="#1a2b45" filter="url(#rough2)">树：0−1，1−2，1−3，3−4，nums = [6,2,2,2,6]</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="80" y="108">c</text>
    <text x="200" y="108" text-anchor="middle">t = S/c</text>
    <text x="400" y="108" text-anchor="middle">K（候选非根子树）→ 判定</text>
  </g>
  <path d="M 55 116 L 520 116" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="142">5, 4</text>
    <text x="200" y="142" text-anchor="middle">18 不被整除</text>
    <text x="400" y="142" text-anchor="middle">跳过</text>
  </g>
  <path d="M 55 152 L 520 152" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="178">3</text>
    <text x="200" y="178" text-anchor="middle">6</text>
    <text x="400" y="178" text-anchor="middle" fill="#1d3a17" font-weight="bold">1（12）、4（6）→ K=2 = c−1 ✓ 返回 2</text>
  </g>
  <path d="M 55 188 L 520 188" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="214">2</text>
    <text x="200" y="214" text-anchor="middle">9</text>
    <text x="400" y="214" text-anchor="middle">12、6、3、8 均非 9 倍数 → K=0 ≠ 1 ✘</text>
  </g>
  <path d="M 55 224 L 520 224" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="250">1</text>
    <text x="200" y="250" text-anchor="middle">18</text>
    <text x="400" y="250" text-anchor="middle">K=0 = c−1 ✓（不删边，兜底方案）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="268" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="290">c 从大到小，首个 K = c−1 的 c=3 直接命中</text>
    <text x="280" y="311">删 (1,0) 与 (4,3)：[0]｜[1,2,3]｜[4] 三块价值 6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="340" width="440" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="360">引理 2 的自动上界：候选边再多也不会超过 c−1</text>
    <text x="280" y="380">（正价值 + 全是 t 的倍数 + 总和 = c·t 三者合力）</text>
  </g>
</svg>
