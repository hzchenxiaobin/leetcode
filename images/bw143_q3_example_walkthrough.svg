<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：a = [1,4,5]，k = 1，m = 2，候选集 {0,1,2,3,4,5,6}</text>

  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="86" y="64">候选 x</text>
    <text x="196" y="64">窗口 [x−1, x+1]</text>
    <text x="316" y="64">c(x)</text>
    <text x="372" y="64">f(x)</text>
    <text x="462" y="64">min(c, f+2)</text>
  </g>
  <path d="M 44 74 L 518 74" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 -->
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="52" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="60" y="118" width="52" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="60" y="154" width="52" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="60" y="190" width="52" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="60" y="226" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="60" y="262" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="86" y="101">0</text>
    <text x="86" y="137">1</text>
    <text x="86" y="173">2</text>
    <text x="86" y="209">3</text>
    <text x="86" y="245" font-weight="bold">4</text>
    <text x="86" y="281">5</text>
  </g>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="196" y="101">[−1,1]</text>
    <text x="196" y="137">[0,2]</text>
    <text x="196" y="173">[1,3]</text>
    <text x="196" y="209">[2,4]</text>
    <text x="196" y="245" font-weight="bold">[3,5]</text>
    <text x="196" y="281">[4,6]</text>
  </g>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="316" y="101">1</text>
    <text x="316" y="137">1</text>
    <text x="316" y="173">1</text>
    <text x="316" y="209">1</text>
    <text x="316" y="245" font-weight="bold">2</text>
    <text x="316" y="281">2</text>
  </g>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="372" y="101">0</text>
    <text x="372" y="137">1</text>
    <text x="372" y="173">0</text>
    <text x="372" y="209">0</text>
    <text x="372" y="245" font-weight="bold">1</text>
    <text x="372" y="281">1</text>
  </g>

  <g font-size="12.5" text-anchor="middle" filter="url(#rough2)">
    <text x="462" y="101" fill="#666">1</text>
    <text x="462" y="137" fill="#666">1</text>
    <text x="462" y="173" fill="#666">1</text>
    <text x="462" y="209" fill="#666">1</text>
    <text x="462" y="245" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="462" y="281" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <path d="M 44 306 L 518 306" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">x = 6 = a₂ + k 也在候选集里；答案为 2</text>
</svg>
