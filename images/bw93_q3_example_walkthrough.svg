<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：stones = [0, 2, 5, 6, 7]</text>

  <!-- 数轴 -->
  <path d="M50,130 L470,130" stroke="#333" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="70" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="160" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="250" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="340" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="430" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- 隔一差括弧 -->
  <path d="M70,110 Q160,78 250,108" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="160" y="72" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i=1: 5 − 0 = 5</text>

  <path d="M160,108 Q250,84 340,106" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="250" y="88" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i=2: 6 − 2 = 4</text>

  <path d="M250,106 Q340,92 430,104" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="345" y="102" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i=3: 7 − 5 = 2</text>

  <!-- 最优路径 -->
  <rect x="40" y="196" width="440" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="220" font-size="13" fill="#333" filter="url(#rough2)">去程（偶下标）：0 → 5 → 7，跳长 5、2</text>
  <text x="60" y="242" font-size="13" fill="#333" filter="url(#rough2)">回程（奇下标）：7 → 6 → 2 → 0，跳长 1、4、2</text>
  <text x="60" y="260" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最大跳 = 5 = 三处「隔一差」的最大值 ✓</text>

  <path d="M160,112 L200,190" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 结论框 -->
  <rect x="90" y="292" width="340" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = max ( stones[i+1] − stones[i−1] )</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1 ≤ i ≤ n−2；n = 2 时特判为两端距离</text>
</svg>
