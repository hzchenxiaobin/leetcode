<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="720" height="396" fill="#fafafa"/>
  <text x="360" y="27" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次询问 = 左半块 + 若干整块 + 右半块</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" filter="url(#rough2)">每个平台一个 x×x 矩阵 T_i；B = 32 个平台一块；整块直接用线段树节点存好的乘积</text>
  <rect x="24" y="84" width="202" height="122" rx="8" fill="#f1f1f1" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="108" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">① 左半块</text>
  <text x="125" y="128" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">l 所在块的尾部</text>
  <text x="125" y="146" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">逐平台 apply，≤ B 次</text>
  <text x="125" y="164" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">每次 O(x²)</text>
  <rect x="252" y="84" width="216" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 中间整块</text>
  <text x="360" y="128" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">线段树区间查询</text>
  <text x="360" y="146" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">O(x² log m)</text>
  <text x="360" y="164" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">节点矩阵依次右乘</text>
  <rect x="494" y="84" width="202" height="122" rx="8" fill="#f1f1f1" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595" y="108" text-anchor="middle" font-size="11" fill="#777" font-weight="bold" filter="url(#rough2)">③ 右半块</text>
  <text x="595" y="128" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">r 所在块的前部</text>
  <text x="595" y="146" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">逐平台 apply，≤ B 次</text>
  <text x="595" y="164" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">每次 O(x²)</text>
  <path d="M 228 145 L 248 145" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 145 L 490 145" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="362" y1="176" x2="342" y2="190" stroke="#8a6d3b" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="362" y1="176" x2="382" y2="190" stroke="#8a6d3b" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="347" y="170" width="30" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="327" y="190" width="30" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="367" y="190" width="30" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="24" y="236" width="202" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">点修改 d_i / s_i</text>
  <text x="125" y="280" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">先把该平台写回数组</text>
  <text x="125" y="298" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">重建它所在块的矩阵</text>
  <rect x="252" y="236" width="216" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">重建块矩阵</text>
  <text x="360" y="280" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">≤ B 个平台依次 apply</text>
  <text x="360" y="298" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">O(B x²)</text>
  <rect x="494" y="236" width="202" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">更新祖先</text>
  <text x="595" y="280" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">沿线段树自底向上</text>
  <text x="595" y="298" text-anchor="middle" font-size="9.5" fill="#555" font-weight="normal" filter="url(#rough2)">O(x³ log m)</text>
  <path d="M 228 286 L 248 286" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 286 L 490 286" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="366" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" filter="url(#rough2)">建树 O(n·x² + (n/B)·x³)，矩阵存储 2(n/B) 个 x×x；B 越大内存越小、修改越慢</text>
</svg>
