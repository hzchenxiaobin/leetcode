<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只需要「末尾点数 + 末尾连续长度」</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">约束只针对「同一个点数连续出现」的段落，历史里其余信息对后续投掷毫无影响</text>

  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="26" y="100">…</text>
    <text x="26" y="138">…</text>
    <text x="26" y="176">…</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="40" y="80" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="77" y="80" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="114" y="80" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="57" y="99" fill="#3a4a66">3</text>
    <text x="94" y="99" fill="#3a5a30">4</text>
    <text x="131" y="99" fill="#3a5a30">4</text>

    <rect x="40" y="118" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="77" y="118" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="114" y="118" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="57" y="137" fill="#3a4a66">5</text>
    <text x="94" y="137" fill="#3a5a30">4</text>
    <text x="131" y="137" fill="#3a5a30">4</text>

    <rect x="40" y="156" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="77" y="156" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="57" y="175" fill="#3a5a30">4</text>
    <text x="94" y="175" fill="#3a5a30">4</text>
  </g>

  <g stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)">
    <path d="M 150 94 L 200 94"/>
    <path d="M 150 132 L 200 132"/>
    <path d="M 113 170 L 200 170"/>
    <path d="M 200 94 L 200 170"/>
  </g>
  <path d="M 200 132 L 318 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="326" y="90" width="202" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="427" y="112" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">状态 (f = 4, c = 2)</text>
  <text x="427" y="134" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">末尾点数是 4，且连续出现 2 次</text>
  <text x="427" y="154" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">c 与 rollMax[f] 比较 ⇒ 能否再掷 f</text>

  <text x="105" y="206" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三条不同的历史，末尾都是「连续 2 个 4」</text>
  <text x="105" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⇒ 归并成同一个状态</text>

  <text x="56" y="256" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">状态空间：第 f 行是 (f, 1) … (f, rollMax[f])</text>

  <g stroke="#446688" stroke-width="0.9" fill="#e8f0fe" filter="url(#rough2)">
    <rect x="56" y="268" width="9" height="9" rx="2"/><rect x="66" y="268" width="9" height="9" rx="2"/><rect x="76" y="268" width="9" height="9" rx="2"/><rect x="86" y="268" width="9" height="9" rx="2"/><rect x="96" y="268" width="9" height="9" rx="2"/>
    <rect x="56" y="279" width="9" height="9" rx="2"/><rect x="66" y="279" width="9" height="9" rx="2"/><rect x="76" y="279" width="9" height="9" rx="2"/><rect x="86" y="279" width="9" height="9" rx="2"/><rect x="96" y="279" width="9" height="9" rx="2"/>
    <rect x="56" y="290" width="9" height="9" rx="2"/><rect x="66" y="290" width="9" height="9" rx="2"/><rect x="76" y="290" width="9" height="9" rx="2"/><rect x="86" y="290" width="9" height="9" rx="2"/><rect x="96" y="290" width="9" height="9" rx="2"/>
    <rect x="56" y="301" width="9" height="9" rx="2"/><rect x="66" y="301" width="9" height="9" rx="2"/><rect x="76" y="301" width="9" height="9" rx="2"/><rect x="86" y="301" width="9" height="9" rx="2"/><rect x="96" y="301" width="9" height="9" rx="2"/><rect x="106" y="301" width="9" height="9" rx="2"/>
    <rect x="56" y="312" width="9" height="9" rx="2"/><rect x="66" y="312" width="9" height="9" rx="2"/><rect x="76" y="312" width="9" height="9" rx="2"/><rect x="86" y="312" width="9" height="9" rx="2"/><rect x="96" y="312" width="9" height="9" rx="2"/><rect x="106" y="312" width="9" height="9" rx="2"/>
    <rect x="56" y="323" width="9" height="9" rx="2"/><rect x="66" y="323" width="9" height="9" rx="2"/><rect x="76" y="323" width="9" height="9" rx="2"/><rect x="86" y="323" width="9" height="9" rx="2"/><rect x="96" y="323" width="9" height="9" rx="2"/><rect x="106" y="323" width="9" height="9" rx="2"/><rect x="116" y="323" width="9" height="9" rx="2"/>
    <rect x="56" y="334" width="9" height="9" rx="2"/><rect x="66" y="334" width="9" height="9" rx="2"/><rect x="76" y="334" width="9" height="9" rx="2"/><rect x="86" y="334" width="9" height="9" rx="2"/><rect x="96" y="334" width="9" height="9" rx="2"/><rect x="106" y="334" width="9" height="9" rx="2"/><rect x="116" y="334" width="9" height="9" rx="2"/><rect x="126" y="334" width="9" height="9" rx="2"/>
  </g>
  <g font-size="9" fill="#888" text-anchor="end" filter="url(#rough2)">
    <text x="50" y="275">f=1</text>
    <text x="50" y="286">f=2</text>
    <text x="50" y="297">f=3</text>
    <text x="50" y="308">f=4</text>
    <text x="50" y="319">f=5</text>
    <text x="50" y="330">f=6</text>
  </g>
  <text x="56" y="356" font-size="9.5" fill="#999" filter="url(#rough2)">行越长说明 rollMax[f] 越大；总数 ≤ 6 × 15 = 90，与 n 无关</text>

  <rect x="300" y="256" width="228" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#7a5c18" filter="url(#rough2)">
    <text x="314" y="276">① 违规只可能是「某点数连续出现太多次」</text>
    <text x="314" y="296">② 因此末尾点数 f 与连续次数 c 就是全部</text>
    <text x="314" y="316">③ 更早的历史被压缩掉，不改变后续合法性</text>
    <text x="314" y="336" fill="#a08a50">⇒ 无后效性成立，可以按长度逐层 DP</text>
  </g>
</svg>
