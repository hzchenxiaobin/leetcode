<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">叉积 = 平行四边形的有向面积，为 0 即共线</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">面积非 0 ⟺ 三点不共线 ⟺ 构成回旋镖</text>

  <path d="M 70 300 L 300 300" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 70 300 L 70 90" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <polygon points="120,250 250,150 210,90" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="120" cy="250" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="250" cy="150" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="210" cy="90" r="4" fill="#446688" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#3a4a66">
    <text x="100" y="268">P1</text>
    <text x="256" y="146">P2</text>
    <text x="200" y="80">P3</text>
  </g>

  <path d="M 120 250 L 250 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 250 L 210 90" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="300" y="150" font-size="11" fill="#446688">v1 = P2 − P1</text>
  <text x="300" y="170" font-size="11" fill="#4a7a3a">v2 = P3 − P1</text>
  <text x="300" y="204" font-size="11.5" fill="#333">cross = v1.x·v2.y − v1.y·v2.x</text>
  <text x="300" y="228" font-size="11" fill="#333">= (x2−x1)(y3−y1) − (x3−x1)(y2−y1)</text>

  <rect x="300" y="246" width="228" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="314" y="268" font-size="11" fill="#3a5a30" font-weight="bold">cross ≠ 0</text>
  <text x="314" y="290" font-size="10" fill="#555">面积 &gt; 0 → 回到 true</text>
  <text x="314" y="306" font-size="10" fill="#555">（三点互异且不共线）</text>

  <rect x="40" y="236" width="222" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="258" font-size="11" fill="#8a3a36" font-weight="bold">cross = 0 的两种退化</text>
  <text x="54" y="280" font-size="10" fill="#555">· 三点共线（示例 2）</text>
  <text x="54" y="300" font-size="10" fill="#555">· 两点重合（面积也为 0）</text>

  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#999">坐标 ≤ 100，差值 ≤ 100，乘积 ≤ 10⁴，int 足够；仍建议用 long long 防越界习惯</text>
</svg>
