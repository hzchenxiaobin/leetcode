<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
<text x="280" y="26" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">同一个值的每个连续段，各自需要一次操作</text>
<text x="24" y="56" font-size="11" fill="#d6a040" text-anchor="start" font-weight="normal" filter="url(#rough2)">① 层 1（橙）：整段只有 1 段，做 1 次操作</text>
<text x="24" y="80" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">② 层 2（绿）：被值为 1 的位置隔成 3 段，做 3 次操作</text>
<rect x="170" y="254" width="50" height="66" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="195" y="342" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<rect x="230" y="188" width="50" height="132" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="255" y="342" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<rect x="290" y="254" width="50" height="66" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="315" y="342" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<rect x="350" y="188" width="50" height="132" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="375" y="342" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<rect x="410" y="254" width="50" height="66" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="435" y="342" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<rect x="470" y="188" width="50" height="132" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="495" y="342" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<path d="M150,254 L536,254" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
<path d="M150,188 L536,188" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
<text x="108" y="260" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">层 1</text>
<text x="108" y="194" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">层 2</text>
<text x="280" y="364" font-size="15" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">总操作数 = 1 + 3 = 4</text>
<text x="280" y="388" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">操作顺序：先清最小值所在的层，再逐层向上</text>
</svg>
