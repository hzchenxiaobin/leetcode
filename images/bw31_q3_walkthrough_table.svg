<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">好分割计数流程：后缀预统计 → 前缀滑动</text>

  <!-- 第一步 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="56" width="220" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="150" y="80">① 从右往左统计</text>
    <text x="150" y="100">sufDistinct[i] = s[i..n−1]</text>
    <text x="150" y="118">不同字母数</text>
  </g>
  <path d="M 260 91 L 300 91" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二步 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="302" y="56" width="220" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="412" y="80">② 从左往右枚举分割点</text>
    <text x="412" y="100">i = 1..n−1（左段长 i）</text>
    <text x="412" y="118">left 随计数器递增</text>
  </g>

  <!-- 演算表 aacaba -->
  <text x="280" y="160" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">演算：s = aacaba</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="172" width="80" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="140" y="172" width="80" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="220" y="172" width="80" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="300" y="172" width="80" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="380" y="172" width="80" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="460" y="172" width="60" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="100" y="190">分割点</text>
    <text x="180" y="190">左段</text>
    <text x="260" y="190">左 distinct</text>
    <text x="340" y="190">右段</text>
    <text x="420" y="190">右 distinct</text>
    <text x="490" y="190">相等?</text>

    <rect x="60" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="140" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="220" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="300" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="460" y="200" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="100" y="217">i=1</text><text x="180" y="217">a</text><text x="260" y="217">1</text><text x="340" y="217">acaba</text><text x="420" y="217">3</text><text x="490" y="217">✗</text>

    <rect x="60" y="226" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="140" y="226" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="220" y="226" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="300" y="226" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="380" y="226" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="460" y="226" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="100" y="243">i=2</text><text x="180" y="243">aa</text><text x="260" y="243">1</text><text x="340" y="243">caba</text><text x="420" y="243">3</text><text x="490" y="243">✗</text>

    <rect x="60" y="252" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="140" y="252" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="252" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="252" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="252" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="460" y="252" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="269">i=3</text><text x="180" y="269">aac</text><text x="260" y="269">2</text><text x="340" y="269">aba</text><text x="420" y="269">2</text><text x="490" y="269" fill="#b85450" font-weight="bold">✓</text>

    <rect x="60" y="278" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="140" y="278" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="278" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="278" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="278" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="460" y="278" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="295">i=4</text><text x="180" y="295">aaca</text><text x="260" y="295">2</text><text x="340" y="295">ba</text><text x="420" y="295">2</text><text x="490" y="295" fill="#b85450" font-weight="bold">✓</text>

    <rect x="60" y="304" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="140" y="304" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="220" y="304" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="300" y="304" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="304" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="460" y="304" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="100" y="321">i=5</text><text x="180" y="321">aacab</text><text x="260" y="321">3</text><text x="340" y="321">a</text><text x="420" y="321">1</text><text x="490" y="321">✗</text>
  </g>

  <rect x="60" y="340" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="361" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">答案 = 2（与官方示例一致）</text>
</svg>
