<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次查表 + 一次闰年修正</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全程 O(1)：不循环、不用日期库、只读 3 次字符串</text>
  <rect x="140" y="62" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11" fill="#30436b" filter="url(#rough2)">解析 date：year / month / day</text>
  <path d="M 280 102 L 280 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="125" y="126" width="310" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">ans = C[month−1] + day　（查前缀表）</text>
  <path d="M 280 166 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,192 398,232 280,272 162,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">闰年 且 month ≥ 3 ?</text>
  <text x="280" y="247" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">（只有跨过 2 月才补一天）</text>
  <path d="M 162 232 L 96 232 L 96 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="224" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>
  <rect x="18" y="300" width="158" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="97" y="325" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">ans 保持不变</text>
  <path d="M 398 232 L 464 232 L 464 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="437" y="224" text-anchor="middle" font-size="10" fill="#2f5228" filter="url(#rough2)">是</text>
  <rect x="384" y="300" width="158" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="463" y="325" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">ans += 1</text>
  <path d="M 97 340 L 97 364 L 248 364 L 248 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 463 340 L 463 364 L 312 364 L 312 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="388" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#30436b" font-weight="bold" filter="url(#rough2)">return ans</text>
  <text x="280" y="444" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">C[k] = 平年下 k 月末的累计天数（C[0] = 0），是把 12 个常数预先算好的查表法</text>
</svg>
