<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="24" y="32" font-size="16" fill="#333" filter="url(#rough2)">一次从低位到高位的扫描</text>

  <rect x="150" y="52" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">last = −1，ans = 0，i = 0</text>

  <path d="M280 96 L280 122" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="280,124 430,158 280,192 130,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">n &amp; 1 == 1 ？</text>

  <!-- 是：更新 -->
  <path d="M430 158 L500 158 L500 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="470" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="360" y="218" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">若 last ≥ 0：</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">ans = max(ans, i − last)；last = i</text>

  <!-- 否：跳过 -->
  <path d="M130 158 L60 158 L60 216" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="86" y="150" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="8" y="218" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="244" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">本位是 0</text>
  <text x="68" y="264" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">什么都不做</text>

  <!-- 汇合 -->
  <path d="M450 278 L450 306 L280 306 L280 330" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M68 278 L68 306 L280 306" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="332" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">i += 1，n &gt;&gt;= 1，回到判断</text>

  <path d="M280 376 L280 396" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="292" y="404" font-size="12" fill="#666" filter="url(#rough2)">n == 0 时结束，返回 ans</text>
</svg>
