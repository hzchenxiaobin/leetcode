<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：反转一次，让「个位」站到队首</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: original list -->
  <text x="190" y="72" font-size="13" font-weight="bold" fill="#446688">① 原链表：正序，头 = 最高位</text>
  <g filter="url(#sk)">
    <rect x="190" y="82" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="268" y="82" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="346" y="82" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="218" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="296" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">8</text>
  <text x="374" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9</text>
  <path d="M 246 100 L 264 100" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 324 100 L 342 100" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 402 100 L 418 100" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)"/>
  <text x="428" y="105" font-size="11" fill="#999">∅</text>
  <path d="M 192 134 L 256 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)"/>
  <text x="224" y="152" text-anchor="middle" font-size="10.5" fill="#446688">遍历方向</text>
  <path d="M 404 134 L 340 134" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)"/>
  <text x="372" y="152" text-anchor="middle" font-size="10.5" fill="#b85450">进位方向</text>
  <text x="448" y="100" font-size="11" fill="#555">表示 189；</text>
  <text x="448" y="118" font-size="11" fill="#555">个位在尾部，两个方向</text>
  <text x="448" y="136" font-size="11" fill="#555">恰好相反 ✗</text>

  <path d="M 150 128 L 150 152" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- Row 2: reversed -->
  <text x="190" y="172" font-size="13" font-weight="bold" fill="#b07818">② 反转后：头 = 个位</text>
  <g filter="url(#sk)">
    <rect x="190" y="182" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="268" y="182" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="346" y="182" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="218" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9</text>
  <text x="296" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">8</text>
  <text x="374" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <path d="M 246 200 L 264 200" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 324 200 L 342 200" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 402 200 L 418 200" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)"/>
  <text x="428" y="205" font-size="11" fill="#999">∅</text>
  <text x="218" y="236" text-anchor="middle" font-size="10.5" fill="#b07818">个位</text>
  <text x="296" y="236" text-anchor="middle" font-size="10.5" fill="#b07818">十位</text>
  <text x="374" y="236" text-anchor="middle" font-size="10.5" fill="#b07818">最高位</text>
  <text x="448" y="192" font-size="11" fill="#555">从左到右恰好是</text>
  <text x="448" y="210" font-size="11" fill="#555">低位 → 高位</text>
  <text x="448" y="228" font-size="11" font-weight="bold" fill="#b07818">进位方向 = 遍历方向 ✓</text>

  <path d="M 150 228 L 150 252" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- Row 3: doubling in place -->
  <text x="190" y="272" font-size="13" font-weight="bold" fill="#2e6e2e">③ 逐位翻倍（原地写值）</text>
  <g filter="url(#sk)">
    <rect x="190" y="282" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="268" y="282" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="346" y="282" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="218" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="296" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">7</text>
  <text x="374" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <path d="M 246 300 L 264 300" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 324 300 L 342 300" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 402 300 L 418 300" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)"/>
  <text x="428" y="305" font-size="11" fill="#999">∅</text>
  <text x="218" y="334" text-anchor="middle" font-size="9.5" fill="#b85450">9×2+0=18</text>
  <text x="218" y="348" text-anchor="middle" font-size="9.5" fill="#b85450">写 8 进 1</text>
  <text x="296" y="334" text-anchor="middle" font-size="9.5" fill="#b85450">8×2+1=17</text>
  <text x="296" y="348" text-anchor="middle" font-size="9.5" fill="#b85450">写 7 进 1</text>
  <text x="374" y="334" text-anchor="middle" font-size="9.5" fill="#b85450">1×2+1=3</text>
  <text x="374" y="348" text-anchor="middle" font-size="9.5" fill="#b85450">写 3 进 0</text>
  <text x="448" y="292" font-size="11" fill="#555">v = val×2 + carry；</text>
  <text x="448" y="310" font-size="11" fill="#555">写 v%10，进 v/10</text>
  <text x="448" y="328" font-size="11" fill="#555">进位只取 0 / 1</text>

  <path d="M 150 328 L 150 352" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- Row 4: reverse back -->
  <text x="190" y="372" font-size="13" font-weight="bold" fill="#2e6e2e">④ 反转回来：carry = 0</text>
  <g filter="url(#sk)">
    <rect x="190" y="382" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="268" y="382" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="346" y="382" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="218" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="296" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">7</text>
  <text x="374" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <path d="M 246 400 L 264 400" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 324 400 L 342 400" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 402 400 L 418 400" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)"/>
  <text x="428" y="405" font-size="11" fill="#999">∅</text>
  <text x="448" y="392" font-size="14" font-weight="bold" fill="#2e6e2e">= 378 ✓</text>
  <text x="448" y="412" font-size="11" fill="#555">最高位没溢出，</text>
  <text x="448" y="428" font-size="11" fill="#555">无需前插</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="440" width="560" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="460" text-anchor="middle" font-size="11.5" fill="#7a5415">一次反转把「正序链表逐位运算」降维成第 2 题的逆序模型</text>
  <text x="320" y="479" text-anchor="middle" font-size="11.5" fill="#7a5415">进位只取 0 / 1；收尾 carry = 1 时在正序表头前插节点 1</text>
</svg>
