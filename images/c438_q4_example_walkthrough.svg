<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="432" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算（示例 2）：side = 2, k = 4 —— check(2) 的贪心走查</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="60" text-anchor="middle" font-size="10.5" fill="#555">五个候选点（周长坐标 → 原坐标）：0→(0,0)　2→(2,0)　3→(2,1)　4→(2,2)　5→(1,2)，周长 P = 8</text>
  <text x="270" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">起点 0：0 → 2 → 4 ✗（下一跳回绕到 8，但 8 &gt; cap = 6，只凑 3 个）</text>

  <g filter="url(#sk)">
    <path d="M76,150 Q140,102 202,150" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ab)"/>
    <path d="M216,150 Q280,102 342,150" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ab)"/>
    <path d="M358,150 Q490,100 612,148" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#ar)"/>
    <path d="M70,160 L630,160" stroke="#999" stroke-width="2" fill="none"/>
    <path d="M70,154 L70,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M140,154 L140,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M210,154 L210,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M280,154 L280,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M350,154 L350,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M420,154 L420,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M490,154 L490,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M560,154 L560,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M630,154 L630,166" stroke="#999" stroke-width="1.5" fill="none"/>
    <circle cx="70" cy="160" r="5.5" fill="#4a8edb" stroke="#2b4e6e" stroke-width="1.5"/>
    <circle cx="210" cy="160" r="5.5" fill="#4a8e4a" stroke="#2b4e2b" stroke-width="1.5"/>
    <circle cx="280" cy="160" r="5.5" fill="#c98a2b" stroke="#7a5415" stroke-width="1.5"/>
    <circle cx="350" cy="160" r="5.5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="420" cy="160" r="5.5" fill="#666" stroke="#333" stroke-width="1.5"/>
    <circle cx="630" cy="160" r="5.5" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M490,140 L490,180" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
    <path d="M630,140 L630,180" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  </g>
  <text x="140" y="130" text-anchor="middle" font-size="9" fill="#2b6e9e">2 ✓</text>
  <text x="280" y="130" text-anchor="middle" font-size="9" fill="#2b6e9e">2 ✓</text>
  <text x="630" y="134" text-anchor="middle" font-size="9.5" fill="#b85450">(0,0)+8</text>
  <text x="452" y="198" text-anchor="middle" font-size="9.5" fill="#b85450">cap = 6</text>
  <text x="70" y="182" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="210" y="182" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="350" y="182" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#555">6</text>
  <text x="560" y="182" text-anchor="middle" font-size="11" fill="#555">7</text>
  <text x="630" y="182" text-anchor="middle" font-size="11" fill="#555">8</text>

  <g filter="url(#sk)">
    <path d="M216,168 Q280,218 342,168" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <path d="M358,170 Q500,240 616,172" stroke="#4a8e4a" stroke-width="2" fill="none" stroke-dasharray="7,4" marker-end="url(#ag)"/>
    <path d="M634,172 Q662,202 646,232" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  </g>
  <text x="280" y="218" text-anchor="middle" font-size="9" fill="#2e6e2e">2 ✓</text>
  <text x="490" y="234" text-anchor="middle" font-size="9" fill="#2e6e2e">4 ✓（回绕）</text>
  <text x="630" y="200" text-anchor="middle" font-size="9.5" fill="#b85450">cap = 8</text>
  <text x="560" y="222" text-anchor="middle" font-size="9" fill="#2e6e2e">恰压 cap 线 ✓</text>
  <text x="596" y="252" text-anchor="middle" font-size="9.5" fill="#b85450">下一跳 10 &gt; cap ✗</text>

  <text x="300" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">起点 2：2 → 4 → 回绕收下 (0,0)+8（恰压 cap）→ 仍只 3 个 ✗</text>
  <text x="340" y="270" text-anchor="middle" font-size="10" fill="#888">起点 3 / 4 / 5 同理最多 3 个 —— 五个起点全都数不满 k = 4</text>

  <g filter="url(#sk)">
    <rect x="130" y="284" width="420" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="340" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">check(2) = false：任何起点都凑不齐 4 个 → hi = mid − 1 = 1</text>

  <g filter="url(#sk)">
    <rect x="130" y="330" width="420" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">二分轨迹：lo = 1, hi = ⌊4s/k⌋ = 2；mid = 2 → false → hi = 1</text>
  <text x="340" y="366" text-anchor="middle" font-size="10.5" fill="#333">lo == hi → 返回 1 ✓（如选 (0,0), (2,0), (2,2), (2,1)，最小两两距离恰为 1）</text>

  <g filter="url(#sk)">
    <rect x="130" y="388" width="420" height="34" rx="8" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <text x="340" y="410" text-anchor="middle" font-size="10.5" fill="#2e6e2e">对照示例 1（四个角 t = 0, 2, 4, 6）：环间隙全为 2 = ⌊4s/k⌋，上界取满 → 答案 2</text>
</svg>
