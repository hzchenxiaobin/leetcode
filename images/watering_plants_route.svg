<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6e9e"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="436" fill="#fdfcf7"/>
  <text x="300" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：水够直走 1 步，水不够折返 2i+1 步</text>
  <path d="M 130 42 Q 300 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="614" y="36" text-anchor="end" font-size="13" fill="#7a5415">capacity = 5</text>

  <!-- river at x = -1 -->
  <g filter="url(#sk2)">
    <rect x="42" y="64" width="72" height="46" rx="8" fill="#dbe7f6" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="78" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e">河</text>
  <path d="M 54 102 q 6 -6 12 0 t 12 0 t 12 0 t 12 0" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="78" y="126" text-anchor="middle" font-size="11" fill="#888">x = −1</text>

  <!-- plants = [2,2,3,3] -->
  <g filter="url(#sk2)">
    <rect x="180" y="64" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="280" y="64" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="380" y="64" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="480" y="64" width="64" height="46" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="212" y="92">2</text>
    <text x="312" y="92">2</text>
    <text x="412" y="92">3</text>
    <text x="512" y="92">3</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="212" y="126">i=0</text>
    <text x="312" y="126">i=1</text>
    <text x="412" y="126">i=2</text>
    <text x="512" y="126">i=3</text>
  </g>

  <!-- line A: direct walks -->
  <text x="320" y="166" text-anchor="middle" font-size="12.5" fill="#2e6e2e">i=0、i=1：cur = 5 → 3 → 1，水都够 → 直走</text>
  <path d="M 78 184 L 206 184" stroke="#2e6e2e" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <text x="142" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">+1</text>
  <path d="M 224 184 L 304 184" stroke="#2e6e2e" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <text x="264" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">+1</text>

  <!-- line B: refill before plant 2 -->
  <text x="320" y="214" text-anchor="middle" font-size="12.5" fill="#b85450">浇完植物 1：cur = 1 &lt; plants[2] = 3 → 必须折返，本段 = 2×2+1 = 5 步</text>
  <path d="M 304 234 L 92 234" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)" marker-end="url(#arR)"/>
  <text x="198" y="228" text-anchor="middle" font-size="11" fill="#b85450">回河边：2 步（i 步）</text>
  <path d="M 84 256 L 400 256" stroke="#2b6e9e" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <text x="242" y="250" text-anchor="middle" font-size="11" fill="#2b6e9e">灌满后走到植物 2：3 步（i+1 步）</text>

  <!-- line C: refill before plant 3 -->
  <text x="320" y="294" text-anchor="middle" font-size="12.5" fill="#b85450">浇完植物 2：cur = 2 &lt; plants[3] = 3 → 必须折返，本段 = 2×3+1 = 7 步</text>
  <path d="M 404 314 L 92 314" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)" marker-end="url(#arR)"/>
  <text x="248" y="308" text-anchor="middle" font-size="11" fill="#b85450">回河边：3 步（i 步）</text>
  <path d="M 84 336 L 500 336" stroke="#2b6e9e" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <text x="292" y="330" text-anchor="middle" font-size="11" fill="#2b6e9e">灌满后走到植物 3：4 步（i+1 步）</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="170" y="366" width="300" height="48" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="396" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">ans = 1 + 1 + 5 + 7 = 14 ✓</text>
</svg>
