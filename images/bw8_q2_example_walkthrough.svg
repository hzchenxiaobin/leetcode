<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：9 个短语，5 次首末词命中</text>

  <g filter="url(#rough2)" font-size="10" fill="#666" font-weight="bold">
    <text x="52" y="48">下标</text>
    <text x="108" y="48">短语</text>
    <text x="332" y="48">first</text>
    <text x="436" y="48">last</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <text x="52" y="70">0</text><text x="108" y="70">mission statement</text>
    <text x="52" y="88">1</text><text x="108" y="88">a quick bite to eat</text>
    <text x="52" y="106">2</text><text x="108" y="106">a chip off the old block</text>
    <text x="52" y="124">3</text><text x="108" y="124">chocolate bar</text>
    <text x="52" y="142">4</text><text x="108" y="142">mission impossible</text>
    <text x="52" y="160">5</text><text x="108" y="160">a man on a mission</text>
    <text x="52" y="178">6</text><text x="108" y="178">block party</text>
    <text x="52" y="196">7</text><text x="108" y="196">eat my words</text>
    <text x="52" y="214">8</text><text x="108" y="214">bar of soap</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="352" y="70" fill="#b85450">mission</text>
    <text x="352" y="88" fill="#b85450">a</text>
    <text x="352" y="106" fill="#b85450">a</text>
    <text x="352" y="124" fill="#b85450">chocolate</text>
    <text x="352" y="142" fill="#b85450">mission</text>
    <text x="352" y="160" fill="#b85450">a</text>
    <text x="352" y="178" fill="#b85450">block</text>
    <text x="352" y="196" fill="#b85450">eat</text>
    <text x="352" y="214" fill="#b85450">bar</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="452" y="70" fill="#446688">statement</text>
    <text x="452" y="88" fill="#446688">eat</text>
    <text x="452" y="106" fill="#446688">block</text>
    <text x="452" y="124" fill="#446688">bar</text>
    <text x="452" y="142" fill="#446688">impossible</text>
    <text x="452" y="160" fill="#b85450">mission ✓</text>
    <text x="452" y="178" fill="#446688">party</text>
    <text x="452" y="196" fill="#446688">words</text>
    <text x="452" y="214" fill="#446688">soap</text>
  </g>

  <path d="M 408 156 L 408 66 L 432 66" stroke="#b85450" stroke-width="1.4" fill="none"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 408 154 L 408 140 L 432 140" stroke="#b85450" stroke-width="1.4" fill="none"
        stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="48" y="232" width="264" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">5 次命中（i → j）</text>
  <g filter="url(#rough2)" font-size="10" fill="#444">
    <text x="60" y="272">1 → 7：a quick bite to eat my words</text>
    <text x="60" y="290">2 → 6：a chip off the old block party</text>
    <text x="60" y="308">3 → 8：chocolate bar of soap</text>
    <text x="60" y="326">5 → 0：a man on a mission statement</text>
    <text x="60" y="344">5 → 4：a man on a mission impossible</text>
    <text x="60" y="366" fill="#8a6a20" font-weight="bold">其余末词（statement 等）无匹配，跳过</text>
  </g>

  <rect x="330" y="232" width="196" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="428" y="252" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">排序后输出（5 条）</text>
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <text x="344" y="274">a chip off the old block party</text>
    <text x="344" y="296">a man on a mission impossible</text>
    <text x="344" y="318">a man on a mission statement</text>
    <text x="344" y="340">a quick bite to eat my words</text>
    <text x="344" y="362">chocolate bar of soap</text>
  </g>
</svg>
