<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：两个「小」——值域小、置位数更小</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">right − left ≤ 10⁴ ⇒ 直接枚举每个数；10⁶ &lt; 2²⁰ ⇒ popcount 最多 19，只有 20 种取值</text>

  <text x="60" y="86" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">① 置位数 c ∈ {0, 1, …, 19}：绿色格子的 c 是质数（共 8 个）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="86" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="112" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="138" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="164" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="190" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="216" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="242" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="268" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="294" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="320" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="346" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="372" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="398" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="424" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="450" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="476" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="502" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="528" y="96" width="24" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="554" y="96" width="24" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>

    <text x="72" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">0</text>
    <text x="98" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">1</text>
    <text x="124" y="120" text-anchor="middle" font-size="11" fill="#33552a">2</text>
    <text x="150" y="120" text-anchor="middle" font-size="11" fill="#33552a">3</text>
    <text x="176" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">4</text>
    <text x="202" y="120" text-anchor="middle" font-size="11" fill="#33552a">5</text>
    <text x="228" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">6</text>
    <text x="254" y="120" text-anchor="middle" font-size="11" fill="#33552a">7</text>
    <text x="280" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">8</text>
    <text x="306" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">9</text>
    <text x="332" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">10</text>
    <text x="358" y="120" text-anchor="middle" font-size="11" fill="#33552a">11</text>
    <text x="384" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">12</text>
    <text x="410" y="120" text-anchor="middle" font-size="11" fill="#33552a">13</text>
    <text x="436" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">14</text>
    <text x="462" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">15</text>
    <text x="488" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">16</text>
    <text x="514" y="120" text-anchor="middle" font-size="11" fill="#33552a">17</text>
    <text x="540" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">18</text>
    <text x="566" y="120" text-anchor="middle" font-size="11" fill="#33552a">19</text>

    <text x="124" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="150" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="202" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="254" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="358" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="410" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="514" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="566" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
  </g>

  <text x="60" y="176" font-size="10" fill="#888" filter="url(#rough2)">注意 0 和 1 都不是质数：0 个置位的数不贡献答案，1 个置位的只有 2 的幂</text>

  <rect x="60" y="188" width="504" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="210" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">把这张表压成 20 位掩码 PRIME_MASK = 665772 = 0b10100010100010101100</text>
  <text x="76" y="230" font-size="10.5" fill="#555" filter="url(#rough2)">第 c 位为 1 ⇔ c 是质数；于是「c 是否为质数」= (PRIME_MASK &gt;&gt; c) &amp; 1，单条位运算搞定</text>
  <text x="76" y="246" font-size="10.5" fill="#555" filter="url(#rough2)">等价写法：c 属于 {2, 3, 5, 7, 11, 13, 17, 19}（8 个元素的常量表，二分也可）</text>

  <text x="60" y="282" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">② 区间最多 10001 个数 ⇒ 逐个枚举，不重不漏</text>

  <rect x="60" y="294" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="313" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">x = left … right</text>
  <text x="130" y="329" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">每个数只看一次</text>

  <path d="M 202 316 L 228 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="232" y="294" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="312" y="313" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">c = popcount(x)</text>
  <text x="312" y="329" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">十进制二进制里 1 的个数</text>

  <path d="M 394 316 L 420 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="294" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="499" y="313" text-anchor="middle" font-size="11" fill="#33552a" filter="url(#rough2)">(MASK &gt;&gt; c) &amp; 1</text>
  <text x="499" y="329" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">为真则 ans + 1</text>

  <text x="310" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">总时间 O((right − left + 1) · log right)，空间 O(1)；最坏约 10⁴ × 20 次位运算</text>
</svg>
