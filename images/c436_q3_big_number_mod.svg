<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：右端递推 v → 10v + c —— 巨大数值从不现身</text>
  <path d="M 90 38 Q 340 46 590 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- digit strip -->
  <text x="170" y="80" font-size="12" fill="#555" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="196" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="240" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="328" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="56" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="216" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="304" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <text x="348" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="392" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">6</text>
  <text x="216" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="260" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="304" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="348" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="392" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="430" y="72" font-size="11.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">j = 4，c = s[j] = 6</text>
  <text x="430" y="90" font-size="11" fill="#a06a1a" filter="url(#rough2)">末位即除数 d = 6</text>

  <!-- left box: substrings ending at j-1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="124" width="256" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="152" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">以 j−1 = 3 结尾 · mod 6</text>
  <text x="44" y="166" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="166" font-size="10" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="268" y="166" text-anchor="end" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="44" y="184" font-size="11.5" fill="#333" filter="url(#rough2)">93</text>
  <text x="190" y="184" font-size="10" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="268" y="184" text-anchor="end" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="44" y="202" font-size="11.5" fill="#333" filter="url(#rough2)">293</text>
  <text x="190" y="202" font-size="10" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="268" y="202" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="44" y="220" font-size="11.5" fill="#333" filter="url(#rough2)">1293</text>
  <text x="190" y="220" font-size="10" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="268" y="220" text-anchor="end" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- middle arrow -->
  <g filter="url(#rough2)">
    <path d="M 286 176 L 404 176" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="346" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">× 10 + 6</text>
  <text x="346" y="198" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">r ↦ (10r+6) mod 6</text>

  <!-- right box: substrings ending at j -->
  <g filter="url(#rough2)">
    <rect x="412" y="124" width="244" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="534" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">以 j = 4 结尾 · mod 6</text>
  <text x="432" y="164" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="510" y="164" font-size="9.5" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="648" y="164" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <g filter="url(#rough2)">
    <rect x="546" y="152" width="36" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="564" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">新开</text>
  <text x="432" y="182" font-size="11" fill="#333" filter="url(#rough2)">36</text>
  <text x="510" y="182" font-size="9.5" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="648" y="182" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="432" y="200" font-size="11" fill="#333" filter="url(#rough2)">936</text>
  <text x="510" y="200" font-size="9.5" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="648" y="200" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="432" y="218" font-size="11" fill="#333" filter="url(#rough2)">2936</text>
  <text x="510" y="218" font-size="9.5" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="648" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 ✗</text>
  <text x="432" y="236" font-size="11" fill="#333" filter="url(#rough2)">12936</text>
  <text x="510" y="236" font-size="9.5" fill="#777" filter="url(#rough2)">→ r</text>
  <text x="648" y="236" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>

  <!-- bottom key box -->
  <g filter="url(#rough2)">
    <rect x="24" y="272" width="632" height="140" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="340" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">真实数据 n ≤ 10⁵：子串数值可达 10^100000 —— 任何整型都存不下</text>
  <text x="340" y="322" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">但整除判定只看 v mod d（d ≤ 9）：余数随「×10 + c」逐位 O(1) 转移，数值本身从不现身</text>
  <text x="340" y="346" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">本步（d = 6）：旧桶 [0,0,0,3,0,1] 迁移（r=3→0 共 3 个、r=5→2 共 1 个），新开 "6" 入桶 0</text>
  <text x="340" y="370" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">得 cnt[6] = [4,0,1,0,0,0] —— 余 0 桶 4 个（6、36、936、12936），ans += 4</text>
</svg>
