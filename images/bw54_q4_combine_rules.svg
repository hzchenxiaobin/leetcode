<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">合并公式：x &amp; y 与 x | y 的 (f₀, f₁) 转移</text>

  <!-- AND 面板 -->
  <text x="160" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">x &amp; y（想要 0 很容易，想要 1 很贵）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="50" y="80" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="160" y="104" text-anchor="middle" font-weight="bold">f₀ = min(L.f₀, R.f₀)</text>
    <text x="160" y="126" text-anchor="middle" font-size="12">一侧压成 0，另一侧随便 → 整体 0</text>
    <text x="160" y="142" text-anchor="middle" font-size="12">（0 &amp; 任何 = 0，免费）</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="50" y="160" width="220" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="160" y="184" text-anchor="middle" font-weight="bold">f₁ = min(L.f₁ + R.f₁, 1 + min(L.f₁, R.f₁))</text>
    <text x="160" y="208" text-anchor="middle" font-size="12">两侧都变 1（&amp; 下才得 1）</text>
    <text x="160" y="228" text-anchor="middle" font-size="12">或改操作符为 | ，一侧变 1 就够</text>
    <text x="160" y="244" text-anchor="middle" font-size="12">（改符 1 次 + 单侧代价）</text>
  </g>

  <!-- OR 面板 -->
  <text x="430" y="62" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">x | y（对称：想要 1 容易）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="300" y="80" width="230" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="415" y="104" text-anchor="middle" font-weight="bold">f₁ = min(L.f₁, R.f₁)</text>
    <text x="415" y="126" text-anchor="middle" font-size="12">一侧变 1，另一侧随便 → 整体 1</text>
    <text x="415" y="142" text-anchor="middle" font-size="12">（1 | 任何 = 1，免费）</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="300" y="160" width="230" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="415" y="184" text-anchor="middle" font-weight="bold">f₀ = min(L.f₀ + R.f₀, 1 + min(L.f₀, R.f₀))</text>
    <text x="415" y="208" text-anchor="middle" font-size="12">两侧都变 0（| 下才得 0）</text>
    <text x="415" y="228" text-anchor="middle" font-size="12">或改操作符为 &amp; ，一侧变 0 就够</text>
    <text x="415" y="244" text-anchor="middle" font-size="12">（改符 1 次 + 单侧代价）</text>
  </g>

  <!-- 传染分析 -->
  <rect x="50" y="266" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">「与 0 相遇」的传染性：&amp; 链中一个 0 压住全场</text>
  <text x="290" y="312" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">A &amp; B &amp; C 中 A 变 0 后，B、C 无论怎么取值，整体必为 0；</text>
  <text x="290" y="330" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">这正是公式 f₀ = min(L.f₀, R.f₀) 的来源——</text>
  <text x="290" y="348" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">1 次单侧投资即可「锁死」整个子树的值</text>

  <rect x="50" y="370" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="394" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">公式把「改数字」和「改操作符」两类操作统一在同一次 min 里</text>
</svg>
