<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：翻转看奇偶——灯 x 亮 ⟺ x 出现奇数次</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: 1 次 -->
  <rect x="16" y="52" width="196" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">翻 1 次（奇数）</text>
  <circle cx="61" cy="112" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M74,112 L130,112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="105" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">翻</text>
  <circle cx="146" cy="112" r="11" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <g stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)">
    <path d="M146,97 L146,92" fill="none"/><path d="M146,127 L146,132" fill="none"/>
    <path d="M131,112 L126,112" fill="none"/><path d="M161,112 L166,112" fill="none"/>
  </g>
  <text x="114" y="155" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 mod 2 = 1 → <tspan font-weight="bold" fill="#4a7a3a">亮</tspan></text>

  <!-- Panel B: 2 次 -->
  <rect x="222" y="52" width="196" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">翻 2 次（偶数）</text>
  <circle cx="252" cy="112" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M265,112 L305,112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="105" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">翻</text>
  <circle cx="320" cy="112" r="11" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M333,112 L373,112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="105" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">翻</text>
  <circle cx="388" cy="112" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="155" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2 mod 2 = 0 → <tspan font-weight="bold" fill="#b85450">灭</tspan></text>

  <!-- Panel C: 3 次 -->
  <rect x="428" y="52" width="196" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">翻 3 次（奇数）</text>
  <circle cx="453" cy="112" r="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M464,112 L491,112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="502" cy="112" r="10" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M513,112 L540,112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="551" cy="112" r="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M562,112 L589,112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="600" cy="112" r="10" fill="#ffd76e" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="526" y="155" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3 mod 2 = 1 → <tspan font-weight="bold" fill="#4a7a3a">亮</tspan></text>

  <!-- Formula box -->
  <rect x="90" y="184" width="460" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">最终状态 = 出现次数 k mod 2</text>
  <text x="320" y="222" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">灯 x 亮 ⟺ cnt[x] 为奇数</text>

  <!-- Observations -->
  <rect x="60" y="240" width="520" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="260" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)"><tspan font-weight="bold">观察一（翻转自消）</tspan>：同一盏灯翻两次 = 没翻（对合）</text>
  <text x="320" y="280" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)"><tspan font-weight="bold">观察二（顺序无关）</tspan>：翻转 = Z₂ 上的加法，满足交换律</text>

  <!-- Order irrelevance example -->
  <rect x="60" y="308" width="520" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">顺序改变，结果不变</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#446688" font-family="monospace" filter="url(#rough2)">[10,30,20,10] ≡ [20,10,10,30] → 都输出 [20,30]</text>

  <!-- Bottom note -->
  <rect x="60" y="376" width="520" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="393" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">值域 1~100 ⇒ 计数数组即完美哈希表；按编号扫描，输出天然升序</text>
</svg>
