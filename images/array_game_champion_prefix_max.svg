<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：败者去队尾，但对手顺序不变</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#888">arr = [2,1,3,5,4,6,7]，k = 2：每轮的对手恰是原数组中的下一个元素</text>
  <text x="320" y="72" text-anchor="middle" font-size="10.5" fill="#999">蓝 = 擂主（位置 0）　　橙 = 本轮挑战者　　红虚框 = 上轮败者（已移到队尾）</text>

  <!-- row 1: queue at start of round 1 -->
  <g filter="url(#sk)">
    <rect x="120" y="82" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="176" y="82" width="50" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="232" y="82" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="288" y="82" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="344" y="82" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="400" y="82" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="456" y="82" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="145" y="102" fill="#2b6e9e">2</text>
    <text x="201" y="102" fill="#b8641e">1</text>
    <text x="257" y="102" fill="#666">3</text>
    <text x="313" y="102" fill="#666">5</text>
    <text x="369" y="102" fill="#666">4</text>
    <text x="425" y="102" fill="#666">6</text>
    <text x="481" y="102" fill="#666">7</text>
  </g>
  <text x="112" y="101" text-anchor="end" font-size="12" font-weight="bold" fill="#444">第 1 轮</text>
  <text x="516" y="97" font-size="12" font-weight="bold" fill="#444">2 vs 1</text>
  <text x="516" y="111" font-size="10.5" fill="#2e6e2e">2 卫冕 · 连胜 1</text>

  <!-- row 2: queue at start of round 2 -->
  <g filter="url(#sk)">
    <rect x="120" y="126" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="176" y="126" width="50" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="232" y="126" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="288" y="126" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="344" y="126" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="400" y="126" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="456" y="126" width="50" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="145" y="146" fill="#2b6e9e">2</text>
    <text x="201" y="146" fill="#b8641e">3</text>
    <text x="257" y="146" fill="#666">5</text>
    <text x="313" y="146" fill="#666">4</text>
    <text x="369" y="146" fill="#666">6</text>
    <text x="425" y="146" fill="#666">7</text>
    <text x="481" y="146" fill="#b85450">1</text>
  </g>
  <text x="112" y="145" text-anchor="end" font-size="12" font-weight="bold" fill="#444">第 2 轮</text>
  <text x="516" y="141" font-size="12" font-weight="bold" fill="#444">2 vs 3</text>
  <text x="516" y="155" font-size="10.5" fill="#2e6e2e">3 夺擂 · 连胜 1</text>

  <!-- row 3: queue at start of round 3 -->
  <g filter="url(#sk)">
    <rect x="120" y="170" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="176" y="170" width="50" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="232" y="170" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="288" y="170" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="344" y="170" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="400" y="170" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="456" y="170" width="50" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="145" y="190" fill="#2b6e9e">3</text>
    <text x="201" y="190" fill="#b8641e">5</text>
    <text x="257" y="190" fill="#666">4</text>
    <text x="313" y="190" fill="#666">6</text>
    <text x="369" y="190" fill="#666">7</text>
    <text x="425" y="190" fill="#666">1</text>
    <text x="481" y="190" fill="#b85450">2</text>
  </g>
  <text x="112" y="189" text-anchor="end" font-size="12" font-weight="bold" fill="#444">第 3 轮</text>
  <text x="516" y="185" font-size="12" font-weight="bold" fill="#444">3 vs 5</text>
  <text x="516" y="199" font-size="10.5" fill="#2e6e2e">5 夺擂 · 连胜 1</text>

  <!-- row 4: queue at start of round 4, game ends here -->
  <g filter="url(#sk)">
    <rect x="114" y="208" width="398" height="44" rx="10" fill="none" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="120" y="214" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="176" y="214" width="50" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="232" y="214" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="288" y="214" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="344" y="214" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="400" y="214" width="50" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="456" y="214" width="50" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="145" y="234" fill="#2b6e9e">5</text>
    <text x="201" y="234" fill="#b8641e">4</text>
    <text x="257" y="234" fill="#666">6</text>
    <text x="313" y="234" fill="#666">7</text>
    <text x="369" y="234" fill="#666">1</text>
    <text x="425" y="234" fill="#666">2</text>
    <text x="481" y="234" fill="#b85450">3</text>
  </g>
  <text x="112" y="233" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">第 4 轮</text>
  <text x="516" y="227" font-size="12" font-weight="bold" fill="#444">5 vs 4</text>
  <text x="516" y="241" font-size="10.5" font-weight="bold" fill="#2e6e2e">5 卫冕 · 连胜 2 = k</text>
  <text x="516" y="257" font-size="12" font-weight="bold" fill="#2e6e2e">★ 赢家 5！</text>

  <!-- prefix-max chain -->
  <text x="320" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">擂主只会被更大的元素替换 → 擂主序列 = 前缀最大值（若比赛继续）</text>
  <g filter="url(#sk)">
    <rect x="93" y="282" width="46" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="161" y="282" width="46" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="229" y="282" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="297" y="282" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="365" y="282" width="46" height="30" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="433" y="282" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="501" y="282" width="46" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="116" y="302" fill="#666">2</text>
    <text x="184" y="302" fill="#666">2</text>
    <text x="252" y="302" fill="#2b6e9e">3</text>
    <text x="320" y="302" fill="#2b6e9e">5</text>
    <text x="388" y="302" fill="#666">5</text>
    <text x="456" y="302" fill="#2b6e9e">6</text>
    <text x="524" y="302" fill="#b8641e">7</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.3">
    <path d="M 142 297 H 155" marker-end="url(#ar)"/>
    <path d="M 210 297 H 223" marker-end="url(#ar)"/>
    <path d="M 278 297 H 291" marker-end="url(#ar)"/>
    <path d="M 346 297 H 359" marker-end="url(#ar)"/>
    <path d="M 414 297 H 427" marker-end="url(#ar)"/>
    <path d="M 482 297 H 495" marker-end="url(#ar)"/>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="116" y="326">初始</text>
    <text x="184" y="326">轮1</text>
    <text x="252" y="326">轮2</text>
    <text x="320" y="326">轮3</text>
    <text x="388" y="326">轮4</text>
    <text x="456" y="326">轮5</text>
    <text x="524" y="326">轮6</text>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="11.5" fill="#777">扫完 n−1 轮后擂主 = max(arr)（末格橙色），此后永恒卫冕、连胜只增不减</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="560" height="76" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">⚠ 关键推论：一趟扫描即可，无需真的旋转队列</text>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#7a5415">· 第 i 轮 = max(arr[0..i−1]) vs arr[i]，只与原数组顺序有关；</text>
  <text x="320" y="418" text-anchor="middle" font-size="11.5" fill="#7a5415">· 扫完 n−1 轮后 cur = max(arr)、永恒卫冕 —— 未达成 k 也直接返回 cur。</text>
</svg>
