<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#r)">示例演算：boxTypes = [[5,10],[2,5],[4,7],[3,9]]，truckSize = 10</text>
  <path d="M 150 36 Q 310 44 470 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#r)">降序后依次装箱：10/箱 ×5 → 9/箱 ×3 → 7/箱 ×4 → 5/箱 ×2</text>

  <!-- table -->
  <g filter="url(#r)">
    <rect x="50" y="72" width="480" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#r)">
    <text x="97" y="91">单元/箱</text>
    <text x="195" y="91">剩余车位</text>
    <text x="287" y="91">装箱数</text>
    <text x="372" y="91">单元增量</text>
    <text x="472" y="91">累计 units</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#r)">
    <rect x="50" y="100" width="480" height="38" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="97" y="124">10</text>
    <text x="195" y="124">10 → 5</text>
    <text x="287" y="124">5</text>
    <text x="372" y="124">+50</text>
    <text x="472" y="124">50</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#r)">
    <rect x="50" y="138" width="480" height="38" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="97" y="162">9</text>
    <text x="195" y="162">5 → 2</text>
    <text x="287" y="162">3</text>
    <text x="372" y="162">+27</text>
    <text x="472" y="162">77</text>
  </g>

  <!-- row 3: answer row highlighted -->
  <g filter="url(#r)">
    <rect x="50" y="176" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" fill="#2e6e2e" filter="url(#r)">
    <text x="97" y="200">7</text>
    <text x="195" y="200">2 → 0</text>
    <text x="287" y="200">2</text>
    <text x="372" y="200">+14</text>
    <text x="472" y="200">91</text>
  </g>
  <text x="536" y="200" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">← 答案行</text>

  <!-- row 4: exhausted -->
  <g filter="url(#r)">
    <rect x="50" y="214" width="480" height="38" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#999" filter="url(#r)">
    <text x="97" y="238">5</text>
    <text x="195" y="238">0 · 车位用尽</text>
    <text x="287" y="238">—</text>
    <text x="372" y="238">—</text>
    <text x="472" y="238">91</text>
  </g>

  <!-- column separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#r)">
    <path d="M 145 74 L 145 250"/>
    <path d="M 245 74 L 245 250"/>
    <path d="M 330 74 L 330 250"/>
    <path d="M 415 74 L 415 250"/>
  </g>

  <!-- conclusion callout -->
  <g filter="url(#r)">
    <rect x="60" y="272" width="500" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#r)">答案 = 5×10 + 3×9 + 2×7 = 50 + 27 + 14 = 91</text>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#444" filter="url(#r)">车位 5 + 3 + 2 = 10 恰好用尽（单元 7 的第三类只装了 4−2 = 2 个）</text>

  <!-- compare note -->
  <text x="310" y="356" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#r)">对比：若先装小单元（2×5 + 4×7 + 3×9 + 1×10 = 10+28+27+10 = 75）＜ 91</text>
</svg>
