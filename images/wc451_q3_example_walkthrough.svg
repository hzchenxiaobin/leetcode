  <text x="460" y="546" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#sk)">答案拆解：full₁[7] = (8 − 5) + half₂[7 − 5] = 3 + 9 = 12</text>
  <text x="460" y="570" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">half₂[2] = (5 − 1) + half₃[2 − 1] = 4 + 5：员工2 半价买（花1 赚4）+ 员工3 半价买（花1 赚5）</text>
