<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="520" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [3,2,1,4,5]，k = 4，pos = 3</text>
  <path d="M 200 42 Q 430 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 数组与变换 -->
  <text x="353" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">pos = 3</text>
  <path d="M 353 58 L 353 62" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="150" y="66" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="173" y="102" text-anchor="middle" font-size="10.5" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="210" y="66" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="233" y="102" text-anchor="middle" font-size="10.5" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="270" y="66" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="293" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="293" y="102" text-anchor="middle" font-size="10.5" fill="#8e3030" filter="url(#rough2)">−1</text>
  <rect x="330" y="66" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="353" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#a07830" filter="url(#rough2)">4</text>
  <text x="353" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">0</text>
  <rect x="390" y="66" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="413" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="413" y="102" text-anchor="middle" font-size="10.5" fill="#2e5e28" filter="url(#rough2)">+1</text>

  <text x="480" y="82" font-size="12" fill="#555" filter="url(#rough2)">变换数组 b = [−1, −1, −1, 0, +1]</text>
  <text x="480" y="102" font-size="11" fill="#888" filter="url(#rough2)">k 自身贡献 0，不进任何一边的段和</text>

  <!-- 左面板：左扫建表 -->
  <rect x="40" y="130" width="385" height="265" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 左扫建表（i：2 → 0）</text>
  <text x="108" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">左段</text>
  <text x="212" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">bal</text>
  <text x="315" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cnt（累积）</text>

  <rect x="63" y="192" width="90" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">空（l = p）</text>
  <rect x="182" y="192" width="60" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="258" y="214" font-size="11" fill="#2b4a6e" filter="url(#rough2)">{0: 1}</text>

  <rect x="63" y="234" width="90" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="256" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="182" y="234" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−1</text>
  <text x="258" y="256" font-size="11" fill="#2b4a6e" filter="url(#rough2)">{0:1, −1:1}</text>

  <rect x="63" y="276" width="90" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="298" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <rect x="182" y="276" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−2</text>
  <text x="258" y="298" font-size="11" fill="#2b4a6e" filter="url(#rough2)">{0,−1,−2 各 1}</text>

  <rect x="63" y="318" width="90" height="34" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2,3]</text>
  <rect x="182" y="318" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8e3030" filter="url(#rough2)">−3</text>
  <text x="258" y="340" font-size="11" fill="#2b4a6e" filter="url(#rough2)">{0,−1,−2,−3 各 1}</text>

  <text x="232" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">cnt = {0:1, −1:1, −2:1, −3:1}</text>

  <!-- 右面板：右扫查表 -->
  <rect x="445" y="130" width="375" height="265" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="632" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">② 右扫查表（j：3 → 4）</text>
  <text x="510" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">右段</text>
  <text x="600" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">rb</text>
  <text x="712" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">查表与命中</text>

  <rect x="465" y="192" width="90" height="34" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">空（r = p）</text>
  <rect x="575" y="192" width="50" height="34" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="640" y="208" font-size="11" fill="#2e5e28" filter="url(#rough2)">cnt[0] + cnt[1] = 1 + 0</text>
  <text x="640" y="226" font-size="11.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">贡献 1 → [4]</text>

  <rect x="465" y="252" width="90" height="34" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[5]</text>
  <rect x="575" y="252" width="50" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">+1</text>
  <text x="640" y="268" font-size="11" fill="#2e5e28" filter="url(#rough2)">cnt[−1] + cnt[0] = 1 + 1</text>
  <text x="640" y="286" font-size="11.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">贡献 2 → [4,5]、[1,4,5]</text>

  <rect x="465" y="316" width="355" height="44" rx="6" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="642" y="334" text-anchor="middle" font-size="11" fill="#2e5e28" filter="url(#rough2)">每个右段查两个键：−rb 与 1 − rb，</text>
  <text x="642" y="351" text-anchor="middle" font-size="11" fill="#2e5e28" filter="url(#rough2)">分别对应 d = 0 与 d = 1（偶长靠左中位）</text>

  <!-- 结论框 -->
  <rect x="60" y="420" width="740" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">ans = 1 + 2 = 3 ✓</text>
  <text x="430" y="476" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">中位数为 4 的子数组：[4]、[4,5]、[1,4,5]（注意 [1,4] 偶长中位是 1，不算）</text>
</svg>
