<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="139" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：max(d₁ × f₂) = 720</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: day 1 ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="62" width="844" height="172" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="470" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 天（正向建边）：EUR → USD → JPY</text>

  <g filter="url(#sk)">
    <ellipse cx="180" cy="140" rx="44" ry="21" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="180" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">EUR</text>
  <g filter="url(#sk)">
    <ellipse cx="430" cy="140" rx="44" ry="21" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="430" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">USD</text>
  <g filter="url(#sk)">
    <ellipse cx="680" cy="140" rx="44" ry="21" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="680" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">JPY</text>

  <path d="M 228 140 L 382 140" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="305" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">×2</text>
  <path d="M 478 140 L 632 140" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="555" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">×3</text>

  <text x="810" y="145" text-anchor="middle" font-size="10" fill="#888">起点 1.0 EUR</text>

  <g font-family="monospace" font-size="11" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="180" y="196">d₁=1</text>
    <text x="430" y="196">d₁=2</text>
    <text x="680" y="196">d₁=6</text>
  </g>
  <text x="470" y="222" text-anchor="middle" font-size="10" fill="#888">1.0 EUR → ×2 → 2.0 USD → ×3 → 6.0 JPY（第 1 天图共 2 条边，全用上）</text>

  <!-- ===== Panel 2: day 2 inverted ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="252" width="844" height="192" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="470" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">第 2 天（反向建边）：EUR → CHF → USD → JPY</text>
  <text x="470" y="298" text-anchor="middle" font-size="10" fill="#888">原图是 JPY →(×4)→ USD →(×5)→ CHF →(×6)→ EUR；全部调头后，恰好变成从 EUR 顺流而下</text>

  <g filter="url(#sk)">
    <ellipse cx="150" cy="350" rx="42" ry="21" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="150" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">EUR</text>
  <g filter="url(#sk)">
    <ellipse cx="340" cy="350" rx="42" ry="21" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">CHF</text>
  <g filter="url(#sk)">
    <ellipse cx="530" cy="350" rx="42" ry="21" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="530" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">USD</text>
  <g filter="url(#sk)">
    <ellipse cx="720" cy="350" rx="42" ry="21" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="720" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">JPY</text>

  <path d="M 196 350 L 294 350" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="245" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">×6</text>
  <path d="M 386 350 L 484 350" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="435" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">×5</text>
  <path d="M 576 350 L 674 350" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="625" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">×4</text>

  <g font-family="monospace" font-size="11" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="150" y="406">f₂=1</text>
    <text x="340" y="406">f₂=6</text>
    <text x="530" y="406">f₂=30</text>
    <text x="720" y="406">f₂=120</text>
  </g>
  <text x="470" y="432" text-anchor="middle" font-size="10" fill="#888">f₂(c) = 1 单位货币 c 在第 2 天能换回的 EUR 数量（如 6.0 JPY → 6×120 = 720 EUR）</text>

  <!-- ===== Panel 3: product table ===== -->
  <g filter="url(#sk)">
    <rect x="48" y="462" width="844" height="152" rx="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="470" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">答案 = max{ d₁(c) × f₂(c) }（只在两天都可达的货币上）</text>

  <g font-size="11" fill="#888" text-anchor="middle" font-weight="bold">
    <text x="290" y="514">货币 c</text>
    <text x="440" y="514">d₁(c)</text>
    <text x="550" y="514">f₂(c)</text>
    <text x="690" y="514">d₁ · f₂</text>
  </g>

  <g font-family="monospace" font-size="11.5" text-anchor="middle" fill="#444">
    <text x="290" y="538">EUR</text><text x="440" y="538">1</text><text x="550" y="538">1</text><text x="690" y="538">1</text>
    <text x="290" y="560">USD</text><text x="440" y="560">2</text><text x="550" y="560">30</text><text x="690" y="560">60</text>
  </g>

  <g filter="url(#sk)">
    <rect x="252" y="568" width="476" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-family="monospace" font-size="11.5" text-anchor="middle" fill="#b03a3a" font-weight="bold">
    <text x="290" y="585">JPY</text><text x="440" y="585">6</text><text x="550" y="585">120</text><text x="690" y="585">720 ★</text>
  </g>

  <g font-family="monospace" font-size="11.5" text-anchor="middle" fill="#999">
    <text x="290" y="608">CHF</text><text x="440" y="608">—</text><text x="550" y="608">6</text>
  </g>
  <text x="690" y="608" font-size="10.5" fill="#999" text-anchor="middle">第 1 天不可达 → 跳过</text>

  <text x="470" y="642" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">输出：720.00000 ✓</text>
</svg>
