<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums1=[2,0,1,3]，nums2=[0,1,2,3]</text>

  <!-- remapped array -->
  <text x="60" y="62" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">重映射序列 a = [2, 0, 1, 3]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="146" y="74" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="74" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="318" y="74" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="100" y="99">q=0: 2</text><text x="186" y="99">q=1: 0</text>
    <text x="272" y="99">q=2: 1</text><text x="358" y="99">q=3: 3</text>
  </g>

  <!-- left/right table -->
  <g filter="url(#rough2)">
    <rect x="60" y="136" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="60" y="170" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="60" y="204" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="60" y="238" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="60" y="272" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="76" y="157" font-weight="bold" fill="#446688">中间位置 q</text>
    <text x="200" y="157" font-weight="bold" fill="#446688">左侧更小 left[q]</text>
    <text x="340" y="157" font-weight="bold" fill="#446688">右侧更大 right[q]</text>
    <text x="76" y="191">q = 0（值 2）</text><text x="200" y="191">0（左侧空）</text><text x="340" y="191">3−2 = 1</text>
    <text x="76" y="225">q = 1（值 0）</text><text x="200" y="225">0（没有数 &lt; 0）</text><text x="340" y="225">2−0 = 2</text>
    <text x="76" y="259">q = 2（值 1）</text><text x="200" y="259">1（只有 0）</text><text x="340" y="259">1−0 = 1</text>
    <text x="76" y="293">q = 3（值 3）</text><text x="200" y="293">3（0,1,2 全部）</text><text x="340" y="293">0（右侧空）</text>
  </g>

  <!-- sum -->
  <g filter="url(#rough2)">
    <rect x="60" y="322" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="347" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)" text-anchor="middle">答案 = 0×1 + 0×2 + 1×1 + 3×0 = 1</text>

  <!-- good triplet -->
  <g filter="url(#rough2)">
    <rect x="60" y="374" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="397" font-size="13" fill="#8c3a36" filter="url(#rough2)" text-anchor="middle">唯一好三元组 (0,1,3)：在两个数组中顺序都是 0 → 1 → 3</text>
</svg>
