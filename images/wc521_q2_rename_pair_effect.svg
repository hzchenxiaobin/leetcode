<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：全局改名，逐对结算</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例：nums = [1,2,1,2,1]，选 x = 1，y = 2</text>

  <!-- 改名前 -->
  <text x="92" y="94" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">改名前</text>
  <text x="122" y="68" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x</text>
  <text x="172" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">y</text>
  <text x="222" y="68" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x</text>
  <text x="272" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">y</text>
  <text x="322" y="68" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x</text>

  <rect x="100" y="72" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="96" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="150" y="72" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="96" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="200" y="72" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="96" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="250" y="72" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="96" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="300" y="72" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="96" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M222,116 L222,144" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="134" font-size="11" fill="#d6a040" filter="url(#rough2)">所有 x → y</text>

  <!-- 改名后 -->
  <text x="92" y="176" text-anchor="end" font-size="12" fill="#8a6d1f" filter="url(#rough2)">改名后</text>
  <rect x="100" y="150" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="174" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="150" y="150" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="174" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="200" y="150" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="174" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="250" y="150" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="174" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="300" y="150" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="174" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>

  <!-- 4 对相邻全相等 -->
  <path d="M102,192 q 20,12 40,0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="122" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <path d="M152,192 q 20,12 40,0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="172" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <path d="M202,192 q 20,12 40,0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="222" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <path d="M252,192 q 20,12 40,0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="272" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="222" y="244" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">base = 0，增益 = 4 ⇒ 4 对</text>

  <!-- 右侧：三种命运 -->
  <rect x="360" y="84" width="184" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 原本相等 → 仍相等</text>
  <text x="452" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,1) → (2,2)，永不拆散</text>

  <rect x="360" y="152" width="184" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">② 恰为 {x,y} → 新增！</text>
  <text x="452" y="196" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">(1,2) → (2,2)，增益 +1</text>

  <rect x="360" y="220" width="184" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 其他不等 → 仍不等</text>
  <text x="452" y="264" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(2,3) → (2,3)，无变化</text>

  <path d="M222,254 L222,288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="60" y="296" width="440" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">增益 g(x,y) = 无序对 {x,y} 的相邻出现次数 ≥ 0</text>
  <text x="280" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">答案 = base + 最大增益（不操作 = 增益 0）</text>
</svg>
