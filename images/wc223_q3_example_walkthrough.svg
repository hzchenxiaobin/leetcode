<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：四条交换边把 5 个下标连成一个分量 → 多重集相同 → 距离 0</text>
  <path d="M 60 36 Q 280 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="280" y="58" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">source = [5,1,2,4,3]　　target = [1,5,4,2,3]</text>
  <text x="280" y="76" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">allowedSwaps = [[0,4],[4,2],[1,3],[1,4]]</text>

  <!-- swap edges (drawn under nodes) -->
  <path d="M 218 148 Q 350 62 482 148" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 218 149 Q 300 100 382 149" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 480 168 Q 395 202 319 168" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 120 168 Q 300 240 480 168" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- component dashed ellipse -->
  <ellipse cx="300" cy="160" rx="245" ry="76" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="8 5" filter="url(#rough2)"/>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <circle cx="100" cy="160" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="200" cy="160" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="300" cy="160" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="400" cy="160" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="500" cy="160" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="100" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="200" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="300" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="400" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="500" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="100" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="200" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="300" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="400" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="500" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- edge labels with halo -->
  <text x="350" y="99" text-anchor="middle" font-size="10.5" fill="#a07820" stroke="#fafafa" stroke-width="3" paint-order="stroke" filter="url(#rough2)">[1,4]</text>
  <text x="300" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" stroke="#fafafa" stroke-width="3" paint-order="stroke" filter="url(#rough2)">[1,3]</text>
  <text x="350" y="193" text-anchor="middle" font-size="10.5" fill="#446688" stroke="#fafafa" stroke-width="3" paint-order="stroke" filter="url(#rough2)">[4,2]</text>
  <text x="300" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" stroke="#fafafa" stroke-width="3" paint-order="stroke" filter="url(#rough2)">[0,4]</text>

  <text x="300" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">四条边把 5 个下标并成一个连通分量 C = {0,1,2,3,4}</text>

  <!-- card A -->
  <g filter="url(#rough2)">
    <rect x="25" y="274" width="250" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="150" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">唯一的分量内做频率匹配</text>
  <text x="150" y="318" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">src {5,1,2,4,3} = {1,2,3,4,5}</text>
  <text x="150" y="336" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">tgt {1,5,4,2,3} = {1,2,3,4,5}</text>
  <text x="150" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">每个 v 都 min(1,1)=1 → match = 5</text>

  <!-- card B -->
  <g filter="url(#rough2)">
    <rect x="285" y="274" width="250" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="410" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">距离 = |C| − match</text>
  <text x="410" y="318" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">整组值恰为同一组数的一个排列</text>
  <text x="410" y="336" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">总能重排到与 target 完全一致</text>
  <text x="410" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = 5 − 5 = 0 ✓</text>
</svg>
