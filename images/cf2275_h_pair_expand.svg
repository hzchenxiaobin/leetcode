<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">价格的完全展开：子矩阵平方拆成「有序格点对 × 矩形计数」</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">行、列的选择彼此独立，而每个方向的符号几乎全部抵消</text>

  <!-- 左栏 -->
  <rect x="24" y="66" width="300" height="250" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="174" y="88" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">① 把 S² 展开成格点对</text>

  <text x="42" y="114" font-size="12.5" fill="#233" filter="url(#rough2)">S² = Σ_p Σ_q A[p] · A[q]</text>

  <!-- 3x3 网格 -->
  <g filter="url(#rough2)">
    <rect x="58" y="126" width="96" height="96" fill="#ffffff" stroke="#8a9bb0" stroke-width="1.2"/>
    <rect x="58" y="126" width="32" height="32" fill="#e8f0fe" stroke="#8a9bb0" stroke-width="1"/>
    <rect x="90" y="158" width="32" height="32" fill="#e6f4ea" stroke="#8a9bb0" stroke-width="1"/>
    <line x1="90" y1="126" x2="90" y2="222" stroke="#8a9bb0" stroke-width="1"/>
    <line x1="122" y1="126" x2="122" y2="222" stroke="#8a9bb0" stroke-width="1"/>
    <line x1="58" y1="158" x2="154" y2="158" stroke="#8a9bb0" stroke-width="1"/>
    <line x1="58" y1="190" x2="154" y2="190" stroke="#8a9bb0" stroke-width="1"/>
    <rect x="54" y="122" width="68" height="68" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333">
    <text x="74" y="147" filter="url(#rough2)">1</text>
    <text x="106" y="147" filter="url(#rough2)">5</text>
    <text x="138" y="147" filter="url(#rough2)">2</text>
    <text x="74" y="179" filter="url(#rough2)">7</text>
    <text x="106" y="179" filter="url(#rough2)">9</text>
    <text x="138" y="179" filter="url(#rough2)">8</text>
    <text x="74" y="211" filter="url(#rough2)">3</text>
    <text x="106" y="211" filter="url(#rough2)">6</text>
    <text x="138" y="211" filter="url(#rough2)">4</text>
  </g>
  <text x="166" y="146" font-size="11.5" fill="#446688" filter="url(#rough2)">p</text>
  <text x="166" y="178" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">q</text>

  <text x="42" y="246" font-size="11.5" fill="#233" filter="url(#rough2)">总价 = Σ_{p,q} A[p]A[q] · W(p,q)</text>
  <text x="42" y="266" font-size="11.5" fill="#233" filter="url(#rough2)">W 只数「同时含 p、q 的矩形」的 (−1)^{a+b}</text>
  <text x="42" y="288" font-size="11.5" fill="#b85450" filter="url(#rough2)">矩形 = 行区间 × 列区间 ⇒ W 可分离</text>

  <!-- 右栏 -->
  <rect x="348" y="66" width="348" height="250" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="522" y="88" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">② 1 维权重：符号成批抵消</text>

  <!-- 长度 6 的条带 -->
  <g filter="url(#rough2)">
    <rect x="386" y="104" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="420" y="104" width="34" height="32" fill="#ffffff" stroke="#8a9bb0" stroke-width="1"/>
    <rect x="454" y="104" width="34" height="32" fill="#ffffff" stroke="#8a9bb0" stroke-width="1"/>
    <rect x="488" y="104" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="522" y="104" width="34" height="32" fill="#ffffff" stroke="#8a9bb0" stroke-width="1"/>
    <rect x="556" y="104" width="34" height="32" fill="#ffffff" stroke="#8a9bb0" stroke-width="1"/>
    <line x1="393" y1="144" x2="393" y2="152" stroke="#b85450" stroke-width="1.4"/>
    <line x1="393" y1="150" x2="505" y2="150" stroke="#b85450" stroke-width="1.4"/>
    <line x1="505" y1="144" x2="505" y2="152" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="392" cy="152" r="2.2" fill="#b85450"/>
    <circle cx="506" cy="152" r="2.2" fill="#b85450"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#555">
    <text x="403" y="125" filter="url(#rough2)">1</text>
    <text x="437" y="125" filter="url(#rough2)">2</text>
    <text x="471" y="125" filter="url(#rough2)">3</text>
    <text x="505" y="125" filter="url(#rough2)">4</text>
    <text x="539" y="125" filter="url(#rough2)">5</text>
    <text x="573" y="125" filter="url(#rough2)">6</text>
  </g>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">l = 1</text>
  <text x="505" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">r = 4</text>
  <text x="650" y="125" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">L = 6</text>

  <text x="366" y="196" font-size="11.5" fill="#233" filter="url(#rough2)">A(l) = Σ_{rt≤l} (−1)^rt = [l 奇] · (−1)</text>
  <text x="366" y="218" font-size="11.5" fill="#233" filter="url(#rough2)">B(r) = Σ_{rb≥r} (−1)^rb = [L−r 偶] · (−1)^r</text>
  <text x="366" y="242" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">g(l,r) = −A(l)·B(r) = (−1)^L 或 0</text>
  <text x="366" y="268" font-size="11.5" fill="#233" filter="url(#rough2)">绝大多数 (l, r) 直接归零，</text>
  <text x="366" y="290" font-size="11.5" fill="#233" filter="url(#rough2)">只剩奇偶「对齐」的那些对，权重恒为 (−1)^L</text>

  <!-- 底部结论 -->
  <rect x="24" y="330" width="672" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="356" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">③ 存活条件（段长 L）：L 奇 → 两端下标都奇；L 偶 → 小端奇、大端偶</text>
  <text x="44" y="380" font-size="12" fill="#233" filter="url(#rough2)">于是 W(p,q) = g_n · g_m ∈ { 0, (−1)^{n+m} }，总价 = (−1)^{n+m} · Σ_{存活对} A[p]A[q]</text>
  <text x="44" y="400" font-size="11" fill="#8a6d3b" filter="url(#rough2)">权重与格子的具体数值无关，只与下标的奇偶有关——这就是所有计算能压到 O(nm) 的原因</text>
</svg>
