<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">requirements 的作用：把整行清空，只留一列</text>

  <text x="216" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 0</text>
  <text x="272" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 1</text>
  <text x="328" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 2</text>
  <text x="384" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = 3</text>

  <text x="174" y="90" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i = 1</text>
  <text x="174" y="134" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i = 2</text>
  <text x="174" y="178" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i = 3</text>
  <text x="174" y="222" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i = 4</text>

  <!-- 行 1：dp[1][0] = 1，其余 0 -->
  <rect x="190" y="72" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="246" y="72" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="302" y="72" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="358" y="72" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="94" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="272" y="94" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="328" y="94" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="384" y="94" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="418" y="93" font-size="10" fill="#b85450" filter="url(#rough2)">要求 (0, 0)</text>

  <!-- 行 2 -->
  <rect x="190" y="116" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="116" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="116" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="358" y="116" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="138" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="272" y="138" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="328" y="138" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="384" y="138" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="418" y="137" font-size="10" fill="#888" filter="url(#rough2)">无要求</text>

  <!-- 行 3 -->
  <rect x="190" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="358" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="182" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="272" y="182" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">2</text>
  <text x="328" y="182" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">2</text>
  <text x="384" y="182" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="418" y="181" font-size="10" fill="#888" filter="url(#rough2)">无要求</text>

  <!-- 行 4：只留 j = 3 -->
  <rect x="190" y="204" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="246" y="204" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="302" y="204" width="52" height="32" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="358" y="204" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="216" y="226" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="272" y="226" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="328" y="226" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="384" y="226" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">6</text>
  <text x="418" y="225" font-size="10" fill="#b85450" filter="url(#rough2)">要求 (3, 3)</text>

  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">例：n = 4，requirements = [[0,0], [3,3]]，最终只保留 j = 3 这一列</text>

  <rect x="120" y="284" width="280" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">答案 = dp[n][cnt] = 6</text>
</svg>
