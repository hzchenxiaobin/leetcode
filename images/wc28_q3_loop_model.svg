<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">环形模型：每个串先定朝向，再剪一刀</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按给定顺序首尾相接成环；每个串可翻转；断点可在任意位置</text>

  <rect x="30" y="64" width="520" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="86" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 每个串二选一：正串 s 或反串 rev(s)</text>
  <rect x="46" y="94" width="64" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="112" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">abc</text>
  <text x="128" y="112" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">或</text>
  <path d="M 140 107 L 160 107" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="168" y="94" width="64" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="112" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">cba</text>
  <text x="248" y="112" font-size="11" fill="#555" filter="url(#rough2)">取字典序较大者，记作 best[i]</text>

  <rect x="30" y="146" width="520" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="168" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 按原顺序首尾相接成环</text>
  <rect x="74" y="186" width="64" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="106" y="205" text-anchor="middle" font-size="12" fill="#7a5a18" filter="url(#rough2)">cba</text>
  <path d="M 142 200 L 250 200" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="258" y="186" width="64" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="205" text-anchor="middle" font-size="12" fill="#7a5a18" filter="url(#rough2)">zyx</text>
  <path d="M 326 200 L 432 200" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="186" width="44" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="462" y="205" text-anchor="middle" font-size="12" fill="#7a5a18" filter="url(#rough2)">…</text>
  <path d="M 484 218 C 484 254, 106 254, 106 220" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">环上首尾相连：cba → zyx → … → 再回到 cba</text>

  <rect x="30" y="288" width="520" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="308" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③ 在虚线处剪断 → 从断点字符开始沿环读一圈</text>
  <rect x="56" y="322" width="34" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="73" y="342" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">z</text>
  <rect x="90" y="322" width="34" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="107" y="342" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">y</text>
  <rect x="124" y="322" width="34" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="141" y="342" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">x</text>
  <rect x="158" y="322" width="34" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="342" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">c</text>
  <rect x="192" y="322" width="34" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="209" y="342" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="226" y="322" width="34" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="243" y="342" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">a</text>
  <path d="M 158 314 L 158 358" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 268 337 L 298 337" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="304" y="322" width="110" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="359" y="342" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">zyxcba</text>
  <text x="424" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（读出串）</text>

  <text x="290" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">目标：在全部（朝向, 断点）组合中取字典序最大的读出串</text>
</svg>
