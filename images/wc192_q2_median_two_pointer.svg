<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：距离从中位数向两端单调变大</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">有序数组 a = [6, 6, 7, 7, 8, 11]，n = 6，中位数 m = a[(6−1)/2] = a[2] = 7</text>

  <g filter="url(#rough2)">
    <rect x="96" y="86" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="160" y="86" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="224" y="86" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="288" y="86" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="352" y="86" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="416" y="86" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="124" y="115" text-anchor="middle" font-size="14" fill="#3a4a66">6</text>
    <text x="188" y="115" text-anchor="middle" font-size="14" fill="#3a4a66">6</text>
    <text x="252" y="115" text-anchor="middle" font-size="14" fill="#3a5a30">7</text>
    <text x="316" y="115" text-anchor="middle" font-size="14" fill="#8a6a20">7</text>
    <text x="380" y="115" text-anchor="middle" font-size="14" fill="#8a6a20">8</text>
    <text x="444" y="115" text-anchor="middle" font-size="14" fill="#8a4a48">11</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="124" y="146">0</text>
    <text x="188" y="146">1</text>
    <text x="252" y="146">2</text>
    <text x="316" y="146">3</text>
    <text x="380" y="146">4</text>
    <text x="444" y="146">5</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="124" y="166" fill="#446688">d = 1</text>
    <text x="188" y="166" fill="#446688">d = 1</text>
    <text x="252" y="166" fill="#4a7a3a" font-weight="bold">m</text>
    <text x="316" y="166" fill="#d6a040">d = 0</text>
    <text x="380" y="166" fill="#d6a040">d = 1</text>
    <text x="444" y="166" fill="#b85450">d = 4</text>
  </g>

  <path d="M 124 70 L 124 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 70 L 444 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="64" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">l（左端）</text>
  <text x="444" y="64" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">r（右端）</text>

  <path d="M 124 178 L 124 184 L 252 184 L 252 178" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 252 178 L 252 184 L 444 184 L 444 178" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="188" y="198" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">左段：越靠左离 m 越远</text>
  <text x="348" y="198" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">右段：越靠右离 m 越远</text>

  <rect x="34" y="206" width="492" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="50" y="228" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">两段各自单调 ⇒ 窗口两端就是候选</text>
  <text x="50" y="250" font-size="10" fill="#444" filter="url(#rough2)">左段 a[0..p]：下标越小离 m 越远（a[i] ≤ a[p] ≤ m）</text>
  <text x="50" y="270" font-size="10" fill="#444" filter="url(#rough2)">右段 a[p..n−1]：下标越大离 m 越远（m ≤ a[p] ≤ a[i]）</text>
  <text x="50" y="290" font-size="10" fill="#444" filter="url(#rough2)">所以剩余窗口 a[l..r] 里的最强值只能是 a[l] 或 a[r]，一次比较即可</text>
  <text x="50" y="308" font-size="10" fill="#b85450" filter="url(#rough2)">等距时取较大值：因 a[r] ≥ a[l]，直接判 |a[r]−m| ≥ |a[l]−m| 就选右侧</text>

  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">排序一次 O(n log n)；此后每挑一个元素只花 O(1)，总共 O(n log n + k)</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不需要对整数组做自定义排序，也不需要堆</text>
</svg>
