<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">剩余披萨的右下角永远钉死在 (R−1, C−1)</text>
  <text x="290" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所以状态只需记录左上角 (r, c) 和「还要切出几块」t</text>
  <text x="95" y="84" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">c=0</text>
  <text x="137" y="84" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">c=1</text>
  <text x="179" y="84" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">c=2</text>
  <text x="62" y="118" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">r=0</text>
  <text x="62" y="160" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">r=1</text>
  <text x="62" y="202" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">r=2</text>
  <rect x="74" y="92" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="119" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="116" y="92" width="42" height="42" fill="#f7f7f7" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="118" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="158" y="92" width="42" height="42" fill="#f7f7f7" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="118" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="74" y="134" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="161" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="116" y="134" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="161" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="158" y="134" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="161" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="74" y="176" width="42" height="42" fill="#f7f7f7" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="202" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="116" y="176" width="42" height="42" fill="#f7f7f7" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="202" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="158" y="176" width="42" height="42" fill="#f7f7f7" stroke="#b8b8b8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="202" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <path d="M 64 134 L 208 134" stroke="#b85450" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="138" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">横切 H@1</text>
  <path d="M 116 78 L 116 230" stroke="#446688" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">竖切 V@1</text>
  <rect x="270" y="68" width="280" height="162" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="286" y="92" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">状态设计</text>
  <text x="286" y="116" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">dp[r][c][t]：把剩余矩形</text>
  <text x="286" y="134" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">[r,R) × [c,C) 切成 t 块，</text>
  <text x="286" y="152" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">每块至少 1 个苹果的方案数</text>
  <text x="286" y="178" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">R = rows、C = cols 是常量，</text>
  <text x="286" y="196" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">位置只有 (r,c) 自由 ⇒ 共 R·C·k 个状态</text>
  <text x="286" y="218" text-anchor="start" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 = dp[0][0][k]</text>
  <rect x="44" y="252" width="498" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="276" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">转移：枚举「第一刀」（t ≥ 2）</text>
  <text x="60" y="300" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">dp[r][c][t] = Σ dp[nr][c][t−1]  横切：送走的上边条 [r,nr) 含苹果</text>
  <text x="60" y="322" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">           + Σ dp[r][nc][t−1]  竖切：送走的左边条 [c,nc) 含苹果</text>
  <text x="60" y="348" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">t = 1：区域含苹果记 1，否则 0；区域无苹果时任何 t 都是 0</text>
  <text x="290" y="384" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 pizza = ["A..","AAA","..."], k = 3：27 个状态，答案 3</text>
</svg>
