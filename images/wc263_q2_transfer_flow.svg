<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">transfer 决策流程：先全量校验，再原子入账</text>
  <path d="M 230 40 Q 390 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="235" y="52" width="310" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="75" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">transfer(account₁, account₂, money)</text>
  <path d="M 390 88 L 390 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: gate 1 x2 -->
  <g filter="url(#rough2)">
    <polygon points="390,120 565,162 390,204 215,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="390" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">闸门① × 2（双方编号）</text>
  <text x="390" y="176" text-anchor="middle" font-size="11.5" fill="#7a5c14" filter="url(#rough2)">1 ≤ a₁ ≤ n 且 1 ≤ a₂ ≤ n ?</text>
  <text x="573" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 565 162 L 601 162" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="605" y="139" width="152" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="681" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="681" y="177" text-anchor="middle" font-size="9.5" fill="#a66" filter="url(#rough2)">不碰任何余额（零副作用）</text>
  <text x="400" y="222" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <path d="M 390 204 L 390 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2: gate 2 -->
  <g filter="url(#rough2)">
    <polygon points="390,242 575,288 390,334 205,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="390" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">闸门②（付款方余额）</text>
  <text x="390" y="303" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">bal[a₁−1] ≥ money ?</text>
  <text x="583" y="278" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 575 288 L 681 288 L 681 191" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="400" y="352" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <path d="M 390 334 L 390 364" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- green commit box -->
  <g filter="url(#rough2)">
    <rect x="222" y="368" width="336" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="390" y="391" text-anchor="middle" font-size="12" fill="#3a5c2e" filter="url(#rough2)">bal[a₁−1] −= money；bal[a₂−1] += money</text>
  <text x="390" y="414" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">return true</text>
  <text x="390" y="450" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">资金守恒：a₁ 减少的 = a₂ 增加的（自转账时净变化为 0）</text>

  <!-- left dashed card: sibling ops -->
  <g filter="url(#rough2)">
    <rect x="36" y="478" width="235" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="153" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">同门姊妹操作</text>
  <text x="48" y="522" font-size="10.5" fill="#444" filter="url(#rough2)">· deposit：闸门① → +money</text>
  <text x="48" y="542" font-size="10.5" fill="#444" filter="url(#rough2)">· withdraw：闸门① + ② → −money</text>
  <text x="48" y="562" font-size="10.5" fill="#444" filter="url(#rough2)">· money = 0 恒过闸门②</text>
  <text x="48" y="582" font-size="10.5" fill="#444" filter="url(#rough2)">· 三方法共用 valid(acc)</text>

  <!-- right note cards -->
  <g filter="url(#rough2)">
    <rect x="290" y="478" width="455" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="302" y="498" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">易错：自转账 a₁ = a₂ 别乱特判</text>
  <text x="302" y="516" font-size="10.5" fill="#444" filter="url(#rough2)">过闸后 −m 再 +m，净变化 0；若直接 return true 会漏闸门②——</text>
  <text x="302" y="533" font-size="10.5" fill="#444" filter="url(#rough2)">transfer(1, 1, 20) 且余额 10 ⇒ 正确答案是 false</text>

  <g filter="url(#rough2)">
    <rect x="290" y="550" width="455" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="302" y="570" font-size="11.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">顺序契约：先校验后修改</text>
  <text x="302" y="588" font-size="10.5" fill="#444" filter="url(#rough2)">先扣款再发现 a₂ 越界就得回滚；全量过闸再动账 ⇒ 失败零副作用</text>
</svg>
