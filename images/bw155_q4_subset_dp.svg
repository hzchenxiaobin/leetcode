<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fafafa"/>
<text x="280" y="26" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">状态 = 已处理集合 mask，位置 = popcount(mask)+1</text>
<ellipse cx="280" cy="76" rx="30" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<text x="280" y="82" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{}</text>
<text x="280" y="116" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp = 0</text>
<ellipse cx="280" cy="172" rx="36" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="280" y="178" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{0}</text>
<text x="280" y="212" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp = 1×1 = 1</text>
<ellipse cx="140" cy="274" rx="46" ry="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="140" y="280" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{0,1}</text>
<text x="140" y="316" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp = 1+6×2 = 13</text>
<ellipse cx="420" cy="274" rx="46" ry="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="420" y="280" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{0,2}</text>
<text x="420" y="316" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp = 1+3×2 = 7</text>
<ellipse cx="280" cy="372" rx="56" ry="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
<text x="280" y="378" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">{0,1,2}</text>
<text x="280" y="412" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp = max(13+3×3, 7+6×3) = 25</text>
<path d="M280,106 L280,144" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="300" y="130" font-size="10" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">score[0]×1</text>
<path d="M258,196 L172,250" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="196" y="226" font-size="10" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">score[1]×2</text>
<path d="M302,196 L388,250" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="340" y="226" font-size="10" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">score[2]×2</text>
<path d="M176,296 L240,352" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="186" y="342" font-size="10" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">score[2]×3</text>
<path d="M384,296 L320,352" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="378" y="342" font-size="10" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">score[1]×3</text>
</svg>
