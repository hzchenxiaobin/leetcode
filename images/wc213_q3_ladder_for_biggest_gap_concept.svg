<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：梯子是「无面额支票」——押给最大的 gap，砖块按面额付小 gap</text>

  <!-- ================= 楼群 ================= -->
  <!-- 地面线 -->
  <path d="M 36 210 L 446 210" stroke="#999" stroke-width="2" filter="url(#rough2)"/>

  <!-- 楼 1..5，高度 2,5,2,7,4 -->
  <rect x="48" y="178" width="64" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="172" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="126" y="130" width="64" height="80" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="204" y="178" width="64" height="32" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="172" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="282" y="98" width="64" height="112" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="314" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="360" y="146" width="64" height="64" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="140" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>

  <!-- 楼号 -->
  <text x="80" y="228" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="158" y="228" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="236" y="228" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="314" y="228" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="392" y="228" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>

  <!-- 段 0→1：gap 3，砖块支付 -->
  <path d="M 84 170 L 154 126" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119" y="134" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d=3</text>
  <text x="119" y="150" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">砖块 ×3</text>

  <!-- 段 2→3：gap 5，梯子跨越 -->
  <path d="M 238 168 L 312 98" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="118" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d=5</text>
  <text x="255" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">梯子 ✓</text>

  <!-- 下坡标注 -->
  <text x="200" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下坡↓ 免费</text>
  <text x="357" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下坡 免费</text>

  <!-- ================= 右侧工具框 ================= -->
  <!-- 梯子框 -->
  <rect x="470" y="58" width="240" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="585" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一架梯子</text>
  <path d="M 500 92 L 500 134" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 522 92 L 522 134" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 500 102 L 522 102" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 500 114 L 522 114" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 500 126 L 522 126" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="538" y="112" font-size="11" fill="#666" filter="url(#rough2)">跨任意大的 gap</text>
  <text x="538" y="130" font-size="11" fill="#666" filter="url(#rough2)">= 无面额支票</text>

  <!-- 砖块框 -->
  <rect x="470" y="162" width="240" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="585" y="184" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">砖块</text>
  <rect x="500" y="196" width="10" height="9" rx="1.5" fill="#e8a04a" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="512" y="196" width="10" height="9" rx="1.5" fill="#e8a04a" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="524" y="196" width="10" height="9" rx="1.5" fill="#e8a04a" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="500" y="207" width="10" height="9" rx="1.5" fill="#e8a04a" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="512" y="207" width="10" height="9" rx="1.5" fill="#e8a04a" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="524" y="207" width="10" height="9" rx="1.5" fill="#e8a04a" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="544" y="210" font-size="11" fill="#666" filter="url(#rough2)">gap = g 就花 g 块</text>
  <text x="544" y="228" font-size="11" fill="#666" filter="url(#rough2)">= 按面额支付</text>

  <!-- ================= 交换论证 ================= -->
  <rect x="40" y="256" width="640" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="278" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">交换论证：梯子挪去更大的 gap，砖块只省不亏</text>

  <rect x="60" y="290" width="280" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">梯子 → d=3，砖付 d=5</text>
  <text x="200" y="326" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">砖花 5 &gt; 手头 4 ✗ 卡在楼 4 前</text>

  <path d="M 344 312 L 366 312" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">换</text>

  <rect x="368" y="290" width="290" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="513" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">梯子 → d=5，砖付 d=3</text>
  <text x="513" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">砖花 3 ≤ 4 ✓ 登顶楼 4，还剩 1 块</text>

  <!-- ================= 结论框 ================= -->
  <rect x="40" y="354" width="640" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="376" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">结论：ladders 架梯子全部押在「最大的 ladders 个 gap」上</text>
  <text x="360" y="396" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">砖块总花费 = 其余 gap 之和 —— 任何别的分配砖耗都不小于它</text>
  <text x="360" y="414" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">反悔贪心：先用梯子占位，堆溢出时把最小的 gap 反悔改付砖块</text>
</svg>
