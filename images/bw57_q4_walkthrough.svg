<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算表：heights = [10,6,8,5,11,9]，从右往左逐步走查</text>

  <!-- 表头 -->
  <g font-size="11.5" font-weight="bold" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <rect x="40" y="44" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="84"  y="44" width="48"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="132" y="44" width="90"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="222" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="332" y="44" width="64"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="396" y="44" width="70"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="466" y="44" width="80"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="62"  y="63">i</text>
    <text x="108" y="63">h[i]</text>
    <text x="177" y="63">弹出</text>
    <text x="277" y="63">弹后栈(底→顶)</text>
    <text x="364" y="63">+更高?</text>
    <text x="431" y="63">answer</text>
    <text x="506" y="63">入栈后</text>
  </g>

  <!-- 6 行 -->
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <!-- i=5 -->
    <rect x="40" y="76" width="44" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="84" y="76" width="48" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="132" y="76" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="222" y="76" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="332" y="76" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="396" y="76" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="466" y="76" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="62" y="96">5</text><text x="108" y="96">9</text><text x="177" y="96">—</text>
    <text x="277" y="96">[]</text><text x="364" y="96">否(空)</text><text x="431" y="96">0</text><text x="506" y="96">[9]</text>

    <!-- i=4 -->
    <rect x="40" y="110" width="44" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="84" y="110" width="48" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="132" y="110" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="222" y="110" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="332" y="110" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="396" y="110" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="466" y="110" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="62" y="130">4</text><text x="108" y="130">11</text><text x="177" y="130">9</text>
    <text x="277" y="130">[]</text><text x="364" y="130">否(空)</text><text x="431" y="130">1</text><text x="506" y="130">[11]</text>

    <!-- i=3 -->
    <rect x="40" y="144" width="44" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="84" y="144" width="48" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="132" y="144" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="222" y="144" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="332" y="144" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="396" y="144" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="466" y="144" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="62" y="164">3</text><text x="108" y="164">5</text><text x="177" y="164">—</text>
    <text x="277" y="164">[11]</text><text x="364" y="164">是</text><text x="431" y="164">1</text><text x="506" y="164">[11,5]</text>

    <!-- i=2 -->
    <rect x="40" y="178" width="44" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="84" y="178" width="48" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="132" y="178" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="222" y="178" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="332" y="178" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="396" y="178" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="466" y="178" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="62" y="198">2</text><text x="108" y="198">8</text><text x="177" y="198">5</text>
    <text x="277" y="198">[11]</text><text x="364" y="198">是</text><text x="431" y="198">2</text><text x="506" y="198">[11,8]</text>

    <!-- i=1 -->
    <rect x="40" y="212" width="44" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="84" y="212" width="48" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="132" y="212" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="222" y="212" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="332" y="212" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="396" y="212" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="466" y="212" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="62" y="232">1</text><text x="108" y="232">6</text><text x="177" y="232">—</text>
    <text x="277" y="232">[11,8]</text><text x="364" y="232">是</text><text x="431" y="232">1</text><text x="506" y="232">[11,8,6]</text>

    <!-- i=0（重点行） -->
    <rect x="40" y="246" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="84" y="246" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="132" y="246" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="222" y="246" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="332" y="246" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="396" y="246" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="466" y="246" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="62" y="267" font-weight="bold">0</text><text x="108" y="267" font-weight="bold">10</text>
    <text x="177" y="267" font-weight="bold">6, 8</text><text x="277" y="267" font-weight="bold">[11]</text>
    <text x="364" y="267" font-weight="bold">是</text><text x="431" y="267" font-weight="bold">3</text><text x="506" y="267" font-weight="bold">[11,10]</text>
  </g>

  <!-- 结论框 -->
  <rect x="40" y="300" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">answer = [3, 1, 2, 1, 1, 0] ✓</text>
  <text x="280" y="348" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">i=0：连弹 6、8（两个可见矮个），栈顶 11 是第一个更高者（+1）→ 3 人</text>
  <text x="280" y="368" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">注意：9 早在 i=4 处理时就被 11 弹掉（被 11 挡住，10 看不到）</text>
</svg>
