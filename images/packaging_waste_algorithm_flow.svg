<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">单供应商处理流程（决策 + 累加 + 剪枝）</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><ellipse cx="110" cy="100" rx="64" ry="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="110" y="98" text-anchor="middle" font-size="12" fill="#2b4e6e" font-weight="bold">进入供应商 j</text>
  <text x="110" y="114" text-anchor="middle" font-size="10" fill="#666">boxes[j] 已排序</text>

  <path d="M 174 100 L 216 100" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: max box >= max package -->
  <g filter="url(#sk)"><polygon points="330,54 452,100 330,146 208,100" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="330" y="94" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">最大箱 ≥ 最大包裹？</text>
  <text x="330" y="112" text-anchor="middle" font-size="10" fill="#888">O(1) 剪枝</text>

  <!-- no: skip -->
  <path d="M 452 100 L 560 100" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="506" y="90" text-anchor="middle" font-size="11" fill="#a04440" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="566" y="76" width="130" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="631" y="97" text-anchor="middle" font-size="11" fill="#a04440" font-weight="bold">跳过该供应商</text>
  <text x="631" y="113" text-anchor="middle" font-size="10" fill="#a04440">continue</text>

  <!-- yes -->
  <path d="M 330 146 L 330 178" stroke="#4a8e4a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="344" y="168" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- init -->
  <g filter="url(#sk)"><rect x="240" y="182" width="180" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">waste = 0, prev = 0</text>
  <text x="330" y="214" text-anchor="middle" font-size="10" fill="#666">long long 累加</text>

  <path d="M 330 222 L 330 254" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop: next box -->
  <g filter="url(#sk)"><rect x="228" y="258" width="204" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="330" y="276" text-anchor="middle" font-size="11" fill="#2b4e6e" font-weight="bold">取下一个箱子尺寸 b（升序）</text>
  <text x="330" y="290" text-anchor="middle" font-size="10" fill="#666">没有剩余 → 出循环</text>

  <path d="M 330 298 L 330 330" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- binary search -->
  <g filter="url(#sk)"><rect x="210" y="334" width="240" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="330" y="352" text-anchor="middle" font-size="11" fill="#2b4e6e" font-weight="bold">idx = upper_bound(packages, b)</text>
  <text x="330" y="370" text-anchor="middle" font-size="10" fill="#666">≤ b 的包裹个数，O(log n)</text>

  <path d="M 330 380 L 330 412" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: idx > prev -->
  <g filter="url(#sk)"><polygon points="330,416 430,462 330,508 230,462" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="330" y="458" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">idx &gt; prev ?</text>
  <text x="330" y="474" text-anchor="middle" font-size="10" fill="#888">有新包裹可装</text>

  <!-- yes: accumulate -->
  <path d="M 230 462 L 160 462 L 160 356" stroke="#4a8e4a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="452" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="40" y="252" width="240" height="104" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">累加段浪费</text>
  <text x="160" y="298" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">waste += b·(idx−prev)</text>
  <text x="160" y="314" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">      − (prefix[idx]−prefix[prev])</text>
  <text x="160" y="336" text-anchor="middle" font-size="10" fill="#666">然后 prev = idx</text>
  <path d="M 160 252 L 160 234 L 228 236" stroke="#4a8e4a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="176" y="228" font-size="10" fill="#2e6e2e">回到循环</text>

  <!-- no: back to loop -->
  <path d="M 430 462 L 540 462 L 540 278 L 432 278" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="486" y="452" font-size="11" fill="#a04440" font-weight="bold">否</text>
  <text x="552" y="370" font-size="10" fill="#888">b 装不下新包裹</text>
  <text x="552" y="386" font-size="10" fill="#888">（重复二分无意义，跳过）</text>

  <!-- exit & early break note -->
  <g filter="url(#sk)"><rect x="620" y="252" width="290" height="130" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="640" y="276" font-size="12" font-weight="bold" fill="#2b2b2b">提前终止 &amp; 收尾</text>
  <text x="640" y="298" font-size="11" fill="#444" font-family="monospace">prev == n 时 break（全装完）</text>
  <text x="640" y="320" font-size="11" fill="#444" font-family="monospace">出循环后若 prev == n：</text>
  <text x="640" y="342" font-size="11" fill="#444" font-family="monospace">  ans = min(ans, waste)</text>
  <text x="640" y="364" font-size="11" fill="#a04440" font-weight="bold">⚠ 中途取模会破坏 min 比较！</text>

  <!-- final -->
  <g filter="url(#sk)"><rect x="620" y="410" width="290" height="110" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="640" y="434" font-size="12" font-weight="bold" fill="#2e6e2e">所有供应商处理完</text>
  <text x="640" y="458" font-size="11" fill="#444" font-family="monospace">ans 仍为 +∞ → 返回 −1</text>
  <text x="640" y="480" font-size="11" fill="#444" font-family="monospace">否则返回 ans mod (10⁹+7)</text>
  <text x="640" y="504" font-size="10" fill="#666">比较用真值，取模只做一次</text>
</svg>
