<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">后序 DFS：信息自底向上聚合 (sum, cnt)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">先算左右子树，再把 (sum, cnt) 汇报给父节点 —— 每个节点只被访问一次</text>

  <g filter="url(#rough2)">
    <circle cx="280" cy="88" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="280" y="93" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold">5</text>
    <circle cx="180" cy="180" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="180" y="185" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">6</text>
    <circle cx="380" cy="180" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="380" y="185" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 262 106 L 198 158" stroke="#666" stroke-width="1.6" fill="none"/>
    <path d="M 298 106 L 362 158" stroke="#666" stroke-width="1.6" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="96" y="216" width="168" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="180" y="236" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">节点 6：(6, 1)</text>
    <text x="180" y="256" text-anchor="middle" font-size="10" fill="#3a5a30">avg = 6/1 = 6</text>
    <rect x="296" y="216" width="168" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="380" y="236" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">节点 1：(1, 1)</text>
    <text x="380" y="256" text-anchor="middle" font-size="10" fill="#8a6a20">avg = 1/1 = 1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 180 200 L 180 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <path d="M 380 200 L 380 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="170" y="288" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">节点 5：(6+1+5, 1+1+1) = (12, 3)</text>
    <text x="280" y="330" text-anchor="middle" font-size="10" fill="#3a4a66">avg = 12/3 = 4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 180 270 L 240 288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <path d="M 380 270 L 320 288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="60" width="120" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="90" y="82" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">汇报的内容</text>
    <text x="90" y="102" text-anchor="middle" font-size="10" fill="#555">sum = 子树权值和</text>
    <text x="90" y="120" text-anchor="middle" font-size="10" fill="#555">cnt = 子树节点数</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="410" y="60" width="130" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="475" y="82" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">合并公式</text>
    <text x="475" y="102" text-anchor="middle" font-size="10" fill="#555">sum = ls+rs+v</text>
    <text x="475" y="120" text-anchor="middle" font-size="10" fill="#555">cnt = lc+rc+1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="360" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="280" y="378" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">在"合并处"顺手用 sum/cnt 更新全局 best，无需第二遍遍历</text>
    <text x="280" y="396" text-anchor="middle" font-size="10" fill="#555">本例三处 avg = {4, 6, 1}，best = 6（节点 6 的单点子树）</text>
  </g>
</svg>
