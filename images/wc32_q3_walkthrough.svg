<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "sea"，word2 = "eat"</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行 = word1 前缀，列 = word2 前缀，逐格填表</text>

  <rect x="200" y="72" width="192" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="144" y="104" width="56" height="192" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="93" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">ε</text>
  <text x="272" y="93" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">e</text>
  <text x="320" y="93" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">a</text>
  <text x="368" y="93" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">t</text>
  <text x="172" y="133" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">ε</text>
  <text x="172" y="181" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">s</text>
  <text x="172" y="229" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">e</text>
  <text x="172" y="277" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="200" y="104" width="48" height="48" fill="#fdfdfd" stroke="#8a94a6" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="224" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="104" width="48" height="48" fill="#fdfdfd" stroke="#8a94a6" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
