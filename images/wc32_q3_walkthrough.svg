  <text x="56" y="338" font-size="12.5" fill="#555" filter="url(#rough2)">dp[3][3] = 2：word1 删 s，word2 删 t，共同保留 "ea"</text>
  <text x="56" y="364" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">绿格：字符相等，值从左上抄来，不再 +1</text>
  <text x="56" y="390" font-size="11.5" fill="#b85450" filter="url(#rough2)">橙格：最终答案；其余格取 min(上, 左) + 1</text>
