<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：k = 3，堆里始终是键最小的 3 行</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行先用二分得到 c_i，再用键 (c_i, i) 与大根堆比较；堆满 k 个后，来了更弱的就挤掉堆顶</text>

  <rect x="28" y="70" width="564" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="53" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">行 i</text>
  <text x="153" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">矩阵行</text>
  <text x="248" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="303" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">键</text>
  <text x="433" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">堆（≤ 3 项）</text>
  <text x="560" y="88" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">弹出</text>

  <rect x="28" y="98" width="564" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="124" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="153" y="124" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 1 0 0 0</text>
  <text x="248" y="124" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="303" y="124" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">(2,0)</text>
  <text x="433" y="124" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{(2,0)}</text>
  <text x="560" y="124" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">—</text>

  <rect x="28" y="140" width="564" height="42" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="166" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="153" y="166" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 1 1 1 0</text>
  <text x="248" y="166" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="303" y="166" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">(4,1)</text>
  <text x="433" y="166" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{(2,0),(4,1)}</text>
  <text x="560" y="166" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">—</text>

  <rect x="28" y="182" width="564" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="208" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="153" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 0 0 0 0</text>
  <text x="248" y="208" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="303" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(1,2)</text>
  <text x="433" y="208" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{(1,2),(2,0),(4,1)}</text>
  <text x="560" y="208" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">—</text>

  <rect x="28" y="224" width="564" height="42" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="153" y="250" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 1 0 0 0</text>
  <text x="248" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="303" y="250" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">(2,3)</text>
  <text x="433" y="250" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{(1,2),(2,0),(2,3)}</text>
  <rect x="528" y="224" width="64" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="560" y="250" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">(4,1)</text>

  <rect x="28" y="266" width="564" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="53" y="292" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="153" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 1 1 1 1</text>
  <text x="248" y="292" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">5</text>
  <text x="303" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(5,4)</text>
  <text x="433" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{(1,2),(2,0),(2,3)}</text>
  <rect x="528" y="266" width="64" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="560" y="292" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">(5,4)</text>

  <text x="310" y="332" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">行 3 的 (2,3) 比堆顶 (4,1) 弱 → 挤掉 (4,1)；行 4 的 (5,4) 更强，入堆即被弹出</text>
  <text x="310" y="356" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">最终堆 = {(1,2),(2,0),(2,3)}，从强到弱弹出再倒序，输出 [2, 0, 3]</text>
  <text x="310" y="382" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行 3 与行 0 同为 2 个军人，行号 3 &gt; 0，所以行 0 更弱、排在前面</text>
</svg>
