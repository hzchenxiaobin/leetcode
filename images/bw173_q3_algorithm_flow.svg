<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="540" height="330" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="17" fill="#333">算法流程（两遍线性扫描）</text>

  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#333">up[i] ← +∞，up[0] ← 0</text>
  <path d="M270,84 L270,108" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="108" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="133" text-anchor="middle" font-size="12" fill="#333">写入限制：up[idx] ← min(up[idx], maxVal)</text>
  <path d="M270,148 L270,172" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="172" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="199" text-anchor="middle" font-size="12" fill="#333">左扫 i = 1..n−1：up[i] = min(up[i], up[i−1]+diff[i−1])</text>
  <path d="M270,216 L270,240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="240" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="267" text-anchor="middle" font-size="12" fill="#333">右扫 i = n−2..0：up[i] = min(up[i], up[i+1]+diff[i])</text>

  <rect x="150" y="294" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="313" text-anchor="middle" font-size="12" fill="#333">返回 max(up)，复杂度 O(n)</text>
</svg>
