<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">核心观察：按值分桶后问题变成「打家劫舍」</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888">同一数值要么全取（得 v × cnt[v]），要么全不取；取了 v 就碰不得 v−1 与 v+1</text>

  <text x="163" y="80" font-size="11" fill="#666">原始数组 nums = [2, 2, 3, 3, 3, 4]</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="163" y="88" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="213" y="88" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="263" y="88" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="313" y="88" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="363" y="88" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="413" y="88" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="185" y="111" fill="#3a4a66">2</text>
    <text x="235" y="111" fill="#3a4a66">2</text>
    <text x="285" y="111" fill="#7a2f2b">3</text>
    <text x="335" y="111" fill="#7a2f2b">3</text>
    <text x="385" y="111" fill="#7a2f2b">3</text>
    <text x="435" y="111" fill="#3a5a30">4</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#aaa">
    <text x="185" y="136">0</text><text x="235" y="136">1</text><text x="285" y="136">2</text>
    <text x="335" y="136">3</text><text x="385" y="136">4</text><text x="435" y="136">5</text>
  </g>

  <path d="M 310 146 L 310 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="170" font-size="10" fill="#556">按值聚合：points[v] = v × cnt[v]，同值的分数一次性打包</text>

  <text x="150" y="196" font-size="11" fill="#666">桶 points[v]（cnt 已合并，空桶记 0）</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="150" y="206" width="56" height="40" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.4" rx="6"/>
    <rect x="216" y="206" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6"/>
    <rect x="282" y="206" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="348" y="206" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="414" y="206" width="56" height="40" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.4" rx="6"/>
    <text x="178" y="232" fill="#999">0</text>
    <text x="244" y="232" fill="#3a4a66">4</text>
    <text x="310" y="232" fill="#7a2f2b">9</text>
    <text x="376" y="232" fill="#3a5a30">4</text>
    <text x="442" y="232" fill="#999">0</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="178" y="264">v = 1</text>
    <text x="244" y="264">v = 2</text>
    <text x="310" y="264">v = 3</text>
    <text x="376" y="264">v = 4</text>
    <text x="442" y="264">v = 5</text>
  </g>

  <path d="M 250 268 Q 277 286 304 268" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 316 268 Q 343 286 370 268" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="310" y="300" text-anchor="middle" font-size="10" fill="#b85450">虚线：相邻桶互斥（取了 3 就不能取 2 和 4）</text>

  <rect x="80" y="314" width="460" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="98" y="338" font-size="12" fill="#8a6a20" font-weight="bold">于是原问题等价于：在值域数轴上取不相邻的桶，使分数和最大</text>
  <text x="98" y="362" font-size="11" fill="#666">f[v] = max( f[v−1], f[v−2] + points[v] )　正是「打家劫舍」的递推式</text>

  <text x="310" y="392" text-anchor="middle" font-size="10" fill="#999">总代价 O(V + n)，V = max(nums) ≤ 10⁴，与数值大小无关的排序都不需要</text>
</svg>
