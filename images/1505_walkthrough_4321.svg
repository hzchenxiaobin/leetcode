<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：num = "4321"，k = 4 → "1342"</text>
  <text x="340" y="48" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">每步枚举 d = 0…9 的队首位置 j，算 cost = j − del_lt(j)，选首个 cost ≤ k 的数字</text>

  <!-- table frame -->
  <g filter="url(#r)">
    <rect x="17" y="66" width="646" height="30" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="61" y="96" width="250" height="264" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="17" y="96" width="44" height="264" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="311" y="96" width="52" height="264" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="363" y="96" width="88" height="264" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="451" y="96" width="116" height="264" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="567" y="96" width="96" height="264" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="17" y1="162" x2="663" y2="162" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="17" y1="228" x2="663" y2="228" stroke="#c9c9c9" stroke-width="1"/>
    <line x1="17" y1="294" x2="663" y2="294" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="39" y="85" filter="url(#r)">t</text>
    <text x="186" y="85" filter="url(#r)">尝试的候选（d: j, cost）</text>
    <text x="337" y="85" filter="url(#r)">选中</text>
    <text x="407" y="85" filter="url(#r)">k 剩余</text>
    <text x="509" y="85" filter="url(#r)">已删 D</text>
    <text x="615" y="85" filter="url(#r)">结果 ans</text>
  </g>

  <!-- row 1: t=0 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="39" y="132" font-weight="bold" fill="#333" filter="url(#r)">0</text>
    <text x="186" y="126" fill="#2e6e2e" filter="url(#r)">d=1: j=3, cost = 3−0 = 3 ≤ 4</text>
    <text x="186" y="144" font-weight="bold" fill="#2e6e2e" filter="url(#r)">✓ 直接命中（d=0 无 '0'）</text>
    <text x="337" y="132" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="407" y="132" fill="#333" filter="url(#r)">4 → 1</text>
    <text x="509" y="132" fill="#333" filter="url(#r)">{3}</text>
    <text x="615" y="132" fill="#333" filter="url(#r)">"1"</text>
  </g>

  <!-- row 2: t=1 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="39" y="198" font-weight="bold" fill="#333" filter="url(#r)">1</text>
    <text x="186" y="192" fill="#b85450" filter="url(#r)">d=2: j=2, cost = 2 &gt; 1 ✗</text>
    <text x="186" y="210" font-weight="bold" fill="#2e6e2e" filter="url(#r)">d=3: j=1, cost = 1 ≤ 1 ✓</text>
    <text x="337" y="198" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
    <text x="407" y="198" fill="#333" filter="url(#r)">1 → 0</text>
    <text x="509" y="198" fill="#333" filter="url(#r)">{3,1}</text>
    <text x="615" y="198" fill="#333" filter="url(#r)">"13"</text>
  </g>

  <!-- row 3: t=2 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="39" y="264" font-weight="bold" fill="#333" filter="url(#r)">2</text>
    <text x="186" y="258" fill="#b85450" filter="url(#r)">d=2: j=2, cost = 2−1 = 1 &gt; 0 ✗</text>
    <text x="186" y="276" font-weight="bold" fill="#2e6e2e" filter="url(#r)">d=3 已用完；d=4: j=0, cost = 0 ✓</text>
    <text x="337" y="264" font-weight="bold" fill="#2e6e2e" filter="url(#r)">4</text>
    <text x="407" y="264" fill="#333" filter="url(#r)">0</text>
    <text x="509" y="264" fill="#333" filter="url(#r)">{3,1,0}</text>
    <text x="615" y="264" fill="#333" filter="url(#r)">"134"</text>
  </g>

  <!-- row 4: t=3 -->
  <g font-size="12.5" text-anchor="middle">
    <text x="39" y="330" font-weight="bold" fill="#333" filter="url(#r)">3</text>
    <text x="186" y="324" fill="#2e6e2e" filter="url(#r)">d=2: j=2, cost = 2−2 = 0 ≤ 0</text>
    <text x="186" y="342" font-weight="bold" fill="#2e6e2e" filter="url(#r)">✓ 前方两个位置已是幽灵</text>
    <text x="337" y="330" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>
    <text x="407" y="330" fill="#333" filter="url(#r)">0</text>
    <text x="509" y="330" fill="#333" filter="url(#r)">{3,1,0,2}</text>
    <text x="615" y="330" font-weight="bold" fill="#333" filter="url(#r)">"1342"</text>
  </g>

  <!-- note 1 -->
  <g filter="url(#r)">
    <rect x="17" y="386" width="646" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="340" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#r)">t = 1 拒选 '2' 正是关键瞬间："1243" 需要 3+2 = 5 次交换 &gt; k = 4，不可达；</text>
  <text x="340" y="430" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#r)">贪心退而选 '3'（cost 1）——预算不够时，「能负担的最小数字」才是正确答案</text>

  <!-- note 2 -->
  <g filter="url(#r)">
    <rect x="17" y="456" width="646" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="340" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">总代价 3 + 1 + 0 + 0 = 4 = k ✓，输出 "1342"</text>
  <text x="340" y="502" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#r)">实际交换路径：4321 → 4312 → 4132 → 1432 → 1342（恰好 4 次相邻交换）</text>
  <text x="340" y="520" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#r)">对照："1234" 需 6 次（4321 的逆序对总数），k = 4 无法完全排序</text>
</svg>
