<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="380" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">count(x) 单调不减 ⇒ 二分找「第一个 count(x) ≥ n 的 x」，它必是神奇数</text>

  <!-- 阶梯函数示意 -->
  <path d="M70 310 L660 310" stroke="#9aa4b0" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M70 310 L70 60" stroke="#9aa4b0" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="600" y="332" font-size="11" fill="#666" filter="url(#rough2)">x</text>
  <text x="30" y="70" font-size="11" fill="#666" filter="url(#rough2)">count(x)</text>

  <path d="M70 296 L140 296 L140 272 L220 272 L220 248 L280 248 L280 224 L340 224 L340 200 L420 200 L420 176 L480 176 L480 152 L560 152 L560 128 L620 128"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="290" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <text x="230" y="266" font-size="10" fill="#446688" filter="url(#rough2)">3</text>
  <text x="290" y="242" font-size="10" fill="#446688" filter="url(#rough2)">4</text>
  <text x="350" y="218" font-size="10" fill="#446688" filter="url(#rough2)">6</text>

  <!-- n 参考线 -->
  <path d="M70 248 L620 248" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="600" y="242" font-size="11" fill="#b07d20" filter="url(#rough2)">第 n 个</text>
  <circle cx="280" cy="248" r="6" fill="#4a7a3a" stroke="#33562a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">x* = 第一个达标位置</text>

  <!-- 二分区间 -->
  <path d="M120 62 L620 62" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="120" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">lo = 1</text>
  <text x="620" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">hi = min(a,b)·n</text>

  <!-- 说明 -->
  <rect x="24" y="356" width="612" height="20" fill="none" filter="url(#rough2)"/>
  <text x="70" y="374" font-size="11" fill="#666" filter="url(#rough2)">为什么可以把 lo 上界放到 min(a,b)·n？因为 ≤ min(a,b)·n 的倍数里至少已有 n 个是 min(a,b) 的倍数</text>
</svg>
