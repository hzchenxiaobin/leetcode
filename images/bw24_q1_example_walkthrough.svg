<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [-3, 2, -3, 4, 2]</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="500" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="30" y="82" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="116" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="150" width="500" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="30" y="184" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="218" width="500" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <line x1="120" y1="48" x2="120" y2="252" stroke="#446688" stroke-width="1"/>
    <line x1="260" y1="48" x2="260" y2="252" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="48" x2="400" y2="252" stroke="#446688" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="75" y="69">步</text><text x="190" y="69">nums[i]</text><text x="330" y="69">前缀和 P</text><text x="465" y="69">sv=4 / sv=5</text>
    <text x="75" y="103">1</text><text x="190" y="103">−3</text><text x="330" y="103">−3</text><text x="465" y="103">1 / 2</text>
    <text x="75" y="137">2</text><text x="190" y="137">2</text><text x="330" y="137">−1</text><text x="465" y="137">3 / 4</text>
    <text x="75" y="171" fill="#b85450">3</text><text x="190" y="171" fill="#b85450">−3</text>
    <text x="330" y="171" fill="#b85450">−4（最低）</text><text x="465" y="171" fill="#b85450">0 ✗ / 1 ✓</text>
    <text x="75" y="205">4</text><text x="190" y="205">4</text><text x="330" y="205">0</text><text x="465" y="205">4 / 5</text>
    <text x="75" y="239">5</text><text x="190" y="239">2</text><text x="330" y="239">2</text><text x="465" y="239">6 / 7</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="70" y="272" width="420" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="295" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">minP = −4 → max(1, 1 − (−4)) = 5</text>
</svg>
