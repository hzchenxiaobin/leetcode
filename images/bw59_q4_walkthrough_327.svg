<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="49"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：num = "327"（示例 1，答案 2）</text>

  <!-- 两种方案 -->
  <text x="150" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">方案一：3 | 27</text>
  <g filter="url(#rough2)">
    <rect x="70" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="120" y="76" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="92" y="101">3</text>
    <text x="175" y="101">2 7</text>
  </g>
  <text x="150" y="140" font-size="12" fill="#2d5a22" filter="url(#rough2)" text-anchor="middle">3 ≤ 27 ✓（前段位数少必小）</text>

  <text x="420" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">方案二：327（整串一个数）</text>
  <g filter="url(#rough2)">
    <rect x="330" y="76" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="420" y="101" font-size="14" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">3 2 7</text>
  <text x="420" y="140" font-size="12" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">首字符 '3' ≠ '0'，合法 ✓</text>

  <!-- dp 表演算 -->
  <text x="280" y="176" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">dp[i][L] 演算（只列有意义的项）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="192" width="440" height="30" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="140" y="212">末段（长度 L）</text>
    <text x="300" y="212">合法前段</text>
    <text x="450" y="212">dp 值</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="222" width="440" height="28" fill="#e8f0fe" rx="4"/>
    <rect x="60" y="250" width="440" height="28" fill="#f4f8ff" rx="4"/>
    <rect x="60" y="278" width="440" height="28" fill="#e8f0fe" rx="4"/>
    <rect x="60" y="306" width="440" height="28" fill="#f4f8ff" rx="4"/>
    <line x1="220" y1="192" x2="220" y2="334" stroke="#c3d2e4" stroke-width="1"/>
    <line x1="380" y1="192" x2="380" y2="334" stroke="#c3d2e4" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="140" y="241">"3"（i=1, L=1）</text><text x="300" y="241">整串，无需前段</text><text x="450" y="241">1</text>
    <text x="140" y="269">"2"（i=2, L=1）</text><text x="300" y="269">前段须 ≤ 2：只能 "3"，但 3 &gt; 2</text><text x="450" y="269">0</text>
    <text x="140" y="297">"27"（i=3, L=2）</text><text x="300" y="297">前段 "3"（1 位 &lt; 2 位必小）✓</text><text x="450" y="297">1</text>
    <text x="140" y="325">"327"（i=3, L=3）</text><text x="300" y="325">整串，无需前段</text><text x="450" y="325">1</text>
  </g>

  <!-- 汇总 -->
  <rect x="60" y="348" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" font-size="13" fill="#2d5a22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">dp[3][2] + dp[3][3] = 1 + 1 = 2 ✓（dp[3][1] 段 "7" 前段只能是 "32" → 0）</text>

  <rect x="60" y="390" width="440" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" font-size="11.5" fill="#8a3a34" text-anchor="middle" filter="url(#rough2)">对照：num = "094" 与 "0" 因首字符为 0 → 答案 0</text>
</svg>
