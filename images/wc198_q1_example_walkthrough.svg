<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fdfcf7"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：b = 9, e = 3 —— 逐轮「喝光 → 兑换」</text>
  <path d="M 130 42 Q 360 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== round 1 ===== -->
  <g filter="url(#sk)">
    <rect x="22" y="86" width="60" height="36" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="52" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" filter="url(#sk)">第 1 轮</text>

  <g filter="url(#sk)">
    <rect x="96" y="76" width="130" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" transform="translate(112,86)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" transform="translate(128,86)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" transform="translate(144,86)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="178" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">×9</text>
  <text x="161" y="124" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">喝掉满水 9 瓶</text>

  <path d="M 228 104 L 246 104" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="76" width="84" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="292" y="95" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">累计喝</text>
  <text x="292" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e24" filter="url(#sk)">9</text>

  <path d="M 336 104 L 354 104" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="358" y="76" width="140" height="56" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <g filter="url(#sk)" transform="translate(376,86)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <g filter="url(#sk)" transform="translate(392,86)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <g filter="url(#sk)" transform="translate(408,86)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <text x="442" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#sk)">×9</text>
  <text x="428" y="124" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#sk)">空瓶 9 个</text>

  <path d="M 500 104 L 518 104" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="522" y="76" width="178" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="611" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">9 ÷ 3 = 3</text>
  <text x="611" y="120" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">换回 3 瓶满水，剩 0 空</text>

  <path d="M 611 136 C 611 160, 161 150, 161 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="386" y="154" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">新满水 3 瓶 →</text>

  <!-- ===== round 2 ===== -->
  <g filter="url(#sk)">
    <rect x="22" y="184" width="60" height="36" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="52" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" filter="url(#sk)">第 2 轮</text>

  <g filter="url(#sk)">
    <rect x="96" y="174" width="130" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" transform="translate(120,184)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" transform="translate(136,184)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" transform="translate(152,184)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="161" y="222" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">喝掉满水 3 瓶</text>

  <path d="M 228 202 L 246 202" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="174" width="84" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="292" y="193" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">累计喝</text>
  <text x="292" y="218" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e24" filter="url(#sk)">12</text>

  <path d="M 336 202 L 354 202" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="358" y="174" width="140" height="56" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <g filter="url(#sk)" transform="translate(384,184)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <g filter="url(#sk)" transform="translate(400,184)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <g filter="url(#sk)" transform="translate(416,184)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <text x="428" y="222" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#sk)">空瓶 3 个</text>

  <path d="M 500 202 L 518 202" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="522" y="174" width="178" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="611" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">3 ÷ 3 = 1</text>
  <text x="611" y="218" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">换回 1 瓶满水，剩 0 空</text>

  <path d="M 611 234 C 611 258, 161 248, 161 270" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="386" y="252" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">新满水 1 瓶 →</text>

  <!-- ===== round 3 ===== -->
  <g filter="url(#sk)">
    <rect x="22" y="282" width="60" height="36" rx="18" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="52" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" filter="url(#sk)">第 3 轮</text>

  <g filter="url(#sk)">
    <rect x="96" y="272" width="130" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" transform="translate(136,282)">
    <rect x="2.5" y="0" width="5" height="5" fill="#446688"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="161" y="320" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">喝掉满水 1 瓶</text>

  <path d="M 228 300 L 246 300" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="272" width="84" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="292" y="291" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">累计喝</text>
  <text x="292" y="316" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e24" filter="url(#sk)">13</text>

  <path d="M 336 300 L 354 300" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="358" y="272" width="140" height="56" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <g filter="url(#sk)" transform="translate(416,282)">
    <rect x="2.5" y="0" width="5" height="5" fill="none" stroke="#999999" stroke-width="1"/>
    <rect x="0" y="5" width="10" height="16" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <text x="428" y="320" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#sk)">空瓶 1 个</text>

  <path d="M 500 300 L 518 300" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="522" y="272" width="178" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="611" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">1 &lt; 3 → 换 0 瓶</text>
  <text x="611" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">保底空瓶留 1 个，停止</text>

  <!-- ===== result ===== -->
  <g filter="url(#sk)">
    <rect x="22" y="364" width="678" height="84" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="360" y="398" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#sk)">答案 = 9 + 3 + 1 = 13 瓶</text>
  <text x="360" y="428" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">公式验证：ans = 9 + ⌊(9−1)/(3−1)⌋ = 9 + 4 = 13 ✓</text>
</svg>
