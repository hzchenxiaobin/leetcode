<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="126" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">一次合并 = A×B 全部互为间接好友（以示例 3 的请求 (3,4) 为例）</text>
  <path d="M 120 38 Q 320 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 分量 A / B 虚线区域 -->
  <g filter="url(#sk)"><rect x="70" y="105" width="112" height="172" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" stroke-dasharray="7 5" fill-opacity="0.35"/></g>
  <text x="126" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a8edb">分量 A（0、4 所在）</text>
  <g filter="url(#sk)"><rect x="458" y="105" width="112" height="172" rx="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="7 5" fill-opacity="0.4"/></g>
  <text x="514" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c98a2b">分量 B（1、3 所在）</text>

  <!-- 节点 -->
  <g filter="url(#sk)"><circle cx="125" cy="140" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="125" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><circle cx="125" cy="240" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="125" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><circle cx="515" cy="140" r="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="515" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><circle cx="515" cy="240" r="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="515" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">3</text>

  <!-- 已有好友边 -->
  <path d="M 125 157 L 125 223" stroke="#4a8edb" stroke-width="2.4" filter="url(#sk)"/>
  <text x="138" y="196" font-size="10" fill="#4a8edb">已是好友</text>
  <path d="M 515 157 L 515 223" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <text x="528" y="196" font-size="10" fill="#c98a2b">已是好友</text>

  <!-- 限制 (0,1)：横跨两侧 -->
  <path d="M 142 140 L 498 140" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="320" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">限制 [0,1]</text>
  <g filter="url(#sk)"><circle cx="320" cy="140" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>

  <!-- 待决请求 (3,4) -->
  <path d="M 142 240 L 498 240" stroke="#555" stroke-width="2.2" stroke-dasharray="8 5" filter="url(#sk)"/>
  <text x="320" y="262" text-anchor="middle" font-size="11.5" fill="#555">请求 (3,4)：要不要合并 A、B？</text>

  <!-- 若合并：0 与 1 间接好友（顶部红弧） -->
  <path d="M 136 126 C 230 74, 410 74, 504 126" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">若合并：0 ⋯ 4—新边—3 ⋯ 1 连通 ⇒ 0、1 互为间接好友</text>

  <!-- 底部观察框 -->
  <g filter="url(#sk)"><rect x="48" y="336" width="544" height="124" rx="10" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#7a5415"><tspan font-weight="bold">观察一（间接好友 = 同一分量）</tspan>：好友是连通关系，find 同根即好友</text>
  <text x="320" y="384" text-anchor="middle" font-size="11.5" fill="#7a5415"><tspan font-weight="bold">观察二（合并的连锁效应）</tspan>：新边 (u,v) 让任意 a∈A、b∈B 全部互为间接好友</text>
  <text x="320" y="410" text-anchor="middle" font-size="11.5" fill="#7a5415"><tspan font-weight="bold">判据</tspan>：请求成功 ⟺ 没有任何限制 (x,y) 恰好横跨 A、B 两侧</text>
  <text x="320" y="432" text-anchor="middle" font-size="11.5" fill="#7a5415"><tspan font-weight="bold">单调性</tspan>：好友只增不减 ⇒ 分量只合不分 ⇒ 每条请求只需当下判定一次</text>
</svg>
