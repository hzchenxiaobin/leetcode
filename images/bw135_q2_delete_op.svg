<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">一次操作：删掉左右最近的同字母各一个</text>

  <!-- 原串 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="70" y="56" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="92" y="84" fill="#b85450">b</text>
    <rect x="120" y="56" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="142" y="84" fill="#333">a</text>
    <rect x="170" y="56" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6"/>
    <text x="192" y="84" fill="#a06c10">b</text>
    <rect x="220" y="56" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="242" y="84" fill="#333">a</text>
    <rect x="270" y="56" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="292" y="84" fill="#b85450">b</text>
    <rect x="320" y="56" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="342" y="84" fill="#333">c</text>
    <rect x="370" y="56" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="392" y="84" fill="#333">d</text>
    <rect x="420" y="56" width="44" height="44" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="442" y="84" fill="#333">e</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#777" text-anchor="middle">
    <text x="92" y="118">0</text><text x="142" y="118">1</text><text x="192" y="118">2</text>
    <text x="242" y="118">3</text><text x="292" y="118">4</text><text x="342" y="118">5</text>
    <text x="392" y="118">6</text><text x="442" y="118">7</text>
  </g>

  <!-- 选择 i=2 -->
  <g filter="url(#rough2)" font-size="12">
    <path d="M 192 128 L 192 146" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="204" y="146" fill="#a06c10">选择 i = 2（s[i] = b），左右最近的 b 在 0 与 4</text>
    <path d="M 120 70 C 116 104, 130 104, 138 90" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
    <path d="M 292 70 C 306 108, 190 108, 178 92" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="50" y="196" font-size="12" fill="#446688" text-anchor="start">删除后：</text>
    <rect x="130" y="176" width="44" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="152" y="202" fill="#333">a</text>
    <rect x="180" y="176" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="202" y="202" fill="#a06c10">b</text>
    <rect x="230" y="176" width="44" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="252" y="202" fill="#333">a</text>
    <rect x="280" y="176" width="44" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="302" y="202" fill="#333">c</text>
    <rect x="330" y="176" width="44" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="352" y="202" fill="#333">d</text>
    <rect x="380" y="176" width="44" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="402" y="202" fill="#333">e</text>
    <text x="452" y="202" font-size="12" fill="#666" text-anchor="start">长度 8 → 6</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="240" width="500" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="56" y="264" fill="#2d5a22">关键性质：每次操作让「被选中字母」的计数恰好减 2，其它字母计数不变</text>
    <text x="56" y="288" fill="#2d5a22">⇒ 每个字母的计数奇偶性是不变量；只要某字母计数 ≥ 3，就一定能再操作一次</text>
    <text x="56" y="310" fill="#666">⇒ 最终每个字母都 ≤ 2 个，答案只由各字母的出现次数决定，与顺序无关</text>
  </g>
</svg>
