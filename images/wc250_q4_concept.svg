<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：离线挂载 + DFS 回溯，Trie 恒等于「根到当前节点的路径」</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="150" y="70" text-anchor="middle" font-size="13" fill="#2b5d8e" font-weight="bold">树（示例 2）与查询挂载</text>
  <g filter="url(#sk)" stroke="#b0b0a8" stroke-width="1.4">
    <path d="M 150 92 L 95 138" fill="none"/>
    <path d="M 150 92 L 215 138" fill="none"/>
    <path d="M 95 138 L 95 184" fill="none" stroke="#b85450" stroke-width="2.6"/>
    <path d="M 95 184 L 55 232" fill="none" stroke="#b85450" stroke-width="2.6"/>
    <path d="M 95 184 L 140 232" fill="none"/>
    <path d="M 215 138 L 180 184" fill="none"/>
    <path d="M 215 138 L 252 184" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="150" cy="88" rx="22" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="95" cy="138" rx="20" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="215" cy="138" rx="18" ry="15" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.4"/>
    <ellipse cx="95" cy="182" rx="22" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="55" cy="232" rx="20" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <ellipse cx="140" cy="232" rx="18" ry="15" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.4"/>
    <ellipse cx="180" cy="182" rx="18" ry="15" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.4"/>
    <ellipse cx="252" cy="182" rx="18" ry="15" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="150" y="93" fill="#b85450" font-weight="bold">2</text>
    <text x="95" y="143" fill="#b85450" font-weight="bold">3</text>
    <text x="215" y="143" fill="#999">7</text>
    <text x="95" y="187" fill="#b85450" font-weight="bold">0</text>
    <text x="55" y="237" fill="#d6a040" font-weight="bold">4</text>
    <text x="140" y="237" fill="#999">6</text>
    <text x="180" y="187" fill="#999">1</text>
    <text x="252" y="187" fill="#999">5</text>
  </g>
  <g filter="url(#sk)">
    <rect x="8" y="262" width="92" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="52" y="218" width="86" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="150" y="244" width="86" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="54" y="279" text-anchor="middle" font-size="11" fill="#a07818">q0=[4,6]</text>
  <text x="95" y="235" text-anchor="middle" font-size="11" fill="#a07818">q2=[0,5]</text>
  <text x="193" y="261" text-anchor="middle" font-size="11" fill="#a07818">q1=[1,15]</text>
  <text x="150" y="330" text-anchor="middle" font-size="11.5" fill="#888">红色路径 = DFS 当前位置 u = 4 的根路径</text>
  <text x="150" y="350" text-anchor="middle" font-size="11.5" fill="#888">灰色节点：未进入 / 已退出的兄弟分支，均不在 Trie</text>
  <text x="150" y="370" text-anchor="middle" font-size="11.5" fill="#888">橙色标签：挂载到节点上的离线查询</text>

  <path d="M 310 170 Q 330 170 348 172" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <g filter="url(#sk)">
    <rect x="352" y="82" width="272" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="488" y="110" text-anchor="middle" font-size="13.5" fill="#2b5d8e" font-weight="bold">当前 Trie（多重集）</text>
  <g filter="url(#sk)">
    <rect x="376" y="126" width="46" height="28" rx="6" fill="#fdfcf7" stroke="#b85450" stroke-width="2"/>
    <rect x="428" y="126" width="46" height="28" rx="6" fill="#fdfcf7" stroke="#b85450" stroke-width="2"/>
    <rect x="480" y="126" width="46" height="28" rx="6" fill="#fdfcf7" stroke="#b85450" stroke-width="2"/>
    <rect x="532" y="126" width="46" height="28" rx="6" fill="#fdfcf7" stroke="#b85450" stroke-width="2"/>
    <rect x="392" y="170" width="42" height="26" rx="6" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.2"/>
    <rect x="440" y="170" width="42" height="26" rx="6" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.2"/>
    <rect x="488" y="170" width="42" height="26" rx="6" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.2"/>
    <rect x="536" y="170" width="42" height="26" rx="6" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="399" y="145" fill="#b85450">2</text>
    <text x="451" y="145" fill="#b85450">3</text>
    <text x="503" y="145" fill="#b85450">0</text>
    <text x="555" y="145" fill="#b85450">4</text>
    <text x="413" y="188" fill="#999">7</text>
    <text x="461" y="188" fill="#999">1</text>
    <text x="509" y="188" fill="#999">5</text>
    <text x="557" y="188" fill="#999">6</text>
  </g>
  <text x="488" y="222" text-anchor="middle" font-size="11" fill="#888">灰芯片：其他分支的值，此刻不在集合里</text>

  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="1.6">
    <path d="M 404 244 L 424 244" marker-end="url(#ar)"/>
    <path d="M 560 268 L 540 268" marker-end="url(#ar)"/>
  </g>
  <text x="430" y="249" font-size="12" fill="#2f5d2f" font-weight="bold">enter u ⇒ insert(u)（值 u 入 Trie）</text>
  <text x="386" y="273" font-size="12" fill="#b85450" font-weight="bold">exit u ⇒ remove(u)（值 u 出 Trie）</text>
  <text x="386" y="300" font-size="12" fill="#2b5d8e" font-weight="bold">u 的查询在 enter u 后立刻回答：</text>
  <text x="386" y="318" font-size="11.5" fill="#2b5d8e">q0 = [4,6] → max(6⊕4, 6⊕0, 6⊕3, 6⊕2) = 6</text>

  <g filter="url(#sk)">
    <rect x="60" y="394" width="520" height="26" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#2f5d2f" font-weight="bold">Trie ≡ { root → 当前节点 的全部基因值 }：一条活跃路径，进出各一次，永不串味</text>
</svg>
