<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一个判空分支 + 前三个元素取中位数</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="150" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="115" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">nums（互异）</text>
  <text x="115" y="103" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#sk)">n = len(nums)</text>

  <!-- arrow to diamond -->
  <path d="M 190 89 L 212 89" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="285,54 355,89 285,124 215,89" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="285" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">n &lt; 3 ?</text>

  <!-- No branch -->
  <path d="M 355 89 L 392 89" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="373" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="395" y="63" width="205" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="497" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">取前三个互异元素</text>
  <text x="497" y="103" text-anchor="middle" font-size="11" fill="#446688" font-family="monospace" filter="url(#sk)">a, b, c = nums[0..2]</text>

  <path d="M 497 115 L 497 144" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="395" y="148" width="205" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="497" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">三次比较换序</text>
  <text x="497" y="189" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-family="monospace" filter="url(#sk)">使 a ≤ b ≤ c，b 为中位数</text>

  <path d="M 497 204 L 497 232" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="395" y="236" width="205" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="497" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">return b</text>
  <text x="497" y="274" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">既非最小也非最大 ✓</text>

  <!-- Yes branch -->
  <path d="M 285 124 L 285 152" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="293" y="142" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">是（n ≤ 2）</text>
  <g filter="url(#sk)">
    <rect x="195" y="156" width="180" height="68" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="285" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#sk)">return -1</text>
  <text x="285" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">n=1：既是 min 又是 max</text>
  <text x="285" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">n=2：一个 min 一个 max</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="560" height="44" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">全程只读前三个元素，不排序整个数组</text>
  <text x="320" y="335" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">时间 O(1)、空间 O(1)；n ≥ 3 时答案必存在（见题解第 5 节证明）</text>
</svg>
