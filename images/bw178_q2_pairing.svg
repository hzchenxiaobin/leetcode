<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="386" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">第二步：排序后首尾配对（最小配最大）</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">prefixGcd 排序为 [2,3,6,8]，两对分别是 (2,8) 与 (3,6)</text>
  <rect x="96" y="84" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131.0" y="108.68" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="131" y="140" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">下标 0</text>
  <rect x="188" y="84" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223.0" y="108.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="223" y="140" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">下标 1</text>
  <rect x="280" y="84" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315.0" y="108.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="315" y="140" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">下标 2</text>
  <rect x="372" y="84" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407.0" y="108.68" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="407" y="140" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">下标 3</text>
  <text x="131" y="72" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最小</text>
  <text x="269" y="72" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">次小</text>
  <text x="361" y="72" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">次大</text>
  <text x="407" y="72" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最大</text>
  <rect x="36" y="158" width="488" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="183" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">第 1 对（最小 + 最大）：2 与 8</text>
  <text x="360" y="183" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">gcd = 2</text>
  <rect x="36" y="204" width="488" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="229" text-anchor="start" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 2 对（次小 + 次大）：3 与 6</text>
  <text x="360" y="229" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">gcd = 3</text>
  <rect x="36" y="252" width="488" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="272" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">配对规则</text>
  <text x="48" y="290" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">排序后反复取「最小的未配对」与「最大的未配对」组成一对；n 为奇数时正中间那个落单、忽略</text>
  <rect x="36" y="314" width="236" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="154" y="336" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">贡献 2</text>
  <rect x="288" y="314" width="236" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="406" y="336" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">贡献 3</text>
  <text x="280" y="372" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">总和 = 2 + 3 = 5</text>
</svg>
