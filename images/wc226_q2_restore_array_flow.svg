<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="540" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：建邻接表 → 找端点 → prev/curr 沿链迭代</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- return pill -->
  <g filter="url(#sk)"><rect x="500" y="56" width="120" height="34" rx="17" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="560" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06b1a">return ans</text>

  <!-- A -->
  <g filter="url(#sk)"><rect x="140" y="50" width="330" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="305" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">建邻接表：每对 [u,v]，adj[u]←v 且 adj[v]←u</text>
  <path d="M 305 84 L 305 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B -->
  <g filter="url(#sk)"><rect x="140" y="104" width="330" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="305" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">扫描 adj：找到只有 1 个邻居的元素 s（端点）</text>
  <path d="M 305 138 L 305 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C -->
  <g filter="url(#sk)"><rect x="140" y="158" width="330" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="305" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">初始化：prev = 哨兵（值域外的数，如 INT_MIN）</text>
  <text x="305" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">curr = s，ans = [ ]</text>
  <path d="M 305 206 L 305 222" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D: decision -->
  <g filter="url(#sk)"><path d="M 305 226 L 415 264 L 305 302 L 195 264 Z" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="305" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans 里已收集</text>
  <text x="305" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">满 n 个元素？</text>
  <path d="M 415 264 L 560 264 L 560 94" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="436" y="256" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 305 302 L 305 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="313" y="314" font-size="11" fill="#888">否</text>

  <!-- E -->
  <g filter="url(#sk)"><rect x="120" y="322" width="380" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="310" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">ans.append(curr)</text>
  <text x="310" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">在 adj[curr] 中找 ≠ prev 的邻居 next</text>
  <path d="M 310 370 L 310 386" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- F -->
  <g filter="url(#sk)"><rect x="120" y="390" width="380" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="310" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5d85">prev = curr；curr = next</text>
  <path d="M 120 407 L 55 407 L 55 264 L 188 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- footer -->
  <g filter="url(#sk)"><rect x="40" y="456" width="560" height="66" rx="8" fill="#fdf6e8" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="320" y="478" text-anchor="middle" font-size="11" fill="#8a6a1a">内部节点恰有 2 个邻居：prev 记住来路，next 唯一确定 → 无需 visited</text>
  <text x="320" y="495" text-anchor="middle" font-size="11" fill="#8a6a1a">起点的唯一邻居 ≠ 哨兵、末端挑不到新邻居，都由同一句「找 ≠ prev」统一处理</text>
  <text x="320" y="512" text-anchor="middle" font-size="11" fill="#8a6a1a">迭代代替递归：链长可达 10⁵，递归深度 10⁵ 会爆栈（Python 上限 1000 层）</text>
</svg>
