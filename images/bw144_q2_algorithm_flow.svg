<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：先预计算 26×26 代价表，再逐位累加</text>

  <rect x="40" y="58" width="196" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="84" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举全部 (a, b)</text>
  <text x="138" y="104" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">两个方向各累加 ≤ 25 步</text>
  <text x="138" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(26³) ≈ 1.7×10⁴ 次加法</text>

  <path d="M 138 134 L 138 158" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="160" width="196" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cost[a][b] = min(up, down)</text>
  <text x="138" y="204" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(26²) 的表</text>

  <path d="M 240 191 L 300 191" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="304" y="140" width="216" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="166" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">逐位累加 ans += cost[s[i]][t[i]]</text>
  <text x="412" y="188" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">O(n)，累加用 long long</text>

  <path d="M 412 212 L 412 236" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="304" y="238" width="216" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <text x="280" y="306" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">总时间 O(26³ + n) = O(n)，空间 O(26²)</text>
</svg>
