<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：dp 数组走查（示例 2，答案 9）</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== column indices ===== -->
  <text x="118" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">i=0</text>
  <text x="210" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">1</text>
  <text x="302" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">2</text>
  <text x="394" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">3</text>
  <text x="486" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">4</text>
  <text x="578" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">5</text>
  <text x="670" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">6</text>
  <text x="762" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">7</text>
  <text x="854" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">8</text>

  <!-- ===== source row ===== -->
  <text x="66" y="102" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">source</text>
  <g filter="url(#sk)"><rect x="76" y="78" width="84" height="38" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.2"/></g>
  <text x="118" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="168" y="78" width="84" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="210" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="260" y="78" width="84" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="302" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="352" y="78" width="84" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="394" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><rect x="444" y="78" width="84" height="38" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.2"/></g>
  <text x="486" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="536" y="78" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="578" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">f</text>
  <g filter="url(#sk)"><rect x="628" y="78" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="670" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">g</text>
  <g filter="url(#sk)"><rect x="720" y="78" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="762" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><rect x="812" y="78" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="854" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>

  <!-- ===== target row ===== -->
  <text x="66" y="146" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">target</text>
  <g filter="url(#sk)"><rect x="76" y="122" width="84" height="38" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.2"/></g>
  <text x="118" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="168" y="122" width="84" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="210" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="260" y="122" width="84" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="302" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><rect x="352" y="122" width="84" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="394" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="444" y="122" width="84" height="38" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.2"/></g>
  <text x="486" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="536" y="122" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="578" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">g</text>
  <g filter="url(#sk)"><rect x="628" y="122" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="670" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><rect x="720" y="122" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="762" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><rect x="812" y="122" width="84" height="38" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="854" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>

  <!-- ===== dp row ===== -->
  <text x="66" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">dp</text>
  <g filter="url(#sk)"><rect x="76" y="172" width="84" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="118" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="168" y="172" width="84" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="210" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="260" y="172" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="302" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="352" y="172" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="394" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="444" y="172" width="84" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="486" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="536" y="172" width="84" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="578" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="628" y="172" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="670" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="720" y="172" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="762" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="812" y="172" width="84" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g>
  <text x="854" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">9</text>

  <!-- ===== transitions ===== -->
  <path d="M 118 240 L 206 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="164" y="230" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">① a==a 自由位 +0</text>

  <path d="M 210 262 Q 348 306 482 262" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 区间 [1,3]：bcd → cde，dist = 1</text>

  <path d="M 486 240 L 574 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="532" y="230" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">③ e==e 自由位 +0</text>

  <path d="M 578 262 Q 716 306 850 262" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="716" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">④ 区间 [5,7]：fgh→thh→ghh，dist = 8</text>

  <text x="470" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">图例：蓝 = 自由位可达　绿 = 区间跳转抵达　粉 = 不可达（该位必须被区间整体覆盖）</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="372" width="828" height="188" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="396" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">逐位读图</text>
  <text x="76" y="420" font-size="11" fill="#444" filter="url(#sk)">· dp[2]、dp[3] 不可达：位置 1 处 b≠c，不能自由通过，必须被一条从 1 出发的区间整体覆盖；</text>
  <text x="76" y="442" font-size="11" fill="#444" filter="url(#sk)">  从 1 出发唯一可行的区间是 [1,3]（bcd 与 cde 都在 Trie 终点），它直接把 dp[1]=0 跳到 dp[4]=1。</text>
  <text x="76" y="464" font-size="11" fill="#444" filter="url(#sk)">· dp[5] = dp[4]：位置 4 处 e==e，白捡一位自由步。dp[6]、dp[7] 与 dp[2]、dp[3] 同理不可达。</text>
  <text x="76" y="486" font-size="11" fill="#444" filter="url(#sk)">· dp[8] = dp[5] + dist[fgh][ghh] = 1 + 8 = 9，其中 8 = fgh→thh(3) + thh→ghh(5)。</text>
  <text x="76" y="508" font-size="11" fill="#444" filter="url(#sk)">  示例解释里那两次「下标完全相同」的操作，在 dp 里被合并成一次最短路查询 —— 链的成本交给 Floyd。</text>
  <text x="76" y="530" font-size="11" fill="#444" filter="url(#sk)">· 对比示例 3：source="abcdefgh" → target="addddddd"，区间 [1,3] 与 [3,7] 共用下标 3，二者不相交也不相同，</text>
  <text x="76" y="552" font-size="11" fill="#444" filter="url(#sk)">  只能取其一 —— dp 里 dp[4] 与 dp[3,7] 无法同时成立，最终 dp[8] = ∞，返回 −1。</text>
</svg>
