<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：建筛 → 单向累加扫描</text>

  <!-- start -->
  <rect x="155" y="44" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 n</text>
  <path d="M 200 74 L 200 90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: n < 2 ? -->
  <polygon points="200,92 272,124 200,156 128,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="129" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n &lt; 2 ?</text>
  <path d="M 272 124 L 326 124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="330" y="108" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="129" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 0</text>
  <path d="M 200 156 L 200 176" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="172" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- sieve -->
  <rect x="105" y="180" width="190" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">埃氏筛标记 comp[2..n]</text>
  <text x="200" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收集质数列表 primes</text>
  <path d="M 200 226 L 200 242" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="135" y="246" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s ← 0，ans ← 0</text>
  <path d="M 200 276 L 200 292" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- accumulate -->
  <rect x="105" y="296" width="190" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一质数 p</text>
  <text x="200" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s ← s + p</text>
  <path d="M 200 342 L 200 356" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2: s > n ? -->
  <polygon points="200,358 272,390 200,422 128,390" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="395" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s &gt; n ?</text>
  <path d="M 272 390 L 326 390" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="382" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="330" y="374" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="395" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
  <path d="M 200 422 L 200 442" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="438" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- diamond 3: composite? -->
  <polygon points="200,444 272,476 200,508 128,476" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="481" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">comp[s] 为真?</text>
  <path d="M 272 476 L 326 476" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="297" y="468" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="330" y="460" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="481" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← s</text>

  <!-- loop back right: after ans update -->
  <path d="M 440 476 C 470 476, 480 460, 480 420 L 480 319 C 480 305, 460 305, 297 307" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="390" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(90 488 390)" filter="url(#rough2)">继续累加</text>

  <!-- loop back left: composite skip -->
  <path d="M 200 508 L 200 524 L 70 524 C 58 524, 58 512, 58 500 L 58 331 C 58 317, 74 317, 99 319" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="540" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是（合数，跳过）</text>
</svg>
