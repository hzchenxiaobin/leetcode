<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="340" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">二分答案：候选值取全部点对距离</text>
  <text x="290" y="68" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1 的候选 {0, 2, 4}（另加占位 0）：P 全为真 → 答案 4</text>
  <rect x="90" y="100" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">D = 0</text>
  <text x="130" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">P 真</text>
  <rect x="200" y="100" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">D = 1</text>
  <text x="240" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">P 真</text>
  <rect x="310" y="100" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="350" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">D = 2</text>
  <text x="350" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">P 真</text>
  <rect x="420" y="100" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">D = 4</text>
  <text x="460" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">P 真</text>
  <rect x="60" y="190" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="217" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">二分：找最后一个 P(D) 为真的候选值</text>
  <rect x="60" y="246" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="270" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">为什么答案一定在候选里：因子 = 组内最小距离 = 某对点之间的距离</text>
  <text x="78" y="292" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">（否则把它调大一点仍可行，与最优性矛盾）</text>
</svg>
