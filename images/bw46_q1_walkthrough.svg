<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">枚举演算：s = "YazaAay"</text>

  <!-- 字符串格子 -->
  <g font-size="15" fill="#333">
    <rect x="90" y="54" width="46" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="136" y="54" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="182" y="54" width="46" height="46" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="228" y="54" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="274" y="54" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="320" y="54" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="366" y="54" width="46" height="46" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="113" y="84" text-anchor="middle" filter="url(#rough2)">Y</text>
    <text x="159" y="84" text-anchor="middle" filter="url(#rough2)">a</text>
    <text x="205" y="84" text-anchor="middle" filter="url(#rough2)">z</text>
    <text x="251" y="84" text-anchor="middle" filter="url(#rough2)">a</text>
    <text x="297" y="84" text-anchor="middle" filter="url(#rough2)">A</text>
    <text x="343" y="84" text-anchor="middle" filter="url(#rough2)">a</text>
    <text x="389" y="84" text-anchor="middle" filter="url(#rough2)">y</text>
    <text x="113" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
    <text x="159" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
    <text x="205" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
    <text x="251" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
    <text x="297" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
    <text x="343" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
    <text x="389" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  </g>
  <text x="432" y="84" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">← s[1..3] = "aAa"</text>

  <!-- 演算说明 -->
  <rect x="40" y="140" width="440" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">i = 0 扩到 j = 6（整串）：lower = {a, y, z}，upper = {a, y}</text>
  <text x="260" y="181" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">z 只有小写形式 → 掩码不等，整串不是美好子串</text>

  <rect x="40" y="204" width="440" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">i = 1 扩到 j = 3：lower = {a}，upper = {A}，按字母对齐后相等</text>
  <text x="260" y="245" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">长度 3 &gt; best=0，更新 best = 3, pos = 1</text>

  <rect x="40" y="268" width="440" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">此后再无长度 &gt; 3 的美好子串；</text>
  <text x="260" y="304" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">只在「严格更长」时更新 → 并列时保留最早出现的</text>

  <path d="M260,312 L260,328" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="330" width="180" height="28" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出 "aAa"（长度 3）</text>
</svg>
