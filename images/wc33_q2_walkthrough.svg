<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">三组官方示例的距离谱走查</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">先算 6 个平方距离，再排序，最后按位置读条件——顺序完全不影响结果</text>

  <rect x="40" y="62" width="560" height="238" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6"
        filter="url(#rough2)"/>
  <rect x="40" y="62" width="560" height="34" fill="#e8f0fe" stroke="#999" stroke-width="1.2" rx="6"
        filter="url(#rough2)"/>
  <text x="76" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">示例</text>
  <text x="118" y="84" font-size="11" fill="#3a4a66" filter="url(#rough2)">6 个平方距离 → 升序 → 条件判定</text>

  <path d="M 112 62 L 112 300" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 96 L 600 96" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 164 L 600 164" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 232 L 600 232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="76" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">例 1</text>
  <text x="118" y="120" font-size="10.5" fill="#444" filter="url(#rough2)">p = (0,0) (1,1) (1,0) (0,1)　　 d = 2, 1, 1, 1, 2, 1</text>
  <text x="118" y="146" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">排序 [1,1,1,1,2,2] ⇒ d0=1&gt;0，前四相等，2·d0=2=d4=d5 ⇒ true</text>

  <text x="76" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">例 2</text>
  <text x="118" y="188" font-size="10.5" fill="#444" filter="url(#rough2)">p = (0,0) (1,1) (1,0) (0,12)　 d = 2, 1, 144, 1, 122, 145</text>
  <text x="118" y="214" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">排序 [1,1,2,122,144,145] ⇒ d2=2 ≠ d1=1，第二条条件就失败 ⇒ false</text>

  <text x="76" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">例 3</text>
  <text x="118" y="256" font-size="10.5" fill="#444" filter="url(#rough2)">p = (1,0) (−1,0) (0,1) (0,−1)　 d = 4, 2, 2, 2, 2, 2</text>
  <text x="118" y="282" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">排序 [2,2,2,2,4,4] ⇒ d0=2&gt;0，前四相等，2·d0=4=d4=d5 ⇒ true</text>

  <rect x="40" y="314" width="560" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"
        filter="url(#rough2)"/>
  <text x="56" y="336" font-size="10" fill="#8a6a20" font-weight="bold">两个必须记住的 false 反例：</text>
  <text x="56" y="356" font-size="10" fill="#555">矩形 1×2 → [1,1,4,4,5,5]：前 4 小不全相等（比例不是 1:2）</text>
  <text x="56" y="372" font-size="10" fill="#555">菱形 (0,0)(3,4)(0,8)(−3,4) → [25,25,25,25,36,64]：四边等长但 2·d0=50 ≠ 36</text>
</svg>
