<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [5, 14, 3, 1, 2]</text>
  <path d="M 160 42 Q 330 50 500 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">离散化 sorted = [1,2,3,5,14]，rank：1→1、2→2、3→3、5→4、14→5</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="78" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="78" width="84" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="78" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="288" y="78" width="104" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="392" y="78" width="148" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="540" y="78" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">操作</text>
  <text x="142" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">x（名次 r）</text>
  <text x="236" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">c₁ = len₁−q₁(r)</text>
  <text x="340" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">c₂ = len₂−q₂(r)</text>
  <text x="466" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">判定</text>
  <text x="575" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">去向</text>

  <!-- 第 1 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="108" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="108" width="84" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="184" y="108" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="288" y="108" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="392" y="108" width="148" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="108" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="70" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">①</text>
  <text x="142" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5（r=4）</text>
  <text x="236" y="129" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="340" y="129" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="466" y="129" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 1 次规定</text>
  <text x="575" y="129" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">arr1</text>

  <!-- 第 2 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="142" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="142" width="84" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="184" y="142" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="288" y="142" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="392" y="142" width="148" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="142" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="70" y="163" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">②</text>
  <text x="142" y="163" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">14（r=5）</text>
  <text x="236" y="163" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="340" y="163" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="466" y="163" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 2 次规定</text>
  <text x="575" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">arr2</text>

  <!-- 第 3 行（平局链，高亮） -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="100" y="176" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="184" y="176" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="288" y="176" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="392" y="176" width="148" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="540" y="176" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="70" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③</text>
  <text x="142" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3（r=3）</text>
  <text x="236" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 − 0 = 1</text>
  <text x="340" y="197" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 − 0 = 1</text>
  <text x="466" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1=1，等长 → arr1</text>
  <text x="575" y="197" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">arr1</text>

  <!-- 第 4 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="210" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="210" width="84" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="184" y="210" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="288" y="210" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="392" y="210" width="148" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="210" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="70" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④</text>
  <text x="142" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1（r=1）</text>
  <text x="236" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 − 0 = 2</text>
  <text x="340" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 − 0 = 1</text>
  <text x="466" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 ＞ 1 → arr1</text>
  <text x="575" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">arr1</text>

  <!-- 第 5 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="244" width="60" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="244" width="84" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="184" y="244" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="288" y="244" width="104" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="392" y="244" width="148" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="540" y="244" width="70" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="70" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⑤</text>
  <text x="142" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2（r=2）</text>
  <text x="236" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3 − 1 = 2</text>
  <text x="340" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 − 0 = 1</text>
  <text x="466" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 ＞ 1 → arr1</text>
  <text x="575" y="265" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">arr1</text>

  <!-- 最终 arr1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="296" width="350" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="60" y="316" font-size="11.5" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">arr1（最终）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="326" width="32" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="96" y="326" width="32" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="132" y="326" width="32" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="168" y="326" width="32" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="76" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="112" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="148" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="184" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>

  <!-- 最终 arr2 -->
  <g filter="url(#rough2)">
    <rect x="410" y="296" width="210" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="430" y="316" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">arr2（最终）</text>
  <g filter="url(#rough2)">
    <rect x="430" y="326" width="32" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="446" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">14</text>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="376" width="580" height="48" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="398" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">连接（保持各自插入顺序）</text>
  <text x="330" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">result = arr1 + arr2 = [5, 3, 1, 2, 14]</text>
</svg>
