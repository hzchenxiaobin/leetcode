<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="390" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算:n = 3,rowShift = [1,2,0],colShift = [2,2,1]</text>

  <!-- grid 原始 -->
  <text x="106" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">grid 原始</text>
  <text x="40" y="120" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">行0 左1</text>
  <text x="40" y="156" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">行1 左2</text>
  <text x="40" y="192" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">行2 左0</text>
  <rect x="45" y="96" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="87" y="96" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="129" y="96" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="45" y="132" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="87" y="132" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="129" y="132" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="45" y="168" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="87" y="168" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="129" y="168" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="64" y="222" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列0</text>
  <text x="106" y="222" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列1</text>
  <text x="148" y="222" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列2</text>

  <!-- 箭头1 -->
  <path d="M 176 140 L 270 140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="223" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">每行左移</text>
  <text x="223" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">rowShift[i]</text>

  <!-- tmp -->
  <text x="343" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">tmp 行移位后</text>
  <rect x="280" y="96" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="322" y="96" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="364" y="96" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="280" y="132" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="322" y="132" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="364" y="132" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="280" y="168" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="322" y="168" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="364" y="168" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="299" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">列0 ↑2</text>
  <text x="341" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">列1 ↑2</text>
  <text x="383" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">列2 ↑1</text>

  <!-- 箭头2 -->
  <path d="M 412 140 L 506 140" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="459" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">每列上移</text>
  <text x="459" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colShift[j]</text>

  <!-- ans -->
  <text x="578" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">ans 列移位后</text>
  <rect x="515" y="96" width="38" height="30" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="534" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="557" y="96" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="599" y="96" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="618" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="515" y="132" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="534" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="557" y="132" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="599" y="132" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="618" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="515" y="168" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="534" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="557" y="168" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="599" y="168" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="618" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 底部核对框 -->
  <rect x="45" y="258" width="592" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="286" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">结果:ans = [[7,8,5],[2,3,9],[6,4,1]],与题目输出一致 ✓</text>
  <text x="65" y="312" font-size="11" fill="#555" filter="url(#rough2)">追踪元素 7:grid(2,0) —行2左移 0 位→ tmp(2,0) —列0上移 2 位→ ans(0,0)</text>
  <text x="65" y="338" font-size="11" fill="#555" filter="url(#rough2)">列上移 2 位:列内第 i 行的数搬到第 (i−2+3) % 3 行,7 从第 2 行搬到第 0 行</text>
</svg>
