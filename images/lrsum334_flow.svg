<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="570" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟求总和，一趟滚动作差</text>
  <path d="M 170 44 Q 340 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="200" y="62" width="200" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">求总和 T = Σ nums[i]</text>
  <path d="M 300 104 L 300 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="200" y="126" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="151" text-anchor="middle" font-size="13" fill="#2c4d70" filter="url(#rough2)">leftSum = 0，i = 0</text>
  <path d="M 300 166 L 300 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough)">
    <polygon points="300,192 404,242 300,292 196,242" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="300" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6210" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 404 242 L 464 242" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="433" y="233" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="468" y="218" width="172" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="554" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">返回 answer</text>

  <path d="M 300 292 L 300 314" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="308" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="170" y="318" width="260" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="300" y="347" text-anchor="middle" font-size="13.5" fill="#2e5a24" filter="url(#rough2)">rightSum = T − leftSum − nums[i]</text>
  <path d="M 300 366 L 300 388" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="392" width="260" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="300" y="421" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">answer[i] = |leftSum − rightSum|</text>
  <path d="M 300 440 L 300 462" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="466" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="495" text-anchor="middle" font-size="13.5" fill="#2c4d70" filter="url(#rough2)">leftSum += nums[i]，i += 1</text>

  <path d="M 170 490 L 130 490 L 130 242 L 192 242" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="372" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">回到判断</text>

  <g filter="url(#rough2)">
    <rect x="452" y="316" width="204" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="554" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">⚠ 此刻 leftSum 恰为</text>
  <text x="554" y="355" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">i 左侧之和（不含自己）</text>

  <g filter="url(#rough2)">
    <rect x="452" y="464" width="204" height="52" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="554" y="485" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">先用后加：算完 answer[i]</text>
  <text x="554" y="503" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">再把自己并入左侧和</text>

  <g filter="url(#rough2)">
    <rect x="46" y="530" width="592" height="34" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="342" y="552" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">第一趟求 T、第二趟滚动 leftSum 逐位作差 —— O(n) 时间 / O(1) 额外空间</text>
</svg>
